<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prague Travel Itinerary Guide | Trip Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- SEO & GEO Structured Data -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",

  "name": "Prague Trip Guide",
  "description": "Curated list of must-visit Prague attractions, tickets, guided tours, and day trips.",
  "publisher": {
    "@type": "Organization",

  }
}

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }

<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const MapPin = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        const Ticket = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>;
        const Sun = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
        const TrainFront = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="M9 15h6"/><path d="M14 19.5l3-3-3-3"/><path d="M10 19.5l-3-3 3-3"/><path d="M4 22v-3.5"/><path d="M20 22v-3.5"/><rect width="16" height="16" x="4" y="3" rx="2"/></svg>;
        const ExternalLink = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>;
        const Info = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;
        const Home = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const Sparkles = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;

        const CATEGORIES = [
            { id: 'Sightseeing Passes & Tickets', icon: Ticket },
            { id: 'Walking & Guided Tours', icon: MapPin },
            { id: 'Vltava River Cruises', icon: Sparkles },
            { id: 'Day Trips & Excursions', icon: Sun },
            { id: 'Culture, Shows & Dining', icon: TrainFront }
        ];

        const itineraryData = {
            "Prague Exploration": {
                "Sightseeing Passes & Tickets": [
                    {
                        title: "Prague Visitor Pass",
                        description: "Enjoy free entry to top attractions and public transportation access with a single card.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Prague Castle Tickets & Tours",
                        description: "Explore the world's largest ancient castle complex, featuring St. Vitus Cathedral, Golden Lane, and Old Royal Palace.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Old Town Hall & Astronomical Clock Tower Ticket",
                        description: "Ascend to the top of the tower for panoramic views of Old Town Square and the iconic red roofs.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    }
                ],
                "Walking & Guided Tours": [
                    {
                        title: "Old Town & Charles Bridge Half-Day Walking Tour",
                        description: "Stroll through the Old Town, Jewish Quarter, and Charles Bridge with a professional guide to uncover historical stories.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Prague Medieval Underground & Old Town Tour",
                        description: "Explore the mysterious historical spaces hidden beneath the streets of Prague's Old Town.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Prague Ghosts and Legends Walking Tour",
                        description: "A fun and mysterious evening-only legends guided walking tour.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    }
                ],
                "Vltava River Cruises": [
                    {
                        title: "Prague Vltava River Classic Cruise / 1-Hour River Cruise",
                        description: "Admire the scenic riverside views and castle silhouettes from a unique water perspective.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Prosecco Dinner Cruise / Evening Dinner Cruise",
                        description: "A romantic nighttime cruise combining gourmet dining and breathtaking views.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Devil's Canal Cruise",
                        description: "Explore the unique waterways of Prague's Venice district.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    }
                ],
                "Day Trips & Excursions": [
                    {
                        title: "Český Krumlov (CK Town) Day Trip",
                        description: "Visit the fairytale-like medieval town listed as a UNESCO World Heritage site (includes hotel transfer).",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Kutná Hora Day Trip",
                        description: "Tour the famous Sedlec Ossuary (Bone Church) and St. Barbara's Church.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Karlovy Vary Spa Town Day Trip",
                        description: "Discover Czechia's most iconic spa town and the Diana Lookout Tower.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Terezín Concentration Camp Half-Day History Tour",
                        description: "An educational and historically significant half-day guided tour.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    }
                ],
                "Culture, Shows & Dining": [
                    {
                        title: "Prague Medieval Dinner with Unlimited Drinks",
                        description: "Immerse yourself in medieval music, dancing, and a special themed feast.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Black Light Theater Performance (WOW Show / SRNEC)",
                        description: "Experience Prague's signature visual optical illusion theater production.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Mirror Chapel Classical Concert / St. Nicholas Church",
                        description: "Enjoy high-level classical music performances inside historic architectural landmarks.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    },
                    {
                        title: "Pilsen Urquell: Original Prague Beer Experience",
                        description: "Savor authentic Czech beer and learn about traditional brewing heritage.",
                        link: "https://affiliate.klook.com/redirect?aid=105907&aff_adid=1521499&k_site=https%3A%2F%2Fwww.klook.com%2Fzh-TW%2Fsearch%3Fquery%3DPrague"
                    }
                ]
            }
        };

        const REGIONS = Object.keys(itineraryData);

        function App() {
            const [selectedRegion, setSelectedRegion] = useState(REGIONS[0] || 'Prague Exploration');
            const availableCats = Object.keys(itineraryData[selectedRegion] || {});
            const [selectedCategory, setSelectedCategory] = useState(availableCats[0] || 'Sightseeing Passes & Tickets');

            const currentData = itineraryData[selectedRegion]?.[selectedCategory] || [];

            return (
                <div className="min-h-screen font-sans text-slate-800 flex flex-col">
                    <header className="bg-white shadow-sm sticky top-0 z-10 border-b border-slate-200">
                        <div className="max-w-7xl mx-auto px-4 py-4 md:py-6">
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center gap-2">
                                    <MapPin className="text-blue-600 w-6 h-6 md:w-8 md:h-8" />
                                    <h1 className="text-2xl md:text-3xl lg:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-teal-400">
                                    Prague Attractions & Tours Guide
                                    </h1>
                                </div>
                                <div className="hidden md:block">
                                    <a href="index.html" className="flex items-center gap-1.5 px-5 py-2.5 rounded-full text-sm lg:text-base font-bold bg-blue-600 text-white hover:bg-blue-700 shadow-sm transition-transform active:scale-95">
                                        <Home className="w-4 h-4" /> Home
                                    </a>
                                </div>
                            </div>
                            
                            <div className="flex gap-2 md:gap-3 overflow-x-auto pb-2 scrollbar-hide items-center">
                                <a href="index.html" className="md:hidden flex items-center gap-1.5 whitespace-nowrap px-4 py-2 rounded-full text-sm font-bold bg-blue-600 text-white shadow-sm shrink-0">
                                    <Home className="w-4 h-4" /> Home
                                </a>
                                {REGIONS.map((region) => (
                                    <button
                                        key={region}
                                        onClick={() => {
                                            setSelectedRegion(region);
                                            const newCats = Object.keys(itineraryData[region] || {});
                                            setSelectedCategory(newCats[0]);
                                        }}
                                        className={`whitespace-nowrap px-5 py-2 md:py-2.5 rounded-full text-sm md:text-base font-medium transition-all ${
                                            selectedRegion === region ? 'bg-slate-800 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'
                                        }`}
                                    >
                                        {region}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-8 md:py-10 flex-grow w-full">
                        <div className="flex flex-wrap gap-2 md:gap-3 mb-8 md:mb-10">
                            {availableCats.map((catId) => {
                                const foundCat = CATEGORIES.find(c => c.id === catId) || { icon: Ticket };
                                const IconComp = foundCat.icon;
                                return (
                                    <button
                                        key={catId}
                                        onClick={() => setSelectedCategory(catId)}
                                        className={`flex items-center gap-2 px-5 py-2 md:py-2.5 rounded-lg border text-sm md:text-base font-medium transition-all ${
                                            selectedCategory === catId ? 'border-blue-500 bg-blue-50 text-blue-700 shadow-sm' : 'border-slate-200 bg-white text-slate-600 hover:border-blue-300'
                                        }`}
                                    >
                                        <IconComp className="w-4 h-4 md:w-5 md:h-5" />
                                        {catId}
                                    </button>
                                );
                            })}
                        </div>

                        {currentData.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                                {currentData.map((item, index) => (
                                    <div key={index} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 flex flex-col justify-between hover:shadow-xl transition-all transform hover:-translate-y-1">
                                        <div>
                                            <h3 className="text-xl md:text-2xl font-bold text-slate-800 mb-4 leading-tight">{item.title}</h3>
                                            <p className="text-slate-600 text-sm md:text-base mb-6 leading-relaxed">{item.description}</p>
                                        </div>
                                        <div className="mt-auto pt-5 border-t border-slate-100 flex justify-end">
                                            <a href={item.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-sm w-full">
                                                <Info className="w-4 h-4 md:w-5 md:h-5" />
                                                <span className="md:text-lg">View Details & Book</span>
                                                <ExternalLink className="w-4 h-4 md:w-5 md:h-5 ml-1 opacity-70" />
                                            </a>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-16 text-center flex flex-col items-center justify-center">
                                <Sparkles className="w-10 h-10 text-slate-400 mb-3" />
                                <h3 className="text-lg md:text-xl font-medium text-slate-700">No Data Available</h3>
                            </div>
                        )}

                        {/* More Activities / Klook English Widget Section */}
                        <div className="mt-16 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-10 w-full max-w-5xl mx-auto">
                            <div className="text-center mb-6">
                                <h3 className="text-2xl md:text-3xl font-bold text-slate-800 flex items-center justify-center gap-2">
                                    <Sparkles className="w-7 h-7 text-blue-600" />
                                    Explore More Activities
                                </h3>
                                <p className="text-slate-500 text-base md:text-lg mt-1">Discover more popular local experiences and special offers in Prague</p>
                            </div>
                            
                            {/* Klook Widget Integration */}
                            <div className="w-full flex justify-center">
                                <ins class="klk-aff-widget w-full" data-wid="105907" data-height="340px" data-adid="1521499" data-lang="en-US" data-prod="search_vertical" data-currency="USD">
                                    <a href="//www.klook.com/?aid=105907" target="_blank" rel="noopener noreferrer">Klook.com</a>
                                </ins>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
