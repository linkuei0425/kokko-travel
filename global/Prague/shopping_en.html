ts. It\u2019s an ideal one-stop shop to pick up souvenirs for friends and family.", "name": "Havel\u0027s Market (Havelsk\u00e9 tr\u017ei\u0161t\u011b)", "transport": "Take Metro Line A or B to M\u016fstek Station, then walk about 2 minutes."}, {"address": "Karlova 161/30, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.1 stars | Must-Buy List: Mixed Fruit Gummy Candies, Filled Sour Candy Belts, Pirate Skull Gummies. Located on Karlova Street in Old Town, Captain Candy is a super-popular pirate treasure-themed candy shop. The interior is filled with giant wooden barrels holding hundreds of Czech and traditional European gummies in various shapes, textures, and flavors. Customers can use wooden scoops to fill pirate treasure bags and pay by weight\u2014a fun place to scoop up sweet snacks and enjoy a unique shopping experience.", "name": "Captain Candy Karlova (Captain Candy Karlova)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk about 3 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "n\u00e1m. Republiky 1, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | Must-buy list: Botanicus hand cream, Czech herbal liqueur Becherovka, Manufaktura beer shower gel. This is the largest modern multi-functional shopping center on the edge of Prague\u0027s Old Town. Housed in a former 19th-century military barracks, its pink facade retains a strong sense of historical charm. With five floors above ground and several below, it features over 200 international fashion brands, local Czech cosmetics shops, and a vibrant food court offering diverse global cuisines. Directly connected to the subway station with convenient facilities, it\u0027s the best one-stop spot for souvenirs and daily essentials.", "name": "PALLADIUM Shopping Center (PALLADIUM Prague)", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky Station; direct access right outside the exit."}, {"address": "Zamenhofova 440, 108 00 Praha-\u0160t\u011brboholy, Czechia", "feature": "\u2b50 4.3 stars | Must-buy list: Discounted Karl Lagerfeld bags, tailored Armani suits, limited-edition discounted Nike sneakers. As the most popular outlet center near Prague, it gathers over 200 renowned international brands and European boutique labels, offering great discounts from 30% to 70% year-round. The open ring-shaped layout provides a spacious and comfortable shopping environment. For travelers seeking high-end brands at bargain prices, this is a can\u0027t-miss shopping paradise when visiting Prague.", "name": "Fashion Arena Prague Outlet", "transport": "Take Metro Line A to Depo Hostiva\u0159 Station, then transfer to the free dedicated Outlet shuttle bus."}, {"address": "Na P\u0159\u00edkop\u011b 1096/19, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.1 stars | Must-buy list: Gant European casual wear, exquisite Czech leather accessories, handmade jewelry. This elegant shopping arcade connects Old Town\u0027s bustling Na P\u0159\u00edkop\u011b street with surrounding avenues. Its design cleverly blends modern minimalism with a classic glass skylight ceiling, creating a highly elegant atmosphere. The gallery houses many mid-to-high-end European fashion brands, luxury watchmakers, and stylish accessory shops. Far less crowded than massive malls, it offers a much more relaxed and comfortable shopping experience.", "name": "Myslbek Shopping Gallery", "transport": "Take Metro Line A or B to M\u016fstek Station, then walk for about 3 minutes."}, {"address": "T\u00fdn 3/1049, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | Must-buy list: Rose essential oil luxury handmade soap, Dead Sea mud facial soap, Rose \u0026 Walnut facial scrub. Tucked away in the historic Ungelt courtyard behind Old Town Square, this is the flagship store of Czechia\u0027s iconic pure organic skincare and fragrance brand. The brand insists on traditional handcrafting using herbs and flowers grown on its own organic Czech farms. Filled with rich herbal aromas and a rustic estate charm, the store also has Chinese-speaking staff available, making it a must-visit local flagship where almost every traveler walks out with a bag.", "name": "Botanicus Flagship Store Old Town (Botanicus Ungelt)", "transport": "About a 2-minute walk from behind the Church of Our Lady before T\u00fdn near Old Town Square (Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed)."}, {"address": "Melantrichova 970/17, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | Must-buy list: Czech hop hair care shampoo, wine polyphenol hand cream, traditional handmade wooden toys. This highly famous local Czech lifestyle fragrance and craft brand is deeply beloved by both locals and tourists. The brand specializes in skincare products formulated with traditional Czech brewer\u0027s yeast, wine extracts, and Karlovy Vary thermal spring salt. This Old Town branch features warm, cozy Czech countryside decor, along with a special dedicated area for Czech wooden toys and handicrafts, perfectly combining cultural heritage with practical value.", "name": "Manufaktura Melantrichova", "transport": "About a 3-minute walk along Melantrichova Street from Old Town Square."}, {"address": "Mysl\u00edkova 171/31, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | Must-buy list: Handmade jewelry by local Czech designers, modern Bohemian glass wine cups, original picture book goods. This independent concept store was created specifically to promote emerging local Czech designers and contemporary craft. The store carefully curates high-quality home goods, minimalist jewelry, leather accessories, and stationery/books crafted directly by Czech designers. Bursting with strong contemporary aesthetics and uniqueness, its items far surpass standard tourist chain souvenirs\u2014perfect for travelers searching for one-of-a-kind, tasteful gifts.", "name": "Czechdesign Shop", "transport": "Take Tram Line 5, 14, or 18 to Mysl\u00edkova Station, then walk about 1 minute."}, {"address": "Havelsk\u00e1 13, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | Must-buy list: Handmade Czech marionette puppets, Bohemian hand-embroidered napkins, freshly made Czech spa wafers (L\u00e1ze\u0148sk\u00e9 oplatky). Operating continuously since 1232, this is the oldest traditional open-air market in Prague\u0027s Old Town. Rows of open-air stalls sell fresh local seasonal fruits, traditional Czech handmade sweets, as well as an array of Prague-style handicrafts, wooden toys, and paintings. Strolling through offers a vibrant glimpse into authentic local life in Prague\u0027s historical heart.", "name": "Havelsk\u00e1 Market (Havelsk\u00e9 tr\u017ei\u0161t\u011b)", "transport": "About a 3-minute walk from M\u016fstek Metro Station."}, {"address": "Karlova 186/22, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | Must-buy list: Linden-scented natural handmade candles, Czech organic herbal tea bags, minimalist solid wood desk stationery. Named after Czechia\u0027s national tree, the linden, L\u00edpa is a local independent brand dedicated to sharing a deep connection to the land and elegant lifestyle aesthetics. Products are crafted in collaboration with local Czech artisans and small farmers, featuring natural skincare, linden honey, herbal teas, and warm wooden home goods. With beautifully minimalist packaging and pure, high-quality natural ingredients, it showcases a sophisticated and authentic side of modern Czech living.", "name": "L\u00edpa Store Prague", "transport": "About a 4-minute walk along Karlova Street from Old Town Square toward Charles Bridge."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "\u8001\u57ce\u5340 (Star\u00e9 M\u011bsto)"}, "vinohrady_zizkov": {"categories": {"cat_1": {"items": [{"address": "Vinohradsk\u00e1 2828/151, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.8 stars | Must-Buy List: 3-Minute Morning Mask (3 minutov\u00e1 rann\u00ed maska), Havl\u00edk\u0027s Natural Miracle Balm (Havl\u00edk\u016fv p\u0159\u00edrodn\u00ed z\u00e1zrak), Organic Herbal Lip Balm. This local organic skincare brand claims to pass down Czech 17th-century royal herbal formulas, featuring an elegant counter in Atrium Flora. Committed to using pollution-free organic flowers, herbs, and beeswax, their 3-Minute Morning Mask is a bestseller among tourists, leaving skin remarkably smooth and fine. It is the ultimate choice representing the Czech philosophy of pure, natural skincare.", "name": "Havl\u00edkova p\u0159\u00edrodn\u00ed apot\u00e9ka (Atrium Flora)", "transport": "Take Metro Line A to Flora Station, directly connected to Atrium Flora Shopping Center."}, {"address": "M\u00e1nesova 1613/56, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.9 stars | Must-Buy List: Czech Vegan Mineral Foundation, Botanical Extract Essence Oil, Non-Toxic Vegan Nail Polish. Tucked away on M\u00e1nesova Street in the quiet, chic neighborhood of Vinohrady, this independent organic beauty boutique is a hidden haven for stylish locals and conscious beauty lovers. The shop curates top-tier local Czech and European vegan, cruelty-free beauty and skincare products. The staff is knowledgeable and friendly, providing customized skin consultations\u2014perfect for finding unique, niche local cosmetics gifts.", "name": "L\u00ed\u010d\u00edrna Organics Vinohrady", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad Station, about a 4-minute walk away."}, {"address": "Vinohradsk\u00e1 2828/151, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.6 stars | Must-Buy List: Beer Shampoo (Pivn\u00ed \u0161ampon), Wine Hand Cream (Vinn\u00e1 kr\u00e9m na ruce), Karlovy Vary Thermal Spring Salt Bath \u0026 Body Set. An iconic Czech national natural skincare brand, featuring a cozy flagship boutique in the Flora district. The brand\u0027s signature feature is blending traditional Czech brewer\u0027s yeast, wine extracts, and thermal spring mineral salts. The beer series has a refreshing aroma and is wonderful for scalp care, making it a classic souvenir you shouldn\u0027t miss when visiting Prague.", "name": "Manufaktura (Atrium Flora)", "transport": "Take Metro Line A to Flora Station, connected to the 1st floor of Atrium Flora Shopping Center."}, {"address": "Vinohradsk\u00e1 2828/151, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.7 stars | Must-Buy List: Saloos Classic Rose Hydrating Essence Oil, Nobilis Tilia Aromatherapy Repairing Face Cream, Czech Natural Handmade Botanical Soap. Biooo is the largest organic and natural beauty concept store in the Czech Republic. This branch is located inside the shopping center bordering Vinohrady and \u017di\u017ekov. Bringing together hundreds of Czech and European organic skincare, natural makeup, and aromatherapy products, it is the most convenient one-stop shopping paradise if you want to buy top Czech aromatherapy brands like Saloos and Nobilis Tilia all at once.", "name": "Biooo.cz Atrium Flora", "transport": "Take Metro Line A to Flora Station, located on the B1 level of Atrium Flora Shopping Center."}, {"address": "Seifertova 571/7, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.3 stars | Must-Buy List: Dermacol Make-Up Cover Foundation, Astrid Hydrating Lip Balm, Bohemia Herbs Hemp Seed Soothing Shower Gel. Teta is a long-established local drugstore chain in the Czech Republic, and this branch on Seifertova Avenue in \u017di\u017ekov is loved by local residents. Offering highly affordable prices, it is stocked with classic heritage brands Czechs have used since childhood\u2014such as the world-famous Dermacol high-coverage foundation and various soothing care products infused with Czech hemp seed oil. A great spot to hunt for affordable local treasures.", "name": "Teta Drogerie Seifertova", "transport": "Take Tram 5, 9, 15, or 26 to Viktoria \u017di\u017ekov stop, about a 2-minute walk away."}, {"address": "Vinohradsk\u00e1 112/93, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.6 stars | Must-Buy List: Cannaderm Mentholka Pain Relief Gel, Annabis Activecann Hemp Face Cream with Propolis, Czech CBD Hydrating Lip Balm. The Czech Republic is famous for its legal medical-grade hemp skincare products. This specialized pharmacy on Vinohradsk\u00e1 Avenue is the best place to explore Czech hemp beauty and health care products. It stocks strictly certified natural hemp seed oil skincare, remarkably effective for soothing dry, sensitive skin as well as muscle and joint relief. The staff possesses deep pharmaceutical knowledge and can explain product usage in detail.", "name": "Konopn\u00e1 L\u00e9k\u00e1rna Vinohradsk\u00e1", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad Station, about a 3-minute walk away."}, {"address": "N\u00e1m\u011bst\u00ed M\u00edru 1220/3, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.4 stars | Must-Buy List: Ryor Czech Herbal Balancing Tonic, Czech Thermal Water Repair Spray, Dr. M\u00fcller Tea Tree Ointment. Located next to N\u00e1m\u011bst\u00ed M\u00edru in the heart of Vinohrady, this century-old historic pharmacy retains its elegant classical wooden interior. Beyond prescription medicines, it features a dedicated section for Czech dermo-cosmetics and herbal skincare, offering brands like Ryor and Dr. M\u00fcller recommended by renowned Czech dermatologists. It\u0027s a wonderful spot to experience a classic European pharmacy ambiance while shopping for local dermocosmetics.", "name": "L\u00e9k\u00e1rna U Sv. Ludmily (N\u00e1m\u011bst\u00ed M\u00edru)", "transport": "Take Metro Line A to N\u00e1m\u011bst\u00ed M\u00edru Station; right outside the station next to Peace Square (N\u00e1m\u011bst\u00ed M\u00edru)."}, {"address": "N\u00e1m\u011bst\u00ed M\u00edru 341/15, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.5 stars | Must-Buy List: Saloos Cold-Pressed Botanical Skincare Oil, Dermacol Caviar Anti-Aging Face Cream, Alverde Organic Chamomile Hand Cream. Located right by N\u00e1m\u011bst\u00ed M\u00edru, this dm drugstore is bright, spacious, and fully stocked. It features a large dedicated Czech local skincare section and an organic skincare counter. From affordable, high-quality Saloos plant oils to the full Dermacol cosmetics line, it\u0027s the most convenient choice for tourists staying in the Vinohrady area to restock local drugstore products and everyday skincare essentials.", "name": "dm drogerie markt N\u00e1m\u011bst\u00ed M\u00edru", "transport": "Take Metro Line A to N\u00e1m\u011bst\u00ed M\u00edru Station, about a 1-minute walk away."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "Korunn\u00ed 91, 130 00 Praha 3 - Vinohrady", "feature": "\u2b50 4.7 stars | Must-Buy List: Cotton and linen dresses by local Czech independent designers, sustainable leather shoulder bags, handmade wool scarves. NILAhouse is one of the most iconic fashion concept stores in the Vinohrady district, emphasizing eco-friendly sustainability and minimalist aesthetics. The store brings together clothing, shoes, bags, and lifestyle accessories from various Czech and European independent designers. The cotton-linen dresses feature sleek, simple cuts loved by stylish locals, while the sustainable leather bags are made from fine tanned leather, offering exceptional texture, versatility, and durability\u2014a top shopping choice for lovers of quality living and green fashion.", "name": "NILAhouse Sustainable Fashion \u0026 Design Concept Store", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad Station, then walk about 5 minutes."}, {"address": "\u0158ipsk\u00e1 11, 130 00 Praha 3 - Vinohrady", "feature": "\u2b50 4.8 stars | Must-Buy List: 1970s vintage genuine leather briefcases, elegant vintage silk dresses, Czech vintage handmade metal brooches. Located in Vinohrady, Lula Vintage is a haven for vintage lovers in Prague. The owner carefully curates high-quality clothing, shoes, and bags from the 1920s to the 1990s. With an elegant and romantic atmosphere, every bag and dress is rigorously cleaned and well-maintained in excellent condition. Their 70s leather briefcases feature warm leather patinas rich with history, making them perfect for vintage enthusiasts seeking unique, one-of-a-kind pieces.", "name": "Lula Vintage Prague - Vintage Clothing \u0026 Accessories", "transport": "Take Tram 11 or 13 to Ji\u0159\u00edho z Pod\u011bbrad Station, then walk about 3 minutes."}, {"address": "Slav\u00edkova 24, 130 00 Praha 3 - \u017di\u017ekov", "feature": "\u2b50 4.6 stars | Must-Buy List: Limited-edition collaboration sneakers, local Czech designer graphic tees, streetwear baseball caps. Located on the border of \u017di\u017ekov and Vinohrady, Garage Store is a hub for Prague\u0027s street culture and sneakerheads. The store specializes in rare limited-edition sneakers along with local and international streetwear brands. The interior features a strong industrial vintage vibe, making it immensely popular among local youth. If you are looking for unique Czech original graphic T-shirts or rare sneaker colorways, this fashion landmark is a must-visit.", "name": "Garage Store - Streetwear \u0026 Sneakers", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad Station, then walk about 3 minutes."}, {"address": "Vinohradsk\u00e1 42, 120 00 Praha 2 - Vinohrady", "feature": "\u2b50 4.5 stars | Must-Buy List: Czech designer handmade trench coats, geometric real leather earrings, knitted wool scarves. Pour Pour is a local boutique in Vinohrady established for many years, tailored for women with unique tastes. The store showcases handmade creations from several emerging Czech fashion designers, blending avant-garde cuts with everyday wearability. Their handmade trench coats boast stylish architectural silhouettes, while the leather earrings are delicate and refined\u2014perfect for picking up a unique outfit highlight that guaranteed won\u0027t match anyone else back home.", "name": "Pour Pour - Czech Designer Womenswear Boutique", "transport": "Take Tram 11 or 13 to Vinohradsk\u00e1 tr\u017enice Station, then walk about 1 minute."}, {"address": "Slezsk\u00e1 20, 120 00 Praha 2 - Vinohrady", "feature": "\u2b50 4.4 stars | Must-Buy List: Vintage denim jackets, 1980s vintage suede bags, exquisite vintage leather belts. Tucked away in a quiet Vinohrady neighborhood, Fifty-Fifty Vintage is a curated secondhand shop beloved by local youth and hipsters. The name signifies equal balance between affordability and quality. Everything in store is strictly curated, ranging from American street style denim jackets to European 80s suede handbags. Affordable yet high quality, it\u0027s a fantastic spot to spend an entire afternoon treasure hunting.", "name": "Fifty-Fifty Vintage - Curated Secondhand \u0026 Leather Bags", "transport": "Take Metro Line A to N\u00e1m\u011bst\u00ed M\u00edru Station, then walk about 4 minutes."}, {"address": "Vinohradsk\u00e1 45, 120 00 Praha 2 - Vinohrady", "feature": "\u2b50 4.5 stars | Must-Buy List: Czech exclusive colorway sneakers, designer shoe care kits, branded canvas tote bags. Sneaker Barber is a highly popular sneaker boutique on Vinohradsk\u00e1 Avenue, renowned for offering premium footwear and top-notch service. Besides bestselling European kicks, they frequently carry limited-edition accessories created in collaboration with Czech designers. Featuring a modern, stylish interior, the friendly and knowledgeable staff are always ready to recommend the perfect combo of trendy sneakers and accessories.", "name": "Sneaker Barber - Boutique Sneakers \u0026 Accessories", "transport": "Take Tram 11 or 13 to Vinohradsk\u00e1 tr\u017enice Station, then walk about 2 minutes."}, {"address": "Francouzsk\u00e1 36, 120 00 Praha 2 - Vinohrady", "feature": "\u2b50 4.6 stars | Must-Buy List: Bohemian hand-embroidered blouses, vintage brass jewelry, handmade leather crossbody bags. Boho Concept Store perfectly embodies Prague\u0027s artistic spirit and Bohemian romance. The store displays a variety of handmade women\u0027s clothing, accessories, and leather goods, each radiating a unique handcrafted warmth. Embroidered tops are crafted from premium natural fabrics, offering comfort and elegant motifs, while the handmade leather crossbody bags seamlessly blend utility and design\u2014making it one of the most popular independent style boutiques in Vinohrady.", "name": "Boho Concept Store - Bohemian Style \u0026 Apparel", "transport": "Take Tram 4, 13, or 22 to Jana Masaryka Station, then walk about 2 minutes."}, {"address": "Korunn\u00ed 76, 101 00 Praha 10 - Vinohrady", "feature": "\u2b50 4.7 stars | Must-Buy List: Organic cotton sweatshirts, Czech hipster-style tote bags, sustainable wool beanies. NILAdaily is another exquisite branch of the NILA brand in Vinohrady, focusing primarily on comfortable loungewear and skin-friendly organic cotton accessories. The bright and spacious store uses natural organic fabrics and eco-friendly manufacturing processes for most of its products. Their organic cotton sweatshirts offer incredible texture and clean cuts, while canvas tote bags printed with local Prague phrases or indie artwork are top choices for both local daily use and tourist souvenirs.", "name": "NILAdaily - Minimalist Lifestyle \u0026 Clothing Boutique", "transport": "Take Tram 10 or 16 to Perunova Station, then walk about 1 minute."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "Vinohradsk\u00e1 35, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.8 stars | Must-buy list: 3-Minute Morning Beauty Mask (Rann\u00ed 3minutov\u00e1 maska), Czech organic herbal face cream, natural honey repair lip balm. Famous for preserving ancient Czech organic herbal recipes, this skincare brand is loved by local women and tourists alike. The signature \"3-Minute Morning Mask\" quickly awakens your skin in the morning. Friendly staff provide detailed ingredient explanations, making it an excellent choice for buying souvenirs for close friends or elders.", "name": "Havl\u00edkova p\u0159\u00edrodn\u00ed apot\u00e9ka Vinohradsk\u00e1", "transport": "Take Tram 11 or 13 to Vinohradsk\u00e1 tr\u017enice station, then walk for about 2 minutes."}, {"address": "Vinohradsk\u00e1 62, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.7 stars | Must-buy list: Canned craft beers from Czech microbreweries, BeerGeek branded tasting glasses, crispy Czech beer snacks. A mecca for craft beer lovers in Prague, its walls and fridges are packed with hundreds of unique craft brews from small independent Czech microbreweries. Unlike mass-market brands in supermarkets, you can find distinctive limited-edition beers here, making it a top choice for authentic local gifts for friends or beer enthusiasts.", "name": "BeerGeek Pivot\u00e9ka (Craft Beer Bottle Shop)", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, then walk for about 3 minutes."}, {"address": "Vinohradsk\u00e1 146, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.6 stars | Must-buy list: Cinnamon chocolate-covered almonds (Mandle v \u010dokol\u00e1d\u011b), limited-edition Prague Castle tin box chocolates, Czech plum liqueur dark chocolate. A premium local Czech craft chocolate brand that combines high-quality cocoa with local ingredients. The best-selling cinnamon almond chocolate comes in beautiful packaging with the rich aroma of Central European Christmas markets. The tin boxes feature elegant artwork of Prague landmarks, making them great keepsakes long after the chocolates are gone.", "name": "Pra\u017esk\u00e1 \u010dokol\u00e1da Handcrafted Chocolates (Steiner \u0026 Kova\u0159\u00edk Vinohrady)", "transport": "Take Metro Line A or Tram 5, 11, or 13 to Flora station, then walk for about 2 minutes."}, {"address": "Korunn\u00ed 38, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.6 stars | Must-buy list: Traditional poppy seed and custard Kol\u00e1\u010d pastries, house-made sourdough crispbreads, local handmade jams. A popular bakery located in the heart of Vinohrady, famous for crafting bread and pastries using traditional Czech methods. The \"Kol\u00e1\u010d\" here is a classic Czech family staple with rich, perfectly balanced fillings. They also sell packaged house-made baked bread crackers and jams, perfect as hotel snacks or unique treats to bring home.", "name": "Anton\u00ednovo Peka\u0159stv\u00ed Vinohrady (Artisanal Bakery)", "transport": "Take Tram 10 or 16 to \u0160umavsk\u00e1 station; located right by the stop."}, {"address": "Vinohradsk\u00e1 53, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.4 stars | Must-buy list: Jarred Czech pickled cheese (Nakl\u00e1dan\u00fd Hermel\u00edn), organic mountain wild honey, mini Becherovka herbal liqueur gift set. A high-quality supermarket offering carefully curated products from local Czech farmers and small producers. This is the place to go for authentic Czech culinary gifts\u2014jarred spicy pickled cheese and pure natural herbal syrups are highly recommended for a taste of genuine Czech countryside flavor.", "name": "Sklizeno Vinohradsk\u00e1 (Local Gourmet Grocery)", "transport": "Take Tram 11 or 13 to Vinohradsk\u00e1 tr\u017enice station, then walk for about 1 minute."}, {"address": "Vinohradsk\u00e1 151 (Atrium Flora), 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.5 stars | Must-buy list: Czech hop revitalizing shampoo, Dead Sea salt gentle body scrub, traditional handcrafted wooden toys. Manufaktura is an iconic Czech natural cosmetics brand; this branch is located inside a major local shopping mall. The brand is best known for incorporating traditional Czech beer extracts into skincare products. The hop shampoo and hand creams have a subtle fragrance and are deeply moisturizing. The store also sells handmade Czech wooden toys, making it a highly praised gift shop.", "name": "Manufaktura Atrium Flora (Beer Cosmetics \u0026 Souvenirs)", "transport": "Take Metro Line A directly to Flora station, which connects to the shopping mall."}, {"address": "Korunn\u00ed 810/14, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.7 stars | Must-buy list: Aged Gran Moravia hard cheese blocks, traditional Czech pure butter, handmade cheese crisps for wine pairing. Though focused on cheese, this Czech-Italian specialty shop is a local foodie favorite. The featured Gran Moravia cheese is produced and aged in the Moravia region of the Czech Republic, offering outstanding quality at very reasonable prices. Vacuum-packed cheese blocks and savory cheese crackers have a long shelf life, making them exceptional gifts to pair with wine.", "name": "Formaggerie Gran Moravia Korunn\u00ed (Specialty Cheese Shop)", "transport": "Take Tram 10 or 16 to Vinohradsk\u00e1 vod\u00e1rna station, then walk for about 2 minutes."}, {"address": "B\u011blehradsk\u00e1 66, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.6 stars | Must-buy list: Freshly stone-ground Czech organic wheat flour, artisanal sourdough grain crackers, local handmade hazelnut cocoa spread. Praktika is an iconic independent artisanal bakery in Prague that insists on using ancient wheat varieties grown on small local Czech farms. Beyond freshly baked bread, their handmade grain crackers and spreads are completely additive-free. Featuring minimalist, stylish packaging, it is immensely popular among health-conscious modern travelers.", "name": "Peka\u0159stv\u00ed Praktika B\u011blehradsk\u00e1 (Artisan Grain \u0026 Bakery Shop)", "transport": "Take Tram 6 or 11 to Bruselsk\u00e1 station, then walk for about 2 minutes."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Vinohradsk\u00e1 151, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.4 stars | Must-Buy List: Manufaktur p, then walk for about 2 minutes"}, {"address": "Ond\u0159\u00ed\u010dkova 2214/2, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.8 stars | Must-Buy List: NeverEnough original graphic T-shirts, \u017di\u017ekov limited-edition baseball caps, Czech underground indie vinyl records. A core independent streetwear boutique in \u017di\u017ekov combining a clothing brand, vinyl shop, and subculture bar. Its apparel designs are packed with rebellious local humor and distinct visual flair, making it immensely popular among local youth and fashion enthusiasts.", "name": "NeverEnough Black Boutique", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad Station, then walk for about 5 minutes"}, {"address": "Vinohradsk\u00e1 37/112, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.8 stars | Must-Buy List: 3-Minute Organic Morning Mask, organic nut-nourishing hand cream, Czech herbal royal jelly face cream. A renowned local Czech organic skincare brand inheriting unique formulas from a 19th-century apothecary, prioritizing ingredients from their own organic farms. The shop features an elegant, vintage apothecary aesthetic, with warm staff providing free samples and professional consultations.", "name": "Havl\u00edkova Apot\u00e9ka Vinohrady", "transport": "Take Metro Line A or Tram Line 11 or 13 to Ji\u0159\u00edho z Pod\u011bbrad Station, then walk for about 3 minutes"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "\u8461\u8404\u9152\u838a\u5340\u8207\u9f4a\u8332\u79d1\u592b (Vinohrady \u0026 \u017di\u017ekov)"}, "vysehrad": {"categories": {"cat_1": {"items": [{"address": "Vratislavova 13/2, 128 00 Praha 2", "feature": "\u2b50 4.6 stars | Must-Buy List: Dr. Dudek Universal Calendula Ointment, Cannaderm Hemp Seed Soothing Gel, Czech Herbal Lip Balm. Located on a sloping street beneath Vy\u0161ehrad, this local pharmacy is the top choice for residents and savvy travelers looking for traditional Czech ointments. The shop offers a wide variety of unique Czech natural herbal skincare products, and the highly knowledgeable staff can thoughtfully recommend local cosmetic brands tailored to your skin type.", "name": "Vy\u0161ehrad Slope Pharmacy (L\u00e9k\u00e1rna pod Vy\u0161ehradem)", "transport": "Take tram 14, 18, or 24 to Albertov stop, then walk for about 3 minutes."}, {"address": "Svobodova 144/4, 128 00 Praha 2", "feature": "\u2b50 4.7 stars | Must-Buy List: Botanicus Dead Sea Mud Handmade Soap, Natural Rose Hydrosol Mist, Czech Royal Jelly Nourishing Cream. Located near the Vy\u0161ehrad area, this curated boutique specializes in premium Czech organic beauty products. The shop boasts a warm and romantic herbal fragrance atmosphere, and all products emphasize being free of chemical additives, making it a favorite among female customers who prioritize skincare and natural ingredients.", "name": "Vy\u0161ehrad Natural \u0026 Organic Cosmetics (P\u0159\u00edrodn\u00ed Kosmetika Vy\u0161ehrad)", "transport": "Take tram 2, 3, or 17 to V\u00fdto\u0148 stop, then walk for about 4 minutes."}, {"address": "Vy\u0161ehradsk\u00e1 1349/2, 128 00 Praha 2", "feature": "\u2b50 4.4 stars | Must-Buy List: Dermacol Make-Up Cover Foundation, Ryor Goat\u0027s Milk Anti-Wrinkle Cream, Balea Hyaluronic Acid Ampoules. One of the most popular and affordable drugstores in the Czech Republic, located on Vy\u0161ehradsk\u00e1 Avenue. It carries an extremely complete selection, especially for the national makeup brand Dermacol and natural skincare brand Ryor, which are restocked quickly and offer fantastic value for money.", "name": "dm-drogerie markt Vy\u0161ehradsk\u00e1", "transport": "Take Metro Line B to Karlovo n\u00e1m\u011bst\u00ed station and walk about 5 minutes; or take tram 14 or 18 to Botanick\u00e1 zahrada stop."}, {"address": "Jarom\u00edrova 484/37, 128 00 Praha 2", "feature": "\u2b50 4.8 stars | Must-Buy List: Havl\u00edkova Apot\u00e9ka 3-Minute Morning Organic Mask, Nobilis Tilia Lavender Sleep Essential Oil, Organic Calendula Repair Cream. A charming herbal apothecary hidden on the edge of the Nusle Valley south of Vy\u0161ehrad, bringing together top Czech botanical brands like the trendy Havl\u00edkova Apot\u00e9ka. Filled with warm woody accents and essential oil aromas, it exudes an effortlessly stylish, hip vibe.", "name": "Jarom\u00edrova Herbal \u0026 Natural Apothecary (Byliny a p\u0159\u00edrodn\u00ed apot\u00e9ka Jarom\u00edrova)", "transport": "Take tram 7, 14, or 18 to Svatoplukova stop, then walk for about 2 minutes."}, {"address": "Na Slupi 1483/14, 128 00 Praha 2", "feature": "\u2b50 4.5 stars | Must-Buy List: Saloos Rose Essential Facial Oil, Astrid Hydrating Lip Balm, ALPA Herbal Soothing Balm. Located near the northern foot of Vy\u0161ehrad, this historic pharmacy offers a rich selection of local Czech essential oils and herbal cosmetics alongside prescription medications. Saloos plant oils and Astrid lip balms are very affordably priced here, making it a fantastic spot to pick up souvenirs.", "name": "Na Slupi Pharmacy (L\u00e9k\u00e1rna Na Slupi)", "transport": "Take tram 14, 18, or 24 to Albertov stop; it is right at the station."}, {"address": "Jarom\u00edrova 16/186, 128 00 Praha 2", "feature": "\u2b50 4.3 stars | Must-Buy List: Dermacol Caviar Intense Firming Serum, Bione Cosmetics Hemp Seed Hydrating Lotion, Ryor Green Tea Refreshing Anti-Acne Gel. A drugstore chain store on Jarom\u00edrova Street at the foot of Vy\u0161ehrad, offering a comprehensive selection of affordable local Czech cosmetics and daily skincare. It frequently hosts limited-time sales, with hemp seed hydrating products and Dermacol cosmetics being huge hits among tourists.", "name": "ROSSMANN Drogerie Jarom\u00edrova", "transport": "Take tram 7, 14, or 18 to Svatoplukova stop, then walk for about 1 minute."}, {"address": "Nezamyslova 508/2, 128 00 Praha 2", "feature": "\u2b50 4.9 stars | Must-Buy List: Soaphoria Botanical Handmade Shampoo Bar, Mylo Rose \u0026 Elderflower Facial Oil, Lamazuna Organic Makeup Remover Pads. Nestled in a quiet neighborhood near Vy\u0161ehrad, this eco-friendly cosmetics shop focuses on zero-waste and non-toxic ingredients. It curates high-quality organic handmade cosmetics from the Czech Republic and Central Europe, emphasizing eco-friendly packaging and vegan ingredients\u2014drawing many clean beauty enthusiasts seeking unique finds.", "name": "Vy\u0161ehrad Eco Green Cosmetics (EKO Kosmetika Vy\u0161ehrad)", "transport": "Take tram 7, 14, or 24 to Divadlo Na Fidlova\u010dce stop, then walk for about 4 minutes."}, {"address": "Svobodova 2/136, 128 00 Praha 2", "feature": "\u2b50 4.5 stars | Must-Buy List: Dr. Popov Propolis Heel Repair Cream, Herbavera Hemp Ointment, Cannaderm Hair Serum. An independent pharmacy situated below the Vy\u0161ehrad riverside, offering skincare and repair products from century-old Czech herbal brands like Dr. Popov and Herbavera. Their hemp seed and propolis ointments, specifically formulated for dry and cracked skin, are highly effective and reasonably priced\u2014making this long-established pharmacy a favorite recommendation among locals.", "name": "Pharmacy U Svobod\u016f (L\u00e9k\u00e1rna U Svobod\u016f)", "transport": "Take tram 2, 3, or 17 to V\u00fdto\u0148 stop, then walk for about 3 minutes."}], "name": "Local Iconic Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "B\u011blehradsk\u00e1 269/3, 140 00 Praha 4-Nusle", "feature": "\u2b50 4.8 stars | Must-Buy List: Handmade genuine leather briefcases, custom leather belts, vintage cowhide bifold wallets. A famous Czech artisanal leather workshop located in the Nusle Valley at the foot of Vy\u0161ehrad, adhering to 100% hand-stitching and offering a lifetime warranty. Filled with the rich aroma of leather, the shop lets visitors witness master leatherworkers showcasing their exquisite craftsmanship up close, complete with on-site name engraving services\u2014making it a deeply meaningful Prague artisanal souvenir.", "name": "Bra\u0161n\u00e1\u0159stv\u00ed Tlust\u00fd \u0026 spol. (Tlust\u00fd Premium Leather Workshop)", "transport": "Take tram 6, 11, or 14 to Pod Karlovom stop, then walk about 3 minutes."}, {"address": "Vratislavova 28/15, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.6 stars | Must-Buy List: Czech designer wool coats, natural linen dresses, handmade geometric earrings. Located on Vratislavova Street along the slope leading up to Vy\u0161ehrad Castle, this fashion boutique brings together apparel, shoes, and bags from various independent Prague designers. Featuring minimalist, wearable cuts and high-quality natural cotton, linen, and wool fabrics, it is a favorite among elegant local women.", "name": "Vratislavova Design \u0026 Fashion Loft", "transport": "Take tram 2, 3, or 17 to V\u00fdto\u0148 stop, then walk uphill along Vratislavova street for about 4 minutes."}, {"address": "Sekaninova 1022/26, 128 00 Praha 2-Nusle", "feature": "\u2b50 4.5 stars | Must-Buy List: 70s vintage printed shirts, hand-embroidered vintage leather bags, locally made Czech knitwear. Curated thoughtfully by a local stylist, this hidden vintage boutique in the Vy\u0161ehrad area houses a vast collection of mid-20th-century classic European vintage wear alongside upcycled eco-friendly fashion from local Czech designers. Every item, shoe, and bag is unique, making it a dream spot for treasure hunters.", "name": "Boho Vintage \u0026 Local Apparel", "transport": "Take tram 7, 14, or 18 to Svatoplukova stop, then walk about 2 minutes."}, {"address": "Jarom\u00edrova 488/2, 128 00 Praha 2-Nusle", "feature": "\u2b50 4.7 stars | Must-Buy List: Botas Classic retro sneakers, colorful block-pattern casual leather shoes, high-top canvas shoes. Founded in the 1960s, Botas is a household national treasure footwear brand in the Czech Republic. This concept studio near Vy\u0161ehrad showcases retro color-blocked sneakers from their iconic Classic series, emphasizing 100% Czech manufacturing and exceptional comfort\u2014a must-have trendy item showcasing Eastern European vintage vibes.", "name": "Botas Footwear Concept Studio", "transport": "Take tram 7, 14, or 18 to Svatoplukova stop, then walk about 3 minutes."}, {"address": "Podolsk\u00e1 312/12, 147 00 Praha 4-Podol\u00ed", "feature": "\u2b50 4.4 stars | Must-Buy List: Vy\u0161ehrad totem organic cotton T-shirts, Czech-woven heavy canvas tote bags, pure linen shorts. Located near Vy\u0161ehrad and the Vltava riverbank, this boutique focuses on sustainable fashion crafted from organic cotton and local linen. Their most popular item is the custom canvas tote printed with motifs of Vy\u0161ehrad\u0027s Basilica of St. Peter and St. Paul\u2014sturdy, high-quality, and deeply memorable.", "name": "Podol\u00ed Eco-Fashion \u0026 Canvas Studio", "transport": "Take tram 2, 3, or 17 to Podolsk\u00e1 vod\u00e1rna stop, then walk about 3 minutes."}, {"address": "Na Pankr\u00e1ci 868/30, 140 00 Praha 4-Nusle", "feature": "\u2b50 4.3 stars | Must-Buy List: Soft Czech lambskin gloves, minimalist handmade genuine leather crossbody bags, Vy\u0161ehrad landscape print silk scarves. Situated just a short walk from the Vy\u0161ehrad metro station, this local boutique features leather goods and stylish womenswear crafted by small-to-medium Czech workshops. The lambskin gloves are extraordinarily delicate and affordable, making them a practical and tasteful winter souvenir from Prague.", "name": "Pankr\u00e1c Local Leather \u0026 Boutique", "transport": "Take Metro Line C to Vy\u0161ehrad station, exit and walk about 5 minutes."}, {"address": "Nuselsk\u00e1 142/22, 140 00 Praha 4-Nusle", "feature": "\u2b50 4.6 stars | Must-Buy List: Hand-stitched cowhide casual shoes, Czech crystal woven bracelets, handmade wool felt hats. Co-founded by a veteran local Czech shoemaker and an accessory designer, this studio shop crafts all leather footwear using traditional hand-stitching techniques, ensuring great comfort and long-lasting durability. Paired with exquisite handcrafted crystal accessories, it is a favorite among Prague hipsters seeking unique, non-mainstream fashion.", "name": "Nuselsk\u00e1 Handmade Accessories \u0026 Shoes Workshop", "transport": "Take tram 11 or 14 to Hork\u00e9ho stop, then walk about 2 minutes."}, {"address": "Lum\u00edrova 525/1, 128 00 Praha 2-Nusle", "feature": "\u2b50 4.5 stars | Must-Buy List: Geometric leather backpacks, original tailored windproof trench coats, minimalist designer belts. Located on the edge of the Vy\u0161ehrad area, this workshop specializes in apparel and leather bags that combine modern silhouettes with practical functionality. The designer translates the geometric lines of Prague\u0027s Gothic architecture into bag shapes, balancing high fashion with smart storage to showcase a distinct contemporary Prague aesthetic.", "name": "Vy\u0161ehrad Designer Workshop \u0026 Bags", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk about 4 minutes."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.6 stars | Must-Buy List: Vintage Vy\u0161ehrad postcards, traditional Czech handmade wooden marionettes, and limited-edition Vy\u0161ehrad historical picture books. Located inside the ruins of the ancient fortress wall, this official souvenir shop offers many exclusive gifts featuring the Basilica of St. Peter and St. Paul as well as the castle ramparts. The wooden crafts here are carved by local Czech artisans with superb quality and character, making this a top souvenir stop when visiting Vy\u0161ehrad.", "name": "Infocentrum \u0160pi\u010dka Vy\u0161ehrad Souvenir Shop", "transport": "Take Tram 2, 3, 7, 17, or 21 to \u0027V\u00fdto\u0148\u0027 stop and walk about 8 minutes; or take Metro Line C to \u0027Vy\u0161ehrad\u0027 station and walk about 10 minutes."}, {"address": "Vratislavova 28/17, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.8 stars | Must-Buy List: Moravian P\u00e1lava white wine, traditional Czech mead (Medovina), and Moravian ice wine. An independent wine shop located on Vratislavova Street along the Vy\u0161ehrad slope, specializing in wines from the famous Moravia region of the Czech Republic. The owner is friendly and knowledgeable, enthusiastically introducing local semi-sweet white wines and rich traditional mead. Reasonably priced with beautiful packaging, it\u0027s a great place to pick up gifts for friends and family.", "name": "Vinot\u00e9ka Pod Vy\u0161ehradem (Vy\u0161ehrad Foothills Wine Shop)", "transport": "Take Tram 2, 3, 17, or 21 to \u0027V\u00fdto\u0148\u0027 stop, then walk uphill along Vratislavova street for about 3 minutes."}, {"address": "Vy\u0161ehradsk\u00e1 1373/39, 128 00 Praha 2", "feature": "\u2b50 4.7 stars | Must-Buy List: Cinnamon-dusted pink almonds, Carlsbad spa salt dark chocolate, and Prague castle skyline limited gift boxes. This premium Czech local chocolate brand has a cozy shop on Vy\u0161ehradsk\u00e1 Street. Its most famous product is the award-winning cinnamon almonds, coated in rich cocoa powder and aromatic cinnamon that are addictively delicious. The packaging features beautiful illustrations of Prague landmarks, making it both elegant and distinctly local.", "name": "Pra\u017esk\u00e1 \u010dokol\u00e1da Steiner \u0026 Kova\u0159\u00edk (Handmade Prague Chocolate)", "transport": "Take Tram 14, 18, or 24 to \u0027Botanick\u00e1 zahrada\u0027 stop and walk about 2 minutes."}, {"address": "\u010cestm\u00edrova 390/5, 140 00 Praha 4-Nusle", "feature": "\u2b50 4.7 stars | Must-Buy List: Czech independent microbrewery bottled craft beer, natural hop beer bath salts, and traditional engraved beer steins. Located on the edge of the Vy\u0161ehrad district, this is a sanctuary for Czech beer enthusiasts. It houses hundreds of bottled craft beers from microbreweries and small producers across the Czech Republic\u2014a far richer selection than standard supermarkets. The shop also sells hop-infused body products and unique beer mugs, making it a must-visit souvenir spot for beer lovers.", "name": "Pivot\u00e9ka Zl\u00fd \u010casy (Bad Times Craft Beer Shop)", "transport": "Take Tram 18 to \u0027N\u00e1m\u011bst\u00ed Brat\u0159\u00ed Synk\u016f\u0027 stop and walk about 3 minutes."}, {"address": "Vy\u0161ehradsk\u00e1 1422/23, 128 00 Praha 2", "feature": "\u2b50 4.6 stars | Must-Buy List: Czech organic mountain herbal tea bags, royal jelly lip balm, and calendula soothing repair ointment. This traditional herbal apothecary near Vy\u0161ehrad has decades of history and is trusted by locals. It offers a wide variety of 100% natural organic Czech herbal teas, essential oils, and handmade botanical ointments. Very affordably priced and entirely locally produced without artificial additives, it\u0027s a fantastic spot for purchasing wellness and health-oriented souvenirs.", "name": "Bylin\u00e1\u0159stv\u00ed Kindl (Kindl Herbal Apothecary)", "transport": "Take Tram 14, 18, or 24 to \u0027Na Slupi\u0027 stop and walk about 1 minute."}, {"address": "Vratislavova 5/32, 128 00 Praha 2", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-painted Bohemian mugs, frosted colored crystal vases, and handmade Czech ceramic cat figurines. This cozy independent workshop is run by a local Czech artist. The shop displays one-of-a-kind hand-painted ceramics and a variety of colorful Bohemian crystal glassware. Every item radiates handmade warmth and rustic Czech artistic flair, perfect for collectors or those seeking high-quality special souvenirs.", "name": "Keramika a Sklo Pod Vy\u0161ehradem (Handmade Bohemian Ceramics \u0026 Glass)", "transport": "Take Tram 2, 3, 17, or 21 to \u0027V\u00fdto\u0148\u0027 stop, then walk along Vratislavova street for about 2 minutes."}, {"address": "Na Slupi 134/15, 128 00 Praha 2", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional Czech blueberry tart (Bor\u016fvkov\u00fd kol\u00e1\u010d), poppy seed pastry (Makov\u00fd kol\u00e1\u010d), and traditional Czech roasted cinnamon bread. Kab\u00e1t is an iconic, long-standing traditional bakery brand in the Czech Republic, renowned for using traditional techniques and local ingredients. This branch at the foot of Vy\u0161ehrad often has lines of locals. Their kol\u00e1\u010d pastries feature tender crusts and generous fillings; the poppy seed and blueberry flavors are uniquely Czech and highly recommended as an easy daily snack or enjoyed warm after a light toast.", "name": "Pek\u00e1rna Kab\u00e1t - Na Slupi (Kab\u00e1t Traditional Bakery)", "transport": "Take Tram 14, 18, or 24 to \u0027Na Slupi\u0027 stop."}, {"address": "Svobodova 144/4, 128 00 Praha 2", "feature": "\u2b50 4.5 stars | Must-Buy List: Carlsbad spa wafers (Kolon\u00e1da Spa Wafers), herbal spa liqueur (Becherovka), and traditional Bohemian onion crackers. Sklizeno is a specialty store highlighting premium local artisanal foods and fine snacks. Compared to standard supermarket chains, you can find beautifully packaged, higher-quality traditional spa wafers, local jams, and organic snacks here. With friendly staff, it\u0027s the closest one-stop shop near Vy\u0161ehrad for stocking up on popular Czech specialty snacks and food gifts.", "name": "Sklizeno Svobodova (Local Czech Foods \u0026 Groceries)", "transport": "Take Tram 2, 3, 7, 17, or 21 to \u0027V\u00fdto\u0148\u0027 stop and walk about 3 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Zamenhofova 440, 108 00 Praha 108", "feature": "\u2b50 4.5 stars | Must-buy list: Alpine Pro windproof jackets, Manufaktura hand cream gift sets, discounted Samsonite suitcases. As Prague\u0027s largest outlet center, it features over 200 international and local Czech brands offering incredible discounts from 30% to 70%. It is easily accessible via Metro Line C from Vy\u0161ehrad followed by a shuttle bus\u2014a must-visit shopping destination for deals on high-quality Czech outdoor gear and designer accessories.", "name": "Fashion Arena Prague Outlet", "transport": "Take Metro Line C to Depo Hostiva\u0159 station, then transfer to the free dedicated Fashion Arena shuttle bus."}, {"address": "Na Pankr\u00e1ci 86, 140 00 Praha 4", "feature": "\u2b50 4.3 stars | Must-buy list: Ba\u0165a Czech genuine leather shoes, Pierre Baguette tote bags, Czech crystal jewelry. A large, modern shopping mall near Vy\u0161ehrad bringing together many local Czech fashion brands and mid-to-high-end international labels. Bright, comfortable, and pleasantly uncrowded, locals love coming here for seasonal apparel and lifestyle goods, making it perfect for avoiding Old Town tourist crowds.", "name": "Ark\u00e1dy Pankr\u00e1c Shopping Center", "transport": "Take Metro Line C to Pankr\u00e1c station (just 2 stops from Vy\u0161ehrad station)."}, {"address": "Vratislavova 21/14, 128 00 Praha 2", "feature": "\u2b50 4.6 stars | Must-buy list: Hand-carved crystal goblets, Bohemian glass vases, colorful crystal whiskey glasses. A traditional local crystal specialty store located at the foot of Vy\u0161ehrad, offering authentic hand-cut Bohemian crystal and handmade glass art at factory-direct prices. Providing secure impact-resistant packaging and tax refund services, it is highly favored by travelers looking for exquisite home decor and luxurious tableware.", "name": "Bohemia Crystal Glass Outlet Vy\u0161ehrad", "transport": "Take Tram 7, 14, 18, or 24 to V\u00fdto\u0148 station and walk for about 5 minutes."}, {"address": "Nuselsk\u00e1 142/27, 140 00 Praha 4", "feature": "\u2b50 4.7 stars | Must-buy list: Hop repair hand cream, Karlovy Vary thermal spring salt body wash, Czech handcrafted wooden toys. The iconic local Czech natural cosmetics and lifestyle brand, famous for personal care products made with Czech beer, wine, and natural mineral salts. This branch near the Vy\u0161ehrad neighborhood offers an elegant atmosphere and affordable prices, ideal for picking up souvenir gifts in bulk.", "name": "Manufaktura Nuselsk\u00e1", "transport": "Take Tram 18 or 19 to Hork\u00e9ho station and walk for about 2 minutes."}, {"address": "Na Pankr\u00e1ci 86 (OC Ark\u00e1dy Pankr\u00e1c 1F), 140 00 Praha 4", "feature": "\u2b50 4.8 stars | Must-buy list: 3-Minute Morning Miracle Mask, organic herbal lip balm, organic royal jelly face cream. A renowned Czech organic herbal skincare brand following century-old apothecary recipes. Styled like a classic pharmacy, all products use organic plant extracts without artificial chemicals, making it a highly recommended natural skincare favorite among Asian travelers.", "name": "Havl\u00edkova P\u0159\u00edrodn\u00ed Apot\u00e9ka (Ark\u00e1dy Pankr\u00e1c)", "transport": "Take Metro Line C to Pankr\u00e1c station; located on the 1st floor of Ark\u00e1dy Pankr\u00e1c Shopping Center."}, {"address": "Svobodova 144/4, 128 00 Praha 2", "feature": "\u2b50 4.4 stars | Must-buy list: Rose essential oil \u0026 Dead Sea mud handmade soap, calendula repair salve, organic lavender hydrosol. A national-treasure organic aromatherapy brand in the Czech Republic. Compared to its main store in Old Town, this branch near Vy\u0161ehrad is quieter and offers a far superior shopping experience. Products are handcrafted from organic farm ingredients with gentle, natural formulas at a fraction of overseas prices.", "name": "Botanicus Concept Store (Vy\u0161ehrad Neighborhood)", "transport": "Take Tram 7, 14, 18, or 24 to Albertov station and walk for about 3 minutes."}, {"address": "Roztylsk\u00e1 2321/19, 148 00 Praha 4", "feature": "\u2b50 4.6 stars | Must-buy list: Manufaktura holiday gift sets, Alpine Pro outdoor gear, Ba\u0165a classic leather shoes. One of the largest flagship shopping centers in the Czech Republic, easily reachable via Metro Line C directly from Vy\u0161ehrad station. It houses hundreds of local and international brand outlets, along with a massive supermarket and gourmet food court, making it an excellent choice for deep shopping and buying Czech leather footwear.", "name": "Westfield Chodov Shopping Center", "transport": "Take Metro Line C to Chodov station (direct ride from Vy\u0161ehrad station takes about 10 minutes)."}, {"address": "Nuselsk\u00e1 12/4, 140 00 Praha 4", "feature": "\u2b50 4.7 stars | Must-buy list: Wooden hedgehog colored pencil holder, Magic 3-color rainbow pencil, classic non-toxic erasers. A legendary, century-old Czech stationery brand. Located near the Vy\u0161ehrad district, this branch showcases a complete selection of professional art supplies and unique stationery novelties. The iconic wooden hedgehog pencil holder and magic rainbow pencils make for affordable, high-quality local souvenirs.", "name": "Koh-i-Noor Hardtmuth Stationery Store (Nuselsk\u00e1)", "transport": "Take Tram 18 or 19 to Divadlo Na Fidlova\u010dce station and walk for about 3 minutes."}], "name": "Major Shopping Malls \u0026 Recommended Outlets"}}, "name": "\u9ad8\u5821\u5340 (Vy\u0161ehrad)"}};
        const cityName = "Prague";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
