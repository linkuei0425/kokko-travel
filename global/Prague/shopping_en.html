 List: Traditional Czech hand-embroidered vests, vintage handmade canvas tote bags, Bohemian hand-knitted woolen scarves. Located near the Loreto Sanctuary, this cozy shop displays traditional handcrafted clothing accessories from the Bohemian region of the Czech Republic. Knitwear and embroidery products are handmade by local women\u0027s cooperatives, preserving rich folk style and authentic quality.", "name": "Loreta Textile \u0026 Handcraft Accessories", "transport": "Take Tram 22 to Poho\u0159elec station and walk about 3 minutes to Loreta Square."}, {"address": "U P\u00edseck\u00e9 br\u00e1ny 16, 160 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade leather briefcases, classic sturdy Czech leather shoes, premium vegetable-tanned bi-fold wallets. Located near the P\u00edsek Gate on the border of the Castle District, this artisan shoe and bag specialty shop combines traditional shoemaking craftsmanship with modern minimalism. Using premium European leather, every pair of shoes and bag is handcrafted through dozens of meticulous steps, offering exceptional durability and fit that attract local gentlemen and knowledgeable travelers alike.", "name": "P\u00edsek Gate Leather \u0026 Shoes Workshop", "transport": "Take Metro Line A to Hrad\u010dansk\u00e1 station and walk about 5 minutes."}, {"address": "Poho\u0159elec 24, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.5 stars | Must-Buy List: Custom Czech linen trench coats, Mucha-style motif silk blouses, handmade leather crossbody bags. An independent design studio located on Poho\u0159elec Street, specializing in silk clothing and leather goods inspired by the aesthetic lines of famous Prague painter Alphonse Mucha. Featuring relaxed yet refined cuts and extraordinary accessory textures, it is the ultimate destination to pick up fashion pieces infused with Prague\u0027s artistic soul.", "name": "Atelier Silk \u0026 Style Hrad\u010dany", "transport": "Take Tram 22 to Poho\u0159elec station and walk about 2 minutes."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Zlat\u00e1 uli\u010dka u Daliborky 26, 119 00 Praha 1 - Hrad\u010dany", "feature": "\u2b50 4.6 stars | Must-Buy List: Beer hop nourishing hand cream, Thermal spring salt \u0026 rose lip balm, Dead Sea mud natural soap. Located inside the quaint Golden Lane, Manufaktura is Czechia\u0027s most famous local natural skincare brand. Recreating the ambiance of a traditional apothecary and artisan workshop, this branch offers products made from local Czech beer, thermal spring salt, and herbal extracts\u2014perfect souvenirs for friends and family.", "name": "Manufaktura - Golden Lane Branch (Manufaktura - Zlat\u00e1 uli\u010dka)", "transport": "Take Tram 22 or 23 to Pra\u017esk\u00fd hrad station, then walk about 7 minutes into the Golden Lane inside the castle."}, {"address": "T\u0159et\u00ed n\u00e1dvo\u0159\u00ed Pra\u017esk\u00e9ho hradu, 119 00 Praha 1 - Hrad\u010dany", "feature": "\u2b50 4.4 stars | Must-Buy List: Castle limited-edition stamp postcard set, St. Vitus Cathedral 3D wooden puzzle, Charles IV commemorative gold coin. Situated in the heart of the Castle District, this official gift shop offers exclusive official souvenirs sold only within the castle grounds. The quality is exceptional, especially the beautiful merchandise and classical bookmarks featuring St. Vitus Cathedral stained glass patterns, making them highly collectible.", "name": "Prague Castle Official Souvenir Shop", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station, then walk 5 minutes into the castle\u0027s Third Courtyard."}, {"address": "Zlat\u00e1 uli\u010dka u Daliborky 16, 119 00 Praha 1 - Hrad\u010dany", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade marionette puppets, Czech traditional wooden pull-along toys, Fairy-tale wooden music boxes. Czechia boasts a long-standing marionette theater culture. Tucked inside a colorful cottage on Golden Lane, this toy shop specializes in entirely hand-carved and hand-painted puppets. Each puppet has a vivid expression, oozing whimsical charm and medieval magical colors\u2014a must-see handicraft when visiting the castle district.", "name": "Marionettes \u0026 Wooden Toys - Golden Lane (Zlat\u00e1 uli\u010dka)", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station, then enter Golden Lane."}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 301/10, 118 00 Praha 1 - Hrad\u010dany", "feature": "\u2b50 4.7 stars | Must-Buy List: St. Norbert craft beer set, Monastery handmade beer soap, Limited-edition beer mugs. Located at the edge of the castle district, this centuries-old monastery brewery not only serves delicious meals, but its gift shop is also a paradise for beer lovers. The must-buy St. Norbert beer is brewed following secret recipes from medieval monks, rich and aromatic, alongside various beer-themed creative items.", "name": "Strahov Monastery Brewery \u0026 Souvenir Shop (Kl\u00e1\u0161tern\u00ed Pivovar Strahov Shop)", "transport": "Take Tram 22 to Poho\u0159elec station, then walk about 3 minutes."}, {"address": "Z\u00e1meck\u00e9 schody, 118 00 Praha 1 - Hrad\u010dany", "feature": "\u2b50 4.8 stars | Must-Buy List: 3-Minute Organic Morning Mask, Organic Royal Essence Oil, Herbal Hand Cream. Inheriting 19th-century Czech apothecary herbal organic formulas, this trendy local organic skincare brand features a cozy shop beside the Castle Steps. All products are strictly made from pollution-free botanical ingredients. The \u00273-Minute Morning Mask\u0027 is globally famous among tourists\u2014a skin-care holy grail that visitors stock up on.", "name": "Havl\u00edk\u0027s Natural Apothecary (Havl\u00edk N\u00e1rodn\u00ed Apot\u00e9ka - Castle Steps)", "transport": "Take Metro Line A to Malostransk\u00e1 station, then walk up the Castle Steps for about 8 minutes."}, {"address": "Loret\u00e1nsk\u00e1 13, 118 00 Praha 1 - Hrad\u010dany", "feature": ", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station, then walk to Hrad\u010dansk\u00e9 Square (Hrad\u010dansk\u00e9 n\u00e1m\u011bst\u00ed)."}], "name": "Must-Buy Unique Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Zamenhofova 440, 108 00 Praha 10-\u0160t\u011brboholy", "feature": "\u2b50 4.5 stars | Must-buy list: Botanicus limited edition fragrance gift sets, Karl Lagerfeld discounted bags, Alpine Pro outdoor windproof jackets. As the largest outlet shopping center in the Czech Republic, this outlet village is located about 30 minutes by drive from Prague city center. It brings together over 200 international and local Czech brands, offering year-round discounts of 30% to 70%. For tourists, not only can you buy major international brands like Karl Lagerfeld and Nike at bargain prices, but you can also treasure-hunt local high-tech outdoor brand Alpine Pro and Czech fragrance brands. Featuring on-site tax refund services and a spacious, comfortable shopping environment, it\u0027s an unmissable shopping paradise when visiting Prague.", "name": "Fashion Arena Prague Outlet", "transport": "Take Metro Line A to Depo Hostiva\u0159 station, then transfer to the dedicated free shuttle bus directly to the outlet."}, {"address": "Ke Kopanin\u011b 421, 252 67 Tuchom\u011b\u0159ice", "feature": "\u2b50 4.4 stars | Must-buy list: Bohemia Crystal stemware, Hugo Boss suit jackets, Adidas classic running shoes. POP is Prague\u0027s newest and most luxurious indoor outlet shopping center, located about 20 minutes\u0027 drive from the Prague Castle area. It is ideal for visiting before departure or after exploring the castle area. Designed with an indoor street layout, it features numerous classic vintage cars and artworks, resembling a miniature exhibition hall. Besides major international brands like Hugo Boss and Lacoste, you can also purchase high-quality Bohemian crystal and local crafts. Completely weatherproof all day long, it offers a superb shopping experience.", "name": "Premium Outlet Prague Airport (POP)", "transport": "Transfer from Metro Line A N\u00e1dra\u017e\u00ed Veleslav\u00edn station to Bus 319 or 322, and get off at Tuchom\u011b\u0159ice, POP station."}, {"address": "Ji\u0159sk\u00e1 3, 119 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.6 stars | Must-buy list: Lobkowicz private estate red wine, Beethoven manuscript facsimile souvenirs, hand-painted aristocratic porcelain sets. Located within the only privately owned palace in the Prague Castle complex, the Lobkowicz Palace Shop is the most elegant and unique luxury gift destination in the castle area. The boutique offers many exclusively licensed items from the Lobkowicz family, including fine wines from their centuries-old winery, facsimile copies of sheet music by Mozart and Beethoven, and exquisite handmade Bohemian ceramics. Steeped in noble heritage, it is the top choice for picking up iconic and collectible souvenirs.", "name": "Lobkowicz Palace Shop", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station, then walk about 8 minutes into the Prague Castle complex."}, {"address": "Z\u00e1meck\u00e9 schody 188/6, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.3 stars | Must-buy list: Hand-carved crystal whisky glasses, Bohemian colored crystal vases, exquisite handmade crystal accessories. Situated next to the Castle Steps, this luxury crystal shop showcases the pinnacle of Czech national-treasure Bohemian glass and crystal craftsmanship. The shop displays a wide array of crystal products ranging from traditional cut crystal to avant-garde modern designs, each radiating brilliant luster. Local artisans utilize centuries-old glassblowing and hand-cutting techniques to create unique works of art. The shop also provides reliable international shipping and shockproof packaging, allowing visitors to bring elegant Czech crystal home stress-free.", "name": "Bohemia Crystal Castle Shop", "transport": "Take Tram 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk up the Castle Steps (Z\u00e1meck\u00e9 schody)."}, {"address": "Z\u00e1meck\u00e9 schody 10, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.7 stars | Must-buy list: Hop nourishing hand cream, Karlovy Vary thermal spring salt skin balm, traditional Czech wooden toys. Manufaktura is the most iconic local natural skincare brand in the Czech Republic, and this shop is nestled right beside the cobblestone steps leading up to Prague Castle. The brand focuses on utilizing traditional Czech natural ingredients such as Czech beer, Czech wine, and Karlovy Vary thermal spring salts, strictly adhering to cruelty-free and natural practices. The interior embodies a cozy, rustic Czech countryside style, and the hop hand cream is an absolute must-buy souvenir full of local charm for anyone visiting the castle area.", "name": "Manufaktura (Z\u00e1meck\u00e9 schody Branch)", "transport": "Take Metro Line A to Malostransk\u00e1 station, then walk about 6 minutes up the Castle Steps."}, {"address": "Hrad\u010dansk\u00e9 n\u00e1m\u011bst\u00ed 12, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.6 stars | Must-buy list: Dead Sea mud handmade soap, rose essential oil facial cleanser, calendula soothing balm. The renowned Czech natural organic cosmetics brand Botanicus has a standalone shop at Castle Square, brimming with rustic organic farm charm. The brand owns its own organic botanical farm, and all products emphasize natural, handmade production. This castle branch offers a remarkably comprehensive product line, ranging from classic handmade soaps to premium face creams. Staff are available to provide product descriptions in Traditional Chinese, making it immensely popular among Asian travelers and a top hotspot for purchasing high-quality natural skincare products when visiting the castle.", "name": "Botanicus Hrad\u010dany Shop", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station, then walk about 3 minutes to Hrad\u010dany Square."}, {"address": "Ke Hradu 7, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.4 stars | Must-buy list: Czech blood-red garnet silver rings, Bohemian garnet pendant necklaces, vintage metal brooches. Located in the castle district, this specialty garnet gallery specializes in the Czech Republic\u0027s unique national gemstone\u2014blood-red Czech garnet (Gran\u00e1t). Czech garnets are world-renowned for their deep, rich pigeon-blood red hue and brilliant luster. The gallery displays exquisite jewelry ranging from 19th-century vintage styles to modern minimalist designs. Every authentic piece comes with an official certificate of origin to guarantee natural authenticity, making it the premier spot for choosing a keepsake that retains value and Czech cultural significance.", "name": "Galerie Garnet Hrad\u010dany (Czech Garnet Gallery)", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station, then walk about 5 minutes to arrive."}, {"address": "Loret\u00e1nsk\u00e1 9, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.8 stars | Must-buy list: Hand-painted Krtek (Little Mole) wooden puppets, traditional handmade rocking horses, Czech wooden nutcrackers. Tucked away near the Loreto Church in the castle district, this handmade puppet and toy shop is the most whimsical and authentic local craft boutique in the area. Czech marionettes and wooden toys hold a centuries-old cultural heritage status, and the store is filled with puppets, vintage toys, and exquisite music boxes handcrafted and painted by veteran local artisans. Among them, wooden merchandise featuring the iconic Czech cartoon character \u0027Krtek\u0027 (The Little Mole) is exceptionally popular, beloved by collectors and families with children worldwide.", "name": "Rocking Horse Toy Shop", "transport": "Take Tram 22 to Poho\u0159elec station, then walk along Loret\u00e1nsk\u00e1 street for about 4 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "\u57ce\u5821\u5340 (Hrad\u010dany)"}, "jewish_quarter": {"categories": {"cat_1": {"items": [{"address": "J\u00e1chymova 26/2, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | Must-Buy List: 3-Minute Morning Miracle Mask, Organic Herbal Healing Balm, Royal Jelly \u0026 Propolis Serum. A natural herbal cosmetics brand founded in the Czech Republic, continuing the classic formulations of 19th-century pharmacist Dr. Havl\u00edk, emphasizing 100% organic botanical extracts. Located on the edge of the Jewish Quarter, the store exudes a vintage pharmacy ambiance where staff offer highly professional skin consultations. It\u0027s the top local cosmetics choice when visiting Prague.", "name": "Havl\u00edk\u0027s Natural Apothecary (Havl\u00edkova p\u0159\u00edrodn\u00ed apot\u00e9ka - J\u00e1chymova)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 2-minute walk."}, {"address": "\u0160irok\u00e1 12/21, 110 00 Josefov, Czechia", "feature": "\u2b50 4.5 stars | Must-Buy List: Beer Nourishing Shampoo, Dead Sea Salt Repair Hand Cream, Czech Wine Polyphenol Skincare Range. Manufaktura is an iconic local Czech natural cosmetics brand. Located on a central street in the Jewish Quarter, this store seamlessly blends famous Czech beer culture with skincare. Products utilize local natural ingredients like Czech beer, wine, and thermal spring salts, offering gentle formulas in elegant packaging\u2014perfect for souvenirs.", "name": "Manufaktura Jewish Quarter Branch (Manufaktura \u0160irok\u00e1)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, walk along 17. listopadu street and turn onto \u0160irok\u00e1 street, about a 3-minute walk."}, {"address": "T\u00fdn 3/1049, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | Must-Buy List: Dead Sea Mud Handmade Soap, Natural Rose Water Hydrating Mist, Calendula Healing Balm. Just a few steps from the Jewish Quarter, Botanicus\u0027 flagship store is a treasure trove of Czech organic aromatherapy and beauty products. Owning its own organic farm, the brand insists on handmade soaps and essential oil items. With Chinese-speaking staff available and hassle-free tax refund services on-site, it\u0027s a shopping paradise you shouldn\u0027t miss near the Jewish Quarter.", "name": "Botanicus Flagship Store (Botanicus T\u00fdn Unic)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, walk through Old Town Square, about 5 minutes on foot."}, {"address": "\u0160irok\u00e1 16, 110 00 Josefov, Czechia", "feature": "\u2b50 4.3 stars | Must-Buy List: Dermacol Legendary Concealer, Herbal Body Lotion, Locally Produced Vitamin Skincare. Deeply rooted in the Jewish Quarter for years, this traditional pharmacy sells professional medicines as well as classic Czech makeup and dermo-cosmetics. Here, you can find the legendary Czech makeup brand Dermacol at very affordable prices alongside European medical-grade skincare, attracting locals and savvy travelers alike.", "name": "L\u00e9k\u00e1rna U Matky Bo\u017e\u00ed Josefov (Pharmacy at the Mother of God)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk along \u0160irok\u00e1 street, about a 3-minute walk."}, {"address": "Koste\u010dn\u00e1 122/3, 110 00 Josefov, Czechia", "feature": "\u2b50 4.8 stars | Must-Buy List: Rose Water, Natural Calendula Face Cream, Classic Scented Dusting Powder. Originating from Florence as the world\u0027s oldest apothecary, Santa Maria Novella opened an exquisite boutique in a prime location within Prague\u0027s Jewish Quarter. It offers premium natural botanical skincare and fragrances crafted with centuries-old recipes. The elegant interior fills the air with enchanting herbal aromas, making it an excellent choice for those seeking high-quality organic skincare and refined scents.", "name": "Santa Maria Novella Prague", "transport": "Take Tram 17 or 18 to Pr\u00e1vnick\u00e1 fakulta Station, about a 3-minute walk."}, {"address": "Kaprova 13/14, 110 00 Josefov, Czechia", "feature": "\u2b50 4.2 stars | Must-Buy List: Nuance Czech Premium Anti-Aging Serum, Kneipp Herbal Bath Oil, La Roche-Posay Repair Cream. Dr. Max is the largest pharmacy and drugstore chain in the Czech Republic, and this branch at the gateway to the Jewish Quarter boasts a comprehensive selection. It exclusively carries Nuance, a high-end local Czech herbal cosmetic brand focused on botanical anti-aging active ingredients. Priced much lower than major international luxury brands, it comes highly recommended by local women.", "name": "Dr. Max Pharmacy (Dr. Max L\u00e9k\u00e1rna Kaprova)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, right outside Exit 1."}, {"address": "Pa\u0159\u00ed\u017esk\u00e1 12, 110 00 Josefov, Czechia", "feature": "\u2b50 4.4 stars | Must-Buy List: Czech Niche Perfumes, Top European Organic Anti-Aging Serums, High-End Botanical Skincare Oils. Located on the famous Pa\u0159\u00ed\u017esk\u00e1 Street in the Jewish Quarter, this is a Czech luxury beauty and fragrance boutique chain. Beyond top international beauty brands, it specially curates exclusive niche fragrances and premium natural skincare brands from the Czech Republic and Central Europe. Staff are friendly, and the store frequently offers generous gifts with purchase and discounts.", "name": "FAnn Parfumerie Pa\u0159\u00ed\u017esk\u00e1", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk along Pa\u0159\u00ed\u017esk\u00e1 Street, about a 2-minute walk."}, {"address": "Pa\u0159\u00ed\u017esk\u00e1 22, 110 00 Josefov, Czechia", "feature": "\u2b50 4.5 stars | Must-Buy List: Dead Sea Mineral Salt Exfoliating Scrub, Botanical Hydrosol Lip Balm, Organic Rosehip Repair Oil. Sefiros is an emerging Czech natural mineral and organic skincare brand, featuring restorative products powered by Dead Sea minerals and natural herbal extracts. This branch in the Jewish Quarter offers a comfortable hands-on experience space with chemical-free formulas and transparent, affordable prices\u2014a local insider recommendation loved by young women for purchasing natural cosmetics.", "name": "Sefiros Organic Beauty Pa\u0159\u00ed\u017esk\u00e1", "transport": "Take Tram 17 to Starom\u011bstsk\u00e1 Station, about a 3-minute walk."}], "name": "Local Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "Ve V\u011bze\u0148sk\u00e9 1073/6, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.8 stars | Must-buys: Printed dresses by emerging Czech designers, minimalist handmade genuine leather crossbody bags, independent brand metallic jewelry. Hidden in a quiet alley of the Jewish Quarter, Kur\u00e1tor is a highly acclaimed independent select store in the Czech fashion world. The founders carefully curate limited-edition apparel, footwear, and accessories from young Czech and European designers. Quantities are very limited, ensuring unique finds that stand out. The interior is minimalist and elegant, showcasing original designs that blend contemporary art with practical functionality. Local trendsetters and fashion editors frequently visit to discover one-of-a-kind pieces.", "name": "Kur\u00e1tor Design Select Shop (Kur\u00e1tor)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 6 minutes; or take Tram 17 to Pr\u00e1vnick\u00e1 fakulta station and walk for about 4 minutes."}, {"address": "\u017dateck\u00e1 14/1, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.7 stars | Must-buys: Rabbit fur fedoras crafted with centuries-old artistry, French wool berets, high-end handmade wide-brim sun hats. TONAK is a national-treasure Czech hatmaker with over 200 years of history. Its flagship store in the Jewish Quarter showcases the finest traditions of artisanal hatmaking. Using premium wool and rabbit fur felt, the store offers everything from classic vintage dress hats and fedoras to chic women\u0027s berets. Offering professional head-measuring and fitting consultations, it is a must-visit for travelers seeking a hat with classic European craftsmanship and enduring quality.", "name": "TONAK Flagship Store", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 3 minutes."}, {"address": "Dlouh\u00e1 137/9, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | Must-buys: Impeccably tailored silk shirts, premium wool-blend blazers, minimalist genuine leather clutches. Kl\u00e1ra Nademl\u00fdnsk\u00e1 is one of the most prominent and iconic female fashion designers in the Czech Republic. Having worked in Paris for years, she seamlessly blends French elegance with modern Czech style. Located on Dlouh\u00e1 Street near the edge of the Jewish Quarter, this high-end womenswear boutique offers sharply structured clothing and accessories made from exquisite materials. A favorite among Czech elites and female entrepreneurs, each season\u0027s limited-edition collection perfectly exudes urban female confidence and elegance.", "name": "Kl\u00e1ra Nademl\u00fdnsk\u00e1 Boutique", "transport": "Take Tram 6, 8, 15, or 26 to Dlouh\u00e1 t\u0159\u00edda station and walk for about 3 minutes; or walk about 7 minutes from Metro Line A Starom\u011bstsk\u00e1 station."}, {"address": "\u0160irok\u00e1 96/6, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.9 stars | Must-buys: Handmade Czech genuine leather briefcases, premium dress shoe care kits, British-style pure wool blazers. Located on \u0160irok\u00e1 Street in the Jewish Quarter, Gentleman Store is a shopping paradise for discerning gentlemen in Prague. Focusing on high-quality men\u0027s clothing, footwear, and accessories, the shop curates top independent menswear brands from the Czech Republic and Europe. With an elegant and luxurious atmosphere, it offers personalized styling advice and professional fitting services. Its handcrafted leather bags and refined leather shoes showcase unmatched detail and durability.", "name": "Gentleman Store", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 2 minutes."}, {"address": "Ha\u0161talsk\u00e1 756/21, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.7 stars | Must-buys: Custom couture jeans, statement structured jackets, minimalist geometric dresses. CHATTY is a high-end womenswear brand founded by Czech designers Anna Tu\u0161kov\u00e1 and Radka Sirkov\u00e1, making a name for itself in the international fashion scene with distinctive, high-quality couture denim. Located near the Jewish Quarter, this concept store offers leather accessories and clothing featuring flawless tailoring combined with street-style flair. Local fashionistas highly praise the substantial feel of their denim fabric and unique silhouette lines.", "name": "CHATTY Designer Denim \u0026 Womenswear (CHATTY)", "transport": "Take Tram 17 to Dlouh\u00e1 t\u0159\u00edda station or Pr\u00e1vnick\u00e1 fakulta station, then walk for about 5 minutes."}, {"address": "V\u011bze\u0148sk\u00e1 910/2, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.8 stars | Must-buys: Classic geometric minimalist leather backpacks, versatile genuine leather belt bags, textured leather bifold wallets. PBG Studio is one of the hottest contemporary independent handbag and accessory brands in the Czech Republic, renowned for its minimalist aesthetic and flawless craftsmanship. All leather goods on display are handcrafted locally in the Czech Republic using premium Italian and European leather, featuring clean lines and high functionality. The Jewish Quarter store boasts a minimalist industrial design, attracting young professionals and travelers who appreciate understated, high-quality leather pieces.", "name": "PBG Studio Minimalist Leather Goods (PBG Studio)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 5 minutes."}, {"address": "Du\u0161n\u00ed 8, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.6 stars | Must-buys: Asymmetrical cut designer dresses, stylish wool coats, premium leather handbags. Pavel Brejcha is a pioneering designer in the Czech fashion industry who previously worked for major international luxury houses. His atelier and boutique are located on Du\u0161n\u00ed Street in the Jewish Quarter, creating clothing specifically for women who appreciate unique taste and sculpted cuts. Combining avant-garde geometric lines with luxury fabrics, his limited-edition shoes, bags, and accessories are highly favored by Prague\u0027s art and fashion elite.", "name": "Pavel Brejcha Atelier", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 4 minutes."}, {"address": "Pa\u0159\u00ed\u017esk\u00e1 20, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.5 stars | Must-buys: Limited-edition designer handbags from top global brands, high-end designer sneakers, couture-style fashion accessories. Situated on Pa\u0159\u00ed\u017esk\u00e1 Street in the Jewish Quarter, Simple Concept Store is Prague\u0027s premier luxury select shop. The boutique features a curated collection of footwear, bags, and fashion from top international fashion houses and luxury independent designers. Beyond its comprehensive luxury collection, the interior is modern and lavish, blending retail shopping with gallery-like exhibition space\u2014a must-visit landmark on the Jewish Quarter luxury shopping trail.", "name": "Simple Concept Store", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 4 minutes."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "\u0160irok\u00e1 11, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.6 stars | Must-Buy List: Beer Hydrating Hand Cream, Cranberry Soothing Bath Salt, Beer Shampoo. Manufaktura is the most iconic local natural cosmetics brand in the Czech Republic, focusing on using local Czech beer, wine, and natural mineral salts as ingredients. This branch is located in the luxury shopping street of the Jewish Quarter, featuring a strong Bohemian rustic style. The best-selling Beer Series has an elegant malt fragrance that is subtle and pleasant. Beautifully packaged and reasonably priced, it is the top souvenir choice for tourists to bring home for friends and family.", "name": "Manufaktura - \u0160irok\u00e1 (Jewish Quarter)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 3-minute walk."}, {"address": "T\u00fdn 3/1049, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Must-Buy List: Dead Sea Mud Handmade Soap, Rose Water Hydrating Spray, Calendula Repair Balm. Botanicus is an internationally renowned Czech organic fragrance and beauty brand, with all raw materials harvested from organic farms and cold-pressed traditionally. Located in T\u00fdn Courtyard at the edge of the Jewish Quarter, this branch is fully stocked and offers shopping guide assistance in Traditional Chinese. The popular Dead Sea Mud Soap excels at oil control and exfoliation, while the Rose Water is a top-selling hydrating Holy Grail\u2014an absolute must-stock item when visiting the Czech Republic.", "name": "Botanicus - T\u00fdn Courtyard", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 5-minute walk."}, {"address": "U Star\u00e9 \u0161koly 141/1, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.4 stars | Must-Buy List: Menorah metal ornaments, Kafka limited-edition creative mugs, traditional Jewish hand-painted ceramics. Located near the Maisel Synagogue, this official gift shop is rich in historical context and Jewish cultural features. The store sells various meticulously crafted Jewish cultural handicrafts and hardcover history books. Metal ornaments and exquisite keychains featuring classic Jewish symbols like the Star of David and the Menorah hold high cultural collectible value and sentimental souvenir meaning.", "name": "Jewish Museum in Prague Gift Shop", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 4-minute walk."}, {"address": "\u0160irok\u00e1 65/14, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.7 stars | Must-Buy List: Kafka \u0027The Metamorphosis\u0027 hardcover postcards, classic portrait tote bags, retro Czech literature bookmarks. An independent bookstore that literature lovers visiting the Jewish Quarter must not miss. The literary giant Franz Kafka was born in the Jewish Quarter, and this bookstore offers his classic works in multiple languages alongside related creative goods. The shop translates literary imagery into high-quality items; the tote bags are sturdy and elegantly designed, making them perfect for artistic travelers.", "name": "Franz Kafka Bookstore \u0026 Souvenir Shop (Knihkupectv\u00ed Franz Kafka)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 3-minute walk."}, {"address": "Maiselova 5, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.8 stars | Must-Buy List: Czech cinnamon-spiced almond chocolate, Charles Bridge dark chocolate gift box, Prague skyline cocoa beans. This top-tier Czech handmade chocolate brand combines Bohemian traditional flavors with modern luxury packaging. The branch on Maiselova Street features exquisite packaging printed with Prague landmarks and Jewish Quarter scenery. Filled with crunchy nuts and rich cocoa butter, every bite bursts with rich cinnamon and nutty aromas\u2014a refined dessert gift with authentic local charm.", "name": "Steiner \u0026 Kovarik Fine Handmade Chocolate - Maiselova", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 2-minute walk."}, {"address": "Maiselova 17, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.3 stars | Must-Buy List: Hand-cut Bohemian crystal whiskey glasses, Czech natural blood-red garnet brooches, vintage hand-painted floral porcelain boxes. An independent antique gift shop located in the heart of the Jewish Quarter, specializing in world-renowned Czech Bohemian crystal and natural garnet jewelry. The crystal crafts inside are exquisite and translucent with brilliant light refraction, while the traditional garnet jewelry is delicate and classic. Every piece comes with an original quality certificate, making it perfect as a cherished family heirloom or keepsake.", "name": "Antique Shop Maiselova \u0026 Bohemian Crystal", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 3-minute walk."}, {"address": "Koz\u00ed 918/1, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Must-Buy List: Traditional Jewish Challah bread, handmade chocolate oat cookies, traditional cinnamon rolls. A famous independent bakery on the edge of the Jewish Quarter, renowned for its fully handmade, naturally fermented breads and European pastries that draw crowds of locals and tourists daily. The traditional Jewish Challah is fluffy and subtly sweet, pairing perfectly with their packaged gourmet nut cookie gift boxes\u2014an ideal spot to taste local dessert culture and pick up delicious edible gifts.", "name": "Bakeshop Prague", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 6-minute walk."}, {"address": "J\u00e1chymova 63/3, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.6 stars | Must-Buy List: Hand-carved clown string puppets, Franz Kafka marionettes, classic witch decorative puppets. Puppetry has a long history in the Czech Republic. Tucked in an alleyway of the Jewish Quarter, this specialty shop features beautifully designed puppets handcrafted by veteran local artisans. Each puppet\u0027s facial expression is hand-painted, brimming with vitality and collectible value. The exquisite Kafka-shaped puppet in particular showcases the unique geographic character of the Jewish Quarter, making it a must-buy Bohemian handicraft.", "name": "Marionettes Shop Josefov", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 2-minute walk."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Zamenhofova 440, 108 00 Praha 10, Czech Republic", "feature": "\u2b50 4.3 stars | Must-Buy List: Bohemia Crystal wine glasses, Botanicus Rose Essential Oil Soap, discounted Tommy Hilfiger casual wear. This is the largest outlet center in the Czech Republic, located about a 30-minute drive from downtown Prague. Housing over 200 international and local Czech brands, it offers year-round discounts from 30% to 70%. Tourists can buy famous Czech skincare products and crystal crafts all in one place while enjoying highly competitive prices on international luxury goods, making it a must-visit shopping paradise in Prague.", "name": "Fashion Arena Prague Outlet", "transport": "Take Metro Line A to Depo Hostiva\u0159 Station, then transfer to the free Outlet Shuttle Bus directly to the venue."}, {"address": "Ke Kopanin\u011b 421, 252 67 Tuchom\u011b\u0159ice, Czech Republic", "feature": "\u2b50 4.4 stars | Must-Buy List: Karl Lagerfeld discounted leather goods, Bohemia Crystal vases, TUMI lightweight suitcases. Built in the architectural style of Prague\u0027s Old Town, this indoor outlet center boasts a comfortable and elegant atmosphere. Located just a 5-minute drive from Prague Airport, it is perfect for a final shopping spree before departure. Featuring numerous luxury apparel and lifestyle brands, as well as instant tax-free refund services and luggage check-in consultation, it offers ultimate shopping convenience.", "name": "Premium Outlet Prague Airport (POP Airport)", "transport": "From Prague city center, take Metro Line A to N\u00e1dra\u017e\u00ed Veleslav\u00edn Station, then transfer to Bus 312 or 322 and get off at POP Airport Station."}, {"address": "\u0160irok\u00e1 12, 110 00 Praha 1-Josefov, Czech Republic", "feature": "\u2b50 4.6 stars | Must-Buy List: Beer soothing hand cream, Thermal Spring Salt nourishing shower gel, Dead Sea mud anti-aging face cream. Manufaktura is one of the most iconic local Czech natural skincare and lifestyle brands. Deeply rooted in traditional Czech Spa culture, its core ingredients feature Karlovy Vary thermal spring salt and local Czech hops. The Josefov (Jewish Quarter) branch boasts a cozy retro Czech countryside vibe, with friendly staff offering product testers. With all-natural ingredients and beautifully packaged goods, it\u0027s ideal for souvenir shopping.", "name": "Manufaktura Josefov", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 3 minutes."}, {"address": "Ovocn\u00fd trh 19, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czech Republic", "feature": "\u2b50 4.5 stars | Must-Buy List: Czech Cubist ceramic mugs, retro geometric vases, 20th-century Czech design posters. Located near the Jewish Quarter, Kubista is a unique independent boutique showcasing and selling early 20th-century Czech Cubism and Art Deco design pieces. All products are handmade in limited quantities by local Czech artists and artisans, faithfully recreating the country\u0027s unique geometric aesthetic design. It is a creative design shop well worth collecting from.", "name": "Kubista Design Shop", "transport": "Take Metro Line A or B to M\u016fstek Station, then walk for about 5 minutes."}, {"address": "Platn\u00e9\u0159sk\u00e1 88/9, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czech Republic", "feature": "\u2b50 4.7 stars | Must-Buy List: Prague prints hand-drawn by Czech illustrators, organic cotton geometric tote bags, Prague skyline architectural mugs. Pragtique is a local Czech independent concept store that rejects cheap mass-produced souvenirs, partnering instead with young Czech illustrators and designers. The items transform classic architectural lines from Prague\u0027s Jewish Quarter and Old Town into modern, stylish graphic designs printed on high-quality lifestyle items. A must-visit shop for travelers who appreciate artistic quality and original designs.", "name": "Pragtique Design Shop", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 2 minutes."}, {"address": "T\u00fdn 3/1049, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czech Republic", "feature": "\u2b50 4.6 stars | Must-Buy List: Dead Sea Mud \u0026 Cucumber Handmade Soap, Rose Essential Oil Face Cream, Calendula Healing Balm. Botanicus is an internationally renowned Czech natural organic skincare brand that insists on using raw materials grown on its own organic farm in the Czech Republic, making products entirely by hand. Located near the Jewish Quarter, this flagship store offers a complete product line ranging from signature facial soaps and floral waters to essential oils. Free of artificial additives, gentle, and offering great value, it is a holy-grail Czech brand favored by many tourists.", "name": "Botanicus Shop", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 6 minutes."}, {"address": "Pa\u0159\u00ed\u017esk\u00e1 ulice, 110 00 Praha 1-Josefov, Czech Republic", "feature": "\u2b50 4.6 stars | Must-Buy List: Czech Garnet fine jewelry, local luxury leather goods, top-tier hand-cut Bohemian crystal glassware. Located in the heart of the Jewish Quarter, Pa\u0159\u00ed\u017esk\u00e1 Street is Prague\u0027s most famous luxury shopping boulevard. Lined with century-old Art Nouveau historic buildings, it brings together world-renowned top luxury brands along with local Czech high-end jewelry and garnet artisan shops. Shopping here not only offers top-tier service but also lets you soak in the sophisticated Bohemian aristocratic elegance.", "name": "Pa\u0159\u00ed\u017esk\u00e1 Shopping Street", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, and walk 1 minute after exiting the station to reach Pa\u0159\u00ed\u017esk\u00e1 Street."}, {"address": "Na P\u0159\u00edkop\u011b 859/22, 110 00 Praha 1-Nov\u00e9 M\u011bsto, Czech Republic", "feature": "\u2b50 4.3 stars | Must-Buy List: Traditional Czech craft beer gift sets, traditional Czech wooden handcrafted toys, local designer scented candles. Slovansk\u00fd D\u016fm is a sophisticated historic shopping complex adjacent to the Jewish Quarter, seamlessly blending heritage architecture with modern fashion. Inside, the mall features an elegant courtyard garden, boutique shops, unique specialty stores, and a cinema. Offering a touch more elegance and tranquility than massive commercial malls, it is a comfortable spot to pick out high-quality local Czech handmade crafts and refined gifts.", "name": "Slovansk\u00fd D\u016fm Shopping Center", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky Station, then walk for about 3 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "\u7336\u592a\u5340 (Josefov)"}, "lesser_town": {"categories": {"cat_1": {"items": [{"address": "Mosteck\u00e1 17, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.6 stars | Must-Buys: Brewer\u0027s Yeast Shampoo, Grape Seed Lightweight Face Oil, Wild Rose Hydrating Hand Cream. Manufaktura is the most iconic local eco-friendly beauty brand in the Czech Republic, known for using natural local ingredients like Czech beer, thermal spring water, and wine. Located next to Charles Bridge, this Lesser Town shop features charming, antique wooden decor. Its best-selling Beer Shampoo, rich in Vitamin B complex and hop extracts, adds volume and shine to hair, making it a top pick for souvenir hunters.", "name": "Manufaktura - Lesser Town Branch (Manufaktura - Mosteck\u00e1)", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk for about 3 minutes."}, {"address": "Nerudova 221/9, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.7 stars | Must-Buys: 3-Minute Morning Express Mask (Rann\u00ed maska), Organic Royal Jelly Ointment, Organic Herbal Lip Balm. Inheriting traditional recipes from 19th-century Czech organic herbalist PhMr. Karel Havl\u00edk, this apothecary is famous for pure fers a complete range of Czech natural botanical skincare products and traditional wooden handicrafts.", "name": "Manufaktura Flagship Store Mal\u00e1 Strana", "transport": "Take Tram 12, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed Station, then walk for about 2 minutes."}, {"address": "U Lu\u017eick\u00e9ho semin\u00e1\u0159e 82/22, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.3 stars | Must-Buy List: Classic Bohemian plaster statuettes, vintage Czech posters \u0026 art books, handmade leather journals. A high-quality local cultural \u0026 creative boutique store near Kampa Island in Mal\u00e1 Strana. Displaying and selling traditional Czech handicrafts and contemporary art spin-offs, it is an excellent spot for finding unique, high-quality local souvenirs.", "name": "Art \u0026 Antiques Gallery Kampa", "transport": "Take Tram 12, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed Station, then walk for about 4 minutes."}, {"address": "Nerudova 23, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.8 stars | Must-Buy List: Moser classic crystal whiskey glasses, colorful handcrafted crystal plates, engraved crystal vases. Known as the \u0027King of Crystal,\u0027 premier Czech luxury crystal brand Moser presents a specialty store in Mal\u00e1 Strana. The luxurious showroom showcases centuries of master glass craftsmanship and exclusive designs.", "name": "Moser Glass Shop Mal\u00e1 Strana", "transport": "Take Tram 12, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed Station, then walk along Nerudova Street for about 3 minutes."}, {"address": "Nerudova 47, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.6 stars | Must-Buy List: Handcrafted wooden Pinocchio puppets, vintage clown marionettes, traditional Czech handmade wooden music boxes. Located on the famous sloping Nerudova Street in Mal\u00e1 Strana, this boutique workshop specializes in centuries-old traditional Czech handmade marionettes and crafts\u2014a perfect represe \u2b50 4.7 stars | Must-buy list: 3-Minute Morning Mask (3-minutov\u00e1 rann\u00ed maska), Organic Royal Jelly Miracle Cream, Lip Balm. Inheriting organic herbal recipes from renowned Czech pharmacist Havl\u00edk, this brand focuses on chemical-free products made from organic plants and bee products. Located inside the Quadrio Shopping Center in New Town, this counter offers a full testing experience. Its flagship \u00273-Minute Morning Mask\u0027 rapidly hydrates and brightens the skin with a delightful natural herbal aroma, making it a favorite among locals and tourists alike.", "name": "Havl\u00edkova P\u0159\u00edrodn\u00ed Apot\u00e9ka - OC Quadrio", "transport": "Take Metro Line B or tram 2, 9, 18, or 22 to N\u00e1rodn\u00ed t\u0159\u00edda station. Located on the 1st floor of the shopping center directly above the metro station."}, {"address": "Sp\u00e1len\u00e1 2121/22, 110 00 Nov\u00e9 M\u011bsto, Czech Republic", "feature": "\u2b50 4.5 stars | Must-buy list: Extreme High Coverage Foundation (Make-up Cover), 16H 2-in-1 Longlasting Lip Color, Caviar Firming Serum Cream. Dermacol is a legendary Czech national makeup brand founded in the 1960s; its famous high-coverage foundation was even acquired by Hollywood film studios. The flagship store in OC Quadrio offers a full range of makeup and body care products. It has the most complete shade selection, along with exclusive discounts and professional makeup artist consultations on-site. Its high value for money makes it irresistible.", "name": "Dermacol Flagship Store OC Quadrio", "transport": "Take Metro Line B to N\u00e1rodn\u00ed t\u0159\u00edda station; it is located inside the Quadrio Shopping Center right outside the exit."}, {"address": "Na P\u0159\u00edkop\u011b 1096/19, 110 00 Nov\u00e9 M\u011bsto, Czech Republic", "feature": "\u2b50 4.4 stars | Must-buy list: Dead Sea Mud \u0026 Calendula Handmade Soap, Rose Essential Oil Hydrosol, Dead Sea Mud \u0026 Cucumber Soap. Botanicus is an internationally renowned Czech organic skincare brand operating its own organic farm. Compared to the crowded main store in the Old Town, this branch located inside the Myslbek shopping gallery on Na P\u0159\u00edkop\u011b street offers a much quieter and more comfortable shopping experience without long queues. The store sells a wide variety of handmade soaps and skincare products infused with natural essential oils that leave skin soft and un-tight, making them ideal souvenirs.", "name": "Botanicus Myslbek Shopping Gallery", "transport": "Take Metro Line B to M\u016fstek station, then walk along Na P\u0159\u00edkop\u011b street for about 3 minutes to reach Myslbek Shopping Gallery."}, {"address": "N\u00e1m\u011bst\u00ed Republiky 656/8, 110 00 Nov\u00e9 M\u011bsto, Czech Republic", "feature": "\u2b50 4.6 stars | Must-buy list: Saloos Hemp Soothing Oil, Nobilis Tilia Aromatherapy Face Cream, CPK Certified Organic Lip Balm. Biooo is the largest organic and natural drugstore chain in the Czech Republic, curated with select organic brands from the Czech Republic and Europe. Located inside the Kotva Department Store in New Town, this shop is perfect for buying local top-tier aromatherapy and natural brands like Saloos and Nobilis Tilia in one stop. Clear product labeling and ingredient consultation are available, allowing you to discover affordable herbal holy grails known mainly to local insiders.", "name": "Biooo.cz - OD Kotva", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station or tram 6, 8, 15, or 26 to the same-named tram stop. Located inside Kotva Department Store."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 813/57, 110 00 Nov\u00e9 M\u011bsto, Czech Republic", "feature": "\u2b50 4.3 stars | Must-buy list: Cannaderm Hemp Joint Relief Balm, Alpa Herbal Liniment (Francovka), Astrid Beeswax Lip Balm. Dr. Max is the largest pharmacy chain in the Czech Republic. Beyond prescription drugs, it is the best place to hunt for traditional Czech home cosmetics and therapeutic ointments. Located right on Wenceslas Square, this massive store has an extensive inventory. Here you can buy household staples like Alpa herbal liniment and Cannaderm hemp skincare products designed for dry skin and muscle relief, all at very affordable prices.", "name": "Dr. Max L\u00e9k\u00e1rna V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed", "transport": "Take Metro Line A or C to Muzeum station, then walk along Wenceslas Square for about 2 minutes after exiting."}, {"address": "Vodi\u010dkova 704/36, 110 00 Nov\u00e9 M\u011bsto, Czech Republic", "feature": "\u2b50 4.2 stars | Must-buy list: Dermacol Rose Skin Care Oil, FAnn Exclusive Czech Perfume, Czech Herbal Repairing Serum. FAnn is a well-known local Czech boutique beauty and fragrance store chain. This location on Vodi\u010dkova Street in New Town curates premium local Czech cosmetics and fragrances alongside major international brands. Featuring an elegant ambiance, the staff offers personalized scent testing and skin consultations. Highly recommended if you are seeking exquisite perfumes and skincare items infused with unique Czech flair.", "name": "FAnn Parfumerie Vodi\u010dkova", "transport": "Take tram 3, 5, 6, 9, 14, or 24 to Vodi\u010dkova station."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 800/51, 110 00 Nov\u00e9 M\u011bsto, Czech Republic", "feature": "\u2b50 4.4 stars | Must-buy list: Bione Cosmetics Goat Milk Moisturizer, Rival de Loop Ampoule Serum Capsules, Astrid Sunflower Sunscreen. Situated in the heart of Wenceslas Square, dm is a beloved drugstore chain in Central Europe. Although a German chain, Czech locations carry plenty of affordable local Czech cosmetics and beauty brands such as Bione Cosmetics (focusing on natural plants and goat\u0027s milk) and Astrid. With fast turnover and a comprehensive selection, it is a great shopping spot for budget travelers wanting to try high-value local Czech skincare.", "name": "dm drogerie markt V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed", "transport": "Take Metro Line A/C to Muzeum station or Line A/B to M\u016fstek station; located in the middle section of Wenceslas Square."}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "V\u00e1clavsk\u00e9 n\u00e1m. 774/6, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic men\u0027s leather casual shoes, lightweight cushioned women\u0027s shoes, Czech-exclusive genuine leather handbags. Founded in 1894, Ba\u0165a is a Czech national treasure footwear brand. This seven-story flagship store on Wenceslas Square is an iconic shopping landmark in Prague. The store houses a full product line ranging from affordable everyday footwear to high-end leather craft shoes, making it a favorite spot for both locals and tourists to pick up high-quality, ergonomic, and comfortable shoes.", "name": "Ba\u0165a Flagship Store (Czech Century-Old Shoe King)", "transport": "Take Metro Line A or B to M\u016fstek station, then walk for about 1 minute."}, {"address": "Vodi\u010dkova 704/36, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade wool wide-brim fedoras, elegant French berets, vintage gentleman top hats. With over two centuries of hat-making history, TONAK is one of the few top global brands mastering the complete handcrafting process of rabbit fur and wool felt hats. Located near the Lucerna Passage in New Town, this flagship store showcases the finest Czech craftsmanship. The hats feature exquisite textures, warm practicality, and timeless classic style\u2014an absolute must-buy to elevate your outfit.", "name": "TONAK Flagship Store (Czech Century-Old Premium Hat Shop)", "transport": "Take Tram 3, 5, 6, 9, 14, or 24 to V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 2 minutes."}, {"address": "Mysl\u00edkova 174/5, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.7 stars | Must-Buy List: PBG Studio minimalist leather bags, Braasi Industry waterproof backpacks, local designer handmade jewelry. Located on Mysl\u00edkova Street in New Town, this flagship store is a major hub for contemporary Czech design, curating accessories, clothing, and creative products from emerging local designers. From sleek handmade leather bags to stylish watches and jewelry, every piece showcases fantastic local design aesthetics.", "name": "CZECHDESIGN Shop (Czech Original Design Boutique)", "transport": "Take Tram 5 or 17 to Jir\u00e1skovo n\u00e1m\u011bst\u00ed station, then walk for about 3 minutes."}, {"address": "Jind\u0159i\u0161sk\u00e1 873/26, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Must-Buy List: Czech emerging designer collaboration T-shirts, Nordic minimalist backpacks, independent brand techwear canvas shoes. Freshlabels is a premier local Czech streetwear concept store dedicated to bringing together sustainable, eco-friendly, and uniquely aesthetic clothing, shoes, and bags. The spacious, industrial-chic flagship store in New Town is the top destination for local youth and fashion enthusiasts seeking high-quality urban streetwear and stylish backpacks.", "name": "Freshlabels Flagship Store (Czech Sustainable Streetwear Boutique)", "transport": "Take Metro Line A or C to Muzeum station, or Tram 3, 9, 14, or 24 to Jind\u0159i\u0161sk\u00e1 station, then walk for about 2 minutes."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 832/19, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | Must-Buy List: Genuine tailored leather jackets, soft lambskin warm gloves, Czech handcrafted genuine leather crossbody bags. KARA is an iconic traditional Czech leather wear and accessories brand with decades of experience in crafting high-quality leather goods. Located on a main avenue in New Town, this store offers beautifully tailored leather items that are soft, durable, and highly cost-effective compared to Western European brands, making it a favorite among locals.", "name": "KARA Trutnov (Czech Traditional Leather Clothing \u0026 Fine Bags)", "transport": "Take Metro Line A or B to M\u016fstek station, then walk for about 3 minutes."}, {"address": "Jind\u0159i\u0161sk\u00e1 901/16, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | Must-Buy List: Czech artist graffiti print hoodies, limited-edition collab sneakers, functional trendy fanny packs. Queens is a pioneer in Czech street culture, renowned for curating exclusive limited-edition sneakers and local street fashion. Located in a bustling shopping district in New Town, the store boasts a vibrant atmosphere. Alongside international street brands, it frequently collaborates with local Prague artists on clothing collections\u2014making it a treasure trove for fans of unique urban style.", "name": "Queens Streetwear \u0026 Sneakers (Czech Street Style \u0026 Limited Sneakers)", "transport": "Take Tram 3, 9, 14, or 24 to Jind\u0159i\u0161sk\u00e1 station, then walk for about 1 minute."}, {"address": "N\u00e1rodn\u00ed 1011/28, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.2 stars | Must-Buy List: Structured wool double-breasted coats, slim-fit business blazers, printed genuine leather long wallets. Founded in Prague, Pietro Filipi is a premier fashion brand focused on elegant urban apparel for men and women. Blending European fashion silhouettes with traditional, meticulous Czech tailoring, it uses premium Italian fabrics and fine leather. It is the go-to brand for Prague\u0027s white-collar professionals and elite looking for high-quality formalwear and stylish accessories.", "name": "Pietro Filipi (Czech High-End Fashion \u0026 Urban Wear)", "transport": "Take Metro Line B to N\u00e1rodn\u00ed t\u0159\u00edda station, then walk for about 2 minutes."}, {"address": "Smetanovo n\u00e1b\u0159. 334/4, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | Must-Buy List: Czech sterling silver geometric necklaces, minimalist geometric shoulder bags, exclusive limited-edition tailored dresses. Located along the Vltava riverbank in New Town, Deelive is an artistic, high-end design boutique showcasing and selling works by top Czech fashion designers and accessory artisans. With a focus on originality and unique silhouettes, every bag and garment is produced in limited quantities so you won\u0027t bump into anyone wearing the same thing\u2014making it a perfect shopping destination to express your personal taste.", "name": "Deelive Design Store (Czech Independent Fashion \u0026 Boutique)", "transport": "Take Tram 2, 17, or 18 to Karlovy l\u00e1zn\u011b station, then walk for about 2 minutes."}], "name": "Popular Local Clothing, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "Vodi\u010dkova 31, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.6 stars | Must-Buy List: Czech Hop Hand Cream, Thermal Spring Salt Hydrating Body Lotion, Wild Rose Lip Balm. Manufaktura is the most iconic local natural skincare brand in the Czech Republic. Its shop in New Town is comfortable and fully stocked. The brand highlights Czech brewing traditions and thermal spring resources, crafting beauty products from natural hop extracts and Karlovy Vary spring salts. Naturally relaxing and reasonably priced, it is a top souvenir pick loved by both tourists and locals alike.", "name": "Manufaktura Beauty \u0026 Cosmetics (Manufaktura - Vodi\u010dkova)", "transport": "Take Tram 3, 5, 6, 9, 14, or 24 to V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk about 2 minutes."}, {"address": "Sp\u00e1len\u00e1 2121/22 (Quadrio Mall), 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.7 stars | Must-Buy List: 3-Minute Morning Organic Mask, Miracle Herbal Salve, Royal Luxury Organic Facial Serum. Founded in the Czech Republic, this organic herbal skincare brand adheres to traditional 19th-century apothecary recipes, using ingredients sourced from organic Czech gardens. Their famous \u00273-Minute Morning Mask\u0027 quickly revitalizes skin with a gentle texture and rich herbal aroma. Located in the Quadrio Shopping Center in New Town, the counter offers friendly consultations\u2014a must-visit for travelers prioritizing ingredient quality.", "name": "Havl\u00edk\u0027s Natural Apothecary (Havl\u00edkova p\u0159\u00edrodn\u00ed apot\u00e9ka - Quadrio)", "transport": "Take Metro Line B to N\u00e1rodn\u00ed t\u0159\u00edda station; the shop is inside the Quadrio Mall right outside the station."}, {"address": "Na P\u0159\u00edkop\u011b 26, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.5 stars | Must-Buy List: Wooden Hedgehog Colored Pencil Holder, Magic Rainbow Pencils, Professional Watercolor Pencil Set. Founded in 1790, Koh-i-Noor is a legendary Czech national brand. This branch on Na P\u0159\u00edkop\u011b Street in New Town features a complete range of art supplies and creative stationery. The best-selling hedgehog pencil holder is both practical and decorative, while the magic rainbow pencil creates colorful gradients effortlessly. It\u0027s a wonderful gift for children and stationery enthusiasts.", "name": "Koh-i-Noor Hardtmuth Art \u0026 Stationery (Koh-i-Noor Hardtmuth - Na P\u0159\u00edkop\u011b)", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station, then walk about 3 minutes."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed 834/17, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.4 stars | Must-Buy List: Bohemian Natural Garnet Sterling Silver Ring, Classic Deep Red Garnet Necklace, Garnet Earrings. Bohemian garnets are world-renowned for their deep, blood-red color and pure brilliance. Gran\u00e1t Turnov is the only Czech government-certified cooperative for mining and processing natural garnets. Purchases at this Wenceslas Square store come with an official certificate of authenticity, making it the perfect choice for a authentic Czech souvenir with enduring value.", "name": "Czech Garnet Official Certified Store (Gran\u00e1t Turnov - V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "Take Metro Line A/B to M\u016fstek station, then walk about 1 minute from the exit."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed 846/1, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.8 stars | Must-Buy List: Cinnamon White Chocolate Covered Almonds, Charles Bridge Limited Gift Box, Bee Pollen Pink Chocolate. Designed for gourmets seeking high quality, this premier Czech handmade chocolate brand features beautiful local designs such as the Prague Castle and Astronomical Clock on its packaging. Their exclusive cinnamon almonds won a World Chocolate Award; rich yet not overly sweet, they make sophisticated edible gifts to bring home.", "name": "Steiner \u0026 Kova\u0159\u00edk Prague Fine Chocolates (Pra\u017esk\u00e1 \u010dokol\u00e1da Steiner \u0026 Kova\u0159\u00edk - V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "Take Metro Line A/B to M\u016fstek station, then walk about 2 minutes along the square."}, {"address": "N\u00e1rodn\u00ed 63/26, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.3 stars | Must-Buy List: Kolon\u00e1da Classic Spa Wafers, Becherovka Herbal Liqueur, Kofola Czech Herbal Cola. Situated at a major transport hub in New Town, Albert Supermarket is a great spot to treasure-hunt for budget-friendly local snacks. Here you can pick up authentic Karlovy Vary spa wafers (available in hazelnut, chocolate, and more), along with the Czech national soda Kofola and famous herbal liqueur Becherovka, all at highly competitive prices for bulk buying.", "name": "Albert Supermarket (Albert Supermarket - N\u00e1rodn\u00ed / Quadrio)", "transport": "Take Metro Line B or Tram 2, 9, 18, 22 to N\u00e1rodn\u00ed t\u0159\u00edda station."}, {"address": "Na P\u0159\u00edkop\u011b 853/12, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.6 stars | Must-Buy List: Hand-Engraved Bohemian Crystal Whisky Glasses, Col ortable and convenient shopping experience\u2014making it the top destination to score great deals on European designer clothing, leather goods, and sportswear when visiting Prague.", "name": "Fashion Arena Prague Outlet", "transport": "Take Metro Line A to Depo Hostiva\u0159 Station, then transfer to the free Fashion Arena shuttle bus for about 8 minutes."}, {"address": "N\u00e1m\u011bst\u00ed Republiky 1, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Must-buy list: Havl\u00edk Apot\u00e9ka gentle herbal facial cleanser, Dormeo comfortable bedding, Bata Czech national leather shoes. Located at the border of New Town and Old Town inside a historic pink building, this is the largest shopping landmark in central Prague. Featuring over 170 brand stores and 30 restaurants, it seamlessly combines historic barracks architecture with a bright, modern shopping mall, making it a favorite among locals and international tourists alike.", "name": "PALLADIUM Shopping Centre", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky Station; the exit leads directly to the mall."}, {"address": "Sp\u00e1len\u00e1 2121/22, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | Must-buy list: Sephora Europe-exclusive cosmetics, dm drugstore travel-size hand creams, Cottage Czech scented shower gels. A modern shopping center on N\u00e1rodn\u00ed commercial street in New Town, best known for the large rotating head sculpture of Franz Kafka outside, designed by artist David \u010cern\u00fd. Directly connected to the metro station, it houses lifestyle stores, cosmetics shops, and fashion brands with a relatively manageable crowd, making it a great spot in New Town for daily essentials and souvenirs.", "name": "Quadrio Shopping Center", "transport": "Take Metro Line B to N\u00e1rodn\u00ed t\u0159\u00edda Station, which directly connects to the mall\u0027s basement level."}, {"address": "Na P\u0159\u00edkop\u011b 23, 110 00 Nov\u00e9 M\u011
