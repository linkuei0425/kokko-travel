 wooden toys, handmade soaps, bath products, beer cosmetics, and other items made from natural ingredients. Their products are not only beautifully designed but also emphasize the use of local raw materials and traditional crafting techniques, allowing you to bring authentic Czech flavors home. Whether for personal use or as a gift, Manufaktura\u0027s products are full of unique Bohemian charm and practical value, making it an ideal place to experience traditional Czech craftsmanship.", "name": "Manufaktura", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 3-minute walk."}, {"address": "Pa\u0159\u00ed\u017esk\u00e1 12, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.7 stars | Moser Glass is a world-leading Bohemian crystal brand, renowned globally for the exceptional quality and exquisite craftsmanship of its lead-free crystal. The flagship store, located on Pa\u0159\u00ed\u017esk\u00e1, the main shopping street of the Jewish Quarter, displays a stunning array of crystal artworks, including magnificent stemware, vases, decorative items, and lighting. Each Moser piece is hand-blown and carved by experienced artisans, showcasing unparalleled refinement and brilliance. Here, you can not only admire the pinnacle of crystal art but also purchase luxurious, heirloom-worthy gifts, experiencing the splendor of a century of Czech craftsmanship.", "name": "Moser Glass", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 2-minute walk."}, {"address": "J\u00e1chymova 3, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.8 stars | Gallery KusKovu is a unique gallery and curated shop specializing in contemporary metal art and design works. This small shop within the Jewish Quarter showcases sculptures, jewelry, home decor, and other artworks primarily made from metal, created by local artists. Each piece in the store is full of creativity and individuality, from abstract sculptures to practical design objects, demonstrating the infinite ion, then a 4-minute walk."}, {"address": "T\u00fdnsk\u00e1 3, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | Botanicus is a natural products store based on organic herbs, located in the Old Town but just a stone\u0027s throw from the Jewish Quarter. They produce a variety of high-quality natural skincare products, handmade soaps, essential oils, and herbal teas using traditional Czech recipes. All products in the store come from their own organic farm, ensuring the purity and naturalness of the ingredients. Here, you can find various natural products beneficial for the body and experience the healing power of nature. Botanicus not only offers healthy choices but also preserves ancient Czech herbal wisdom, making it an ideal destination for natural beauty and wellness products.", "name": "Botanicus", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 5-minute walk."}, {"address": "Michalsk\u00e1 3, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | Tucked away in an Old Town alley, not far from the Jewish Quarter, Gallery \u0026 Shop U Zlat\u00e9ho Kohouta is a gallery and curated shop brimming with Bohemian charm. It displays and sells original Czech artworks, handmade ceramics, unique jewelry, and other exquisite gifts created by local artists and designers. The selection in the shop is thoughtfully curated, with each piece exuding a strong artistic flair and handmade warmth. Whether you\u0027re looking for a unique artwork to adorn your home or choosing a meaningful gift for friends and family, this place will allow you to discover unexpected surprises and experience the diverse charm of Czech art.", "name": "Gallery \u0026 Shop U Zlat\u00e9ho Kohouta (Golden Rooster Gallery \u0026 Shop)", "transport": "Take Metro Line A to M\u016fstek station, then a 6-minute walk."}], "name": "Unique Markets and Curated Shops"}, "cat_3": {"items": [{"address": "Starom\u011bstsk\u00e9 n\u00e1m. 27, 110 00 Star\u0 ome goods, and gifts. Although its interior decor may not be as modern as newer malls, its unique historical atmosphere and rich variety of goods still attract many customers seeking a classic shopping experience. Kotva is not just a shopping place but also a testament to a segment of the city\u0027s history, worth a visit.", "name": "Kotva (Kotva Department Store)", "transport": "Metro Line B (N\u00e1m\u011bst\u00ed Republiky station); Trams 6, 8, 15, 26 (N\u00e1m\u011bst\u00ed Republiky station)"}, {"address": "Na P\u0159\u00edkop\u011b 853/12, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.0 stars | \u010cern\u00e1 R\u016f\u017ee (Black Rose Shopping Arcade) is an elegant and historic shopping center located on Na P\u0159\u00edkop\u011b, Prague\u0027s busiest shopping street. This arcade is known for its exquisite interior decor and unique atmosphere, bringing together several boutiques, fashion brands, jewelry stores, and cafes. It offers a more private and high-end shopping experience, suitable for customers seeking unique items and quality service. The arcade\u0027s design blends classical and modern elements; strolling through it, you can not only enjoy the pleasure of shopping but also appreciate the beauty of its architecture. \u010cern\u00e1 R\u016f\u017ee is an unmissable shopping gem in Prague\u0027s city center, especially suitable for visitors who appreciate refined small shops and a comfortable environment.", "name": "\u010cern\u00e1 R\u016f\u017ee (Black Rose Shopping Arcade)", "transport": "Metro Lines A/B (M\u016fstek station); Metro Line B (N\u00e1m\u011bst\u00ed Republiky station); Trams 3, 5, 6, 9, 14, 24 (V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed station)"}, {"address": "Na P\u0159\u00edkop\u011b 859/22, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.1 stars | Slovansk\u00fd d\u016fm (Slavic House) is a magnificent Art Nouveau building located on Na P\u0159\u00edkop\u011b street in Prague\u0027s city center, integrati u00e9 n\u00e1m\u011bst\u00ed 802/53, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | Van Graaf is a large fashion department store located on Prague\u0027s Wenceslas Square, renowned for its extensive range of clothing brands and high-quality shopping experience. This multi-story department store brings together numerous internationally acclaimed designer brands and trendy fashion apparel, from men\u0027s wear, women\u0027s wear to children\u0027s wear, from casual attire to formal dresses \u2013 truly something for everyone. Its spacious and bright shopping environment, meticulously arranged merchandise displays, and professional staff provide customers with a pleasant and efficient shopping experience. Whether you\u0027re looking for daily outfits or selecting attire for special occasions, Van Graaf can satisfy customers of different tastes and needs, making it an unmissable shopping destination for fashion enthusiasts in Prague.", "name": "Van Graaf (Van Graaf Department Store)", "transport": "Metro Lines A/B (M\u016fstek station); Metro Line A (Muzeum station); Trams 3, 5, 6, 9, 14, 24 (V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed station)"}], "name": "Large Shopping Malls"}, "cat_2": {"items": [{"address": "Ra\u0161\u00ednovo n\u00e1b\u0159e\u017e\u00ed, 128 00 Prague 2-New Town", "feature": "\u2b50 4.6 stars | N\u00e1plavka Farmers\u0027 Market is one of Prague\u0027s most popular outdoor markets, stretching along Ra\u0161\u00ednovo n\u00e1b\u0159e\u017e\u00ed on the Vltava River. It comes alive every Saturday morning, bringing together farmers, producers, and artisans from all over the Czech Republic. Here you\u0027ll find the freshest seasonal fruits and vegetables, artisanal bread, cheeses, meat products, fresh flowers, and a variety of local snacks and drinks. Stroll along the riverbank and savor traditional Czech delicacies like fried fish, sausages, craft beer, and wine, all while enjoying the riverside scenery. The market is not just a great place to shop, but also a vibrant social hub to experience local life and feel the energy of Prague. Its relaxed and cheerful atmosphere makes it an ideal weekend getaway for both locals and tourists, and a perfect spot to find unique Czech-flavored gifts.", "name": "N\u00e1plavka Farmers\u0027 Market", "transport": "Approximately 10 minutes walk from Karlovo n\u00e1m\u011bst\u00ed (Charles Square) station on Metro Line B; or take trams 3, 17, 21 to V\u00fdto\u0148 station."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed 17, 110 00 Prague 1-New Town", "feature": "\u2b50 4.5 stars | Manufaktura is a renowned Czech chain brand, famous for its unique traditional handicrafts, natural cosmetics, and wooden toys. The branch located in Wenceslas Square is a key outpost in the New Town. The store\u0027s interior is filled with Bohemian charm, showcasing a variety of natural skincare products based on beer, wine, Dead Sea salt, and fruit, as well as exquisite handmade soaps, bath salts, and body lotions. Additionally, you can find traditional Czech wooden toys, ceramic ware, and linen textiles here, each item embodying Czech culture and craftsmanship. Manufaktura is not just a shopping destination but also a space to experience Czech traditional crafts and natural aesthetics, making it an excellent choice for unique souvenirs and gifts.", "name": "Manufaktura - V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed", "transport": "Approximately 2 minutes walk from M\u016fstek station on Metro Line A/B; or approximately 5 minutes walk from Muzeum station on Metro Line A/C."}, {"address": "\u0160t\u011bp\u00e1nsk\u00e1 61, 116 02 Prague 1-New Town", "feature": "\u2b50 4.4 stars | Lucerna Passage is a historic architectural masterpiece in Prague\u0027s New Town, built by the grandfather of former President V\u00e1clav Havel in the early 20th century. This magnificent arcade is not only an architectural marvel but also a cultural hub filled with artistic flair and unique tro Line B/C; or take trams 3, 5, 9, 14, 24 to Jind\u0159i\u0161sk\u00e1 station."}, {"address": "Na P\u0159\u00edkop\u011b 14, 110 00 Prague 1-New Town", "feature": "\u2b50 4.5 stars | Hamleys Prague is the flagship store of the famous British toy retailer Hamleys in Prague, located on Na P\u0159\u00edkop\u011b street in the New Town, and is one of the largest toy stores in Central Europe. It\u0027s not just a place to buy toys, but a magical world full of interactive experiences and entertainment. The store features a giant carousel, indoor slide, mirror maze, VR experience zone, and various toy demonstrations, allowing both children and adults to immerse themselves in a joyful atmosphere. From classic plush toys and educational games to the latest electronic products, the selection is extensive. Hamleys Prague is a unique \u0027concept store\u0027 that perfectly combines shopping with entertainment, offering an unforgettable experience for family visitors and an excellent choice for finding special gifts and enjoying family time.", "name": "Hamleys Prague", "transport": "Approximately 1 minute walk from M\u016fstek station on Metro Line A/B; or approximately 3 minutes walk from N\u00e1m\u011bst\u00ed Republiky (Republic Square) station on Metro Line B/C."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed 41, 110 00 Prague 1-New Town", "feature": "\u2b50 4.3 stars | Knihkupectv\u00ed Luxor is one of Prague\u0027s largest and most famous bookstores, located in the heart of Wenceslas Square, serving as a cultural landmark in the New Town. This multi-story bookstore boasts an extensive collection covering various fields such as literature, history, art, travel, and children\u0027s books, including a large selection of Czech and foreign language titles. The store\u0027s spacious and bright interior features comfortable reading areas and a cafe, providing a tranquil cultural retreat for readers. In addition to books, Knihkupectv\u00ed Luxor also sells a variety of stationery, magazines, maps, and Prague-related souvenirs, making it a comprehensive cultural curated store. Whether you\u0027re looking for the latest bestseller or want to delve into Czech literature, this place will meet your needs, making it an unmissable treasure for book lovers.", "name": "Knihkupectv\u00ed Luxor (Luxor Bookstore)", "transport": "Approximately 2 minutes walk from M\u016fstek station on Metro Line A/B; or approximately 5 minutes walk from Muzeum station on Metro Line A/C."}], "name": "Specialty Markets and Curated Shops"}, "cat_3": {"items": [{"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed 17, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Manufaktura is one of the Czech Republic\u0027s most popular souvenir shops, renowned for its unique natural handmade products. They offer a wide variety of goods, from natural cosmetics made with Czech beer, wine, or Dead Sea salt, to traditional handmade wooden toys, ceramics, and textiles, each imbued with a rich Czech character. Their beer shampoo and hand cream are highly recommended, as are their exquisite wooden dolls and educational games, making them excellent choices for gifts for friends and family. The store\u0027s interior is cozy, and products are neatly displayed, allowing customers to easily and pleasantly choose their favorite gifts.", "name": "Manufaktura (Manufaktura)", "transport": "Metro A/B line M\u016fstek station, approximately 1 minute walk."}, {"address": "Na P\u0159\u00edkop\u011b 12, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.7 stars | Moser Crystal is a symbol of top-tier luxury crystal in the Czech Republic, boasting over 160 years of history, renowned worldwide for its lead-free crystal, exquisite hand-engraving, and unique colors. This flagship store in the New Town not only showcases a wide array of crystal artworks, from delicate wine glasses and vases to magnificent decorative pieces, each sparkling like a work of art. Even with a limited budget, you can find small yet exquisite souvenirs to experience its unparalleled craftsmanship. Products here are a top choice for collectors and those seeking high-quality gifts.", "name": "Moser Crystal (Moser Glass)", "transport": "Metro A/B line M\u016fstek station, approximately 2 minutes walk."}, {"address": "Na P\u0159\u00edkop\u011b 23, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | Gran\u00e1t Turnov is a national treasure-level garnet jewelry brand in the Czech Republic, and the only company authorized to mine and process Bohemian garnets. This store offers a wide variety of jewelry set with deep red Bohemian garnets, including necklaces, earrings, rings, and bracelets, featuring classic designs rich in Czech character. Each piece comes with a certificate of authenticity, ensuring its quality and origin. For jewelry lovers or anyone wanting to bring back a unique and historically significant Czech souvenir, this is an absolute must-visit.", "name": "Turnov Garnet (Gran\u00e1t Turnov)", "transport": "Metro A/B line M\u016fstek station, approximately 3 minutes walk."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed 808/66, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | This is a boutique store specializing in handmade, high-quality chocolates, offering a variety of uniquely flavored and beautifully packaged chocolate products. Their chocolates not only use premium cocoa beans but also incorporate distinctive local Czech elements, such as chocolates shaped like Prague landmarks, or flavors infused with local fruits and spices. Whether as a gift for chocolate lovers or a sweet memory of Prague, the chocolates here are an excellent choice. The store has a warm atmosphere, friendly staff, and offers tasting services, allowing customers to find their perfect flavor.", "name": "Steiner \u0026 Kov\u00e1\u0159\u00edk Chocolate (\u010cokol\u00e1dovna Steiner \u0026 Kov\u00e1\u0159\u00edk)", "transport": "Metro A/C line Muzeum station, approximately 2 minutes walk."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed 19, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | Koh-i-noor Hardtmuth is a long-established Czech stationery brand, globally renowned for its high-quality pencils and art supplies. This store not only sells various drawing tools, colored pencils, and sketchbooks but also many unique souvenirs, such as stationery sets designed with Czech characteristic patterns, vintage-style pencil cases, and even the classic \u0027hedgehog pencil holder\u0027. For art enthusiasts, students, or anyone who loves unique stationery, this is a great place to find practical and culturally rich souvenirs.", "name": "Koh-i-noor Hardtmuth Stationery (Koh-i-noor Hardtmuth)", "transport": "Metro A/B line M\u016fstek station, approximately 1 minute walk."}, {"address": "Vodi\u010dkova 31, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.1 stars | Czech puppetry is an important cultural heritage, and Obchod loutek is an excellent place to explore this tradition. This store offers a wide variety of handmade puppets, from traditional witches, clowns, and knights to modern cartoon characters. Each puppet is exquisitely crafted, with lively expressions, full of artistic flair. Whether as a collector\u0027s item, a unique home decoration, or a special gift for children, these puppets are sure to delight. The store\u0027s atmosphere is full of childlike wonder, making one feel as if they\u0027ve stepped into a fairy tale.", "name": "Puppet Shop (Obchod loutek)", "transport": "Tram lines 3, 9, 14, 24 V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed stop, approximately 2 minutes walk."}, {"address": "Na P\u0159\u00edkop\u011b 23, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.2 stars | Bohemia Crystal is another internationally renowned Czech crystal brand, famous for its exquisite cutting craftsmanship and diverse product line. This ign and spacious, bright interiors create a comfortable and pleasant shopping environment. OC Chodov is not only a shopping paradise but also a popular social and leisure destination, attracting customers from all over Prague and the surrounding regions.", "name": "OC Chodov Shopping Centre", "transport": "Directly above Chodov station on Metro Line C; approximately four stops from Vy\u0161ehrad district via Metro Line C."}, {"address": "N\u00e1m\u011bst\u00ed Republiky 1, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | Palladium Shopping Centre is one of the most popular and largest shopping centers in Prague city center, situated in the historic Republic Square. It cleverly integrates modern shopping spaces into a meticulously restored historic building, housing over 200 stores and nearly 40 restaurants and cafes. Here you\u0027ll find internationally renowned fashion brands, jewelry, electronics, home goods, and a supermarket. Its unique architectural style and prime location make it a must-visit for both tourists and locals. The mall\u0027s interior design is stylish, offering a multi-level shopping experience, and frequently hosts various cultural events and promotions.", "name": "Palladium Shopping Centre", "transport": "Directly above N\u00e1m\u011bst\u00ed Republiky station on Metro Line B; from Vy\u0161ehrad district, take Metro Line C to Florenc station and transfer to Line B, or take a tram to the city center."}, {"address": "Plze\u0148sk\u00e1 8, 150 00 Praha 5-Sm\u00edchov, Czechia", "feature": "\u2b50 4.3 stars | Nov\u00fd Sm\u00edchov Shopping Centre is the largest shopping and entertainment center in the Sm\u00edchov district of Prague 5. It features over 150 stores, including international fashion brands, electronics stores, a large supermarket, and drugstores. The mall houses a large multi-screen cinema, a fitness center, and a diverse food court, offering a wide range of dining options. Its modern design and spacious interiors provide customers with a comfortable shopping environment. Nov\u00fd Sm\u00edchov is not only a great place for shopping but also a popular leisure and entertainment hub, conveniently located and attracting a broad customer base.", "name": "Nov\u00fd Sm\u00edchov Shopping Centre", "transport": "Directly above And\u011bl station on Metro Line B; from Vy\u0161ehrad district, take tram line 18 directly to And\u011bl station."}, {"address": "Sp\u00e1len\u00e1 2121/22, 110 00 Praha 1-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | Quadrio Shopping Centre is a modern, multi-functional complex located in the heart of Prague, adjacent to the National Theatre. It combines office spaces, residences, and a boutique shopping center. While not as large as major malls, its prime location brings together several fashion brands, designer boutiques, cafes, and restaurants. The mall\u0027s design is modern and sophisticated, offering a high-quality shopping experience. Its most striking feature is the dynamic \u0027Kafka Head\u0027 sculpture on its exterior, which has become an iconic landmark in Prague. Quadrio is an ideal place for those seeking a unique shopping and cultural experience.", "name": "Quadrio Shopping Centre", "transport": "Directly above N\u00e1rodn\u00ed t\u0159\u00edda station on Metro Line B; from Vy\u0161ehrad district, take tram line 18 directly to N\u00e1rodn\u00ed t\u0159\u00edda station."}, {"address": "Na Florenci 2116/15, 110 00 Praha 1-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.1 stars | Florentinum is a modern office complex located in the Florenc district of Prague city center, with a sophisticated shopping arcade on its ground floor. While primarily an office building, its shopping area offers diverse services, including a supermarket, drugstore, fashion boutiques, cafes, and several restaurants. The design here is modern and environmentally conscious, with an internal courtyard providing a tranquil resting space. Florentinum Shopping Arcade primarily serves the surrounding office workers and local residents, offering convenient daily shopping and dining options. It is known for its minimalist design and efficient functionality.", "name": "Florentinum Shopping Arcade", "transport": "Within walking distance of Florenc station on Metro Line B or C; a few stops from Vy\u0161ehrad district via Metro Line C."}], "name": "Large Shopping Malls"}, "cat_2": {"items": [{"address": "V Pevnosti 16/2, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.6 stars | Located within the Vy\u0161ehrad area, this bookstore and antique shop is a treasure trove for culture enthusiasts. It houses a vast collection of books on Czech history, art, and literature, ranging from new releases to rare ancient texts, maps, and prints. More than just a place to buy reading material, it feels like a small museum, allowing you to immerse yourself in Prague\u0027s rich heritage amidst the scent of books. The owner is passionate about books and eager to share knowledge, making it an excellent spot for unique gifts or souvenirs.", "name": "Vy\u0161ehrad Bookstore and Antiques (Knihkupectv\u00ed a antikvari\u00e1t Vy\u0161ehrad)", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10 minutes; or take trams 7, 18, or 24 to Albertov station, then walk uphill for about 10 minutes."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.5 stars | This charming little shop, located near the entrance to the Vy\u0161ehrad area, combines the functions of a caf\u00e9 and a curated shop. Here you can enjoy fresh coffee and locally baked pastries while browsing a selection of Czech handicrafts, unique souvenirs, and works by local artists. The shop has a warm atmosphere and thoughtfully chosen items, making it an ideal place to find a unique gift or take a short break before leaving Vy\u0161ehrad.", "name": "Good Day, Vy\u0161ehrad! (Dobr\u00fd den, Vy\         const cityName = "Prague";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
    <footer class="text-center py-8 text-gray-400 text-sm md:text-base px-4">
        <p>Copyright © 2026 Kokko Travel / Im+ Life. All Rights Reserved. 提供最專業的亞洲自由行旅遊指南與行程規劃工具 (Asia Travel Guides & FIT Itineraries)。版權所有，未經授權禁止轉載、翻印或任何商業用途。</p>
    </footer>
</body>
</html>
