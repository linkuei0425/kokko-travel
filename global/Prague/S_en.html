    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 5 Stars | A centuries-old bridge spanning the Vltava River, lined with 30 exquisite statues of saints. It is an extraordinary spot to admire the Prague skyline and street art.", "duration": "1-2 hours", "title": "Charles Bridge", "transport": "Take tram line 17 or 18 to Karlovy l\u00e1zn\u011b station, then a 3-minute walk"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 5 Stars | The largest ancient castle complex in the world with over a millennium of history. Featuring palaces, churches, and lush gardens, it offers panoramic views of the City of a Hundred Spires\u0027 Bohemian charm.", "duration": "3-4 hours", "title": "Prague Castle", "transport": "Take tram line 22 to Pra\u017esk\u00fd hrad station, then a 5-minute walk"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 5 Stars | A medieval mechanical clock located in Old Town Square. Watch the hourly procession of the Twelve Apostles, and climb to the top for a spectacular bird\u0027s-eye view over Old Town\u0027s rooftops.", "duration": "1 hour", "title": "Prague Astronomical Clock", "transport": "Take Metro Line A to M\u016fstek station, then a 5-minute walk"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 5 Stars | A masterpiece of Gothic architecture featuring breathtaking stained-glass windows and royal crypts. It stands as the Czech Republic\u0027s most important religious and architectural landmark.", "duration": "1-2 hours", "title": "St. Vitus Cathedral", "transport": "Located inside Prague Castle; take tram line 22 to Pra\u017esk\u00fd hrad station"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 4 Stars | One of Prague\u0027s historic birthplaces, perched on a hilltop park. It features the Basilica of St. Peter and St. Paul, a famous cemetery, serene ambiance, and brilliant scenic views.", "duration": "2-3 hours", "title": "Vy\u0161ehrad", "transport": "Take Metro Line C to Vy\u0161ehrad station, then a 10-minute walk"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 4 Stars | The iconic twin-spired Gothic church dominating Old Town Square. Resembling a fairytale castle, its lavishly decorated interior is equally enchanting.", "duration": "1 hour", "title": "Church of Our Lady before T\u00fdn", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 6-minute walk"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 4 Stars | A picturesque fairytale alley lined with colorful tiny houses. Once home to alchemists and castle guards, famous writer Franz Kafka also rented a house here to write.", "duration": "1 hour", "title": "Golden Lane", "transport": "Located on the east side of Prague Castle; take tram line 22 to Pra\u017esk\u00fd hrad station"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 4 Stars | A vibrant symbol of freedom covered in graffiti and Beatles lyrics, drawing travelers worldwide to leave messages celebrating peace and love.", "duration": "30 minutes", "title": "Lennon Wall", "transport": "Take tram line 12, 15, 20, or 22 to Hellichova station, then a 5-minute walk"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 4 Stars | A landmark of deconstructivist modern architecture inspired by a dancing couple. Its top-floor panoramic restaurant offers magnificent views along the Vltava River.", "duration": "1 hour", "title": "Dancing House", "transport": "Take tram line 5 or 17 to Jir\u00e1skovo n\u00e1m\u011bst\u00ed station, located right at the stop"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 4 Stars | The bustling commercial and cultural hub of Prague\u0027s New Town. A backdrop for monumental historical events, it is lined with department stores, shops, and restaurants.", "duration": "1-2 hours", "title": "Wenceslas Square", "transport": "Take Metro Line A or B to M\u016fstek station, or Line A or C to Muzeum station"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 4 Stars | A landmark Gothic city gate in Old Town, named after its historic use for gunpowder storage. Climb to the top for striking panoramic views of the lively streets below.", "duration": "1 hour", "title": "Powder Tower", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station, then a 2-minute walk"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 4 Stars | A prime example of Art Nouveau architecture, featuring the famous Smetana Hall and an elegant classical caf\u00e9, adorned with opulent decorations throughout.", "duration": "1-2 hours", "title": "Municipal House", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station, then a 1-minute walk"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 4 Stars | Resembling a mini Eiffel Tower, this lookout sits atop a lush green hill and offers the finest vantage point to climb and soak in sweeping views of all Prague.", "duration": "2 hours", "title": "Pet\u0159\u00edn Lookout Tower", "transport": "Take the funicular railway from \u00dajezd station to the top at Pet\u0159\u00edn Park"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 5 Stars | Renowned as one of the world\u0027s most beautiful libraries, featuring the Philosophical and Theological Halls adorned with awe-inspiring Baroque ceiling frescoes.", "duration": "1-2 hours", "title": "Strahov Monastery Library", "transport": "Take tram line 22 to Poho\u0159elec station, then a 5-minute walk"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Arts", "description": "\u2b50 4 Stars | A sprawling Baroque complex featuring a b d since the 16th century, where visitors can look down from the bridge to see cute bears residing in the moat.", "duration": "20 minutes", "title": "Castle Bear Moat", "transport": "Located under the entrance moat bridge before the castle\u0027s First Courtyard"}, {"category": "\u010cesk\u00fd Krumlov", "description": "\u2b50 4.3 | Celebrates traditional Czech puppetry culture with hundreds of historic antique marionettes, detailed stage sets, and interactive puppet-handling experiences.", "duration": "1 hour", "title": "Marionette Museum \u010cesk\u00fd Krumlov", "transport": "Housed inside the former Church of St. Jost on Latr\u00e1n Street"}, {"category": "\u010cesk\u00fd Krumlov", "description": "\u2b50 4.5 | A well-known Czech natural skincare brand featuring hand creams, shower gels, and home fragrances made with natural hops, wine, and Dead Sea mud\u2014a top choice for souvenirs.", "duration": "45 minutes", "title": "Manufaktura \u010cesk\u00fd Krumlov", "transport": "Located on the main shopping street in the Old Town"}, {"category": "\u010cesk\u00fd Krumlov", "description": "\u2b50 4.4 | Offers a detailed look into the history of the town and Southern Bohemia. The museum\u0027s highlight is an extraordinarily detailed 19th-century ceramic scale model of the town.", "duration": "1-1.5 hours", "title": "Regional Museum in \u010cesk\u00fd Krumlov", "transport": "Located on the eastern hill of the Old Town, about a 3-minute walk from the Town Square"}, {"category": "\u010cesk\u00fd Krumlov", "description": "\u2b50 4.3 | Freshly baked traditional Czech pastry, Trdeln\u00edk (chimney cake)\u2014crispy on the outside, soft on the inside, and absolutely delicious when paired with vanilla ice cream and hazelnut spread.", "duration": "30 minutes", "title": "MLS Creperie Trdeln\u00edk", "transport": "Located right next to the Barber Bridge on Latr\u00e1n Street"}, {"category": "\u010cesk\u00fd Krumlov", "description": "\u2b50 4.4 | A fully restored historic monastery nverted historic brewery, this restaurant serves fresh, locally brewed Krumlov dark beer alongside hearty classic Czech cuisine.", "duration": "1.5 hours", "title": "Krumlov Brewery Restaurant", "transport": "Located on Pivovarsk\u00e1 Street, about a 6-minute walk from the Old Town arched bridge."}, {"category": "\u010cesk\u00fd Krumlov", "description": "\u2b50 4.8 stars | A gentle walking trail hugging the winding riverbanks, offering views of historic wooden bridges, scenic reflections, and serene waterfront charm.", "duration": "1 hour", "title": "Vltava River Promenade", "transport": "Promenades run along both riverbanks surrounding the Old Town, accessible from various exits across the town center."}, {"category": "Karlovy Vary", "description": "\u2b50 4.7 stars | Karlovy Vary\u0027s most iconic Neoclassical colonnade, boasting 124 Corinthian columns and 5 mineral springs\u2014a must-visit landmark for tasting the local thermal waters.", "duration": "1-2 hours", "title": "Mill Colonnade (Ml\u00fdnsk\u00e1 kolon\u00e1da)", "transport": "About a 5-minute walk from Karlovy Vary city center."}, {"category": "Karlovy Vary", "description": "\u2b50 4.6 stars | An intricate Swiss-style carved wooden colonnade housing the famous Charles IV Spring, where legend says King Charles IV healed his ailing limbs.", "duration": "30-45 minutes", "title": "Market Colonnade (Tr\u017en\u00ed kolon\u00e1da)", "transport": "About a 3-minute walk along the Tepl\u00e1 River from the Mill Colonnade."}, {"category": "Karlovy Vary", "description": "\u2b50 4.5 stars | A modern glass structure housing the town\u0027s hottest spring geyser, spurting water up to 12 meters high at 72\u00b0C, with drinking fonts offering water at various temperatures.", "duration": "45 minutes", "title": "Hot Spring Colonnade (V\u0159\u00eddeln\u00ed kolon\u00e1da)", "transport": "Located by the Tepl\u00e1 River in the city center, about a 2-minute walk from Market Colonnade."}, {"category": "Karlovy Vary", "de                     const cat = item.category || '';
                    const title = item.title || '';
                    const desc = item.description || '';
                    const fullText = (cat + ' ' + title + ' ' + desc).toLowerCase();
                    const filterLower = currentFilter.toLowerCase();

                    if (filterLower.includes('attraction')) {
                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;
                    }
                    
                    return cat.toLowerCase().includes(filterLower);
                });
            }

            if(data.length === 0) {
                poolContainer.innerHTML = `<div class="text-center text-gray-400 py-10 font-medium md:text-lg">No data available for this category</div>`;
                return;
            }

            data.forEach((item, index) => {
                let title = activeTab === 'schedule' ? item.title : item.route;
                let category = activeTab === 'schedule' ? (item.category || 'Featured') : 'Intercity Transport';
                let duration = activeTab === 'schedule' ? item.duration : item.time;
                let transport = activeTab === 'schedule' ? item.transport : item.method;
                let desc = activeTab === 'schedule' ? item.description : 'Suitable for intercity or cross-border travel.';

                let catLower = category.toLowerCase();
                let badgeColor = "bg-slate-50 text-slate-600 border-slate-200";
                
                if(catLower.includes('attraction') || catLower.includes('culture') || catLower.includes('景點') || catLower.includes('文藝')) badgeColor = "bg-sky-50 text-sky-700 border-sky-200";
                if(catLower.includes('shopping') || catLower.includes('market') || catLower.includes('購物') || catLower.includes('商圈')) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(catLower.includes('dining') || catLower.includes('cafe') || catLower.includes('美食') || catLower.includes('名店')) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(dynamicCats.some(dynCat => catLower.includes(dynCat.toLowerCase()))) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";

                let searchKeyword = encodeURIComponent(`${cityName} ${title}`);
                let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>
                        <button onclick="addToTrip('${activeTab}', '${(item.title || item.route).replace(/'/g, "\\'")}')" class="shrink-0 bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white rounded-xl px-4 py-2 font-bold transition-colors border border-sky-100 text-sm shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i>Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="${badgeColor} border text-xs px-2.5 py-1 rounded-md font-bold">${category}</span>
                        <span class="bg-rose-50 text-rose-600 border border-rose-100 text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${duration}</span>
                    </div>
                    <p class="text-sm md:text-base text-gray-600 mb-5 leading-relaxed">${formattedDesc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm md:text-base text-gray-700 flex items-start gap-3">
                        <span class="${activeTab === 'schedule' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                            <i class="fa-solid ${activeTab === 'schedule' ? 'fa-train-subway' : 'fa-ship'}"></i>
                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);
            });
        }

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
