eature": "\u2b50 4.1 stars | V Kolkovn\u011b is a highly acclaimed traditional Czech restaurant in Prague\u0027s Jewish Quarter, known for its excellent Pilsner Urquell beer and rich Czech cuisine. The restaurant\u0027s interior design blends traditional and modern elements, creating a comfortable and stylish dining environment. The menu offers a variety of classic Czech dishes, including roasted duck (Pe\u010den\u00e1 kachna), pork knuckle (Vep\u0159ov\u00e9 koleno), and various stews, each generously portioned and richly flavored. V Kolkovn\u011b places special emphasis on ingredient quality, ensuring authentic Czech flavors for its customers. Beyond the food, the beer culture here is also prominent, with professional brewers ensuring every glass of beer is served at its optimal condition. Whether for family gatherings, drinks with friends, or business dinners, V Kolkovn\u011b is an excellent choice, allowing you to savor delicious food while experiencing Czech hospitality.", "name": "V Kolkovn\u011b Restaurant", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 4-minute walk."}, {"address": "Karoliny Sv\u011btl\u00e9 279/26, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | Hemingway Bar is celebrated as one of Prague\u0027s top cocktail bars. While not a traditional restaurant-bar, its unique ambiance and exquisite drinks make it an excellent representative of \"specialty bars\" near the Jewish Quarter. Named after the American author Ernest Hemingway, the bar\u0027s interior is filled with vintage elegance, creating an intimate and luxurious space. The bartenders here are highly skilled, capable of crafting a variety of classic and innovative cocktails, each as exquisite as a work of art. The menu also offers a selection of high-quality spirits and cigars. Hemingway Bar provides not just drinks, but an experience, making it an ideal destination for those seeking high-quality nightlife or special occasions. Please note that reservations are usually required, and there is a dress code to ensure all guests enjoy the best possible experience.", "name": "Hemingway Bar", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 10-minute walk."}, {"address": "\u0160irok\u00e1 12, 110 00 Josefov, Czechia", "feature": "\u2b50 3.8 stars | Located in the heart of the Jewish Quarter, Caf\u00e9 Franz Kafka is a historically rich coffee shop, just steps away from Kafka\u0027s birthplace. This caf\u00e9 is known for its nostalgic ambiance and traditional Czech pastries, making it an ideal spot for visitors to rest after exploring the Jewish Quarter. The interior decor is simple yet elegant, with walls adorned with images and texts related to Kafka, transporting guests back to early 20th-century Prague. The menu offers a variety of coffees, teas, and freshly baked cakes and desserts, with the apple pie and cheesecake being particularly popular. Here, you can savor aromatic coffee while soaking in the atmosphere of the literary giant, enjoying moments of peace and contemplation. It is not just a caf\u00e9, but a testament to history, adding a unique cultural flavor to your Jewish Quarter journey.", "name": "Caf\u00e9 Franz Kafka", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 2-minute walk."}, {"address": "Koz\u00ed 918/1, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | Bakeshop Praha is a highly popular modern bakery and caf\u00e9 near Prague\u0027s Jewish Quarter, renowned for its freshly baked bread, pastries, and light meals. The atmosphere here is relaxed and stylish, making it an excellent choice for breakfast, lunch, or afternoon tea. The shop offers a variety of European breads, croissants, muffins, and various desserts, each meticulously prepared with excellent texture. In addition to baked goods, Bakeshop also provides fresh salads, sandwiches, and soups, all made with fresh ingredients and healthy flavors. The coffee quality is also outstanding, making it a great way to start your day in Prague. Whether grabbing a quick snack to go or enjoying a leisurely light meal in-store, Bakeshop Praha caters to your desire for deliciousness and quality, a favorite spot for both locals and tourists.", "name": "Bakeshop Praha", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 5-minute walk."}, {"address": "\u017dateck\u00e1 17/7, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | Restaurace Mlejnice is a traditional Czech restaurant brimming with Bohemian charm, attracting countless diners with its rustic decor, hearty dishes, and lively atmosphere. Although located in the Old Town, it\u0027s just a short walk from the Jewish Quarter, making it a popular choice for authentic Czech cuisine. The restaurant\u0027s interior is adorned with various antique farm tools and wooden furniture, creating a unique country tavern style. Popular dishes on the menu include roasted pork knuckle (Pe\u010den\u00e9 vep\u0159ov\u00e9 koleno), traditional Czech goulash (Gul\u00e1\u0161), and fried cheese (Sma\u017een\u00fd s\u00fdr), all served in generous portions perfect for sharing with friends. The beer here is also an indispensable part of the Czech dining experience, and paired with delicious food, it\u0027s truly captivating. If you\u0027re looking for a dining experience full of local character, Mlejnice is definitely worth a try.", "name": "Restaurace Mlejnice", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 3-minute walk."}], "name": "Specialty Restaurants \u0026 Eateries"}, "cat_4": {"items": [{"address": "T\u00fdnsk\u00e1 uli\u010dka 1064/6, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | One of Prague\u0027s most popular vegetarian restaurants, known for its tranquil ambiance and creative dishes. The menu blends Asian and Western flavors, offering a variety of vegan and gluten-free options. From hearty curries to exquisite salads, each dish is bursting with fresh ingredients and unique spices. The restaurant\u0027s elegant interior creates a relaxing dining environment, making it a highly praised choice for both vegetarians and non-vegetarians.", "name": "Maitrea Vegetarian Restaurant (Maitrea Restaurace)", "transport": "Accessible by foot to Old Town Square, just a few minutes\u0027 walk from the Jewish Quarter."}, {"address": "Bor\u0161ov 280/2, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | Maitrea\u0027s sister restaurant, renowned for its whimsical interior design and equally outstanding vegetarian cuisine. The restaurant\u0027s interior is adorned with unique murals and lighting, creating a surreal dining experience. The menu offers a diverse range of international vegetarian dishes, from burritos to Indian curries, each meticulously prepared and rich in flavor. Their burgers and salads are also highly praised, making it an ideal spot for vegetarians seeking a unique dining experience.", "name": "Lehka Hlava - Clear Head Vegetarian Restaurant", "transport": "Approximately a 5-minute walk from Charles Bridge, and about a 10-15 minute walk from the Jewish Quarter."}, {"address": "Melantrichova 463/15, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | An establishment combining a health food store and a vegetarian buffet, offering fresh, organic, and affordable vegetarian and vegan meals. The buffet changes daily, featuring a variety of salads, hot dishes, soups, and desserts, all made with fresh ingredients and a light, healthy flavor. It\u0027s an excellent choice for lunch, especially for travelers looking for a quick and healthy meal.", "name": "Country Life Healthy Living Buffet", "transport": "Located near Old Town Square, about a 5-7 minute walk from the Jewish Quarter."}, {"address": "Opatovick\u00e1 17, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | This restaurant is known for its cozy atmosphere and delicious vegetarian/vegan cuisine. The menu blends Mediterranean and international flavors, offering a variety of creative dishes such as veggie burgers, burritos, and various specialty salads. They are meticulous about ingredient selection, ensuring every dish is fresh and full of flavor. In the evenings, it transforms into a lively bar, offering a wide selection of drinks.", "name": "Estrella Bar \u0026 Restaurant", "transport": "Not far from the National Theatre, about a 10-15 minute walk from the Jewish Quarter."}, {"address": "V\u011bze\u0148sk\u00e1 9, 110 00 Josefov, Czechia", "feature": "\u2b50 4.1 stars | Located on the edge of the Jewish Quarter, this stylish Italian cafe offers a variety of freshly made pasta dishes and delicious coffee. While not exclusively vegetarian, its menu features abundant vegetarian options, including various vegetable pastas, salads, and pizzas. The ingredients are fresh, and the flavors are authentic, making it a great spot for a casual lunch or dinner.", "name": "Pastacaff\u00e9 V\u011bze\u0148sk\u00e1", "transport": "Located in the heart of the Jewish Quarter, accessible by foot."}, {"address": "Dlouh\u00e1 33, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.0 stars | A popular Italian restaurant known for its traditional wood-fired pizzas and diverse pasta dishes. It offers a variety of vegetarian pizza and pasta options, such as Margherita pizza, Four Cheese pizza, and various vegetable pastas. The restaurant has a comfortable atmosphere and attentive service, making it an ideal place for family and friends to dine.", "name": "Pizzeria Ristorante Giovanni", "transport": "Located at the intersection of the Jewish Quarter and Old Town, about a 3-5 minute walk."}, {"address": "U Radnice 10/2, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.8 stars | A Michelin-starred restaurant in Prague, renowned for its modern Czech cuisine and respect for local ingredients. While not exclusively vegetarian, they offer an exquisite vegetarian tasting menu that perfectly combines seasonal vegetables with innovative cooking techniques. Each dish is a work of art, rich in flavor layers, making it an excellent choice for diners seeking a high-end vegetarian experience.", "name": "Field Restaurant", "transport": "Located near Old Town Square, about a 5-minute walk from the Jewish Quarter."}, {"address": "Maiselova 2, 110 00 Josefov, Czechia", "feature": "\u2b50 3.9 stars | Located within the Jewish Quarter, this restaurant offers authentic Kosher cuisine, including a variety of vegetarian options. The menu may feature hummus, salads, vegetable soups, and various vegetable-based specialties. The food here is fresh and adheres to Kosher standards, making it a unique place to experience Jewish culture and savor local vegetarian dishes.", "name": "Shelanu Restaurant", "transport": "Located in the heart of the Jewish Quarter, near the Old Jewish Cemetery and Jewish Museum, accessible by foot."}], "name": "\ud83c\udf31 Vegetarian"}}, "name": "\u7336\u592a\u5340 (Josefov)"}, "lesser_town": {"categories": {"cat_1": {"items": [{"address": "M\u00ed\u0161e\u0148sk\u00e1 12, 110 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.3 stars | This \u0027Local Pub U B\u00edl\u00e9 ku\u017eelky\u0027 is a branch of the Lok\u00e1l chain in Mal\u00e1 Strana, known for its fresh Pilsner Urquell draft beer and classic Czech traditional dishes. The interior is simple yet cozy, filled with the atmosphere of an old Czech pub. The menu is updated daily with fresh ingredients, and signature dishes include fried cheese, goulash, roasted duck, and various dumplings. Waitstaff often wear traditional attire, providing warm and attentive service. Whether for lunch or dinner, this is an excellent choice to experience authentic Czech cuisine and beer culture, beloved by both locals and tourists.", "name": "Local Pub U B\u00edl\u00e9 ku\u017eelky (Lok\u00e1l U B\u00edl\u00e9 ku\u017eelky)", "transport": "Take tram (Tram) numbers 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 5 minutes."}, {"address": "Letensk\u00e1 12, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.1 stars | \u0027St. Thomas Brewery\u0027 is located within a historic monastery, with a brewing history dating back to 1352, making it one of Prague\u0027s oldest pubs. It is renowned for its unique dark beer and hearty traditional Czech dishes. The interior is filled with a medieval atmosphere, with arched ceilings and heavy wooden furniture creating a distinctive dining experience. Signature dishes include roasted pork knuckle, goulash, and traditional Czech sausages. Dining here not only allows you to savor delicious food and beer but also to immerse yourself in Prague\u0027s rich history and feel the passage of time.", "name": "St. Thomas Brewery (Pivnice U Svateho Tomase)", "transport": "Take tram (Tram) numbers 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 3 minutes."}, {"address": "Malostransk\u00e9 n\u00e1m. 266/5, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.0 stars | \u0027U Glaubic\u016f Pub\u0027 is located next to Mal\u00e1 Strana Square, boasting over 700 years of history, making it one of Prague\u0027s oldest pubs. It is famous for its ancient cellar, traditional Czech cuisine, and fresh Pilsner Urquell beer. The interior retains many original architectural features, including arched ceilings and old frescoes, creating a rich historical ambiance. The menu offers a variety of classic Czech dishes such as roasted duck, pork knee, and fried cheese. This is not only a great place to enjoy delicious food but also an excellent spot to feel the historical pulse of Prague.", "name": "U Glaubic\u016f Pub (U Glaubic\u016f)", "transport": "Take tram (Tram) numbers 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station; the restaurant is right by the square."}, {"address": "Nerudova 2, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.4 stars | \u0027The Cat Pub\u0027 is one of Prague\u0027s most beloved traditional pubs among locals, known for its affordable prices, delicious beer, and authentic Czech snacks. There\u0027s no fancy decor here, just simple wooden tables and chairs and a lively atmosphere, making it an ideal place to experience true Czech pub culture. The pub offers fresh Pilsner Urquell draft beer, along with simple yet delicious bar snacks like pickled cheese and sausages. If you want to escape the hustle and bustle of tourist areas and experience the daily life of Prague locals, then \u0027The Cat Pub\u0027 is definitely a place not to be missed.", "name": "The Cat Pub (U Kocoura)", "transport": "Take tram (Tram) numbers 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 2 minutes."}, {"address": "Nerudova 210/12, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.0 stars | \u0027Three Violins Restaurant\u0027 is located on a quiet street in Mal\u00e1 Strana, offering a warm and comfortable dining environment and authentic traditional Czech cuisine. The restaurant\u0027s decor is full of Bohemian style, with violins and artworks adorning the walls, creating a unique cultural atmosphere. The menu features a variety of classic Czech dishes such as roasted duck, pork knee, and various soups. The service here is friendly, and the food is delicious, making it a great place to escape the hustle and bustle and enjoy a leisurely lunch or dinner. The restaurant also offers a selection of local beers and wines to complete your dining experience.", "name": "Three Violins Restaurant (Restaurace U T\u0159\u00ed Housli\u010dek)", "transport": "Take tram (Tram) numbers 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 5 minutes."}, {"address": "Malostransk\u00e9 n\u00e1m. 21, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 3.8 stars | \u0027Mal\u00e1 Strana Beseda\u0027 is not only a cultural center, but its ground-floor restaurant and bar also offer authentic Czech cuisine and beer. This historic building is located in the center of Mal\u00e1 Strana Square, with a simple yet historically rich interior. The restaurant serves traditional Czech dishes such as goulash, roasted pork, and fried cheese at reasonable prices, making it a good choice for locals and tourists to taste authentic food. In addition to dining, concerts and cultural events are often held here, adding more enjoyment to the dining experience.", "name": "Mal\u00e1 Strana Beseda (Malostransk\u00e1 Beseda)", "transport": "Take tram (Tram) numbers 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station; the restaurant is right on the square."}, {"address": "Mosteck\u00e1 2, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.2 stars | \u0027Restaurant Under the Tower\u0027 is ideally located beneath the Mal\u00e1 Strana Bridge Tower of Charles Bridge, offering exquisite traditional Czech cuisine and excellent service. The restaurant\u0027s interior is elegantly decorated with a comfortable ambiance, making it an ideal place for a romantic dinner or business lunch. The menu blends classic Czech dishes with modern culinary techniques, using fresh local ingredients to present astonishing flavors. Signature dishes include slow-braised beef, roasted duck, and various desserts. Dining here not only allows you to savor delicious food but also to enjoy the charming views of Charles Bridge.", "name": "Restaurant Under the Tower (Restaurant Pod Vezi)", "transport": "Take tram (Tram) numbers 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 3 minutes."}, {"address": "Tr\u017ei\u0161t\u011b 23, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 3.9 stars | \u0027Bar\u00e1\u010dnick\u00e1 Rychta Pub\u0027 is a traditional Czech restaurant full of local flavor, located in a quieter area of Mal\u00e1 Strana. It is known for its hearty home-style dishes and friendly service. The interior is unpretentious, creating a warm, family-like atmosphere, making it a frequent haunt for local residents. The menu offers a variety of classic Czech dishes such as roasted pork, goulash, fried cheese, and various soups, all generously portioned and affordably priced. If you want to experience the daily diet of Prague locals and feel the most authentic Czech life, then this place is definitely worth a visit.", "name": "Bar\u00e1\u010dnick\u00e1 Rychta Pub (Bar\u00e1\u010dnick\u00e1 Rychta)", "transport": "Take tram (Tram) numbers 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 7 minutes."}], "name": "Authentic Local Establishments"}, "cat_2": {"items": [{"address": "Malostransk\u00e9 n\u00e1m. 28/5, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.0 stars | This historic cafe, located in Lesser Town Square, boasts a charming classical ambiance and elegant interior decor. Since the late 19th century, it has been a popular spot for locals and tourists to enjoy coffee, desserts, and light meals. Here, you can savor classic Czech coffee, various cakes, and simple brunch options, all while soaking in Prague\u0027s historical atmosphere. The bustling square outside offers a perfect view for observing local life and unwinding. With friendly service and reasonable prices, it\u0027s an ideal choice for experiencing traditional Prague cafe culture.", "name": "Lesser Town Cafe (Malostransk\u00e1 Kav\u00e1rna)", "transport": "Take the tram to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then it\u0027s a short walk."}, {"address": "Letensk\u00e1 12/33, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.5 stars | Located within the luxurious Augustine Hotel, this restaurant offers a refined breakfast and brunch experience in an elegant and tranquil setting. Housed in a 13th-century monastery building, it perfectly blends historical grandeur with modern luxury. You can enjoy a lavish buffet breakfast or choose \u00e0 la carte European and Czech specialties. Ingredients are fresh, presentation is exquisite, and service is top-notch. On sunny days, we especially recommend choosing a seat in the outdoor courtyard to enjoy a peaceful and luxurious morning. It\u0027s an excellent choice for those seeking a high-quality dining experience.", "name": "Augustine Restaurant", "transport": "Take the tram to Malostransk\u00e1 station, then walk for about 5 minutes."}, {"address": "\u00dajezd 409/12, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.6 stars | Kaf\u00ed\u010dko is a cozy cafe hidden in the alleys of Lesser Town, known for its friendly atmosphere and high-quality coffee. The space is small but very comfortably furnished, exuding a homey feel. They offer a variety of specialty coffees, homemade desserts, and simple brunch options like sandwiches and yogurt bowls. The owner\u0027s passion for coffee is evident in every carefully crafted drink. It\u0027s a local favorite, perfect for travelers seeking a moment of peace and a good cup of coffee. With warm service and affordable prices, it\u0027s a great place to experience local Prague life.", "name": "Kaf\u00ed\u010dko", "transport": "Take the tram to \u00dajezd station, then walk for about 2 minutes."}, {"address": "Karmelitsk\u00e1 379/18, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.6 stars | Artisan Caf\u00e9 \u0026 Bistrot is a modern-style cafe and bistro that attracts a younger crowd with its stylish design and delicious food. It offers a diverse brunch menu, from classic Eggs Benedict to healthy avocado toast, along with freshly baked pastries and excellent coffee. Ingredients are sourced from fresh local produce, ensuring every dish is full of flavor. The space is bright and spacious, with a relaxed and lively atmosphere, making it an ideal spot for gathering with friends or enjoying a leisurely brunch. With efficient service and innovative dishes, it\u0027s a rare modern culinary gem in Lesser Town.", "name": "Artisan Caf\u00e9 \u0026 Bistrot", "transport": "Take the tram to Hellichova station, then walk for about 1 minute."}, {"address": "Nerudova 248/17, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.5 stars | This traditional Czech confectionery, located on Nerudova Street near Charles Bridge, is an excellent place to savor authentic pastries and coffee. Cukr\u00e1rna U Kajet\u00e1na boasts a century of history, renowned for its exquisite handmade cakes, pies, and ice cream. While not a typical brunch spot, its coffee and dessert combinations are perfect for a sweet morning or afternoon tea. The interior decor retains its traditional style, full of nostalgic charm. Here, you can enjoy delicious Czech sweets while soaking in the historical ambiance of Lesser Town. It\u0027s a classic Prague gem not to be missed by dessert lovers.", "name": "Cukr\u00e1rna U Kajet\u00e1na (Kajetan Confectionery)", "transport": "Take the tram to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk uphill along Nerudova Street for about 5 minutes."}, {"address": "U Zlat\u00e9 studn\u011b 166/4, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.7 stars | Located within the renowned Golden Well Hotel, this cafe offers unparalleled panoramic views of Prague, making it a top choice for a luxurious breakfast or brunch. While prices are higher, the exquisite dishes, first-class service, and breathtaking scenery are absolutely worth it. From the terrace seating, you can savor freshly baked bread, selected coffees, and champagne while overlooking the magnificent Prague Castle, Charles Bridge, and Old Town. The breakfast menu is extensive, featuring a variety of European and local specialties. It\u0027s an ideal spot for celebrating special occasions or enjoying an ultimate romantic experience.", "name": "Golden Well Hotel Cafe (Kav\u00e1rna U Zlat\u00e9 studn\u011b)", "transport": "Walking is recommended; take the uphill path from Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, or take a taxi/Uber."}, {"address": "M\u00ed\u0161e\u0148sk\u00e1 10, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.5 stars | Caf\u00e9 Club M\u00ed\u0161e\u0148sk\u00e1 is a cozy cafe located in the heart of Lesser Town, highly praised for its relaxed atmosphere and excellent coffee. The decor is simple yet stylish, offering a peaceful retreat from the hustle and bustle. The menu features various coffee drinks, freshly baked pastries, sandwiches, and light meals, perfect for a simple yet delicious brunch. The staff are friendly, enthusiastic, and attentive. Whether you want to read alone, chat with friends, or take a short break, this is a great choice. It\u0027s another excellent option for experiencing local Prague coffee culture.", "name": "Caf\u00e9 Club M\u00ed\u0161e\u0148sk\u00e1", "transport": "Take the tram to Malostransk\u00e1 station, then walk for about 3 minutes."}, {"address": "Mosteck\u00e1 279/1, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.3 stars | Pek\u00e1rna Kab\u00e1t is a traditional bakery beloved by locals, located on a main street in Lesser Town, offering freshly baked bread, pastries, and coffee. While primarily a bakery, its coffee and various sweet and savory treats are perfect for a quick and delicious breakfast or brunch. You can enjoy classic Czech breads, pies, doughnuts, and various puff pastries. The products here are affordable and of excellent quality, making it a great place to experience authentic Czech baked goods. For travelers looking for a quick energy boost or a grab-and-go breakfast, this is a very convenient option.", "name": "Kab\u00e1t Bakery (Pek\u00e1rna Kab\u00e1t Mal\u00e1 Strana)", "transport": "Take the tram to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 2 minutes, located near Charles Bridge."}], "name": "Popular Cafes \u0026 Brunches"}, "cat_3": {"items": [{"address": "M\u00ed\u0161e\u0148sk\u00e1 12, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.3 stars | This tavern near Charles Bridge is renowned for its fresh \u0027Pilsner Urquell\u0027 draft beer and classic Czech dishes. It insists on using local ingredients and preparing them in traditional ways, offering authentic delicacies such as fried pork schnitzel, beef goulash, and special sausages. The interior decor is simple yet vibrant, making it an excellent place to experience true Czech dining culture. With efficient service and a lively atmosphere, it\u0027s a beloved gathering spot for both locals and tourists.", "name": "Lok\u00e1l U B\u00edl\u00e9 ku\u017eelky (Local at the White Skittle)", "transport": "Take trams 12, 15, 20, 22, 23 to \u0027Malostransk\u00e9 n\u00e1m\u011bst\u00ed\u0027 station, then walk for about 5 minutes."}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 301, 118 00 Praha 1", "feature": "\u2b50 4.4 stars | Located within Strahov Monastery, this historic brewery has been crafting beer since the 17th century. It offers a variety of its own brewed craft beers, including dark, light, and seasonal flavors. The restaurant boasts a rustic and elegant ambiance, where you can savor traditional Czech dishes such as roasted pork knuckle, duck, and various stews. With views overlooking Prague Castle, it\u0027s a unique experience combining gastronomy, history, and beautiful scenery.", "name": "Kl\u00e1\u0161tern\u00ed pivovar Strahov (Strahov Monastery Brewery)", "transport": "Take trams 22, 23 to \u0027Poho\u0159elec\u0027 station, then walk for about 10 minutes, or walk from the Prague Castle area."}, {"address": "Nerudova 2, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.2 stars | This classic Czech tavern, located near the entrance to Charles Bridge, is famous for its unfiltered \u0027Pilsner Urquell\u0027 draft beer and affordable prices. The interior is simple and full of local character, making it an ideal place to experience authentic Czech pub culture. Although the menu selection is not extensive, the traditional snacks offered, such as pickled cheese and sausages, are very popular. The atmosphere here is lively, making it a great spot to mingle with locals.", "name": "Hostinec U Kocoura (The Cat\u0027s Inn)", "transport": "Take trams 12, 15, 20, 22, 23 to \u0027Malostransk\u00e9 n\u00e1m\u011bst\u00ed\u0027 station, then walk for about 3 minutes."}, {"address": "Letensk\u00e1 12, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.1 stars | This historic brewery pub is located in the cellar of the former St. Thomas Monastery, where beer has been brewed since 1352. It is famous for its unique dark beer, \u0027St. Thomas Black Beer,\u0027 and offers a rich selection of traditional Czech dishes, such as roasted duck, pork knee, and various stews. The restaurant\u0027s interior is filled with a medieval atmosphere, making it an excellent place to savor traditional cuisine and experience history.", "name": "Pivnice U Svat\u00e9ho Tom\u00e1\u0161e (St. Thomas Brewery Pub)", "transport": "Take trams 12, 15, 20, 22, 23 to \u0027Malostransk\u00e9 n\u00e1m\u011bst\u00ed\u0027 station, then walk for about 5 minutes."}, {"address": "Malostransk\u00e9 n\u00e1m. 266/5, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.0 stars | Located next to Lesser Town Square, this centuries-old tavern is famous for its ancient underground cellar and traditional Czech cuisine. It offers classic Czech dishes such as roasted pork, beef goulash, and fried cheese, paired with chilled Czech beer, making it an excellent choice for an authentic taste. The interior decor retains many historical elements, creating a warm and nostalgic atmosphere, beloved by both locals and tourists.", "name": "U Glaubic\u016f (At Glaubic\u0027s)", "transport": "Take trams 12, 15, 20, 22, 23 to \u0027Malostransk\u00e9 n\u00e1m\u011bst\u00ed\u0027 station, directly outside the exit."}, {"address": "Malostransk\u00e9 n\u00e1m. 21, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.0 stars | This historic building is not only a cultural center, but its ground floor also houses a restaurant and bar, offering traditional Czech cuisine and a variety of beers. The atmosphere here is relaxed and pleasant, making it a great place to unwind after sightseeing. The menu includes classic Czech stews, schnitzel, and salads. In addition to dining, it frequently hosts concerts and cultural events, adding a unique artistic flair to the dining experience.", "name": "Malostransk\u00e1 Beseda (Lesser Town Beseda)", "transport": "Take trams 12, 15, 20, 22, 23 to \u0027Malostransk\u00e9 n\u00e1m\u011bst\u00ed\u0027 station, directly outside the exit."}, {"address": "Nerudova 12, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 3.9 stars | This cozy restaurant, located in the heart of Lesser Town, is known for its traditional Czech dishes and comfortable atmosphere. The menu offers a variety of classic choices, such as roasted duck, beef goulash, and Czech dumplings. The restaurant\u0027s interior is filled with Bohemian charm, and sometimes features live music performances, adding a romantic and artistic touch to the dining experience. It\u0027s a great place to enjoy a peaceful and delicious Czech meal.", "name": "Restaurace U T\u0159\u00ed housli\u010dek (Restaurant At Three Violins)", "transport": "Take trams 12, 15, 20, 22, 23 to \u0027Malostransk\u00e9 n\u00e1m\u011bst\u00ed\u0027 station, then walk for about 5 minutes."}, {"address": "Tr\u017ei\u0161t\u011b 23, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.3 stars | This traditional Czech tavern, tucked away in a more secluded part of Lesser Town, is highly favored by locals. It offers authentic Czech home-style cooking with generous portions and affordable prices, making it an excellent choice for experiencing non-touristy flavors. The beer here is fresh, and the menu includes roasted pork, beef goulash, and various traditional soups. The interior decor is simple, exuding the cozy feel of a neighborhood pub, making it an ideal spot to escape the hustle and bustle and savor local life.", "name": "Bar\u00e1\u010dnick\u00e1 Rychta (Bar\u00e1\u010dnick\u00e1 Tavern)", "transport": "Take trams 12, 15, 20, 22, 23 to \u0027Malostransk\u00e9 n\u00e1m\u011bst\u00ed\u0027 station, then walk for about 7 minutes."}], "name": "Specialty Pubs \u0026 Local Eateries"}, "cat_4": {"items": [{"address": "Nerudova 221/36, 118 00 Mal\u00e1 Strana", "feature": "\u2b50 4.7 stars | Located at the foot of Prague Castle, this restaurant boasts an excellent location and offers 100% vegan traditional Czech dishes and international cuisine. It\u0027s renowned for its friendly service, delicious food, and an amazing rooftop terrace that overlooks the red-tiled roofs of Lesser Town and the dome of St. Nicholas Church. The vegan goulash, vegan roasted duck, and vegan cheesecake on the menu are highly praised, making it an ideal choice for experiencing vegan Czech flavors. Whether for lunch or dinner, it provides a healthy and delicious dining experience.", "name": "Vegan\u0027s Prague", "transport": "Take tram 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk uphill along Nerudova Street for about 5 minutes to reach it."}, {"address": "Ciheln\u00e1 2b, 118 00 Mal\u00e1 Strana", "feature": "\u2b50 4.3 stars | Situated on the Vltava River, right next to Charles Bridge, this restaurant is known for its modern European cuisine and magnificent river views. While not exclusively vegetarian, its menu always features exquisite and creative vegetarian options, meticulously designed from appetizers to main courses. The restaurant\u0027s ambiance is stylish and elegant, making it an ideal spot for a romantic dinner or special celebration. Vegetarians can savor high-quality vegetable risotto, grilled vegetable salads, or chef\u0027s special vegetarian main courses, all while enjoying the enchanting night views of Charles Bridge and Prague Castle.", "name": "Hergetova Cihelna", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e1 station, then walk for about 3 minutes to reach it."}, {"address": "Na Kamp\u011b 8b, 118 00 Mal\u00e1 Strana", "feature": "\u2b50 4.4 stars | One of Prague\u0027s top Michelin-recommended restaurants, located on Kampa Island, offering unparalleled riverside views directly overlooking Charles Bridge and the Vltava River. Although renowned for its seafood and international cuisine, Kampa Park highly values the needs of vegetarian guests. The chef can provide diverse and stunning vegetarian dishes, from exquisite appetizers to creative vegetarian main courses, all prepared with the freshest seasonal ingredients, artfully plated, and rich in flavor. It\u0027s an excellent choice for vegetarians seeking a luxurious dining experience.", "name": "Kampa Park", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e1 station, then walk for about 5 minutes through Kampa Island to reach it."}, {"address": "Letensk\u00e1 12/33, 118 00 Mal\u00e1 Strana", "feature": "\u2b50 4.5 stars | Located within the luxurious Augustine Hotel, this restaurant offers exquisite modern European cuisine in an elegant and tranquil setting, blending the charm of historical architecture with contemporary design. Its menu typically includes a variety of thoughtfully designed vegetarian options, from healthy light breakfasts to creative dinner main courses, catering to the needs of vegetarians. The chef excels at using fresh, seasonal ingredients to transform simple vegetables into unforgettable gourmet dishes. It\u0027s an ideal choice for vegetarians seeking a high-quality dining experience and a peaceful ambiance.", "name": "Augustine Restaurant", "transport": "Take Metro Line A to Malostransk\u00e1 station, then walk for about 3 minutes; or take tram 12, 15, 20, or 22 to Malostransk\u00e1 station, then walk for about 2 minutes."}, {"address": "Malt\u00e9zsk\u00e9 n\u00e1m. 11, 118 00 Mal\u00e1 Strana", "feature": "\u2b50 4.5 stars | A historic French restaurant, with a history dating back to the 16th century, known for its exceptional service and exquisite cuisine. The interior decor is elegant and full of artistic flair. Although it serves traditional French cuisine, they highly value the needs of vegetarian guests and can provide high-quality vegetarian set menus, often including multiple refined vegetarian dishes that showcase the essence of French cooking. With fresh ingredients and delicate preparation, it\u0027s an ideal place to enjoy a memorable French vegetarian feast.", "name": "Restaurace U Mal\u00ed\u0159\u016f 1547", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 3 minutes to reach it."}, {"address": "U Zlat\u00e9 studn\u011b 166/4, 118 00 Mal\u00e1 Strana", "feature": "\u2b50 4.6 stars | Located on the top floor of the Golden Well Hotel in Prague, offering unparalleled panoramic views of Prague, including Lesser Town, Charles Bridge, and Prague Castle. This upscale restaurant is renowned for its exquisite modern European cuisine. While not exclusively vegetarian, its chef can provide diverse and creative vegetarian dishes upon request, using the freshest seasonal ingredients for appetizers and main courses, artfully plated and rich in flavor. It\u0027s an excellent choice for a luxurious dining experience with magnificent views.", "name": "Terasa U Zlat\u00e9 Studn\u011b", "transport": "Take Metro Line A to Malostransk\u00e1 station, then walk for about 10 minutes; or take tram 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 10 minutes, which involves an uphill climb."}, {"address": "Na Kamp\u011b 500/15, 118 00 Mal\u00e1 Stracna", "feature": "\u2b50 4.0 stars | Located on the picturesque Kampa Island, offering delicious Italian pizzas and pastas, it\u0027s a great place for a relaxed vegetarian Italian meal. The restaurant has a casual and comfortable atmosphere, with outdoor seating offering views of the Vltava River and Charles Bridge. The menu features a wide selection of vegetarian pizzas, such as Margherita, Four Seasons pizza (can be requested without meat), and various vegetable pastas. Ingredients are fresh, and dishes are made to order, making it an ideal choice for family or friends gatherings, with relatively affordable prices.", "name": "Pizzeria Kampa", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e1 station, then walk for about 5 minutes through Kampa Island to reach it."}, {"address": "Nebovidsk\u00e1 459/6, 118 00 Mal\u00e1 Strana", "feature": "\u2b50 4.3 stars | Although known for its traditional Czech game and roasted duck, this restaurant is also celebrated for its attentive service to all guests and high-quality cuisine. The interior decor is full of classical charm, creating a romantic atmosphere. They typically offer one or two very refined vegetarian main courses, and sometimes can even customize the menu for vegetarians, demonstrating respect for ingredients and culinary creativity. Vegetarian options usually feature seasonal vegetables and local specialty ingredients, offering unique flavors. It\u0027s a great place to experience upscale Czech cuisine while enjoying delicious vegetarian dishes.", "name": "U Modr\u00e9 Kachni\u010dky II", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 5 minutes to reach it."}], "name": "\ud83c\udf31 Vegetarian"}}, "name": "\u5c0f\u57ce\u5340 (Mal\u00e1 Strana)"}, "new_town": {"categories": {"cat_1": {"items": [{"address": "Na Per\u0161t\u00fdn\u011b 7, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | This historic restaurant and brewery is one of Prague\u0027s oldest and most iconic traditional Czech eateries. It not only offers authentic Czech delicacies like rich Goulash and classic roasted duck but is also famous for its home-brewed \u0027X-Beer 33\u0027 dark lager, rumored to be one of the strongest beers in the world. The interior boasts rustic charm, with wooden furniture and arched ceilings creating a cozy ambiance, making it an excellent spot to experience true Czech beer culture and cuisine. Whether you\u0027re savoring traditional dishes or enjoying a cold craft beer, U Medvidku promises an unforgettable Prague experience.", "name": "U Medvidku (Bear House Restaurant)", "transport": "Take Metro Line B to N\u00e1rodn\u00ed t\u0159\u00edda station, then walk for about 2 minutes to arrive."}, {"address": "P\u0161trossova 192/10, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | The Lok\u00e1l chain of restaurants is renowned for its commitment to traditional Czech cuisine and fresh Pilsner Urquell beer. The U Zavadil\u016f branch, located in New Town, offers classic Czech home-style dishes such as fried cheese (Sma\u017een\u00fd s\u00fdr), roasted pork knuckle (Pe\u010den\u00e9 vep\u0159ov\u00e9 koleno), and cream sirloin (Sv\u00ed\u010dkov\u00e1). The beer here is drawn directly from cellar tanks, ensuring every glass is fresh, cold, and exceptionally smooth. The restaurant\u0027s atmosphere is lively and authentic, making it a popular spot for locals and tourists alike to enjoy food and beer. With efficient service and a clear menu, it\u0027s an ideal choice for experiencing pure Czech flavors.", "name": "Lok\u00e1l U Zavadil\u016f (Lok\u00e1l U Zavadil\u016f Restaurant)", "transport": "Take Metro Line B to N\u00e1rodn\u00ed t\u0159\u00edda station, then walk for about 5 minutes to arrive."}, {"address": "Jungmannovo n\u00e1m. 15/16, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.2 stars | U Pinkas\u016f claims to be the first pub in Prague to serve Pilsner Urquell beer, and since 1843, it has been a pilgrimage site for locals and beer enthusiasts. This restaurant offers a rich selection of traditional Czech dishes, from classic roasted duck and goulash to various sausages and fried specialties, each bursting with authentic Czech flavor. The restaurant is divided into several areas, including an outdoor beer garden and indoor traditional pub-style dining areas, creating a unique atmosphere. Here, you can savor the freshest Pilsner Urquell beer paired with hearty Czech cuisine, experiencing Prague\u0027s truest dining culture. Its historical significance and quality food make it an unmissable landmark in New Town.", "name": "U Pinkas\u016f (Pinkas Restaurant)", "transport": "Take Metro Lines A or B to M\u016fstek station, then walk for about 2 minutes to arrive."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 802/56, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.0 stars | Vytopna Railway Restaurant, located in Wenceslas Square, is famous for its unique train delivery service. Miniature train tracks weave throughout the restaurant, delivering drinks directly to your table, adding endless fun to the dining experience. Besides the novel delivery method, it also offers a diverse range of traditional Czech dishes, including roasted pork knuckle, fried schnitzel, and various salads. Although it\u0027s strongly themed, the food quality remains high, and prices are reasonable. This restaurant is particularly popular with families and train enthusiasts, offering an entertaining and culinary dining option in Prague\u0027s New Town, allowing you to enjoy delicious food while experiencing a fun train journey.", "name": "Vytopna Railway Restaurant (Train Restaurant)", "transport": "Take Metro Lines A or B to M\u016fstek station, then walk for about 1 minute to arrive."}, {"address": "V Celnici 1031/4, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.1 stars | Kolkovna Celnice is a branch of the Kolkovna restaurant group, renowned for its high-quality Pilsner Urquell beer and classic Czech dishes. The restaurant is ideally located near Republic Square, with a modern yet comfortable interior that retains traditional pub elements. The menu is extensive, offering everything from hearty roasted duck and goulash to various traditional snacks, satisfying all your expectations for Czech cuisine. The beer quality is impeccable, with every glass fresh, cold, and finely foamed. Whether dining with friends or enjoying an authentic Czech lunch or dinner, Kolkovna Celnice is a reliable and popular choice, providing excellent service and delicious food.", "name": "Kolkovna Celnice (Kolkovna Customs Restaurant)", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station, then walk for about 1 minute to arrive."}, {"address": "Hybernsk\u00e1 1034/10, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.0 stars | Potrefen\u00e1 Husa is a well-known Czech restaurant chain, popular for its modern pub style and high-quality Staropramen beer. The Hybernsk\u00e1 branch, located in New Town, offers a range of refined traditional Czech dishes, while also incorporating some international flavors. The menu includes roasted pork ribs, schnitzel, and various salads, all prepared with fresh ingredients and exquisite cooking. The restaurant\u0027s interior design is stylish, with a relaxed and lively atmosphere, making it a great spot for young people and business diners. In addition to the food, there\u0027s a diverse selection of beers, making it an excellent place to sample different Czech brews. It successfully combines tradition with modernity, providing customers with a comfortable dining experience.", "name": "Potrefen\u00e1 Husa Hybernsk\u00e1 (Potrefen\u00e1 Husa Hybernsk\u00e1)", "transport": "Take Metro Lines B or C to Florenc station, then walk for about 5 minutes; or take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station, then walk for about 5 minutes."}, {"address": "\u0160kr\u00e9tova 1, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.1 stars | Dem\u00ednka is a traditional Czech restaurant with a long history, located in the heart of New Town, near the National Museum. It is known for its authentic Czech cuisine and cozy local atmosphere. The menu features all classic Czech dishes, such as aromatic roasted duck, goulash, schnitzel, and various soups, all served in generous portions with rich flavors. The restaurant\u0027s interior is simple yet comfortable, filled with the nostalgic charm of old Prague, and is a frequent haunt for local residents. If you wish to experience true Czech everyday dining culture in an environment free from tourist crowds, Dem\u00ednka is definitely a recommended choice.", "name": "Dem\u00ednka (Dem\u00ednka Restaurant)", "transport": "Take Metro Lines A or C to Muzeum station, then walk for about 1 minute to arrive."}, {"address": "Mysl\u00edkova 8, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.0 stars | Restaurace U Buben\u00ed\u010dk\u016f is a traditional Czech pub located in New Town, offering authentic Czech home-style dishes and fresh beer. This restaurant attracts local residents and tourists seeking an authentic experience with its unpretentious atmosphere and hearty, delicious food. The menu features classic goulash, roasted pork, and various traditional side dishes. Prices here are relatively affordable, and portions are generous, making it an excellent spot to savor everyday Czech cuisine. The restaurant\u0027s interior is simple, filled with the character of a local pub, making it a great choice to escape tourist crowds and enjoy a relaxed, pleasant meal. The friendly service will make you feel the warmth of Prague locals.", "name": "Restaurace U Buben\u00ed\u010dk\u016f (U Buben\u00ed\u010dk\u016f Restaurant)", "transport": "Take Metro Line B to Karlovo n\u00e1m\u011bst\u00ed station, then walk for about 5 minutes to arrive."}], "name": "Renowned Local Traditional Eateries"}, "cat_2": {"items": [{"address": "Na Florenci 1420/3, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | EMA espresso bar is a sanctuary for coffee lovers in Prague\u0027s New Town, renowned for its minimalist design and uncompromising pursuit of coffee quality. Their skilled baristas expertly craft each espresso, precisely showcasing the unique flavor of the beans. Whether it\u0027s a classic Italian espresso, a latte, or a pour-over, you\u0027ll experience the pure essence and beauty of coffee. The cafe\u0027s modern and vibrant atmosphere makes it an ideal spot for a quick, high-quality coffee or a brief meeting with friends. While it doesn\u0027t offer traditional brunch, its selection of pastries and sandwiches are excellent companions to your coffee, allowing you to find a moment of peace and enjoyment amidst the bustling city life.", "name": "EMA espresso bar", "transport": "Florenc station (Metro B, C lines), approx. 2-minute walk."}, {"address": "N\u00e1rodn\u00ed 22, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | Caf\u00e9 Louvre is one of Prague\u0027s most historic and culturally rich cafes, serving as a gathering place for intellectuals, artists, and celebrities since its opening in 1902. Stepping inside feels like a journey back to the Golden Age, with its magnificent Art Nouveau decor, high ceilings, crystal chandeliers, and elegant furnishings, all exuding an extraordinary charm. It offers a lavish breakfast and brunch, ranging from classic continental options to Czech specialties, perfectly complemented by a fragrant coffee or fresh juice \u2013 an ideal way to start a wonderful day in Prague. Beyond the delicious food, you can also enjoy the billiard room and reading area, soaking in the unique charm and historical ambiance of this century-old cafe.", "name": "Caf\u00e9 Louvre", "transport": "M\u016fstek station (Metro A, B lines), approx. 5-minute walk; or take a tram to N\u00e1rodn\u00ed t\u0159\u00edda station."}, {"address": "Jungmannova 30/21, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | IF Caf\u00e9 has several branches in Prague, and this one on Jungmannova Street is renowned for its exquisite desserts and high-quality coffee. Founded by famous pastry chef Iveta Fabe\u0161ov\u00e1, every cake, macaron, and pastry here is a work of art, with a taste that is equally stunning. The interior is stylish and comfortable, providing an elegant setting for you to leisurely enjoy coffee and desserts. In addition to sweets, they also offer light meals and simple dishes, making it an ideal choice for a refined brunch or afternoon tea. Whether for your eyes or your palate, IF Caf\u00e9 promises an unforgettable experience.", "name": "IF Caf\u00e9 (Jungmannova)", "transport": "M\u016fstek station (Metro A, B lines), approx. 3-minute walk."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 837/11, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | Located near Wenceslas Square, Coffee Corner Bakery is a cozy and popular coffee bakery. It\u0027s renowned for its freshly baked bread, pastries, and excellent coffee, making it a favorite spot for locals and tourists alike to enjoy breakfast or a light meal. The cafe\u0027s atmosphere is relaxed and comfortable, filled with the inviting aroma of baking, creating a truly soothing experience. You can choose from a wide variety of sweet and savory treats, paired with a meticulously brewed coffee by professional baristas \u2013 whether it\u0027s a cappuccino or an Americano, you\u0027ll feel utterly content. The friendly and efficient service makes this the perfect stop to refuel while exploring Prague\u0027s New Town.", "name": "Coffee Corner Bakery", "transport": "M\u016fstek station (Metro A, B lines), approx. 1-minute walk."}, {"address": "Vodickova 35, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | Styl \u0026 Interi\u00e9r is a unique concept store that cleverly combines a cafe with a design furniture shop. Stepping inside, you\u0027ll be captivated by rong sense of history. The menu primarily features traditional Czech cuisine, including roast duck, goulash, roasted pork knuckle, and various dumplings. While it might be slightly tourist-oriented, its unique setting and relatively authentic dishes still make it a worthwhile visit, especially for travelers seeking a meal in a special atmosphere.", "name": "U Zlat\u00e9 Konvice (U Zlat\u00e9 Konvice)", "transport": "Metro Line A to \"Starom\u011bstsk\u00e1\" station, approximately a 3-minute walk; alternatively, take a tram to \"Starom\u011bstsk\u00e1\" station, approximately a 2-minute walk."}], "name": "Renowned Local Traditional Shops"}, "cat_2": {"items": [{"address": "Templov\u00e1 7, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | A renowned waffle specialty shop in Prague\u0027s Old Town, famous for its diverse sweet and savory waffles and brunch options. The interior decor is simple and cozy, creating a comfortable and relaxing dining atmosphere. Whether it\u0027s classic sweet waffles with fresh fruit and maple syrup, or creative Eggs Benedict waffles, customers can feast to their heart\u0027s content. The coffee and fresh juices here are also highly praised, making it an excellent spot to start a wonderful day in Prague. Due to its high popularity, it\u0027s recommended to arrive early or make a reservation.", "name": "Den Noc Waffle Bar", "transport": "Metro lines A, B to M\u016fstek station, about a 5-minute walk; or take a tram to N\u00e1m\u011bst\u00ed Republiky station, about a 7-minute walk."}, {"address": "Ovocn\u00fd trh 19, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | Located on the second floor of the unique Cubist House of the Black Madonna, it is the world\u0027s only Cubist-style caf\u00e9. It not only offers exquisite coffee, desserts, and light meals but is also a living architectural artwork. Stepping into the caf\u00e9 feels like traveling back in time to the early 20th century, experiencing its unique geometric lines and decorative details. Sitting by the window, you can overlook the Old Town streets and enjoy a brunch or afternoon tea full of history and art.", "name": "Grand Caf\u00e9 Orient", "transport": "Metro line A to M\u016fstek or Starom\u011bstsk\u00e1 station, about a 5-7 minute walk; or take a tram to N\u00e1m\u011bst\u00ed Republiky station, about a 10-minute walk."}, {"address": "Valentinsk\u00e1 11, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | Tucked away in an Old Town alley, it has won the hearts of locals and tourists alike with its high-quality dishes and friendly service. The interior is modern and comfortable, offering a wide selection for breakfast, brunch, lunch, and dinner. From classic European breakfasts to Czech specialties, the ingredients are fresh, and the cooking is meticulous. Their Eggs Benedict and homemade cakes are especially recommended. The relaxed atmosphere here makes it an ideal place to escape the hustle and bustle and enjoy good food.", "name": "Mistral Caf\u00e9 \u0026 Restaurant", "transport": "Metro line A to Starom\u011bstsk\u00e1 station, about a 3-minute walk."}, {"address": "Koz\u00ed 1, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | A popular bakery and caf\u00e9 located in the heart of the Old Town, known for its freshly baked bread, pastries, sandwiches, and salads. The shop is always filled with enticing baking aromas, offering a variety of healthy brunch options, including delicious quiches, savory tarts, and various desserts. The coffee quality here is also quite good, making it an excellent choice for a quick breakfast or light meal. The space is bright and spacious, suitable for gathering with friends or enjoying a moment of peace alone.", "name": "Bakeshop Praha", "transport": "Metro line A to Starom\u011bstsk\u00e1 station, about a 7-minute walk; or take a tram to Dlouh\u00e1 t\u0159\u00edda station, about a 5-minute walk."}, {"address": "Lili ional and local flavors, offering a variety of healthy options, including homemade granola, Eggs Benedict, and fresh salads. It\u0027s an excellent place to enjoy high-quality coffee and gourmet food.", "name": "Artisan Caf\u00e9 \u0026 Bistrot", "transport": "Metro lines A, B to M\u016fstek station, about a 10-minute walk; or take a tram to Dlouh\u00e1 t\u0159\u00edda station, about a 3-minute walk."}, {"address": "\u0158et\u011bzov\u00e1 9, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.1 stars | Hidden on a quiet street in the Old Town, it is a small and cozy caf\u00e9. It is loved by locals for its quality coffee and comfortable atmosphere. Although the space is not large, every corner is full of unique charm. They offer a variety of coffee drinks, fresh juices, and some simple pastries, making it an ideal place to escape the tourist hustle and bustle and enjoy a moment of tranquility. Here, you can experience the authentic daily life of Prague\u0027s Old Town.", "name": "Caf\u00e9 Ebel", "transport": "Metro line A to Starom\u011bstsk\u00e1 station, about a 5-minute walk; or take a tram to Karlovy l\u00e1zn\u011b station, about a 3-minute walk."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "Dlouh\u00e1 33, 110 00 Star\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.4 stars | Lok\u00e1l Dlouh\u00e1\u00e1\u00e1 is one of Prague\u0027s most popular traditional Czech pubs, renowned for its fresh Pilsner Urquell draft beer and classic Czech home-style dishes. The atmosphere here is lively and authentic, with long wooden tables and friendly servers creating a relaxed and enjoyable dining experience. Must-try items on the menu include fried cheese (\u0027Sma\u017een\u00fd s\u00fdr\u0027), goulash (\u0027Gul\u00e1\u0161\u0027), and sausages with mustard (\u0027P\u00e1rek s ho\u0159\u010dic\u00ed\u0027). All dishes use local ingredients, ensuring freshness and quality. The beer is delivered directly from an underground cellar, guaranteeing optimal taste and temperature, making it an excellent place to experience true Czech culinary culture.", "name": "Lok\u00e1l Dlouh\u00e1\u00e1\u00e1 (Traditional Czech Pub)", "transport": "Metro Line A or B to M\u016fstek station, approximately 5-7 minutes walk; or take tram 17 or 18 to Dlouh\u00e1 t\u0159\u00edda station."}, {"address": "Na Per\u0161t\u00fdn\u011b 7, 110 00 Star\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.3 stars | U Medvidku is not only a historic traditional Czech restaurant but also a small brewery, famous for its unique \u0027X-Beer 33\u0027 dark lager, reportedly one of the strongest beers in the world. The restaurant\u0027s history dates back to 1466, and its interior is filled with medieval charm, offering a rich selection of traditional Czech dishes such as roasted pork knuckle (\u0027Pe\u010den\u00e9 vep\u0159ov\u00e9 koleno\u0027), duck (\u0027Kachna\u0027), and various stews. In addition to the food, there\u0027s a beer shop where you can purchase their specialty beers and souvenirs. For tourists looking to deeply experience Czech beer culture and savor authentic cuisine, U Medvidku is an unmissable choice.", "name": "U Medvidku (Little Bear Brewery Restaurant)", "transport": "Metro Line A or B to N\u00e1rodn\u00ed t\u0159\u00edda station, approximately 3 minutes walk; or take tram 2, 9, 18, or 22 to N\u00e1rodn\u00ed t\u0159\u00edda station."}, {"address": "Ko\u017en\u00e1 488/14, 110 00 Star\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Restaurace Mlejnice is renowned for its unique rustic decor and hearty traditional Czech cuisine. The restaurant\u0027s interior is filled with antique farming tools and wooden furniture, creating a warm and nostalgic atmosphere. Signature dishes here include roasted pork knuckle (\u0027Pe\u010den\u00e9 vep\u0159ov\u00e9 koleno\u0027), goulash (\u0027Gul\u00e1\u0161\u0027), and various meat platters, all generously portioned and reasonably priced. Mlejnice\u0027s dishes are rich in flavor, making them an excellent pairing with Czech beer. Due to its popularity, reservations are recommended, especially during peak dining hours. It\u0027s a great place to experience authentic Czech flavors and local hospitality.", "name": "Restaurace Mlejnice (Mill Restaurant)", "transport": "Metro Line A to Starom\u011bstsk\u00e1 station, approximately 5 minutes walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station."}, {"address": "K\u0159i\u017eovnick\u00e1 60/10, 110 00 Star\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.3 stars | Pivnice U Rudolfina, located near the Rudolfinum concert hall, is a traditional Czech pub beloved by locals and tourists alike. It\u0027s known for its fresh Pilsner Urquell draft beer and authentic Czech dishes. The interior is simple yet cozy, creating a relaxed and pleasant dining atmosphere. The menu offers a variety of classic Czech delicacies such as goulash (\u0027Gul\u00e1\u0161\u0027), roasted pork (\u0027Pe\u010den\u00e9 vep\u0159ov\u00e9\u0027), and fried cheese (\u0027Sma\u017een\u00fd s\u00fdr\u0027). The food portions here are generous and reasonably priced, making it a great place to experience Prague\u0027s everyday dining culture. After visiting nearby attractions, enjoying a cold beer and a hearty lunch or dinner here is an excellent choice.", "name": "Pivnice U Rudolfina (Rudolfinum Pub)", "transport": "Metro Line A to Starom\u011bstsk\u00e1 station, approximately 3 minutes walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station."}, {"address": "Karlova 160/8, 110 00 Star\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.1 stars | Good Food, Coffee \u0026 Bakery is one of Prague\u0027s most popular Trdeln\u00edk (chimney cake) specialty shops, offering a variety of innovative chimney cake flavors. Trdeln\u00edk is a traditional Czech sweet pastry, made by wrapping dough around a stick, baking it over an open flame, and then sprinkling it with rewing history. It offers a variety of house-brewed craft beers, from refreshing lagers to rich dark ales. The restaurant\u0027s menu primarily features traditional Czech dishes, with some modern elements incorporated, such as slow-roasted pork (\u0027Pomalu pe\u010den\u00e9 vep\u0159ov\u00e9\u0027) and various specialty salads. The interior decor is elegant and comfortable, blending historical charm with modern design. For beer enthusiasts and visitors seeking high-quality Czech cuisine, U T\u0159\u00ed R\u016f\u017e\u00ed is an ideal choice to enjoy fine dining while savoring excellent brews.", "name": "Restaurace U T\u0159\u00ed R\u016f\u017e\u00ed (Three Roses Brewery Restaurant)", "transport": "Metro Line A to Starom\u011bstsk\u00e1 station, approximately 7 minutes walk; or take tram 17 or 18 to Karlovy l\u00e1zn\u011b station."}, {"address": "Celetn\u00e1 597/20, 110 00 Star\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.0 stars | Old Prague Restaurant, located near Old Town Square, is a restaurant offering classic Czech cuisine. Its menu covers all popular Czech dishes, including goulash (\u0027Gul\u00e1\u0161\u0027), roasted duck (\u0027Pe\u010den\u00e1 kachna\u0027), and schnitzel (\u0027\u0158\u00edzek\u0027). The restaurant\u0027s interior is elegantly decorated, creating a comfortable dining environment. While it may not have the \u0027rustic\u0027 authenticity of some historic taverns, its consistent food quality and convenient location near major attractions make it a popular choice for tourists to sample Czech dishes. Service is typically efficient and friendly, making it a good place for a relaxed lunch or dinner.", "name": "Old Prague Restaurant", "transport": "Metro Line A to Starom\u011bstsk\u00e1 station, approximately 5 minutes walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station."}], "name": "Specialty Pubs \u0026 Street Food"}, "cat_4": {"items": [{"address": "U Radnice 8, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": s classic Czech home-style cooking. It is beloved by locals for its warm, family-like atmosphere and hearty meals. The menu features many traditional dishes such as beef goulash, roasted pork, and various soups. The prices are affordable, and portions are generous, making it an ideal choice for an authentic Czech culinary experience. While the restaurant is unpretentious, the quality of the food and the warmth of the service are impressive. For travelers looking to enjoy a substantial Czech meal after visiting Vy\u0161ehrad, this is a convenient and delicious option.", "name": "Restaurace Pod Vy\u0161ehradem (Under Vy\u0161ehrad Restaurant)", "transport": "Take tram lines 3, 17, or 18 to \u0027V\u00fdto\u0148\u0027 station and walk for about 5 minutes to reach it."}, {"address": "Vratislavova 36, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.1 stars | U \u0160em\u00edka is a traditional Czech restaurant brimming with local charm, attracting diners with its extensive menu and comfortable ambiance. Named after \u0160em\u00edk, the heroic horse from Vy\u0161ehrad legend, the restaurant\u0027s interior decor also carries a rich historical feel. It offers a variety of classic Czech dishes, including roasted pork knee, fried cheese, and various stews, accompanied by fresh salads and local beer. The food portions are generous, the taste is authentic, and the prices are reasonable. Whether for a family meal or drinks with friends, U \u0160em\u00edka provides a pleasant dining experience and is a great place to delve into Czech culinary culture.", "name": "Restaurace U \u0160em\u00edka (U \u0160em\u00edka Restaurant)", "transport": "Take tram lines 3, 17, or 18 to \u0027V\u00fdto\u0148\u0027 station and walk for about 7 minutes to reach it."}, {"address": "Vratislavova 30, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.4 stars | This charming cafe and bistro is known for its unique nostalgic atmosphere and delicious food. \u0027\u010cek\u00e1rna\u0027 means \u0027waiting room,\u0027 and its decor features vintage train station waiting room elements, creating a warm and cozy space. It offers not only high-quality coffee and tea but also a variety of light meals, salads, soups, and desserts, perfect for brunch or afternoon tea. On weekends, it\u0027s also a popular gathering spot for locals. Its friendly service and relaxed ambiance make it an excellent choice for finding a leisurely resting place near the Vy\u0161ehrad district.", "name": "Kav\u00e1rna \u010cek\u00e1rna (Waiting Room Cafe)", "transport": "Take tram lines 3, 17, or 18 to \u0027V\u00fdto\u0148\u0027 station and walk for about 6 minutes to reach it."}, {"address": "Ra\u0161\u00ednovo n\u00e1b\u0159. 383/54, 128 00 Praha 2-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | This wine bar, located on the banks of the Vltava River near the Vy\u0161ehrad district, offers a unique French Rh\u00f4ne Valley wine tasting experience, paired with exquisite Spanish tapas. It\u0027s an excellent choice for travelers who enjoy wine and light bites. The ambiance inside is elegant and relaxed, and professional sommeliers enthusiastically introduce the characteristics of various wines. In addition to wine, it also offers a selection of cheeses, hams, and olives, perfect for an evening drink with friends. Although not a traditional Czech restaurant, its unique positioning as a \u0027specialty wine bar\u0027 and high-quality service make it stand out in the area around Vy\u0161ehrad.", "name": "Na b\u0159ehu Rh\u00f4ny - Degustace v\u00edna a tapas (On the Banks of the Rh\u00f4ne - Wine and Tapas Tasting)", "transport": "Take tram lines 3 or 17 to \u0027V\u00fdto\u0148\u0027 station and walk for about 2 minutes to reach it."}, {"address": "T\u00e1borsk\u00e1 389/49, 140 00 Praha 4-Nusle, Czechia", "feature": "\u2b50 4.5 stars | Although slightly off the center of the Vy\u0161ehrad district, U Banseth\u016f is definitely worth a visit. This is a historic traditional Czech pub, famous throughout Prague for its signature \u0027roasted duck.\u0027 The roasted duck here has crispy skin and tender meat, served with traditional Czech bread dumplings and stewed cabbage, making it an exceptional delicacy. Besides roasted duck, the menu also features other authentic Czech dishes and local beers. The restaurant\u0027s interior is unpretentious, filled with an old Prague atmosphere, making it a great place to experience genuine local life and cuisine. The service is warm, and prices are reasonable, making it an ideal choice for travelers seeking an authentic Czech dining experience.", "name": "Restaurace U Banseth\u016f (U Banseth\u016f Restaurant)", "transport": "Take tram line 18 to \u0027Nuselsk\u00e9 schody\u0027 station and walk for about 3 minutes to reach it; or walk from the Vy\u0161ehrad district for about 15-20 minutes."}], "name": "Specialty Restaurants \u0026 Snacks"}, "cat_4": {"items": [{"address": "Na Pankr\u00e1ci 1724/129, 140 00 Praha 4-Nusle", "feature": "\u2b50 4.5 stars | Dhaba Beas is a well-known vegetarian buffet chain in Prague, famous for its freshly prepared Indian-style vegetarian dishes daily. This Pankr\u00e1c branch, not far from the Vy\u0161ehrad area, offers a diverse selection of curries, lentil soups, rice, salads, and desserts. All dishes are vegan or lacto-ovo vegetarian and affordably priced. The restaurant has a relaxed atmosphere, making it an ideal choice for a quick, healthy lunch. You can freely choose dishes according to your preference and appetite, charged by weight, ensuring each meal is fresh and exotic. The food here is not only delicious but also emphasizes ingredient quality and health, making it an excellent spot for vegetarians looking for a tasty lunch near Vy\u0161ehrad.", "name": "Dhaba Beas Na Pankr\u00e1ci", "transport": "Take Metro Line C to Pankr\u00e1c station, then walk for about 5 minutes."}, {"address": "B\u011blehradsk\u00e1 120, 120 00 Praha 2-Nusle", "featur stars | Restaurace U Kroka is a historic traditional Czech restaurant near the Vy\u0161ehrad area. While not exclusively vegetarian, it is known for its excellent service and vegetarian-friendly approach. The restaurant offers a variety of carefully prepared vegetarian options, including delicious fried cheese (\u0027Sma\u017een\u00fd s\u00fdr\u0027), mushroom risotto, vegetable salads, and daily vegetarian specials. The atmosphere here is warm and comfortable, imbued with the charm of old Prague, making it a perfect choice for experiencing authentic Czech cuisine while accommodating vegetarian needs. The restaurant\u0027s terrace is an excellent spot to enjoy a meal in good weather, allowing you to soak in the relaxed local life.", "name": "Restaurace U Kroka", "transport": "Approximately 5-10 minutes walk from the Vy\u0161ehrad area."}, {"address": "Podolsk\u00e9 n\u00e1b\u0159e\u017e\u00ed 1184/8, 147 00 Praha 4-Podol\u00ed", "feature": "\u2b50 4.4 stars | Podolka restaurant is located on the Vltava River, below the Vy\u0161ehrad area, and is popular for its charming river views and extensive menu. While offering a variety of meat dishes, this restaurant is also vegetarian-friendly, providing diverse vegetarian options including creative salads, pasta, vegetable curries, and seasonal vegetarian main courses. During warmer months, dining on the outdoor terrace, enjoying the river view while savoring your meal, is an ultimate pleasure. With its fresh ingredients, exquisite presentation, and relaxed atmosphere, Podolka is an excellent choice for finding vegetarian cuisine near the Vy\u0161ehrad area.", "name": "Podolka Podol\u00ed", "transport": "Approximately 15-20 minutes walk from the Vy\u0161ehrad area, or take tram 3 or 17 to Podolsk\u00e1 vod\u00e1rna station, then walk for about 2 minutes."}, {"address": "T\u00e1borsk\u00e1 31, 140 00 Praha 4-Nusle", "feature": "\u2b50 4.7 stars | Veganland is a highly-rated vegan restaurant in the Nusle district, known for its extensive menu and friendly service. The dishes here range from vegan versions of traditional Czech cuisine to creative international flavors. You can enjoy vegan fried cheese, vegan goulash, various burgers, wraps, and fresh salads. The restaurant\u0027s atmosphere is relaxed and pleasant, making it a popular choice for local vegetarians and tourists alike. Veganland not only offers delicious food but is also committed to promoting healthy, ethical eating principles, ensuring every customer can find their favorite vegan dish here.", "name": "Veganland Nusle", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-12 minutes; or take tram 18 or 24 to N\u00e1m\u011bst\u00ed Brat\u0159\u00ed Synk\u016f station, then walk for about 5 minutes."}, {"address": "Stroupe\u017enick\u00e9ho 493/10, 150 00 Praha 5-Sm\u00edchov", "feature": "\u2b50 4.5 stars | Kav\u00e1rna co hled\u00e1 jm\u00e9no (The Cafe That Seeks a Name) is located in the Sm\u00edchov district. While not a purely vegan restaurant, it is highly praised for its unique industrial design, spacious interior, and extensive brunch options, which include many delicious vegetarian and vegan choices. It offers fresh salads, creative sandwiches, vegetarian bowls, and various baked goods. The cafe\u0027s atmosphere is perfect for working, reading, or meeting friends, especially on weekends when its brunch is extremely popular. For those looking for a stylish, comfortable cafe near the Vy\u0161ehrad area that offers excellent vegetarian meals, Kav\u00e1rna co hled\u00e1 jm\u00e9no is definitely a great choice.", "name": "Kav\u00e1rna co hled\u00e1 jm\u00e9no", "transport": "Take Metro Line B to And\u011bl station, then walk for about 5 minutes; or from Vy\u0161ehrad area, take tram 18 to And\u011bl station, then walk for about 5 minutes."}, {"address": "Na Pankr\u00e1ci 125, 140 00 Praha 4-Nusle", "feature": "\u2b50 4.3 stars | Bio Zahrada is not just an organic food store but also features a small bistro offering healthy vegetarian lunches. Located in the Pankr\u00e1c district, very close to the Vy\u0161ehrad area, it\u0027s an ideal spot for a quick, healthy, and organic vegetarian meal. It offers freshly prepared soups, main courses, and salads daily, with all ingredients sourced from organic farms, ensuring food quality and flavor. The menu typically includes various vegetable stews, grain bowls, and creative vegetarian dishes. For vegetarians who prioritize healthy eating and organic ingredients, Bio Zahrada Bistro provides a reliable and delicious dining option, allowing you to enjoy pure natural flavors even near the Vy\u0161ehrad area.", "name": "Bio Zahrada Bistro", "transport": "Take Metro Line C to Pra\u017esk\u00e9ho povst\u00e1n\u00ed station, then walk for about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}}, "name": "\u9ad8\u5821\u5340 (Vy\u0161ehrad)"}};
        const themeHex = "#2563eb";
        const cityName = "Prague";

        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";

                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';

                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";

                card.innerHTML = `

                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">

                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">

                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
