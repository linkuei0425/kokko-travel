ectural feature is that up to 70% of its structure is built from high-grade steel, showcasing a sleek, minimalist style that feels highly modern and futuristic. Instead of traditional closed exterior walls, it utilizes fine steel mesh screens and glass windows, allowing natural breezes to flow freely throughout and providing incredible eco-friendly cooling\u2014earning it the nickname \u0027The Breathing Mosque.\u0027 Illuminated at night, its steel structures reflect beautifully in the surrounding pools, creating a stunning visual experience.", "name": "Iron Mosque / Tuanku Mizan Zainal Abidin Mosque (Masjid Tuanku Mizan Zainal Abidin)", "transport": "Take a Grab taxi directly to Presint 3 opposite the Palace of Justice, or take a pleasant 15-minute walk along the main boulevard from the Putra Mosque."}, {"address": "Jalan P15, Presint 15, 62050 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.3 stars | Located in Presint 15 of Putrajaya, the Natural History Museum is a fantastic place to explore Malaysia\u0027s rich biodiversity and natural heritage. The museum houses a vast collection of rare flora and fauna specimens from Peninsular Malaysia, Sabah, and Sarawak, including endangered species, massive marine life skeletons, insect displays, and fascinating fossils. Designed with interactive and educational elements, it is an ideal spot for family travelers and natural science enthusiasts looking for deep exploration.", "name": "Natural History Museum (Muzium Alam Semulajadi)", "transport": "Take a Grab taxi from Putrajaya Sentral; the ride takes about 12 to 15 minutes."}, {"address": "Istana Kehakiman, Presint 3, 62506 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.4 stars | Putrajaya\u0027s Palace of Justice houses Malaysia\u0027s Federal Court and Court of Appeal. Its grand architecture seamlessly blends Palladian and classical Islamic styles, featuring magnificent domes and imposing colonnades that make it one of Putrajaya\u0027s most majestic buildings. Inside, the Justice Museum presents a detailed overview of the evolution of Malaysia\u0027s legal system\u2014from the historical laws of the Malacca Sultanate to the modern judicial setup. Highlights include realistic courtroom recreations and judicial robes displays for immersive learning and photos.", "name": "Palace of Justice \u0026 Justice Museum (Istana Kehakiman \u0026 Muzium Kehakiman)", "transport": "Located along Putrajaya\u0027s main boulevard (Persiaran Perdana); take a Grab taxi straight to Presint 3."}, {"address": "No. 1, Jalan P1, Presint 1, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Located in Presint 1, the Perdana Leadership Foundation is an academic and cultural institution dedicated to researching and recording the historical contributions and political wisdom of Malaysia\u0027s Prime Ministers. The facility features themed exhibition spaces and a research library showcasing rare historical photos, archives, and memorabilia related to Malaysia\u0027s nation-building journey and development policies. Set within serene and lush green surroundings, it is an essential spot for gaining deep insights into Malaysia\u0027s modern political and cultural landscape.", "name": "Perdana Leadership Foundation", "transport": "Take a Grab taxi from Putra Mosque; it takes about 5 minutes to arrive."}, {"address": "Presint 2, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.3 stars | The Millennium Monument is a major outdoor landmark and historical showcase in Putrajaya, visually resembling a metallic rocket or an unopened hibiscus flower bud standing lakeside. Surrounding the monument is a spiraling, ascending walkway gallery lined with exquisite metal engravings and panels chronicling key historical milestones\u2014from ancient kingdoms and colonial times to independence and modern 21st-century progress. As visitors stroll along the timeline, they can also enjoy panoramic views of Putrajaya Lake and surrounding iconic architecture.", "name": "Millennium Monument Walkway (Monumen Alaf Baru)", "transport": "Walk about 10 to 15 minutes along the lakeside park from Putra Mosque, or take a Grab taxi to the Presint 2 waterfront."}, {"address": "Universiti Putra Malaysia, 43400 Serdang, Selangor, Malaysia", "feature": "\u2b50 4.6 stars | Located within the nearby campus of Universiti Putra Malaysia (UPM), this is one of Malaysia\u0027s premier museums dedicated to Malay cultural heritage. The highlight of the museum grounds is four authentic, century-old traditional Malay wooden mansions relocated from across Malaysia and reconstructed on-site, exemplifying masterful wood carvings and mortise-and-tenon joinery (built without nails). Inside, you\u0027ll find collections of Malay daggers (keris), traditional attire, musical instruments, and daily utensils. Guided tours offer a deep understanding of Malay historical wisdom and architectural artistry.", "name": "Malay Heritage Museum, UPM (Muzium Warisan Melayu UPM)", "transport": "Take a Grab taxi from the Putra Mosque area; the ride takes just 10 to 12 minutes."}, {"address": "7, Jalan P16, Presint 16, 62150 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.2 stars | Situated in Presint 16 of Putrajaya, the Agricultural Heritage Park is an eco-park featuring a live agricultural exhibition pavilion. The displays offer detailed insights into rubber tapping, palm oil processing, spice cultivation, and the evolution of traditional Malay farming tools. Visitors can wander among living spice plants, tropical fruit trees, and rubber trees, gaining a thorough understanding through educational exhibits and scale models of how agriculture shaped Malaysia\u0027s economic and cultural heritage.", "name": "Agricultural Heritage Park Exhibition Center (Taman Warisan Pertanian Putrajaya)", "transport": "Take a Grab taxi from Putrajaya Sentral; the drive takes about 10 minutes."}], "name": "Cultural Museums \u0026 Places of Worship"}, "cat_3": {"items": [{"address": "Presint 1, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.6 Stars | Putrajaya Lake is the beating heart of this federal territory. Spanning 650 hectares, this massive man-made lake gracefully frames the famous Putra Mosque and Putrajaya Bridge. Featuring crystal-clear waters and rich biodiversity, its shores are lined with winding waterfront promenades and cycling paths. Visitors can take a traditional Malay wooden cruise boat or a modern yacht to enjoy a 360-degree water view of the grand dome of the Putra Mosque and the majestic bridge. At sunset, the lake reflects the pink mosque bathed in golden rays\u2014a breathtakingly romantic scene and a classic Putrajaya sight you cannot miss.", "name": "Putrajaya Lake (Tasik Putrajaya)", "transport": "Take the KLIA Transit from KL Sentral to Putrajaya \u0026 Cyberjaya Station, then take a taxi or Grab for about 8 minutes to reach the lakeside."}, {"address": "Presint 1, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.5 Stars | Located north of the Putra Mosque, Putrajaya Botanical Garden is the largest botanical garden in Malaysia, covering over 92 hectares. Voted as one of the most beautiful botanical gardens in Asia, it is thoughtfully divided into various themed zones including floral gardens, palm hills, vine gardens, and tropical plant exploration areas, featuring over 750 species of tropical plants and exotic flowers from around the world. The garden features Moroccan-inspired French pavilions and stylish bridges perfect for photos. Vast lawns and shaded trees offer an ideal cool retreat where visitors can rent bicycles to ride around and immerse themselves in pure tropical lushness.", "name": "Putrajaya Botanical Garden (Taman Botani Putrajaya)", "transport": "About a 15-minute walk or a 3-minute Grab ride from the Putra Mosque to reach the main entrance."}, {"address": "Presint 13, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.3 Stars | Putrajaya Wetlands Park is the largest man-made freshwater wetland park in Malaysia, serving as a crucial ecological oasis and natural water filtration system for Putrajaya. Home to rich marshland ecosystems and aquatic plants, it attracts a variety of wild birds including egrets, kingfishers, and migratory birds, making it a haven for birdwatchers and nature photographers. The park features an 18-meter-tall lookout tower offering panoramic views over the lush greenery. An eco-exhibition center explains wetland conservation and biodiversity, while wooden boardwalks over the water offer a peaceful, pristine nature walk.", "name": "Putrajaya Wetlands Park (Taman Lahan Basah Putrajaya)", "transport": "About an 8 to 10-minute Grab ride from the Putra Mosque."}, {"address": "Presint 2, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.4 Stars | Situated in Precinct 2 of Putrajaya facing the Putra Mosque across the lake, Taman Wawasan is the ultimate hidden gem for capturing panoramic shots of the mosque. The park features rolling green lawns, landscaped trees, colorful flowers, and kilometers of lakefront walking and cycling paths. A modern observation deck and waterfront platform sit at its center, attracting locals and tourists at dusk for strolls, picnics, and workouts while enjoying gentle breezes and dreamy sunset reflections over the water and architecture.", "name": "Putrajaya Vision Park (Taman Wawasan Putrajaya)", "transport": "About a 5-minute Grab ride or a 15-minute walk across Seri Perdana Bridge from the Putra Mosque."}, {"address": "Presint 11, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.6 Stars | Perched on elevated ground in Putrajaya, Taman Saujana Hijau is renowned for its distinct European flair and refreshing hilly landscapes, making it a top Instagrammable hotspot and outdoor wedding photography destination. Spanning 41 hectares, it is split into European, English, and French gardens. Pines, cypresses, and vibrant flowers cover the hills; walking through winding pine-shaded trails feels like stepping into a charming European mountain town. The hilltop offers sprawling views over Putrajaya\u2019s architectural skyline and lush cityscape\u2014perfect for morning hikes or evening picnics.", "name": "Saujana Hijau Park (Taman Saujana Hijau)", "transport": "About a 10-minute Grab ride from the Putra Mosque."}, {"address": "Presint 16, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.2 Stars | Putrajaya Agricultural Heritage Park showcases Malaysia\u0027s rich traditional agricultural heritage and commercial tropical crops. The park cultivates a vast array of economic plants, including rubber trees, oil palms, pepper, cocoa, and exotic tropical fruits like durian, rambutan, and mangosteen. Visitors can stroll through orchards, learn about rubber tapping, and see traditional farming tools in action. Featuring traditional pavilions and observation decks, it lets you experience Malaysia\u0027s rural agrarian heritage amidst tranquil foliage and fruity aromas\u2014ideal for family outings and immersive eco-tours.", "name": "Putrajaya Agricultural Heritage Park (Taman Warisan Pertanian Putrajaya)", "transport": "About a 6-minute Grab ride from the Putra Mosque."}, {"address": "Presint 15, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.3 Stars | Serving as a green protective shield on Putrajaya\u2019s eastern border, Taman Rimba Alam preserves vast secondary tropical rainforests and hilly ecosystems. Home to tens of thousands of tropical trees, its fresh air has earned it the nickname \u0027The Lungs of Putrajaya.\u0027 The park features well-designed hiking trails, camping grounds, and mountain biking tracks, making it a great haven for outdoor enthusiasts and hikers. Walking beneath the dense foliage to the sound of birds and cicadas allows you to escape the city hustle and immerse in the pure healing relaxation of nature.", "name": "Putrajaya Nature Forest Park (Taman Rimba Alam Putrajaya)", "transport": "About an 8-minute Grab ride from the Putra Mosque."}, {"address": "Presint 1, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.5 Stars | Located adjacent to the Putra Mosque and the Prime Minister\u0027s Office (Perdana Putra), Pesisiran Putra is a landscaped waterfront promenade running along the shores of Putrajaya Lake. Lined with neat tropical palms and vibrant flowers, its smooth paved paths are perfect for walking, jogging, or cycling. Walking along the promenade offers varying angles of the stunning pink floating mosque and surrounding scenic waterfront views. With plenty of outdoor benches and cozy cafes along the way, it\u0027s a popular evening spot to catch a cool breeze, watch sunsets over the lake, and admire the sparkling night lights.", "name": "Putra Lake Promenade (Pesisiran Putra)", "transport": "Located on the lakeside right beneath the Putra Mosque; take the stairs down from the mosque plaza to reach directly."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Presint 1, 62502 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.7 Stars | Situated on the shores of Putrajaya Lake, the Putra Mosque is one of Malaysia\u0027s most iconic landmarks, constructed from rose-tinted granite that gives it a dreamlike pink aesthetic. The mosque\u0027s dome blends traditional Islamic art with modern craftsmanship, looking stunning against the backdrop of blue skies and green waters. Visitors can wear free pink robes provided at the entrance; the high-ceilinged prayer hall and intricate carvings inside are breathtaking, making it an absolute top choice for photos.", "name": "Putra Mosque (Masjid Putra)", "transport": "Take the KLIA Transit (ERL) to Putrajaya \u0026 Cyberjaya Station, then transfer to bus T509 or take a Grab ride for about 10 minutes."}, {"address": "Presint 1, 62502 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.5 Stars | Located at the head of Dataran Putra, Perdana Putra serves as the hub of Malaysia\u0027s federal administrative center. Its iconic green main dome blends Islamic, Moorish, and Western classical styles, exuding a majestic and solemn presence. Perched on a hill with Putrajaya Lake as its backdrop, it turns breathtakingly beautiful when illuminated at night. Visitors love posing at Dataran Putra with this politically and culturally significant landmark in the background.", "name": "Perdana Putra (Prime Minister\u0027s Office)", "transport": "A 2-minute walk from the Putra Mosque brings you to Dataran Putra for a full panoramic view of Perdana Putra."}, {"address": "Presint 1, 62502 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.6 Stars | Connecting Dataran Putra to the development precinct, the Putra Bridge draws architectural inspiration from the Khaju Bridge in Isfahan, Iran. Spanning roughly 435 meters, this two-tier bridge features a roadway above and a scenic promenade with dining areas below. Adorned with unique Islamic carvings, it offers close-up views of the Putra Mosque and serene lake scenery\u2014especially romantic at sunset when golden light dances across the water.", "name": "Putra Bridge (Jambatan Putra)", "transport": "Only a 3-minute walk from the Putra Mosque. You can also stroll along the lakeside to capture great photos from beneath the bridge."}, {"address": "Presint 1, 62502 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.4 Stars | Dataran Putra is a vast and grand circular plaza with a diameter of 300 meters, surrounded by the state flags of Malaysia and beautiful flowerbeds. Its centerpiece features an 11-pointed star design symbolizing national unity and prosperity. Hosting national celebrations and major events, it serves as the ultimate vantage point to capture both the Putra Mosque and Perdana Putra in one shot.", "name": "Dataran Putra (Putra Square)", "transport": "Located directly in front of the Putra Mosque, easily accessible on foot."}, {"address": "Taman Botani Putrajaya, Presint 1, 62000 Putrajaya, Malaysia", "feature": "\u2b50 4.5 Stars | Nestled deep inside the Putrajaya Botanical Garden, Astaka Morocco is a hidden gem that faithfully replicates traditional Moroccan courtyard art. Crafted by skilled Moroccan artisans, all intricate woodcarvings and ceramic zellij tiles were imported and assembled on-site. The complex geometric patterns, grand archways, and Arabic-style fountains evoke a rich North African vibe, making every photo look straight out of Arabian Nights.", "name": "Moroccan Pavilion (Astaka Morocco)", "transport": "Take an 8-minute Grab ride from the Putra Mosque to the entrance of Putrajaya Botanical Garden, then walk into the park."}, {"address": "Taman Putra Perdana, Presint 1, 62000 Putrajaya, Malaysia", "feature": "\u2b50 4.3 Stars | Secret Garden Putrajaya is a stunning night spot tucked within the trees surrounding Taman Putra Perdana. At night, the park lights up with vibrant LED lights and glowing trees, transforming into a magical scene reminiscent of Pandora from Avatar. Neon vines wrapped around trunks and twinkling lights on the ground create an enchanting atmosphere\u2014a must-visit hidden spot for night photography and romantic dates.", "name": "Secret Garden Putrajaya", "transport": "Take a 5-minute Grab ride from the Putra Mosque to reach Taman Putra Perdana."}, {"address": "Presint 2, 62100 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.6 Stars | Seri Wawasan Bridge is one of Putrajaya\u0027s most futuristic cable-stayed bridges, designed to resemble a magnificent sailboat gliding across the water. Featuring a dramatic futuristic silhouette, it lights up at night with a vibrant colorful light show reflected on the lake. A favorite location for car commercials and movies, it is also one of the best photography vantage points for panoramic night views of the lake and the Putra Mosque.", "name": "Seri Wawasan Bridge (Jambatan Seri Wawasan)", "transport": "About a 5-minute Grab ride from the Putra Mosque, or a scenic 20-minute walk along the lakeside promenade."}, {"address": "25, Jalan Tuanku Abdul Rahman, Presint 3, 62100 Putrajaya, Malaysia", "feature": "\u2b50 4.6 Stars | Also known as the Tuanku Mizan Zainal Abidin Mosque, it earned the nickname \u0027Iron Mosque\u0027 because roughly 70% of its structure is built from steel. Seamlessly blending modern industrial design with traditional Islamic geometric aesthetics, its standout feature is a wall-less open-air flow design utilizing fine wire mesh screens to filter sunlight and rain. Standing gracefully by the lake, it presents a striking, futuristic contrast to the nearby pink Putra Mosque.", "name": "Iron Mosque (Masjid Tuanku Mizan Zainal Abidin)", "transport": "About a 6-minute Grab ride from the Putra Mosque, or take bus T509 to Presint 3."}], "name": "Popular Photo Spots"}}, "name": "Putrajaya Pink Mosque Area"}, "sunway_city": {"categories": {"cat_1": {"items": [{"address": "Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.6 stars | Opened in 1997, Sunway Pyramid Shopping Mall is Malaysia\u0027s first flagship architectural landmark themed around ancient Egyptian culture. Its most striking feature is the magnificent giant Sphinx standing several stories high right at the main entrance, accompanied by a massive glass pyramid roof and detailed hieroglyphic wall carvings that perfectly recreate the mysterious allure of ancient Egypt. The interior design masterfully blends Pharaonic touches with modern commercial space, making it not only a local shopping paradise but also a visually stunning masterpiece of modern pseudo-ancient architecture that attracts countess tourists for photos.", "name": "Sunway Pyramid Sphinx and Pyramid Architecture", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, and walk for about 3 minutes to arrive."}, {"address": "3, Jalan PJS 11/11, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Built directly on the site of a vast, abandoned tin mine, Sunway Lagoon itself is a classic historical example of successfully transforming an industrial wasteland into an international tourism destination. Spanning the huge mining pit valley within the park, the Sunway Lagoon Pedestrian Suspension Bridge stretches 428 meters and was once certified by Guinness World Records as one of the world\u0027s longest pedestrian suspension bridges. Standing on the bridge, visitors can look down upon the tropical water park and man-made beach created from the former barren pit, marveling at Sunway City\u0027s legendary historical journey from a 1980s mining ruin to a sustainable eco-friendly smart township.", "name": "Sunway Lagoon Pedestrian Suspension Bridge \u0026 Mining Heritage Site", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station; the park entrance is directly outside the station."}, {"address": "1, Persiaran Lagoon, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Serving as a core landmark luxury hotel in Sunway City, the Sunway Resort Hotel seamlessly blends rich tropical charm with grand classical Mediterranean architecture. Perched on high ground at the edge of the old mining pit, the hotel lobby and main structure feature extensive stone carvings, soaring pillars, and grand terraces, creating a regal ambiance akin to a royal palace. Following major upgrades in recent years, it now incorporates cutting-edge modern design elements and eco-friendly green building concepts, forming Sunway City\u0027s most iconic skyline alongside the nearby Sunway Pyramid Sphinx.", "name": "Sunway Resort Hotel", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station and walk about 5 minutes to arrive."}, {"address": "Jalan PJS 7/13, Bandar Sunway, 46150 Petaling Jaya, Selangor, Malaysia", "feature": "\u2b50 4.6 stars | Located in the Subang Jaya community adjacent to Sunway City, this Hindu temple is one of the oldest and most iconic South Indian-style temples in the area. The temple features a classic and ornate \u0027Gopuram\u0027 (tower gateway) carved with hundreds of vivid, colorful statues of deities and mythological figures, showcasing exquisite traditional Indian sculpture craftsmanship. During Thaipusam or Diwali, grand religious ceremonies and celebrations are held here, drawing thousands of devotees and tourists to experience Malaysia\u0027s rich multicultural and religious architectural heritage.", "name": "Sri Subramaniar Swamy Temple Subang Jaya", "transport": "Take a taxi or Grab from Sunway Pyramid; it takes about 5 minutes to arrive."}, {"address": "12, Jalan USJ 1/15, USJ 1, 47600 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.7 stars | Situated right next to Sunway City, the Church of St. Thomas More is a historic and influential religious architectural landmark in the area. The exterior combines a clean, modern style with classic Catholic architectural lines, where a large cross and a sleek, soaring roofline stand solemn and serene amid lush greenery. Inside, it boasts a column-free spacious main hall with beautiful stained-glass windows that fill the space with a tranquil, sacred atmosphere. Beyond being a spiritual home for local Catholics, its elegant architecture and well-maintained gardens make it a serene landmark worth admiring.", "name": "Church of St. Thomas More, Subang Jaya", "transport": "Take a Grab or taxi from Sunway City; it takes about 8 minutes to arrive."}, {"address": "5, Jalan Universiti, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | The main campus buildings of Sunway University represent an iconic modern architectural complex centered on education and sustainability in Sunway City. The central academic building features grand modern geometric design with an emphasis on natural lighting and green integration. Its most unique feature is the Sunway Canopy Walk\u2014a fully enclosed, elevated pedestrian walkway over 1 kilometer long fitted with security cameras and eco-friendly ventilation. Weaving through tree canopies and the urban skyline, it bridges Sunway Pyramid, Sunway Lagoon, and the campus, serving as a stellar model of sustainable design and urban mobility integration.", "name": "Sunway University Canopy Walk \u0026 Academic Building", "transport": "Take the BRT Sunway Line to Sunway-Setia Jaya Station, or access directly via the Canopy Walk."}, {"address": "Jalan SS 13/1, Subang Jaya, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Guang Yin Teng is a historical Chinese Buddhist temple landmark near Sunway City that carries the heritage, history, and spiritual memories of early Chinese immigrants in Selangor. The temple architecture displays traditional Southern Chinese styles with sweeping eaves, red walls, green tiles, and intricate wood and stone carvings of dragons and phoenixes. Dedicated to Guanyin, the Goddess of Mercy, this temple serves as a peaceful sanctuary amid the bustling modern surroundings of Sunway City. It attracts many worshippers seeking blessings during Chinese New Year and Guanyin\u0027s Birthday.", "name": "Guang Yin Teng Temple Subang Jaya", "transport": "Take a Grab or taxi from Sunway Pyramid; it takes about 6 minutes to arrive."}, {"address": "Jalan 1/12, PJ Old Town, 46000 Petaling Jaya, Selangor, Malaysia", "feature": "\u2b50 4.2 stars | Located just east of Sunway City, Petaling Jaya Old Town (PJ Old Town) is the starting point of Selangor\u0027s oldest satellite town, dating back to the British colonial era in the 1950s. The area retains a large collection of post-WWII double-story shophouse architecture, rustic traditional markets (pasar), and historic British urban planning layouts. The vintage food courts and long-established local shops exude a deep nostalgic charm, making it a fantastic cultural destination for visitors eager to explore the historical contrast and post-war architectural evolution surrounding Sunway City.", "name": "Petaling Jaya Old Town Heritage Area", "transport": "Take a bus or taxi/Grab from Sunway City; it takes about 10\u201312 minutes to arrive."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "5, Jalan Universiti, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 Stars | Located within the Sunway University campus, this art and cultural exhibition space regularly hosts visual art exhibitions, graduation design showcases, and special cultural and historical exhibitions curated by local and international artists. Serving as a hub for academic and artistic exchange, it offers the public free entry to appreciate modern paintings, sculptures, and digital media art. Featuring a sleek, minimalist design with abundant natural light and modern exhibition facilities, every visitor can immerse themselves in a rich artistic atmosphere and feel the dynamic energy of youth creativity in a comfortable, elegant setting.", "name": "Sunway University Art \u0026 Gallery Space", "transport": "Take the BRT Sunway Line to Sunway University-Monash Station and walk about 3 minutes into the campus."}, {"address": "Lot 3591, Jalan SS 13/1, Subang Jaya Industrial Estate, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.7 Stars | Located near Sunway City, the Subang Jaya Buddhist Association is a cultural and religious center blending modern architecture with traditional Buddhist aesthetics. The complex features a solemn main hall, a well-stocked Buddhist library, and a lush meditation garden. It regularly hosts Buddhist cultural lectures, art workshops, calligraphy exhibitions, and charitable events. It\u0027s a wonderful haven for residents of Sunway and Subang Jaya seeking inner tranquility and a deeper experience of Eastern spiritual culture, highly praised by visitors for its grand architecture and serene atmosphere.", "name": "Subang Jaya Buddhist Association (SJBA)", "transport": "About a 5-minute taxi or Grab ride from Sunway Pyramid Shopping Mall."}, {"address": "Jalan USJ 11/4, USJ 11, 47620 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.7 Stars | The Church of St. Thomas More is one of the largest and most iconic Catholic churches around Sunway City, celebrated for its modern architectural design and impressive high-ceiling sanctuary interior. Its sleek exterior lines and beautiful stained-glass windows cast vibrant light inside, creating a tranquil and sacred ambiance. Beyond being a holy place of prayer and gathering for local parishioners, its unique modern religious architecture attracts many architecture and culture enthusiasts for visits and photos.", "name": "Church of St. Thomas More", "transport": "Take the LRT Kelana Jaya Line to USJ 7 Station, then transfer to a Grab ride for about 6 minutes."}, {"address": "PJS 11, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.6 Stars | Situated in the heart of Sunway City, the Sri Subramaniar Temple is a Hindu temple showcasing signature South Indian sculptural art styles. At the entrance stands a vibrant, intricately carved Gopuram (tower gateway) adorned with figures of deities and mythical creatures. During major Hindu festivals like Thaipusam, grand blessing ceremonies and cultural performances are held here, making it a premier landmark for exploring Malaysia\u0027s diverse Indian religious culture and traditional carving craftsmanship.", "name": "Sri Subramaniar Temple Bandar Sunway", "transport": "Take the BRT Sunway Line to SunMed Station and walk for about 8 minutes."}, {"address": "87, Jalan SS 15/2A, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.6 Stars | Adjacent to Sunway City, Core Design Gallery is one of the most influential contemporary art galleries in the Kuala Lumpur and Selangor region, focusing on promoting cutting-edge, vanguard Malaysian artists. The gallery offers an ultra-modern exhibition space displaying contemporary paintings, mixed media creations, sculptures, and avant-garde installations. Rotating curated exhibitions provide art collectors and enthusiasts an exquisite platform to deeply explore contemporary Malaysian visual culture and artistic movements.", "name": "Core Design Gallery", "transport": "Take the LRT Kelana Jaya Line to SS 15 Station, Exit 1, and walk about 5 minutes."}, {"address": "Jalan SS 13/1, Subang Jaya Industrial Estate, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.6 Stars | Located just a few minutes\u0027 drive from Sunway City, the Subang Jaya Guandi Temple is a vital center of folk faith and traditional culture for the local Chinese community. Built in traditional Chinese palace architecture with sweeping eaves and intricately painted beams, it honors Guan Sheng Di Jun (Lord Guan), the deity symbolizing loyalty and integrity. The temple houses exquisite wood carvings, stone sculptures, and Taoist murals that demonstrate exceptional traditional craftsmanship. During Guan Di\u0027s Birthday or Chinese New Year, the brightly illuminated temple draws countless worshippers and visitors to experience its vibrant folk cultural atmosphere.", "name": "Subang Jaya Guandi Temple", "transport": "About a 5-minute Grab ride from Sunway Pyramid."}, {"address": "Jalan PJS 8/9, Bandar Sunway, 46150 Petaling Jaya, Selangor, Malaysia", "feature": "\u2b50 4.8 Stars | Acts Church Sunway is a dynamic, modern church featuring contemporary design, located in the heart of the Sunway commercial district. Its main auditorium integrates advanced acoustic and lighting technology with contemporary theater style, hosting engaging modern music worship sessions and creative stage performances. The church frequently organizes youth arts festivals, music workshops, and community exhibitions, showcasing a fresh blend of arts, culture, and faith that appeals to a vibrant young crowd.", "name": "Acts Church Sunway", "transport": "Take the BRT Sunway Line to Setia Jaya Station and walk about 7 minutes."}, {"address": "Jalan SS 15/4, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.7 Stars | Faith Christian Centre Subang Jaya is a contemporary church that serves as both a place of worship and a hub for community arts and culture. Featuring grand architecture with striking geometric harmony, the interior houses a spacious main auditorium, cultural activity rooms, and a children\u0027s creative art zone. Beyond weekly services, it regularly hosts community concerts, choir performances, art classes, and cultural exchanges, standing as a prominent community and spiritual landmark on the border of Sunway City and Subang Jaya.", "name": "Faith Christian Centre Subang Jaya (FCC)", "transport": "Take the LRT Kelana Jaya Line to SS 15 Station and walk about 8 minutes."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "3, Jalan PJS 11/11, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 Stars | Located inside Sunway Lagoon, this interactive wildlife park is home to over 150 species of rare animals from around the world. Blending tropical rainforest landscapes with eco-trails, visitors can stroll along lush canopy walkways to observe white lions, white tigers, sun bears, and colorful exotic birds up close\u2014making it the ultimate blend of theme park excitement and nature education.", "name": "Sunway Lagoon Wildlife Park", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station; the park entrance is about a 3-minute walk away."}, {"address": "Jalan SS 12/1, SS 12, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.3 Stars | As the oldest and largest green lung in Subang Jaya, this park is built around a scenic natural lake. Featuring dense tropical vegetation, well-paved lakeside jogging tracks, a distinctive suspension bridge, and cozy pavilions, it\u2019s a favorite local eco-park for morning runs, leisurely strolls, and sunset views. Egrets and various waterfowl are often spotted foraging along the shore.", "name": "Subang Ria Recreational Park", "transport": "Take the KTM Komuter train to Subang Jaya Station, then transfer to a taxi or Grab for about 5 minutes."}, {"address": "Jalan South Quay, Sunway South Quay, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.4 Stars | A modern waterfront park surrounding the massive Sunway South Quay man-made lake. It features high-quality wooden boardwalks over the water and landscaped green pathways, with classic Sunway yachts frequently sailing across the lake. In the cool evening breeze, it\u0027s a perfect spot for a stroll to admire the enchanting night views where urban architecture reflects on the water.", "name": "Sunway South Quay Lake Promenade", "transport": "Take the BRT to Sunway South Quay-USJ1 Station, then walk along the lake promenade for about 5 minutes."}, {"address": "Jalan SS 7/15, Kelana Jaya, 47301 Petaling Jaya, Selangor, Malaysia", "feature": "\u2b50 4.2 Stars | A spacious urban park near Sunway City comprising seven interconnected lakes, offering vast, open views. The park is equipped with smooth jogging trails, picnic lawns, a children\u0027s playground, and boating facilities. Surrounded by lush trees and rich wildlife, it\u0027s a hidden gem for enjoying the laid-back natural scenery of KL\u0027s suburbs.", "name": "Taman Bandaran Kelana Jaya", "transport": "Take the LRT Kelana Jaya Line to Kelana Jaya Station, then take a 7-minute Grab ride."}, {"address": "Persiaran Wawasan, Pusat Bandar Puchong, 47100 Puchong, Selangor, Malaysia", "feature": "\u2b50 4.6 Stars | Located just a short drive from Sunway City, this virgin tropical rainforest reserve is a popular natural haven for hiking enthusiasts. Preserving a dense, untouched jungle ecosystem, it offers several hiking trails of varying difficulty and crystal-clear mountain streams. Reaching the summit rewards you with panoramic views of the bustling Sunway and Puchong skylines.", "name": "Ayer Hitam Forest Reserve (Wawasan Hill)", "transport": "It is recommended to take a Grab from Sunway City; the drive to the trailhead takes about 12 to 15 minutes."}, {"address": "Bukit Gasing, 46000 Petaling Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 Stars | Spanning about 100 hectares on the border between Petaling Jaya and Kuala Lumpur, this green forest park features a rich secondary forest ecosystem and vibrant birdlife. With its famous wooden suspension bridge and multiple hiking trails, it offers a rare forest-bathing experience right near the city\u2014a perfect escape from urban hustle.", "name": "Bukit Gasing Forest Reserve", "transport": "A Grab ride from Sunway City takes about 15 minutes to reach the main entrance."}, {"address": "1, Jalan Taylor\u0027s, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.4 Stars | Located adjacent to Sunway City, this spot is famous for its ultra-modern lakeside eco-campus design. The expansive central lake is encircled by lush lawns and tropical foliage, where geese and ducks can often be seen swimming. With picturesque waterfront walkways and a serene atmosphere, it\u0027s a unique green space combining nature and academic vibes.", "name": "Taylor\u0027s University Lakeside Campus Park", "transport": "About an 8-minute Grab ride from Sunway Pyramid Shopping Mall."}, {"address": "Jalan 22/49, Seksyen 22, 46300 Petaling Jaya, Selangor, Malaysia", "feature": "\u2b50 4.1 Stars | A peaceful neighborhood lake park near Sunway City featuring a large, serene central lake surrounded by towering old tropical trees and vibrant flowerbeds. Outfitted with a rubberized lake-encircling jogging track and outdoor fitness equipment, it attracts various bird species and offers a tranquil spot to unwind and breathe fresh air.", "name": "Taman Aman Park", "transport": "Take the LRT to Taman Paramount Station; the park entrance is a 3-minute walk from the exit."}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "3, Jalan PJS 11/11, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.6 Stars | Sunway Surf Beach at Sunway Lagoon is one of the world\u0027s largest man-made surf beaches, spanning an impressive 13,000 square meters. Featuring azure waters, soft white sand, and a backdrop of the iconic pyramid and theme park rides, it\u0027s a must-visit photo spot in Sunway City. Visitors can snap stunning tropical vacation-style photos, especially with the massive suspension bridge stretching across the sky in the background, adding incredible depth and drama to every shot.", "name": "Sunway Lagoon Surf Beach", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station; it is about a 3-minute walk away."}, {"address": "3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 Stars | The most iconic and striking feature of Sunway Pyramid Shopping Mall is the colossal Egyptian Sphinx standing tall at the main entrance. Imbued with ancient Egyptian mystery, this monumental statue\u2014paired with pharaoh motifs and pyramid architecture\u2014serves as a top photo spot for influencers and tourists alike. Illuminated beautifully day and night, posing here feels like an instant teleportation to ancient Egypt.", "name": "Sunway Pyramid Egyptian Sphinx Entrance", "transport": "Take the BRT Sunway Line to Sunway Pyramid Station and enter directly via the pedestrian bridge link."}, {"address": "3, Jalan PJS 11/11, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.7 Stars | Spanning 428 meters ac         const cityName = "Kuala Lumpur";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
