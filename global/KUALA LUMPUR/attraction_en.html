mpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.7 stars | Founded in 1894 by Sri Lankan monks and devotees working in Malaya, this is one of Kuala Lumpur\u0027s oldest and most significant Theravada Buddhist temples. The serene and solemn temple grounds feature venerated Buddha statues and a lush Bodhi tree. During Vesak Day, grand celebrations and processions take place here, drawing tens of thousands of devotees and visitors to pray, embodying rich religious history and cultural heritage.", "name": "Maha Vihara Buddhist Temple, Brickfields", "transport": "Walk about 8 minutes from KL Sentral, or take the KL Monorail to Tun Sambanthan Station and walk for 5 minutes."}, {"address": "3, Jalan Scott, Brickfields, 50470 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Built in 1902, this historic Tamil Hindu temple is dedicated to Lord Murugan. It is famous for its ornate, brightly colored Gopuram (entrance tower), which features hundreds of intricately carved deities. Serving as a cultural and religious sanctuary for Sri Lankan Tamils in Kuala Lumpur, it showcases exquisite South Indian temple craftsmanship.", "name": "Sri Kandaswamy Kovil", "transport": "Walk about 10 minutes from KL Sentral, or take the KL Monorail to Tun Sambanthan Station and walk about 4 minutes."}, {"address": "135, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Established in 1961, this Catholic church is named in honor of the famous missionary St. Francis Xavier. Featuring a clean and elegant modern Gothic design, its spacious and bright interior comes alive as sunlight filters through beautiful stained-glass windows. As a key spiritual center in Little India, it attracts a diverse community of worshippers every Sunday for Mass.", "name": "Church of St. Francis Xavier", "transport": "Located just a 5-minute walk from KL Sentral main station, making it extremely convenient to reach."}, {"address": "Jalan Sultan Abdul Samad, Brickfields, 50470 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Nestled in the predominantly Indian-influenced Brickfields neighborhood, this Taoist temple presents a unique cultural contrast. Dedicated to Xian Si Shi Ye and other deities, it stands as a testament to late 19th-century Chinese immigrants who worked in the local brickmaking and pioneer industries. Though modest in size, it remains active with vibrant incense offerings, intricate wood carvings, and a rich atmosphere of folk devotion.", "name": "Brickfields Seng Wong Temple", "transport": "Walk about 10 minutes from KL Sentral."}, {"address": "Jalan Stesen Sentral 5, Brickfields, 50470 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Established in 1953, this Sikh temple serves as a vital spiritual hub for Kuala Lumpur\u0027s Sikh community. The grand and solemn structure combines traditional Sikh architectural elements such as majestic domes and arches. Upholding the Sikh tradition of Langar (free community kitchen), it warmly welcomes visitors of all races and faiths, reflecting rich inclusivity and immigrant heritage.", "name": "Gurdwara Sahib Brickfields", "transport": "Walk about 6 minutes from the south exit of KL Sentral Station."}, {"address": "Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Located at the main entrance to Little India, this grand colorful arch and elephant fountain were jointly unveiled by the Malaysian and Indian governments, marking Brickfields\u0027 official transformation into a Little India cultural precinct. Adorned with traditional South Indian carved motifs, vibrant magenta hues, and charming elephant sculptures, it offers a lively atmosphere and is a must-visit photo spot.", "name": "Little India Elephant Fountain \u0026 Arch", "transport": "Walk about 5 minutes from KL Sentral, or take the KL Monorail to Tun Sambanthan Station and walk for 2 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Jabatan Muzium Malaysia, Jalan Damansara, Perdana Botanical Gardens, 50566 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Situated next to KL Sentral, the National Museum of Malaysia (Muzium Negara) is the premier destination for understanding Malaysia\u0027s rich history, culture, and traditional crafts. Designed in the style of a traditional Malay royal palace, its facade features grand color murals depicting key historical events. Inside, four main exhibition galleries showcase the evolution of the country: Prehistoric Era, Malay Kingdoms, Colonial Era, and Modern Malaysia. Displays include precious royal artifacts, traditional costumes, weapons, and folk musical instruments\u2014ideal for an in-depth exploration of Malaysia\u0027s multicultural heritage.", "name": "National Museum (Muzium Negara)", "transport": "Take the MRT to Muzium Negara Station for direct access, or walk about 5 to 10 minutes from KL Sentral via the underground pedestrian walkway."}, {"address": "220, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Built in 1904, the Vivekananda Ashram is one of the most iconic historical landmarks in Little India and is designated as a Malaysian National Heritage site. Featuring a striking bronze, pink, and white palette in Mughal and Indo-Saracenic colonial style, it boasts a bronze statue of the famous Indian philosopher Swami Vivekananda at its front. Standing as a testament to the deep roots of Indian immigrants in Kuala Lumpur since the late 19th century, it serves as a spiritual and educational hub for the community. Its unique architectural exterior makes it a fantastic spot for photography and soaking in Little India\u0027s cultural heritage.", "name": "Vivekananda Ashram", "transport": "About an 8-minute walk from KL Sentral to reach the main thoroughfare of Little India."}, {"address": "Jalan Sultan Hishamuddin, Kampung Attap, 50050 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Completed in 1910 and designed by British architect Arthur Benison Hubback, this historic station blends Moorish, Indo-Saracenic, and Victorian architectural styles, serving as Kuala Lumpur\u0027s primary railway hub in its heyday. Its arched domes, white spires, and intricate carvings create a romantic, exotic landscape. Inside, a small railway history display outlines the evolution of Malaysia\u0027s train network. For travelers fond of vintage architecture and historic photography, this cultural landmark is just one stop away from KL Sentral.", "name": "Old Kuala Lumpur Railway Station", "transport": "Take the KTM Komuter train 1 stop from KL Sentral to Kuala Lumpur Station, or walk about 15 minutes via the overhead pedestrian bridges."}, {"address": "73, Jalan Yew, Off Jalan Derby, 50460 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Built in 1903, Holy Rosary Church is a century-old Gothic Revival sanctuary. Featuring pristine white exterior walls, pointed spires, and delicate stained-glass windows, it exudes a serene, solemn beauty. Originally established to serve Kuala Lumpur\u0027s Chinese Hakka Catholic community, the church continues to host Mandarin masses and holds rich historical archives of Chinese Catholicism. Impeccably preserved, it stands as a religious and cultural site of significant historical and artistic value near KL Sentral.", "name": "Holy Rosary Church", "transport": "About a 5-minute walk from Maharajalela Station on the KL Monorail."}, {"address": "123, Jalan Berhal, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.7 stars | Founded in 1894 by Sri Lankan immigrants, the Buddhist Maha Vihara is a premier center for Theravada Buddhism in Malaysia. This peaceful heritage sanctuary features traditional Sri Lankan-style stupas, a sacred Bodhi tree, a well-stocked Buddhist library, and a museum archive. During Wesak Day, it hosts grand celebrations and illuminated float processions, reflecting immense religious, cultural, artistic value, and inclusive human spirit.", "name": "Buddhist Maha Vihara, Brickfields", "transport": "About a 10-minute walk from KL Sentral, located in the heart of the Little India neighborhood."}, {"address": "3, Jalan Scott, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Boasting over a century of history, Sri Kandaswamy Kovil is one of Kuala Lumpur\u0027s most magnificent and artistically significant Tamil Sri Lankan-style Hindu temples. Its standout feature is the towering Gopuram (entrance tower), intricately carved with hundreds of colorful, lifelike statues of Hindu deities and mythological figures. The interior offers a serene and sacred ambiance, making it a marvelous cultural destination to discover the religious heritage and traditional craftsmanship of Little India.", "name": "Sri Kandaswamy Kovil", "transport": "About an 8 to 10-minute walk from KL Sentral."}, {"address": "21, Jalan Sultan Abdul Samad, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Built in 1924 in the heart of Little India, Zion Lutheran Church is a historic house of worship blending simple European style with Southeast Asian colonial elements. Originally serving Christian immigrants from Tamil Nadu, India, it maintains a tradition of multilingual worship services to this day. Its warm red-tiled roof, white exterior walls, and classic wooden interior stand in charming contrast to the bustling surrounding streets, painting a unique picture of Little India\u0027s vibrant multicultural harmony.", "name": "Zion Lutheran Church", "transport": "About a 7-minute walk from KL Sentral."}, {"address": "53, Jalan Perdana, Tasik Perdana, 50480 Kuala Lumpur", "feature": "\u2b50 4.1 stars | Perched on a hill north of KL Sentral, Planetarium Negara combines Islamic dome aesthetics with futuristic architectural styles. Inside, interactive exhibition halls highlight Malaysia\u0027s space program achievements, historical astronomical instruments, astronaut training equipment, and an impressive dome theater screen. The outside park features replicas of ancient astronomical observatories, making it an engaging museum destination blending cultural heritage and scientific discovery.", "name": "Planetarium Negara (National Planetarium)", "transport": "About a 12 to 15-minute walk from KL Sentral via the Muzium Negara underground passageway or through the park grounds."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Jalan Kebun Bunga, Tasik Perdana, 50480 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Kuala Lumpur\u0027s oldest and most famous urban oasis, located right next to KL Sentral. Spanning over 90 hectares, the park features a massive central lake, charming plant-lined walking trails, and various themed gardens. With its fresh air, it is a favorite spot for locals to jog and walk, and a perfect haven for tourists to unwind. Packed with diverse tropical plant specimens and shaded pavilions, it offers a serene, leafy escape from the bustling city.", "name": "Perdana Botanical Garden", "transport": "About a 15-minute walk from KL Sentral, or take the free Go KL Red Line bus and get off at the Perdana Botanical Garden stop."}, {"address": "KL Bird Park, 920, Jalan Cenderawasih, Perdana Botanical Garden, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Renowned as the world\u0027s largest free-flight walk-in aviary, located within the Perdana Botanical Garden area. Spanning 20.9 acres, its key feature is the walk-in free-flight concept, where thousands of rare birds from around the globe\u2014such as peacocks, hornbills, and flamingos\u2014fly and roost freely beneath a massive net enclosure. Visitors can stroll through tropical rainforest-like landscapes, interact closely with stunning bird species, and enjoy thrilling bird shows.", "name": "Kuala Lumpur Bird Park", "transport": "About a 5-minute taxi or Grab ride from KL Sentral, or accessible on foot from the station via the Lake Gardens."}, {"address": "Jalan Cenderawasih, Tasik Perdana, 50480 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | A tropical canopy park near the Lake Gardens area close to KL Sentral, and one of the largest butterfly gardens in the world. Enclosed by a massive canopy net that simulates an authentic rainforest ecosystem, it houses thousands of lush tropical plants and vibrant flowers, hosting over 5,000 fluttering, colorful butterflies. Visitors can wander along winding footpaths, waterfalls, and koi ponds to experience the magical sight of butterflies fluttering around them. It also features an on-site insect museum showcasing various rare specimens.", "name": "Kuala Lumpur Butterfly Park", "transport": "About a 5 to 8-minute Grab ride from KL Sentral, or a 3-minute walk from the KL Bird Park."}, {"address": "Jalan Cenderawasih, Perdana Botanical Garden, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Perched on a high point in the Lake Gardens, this sanctuary is a paradise for flower enthusiasts. It showcases over 800 exquisite orchid species from Southeast Asia and around the globe, including rare wild varieties and hybrids. Thoughtfully designed with vine-draped pergolas, rustic gazebos, and stone-paved paths, the garden transforms into a dazzling, fragrant sea of colorful blooms during peak season\u2014making it an ideal spot for nature photography and admiring floral beauty.", "name": "Perdana Orchid Garden", "transport": "About a 6-minute Grab ride from KL Sentral, or follow the signs uphill on foot from the main area of Perdana Botanical Garden."}, {"address": "Perdana Botanical Garden, Jalan Cenderawasih, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.0 stars | A tranquil 2-hectare oasis tucked within the botanical garden. Surrounded by dense woods and rolling hills, the park is home to charming Dutch fallow deer as well as Malaysia\u0027s rare native mouse deer (Kanchil). Visitors can amble along boardwalk trails to observe these gentle creatures pacing and foraging beneath the canopy shade. It is a fantastic free attraction near KL Sentral for families and nature lovers alike.", "name": "Perdana Deer Park", "transport": "A 15 to 20-minute walk into the Perdana Botanical Garden from KL Sentral, or take a taxi to the main park entrance and walk in."}, {"address": "Perdana Botanical Garden, Heritage Park, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | A unique architectural highlight set alongside the serene Eco Lake in Perdana Botanical Garden. The Bamboo Playhouse is an open-air art installation built entirely from natural bamboo, masterfully blended into the surrounding landscape. Strolling along the lakefront, visitors can spot aquatic plants, ducks, and turtles paddling by. Climbing to the playhouse\u0027s raised bamboo observation platforms offers panoramic views over the lake and lush forest canopy, exemplifying a peaceful fusion of nature and sustainable architecture.", "name": "Bamboo Playhouse \u0026 Eco Lake Perdana", "transport": "About a 6-minute taxi ride from KL Sentral to the central lakeside area of the park, or walk in from the main Botanical Garden entrance."}, {"address": "Perdana Botanical Garden, Jln Parlimen, Kuala Lumpur, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | A sprawling forest park surrounding the famous National Monument (Tugu Negara), located adjacent to the green belt north of KL Sentral. The park features extensive trails through lush tropical secondary forest, complete with towering tree canopies, well-maintained boardwalks, and dirt hiking paths. Visitors can immerse themselves in a rejuvenating forest bath while exploring the solemn monument statues and fountain plaza with views of the KL skyline\u2014a perfect outdoor destination combining history, culture, and natural greenery.", "name": "Tugu Negara Park", "transport": "About a 7 to 10-minute Grab ride from KL Sentral, or take the KTM train to Bank Negara station and transfer to a taxi."}, {"address": "Jalan Parlimen, Perdana Botanical Garden, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | A charming landscaped garden tucked away on the hills below the National Monument, built to commemorate the formation of ASEAN. Skillfully utilizing the natural terrain, the park features sculptures made of bamboo, wood, iron, and stone crafted by leading artists from ASEAN member nations, artfully scattered among dense woods and open lawns. Walking along leaf-dappled stone paths, visitors can admire outdoor modern art while soaking in fresh forest air\u2014a hidden gem celebrating the essence of Southeast Asian culture and nature.", "name": "ASEAN Sculpture Garden", "transport": "About an 8-minute taxi ride from KL Sentral, or a 3-minute walk from the entrance of the National Monument."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | A soulful landmark located in the Brickfields neighborhood, overflowing with vibrant South Asian charm. The entire street is lined with colorful Indian-style architecture, floral garland vendors, spice shops, and traditional apparel stores. The vibrant colored arches and towering gateways here are hot Instagram photo spots, looking even more dreamy and romantic when lit up at night, effortlessly capturing a strong sense of exotic culture in every shot.", "name": "Little India Brickfields Arch \u0026 Streets", "transport": "Take the KL Monorail to Tun Sambanthan Station and walk for about 3 minutes."}, {"address": "3, Jalan Scott, Brickfields, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | This Sri Lankan Tamil-style Hindu temple with over a century of history is famous for its exquisitely grand Gopuram tower gate. The gate is sculpted with hundreds of vivid, brightly painted statues of Hindu deities, creating a striking visual impact. The serene interior atmosphere and perfect South Indian temple architectural structure draw countless photography enthusiasts for photos.", "name": "Sri Kandaswamy Kovil", "transport": "About an 8-minute walk from KL Sentral Station, or a 5-minute walk from Monorail Tun Sambanthan Station."}, {"address": "123, Jalan Berhal, Brickfields, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.7 stars | Founded in 1894, this Theravada Buddhist sanctuary offers a quiet and elegant environment away from the city\u0027s hustle and bustle. The temple enshrines exquisite Buddha statues and a sacred Bodhi tree, featuring architecture blended with traditional Sri Lankan style. Known for its peaceful classical corridors, white pagodas, and rich spiritual aura, it is a favorite spot for travelers seeking deep, meaningful photography.", "name": "Buddhist Maha Vihara, Brickfields", "transport": "About a 10-minute walk from KL Sentral Station, or a 6-minute walk from Monorail Tun Sambanthan Station."}, {"address": "220, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Built in 1904, this historic building displays an elegant Victorian and Indo-Saracenic Revival style, rich in classic elegance. A bronze statue of the great Indian philosopher Swami Vivekananda stands in front of the building. Its unique pink-and-white walls and refined archways make it a favorite landmark for architectural photography and retro aesthetic photoshoots.", "name": "Vivekananda Ashram", "transport": "About a 2-minute walk from Monorail Tun Sambanthan Station."}, {"address": "10, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Built in 1903, this Gothic Revival Catholic church boasts a pristine white exterior, sharp Gothic arches, and delicate stained-glass windows. Surrounded by modern skyscrapers, this century-old white church stands out as exceptionally pure and unique\u2014a rare piece of European religious architecture in downtown Kuala Lumpur that attracts many influencers and wedding photographers.", "name": "Holy Rosary Church", "transport": "About a 7-minute walk from KL Sentral Station."}, {"address": "201, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | A major elevated skybridge connecting KL Sentral Station and NU Sentral Shopping Centre, featuring a highly modern design with panoramic glass and steel structure. The sunlit glass corridor creates stunning geometric light and shadow effects during the day, while at night offering views of the busy KL Sentral railway tracks and bustling cityscape\u2014an ideal location for sleek urban photography.", "name": "NU Sentral Skybridge", "transport": "Directly connected to the main KL Sentral Station structure; follow the signs and walk through the mall connecting passage to arrive."}, {"address": "16, Jalan Thambipillay, Brickfields, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Built in 1916, this traditional Chinese temple blends Confucianism, Buddhism, and Taoism, featuring rich classic architectural elements like carved beams, painted rafters, sweeping eaves, and vintage red pillars. Nestled in Little India\u2014a predominantly South Asian area\u2014it stands out for its unique cultural harmony. Its red walls and green roof tiles shimmer beautifully in the sunlight, perfect for capturing shots steeped in history.", "name": "Sam Kow Tong Temple", "transport": "About a 5-minute walk from KL Sentral Station."}, {"address": "Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Located at the core intersection of Little India, this large signature fountain is surrounded by vibrant purple and white geometric colonnades rich in Indian style. Water sprays glisten in the sunlight, accompanied by classic Indian music playing in the background and the rich aroma of spices, instantly transporting you to an exotic street setting. It is one of the iconic must-snap landmarks when visiting Little India.", "name": "Little India Fountain", "transport": "Take the Monorail to Tun Sambanthan Station and walk along Jalan Tun Sambanthan for about 3 minutes."}], "name": "Popular Photo Spots"}}, "name": "Central Station and Little India"}, "klcc": {"categories": {"cat_1": {"items": [{"address": "Lower Ground (Concourse) Level, Petronas Twin Towers, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.7 stars | Once the tallest skyscrapers in the world, the Petronas Twin Towers remain the tallest twin towers today. Designed by Argentine-American architect C\u00e9sar Pelli, the architecture seamlessly blends modern reinforced concrete with traditional Islamic geometric art. Featuring a striking exterior of stainless steel and glass curtain walls, the towers are joined on the 41st and 42nd floors by the famous Skybridge. An observation deck on the 86th floor offers breathtaking panoramic views of the entire Kuala Lumpur cityscape, making it KL\u0027s most iconic modern architectural landmark.", "name": "Petronas Twin Towers", "transport": "Take the LRT Kelana Jaya Line to KLCC Station, then walk for about 3 minutes."}, {"address": "2 Jalan P Ramlee, Kuala Lumpur, 50250 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Standing at 421 meters, KL Tower (Menara Kuala Lumpur) is the tallest telecommunications tower in Southeast Asia and the seventh-tallest in the world. Its architectural design incorporates Islamic artistic flair, featuring intricate geometric patterns and crystal-like details on the tower head. Inside, you\u0027ll find a 360-degree revolving restaurant, an observation deck 274 meters above ground, and a thrilling glass-bottomed Sky Box. Situated atop the Bukit Nanas Forest Reserve, this iconic structure harmoniously blends modern architectural engineering with vibrant natural greenery.", "name": "KL Tower (Menara Kuala Lumpur)", "transport": "Take the KL Monorail to Bukit Nanas Station, then walk for about 10 minutes."}, {"address": "Lot 41, Seksyen 58, Jalan Pinang, Kuala Lumpur City Centre, 50450 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Located on the northern side of KLCC Park, As-Syakirin Mosque is also known as the KLCC Mosque. Completed in 1998, this modern Islamic architectural masterpiece can accommodate over 12,000 worshippers. Its design blends Middle Eastern traditions with sleek modern minimalism, using clever geometric openings to allow natural light and air to flow through. The grand dome and minaret offer a striking contrast between traditional faith and contemporary urban aesthetics against the backdrop of surrounding supertall skyscrapers.", "name": "As-Syakirin Mosque", "transport": "Take the LRT to KLCC Station and walk through KLCC Park for about 5 minutes."}, {"address": "Lorong Raja Muda Musa 3, Kampung Baru, 50300 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Spanning the Klang River, the Saloma Link is an avant-garde pedestrian bridge connecting Kampung Baru with the KLCC area. Measuring 370 meters in total length, its unique canopy design is inspired by the traditional Malay Sireh Pinang (betel nut leaf arrangement) used in weddings. Covered with over 4,000 LED panels, the bridge puts on a dazzling light show at night. Framed by the Petronas Twin Towers in the background, it has become one of Kuala Lumpur\u2019s most popular photography spots for modern architecture.", "name": "Saloma Link", "transport": "Take the LRT to Kampung Baru Station, then walk for about 3 minutes after exiting."}, {"address": "2, Jalan Stonor, Kuala Lumpur, 50450 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Managed by Badan Warisan Malaysia (Heritage Malaysia Trust), Rumah Penghulu Abu Seman is a highly historical, traditional Malay wooden stilt house nestled in the KLCC area. Originally built in the 1910s in Kedah, the house was meticulously dismantled, transported, and restored at its current location. Constructed entirely using nail-less mortise-and-tenon joinery and featuring exquisite wood carvings, it showcases the finest Malay woodworking craft and climate-adaptive architecture, serving as a rare historical treasure amid the bustling metropolis.", "name": "Rumah Penghulu Abu Seman", "transport": "Take the LRT to KLCC Station, then walk down Jalan Pinang and turn onto Jalan Stonor (approx. 12-minute walk)."}, {"address": "Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Situated at the heart of the KLCC precinct, the award-winning Kuala Lumpur Convention Centre is a modern architectural marvel. Designed with sustainability and functional elegance in mind, its sweeping glass facades and metallic roofs create a grand appearance. Seamlessly connected to KLCC Park and Aquaria KLCC, its spacious, light-filled concourses allow visitors to admire views of lush greenery and the Petronas Twin Towers. Its outstanding spatial design makes it a premier venue for major international conferences and exhibitions.", "name": "Kuala Lumpur Convention Centre", "transport": "Take the LRT to KLCC Station and walk through the Suria KLCC underground pedestrian walkway for about 5 minutes."}, {"address": "Off Jalan Ampang, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Rising 49 stories tall directly adjacent to the Petronas Twin Towers, Menara Maxis is an integral landmark in the KLCC skyline. Designed by world-renowned architects, its sleek exterior combines arched granite cladding with glass curtain walls, exuding refined modern elegance. The arched design at the top complements the sweeping geometric curves of the Twin Towers, while its podium integrates seamlessly with the Suria KLCC shopping mall, demonstrating exceptional urban spatial integration.", "name": "Menara Maxis", "transport": "Take the LRT to KLCC Station, then walk for about 2 minutes."}, {"address": "146, Jalan Ampang, Kuala Lumpur City Centre, 50450 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Standing 36 stories high along Jalan Ampang directly across from the Petronas Twin Towers, Menara Public Bank is one of the earliest iconic post-modernist structures in the KLCC financial district. The building features metallic reflective glass and granite architecture, complemented by a grand geometric colonnade and fountain landscape at its base. Elegant nighttime illumination creates a striking visual contrast with the nearby Twin Towers, marking a significant milestone in KL\u0027s financial growth history.", "name": "Menara Public Bank", "transport": "Take the LRT to KLCC Station, exit via Exit C, and cross Jalan Ampang (approx. 3-minute walk)."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Levels 3 and 5, Ilham Tower, No 8, Jalan Binjai, Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Located inside Ilham Tower, Ilham Gallery is one of Kuala Lumpur\u0027s premier public art spaces. The gallery regularly hosts special exhibitions featuring modern and contemporary artists from Malaysia and Southeast Asia. The exhibits range from paintings and sculptures to installations and photography, showcasing rich local culture and contemporary thought. The space is serene and boasts striking modern design. Offering free admission, it also features an art bookstore and a charming cafe, making it a perfect retreat for art enthusiasts seeking inspiration and quiet reflection.", "name": "Ilham Gallery", "transport": "Take the LRT Kelana Jaya Line to Ampang Park Station, then walk for about 3 minutes."}, {"address": "Level 4, Suria KLCC, Kuala Lumpur City Centre, Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Located on the 4th floor of Suria KLCC, Petrosains is a massive interactive science and petroleum museum founded by PETRONAS. Combining scientific principles, petroleum industry history, and future energy technology, it features engaging and educational hands-on exhibits, such as a simulated oil rig, a space exploration zone, and a motion theater. Fun for both adults and kids, it is one of the KLCC area\u0027s most iconic educational and family-friendly museums.", "name": "Petrosains, The Discovery Centre", "transport": "Take the LRT Kelana Jaya Line to KLCC Station and take the underground pedestrian walkway directly to the 4th floor of Suria KLCC shopping mall."}, {"address": "Level 2, Tower 2, PETRONAS Twin Towers, Kuala Lumpur City Centre, Kuala Lumpur, Malaysia", "feature": "\u2b50 4.7 stars | A world-class concert hall located at the base of the PETRONAS Twin Towers, this is the home of the Malaysian Philharmonic Orchestra (MPO). Famous for its magnificent acoustic design and elegant wooden interior, it houses a grand pipe organ crafted by world-renowned organ builders. Beyond orchestral performances, it regularly hosts jazz, traditional folk, and chamber music concerts, offering an elegant cultural immersion and top-notch audio-visual feast in KLCC.", "name": "Dewan Filharmonik Petronas", "transport": "Take the LRT Kelana Jaya Line to KLCC Station and walk to the PETRONAS Twin Towers concourse level."}, {"address": "109, Jalan Ampang, Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Housed in a grand British colonial-style building constructed in 1935, this site originally served as a wealthy tycoon\u0027s residence and a military headquarters during WWII. Today, it operates as a multicultural hub and tourism center. Rich in historical charm, it hosts regular traditional Malaysian dance performances, cultural exhibits, and handicraft workshops. A visit here allows you to admire classical architecture while gaining a deeper appreciation of Malaysia\u0027s rich multi-ethnic heritage.", "name": "Malaysia Tourism Centre (MaTiC)", "transport": "Take the KL Monorail to Bukit Nanas Station or the LRT to Dang Wangi Station, then walk for about 7 minutes."}, {"address": "Section 63, Jalan Conlay, Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Located on Jalan Conlay, this traditional Malay-style architectural complex is a cultural park housing a traditional craft museum, art galleries, and workshops. It showcases exquisite Batik textiles, Songket weaves, woodcarvings, and silverware, with master artisans demonstrating their craft on-site. Visitors can also join hands-on Batik DIY painting sessions to craft a unique souvenir, making it a valuable cultural and educational experience.", "name": "Kuala Lumpur Craft Complex (Kompleks Kraf Kuala Lumpur)", "transport": "Take the MRT Putrajaya Line to Conlay Station, then walk for about 3 minutes after exiting."}, {"address": "5, Jalan Bukit Nanas, Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Built in 1908, St. John\u0027s Cathedral is the mother church of the Roman Catholic Archdiocese of Kuala Lumpur and possesses a long, rich history. The exterior features a grand, elegant pure white basilica architectural style with twin spires topped with crosses, while the interior is adorned with solemn stained-glass windows and classical altars. Nestled in tranquil greenery near Bukit Nanas, this heritage cathedral offers a serene spiritual sanctuary and architectural treasure amidst busy downtown KL.", "name": "St. John\u0027s Cathedral Kuala Lumpur", "transport": "Take the KL Monorail to Bukit Nanas Station or the LRT to Dang Wangi Station, then walk for about 10 minutes."}, {"address": "Jalan Raja Chulan, Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Constructed in 1928, this neoclassical heritage building was originally Kuala Lumpur\u0027s Central Telephone Exchange. The museum traces the evolution of telecommunications in Malaysia from early telegraphs, hand-crank phones, and Morse code devices to modern satellite communications and digital technology. Featuring grand Greek columns and high-ceilinged halls, the building houses rare vintage telecom equipment and interactive exhibits, offering both tech-historical educational value and architectural appreciation.", "name": "Museum Telekom", "transport": "Take the LRT Kelana Jaya Line to Masjid Jamek Station, then walk for about 8 minutes."}, {"address": "Jalan Raja, Dataran Merdeka, Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Built in 1894, this is one of Kuala Lumpur\u0027s oldest Gothic Revival Anglican churches. Designed by a British colonial government architect, it features striking red-brick accents against white walls, elegant timber roof trusses, and a famous Henry Willis pipe organ inside. Accompanying Kuala Lumpur through decades of growth, this classically elegant church offers a peaceful, warm atmosphere and well-preserved historical charm, immersing visitors in rich historical and religious art.", "name": "Cathedral of St. Mary the Virgin", "transport": "Take the LRT Kelana Jaya Line to Masjid Jamek Station, then walk for about 6 minutes."}], "name": "Arts Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Lot 241, Level 2, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Meticulously designed by the renowned Brazilian landscape architect Roberto Burle Marx, this 50-hectare park is an urban oasis blending modernity and natural charm at the foot of the Petronas Twin Towers. Featuring over 1,900 indigenous plants and palm trees, the park boasts a 1.3 km high-impact rubber jogging track, a landscaped lake, artificial waterfalls, and elegant bridges, allowing visitors to enjoy a serene escape surrounded by fresh greenery amidst the bustling skyscraper skyline.", "name": "KLCC Park", "transport": "Take the LRT Kelana Jaya Line to KLCC Station, exit via Suria KLCC Shopping Centre, and walk for about 3 minutes."}, {"address": "KLCC Park, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Located in the center of KLCC Park, Lake Symphony spans approximately 10,000 square meters and features two large musical fountains capable of shooting water up to 42 meters high. Magnificent water shows run daily from morning to night, with the highlight being the light and sound fountain show at 8:00 PM, 9:00 PM, and 10:00 PM every evening. Set against the glowing night backdrop of the Petronas Twin Towers, it offers a romantic atmosphere popular with couples and photography enthusiasts.", "name": "Lake Symphony KLCC", "transport": "Take the LRT to KLCC Station and exit through the Suria KLCC lakefront entrance to reach the lakeside."}, {"address": "Lot 240, Jalan Raja Chulan, Bukit Kewangan, 50200 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Formerly known as the Bukit Nanas Forest Reserve, this is one of Kuala Lumpur\u0027s oldest natural reserves and a rare primary tropical rainforest situated right in the heart of a bustling city center. The park features an impressive Canopy Walk weaving through the treetops, allowing visitors to observe exotic tropical flora from a bird\u0027s-eye perspective while enjoying the unique skyline where lush greenery meets modern skyscrapers.", "name": "KL Forest Eco Park", "transport": "Take the KL Monorail to Bukit Nanas Station and walk for about 10 minutes to reach the entrance."}, {"address": "360, Jalan Ampang, Taman U Thant, 50450 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Located nearby, The LINC KL is an eco-friendly mall seamlessly integrating lush nature with modern art, built around a majestic century-old Bodhi tree. The complex features abundant natural light, verdant greenery, dreamlike sky gardens, colorful origami crane installations, and large-scale murals. It perfectly blends urban leisure with natural ecology, making it a wonderful spot for relaxation and Instagram-worthy photos.", "name": "The LINC KL Courtyard Garden", "transport": "Take the LRT Kelana Jaya Line to Ampang Park Station, and walk for about 5 minutes from Exit 1."}, {"address": "KLCC Park, Jalan Ampang, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Located on the west side of KLCC Park, this expansive green play area is specially designed for families. It features a large, free-access children\u0027s wading pool equipped with waterfalls and non-slip safety flooring, letting families cool off safely against the backdrop of the iconic Petronas Twin Towers. Surrounded by lush lawns, shaded walkways, climbing frames, and slides, it is one of downtown KL\u0027s premier family-friendly outdoor havens.", "name": "KLCC Park Children\u0027s Wading Pool \u0026 Playground", "transport": "Take the LRT to KLCC Station and walk for about 4 minutes via the Suria KLCC underground pedestrian walkway."}, {"address": "Persiaran TRX, Tun Razak Exchange, 55188 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.7 stars | A newly opened iconic rooftop park spanning over 10 acres atop The Exchange TRX mall near the KLCC district. The park boasts exquisitely designed landscaped gardens, outdoor water play areas, immersive nature trails, and an event lawn, featuring a remarkably diverse array of flora. From its elevated vantage points, visitors can enjoy 360-degree unobstructed views of iconic landmarks like the Petronas Twin Towers and KL Tower, exemplifying the ultimate harmony between modern cityscape and nature.", "name": "TRX City Park", "transport": "Take the MRT Kajang Line or Putrajaya Line to TRX Station, which offers direct access to the rooftop park via the mall."}, {"address": "KLCC Park, Jalan Pinang, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Situated in the northeastern corner of KLCC Park, this mosque (also known as the KLCC Mosque) is surrounded by meticulously manicured geometric Islamic-style gardens and tranquil reflecting pools. Lush foliage and swaying trees beautifully complement the mosque\u0027s blend of classical and modern dome architecture. Quieter than the main park walkways, it offers a peaceful spot to enjoy unique angles of the Petronas Twin Towers while immersing in tranquil urban greenery.", "name": "As-Syakirin Mosque Park KLCC", "transport": "Take the LRT to KLCC Station and walk along the northeastern path of KLCC Park for about 5 minutes."}, {"address": "Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Nestled right next to KLCC Park and the Petronas Twin Towers, this tropical landscape sanctuary features beautifully crafted botanical walkways and an outdoor infinity pool garden. Filled with coconut palms, ferns, and exotic flowers, it creates an exclusive, resort-like atmosphere. Guests can stroll through fragrant private green corridors while admiring up-close views of the soaring Twin Towers, enjoying a luxurious urban nature experience.", "name": "Mandarin Oriental Hotel Gardens KLCC", "transport": "Take the LRT to KLCC Station and walk towards the Mandarin Oriental Hotel for about 3 minutes after exiting."}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "Petronas Twin Towers, Lower Ground Level, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.7 Stars | The world\u0027s tallest twin towers, standing at an impressive 452 meters, serve as Kuala Lumpur\u0027s most iconic landmark. By day, they showcase a majestic modern steel-and-glass facade; by night, they illuminate brilliantly like 3D crystals. Must-visit photo spots include the fountain plaza at the main entrance, the bridge over the pond in KLCC Park behind the towers, the Skybridge on the 41st and 42nd floors, and the Observation Deck on the 86th floor for panoramic views of the glowing KL skyline.", "name": "Petronas Twin Towers", "transport": "Take the LRT Kelana Jaya (KJ) Line to \u0027KLCC Station\u0027 and follow the underground pedestrian walkway through Suria KLCC to reach the towers."}, {"address": "KLCC Park, Jalan Ampang, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.5 Stars | Designed by renowned landscape architect Roberto Burle Marx, this 50-acre tropical oasis features a 1.3 km jogging track, a children\u0027s wading pool, a large playground, and a man-made lake. It\u0027s the ultimate photo spot for capturing full-length views of the Petronas Twin Towers\u2014especially from the rainbow bridge near the lake, where lush greenery seamlessly blends with modern skyscrapers.", "name": "KLCC Park", "transport": "Take the LRT to \u0027KLCC Station\u0027 and exit through the ground floor of Suria KLCC to enter the park directly."}, {"address": "Lorong Kuda, Kampung Baru, 50300 Kuala Lumpur", "feature": "\u2b50 4.6 Stars | A trending pedestrian bridge connecting Kampung Baru and KLCC. Spanning 370 meters, its architecture is inspired by the traditional Malay betel leaf arrangement (\u0027Sireh Junjung\u0027). At night, it dazzles with vibrant LED light shows, offering a perfect angle to capture the Petronas Twin Towers in the background\u2014a top spot for night photography.", "name": "Saloma Link (Pintasan Saloma)", "transport": "Take the LRT to \u0027Kampung Baru Station\u0027 and walk about 5 minutes from the exit to reach the bridge entrance."}, {"address": "Simfoni Lake, KLCC Park, 50088 Kuala Lumpur", "feature": "\u2b50 4.4 Stars | Located at the man-made lake behind Suria KLCC, this dynamic musical fountain hosts scheduled light, music, and water shows every evening. Hundreds of jets dance to classic tunes and colorful lights, shooting water up to 42 meters high. Sitting on the lakeside steps at night to enjoy the show with the glowing Twin Towers in the background is one of the most romantic experiences in KLCC.", "name": "Lake Symphony at KLCC Park", "transport": "Take the LRT to \u0027KLCC Station\u0027 and walk through Suria KLCC mall out to the lakeside plaza."}, {"address": "241, Petronas Twin Towers, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.5 Stars | A premier 6-story shopping mall located directly beneath the Petronas Twin Towers, featuring luxury international brands, local labels, and diverse dining options. Indoor highlights include the giant landmark fountain on the lower ground level and the impressive domed ceiling. Home to Petrosains, The Discovery Centre, and Dewan Filharmonik Petronas, it\u2019s a must-visit hub for shopping, food, and photo ops.", "name": "Suria KLCC", "transport": "Directly connected to the LRT \u0027KLCC Station\u0027; exit the station to step right into Concourse level B1 of the mall."}, {"address": "Kuala Lumpur Convention Centre, Jalan Pinang, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.3 Stars | A world-class aquarium beneath the Kuala Lumpur Convention Centre, showcasing over 5,000 marine and land creatures across a 90-meter underwater tunnel. Walk through the transparent tunnel to see giant tiger sharks, stingrays, and sea turtles swimming right overhead. The dreamily lit jellyfish zone and daily feeding shows are also favorite photo spots.", "name": "Aquaria KLCC", "transport": "Take the LRT to \u0027KLCC Station\u0027 and walk 5\u201310 minutes via the underground pedestrian walkway from Suria KLCC to the Kuala Lumpur Convention Centre."}, {"address": "Jalan Pinang, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.4 Stars | An elevated, fully enclosed, air-conditioned pedestrian walkway spanning about 562 meters that connects KLCC and the Bukit Bintang shopping district. Equipped with 24-hour security, it allows visitors to comfortably travel between KL\u2019s two major hubs. Large glass windows along parts of the bridge offer unique elevated perspectives of bustling street views and surrounding skyscrapers.", "name": "KLCC - Bukit Bintang Pedestrian Walkway", "transport": "The walkway connects Kuala Lumpur Convention Centre (KLCC) and Pavilion KL. From \u0027KLCC Station\u0027, walk through the Convention Centre to access the walkway."}, {"address": "Kuala Lumpur Convention Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.4 Stars | A major modern exhibition center adjacent to the Petronas Twin Towers and KLCC Park, featuring a striking geometric glass facade. Beyond hosting major international conventions, its expansive outdoor plaza and sleek architectural lines make it a secret favorite spot for photographers to capture side profiles and glass reflections of the Twin Towers.", "name": "Kuala Lumpur Convention Centre", "transport": "Take the LRT to \u0027KLCC Station\u0027 and walk about 5 minutes via the underground walkway or through KLCC Park."}], "name": "Popular Photo Spots"}}, "name": "Kuala Lumpur City Centre and Petronas Twin Towers"}, "merdeka_lake_gardens": {"categories": {"cat_1": {"items": [{"address": "Jalan Raja, Historic City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Built in 1897, the Sultan Abdul Samad Building is one of Kuala Lumpur\u0027s most iconic historical landmarks. Designed in a blend of Moorish and Mughal Revival styles, the structure features copper-red brick walls, elegant arches, and a prominent 41-meter central clock tower, showcasing a rich fusion of Islamic and colonial architecture. Historically the administrative center for the British colonial government, it currently houses government offices. Illumination at night renders the building resplendently golden, making it a must-visit spot for photography enthusiasts and tourists.", "name": "Sultan Abdul Samad Building", "transport": "Take the LRT to Masjid Jamek Station and walk for about 5 minutes."}, {"address": "Jalan Raja, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Merdeka Square is at the heart of Malaysia\u0027s national history. At midnight on August 31, 1957, the Union Jack was lowered and the Malaysian flag was raised for the first time, signaling the nation\u0027s formal independence. A massive 95.25-meter flagpole stands at the center of the square, once one of the tallest in the world. Surrounded by classic British colonial-era architecture, the spacious green lawn serves as an ideal venue for National Day celebrations and major cultural events. Strolling through allows visitors to feel the poignant history of Malaysia\u0027s journey from colonial rule to independence.", "name": "Merdeka Square (Dataran Merdeka)", "transport": "Take the LRT to Masjid Jamek Station and walk for about 6 minutes."}, {"address": "Jalan Sultan Hishamuddin, Perdana Botanical Gardens, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Completed in 1910 and designed by British architect Arthur Benison Hubback, the Old Kuala Lumpur Railway Station seamlessly blends Moorish, Mughal, and Indo-Gothic architectural styles. With majestic domes, delicate arches, and white spired arcades, the exterior resembles an Islamic palace. Prior to the opening of KL Sentral, it served as Malaysia\u0027s busiest railway hub. Today, it still operates a few commuter trains, and its unique historic charm and aesthetic appeal draw countless architecture enthusiasts and photographers.", "name": "Kuala Lumpur Railway Station", "transport": "Take the KTM Komuter train to Kuala Lumpur Station, or take the MRT to Pasar Seni Station and walk for about 7 minutes via the pedestrian bridge."}, {"address": "Jalan Perdana, Tasik Perdana, 50480 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Completed in 1965, the National Mosque of Malaysia is one of the largest mosques in Southeast Asia and a key symbol of the nation\u0027s independent spirit. Its most striking feature is the 18-pointed star-shaped, umbrella-like main roof in blue-violet, symbolizing Malaysia\u0027s 13 states and the Five Pillars of Islam. The soaring 73-meter minaret showcases the sleek majesty of modern Islamic architecture. The complex includes a grand prayer hall, open corridors, and serene courtyard gardens with reflective pools. Visitors must dress respectfully in robes provided free on-site, making it an indispensable destination to experience Islamic culture.", "name": "National Mosque of Malaysia (Masjid Negara)", "transport": "Take the KTM train to Kuala Lumpur Station, or walk for about 10 minutes from MRT Pasar Seni Station via the pedestrian skybridge."}, {"address": "1, Jalan Raja, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Founded in 1884, the Royal Selangor Club features classic Tudor Revival architecture, with black-and-white timber framing and pitched roofs evoking the English countryside. During the colonial era, it was an exclusive private club for British officers, nobility, and high society to socialize, play cricket, and relax. Located right beside Merdeka Square\u0027s lawn, this historic building has survived fires and undergone several renovations while retaining its elegant vintage charm, standing witness to Kuala Lumpur\u0027s transformation from a tin-mining town into a global metropolis.", "name": "Royal Selangor Club", "transport": "Take the LRT to Masjid Jamek Station and walk towards Merdeka Square for about 5 minutes."}, {"address": "27, Jalan Raja, Dataran Merdeka, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Housed in an elegant Neo-Gothic red-brick building constructed in 1898 as the Government Printing Office, the Kuala Lumpur City Gallery chronicles the city\u0027s evolution from early settlements to a modern metropolis. Highlights include a detailed massive scale model of Kuala Lumpur paired with a light-and-sound show. Outside stands the iconic \u0027I LOVE KL\u0027 monument, a massively popular photo spot for travelers worldwide. Offering local handicrafts and exquisite refreshments, it serves as the perfect starting point to discover the city\u0027s heritage.", "name": "Kuala Lumpur City Gallery", "transport": "Take the LRT to Masjid Jamek Station and walk for about 7 minutes, or take the free Go KL Red Line bus to Dataran Merdeka Station."}, {"address": "Jalan Raja, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Built in 1894 and designed by British architect A.C. Norman, St. Mary\u0027s Cathedral is the oldest Anglican church in Kuala Lumpur. Designed in a charming Gothic Revival country-church style, it features white granite walls, exquisite stained-glass windows, and rustic timber roof structures. Inside, it houses a historic pipe organ built in 1895 by the famous organ builder Henry Willis. The cathedral\u0027s solemn and tranquil atmosphere offers a peaceful refuge from the bustling city outside.", "name": "St. Mary\u0027s Cathedral Kuala Lumpur", "transport": "Take the LRT to Masjid Jamek Station and walk along Jalan Raja for about 5 minutes."}, {"address": "Dataran Merdeka, Jalan Raja, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Situated at the northeastern corner of Merdeka Square, the Queen Victoria Fountain was imported from England and assembled in 1897 to commemorate the Diamond Jubilee of Queen Victoria. The cast-iron fountain displays elaborate late 19th-century Victorian details, including fine figurative sculptures, an octagonal basin, and intricate floral motifs. Having weathered over a century of history, it still trickles quietly beside the square, serving as a rare testament to classic colonial craftsmanship.", "name": "Queen Victoria Fountain", "transport": "Take the LRT to Masjid Jamek Station and walk for about 5 minutes into Merdeka Square."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Jabatan Muzium Malaysia, Jln Damansara, Perdana Botanical Gardens, 50566 Kuala Lumpur", "feature": "\u2b50 4.4 Stars | The National Museum of Malaysia is the premier destination to explore the country\u0027s rich history and vibrant culture. The building\u0027s exterior seamlessly blends traditional Malay wooden architecture with modern accents, featuring giant murals depicting Malaysia\u0027s historical evolution. Inside, four main galleries showcase the journey from the Paleolithic age to modern-day Malaysia, displaying a vast collection of ancient artifacts, royal regalia, traditional weapons, and folk crafts.", "name": "National Museum of Malaysia", "transport": "Take the MRT to Muzium Negara Station and walk for about 2 minutes."}, {"address": "Perdana, Jalan Perdana, Tasik Perdana, 50480 Kuala Lumpur", "feature": "\u2b50 4.7 Stars | As the largest museum of Islamic art in Southeast Asia, located next to the Perdana Botanical Garden, the building itself is a masterpiece featuring stunning blue domes and abundant natural light. It houses over 10,000 Islamic artifacts from around the world, including rare handwritten Qurans, intricate architectural scale models, textiles, jewelry, and weaponry, showcasing the exquisite craftsmanship and rich history of Islamic civilization.", "name": "Islamic Arts Museum Malaysia", "transport": "Take the MRT to Muzium Negara Station and walk about 8 minutes towards the Perdana Botanical Garden."}, {"address": "26, Jalan Raja, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.4 Stars | Housed in an elegant Mughal-revival red-brick building next to Merdeka Square, the National Textile Museum highlights Malaysia\u2019s rich textile heritage and traditional craftsmanship. The exhibits feature gold-thread embroidery (Songket), Batik, as well as traditional costumes and weaving tools of various indigenous ethnic groups. Visitors can gain deep insights into the evolution and cultural significance of Southeast Asian textile techniques.", "name": "National Textile Museum", "transport": "Take the LRT to Masjid Jamek Station and walk for about 5 minutes."}, {"address": "27, Jalan Raja, Dataran Merdeka, 50050 Kuala Lumpur", "feature": "\u2b50 4.1 Stars | Located inside a century-old historic building next to Merdeka Square, the Kuala Lumpur City Gallery is an excellent starting point to explore KL\u0027s past, present, and future. The highlight is a massive 3D miniature city model light show. It is also home to the famous \u0027I Love KL\u0027 iconic sculpture. The gallery offers DIY workshops and a charming caf\u00e9, providing visitors with an immersive cultural experience.", "name": "Kuala Lumpur City Gallery", "transport": "Take the LRT to Masjid Jamek Station and walk past Merdeka Square for about 6 minutes."}, {"address": "Jalan Raja, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.5 Stars | Built in 1894, the Cathedral of St. Mary the Virgin is the oldest Anglican church in Kuala Lumpur. Designed by a British architect, it presents an elegant Early English Gothic architectural style. The interior houses beautiful stained glass windows and a historic pipe organ. Its serene atmosphere stands in peaceful contrast to the bustling city, making it a highly significant historic landmark near Merdeka Square.", "name": "Cathedral of St. Mary the Virgin", "transport": "Take the LRT to Masjid Jamek Station and walk about 5 minutes to reach the church on the north side of Merdeka Square."}, {"address": "5, Jalan Perdana, Tasik Perdana, 50480 Kuala Lumpur", "feature": "\u2b50 4.5 Stars | Tucked away in the Perdana Botanical Garden area, the Royal Malaysian Police Museum chronicles the history and evolution of the Malaysian police force from the Malacca Sultanate era to the present day. Exhibits include historical police weapons, uniforms, armored vehicles, seized criminal artifacts, and archives covering the Malayan Emergency and secret societies. Entry is free and highly educational.", "name": "Royal Malaysian Police Museum", "transport": "Take the MRT to Muzium Negara Station, then walk about 10 minutes or take a short taxi ride."}, {"address": "Sasana Kijang, 2, Jalan Dato Onn, Kuala Lumpur, 50480 Kuala Lumpur", "feature": "\u2b50 4.6 Stars | This modern and highly interactive museum offers free admission and features six thematic galleries covering numismatics, economics, and outstanding artwork by Malaysian and Southeast Asian artists. The signature photo spot is the famous RM1 Million Tunnel made of currency notes, which is immensely popular among visitors of all ages, combining education with entertainment.", "name": "Bank Negara Malaysia Museum and Art Gallery", "transport": "Take the KTM Komuter to Bank Negara Station and walk for about 8 minutes."}, {"address": "Jalan Raja Chulan, Bukit Kewangan, 50200 Kuala Lumpur", "feature": "\u2b50 4.0 Stars | Housed in a stunning Neo-Classical Greek Revival building constructed in 1928, the Telekom Museum traces the evolution of telecommunications in Malaysia\u2014from early Morse code and hand-crank telephones to modern fiber optics and wireless networks. Featuring a rich collection of vintage communication gear, it is ideal for visitors intrigued by technology and telecommunications history.", "name": "Telekom Museum (Muzium Telekom)", "transport": "Take the LRT to Masjid Jamek Station and walk for about 7 minutes."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Jalan Kebun Bunga, Tasik Perdana, 50480 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Covering over 92 hectares, Perdana Botanical Garden (formerly known as Lake Gardens) is the oldest and most famous green oasis in downtown Kuala Lumpur. Established during the colonial era in 1888, the park is built around a man-made lake and boasts a rich tropical plant ecosystem. It features several themed areas, including a tropical tree section, a herb garden, and a fern garden. Strolling through the park offers views of majestic tropical trees and serene lake scenery. Not only is it a top choice for locals\u0027 morning jogs and weekend outings, but it is also home to abundant wild birds and small animals, allowing visitors to enjoy rare tranquility and natural phytoncides amid the city\u0027s hustle and bustle.", "name": "Perdana Botanical Garden", "transport": "Take the LRT to Pasar Seni Station, then transfer to a bus or taxi (approx. 5 mins); or take the free Go KL Red Line tourist bus to the Perdana Botanical Garden stop."}, {"address": "920, Jalan Cenderawasih, Perdana Botanical Garden, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | KL Bird Park is the world\u0027s largest free-flight walk-in aviary, spanning approximately 20.9 acres. Home to over 3,000 birds from more than 200 species\u2014mostly native and tropical\u2014the park\u0027s most unique feature is its massive canopy net design. Breaking away from traditional cages, it allows peacocks, hornbills, flamingos, and vibrant rainbow lorikeets to fly and perch freely right beside visitors. The park offers daily bird shows, feeding experiences, and informative exhibition halls, making it ideal for family trips and photography enthusiasts looking to connect with nature.", "name": "KL Bird Park", "transport": "Take the KTM Komuter train to Kuala Lumpur Station, then walk for about 15 minutes to reach the park entrance."}, {"address": "Jalan Cenderawasih, Tasik Perdana, 50480 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Located right next to the Bird Park, KL Butterfly Park is one of the largest butterfly houses in Southeast Asia. Covered by a massive net enclosure, it meticulously replicates a realistic tropical rainforest environment. It is home to over 5,000 colorful butterflies across 120 species, fluttering among lush tropical foliage, ferns, and vibrant flowers. The park also features waterfalls, streams, koi ponds, and an insect museum exhibiting rare specimens and beetles, allowing visitors to immerse themselves in a magical butterfly realm while learning about tropical insect ecology.", "name": "KL Butterfly Park", "transport": "Take the KTM to Kuala Lumpur Station and walk along Jalan Cenderawasih for about 12 minutes, or take a Grab taxi directly."}, {"address": "Jalan Cenderawasih, Perdana Botanical Garden, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Perched at the highest point of the Perdana Botanical Garden, the Orchid Garden spans about 1 hectare and is a paradise for flower lovers. It houses thousands of colorful native and hybrid orchids across over 800 species, ranging from precious Dendrobiums and Vandas to Oncidiums. Designed with elegant arches and classical pavilions, walking through its floral corridors fills the air with a subtle fragrance. On weekends, a plant market is held where plant enthusiasts can purchase potted plants and gardening supplies. It is a fantastic hidden gem for photography and peaceful floral appreciation.", "name": "Orchid Garden Kuala Lumpur", "transport": "Located opposite KL Bird Park, about a 2-minute walk, or accessible via the park\u0027s shuttle tram."}, {"address": "Jalan Cenderawasih, Perdana Botanical Garden, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Adjoining the Orchid Garden, the Hibiscus Garden is dedicated to displaying Malaysia\u2019s national flower, the Hibiscus (Bunga Raya). This open-air garden blends elegant colonial charm with geometric landscape design, featuring hundreds of hibiscus varieties in various colors and forms\u2014from single to double petals, and classic vibrant red to rare soft pink and yellow gradients. At its center stands an exquisite fountain and a tearoom converted from colonial-era architecture, where visitors can enjoy a relaxing afternoon tea surrounded by blooming national flowers while taking in Malaysia\u0027s tropical floral charm.", "name": "Hibiscus Garden Kuala Lumpur", "transport": "A 5-8 minute walk from the core area of Perdana Botanical Garden; or walk directly after arriving at Kuala Lumpur Station via KTM."}, {"address": "Pesiaran Sultan Salahuddin, Perdana Botanical Garden, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.0 stars | Located next to the National Monument near the northern side of the botanical garden, the ASEAN Sculpture Garden is an open-air park that seamlessly blends modern art with natural landscape. Established in 1987 to commemorate friendly cooperation among ASEAN member nations, the park displays valuable sculpture works created by prominent Southeast Asian artists. Crafted from wood, glass, steel, and concrete, the avant-garde artworks carry rich cultural depth. Surrounded by lush greenery and winding pathways, the tranquil setting makes it a fantastic spot for art and nature lovers alike.", "name": "ASEAN Sculpture Garden", "transport": "Take the bus to the National Monument stop and walk about 3 minutes to enter the sculpture garden."}, {"address": "Perdana Botanical Garden, Jalan Cenderawasih, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Situated near the central lake island in the botanical garden, the Bamboo Playhouse is a striking, large-scale bamboo architectural landscape designed with avant-garde sustainability in mind. Utilizing traditional Malaysian bamboo structures, the designer crafted an open-plan space consisting of 31 elevated bamboo pavilions that seamlessly blend with surrounding tropical foliage and lake views. Featuring raised platforms, resting benches, and exhibition spaces, it offers visitors an ideal shelter from sun and rain while providing bird\u0027s-eye views of the lake\u2014making it one of the garden\u0027s most popular and unique photography spots.", "name": "Bamboo Playhouse", "transport": "Enter from the main entrance of the Botanical Garden (Jalan Kebun Bunga) and walk along the lakeside path for about 6 minutes."}, {"address": "Jalan Cenderawasih, Perdana Botanical Garden, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.0 stars | Located beside the shimmering lake in the botanical garden, KL Deer Park spans about 2 hectares of densely wooded natural sanctuary. Featuring undulating terrain designed to emulate a natural wild habitat, it houses gentle sika deer as well as the unique Southeast Asian mouse-deer (kanchil). The mouse-deer is the world\u0027s smallest ungulate animal, often symbolizing cleverness and wisdom in Malay folklore. Wooden boardwalks and viewing platforms allow visitors to quietly observe these gentle creatures foraging and exploring, making it a wonderful stop for family-friendly ecological education.", "name": "KL Deer Park", "transport": "Located inside the Perdana Botanical Garden, about a 3-5 minute walk from KL Bird Park."}], "name": "Nature Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Jalan Raja, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Merdeka Square is one of Kuala Lumpur\u0027s most historically significant landmarks, where Malaya raised its first national flag in 1957 to declare independence. The expansive green lawn framed by rich colonial-style architecture makes it an ideal spot for wide-angle shots and iconic photo check-ins. Standing tall at 95.2 meters, the soaring flagpole creates a breathtaking sight. During evenings or festivals, locals and tourists gather here to stroll, take photos, and absorb KL\u0027s unique historical charm.", "name": "Merdeka Square (Dataran Merdeka)", "transport": "Take the LRT to Plaza Rakyat Station or Masjid Jamek Station, then walk for about 5\u20138 minutes."}, {"address": "Jalan Raja, Kuala Lumpur City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Situated right opposite Merdeka Square, this magnificent building blends Moorish, Indo-Saracenic, and Gothic architectural styles. Its red-brick walls, shining copper domes, and 41-meter-high clock tower exude an elegant exotic charm. Illumination at night renders it brilliantly golden, making it an unmissable night-view photo spot for influencers and photography enthusiasts to capture dreamlike, fairytale-castle-style shots day or night.", "name": "Sultan Abdul Samad Building", "transport": "Take the LRT to Masjid Jamek Station, exit and walk along the Klang River for about 5 minutes."}, {"address": "27, Jalan Raja, Dataran Merdeka, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Located on the south side of Merdeka Square, the iconic giant red \u0027I LOVE KL\u0027 sculpture outside the gallery is a must-visit photo spot for anyone traveling to Kuala Lumpur. Inside, besides exquisite wooden handicrafts and souvenirs, there is a giant urban scale model of KL accompanied by a light show, allowing visitors to glimpse the past, present, and future plans of the city in just one minute\u2014offering both entertainment and educational value.", "name": "Kuala Lumpur City Gallery \u0026 I LOVE KL Sign", "transport": "Take the LRT to Masjid Jamek Station and walk for about 7 minutes, or take the free GO KL Red Line bus to the Dataran Merdeka stop."}, {"address": "Jalan Tun Perak, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Located at the confluence of the Gombak and Klang rivers, the River of Life was named one of the world\u0027s top 10 waterfronts. The historic Masjid Jamek sits right on the delta formed by the two rivers, displaying exotic brick-red and white architectural designs. At night, blue mist sprayed into the air combined with a musical fountain light show creates an enchanting, dreamlike atmosphere that attracts countless visitors for night photography.", "name": "River of Life \u0026 Masjid Jamek", "transport": "Take the LRT to Masjid Jamek Station; the River of Life viewing platform is right outside the exit."}, {"address": "KL Bird Park, 920, Jalan Cenderawasih, Perdana Botanical Gardens, 50480 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Spanning over 20 hectares, this is the world\u0027s largest free-flight walk-in aviary, home to over 3,000 rare birds from across the globe. Its highlight is the massive semi-open netting design, allowing peacocks, hornbills, and flamingos to roam freely around you. Visitors can pose closely with colorful parrots or stroll amidst waterfalls and lush tropical rainforests, making it a fantastic destination to connect with nature and snap lively, vibrant photos.", "name": "KL Bird Park", "transport": "Take the KTM Komuter train to Kuala Lumpur Station and walk for about 15 minutes, or take a Grab ride directly."}, {"address": "1, Jalan Raja, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Founded in 1884, the Royal Selangor Club features striking Tudor Revival-style architecture with black-and-white timber framing. Located right beside the lawn at Merdeka Square, it feels like an English country mansion transplanted into tropical Kuala Lumpur. Its unique exterior and deep historical roots make it a popular backdrop for street and vintage photography, highlighting KL\u0027s rich multicultural heritage and colonial past.", "name": "Royal Selangor Club", "transport": "Take the LRT to Masjid Jamek Station and walk for about 6 minutes to the west side of Merdeka Square."}, {"address": "Jalan Kebun Bunga, Tasik Perdana, 50480 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Perdana Botanical Garden is the oldest and largest green oasis in downtown Kuala Lumpur, blending tropical foliage, artificial lakes, and modern landscape architecture. Among its features, \u0027Laman Perdana\u0027 on the lakefront boasts a bamboo structure with giant geometric woven bamboo canopies that create striking visual play of light and shadow\u2014a hidden gem and top photo spot frequented by photographers and influencers.", "name": "Perdana Botanical Garden Bamboo House \u0026 Lake", "transport": "Take the KTM to Kuala Lumpur Station or Muzium Negara Station, then walk for about 10\u201315 minutes into the park area."}, {"address": "Jalan Perdana, Tasik Perdana, 50480 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Malaysia\u0027s national Islamic site of worship breaks away from traditional designs, featuring a strikingly modern umbrella-folded main roof and a 73-meter-tall minaret. The azure-blue roof contrasts vividly with the pristine white pillared corridors, where long hallways and reflection pools create visually pleasing geometric compositions. Visitors wearing free purple or blue robes provided on-site can take stylish, high-quality photos in these serene and artistic hallways.", "name": "National Mosque of Malaysia (Masjid Negara)", "transport": "Take the KTM to Kuala Lumpur Station and walk for about 5 minutes via the pedestrian walkway or underpass."}], "name": "Popular Photo Spots"}}, "name": "Merdeka Square and Lake Gardens Area"}, "putrajaya": {"categories": {"cat_1": {"items": [{"address": "Presint 1, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.7 stars | Built in 1997, Putra Mosque is Putrajaya\u0027s most iconic landmark, seamlessly blending Moroccan and traditional Islamic architectural styles. Constructed from rose-tinted granite, it features a stunningly detailed dome and a 116-meter-tall minaret. Surrounded by the lake on three sides, it looks like a floating pink fairytale palace. The main prayer hall can accommodate over 10,000 worshippers, and free robe rentals are provided for non-Muslim visitors.", "name": "Putra Mosque (Pink Mosque)", "transport": "Take the KLIA Transit to Putrajaya \u0026 Cyberjaya Station, then transfer to a Grab taxi for about 10 minutes."}, {"address": "Presint 1, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Perched atop a hill in Putrajaya, Perdana Putra overlooks the Putra Mosque and Putrajaya Lake. This grand green-domed complex combines Islamic, Moorish, and Palladian architectural designs, serving as the executive heart of Malaysia\u0027s administrative capital. The imposing building showcases exquisite craftsmanship with natural stone walls and geometric motifs, looking especially enchanting when illuminated at night.", "name": "Perdana Putra (Prime Minister\u0027s Office)", "transport": "Located directly in front of the Putra Mosque, about a 3-minute walk."}, {"address": "Presint 1, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Dataran Putra is the central hub of Putrajaya\u0027s administrative district, surrounded by the Malaysian national flag and state flags, with star-shaped geometric motifs etched into the ground. Connecting Perdana Putra to Putra Bridge, it serves as a key civic space for national celebrations and parades. The square offers breathtaking panoramic views of the Putra Mosque and the lake, making it a favorite spot for photographers.", "name": "Dataran Putra (Putra Square)", "transport": "About a 1-minute walk from the main entrance of Putra Mosque."}, {"address": "Presint 1, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Spanning 435 meters, Putra Bridge is Putrajaya\u0027s most magnificent bridge, featuring a two-tier design inspired by the Khaju Bridge in Isfahan, Iran. Equipped with Islamic geometric observation decks on both sides, it connects Precinct 1 and Precinct 2. Strolling across offers scenic views of the Putra Mosque reflected on the lake, with cruise boats gliding below creating a picturesque scene.", "name": "Putra Bridge", "transport": "About a 5-minute walk from the Putra Mosque."}, {"address": "Presint 3, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.6 stars | Housing Malaysia\u0027s Federal Court and Court of Appeal, the Palace of Justice incorporates design elements inspired by the Taj Mahal\u0027s classic domes and traditional Islamic geometric art. This majestic white edifice features a massive central dome and stately columned arches, symbolizing the solemnity and fairness of law. It is one of Putrajaya\u0027s most photo-worthy architectural landmarks.", "name": "Palace of Justice (Istana Kehakiman)", "transport": "About a 5-minute Grab ride from Putra Mosque to Precinct 3."}, {"address": "25, Jalan Tuanku Abdul Rahman, Presint 3, 62100 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.6 stars | As Putrajaya\u0027s second-largest mosque, the Iron Mosque is constructed with over 70% steel, seamlessly blending modern industrial design with traditional Islamic architecture. Featuring a wall-less concept, fine wire mesh creates a natural cooling airflow inside. Its minimalist and futuristic aesthetic, along with a massive steel dome and surrounding reflective pool, makes for a breathtaking sight.", "name": "Tuanku Mizan Zainal Abidin Mosque (Iron Mosque)", "transport": "About a 5-minute Grab ride from Putra Mosque."}, {"address": "Presint 2, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.3 stars | Standing 68 meters tall on the shores of Putrajaya Lake, the Millennium Monument resembles a sleek metallic rocket. A spiral ramp features engraved historical panels guiding visitors through Malaysia\u0027s journey from the Malacca Sultanate to modern times. As you walk up, you learn about the nation\u0027s history while taking in sweeping panoramic views of the lake and city.", "name": "Millennium Monument (Monumen Alaf Baru)", "transport": "About a 15-minute walk along the lakeside park from Putra Mosque, or a 3-minute Grab ride."}, {"address": "Dataran Gemilang, Presint 5, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Perched atop a hill in Precinct 5, the PICC\u0027s unique design is inspired by the Pending (a traditional Malay royal belt buckle) and resembles a grand sailing vessel. As one of Putrajaya\u0027s highest points, it offers unrivaled views of the central axis and the lake. Featuring lavish interior facilities, it frequently hosts international summits and major exhibitions, standing as an iconic modern landmark.", "name": "Putrajaya International Convention Centre (PICC)", "transport": "About a 10-minute Grab ride from Putra Mosque to the hilltop entrance."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Persiaran Perdana, Presint 1, 62502 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.6 stars | Putrajaya\u0027s most iconic landmark, located right on the banks of Putrajaya Lake. Its main structure is constructed largely with rose-tinted granite, giving it a soft and enchanting pink hue. The mosque combines Moroccan, Persian, and traditional Malay Islamic architectural elements, with a 116-meter minaret that is one of the tallest in Southeast Asia. The interior prayer hall features soaring ceilings and breathtakingly intricate dome patterns. Non-Muslim visitors can visit during non-prayer hours while wearing complimentary pink robes provided on-site. Viewing the mosque across the lake makes it a magnificent spot for photography enthusiasts capturing reflections.", "name": "Putra Mosque (Masjid Putra)", "transport": "Take the ERL KLIA Transit train to Putrajaya \u0026 Cyberjaya Station, then transfer to a Grab taxi for about a 10-minute drive."}, {"address": "25, Jalan Tuanku Abdul Rahman, Presint 3, 62100 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.6 stars | Facing the Putra Mosque across the lake, the Iron Mosque is Putrajaya\u0027s second main mosque. Its standout archit
