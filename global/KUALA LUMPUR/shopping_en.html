0027s beloved local makeup brand, known for highly pigmented, long-lasting lip colors flattering on Asian skin tones. They also stock many herbal skincare and personal care items exclusive to Malaysia and Singapore.", "name": "Guardian - Taman Sri Batu Caves", "transport": "About a 4-minute Grab ride from Batu Caves Station."}, {"address": "Jalan Batu Caves, Pusat Bandar Sri Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.6 stars | Must-Buys: Medimix Herbal Soap, Pure Henna Hair Dye Powder, Natural Rosewater Mist. A charming independent local beauty shop specializing in legendary Indian herbal skincare. The owner has deep knowledge of Ayurvedic formulations and eagerly introduces visitors to the benefits of various plant ingredients. The Medimix soap sold here is a favorite among local women\u2014a summer essential for washing away sweat and oil.", "name": "Vasantha Herbal Cosmetics Batu Caves", "transport": "Located in the commercial street outside the Batu Caves entrance, about a 5-minute walk."}, {"address": "No. 8, Jalan SBC 3, Taman Sri Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buys: Gamat Jelly Cream, Double Prawn Brand Herbal Oil, Nutmeg Ointment. Though it looks like a traditional pharmacy from the outside, this hidden gem houses iconic Malaysian skincare remedies. The moisturizing repair cream made from local sea cucumber (Gamat) works wonders on dry, cracked, or sensitive skin. Extremely affordable, it\u0027s a secret go-to spot for savvy travelers looking to stock up.", "name": "Khun Ann Traditional Pharmacy Batu Caves", "transport": "Take the KTM to Batu Caves Station and walk for about 10 minutes."}, {"address": "Lebuhraya Ipoh - Rawang, Batu Caves, 68100 Gombak, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buys: Neem Face Wash, Kajal Eyeliner, Indian Spice Body Scrub. A boutique herbal care shop located near the iconic Rainbow Stairs of Batu Caves, specializing in traditional Indian natural cosmetics and skincare. Its signature items\u2014traditional Kajal eyeliner and Neem anti-acne face wash\u2014are crafted entirely from natural plant ingredients. Non-irritating and effective at oil control, they showcase an authentic exotic touch.", "name": "Prami Herbal \u0026 Beauty Care", "transport": "About a 3-minute walk from the entrance of Batu Caves Plaza."}, {"address": "No. 18, Jalan SBCA 4, Taman Sri Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buys: Chandrika Neem \u0026 Coconut Soap, Turmeric Face Pack, Coconut Skincare Oil. Gayathri is a well-known local herbal brand in the Batu Caves community, emphasizing chemical-free, pure natural skin nourishment. Their popular turmeric face pack powder can be easily mixed with water or milk to brighten skin tone and soothe acne-prone skin, attracting many tourists who appreciate natural organic care.", "name": "Gayathri Herbal Beauty \u0026 Wellness Batu Caves", "transport": "About a 7-minute walk from the Batu Caves Rainbow Stairs."}, {"address": "Jalan SG 1/8, Taman Sri Gombak, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buys: Cold Pressed Coconut Oil Serum, Natural Herbal Soothing Balm, Malay Herbal Foot Scrub. Combining traditional Malay botany with modern skincare technology, this independent workshop formulates products tailored for tropical climates. All products feature locally grown Malaysian plant and herb extracts. Their pure cold-pressed coconut oil is especially lightweight and fast-absorbing, perfect for face, body, and hair care\u2014a true local specialty.", "name": "Malaysian Botanical Beauty Care Batu Caves", "transport": "About a 5-minute Grab ride from Batu Caves."}], "name": "Local Representative Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "Jalan Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade zari-printed Sarees, men\u0027s Indian Kurtas, and exquisitely embroidered Dupatta shawls. Located around Batu Caves, this long-standing clothing store is a favorite among both local Indian residents and tourists. It offers a dazzling array of traditional Indian apparel featuring vibrant colors and high-quality fabrics. The friendly staff will even enthusiastically teach you how to drape a saree, making it an excellent shopping spot to experience local Indian culture.", "name": "Subam Textiles \u0026 Saree Batu Caves", "transport": "Take the KTM Komuter train to Batu Caves Station, exit, and walk about 5 minutes to arrive."}, {"address": "Jalan Seri Batu Caves, Taman Seri Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy List: Genuine leather hand-woven sandals, carved leather long wallets, and Malay-style straw tote bags. As a unique local leather goods, footwear, and bag studio in the Batu Caves area, it highlights leather products that combine native Malaysian craftsmanship with modern design. All footwear is hand-stitched by local artisans, making them comfortable, breathable, and full of Nanyang charm\u2014attracting many savvy travelers who make a special trip to shop here.", "name": "Malaya Leather \u0026 Craft Batu Caves", "transport": "About an 8-minute walk from the main Batu Caves Temple, or a 2-minute Grab ride."}, {"address": "Batu Caves Temple Complex Commercial Row, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buy List: Indian-style gold-thread beaded clutches, hand-painted ivory-pattern handbags, and traditional beaded evening bags. Located on the commercial street near Batu Caves Plaza, this shop specializes in a wide variety of handcrafted bags and footwear rich in Indian ethnic colors. The glittering gold-thread weaving and delicate beadwork make every bag look like a piece of art. With very affordable prices, it is the top choice for purchasing distinctive souvenirs and accessories.", "name": "Batu Indian Fashion \u0026 Bags", "transport": "Take the KTM to Batu Caves Station, exit, and walk 3 minutes towards the temple complex commercial area."}, {"address": "Lebuhraya Selayang-Kepong, Batu Caves, 68100 Gombak, Selangor, Malaysia", "feature": "\u2b50 4.6 stars | Must-Buy List: Hand-painted Batik cotton short-sleeved shirts, silk Batik printed scarves, and Batik-patterned canvas tote bags. This boutique showcases authentic Malaysian style, emphasizing modern applications of traditional Batik wax-resist dyeing techniques. Partnering with local artists, they offer lightweight shirts and everyday accessories that are cool, breathable, perfectly suited for Southeast Asia\u0027s climate, colorful, and truly unique.", "name": "Batik Heritage \u0026 Fashion Batu Caves", "transport": "About a 5-minute Grab ride from the entrance of the Batu Caves scenic area."}, {"address": "Taman Sunway Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy List: Hand-embroidered Indian Jutti shoes, metallic studded leather sandals, and painted leather slippers. This specialty shop focuses on traditional Indian Jutti footwear, famous for their slightly curled toes, intricate all-over embroidery, and interchangeable left/right foot design. All shoes are handmade from soft leather for ultimate comfort. Their visually striking colors make them perfect to pair with casual outfits or ethnic attire.", "name": "Rajasthani Footwear \u0026 Jutti Studio", "transport": "About a 3-minute taxi ride from the Batu Caves entrance."}, {"address": "Jalan Industrial Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.1 stars | Must-Buy List: Lightweight non-slip walking sandals, large-capacity lightweight canvas backpacks, and waterproof travel waist bags. Catering to the 272-step climb at Batu Caves, this local store offers comfortable casual performance footwear and daypacks highly popular among both tourists and locals. Combining practicality with budget-friendly prices, it\u0027s the perfect emergency stop or shopping spot if your shoes aren\u0027t fit for climbing or you need extra bag space.", "name": "Oasis Footwear \u0026 Bags Batu Caves", "transport": "About a 10-minute walk from Batu Caves Railway Station, or take Bus 173 to a nearby stop."}, {"address": "Pusat Perdagangan Selayang, Near Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy List: Stylish embroidered Abayas, soft modal cotton Hijabs, and designer shoulder bags with metallic buckles. This boutique captures the essence of modern Malaysian Muslimah fashion, selling elegant, finely tailored robes and stylish shoes. Even non-Muslim customers can find beautifully flowing cover-ups and designer handbags here, boasting superior quality and authentic local cultural representation.", "name": "Khalila Muslimah Fashion \u0026 Shoes", "transport": "About a 6-minute Grab ride from the main Batu Caves area."}, {"address": "Batu Caves Main Entrance Plaza, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.0 stars | Must-Buy List: Rainbow stairs graphic T-shirts, Thaipusam festival commemorative cotton shirts, and handmade woven hemp crossbody bags. As the largest local clothing and canvas bag store within the Batu Caves complex, it cleverly integrates elements of the famous rainbow stairs, temple architecture, and Malaysian culture into its clothing and accessory designs. Made from 100% breathable cotton, the clothes are comfortable to wear and make wonderful travel keepsakes.", "name": "Batu Caves Cultural Apparel \u0026 Souvenirs", "transport": "Located at the plaza near the main entrance of Batu Caves, accessible directly on foot."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy List: Hand-painted deity figurines, handmade peacock feather fans, and traditional Indian clay oil lamps (Diyas). Located right below the iconic rainbow stairs, this official souvenir shop specializes in cultural gifts rich in Hindu symbolism and Batu Caves motifs. It\u0027s a popular spot for visitors to pick up sacred, authentic local keepsakes before or after climbing the stairs, all at very affordable prices.", "name": "Batu Caves Main Temple Souvenir Shop", "transport": "Take the KTM Komuter train to Batu Caves Station; it is about a 3-minute walk from there."}, {"address": "Jalan Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buy List: Murukku (crunchy Indian spiced snack), Chandrika Ayurvedic herbal soap, and traditional Indian bangle sets. Flanking both sides of the Batu Caves entrance, this vibrant Indian bazaar is packed with local vendors, rich aromatic spices, and vivid colors. The Murukku here is a classic snack hugely popular with both locals and tourists, famous for its irresistibly crunchy, savory taste.", "name": "Batu Caves Indian Bazaar", "transport": "Take the KTM Komuter train to Batu Caves Station; walk 2 minutes from the exit to reach the bazaar street."}, {"address": "No. 2, Jalan Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy List: Gulab Jamun (milk-solid balls in syrup), Laddu (chickpea flour sweet balls), and Jalebi (crispy sweet coils). A renowned traditional Indian sweet shop near Batu Caves offering dozens of freshly made and packaged classic Indian confections. Rich with creamy milk and nutty flavors, these sweets make for an indispensable souvenir to experience Kuala Lumpur\u0027s vibrant multicultural heritage.", "name": "Sri Ananda Bahwan Sweets \u0026 Snacks Batu Caves", "transport": "About a 5-minute walk from the entrance of the Batu Caves rainbow stairs."}, {"address": "Lot 1, Jalan MRR2, Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.1 stars | Must-Buy List: BOH Malaysian Teh Tarik milk tea bags, Lexis peanut cream sandwich biscuits, and A1 Bak Kut Teh spice packs. Mydin is an iconic homegrown wholesale hypermarket chain in Malaysia, with a massive store near Batu Caves. Here you can find top-selling Malaysian snacks and Halal-certified souvenirs at budget-friendly wholesale prices\u2014a perfect spot to hunt down daily local treats.", "name": "Mydin Wholesale Hypermarket Batu Caves", "transport": "About a 5-minute taxi or Grab ride from Batu Caves."}, {"address": "Lot 10142, Jalan Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.0 stars | Must-Buy List: OLDTOWN 3-in-1 White Coffee, Eureka Curry Popcorn, freeze-dried durian, and durian candies. A large hypermarket located in the Batu Caves area featuring a comprehensive section dedicated to local Malaysian specialties. It\u0027s ideal for stocking up on snacks and gifts for friends and family after sightseeing, offering a spacious shopping environment with transparent pricing.", "name": "Giant Hypermarket Batu Caves", "transport": "About a 12-minute walk or a 3-minute Grab ride from Batu Caves."}, {"address": "Jalan Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy List: Authentic Garam Masala spice blend, house-blend fish curry powder, turmeric powder, and dried chilies. An independent spice store beloved by local Indian residents, filled with vibrant, aromatic bags of freshly packed spices. The owner\u0027s custom curry blends and fresh seasonings are a hidden gem souvenir for travelers who love Southeast Asian and spiced cuisine.", "name": "Syarikat Spice \u0026 Groceries Batu Caves", "transport": "About a 6-minute walk from the entrance of Batu Caves."}, {"address": "Batu Caves Complex, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy List: Pewter Batu Caves landmark keychains, hand-carved elephant statues, and Malaysian Batik fabric tote bags. This independent craft shop specializes in finely crafted artistic souvenirs showcasing Batu Caves and Malaysian culture. Many products are handcrafted by local artisans, making them unique and highly memorable keepsakes.", "name": "Batu Caves Craft \u0026 Souvenir Shop", "transport": "Located right inside the Batu Caves complex plaza, easily accessible on foot."}, {"address": "No. 15, Jalan Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.1 stars | Must-Buy List: Traditional Malay Batik sarongs, Malaysian-pattern canvas bags, and decorative motif scarves. Hari-Hari is a well-known local Malaysian brand offering affordable everyday apparel and lifestyle goods. This branch features a rich selection of traditional Malay clothing and Southeast Asian-style textiles at very budget-friendly prices, making it a great hidden spot for authentic wearable souvenirs.", "name": "Pusat Pakaian Hari-Hari Batu Caves", "transport": "About a 7-minute walk from the exit of Batu Caves Train Station."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "KM13, Genting Highlands, 69000 Pahang, Malaysia", "feature": "\u2b50 4.5 Stars | Must-Buy List: Coach classic crossgrain leather bags, Nike breathable running shoes, discounted past-season Michael Kors watches. A major outlet shopping destination that\u0027s a must-visit when traveling from Batu Caves to Genting Highlands, featuring over 150 international designer and homegrown Malaysian brands. Offering exceptional savings of 25% to 65% off, its open-air layout and cool highland climate make for an extra comfortable shopping experience, making it an excellent spot for designer apparel, shoes, and bags.", "name": "Genting Highlands Premium Outlets", "transport": "About a 35-minute drive or taxi ride from Batu Caves."}, {"address": "4, Jalan Usahawan 6, Setapak, 53300 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.7 Stars | Must-Buy List: Royal Selangor handcrafted pewter beer mugs, delicately engraved tea caddies, pewter souvenir accessories. Founded in 1885, Royal Selangor is Malaysia\u0027s premier national heritage craft brand. Located just a 10-minute drive from Batu Caves, visitors can purchase top-tier pewter craftsmanship and even join hands-on DIY workshops to experience metalworking firsthand. Its high-quality, memorable luxury pieces attract many discerning travelers specifically to shop here.", "name": "Royal Selangor Visitor Centre", "transport": "About a 10-minute Grab or taxi ride from Batu Caves."}, {"address": "Jalan Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.3 Stars | Must-Buy List: Hand-painted silk scarves, Malaysian-style printed sarongs, Batik art paintings. An authentic local artisan workshop next to the Batu Caves attraction, specializing in traditional Malaysian Batik. It showcases a wide array of clothing and lifestyle goods hand-dyed by local craftspeople, with every pattern being truly unique. In addition to shopping for distinctive Southeast Asian attire, visitors can watch master artisans demonstrate the Batik painting process live, offering a deeply authentic local experience.", "name": "Batu Caves Traditional Batik Centre", "transport": "Within easy walking distance from the Batu Caves Rainbow Stairs entrance."}, {"address": "No. 12, Jalan Batu Caves, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.4 Stars | Must-Buy List: Custom-blend Indian curry powders, handcrafted brass deity statues, pure natural Indian incense sticks. Hidden within the cultural commercial enclave at the foot of Batu Caves, this traditional independent shop is filled with rich South Indian charm. The store is packed with freshly ground spices, herbs, and hand-carved deity statues and ritual items crafted by Indian artisans. Affordable and authentic, it is the top go-to store for tourists looking to bring home genuine Indian cultural items and specialty spices.", "name": "Premas Spice \u0026 Indian Handicrafts", "transport": "Located in the plaza under the Batu Caves archway, a 1-minute walk away."}, {"address": "Jalan Stesen 1, Taman Selayang Utama, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.0 Stars | Must-Buy List: Local brand leather shoes, Malay-style clothing accessories, affordable local snack packs. Located west of Batu Caves, Selayang Mall is a favorite comprehensive shopping mall among local residents. Unlike the high-priced international chain department stores downtown, this mall brings together many local Malaysian clothing stores, shoe shops, and budget variety stores. Here, you can shop for down-to-earth local design apparel and daily necessities, making it a great destination to experience everyday local life and hunt for budget finds in northern Kuala Lumpur.", "name": "Selayang Mall", "transport": "Take bus 151 or take an 8-minute taxi ride from Batu Caves."}, {"address": "Commercial Complex, Batu Caves, 68100 Gombak, Selangor, Malaysia", "feature": "\u2b50 4.2 Stars | Must-Buy List: Traditional hand-embroidered Sarees, Indian-style metal bangles, unique Bohemian-style earrings. This is the most renowned traditional clothing and accessory specialty store around the Batu Caves complex, specializing in exquisite Indian Sarees and traditional handcrafted jewelry. The store carefully selects fine-textured fabrics and vibrant colors, with staff available on-site to assist you with wearing a Saree. The handcrafted earrings and accessories are competitively priced, making it perfect for travelers who love ethnic and exotic styles.", "name": "Sri Venkatachalapathi Silk \u0026 Jewelry", "transport": "Located inside the commercial complex at the Batu Caves main plaza, within walking distance."}, {"address": "Jalan 5/22a, Taman Melati, 53100 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 Stars | Must-Buy List: BOH Gold Blend tea, OldTown White Coffee instant packs, local-style home goods. Located near Batu Caves in the Gombak neighborhood, this community shopping mall combines a supermarket, local fashion boutiques, and daily sundries. Its hypermarket and specialty shops offer a rich selection of Malaysian souvenirs at lower prices than downtown tourist spots, making it a favorite among savvy independent travelers and local families.", "name": "M3 Shopping Mall", "transport": "About a 10-minute taxi ride from Batu Caves, or take the LRT to Taman Melati Station and walk from there."}, {"address": "Lot 10243, Jalan S2, Taman Samudra, 68100 Batu Caves, Selangor, Malaysia", "feature": "\u2b50 4.3 Stars | Must-Buy List: A1 Bak Kut Teh spice packs, bulk Milo powder, Malaysian dried durian. As the largest hypermarket around Batu Caves, this is the ultimate paradise for buying local Malaysian specialties and snacks. It offers an extensive variety of goods, ranging from local seasonings and famous coffee brands to unique Malaysian dried fruits\u2014all at wholesale-level affordable prices. It\u0027s the best one-stop souvenir shopping spot after visiting Batu Caves.", "name": "Giant Hypermarket Batu Caves", "transport": "About a 5-minute drive from Batu Caves, or take a taxi directly to the entrance."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Batu Caves Tourist Area"}, "bukit_bintang": {"categories": {"cat_1": {"items": [{"address": "Lot 1.01.00, Pavilion Kuala Lumpur, 168 Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-Buy: Herbal cold-pressed plant soaps, Turmeric tropical body scrub, Pure cold-pressed virgin coconut oil. Tanamera is Malaysia\u0027s most iconic local herbal SPA brand, founded to preserve traditional healing wisdom and tropical botanical therapy. All products are formulated with natural ingredients extracted from Malaysian rainforests, free from artificial fragrances and chemical additives. Their herbal soaps and turmeric scrubs are especially favored by local star-rated hotels and luxury spas. Excellent for deep cleansing and skin soothing, they make the top souvenir choice for experiencing traditional Malaysian skincare culture.", "name": "Tanamera Tropical Spa Products - Pavilion KL", "transport": "Take the Monorail to Bukit Bintang Station and walk for about 3 minutes to reach Pavilion KL Shopping Mall."}, {"address": "Level 4, Pavilion Kuala Lumpur, 168 Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy: Rosemary scalp care oil, Lemongrass \u0026 tea tree body lotion, All-natural handmade plant soaps. The Olive Tree is a highly popular homegrown botanical skincare brand featuring Australian formulations made locally in Malaysia, tailored specifically for skin concerns caused by Southeast Asia\u0027s hot and humid climate. All products feature pure plant-based ingredients and are silicone-free. Highly recommended by both locals and tourists, their scalp care and anti-acne repair series offer soothing lemongrass and tea tree aromas that transport you into a relaxing tropical rainforest vibe.", "name": "The Olive Tree - Pavilion KL", "transport": "Take the MRT to Bukit Bintang Station (Exit D) and walk for about 5 minutes to reach Pavilion."}, {"address": "G083, Sungei Wang Plaza, Jalan Sultan Ismail, Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buy: Durian-flavored lip balm, Essential oil fragrance sprays, Ultra-fine long-lasting gel eyeliner. Elianto is a well-known Malaysian budget-friendly, high-quality cosmetics brand famous for vibrant colors and fantastic value for money. Most notably, they offer fun local creative products, such as their viral durian and tropical fruit scented lip balms. Located in Sungei Wang Plaza, this counter is loved by local young women and students, making it a great spot for picking up fun yet quality gifts.", "name": "Elianto Make Up - Sungei Wang Plaza", "transport": "Take the Monorail to Imbi Station and walk for about 3 minutes to arrive at Sungei Wang Plaza."}, {"address": "Parkson Elite, Level 3, Pavilion KL, 168 Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy: C-Bright Vitamin C Cushion Foundation, Gold Anti-Aging Serum, Velvet Matte Lipstick. SimplySiti is a premier Halal-certified local beauty brand founded by Malaysia\u0027s national pop icon, Dato\u0027 Seri Siti Nurhaliza. Tailored specifically for Asian skin tones and textures, the brand emphasizes lightweight, natural-looking, and seamless coverage. All makeup and skincare products are strictly Halal-certified, offering luxury-brand quality at budget-friendly prices\u2014a unique local brand definitely worth trying in Malaysia.", "name": "SimplySiti Counter - Parkson Pavilion KL", "transport": "Take the Monorail or MRT to Bukit Bintang Station, which connects directly to Parkson Department Store on Level 3 of Pavilion KL."}, {"address": "G-01, Fahrenheit88, 179 Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-Buy: 24h Waterproof Eyeliner, Matte Velvet Lip Tint, Flawless Oil-Control Loose Powder. Silkygirl is an iconic drugstore cosmetic brand in Malaysia and Singapore, specifically formulated for Southeast Asian youth and climate with a focus on sweat resistance, oil control, and long wear. This Watsons flagship store at Fahrenheit88 features a huge Silkygirl section. Their lipsticks and eyeliners come in a wide variety of shades and stand up well against heat and humidity, making this a top spot for tourists stocking up on affordable quality makeup.", "name": "Silkygirl - Watsons Fahrenheit88", "transport": "Take the MRT to Bukit Bintang Station and walk for about 2 minutes to reach Fahrenheit88."}, {"address": "LB1, Sungei Wang Plaza, Jalan Sultan Ismail, Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy: Safi 24K Gold Dual Serum, Aiken Natural Tea Tree Anti-Acne Facial Wash, Traditional herbal oils and medicated balms. Caring Pharmacy is a massive local pharmacy chain in Malaysia. Compared to standard cosmetics stores, it is an even better place to buy traditional Malaysian medicated ointments as well as Malay and Indian herbal skincare. Popular local skincare brands like Safi and Aiken can be purchased here at bargain prices. It is also the ultimate spot to buy traditional pain-relieving medicated oils and herbal salves.", "name": "Caring Pharmacy - Sungei Wang Plaza", "transport": "Take the Monorail to Imbi Station or Bukit Bintang Station and walk 3\u20135 minutes into Sungei Wang Plaza."}, {"address": "179, Jalan Bukit Bintang, Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.7 stars | Must-Buy: dUCk Cosmetics collaboration matte lipsticks, Fenty Beauty Southeast Asia exclusive bronzer, Rare Beauty Soft Pinch Liquid Blush. Located at Fahrenheit88 in Bukit Bintang, Sephora is Kuala Lumpur\u0027s ultimate beauty landmark, housed in a striking black-and-white avant-garde pyramid structure. Alongside world-leading beauty brands, it features high-end homegrown Malaysian brands and Southeast Asian exclusives like dUCk Cosmetics. With expansive shopping space and extensive testing stations, beauty lovers can easily immerse themselves in the latest Southeast Asian makeup trends.", "name": "Sephora Flagship Store - Fahrenheit88", "transport": "Take the MRT to Bukit Bintang Station (Exit D) and walk just 1 minute to reach this iconic landmark."}, {"address": "Lot G1, Ground Floor, Bukit Bintang Plaza, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy: Cosmoderm Vitamin E Repair Serum, Natural lip balms, Color-correcting herbal concealer. Situated in prime Bukit Bintang, this Watsons flagship store is one of the most comprehensive health and beauty stores in Malaysia. It boasts a dedicated Malaysian Beauty Zone showcasing products from traditional and modern homegrown brands such as Cosmoderm, Safi, and SimplySiti. Spacious and clearly signed, it\u0027s an ideal treasure-hunting destination for travelers looking to stock up on affordable local skincare and herbal remedies in one stop.", "name": "Watsons Flagship Store - Bukit Bintang", "transport": "Take the MRT or Monorail to Bukit Bintang Station; the store is located right outside the exit."}], "name": "Iconic Local Beauty \u0026 Pharmacy Products"}, "cat_2": {"items": [{"address": "Lot 4.48.00 \u0026 4.49.00, Level 4, Pavilion KL, 168, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buy List: Minimalist trendy women\u0027s sandals, vintage quilted handbags, comfortable ballet flats. VINCCI is Malaysia\u0027s most iconic affordable local footwear and bag brand under the Padini Group. The branch at Pavilion KL boasts an exceptionally comprehensive collection, ranging from office commuter heels and vacation sandals to everyday bags. Closely following international fashion trends while remaining wallet-friendly, its products feature cushioned comfort and sleek designs. It is the ultimate go-to destination where tourists in Kuala Lumpur can\u0027t help but haul multiple pairs of shoes and bags.", "name": "VINCCI (Padini Concept Store Pavilion KL)", "transport": "Take the KL Monorail to Bukit Bintang Station and walk about 3 minutes to reach Pavilion KL shopping mall."}, {"address": "Lot 10 Shopping Centre, 50, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy List: Malaysian culture graphic tees, streetwear baseball caps, collaboration casual canvas bags. Pestle \u0026 Mortar Clothing (PMC) is a highly influential local Malaysian streetwear brand. It cleverly fuses local Malaysian culture, American fast food, and vintage Nanyang elements into stylish streetwear designs. The counter at Lot 10 exudes a sleek industrial aesthetic, featuring durable fabrics and excellent tailoring. Beloved by local youth and international trendsetters alike, it is a must-visit store for those seeking Southeast Asian street style apparel.", "name": "Pestle \u0026 Mortar Clothing (PMC Lot 10)", "transport": "Take the KL Monorail to Bukit Bintang Station; the station exit leads directly into Lot 10 Shopping Centre."}, {"address": "Lot 4.02.01, Level 4, Pavilion KL, 168, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy List: Premium silk printed scarves, collaboration printed makeup bags, eco-friendly shopping tote bags. dUCk is a premier Malaysian local fashion and lifestyle brand founded by style icon Vivy Yusof. The brand is renowned for its exquisite scarves, chic hijabs, stylish bags, and accessories. The Pavilion flagship store features its signature purple hue, radiating sophistication and elegance. Print designs blend Kuala Lumpur landmarks with modern geometric aesthetics, offering luxury quality on par with international brands. It is a fantastic spot to experience contemporary Malaysian modest fashion and pick up gorgeous gifts.", "name": "dUCk Flagship Store (The dUCk Store Pavilion KL)", "transport": "Take the MRT Kajang Line to Bukit Bintang Station; an underground pedestrian walkway connects directly to Pavilion KL."}, {"address": "Lot 3.01.03, Level 3, Pavilion KL, 168, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buy List: Classic monogram shoulder bags, genuine leather compact wallets, elegant women\u0027s leather handbags. Founded in Malaysia, Bonia is an internationally renowned high-end leather goods, footwear, and fashion brand favored by Southeast Asian fashion lovers. Highlighting premium leather craftsmanship and Italian design aesthetic, its concept store in Pavilion exudes luxury. Bags and wallets feature clean lines, fine stitching, and remarkable durability. Recent collections blending vintage monograms with trendy macaron shades make them well worth buying.", "name": "Bonia Boutique (Bonia Pavilion KL)", "transport": "Take the KL Monorail to Bukit Bintang Station and walk about 3 minutes to Level 3 of Pavilion KL."}, {"address": "Ground Floor, Fahrenheit88, 179, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-Buy List: Exquisitely embroidered modal hijabs, stylish minimalist dresses, crystal brooch accessories. Founded by famous Malaysian celebrity Neelofa, Naelofar is currently the hottest Muslimah fashion and accessories brand in the country. The bright, elegant flagship store at Fahrenheit88 offers a comprehensive range of premium hijabs, sleekly tailored dresses, and chic handbags. Utilizing soft, breathable high-grade fabrics, rich color palettes, and trendy cuts, it is a landmark store for exploring contemporary Southeast Asian Modest Fashion.", "name": "Naelofar Flagship Store (Naelofar Fahrenheit88)", "transport": "Take the KL Monorail to Bukit Bintang Station; Fahrenheit88 Shopping Mall is directly across the street."}, {"address": "G080, Ground Floor, Sungei Wang Plaza, Jalan Sultan Ismail, 55100 Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-Buy List: Two-tone natural rubber flip-flops, platform stylish thong sandals, non-slip outdoor sandals. Fipper is Malaysia\u0027s iconic national flip-flop brand, recognized by its cute elephant logo. Made from 100% Malaysian natural rubber, their footwear is exceptionally soft, durable, slip-resistant, and antibacterial. The shop in Sungei Wang Plaza features a whole wall displaying a rainbow of colorful flip-flops at super affordable prices, making them a practical and high-value souvenir to buy in Kuala Lumpur.", "name": "Fipper Rubber Flip-Flops Store (Fipper Sungei Wang Plaza)", "transport": "Take the KL Monorail to Imbi Station or Bukit Bintang Station and walk about 3 minutes to Sungei Wang Plaza."}, {"address": "Lot 4.12.00, Level 4, Pavilion KL, 168, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.1 stars | Must-Buy List: Printed macaron-colored handbags, retro gold-buckle sneakers, Morandi-toned long wallets. Carlo Rino is a popular Malaysian homegrown shoe, bag, and accessory brand tailored for young women. Its design style emphasizes youthful vitality, vibrant colors, and sweet romance. The Pavilion store showcases a wide variety of graffiti-printed bags, macaron-hued wallets, and comfortable yet stylish footwear. Renowned for seamlessly integrating trendy elements into everyday accessories at reasonable prices, it is a favorite among young local women and tourists.", "name": "Carlo Rino Boutique (Carlo Rino Pavilion KL)", "transport": "Take the KL Monorail to Bukit Bintang Station and walk about 3 minutes to Pavilion KL."}, {"address": "Lot 3.01.01, Level 3, Pavilion KL, 168, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy List: Linen casual trousers, Southeast Asian style printed dresses, lightweight breathable silk-cotton shirts. BritishIndia is a premium luxury casual wear brand founded in Malaysia, specifically designed for tropical climates and upscale resort lifestyles. Its store interior radiates rich Nanyang colonial vintage vibes, and its garments are crafted from top-tier linen, pure cotton, and silk, offering ultimate comfort and sophisticated cuts. Favored by local elites and Western tourists, it is the premier choice for purchasing high-quality resort wear and unique Southeast Asian style apparel.", "name": "BritishIndia Boutique (BritishIndia Pavilion KL)", "transport": "Take the KL Monorail to Bukit Bintang Station and walk directly to Level 3 of Pavilion KL."}], "name": "Popular Local Apparel, Shoes \u0026 Bags"}, "cat_3": {"items": [{"address": "38, Jalan Utara, Off Jalan Imbi, Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-buy list: Tiramisu Milk Chocolate, Durian Dark Chocolate, 70% Dark Chocolate. Beryl\u0027s is an iconic local Malaysian chocolate brand crafted using high-quality locally grown cocoa beans. This flagship store in Bukit Bintang offers a full product line. The most popular items among tourists are the Southeast Asian-inspired durian and mango-flavored chocolates, exquisitely packaged and perfect as gifts for friends and family.", "name": "Beryl\u0027s Chocolate Experience Centre", "transport": "Take the MRT to Tun Razak Exchange Station or the Monorail to Imbi Station, then walk for about 8 minutes."}, {"address": "10, Jalan Imbi, Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-buy list: Premium Durian Dark Chocolate, Tongkat Ali Chocolate, Malaysian Curry Flavored Chocolate. Harriston is a well-known premium Malaysian chocolate brand famous for its innovative chocolates infused with rich local flavors. The store offers free samples of various unique flavors. Among them, Tongkat Ali and Curry flavors represent Malaysian heritage, making them a unique souvenir must-buy for many travelers visiting Kuala Lumpur.", "name": "Harriston Chocolates Bukit Bintang", "transport": "Take the Monorail to Imbi Station and walk for about 3 minutes."}, {"address": "Level 1, Pavilion KL, 168, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-buy list: Salted Egg Popcorn, Curry Leaf Popcorn, Musang King Durian Popcorn. Eureka is an immensely popular homegrown Malaysian popcorn brand that breaks traditional expectations with its round shape and countless unique flavors. Free of preservatives and incredibly crunchy, the Southeast Asian signature flavors like Salted Egg and Curry Leaf are richly savory and addictive.", "name": "Eureka Popcorn Pavilion KL", "transport": "Take the MRT to Bukit Bintang Station Exit 1, and walk via the pedestrian walkway for about 3 minutes to Level 1 of Pavilion KL."}, {"address": "Lot TL1.108.00, Level 1, Pavilion KL, 168, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-buy list: Oriental Kopi White Coffee Powder, Traditional Handmade Kaya Jam, Flaky Egg Tart Gift Box. Oriental Kopi is a hugely popular traditional Nanyang coffee shop in Malaysia, with its souvenirs being bestsellers that tourists queue up for. The signature white coffee is rich, smooth, and not sour, while the special Kaya jam is packed with pandan aroma, making it easy to recreate classic Nanyang breakfast flavors at home.", "name": "Oriental Kopi Pavilion KL (Souvenir Section)", "transport": "Take the MRT to Bukit Bintang Station Exit 1, and walk for about 3 minutes to enter Level 1 of Pavilion KL."}, {"address": "168, Jalan Imbi, Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-buy list: Musang King Durian Egg Rolls, Freeze-Dried Durian Chips, Musang King Durian Soft Candies. Located in the heart of Bukit Bintang, DurianBB Park is a paradise for durian lovers. Beyond fresh fruit, its house-developed durian snacks and souvenirs are excellent choices. Using professional freeze-drying technology to preserve the authentic rich aroma of Musang King durians, they come in cute, stylish packaging that is convenient to bring home to share.", "name": "DurianBB Park Bukit Bintang", "transport": "Take the Monorail to Imbi Station and walk along Jalan Imbi for about 5 minutes."}, {"address": "Lot LB-01, Level 1, Pavilion KL, 168, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-buy list: Nyonya Pandan Layer Cake, Gula Melaka Pineapple Tarts, Pandan Coconut Kaya Jam. Nyonya Colors specializes in promoting Malaysia\u0027s traditional Baba Nyonya culinary culture. Its pastries and souvenir gift boxes are filled with delicate Nanyang flair. Made with natural ingredients like pandan leaves and Gula Melaka (palm sugar), they are delightfully sweet without being cloying\u2014a sophisticated dessert gift rich in local heritage.", "name": "Nyonya Colors Pavilion KL", "transport": "Take the MRT to Bukit Bintang Station and walk about 3 minutes to Level 1 of Pavilion KL."}, {"address": "Level 1, Pavilion KL, 168, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-buy list: A1 Bak Kut Teh Soup Spices, Ah Huat White Coffee, Penang Ah Lai White Curry Instant Noodles. Mercato is a gourmet supermarket inside Pavilion with the most comprehensive local Malaysian specialty section in Bukit Bintang. Here you can buy all must-have Malaysian everyday snacks and seasoning packs in one stop, including various brands of Bak Kut Teh spice bags, famous instant noodles, and white coffee. Prices are transparent with frequent promotions.", "name": "Mercato Supermarket Pavilion KL (Souvenir Section)", "transport": "Take the MRT to Bukit Bintang Station Exit 1, and walk for about 3 minutes to enter Level 1 of Pavilion KL."}, {"address": "LG Floor, Lot 10 Shopping Centre, 50, Jalan Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-buy list: Kim Lian Kee Signature Hokkien Mee Sauce, Traditional Handmade Chicken Biscuits, Kwong Thai Cheung Traditional Soy Sauce. Recommended by culinary critic Chua Lam, Lot 10 Hutong gathers various century-old Malaysian Chinese heritage eateries. Its specialty corner sells exclusively licensed cooking sauce packs and traditional biscuits from these legendary shops, allowing tourists to bring home the essence of KL\u0027s historic street food. A deeply authentic local souvenir.", "name": "Lot 10 Hutong Heritage Souvenir Corner", "transport": "Take the MRT to Bukit Bintang Station Exit D, which leads directly to Lot 10 Hutong in the basement."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "168, Jalan Bukit Bintang, 55100 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.8 stars | Must-buy list: Royal Selangor pewter drinkware, Padini clothing, Fipper rubber flip-flops. Kuala Lumpur\u0027s most iconic premier shopping center located on Bintang Walk (Bukit Bintang), boasting over 700 stores. Beyond international luxury brands, the basement level and upper floors feature a rich array of local Malaysian brand counters and souvenir sections, making it the top destination to experience KL\u0027s fashion and local shopping.", "name": "Pavilion Kuala Lumpur", "transport": "Take the KL Monorail to Bukit Bintang Station, then walk for about 3 minutes."}, {"address": "Persiaran Komersial KLIA, 64000 Sepang, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: Classic Coach handbags, discounted limited-edition Nike sneakers, Timberland casual boots. The most popular major outlet center in the suburbs of Kuala Lumpur, offering great bargains on many famous international and local Malaysian brands, often with discounts ranging from 30% to 70% off. It features a dedicated free shuttle service and flight check-in services, making it perfect for tourists to enjoy a big shopping spree on the last day of their trip.", "name": "Mitsui Outlet Park KLIA Sepang", "transport": "Take a Grab ride from Bukit Bintang for about 45 minutes; or take the KLIA Transit from KL Sentral to the airport and transfer to the free shuttle bus."}, {"address": "Lot 4.16.00, Level 4, Pavilion KL, 168, Jalan Bukit Bintang, 55100 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Must-buy list: VINCCI stylish flats, metallic buckle sandals, versatile geometric mini crossbody bags. VINCCI is Malaysia\u0027s most famous homegrown women\u0027s footwear and accessories brand, renowned for its incredible value and trend-setting international designs. Styles rotate rapidly, prices are affordable, and the quality is excellent, making it a must-visit local spot for every female traveler visiting Kuala Lumpur.", "name": "VINCCI (Pavilion KL)", "transport": "Take the KL Monorail to Bukit Bintang Station and enter Pavilion KL on Level 4."}, {"address": "Jalan Sultan Ismail, Bukit Bintang, 55100 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Must-buy list: Local dried durian, Malaysian signature printed T-shirts, handmade woven pouches. This classic shopping mall is a budget shopping paradise in Kuala Lumpur, brimming with authentic local everyday vibes. It houses numerous local independent boutiques, unique souvenir shops, and affordable apparel stores where you can purchase authentic Malaysian snacks and creative local items at very reasonable prices.", "name": "Sungei Wang Plaza", "transport": "Take the KL Monorail to Bukit Bintang Station, and it\u0027s right outside the exit."}, {"address": "Level 1, The Starhill, 181, Jalan Bukit Bintang, 55100 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Must-buy list: Loka Made Malaysia-themed illustrated postcards, modern Batik handmade bags, local independent brand scented candles. Located inside The Starhill along Bukit Bintang, Eslite Spectrum features a curated selection of Malaysian designer brands and lifestyle goods. It showcases unique products blending Nanyang charm with modern aesthetics, making it the premier spot for finding elegant souvenirs with authentic cultural flair.", "name": "Eslite Spectrum Starhill", "transport": "Take the MRT to Bukit Bintang Station (Exit D), then walk for about 2 minutes."}, {"address": "G08, Ground Floor, Fahrenheit88, 179, Jalan Bukit Bintang, 55100 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Must-buy list: Fipper classic elephant logo flip-flops, two-tone Thai-style sandals, colorful non-slip flip-flops for kids. Fipper is Malaysia\u0027s most iconic homegrown footwear brand, proud to use 100% natural rubber that is non-toxic, eco-friendly, comfortable, and durable. With vibrant color combinations and budget-friendly prices, it is a top local must-buy item that tourists frequently buy in multiple pairs.", "name": "Fipper Store (Fahrenheit88)", "transport": "Take the KL Monorail to Bukit Bintang Station, then walk about 3 minutes to Fahrenheit88 Mall (Ground Floor)."}, {"address": "F1.03, First Floor, Fahrenheit88, 179, Jalan Bukit Bintang, 55100 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Must-buy list: Nose vintage woven high heels, minimalist tote bags, metallic clutch bags. Nose is an immensely popular Malaysian local footwear and bag brand, crafting trendy shoes that combine comfort and fashion for modern women. Affordable yet uniquely designed, it frequently launches stunning original local collections loved by young Malaysians.", "name": "Nose (Fahrenheit88)", "transport": "Take the KL Monorail to Bukit Bintang Station, then walk about 3 minutes to Fahrenheit88 Mall (1st Floor)."}, {"address": "179, Jalan Bukit Bintang, 55100 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Must-buy list: Malaysian brand eyewear and accessories, local youth streetwear, specialty beauty and skincare products. Located right across from Pavilion KL, this mall focuses on youth fashion and local street trends. Compared to traditional large department stores, it gathers more independent local Malaysian fashion brands and affordable beauty stores, making it a hot spot for locals and tourists to hunt for trendy items and high-value apparel.", "name": "Fahrenheit88", "transport": "Take the MRT to Bukit Bintang Station (Exit D), then walk for about 1 minute."}], "name": "Major Department Stores \u0026 Outlets"}}, "name": "Bukit Bintang and Bintang Walk"}, "chinatown_pasar_seni": {"categories": {"cat_1": {"items": [{"address": "G-11, Ground Floor, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-buy list: Herbal Body Scrub, Turmeric Detox Soap, Extra Virgin Cold-Pressed Coconut Beauty Oil. Malaysia\u0027s premier and most iconic local natural skincare brand, focusing on traditional Malay Spa herbal ingredients and 100% natural plant extracts. Located inside Central Market, it is hugely popular among international tourists. Its essential oils and cold-pressed plant soaps are top-tier souvenir choices in Kuala Lumpur.", "name": "Tanamera Natural Spa Products Central Market", "transport": "Take the MRT or LRT to Pasar Seni Station, then walk about 3 minutes to get inside Central Market."}, {"address": "Lot G13, Ground Floor, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-buy list: Kacip Fatimah Skincare Oil, Tongkat Ali Vitality Body Wash, Malay Herbal Whitening Facial Mask. A specialty store in Central Market featuring traditional native herbal skincare from Malaysia and Southeast Asia. Combining traditional indigenous herbal wisdom with modern skincare technology, it is ideal for travelers seeking authentic Southeast Asian herbal skincare, hydration, and anti-aging products.", "name": "Asian Secrets Central Market", "transport": "Take the LRT to Pasar Seni Station and walk about 3 minutes after exiting to reach Central Market."}, {"address": "No. 138, Jalan Petaling, City Centre, 50000 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-buy list: Pearl Whitening Mask, Bird\u0027s Nest Beauty Drinks, Bo Jin Tan Beauty Capsules. Founded in 1879, this century-old traditional Chinese pharmacy brand is located in the heart of Petaling Street. Alongside traditional herbs, its Chinese herbal beauty products and bird\u0027s nest skincare series are loved by women. The herbal skincare counter offers personalized consultations, making it a must-visit blend of Traditional Chinese Medicine and modern cosmetics.", "name": "Eu Yan Sang Petaling Street Flagship Store", "transport": "Take the MRT to Merdeka Station or Pasar Seni Station, then walk about 5 minutes to reach Petaling Street Pedestrian Mall."}, {"address": "No. 122, Jalan Petaling, City Centre, 50000 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-buy list: SimplySiti Latte Lipstick, Nutox Bird\u0027s Nest Collagen Serum, Safi Tea Tree Acne Cleanser. A popular drugstore chain at the entrance of Petaling Street, perfect for picking up local Malaysian drugstore makeup and Halal-certified skincare. Local brands like Safi and SimplySiti (founded by Malaysia\u0027s pop queen) are well-stocked, highly affordable, and offer excellent value for money.", "name": "Watsons Petaling Street", "transport": "Take the LRT to Pasar Seni Station, walk along Jalan Sultan for about 4 minutes, and turn into Petaling Street."}, {"address": "No. 63, Jalan Sultan, City Centre, 50000 Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-buy list: Aiken Tea Tree Soothing Gel, Nanowhite Whitening Serum, Bio-Essence Miracle Finisher. A well-known local Malaysian pharmacy chain near Petaling Street with a bright environment and extensive product range. Specializing in oil control, anti-acne, and whitening products tailored for Southeast Asia\u0027s hot and humid climate, its tea tree and Malay herbal skincare remedies are huge hits with locals and tourists alike.", "name": "Caring Pharmacy Jalan Sultan", "transport": "Take the MRT to Pasar Seni Station and walk along Jalan Sultan for about 3 minutes."}, {"address": "Central Market Annex, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.7 stars | Must-buy list: Malaysian Food-shaped Handmade Soaps, Natural Tinted Lip Balm, Non-toxic Handmade Bath Bombs. A famous Malaysian independent artisanal beauty brand known for creative, non-toxic bath products, such as soaps shaped like ABC (Ais Kacang) or Nasi Lemak. Made with natural ingredients, free from artificial preservatives, and cruelty-free, their products offer both visual charm and excellent moisturizing benefits.", "name": "Wunderbath Central Market Counter", "transport": "Take the LRT or MRT to Pasar Seni Station, then walk about 3 minutes to the Central Market Annex."}, {"address": "No. 84, Jalan Sultan, City Centre, 50000 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-buy list: Bedak Sejuk (Traditional Rice Powder Cake), Herbal Anti-Itch Ointment, Traditional Pearl Mask Powder. A legendary medical hall with decades of history, still offering traditional Malaysian Chinese beauty remedies made using ancient methods. Their signature Bedak Sejuk (cooling rice powder) is a natural traditional product used by Southeast Asian women to cool the skin, prevent acne, and brighten complexion\u2014rich in nostalgic charm and natural therapeutic benefits.", "name": "Thye Seng Medical Hall Jalan Sultan", "transport": "Take the MRT to Pasar Seni Station and walk about 4 minutes after exiting."}, {"address": "No. 118, Jalan Petaling, City Centre, 50000 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-buy list: Silkygirl Makeup Eyeliner, Cosmoderm Vitamin E Cream, Safi Balqis Whitening Lotion. A prime drugstore located in the heart of the Petaling Street commercial area, focusing on affordable local Malaysian beauty brands. Silkygirl is a wildly popular local makeup brand known for sweatproof and waterproof longevity, while Cosmoderm is a flagship brand focusing on natural Halal skincare\u2014budget-friendly and highly effective.", "name": "Guardian Petaling Street", "transport": "Take the LRT to Pasar Seni Station and walk about 5 minutes directly to the main Petaling Street strip."}], "name": "Local Representative Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "G-01, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.7 stars | Must-buy list: Modern batik printed short-sleeve shirts, organic cotton batik face masks, lightweight casual printed shorts. Kapten Batik is an iconic Malaysian homegrown fashion brand dedicated to infusing traditional batik wax-resist dyeing art into modern menswear and womenswear designs. Located inside Central Market, this store showcases a wide range of shirts made from Egyptian organic cotton and natural dyes. Featuring exquisite motifs with a distinct Southeast Asian vibe, these outfits are perfect for warm tropical travel. It\u0027s a highly recommended high-quality local brand loved by trendy young locals and international tourists alike.", "name": "Kapten Batik Modern Batik Fashion Store (Kapten Batik Central Market)", "transport": "Take the LRT Kelana Jaya Line to Pasar Seni Station, then walk about 3 minutes into the Central Market building."}, {"address": "G-09, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.8 stars | Must-buy list: Hand-dyed batik silk scarves, Nyonya-patterned spacious canvas totes, handcrafted batik clutches. Batik Boutique is an impactful social enterprise dedicated to empowering local artisan women. All products are hand-dyed and sewn by Malaysian artisans. Their bags, totes, and fashion accessories seamlessly blend traditional batik motifs with sleek, practical modern cuts. Excellent in quality and rich in storytelling, it is the premier spot to discover high-quality, locally designed bags and apparel.", "name": "Batik Boutique Social Enterprise Boutique (Batik Boutique Central Market)", "transport": "Take the LRT Kelana Jaya Line to Pasar Seni Station, then walk about 3 minutes to the ground floor of Central Market."}, {"address": "REXKL, 80, Jalan Sultan, City Centre, 50000 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: 1980s tropical floral shirts, classic vintage leather crossbody bags, vintage denim jackets. Tucked inside REXKL\u2014a hipster enclave revitalized from an old cinema in Petaling Street\u2014Baden Baden Vintage is a secret paradise for KL\u0027s fashion lovers and vintage enthusiasts. The store offers a curated selection of vintage apparel and secondhand bags from around the world as well as local Malaysian finds. From vibrant tropical printed shirts to timeless antique leather bags, every item oozes retro charm and unique taste, making it ideal for travelers seeking one-of-a-kind style pieces.", "name": "Baden Baden Vintage Clothing \u0026 Bags (Baden Baden Vintage REXKL)", "transport": "Take the MRT to Pasar Seni Station (Exit 2) and walk about 5 minutes to REXKL."}, {"address": "1st Floor, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Must-buy list: Exquisite lace-embroidered Kebaya tops, traditional batik sarongs, handcrafted Nyonya beaded shoes. Located on the 1st floor of Central Market, Warisan Kebaya specializes in \u0027Kebaya\u0027\u2014the signature traditional attire of Nyonya culture in Malaysia. The shop features intricate, beautifully embroidered tops in a vibrant spectrum of colors paired with eye-catching batik sarongs, showcasing supreme Southeast Asian elegance. The friendly owner is always ready to help fit and color-match your perfect set. Buying a set here makes for a truly unique fashion souvenir from Kuala Lumpur.", "name": "Warisan Kebaya Traditional Nyonya Kebaya Boutique (Warisan Kebaya Central Market)", "transport": "Take the LRT Kelana Jaya Line to Pasar Seni Station, then walk about 3 minutes to the 1st floor of Central Market."}, {"address": "G-23, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Must-buy list: Classic two-tone natural rubber flip-flops, wide-strap platform sandals, colorful waterproof kids\u0027 slippers. Fipper is Malaysia\u0027s household name for rubber flip-flops, renowned for its iconic elephant logo and unbeatable value for money. Crafted from 100% premium local natural rubber, their flip-flops feature non-slip, durable, and cushioned soles for maximum comfort. With dozens of vibrant color combinations available at ultra-affordable prices, these are a super practical must-have footwear item for anyone traveling in Malaysia.", "name": "Fipper Rubber Flip-Flops Store (Fipper Central Market)", "transport": "Take the LRT or MRT to Pasar Seni Station and walk about 3 minutes to the ground floor of Central Market."}, {"address": "Mydin Sinar Kota, Jalan Silang, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Must-buy list: Stylish woven flat sandals, textured leather metallic-buckle clutches, elegant pointed high heels. Vincci is the hugely popular footwear and accessory line under Padini, a Malaysian fashion giant. Famous for staying ahead of runway trends while keeping prices budget-friendly, the brand offers everything from comfy flats and resort-style sandals to versatile women\u0027s bags. Designed to fit Asian feet comfortably with solid craft and endless variety, it is a go-to shopping paradise for locals and tourists hunting for affordable chic footwear and bags.", "name": "Vincci National Women\u0027s Shoes \u0026 Bags Store (Vincci Central Market Area)", "transport": "Take the LRT to Masjid Jamek Station or Pasar Seni Station and walk about 5 minutes."}, {"address": "G-35, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: Handcrafted Indian pashmina cashmere shawls, luxurious beaded evening clutches, bohemian silk printed maxi dresses. Located inside Central Market, Sutraa embraces the rich multicultural flavors of South and Southeast Asia, specializing in premium silk products, embroidered fashion, and handmade bags. The shop offers a curated selection of hand-sewn beaded accessories and incredibly soft, draped cashmere shawls. Rich in color and meticulous in detail, it is beloved by travelers who appreciate exotic ethnic vibes and refined, elegant style.", "name": "Sutraa Exotic Fashion \u0026 Handcrafted Bags Boutique (Sutraa Silk \u0026 Crafts Central Market)", "transport": "Take the LRT Kelana Jaya Line to Pasar Seni Station, then walk about 3 minutes to Central Market."}, {"address": "Jalan Petaling, City Centre, 50000 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Must-buy list: Hand-woven genuine leather sandals, vintage genuine leather briefcases, hand-carved leather belts. Located in the historic Petaling Street precinct, this leather craft shop preserves the essence of Kuala Lumpur\u0027s traditional artisan craft. The store insists on hand-stitching footwear and bags using high-quality leather, featuring breathable woven leather sandals ideal for the tropical climate as well as vintage briefcases and wallets that age gracefully with use. Filled with the rich aroma of real leather, it offers fair prices and remarkable durability\u2014a hidden treasure where local insiders go for practical leather goods and bespoke footwear.", "name": "Petaling Street Classic Leather \u0026 Handcrafted Shoes (Petaling Street Classic Leather \u0026 Shoes)", "transport": "Take the MRT to Pasar Seni Station (Exit 1) and walk about 3 minutes into the main pedestrian strip of Petaling Street."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "85, Jalan Petaling, City Centre, 50000 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Try List: Signature Kaya Puff, Sweet Wife Cake, Century Egg Pastry. With a history spanning over a century, this historic bakery is one of the most iconic traditional pastry shops on Petaling Street in Kuala Lumpur. They still insist on traditional handcrafting, producing pastries with thin, flaky, layered crusts and generous fillings. The signature Kaya Puff features rich, sweet pandan kaya jam wrapped in an ultra-flaky crust, making it a classic old-school souvenir highly recommended by tourists and locals alike.", "name": "Fung Wong Biscuit", "transport": "Take the MRT to Pasar Seni Station, then walk for about 5 minutes."}, {"address": "153, Jalan Petaling, City Centre, 50000 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Try List: Signature Three-Flavor Egg Tarts, Taro Pastry, Char Siu Pastry. Founded in 1893, Bunn Choon Confectionery is renowned for its sublime flaky egg tarts. Their egg tarts feature exceptionally crisp, multi-layered crusts filled with smooth, rich egg custard. Besides the classic flavor, the three-color combination featuring Bamboo Charcoal Black Sesame and Green Tea is a top favorite, often drawing queues of tourists waiting for freshly baked batches.", "name": "Bunn Choon Confectionery", "transport": "Take the MRT to Pasar Seni Station, then walk for about 3 minutes."}, {"address": "Mezzanine Floor, Central Market, Jalan Hang Kasturi, City Centre, 50000 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy List: 3D Wooden Landmark Frames, KL Landmark Wooden Bookmarks, Heritage Pattern Card Holders. Located inside Central Market, ARCH is Malaysia\u0027s premier handmade wood veneer art brand. They specialize in intricately assembling natural wood veneers to showcase architectural icons like the Petronas Twin Towers, Petaling Street, and Merdeka Square. These exquisite 3D wood carvings combine high artistic value with memorable significance, making them an elegant top choice for gifts.", "name": "ARCH Gift Shop Central Market", "transport": "Take the MRT or LRT to Pasar Seni Station, then walk for about 2 minutes to Central Market."}, {"address": "19, Jalan Sultan, City Centre, 50000 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy List: Durian Chocolate, Tiramisu Milk Chocolate, Mango Dark Chocolate. Beryl\u0027s is Malaysia\u0027s homegrown national chocolate brand, featuring a charming standalone boutique in Chinatown. Their most tropical creation is the rich Durian Chocolate, crafted using premium local cocoa beans paired with quality durian ingredients. With its unique flavor profile and elegant packaging, it makes a wonderful gift to bring home for friends and family.", "name": "Beryl\u0027s Chocolate Chinatown", "transport": "Take the MRT to Pasar Seni Station, then walk for about 4 minutes."}, {"address": "14, Jalan Hang Lekir, City Centre, 50000 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-Buy List: Signature Pork Bakkwa, Chicken Floss Rolls, Golden Pork Bakkwa. Established in 1978, Oloiya is a household name in Kuala Lumpur for local dried meat (bakkwa). Marinated with a secret recipe and slow-roasted over charcoal, their bakkwa is tender, juicy, and infused with a rich smoky aroma. Conveniently individually wrapped, it\u0027s easy to store and carry\u2014a hugely popular snack for holidays and travel souvenirs.", "name": "Oloiya Petaling Street", "transport": "Take the MRT to Pasar Seni Station, then walk for about 5 minutes."}, {"address": "Lot G03, Ground Floor, Central Market, Jalan Hang Kasturi, City Centre, 50000 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-Buy List: Tropical Palm Handmade Herbal Soap, Cold-Pressed Virgin Coconut Oil, Natural Herbal Body Scrub. Tanamera is a famous Malaysian natural herbal skincare brand whose products are inspired by precious tropical rainforest plants and traditional tropical spa remedies. Rich in coconut oil and natural botanical extracts, their handmade soaps are gentle and all-natural, making them a must-buy souvenir for fans of aromatherapy and skincare.", "name": "Tanamera Central Market", "transport": "Take the MRT or LRT to Pasar Seni Station, then walk for about 2 minutes to the Ground Floor of Central Market."}, {"address": "68, Jalan Petaling, City Centre, 50000 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy List: Oriental Classic White Coffee Drip Bags, Handmade Pandan Kaya Jam, Flaky Egg Tart Gift Box. Oriental Coffee is a wildly popular Nanyang-style cafe chain in Malaysia, and its Petaling Street outlet offers a wide array of packaged souvenirs. Their white coffee is rich and smooth with a fragrant milky taste and subtle roasted aroma. The handmade pandan kaya jam is spectacular on toast, making it an essential souvenir to experience authentic Malaysian kopitiam culture.", "name": "Oriental Coffee Petaling Street", "transport": "Take the MRT to Pasar Seni Station, then walk for about 4 minutes."}, {"address": "138, Jalan Petaling, City Centre, 50000 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buy List: Malaysian Bak Kut Teh Spice Packs, Pure Bird\u0027s Nest Gift Box, Gold Label Bak Foong Pills. Located in the heart of Petaling Street, this long-established Eu Yan Sang flagship store is famous for its meticulously blended Bak Kut Teh spice packets, loved by international travelers for recreating authentic Nanyang herbal soups at home. The store also offers top-grade Southeast Asian bird\u0027s nest and health supplements, making it the best spot to pick up premium wellness gifts for elders.", "name": "Eu Yan Sang Chinatown", "transport": "Take the MRT to Pasar Seni Station, then walk for about 4 minutes."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Lot 3.04-3.06, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy List: Malaysian handmade Batik scarves, Royal Selangor pewterware, and authentic Nanyang handmade cookies. Originally established as a wet market in 1888, Central Market has transformed into Kuala Lumpur\u0027s most iconic arts and cultural shopping centre. The interior is divided into cultural zones representing the Malay, Chinese, and Indian heritage, housing hundreds of local independent craft shops, traditional clothing boutiques, and souvenir stalls. It is the top destination for experiencing Malaysia\u0027s multicultural charm and picking up high-quality souvenirs.", "name": "Central Market", "transport": "Take the MRT or LRT to Pasar Seni Station, then walk for about 2 minutes."}, {"address": "80, Jalan Sultan, City Centre, 50000 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy List: Local designer graphic T-shirts, unique stationery from the BookXcess labyrinth bookstore, and original Malaysian independent postcards. Housed in the repurposed Rex Cinema from the 1940s, REXKL is currently the hottest hipster spot in Petaling Street. The interior retains its post-fire brick walls and industrial aesthetic, hosting various local independent brands, creative markets, artisan workshops, and indie bookstores. This unique space blending historic heritage with modern creativity is hugely popular among local youth and international travelers.", "name": "REXKL Cultural \u0026 Vintage Hub", "transport": "Take the MRT to Pasar Seni Station, Exit A, and walk for about 5 minutes."}, {"address": "Level 2, Lee Rubber Building, 145 Jalan Tun H.S. Lee, City Centre, 50000 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade geometric-print placemats, Southeast Asian handwoven tote bags, and custom Nanyang artisanal essential oils. Founded by renowned Malaysian designer Peter Hoe, this lifestyle boutique is a hidden gem for Kuala Lumpur insiders and savvy shoppers. The shop features handmade home decor, clothing, tableware, and textiles infused with vibrant Southeast Asian motifs. Each piece showcases a unique local aesthetic design, making it perfect for finding high-quality, distinctive home goods.", "name": "Peter Hoe Evolution KL", "transport": "Take the MRT or LRT to Pasar Seni Station, then walk for about 4 minutes."}, {"address": "67, Jalan Tun Perak, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.1 stars | Must-Buy List: OldTown Hazelnut White Coffee, A1 Bak Kut Teh spice packs, and bulk Milo powder. Mydin is a historic local wholesale department chain in Malaysia. This branch near Petaling Street is a treasure trove for finding great value local snacks and daily essentials. It sells a wide variety of local food items, spices, instant beverages, and traditional Malay attire at prices far cheaper than standard tourist supermarkets\u2014making it the top budget choice for stocking up on Malaysian specialties in one go.", "name": "Mydin Wholesale Hypermarket Petaling Street", "transport": "Take the LRT to Masjid Jamek Station, then walk for about 3 minutes."}, {"address": "Persiaran Komersial MOP KLIA, 64000 Sepang, Selangor", "feature": "\u2b50 4.3 stars | Must-Buy List: Nike sneakers up to 70% off, discounted classic Coach leather bags, and Bally boutique clearance leather goods. This is the largest and most recommended outlet mall on the outskirts of Kuala Lumpur, offering direct airport and city shuttle services. The mall brings together over 100 global fashion brands and sportswear giants, offering year-round discounts ranging from 30% to 70% off. In addition to international brands, there are also many discounted local Malaysian street style brands, making it a must-visit outlet sanctuary for a final shopping spree before leaving KL.", "name": "Mitsui Outlet Park KLIA Sepang", "transport": "Take a direct Express Bus from KL Sentral, or take the free shuttle bus from KLIA Airport (approx. 10 minutes)."}, {"address": "2, Jalan Hang Tuah, Bukit Bintang, 55100 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy List: NITORI Japanese home furnishings, Don Don Donki exclusive snacks, and local Malaysian artisanal scented hand creams. Located just east of the Petaling Street business district, LaLaport BBCC is Japan\u0027s Mitsui Group\u0027s first major shopping park in Southeast Asia. Combining modern green architectural design with a rich shopping experience, it debuts multiple Japanese brands making their Malaysian debut alongside local original concept stores. Featuring a spacious rooftop garden, it offers a clean, comfortable, and pleasant environment to shop.", "name": "LaLaport Bukit Bintang City Centre (LaLaport BBCC)", "transport": "Take the LRT or Monorail to Hang Tuah Station; a covered skybridge connects directly to the mall."}, {"address": "Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.0 stars | Must-Buy List: Hand-carved wooden ornaments, traditional handmade leather goods, and Malaysian-style woven handbags. Kasturi Walk is an open-air pedestrian shopping street adjacent to Central Market, marked at its entrance by a grand arch inspired by the traditional Malay kite (Wau). Lined with uniform kiosk stalls selling traditional Malaysian handicrafts, ethnic accessories, and local snacks, it boasts a lively atmosphere rich in local culture and folklore.", "name": "Kasturi Walk", "transport": "Take the MRT or LRT to Pasar Seni Station, then walk for about 2 minutes."}, {"address": "G19, Ground Floor, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy List: 3D layered wooden picture frames of KL landmarks, landmark-shaped wood veneer bookmarks, and handmade 3D wooden landmark postcards. ARCH is a premier local Malaysian creative brand specializing in intricate wood-veneering craftsmanship that recreates Kuala Lumpur\u0027s iconic landmarks and historical heritage. Located inside Central Market, this flagship gift shop features handcrafted works that combine the beauty of Malaysian architecture with everyday accessories and elegant decor, making them highly collectible.", "name": "ARCH Heritage Gift Shop Central Market", "transport": "Take the MRT or LRT to Pasar Seni Station; enter the ground floor of Central Market to find the shop."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Petaling Street and Central Market"}, "kl_sentral_brickfields": {"categories": {"cat_1": {"items": [{"address": "LG, Nu Sentral, 201, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.5 Stars | Must-Buys: Safi Rania Gold Youth Gold Essence, Safi Balqis Brightening Cleansing Gel, Safi Refreshing Herbal Moisturizer. Safi is one of Malaysia\u0027s most iconic home-grown, Halal-certified skincare and beauty brands, specially formulated for Southeast Asia\u0027s climate and skin types. Featuring natural extracts and strict Halal standards, it is hugely popular among local women. Available at various outlets in Nu Sentral, offering affordable prices and exceptional quality\u2014it\u0027s the top choice to experience authentic Malaysian beauty culture.", "name": "Safi Cosmetics Counter \u0026 Outlets (Safi Cosmetics Nu Sentral)", "transport": "Take the LRT, MRT, or Monorail to KL Sentral Station, then walk 2 minutes directly into Nu Sentral Mall."}, {"address": "122, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.6 Stars | Must-Buys: Indian Neem Moisturizing Cream, All-Natural Indian Herbal Hair Oil, Pure Botanical Ayurvedic Handmade Soap. Located in the heart of Kuala Lumpur\u0027s Little India, this shop is a paradise for local Indian residents and tourists seeking all-natural herbal skincare. Filled with rich botanical fragrances, it offers a wide range of Ayurvedic cosmetics and body care products formulated using ancient methods, renowned for repairing hair and soothing sensitive skin.", "name": "Ambika\u0027s Herbal \u0026 Beauty Brickfields", "transport": "About a 7-minute walk from KL Sentral Station to the main street of Little India."}, {"address": "180, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.4 Stars | Must-Buys: Kajal Traditional Herbal Eyeliner, Chandrika Coconut Sandalwood Soap, Brahmi Hair Vitalizing Herbal Oil. A long-established health and beauty store in Brickfields Little India, specializing in traditional Indian Ayurvedic skincare and herbal supplements. Rich in cultural heritage, the friendly staff offer professional advice on herbal wellness and beauty, making it the best spot to pick up authentic Indian herbal cosmetics and skincare.", "name": "Thangam Ayurvedic \u0026 Medical Store", "transport": "Take the Monorail to KL Sentral Station and walk along Jalan Tun Sambanthan for about 5 minutes."}, {"address": "CC-29, Concourse Level, Nu Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.3 Stars | Must-Buys: SimplySiti Matte Longwear Lipstick, Argan Wonder Anti-Aging Serum, Cushion Foundation. Founded by Malaysia\u0027s legendary pop icon Siti Nurhaliza, this flagship local beauty brand is specially crafted for Asian skin types and tropical climates. Combining stylish makeup with high-quality skincare ingredients, its products rival international luxury brands at accessible prices. Loved by Malaysian women, it makes for a uniquely representative local souvenir.", "name": "SimplySiti Nu Sentral", "transport": "Take the LRT or MRT to KL Sentral Station, directly connecting to the Concourse Level (CC) of Nu Sentral."}, {"address": "GF-22, Ground Floor, Nu Sentral, 201, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.7 Stars | Must-Buys: Purifying Neem Face Wash, Natural Herbal Lip Balm, Ayurvedic Whitening Toothpaste. Although Himalaya originates from India, it holds iconic status in KL\u0027s Little India and KL Sentral area. This dedicated store offers a complete line of herbal skincare, haircare, and wellness products made with clean, natural ingredients. Prices are significantly lower than in many other countries, making it a favorite shopping haul stop for tourists at KL Sentral.", "name": "Himalaya Wellness Nu Sentral", "transport": "Take the LRT or MRT to KL Sentral Station for direct access to Ground Floor (GF) of Nu Sentral."}, {"address": "LG-18, Nu Sentral, 201, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.3 Stars | Must-Buys: Cosmoderm Tea Tree Oil Anti-Acne Serum, Minyak Angin Medicated Oil, Kwan Loong Medicated Oil. Caring is a premier Malaysian pharmacy chain. Beyond prescription medicines, its highlight is a comprehensive array of local herbal skincare and traditional medicated ointments. It\u0027s the perfect place to stock up on household-staple medicated oils and affordable, highly effective local skincare, all subject to strict quality control.", "name": "Caring Pharmacy Nu Sentral", "transport": "Take the LRT, MRT, or Monorail to KL Sentral Station for direct access to the LG level of the mall."}, {"address": "LG Level, Nu Sentral Mall, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.2 Stars | Must-Buys: 24hr Waterproof Precision Eyeliner, Matte Junkie Lip Cream, Bloom Cutie Eyeshadow Palette. Silkygirl is a trendy, highly iconic budget beauty brand in Southeast Asia (Malaysia \u0026 Singapore). Specially formulated for the hot and humid climate, its products boast waterproof, sweatproof, and vibrant color-payoff formulas that are perfect for young Asian women. Exceptionally wallet-friendly, it\u0027s a must-buy local cosmetics brand when visiting Malaysia.", "name": "Silkygirl Nu Sentral", "transport": "Take the LRT or MRT to KL Sentral Station and head into Nu Sentral to find the counter."}, {"address": "54, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.5 Stars | Must-Buys: All-Natural Henna Hair Dye Paste, Henna Cone for Body Art, Natural Rose Water Hydrating Mist. Located in Little India, this specialty boutique excels in traditional Indian makeup and plant-based beauty supplies, best known for its natural henna dyes. Besides selling botanical hair ointments and soothing rose water, they also offer live traditional henna body art services\u2014making it a fantastic spot to immerse yourself in Little India\u0027s authentic beauty traditions.", "name": "Srikandi Traditional Henna \u0026 Beauty", "transport": "Walk about 4 minutes along Jalan Tun Sambanthan from the KL Sentral Monorail station exit."}], "name": "Iconic Local Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "No. 270-272, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buy List: Pure cotton embroidered Kurta, traditional silk Saree, Indian-style jewelry and accessories. This is Little India\u0027s most iconic long-standing department store, spanning several floors filled with high-quality traditional Indian clothing and exquisite fabrics. Many local Indian residents and tourists come specifically to pick well-tailored kurtas and intricate handcrafted sarees at very reasonable prices and with a vast selection.", "name": "Haniffa Department Store Brickfields", "transport": "Take
