the KL Monorail to Tun Sambanthan Station and walk about 3 minutes after exiting."}, {"address": "CC-23, Concourse Level, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-Buy List: Trendy sandals and flats, versatile chic crossbody bags, stylish sunglasses. Malaysia\u0027s top homegrown women\u0027s footwear brand, famous for its incredible value and up-to-date fashion designs. The shoes are specially contoured for Asian feet, offering high comfort at very wallet-friendly prices\u2014making it a must-visit budget shopping haven for women traveling in Kuala Lumpur.", "name": "Vincci Shoes \u0026 Bags (Vincci NU Sentral)", "transport": "Located on the CC (Concourse) level of NU Sentral Shopping Centre, directly connected to the main concourse of KL Sentral Station."}, {"address": "GF-25, Ground Floor, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-Buy List: Modern patterned short-sleeved Batik shirts, printed linen casual trousers, exquisite silk scarves, and accessories. A rising local designer brand that integrates traditional Malaysian Batik art into modern menswear and casual fashion. Using premium Egyptian long-staple cotton and fine linen, their patterns are stylish, breathable, and cool, reinventing classic batik into sleek, contemporary fashion\u2014making it a sophisticated and authentically local souvenir.", "name": "Kapitan Batik Boutique (Kapitan Batik NU Sentral)", "transport": "Located on the Ground Floor (GF) of NU Sentral. Take the LRT or Monorail to KL Sentral Station to reach."}, {"address": "No. 248, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy List: Intricately embroidered Lehenga sets, Indian-style rhinestone bangle sets, handcrafted embroidered shoes (Jutti). Located in the heart of Little India, specializing in high-end Indian wedding and festive attire. Exuding glamorous Bollywood flair, the shop offers a wide variety of hand-embroidered outfits and magnificent jewelry. Many tourists stop by specifically to pick out photo-worthy statement accessories and unique footwear.", "name": "Bollywood Fashion \u0026 Fashion Jewellery", "transport": "Take the Monorail to Tun Sambanthan Station and walk along Jalan Tun Sambanthan for about 4 minutes."}, {"address": "GF-08, Ground Floor, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buy List: Classic monogram genuine leather handbags, men\u0027s leather bifold wallets, business leather shoes. Founded in 1974, this premier Malaysian luxury leather and lifestyle brand is renowned for Italian-inspired craftsmanship and premium genuine leather. The NU Sentral store offers a full collection of elegant women\u0027s bags and sophisticated men\u0027s footwear and accessories, popular among local professionals and middle-class shoppers.", "name": "Bonia Leather Goods \u0026 Fashion (Bonia NU Sentral)", "transport": "Directly connected to KL Sentral Station; located right on the Ground Floor upon entering NU Sentral Shopping Centre."}, {"address": "CC-18, Concourse Level, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.1 stars | Must-Buy List: Youthful printed crossbody bags, colorful casual sandals, classic monogram short wallets. A hugely popular Malaysian accessible-luxury shoe and handbag brand among young women, featuring vibrant colors, cute prints, and playful trendy designs. The store offers practical yet stylish accessories at far more accessible prices than international designer brands, making it a favorite go-to for local young women and professionals.", "name": "Carlo Rino Fashion Shoes \u0026 Bags (Carlo Rino NU Sentral)", "transport": "Located on the CC Level of NU Sentral; follow signs from the KL Sentral main concourse via the connected walkway."}, {"address": "No. 200, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy List: Kanchipuram pure silk saree, printed men\u0027s silk shirts, handcrafted beaded shawls. Located in Little India, this traditional silk specialty store is famous for high-grade pure Indian silk fabrics. The shop displays vividly colored, finely woven traditional apparel and shawls. Friendly staff are happy to explain fabrics and styling options, making it a great place to experience South Asian textile culture.", "name": "Sanggam Silk Center", "transport": "Take the KL Monorail to Tun Sambanthan Station and walk about 5 minutes along Jalan Tun Sambanthan."}, {"address": "GF-39 to 42, Ground Floor, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buy List: SEED quality casual tees, PDI casual canvas shoes, MBO smart-casual trousers. A flagship store by Malaysian retail giant Padini, housing popular homegrown fashion sub-brands like SEED, P\u0026Co, and PDI under one roof. Offering everything from everyday wear, men\u0027s/women\u0027s/kids\u0027 apparel to trendy shoes and bags, it provides great quality at budget-friendly prices. Locals often come here for family one-stop wardrobe shopping.", "name": "Padini Concept Store NU Sentral", "transport": "Located on the Ground Floor atrium area of NU Sentral; directly accessible after exiting KL Sentral Station via transit links."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Lot CC-28, Concourse Floor, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-buy list: Tiramisu Almond Milk Chocolate, Durian Chocolate, Mango Dark Chocolate. Malaysia\u0027s most iconic local chocolate brand, conveniently located inside NU Sentral shopping mall. Its Tiramisu series is rich and smooth, encasing crunchy almonds\u2014making it a top souvenir choice for tourists. The durian chocolate offers a unique flavor experience for adventurous taste buds.", "name": "Beryl\u0027s Chocolate (NU Sentral)", "transport": "Take the LRT, MRT, or Monorail to KL Sentral Station, then walk to the Concourse Floor of NU Sentral Shopping Centre."}, {"address": "230, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-buy list: Gulab Jamun, Soan Papdi, Murukku. Located in the heart of Little India, this is an excellent spot to sample authentic Indian sweets and savory snacks. The store offers a wide variety of aromatic and uniquely textured treats; the Soan Papdi is silky and melts in your mouth, while the savory, crispy Murukku pairs perfectly with tea.", "name": "Bikanervala Traditional Indian Sweets \u0026 Snacks (Brickfields)", "transport": "A 7-minute walk from KL Sentral Station, or take the Monorail to KL Sentral Station and walk to the main street of Little India."}, {"address": "132, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-buy list: Custom Masala Powder, Teh Tarik Ceylon Black Tea Leaves, Pure Cold-Pressed Coconut Oil. This historic grocery store in Little India exudes rich South Asian charm. Packed with fragrant Indian spices, herbs, and daily necessities at budget-friendly prices, it\u0027s a treasure trove for picking up authentic curry spices and high-quality coconut oil for home cooking.", "name": "Madras Stores - Indian Spices \u0026 Groceries", "transport": "About a 6-minute walk from KL Sentral Station to reach the store on Brickfields\u0027 main road."}, {"address": "LG Floor, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.1 stars | Must-buy list: OldTown White Coffee, A1 Bak Kut Teh Soup Spices, Eureka Popcorn. Located on the Lower Ground floor of NU Sentral, this gourmet supermarket brings together famous souvenirs from all over Malaysia. From various flavors of instant white coffee and authentic Bak Kut Teh herb pouches to popular local snacks, you can get everything in one clean, reliable place.", "name": "Sam\u0027s Groceria (NU Sentral)", "transport": "Directly connected to KL Sentral Station into NU Sentral Shopping Centre; take the escalator down to the LG (Lower Ground) floor."}, {"address": "228, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-buy list: Laddu, Mysore Pak, Indian Mixture Snacks. A popular independent heritage sweet shop in Little India, loved by local Indian residents and tourists alike. They prepare traditional sweets and savories fresh by hand daily; the Laddu is rich with ghee and chickpea aroma, while their spiced savory mixtures are irresistibly addictive.", "name": "Siddhi Vinayagar Sweets \u0026 Snacks", "transport": "About an 8-minute walk from KL Sentral Station; walk straight along Jalan Tun Sambanthan to find the shop."}, {"address": "182, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur", "feature": "\u2b50 4.0 stars | Must-buy list: BOH Tea, Haldiram\u0027s Indian Snacks, Coconut Candy. This budget-friendly local supermarket has an authentic everyday vibe. Besides household goods, it\u0027s a great spot to hunt for local snacks and imported Indian treats. The famous local BOH Tea is sold here at very affordable prices, along with plenty of coconut delicacies and crisp traditional savory bites.", "name": "Sri Kota Supermarket", "transport": "About a 6-minute walk from KL Sentral Station, located right in the center of the Little India shopping strip."}, {"address": "LG-22, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-buy list: Freeze-dried Musang King Durian, Freeze-dried Mangosteen, Tropical Dried Mango. MBG is a well-known local fruit retail brand in Malaysia with a branch at NU Sentral. In addition to fresh tropical fruits, they offer a high-quality line of dried fruit gifts using advanced freeze-drying technology to lock in the true flavors of Musang King durian and mangosteen\u2014perfect for bringing back as gifts.", "name": "MBG Fruit Shop (NU Sentral)", "transport": "Walk directly from KL Sentral into the LG (Lower Ground) floor of NU Sentral Shopping Centre."}, {"address": "CC-12, Concourse Floor, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-buy list: Chicago Mix, Macadamia CaramelCrisp, Dark Chocolate CaramelCrisp. Located in the NU Sentral transit hub, this is a favorite gourmet snack stop for travelers passing through KL Sentral. The famous Chicago Mix blends savory cheddar cheese with rich caramel; cooked fresh on-site with a mouthwatering aroma, it\u0027s perfect for snacking on the go or sharing with friends and family back home.", "name": "Garrett Popcorn Shops (NU Sentral)", "transport": "Walk directly from the KL Sentral main concourse into the Concourse Floor (CC Floor) of NU Sentral to find the shop."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "201, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur, Wilayah Persekutuan Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy List: Padini fashion, Bata local footwear, OldTown White Coffee gift sets. A major shopping complex located in the heart of KL Sentral, directly connected to the MRT and KLIA Ekspres. Bringing together many local Malaysian designer brands and international chains, it offers a comfortable shopping environment and a vibrant local food court, making it the perfect rest and shopping stop before heading to Little India.", "name": "NU Sentral Mall", "transport": "Take the Monorail, MRT, or KLIA Ekspres to KL Sentral Station; directly connected upon exiting the station."}, {"address": "Persiaran Komersial KLIA, 64000 Sepang, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buy List: Nike discounted sneakers, Coach designer bags, Bratpack trendy backpacks. Kuala Lumpur\u0027s top-recommended outlet mall, easily accessible from KL Sentral via KLIA Transit or direct shuttle buses. Housing over a hundred world-renowned brands and Southeast Asia exclusive outlet stores, it offers incredible year-round discounts of 30% to 70% off. It also conveniently features flight check-in and luggage drop services.", "name": "Mitsui Outlet Park KLIA Sepang", "transport": "From KL Sentral, take the KLIA Transit to KLIA or KLIA2, then transfer to the free shuttle bus (approx. 10 minutes)."}, {"address": "117, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Must-Buy List: Indian natural scented soaps, pure cotton printed Sarees, authentic Indian curry spice mixes. An iconic independent department store located in the heart of Little India. Its multi-story space sells everyday essentials rich in Southeast Asian and Indian flair. Offering everything from traditional textiles and unique apparel to imported Indian cosmetics and spices at very affordable prices, it\u0027s a great spot to immerse yourself in local shopping culture.", "name": "Haniffa Department Store Brickfields", "transport": "About a 6-minute walk from KL Sentral to the main street of Little India."}, {"address": "CC-28, Concourse Level, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy List: Stylish flat sandals, woven shoulder bags, pearl accessories, and sunglasses. Malaysia\u0027s most iconic local footwear and bag brand, under the PADINI Group. Renowned for its high-quality designs, exceptional comfort, and highly affordable prices, it is beloved by local women and international tourists alike\u2014a must-buy national fashion brand at KL Sentral.", "name": "VINCCI (NU Sentral Branch)", "transport": "Located on the Concourse Level of NU Sentral Mall."}, {"address": "L4-18, Level 4, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic dual-tone natural rubber flip-flops, Slim series women\u0027s sandals, colorful kids\u0027 flip-flops. A famous original Malaysian natural rubber footwear brand featuring a cute elephant logo. Made from 100% natural Thai rubber, they are anti-slip, durable, and exceptionally soft and bouncy. Available in a wide variety of vibrant color combinations at budget-friendly prices, making them an essential tropical Malaysian souvenir.", "name": "Fipper Flip-Flops (NU Sentral Branch)", "transport": "Located on Level 4 of NU Sentral Mall."}, {"address": "234, Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.0 stars | Must-Buy List: Handmade brass incense burners, Ayurvedic herbal handmade soaps, intricately embroidered Sarees. A substantial department store in Little India specializing in traditional Indian culture, crafts, and apparel, filled with rich spice aromas and Indian music. Packed with unique handicrafts, traditional attire, and daily necessities, it\u0027s a must-visit for anyone seeking authentic Indian lifestyle goods and gifts.", "name": "Mangala Theebam Brickfields", "transport": "About a 5-minute walk from KL Sentral Monorail Station."}, {"address": "L1-02, Level 1, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy List: Basic casual T-shirts, discounted baby onesies and kids\u0027 wear, promotional hoodies. A highly popular local budget clothing outlet chain in Malaysia, known for its bundle discount deals (\u0027buy more, save more\u0027). Offering diverse styles with rapid stock updates, from men\u0027s and women\u0027s casual wear to children\u0027s clothing and accessories, it is the top spot for KL locals looking to hunt for affordable daily wardrobe staples.", "name": "Brands Outlet (NU Sentral Branch)", "transport": "Located on Level 1 of NU Sentral Mall."}, {"address": "L2-11 \u0026 12, Level 2, NU Sentral, Jalan Tun Sambanthan, 50470 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Must-Buy List: De-branded export surplus clothing from international brands, quality cotton kids\u0027 pajamas, branded casual shorts. A famous local Malaysian discount apparel outlet specializing in selling high-quality international export overstocks and off-season clothing at ultra-low prices. Featuring a bright and spacious shopping environment with incredible discounts, it is a favorite clearance outlet among budget-conscious shoppers and tourists in the KL Sentral commercial area.", "name": "Good2U Outlet Store (NU Sentral Branch)", "transport": "Located on Level 2 of NU Sentral Mall."}], "name": "Major Shopping Malls \u0026 Recommended Outlets"}}, "name": "Central Station and Little India"}, "klcc": {"categories": {"cat_1": {"items": [{"address": "Lot C15B, Concourse Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy List: Herbal Body Scrub, Cold-Pressed Virgin Plant Soap, Turmeric Body Massage Oil. Tanamera is Malaysia\u0027s premier homegrown tropical SPA skincare brand, featuring 100% natural botanical ingredients and traditional Malay herbal aesthetics. The store invites you in with the soothing aroma of natural essential oils. Its top-selling products are refined from tropical botanicals like ginger, lemongrass, and coconut\u2014perfect for post-beach skin recovery and home SPA pampering. A must-buy quality local souvenir when visiting Kuala Lumpur.", "name": "Tanamera Tropical Spa (Suria KLCC)", "transport": "Take the LRT Kelana Jaya Line to KLCC Station, then walk about 3 minutes to the Concourse Floor (B1) of Suria KLCC."}, {"address": "SAC-L1-3A, Level 1, Avenue K, 156, Jalan Ampang, 50450 Kuala Lumpur", "feature": "\u2b50 4.1 stars | Must-Buy List: Durian Scented Lip Balm, Ultra-Fine Waterproof Eyeliner, Colorful Long-Lasting Nail Polish. Elianto is a popular, affordable local Malaysian cosmetics brand famous for its vibrant colors and high value. The most unique highlight for international tourists is its creative local specialty: the Durian Scented Lip Balm, featuring a realistic durian aroma and rich hydration. Additionally, its eyeliners and lip colors are sweat-proof for tropical climates with excellent lasting power, making them wildly popular among local young women and travelers.", "name": "Elianto Make Up (Avenue K)", "transport": "Take the LRT to KLCC Station and walk 1 minute through the underground pedestrian walkway directly connecting to Avenue K Shopping Mall."}, {"address": "Level 1, Parkson Suria KLCC, Petronas Twin Towers, 50088 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buy List: Argan Wonder Cushion Foundation, C-Bright Brightening Serum, Halal-Certified Matte Lip Tint. Founded by Malaysia\u0027s iconic national singer, Dato\u0027 Siti Nurhaliza, SimplySiti is Malaysia\u0027s most prestigious Halal-certified premium beauty brand. Formulated specifically for Southeast Asian climates and Asian skin types, its products focus on non-sticky, lightweight textures with long-lasting wear. The natural argan oil repair line is a standout bestseller, making it well worth trying out in person.", "name": "SimplySiti Counter - Parkson (Suria KLCC)", "transport": "Take the LRT to KLCC Station and head to the beauty department on Level 1 of Parkson inside Suria KLCC."}, {"address": "C15-I, Concourse Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-Buy List: Matte Junkie Lip Cream, Fix It Long-Wear Concealer, 24HR Waterproof Eyeshadow Stick. Silkygirl is an immensely popular, budget-friendly drugstore beauty brand in Malaysia and Singapore, tailored specifically for young Southeast Asians. Its signature highlights are vibrant pigmentation and strong sweat-and-water resistance, built to handle Kuala Lumpur\u0027s hot and humid weather. Their famous Matte Junkie Lip Cream is smooth, non-drying, and super affordable, making it the top choice for budget shoppers and students.", "name": "Silkygirl Counter - Watsons (Suria KLCC)", "transport": "Take the LRT to KLCC Station for direct access to the Watsons store on the Concourse Floor (B1) of Suria KLCC."}, {"address": "C-12, Concourse Level, Avenue K, 156, Jalan Ampang, 50450 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy List: Aiken Tea Tree Oil Facial Cleanser, Double Prawn Brand Herbal Oil, Minyak Kayu Putih (Cajuput Oil). CARING Pharmacy is one of Malaysia\u0027s leading pharmacy chains. This branch, located at Avenue K directly opposite the Petronas Twin Towers, is spacious, bright, and fully stocked. Beyond standard medications, it is a treasure trove for local Malaysian and Southeast Asian healthcare and cosmetic products\u2014such as the Aiken tea tree oil care series, as well as traditional herbal oils and mosquito repellents used by locals since childhood. Ideal for buying in bulk.", "name": "CARING Pharmacy (Avenue K)", "transport": "Take the LRT to KLCC Station and take the underground exit straight to the Concourse Level of Avenue K."}, {"address": "C21, Concourse Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buy List: Wardah Rose Hydrating Gel Moisturizer, Safi Age Defy Gold Water Essence, Guardian Botanical Hydrating Body Wash. Guardian is a major health and beauty chain across Southeast Asia. The Suria KLCC branch houses a wide variety of Malaysian local and Halal beauty and skincare brands, such as popular brands Wardah and Safi, which focus on natural botanical ingredients and gentle care. Furthermore, Guardian\u0027s own botanical bath and shower products are super affordable with sophisticated scents\u2014making this a great spot to explore local beauty trends.", "name": "Guardian Flagship Store (Suria KLCC)", "transport": "Take the LRT to KLCC Station and enter the Concourse Floor (B1) of Suria KLCC to find the store."}, {"address": "G03-05, Ground Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-Buy List: SEPHORA COLLECTION Tropical Limited Edition Eyeshadow Palette, Fenty Beauty Cheeks Out Freestyle Cream Blush, Rare Beauty Soft Pinch Liquid Blush. Located inside Suria KLCC near the Twin Towers, this bright and stylish Sephora flagship is one of KL\u0027s hottest beauty hot spots. Beside major international brands, it frequently features Southeast Asia-exclusive makeup sets and tropical limited editions. With plenty of professional beauty advisors on site, you can get tailored oil-control and sweat-proof makeup setting advice suited for tropical weather.", "name": "Sephora Flagship Store (Suria KLCC)", "transport": "Take the LRT to KLCC Station and enter Suria KLCC; the store is prominently located on the Ground Floor."}, {"address": "G40, Ground Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.7 stars | Must-Buy List: Resurrection Aromatique Hand Wash, Parsley Seed Anti-Oxidant Serum, Resurrection Aromatique Hand Balm. The Aesop store at Suria KLCC blends KL\u0027s local architectural textures with minimalist aesthetics, creating a tranquil and relaxing space. It fully stocks Aesop\u0027s beloved Parsley Seed skincare line alongside premium botanical body care products. Friendly and knowledgeable staff offer thoughtful product demos and complimentary tea service, making it an exceptional stop to indulge in high-quality botanical skincare while shopping in KLCC.", "name": "Aesop (Suria KLCC)", "transport": "Take the LRT to KLCC Station and walk to the Ground Floor luxury area of Suria KLCC."}], "name": "Local Signature Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "Lot C21B, Concourse Floor, Suria KLCC, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Must-buy list: Minimalist flat sandals, woven dual-way tote bag, metallic buckle shoulder bag. A home-grown Malaysian women\u0027s footwear and bag brand under Padini, famous for its high value for money and designs that closely follow international trends. Prices in its home country are extremely budget-friendly, drawing international tourists to buy in bulk. It is the premier spot for everyday versatile shoes and trendy bags.", "name": "Vincci (Suria KLCC)", "transport": "Take the LRT Kelana Jaya Line to KLCC Station. Walk about 2 minutes to directly enter the Concourse Level of Suria KLCC mall."}, {"address": "Lot 122, 1st Floor, Suria KLCC, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: Monogram pattern tote bag, vintage genuine leather briefcase, classic monogram short wallet. Founded in 1974, this premier Malaysian leather goods brand is renowned across Southeast Asia for its exquisite Italian craftsmanship and high-quality genuine leather. Flawlessly blending classical Southeast Asian luxury with modern minimalism, its durable and premium products make it a benchmark brand for local elites and travelers seeking high-quality leather bags.", "name": "Bonia (Suria KLCC)", "transport": "Take the LRT to KLCC Station, enter Suria KLCC mall, and take the escalator up to the 1st Floor."}, {"address": "Lot 136, 1st Floor, Suria KLCC, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Must-buy list: Printed silk scarves, KL Landmark Series tote bags, Morandi-toned canvas bags. A premier fashion lifestyle brand created by renowned Malaysian fashion entrepreneur Vivy Yusof. Designed for modern urban women, it offers everything from premium scarves and sleek apparel to elegant handbags. With smooth silhouette lines and sophisticated color palettes, it is a highly popular brand beloved by local trendsetters and overseas visitors alike.", "name": "The dUCk Store (Suria KLCC)", "transport": "Take the LRT to KLCC Station, walk into Suria KLCC mall, and head to the 1st Floor to find the store."}, {"address": "Lot 116, 1st Floor, Suria KLCC, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Must-buy list: Pure cotton and linen resort tunics, embroidered linen shawls, tropical botanical print dresses. Internationally acclaimed Malaysian high-end casual wear brand specifically designed for tropical climates. Crafting garments from ultra-comfortable, high-quality linen and pure cotton, it combines delicate hand embroidery with tropical charm to deliver a refined, effortless British colonial resort style.", "name": "BritishIndia (Suria KLCC)", "transport": "Take the LRT to KLCC Station, enter Suria KLCC shopping centre, and proceed to the 1st Floor."}, {"address": "Lot C15E, Concourse Floor, Suria KLCC, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Must-buy list: Printed leather crossbody bag, macaron-colored chunky sneakers, cartoon collaboration handbag. An iconic local brand for young women\u0027s shoes and bags in Malaysia, focusing on youthful, vibrant, colorful, and playful fashion designs. The shop frequently launches special collaborations and dreamy color combinations. Featuring compact, chic, and practical bag designs with wallet-friendly prices and great quality, it attracts many tourists looking to pick up fun styles.", "name": "Carlo Rino (Suria KLCC)", "transport": "Take the LRT to KLCC Station; after exiting, seamlessly connect to the Concourse Level of Suria KLCC mall."}, {"address": "Lot C28, Concourse Floor, Suria KLCC, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Must-buy list: Customized embroidered canvas bags, vintage block heel pumps, stylish waterproof tote bags. A rapidly rising Malaysian women\u0027s shoe and bag designer brand that has swept the nation thanks to its ergonomic comfort and personalized customization services. Its most eye-catching classic canvas bags offer free custom name embroidery, making it a trendy shopping spot in Kuala Lumpur you simply cannot miss.", "name": "Christy Ng Shoes (Suria KLCC)", "transport": "Take the LRT to KLCC Station and walk about 2 minutes into Level C (Concourse Floor) of Suria KLCC mall."}, {"address": "Lot C15B, Concourse Floor, Suria KLCC, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: Classic silk patterned headscarves, Morandi-toned bucket bags, elegantly tailored long-sleeve maxi dresses. Founded by famous Malaysian celebrity Neelofa, this premier fashion clothing and accessory brand boasts a chic, modern store layout. Offering tailored modern womenswear, high-quality trendy handbags, and silk scarves, its designs masterfully combine Eastern elegance with Western fashion trends, making it wildly popular among young women.", "name": "Naelofar (Suria KLCC)", "transport": "Take the LRT to KLCC Station and walk directly into the Concourse Level of Suria KLCC to locate the store."}, {"address": "Lot C11-C15, Concourse Floor, Suria KLCC, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.3 stars | Must-buy list: Padini smart casual shirts, PDI graphic T-shirts, Seed premium leather women\u0027s shoes. The flagship concept store of Malaysian retail giant Padini, bringing together several of its exclusive local apparel brands. From trendy womenswear and sleek menswear to stylish kidswear, shoes, and accessories, it has it all. The spacious layout, rapid updates, and affordable prices make it the best one-stop shop for both locals and travelers to revamp their entire wardrobe.", "name": "Padini Concept Store (Suria KLCC)", "transport": "Take the LRT to KLCC Station, which connects directly to the Concourse Floor of Suria KLCC."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Lot C15C, Concourse Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-buy list: Tiramisu Milk Chocolate, Musang King Durian Chocolate, Dark Chocolate Thins. Beryl\u0027s is Malaysia\u0027s most iconic local chocolate brand, dedicated to using premium cocoa beans. The Suria KLCC store offers a complete selection, with high recommendations for the Musang King Durian Chocolate infused with tropical Malaysian flavors and the rich Tiramisu series. The beautiful packaging makes them ideal local souvenirs for friends and family.", "name": "Beryl\u0027s Chocolate (Suria KLCC)", "transport": "Take the LRT Kelana Jaya Line to KLCC Station, and walk through the underground pedestrian walkway to Concourse (C) Floor of Suria KLCC."}, {"address": "Lot C07, Concourse Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-buy list: Salted Egg Popcorn, Musang King Durian Popcorn, Nanyang Curry Popcorn. Eureka is a hugely popular Malaysian homegrown popcorn brand renowned for its unique and diverse Southeast Asian flavors. Every kernel is evenly coated in rich sauce, perfectly balancing sweet and savory with an incredible crunch. Available in cans and moisture-proof resealable bags for easy travel, it\u0027s an addictive snack you shouldn\u0027t miss when visiting the KLCC shopping district.", "name": "Eureka Gourmet Popcorn (Suria KLCC)", "transport": "Take the LRT to KLCC Station and enter Concourse (C) Floor of Suria KLCC Shopping Centre."}, {"address": "Lot 118, 1st Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.7 stars | Must-buy list: Delicate Petronas Twin Towers ornaments, airtight pewter tea caddies, two-handled beer mugs. Founded in 1885, Royal Selangor is Malaysia\u0027s world-renowned, national-treasure pewter brand. The flagship store at KLCC showcases exquisite hand-engraved craftsmanship, seamlessly blending local history and culture with modern design. Mini Twin Towers souvenirs are particularly high-quality keepsakes worth collecting.", "name": "Royal Selangor Pewter (Suria KLCC)", "transport": "Take the LRT to KLCC Station, enter Suria KLCC Shopping Centre, and take the escalator to Level 1."}, {"address": "Parkson, Level 2, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-buy list: Handmade batik silk scarves, traditional pattern passport covers, batik fabric coasters. This is a socially responsible local lifestyle and fashion brand dedicated to promoting traditional Malaysian Batik printed art. Products are handcrafted by local women and artisans, featuring vibrant colors and tropical charm, making them premium, culturally rich souvenirs that showcase Kuala Lumpur\u0027s creative flair.", "name": "Batik Boutique (Parkson KLCC)", "transport": "Take the LRT to KLCC Station and enter Level 2 of Parkson Department Store inside Suria KLCC."}, {"address": "Parkson Counter, Ground Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-buy list: Legendary Orchid Perfume, Longan Flower Perfume, Travel Perfume Gift Set. Legendary is a unique Malaysian homegrown fragrance brand inspired by the national flower and native orchid varieties. The scents are elegant, long-lasting, and infused with rich tropical floral notes. Featuring sleek bottle designs and luxurious packaging, it is the top souvenir choice for women seeking a unique memory of Kuala Lumpur.", "name": "Legendary Orchid Perfume (Suria KLCC)", "transport": "Take the LRT to KLCC Station and enter the Parkson fragrance counter area on the Ground Floor of Suria KLCC."}, {"address": "Concourse Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-buy list: BOH Cameron Highlands Black Tea, OldTown White Coffee, Pandan Kaya jam. Located on the basement concourse level of Suria KLCC, the Isetan Supermarket features a comprehensive local specialty products section gathering famous goods from all over Malaysia. From highland black tea to rich white coffee and traditional spreads, it has everything you need, making it the ultimate location for tourists to stock up on local snacks and gifts.", "name": "Isetan Food Market Souvenir Section (Suria KLCC)", "transport": "Take the LRT to KLCC Station and enter Isetan Supermarket on Concourse (C) Floor directly via the pedestrian walkway."}, {"address": "Level C, Avenue K, 156 Jalan Ampang, 50450 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-buy list: Wide Strap classic men\u0027s flip-flops, Slim series colorful women\u0027s sandals, kids\u0027 dual-tone flip-flops. Fipper is a famous Malaysian rubber footwear brand renowned internationally, featuring its iconic elephant logo and crafted from premium Thai natural rubber. The soles are slip-resistant, durable, and offer the perfect level of cushion, making them ideal for tropical islands and city walking. With vibrant colorways and very affordable prices, they are extremely popular practical souvenirs.", "name": "Fipper Natural Rubber Flip-Flops (Avenue K)", "transport": "Take the LRT to KLCC Station and use the underground passage directly connecting to Concourse (C) Level of Avenue K Shopping Mall opposite."}, {"address": "Concourse Level, KLCC LRT Station, Kuala Lumpur City Centre, 50088 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-buy list: Signature Coffee Butter Bun (Rotiboy), Curry Chicken Pie, Pandan Chiffon Cake. Founded in Penang, Rotiboy is a classic bakery chain beloved across Malaysia. Its signature coffee bun features a crispy outer shell infused with rich coffee aroma and a melting, slightly salted butter filling inside for a divine taste. Freshly baked and irresistibly fragrant, the shop also offers sealed traditional pastries and pies, making it a delicious souvenir that embodies local life.", "name": "Rotiboy Bakery (KLCC Station)", "transport": "Take the LRT to KLCC Station; the counter is located in the underground concourse passage after exiting the ticket gates."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "241, Petronas Twin Towers, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy: Beryl\u0027s Chocolates, Batik hand-dyed sarongs, international luxury goods. Located directly below the Petronas Twin Towers, this flagship shopping center connects to the iconic landmark. Housing over 300 brands and high-end department stores, it is Kuala Lumpur\u0027s most prestigious shopping destination, offering everything from top international labels to unique local souvenirs.", "name": "Suria KLCC", "transport": "Take the LRT Kelana Jaya Line (Red Line) to KLCC Station; it\u0027s a 1-minute walk via the direct underground pedestrian walkway."}, {"address": "156, Jalan Ampang, Kuala Lumpur City Centre, 50450 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.1 stars | Must-Buy: Malaysian trendy streetwear, SuperPark activity tickets, beauty \u0026 skincare sets. Directly opposite the Petronas Twin Towers, Avenue K features a younger, trendier, and more localized vibe. Packed with casual brands, themed entertainment halls, and food courts, it\u0027s a great spot to escape the crowds of Suria KLCC and experience local youth culture.", "name": "Avenue K Shopping Mall", "transport": "Take the LRT Kelana Jaya Line (Red Line) to KLCC Station and enter directly via the underground walkway at Exit C."}, {"address": "Persiaran Komersial KLIA, 64000 Sepang, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy: Discounted Nike sneakers, classic Coach leather goods, Michael Kors bags. As the most popular outlet mall in the Kuala Lumpur suburbs (about 45 minutes from the city center), it brings together hundreds of top international and Japanese brands offering year-round discounts of 30% to 70%. It is perfect for a major shopping spree right before boarding or leaving the country.", "name": "Mitsui Outlet Park KLIA Sepang", "transport": "Take a Grab ride from KLCC for about 45 minutes, or take the KLIA Transit from KL Sentral to the airport and transfer to the free shuttle bus."}, {"address": "145, Jalan Ampang, Kuala Lumpur City Centre, 50450 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy: Atlas Gourmet premium cheeses, imported fine wines, high-end fragrances. Adjoining Suria KLCC, this high-end luxury shopping center integrates the 5-star Four Seasons Hotel with a top-tier gourmet supermarket. Offering a tranquil and elegant atmosphere with a luxurious feel, it\u0027s ideal for buying fine foods and high-quality lifestyle products.", "name": "Shoppes at Four Seasons Place KLCC", "transport": "A 2-minute walk from the outdoor park at Suria KLCC."}, {"address": "Lot 126-128, Level 1, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buy: Padini business shirts, Vincci trendy women\u0027s shoes, PDI casual t-shirts. Malaysia\u0027s premier homegrown fast-fashion giant houses several local brands under one roof, including Padini, Vincci, and PDI. Known for incredible value for money and trendy designs, Vincci\u0027s footwear and affordable handbags are top choices for international tourists.", "name": "Padini Concept Store (Suria KLCC)", "transport": "Take the LRT Kelana Jaya Line (Red Line) to KLCC Station and walk to Level 1 of Suria KLCC."}, {"address": "Lot G03B, Ground Floor, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.6 stars | Must-Buy: Marvel-themed pewter tankards, exquisite tea caddies, handcrafted pewter beer mugs. World-renowned as Malaysia\u0027s century-old national treasure for pewter craftsmanship. The store showcases exquisite artisan items ranging from classic tea sets to contemporary pop-culture collectibles, with premium packaging that makes for invaluable souvenirs.", "name": "Royal Selangor (Suria KLCC Flagship Store)", "transport": "Take the LRT Kelana Jaya Line (Red Line) to KLCC Station and walk to the Ground Floor of Suria KLCC."}, {"address": "Lot 212, Level 2, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy: Personalized canvas tote bags, comfortable heels, retro handcrafted flats. A legendary local independent footwear and bag brand in Malaysia, famous for exceptional comfort, style, and great value. They even offer on-site personalization to print your English name on canvas totes, making it a favorite local boutique for female travelers.", "name": "Christy Ng Shoes (Suria KLCC)", "transport": "Take the LRT Kelana Jaya Line (Red Line) to KLCC Station and walk to Level 2 of Suria KLCC."}, {"address": "Lot 237, Level 2, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy: KL landmark mugs, Malaysian slang graphic T-shirts, Twin Towers illustrated tote bags. A popular local creative cultural brand among young people, APOM stands for \u0027A Piece of Malaysia\u0027. It cleverly transforms unique KL local slang and iconic Twin Towers imagery into humorous, original lifestyle goods and souvenirs.", "name": "APOM - A Piece of Malaysia (Suria KLCC)", "transport": "Take the LRT Kelana Jaya Line (Red Line) to KLCC Station and walk to Level 2 of Suria KLCC."}], "name": "Major Shopping Malls \u0026 Recommended Outlets"}}, "name": "KLCC and Petronas Twin Towers"}, "merdeka_lake_gardens": {"categories": {"cat_1": {"items": [{"address": "G-40, Ground Floor, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-Buy List: Cold-pressed Virgin Coconut Soap, Hibiscus/Turmeric Body Scrub, Natural Lavender Soothing Massage Oil. Tanamera is one of Malaysia\u0027s most iconic home-grown premium aromatherapy and herbal beauty brands, drawing on traditional Malay spa rituals and post-natal care wisdom. Located inside Central Market right next to Merdeka Square, it offers 100% pure natural skincare products free from synthetic additives. The shop is filled with a relaxing herbal scent, and its handmade soaps and body scrubs are top souvenir picks highly praised by travelers.", "name": "Tanamera Tropical Spa - Central Market", "transport": "Take the MRT to Pasar Seni Station and walk for about 3 minutes; or walk about 7 minutes from Merdeka Square."}, {"address": "G-17 \u0026 G-18, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buy List: SimplySiti Youth Restoring Serum, Silkygirl Matte Long-Lasting Lipstick, Bio-essence Bird\u0027s Nest Peptides Cream. Located in the bustling commercial zone east of Merdeka Square, this drugstore chain store features a dedicated section for local Malaysian and Southeast Asian beauty brands alongside international labels. Highly recommended are SimplySiti (founded by Malaysian pop queen Siti Nurhaliza) and the affordable yet high-quality Silkygirl\u2014both hugely popular among local women and perfect for picking up unique, wallet-friendly local makeup.", "name": "Watsons - Central Market", "transport": "Take the MRT to Pasar Seni Station (Exit 1) and walk for about 3 minutes."}, {"address": "No. 12, Medan Pasar, 50050 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy List: Cosmoderm Vitamin E Facial Glow Oil, Safi Rania Gold 24K Anti-Aging Serum, Himalaya Herbal Whitening Toothpaste. Located right next to Merdeka Square and the historic Medan Pasar, this Caring Pharmacy branch is a long-standing, trusted local chain pharmacy. It carries a comprehensive selection of local Malaysian drugstore items and dermocosmetics. In particular, the Halal-certified Safi skincare series\u2014focused on natural anti-aging and lightweight hydration\u2014offers impressive results at very affordable prices.", "name": "Caring Pharmacy - Medan Pasar", "transport": "About a 4-minute walk from Merdeka Square."}, {"address": "G-11, Ground Floor, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy List: Ready-to-drink Rock Sugar Bird\u0027s Nest Gift Set, Natural Pearl Whitening Powder Mask, Bird\u0027s Nest Collagen Nourishing Sheet Mask. Eu Yan Sang is a century-old renowned Traditional Chinese Medicine (TCM) and holistic beauty brand. Located in the cultural enclave near Merdeka Square, this branch attracts tourists looking for high-quality bird\u0027s nest skincare and TCM whitening masks. Combining traditional herbal wisdom with modern cosmetic technology, these premium beauty products make excellent gifts or personal treats.", "name": "Eu Yan Sang - Central Market Branch", "transport": "Take the LRT to Pasar Seni Station and walk for about 3 minutes; or walk about 6 minutes from Merdeka Square."}, {"address": "Concourse Level, Menara Dayabumi, Jalan Sultan Hishamuddin, 50050 Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-Buy List: Safi Turmeric Anti-Acne Facial Cleanser, Good Virtues Co. Habbatussauda Repairing Shower Cream, Aiken Tea Tree Oil Antibacterial Spray. Located inside Menara Dayabumi, a prominent landmark south of Merdeka Square, this store is part of Malaysia\u2019s beloved pharmacy chain. A standout recommendation is Good Virtues Co., known for its Halal-vegan formulas enriched with organic Black Seed Oil (Habbatussauda). Featuring elegant packaging and superb moisturizing properties, it\u0027s a quintessential local beauty brand.", "name": "Guardian - Menara Dayabumi", "transport": "About a 5-minute walk from the old Kuala Lumpur Railway Station, or an 8-minute walk from Merdeka Square."}, {"address": "Kasturi Walk, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.1 stars | Must-Buy List: Pandan Soothing Herbal Roll-On Oil, Natural Lemongrass Insect Repellent Spray, Traditional Malay Turmeric Body Scrub. Situated along Kasturi Walk right next to Merdeka Square, these botanical stalls specialize in Malaysian handcrafted natural skincare and essential oil fragrances. Free from artificial fragrances, their products utilize local botanicals like pandan, lemongrass, and kaffir lime, offering an authentic tropical Southeast Asian aroma that tourists adore.", "name": "Kasturi Walk Botanical Beauty Stalls", "transport": "Take the MRT or LRT to Pasar Seni Station; the entrance to Kasturi Walk is right outside the station."}, {"address": "Lot M10, Mezzanine Floor, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buy List: Mangosteen Antioxidant Body Oil, Organic Goat\u0027s Milk \u0026 Honey Soap, Tropical Coffee Grounds Exfoliating Soap. Tucked away on the Mezzanine floor of Central Market, this independent shop focuses on artisanal beauty products made with organic local ingredients. The owner insists on using premium Malaysian mangosteen peel extract, virgin coconut oil, and local coffee grounds. Rich in antioxidants, the mangosteen body oil effectively brightens dull skin\u2014a unique and natural local skincare treasure.", "name": "Sesters Handmade Beauty - Central Market", "transport": "Walk about 6 minutes from Merdeka Square, enter Central Market, and head up to the Mezzanine Floor."}, {"address": "Annexe Gallery, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional Jamu Herbal Beauty Capsules, Cold-Pressed Virgin Coconut Hair Oil, Traditional Malay Boreh Turmeric Body Mask Powder. Located in the Central Market Annexe, this culturally rich herbal shop specializes in traditional Malay Jamu beauty and wellness remedies. Passing down centuries-old royal court beauty recipes, its virgin coconut hair oil and custom herbal body masks deeply exfoliate and illuminate skin tone\u2014perfect for experiencing authentic Malay herbal beauty care.", "name": "Tradisi Malay Herbal Beauty - Pasar Seni", "transport": "Take the MRT to Pasar Seni Station and walk for about 4 minutes to reach Central Market Annexe."}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "Ground Floor, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.7 stars | Must-Buys: Hand-printed silk scarves, modern-cut Batik shirts, and linen-cotton tote bags. This is a social enterprise fashion brand dedicated to empowering local Malaysian female artisans, seamlessly blending traditional hand-dyed batik techniques with contemporary fashion design. The store features elegant, one-of-a-kind items, making it a top choice for discerning travelers seeking sophisticated local style.", "name": "Batik Boutique (Central Market)", "transport": "Take the LRT Kelana Jaya Line to Pasar Seni Station, then walk about 3 minutes."}, {"address": "Lot G34, Ground Floor, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buys: Classic Series natural rubber flip-flops, Slim strap women\u0027s sandals, and Wide strap casual flip-flops. Fipper is Malaysia\u0027s iconic national footwear brand, famous for its signature elephant-trunk logo across the country. Made from 100% natural rubber, their footwear is super cushiony, non-slip, and durable. With dozens of eye-catching color combinations, it\u0027s an unbeatable value souvenir you can\u0027t miss when visiting KL.", "name": "Fipper Flip-Flops (Central Market)", "transport": "Take the LRT to Pasar Seni Station, then walk about 3 minutes to the ground floor of Central Market."}, {"address": "Complex Kota Raya, Jalan Tun Tan Cheng Lock, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-Buys: Pointed-toe comfortable flats, versatile woven straw totes, and vintage metal-buckle shoulder bags. Vincci is a trendsetting footwear and handbag brand under Malaysian fashion giant Padini, often regarded as Malaysia\u0027s accessible luxury go-to. Their designs stay ahead of international fashion trends at amazingly budget-friendly prices\u2014perfect for savvy shoppers and tourists. The footwear offers solid quality tailored specifically to Asian foot shapes.", "name": "Vincci Shoes \u0026 Bags (Kota Raya)", "transport": "About an 8-minute walk from Merdeka Square, or a 5-minute walk from Pasar Seni LRT Station."}, {"address": "Mezzanine Floor, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-Buys: Intricately embroidered Nyonya Kebaya tops, traditional handmade beaded shoes, and classic printed sarong skirts. Located inside Central Market, this specialty shop features authentic Straits Chinese (Baba Nyonya) attire traditional to Malacca and Penang. Each Kebaya top displays exquisitely detailed embroidery. Paired with beaded shoes and sarongs, it offers a stunning glimpse into Malaysia\u0027s unique multicultural heritage.", "name": "Nyonya Kebaya House (Central Market)", "transport": "Take the LRT to Pasar Seni Station, then walk about 3 minutes to the Mezzanine Floor of Central Market."}, {"address": "Lot G02, Ground Floor, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.8 stars | Must-Buys: Maharaja series printed short-sleeve shirts, modern-fit linen trousers, and handmade batik pattern pocket squares. Kapten Batik is a rapidly rising premium menswear and resort wear brand in Malaysia, famous for elevating traditional batik craftsmanship into stylish, modern resort shirts. Using organic cotton and natural dyes, their apparel is lightweight and highly breathable\u2014ideal for tropical climates.", "name": "Kapten Batik (Central Market)", "transport": "Take the LRT to Pasar Seni Station and walk about 3 minutes from the exit."}, {"address": "Lot Mezzanine, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-Buys: Personalized embroidered canvas totes, 3D pressure-relieving high heels, and elegant magnetic crossbody bags. Christy Ng is one of Malaysia\u0027s hottest designer footwear and bag brands, celebrated for supreme comfort and custom options. They offer on-the-spot name embroidery on canvas totes. With fantastic craftsmanship at reasonable prices, it\u0027s a must-buy fashion item for fashion-forward travelers visiting KL.", "name": "Christy Ng Shoes (Central Market)", "transport": "Take the LRT to Pasar Seni Station, then walk about 3 minutes."}, {"address": "27, Jalan Raja, Dataran Merdeka, 50050 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-Buys: KL landmark architecture printed T-shirts, wood-grain texture artistic canvas bags, and KL skyline print silk scarves. Located inside the KL City Gallery next to Merdeka Square, ARCH is renowned for its intricate woodcraft and architectural art. Their apparel and accessories transform KL\u0027s historic landmarks (like the Sultan Abdul Samad Building) into stylish graphic prints, producing artistic and culturally meaningful keepsakes.", "name": "ARCH Collection (KL City Gallery)", "transport": "Located inside Merdeka Square; take the LRT to Masjid Jamek Station and walk about 7 minutes."}, {"address": "Sogo KL, 190, Jalan Tuanku Abdul Rahman, 50050 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-Buys: Vintage Monogram handbags, premium cowhide short wallets, and Italian-style casual leather shoes. Bonia is a homegrown international luxury leather and accessories brand with over 40 years of heritage, acclaimed for its refined Italian craftsmanship and premium leather. Offering high-grade leather goods, shoes, and bags for men and women, it rivals European luxury brands in quality while remaining far more competitively priced.", "name": "Bonia Leather Goods (Sogo KL)", "transport": "Walk north for about 10 minutes from Merdeka Square, or take the LRT to Bandaraya Station with direct access."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "G03A, Ground Floor, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.6 stars | Must-buy list: Handcrafted wooden landmark photo frames of Kuala Lumpur, Petronas Twin Towers wooden keychains, 3D city skyline pop-up cards. Famous for its exquisite wood veneer carving craftsmanship, every piece here is assembled by hand by local artisans. The shop displays miniature wooden carvings of KL\u0027s historic buildings and modern skyscrapers. Highly valuable as art collectibles, these crafts serve as premier souvenirs capturing the historical memories of Merdeka Square and Kuala Lumpur.", "name": "ARCH Collection - Central Market", "transport": "Take the LRT Kelana Jaya Line to Pasar Seni Station, then walk about 3 minutes."}, {"address": "G-11, Ground Floor, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.4 stars | Must-buy list: Tiramisu milk chocolate, durian dark chocolate, mango-filled chocolate. Beryl\u0027s is Malaysia\u0027s most famous and iconic local chocolate brand, beloved by tourists. This outlet inside Central Market offers a wide array of flavors, especially special chocolate blends featuring Southeast Asian tropical fruits like durian, mango, and jackfruit. Rich, smooth, beautifully packaged, and affordably priced, it makes a fantastic gift for family and friends.", "name": "Beryl\u0027s Chocolate Outlet - Central Market", "transport": "Take the LRT Kelana Jaya Line to Pasar Seni Station, then walk about 3 minutes."}, {"address": "G-39, Ground Floor, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.5 stars | Must-buy list: Malaysian tropical herbal handmade soaps, cold-pressed virgin coconut oil, turmeric \u0026 mung bean body scrub. Tanamera is a top local Malaysian brand for pure natural herbal skincare, drawing from traditional Malay SPA wisdom and tropical botanical care. Using additive-free tropical plant ingredients, their herbal soaps emit a refreshing natural aroma that leaves the skin deeply moisturized\u2014a highly popular, refined souvenir among female tourists.", "name": "Tanamera Central Market", "transport": "Take the LRT Kelana Jaya Line to Pasar Seni Station and walk about 3 minutes into Central Market."}, {"address": "Jalan Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.1 stars | Must-buy list: Traditional Batik handkerchiefs, hand-woven rattan bags, Malaysian gula melaka (palm sugar) cookies. Located right next to Central Market, this open-air pedestrian market is marked by a distinctive giant traditional Malay kite (Wau) structure. It hosts numerous local vendors selling a rich variety of affordable traditional Malaysian handicrafts and local snacks, making it perfect for budget-friendly souvenir hunting.", "name": "Kasturi Walk Souvenir Market", "transport": "Take the MRT Kajang Line or LRT to Pasar Seni Station; it is located right along the pedestrian walkway beside Central Market."}, {"address": "Department of Museums Malaysia, Jalan Damansara, 50566 Kuala Lumpur", "feature": "\u2b50 4.2 stars | Must-buy list: Intricate Wayang Kulit (shadow puppet) bookmarks, indigenous wooden carvings, historical map motif canvas bags. Rich in cultural depth, this gift shop is located next to Perdana Botanical Garden inside the National Museum. It sells cultural and creative goods themed around Malaysian history, indigenous crafts, and traditional shadow puppetry. High-quality and filled with unique cultural stories, it\u0027s a great place to find meaningful, non-mainstream souvenirs.", "name": "National Museum Gift Shop", "transport": "Take the MRT Kajang Line to Muzium Negara Station; directly connected to the museum entrance via an underground pedestrian tunnel."}, {"address": "Jalan Kebun Bunga, Tasik Perdana, 50480 Kuala Lumpur", "feature": "\u2b50 4.0 stars | Must-buy list: Tropical orchid natural essential oils, hand-painted botanical mugs, tropical flower fragrance mists. Located at the heart of KL\u0027s green lung, Perdana Botanical Garden, this gift shop focuses on nature- and plant-themed souvenirs. The tropical floral scents and essential oils are extracted from local plants, offering a refreshing fragrance that lets you take home sweet memories of KL\u0027s beautiful garden city.", "name": "Perdana Botanical Garden Gift Shop", "transport": "Walk about 15 minutes from the Old Kuala Lumpur Railway Station into the garden, or take a taxi directly to the Botanical Garden Visitor Centre."}, {"address": "G-01, Ground Floor, Central Market, Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur", "feature": "\u2b50 4.7 stars | Must-buy list: Mini pewter Petronas Twin Towers models, pewter tea caddies with traditional Malay kite (Wau) motifs, delicate pewter alloy bookmarks. Royal Selangor is Malaysia\u0027s world-renowned national treasure pewter brand. Located near Merdeka Square inside Central Market, this store offers elegant pewter crafts ranging from intricately carved tea sets to miniature iconic landmarks\u2014making it a premier choice for gifts to respected elders or high-end business clients.", "name": "Royal Selangor Outlet - Central Market", "transport": "Take the LRT Kelana Jaya Line to Pasar Seni Station, then walk about 3 minutes."}, {"address": "M15, Mezzanine Floor, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.3 stars | Must-buy list: Authentic Bak Kut Teh herbal spice packs, traditional Malaysian curry powder packs, embroidered table runners. Located in the historic district, this unique shop brings together multi-ethnic Malaysian spices and handicrafts. It sells pre-mixed traditional Bak Kut Teh spices and Nanyang-style curry packs with rich, authentic flavors, allowing travelers to easily recreate local Malaysian dishes at home\u2014a favorite among foodies.", "name": "Anekant Handicraft \u0026 Spices - Central Market", "transport": "Take the LRT Kelana Jaya Line to Pasar Seni Station, walk about 3 minutes, and head up to the Mezzanine Floor inside Central Market."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "190, Jalan Tuanku Abdul Rahman, 50100 Kuala Lumpur", "feature": "\u2b50 4.4 Stars | Must-Buy: Local Malaysian Padini fashion, Bonia fine leather goods, traditional Batik printed shirts. Located just east of Merdeka Square, SOGO is one of Kuala Lumpur\u0027s most beloved classic department stores among locals. Bargain sales are frequently held on weekends and holidays, featuring a wide array of homegrown Malaysian designer brands and international labels. The supermarket and food court inside offer a rich selection of traditional Malaysian snacks, making it the perfect spot to experience daily local shopping in KL.", "name": "SOGO Kuala Lumpur (KL SOGO)", "transport": "Take the LRT to Sultan Ismail Station, or the LRT/Monorail to Bandaraya Station, then walk about 3 minutes."}, {"address": "No. 138, Jalan Tuanku Abdul Rahman, 50100 Kuala Lumpur", "feature": "\u2b50 4.1 Stars | Must-Buy: American casual polo shirts, affordable jeans, printed cotton T-shirts. F.O.S is a famous Malaysian budget factory outlet brand, with a large flagship store located on Jalan TAR near Merdeka Square. The store specializes in export overruns and past-season discounted apparel from major international casual brands at highly competitive prices. Spacious with transparent pricing, it is ideal for budget-conscious travelers looking for high-quality clothing treasure hunts.", "name": "F.O.S Outlet Store (Factory Outlet Store - Jalan TAR)", "transport": "Walk about 8 minutes from Merdeka Square, or take the LRT to Masjid Jamek Station and walk about 5 minutes."}, {"address": "Persiaran Komersial KLIA, 64000 Sepang, Selangor", "feature": "\u2b50 4.3 Stars | Must-Buy: Discounted Nike sneakers, Bally luxury leather goods, classic Coach bags. As the top recommended premium outlet mall near Kuala Lumpur, this shopping center houses hundreds of internationally renowned brands and outlet stores, offering year-round discounts from 30% to 70% off. Bright and spacious, it provides luggage storage and free shuttle services, making it perfect for an efficient shopping spree before heading to downtown KL or catching a flight.", "name": "Mitsui Outlet Park KLIA Sepang", "transport": "Take the KLIA Transit train from KL Sentral to the airport and transfer to the free shuttle bus, or hire a direct ride via e-hailing/taxi."}, {"address": "27, Jalan Raja, Dataran Merdeka, 50050 Kuala Lumpur", "feature": "\u2b50 4.5 Stars | Must-Buy: Intricate handcrafted wooden Petronas Twin Towers models, 3D architectural wooden bookmarks, KL landmark emblem mugs. Housed in a historic building right next to Merdeka Square, this iconically local cultural creative flagship store belongs to ARCH, Malaysia\u0027s premier local woodcraft creative brand. All products are crafted using precise laser cutting and hand assembly, beautifully showcasing KL\u0027s landmarks and heritage\u2014making it the top destination for exquisite, keepsake-worthy souvenirs.", "name": "ARCH Collection at KL City Gallery", "transport": "Located within Merdeka Square. Take the LRT to Masjid Jamek Station and walk about 5 minutes."}, {"address": "Lot 3.04-3.06, Central Market Annexe, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.4 Stars | Must-Buy: Handmade Malaysian Batik fabrics, woven rattan bags, Indian-style painted ceramics. Just steps away from Merdeka Square, Central Market, originally built as a wet market in 1888, has evolved into KL\u0027s premier center for local handicrafts and culture. It houses hundreds of independent artisan shops representing Malaysia\u0027s diverse ethnic groups, unique painting studios, and traditional clothing boutiques, offering authentic Malaysian handicrafts at affordable prices.", "name": "Central Market (Pasar Seni)", "transport": "Take the LRT or MRT to Pasar Seni Station, exit and walk about 2 minutes."}, {"address": "G23, Ground Floor, Central Market, Jalan Hang Kasturi, 50050 Kuala Lumpur", "feature": "\u2b50 4.6 Stars | Must-Buy: Tropical herbal body massage oils, natural black rice scrub soap, turmeric ginger root herbal foot soak. Tanamera is Malaysia\u0027s flagship luxury aromatherapy and natural skincare brand, formulated with tropical rainforest plants and traditional Malay spa treatments. Located inside Central Market, this store offers a full range of skincare, handmade soaps, and essential oils with pure ingredients and elegant packaging, making it a must-buy Malaysian herbal gift.", "name": "Tanamera Tropical Spa - Central Market Branch", "transport": "Take the LRT to Pasar Seni Station; enter the Ground Floor of Central Market to find the shop."}, {"address": "113, Jalan Tuanku Abdul Rahman, 50100 Kuala Lumpur", "feature": "\u2b50 4.2 Stars | Must-Buy: Traditional Malay attire (Baju Kurung), premium silk fabrics, traditional Songkok hats. Kamdar is a household name in Malaysia for textiles and apparel. Its multi-story flagship store on Jalan TAR is the heart of Kuala Lumpur\u0027s traditional fabric culture. Featuring a vast selection of printed Malay batik, dressmaking fabrics, and ready-to-wear traditional clothing at wallet-friendly prices, it is beloved by locals and travelers seeking authentic local attire.", "name": "Kamdar Department Store - Jalan TAR", "transport": "Walk about 7 minutes from Merdeka Square, or take the LRT to Masjid Jamek Station and walk about 4 minutes."}, {"address": "CapSquare, Persiaran CapSquare, Jalan Munshi Abdullah, 50010 Kuala Lumpur", "feature": "\u2b50 4.3 Stars | Must-Buy: BOH classic tropical black tea, curry spice mixes, local Malaysian nut spreads. Located at CapSquare northeast of Merdeka Square, LuLu is a comprehensive shopping haven combining a department store and an international hypermarket. The department store level offers affordable apparel and homeware, while the hypermarket floor is famous for its extensive selection of Southeast and South Asian specialties. Affordable and packed with variety, it\u0027s an excellent spot for locals and tourists to stock up on Malaysian edible souvenirs.", "name": "LuLu Hypermarket \u0026 Department Store CapSquare", "transport": "Take the LRT to Dang Wangi Station or the Monorail to Bukit Nanas Station, then walk about 8 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Merdeka Square and Lake Gardens District"}, "putrajaya": {"categories": {"cat_1": {"items": [{"address": "AT-K02, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Sepang, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: Argan Wonder Cushion, Matte Lip Cream, Argan Wonder Serum. Founded by Malaysia\u0027s national pop icon Siti Nurhaliza, this premier local Halal-certified cosmetics brand combines modern technology with natural botanical ingredients. Specially formulated for Asian skin tones and tropical climates, its cushion foundation contains argan oil for exceptional hydration and coverage, while the matte lip cream offers rich, long-lasting pigment\u2014making it a perfect Malaysian souvenir.", "name": "SimplySiti Counter (SimplySiti IOI City Mall)", "transport": "Take a Grab taxi directly to IOI City Mall."}, {"address": "G23, Ground Floor, Alamanda Shopping Centre, Jalan Alamanda, Presint 1, 62000 Putrajaya, Malaysia", "feature": "\u2b50 4.3 stars | Must-buy list: Durian Lip Balm, Waterproof Eyeliner, Nutritive Nail Polish. A well-known local Malaysian makeup brand celebrated for its great value and bold, innovative products. The most talk-about item among tourists is the unique Durian Lip Balm, infused with nourishing oils and a rich tropical fruit aroma. Their ultra-fine eyeliner is sweat- and oil-resistant, making it ideal for Southeast Asia\u0027s warm climate.", "name": "Elianto Make Up Store (Elianto Make Up Alamanda Shopping Centre)", "transport": "Take Putrajaya local bus T509 and get off at Alamanda Shopping Centre."}, {"address": "Inside Watsons/Guardian, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.6 stars | Must-buy list: Radiant \u0026 Renewing Shower Cream, Anti-Dandruff Shampoo, Organic Black Seed Oil Day Cream. An original Malaysian organic Halal beauty brand whose entire line is enriched with Organic Habbatus Sauda Oil (Black Seed Oil), known as the \u0027seed of blessing\u0027. Featuring colorful floral packaging, the brand is paraben-free and cruelty-free with lightweight, refreshing formulas\u2014an iconic green beauty brand you shouldn\u0027t miss when visiting Putrajaya.", "name": "Good Virtues Co. Counter (Good Virtues Co. Putrajaya)", "transport": "Take a Grab taxi to the beauty area inside IOI City Mall."}, {"address": "Presint 1, Alamanda Shopping Centre, 62000 Putrajaya, Malaysia", "feature": "\u2b50 4.4 stars | Must-buy list: Safi Rania Gold Youth Gold Essence, Safi Balqis OxyWhite Cleanser, Anti-Acne Cream. Safi is an iconic homegrown Halal skincare brand tailored specifically for women living in tropical climates. Its popular 24K Gold anti-aging line contains nano gold particles and silk protein, delivering luxurious moisturizing and anti-aging benefits at an affordable price, hugely favored by local women and tourists alike.", "name": "Safi Cosmetics Counter (Safi Cosmetics Alamanda)", "transport": "Take bus T509 or a Grab taxi to Alamanda Shopping Centre."}, {"address": "Lot L1-12, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.2 stars | Must-buy list: No-Sebum Powder, Persist Gel Eyeliner, Moisture Boost Lipcolor. Silkygirl is a popular budget makeup brand designed for young Southeast Asian women. Known for its effective oil control and long-lasting waterproof capabilities, it keeps makeup looking flawless even in humid weather. Extremely affordable, its powders and lipsticks are high-value beauty staples.", "name": "Silkygirl Makeup Counter (Silkygirl IOI City Mall)", "transport": "Take a taxi from Putrajaya Sentral; it takes about 10 minutes to arrive."}, {"address": "LG-31, Lower Ground Floor, IOI City Mall, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: Hurix\u0027s Myristica Balm, Tiger Balm Mosquito Patch, Tradisi Minyak Serai (Lemongrass Oil). As one of Malaysia\u0027s leading pharmacy chains, CARiNG is a premier spot for traditional local drugstore finds and herbal healthcare products. It stocks various topical balms and mosquito-repellent oils formulated with Malay and Ayurvedic herbs, making it the best place to pick up authentic health and wellness gifts.", "name": "CARiNG Pharmacy (CARiNG Pharmacy IOI City Mall)", "transport": "Take a Grab taxi directly to the Lower Ground (LG) entrance of IOI City Mall."}, {"address": "Presint 15, Diplomatik Diplomatic Enclave, 62050 Putrajaya, Malaysia", "feature": "\u2b50 4.7 stars | Must-buy list: Hydro Hydrating Mask, Green Tea Facial Scrub, Clear Skin Serum. HerbaLine is a homegrown premium herbal skincare brand guided by a philosophy of \u0027transparent pricing and burden-free skincare\u0027. The store offers signature natural botanical products, emphasizing soothing serums and hydrating masks suitable for sensitive skin. Gentle ingredients and elegant packaging make it a highly recommended skincare brand among locals.", "name": "HerbaLine Wellness Spa (HerbaLine Wellness Spa Putrajaya)", "transport": "Take a Grab taxi to the Presint 15 commercial district."}, {"address": "G-50, Ground Floor, Alamanda Shopping Centre, Jalan Alamanda, Presint 1, 62000 Putrajaya, Malaysia", "feature": "\u2b50 4.4 stars | Must-buy list: Aiken Tea Tree Oil Gel, BadLab Facial Cleanser, Nutox Bird\u0027s Nest Essence. Located inside Alamanda Shopping Centre, this flagship store houses a wide array of exclusive local Malaysian beauty brands. Highlights include Nutox, an anti-aging line infused with high-grade local bird\u0027s nest extract, and BadLab, a trendy local brand for men\u0027s grooming\u2014making it a convenient one-stop shop for unique local skincare items.", "name": "Watsons Flagship Store (Watsons Alamanda Putrajaya)", "transport": "Take bus T509 directly to Alamanda Shopping Centre."}], "name": "Iconic Local Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "Lot L1-18, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.6 stars | Must-buy list: Personalized embroidered canvas totes, stylish high heels, vintage shoulder bags. A highly representative local Malaysian women\u0027s shoe and bag brand, famous for its high cost-performance ratio and trendy designs. Their canvas bags, featuring on-site personalized name embroidery, are immensely popular souvenirs sought after by international tourists visiting Malaysia.", "name": "Christy Ng Shoes \u0026 Handbags (Christy Ng Shoes - IOI City Mall)", "transport": "About a 10-minute Grab taxi ride from the Pink Mosque to IOI City Mall."}, {"address": "Lot G-34, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: Monogram leather handbags, premium cowhide bifold wallets, business leather backpacks. Founded in 1974, this premier Malaysian luxury leather brand combines Italian craftsmanship with local fashion needs. Offering superior leather quality at prices much more accessible than top international luxury brands, it\u0027s perfect for picking up high-quality leather accessories.", "name": "Bonia Luxury Leather Goods (Bonia - IOI City Mall)", "transport": "About a 10-minute Grab taxi ride from the Pink Mosque."}, {"address": "Lot F-K8, First Floor, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.7 stars | Must-buy list: Classic elephant logo flip-flops, dual-tone platform sandals, non-slip casual slides. Malaysia\u0027s globally popular home-grown footwear brand, crafted from 100% natural rubber. They offer exceptional cushioning, comfort, durability, and anti-slip performance. With colorful color-blocked designs and incredibly affordable prices, it\u0027s a top favorite where locals and tourists love buying multiple colors.", "name": "Fipper Natural Rubber Footwear (Fipper - IOI City Mall)", "transport": "About a 10-minute Grab taxi ride from the Pink Mosque."}, {"address": "Ground Floor, Alamanda Shopping Centre, Jalan Alamanda, Precinct 1, 62000 Putrajaya, Malaysia", "feature": "\u2b50 4.3 stars | Must-buy list: Affordable trendy women\u0027s sandals, metal-buckle handbags, fashionable sunglasses and accessories. A famous women\u0027s shoes and bags brand under Malaysian retail giant Padini. Focusing on affordable, trend-forward footwear and accessories, its large boutique in Alamanda Putrajaya Shopping Centre boasts budget-friendly prices and rapid inventory updates.", "name": "Vincci Fashion Shoes \u0026 Bags (Vincci - Alamanda Putrajaya)", "transport": "About a 6-minute Grab taxi ride from the Pink Mosque to Alamanda Shopping Centre."}, {"address": "Lot L1-52, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.4 stars | Must-buy list: Cartoon collaboration printed handbags, classic monogram long wallets, comfortable platform sneakers. A beloved local boutique brand hugely popular among young Malaysian women and office workers. Renowned for vibrant colors, youthful printed patterns, and fine leather goods, it offers great quality alongside frequent, high-value discount promotions.", "name": "Carlo Rino Fashion Bags \u0026 Shoes (Carlo Rino - IOI City Mall)", "transport": "About a 10-minute Grab taxi ride from the Pink Mosque."}, {"address": "Lot L1-228, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.8 stars | Must-buy list: Embroidered silk hijabs, elegant modest maxi dresses, printed silk scarves. Founded by famous Malaysian celebrity Neelofa, this premier modest fashion brand seamlessly blends traditional Islamic attire with contemporary fashion cuts. Exquisite patterns and high-quality fabrics attract countless visitors to shop and experience the brand.", "name": "Naelofar Modest Fashion \u0026 Hijab (Naelofar - IOI City Mall)", "transport": "About a 10-minute Grab taxi ride from the Pink Mosque."}, {"address": "Lot G-58 \u0026 59, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: Seed men\u0027s casual shirts, Padini Authentics trendy T-shirts, PDI comfortable casual pants. Malaysia\u0027s most successful home-grown fashion brand, bringing together sub-brands like Seed, PDI, and Padini Authentics. Offering high value-for-money menswear and womenswear ranging from business to casual styles, this large store provides a fantastic shopping experience.", "name": "Padini Concept Store (Padini Concept Store - IOI City Mall)", "transport": "About a 10-minute Grab taxi ride from the Pink Mosque."}, {"address": "Lot L1-09, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.7 stars | Must-buy list: Premium printed satin scarves, stylish canvas tote bags, collaboration makeup pouches. Founded by Malaysian fashion icon Vivy Yusof, this luxury lifestyle and modest fashion brand is famed for its iconic purple packaging and beautifully designed, high-quality printed accessories. It stands as a flagship store representing modern Malaysian fashion culture.", "name": "The dUCk Store Luxury Lifestyle \u0026 Modest Fashion (The dUCk Store - IOI City Mall)", "transport": "About a 10-minute Grab taxi ride from the Pink Mosque."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "Jalan Perdana, Presint 1, 62000 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade Pink Mosque models, Malaysian batik silk scarves, traditional palm sugar dodol. Located directly underneath the Pink Mosque, Souq Putrajaya is an Arabian-style underground bazaar and the premier spot for visitors to pick up unique souvenirs after touring the mosque. The market gathers numerous local Malay handicraft stalls where you can buy carved ornaments featuring the iconic Pink Mosque pattern and sample freshly made traditional Dodol\u2014a rich, chewy palm sugar confection bursting with local flavor.", "name": "Souq Putrajaya Souvenir Stalls", "transport": "Take the Putrajaya MRT line to Putrajaya Sentral Station, then transfer to a feeder bus or a Grab ride for about 8 minutes to reach the basement level of the Pink Mosque."}, {"address": "LG-28, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.6 stars | Must-Buy List: Tiramisu stuffed chocolates, Musang King durian chocolates, freeze-dried strawberry dark chocolate. Beryl\u0027s is Malaysia\u0027s most iconic home-grown chocolate brand, crafted from carefully selected cocoa beans. The counter at IOI City Mall offers an impressive selection of gift boxes. Their famous durian chocolate is made with real Musang King flesh\u2014sweet, creamy, and non-greasy, elegantly packaged and ideal for bringing home to family and friends.", "name": "Beryl\u0027s Chocolate Store IOI City Mall", "transport": "Take the Putrajaya MRT to UPM Station or Putrajaya Sentral Station, then take a Grab ride for about 10 minutes to reach IOI City Mall."}, {"address": "G-K08, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buy List: Pandan Kaya jam, Kuih Lapis (nine-layer cake), pandan pastries. Nyonya Colors is a beloved local brand specializing in traditional Peranakan/Nyonya pastries crafted from century-old recipes. Their signature Pandan Kaya jam is slow-cooked using fresh pandan leaves and coconut cream, resulting in a rich, fragrant spread perfect for toast. Additionally, their individually sealed Nyonya pastry boxes make fantastic takeaway gifts.", "name": "Nyonya Colors IOI City Mall", "transport": "Take a Grab ride for about 10 minutes from the Pink Mosque to arrive at the ground floor of IOI City Mall."}, {"address": "Persiaran Pandan, Presint 9, 62250 Putrajaya, Wilayah Persekutuan Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-painted Batik art, woven Mengkuang bags, traditional hand-woven Songket fabric. Operated by Kraftangan Malaysia (Malaysian Handicraft Development Corporation), this official comple
