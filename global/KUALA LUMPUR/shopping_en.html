x promotes national heritage crafts. Here, you can purchase authentic hand-painted batik fabrics and artwork directly crafted by local artisans. Offering high quality at fair prices, it is a treasure trove for lovers of cultural craft items.", "name": "Kompleks Kraf Putrajaya (Putrajaya Craft Complex)", "transport": "Take the Putrajaya MRT to Putrajaya Sentral Station, then walk or take a Grab ride for about 5 minutes."}, {"address": "Souq Putrajaya, Basement Presint 1, 62000 Putrajaya, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy List: Premium dates, mixed nut honey, Malaysian spice mix packets. Reflecting Putrajaya\u0027s rich Islamic cultural heritage, Gurun Emas inside the Souq market specializes in imported Middle Eastern and local Malaysian dried fruits and spices. Their premium dates are particularly recommended\u2014soft, naturally sweet, and rich in nutrients\u2014making them a great wellness souvenir and cultural takeaway.", "name": "Gurun Emas Souq Putrajaya", "transport": "Located inside the Souq bazaar directly beneath the Pink Mosque; walk down the stairs from the main mosque courtyard."}, {"address": "G-38, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.8 stars | Must-Buy List: Pewter tea caddies, Malaysian landmark relief mugs, mosque pewter commemorative plates. Founded in 1885, Royal Selangor is the world\u0027s largest pewter brand and Malaysia\u0027s premier luxury handicraft name. Their air-tight pewter containers are ideal for preserving tea leaves. The boutique offers exquisite pewter art depicting Malaysian landmarks, making these items cherished collector\u0027s souvenirs.", "name": "Royal Selangor Pewter IOI City Mall", "transport": "Take a Grab ride for about 10 minutes from Putrajaya\u0027s administrative center to reach the ground floor of IOI City Mall."}, {"address": "LG-35, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy List: OldTown Hazelnut White Coffee, Penang White Curry instant noodles, A1 Bak Kut Teh spice packs. This premium supermarket features a dedicated \u0027Malaysian Delights\u0027 section stocked with Malaysia\u0027s most popular snacks and instant beverages. From world-famous white coffee and aromatic Bak Kut Teh soup packs to classic prawn crackers, you can conveniently grab all your local food souvenirs here at reasonable prices.", "name": "Village Grocer IOI City Mall (Malaysian Delights Section)", "transport": "Take the Putrajaya MRT to UPM Station, then take a Grab ride for 10 minutes to reach LG level of IOI City Mall."}, {"address": "LG-K205, IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy List: Freeze-dried Musang King durian, durian wafer rolls, durian soft candies. A specialty shop inside IOI City Mall dedicated to processed durian treats, catered to fans of Malaysia\u0027s \u0027King of Fruits\u0027\u2014Musang King. Utilizing advanced freeze-drying technology, these products retain the rich aroma and nutrients of real durian. Vacuum-sealed and flight-friendly, they are a must-buy snack souvenir when visiting Putrajaya and Kuala Lumpur.", "name": "Durian Cottage IOI City Mall", "transport": "Located in the LG level food court area of IOI City Mall; reachable via a 10-minute Grab ride from central Putrajaya."}], "name": "Must-Buy Specialties, Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Persiaran Komersial, KLIA, 64000 Sepang, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic discounted Nike running shoes, Bally luxury leather handbags, Timberland outdoor waterproof boots. Just a short drive from Putrajaya, Mitsui Outlet Park is the premier shopping haven around Kuala Lumpur, bringing together numerous international and local brands with discounts often up to 70% off. The spacious, light-filled mall offers free luggage storage and shuttle bus services, making it perfect for tourists to enjoy a half-day shopping spree before or after visiting the Pink Mosque.", "name": "Mitsui Outlet Park KLIA Sepang", "transport": "Take a Grab ride from Putrajaya Pink Mosque for about 20 minutes."}, {"address": "IOI City Mall, Lebuh IRC, IOI Resort City, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.6 stars | Must-Buy List: Vincci trendy sandals, Fipper natural rubber flip-flops, Bata casual shoes. As one of the largest shopping malls in Malaysia, IOI City Mall is located right next to Putrajaya. It features an Olympic-sized ice-skating rink, an indoor theme park, and hundreds of retail outlets. Packed with homegrown Malaysian brands and international fashion, it\u2019s the top choice for locals and tourists alike to shop for daily necessities and stylish apparel.", "name": "IOI City Mall Putrajaya", "transport": "About a 10-minute Grab ride from Putrajaya Pink Mosque."}, {"address": "Jalan Alamanda, Precinct 1, 62000 Putrajaya, Malaysia", "feature": "\u2b50 4.1 stars | Must-Buy List: Padini casual t-shirts, Guardian local sunscreen lotion, The Body Shop botanical hand creams. Alamanda is Putrajaya\u0027s classic and long-standing flagship shopping mall, located just a few minutes\u0027 drive from the Pink Mosque. It boasts lush outdoor gardens and fountains, creating a peaceful and comfortable ambiance. Beyond chain hypermarkets and a cinema, it houses numerous local fashion boutiques and specialty restaurants\u2014ideal for travelers looking to shop casually away from the crowds.", "name": "Alamanda Shopping Centre", "transport": "Take Bus 502 from the Pink Mosque to Alamanda stop, or take a Grab ride for about 5 minutes."}, {"address": "G-41, Ground Floor, IOI City Mall, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy List: Padini men\u0027s slim-fit shirts, Seed minimal graphic tees, PDI tailored wide-leg trousers. Padini is Malaysia\u0027s iconic home-grown fast-fashion giant, renowned for exceptional value for money and tailored fits. The store consolidates multiple sub-brands, offering everything from formal business wear and trendy casual outfits to children\u0027s clothing. Locals highly recommend shopping here for light, breathable garments perfectly suited for Southeast Asian climate or everyday wear.", "name": "Padini Concept Store @ IOI City Mall", "transport": "Located on the Ground Floor of IOI City Mall."}, {"address": "G-23, Ground Floor, Alamanda Shopping Centre, 62000 Putrajaya, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy List: Vincci woven sandals, elegant pointed-toe flats, compact crossbody bags with metal buckles. Vincci, a flagship footwear brand under the Padini Group, enjoys a stellar reputation across Southeast Asia. Its designs keep up with global fashion trends at highly affordable prices, featuring cushioned, soft insoles ideal for long walks. It\u0027s a must-visit footwear store where countless female tourists shop for shoes in every color.", "name": "Vincci @ Alamanda Shopping Centre", "transport": "Located on the Ground Floor of Alamanda Shopping Centre."}, {"address": "L2-18, Level 2, IOI City Mall, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy List: Fipper classic two-tone flip-flops, wide non-slip slides, Slim series women\u0027s flip-flops. Fipper is a globally popular Malaysian brand renowned for its flip-flops made from 100% natural Thai rubber, non-toxic, highly durable, and slip-resistant. Featuring an adorable elephant logo and vibrant color combos at budget-friendly prices, it is a top pick for souvenirs or water activities during a trip to Putrajaya.", "name": "Fipper @ IOI City Mall", "transport": "Located on Level 2 of IOI City Mall."}, {"address": "G-12, Ground Floor, IOI City Mall, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buy List: Bonia classic monogram tote bags, Italian leather men\u0027s bi-fold wallets, vintage shoulder bags. Founded in 1974, Bonia is Malaysia\u0027s premier luxury leather brand, inheriting fine Italian leather craftsmanship and design aesthetics. Renowned for premium leather texture and durability, its products offer accessible luxury compared to Western high-end fashion houses. Loved by Malaysian middle-class professionals, its elegant monogram leather bags are well worth buying.", "name": "Bonia @ IOI City Mall", "transport": "Located in the Luxury Zone on the Ground Floor of IOI City Mall."}, {"address": "L1-35, Level 1, IOI City Mall, 62502 Putrajaya, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy List: Nose block-heel mules, stylish vintage mini square bags, comfy suede flats. Nose is a trendy local footwear and accessory brand highly favored by young Malaysian women, specializing in fashionable shoes tailored for Asian foot shapes. Combining modern chic style with supreme comfort, its lineup ranges from daily workwear shoes to party heels. Offering budget-friendly prices and frequent sales, it\u2019s a paradise for fashion seekers.", "name": "Nose @ IOI City Mall", "transport": "Located on Level 1 of IOI City Mall."}], "name": "Shopping Malls \u0026 Recommended Outlets"}}, "name": "Putrajaya Pink Mosque Area"}, "sunway_city": {"categories": {"cat_1": {"items": [{"address": "LG1.63, Lower Ground One, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy List: Durian Flavored Lip Balm, Radiant Long-Wear Cushion Foundation, Rainbow 9-Color Eyeshadow Palette. Elianto is a highly iconic homegrown cosmetics brand in Malaysia, focusing on affordable makeup tailored specifically for Southeast Asian skin tones and tropical climates. The counter at Sunway Pyramid offers a full selection of products. Among the most talked-about are their Malaysian-themed durian lip care products and long-lasting, oil-control tropical base makeup. With lightweight, non-sticky textures perfect for summer makeup, budget-friendly prices, and exquisite packaging, it makes an excellent local souvenir when visiting Sunway City.", "name": "Elianto Make Up - Sunway Pyramid", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, then walk about 3 minutes to enter LG1 of Sunway Pyramid."}, {"address": "LG2.72, Lower Ground Two, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.7 stars | Must-Buy List: Green Coffee Anti-Cellulite Body Contour Cream, Cold-Pressed Extra Virgin Coconut Oil, Black Rice Tropical Scrub Soap. Tanamera is a top local Malaysian botanical aromatherapy and spa brand. Its name means \u0027Red Earth\u0027 in Malay, symbolizing the pure power of nature. The brand carefully selects natural herbs and botanical extracts from Malaysian tropical rainforests, emphasizing zero added chemicals. The Sunway specialty store offers various body care items, spa massage oils, and traditional tropical herbal compresses. Their body scrubs and pure essential oils are deeply loved by international tourists, making them ideal for an at-home spa experience back home.", "name": "Tanamera Tropical Spa - Sunway Pyramid", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, then walk directly into LG2 of Sunway Pyramid."}, {"address": "LG2.61, Lower Ground Two, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buy List: Safi 24K Gold Youth Essence, Cosmoderm Tea Tree Oil Acne Control Gel, Dashing Men\u0027s Oil Control Cleansing Facial Foam. Guardian is a leading health and beauty chain in Malaysia with a huge market share. The Sunway Pyramid branch is fully stocked, making it a hotspot for discovering local Malaysian skincare and cosmetics. Here, you can easily find Safi, a super popular Halal-certified brand, and Cosmoderm, known for its natural tea tree formulations. From deeply hydrating creams to unique local herbal shampoos, everything offers high value for money, making it the top destination to experience Malaysian drugstore culture.", "name": "Guardian - Sunway Pyramid", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station; the station directly connects to LG2 of Sunway Pyramid."}, {"address": "LG2.73 \u0026 LG2.75, Lower Ground Two, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy List: Silkygirl Matte Junkie Lip Cream, SimplySiti Precious Matte Anti-Aging Night Cream, Wardah Colorfit Velvet Matte Powder. The Watsons flagship concept store in Sunway Pyramid is massive. Besides international brands, its biggest draw for tourists is a dedicated section for Southeast Asian local beauty brands. Silkygirl, Malaysia\u0027s affordable national makeup brand, and SimplySiti, founded by a famous Malaysian pop icon, both have large displays here. The store frequently runs buy-1-free-1 deals and exclusive discounts, making it an unmissable spot for tourists looking to stock up on Malaysian drugstore cosmetics and skincare.", "name": "Watsons - Sunway Pyramid", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, then walk into LG2 of Sunway Pyramid."}, {"address": "LG2.08, Lower Ground Two, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy List: Aiken Tea Tree Oil Facial Cleanser, Bio-Essence Bird\u0027s Nest PeptLift Softener, Badger Herbal Balm. CARiNG Pharmacy is one of Malaysia\u0027s largest homegrown professional pharmacy chains, and its Sunway Pyramid branch features on-duty licensed pharmacists. Beyond health supplements and medications, it houses a wide selection of local skincare brands tailored for Southeast Asia\u0027s hot and humid climate. The Aiken series, known for soothing sensitive and acne-prone skin, is highly effective, very affordable, and a favorite among locals and students.", "name": "CARiNG Pharmacy - Sunway Pyramid", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, then walk about 3 minutes to LG2 of the mall."}, {"address": "No. 12, Jalan PJS 8/18, Dataran Mentari, Bandar Sunway, 46150 Petaling Jaya, Selangor, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy List: Malaysian Botanical Deep Exfoliating Gel, Argan Oil Hair Repair Mask, Essential Oil Body Moisturizing Lotion. Magicboo is a renowned Malaysian one-stop beauty wholesale and retail chain, located just a few minutes\u0027 drive from Sunway Pyramid. The store specializes in locally manufactured and exclusively imported scalp care, salon-grade hair products, and body spa care items. Offering bulk sizes at significantly lower prices than department stores, it is a hidden gem for local Malaysian beauty salons and beauty insiders looking to stock up.", "name": "Magicboo Beauty - Sunway Mentari", "transport": "Take a Grab ride for about 5 minutes from Sunway Pyramid Shopping Mall."}, {"address": "LG1.21, Lower Ground One, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy List: Cyber Colors Flawless Oil-Control Loose Powder, Sasatinnie Hyaluronic Acid Intensive Moisturizing Mask, Collistar Body Slimming Serum. Located inside Sunway Pyramid, Sa Sa brings together trending beauty and fragrance brands from all over Asia. The store is brightly lit with a wide array of testers, and friendly staff offer personalized makeup and skincare advice suited to the local climate. Exclusive value sets designed for the Malaysian market are often available. Whether you need sunscreen, oil-control makeup, or hydrating masks, it perfectly caters to visitors seeking post-sun repair and hydration after spending a day at Sunway Lagoon.", "name": "Sa Sa - Sunway Pyramid", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, then walk into LG1 of Sunway Pyramid."}, {"address": "G1.130, Ground Floor, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.6 stars | Must-Buy List: Fenty Beauty Pro Filt\u0027r Soft Matte Longwear Foundation, Supergoop! Unseen Sunscreen, Rare Beauty Soft Pinch Liquid Blush. Located near the iconic giant lion head entrance of Sunway Pyramid, Sephora is Sunway City\u0027s premier beauty destination. The store is spacious and bright, featuring top international cosmetics alongside sweat-resistant beauty and sunscreen products perfect for tropical weather. Free makeup consultations and trials are available, with highly professional staff, making it the ultimate spot to shop for stylish, high-performance sun-proof and sweat-proof products.", "name": "Sephora - Sunway Pyramid", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, then walk to the Ground Floor (G Floor) of Sunway Pyramid to find it."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "GF.28, Ground Floor, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Must-buy list: Vincci stylish flat sandals, Padini sleek business shirts, PDI casual V-neck T-shirts. Padini is Malaysia\u0027s most iconic local fashion retail giant. Its concept store at Sunway Pyramid brings together several of its signature brands, including Vincci, Seed, PDI, and Padini under one roof. Vincci\u2019s women\u0027s shoes and bags are particularly famous for their high value-for-money and trendy designs, making it a top choice for Southeast Asian travelers seeking affordable stylish footwear.", "name": "Padini Concept Store", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, and it\u0027s about a 3-minute walk to enter Sunway Pyramid Shopping Mall."}, {"address": "LG2.71, Lower Ground 2, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: Wide Series two-tone flip-flops, Slim Series textured women\u0027s sandals, Junior Series rainbow kids\u0027 flip-flops. Fipper is a globally popular local Malaysian rubber footwear brand known for using premium Malaysian natural rubber. The flip-flops are soft, durable, resilient, and non-slip. The Sunway Pyramid branch offers a full range of styles. Their vibrant color combinations exude tropical resort vibes, and the budget-friendly prices make them perfect souvenirs or gifts for friends and family.", "name": "Fipper Natural Rubber Flip-Flops", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, enter Sunway Pyramid Shopping Mall, and head to Lower Ground 2 (LG2)."}, {"address": "G1.78, Ground Floor, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.2 stars | Must-buy list: Classic Monogram print tote bag, color-block scratch-resistant leather bifold wallet, comfortable cushioned low heels. Carlo Rino is a well-known Malaysian fashion brand specializing in youthful, vibrant, and elegant women\u0027s bags and footwear. Its recognizable designs often feature lively geometric patterns and bold colors. The shoes are specially tailored for Asian foot shapes for maximum comfort. Combined with frequent attractive discounts, it is a very popular shopping spot in Sunway City.", "name": "Carlo Rino", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, and connect via the pedestrian skybridge directly to the Ground Floor of Sunway Pyramid."}, {"address": "G1.03, Ground Floor, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Must-buy list: Vintage Monogram geometric saddle bag, premium Italian cowhide men\u0027s wallet, elegant metal-buckle shoulder bag. Founded in 1974, Bonia is Malaysia\u0027s most iconic luxury leather brand, renowned for combining fine Italian craftsmanship with luxurious designs. The Sunway Pyramid flagship store showcases the latest collection of exquisite handbags, belts, and footwear. The quality rivals top international luxury brands at more accessible prices, making it a favorite among local business professionals and international tourists seeking high-end leather goods.", "name": "Bonia Leather Goods", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, and enter through the main Ground Floor entrance of Sunway Pyramid."}, {"address": "F1.73, First Floor, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.6 stars | Must-buy list: Personalized embroidered canvas tote bag, designer handmade high heels, Morandi-toned leather crossbody bag. Christy Ng is a legendary Malaysian designer brand that successfully transitioned from online store to brick-and-mortar success. The brand became famous for its high-quality, stylish handcrafted women\u0027s shoes and customizable name-printed canvas bags. The Sunway Pyramid store is bright and cozy, offering on-site custom bag personalization\u2014a favorite activity for tourists wishing to order a personalized bag as a memorable keepsake from Sunway City.", "name": "Christy Ng Shoes \u0026 Custom Bags", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, and enter the First Floor (F1) of Sunway Pyramid Shopping Mall."}, {"address": "G1.71, Ground Floor, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Must-buy list: Premium breathable linen resort trousers, finely embroidered printed cotton shirt, soft silk patterned shawl. BritishIndia is a premier Malaysian fashion brand created specifically for tropical climates, offering luxury apparel that balances elegance and comfort. The brand masterfully blends traditional Eastern craftsmanship with classic British vintage style, using pure natural linen, high-grade cotton, and silk fabrics. The Sunway Pyramid store exudes a charming colonial resort atmosphere, making it an ideal destination for high-end tropical resort wear and refined casual attire.", "name": "BritishIndia", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station and walk into the Ground Floor area of Sunway Pyramid Shopping Mall."}, {"address": "G1.33, Ground Floor, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-buy list: Limited-edition printed silk scarves, signature dUCK waterproof tote bag, stylish slim-fit casual dress. Founded by renowned Malaysian entrepreneur Vivy Yusof, The dUCK Store is a premier modest fashion and lifestyle brand with a huge loyal following across Malaysia. The store offers high-quality printed scarves, chic accessories, and sleek contemporary wear that exude modern female confidence. Featuring a luxurious pink interior, the Sunway Pyramid outlet is a must-visit destination to experience Malaysia\u0027s modern modest fashion culture.", "name": "The dUCK Store", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, and walk about 3 minutes to Ground Floor (G) of Sunway Pyramid Shopping Mall."}, {"address": "LG2.138, Lower Ground 2, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.1 stars | Must-buy list: Off-label casual T-shirts from famous Western brands, great-value quality kids\u0027 onesies, versatile stretch jeans. Good2U is a wildly popular local Malaysian discount fashion outlet chain offering international and local export apparel at extreme clearance prices. The Sunway Pyramid branch spans a massive area with selections ranging from men\u0027s and women\u0027s wear to children\u0027s clothing. Most items are priced at 70% to 80% off retail prices, making it a treasure-trove shopping spot for local families and budget-conscious travelers seeking high-value clothing deals.", "name": "Good2U Fashion Outlet", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station and enter directly into Lower Ground 2 (LG2) of Sunway Pyramid Shopping Mall."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "LG2.41 \u0026 LG2.42, Lower Ground 2, Sunway Pyramid, No. 3, Jalan PJS 11/15, Sunway City, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.6 Stars | Must-Buy List: Oriental 3-in-1 Rich White Coffee, Traditional Handmade Kaya Jam, Flaky Egg Tart Gift Box. Oriental Kopi is an iconic Malaysian Nanyang traditional Kopitiam brand, and its Sunway Pyramid store frequently draws long queues. Not only can you enjoy record-breaking extra-thick flaky egg tarts here, but its signature white coffee gift boxes and rich handmade kaya jam are also top souvenir picks for tourists. The deep, fragrant Nanyang flavors leave a lasting impression.", "name": "Oriental Kopi (Sunway Pyramid)", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, then cross the pedestrian bridge connected directly to LG2 of Sunway Pyramid Shopping Mall."}, {"address": "LG2.K08, Lower Ground 2, Sunway Pyramid, No. 3, Jalan PJS 11/15, Sunway City, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 Stars | Must-Buy List: Salted Egg Popcorn, Malaysian Curry Popcorn, Musang King Durian Popcorn. Originating in Malaysia and taking Southeast Asia by storm, Eureka is a premier popcorn brand. Every single kernel is evenly coated in rich seasoning, featuring uniquely Malaysian local flavors. The Salted Egg and Curry flavors are irresistibly savory and addictive. Their cans and ziplock bags are perfect for bringing home to share with family and friends.", "name": "Eureka Popcorn (Sunway Pyramid)", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, then walk into the central corridor on Level LG2 of Sunway Pyramid Shopping Mall."}, {"address": "LG1.11, Lower Ground 1, Sunway Pyramid, No. 3, Jalan PJS 11/15, Sunway City, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.4 Stars | Must-Buy List: Tiramisu Dark Chocolate, Musang King Durian Chocolate, Strawberry-Filled White Chocolate. Founded in 1995, Beryl\u0027s is Malaysia\u0027s premier homegrown chocolate brand. Their Sunway Pyramid store offers an extensive range of treats, from fine dark chocolates made with premium Ghanaian cocoa to tropical fruit chocolates featuring durian and mango. Beautifully packaged and reasonably priced, these make ideal souvenirs from Kuala Lumpur.", "name": "Beryl\u0027s Chocolate (Sunway Pyramid)", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, enter Sunway Pyramid Mall, and proceed to Level LG1."}, {"address": "B1.01, Basement 1, Sunway Pyramid, No. 3, Jalan PJS 11/15, Sunway City, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.3 Stars | Must-Buy List: A1 Bak Kut Teh Soup Spices, OldTown Hazelnut White Coffee, Malaysian Prawn Crackers \u0026 Fish Snacks. Jaya Grocer is the largest and most well-stocked premium supermarket in Sunway City. It features a dedicated local souvenir section where travelers can get authentic Malaysian spices, Bak Kut Teh seasoning packs, various white coffee brands, and regional snacks all in one stop\u2014perfect for a final shopping spree before your flight.", "name": "Jaya Grocer Local Souvenir Section (Sunway Pyramid)", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station, enter Sunway Pyramid Mall, and take the escalator down to the B1 basement supermarket level."}, {"address": "LG2.38, Lower Ground 2, Sunway Pyramid, No. 3, Jalan PJS 11/15, Sunway City, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 Stars | Must-Buy List: Fresh Pandan Chiffon Cake, Malaysian Layer Cake (Kek Lapis), Handmade Pineapple Tarts. Lavender is a highly popular Malaysian bakery chain combining European baking techniques with Southeast Asian ingredients. Freshly baked daily, their signature Pandan Chiffon Cake is made with pure natural pandan juice, yielding a fragrant and soft texture. Their colorful Malaysian layer cake (Kek Lapis) is another exquisite treat favored by travelers.", "name": "Lavender Bakery (Sunway Pyramid)", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station and follow the direct walkway into Level LG2 of Sunway Pyramid."}, {"address": "G1.39, Ground Floor, Sunway Pyramid, No. 3, Jalan PJS 11/15, Sunway City, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.7 Stars | Must-Buy List: Classic Engraved Pewter Tea Caddy, Petronas Twin Towers Miniature Model, Royal Pewter Beer Tankard. Founded in 1885, Royal Selangor is the world\u0027s largest pewter maker and a world-renowned Malaysian heritage brand. At the Sunway Pyramid store, visitors can browse exquisite pewter tea sets, drinkware, and landmark souvenirs. Crafted from high-quality lead-free pewter with timeless design, these items make magnificent, high-end gifts.", "name": "Royal Selangor (Sunway Pyramid)", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station and enter Ground Floor (G Level) of Sunway Pyramid via the connecting bridge."}, {"address": "LG2.K02, Lower Ground 2, Sunway Pyramid, No. 3, Jalan PJS 11/15, Sunway City, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.4 Stars | Must-Buy List: Classic Rotiboy Coffee Bun, Mochaboy Bun, Cheezboy Bun. Originating in Penang, Rotiboy is a beloved Malaysian bakery chain famous for its signature coffee buns. Passing by the Sunway Pyramid outlet, you will instantly be greeted by the irresistible aroma of freshly baked coffee pastry. The flagship Rotiboy bun features a crisp, fragrant coffee-butter crust with a savory melted butter filling\u2014crispy on the outside, soft on the inside, and sweet yet savory.", "name": "Rotiboy (Sunway Pyramid)", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station and enter Level LG2 of Sunway Pyramid, located next to the food court."}, {"address": "LG1.111, Lower Ground 1, Sunway Pyramid, No. 3, Jalan PJS 11/15, Sunway City, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.2 Stars | Must-Buy List: Malaysian Dry-Stored Aged Liu Bao Tea, Nanyang Cold Brew Tea Bags, Exquisite Teaware \u0026 Yixing Zisha Teapots. Legend of Tea is a premium local brand deeply rooted in Malaysian tea culture. Due to the country\u0027s unique climate, Malaysia is ideal for natural aging of dark teas like Liu Bao and Pu-erh. They sell highly collectible aged teas from \u0027Malaysian Storage\u0027 as well as elegantly packaged portable tea bags\u2014an ideal gift for seniors and tea lovers.", "name": "Legend of Tea (Sunway Pyramid)", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station; the shop is directly accessible on Level LG1 of Sunway Pyramid Shopping Mall."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.6 stars | Must-Buy List: Cosmetics \u0026 skincare products, local Malaysian snacks, designer clothing. A massive Egyptian pyramid-themed shopping mall located in the heart of Sunway City, featuring an iconic and imposing Sphinx at its entrance. Home to over 900 shops divided into uniquely themed zones like the Egyptian zone, Asian Avenue, and Marrakesh zone, it brings together a rich blend of local Malaysian brands and international luxury labels, making it Sunway City\u0027s premier flagship shopping destination.", "name": "Sunway Pyramid Shopping Mall", "transport": "Take the BRT Sunway Line to Sunway Lagoon Station; the mall is directly connected via a 3-minute walk."}, {"address": "Persiaran Komersial, 64000 KLIA, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buy List: Discounted Nike sneakers, classic Coach leather bags, Bally luxury leather shoes. The most recommended and expansive international outlet center in the outskirts of Kuala Lumpur, located about a 40-minute drive from Sunway City. Housing over 200 international luxury brands and trendy sportswear labels, it offers incredible year-round discounts of 30% to 70%, making it a must-visit shopping paradise for bargain hunters in the KL and Sunway area.", "name": "Mitsui Outlet Park KLIA Sepang", "transport": "Take a Grab ride directly from Sunway City (approx. 40 minutes); or take the BRT and transfer to the LRT/MRT to KL Sentral, then catch the airport express shuttle bus."}, {"address": "LG1.89 \u0026 LG1.90, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.3 stars | Must-Buy List: Padini stylish business shirts, Padini Authentics casual T-shirts, PDI trendy accessories. PADINI is Malaysia\u0027s most iconic home-grown fashion apparel group. This concept store inside Sunway Pyramid consolidates several of its sub-brands, including Padini, Seed, and PDI. Featuring tailored fits specifically designed for Asian body frames, high quality, and affordable prices, it is a beloved staple for local youths and working professionals.", "name": "PADINI Concept Store - Sunway Pyramid", "transport": "Take the BRT to Sunway Lagoon Station and enter LG1 level of Sunway Pyramid via the connected walkway."}, {"address": "G1.93, Ground Floor, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.2 stars | Must-Buy List: VINCCI woven flat sandals, stylish women\u0027s clutches, sunglasses. A household-name Malaysian fashion brand for women\u0027s footwear and accessories under the Padini Group. Staying closely aligned with global fashion trends, it offers everything from resort-style sandals to elegant heels. Its exceptional value for money and vast variety make it an essential shoe shopping spot for tourists visiting Sunway City.", "name": "VINCCI - Sunway Pyramid", "transport": "Take the BRT to Sunway Lagoon Station and enter the Ground Floor of Sunway Pyramid."}, {"address": "LG2.138, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy List: Herbal body scrubs, cold-process tropical coconut oil handmade soaps, ginger essential oil compresses. Tanamera is a premier Malaysian brand specializing in all-natural tropical botanical skincare and spa products. It formulates its products using natural Malaysian rainforest herbs and traditional remedy recipes. Free from synthetic additives and beautifully packaged in tropical style, they make unique and thoughtful souvenirs.", "name": "Tanamera Tropical Spa Products - Sunway Pyramid", "transport": "Take the BRT to Sunway Lagoon Station and enter LG2 level of Sunway Pyramid."}, {"address": "F1.AV.161, Asian Avenue, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.4 stars | Must-Buy List: Slim series non-slip women\u0027s flip-flops, Wide series men\u0027s flip-flops, toddler rainbow sandals. Fipper is a famous Malaysian flip-flop brand wildly popular across Southeast Asia, recognizable by its elephant logo. Made from 100% natural Thai rubber, they offer ultra-soft, springy comfort and excellent slip resistance. Available in dozens of vibrant color combinations at extremely budget-friendly prices, they are a national treasure of everyday practicality.", "name": "Fipper Flip-Flops - Sunway Pyramid", "transport": "Take the BRT to Sunway Lagoon Station and head to the 1st Floor (Asian Avenue area) of Sunway Pyramid."}, {"address": "LG2.08, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.5 stars | Must-Buy List: Tiramisu milk chocolate, durian-filled chocolate, mango dark chocolate. Founded in 1995, Beryl\u0027s is a renowned local premium Malaysian chocolatier. Selecting high-quality cocoa beans, it creatively incorporates tropical Malaysian fruit flavors\u2014such as durian, mango, and coconut\u2014into its chocolates. With elegant packaging, it is the top choice for souvenirs for visitors traveling to Sunway City.", "name": "Beryl\u0027s Chocolate - Sunway Pyramid", "transport": "Take the BRT to Sunway Lagoon Station and enter LG2 level of Sunway Pyramid."}, {"address": "F1.79, Sunway Pyramid, 3, Jalan PJS 11/15, Bandar Sunway, 47500 Subang Jaya, Selangor, Malaysia", "feature": "\u2b50 4.1 stars | Must-Buy List: Stylish square-toe low heels, minimalist French shoulder bags, resort-style woven sandals. Nose is a popular home-grown Malaysian women\u0027s shoe and handbag brand that caters to modern urban women with comfortable yet chic designs. Featuring rapid inventory turnarounds, sleek tailoring, and attentive detailing at pocket-friendly prices, it is a flagship local brand in the Sunway City shopping district.", "name": "Nose Shoes \u0026 Bags - Sunway Pyramid", "transport": "Take the BRT to Sunway Lagoon Station and enter the 1st Floor of Sunway Pyramid."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Sunway City and Theme Park Area"}};
        const cityName = "Kuala Lumpur";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
