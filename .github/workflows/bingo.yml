name: BINGO Auto Scraper

on:
  workflow_dispatch: # 保持手動觸發按鈕（供 cron-job.org 外部準時呼叫）

# 🌟 關鍵修復 1：賦予機器人 git push 寫回儲存庫的權限
permissions:
  contents: write

# 🌟 關鍵修復 2：防止排程塞車時多個任務同時撞在一起
concurrency:
  group: bingo-scraper-group
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 限制單次最長 5 分鐘，防止卡死
    steps:
      - name: 📥 取得最新程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 安裝相依套件與瀏覽器
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: 🚀 執行爬蟲並寫入試算表
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: python bingo_scraper.py

      - name: 💾 自動更新 last_period.txt (維持防呆機制)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_period.txt
          if ! git diff --staged --quiet; then
            git commit -m "自動更新最新期數 [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "期數未更新，無需 commit"
          fi
