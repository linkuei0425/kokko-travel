name: BINGO Auto Scraper

on:
  schedule:
    # 在每小時的這些特定分鐘執行 (剛好避開整點，確保網站資料已經更新)
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch: # 保持手動觸發按鈕

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 取得最新程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 安裝相依套件與瀏覽器
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: 🚀 執行爬蟲並寫入試算表
        env:
          GAS_URL: ${{ secrets.GAS_URL }} # 從 Secrets 安全讀取網址
        run: python bingo_scraper.py

      - name: 💾 自動更新 last_period.txt (維持防呆機制)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_period.txt
          if ! git diff --staged --quiet; then
            git commit -m "自動更新最新期數 [skip ci]"
            git push
          else
            echo "期數未更新，無需 commit"
          fi
