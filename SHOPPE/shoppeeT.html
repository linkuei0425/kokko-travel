<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蝦皮分潤極速轉換器 (單機版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; }
        .drop-zone { 
            transition: all 0.3s ease; 
            border: 2px dashed #cbd5e1;
            background-color: #ffffff;
        }
        .drop-zone:hover { border-color: #f97316; background-color: #fff7ed; }
        .drop-zone.dragover { 
            border-color: #ea580c; 
            background-color: #ffedd5; 
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-xl w-full border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-orange-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                蝦皮分潤極速轉換器
            </h1>
            <p class="text-gray-500 mt-2 text-sm font-medium">單機極速版 ⚡ 瞬間將 E 欄原始網址轉換至 G 欄</p>
        </div>

        <div class="mb-6 bg-gray-50 p-4 rounded-xl border border-gray-100">
            <label for="aff-id" class="block text-sm font-bold text-gray-700 mb-2">你的專屬分潤 ID (Affiliate ID)</label>
            <input type="text" id="aff-id" value="16365390019" 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-shadow text-lg font-semibold text-gray-800"
                placeholder="例如: 16365390019">
        </div>

        <div id="drop-zone" class="drop-zone rounded-xl p-12 text-center cursor-pointer mb-6 relative mt-4 shadow-sm">
            <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".xlsx, .xls">
            <div class="pointer-events-none">
                <svg class="mx-auto h-14 w-14 text-orange-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="text-lg text-gray-700 font-bold mb-1">點擊此處 或 拖曳 Excel 檔案</p>
                <p class="text-sm text-gray-500">支援 .xlsx 或 .xls 格式，速度極快無需等待</p>
            </div>
        </div>

        <div id="status-container" class="text-center min-h-[40px] mb-4">
            <p id="status-msg" class="text-sm font-medium hidden px-4 py-2 rounded-lg"></p>
        </div>

        <div class="text-center">
            <button id="download-btn" class="hidden bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg transform hover:scale-105 w-full text-lg">
                ⬇️ 下載已轉換的 Excel 檔案
            </button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const statusMsg = document.getElementById('status-msg');
        const affIdInput = document.getElementById('aff-id');
        const downloadBtn = document.getElementById('download-btn');
        
        let processedWorkbook = null;
        let originalFileName = "";

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        downloadBtn.addEventListener('click', downloadFile);

        function handleFile(file) {
            if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
                showStatus('❌ 請上傳有效的 Excel 檔案 (.xlsx 或 .xls)', 'error');
                return;
            }

            originalFileName = file.name;
            showStatus('⏳ 檔案處理中，請稍候...', 'loading');
            downloadBtn.classList.add('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    const affId = affIdInput.value.trim() || '16365390019';
                    let modifiedCount = 0;
                    
                    // 迴圈處理每一列資料 (索引說明：E=4為原網址, G=6為分潤長網址)
                    for (let i = 0; i < rows.length; i++) {
                        let row = rows[i];
                        if (!row) {
                            rows[i] = [];
                            row = rows[i];
                        }

                        // 擴展陣列長度確保有 G 欄 (索引 6)
                        while (row.length <= 6) {
                            row.push("");
                        }

                        const eValue = row[4]; // 取得 E 欄
                        
                        // 處理標題列 (第一列)
                        if (i === 0 && (!eValue || typeof eValue !== 'string' || !eValue.includes('http'))) {
                            row[6] = "官方分潤長網址";
                            continue;
                        }

                        // 檢查是否有包含網址
                        if (typeof eValue === 'string' && (eValue.startsWith('http') || eValue.includes('shopee.tw'))) {
                            try {
                                // 官方標準步驟：將原網址編碼
                                const encodedUrl = encodeURIComponent(eValue.trim());
                                // 官方標準步驟：拼接導向網址與分潤ID
                                const longAffiliateUrl = `https://s.shopee.tw/an_redir?origin_link=${encodedUrl}?&affiliate_id=${affId}`;
                                
                                row[6] = longAffiliateUrl; // 寫入 G 欄
                                modifiedCount++;
                            } catch (err) {
                                console.warn(`無法解析第 ${i+1} 列的網址:`, eValue);
                            }
                        }
                    }

                    // 寫回工作表
                    const newWorksheet = XLSX.utils.aoa_to_sheet(rows);
                    workbook.Sheets[firstSheetName] = newWorksheet;
                    processedWorkbook = workbook;

                    if (modifiedCount === 0) {
                        showStatus('⚠️ 沒有在 E 欄找到任何可轉換的商品網址。', 'warning');
                    } else {
                        showStatus(`✅ 極速處理完成！共成功轉換 ${modifiedCount} 筆分潤連結。`, 'success');
                        downloadBtn.classList.remove('hidden');
                        
                        // 自動觸發下載以節省用戶時間
                        setTimeout(downloadFile, 500);
                    }

                } catch (err) {
                    console.error(err);
                    showStatus('❌ 處理檔案時發生錯誤，請檢查檔案是否損毀。', 'error');
                }
            };
            
            reader.readAsArrayBuffer(file);
        }

        function downloadFile() {
            if (!processedWorkbook) return;
            const newFileName = originalFileName.replace(/\.xlsx?$/, '') + '_分潤長網址版.xlsx';
            XLSX.writeFile(processedWorkbook, newFileName);
        }

        // 訊息顯示狀態管理
        function showStatus(message, type) {
            statusMsg.classList.remove('hidden', 'bg-gray-100', 'text-gray-600', 'bg-blue-50', 'text-blue-600', 'bg-green-50', 'text-green-700', 'bg-red-50', 'text-red-600', 'bg-yellow-50', 'text-yellow-700');
            statusMsg.textContent = message;
            
            switch(type) {
                case 'error': statusMsg.classList.add('bg-red-50', 'text-red-600'); break;
                case 'loading': statusMsg.classList.add('bg-blue-50', 'text-blue-600'); break;
                case 'success': statusMsg.classList.add('bg-green-50', 'text-green-700'); break;
                case 'warning': statusMsg.classList.add('bg-yellow-50', 'text-yellow-700'); break;
                default: statusMsg.classList.add('bg-gray-100', 'text-gray-600');
            }
        }
    </script>
</body>
</html>
