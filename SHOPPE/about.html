<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於我們 - Kokko Travel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b1329',
                        cardBg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Noto Sans TC 字體設定，支援 900 字重 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        /* 微光邊框與卡片陰影效果 */
        .glow-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body class="bg-[#0b1329] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- 自訂訊息提示框 (Toast) 取代 alert -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 -translate-y-20 opacity-0 transition-all duration-300 z-50 bg-slate-800 border border-sky-500/50 text-slate-200 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-sky-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">已複製信箱到剪貼簿！</span>
    </div>

    <!-- 頂部導覽列 -->
    <header class="w-full max-w-md mx-auto px-6 pt-6 pb-4 flex items-center justify-between">
        <h1 class="text-xl font-bold tracking-wide text-slate-100">
            關於我們
        </h1>
        <button id="close-btn" class="w-10 h-10 rounded-full bg-slate-800/80 hover:bg-slate-700/80 flex items-center justify-center text-slate-300 hover:text-white transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-sky-500/50 cursor-pointer" title="關閉">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
    </header>

    <!-- 主要內容區 -->
    <main class="w-full max-w-md mx-auto px-6 flex-1 flex flex-col gap-4 pb-6">
        
        <!-- 區塊一：品牌初衷 -->
        <section class="glow-card rounded-2xl p-5 relative overflow-hidden group">
            <div class="flex items-center gap-2.5 text-sky-400 font-semibold mb-3">
                <i class="fa-solid fa-quote-left text-lg"></i>
                <h2 class="text-base tracking-wide font-bold">品牌初衷</h2>
            </div>
            <p class="text-slate-300 text-sm leading-relaxed font-light">
                我們陪伴旅人從尋找靈感的第一秒，到踏上歸途的最後一刻。我們希望能為用戶寫下屬於他們的故事。
            </p>
        </section>

        
        <!-- 區塊二：聯絡信箱 -->
        <section class="glow-card rounded-2xl p-5 relative overflow-hidden group">
            <div class="flex items-center gap-2.5 text-indigo-400 font-semibold mb-2">
                <i class="fa-solid fa-envelope text-lg"></i>
                <h2 class="text-base tracking-wide font-bold">聯絡信箱</h2>
            </div>
            <a href="mailto:imimdesignstudio@yahoo.com" class="text-sky-400 hover:text-sky-300 text-sm font-medium tracking-wide break-all inline-block hover:underline transition-colors">
                imimdesignstudio@yahoo.com
            </a>
            <div class="mt-2.5 pt-2 border-t border-slate-800 text-xs text-slate-400 flex items-center justify-between">
                <span>點擊上方直接寄信</span>
                <button onclick="copyEmail()" class="text-xs text-sky-400 bg-sky-950/60 hover:bg-sky-900/60 px-2.5 py-1 rounded-md border border-sky-800/50 transition-colors cursor-pointer flex items-center gap-1.5 font-medium">
                    <i class="fa-regular fa-copy"></i> 複製信箱
                </button>
            </div>
        </section>

    </main>

    <!-- 底部網址 -->
    <footer class="w-full py-6 text-center text-xs tracking-wider text-slate-400 font-light">
        <a href="https://kokko-travel.com" target="_blank" rel="noopener noreferrer" class="hover:text-slate-200 transition-colors">
            kokko-travel.com
        </a>
    </footer>

    <!-- 互動 JavaScript 邏輯 -->
    <script>
        // 顯示通知訊息 (取代傳統 alert)
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = message;
            
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 複製信箱功能 (使用兼容性良好的相容寫法)
        function copyEmail() {
            const email = "imimdesignstudio@yahoo.com";
            const textArea = document.createElement("textarea");
            textArea.value = email;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("已成功複製信箱到剪貼簿！");
            } catch (err) {
                showToast("複製失敗，請手動複製。");
            }
            document.body.removeChild(textArea);
        }

        // 關閉按鈕點擊互動
        document.getElementById('close-btn').addEventListener('click', function() {
            showToast("正在返回主頁面...");
            setTimeout(() => {
                window.location.href = "https://kokko-travel.com";
            }, 1000);
        });
    </script>
</body>
</html>
