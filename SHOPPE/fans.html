<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入粉絲 Follow Us - Kokko Travel</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons CDN -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6; /* 在桌機上顯示淺灰底色，凸顯中央的手機版畫面 */
        }
        
        /* 隱藏卷軸的 CSS 類別 (給 no-scrollbar 使用) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="antialiased flex justify-center min-h-screen">

    <!-- 自訂訊息提示框 (Toast) 替代 alert() -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 -translate-y-20 opacity-0 transition-all duration-300 z-[100] bg-slate-800 text-slate-200 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <i class="ph-fill ph-check-circle text-sky-400 text-xl"></i>
        <span class="text-sm font-medium">即將關閉視窗...<br><span class="text-xs opacity-80 font-normal">Closing window...</span></span>
    </div>

    <!-- 加入粉絲 Modal -->
    <div id="fanModal" class="fixed inset-0 bg-slate-950 z-[80] flex flex-col max-w-[414px] mx-auto shadow-2xl">
        <div class="bg-gradient-to-br from-red-500 to-rose-600 text-white pt-10 pb-6 px-5 flex justify-between items-center shadow-md z-10">
            <div class="flex flex-col">
                <h2 class="font-bold text-lg leading-tight">加入粉絲</h2>
                <span class="text-[10px] font-medium tracking-widest opacity-80 uppercase">Follow Us</span>
            </div>
            <!-- 關閉按鈕 -->
            <button onclick="handleClose()" class="hover:bg-white/20 p-1.5 rounded-full transition-colors" title="關閉 Close">
                <i class="ph ph-x text-2xl"></i>
            </button>
        </div>
        
        <div class="p-5 flex-1 overflow-y-auto bg-slate-900 text-white flex flex-col items-center gap-6 no-scrollbar">
            <img src="https://i.imgur.com/C8pWBp8.jpg" alt="粉絲專頁" class="w-full rounded-2xl shadow-lg border border-white/10 object-cover">
            
            <div class="w-full space-y-3.5">
                <!-- Instagram -->
                <a href="https://www.instagram.com/imim.designstudio" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center justify-center gap-0.5 bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 rounded-xl font-bold shadow-lg active:scale-95 transition-transform">
                    <div class="flex items-center gap-1.5"><i class="ph-fill ph-instagram-logo text-xl"></i> 追蹤 Instagram</div>
                    <span class="text-[10px] font-normal opacity-80">Follow on Instagram</span>
                </a>
                
                <!-- Threads -->
                <a href="https://www.threads.com/@imim.designstudio" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center justify-center gap-0.5 bg-zinc-800 text-white py-3 rounded-xl font-bold shadow-lg active:scale-95 transition-transform border border-zinc-700">
                    <div class="flex items-center gap-1.5"><i class="ph-fill ph-threads-logo text-xl"></i> 關注 Threads</div>
                    <span class="text-[10px] font-normal opacity-80">Follow on Threads</span>
                </a>
                
                <!-- LINE -->
                <a href="https://lin.ee/9VnWCAj" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center justify-center gap-0.5 bg-[#00B900] text-white py-3 rounded-xl font-bold shadow-lg active:scale-95 transition-transform">
                    <div class="flex items-center gap-1.5"><i class="ph-fill ph-chat-circle text-xl"></i> 加入 LINE 官方帳號</div>
                    <span class="text-[10px] font-normal opacity-80">Add Official LINE</span>
                </a>
            </div>
            
            <!-- 底部文字 -->
            <div class="text-xs text-gray-400 mt-2 text-center leading-relaxed space-y-1.5">
                <p>追蹤我們，獲取第一手獨家旅遊私藏情報、<br>隱藏版美食與限時優惠！</p>
                <p class="text-[10px] opacity-70 font-light">Follow us for exclusive travel tips,<br>hidden food spots, and limited-time offers!</p>
            </div>
        </div>
    </div>

    <script>
        // 處理關閉按鈕點擊事件 (使用 Toast 替代禁止的 alert)
        function handleClose() {
            const toast = document.getElementById('toast');
            
            // 顯示 Toast
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            // 1秒後關閉視窗或跳轉
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
                
                // 如果是新開的視窗，嘗試關閉它
                if (window.history.length <= 1 || window.opener != null) {
                    window.close();
                } else {
                    window.location.href = "https://kokko-travel.com";
                }
            }, 1000);
        }
    </script>
</body>
</html>
