    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 stars | Dedicated to Sugawara no Michizane, the deity of learning, this is the head shrine of all Tenmangu shrines across Japan. Known for its gorgeous plum blossoms and rich historical architecture.", "duration": "2-3 hours", "title": "Dazaifu Tenmangu Shrine", "transport": "Take the Nishitetsu Tenjin-Omuta Line from Nishitetsu-Fukuoka (Tenjin) Station to Dazaifu Station, approx. 30 mins"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 stars | Built by Kuroda Kanbei during the Edo Period, featuring preserved stone walls and moats. It is also Fukuoka\u0027s top spot for cherry blossom viewing in spring.", "duration": "1-2 hours", "title": "Fukuoka Castle Ruins \u0026 Maizuru Park", "transport": "Take the Subway Kuko Line to Akasaka Station or Ohori Park Station, then walk for about 8 mins"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 stars | A scenic park modeled after West Lake in China. Features charming island bridges across the lake, perfect for a leisurely stroll and enjoying coffee at the lakeside Starbucks.", "duration": "1-2 hours", "title": "Ohori Park", "transport": "Take the Subway Kuko Line to Ohori Park Station, then walk for about 3 mins"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.8 stars | The grand guardian shrine of Hakata with over 1,000 years of history. It displays a massive decorative Kazari-yamakasa float and is the focal point of the famous Hakata Gion Yamakasa festival.", "duration": "1 hour", "title": "Kushida Shrine", "transport": "Take the Subway Nanakuma Line to Kushida-jinja-mae Station, then walk for about 1 min"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 stars | Japan\u0027s tallest seaside tower at 234 meters high. Its observation deck offers breathtaking 360-degree panoramic views of Fukuoka city and Hakata Bay.", "duration": "1-2 hours", "title": "Fukuoka Tower", "transport": "Take Nishitetsu Bus No. 306 from Hakata Station to Fukuoka Tower Minamiguchi, approx. 25 mins"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 stars | A massive entertainment complex featuring dancing water fountains, shops, and leisure facilities. At night, it hosts spectacular 3D projection mapping and illuminated fountain shows.", "duration": "2-3 hours", "title": "Canal City Hakata", "transport": "Take the Subway Nanakuma Line to Kushida-jinja-mae Station, then walk for about 3 mins"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.3 stars | A vibrant row of open-air food stalls along the Naka River where you can savor authentic Hakata ramen, oden, and experience Fukuoka\u0027s lively nightlife.", "duration": "1-2 hours", "title": "Nakasu Yatai Food Stalls", "transport": "Take the Subway Kuko Line to Nakasu-Kawabata Station, then walk for about 5 mins"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.2 stars | A cultural center famous for its terraced roof garden. Looking like a lush green hill, visitors can climb to the top for great views over the Tenjin district.", "duration": "1 hour", "title": "ACROS Fukuoka", "transport": "Take the Subway Kuko Line to Tenjin Station (Exit 16), then walk for about 3 mins"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.0 stars | An ancient temple considered the birthplace of Japanese udon, soba, and manju. Features the exquisite dry landscape garden \"Saito-tei\", offering serene elegance.", "duration": "1 hour", "title": "Jotenji Temple", "transport": "Take the Subway Kuko Line to Gion Station (Exit 4), then walk for about 5 mins"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.2 stars | The first official Zen temple in Japan, founded by priest Eisai. Surrounded by lush greenery, it is designated as a National Historic Site.", "duration": "1 hour", "title": "Shofukuji Temple", "transport": "Take the Subway Kuko Line to Gion Station, then walk for about 3 mins"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.4 stars | One of Japan\u0027s top three Sumiyoshi shrines. The ancient main hall displays the historic \"Sumiyoshi-zukuri\" architectural style, filled with a sacred and serene atmosphere.", "duration": "1 hour", "title": "Sumiyoshi Shrine", "transport": "Walk about 10 mins from the Hakata Exit of JR Hakata Station"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 stars | Houses the National Treasure Gold Seal (\"King of Na\"). Showcases Hakata\u0027s rich history and culture as a vital exchange hub in Asia.", "duration": "1-2 hours", "title": "Fukuoka City Museum", "transport": "Take the Nishitetsu Bus and get off at Fukuoka City Museum-mae"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.4 stars | Located inside Ohori Park, displaying modern masterpieces\u2014including Yayoi Kusama\u0027s iconic Yellow Pumpkin\u2014alongside ancient art objects in a refined artistic atmosphere.", "duration": "1-2 hours", "title": "Fukuoka Art Museum", "transport": "Take the Subway Kuko Line to Ohori Park Station, then walk for about 10 mins"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.8 stars | A sprawling national park featuring seasonal flowers like nemophila, roses, and tulips. Also includes an Animal Forest and fun playgrounds.", "duration": "3-4 hours", "title": "Uminonakamichi Seaside Park", "transport": "Take the JR Kashii Line to Uminonakamichi Station"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.3 stars | A historic island where the famous King of Na Gold Seal was discovered. Features a scenic coastal road ideal for cycling and enjoying fresh seafood.", "duration": "2-3 hours", "title": "Shikanoshima Island", "transport": "Take a ferry from Hakata Pier to Shikanoshima, approx. 30 mins"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A novel entertainment complex located next to the Fukuoka PayPay Dome, featuring teamLab digital art exhibitions and thrilling rooftop view slides.", "duration": "2-3 hours", "title": "BOSS E\u30fbZO FUKUOKA", "transport": "Take the Subway Airport Line to Tojinmachi Station, Exit 3, and walk about 15 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | A traditional Japanese stroll garden with a central pond, converted from the former villa of the Kuroda Clan. Enjoy matcha in the main hall while peacefully admiring the seasonal lakeside scenery.", "duration": "1-2 hours", "title": "Yusentei Park", "transport": "From Hakata Station, take Nishitetsu Bus No. 12 to \"Yusentei\" stop and walk 5 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.2 stars | A tea house garden built by a Hakata merchant, preserving historical features like Hakata earthen walls. Surrounded by vibrant seasonal foliage and greenery, offering a serene atmosphere.", "duration": "1 hour", "title": "Rakusui-en Garden", "transport": "About a 12-minute walk from the Hakata Exit of JR Hakata Station."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | One of Japan\u0027s three major Hachiman shrines, famous for the \"Surrender of Enemy Nations\" plaque on its main gate. Its hydrangea garden in early summer attracts countless visitors.", "duration": "1 hour", "title": "Hakozaki Shrine", "transport": "Take the Subway Hakozaki Line to Hakozakimiya-mae Station, Exit 1, then walk about 3 minutes."}, {"category                 if(catLower.includes('attraction') || catLower.includes('culture') || catLower.includes('景點') || catLower.includes('文藝')) badgeColor = "bg-sky-50 text-sky-700 border-sky-200";
                if(catLower.includes('shopping') || catLower.includes('market') || catLower.includes('購物') || catLower.includes('商圈')) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(catLower.includes('dining') || catLower.includes('cafe') || catLower.includes('美食') || catLower.includes('名店')) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(dynamicCats.some(dynCat => catLower.includes(dynCat.toLowerCase()))) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";

                let searchKeyword = encodeURIComponent(`${cityName} ${title}`);
                let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>
                        <button onclick="addToTrip('${activeTab}', '${(item.title || item.route).replace(/'/g, "\\'")}')" class="shrink-0 bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white rounded-xl px-4 py-2 font-bold transition-colors border border-sky-100 text-sm shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i>Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="${badgeColor} border text-xs px-2.5 py-1 rounded-md font-bold">${category}</span>
                        <span class="bg-rose-50 text-rose-600 border border-rose-100 text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${duration}</span>
                    </div>
                    <p class="text-sm md:text-base text-gray-600 mb-5 leading-relaxed">${formattedDesc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm md:text-base text-gray-700 flex items-start gap-3">
                        <span class="${activeTab === 'schedule' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                            <i class="fa-solid ${activeTab === 'schedule' ? 'fa-train-subway' : 'fa-ship'}"></i>
                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);
            });
        }

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
