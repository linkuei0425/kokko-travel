yo, London, Rome, and San Francisco, giving shoppers a fun \u0027around-the-world\u0027 experience. It features local Thai designer brands, affordable fashion, and unique boutiques offering diverse options at budget-friendly prices. Its legendary food court, \u0027Pier 21\u0027, attracts endless foodies with delicious, amazingly affordable authentic Thai street food. Complete with a cinema complex and supermarket, it\u0027s a huge hit among young locals and tourists.", "name": "Terminal 21 Asok", "transport": "BTS Asok Station / MRT Sukhumvit Station"}, {"address": "1031 Phloen Chit Road, Lumphini, Pathum Wan, Bangkok 10330", "feature": "\u2b50 4.4 stars | One of Bangkok\u0027s premier ultra-luxury shopping destinations, Central Embassy is acclaimed for its futuristic, sleek architectural design and top-tier retail experience. It houses flagship stores of world-renowned luxury brands, high-end fine jewelry, timepieces, and designer boutiques. Visitors can enjoy unmatched dining at Michelin-starred restaurants and chic cafes. Highlights also include the opulent \u0027Embassy Diplomat Screens\u0027 cinema and \u0027Open House\u0027, an impressive multi-concept lifestyle space combining a bookstore, eateries, and co-working spaces.", "name": "Central Embassy", "transport": "BTS Phloen Chit Station"}, {"address": "1027 Phloen Chit Road, Lumphini, Pathum Wan, Bangkok 10330", "feature": "\u2b50 4.3 stars | As the flagship department store of Central Group Thailand, Central Chidlom enjoys a rich history and exceptional reputation. Known for high-quality goods and premium service, its vast offerings span fashion, beauty, home decor, and electronics. The store features international brand counters, a popular food hall, and a gourmet supermarket. Linked via a skybridge to Central Embassy for an expanded shopping experience, it remains a timeless shopping favorite for both Bangkok locals and tourists.", "name": "Central Chidlom", "transport": "BTS Chidlom Station"}, {"address": "982/22 Sukhumvit Road, Phra Khanong, Khlong Toei, Bangkok 10110", "feature": "\u2b50 4.0 stars | Gateway Ekamai is a Japanese-themed shopping mall in Sukhumvit, popular among local Japanese expats and fans of Japanese culture. Packed with authentic Japanese restaurants, cafes, markets, and specialty shops, it offers genuine Japanese cuisine and imported goods. The mall also houses kids\u0027 play areas, beauty salons, and a cinema, making it a great family-friendly hub. Its direct BTS connection and unique Japanese vibe make it a favorite hangout spot in the Ekamai area.", "name": "Gateway Ekamai", "transport": "BTS Ekamai Station"}, {"address": "259 Sukhumvit Road, Khlong Toei Nuea, Watthana, Bangkok 10110", "feature": "\u2b50 3.9 stars | Conveniently located in the heart of Sukhumvit and connected to The Westin Grande Sukhumvit hotel, Robinson is a comprehensive department store catering to diverse budgets. It offers a wide variety of goods including fashion, footwear, beauty products, homeware, and electronics. Inside, visitors will find a supermarket, food court, and various restaurants for daily shopping and dining. Its accessible location and practical pricing make it a convenient shopping spot for local residents and business travelers.", "name": "Robinson Sukhumvit", "transport": "BTS Asok Station / MRT Sukhumvit Station"}, {"address": "1080 Sukhumvit Road, Phra Khanong, Khlong Toei, Bangkok 10110", "feature": "\u2b50 3.8 stars | An entertainment and retail complex located in the On Nut area, anchor-featured by its modern multiplex cinema. Beyond movie theaters, the plaza houses various restaurants, cafes, fast-food chains, and a supermarket, providing convenient everyday dining and shopping options. The stores focus on affordable fashion, daily necessities, and tech accessories. It serves as a handy leisure and entertainment hub for residents in East Sukhumvit.", "name": "Century The Movie Plaza Sukhumvit", "transport": "BTS On Nut Station"}], "name": "Major Shopping Malls"}, "cat_2": {"items": [{"address": "335 Thonglor 17, Khlong Tan Nuea, Watthana, Bangkok 10110", "feature": "\u2b50 4.3 stars | A trendy open-air community mall located in the Thonglor area, designed around the concept of \u0027Gather, Play, Eat, Shop\u0027. It brings together a curated selection of independent eateries, cafes, and unique lifestyle shops. The ground-floor \u0027Market\u0027 offers artisanal food, fresh produce, and specialty goods. Upstairs features boutiques selling stylish apparel, home decor, and crafts. It is a popular spot for locals and expats seeking high-quality, unique items and a relaxed atmosphere, often hosting workshops and small events.", "name": "The Commons", "transport": "Take the BTS to Thong Lo Station, then take a short taxi or motorcycle taxi ride, or walk about 15-20 minutes."}, {"address": "93, 95 Sukhumvit 26, Khlong Tan, Khlong Toei, Bangkok 10110", "feature": "\u2b50 4.1 stars | An upscale open-air lifestyle mall located in Sukhumvit Soi 26, offering a peaceful escape from the city bustle. K Village is renowned for its pet-friendly environment and diverse range of stores, from fashion boutiques and home decor shops to specialty food stores. It frequently hosts popular weekend markets, such as the Bangkok Farmers\u0027 Market, where visitors can discover organic produce, handicrafts, and unique local goods. It is an ideal destination for leisurely shopping and finding specialty items in a relaxed atmosphere.", "name": "K Village", "transport": "Take the BTS to Phrom Phong Station, then take a short taxi or motorcycle taxi ride."}, {"address": "Sukhumvit 69-71, Phra Khanong Nuea, Watthana, Bangkok 10110", "feature": "\u2b50 3.9 stars | A vibrant open-air community space and night market right next to BTS Phra Khanong Station. W District is famous for its blend of street art, food stalls, bars, and lively vibe. While primarily focused on food and drinks, it also features selected handicraft stalls and pop-up shops selling unique handmade items, vintage goods, and local designs, especially bustling in the evenings and weekends. It\u0027s a great place to experience local culture, enjoy live music, and hunt for unique souvenirs or fashion pieces.", "name": "W District", "transport": "Take the BTS to Phra Khanong Station, Exit 3 directly connects to the venue."}, {"address": "2, 88 Sukhumvit Road, Khlong Toei Nuea, Watthana, Bangkok 10110", "feature": "\u2b50 4.4 stars | A unique airport-themed shopping mall where each floor represents a different world-famous city, such as Tokyo, London, and San Francisco. Unlike traditional department stores, Terminal 21 is known for its numerous small independent boutiques and local designer shops, offering a \u0027market-like\u0027 shopping experience in an air-conditioned environment. Shoppers can find everything from fashion apparel and accessories to quirky souvenirs and crafts, making it a treasure trove for finding unique items and exploring local Thai creativity.", "name": "Terminal 21 Asok", "transport": "Take the BTS to Asok Station (direct skywalk connection) or MRT to Sukhumvit Station (direct connection)."}, {"address": "982/22 Sukhumvit Road, Phra Khanong, Khlong Toei, Bangkok 10110", "feature": "\u2b50 4.0 stars | A Japanese-themed lifestyle mall conveniently connected directly to Ekkamai BTS Station. Gateway Ekamai offers a unique shopping experience with a strong focus on Japanese products, restaurants, and services. Besides well-known brands, there are many small shops selling unique imported Japanese goods, stationery, fashion, and specialty foods. It frequently hosts Japanese-themed events and pop-up markets, providing opportunities to discover authentic Japanese crafts and curated goods hard to find elsewhere in Bangkok.", "name": "Gateway Ekamai", "transport": "Take the BTS to Ekkamai Station (direct skywalk connection)."}, {"address": "46 Sukhumvit 46, Phra Khanong, Khlong Toei, Bangkok 10110", "feature": "\u2b50 4.2 stars | Located in Sukhumvit Soi 46, this beautiful eco-friendly design, art, and lifestyle complex is hidden amidst lush greenery. Naiipa Art Complex is a serene oasis featuring art galleries, co-working spaces, cafes, and a collection of unique design and lifestyle shops. It\u0027s the perfect destination for those seeking curated goods, handicrafts, and a quiet shopping experience away from the busy main road. The complex frequently hosts art exhibitions and creative workshops, serving as a gathering spot for local artists and designers.", "name": "Naiipa Art Complex", "transport": "Take the BTS to Phra Khanong Station, then walk or take a short motorcycle taxi ride."}, {"address": "251/1 Thonglor 13, Khlong Tan Nuea, Watthana, Bangkok 10110", "feature": "\u2b50 4.0 stars | A stylish open-air community mall located in the heart of Thonglor Soi 13, known for its chic design and curated selection of shops and dining venues. SeenSpace offers a relaxed atmosphere with a focus on independent boutiques, fashion clothing stores, and lifestyle brands catering to discerning shoppers. Visitors can discover unique apparel, accessories, home decor, and specialty items from local designers and international brands. It is a popular hangout spot combining shopping, dining, and socializing.", "name": "SeenSpace Thonglor 13", "transport": "Take the BTS to Thong Lo Station, then take a short taxi or motorcycle taxi ride."}, {"address": "6/1 Ekkamai 12 Alley, Khlong Tan Nuea, Watthana, Bangkok 10110", "feature": "\u2b50 4.1 stars | More than just a charming cafe, Ekkamai Macchiato - Home \u0026 Studio is a hidden gem that functions as a curated lifestyle and home goods shop. Tucked away in a quiet alley off Ekkamai, this store offers a thoughtfully selected collection of unique home decor, handmade ceramics, stationery, and other lifestyle products. Every item is chosen for its aesthetic appeal and quality, reflecting a minimalist yet warm design philosophy. It is an ideal select shop for those looking for unique gifts or stylish touches for their home, all while enjoying great coffee in a cozy setting.", "name": "Ekkamai Macchiato - Home \u0026 Studio", "transport": "Take the BTS to Ekkamai Station, then take a taxi or motorcycle taxi into Ekkamai Soi 12."}], "name": "Specialty Markets \u0026 Select Shops"}, "cat_3": {"items": [{"address": "The Emporium, 622 Sukhumvit Rd, Khlong Tan, Khlong Toei, Bangkok 10110, Thailand", "feature": "\u2b50 4.5 stars | Synonymous with Thai silk, Jim Thompson is not just a brand, but a legend. Located inside The Emporium shopping mall, this boutique offers a wide range of exquisite silk products, from classic apparel, ties, and scarves to home decor, handbags, and unique souvenirs. Every piece showcases the perfect fusion of traditional Thai craftsmanship and modern design. Famous for its exceptional quality, vibrant colors, and distinctive patterns, Jim Thompson silk makes for a luxurious souvenir or gift. The store features an elegant ambiance and attentive service, allowing customers to experience the brand\u0027s history and cultural legacy while shopping. Whether you are looking for a timeless fashion piece or a refined gift steeped in Thai flair, Jim Thompson is the ultimate choice.", "name": "Jim Thompson (The Emporium Branch)", "transport": "BTS Phrom Phong Station, directly connected to The Emporium mall."}, {"address": "Terminal 21, 2, 88 Sukhumvit Rd, Khlong Toei Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.2 stars | NaRaYa is a household fabric bag brand in Thailand, beloved for its iconic bow designs and diverse floral patterns. Conveniently located inside Terminal 21, this branch is a popular spot for tourists to buy souvenirs. It offers a wide variety of products, including handbags, shoulder bags, cosmetic pouches, coin purses, and tissue covers. Lightweight, durable, and budget-friendly, these items make ideal gifts for friends and family. NaRaYa\u0027s designs seamlessly combine style and practicality, making them great for everyday use or travel keepsakes. The store is always bustling with shoppers, showcasing its immense popularity, and is a fantastic place to experience Thailand\u0027s signature fabric craft culture.", "name": "NaRaYa (Terminal 21 Branch)", "transport": "BTS Asok Station or MRT Sukhumvit Station, directly connected to Terminal 21 Shopping Mall."}, {"address": "The EmQuartier, 693 695 Sukhumvit Rd, Khlong Tan Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.4 stars | Located inside The EmQuartier mall, Gourmet Market is a high-end supermarket renowned for its extensive selection of imported goods and curated local Thai specialties. Beyond fresh ingredients, it is a true treasure trove for unique Thai souvenirs. You can find a vast array of premium Thai spices, curry pastes, signature snacks, dried tropical fruits, organic teas, coffee beans, and exquisite Thai desserts. Additionally, there are many lifestyle goods and handicrafts from local Thai designers. Gourmet Market offers a spacious, brightly lit environment with beautifully displayed merchandise for a comfortable shopping experience. For food lovers and quality-conscious travelers, it is the ideal destination to stock up on authentic Thai treats and souvenirs.", "name": "Gourmet Market (EmQuartier Branch)", "transport": "BTS Phrom Phong Station, directly connected to The EmQuartier mall."}, {"address": "1/1 Sukhumvit Soi 49, Khlong Tan Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.3 stars | Tucked away in Sukhumvit Soi 49, Karmakamet Secret World is a unique space combining a fragrance boutique and a cozy cafe. It is famous for its exquisite scented candles, diffusers, essential oils, body care products, and home fragrance lines. Emphasizing natural ingredients and signature scent blending, every product exudes a captivating, exotic charm. The vintage and mysterious decor creates a peaceful sanctuary away from the city\u0027s hustle and bustle. Beyond fragrance products, the cafe serves delicious meals and drinks, allowing guests to relax and unwind after shopping. Karmakamet\u0027s creations are not just souvenirs, but a symbol of refined lifestyle\u2014perfect for friends who appreciate quality and unique experiences.", "name": "Karmakamet Secret World (Sukhumvit Soi 49)", "transport": "BTS Phrom Phong Station, then take a taxi or walk for about 15-20 minutes."}, {"address": "Central Embassy, B1 Floor, 1031 Phloen Chit Rd, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.6 stars | Located on the basement floor of Central Embassy, Eathai is a hybrid space combining an upscale food hall and a Thai specialty market. Here, you can sample authentic street food and regional delicacies from all over Thailand, while its \u0027Eathai Market\u0027 area is a stellar spot for purchasing high-quality souvenirs. Find curated Thai spices, curry pastes, handcrafted sauces, specialty snacks, organic produce, Thai teas, coffee, and fine handicrafts. Eathai is known for its commitment to ingredient quality and promoting Thai culture, with every item carefully selected to ensure excellence. The stylish and comfortable setting allows visitors to enjoy great food while effortlessly shopping for authentic Thai products\u2014an ideal place to experience the essence of Thai gastronomy and culture.", "name": "Eathai (Central Embassy)", "transport": "BTS Phloen Chit Station, directly connected to Central Embassy mall."}, {"address": "Central Embassy, Level 4, 1031 Phloen Chit Rd, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.5 stars | Divana Scent is a dedicated fragrance boutique under Divana Spa, one of Thailand\u0027s top luxury spa brands, located inside Central Embassy. The brand is celebrated for its distinctive Thai wellness philosophy and high-quality natural ingredients. It offers a wide variety of body care products, home fragrances, essential oils, scented candles, and gift sets. Each product blends traditional Thai herbal extracts with modern aromatherapy, aiming to bring holistic delight to mind, body, and spirit. With exquisite packaging and unique, long-lasting aromas, Divana Scent products make the perfect gift for loved ones who value quality of life and self-care. The store\u0027s elegant atmosphere and knowledgeable staff provide tailored recommendations for a truly pampering shopping experience.", "name": "Divana Scent (Central Embassy)", "transport": "BTS Phloen Chit Station, directly connected to Central Embassy mall."}, {"address": "Terminal 21, 2, 88 Sukhumvit Rd, Khlong Toei Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 3.9 stars | Tops Market is a well-known supermarket chain in Thailand. The Sukhumvit Soi 19 branch, located near Terminal 21, is conveniently accessible and a go-to spot for locals and tourists alike to buy daily necessities and popular Thai snacks. While not as luxurious as high-end gourmet supermarkets, it offers the most authentic and popular Thai snacks, instant noodles, coffee, teas, seasonings, and dried tropical fruits at budget-friendly prices. It is the ideal place for souvenir haul shopping on a budget. Popular items like Tao Kae Noi seaweed, Thailand-exclusive Pocky flavors, various brands of Thai milk tea mixes, and dried mangoes can easily be found here. For travelers seeking a realistic, local grocery shopping vibe, Tops Market delivers a genuine and rewarding experience.", "name": "Tops Market (Sukhumvit Soi 19 Branch)", "transport": "BTS Asok Station or MRT Sukhumvit Station, directly connected to Terminal 21 Shopping Mall."}, {"address": "Siam Paragon, 991 Rama I Rd, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.7 stars | Located within Siam Paragon, one of Bangkok\u0027s premier shopping centers, \u0027Exotique Thai\u0027 is a dedicated zone showcasing Thailand\u0027s finest handicrafts, designer goods, and specialty souvenirs. The vast selection ranges from traditional Thai silk, wood carvings, silver jewelry, and ceramics to modern fashion apparel, home decor, wellness fragrances, and creative lifestyle products. Every item reflects Thailand\u0027s rich cultural heritage and superb craftsmanship. Exotique Thai is dedicated to promoting local Thai brands and designers, allowing visitors to find unique, collectible keepsakes. The spacious, artistic layout creates an inspiring shopping environment\u2014perfect for discovering high-end, sophisticated Thai souvenirs. Although Siam Paragon is slightly outside the Sukhumvit area proper, it is just a short BTS ride away, making it extremely accessible.", "name": "Siam Paragon - Exotique Thai", "transport": "BTS Siam Station, directly connected to Siam Paragon shopping mall. Just a few stops via BTS from the Sukhumvit area."}], "name": "Famous Souvenir \u0026 Gift Shops"}, "cat_4": {"items": [{"address": "693 Sukhumvit Road, Khlong Tan Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.5 stars | A luxury shopping landmark in Bangkok\u0027s Sukhumvit district, EmQuartier is famous for its unique helical architecture and vertical garden design. It brings together numerous top international luxury brands, trendy fashion labels, designer apparel, and high-end lifestyle products. More than just a shopping paradise, it\u0027s an integrated lifestyle complex featuring a rich variety of dining choices\u2014from fine dining restaurants to casual cafes\u2014as well as a cinema and a sky garden, offering a complete luxury experience. The modern, spacious, and bright interior makes it a must-visit destination for fashion lovers and discerning shoppers.", "name": "EmQuartier", "transport": "Take the BTS Skytrain to Phrom Phong Station (E5); a direct skywalk connects the station to the mall."}, {"address": "622 Sukhumvit Road, Khlong Tan, Khlong Toei, Bangkok 10110, Thailand", "feature": "\u2b50 4.3 stars | As a long-standing luxury department store in Bangkok\u0027s Sukhumvit area, Emporium forms the \u0027EM District\u0027 alongside EmQuartier, offering a classic and elegant shopping experience. It houses world-renowned international brands, local Thai designer labels, fine jewelry, cosmetics, and premium homeware. Renowned for its refined selection and exceptional service, Emporium features a food hall, upscale dining options, and a cinema complex to satisfy diverse customer needs. Compared to the modern aesthetic of EmQuartier, Emporium exudes a timeless, classic luxury feel, making it an ideal destination for traditional high-end shopping.", "name": "Emporium", "transport": "Take the BTS Skytrain to Phrom Phong Station (E5); a direct skywalk connects the station to the mall."}, {"address": "2, 88 Sukhumvit Road, Khlong Toei Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.4 stars | Famous for its unique \u0027airport terminal\u0027 concept, each floor of Terminal 21 represents a world-famous shopping city, such as Tokyo, London, Rome, and San Francisco, letting visitors enjoy a global journey while shopping. It gathers a wide array of affordable fashion brands, trendy clothing, accessories, and souvenirs, making it immensely popular among youth and tourists. Its famous food court, \u0027Pier 21\u0027, is widely acclaimed for offering authentic, delicious Thai street food at very budget-friendly prices. With its ultra-convenient transport links, it is a must-visit shopping and dining hub in Sukhumvit.", "name": "Terminal 21 Asok", "transport": "Take the BTS Skytrain to Asok Station (E4) or the MRT to Sukhumvit Station; both offer direct skywalk connections into the mall."}, {"address": "1031 Phloen Chit Road, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.5 stars | Central Embassy is one of Bangkok\u0027s premier ultra-luxury shopping destinations, celebrated for its sleek futuristic architecture and top-tier brand portfolio. Gathering the world\u0027s most exclusive luxury labels, fine jewelry, designer haute couture, and art, it offers an unmatched luxury shopping experience. The refined, tranquil atmosphere and exquisite decor make it the first choice for discerning shoppers seeking ultimate taste and exclusivity. Additionally, the mall features Michelin-starred dining outlets and a VIP luxury cinema, perfectly combining fine shopping, gastronomy, and entertainment.", "name": "Central Embassy", "transport": "Take the BTS Skytrain to Phloen Chit Station (E2); a direct skywalk links the station to the mall."}, {"address": "1027 Phloen Chit Road, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.2 stars | As the flagship store of Thailand\u0027s Central Group, Central Chidlom is one of Bangkok\u0027s oldest and most respected department stores. Embodying a classic department store setup, it provides a comprehensive selection of products, including top international beauty brands, fashion, home decor, children\u0027s items, and premium imported foods. Renowned for outstanding customer service and a comfortable retail environment, it draws both local residents and travelers looking for a quintessential shopping experience. A skywalk conveniently connects it to Central Embassy.", "name": "Central Chidlom", "transport": "Take the BTS Skytrain to Chit Lom Station (E1); a skywalk connects the exit directly to the department store."}, {"address": "982/22 Sukhumvit Road, Phra Khanong, Khlong Toei, Bangkok 10110, Thailand", "feature": "\u2b50 4.0 stars | Gateway Ekamai is a Japanese-themed community shopping mall bringing a unique taste of Japan to eastern Sukhumvit. It features a great lineup of Japanese retail brands, authentic eateries, cozy cafes, and Japanese-style service outlets like a specialty supermarket, beauty salons, and massage parlors. The clothing stores mostly focus on youthful, casual trends alongside niche lifestyle shops. For fans of Japanese culture and goods, Gateway Ekamai offers a fun and relaxed shopping atmosphere, making it a great destination for families and friends.", "name": "Gateway Ekamai", "transport": "Take the BTS Skytrain to Ekkamai Station (E7); a direct skywalk connects the station to the mall."}, {"address": "259 Sukhumvit Road, Khlong Toei Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 3.8 stars | Robinson Sukhumvit is a popular local Thai department store chain offering accessible, mid-range shopping choices. It carries a broad array of affordable fashion, footwear, cosmetics, home essentials, and consumer electronics, making it a practical daily shopping spot for local residents. Unlike nearby luxury malls, Robinson focuses on utility and value for money in an easygoing, stress-free environment. It also features a food court and supermarket for convenient one-stop shopping.", "name": "Robinson Department Store Sukhumvit", "transport": "Take the BTS Skytrain to Asok Station (E4) or Nana Station (E3), then walk about 5-10 minutes."}, {"address": "777 Sukhumvit Road, Khlong Tan Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 3.9 stars | Rain Hill is an eco-friendly boutique community mall in Sukhumvit, famous for its striking vertical garden walls and open-air layout. It hosts a curated selection of fashion boutiques, designer labels, lifestyle concept shops, alongside quality restaurants and cafes. The vibe is laid-back yet chic, appealing to visitors who appreciate distinct tastes and a relaxed lifestyle. Though compact, each shop is thoughtfully chosen to offer unique, high-quality offerings, making it a lovely getaway from giant mega-malls.", "name": "Rain Hill", "transport": "Take the BTS Skytrain to Phrom Phong Station (E5) or Thong Lo Station (E6), then walk 10-15 minutes, or take a short taxi/motorbike taxi ride."}], "name": "Department Stores \u0026 Fashion Brands"}}, "name": "Sukhumvit (Dining \u0026 Nightlife)"}};
        const cityName = "Bangkok";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
