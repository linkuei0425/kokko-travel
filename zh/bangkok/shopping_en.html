        const dbData = {"chatuchak": {"categories": {"cat_1": {"items": [{"address": "84 Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900 (Mixt Chatuchak 1st Floor)", "feature": "\u2b50 4.5 stars | Must-buys: 3-in-1 3D Eyebrow Pencil, Wings Anti-Pollution Sunscreen Powder, Aqua Base Sunscreen Lotion. Known as Thailand\u0027s national makeup brand, Mistine is famous for its incredible value for money and waterproof, sweat-proof technology. The specialty store inside Mixt Chatuchak carries an exceptionally complete range of products. Specially formulated for Southeast Asia\u0027s hot and humid climate, their cosmetics are perfect for warm summers, making it the ultimate shopping haven for young women and tourists looking for top-notch local makeup.", "name": "Mistine Flagship Store (Mistine Mixt Chatuchak)", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 3) and walk for about 5 minutes to enter the Mixt Chatuchak shopping mall."}, {"address": "1693 Phahonyothin Rd, Chatuchak, Bangkok 10900 (Central Plaza Ladprao 2nd Floor)", "feature": "\u2b50 4.7 stars | Must-buys: 4U2 Lipsticks, Chaonang Oil-Control Compact Powder, Browit Dual-Ended Eyebrow Pencil. EVEANDBOY is Thailand\u0027s leading mega-beauty chain store, often dubbed the Thai version of Sephora. Located in Central Ladprao in northern Bangkok, this spacious branch brings together countless local Thai indie makeup brands and budget-friendly cosmetics. With plenty of testers available, it\u0027s the best hub to dive deep into Thailand\u0027s latest beauty trends.", "name": "EVEANDBOY (Central Plaza Ladprao Branch)", "transport": "Take the BTS to Ha Yaek Lat Phrao Station (Exit 1) and use the skywalk connection directly into Central Plaza Ladprao."}, {"address": "Chatuchak Weekend Market Section 2, Kamphaeng Phet 2 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.3 stars | Must-buys: Scentio Milk Clarifying Facial Foam, Q10 Milk Body Lotion, Milk Peeling Gel. Beauty Buffet is a popular local Thai beauty chain that offers a buffet-style array of adorable, dessert-themed packaged cosmetics. Its famous milk series features a rich milky fragrance and superb moisturizing effects. The branch inside Chatuchak Weekend Market is constantly bustling with international travelers.", "name": "Beauty Buffet (Chatuchak Market Branch)", "transport": "Take the BTS to Mo Chit Station (Exit 1) or the MRT to Chatuchak Park Station (Exit 1) and walk a short distance."}, {"address": "1693 Phahonyothin Rd, Chatuchak, Bangkok 10900 (Central Plaza Ladprao 2nd Floor)", "feature": "\u2b50 4.4 stars | Must-buys: Natural Plant Essential Oil Body Lotion, Cuticle Hair Treatment Oil, Fruity Body Mist. Oriental Princess is a long-standing, beloved botanical skincare and cosmetics brand favored by Thai women, often called the Thai version of The Body Shop. Known for natural plant extracts and elegant fragrances, its products offer department-store quality at affordable prices, with its hair care essence being a long-standing bestseller.", "name": "Oriental Princess (Central Plaza Ladprao Branch)", "transport": "Take the BTS to Ha Yaek Lat Phrao Station (Exit 1) or the MRT to Phahon Yothin Station (Exit 3)."}, {"address": "1693 Phahonyothin Rd, Chatuchak, Bangkok 10900 (Central Plaza Ladprao 2nd Floor)", "feature": "\u2b50 4.4 stars | Must-buys: Evory Retouch Oil Control Foundation Powder, UV Expert Sunscreen, Thailand-Exclusive Collaboration Lipsticks. Cute Press is an established Thai cosmetics brand that successfully modernized itself, becoming a favorite among youth for its long-lasting sun care and ultra-cute limited edition collaborations. Its powders and sunscreens are specifically formulated for hot, humid, and sweaty environments, delivering excellent coverage and staying power.", "name": "Cute Press (Central Plaza Ladprao Branch)", "transport": "Take the BTS to Ha Yaek Lat Phrao Station (Exit 1) directly connecting into the shopping mall."}, {"address": "84 Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900 (Mixt Chatuchak 2nd Floor)", "feature": "\u2b50 4.3 stars | Must-buys: Cathy Doll CC Cream, Soft Matte Lip Tint, Vitamin C Brightening Serum. Cathy Doll (under Karmart) is a hugely popular budget makeup brand across Southeast Asia, known for colorful packaging and high practicality. Located inside the air-conditioned Mixt Chatuchak mall adjacent to Chatuchak Market, this store offers a full product line. Many base makeup products feature impressive sweatproof and waterproof formulas.", "name": "Karmart / Cathy Doll (Mixt Chatuchak Branch)", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 3) and walk for about 5 minutes."}, {"address": "Chatuchak Weekend Market Section 24, Kamphaeng Phet 2 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.6 stars | Must-buys: Wat Pho Brand Green Balm, Poy-Sian Inhaler, Counterpain Analgesic Balm. Located right inside Chatuchak Weekend Market, this traditional Thai medicine stall is a hotspot for locals and tourists to buy herbal remedies and beauty care. It sells authentic green balm, essential oils, and famous pain/itch relief ointments at transparent, fair prices\u2014a must-visit store for stocking up on classic household remedies.", "name": "Wangprom Herbal \u0026 Pharmacy (Wat Pho Brand Balm \u0026 Herbal Shop Chatuchak)", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 2) and step directly into Section 24 of the market."}, {"address": "1693 Phahonyothin Rd, Chatuchak, Bangkok 10900 (Central Plaza Ladprao 3rd Floor)", "feature": "\u2b50 4.2 stars | Must-buys: Boots Cucumber 3-Minute Mask, Snake Brand Cooling Powder, Soffell Mosquito Repellent Spray. Famous UK drugstore chain Boots offers many exclusive local items and massive discounts in Thailand. Well-stocked with products, this Central Ladprao branch features top Thai essentials alongside international beauty products\u2014including popular cooling skincare, mosquito repellents, and ChaTraMue Thai tea lip balm, with tax refund options available for larger purchases.", "name": "Boots Drugstore (Central Plaza Ladprao Branch)", "transport": "Take the BTS to Ha Yaek Lat Phrao Station (Exit 1) via the skywalk directly into the mall."}], "name": "Iconic Local Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "Chatuchak Weekend Market, Section 24, Soi 33/1, Kamphaeng Phet 2 Rd, Chatuchak, Bangkok", "feature": "\u2b50 4.6 stars | Must-buys: Genuine leather tote bags, vintage leather bi-fold wallets, minimal handmade key pouches. A local Thai handcrafted leather brand located in Chatuchak Section 24, specializing in high-quality cowhide and fine stitching. The leather develops a rich patina over time, drawing leather enthusiasts from Japan and Taiwan specifically to shop here.", "name": "Guate Leather Bags (Chatuchak)", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 2) and walk about 3 minutes to Chatuchak Section 24."}, {"address": "Chatuchak Weekend Market, Section 5, Soi 1, Kamphaeng Phet 2 Rd, Chatuchak, Bangkok", "feature": "\u2b50 4.4 stars | Must-buys: Vintage denim jackets, American retro graphic tees, handmade canvas crossbody bags. A popular vintage and retro store located in Chatuchak Market Section 5. The store carefully curates classic jeans and apparel, making it a treasure trove that vintage lovers shouldn\u0027t miss.", "name": "Vines Vintage Clothing (Chatuchak)", "transport": "Take the BTS to Mo Chit Station (Exit 1) or MRT to Chatuchak Park Station (Exit 1) and walk a short distance."}, {"address": "Union Mall, 2nd Floor, 54 Ladprao Soi 1, Jomphol, Chatuchak, Bangkok", "feature": "\u2b50 4.3 stars | Must-buys: Thai designer dresses, Korean-style high-waisted wide-leg pants, trendy clutches. Located inside Union Mall\u2014the fashion hub of North Bangkok\u2014this multi-brand boutique brings together hundreds of independent local Thai designer brands, offering everything from minimalist styles to resort wear with fast-moving inventory.", "name": "CAMP Multi-brand Store (Union Mall)", "transport": "Take the MRT to Phahon Yothin Station (Exit 5) and walk directly into Union Mall via the underground walkway."}, {"address": "Union Mall, 3rd Floor, Ladprao Soi 1, Jomphol, Chatuchak, Bangkok", "feature": "\u2b50 4.5 stars | Must-buys: Comfortable padded flats, elegant low-heeled pointed pumps, woven Roman sandals. Highly popular among local office workers and students inside Union Mall, specializing in comfortable handmade women\u0027s shoes tailored for Asian foot shapes. Features soft cushioned insoles, wallet-friendly prices, and a huge variety of colors.", "name": "O\u0027Shoes Handmade Women\u0027s Footwear (Union Mall)", "transport": "Take the MRT to Phahon Yothin Station (Exit 5), directly connected to Union Mall."}, {"address": "Mixt Chatuchak, 2nd Floor, Kamphaeng Phet 3 Rd, Chatuchak, Bangkok", "feature": "\u2b50 4.7 stars | Must-buys: Color-block patchwork totes, lightweight scratch-resistant crossbody bags, recycled cotton bucket hats. A Thai eco-friendly design brand that excels at upcycling high-quality factory leftover fabrics. Each bag features a unique color combination and pattern, perfectly blending chic fashion with sustainability.", "name": "Madmatter Sustainable Fabric Bags (Mixt Chatuchak)", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 2) and walk about 5 minutes to Mixt Chatuchak Mall."}, {"address": "Central Ladprao, 2nd Floor, 1693 Phahonyothin Rd, Chatuchak, Bangkok", "feature": "\u2b50 4.5 stars | Must-buys: Signature lettered canvas tote bags, crop slogan tees, backless resort dresses. A popular Thai fast-fashion and accessible luxury brand that swept across Asia. The branch at Central Ladprao offers a complete selection, with its iconic black-and-white lettered canvas totes being a top favorite for tourists.", "name": "Gentlewoman Popular Thai Fashion (Central Ladprao)", "transport": "Take the BTS to Ha Yaek Lat Phrao Station (Exit 1), which directly connects to Central Ladprao department store."}, {"address": "Chatuchak Weekend Market, Section 3, Soi 44/2, Kamphaeng Phet 2 Rd, Chatuchak, Bangkok", "feature": "\u2b50 4.6 stars | Must-buys: Fair Trade printed dresses, Northern Thai embroidered handbags, handmade woven ethnic earrings. A Fair Trade certified local Thai brand that combines traditional Northern Thai minority patterns with modern tailored clothing. Made from breathable fabrics with unique prints, ensuring you won\u0027t match accidentally with anyone else.", "name": "Lofty Bamboo Crafts \u0026 Apparel (Chatuchak)", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 2), enter Chatuchak Market, and walk for about 4 minutes."}, {"address": "Chatuchak Weekend Market, Section 24, Soi 33/2, Kamphaeng Phet 2 Rd, Chatuchak, Bangkok", "feature": "\u2b50 4.8 stars | Must-buys: Handmade vegetable-tanned leather shoes, lightweight leather backpacks, minimal woven leather bracelets. An artisan leather shop rooted in Chatuchak Market for years, dedicated to handcrafted items made from premium vegetable-tanned cowhide. Offers a warm, solid texture, along with complimentary on-site custom English name engraving.", "name": "Chanan Handmade Leather Goods (Chatuchak)", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 2) and walk about 3 minutes after exiting."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "101 Kamphaeng Phet Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.6 stars | Must-buy list: Royal Milk Tablets, Royal 100% Pure Honey Squeeze Tubes, Naturally Dried Longan. Located inside Or Tor Kor Market, this Royal Project shop is the perfect place to buy high-quality agricultural products promoted by Thailand\u0027s King Rama IX. The Royal Milk Tablets are rich, aromatic, and affordably priced, making them a hugely popular souvenir among tourists. The squeeze-tube honey is convenient to carry and extremely pure. Quality-controlled by the Royal Agricultural Project, all products are 100% natural with no additives, making it the top choice for healthy local snacks and gifts.", "name": "Chitralada Royal Shop - Or Tor Kor Market Branch", "transport": "Take the MRT Blue Line to Kamphaeng Phet Station Exit 3. You will arrive directly inside Or Tor Kor Market upon exiting."}, {"address": "Section 2, Soi 38/1, Chatuchak Weekend Market, Bangkok 10900", "feature": "\u2b50 4.5 stars | Must-buy list: Portable Sachet Bags, Classic Essential Oil Diffusers, Fragrant Hand Creams. Starting from a humble stall in Chatuchak Market, top-tier Thai fragrance brand Karmakamet still retains this original flagship store filled with vintage charm. The store is filled with luxurious herbal and botanical scents, complemented by exquisite packaging and long-lasting, elegant fragrances. The portable sachets are perfect for wardrobes or cars, making them a sophisticated local gift from Bangkok for friends and family.", "name": "Karmakamet Aromatics - Chatuchak Branch", "transport": "Take the MRT Blue Line to Kamphaeng Phet Station Exit 2. Walk for about 3 minutes to enter Section 2 of Chatuchak Market."}, {"address": "Section 3, Soi 44/2, Chatuchak Weekend Market, Bangkok 10900", "feature": "\u2b50 4.4 stars | Must-buy list: Sugar-free Dried Golden Mango, Freeze-dried Durian Chunks, Crispy Coconut Chips. This long-standing local dried fruit stall in Chatuchak Weekend Market is loved by both locals and foreign foodies. The shop insists on using premium local Thai fruits, producing thick, rich, naturally sweet dried fruit without adding excess white sugar. Free samples are available on-site, and the large resealable bags are hygienic and convenient, making these immensely popular addictive snacks.", "name": "Poo Preecha Dried Fruit - Chatuchak Section 3", "transport": "Take the BTS to Mo Chit Station Exit 1, or MRT to Chatuchak Park Station Exit 1, then walk about 5 minutes to enter the market."}, {"address": "1st Floor, Mixt Chatuchak, Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.3 stars | Must-buy list: Classic Thai Tea Mix Tins, Thai Milk Tea Instant Sachets, 3-in-1 Thai Tea Chews. ChaTraMue, Thailand\u0027s national heritage tea brand with an 80-year history, has an air-conditioned, boutique outlet in Mixt Chatuchak. In addition to ordering a refreshing, rich iced Thai milk tea or Thai tea soft-serve ice cream, the souvenir section is well-stocked. The classic red tea tins and the newly launched Thai tea flavored gummies are essential items for tourists to bring home.", "name": "ChaTraMue - Mixt Chatuchak", "transport": "Take the BTS to Mo Chit Station Exit 1, walk through Chatuchak Park for about 6 minutes to reach Mixt Chatuchak Shopping Mall."}, {"address": "Section 3, Soi 43/1, Chatuchak Weekend Market, Bangkok 10900", "feature": "\u2b50 4.5 stars | Must-buy list: Madame Heng Classic Herbal Soap, Collagen Anti-Aging Soap, Cooling Mint Itch-Relief Soap. Loved by both Thai royalty and locals, the famous herbal soap brand \u0027Madame Heng\u0027 has a dedicated store in Chatuchak. Their classic soap is crafted from pure vegetable oils and natural Thai herbal extracts, producing a dense, creamy lather that leaves skin refreshed without feeling tight. It is especially effective for soothing acne and heat-induced skin discomfort. The store frequently offers multi-pack deals at super affordable prices, featuring charming retro Oriental packaging.", "name": "Madame Heng Soap - Chatuchak Branch", "transport": "Take the MRT Blue Line to Kamphaeng Phet Station Exit 2, and walk for about 4 minutes to reach Section 3."}, {"address": "101 Kamphaeng Phet Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.7 stars | Must-buy list: Thai Crispy Pork Floss Rolls, Handmade Coconut Palm Sugar, Premium Spicy Fish Floss Powder. Ranked among the world\u0027s best fresh markets by CNN, Or Tor Kor Market features a dried food zone gathering North Bangkok\u0027s finest traditional Thai snacks. The pork floss rolls are crispy and flavorful, the coconut sugar is packed with pure palm and coconut aroma, and there are various vacuum-sealed Thai spices and fish floss. Exceptionally clean and bright with quality far superior to ordinary night markets, it is a secret haven for shopping premium local goods.", "name": "Or Tor Kor Market - Souvenir \u0026 Dried Food Zone", "transport": "Take the MRT Blue Line to Kamphaeng Phet Station Exit 3, which connects directly to the indoor market area."}, {"address": "G Floor, Central Ladprao, 1693 Phahonyothin Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.4 stars | Must-buy list: KUNNA Crispy Coconut Rolls, Bento Super Spicy Squid Sheets, Tao Kae Noi Seaweed Limited Tom Yum Flavor. Located inside a landmark shopping mall in North Bangkok, this upscale supermarket features a massive \u0027Must-Buy Thai Souvenir Zone\u0027. It brings together all the favorite snack brands for tourists under one roof, such as KUNNA premium dried fruits and coconut rolls, Koh-Kae peanut snacks, and Tom Yum-flavored crackers. Well-stocked, clean, and comfortable, it is perfect for a major souvenir haul at the end of your North Bangkok itinerary.", "name": "Tops Fine Food Supermarket - Central Ladprao", "transport": "Take the BTS to Ha Yaek Lat Phrao Station Exit 1 and use the skywalk directly into the mall, or take the MRT to Phahon Yothin Station Exit 3."}, {"address": "Phahonyothin Soi 7, Ari, Phaya Thai, Bangkok 10400", "feature": "\u2b50 4.5 stars | Must-buy list: Thai Pandan Coconut Sweets, Handmade Pandan Pancake Gift Boxes, Traditional Crispy Coconut Crepes. Founded in 1975, this established traditional Thai dessert shop is located in Ari, North Bangkok\u0027s trendy hipster district. Prepared fresh daily using natural pandan juice and pure coconut cream, their pandan cakes are soft, chewy, and rich with coconut flavor. The shop offers fresh handmade gift boxes ideal for taking back to your hotel or sharing as day-of gifts, making it a charming boutique you shouldn\u0027t miss for authentic Thai sweet culture.", "name": "Kanom Siam - Ari Branch", "transport": "Take the BTS to Ari Station Exit 3, turn into Phahonyothin Soi 7, and walk about 2 minutes to arrive."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1693 Phahonyothin Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.5 Stars | Must-Buy List: Lyn Thai fashion handbags, Beauty Buffet Thai milk skincare products, Everyday Karmakamet specialty fragrance sachets. As Northern Bangkok\u0027s oldest and most iconic major shopping center, this place is widely loved by local families and young people. The mall features a rich variety of counters from Thai local designer brands, offering everything from cosmetics and fragrance to trendy apparel. Compared to downtown malls, it offers a more authentic taste of everyday local shopping.", "name": "Central Plaza Lardprao", "transport": "Take the MRT to Phahon Yothin Station (Exit 3), or BTS to Ha Yeak Lat Phrao Station (Exit 1) directly connecting via skywalk."}, {"address": "54 Ladprao Soi 1, Chom Phon, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.4 Stars | Must-Buy List: Thai independent designer T-shirts, handmade woven sandals, affordable tube tops. Union Mall is a secret shopping paradise for local Bangkok students and trendy youth, packed with affordable independent boutiques and local clothing brands. The apparel cuts fit Asian body types well, trends update extremely fast, and prices are budget-friendly yet full of unique original flair\u2014perfect for travelers looking to discover local trendy outfits.", "name": "Union Mall Trendy Fashion Center (Union Mall)", "transport": "Take the MRT to Phahon Yothin Station (Exit 5) for direct access."}, {"address": "8 Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.3 Stars | Must-Buy List: Thai cultural \u0026 creative print canvas bags, handmade straw hats, natural herbal essential oil soaps. Adjacent to the Chatuchak Weekend Market, this modern air-conditioned shopping center gathers over 500 local Thai specialty shops and creative studios. When you get tired of exploring the outdoor market, you can comfortably relax in the air conditioning while browsing a variety of exquisite Thai handmade goods, original accessories, and high-quality local souvenirs.", "name": "Mixt Chatuchak Shopping Center (Mixt Chatuchak)", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 2), then walk for about 5 minutes."}, {"address": "588 Kamphaeng Phet 2 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.1 Stars | Must-Buy List: Thai herbal balm gift sets, traditional wooden handicraft carvings, Thai milk tea packets. JJ Mall is a long-standing local wholesale-style indoor mall hosting numerous traditional Thai craft, handmade merchandise, and local specialty shops. Prices are transparent and affordable, and it features full-time air conditioning, making it the best spot for buying bulk souvenirs and experiencing local wholesale shopping.", "name": "JJ Mall Chatuchak Indoor Shopping Complex (JJ Mall)", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 2), then walk for about 8 minutes."}, {"address": "511 Kamphaeng Phet 2 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.4 Stars | Must-Buy List: Vintage American secondhand leather jackets, retro vinyl records, antique Thai metal signs. This eye-catching red building is Bangkok\u0027s most iconic treasure-hunting hub for antiques and vintage items. Home to hundreds of local independent antique dealers and vintage sellers, it offers secondhand clothing, nostalgic furniture, and vinyl records from around the world and early Thailand, highly favored by local trendsetters and antique collectors.", "name": "Bangsue Junction Vintage Mall (Bangsue Junction / DD Mall)", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 1), located directly opposite."}, {"address": "162/1-2 Pracharat Sai 2 Rd, Bang Sue, Bangkok 10800", "feature": "\u2b50 4.2 Stars | Must-Buy List: Thai Mistine cosmetics series, Taokaenoi seaweed mega-packs, local Thai fragrance solid perfumes. Loved by residents of Northern Bangkok\u0027s residential areas, this is a local community shopping mall with a spacious, comfortable environment and few tourists. It houses a large supermarket and numerous local beauty and lifestyle merchandise brands, allowing you to shop comfortably at fair local prices.", "name": "Gateway Bang Sue Shopping Mall (Gateway Bang Sue)", "transport": "Take the MRT to Tao Poon Station, then transfer to a shuttle bus or walk for about 10 minutes."}, {"address": "98, 98/1 Moo 5, Bang Chalong, Bang Phli District, Samut Prakan 10540", "feature": "\u2b50 4.5 Stars | Must-Buy List: Coach classic bags at 70% off, Kate Spade discounted dresses, Jim Thompson Thai silk scarves. As Thailand\u0027s first top-tier international luxury outlet, it features a modern Thai resort architectural style. The complex houses over 130 brands including Coach, Michael Kors, Adidas, and Thailand\u0027s national treasure brand Jim Thompson, offering year-round discounts from 30% to 70% off.", "name": "Central Village Bangkok Luxury Outlet", "transport": "Take the dedicated shuttle bus from BTS Udom Suk Station or Central World."}, {"address": "989 Moo 14, Tambon Hom Sin, Amphoe Bang Pakong, Chachoengsao 24130", "feature": "\u2b50 4.6 Stars | Must-Buy List: Balenciaga discounted luxury bags, Nike limited-edition discounted sneakers, Cotton On Thailand-exclusive casual wear. Jointly created by Siam Piwat Group and an international outlet giant, it features exclusive outlet stores for many high-end luxury brands. Lush with greenery and stylish design, major international luxury brands and Thai fashion labels offer clearance deals starting from 70% off, making it a must-visit shopping paradise for branded apparel and footwear.", "name": "Siam Premium Outlets Bangkok", "transport": "Take a reserved shuttle bus from Airport Rail Link (ARL) Makkasan Station."}], "name": "Major Malls \u0026 Recommended Outlets"}}, "name": "Chatuchak \u0026 Northern Bangkok (Markets \u0026 Local Experience)"}, "chinatown": {"categories": {"cat_1": {"items": [{"address": "1st Floor, I\u0027m Chinatown Mall, 531 Charoen Krung Rd, Pom Prap, Pom Prap Sattru Phai, Bangkok 10100", "feature": "\u2b50 4.6 stars | Must-Buy List: Browit by Nongchat Waterproof Long-Lasting Eyeliner, Cathy Doll Velvet Lip Tint, Cute Press Oil-Control Sunscreen Powder. Located inside the I\u0027m Chinatown shopping mall, Beautrium is one of Thailand\u0027s most iconic local beauty retail chains. The store brings together hundreds of famous local Thai makeup and skincare brands, offering extremely competitive prices and non-stop promotions. In particular, the makeup artist brand Browit and the cute-styled Cathy Doll feature sweat-proof and oil-resistant products tailored for the Southeast Asian climate, making this a top sweep-up spot for young women and tourists.", "name": "Beautrium Beauty Flagship Store (Beautrium I\u0027m Chinatown)", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk for about 2 minutes."}, {"address": "155 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.5 stars | Must-Buy List: Natural Thai Turmeric Beautifying Powder, Special Herbal Balm, Traditional Chinese Cosmetic Pearl Powder. Founded in the 1900s, Vejpong Pharmacy is one of the most historic century-old drugstores in Chinatown. Beyond traditional Chinese herbal medicines, the shop is famous for its exclusively formulated Thai herbal facial beautifying powders. Many local women buy pure natural turmeric powder and turmeric water for DIY facial masks at home, which offer excellent oil control, anti-acne, and brightening effects\u2014a hidden local gem combining traditional wisdom with natural skincare.", "name": "Vejpong Pharmacy Yaowarat", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk along Yaowarat Road for about 5 minutes."}, {"address": "273 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.3 stars | Must-Buy List: Wat Pho Thai Herbal Balm, Golden Cup Balm, Poy-Sian Nasal Inhaler. A long-established pharmacy located on the main strip of Yaowarat Road. Operating for decades, it insists on providing high-quality traditional Thai pharmaceuticals, cosmetics, and home healthcare products. Here you can find a comprehensive selection of Thailand\u0027s most famous herbal balms, ointments, and nasal inhalers at prices more affordable than typical tourist spots. The friendly staff can communicate in Chinese and will warmly explain the efficacy of various herbal soothing products, making souvenir shopping very convenient.", "name": "Chua Ah Pharmacy Yaowarat", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk straight along Yaowarat Road for about 4 minutes."}, {"address": "223 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.2 stars | Must-Buy List: Srichand Translucent Oil Control Powder, Mistine 3D Eyebrow Pencil, Snake Brand Cooling Body Spray. Located in the heart of Chinatown, this Watsons branch features a spacious dedicated section for popular local Thai cosmetics. Fully stocked with tourist favorites like Mistine and Srichand, it frequently offers exclusive promotions like \"Buy 1 for 1 Baht More\". If you want to grab Thailand\u0027s best-selling oil-control sun protection base makeup and cooling remedies all in one stop, this is definitely the most convenient shopping spot.", "name": "Watsons Yaowarat Road", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk along Yaowarat Road for about 3 minutes."}, {"address": "438 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.1 stars | Must-Buy List: Scentio Milk Brightening Facial Foam, Scentio Q10 Milk Body Lotion, Avocado Moisturizing Body Scrub. Beauty Buffet is an iconic Thai sweet-styled cosmetics brand inspired by the concept of a \"beauty buffet\" offering a rich variety of products. The Chinatown branch features a bright and adorable decor. Its signature Scentio milk skincare series boasts a rich milk scent and exceptional moisturizing power at extremely budget-friendly prices, making it an absolute must-buy skincare gift for almost every tourist visiting Bangkok.", "name": "Beauty Buffet Yaowarat", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk along Yaowarat Road for about 6 minutes."}, {"address": "131 Charoen Krung Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.4 stars | Must-Buy List: Thanaka Whitening \u0026 Sunscreen Powder, Handmade Lemongrass Herbal Soap, Thai Herbal Foot Patches. Seng Chir Pharmacy is a traditional apothecary rooted in Chinatown for many years. Alongside professional remedies, its biggest draw for women is its rich array of natural Southeast Asian herbal beauty products. The imported Thanaka bark powder is a centuries-old natural sun protection and whitening secret passed down among Southeast Asian women; mixed with a little water, it deeply cleanses and controls oil. Their pure handmade herbal essential oil soaps are also hugely popular.", "name": "Seng Chir Pharmacy", "transport": "Take the MRT to Wat Mangkon Station, Exit 2, and walk for about 3 minutes."}, {"address": "207 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.3 stars | Must-Buy List: Boots Cucumber 3-Minute Emergency Facial Mask, Counterpain Analgesic Cream, Sabai-Arom Thai Herbal Body Care \u0026 Hand Cream. Hailing from the UK but deeply rooted in Thailand, this Boots drugstore in Chinatown specially stocks many local Thai fragrance and restorative brands. Beyond their high-CP-value in-house cucumber skincare line, this is also a fantastic spot to pick up premium local Thai fragrance brand Sabai-Arom and skin-soothing Counterpain ointments, featuring a comfortable shopping environment with clear pricing.", "name": "Boots Yaowarat", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk along Yaowarat Road for about 4 minutes."}, {"address": "Soi Wanit 1, Samphanthawong, Bangkok 10100 (Sampeng Market Zone)", "feature": "\u2b50 4.0 stars | Must-Buy List: Thai Natural Kaffir Lime Shampoo, Khaokho Talaypu Coconut Oil Body Lotion, Natural Herbal Mosquito Repellent Spray. Tucked away in the alleys of Sampeng Market next to Chinatown, this hidden beauty shop is a secret haven for local insiders buying local herbal cosmetics. Highlighting Thai smallholder farmers and local herbal brands, its prices are significantly cheaper than standard retail stores. Best-sellers include the deep oil-controlling kaffir lime scalp shampoo and the rich, naturally scented coconut oil nourishing lotion\u2014a favorite among customers seeking high value and pure natural ingredients.", "name": "Sampeng Beauty Secrets", "transport": "Take the MRT to Wat Mangkon Station, Exit 2, and walk into Soi Wanit 1 (Sampeng Lane) for about 6 minutes."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "Soi Wanit 1, Yaowarat, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade woven picnic totes, Bohemian tassel woven bags, colorful pom-pom resort-style crossbody bags. Located inside the iconic Sampeng Wholesale Market in Bangkok\u0027s Chinatown, this is a treasure trove for locals and tourists seeking straw bags. The variety of woven bags here is incredible\u2014ranging from minimalist French resort chic to playful designs adorned with traditional Thai pom-poms. Prices are far lower than city department stores, and the durable quality makes them the ultimate summer vacation accessory.", "name": "Sampeng Straw Bags \u0026 Woven Goods", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk about 7 minutes to reach the entrance of Sampeng Lane."}, {"address": "432 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade vintage cowhide messenger bags, hand-carved leather belts, genuine leather flip-flop sandals. Hidden in an old alley off Yaowarat Road, this leather specialty shop boasts decades of history and is a favorite among local leather enthusiasts. They insist on using premium cowhide and lambskin, combined with traditional Thai hand-stitching techniques, to create durable shoes and bags that gain character over time. With affordable prices and light customization services, it is a rare leather treasure trove in Chinatown.", "name": "Anek Leather Chinatown", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk about 5 minutes along Yaowarat Road."}, {"address": "Song Wat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.6 stars | Must-Buy List: Thai floral print Hawaiian shirts, American vintage canvas tote bags, vintage denim jackets. Located on Song Wat Road\u2014a trendy hotspot for hipsters in recent years\u2014this shop is housed in a renovated old mansion, blending Chinatown\u0027s nostalgic charm with modern design sensibility. It curates local Thai designer brands alongside high-quality vintage clothing. Their floral shirts, featuring local tropical flora and elements, are particularly lightweight, well-tailored, and full of distinct personality.", "name": "Song Wat Vintage \u0026 Apparel Store", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk about 10 minutes towards the Chao Phraya River to Song Wat Road."}, {"address": "Sampeng Lane, Chakkrawat, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.4 stars | Must-Buy List: Thickened breathable cotton elephant pants, handmade tie-dye linen dresses, classic Thai print short-sleeve shirts. Situated in the core wholesale area of Sampeng Lane, this shop upgrades your wardrobe beyond the flimsy night-market elephant pants. They specialize in high-grade heavy cotton and breathable rayon elephant pants, as well as cotton-linen apparel. Frequented by locals and wholesalers, their unique patterns prevent fashion clashes. Cool, comfortable, and tailored to modern aesthetics, these are essential purchases in Chinatown.", "name": "Sampeng Elephant Pants \u0026 Cotton Apparel", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk about 8 minutes into Sampeng Lane."}, {"address": "Charoen Krung Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.2 stars | Must-Buy List: Thai silk geometric pattern handkerchiefs, handmade batik canvas tote bags, Thai embroidered zipper makeup pouches. Located at the intersection of Charoen Krung Road and Chinatown, this store specializes in traditional Thai silk and handcrafted textiles. By combining traditional silk craftsmanship with contemporary bag designs, they offer lightweight, stylish handbags and silk scarves. With exquisite weaves and superb tactile quality, these items make ideal high-quality souvenirs or chic everyday accessories.", "name": "Chao Phraya Thai Silk \u0026 Accessories", "transport": "Take the MRT to Wat Mangkon Station, Exit 3, and walk about 3 minutes."}, {"address": "Ratchawong Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.1 stars | Must-Buy List: Thai natural soft-rubber sole sandals, handmade woven straw shoes, Thai floral canvas casual shoes. Located in the shoe wholesale cluster near Sampeng Market, this shop is well-known for comfortable, Thai-made footwear. The best-sellers are sandals and slippers made from high-quality natural Thai rubber, offering great comfort, slip resistance, and durability. They also carry canvas and woven shoes featuring Thai textile designs at exceptional value, making it a favorite among local families and students.", "name": "Sampeng Wholesale Shoes Center", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk about 8 minutes along Ratchawong Road."}, {"address": "Phahurat Rd, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.3 stars | Must-Buy List: Northern Thai tribal embroidered bags, handmade beaded coin purses, Bohemian bucket bags. Situated where Chinatown meets Phahurat (Little India), this shop brings together exquisite embroidery from Northern Thai artisans. Adorned with intricate traditional geometric motifs and hand-beading, almost every piece is one of a kind. Rich in ethnic flair yet effortlessly stylish, it is a must-visit destination for anyone seeking unique accessories.", "name": "Phahurat Thai Craft \u0026 Bag Shop", "transport": "Take the MRT to Sam Yot Station, Exit 1, and walk about 6 minutes."}, {"address": "Song Wat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.7 stars | Must-Buy List: Minimalist vegetable-tanned leather cardholders, hipster two-tone canvas drawstring bags, independent designer original T-shirts. Located in the heart of the Song Wat Creative District, this boutique combines a leather workshop with curated apparel, founded by emerging young Thai designers. The products highlight clean geometric lines and earth tones, crafted from high-grade vegetable-tanned leather and organic cotton fabric with meticulous attention to detail. It is a highly recommended shopping landmark among Thailand\u0027s new generation of hipsters and trendsetters.", "name": "Song Wat Craft \u0026 Leather Lab", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk about 10 minutes to Song Wat Road."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "390 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.5 stars | Must-Buy List: Crispy Pork Jerky, Pork Floss Rice Crackers, Spicy Shredded Squid. This is one of the most iconic decades-old souvenir shops in Bangkok\u0027s Chinatown, a must-visit for locals and international tourists alike on Yaowarat Road. Their signature crispy pork jerky is baked to perfection\u2014crunchy and non-greasy\u2014while the pork floss rice crackers combine crispy fragrant rice with savory pork floss for a wonderful layered texture. It\u0027s the top choice for gifts or personal enjoyment.", "name": "Lim Jing Hieng Main Shop", "transport": "About a 5-minute walk from Exit 1 of MRT Wat Mangkon Station"}, {"address": "387 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional Teochew Mung Bean Pastry, Taro Paste \u0026 Egg Yolk Pastry, Layered Sun Cake. A century-old traditional Teochew bakery that strictly adheres to ancient handmade methods. The mung bean pastry features a thin crust packed with meltingly soft filling, while the taro paste \u0026 egg yolk pastry blends sweet and savory flavors with a rich aroma. It perfectly preserves the classic taste brought to Bangkok by early Teochew immigrants, making it ideal for travelers who love nostalgic treats.", "name": "Tae Meng Seng Bakery", "transport": "About a 4-minute walk from Exit 1 of MRT Wat Mangkon Station"}, {"address": "428 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.6 stars | Must-Buy List: Pho Yok Herbal Balm, Siang Pure Oil, Takabb Anti-Cough Pills. Located in the heart of Chinatown, this century-old Chinese pharmacy preserves historical wooden cabinets and traditional medicine-dispensing tools. It sells Thailand\u0027s most famous home remedies and herbal balms with guaranteed quality, making it a popular spot for tourists looking to buy souvenirs in bulk.", "name": "Kwong On Tong Pharmacy", "transport": "About a 6-minute walk from Exit 1 of MRT Wat Mangkon Station"}, {"address": "103 Phat Sai, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.3 stars | Must-Buy List: Traditionally Roasted Coffee Beans, Traditional Thai Black Tea Leaves, Condensed Milk Coffee Powder. With nearly a century of history, Eiah Sae is one of Bangkok\u0027s oldest Thai coffee shops. Its signature black coffee and Thai milk tea are deeply loved by old neighborhood locals. They sell home-roasted traditional coffee beans and tea bags, allowing visitors to bring home the authentic, rich old-school Chinatown coffee to brew themselves.", "name": "Eiah Sae Classic Coffee", "transport": "About a 5-minute walk from Exit 2 of MRT Wat Mangkon Station"}, {"address": "406 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.2 stars | Must-Buy List: High-Mountain Oolong Tea Cakes, Local Thai Herbal Pu-erh Tea, Teochew Jasmine Tea. This historic traditional tea shop specializes in high-quality Chinese teas and Thai high-mountain teas, filling the air with a quaint tea aroma. The owner is well-versed in tea arts and warmly hosts tea tastings and introductions for guests. Their charmingly retro-packaged high-mountain tea cakes and selected herbal teas make excellent gifts for elders and tea enthusiasts.", "name": "Sam Hea Tea Shop", "transport": "About a 5-minute walk from Exit 1 of MRT Wat Mangkon Station"}, {"address": "326 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.3 stars | Must-Buy List: Crispy Spicy Pork Rolls, Thai Lemongrass Cashews, Crispy Coconut Chips. This long-standing specialty shop is famous for its homemade jerkies and nut snacks. The spicy pork rolls infused with Thai spices and Tom Yum flavored cashews stand out in particular, offering fantastic taste with authentic Thai flair at affordable prices. They are incredibly addictive snacks and wildly popular gifts among tourists.", "name": "Hap Kee Pork Floss \u0026 Souvenir Shop", "transport": "About a 7-minute walk from Exit 1 of MRT Wat Mangkon Station"}, {"address": "221 Soi Wanit 1, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.5 stars | Must-Buy List: Freeze-Dried Monthong Durian, Premium Unsweetened Dried Mango, Thai Sweet \u0026 Spicy Tamarind Soft Candy. Tucked away inside Sampeng Market, this traditional dried fruit shop specializes in premium Thai dried fruits and retro snacks. The dried fruits here are fresh and more wallet-friendly than those in tourist supermarkets. The freeze-dried Monthong durian boasts an intensely rich aroma, making this a secret shopping spot for savvy travelers.", "name": "Chai Chin Lien Dried Fruit \u0026 Snacks", "transport": "About a 6-minute walk from Exit 2 of MRT Wat Mangkon Station"}, {"address": "440 Yaowarat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.4 stars | Must-Buy List: Tieguanyin Gift Box, Northern Thai Jin Xuan Oolong Tea, Premium Chrysanthemum Tea Bricks. Passed down through generations, this traditional tea shop is lined with large tin tea canisters, brimming with rich old Chinatown charm. They carefully select high-mountain teas from Chiang Rai in Northern Thailand alongside premium imported teas, thoughtfully packaged in beautiful tin gift boxes that make exquisite high-end presents.", "name": "Tan Yueh Heang Tea Shop", "transport": "About a 6-minute walk from Exit 1 of MRT Wat Mangkon Station"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "531 Charoen Krung Rd, Pom Prap, Pom Prap Sattru Phai, Bangkok 10100", "feature": "\u2b50 4.3 stars | Must-buy list: Thai herbal balm gift sets, traditional heritage mung bean cakes, Thai milk tea merchandise. A modern mixed-use shopping center located right in the heart of Chinatown, seamlessly blending traditional and contemporary styles. Housing numerous local Thai brands and famous heritage food stalls, it is the perfect spot for travelers to pick up unique souvenirs and enjoy air-conditioned dining on a hot afternoon.", "name": "I\u0027m Chinatown Shopping Center", "transport": "Take the MRT to Wat Mangkon Station, Exit 1, and walk for about 1 minute."}, {"address": "12 Triphet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.4 stars | Must-buy list: Handmade Thai silk scarves, traditional Thai golden thread desserts (Thong Yip), classic Thai print fabrics. Brimming with vintage colonial-style architecture, this iconic shopping center is a historic Bangkok landmark. The central atrium on the ground floor features a dedicated traditional Thai dessert area, along with local independent tailor shops and specialized Thai silk stores. It is deeply loved by locals who appreciate traditional culture and vintage handicrafts.", "name": "The Old Siam Plaza", "transport": "Take the MRT to Sam Yot Station, Exit 3, and walk for about 5 minutes."}, {"address": "900 Maha Chai Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.5 stars | Must-buy list: Limited-edition Thai original figures, retro gaming consoles, Thai anime design merch. This multi-story specialty mall is a mecca for Bangkok\u0027s anime enthusiasts and toy collectors, housing hundreds of local independent hobby shops and video game vendors. While not a traditional department store, it showcases the most authentic Bangkok subculture and the pure joy of toy shopping.", "name": "Mega Plaza Saphan Lek", "transport": "Take the MRT to Sam Yot Station, Exit 1, and walk for about 3 minutes."}, {"address": "23 Soi Charoen Krung 24, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.6 stars | Must-buy list: Thai contemporary artists\u0027 creative merchandise, vintage Southeast Asian carved ornaments, exquisite handmade scented candles. Located along the Chao Phraya River on the edge of Chinatown, this is Bangkok\u0027s premier shopping center for antiques and contemporary art. It features numerous galleries showcasing emerging local designers alongside exclusive boutiques, offering an elegant atmosphere rich in cultural depth.", "name": "River City Bangkok", "transport": "Take the Chao Phraya Tourist Boat to Si Phraya Pier and walk for 2 minutes, or take a taxi from MRT Hua Lamphong Station for about 5 minutes."}, {"address": "Soi Wanit 1, Yaowarat, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.3 stars | Must-buy list: Affordable hand-woven bags, Thai creative hair accessories, elephant print handmade tote bags. Situated in the heart of the famous Sampheng Lane wholesale market, this indoor mall offers a cool shopping environment filled with countless local craft and accessory shops. It is the top choice for bargain hunting and purchasing Thai-style souvenirs in bulk.", "name": "Sampheng Wholesale Center", "transport": "Take the MRT to Wat Mangkon Station and walk for about 7 minutes into Sampheng Lane."}, {"address": "561 Chakra Phet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.1 stars | Must-buy list: Indian-style hand-embroidered bags, Thai-Indian fusion patterned fabrics, exotic fragrance oils. Located in Little India (Phahurat) right next to Chinatown, this authentic themed shopping center specializes in textiles and unique accessories, featuring handicrafts and distinct fabrics rich in local multicultural flair.", "name": "India Emporium Phahurat", "transport": "Take the MRT to Sam Yot Station and walk for about 6 minutes."}, {"address": "989 Moo 14, Tambon Bang Sao Thong, Amphoe Bang Sao Thong, Samut Prakan 10570", "feature": "\u2b50 4.5 stars | Must-buy list: Jim Thompson Thai silk discounted accessories, classic Coach leather bags, Nike discounted sneakers. Thailand\u0027s premier international open-air outlet village, featuring numerous luxury and top local brands offering discounts from 30% to 70% off. It is the top outlet destination in Bangkok for luxury items and premium local Thai silk brands.", "name": "Siam Premium Outlets Bangkok", "transport": "Take the direct shuttle bus from CentralWorld or Makkasan Station (connecting MRT and Airport Rail Link)."}, {"address": "98, 98/1 Moo 5, Bang Chalong, Bang Phli District, Samut Prakan 10540", "feature": "\u2b50 4.4 stars | Must-buy list: Discounted NaRaYa Bangkok bags, Marimekko graphic print tote bags, Kate Spade designer wallets. A luxury outlet village near Bangkok\u0027s Suvarnabhumi Airport featuring a modern Thai village design. It houses hundreds of international and Thai designer brands, offering huge discounts in a beautiful shopping setting.", "name": "Central Village Luxury Outlet", "transport": "Take the free shuttle bus from BTS Udom Suk Station, or take a taxi directly from central Bangkok."}], "name": "Major Malls \u0026 Recommended Outlets"}}, "name": "Chinatown (Food \u0026 Culture)"}, "rattanakosin": {"categories": {"cat_1": {"items": [{"address": "1/11 Trok Mahathat, Maharaj Road, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.1 stars | Situated along the Chao Phraya River, Tha Maharaj is a creative lifestyle mall blending rich historical charm with modern flair. It features an array of boutique shops, specialty restaurants, cozy cafes, and art galleries, offering visitors a relaxed setting for shopping and dining. Enjoy riverside views, indulge in delicious meals, and shop for unique souvenirs or local handicrafts. It\u0027s more than just a retail hub\u2014it\u0027s a vibrant space for cultural exchange and relaxation, perfect for unwinding after exploring nearby temples.", "name": "Tha Maharaj", "transport": "Take the Chao Phraya Tourist Boat to Tha Maharaj Pier; or take a local bus, taxi, or tuk-tuk."}, {"address": "12 Tri Phet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 3.9 stars | The Old Siam Plaza is a nostalgic indoor shopping complex set in the heart of Bangkok\u0027s Old Town. Renowned for its selection of traditional Thai apparel, silk, fine jewelry, gold, and crafts, it is the ultimate destination for authentic Thai goods. The mall also houses a bustling food court serving classic street snacks and traditional desserts, allowing visitors to savor authentic flavors while shopping. Stepping inside feels like traveling back in time to historic Bangkok, offering a unique local cultural shopping experience.", "name": "The Old Siam Plaza", "transport": "Take the Bangkok MRT to Sam Yot Station (Exit 3); or take a local bus, taxi, or tuk-tuk."}, {"address": "900 Maha Chai Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.0 stars | A unique shopping complex in Bangkok\u0027s Old Town, Mega Plaza Wang Burapha is famous for its vast collection of toys, action figures, video games, cameras, and pop culture collectibles. Hailed as a paradise for toy enthusiasts, it offers everything from vintage retro toys to the latest anime figurines. Spread across multiple floors, shops here sell various electronics, camera gear, and gaming merch, making it an ideal treasure hunt location for niche collectors and tech enthusiasts.", "name": "Mega Plaza Wang Burapha", "transport": "Take the Bangkok MRT to Sam Yot Station (Exit 3); or take a local bus, taxi, or tuk-tuk."}, {"address": "174 Chak Phet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.1 stars | Yodpiman River Walk is a picturesque waterfront lifestyle mall adjacent to the famous Pak Khlong Talat flower market. Featuring classic colonial-style architecture, it offers a variety of shops, restaurants, and cafes where visitors can dine while taking in stunning views of the Chao Phraya River and Wat Arun on the opposite bank. Packed with charming shops selling souvenirs and local goods, it\u0027s a delightful spot to experience Bangkok\u0027s riverside ambiance, especially at night when beautiful illumination adds a romantic touch.", "name": "Yodpiman River Walk", "transport": "Take the Chao Phraya Tourist Boat to Yodpiman Pier; take the Bangkok MRT to Sanam Chai Station (Exit 5); or take a local bus, taxi, or tuk-tuk."}, {"address": "23 Charoenkrung 30, Si Phraya Pier, Yota Rd, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.3 stars | River City Bangkok is the premier art and antiques center in the city, beautifully located along the Chao Phraya River. This multi-story complex houses numerous antique shops, art galleries, auction houses, and boutiques specializing in exquisite Thai and Asian artworks, antiques, jewelry, and crafts. Hosting regular art exhibitions and cultural events, it\u0027s a must-visit destination for art lovers and collectors alike. Fine dining options are also available for guests looking to savor gourmet dishes alongside stunning art.", "name": "River City Bangkok", "transport": "Take the Chao Phraya Tourist Boat to Si Phraya Pier; take the BTS Skytrain to Saphan Taksin Station and transfer to a shuttle boat; or take a local bus, taxi, or tuk-tuk."}, {"address": "Arun Amarin Rd, Siriraj, Bangkok Noi, Bangkok 10700", "feature": "\u2b50 4.2 stars | Located on the west bank of the Chao Phraya River, Wang Lang Market is a lively traditional market immensely popular among locals. Famous for its incredible variety of mouthwatering street food, budget fashion, and daily goods, its massive scale and dense web of stalls turn it into a major shopping destination. Steeping in authentic local vibes, it offers visitors the chance to taste delicious Thai snacks, browse trendy clothes and accessories, and immerse themselves in genuine Bangkok daily life.", "name": "Wang Lang Market", "transport": "Take the Chao Phraya Tourist Boat to Wang Lang Pier; or take a local bus, taxi, or tuk-tuk."}, {"address": "116 Chak Phet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.4 stars | Pak Khlong Talat is Bangkok\u0027s largest 24-hour wholesale and retail flower market, located on the edge of Rattanakosin Island. It is a vibrant sensory feast overflowing with colorful blooms, floral garlands, and ornamental plants sourced from Thailand and across the globe. While fresh flowers take center stage, surrounding stalls sell gardening supplies, local treats, and souvenirs. Buzzing with energy day and night, it\u0027s a fantastic spot for photography and experiencing a unique side of local culture.", "name": "Pak Khlong Talat (Flower Market)", "transport": "Take the Bangkok MRT to Sanam Chai Station (Exit 5); take the Chao Phraya Tourist Boat to Yodpiman Pier; or take a local bus, taxi, or tuk-tuk."}, {"address": "Chak Phet Rd, Chakkrawat, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.0 stars | Nestled in the heart of Bangkok\u0027s Chinatown, Sampheng Market is a bustling, historic wholesale and retail market. Famous for its maze-like narrow alleyways tightly packed with stalls, it offers a bewildering range of products\u2014from textiles, stationery, and toys to fashion accessories and homeware\u2014all at bargain prices. While not a modern shopping mall, its massive sheer volume of goods and bustling atmosphere make it a giant shopping destination in its own right. Full of energy and noise, it\u0027s the ultimate spot to hunt for bargains and experience authentic market culture.", "name": "Sampheng Wholesale Market", "transport": "Take the Bangkok MRT to Sam Yot Station (Exit 1); or take a local bus, taxi, or tuk-tuk."}], "name": "Shopping Malls \u0026 Complexes"}, "cat_2": {"items": [{"address": "116 Chak Phet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.3 Stars | Bangkok\u0027s most famous 24-hour wholesale flower market, bursting with vibrant colors and fragrant aromas, making it a paradise for photography enthusiasts. It offers not only a wide variety of fresh flowers, garlands, and ceremonial offerings, but is also a fantastic place to experience local culture and daily life. Whether it\u0027s the morning hustle of wholesalers or the romantic ambiance illuminated by lights at night, the market exudes a unique charm. Visitors can buy fresh bouquets or watch skilled florists craft intricate floral garlands, showcasing the Thai people\u0027s passion and devotion to flowers. The market also features small food stalls serving simple local meals and drinks to enjoy while exploring.", "name": "Pak Khlong Talat (Flower Market)", "transport": "Take the Chao Phraya Tourist Boat to Yodpiman River Walk Pier and walk from there; or take a taxi/Tuk-Tuk."}, {"address": "Maha Rat Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.0 Stars | Located near Wat Phra Kaew, this is Bangkok\u0027s oldest and largest amulet market. Hundreds of stalls gather here selling various Buddhist amulets, talismans, statues, and religious items. For visitors interested in Thai Buddhist culture, this is a treasure trove full of mystery and history. Experienced appraisers carefully inspect the authenticity and value of the amulets, attracting collectors and devotees on treasure hunts. Even if you don\u0027t buy anything, simply wandering through and observing people\u0027s devotion and passion for amulets is a unique cultural experience.", "name": "Amulet Market (Talat Phra Khrueang)", "transport": "Take the Chao Phraya Tourist Boat to Tha Chang Pier and walk about 5-10 minutes; or take a taxi/Tuk-Tuk."}, {"address": "Khao San Rd, Talat Yot, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 3.9 Stars | Bangkok\u0027s most famous backpacker haven\u2014a bustling market by day and a wild party spot by night. Innumerable stalls sell everything from unique Thai handicrafts, souvenirs, T-shirts, and sarong pants to second-hand books and jewelry. Many small shops also offer exotic services like tattoos and hair braiding. Although famous for its nightlife, daytime Khao San Road is also a great location for finding unique items and experiencing street culture. Prices here are relatively affordable, making it a great spot for souvenirs and street shopping fun.", "name": "Khao San Road", "transport": "No direct MRT/BTS. It is recommended to take a taxi/Tuk-Tuk, or take the Chao Phraya Tourist Boat to Phra Athit Pier and walk for about 10-15 minutes."}, {"address": "Thanon Rambutri, Talat Yot, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.2 Stars | Adjacent to Khao San Road, yet possessing a completely different vibe. Rambuttri Alley is much more laid-back and lush with greenery, known as Khao San\u0027s \u0027sister street\u0027. It features unique boutiques, handicraft shops, independent designer clothing stores, and cozy cafes. Compared to the hustle of Khao San, Rambuttri offers a quieter and more refined shopping experience. Visitors can find unique souvenirs, handmade jewelry, and local artists\u0027 works. At night, lights illuminate both sides of the alley, creating a romantic atmosphere perfect for strolling, dining, and treasure hunting.", "name": "Rambuttri Alley", "transport": "No direct MRT/BTS. It is recommended to take a taxi/Tuk-Tuk, or take the Chao Phraya Tourist Boat to Phra Athit Pier and walk for about 5-10 minutes."}, {"address": "Maha Rat Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.1 Stars | Located opposite Wat Pho, this traditional market sits along the banks of the Chao Phraya River. It is famous for dried goods, spices, dried seafood, and local snacks. Though compact, it is rich with local life. Visitors can find unique Thai spices, herbs, and traditional snacks, making it an ideal place to experience daily life in Bangkok\u0027s Old City. Surrounding the market are charming vintage cafes and restaurants offering riverside dining. For visitors who love exploring local culture and specialty ingredients, Tha Tien Market is well worth a visit.", "name": "Tha Tien Market", "transport": "Take the Chao Phraya Tourist Boat to Tha Tien Pier and walk right out; or take a taxi/Tuk-Tuk."}, {"address": "12 Tri Phet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.0 Stars | Located in the heart of Bangkok\u0027s Old City, this indoor shopping mall features Rattanakosin-style architecture. It houses specialized shops selling traditional Thai attire, silk, jewelry, handicrafts, and antiques. The interior design is elegant, making you feel as though you\u0027ve traveled back in time to old Siam. The \u0027Wedding Street\u0027 on the second floor is particularly notable, featuring shops dedicated to traditional Thai wedding garments and accessories. It also boasts a food court serving authentic Thai snacks and desserts. A must-visit spot for those seeking high-quality traditional Thai goods or a vintage shopping ambiance.", "name": "The Old Siam Plaza", "transport": "Take the MRT Blue Line to Sam Yot Station and walk about 5 minutes; or take a taxi/Tuk-Tuk."}, {"address": "Khlong Ong Ang, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.4 Stars | A successful canal revitalization project by the Bangkok Metropolitan Administration, open every weekend (Friday to Sunday). Stretching along both banks of Khlong Ong Ang, this walking street is famous for vibrant street art murals, creative craft stalls, and food vendors. Visitors can admire street graffiti rich in Thai cultural elements while shopping for unique handmade crafts, apparel, and souvenirs from local designers. At night, lights illuminate the canal and street performers entertain, creating a lively and energetic atmosphere. It is not only a great shopping spot but also a creative space blending old and new Bangkok culture.", "name": "Khlong Ong Ang Walking Street", "transport": "Take the MRT Blue Line to Sam Yot Station, right outside the station; or take a taxi/Tuk-Tuk."}, {"address": "1/11 Trok Mahathat, Maharaj Road, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.2 Stars | Located along the Chao Phraya River, this lifestyle market blends historical heritage with modern aesthetics. It houses charming boutique select shops, trendy fashion stores, independent designer brands, cafes, and restaurants. While modern, its architecture incorporates traditional Thai elements and offers breathtaking riverside views. Visitors can discover unique clothing, accessories, home decor, and art while enjoying a relaxed shopping experience. It also serves as a transit hub for attractions like Wat Pho and Wat Arun, making it ideal for relaxing, dining, and treasure hunting after sightseeing.", "name": "Tha Maharaj", "transport": "Take the Chao Phraya Tourist Boat to Tha Maharaj Pier and walk right out; or take a taxi/Tuk-Tuk."}], "name": "Specialty Markets \u0026 Select Shops"}, "cat_3": {"items": [{"address": "Museum Siam, 4 Sanam Chai Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.5 stars | Located inside the historical Museum Siam, this shop offers a curated selection of unique souvenirs that perfectly blend Thai history, culture, and modern design. From exquisite Thai silk products, traditional handicrafts, books, and stationery to educational children\u0027s toys, every item is strictly selected for top quality, with many featuring unique museum design elements. It\u0027s an ideal place to find high-quality souvenirs with a story. These products are not only beautiful but also carry Thailand\u0027s rich cultural heritage, making your gifts even more meaningful. The comfortable shop environment and friendly staff ensure a pleasant shopping experience.", "name": "Museum Siam Shop", "transport": "Take the MRT Blue Line to Sanam Chai Station and exit at Exit 1; the museum is located right outside."}, {"address": "Rattanakosin Exhibition Hall, 100 Ratchadamnoen Klang Rd, Wat Bowon Niwet, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.3 stars | Nestled inside the Rattanakosin Exhibition Hall, this shop is a great spot to pick up distinctive souvenirs after exploring the history and culture of Bangkok\u0027s Old City. Inspired by the history, art, and architecture of the Rattanakosin Era, the shop offers a wide variety of creative products, including exquisite postcards, books, traditional pattern textiles, small replica Buddha statues, and other souvenirs with a Thai royal touch. The unique, educational designs make it the best way to bring Bangkok\u0027s rich history home while supporting local cultural institutions.", "name": "Rattanakosin Exhibition Hall Shop", "transport": "Take the BTS Skytrain to Victory Monument Station, then transfer to a taxi or bus; or take the Chao Phraya Tourist Boat to N13 Phra Arthit Pier and walk about 15 minutes."}, {"address": "The Old Siam Plaza, 12 Tri Phet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.0 stars | The Old Siam Plaza is an indoor shopping mall located in Bangkok\u0027s Old City, famous for its traditional Thai architecture and a wide variety of traditional goods. Rather than a single store, it gathers numerous small shops specializing in traditional Thai clothing, handicrafts, jewelry, Thai silk, as well as various traditional Thai snacks and desserts. If you are looking for authentic Thai souvenirs like delicate Thai pastries, spices, herbal products, or traditional accessories, this is a true treasure trove. The plaza also features a food court where you can savor local Thai flavors after shopping.", "name": "The Old Siam Plaza", "transport": "Take the MRT Blue Line to Sanam Chai Station and walk for about 10-15 minutes."}, {"address": "Wang Lang Market, Arun Amarin Rd, Siriraj, Bangkok Noi, Bangkok 10700, Thailand", "feature": "\u2b50 4.2 stars | Although located across the Chao Phraya River, Wang Lang Market is a local treasure easily accessible via ferry from the Rattanakosin area. This bustling market is renowned for its diverse array of goods and authentic local atmosphere. Beyond delicious food and apparel, you\u0027ll find unique handicrafts, locally designed accessories, second-hand items, and quirky knick-knacks\u2014perfect for hunting down non-mainstream, local souvenirs. Prices here are generally more affordable than in tourist areas, making it a great place to experience local culture and go bargain hunting. Bring cash and enjoy exploring its labyrinthine alleys!", "name": "Wang Lang Market", "transport": "Take a cross-river ferry from Tha Chang Pier or Tha Maharaj Pier in the Rattanakosin area to Wang Lang Pier."}, {"address": "Pak Khlong Talat, Chak Phet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200, Thailand (Surrounding Alleys)", "feature": "\u2b50 3.9 stars | Bangkok\u0027s famous flower market, Pak Khlong Talat, is not only an ocean of blooms but also home to hidden small shops in the surrounding alleys selling unique gifts and souvenirs. These shops usually specialize in items related to flowers, fragrances, and traditional rituals, such as exquisite Thai scented candles, handmade soaps, sachets, mini replicas of traditional flower garlands (Phuang Malai), as well as various Buddhist items and blessing trinkets. Here, you can find gifts steeped in Thai culture and pleasant aromas\u2014an ideal way to bring home the fragrance and beauty of Thailand. Many items are handmade and one-of-a-kind.", "name": "Craft Shops around Pak Khlong Talat", "transport": "Take the MRT Blue Line to Sanam Chai Station and walk about 5-10 minutes to reach the Flower Market; surrounding shops are scattered throughout the nearby alleys."}, {"address": "Thai Nakorn, 100/1-2 Tanao Rd, Wat Bowon Niwet, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.1 stars | Thai Nakorn is a historic shop specializing in traditional Thai musical instruments and related crafts. For travelers seeking unique souvenirs with cultural depth, this is a must-visit spot. The store displays a wide array of traditional Thai instruments such as the Ranat (xylophone), Khong Wong (gong circle), and Saw Duang (two-stringed fiddle). Even if you don\u0027t buy an actual instrument, you can find miniature instrument models, instrument-shaped ornaments, and other handicrafts related to Thai musical culture. These beautifully crafted items carry Thailand\u0027s rich artistic tradition, making them excellent gifts for music lovers or cultural explorers.", "name": "Thai Nakorn", "transport": "Take the Chao Phraya Tourist Boat to N13 Phra Arthit Pier and walk about 10-15 minutes, or walk about 5-10 minutes from Khaosan Road."}, {"address": "Loong Yai\u0027s Shop, 100/1 Tanao Rd, Wat Bowon Niwet, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.4 stars | Loong Yai\u0027s Shop is a beloved traditional grocery shop among locals in Bangkok\u0027s Old City, famous for selling authentic Thai snacks, dry goods, and regional specialties. The shop offers a wide variety of goods ranging from traditional Thai sweets, savory snacks, various spices, and herbal teas to locally made sauces. Many products are homemade or sourced from small farmers across Thailand, offering fresh quality and pure flavors. If you want to bring home souvenirs that truly represent everyday Thai food culture, Loong Yai\u0027s Shop is definitely worth exploring. The warm, friendly owner is always happy to introduce various specialty products.", "name": "Loong Yai\u0027s Shop", "transport": "Walk about 5-10 minutes from Khaosan Road, or take the Chao Phraya Tourist Boat to N13 Phra Arthit Pier and walk about 10-15 minutes."}, {"address": "Lim Kwong Meng, 370 Yaowarat Rd, Samphanthawong, Bangkok 10100, Thailand", "feature": "\u2b50 4.2 stars | Located in Bangkok\u0027s Chinatown (Yaowarat), Lim Kwong Meng is a long-standing traditional Chinese pastry shop. Although Chinatown lies slightly beyond the strict boundary of Rattanakosin Island, its history and culture are deeply connected, making it a popular destination for unique souvenirs. The shop is famous for its handmade Chinese pastries and cookies\u2014such as mooncakes, sweetheart cakes, and pineapple cakes\u2014featuring authentic flavors and quality ingredients. Many local Chinese-Thais visit specifically to buy treats for festive gifts or daily snacks. Beautifully packaged, these pastries make fantastic souvenirs to share the traditional flavors of Thai-Chinese heritage with family and friends.", "name": "Lim Kwong Meng Pastry Shop", "transport": "Take the MRT Blue Line to Hua Lamphong Station and walk about 15-20 minutes into Chinatown, or take the Chao Phraya Tourist Boat to N5 Ratchawongse Pier and walk about 10 minutes."}], "name": "Famous Souvenir \u0026 Gift Shops"}, "cat_4": {"items": [{"address": "12 Tri Phet Rd, Wang Burapha, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.0 stars | One of the few large shopping centers in Bangkok\u0027s Rattanakosin district, famous for its classic Thai architectural style and abundant traditional goods. It features a wide array of traditional Thai clothing, silk, jewelry, handicrafts, and wedding supplies. The traditional Thai attire shops on the second floor are especially notable, offering exquisite Thai gowns and everyday wear\u2014a perfect spot for unique Thai fashion. Furthermore, the mall houses numerous gold shops and jewelers, making it a popular spot for gold and gem purchases. More than just a shopping destination, it feels like a museum showcasing traditional Thai culture and lifestyle, allowing visitors to immerse themselves in Thailand\u0027s historical charm while shopping.", "name": "The Old Siam Plaza", "transport": "Take the MRT Blue Line to Sam Yot Station (BL30), then walk for about 5-10 minutes."}, {"address": "Chak Phet Rd, Wang Burapha, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.2 stars | Known as Bangkok\u0027s \u0027Little India,\u0027 this is Thailand\u0027s largest wholesale and retail center for Indian textiles and apparel. Rich with authentic Indian flair, it offers everything from colorful sarees and traditional Indian attire to embroidered fabrics, fine jewelry, and exotic spices. Whether you\u0027re looking for unique Indian fashion pieces or tailor-made traditional outfits, Phahurat has you covered. Numerous tailor shops offer quick and reasonably priced custom tailoring. It\u0027s not just a shopping paradise, but also a fantastic spot to experience cultural fusion that makes you feel like you\u0027ve stepped into a bustling market in India.", "name": "Phahurat Market (Little India)", "transport": "Take the MRT Blue Line to Sam Yot Station (BL30), then walk for about 5 minutes."}, {"address": "Chak Phet Rd, Wang Burapha, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 3.8 stars | Located near Phahurat Market, this historic traditional market is famous for its wide variety of clothing, accessories, and daily necessities. The selection is vast, ranging from affordable trendy clothes, shoes, and bags to various accessories and cosmetics. Saphan Han Market attracts crowds of locals and tourists with its budget-friendly prices and diverse choices. While not home to high-end brands, the items closely follow local trends, making it a great place to find affordable yet stylish local Thai designs and trendy pieces. The lively atmosphere makes it an excellent spot to experience local Bangkok life and the fun of shopping.", "name": "Saphan Han Market", "transport": "Take the MRT Blue Line to Sam Yot Station (BL30), then walk for about 5-10 minutes."}, {"address": "Krung Kasem Rd, Khlong Maha Nak, Pom Prap Sattru Phai, Bangkok 10100", "feature": "\u2b50 3.9 stars | One of Bangkok\u0027s largest garment wholesale markets, Bo Bae primarily focuses on wholesale, though many vendors also offer retail. The variety of items is incredibly vast, featuring infant clothing, kids\u0027 wear, men\u0027s and women\u0027s apparel, sleepwear, uniforms, and accessories at very affordable prices. Bo Bae Market attracts vendors and budget-conscious shoppers with its exceptional value. If you want to buy clothes in bulk at wholesale prices or find unique, reasonably priced local Thai designs, this is the place to go. The market features both indoor and outdoor areas with varying day and night operating hours and selections, so arriving early is recommended to avoid the crowds.", "name": "Bo Bae Market", "transport": "Take the Khlong Saen Saep Express Boat to Bo Bae Station, or take a taxi/Grab."}, {"address": "Khao San Rd, Talat Yot, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.1 stars | While world-famous as a backpacker paradise, Khao San Road and its surrounding area are also packed with unique fashion boutiques and street stalls. The clothing styles are eclectic, featuring bohemian wear, traditional Thai pattern apparel, handmade T-shirts, and various accessories, bags, and shoes\u2014all bursting with a carefree, exotic vibe. Many vendors sell pieces created by local designers or handcrafted items, making them truly distinctive. Visitors can find affordable, character-filled fashion items here as unique travel keepsakes. Khao San Road gets exceptionally lively at night, allowing you to shop while enjoying Bangkok\u0027s vibrant nightlife.", "name": "Khao San Road", "transport": "No direct MRT/BTS access. It is recommended to take a taxi/Grab, or take the Chao Phraya Express Boat to Phra Arthit Pier and walk from there."}, {"address": "1/11 Trok Maharat, Maharaj Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.0 stars | A lifestyle and creative community hub located along the Chao Phraya River, Tha Maharaj is relatively compact yet home to charming design shops, cozy cafes, and restaurants. The shopping experience leans toward boutiques and lifestyle products, where you can discover unique Thai designer clothing, handmade accessories, stationery, and home decor. Tha Maharaj offers a relaxed and pleasant vibe, making it an ideal spot to escape the city hustle and enjoy riverside views. While not a traditional department store, its curated selection and refined shopping environment make it a great place for distinctive fashion items and gifts.", "name": "Tha Maharaj", "transport": "Take the Chao Phraya Express Boat to Tha Maharaj Pier (N10)."}, {"address": "Chak Phet Rd, Wang Burapha, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.3 stars | Bangkok\u0027s largest 24-hour flower market. While famous for fresh blooms, its surrounding areas and select stalls also sell clothing and accessories related to festivals and traditional ceremonies. You can find exquisitely crafted traditional Thai flower garlands, traditional attire accessories for weddings or special occasions, and even handmade jewelry and souvenirs. The goods are rich in Thai cultural heritage and artisanal beauty. Though not a mainstream fashion shopping hub, Pak Khlong Talat offers an unexpected option for visitors seeking unique cultural apparel and accessories, while letting you soak in the market\u0027s vibrant, unique charm.", "name": "Pak Khlong Talat (Flower Market)", "transport": "Take the MRT Blue Line to Sanam Chai Station (BL31), then walk for about 5 minutes."}, {"address": "Phra Sumen Rd, Chana Songkhram, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 3.7 stars | A historic market located in the Rattanakosin district, serving as a vital everyday shopping destination for locals. While lacking the modern feel of large department stores, it hums with authentic local vibes. The market is packed with small shops selling a variety of clothing, shoes, bags, and accessories, particularly traditional Thai clothes, school uniforms, and casual wear for older generations. With budget-friendly prices and good value, it is a great spot to experience local Bangkok shopping culture and find unique Thai-style apparel. The surrounding area also boasts numerous food stalls, letting you savor authentic local bites while shopping.", "name": "Bang Lamphu Market", "transport": "No direct MRT/BTS access. It is recommended to take a taxi/Grab, or take the Chao Phraya Express Boat to Phra Arthit Pier and walk from there."}], "name": "Department Stores \u0026 Trendy Brands"}}, "name": "Rattanakosin (Historical \u0026 Cultural District)"}, "riverside": {"categories": {"cat_1": {"items": [{"address": "5th Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong San, Bangkok 10600", "feature": "\u2b50 4.6 stars | Must-Buy List: 4U2 Heart-shaped Engraved Lipstick, Cathy Doll Concealer, Mistine Wings Light-Fit Cushion Foundation. Thailand\u0027s hottest local beauty selection giant, often dubbed the Sephora of Thailand. The store gathers a huge range of indie beauty brands loved by Thailand\u0027s younger generation. Affordable prices and color palettes tailored for Asian skin tones make this the top choice to experience trendy Thai makeup.", "name": "EVEANDBOY Beauty Flagship (EVEANDBOY ICONSIAM)", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station for ICONSIAM, or transfer to the free ICONSIAM shuttle boat from Saphan Taksin Station."}, {"address": "Asiatique The Riverfront, Warehouse 7, 2194 Charoen Krung Rd, Bang Kho Laem, Bangkok 10120", "feature": "\u2b50 4.5 stars | Must-Buy List: SRICHAND Oil-Control Translucent Powder, Cute Press x Little Mermaid Makeup Collection, Browit Long-Lasting Eyebrow Pencil. Located in the riverfront night market along the Chao Phraya River, this is an ultra-popular beauty chain in Thailand. The store frequently offers exclusive discounts and bundles, making it ideal for finding quality local makeup and budget-friendly skincare, complete with dedicated swatch areas.", "name": "BEAUTRIUM Beauty Chain - Asiatique Branch (BEAUTRIUM Asiatique)", "transport": "Take the BTS to Saphan Taksin Station (Exit 2), then take the dedicated Asiatique shuttle boat."}, {"address": "2nd Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong San, Bangkok 10600", "feature": "\u2b50 4.7 stars | Must-Buy List: Erb Eastern Treat Hand Cream (Siamese Royal Rose), Thai Jasmine Body Lotion, Herbal Essential Oil Relief Roller. A premier Thai luxury fragrance and skincare brand inspired by ancient Siamese royal beauty secrets. Carefully selecting local Thai plants and precious flower extracts, wrapped in exquisite vintage packaging, this makes a sophisticated souvenir steeped in Thai heritage.", "name": "Erb Royal Thai Luxury Fragrance \u0026 Beauty Boutique (Erb Boutique ICONSIAM)", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station, connected to ICONSIAM 2nd Floor."}, {"address": "5th Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong San, Bangkok 10600", "feature": "\u2b50 4.4 stars | Must-Buy List:
