Natural Refreshing Sunscreen Primer, Bikini \u0026 Underarm Whitening Cream, Body Fragrance Mist. A household Thai beauty brand established for decades, known for natural botanical ingredients and high cost-performance. Specially formulated for tropical climates with excellent water and sweat resistance, highly praised by local Thai women and tourists alike.", "name": "Oriental Princess Cosmetics (Oriental Princess ICONSIAM)", "transport": "Take the BTS Gold Line to Charoen Nakhon Station; the store is accessible right upon exit."}, {"address": "2 Wanglang Rd, Siriraj, Bangkok Noi, Bangkok 10700", "feature": "\u2b50 4.7 stars | Must-Buy List: Siriraj Soft Care Urea Deep Moisture Cream, Siriraj Herbal Anti-Hair Loss Shampoo, Gentle Anti-Acne Repair Ointment. Located near Wang Lang Pier by the Chao Phraya River, developed by the medical team at Siriraj Hospital\u2014Thailand\u0027s oldest hospital. This shop offers highly acclaimed herbal skincare and cosmeceuticals with ultra-gentle formulas at bargain prices, making it a hidden treasure trove where locals line up.", "name": "Siriraj Pure / Herbal Cosmetic Shop", "transport": "Take the Chao Phraya Express Boat to N10 Wang Lang (Prannok) Pier, then walk about 3 minutes after disembarking."}, {"address": "4th Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong San, Bangkok 10600", "feature": "\u2b50 4.8 stars | Must-Buy List: Very Water Resistant Facial Sunscreen SPF30 (Shiso Sunscreen), Natural Rice Bran Cleansing Oil, Aromatic Wood Essential Oil Blend. Thailand\u0027s most internationally famous natural herbal skincare brand, combining traditional herbalism with modern dermatological science. Its sunscreen is hailed as Thailand\u0027s \u0027holy grail sunscreen\u0027\u2014lightweight, non-greasy, and perfectly suited for Asian summer climates.", "name": "THANN Natural Herbal Cosmetics Flagship (THANN ICONSIAM)", "transport": "Take the BTS Gold Line to Charoen Nakhon Station and enter ICONSIAM 4th Floor via the skywalk."}, {"address": "Asiatique The Riverfront, Warehouse 5, 2194 Charoen Krung Rd, Wat Phraya Krai, Bang Kho Laem, Bangkok 10120", "feature": "\u2b50 4.5 stars | Must-Buy List: Cathy Doll Aqua Sun Serum, Baby Bright Fruity Lip Tint, Reunrom Thai Dessert Fragrance Hand Cream. Karmart is Thailand\u0027s largest trendy beauty group, housing hit brands like Cathy Doll and Baby Bright. Located in the riverfront night market, the store features vibrant, colorful displays with products tailored for youthful skin, blending fun with practicality.", "name": "Karmart Trendy Thai Beauty Flagship (Karmart Asiatique)", "transport": "Take the BTS to Saphan Taksin Station, then transfer to the free Asiatique shuttle boat."}, {"address": "Asiatique The Riverfront, Warehouse 6, 2194 Charoen Krung Rd, Bang Kho Laem, Bangkok 10120", "feature": "\u2b50 4.3 stars | Must-Buy List: Boots Cucumber 3-Minute Mask, Counterpain Analgesic Cream, Soffell Natural Mosquito Repellent Spray. Though a well-known chain, Thailand\u0027s Boots carries and manufactures a vast array of exclusive budget cosmetics and multipurpose ointments unique to Thailand. This riverfront branch is fully stocked, making it an excellent one-stop spot for tourists to pick up local Thai skincare, drug products, and souvenirs.", "name": "Boots Drugstore Riverfront Flagship (Boots Asiatique The Riverfront)", "transport": "Take the free shuttle boat from BTS Saphan Taksin Station (Exit 2) directly to Asiatique The Riverfront."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "2nd Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong Ton Sai, Khlong San, Bangkok 10600", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic black-and-white lettering Canvas Tote, vintage-fit cropped T-shirts, logo baseball caps. GENTLEWOMAN is a trendy Thai women\u0027s apparel and handbag brand that has swept across Asia in recent years, celebrated for its confident and independent modern aesthetic. The ICONSIAM branch offers an exceptionally complete selection. Its most iconic item is the large-capacity, instantly recognizable canvas lettering tote bag\u2014durable, versatile, and seen on almost every local trendsetter and tourist. The shop also carries the latest seasonal resort-style clothing and chic footwear with surprising quality at very accessible prices.", "name": "GENTLEWOMAN (ICONSIAM Store)", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station (ICONSIAM 2nd Floor), or take the free ICONSIAM shuttle boat from Sathorn Pier."}, {"address": "4th-5th Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong Ton Sai, Khlong San, Bangkok 10600", "feature": "\u2b50 4.8 stars | Must-Buy List: Modern tailored Thai silk printed shirts, handwoven geometric handbags, creative leather flat shoes. Spanning the 4th and 5th floors of ICONSIAM, ICONCRAFT is a massive curated concept space dedicated to original Thai brands. It gathers clothing, shoes, bags, and handicrafts from dozens of top emerging Thai designers. The apparel seamlessly blends traditional Thai weaving techniques with modern tailoring\u2014ranging from Chiang Mai hand-dyed dresses to Bangkok street-style accessories. It is an elevated shopping sanctuary showcasing local craftsmanship, highly favored by locals and visitors seeking unique statement pieces.", "name": "ICONCRAFT Thai Designer Hub (ICONCRAFT at ICONSIAM)", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station (ICONSIAM), or take the free ICONSIAM shuttle boat from Sathorn Pier."}, {"address": "G Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong Ton Sai, Khlong San, Bangkok 10600", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic satin bow handbags, spacious cotton plaid travel bags, Thai silk-textured patterned cosmetic pouches. When it comes to Thailand\u0027s iconic fabric bag and accessory brands, NaRaYa is a household name. Located on the G Floor of ICONSIAM along the Chao Phraya River, this flagship store is bright, spacious, and offers the complete product line. World-renowned for lightweight durability, vibrant colors, and signature bow designs, NaRaYa has recently expanded to stylish denim lines and sleek minimalist totes alongside its classic satin and silk bags. High quality at budget-friendly prices makes these perfect as gifts or personal keepsakes.", "name": "NaRaYa Flagship Store (NaRaYa ICONSIAM Flagship Store)", "transport": "Take the BTS Gold Line to Charoen Nakhon Station, or board the free ICONSIAM shuttle boat at Sathorn Pier."}, {"address": "Asiatique The Riverfront, Warehouse 1, 2194 Charoen Krung Rd, Wat Phraya Krai, Bang Kho Laem, Bangkok 10120", "feature": "\u2b50 4.4 stars | Must-Buy List: Disney collaboration soft silk long scarves, carousel fairytale shawls, hand-drawn illustration canvas totes. Kiss Me Doll is a famous local Thai designer brand specializing in scarves and accessories adorned with whimsical, fairytale-inspired hand-drawn illustrations made from ultra-soft fabrics. Products range from light accent scarves and oversized shawls to artistic canvas bags and charming trinkets. Located in Asiatique The Riverfront, this cozy, vintage-styled store packages every item in beautiful gift boxes or collectible tin cans\u2014making it a delightful and affordable fashion stop recommended by locals and travelers alike.", "name": "Kiss Me Doll Dreamy Scarves \u0026 Accessories (Kiss Me Doll Asiatique Store)", "transport": "Take the BTS to Saphan Taksin Station, go to Sathorn Pier, and transfer to the free Asiatique shuttle boat or a sight-seeing boat."}, {"address": "1st Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong Ton Sai, Khlong San, Bangkok 10600", "feature": "\u2b50 4.7 stars | Must-Buy List: Classic hand-patinated retro loafers, genuine handcrafted leather dress shoes, fine leather small pouches. Mango Mojito is a prestigious local Thai high-end leather footwear brand that fuses traditional Italian shoemaking craftsmanship with contemporary Thai aesthetics. Utilizing top-grade imported genuine leather, skilled local artisans apply custom hand-patina coloring and hand-stitching to ensure every pair displays a unique vintage luster and elegant finish. The counter inside ICONSIAM offers casual loafers, formal shoes, and small leather goods\u2014an absolute must-visit destination for true footwear enthusiasts.", "name": "Mango Mojito Handcrafted Leather Shoes (Mango Mojito ICONSIAM)", "transport": "Take the BTS Gold Line to Charoen Nakhon Station directly into ICONSIAM, or take the shuttle boat from Sathorn Pier."}, {"address": "Wang Lang Market, Phra Nakhon Rd, Siriraj, Bangkok Noi, Bangkok 10700", "feature": "\u2b50 4.3 stars | Must-Buy List: Budget Thai-style jeans, vintage secondhand leather crossbody bags, comfortable platform sandals popular among Bangkok students. Located right next to Wang Lang Pier on the west bank of the Chao Phraya River, Wang Lang Market is a treasure-hunting paradise loved by local university students and riverside residents. Hiding dozens of independent clothing stalls and small shoe/bag shops, it is famous for incredible value and trendy styles. From local bohemian cotton-linen dresses and vintage bags to stylish sandals and affordable street fashion, you can find it all here without tourist markups.", "name": "Wang Lang Market Fashion Area", "transport": "Take the Chao Phraya Express Boat (Orange Flag or Hop-On Hop-Off) to Wang Lang (N10) Pier; the market entrance is right outside the pier."}, {"address": "1st Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong Ton Sai, Khlong San, Bangkok 10600", "feature": "\u2b50 4.5 stars | Must-Buy List: Exotic folk-print resort dresses, signature brand-embroidered totes, striking geometric-printed wide-leg trousers. Founded in 1999, ISSUE is one of Thailand\u0027s premier high-end designer brands. The brand excels at combining tropical exotic flair, traditional Thai cultural motifs, and luxurious printed fabrics to create romantic, vibrant, and visually striking apparel, shoes, and bags. The ICONSIAM boutique features artful interior design, displaying top-tier printed canvas bags and resort dresses that are immensely popular among Thai celebrities, fashion icons, and travelers loving bold ethnic fashion.", "name": "ISSUE Thai Designer Boutique (ISSUE ICONSIAM)", "transport": "Take the BTS Gold Line to Charoen Nakhon Station, or take the shuttle boat from Sathorn Pier."}, {"address": "Warehouse 30, 48 Charoen Krung 30, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.6 stars | Must-Buy List: Original patchwork canvas bags, Thai indie designer bucket hats, curated vintage American flight jackets. Warehouse 30 is a creative arts compound converted from old riverside warehouses in the historic Charoenkrung neighborhood. Inside, you\u0027ll find select boutiques and vintage shops run by independent Thai creators. They offer artfully designed canvas bags, eco-friendly reworked clothing, curated pre-loved boots, and unique handmade accessories. With its relaxed, artistic vibe, it\u0027s a hidden riverside gem perfect for fans of indie design and distinct fashion.", "name": "Warehouse 30 Independent Design \u0026 Vintage Shops", "transport": "Take a Chao Phraya river boat to Si Phraya (N3) Pier and walk about 5 minutes, or take the BTS to Saphan Taksin Station and continue by taxi or walk."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "G Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong San, Bangkok", "feature": "\u2b50 4.7 stars | Must-Buy List: Thai Royal Natural Honey, traditional handmade coconut candy, and spicy Thai crispy pork chips. Located on the G Floor at the base of ICONSIAM, SookSiam brings together selected local souvenirs and agricultural specialties from all 77 provinces of Thailand. Here, you can not only purchase authentic traditional handicrafts and snacks from Northern and Southern Thailand, but also shop effortlessly inside an air-conditioned indoor \u0027floating market\u0027 atmosphere. With affordable prices and an exceptionally complete variety, it is the ultimate one-stop holy grail for tourists looking to buy regional Thai specialties along the riverside.", "name": "SOOKSIAM Local Thai Souvenir Zone (SOOKSIAM at ICONSIAM)", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station for ICONSIAM, or take the free ICONSIAM shuttle boat from Sathorn Pier."}, {"address": "G Floor, SOOKSIAM Zone, ICONSIAM, 299 Charoen Nakhon Rd, Khlong San, Bangkok", "feature": "\u2b50 4.5 stars | Must-Buy List: Crispy coconut chips, chocolate-covered freeze-dried durian, and soft Thai dried mangoes. Kunna is an iconic Thai brand for high-quality dried fruits and snacks, renowned for low sugar, natural ingredients, and elegant packaging. Its best-selling coconut chips are rich and crispy, while the freeze-dried durian preserves the natural sweet aroma of Monthong durian. It makes for a sophisticated, foolproof gift for friends and family.", "name": "Kunna Premium Dried Fruit (Kunna Dried Fruit ICONSIAM)", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station for ICONSIAM."}, {"address": "UG Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong San, Bangkok", "feature": "\u2b50 4.6 stars | Must-Buy List: Royal 100% pure natural honey, additive-free low-sugar dried mango, and Thai royal herbal tea bags. Doi Kham is a brand born from the Royal Agricultural Project founded by the late King Bhumibol, aiming to support Northern Thai farmers and offer high-quality natural produce. All products in the shop boast premium quality at very affordable prices; its pure honey and dried natural fruits are widely recognized as top-value, must-buy souvenirs.", "name": "Doi Kham Royal Project Shop (Doi Kham Royal Project Shop ICONSIAM)", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station for ICONSIAM, then walk to the UG Floor."}, {"address": "1/11 Maha Rat Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok", "feature": "\u2b50 4.4 stars | Must-Buy List: Hong Thai compound herbal inhalers, Wat Pho herbal balm, and handmade elephant-print cotton pants. Located within a trendy open-air riverside mall along the Chao Phraya River, Tha Maharaj gathers many charming local boutiques and herbal shops. Here, you can buy the traditional herbal inhalers loved by both local youth and tourists for their refreshing and stress-relieving scent, alongside numerous stylish local design crafts.", "name": "Tha Maharaj Craft \u0026 Souvenir Market", "transport": "Take the Chao Phraya Tourist Boat (Hop-On Hop-Off) and disembark at Tha Maharaj Pier (N1/1)."}, {"address": "1st Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong San, Bangkok", "feature": "\u2b50 4.6 stars | Must-Buy List: Traditional compound essential oil diffusers, portable aromatic sachets, and scented bookmarks. Karmakamet started as a small herbal stall in Chatuchak Market and has evolved into Thailand\u0027s premier luxury fragrance brand. Featuring vintage British and Thai-inspired packaging, signature scents like Asian White Tea and Joy are highly recommended, making it the most elegant and high-quality souvenir choice while shopping by the river.", "name": "Karmakamet Lifestyle \u0026 Fragrance Boutique (Karmakamet ICONSIAM Branch)", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station to reach 1st Floor, ICONSIAM."}, {"address": "Asiatique The Riverfront, 2194 Charoen Krung Rd, Wat Phraya Krai, Bang Kho Laem, Bangkok", "feature": "\u2b50 4.3 stars | Must-Buy List: Thai crispy pork floss rice crackers, crispy roasted pork jerky, and spicy fish floss sticks. Lin Zhen Xiang is a historic, heritage meat-product gift brand in Bangkok, and its branch at Asiatique The Riverfront is extremely convenient. The shop\u0027s signature pork floss rice crackers are incredibly crunchy and packed with flavor when paired with special Thai sweet chili sauce, making it a long-standing favorite classic snack for travelers visiting Bangkok.", "name": "Lin Zhen Xiang Thai Pork Jerky \u0026 Floss Souvenirs (Lin Zhen Xiang Asiatique Branch)", "transport": "Take the BTS to Saphan Taksin Station, then transfer to the free Asiatique shuttle boat at Sathorn Pier."}, {"address": "1st Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong San, Bangkok", "feature": "\u2b50 4.5 stars | Must-Buy List: Siamese Jasmine Hand Cream, Oriental Express Body Massage Oil, and Natural Herbal Body Polish. Erb is a luxury skincare and aromatherapy brand inspired by traditional Thai royal beauty secrets, famous for natural botanical extracts and signature Thai floral scents. The hand cream is rich and moisturizing with a sophisticated aroma of jasmine and herbs, packaged exquisitely to make a high-class, tasteful Thai gift.", "name": "Erb Royal Thai Herbal Aromatherapy \u0026 Skincare (Erb Boutique ICONSIAM)", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station to reach 1st Floor, ICONSIAM."}, {"address": "Asiatique The Riverfront, Warehouse 1, 2194 Charoen Krung Rd, Bang Kho Laem, Bangkok", "feature": "\u2b50 4.6 stars | Must-Buy List: Hand-painted elephant art statues, Thai elephant print canvas bags, and limited-edition hand-painted elephant keychains. Elephant Parade is a famous social enterprise combining artistic creativity with Asian elephant conservation. Its painted elephants are designed by artists worldwide, and with every purchase of a replica statue, a portion of proceeds is donated to elephant conservation foundations, making it a meaningful and highly collectible keepsake.", "name": "Elephant Parade Painted Elephant Art Souvenirs (Elephant Parade Asiatique)", "transport": "Take the BTS to Saphan Taksin Station, then transfer to the free Asiatique shuttle boat at Sathorn Pier to reach Warehouse 1."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "299 Charoen Nakhon Rd, Khlong Ton Sai, Khlong San, Bangkok 10600", "feature": "\u2b50 4.7 stars | Must-Buy List: SookSiam Thai hand-woven bags, NaRaYa Bangkok bags (ICONSIAM exclusive edition), Taokaenoi seaweed premium edition. A landmark luxury shopping destination located on the banks of the Chao Phraya River, seamlessly blending international luxury brands with local Thai culture. The mall houses Thailand\u0027s first official Apple Store and an expansive indoor floating market. Featuring magnificent architecture, it is an unmissable shopping landmark when visiting the Bangkok riverside.", "name": "ICONSIAM", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station, or take the free ICONSIAM shuttle boat from Saphan Taksin Station."}, {"address": "G Floor, ICONSIAM, 299 Charoen Nakhon Rd, Khlong San, Bangkok 10600", "feature": "\u2b50 4.6 stars | Must-Buy List: Handcrafted indigo-dyed clothing from Northeastern Thailand, handcrafted coconut shell carvings, Thai herbal essential oil gift sets. Located on the G floor of ICONSIAM, this unique indoor department zone brings together traditional cuisine, crafts, and cultural features from all 77 provinces of Thailand. Home to numerous stalls and shops of local independent creators and traditional artisans, it is the best choice for purchasing authentic Thai souvenir items.", "name": "SookSiam", "transport": "Take the BTS Gold Line to Charoen Nakhon Station; located on the G Floor inside ICONSIAM."}, {"address": "919/1 Silom Rd, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.1 stars | Must-Buy List: Discounted Marks \u0026 Spencer clothing, Playboy Thailand-exclusive bags, affordable Lee and Levi\u0027s jeans. A department store-style outlet center affiliated with Central Group, located near Charoen Krung Road in the riverside commercial district. Bringing together over 500 famous brands, it offers huge year-round discounts ranging from 70% to 90% off, making it the top choice in the riverside area for finding budget-friendly brand deals and outlet treasure hunting.", "name": "Bangkok Fashion Outlet", "transport": "Take the BTS to Surasak Station and walk for about 7 minutes, or walk along Charoen Krung Road to Silom Road from Sathorn Pier on the Chao Phraya River."}, {"address": "23 Soi Charoen Krung 24, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.5 stars | Must-Buy List: Thai independent designer bronze jewelry, hand-painted Thai silk scarves, vintage Thai-style postcards. This four-story riverside shopping center is a renowned Bangkok hub for antiques, fine art, and local designer brands. Housing numerous independent art galleries and boutiques selling high-quality Thai handicrafts, paintings, and design goods, it attracts many tourists who love art and collectibles.", "name": "River City Bangkok", "transport": "Take the Chao Phraya Hop-On Hop-Off Sightseeing Boat to Si Phraya Pier (N3) and walk for 1 minute."}, {"address": "1/11 Maha Rat Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.3 stars | Must-Buy List: Favor Field handmade small leather goods, Savoey special Thai spice gift sets, trendy printed canvas bags. Converted from old pier warehouses, this open-air riverside lifestyle mall exudes a relaxed artistic vibe. Featuring many small shops of Thai independent designers, stylish cafes, and unique gift shops, visitors can enjoy the breathtaking sunset over the Chao Phraya River while shopping.", "name": "Tha Maharaj", "transport": "Take the Chao Phraya Express Boat directly to Tha Maharaj Pier."}, {"address": "2194 Charoen Krung Rd, Wat Phraya Krai, Bang Kho Laem, Bangkok 10120", "feature": "\u2b50 4.4 stars | Must-Buy List: BKK Original chain bags, Herb Basics Thai herbal fragrances, handmade elephant print pants. Rebuilt from a century-old former port warehouse, this massive open-air riverside shopping complex is divided into multiple zones. It features a vast array of local Thai original brands, boutique clothing shops, handicrafts, and renowned fragrance stores, combining the comfort of a shopping mall with the vibrant diversity of a night market.", "name": "Asiatique The Riverfront", "transport": "Take the BTS to Saphan Taksin Station, then take the free Asiatique shuttle boat from Sathorn Pier."}, {"address": "240 Chakkraphet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.2 stars | Must-Buy List: Fresh flower extract moisturizing mist, Thai handmade dried flower fragrance sachets, exquisite carved wooden elephant ornaments. Boasting a rich colonial architectural style, this riverside mall is adjacent to Bangkok\u0027s famous Pak Khlong Talat flower market. Combining floral culture with local Thai craftsmanship, it houses many unique shops selling flower-derived products, traditional handicrafts, and special souvenirs.", "name": "Yodpiman River Walk", "transport": "Take the MRT to Sanam Chai Station and walk for about 5 minutes, or take a river boat directly to Yodpiman Pier."}, {"address": "30/1 Charoen Krung 38 Alley, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.3 stars | Must-Buy List: Jim Thompson high-end Thai silk cushion covers, handmade lacquerware tea sets, royal Thai-style silver jewelry. Located next to The Mandarin Oriental, this mall resides in a neoclassical heritage building constructed in 1908. Specializing in high-end traditional Thai handicrafts, fine Thai silk, luxury rugs, and handcrafted jewelry, its interior is filled with a luxurious retro ambiance from a century ago, making it a fantastic destination for finding refined, premium artisan crafts.", "name": "OP Place Shopping Centre", "transport": "Take the Chao Phraya River Boat to Oriental Pier (N1) and walk for about 3 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Chao Phraya Riverside (River Views \u0026 Temples)"}, "siam_chitlom": {"categories": {"cat_1": {"items": [{"address": "991 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.5 stars | One of Bangkok\u0027s most prestigious luxury shopping malls, renowned for its high-end brands, fine dining, and extensive entertainment facilities. It houses flagship international luxury boutiques, luxury car showrooms, a massive cineplex, the Sea Life Bangkok Ocean World aquarium, and a vibrant food hall. Featuring grand architecture and elegant interiors, it is an ideal destination for both tourists and locals looking for premium shopping and leisure. Whether you are searching for the latest fashion trends, savoring world-class cuisine, or enjoying family fun, Siam Paragon offers an unmatched experience.", "name": "Siam Paragon", "transport": "Take the BTS Skytrain to Siam Station, connected directly via skywalk."}, {"address": "999/9 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.4 stars | One of Thailand\u0027s largest shopping complexes, offering an all-encompassing range of shopping, dining, and entertainment options. From international fashion brands to local designer boutiques, and fine dining to street food, it has it all. The mall features a movie theater, an ice-skating rink, a kids\u0027 play area, and major department stores. Its expansive layout and modern design make it one of the most popular hangout spots in downtown Bangkok\u2014especially during festive seasons when its outdoor plaza hosts lively events.", "name": "CentralWorld", "transport": "Take the BTS Skytrain to Chit Lom or Siam Station, then walk via the skywalk."}, {"address": "444 Phaya Thai Rd, Wang Mai, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.0 stars | Bangkok\u0027s iconic budget-friendly shopping mall, attracting crowds of visitors with its diverse products and affordable prices. It features thousands of small shops selling clothing, electronics, mobile phones, souvenirs, jewelry, and handicrafts. Famous for its market-style atmosphere, tourists can enjoy the fun of bargaining here. Beyond shopping, the complex includes a massive food court, cinema, and bowling alley, making it a fantastic spot to hunt for bargains and experience local shopping culture.", "name": "MBK Center", "transport": "Take the BTS Skytrain to National Stadium Station for direct access, or walk about 10 minutes from Siam Station."}, {"address": "979 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.3 stars | A trendsetting benchmark for fashion in Bangkok, renowned for its avant-garde design and curated mix of brands. It brings together numerous local Thai designer labels alongside international fashion brands, delivering a unique shopping experience. The interior is filled with artistic vibes, frequently hosting fashion exhibitions and events. Siam Center is not just a shopping destination, but a creative stage that attracts youth and fashion enthusiasts alike.", "name": "Siam Center", "transport": "Take the BTS Skytrain to Siam Station, connected directly."}, {"address": "989 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.2 stars | An innovative shopping center designed around the concept of a \u0027Lifestyle Lab,\u0027 providing a curated lifestyle shopping experience. Instead of traditional brand counters, items are arranged according to themes and lifestyle concepts, encouraging shoppers to explore and discover. From fashion and home decor to tech gadgets, every floor is full of surprises. With sleek modern architecture, interactive installations, and unique cafes and restaurants, it is an inspiring hub for trendseekers.", "name": "Siam Discovery", "transport": "Take the BTS Skytrain to Siam Station, then walk via the skywalk."}, {"address": "999 Phloen Chit Rd, Lumphini, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.2 stars | The epitome of luxury shopping in Bangkok, focusing on high-end fashion, fine jewelry, timepieces, and lifestyle brands. More of an upscale lifestyle village than a traditional mall, it offers highly personalized service and an exclusive shopping environment. Housing elite international fashion houses, top Thai designer boutiques, and fine dining establishments, Gaysorn Village caters to sophisticated shoppers seeking refined elegance.", "name": "Gaysorn Village", "transport": "Take the BTS Skytrain to Chit Lom Station, connected directly via skywalk."}, {"address": "222 Phetchaburi Rd, Thanon Phaya Thai, Ratchathewi, Bangkok 10400, Thailand", "feature": "\u2b50 4.1 stars | Bangkok\u0027s premier wholesale and retail fashion mall, famous for its massive selection of clothing, accessories, and shoes. Featuring thousands of small stalls offering trendy apparel for men and women at bargain prices, it is ideal for bulk buying. The mall is divided into multiple zones spanning everything from casual wear to evening gowns. Retail shoppers can also score fantastic deals here, making it a must-visit destination for budget-conscious fashion lovers.", "name": "Platinum Fashion Mall", "transport": "Take the BTS Skytrain to Chit Lom Station and walk about 10\u201315 minutes, or take the Khlong Saen Saep Express Boat to Pratunam Pier."}, {"address": "496-502 Phloen Chit Rd, Lumphini, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 3.9 stars | A well-established and diverse shopping center offering everything from fashion and jewelry to home decor. It houses local and international brands, as well as a popular food court serving a wide array of Thai and global cuisines. Known for holding regular sales and discount events, Amarin Plaza attracts bargain hunters. Conveniently connected directly to the BTS Skytrain station, it is a convenient spot for daily shopping and quick bites.", "name": "Amarin Plaza", "transport": "Take the BTS Skytrain to Chit Lom Station, connected directly via skywalk."}], "name": "Shopping Malls"}, "cat_2": {"items": [{"address": "989 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.3 stars | Famous for its innovative retail concept centered around \u0027discovery,\u0027 Bangkok\u0027s Siam Discovery is far more than a shopping mall\u2014it is a massive lifestyle laboratory. Curating selected global brands and designer items ranging from fashion, home goods, and tech gadgets to unique art pieces, every product is thoughtfully presented to inspire curiosity and creativity. The interior design is modern and artistic, with smooth walkways where every zone tells its own story. Visitors can find limited-edition or exclusive products hard to locate elsewhere, making it an ideal destination for those seeking unique taste and design-driven select goods.", "name": "Siam Discovery", "transport": "Take the BTS Skytrain to Siam Station, directly connected via the skywalk."}, {"address": "979 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.2 stars | Known as the \u0027Ideopolis,\u0027 Siam Center serves as an incubator for Bangkok\u0027s fashion and creativity. It places a special focus on local Thai designer brands, offering a vibrant stage to showcase their talent. From avant-garde clothing and unique accessories to artistic home decor, each shop exudes a distinct personality and style. The interior is bold and experimental, frequently hosting art installations and fashion events that keep the shopping experience fresh and full of surprises. For fashion enthusiasts eager to discover emerging designers and embrace a standout look, Siam Center is an absolute treasure-trove.", "name": "Siam Center", "transport": "Take the BTS Skytrain to Siam Station, directly connected via the skywalk."}, {"address": "444 Phaya Thai Rd, Wang Mai, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 3.9 stars | While MBK Center is famous for its diverse and budget-friendly goods, its upper floors (such as electronics on the 4th floor and souvenirs/crafts on the 6th floor) and hidden nooks hide a treasure chest of unique market stalls and select shops. Countless independently run booths offer everything from custom phone accessories and printed T-shirts to traditional Thai crafts and quirky novelties. Although less refined than upscale department stores, its incredible variety and the fun of bargaining make MBK a popular hub for experiencing local shopping culture, finding unique souvenirs, and snagging great bargains.", "name": "MBK Center - Specialty Shops Area", "transport": "Take the BTS Skytrain to National Stadium Station, directly connected via the skywalk."}, {"address": "939 Rama I Rd, Wang Mai, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.4 stars | The Bangkok Art and Culture Centre (BACC) is not only a hub for art exhibitions, but also home to numerous artful specialty shops and cozy cafes scattered inside and around it. These unique shops sell items rooted in art, design, and culture, including indie designer clothing, handmade crafts, art books, creative stationery, and distinctive keepsakes. Overflowing with artistic flair and original spirit, it is a wonderful place to support local artists. Browsing these boutiques after viewing an exhibition often leads to unexpected delights and heartfelt souvenirs rich with stories.", "name": "Bangkok Art and Culture Centre Shops", "transport": "Take the BTS Skytrain to National Stadium Station, directly connected via the skywalk."}, {"address": "388 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.1 stars | Situated in one of Bangkok\u0027s trendiest districts, Siam Square One is a vital modern component of Siam Square. It houses a vibrant mix of emerging local Thai designer brands, trendy clothing shops, indie beauty stores, and quirky cafes. Unlike conventional department stores, shops here are more characterful and experimental; many are independent boutiques offering exclusive designs and limited items. With a youthful, energetic vibe, it\u0027s a paradise for local youth chasing cutting-edge fashion and unique lifestyle items, allowing shoppers to feel the pulse of Bangkok\u0027s fashion scene.", "name": "Siam Square One - Independent Boutiques", "transport": "Take the BTS Skytrain to Siam Station, Exit 4 or 5."}, {"address": "496-502 Phloen Chit Rd, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 3.8 stars | The Amarin Plaza Weekend Market is a relatively hidden gem in central Bangkok, beloved by locals and savvy tourists alike. Open primarily on weekends, this market brings together an array of Thai handicrafts, traditional attire, jewelry, home decor, and distinctive souvenirs. Unlike big malls, products here boast rich local character and handcrafted warmth, often crafted directly by small vendors or independent artisans. The atmosphere is bustling yet welcoming, offering the charm of traditional market shopping alongside one-of-a-kind Thai keepsakes\u2014making it a perfect spot for authentic gifts and cultural immersion.", "name": "Amarin Plaza Weekend Market", "transport": "Take the BTS Skytrain to Chit Lom Station, directly connected via the skywalk."}, {"address": "111 Ratchadamri Rd, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 3.7 stars | The Market Bangkok is a relatively new shopping complex designed to merge the charm of a traditional Thai night market with modern indoor comfort. It hosts hundreds of independent stalls and shops offering fashion, beauty products, handicrafts, local street snacks, and creative goods. Bright and spacious, the indoor space recreates the vibrant, energetic feel of an outdoor bazaar. Visitors can browse affordable local designer brands and unique Thai products away from the heat, offering a delightfully comfortable market experience full of fun discoveries.", "name": "The Market Bangkok", "transport": "Take the BTS Skytrain to Chit Lom Station or Siam Station and walk about 10\u201315 minutes, or take a shuttle bus."}, {"address": "222 Phetchaburi Rd, Thanon Phaya Thai, Ratchathewi, Bangkok 10400, Thailand", "feature": "\u2b50 4.0 stars | Platinum Fashion Mall is one of Bangkok\u0027s premier wholesale and retail fashion centers. Though wholesale-focused, its thousands of independent shops function as a massive indoor specialty market. Offering a staggering variety of apparel, shoes, bags, and accessories, items here are updated rapidly at highly competitive prices. Many stalls feature exclusive designs or trendy imports from Korea and China, making it a hot spot for trendsetters seeking unique outfits. While it can get crowded, the unmatched selection and low prices draw countless fashion lovers and bargain hunters.", "name": "Platinum Fashion Mall", "transport": "Take the BTS Skytrain to Chit Lom Station and walk about 10\u201315 minutes, or take a taxi/tuk-tuk."}], "name": "Specialty Markets \u0026 Select Shops"}, "cat_3": {"items": [{"address": "999/9 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand (CentralWorld, Ground Floor)", "feature": "\u2b50 4.5 stars | NaRaYa is Thailand\u0027s most famous fabric bag brand, world-renowned for its exquisite satin, cotton fabrics, and iconic ribbon bow designs. Offering a vast variety of styles\u2014from handbags and shoulder bags to cosmetic pouches and coin purses\u2014their elegant designs are affordably priced, making them perfect souvenirs for friends or personal use. Practical and infused with unique Thai aesthetics, they are hugely popular among international tourists. The spacious CentralWorld branch features neat displays and offers a great shopping experience, making it a must-visit shopping spot in Bangkok.", "name": "NaRaYa (CentralWorld)", "transport": "Take the BTS to Chit Lom Station, then walk about 5 minutes via the skywalk to reach CentralWorld."}, {"address": "991 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand (Siam Paragon, 1st Floor)", "feature": "\u2b50 4.6 stars | Jim Thompson is synonymous with top-quality Thai silk, globally renowned for its luxurious silk products. The Siam Paragon branch offers a wide range of silk items, including exquisite apparel, scarves, ties, home goods, cushion covers, and various unique souvenirs. Each product showcases a seamless blend of traditional Thai craftsmanship and modern design, featuring vibrant colors and delicate textures. It is the premier choice for visitors seeking high quality and refined taste, where you can find souvenirs that best represent Thailand\u0027s exquisite culture.", "name": "Jim Thompson Retail Shop (Siam Paragon)", "transport": "Take the BTS to Siam Station and directly enter Siam Paragon Shopping Center."}, {"address": "991 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand (Siam Paragon, Ground Floor)", "feature": "\u2b50 4.4 stars | Gourmet Market is one of Bangkok\u0027s premier upscale supermarkets located on the ground level of Siam Paragon. Beyond offering premium global ingredients, it is a treasure trove for authentic Thai food gifts. You will find a wide variety of local snacks, spices, seasonings, instant coffee, tea leaves, dried fruits, and high-quality Thai rice. It also features unique local brands and beautifully packaged organic products, making them ideal gifts for family and friends. A quick walk through Gourmet Market allows you to bring the delicious flavors of Thailand home.", "name": "Gourmet Market (Siam Paragon)", "transport": "Take the BTS to Siam Station, enter Siam Paragon, and take the escalator down to Ground Floor."}, {"address": "97/11 Ratchadamri Rd, Lumphini, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.0 stars | Big C Supercenter Ratchadamri branch is a famous hot spot for tourists to buy Thai snacks, daily necessities, and souvenirs. Known for its affordable budget prices and extensive product selection, it stocks everything from various flavors of Pocky, Taokaenoi seaweed, Koh-Kae peanuts, and Thai instant noodles to Tiger Balm and herbal balms. Many visitors do full souvenir sweeps here to stock up on all the local Thai favorites in one go. With a spacious shopping environment and numerous checkouts, it\u0027s a great place to experience local Thai shopping life.", "name": "Big C Supercenter (Ratchadamri)", "transport": "Take the BTS to Chit Lom Station, then walk about 5-7 minutes via the skywalk."}, {"address": "989 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand (Siam Discovery, 3rd Floor)", "feature": "\u2b50 4.2 stars | Originating from Japan, Loft is a creative lifestyle specialty store located inside Siam Discovery shopping center, beloved by youth and design enthusiasts for its unique and trendy items. It carries a wide selection of stationery, home goods, cosmetics, travel accessories, and fun, stylish gift items. If you are looking for distinctive Thai or Japanese design items as gifts that balance aesthetics and practical utility, Loft is definitely worth exploring. Their merchandise updates frequently, so you can always discover delightful surprises.", "name": "Loft (Siam Discovery)", "transport": "Take the BTS to Siam Station, then walk via the skywalk to reach Siam Discovery."}, {"address": "444 Phaya Thai Rd, Wang Mai, Pathum Wan District, Bangkok 10330, Thailand (MBK Center, 4th Floor)", "feature": "\u2b50 3.9 stars | OTOP (One Tambon One Product) is a government-backed initiative aimed at promoting local handicrafts and agricultural products from regions across Thailand. The OTOP Shop inside MBK Center gathers curated goods from different provinces, including handmade soaps, aromatherapy items, wood carvings, silver jewelry, Thai silk items, ceramics, and local snacks. Shopping here not only yields unique local souvenirs but also directly supports community development and traditional craftsmanship. Featuring a rich selection at reasonable prices, it\u0027s a great spot to experience Thai cultural diversity.", "name": "OTOP Shop (MBK Center)", "transport": "Take the BTS to National Stadium Station, which directly connects to MBK Center."}, {"address": "999/9 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand (CentralWorld, 1st Floor)", "feature": "\u2b50 4.5 stars | Karmakamet Secret World is famous for its unique fragrance products and mysterious brand image. The shop offers a wide range of scented candles, diffusers, essential oils, body care products, and aromatic sachets. Every product emits captivating Thai herbal aromas and comes in beautifully textured packaging. More than just a retail shop, it feels like an immersive space full of stories and sensory experiences. If you want to bring home a gift representing Thailand\u0027s vibrant fragrance culture, Karmakamet\u0027s products will surely offer your friends and family a touch of exotic luxury and relaxation.", "name": "Karmakamet Secret World (CentralWorld)", "transport": "Take the BTS to Chit Lom Station, then walk about 5 minutes via the skywalk to reach CentralWorld."}, {"address": "989 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand (Siam Discovery, 3rd Floor)", "feature": "\u2b50 4.3 stars | Located in Siam Discovery, O.D.S. (Objects of Desire Store) is a curated shop showcasing works from Thailand\u0027s top local designers. Filled with creativity and modern flair, its collection ranges from unique home decor, fashion accessories, and stationery to art pieces\u2014each reflecting the talent and attention to detail of Thai creators. If you are looking for unique, design-forward gifts that fit seamlessly into modern lifestyles instead of traditional souvenirs, O.D.S. is sure to satisfy. The items here are not just gifts, but statements of lifestyle and taste.", "name": "O.D.S. (Objects of Desire Store) (Siam Discovery)", "transport": "Take the BTS to Siam Station, then walk via the skywalk to reach Siam Discovery."}], "name": "Famous Souvenir \u0026 Gift Shops"}, "cat_4": {"items": [{"address": "991 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.6 stars | Bangkok\u0027s premier luxury shopping palace, bringing together top global luxury brands from fashion apparel, jewelry, and watches to high-tech products. It is not only a shopping paradise, but also a comprehensive lifestyle experience center, featuring Sea Life Bangkok Ocean World\u2014the largest aquarium in Asia\u2014an IMAX cinema, and a wide variety of international gourmet restaurants. Its magnificent architectural design and exquisite interior decor provide customers with an unparalleled, prestigious shopping experience. Whether looking for the latest trend items or enjoying a feast for the eyes and taste buds, Siam Paragon satisfies your pursuit of luxury and taste.", "name": "Siam Paragon", "transport": "Take the BTS Skytrain to Siam Station; direct entrance available from the station."}, {"address": "999/9 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.6 stars | As one of the largest shopping complexes in Southeast Asia, CentralWorld offers an extremely rich and diverse range of shopping choices, covering everything from internationally renowned brands to local designer labels. Here you can find fashion, cosmetics, skincare, home goods, as well as major department stores (formerly Zen and Isetan, now Central Department Store), along with hundreds of restaurants and cafes. The shopping center houses a cinema, an ice-skating rink, and frequently hosts various festive events and exhibitions, making it a popular leisure and entertainment spot for locals and tourists alike. Its spacious environment and modern facilities ensure a comfortable and enjoyable shopping experience.", "name": "CentralWorld", "transport": "Take the BTS Skytrain to Chit Lom Station or Siam Station, then walk via the skywalk."}, {"address": "444 Phaya Thai Rd, Wang Mai, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.1 stars | Known for its affordable prices and diverse variety of merchandise, MBK Center is a great destination for finding great deals. It features thousands of small shops selling everything from mobile phones, electronics, clothing, accessories, and jewelry to Thai souvenirs and handicrafts. Unlike other high-end department stores, MBK feels more like a massive indoor market, bustling with vitality and the fun of bargaining. For budget-conscious travelers or those who love treasure hunting and unique finds, MBK is an absolute must-visit shopping spot offering a shopping atmosphere closer to local everyday life.", "name": "MBK Center", "transport": "Take the BTS Skytrain to National Stadium Station; direct entrance available from the station."}, {"address": "989 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.4 stars | Siam Discovery is renowned for its unique \u0027hybrid retail\u0027 concept and curated shopping experience. Instead of traditional brand counters, products are displayed according to lifestyle themes, encouraging customers to explore and discover. The mall brings together many designer brands, lifestyle goods, creative items, and international fashion labels, along with the famous Loft lifestyle shop and O.D.S. design store. Its sleek modern decor and interactive shopping environment offer a refreshing experience for trend-seeking and design-conscious shoppers, while also featuring entertainment facilities like Madame Tussauds.", "name": "Siam Discovery", "transport": "Take the BTS Skytrain to Siam Station, then walk via the skywalk."}, {"address": "979 Rama I Rd, Pathum Wan, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.4 stars | Siam Center is a beacon for Bangkok\u0027s young fashion trends, focusing on bringing in the latest international fashion brands and local Thai designer labels. The atmosphere is vibrant and creative, attracting a young crowd seeking unique styles and avant-garde designs. Featuring a modern interior, the mall frequently hosts fashion events and art exhibitions, turning shopping into a true cultural experience. From street fashion brands to emerging designer apparel, Siam Center offers a wealth of choices to help you express your personal style, making it a must-visit destination for fashion enthusiasts exploring the latest trends.", "name": "Siam Center", "transport": "Take the BTS Skytrain to Siam Station; direct entrance available from the station."}, {"address": "999 Phloen Chit Rd, Lumphini, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.4 stars | Gaysorn Village represents the pinnacle of luxury shopping in Bangkok, celebrated for its curated brand selection and exclusive shopping experience. It gathers numerous top-tier global luxury brands, high jewelry, custom tailoring, and exclusive lifestyle concept stores. Unlike larger shopping malls, Gaysorn Village focuses on providing private and distinguished service, with many brands offering personal shopping consultants and bespoke services. Beyond shopping, it houses upscale restaurants, cafes, and luxury spas for mind-and-body relaxation, making it an ideal choice for discerning customers seeking ultimate taste and unique experiences.", "name": "Gaysorn Village", "transport": "Take the BTS Skytrain to Chit Lom Station, then walk via the skywalk."}, {"address": "1027 Phloen Chit Rd, Lumphini, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.4 stars | Central Chidlom is a long-standing and highly esteemed classic department store in Thailand, famed for its elegant shopping environment and comprehensive product offerings. It offers everything from international cosmetics and skincare to fashion apparel, home goods, and children\u0027s toys, with many brands making their Thai debut here. With refined decor and attentive service, it provides a comfortable, high-quality shopping experience. Its food hall in particular features a fantastic array of international cuisine and local street food specialties. Central Chidlom is the top choice for shoppers seeking classic brands and premium service.", "name": "Central Chidlom", "transport": "Take the BTS Skytrain to Chit Lom Station, then walk via the skywalk."}, {"address": "494 Phloen Chit Rd, Lumphini, Pathum Wan District, Bangkok 10330, Thailand", "feature": "\u2b50 4.3 stars | Erawan Bangkok is a boutique luxury shopping center located right next to the famous Erawan Shrine and the Grand Hyatt hotel. It offers a curated collection of international luxury brands, high-end jewelry stores, stylish fashion, and unique designer goods. Compared to massive malls, Erawan Bangkok offers a more intimate and serene shopping atmosphere, allowing guests to enjoy shopping in an undisturbed setting. In addition to fashion, it features fine dining restaurants, cafes, as well as professional beauty salons and spas. It is an ideal choice for customers seeking a high-quality, exclusive, and uncrowded shopping experience.", "name": "Erawan Bangkok", "transport": "Take the BTS Skytrain to Chit Lom Station, then walk via the skywalk."}], "name": "Department Stores \u0026 Fashion Brands"}}, "name": "Siam \u0026 Chit Lom (Shopping Centers)"}, "silom_sathorn": {"categories": {"cat_1": {"items": [{"address": "191 Silom Rd, Silom, Bang Rak, Bangkok 10500 (Silom Complex 1st Floor)", "feature": "\u2b50 4.6 Stars | Must-buy list: Jasmine Essential Oil Body Care Oil, Rice Bran Oil Soap, Lemongrass Essential Oil. HARNN is Thailand\u0027s iconic luxury herbal aromatherapy and skincare brand. Its outlet located in Silom Complex, the commercial heart of Silom, is highly popular among stylish office workers and travelers. The brand insists on using pure natural local Thai herbal ingredients and rice bran oil extracts, blending traditional Thai wellness wisdom into modern skincare. Its luxurious, elegant packaging and long-lasting, stress-relieving natural fragrances make it an essential, refined souvenir when visiting Bangkok.", "name": "HARNN Premium Thai Aromatherapy \u0026 Beauty Counter (HARNN - Silom Complex Branch)", "transport": "Take the BTS to Sala Daeng Station and use the skywalk link to directly access the 1st floor shopping area of Silom Complex."}, {"address": "191 Silom Rd, Silom, Bang Rak, Bangkok 10500 (Silom Complex 2nd Floor)", "feature": "\u2b50 4.5 Stars | Must-buy list: Srichand Translucent Powder, Mistine Super Model Dual-ended Mascara, Cathy Doll Velvet Lip Tint. Known as the Thai version of Sephora, local beauty giant EVEANDBOY is the ultimate holy grail for discovering affordable, high-quality local makeup. The Silom branch showcases hundreds of local Thai and trendy international brands. With budget-friendly prices and fast new arrivals\u2014especially powerful oil-control sunscreens and makeup designed for Southeast Asia\u0027s hot and humid climate\u2014it is a shopping paradise for savvy spenders.", "name": "EVEANDBOY Local Beauty Flagship Store (EVEANDBOY - Silom Complex Branch)", "transport": "Take the BTS to Sala Daeng Station and walk directly into the 2nd floor of Silom Complex."}, {"address": "191 Silom Rd, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.7 Stars | Must-buy list: Lotus Defense Anti-Aging Face Cream, Siamese Water Botanical Hand Cream, Thai Herbal Soothing Massage Oil. PA\u00d1PURI represents Thailand\u0027s premier luxury spa and clean organic skincare brand, advocating non-toxic formulas free from harmful chemical ingredients. The Silom counter offers a full range of high-end skincare and fragrance lines, merging Eastern botanicals with modern scientific extraction techniques. Its premium Lotus Defense skincare line and signature Siamese Water scent rapidly repair skin while soothing body and mind, earning rave reviews from international tourists.", "name": "PA\u00d1PURI Luxury Organic Beauty Counter (PA\u00d1PURI - Silom Complex Branch)", "transport": "Take the BTS to Sala Daeng Station and enter Silom Complex via the skywalk link."}, {"address": "Silom Rd, Khwaeng Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.4 Stars | Must-buy list: Wine \u0026 Rose Body Oil, Thai Herbal Scalp Tonic, Royal Bespoke Roll-on Perfume Oil. Inspired by the court beauty secrets of Thailand\u0027s King Rama V era, Erb combines natural botanicals with royal beauty wisdom. At the Silom retail counter, you can experience skincare products blending modern aesthetics with classic Thai scents. Its distinctive herbal hair care and body moisturizing products effectively soothe skin issues caused by sun exposure or dry weather, making them favorites among Thai high society and travelers alike.", "name": "Erb Royal Thai Aromatherapy \u0026 Cosmetics Counter (Erb - Silom Retail Area)", "transport": "Take the BTS to Sala Daeng Station or MRT to Si Lom Station, then walk for about 3 minutes."}, {"address": "130 Silom Rd, Suriya Wong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.2 Stars | Must-buy list: Boots Cucumber 3-Minute Facial Mask, Tiger Balm Warm Medicated Plaster, Soap \u0026 Glory Body Scrub. Located near the entrance of Silom Soi 2, this Boots store is one of the most popular drugstore shopping spots in the area. In addition to classic British skincare imports, it stocks a vast selection of affordable Thai-made medicines and cosmetics. The store features a dedicated bestseller souvenir zone for tourists where you can pick up Thai mosquito repellents, cooling balms, and intensely hydrating skincare items all at once\u2014often accompanied by Buy-1-Get-1-Free promotions.", "name": "Boots Drugstore Flagship (Boots - Silom Soi 2 Branch)", "transport": "Take the BTS to Sala Daeng Station (Exit 1) and walk for about 2 minutes."}, {"address": "313 Silom Rd, Silom, Bang Rak, Bangkok 10500 (CP Tower 1st Floor)", "feature": "\u2b50 4.3 Stars | Must-buy list: Snake Brand Prickly Heat Cooling Powder, Beauty Buffet Scentio Milk Clarifying Body Lotion, Royal Project Natural Beeswax Lip Balm. Located inside CP Tower in Silom, this large Watsons branch attracts countless office professionals and expats. The store features an exceptionally complete \u0027Local Thai Cosmetics \u0026 Pharmacy Zone,\u0027 offering everything from traditional herbal ointments and Thai-brand milk brightening series to natural skincare products from the Royal Project, making it an ideal spot for buying popular Thai local cosmetics in bulk.", "name": "Watsons Flagship Store (Watsons - CP Tower Silom Branch)", "transport": "Take the BTS to Sala Daeng Station (Exit 1) and walk straight along Silom Road for about 3 minutes."}, {"address": "56 Silom Rd, Suriya Wong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.5 Stars | Must-buy list: Thai Herbal Microwaveable Heating Pad, Cooling Soothing Skin Spray, Thai Herbal Green Balm Stick. Bewell is a highly creative local Thai health, wellness, and personal care brand. Its store on Silom Road is specifically designed to relieve the fatigue of urban office workers and travelers. Alongside ergonomic pressure-relief items, its product line combines traditional Thai herbal therapy to create herbal compress packs, natural soothing essential oils, and herbal balm sticks that offer excellent muscle relaxation and skin conditioning\u2014making it a unique local wellness choice.", "name": "Bewell Ergonomic \u0026 Herbal Wellness Store (Bewell - Silom Branch)", "transport": "Take the BTS to Sala Daeng Station (Exit 1) and walk for about 4 minutes."}, {"address": "52 Thaniya Plaza, Silom Rd, Suriya Wong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.3 Stars | Must-buy list: POY-SIAN 2-in-1 Nasal Inhaler, Abhaibhubejhr Mangosteen Peel Soap, Counterpain Cool Analgesic Gel. Located in Thaniya Plaza at the heart of Silom\u0027s Japanese district, Tsuruha Drug Store combines friendly Japanese-style service with local Thai pharmaceutical and cosmetic specialties. Alongside imported Japanese beauty products, the biggest highlight is its curated selection of pure herbal products developed by Thailand\u0027s Chao Phya Abhaibhubejhr Hospital. Affordable with all-natural ingredients, it is ideal for travelers looking for authentic Thai professional herbal skincare.", "name": "Tsuruha Drug Store (Tsuruha Drug Store - Thaniya Plaza Branch)", "transport": "Take the BTS to Sala Daeng Station (Exit 2) for direct access to Thaniya Plaza Shopping Center."}], "name": "Local Representative Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "9 Surawong Road, Suriyawong, Bang Rak, Bangkok", "feature": "\u2b50 4.6 Stars | Must-Buy List: Classic printed Thai silk scarves, printed canvas totes, short-sleeve Thai silk men\u0027s shirts. This historic flagship store is the birthplace of Jim Thompson, Thailand\u2019s most renowned Thai silk empire. The building itself exudes rich Oriental aesthetics and Thai charm. Inside, you\u0027ll find top-tier, elegant Thai silk apparel, silk scarves, and premium shoes and bags, featuring fabric patterns that seamlessly blend traditional Thai motifs with modern fashion. Though prices lean mid-to-high, the exquisite luster and durability of the fabrics make this a must-visit brand showcasing Bangkok\u2019s finest craftsmanship.", "name": "Jim Thompson Surawong Flagship Store", "transport": "About an 8-minute walk from BTS Sala Daeng Station Exit 1, or a 10-minute walk from MRT Sam Yan Station"}, {"address": "191 Silom Rd, Silom, Bang Rak, Bangkok (Silom Complex 1F)", "feature": "\u2b50 4.3 Stars | Must-Buy List: Thai-designed tropical print dresses, mini crossbody bags with metallic buckles, printed silk scarves. Often dubbed the \u0027Zara of Thailand,\u0027 Jaspal is the powerhouse brand of Thailand\u0027s fashion scene. Located in the heart of the Silom commercial district at Silom Complex, this branch offers the latest seasonal Thai designs featuring tailored cuts ideal for Asian body types, blending tropical resort vibes with sleek urban chic. Their leather footwear, bags, and accessories boast excellent quality at accessible price points, making it a top choice for local professionals and tourists seeking stylish outfits.", "name": "Jaspal (Silom Complex Branch)", "transport": "Directly connected to Silom Complex via skywalk from BTS Sala Daeng Station Exit 2"}, {"address": "191 Silom Rd, Silom, Bang Rak, Bangkok (Silom Complex 2F)", "feature": "\u2b50 4.4 Stars | Must-Buy List: Smilehound classic embroidered dog-logo T-shirts, minimalist tailored tote bags, structured cotton shorts. Greyhound is a pioneer in bringing Thai streetwear onto the international stage, seamlessly fusing minimalist geometric silhouettes with street humor. Its sub-brand, Smilehound, became wildly popular across Thailand thanks to its signature cute dog logo. The clothing here features crisp fabrics and strong design aesthetics, ranging from minimalist monochrome apparel to graffiti-inspired canvas bags\u2014perfect for young shoppers who love independent design and cool street style.", "name": "Greyhound Original (Silom Complex Branch)", "transport": "Directly connected to Silom Complex from BTS Sala Daeng Station Exit 2"}, {"address": "14/2 Soi Suan Phlu, Thung Maha Mek, Sathon, Bangkok", "feature": "\u2b50 4.8 Stars | Must-Buy List: Custom tailored blazers, minimalist silk shirts, handcrafted calfskin loafers. Tucked away in a lush leafy alley in Sathorn, Vvon Sugunnasil is an iconic luxury independent Thai designer brand, beloved by local celebrities and fashion insiders. Known for sharp modern tailoring and ultra-luxurious fabrics, the brand offers bespoke tailoring alongside sophisticated ready-to-wear menswear/womenswear and handmade leather shoes brimming with refined urban elegance. A must-visit for fashion enthusiasts seeking unique, high-end Thai design.", "name": "Vvon Sugunnasil (Sathorn Flagship Store)", "transport": "About a 5-minute taxi ride from BTS Chong Nonsi Station or MRT Lumphini Station"}, {"address": "Silom Rd, Suriyawong, Bang Rak, Bangkok", "feature": "\u2b50 4.5 Stars | Must-Buy List: Handcrafted patchwork leather handbags, embroidered exotic leather long wallets, designer handmade leather sandals. Tango is a storied and renowned Thai luxury leather goods and footwear brand, famous for its bold multi-material patchworks, exotic embroidery, and premium genuine leather craftsmanship. Every bag and pair of shoes here feels like a work of fine art\u2014highly distinctive and rare to find elsewhere. The Silom boutique offers many exclusive limited-edition items, making it a favorite for artisanal crafts lovers who appreciate unique leather styles.", "name": "Tango Leather (Silom Road Boutique)", "transport": "About a 6-minute walk from BTS Sala Daeng Station Exit 1"}, {"address": "191 Silom Rd, Silom, Bang Rak, Bangkok (Silom Complex 3F)", "feature": "\u2b50 4.7 Stars | Must-Buy List: Affordable slim-fit suits, genuine leather dress shoes, leather belt \u0026 tie clip gift sets. Suitcube is a highly popular local brand offering great value suits and gentlemen\u0027s leather shoes. Located in the financial hub of Silom, it is a go-to spot for local businessmen and stylish gents. Their suits are specifically cut for Asian body shapes, offering a slim, flattering fit with breathable, comfortable fabrics. Paired with handmade leather loafers and Oxfords, their products are competitively priced and include on-site alteration services\u2014ideal for anyone looking for high-quality formalwear at accessible prices.", "name": "Suitcube (Silom Complex Branch)", "transport": "Directly connected to Silom Complex from BTS Sala Daeng Station Exit 2"}, {"address": "191 Silom Rd, Silom, Bang Rak, Bangkok (Silom Complex 2F)", "feature": "\u2b50 4.2 Stars | Must-Buy List: American rock-style graphic tops, sleek leather shoulder bags, slim-fit jeans. CPS CHAPS is one of the favorite local high-street brands among Bangkok\u2019s young fashion crowd, featuring American rock, denim, and edgy style. The store offers a vast array of shoes, bags, accessories, and apparel\u2014from high-quality leather bags and biker jackets to stylish statement sneakers. With budget-friendly prices and frequent promotional sales, it\u0027s a great spot to experience Bangkok\u2019s youth fashion scene and pick up trendy, edgy outfits.", "name": "CPS CHAPS (Silom Complex Branch)", "transport": "Directly connected to Silom Complex from BTS Sala Daeng Station Exit 2"}, {"address": "191 Silom Rd, Silom, Bang Rak, Bangkok (Silom Complex 1F)", "feature": "\u2b50 4.5 Stars | Must-Buy List: GENTLEWOMAN classic canvas logo tote bag, cropped casual knit tops, vintage micro-flare jeans. GENTLEWOMAN, the Thai fashion brand that has taken Asia by storm in recent years, operates a hugely popular counter in Silom Complex. Its iconic bold-letter canvas tote bags are a must-have souvenir carried by almost every tourist in Bangkok. Beyond bags, the brand offers diverse, trendy womenswear with youthful and vibrant cuts, making it a must-visit trendsetting destination in Thailand.", "name": "GENTLEWOMAN (Silom Complex Counter)", "transport": "Directly connected to Silom Complex from BTS Sala Daeng Station Exit 2"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "9 Surawong Rd, Suriyawong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.6 stars | Must-Buy List: Premium Thai silk scarves, printed silk coin purses, Thai creative aromatic sachets. This flagship store of Thailand\u0027s most famous Thai silk brand is the ultimate destination for purchasing high-end souvenirs. The architecture itself embodies rich traditional Thai aesthetics. Inside, you\u0027ll find a wide selection of fashion apparel, home decor, and refined accessories made from the highest quality Thai silk. Travelers from around the world come here specifically to pick out exquisite gifts rich in Thai history and artistic value.", "name": "Jim Thompson Surawong Flagship Store", "transport": "Take the BTS to Sala Daeng Station, Exit 1, and walk for about 8 minutes."}, {"address": "Silom 5, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.3 stars | Must-Buy List: Handcrafted freshly fried banana chips, Thai crispy egg rolls, Northern Thai spicy sausage. A famous local market tucked in an alley at the heart of the Silom business district. It earned its nickname (\"Wallet-Melting Market\") because local office workers can\u0027t help emptying their wallets for its vast array of local food and affordable goods. It is a treasure trove for discovering authentic Thai snacks and handmade treats. Numerous stalls serve freshly made traditional Thai desserts at very budget-friendly prices with authentic flavors, bustling with vibrant local life.", "name": "Lalai Sap Market (Wallet-Melting Market)", "transport": "Take the BTS to Chong Nonsi Station, Exit 4, and walk for about 3 minutes."}, {"address": "Yada Building, Ground Floor, Silom Rd, Suriyawong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.5 stars | Must-Buy List: Portable aromatic sachets, classic botanical hand creams, room aromatherapy sprays. A luxury fragrance brand originating from a traditional Bangkok market, renowned for its vintage apothecary style and rich, captivating scents. The Silom concept store creates a warm, cozy everyday atmosphere. Besides essential oils and fragrance products, it also sells exquisite lifestyle accessories and home goods, making it a top choice for picking up high-quality, thoughtful gifts for friends and family.", "name": "Karmakamet Everyday Silom", "transport": "Take the BTS to Sala Daeng Station, Exit 3, and walk for about 1 minute."}, {"address": "286 Silom Rd, Suriyawong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.1 stars | Must-Buy List: Specialty Thai lacquerware boxes, handmade Thai silk elephant plushies, hand-carved wooden tableware. A cultural shopping complex preserving a cluster of 19th-century traditional Thai wooden buildings, serving as an urban oasis in the busy Silom district. The village houses many delicate craft shops and unique souvenir boutiques selling handcrafted traditional Thai handicrafts, lacquerware, wood carvings, and textiles, imbued with rich Thai flavor and vintage artistic charm.", "name": "Silom Village Trade Center", "transport": "Take the BTS to Surasak Station, Exit 3, and walk along Silom Road for about 10 minutes."}, {"address": "31 Silom Rd, Suriyawong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.4 stars | Must-Buy List: Cold-pressed virgin organic coconut oil, additive-free natural dried mangoes, Thai organic brown rice crackers. Lemon Farm is a popular local organic health supermarket in Thailand, dedicated to promoting eco-friendly farm produce and healthy snacks from small local farmers. The store features minimalist and attractive packaging, offering dried fruits, organic teas, herbal skincare products, and healthy local treats\u2014perfect for health-conscious travelers looking for natural gift sets.", "name": "Lemon Farm Silom", "transport": "Take the BTS to Sala Daeng Station, Exit 1, and walk for about 4 minutes."}, {"address": "B Floor, Silom Complex, 191 Silom Rd, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.3 stars | Must-Buy List: ChaTraMue Thai tea leaves, Tao Kae Noi crispy seaweed, Thai Royal Project pure honey. A premium supermarket located on the basement floor of Silom Complex, featuring a dedicated souvenir section for tourists. Whether you\u0027re looking for world-famous Thai seasoning kits, various brands of dried mangoes and nuts, or royal project snacks, you can buy them all in one convenient spot\u2014making it the easiest place to restock popular Thai snacks.", "name": "Tops Market Silom Complex", "transport": "Take the BTS to Sala Daeng Station, Exit 4, where a direct skywalk connects to the basement of Silom Complex."}, {"address": "653 Silom Rd, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.2 stars | Must-Buy List: Local essential oil candles, indie-style handmade straw woven bags, natural herbal compress balls. Baan Silom is an open-air lifestyle plaza bringing together local Thai independent designer brands and boutique shops. Souvenirs sold here feature unique design aesthetics and artisanal textures that stand out from typical night market goods, making it a treasure trove for travelers seeking unique creative gifts and stylish accessories.", "name": "Baan Silom", "transport": "Take the BTS to Chong Nonsi Station, then take a taxi or walk along Silom Road for about 12 minutes."}, {"address": "114 Naradhiwas Rajanagarindra Rd, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.5 stars | Must-Buy List: King Power co-branded premium dried mango, Thai jasmine rice cracker gift box, premium crispy coconut chips. Located inside Bangkok\u0027s iconic Mahanakhon Building, this exquisite retail space gathers Thailand\u0027s highest quality curated souvenirs and local brands. Snacks here come in luxurious, beautiful packaging with strictly controlled quality, tailored for travelers who appreciate premium presentation. After shopping, you can head up to the rooftop observation deck to take in Bangkok\u0027s stunning urban skyline.", "name": "King Power Mahanakhon Retail", "transport": "Take the BTS to Chong Nonsi Station, Exit 3, with direct connection to the Mahanakhon Building."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "919/1 Silom Rd, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.2 stars | Must-Buy List: Marks \u0026 Spencer discounted apparel, Lee / Wrangler discounted jeans, Footwork outlet women\u0027s shoes. Located inside the Jewelry Trade Center in the Silom area, Bangkok Fashion Outlet is one of the rare indoor urban outlets in downtown Bangkok, operated by the Central Group. It houses over 500 famous brands with discounts ranging from 70% to 90% off. The carpeted shopping environment allows tourists to hunt for budget-friendly brand-name clothes, shoes, bags, and underwear in air-conditioned comfort, making it an unmissable treasure-hunting spot in the Sathorn and Silom shopping districts.", "name": "Bangkok Fashion Outlet", "transport": "Take the BTS to Surasak Station and walk for about 8 minutes, or to Sala Daeng Station and walk for about 12 minutes"}, {"address": "191 Silom Rd, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.4 stars | Must-Buy List: NaRaYa Bangkok bags, MUJI Thailand-exclusive fragrances \u0026 snacks, local brand handcrafted scented candles. Silom Complex is the premier integrated shopping mall in the heart of Silom, directly connected to BTS Sala Daeng Station via a skywalk. Inside, you\u0027ll find Central Department Store counters, local Thai designer brands, pharmacies, and a food court. Lacking the usual overcrowding of mega tourist malls, it offers a refined lifestyle vibe favored by local office workers, making it a great spot to shop for native Thai cosmetics and souvenirs.", "name": "Silom Complex", "transport": "Take the BTS to Sala Daeng Station (Exit 2) for direct access, or take the MRT to Si Lom Station and walk for 2 minutes"}, {"address": "286 Silom Rd, Suriya Wong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.1 stars | Must-Buy List: Hand-painted Thai silk scarves, Thai Royal Benjarong hand-painted porcelain, natural herbal essential oil skincare products. Silom Village is a historic, multi-faceted cultural shopping village on Silom Road, composed of several beautifully preserved traditional Thai wooden buildings. It is packed with independent local Thai craft shops, traditional Thai silk specialty stores, and antique gift shops. Stepping away from the coldness of modern concrete malls, it exudes a rich, traditional Thai atmosphere, making it an excellent place to pick up cultural souvenirs.", "name": "Silom Village Trade Centre", "transport": "Take the BTS to Surasak Station and walk for about 10 minutes, or take a taxi to the intersection of Silom Road and Surasak Road"}, {"address": "9 Surawong Rd, Suriya Wong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.6 stars | Must-Buy List: Premium printed Thai silk scarves, silk pillowcases, high-quality cotton tote bags with elephant motifs. Located on Surawong Road (near Silom Road), the Jim Thompson flagship store is the ultimate luxury silk brand store in Thailand. The entire building blends traditional Thai aesthetics with modern architecture. In addition to world-renowned handcrafted silk clothing and home textiles, it features an exclusive art gallery and a high-end restaurant. Offering exquisite craftsmanship, it is the top choice for purchasing high-end luxury Thai handicrafts when visiting the Silom area.", "name": "Jim Thompson Surawong Flagship Store", "transport": "Take the BTS to Chong Nonsi Station or Sala Daeng Station and walk for about 8-10 minutes"}, {"address": "Yada Building, Silom Rd, Suriya Wong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic vintage fragrance sachets, cold-pressed plant essential oil diffusers, scented word hand creams. Karmakamet is Thailand\u0027s premier luxury fragrance brand, and Everyday Karmakamet in the Yada Building focuses on a hipster lifestyle aesthetic. The shop features retro industrial decor filled with unique, healing scents. Beyond classic scent sachets and solid perfumes, it sells stylish canvas bags, stationery, and daily lifestyle items, attracting countless young people and tourists searching for their personal signature scent.", "name": "Karmakamet Everyday Yada Store", "transport": "Take the BTS to Sala Daeng Station (Exit 3) and walk for about 1 minute"}, {"address": "653 Silom 19, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.0 stars | Must-Buy List: Local independent designer real leather women\u0027s shoes, Thai designer dresses, handmade herbal soaps. Tucked away in Silom Soi 19, Baan Silom is an open-air colonial-style shopping arcade offering an elegant and quiet environment with an oasis-like relaxed atmosphere. It gathers many independent local Thai brands, including handcrafted leather goods, designer clothing boutiques, niche fragrance studios, and artistic cafes, allowing visitors who dislike mega chain department stores to enjoy a slow-paced discovery experience.", "name": "Baan Silom", "transport": "Take the BTS to Surasak Station or Chong Nonsi Station, then transfer to a taxi or walk for about 12 minutes"}, {"address": "919/1 Silom Rd, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.3 stars | Must-Buy List: Natural loose colored gemstones, 925 sterling silver jewelry, custom gemstone rings. Located in the core of the Silom district, the Jewelry Trade Center is the most important trading hub for colored gemstones and fine jewelry in Thailand and Asia. The lower floors feature an open jewelry plaza housing hundreds of local Thai jewelers and artisan workshops. Tourists can purchase authority-certified gemstones and unique Thai-designed silver jewelry at transparent and highly competitive prices, making it a paradise for fine jewelry lovers.", "name": "Jewelry Trade Center Thailand", "transport": "Take the BTS to Surasak Station and walk for about 8 minutes"}, {"address": "23 Soi Charoen Krung 24, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.5 stars | Must-Buy List: Limited-edition merchandise by contemporary Thai artists, antique wood carving ornaments, designer printed graphic t-shirts. Situated along Charoen Krung Road by the Chao Phraya River (extending into Sathorn and Silom), River City Bangkok is the city\u0027s most famous shopping mall for antiques and contemporary art. This multi-story complex hosts regularly rotating trendy art exhibitions and brings together a wealth of Thai antique dealers, local artist workshops, and refined lifestyle selection shops, making it the best venue to acquire high-quality, unique souvenirs.", "name": "River City Bangkok", "transport": "From BTS Saphan Taksin Station, take the Chao Phraya Express Boat to Si Phraya Pier, or take a taxi"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Silom \u0026 Sathorn (Business \u0026 Urban Oasis)"}, "sukhumvit": {"categories": {"cat_1": {"items": [{"address": "693 695 Sukhumvit Road, Khlong Tan Nuea, Watthana, Bangkok 10110", "feature": "\u2b50 4.5 stars | A luxury landmark in Bangkok\u0027s Sukhumvit district, famous for its unique architecture, lush sky gardens, and spectacular indoor waterfall. It brings together top international fashion brands, designer boutiques, and an extensive array of fine dining restaurants and cafes offering everything from gourmet cuisine to casual snacks. The mall features a luxury cinema, food hall, and children\u0027s play area to suit every visitor. EmQuartier is not just a shopping paradise, but a modern urban space combining art, nature, and lifestyle\u2014the ultimate destination to experience Bangkok\u0027s high-end lifestyle.", "name": "The EmQuartier", "transport": "BTS Phrom Phong Station"}, {"address": "622 Sukhumvit Road, Khlong Tan, Khlong Toei, Bangkok 10110", "feature": "\u2b50 4.3 stars | A classic luxury department store in Sukhumvit, The Emporium is connected to EmQuartier via a skybridge, together forming the \u0027EM District\u0027. Renowned for its elegant ambiance and curated selection of international luxury brands, it offers high-end fashion, jewelry, cosmetics, and home goods. The complex houses a gourmet supermarket, food court, cinema, and children\u0027s educational center, delivering a one-stop shopping and entertainment experience. Its timeless design and exceptional service make it a top choice for affluent shoppers in Bangkok.", "name": "The Emporium", "transport": "BTS Phrom Phong Station"}, {"address": "2, 88 Sukhumvit Road, Khlong Toei Nuea, Watthana, Bangkok 10110", "feature": "\u2b50 4.4 stars | Famous for its unique \u0027airport terminal\u0027 theme, each floor of Terminal 21 represents a world-famous destination like Tok
