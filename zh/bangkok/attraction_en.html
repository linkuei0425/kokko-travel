        const dbData = {"chatuchak": {"categories": {"cat_1": {"items": [{"address": "3300 Phahonyothin Rd, Chom Phon, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.0 stars | The Elephant Tower is one of Bangkok\u0027s most iconic and eccentric postmodern buildings, designed by renowned architect Sumet Jumsai and completed in 1997. Inspired by Thailand\u0027s national animal, the 32-story structure consists of three interconnected towers forming the elephant\u0027s legs, body, trunk, and tusks. Although named one of the most controversial buildings by international media, it holds immense fame and unique historical significance in modern Thai architecture, making it a must-see photo landmark in North Bangkok.", "name": "Elephant Tower (Chang Building)", "transport": "Take the BTS to Phahonyothin 24 Station, then walk about 3 minutes after exiting."}, {"address": "175 Phahonyothin Rd, Sanambin, Don Mueang, Bangkok 10210", "feature": "\u2b50 4.5 stars | Established in 1952, the Royal Thai Air Force Museum preserves Thailand\u0027s rich military aviation history within its classic exhibition halls. The museum houses dozens of historic military aircraft, helicopters, and rare combat planes, including WWII vintage aircraft and unique Thai-modified models. Offering free admission and a rich historical ambiance, it is a valuable destination for exploring Southeast Asian aviation history and military architecture.", "name": "Royal Thai Air Force Museum", "transport": "Take the BTS Sukhumvit Line directly to Royal Thai Air Force Museum Station; the entrance is right outside the station exit."}, {"address": "499 Kamphaeng Phet 6 Rd, Lat Yao, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.6 stars | MOCA Bangkok is an architectural masterpiece seamlessly blending contemporary design with traditional Thai aesthetics. Its exterior features solid white granite carved with intricate Thai motifs, allowing sunlight to filter through the openwork patterns and create a stunning play of light and shadow inside. Spanning five floors, it displays hundreds of world-class paintings and sculptures reflecting Thai art evolution, religious beliefs, and folklore, standing as a sparkling cultural landmark in North Bangkok.", "name": "MOCA Bangkok - Museum of Contemporary Art", "transport": "Take the SRT Red Line to Bang Khen Station, then walk about 5 minutes after exiting."}, {"address": "149 Phahonyothin Rd, Anusawari, Bang Khen, Bangkok 10220", "feature": "\u2b50 4.4 stars | Built in 1941, Wat Phra Si Mahathat is a royal temple of immense political and religious significance in modern Thai history, constructed to commemorate the transition to a constitutional monarchy in 1932. Combining traditional Thai Buddhist architecture with modern minimalist lines, the temple features a grand white stupa housing Buddha relics and sacred Bodhi tree cuttings brought from India. Set in serene and spacious grounds, it marks a pivotal historical turning point in North Bangkok.", "name": "Wat Phra Si Mahathat Wora Maha Viharn", "transport": "Take the BTS to Wat Phra Sri Mahathat Station; exit 1 leads directly to the temple entrance."}, {"address": "Chatuchak, Bangkok 10900", "feature": "\u2b50 4.3 stars | Krung Thep Aphiwat Central Terminal (formerly Bang Sue Grand Station) is Southeast Asia\u0027s largest modern transportation hub, officially opened in 2021 to replace the century-old Hua Lamphong Station. This mega-structure blends modern industrial technology with traditional Thai clock tower elements, featuring a magnificent royal clock tower at the front and a vast indoor concourse. Symbolizing a new era for Thai railways, its grand architecture has become a prominent modern landmark in North Bangkok.", "name": "Krung Thep Aphiwat Central Terminal", "transport": "Take the MRT Blue Line to Bang Sue Station, or take the SRT Red Line directly to Krung Thep Aphiwat Central Terminal."}, {"address": "Kamphaeng Phet Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.1 stars | Located in the heart of Chatuchak Park, the Chatuchak Park Clock Tower is a classic landmark built when the park was established. Featuring elegant traditional Thai finials paired with a modern-classical tower design, it has long served as the park\u0027s most recognizable meeting point and historic icon. Surrounded by lush greenery and a serene artificial lake, it stands as a witness to North Bangkok\u0027s transformation from undeveloped land into a world-famous market and leisure hub.", "name": "Chatuchak Park Clock Tower", "transport": "Take the BTS to Mo Chit Station or MRT to Chatuchak Park Station, then walk into the park to reach the tower."}, {"address": "Chatuchak Park, Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.0 stars | Located on the north side of Chatuchak Park, the Thai Railway Hall of Fame is a historical attraction dedicated to Thailand\u0027s century-old railway heritage and vintage steam locomotives. The indoor and outdoor areas exhibit several retired steam engines, wooden train cars, and recreated historical railway scenes. The building itself reflects a charming vintage style reminiscent of early Thai train stations, making it a classic spot for train enthusiasts and history buffs.", "name": "Thai Railway Hall of Fame", "transport": "Take the BTS to Mo Chit Station, walk north through Chatuchak Park for about 10 minutes to arrive."}, {"address": "1110 Phahonyothin Rd, Chom Phon, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.2 stars | Situated at the border of Lat Phrao and Chatuchak, St. John\u0027s Church is a historic and distinctive Catholic landmark in North Bangkok. Built in the mid-20th century, the church features a geometric structure blending Western modernism with subtle Eastern touches. Inside, magnificent stained-glass windows and towering vaulted ceilings catch the sunlight, casting divine rays of light. Serving as a spiritual hub for local Catholics, it showcases Bangkok\u0027s multicultural heritage and diverse religious architecture.", "name": "St. John\u0027s Church Bangkok", "transport": "Take the MRT to Phahon Yothin Station, then walk about 5 minutes after exiting."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "499 Kamphaeng Phet 6 Rd, Lat Yao, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.6 stars | Founded by Thai telecom tycoon Boonchai Bencharongkul, this five-story private museum displays over 800 precious works of modern Thai art. The building\u0027s exterior features intricately carved granite that plays elegantly with light and shadow. Highlights include massive canvases depicting Buddhist cosmology and the cycle of rebirth, alongside sculptures and paintings blending Thai mythology with surrealism. It is an absolute must-visit world-class art sanctuary for contemporary art lovers in Bangkok.", "name": "MOCA Bangkok (Museum of Contemporary Art)", "transport": "Take the SRT Red Line to Bang Khen Station and walk for about 5 minutes; or take a taxi from BTS Mo Chit Station for about 10 minutes."}, {"address": "810 Kamphaeng Phet 2 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.4 stars | Located next to Chatuchak Park, this is Southeast Asia\u0027s first interactive discovery museum designed specifically for children. It features multiple indoor and outdoor themed zones, including a dinosaur fossil dig sandbox, science experiment zone, engineering and construction lab, and a refreshing outdoor water park. Emphasizing hands-on learning, it encourages kids to spark their imagination and creativity in a safe environment, making it a favorite family spot for locals and tourists alike.", "name": "Children\u0027s Discovery Museum Bangkok", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 1) or BTS to Mo Chit Station (Exit 1), then walk for about 8\u201310 minutes."}, {"address": "9 Ratchadapisek Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.3 stars | Housed inside the Siam Commercial Bank (SCB) headquarters, this museum chronicles the evolution of Thailand\u0027s monetary and financial systems. Divided into several themed galleries, it showcases rare ancient coins, banknotes, early banking equipment, and the history of Thailand\u0027s first domestic bank. Through interactive multimedia displays and realistic historical recreations, visitors gain fascinating insights into Thai currency culture and modern economic development.", "name": "Thai Bank Museum", "transport": "Take the MRT to Phahon Yothin Station, then take a taxi or bus for about 5 minutes to SCB Park Plaza."}, {"address": "Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.2 stars | Tucked away in the lush greenery of Queen Sirikit Park, this greenhouse eco-museum features a massive domed glasshouse recreating a tropical rainforest habitat. Thousands of butterflies across dozens of native Thai species flutter freely here. Educational panels and insect specimens detail the life cycle and ecological traits of butterflies, offering an enriching, sensory eco-adventure surrounded by fragrant blooms and fluttering wings.", "name": "Bangkok Butterfly Garden and Insectarium", "transport": "Take the BTS to Mo Chit Station or MRT to Chatuchak Park Station, then walk for about 15 minutes through Chatuchak Park or Queen Sirikit Park."}, {"address": "175 Phahonyothin Rd, Si Kan, Don Mueang, Bangkok 10210", "feature": "\u2b50 4.5 stars | Located in Don Mueang, North Bangkok, this museum showcases the glorious history and extensive fleet of the Royal Thai Air Force since its inception. The collection features dozens of decommissioned fighter jets, cargo planes, helicopters, and rare historic propeller aircraft\u2014including one of the world\u0027s few surviving WWII-era models. Beyond aircraft, it exhibits military uniforms, weaponry, and interactive aerospace displays, making it an unmissable destination for aviation enthusiasts and history buffs.", "name": "Royal Thai Air Force Museum", "transport": "Take the BTS Green Line directly to Royal Thai Air Force Museum Station (N22); exit via Exit 2 right to the entrance."}, {"address": "1110 Phahonyothin Rd, Chom Phon, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.5 stars | Located near Ha Yeak Lat Phrao, this is one of North Bangkok\u0027s iconic Catholic churches. Part of St. John\u0027s Group of Schools, its architecture blends modern geometric lines with traditional Gothic elements, featuring soaring spires and exquisite stained glass that glows serenely in the sunlight. A peaceful sanctuary for daily prayer, the church also hosts grand masses and festive light displays during Christmas and key religious holidays.", "name": "St. John\u0027s Church Bangkok", "transport": "Take the MRT to Phahon Yothin Station (Exit 2) or BTS to Ha Yeak Lat Phrao Station, then walk for about 5\u20137 minutes."}, {"address": "50 Ngamwongwan Rd, Lat Yao, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.1 stars | Located on the campus of the prestigious Kasetsart University, this specialized museum is dedicated to biodiversity and natural science education. It houses an extensive collection of Thai flora and fauna specimens, marine life, and geological minerals, illustrating the evolutionary history of Thailand\u0027s terrestrial and aquatic ecosystems. With an inspiring academic atmosphere and engaging temporary exhibits, it offers an immersive journey through nature.", "name": "Kasetsart University Natural History Museum", "transport": "Take the BTS Green Line to Kasetsart University Station (Exit 1), enter the campus, and walk or take the campus shuttle bus to reach the museum."}, {"address": "Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.0 stars | Located inside Vachirabenjatas Park (Railway Park), this gem documents and preserves a century of history and heritage from the State Railway of Thailand (SRT). Exhibits include vintage steam locomotives, nostalgic wooden carriages, antique railway signs, manual signal lamps, and rare historical photographs. Reliving the golden era of Thai rail transit, it is a hidden haven for train enthusiasts and vintage culture lovers.", "name": "Hall of Railway Heritage", "transport": "Take the BTS to Mo Chit Station or MRT to Chatuchak Park Station, then walk for about 12 minutes into Railway Park to reach the hall."}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Kamphaeng Phet 1 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.4 stars | Chatuchak Park is one of Northern Bangkok\u0027s most famous urban oases, located right next to the bustling Chatuchak Weekend Market. The park features a large artificial lake where you can stroll along lakeside paths lined with lush tropical plants and foliage. It is not only a popular spot for locals to walk, jog, and picnic, but cute swan paddle boats are also available for visitors to rent on the lake. With sculpture gardens and several pedestrian bridges connecting to nearby transit hubs, it offers a serene natural retreat immediately after diving into the hustle and bustle of market shopping.", "name": "Chatuchak Park", "transport": "Take the BTS to Mo Chit Station (Exit 1 or 3), or take the MRT to Chatuchak Park Station (Exit 1)."}, {"address": "Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.5 stars | Covering a vast area, Rot Fai Park was formerly a golf course for the State Railway of Thailand and has now transformed into Bangkok residents\u0027 favorite natural sports park. The park boasts dedicated bike paths spanning several kilometers\u2014shaded, flat, and easy to ride\u2014with cheap bicycle rentals available on-site. The park also features flower gardens, a water sports area, basketball courts, and rich bird habitats. It is perfect for family outings, picnics, or leisurely cycling under leafy canopies to enjoy a rare moment of relaxation.", "name": "Vachirabenjatas Park / Rot Fai Park", "transport": "Take the BTS to Phahonyothin 24 Station or Mo Chit Station, then take a taxi for about 5 minutes; or walk from Chatuchak Park through Queen Sirikit Park."}, {"address": "Kamphaeng Phet 2 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.6 stars | Queen Sirikit Park is a meticulously designed and beautifully maintained botanical garden, built in 1992 to celebrate Queen Sirikit\u0027s 60th birthday. The park houses thousands of plant species and rare flowers from Thailand and around the world, centered around an artificial lake shaped like a map of Thailand. Highlights include elegant lotus ponds, scenic fountains, shaded avenues, and several exquisite classical pavilions. Quieter and more elegant than neighboring Chatuchak Park, it is a fantastic destination for plant enthusiasts and photography lovers seeking to capture natural beauty and find inner peace.", "name": "Queen Sirikit Park", "transport": "Take the MRT to Kamphaeng Phet Station (Exit 2) and walk for about 10 minutes."}, {"address": "Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.3 stars | A hidden natural gem inside Rot Fai Park, the Bangkok Butterfly Garden features a giant, well-ventilated netted dome greenhouse. Recreating a true tropical rainforest ecosystem with abundant nectar plants, streams, and waterfalls, hundreds of colorful butterfly species flutter gracefully around visitors. The indoor exhibition area introduces the life cycle of butterflies alongside insect specimens. Free to enter, it offers incredible educational and visual delight\u2014a comforting, must-visit spot when visiting Northern Bangkok\u0027s park network.", "name": "Bangkok Butterfly Garden and Insectarium", "transport": "Take the MRT to Chatuchak Park Station and walk through Chatuchak Park and Queen Sirikit Park, or take a taxi directly into Rot Fai Park."}, {"address": "Nikom Rot Fai Sai 2 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.7 stars | Nestled by the lake inside Rot Fai Park, Suan Mokkh Bangkok is a lakeside sanctuary blending natural greenery with spiritual meditation. This modern two-story wood and concrete building is surrounded by dense trees and emerald waters, offering an extraordinarily quiet and tranquil atmosphere. Visitors can sit quietly along the lake corridors to meditate, read philosophical books, or admire the peaceful lake views where Asian water monitors and fish are often seen swimming. It is a wonderful spiritual haven for anyone looking to cleanse their mind and enjoy a breeze in nature amidst a busy Bangkok trip.", "name": "Suan Mokkh Bangkok / Buddhadasa Indapanno Archives", "transport": "Take the MRT to Phahon Yothin Station (Exit 3), then take a taxi for about 5 minutes to the eastern lakeside of Rot Fai Park."}, {"address": "50 Ngamwongwan Rd, Lat Yao, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.4 stars | As Thailand\u0027s oldest and most renowned agricultural university, Kasetsart University\u0027s Northern Bangkok campus feels like a massive botanical garden. The lush, shaded campus features beautiful tree tunnels, large artificial lakes, and various experimental farm landscapes. It is also a famous spot for viewing Thai Tabebuia rosea (Pink Trumpet Blossom); during blooming season, the main avenue explodes into a breathtaking sea of pink flowers. The peaceful and youthful campus environment is open to the public for walking, cycling, or experiencing the daily green lifestyle of local university students.", "name": "Kasetsart University Green Park", "transport": "Take the BTS Sukhumvit Line directly to Kasetsart University Station; Exit 1 leads right to the campus entrance."}, {"address": "Pracha Niwet 1 Rd, Lat Yao, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.2 stars | Tucked deep within the Chatuchak District of Northern Bangkok, Prachaniwet Park is a neighborhood natural park beloved by local Thai residents. Built around a large pond, it features a lakeside jogging track, outdoor fitness equipment, a children\u0027s play area, and several shaded pavilions. Free of heavy tourist crowds, it offers an authentic glimpse into local leisure life in Bangkok. In the morning and evening, locals can often be seen doing aerobic dances, running, or walking their pets\u2014making it a hidden gem for experiencing Northern Bangkok\u0027s authentic local pace.", "name": "Prachaniwet Park", "transport": "Take the SRT Red Line to Wat Samian Nari Station, then take a taxi or motorcycle taxi for about 5 minutes."}, {"address": "Kamphaeng Phet 4 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.5 stars | Located next to Chatuchak Park, the outdoor section of the Bangkok Children\u0027s Discovery Museum is an interactive eco-park designed specifically for families. It features a large outdoor water park, treehouse climbing structures, a sandpit archaeological dig area, and a tree-lined lawn park. Combining nature education with physical adventure, kids can touch soil, plants, and water in a safe setting. Meticulously maintained and free for families with children, it is a uniquely engaging family nature spot in Northern Bangkok.", "name": "Children\u0027s Discovery Museum Outdoor Park", "transport": "Take the BTS to Mo Chit Station or MRT to Kamphaeng Phet Station (Exit 1), then walk for about 5 to 8 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "499 Kamphaeng Phet 6 Rd, Lat Yao, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.6 stars | Acclaimed as Bangkok\u0027s most beautiful and photo-worthy art hall, this five-story museum features a minimalist pure-white architectural exterior and a light-filled skylight atrium loved by photography enthusiasts. The most famous Instagram spots inside are the \u0027Cosmic Tunnel to Heaven\u0027 and the \u0027Richard Green Room\u0027 lined with massive classical oil paintings. Stepping inside feels like stepping straight into a classic European museum\u2014both elegant and awe-inspiring.", "name": "MOCA Museum of Contemporary Art Bangkok", "transport": "Take the SRT Red Line to Bang Khen Station and walk about 5 minutes from the exit, or take a taxi from BTS Mo Chit Station for about 10 minutes."}, {"address": "Ratchadapisek Rd, Chom Phon, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.4 stars | Converted from the former Thai amusement park \u0027Dan Neramit,\u0027 this night market preserves a stunning vintage Disney-style fairytale castle that emits a romantic and enchanting vibe when illuminated at night. Decorated with vintage classic cars, hot air balloon installations, and grassy lounge areas, it is not only a fantastic spot to enjoy authentic Thai delights like Volcano Ribs and marinated raw seafood, but also one of Northern Bangkok\u0027s hottest night photo spots.", "name": "Jodd Fairs DanNeramit", "transport": "Take the BTS to Ha Yaek Lat Phrao Station or Phahonyothin 24 Station, then walk for about 5 to 8 minutes."}, {"address": "Kamphaeng Phet 2 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.5 stars | Built in 1987 to celebrate the King\u0027s 60th birthday, this clock tower stands at the heart of the Chatuchak Weekend Market. It serves as the ultimate landmark and meeting point for visitors navigating the vast, sprawling maze of the market. Standing tall amidst colorful stall tents and bustling crowds, it offers a picture-perfect shot filled with local Thai energy and nostalgic charm\u2014a must-photo stop for anyone visiting Chatuchak.", "name": "Chatuchak Weekend Market Clock Tower", "transport": "Take the BTS to Mo Chit Station Exit 1, or take the MRT to Kamphaeng Phet Station Exit 2 and walk directly."}, {"address": "Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.5 stars | Once a golf course for the State Railway of Thailand, this sprawling park has transformed into a lush green haven loved by hipsters and photography enthusiasts. The park boasts endless tree tunnels, a dreamy small yellow bridge, and seasonal sunflower fields. Visitors can rent vintage bicycles to cruise along the tree-lined paths, snap lovely photos, and soak in the rare tranquility and natural beauty of Northern Bangkok.", "name": "Wachirabenchathat Park (Rot Fai Park)", "transport": "Take the BTS to Mo Chit Station or MRT to Chatuchak Park Station, walk through Chatuchak Park, and proceed on foot or by rented bicycle."}, {"address": "Wachirabenchathat Park, Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.3 stars | Tucked inside Rot Fai Park, this massive domed greenhouse is a rare ecological photo spot in downtown Bangkok. Inside the giant steel-and-glass dome lies a tropical haven filled with lush plants, cascading waterfalls, and babbling streams, where thousands of live butterflies flutter around you. Sunlight filters beautifully through the mesh dome, creating ethereal light effects perfect for magical, nature-inspired portraits and trendy Instagram photos.", "name": "Bangkok Butterfly Garden and Insectarium", "transport": "Take the BTS to Mo Chit Station and transfer to a taxi, or ride a bicycle inside Rot Fai Park to the butterfly garden area."}, {"address": "Kamphaeng Phet 2 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.3 stars | As Southeast Asia\u0027s largest railway hub, this brand-new central terminal features awe-inspiring modern architectural design. Spacious, bright high-ceiling halls with clean geometric lines, sleek minimalist platform steel structures, and futuristic glass curtain walls draw architecture lovers and photographers alike. The perfect symmetrical perspectives allow you to capture sci-fi-esque, futuristic visual masterpieces.", "name": "Krung Thep Aphiwat Central Terminal", "transport": "Take the MRT Blue Line directly to Bang Sue Station and walk straight into the station hall via the underground connecting walkway."}, {"address": "Kamphaeng Phet 2 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.6 stars | Adjacent to Chatuchak Market, Queen Sirikit Park is a meticulously designed botanical garden featuring elegant European-style landscape gardens, lotus ponds, and a breathtaking tropical glasshouse. Delicate geometric flowerbeds complement the rare succulents and leafy tropical plants inside the greenhouse, effortlessly creating romantic, high-fashion magazine-style photos. It is a rare, refined haven in Northern Bangkok.", "name": "Queen Sirikit Park Glasshouse", "transport": "Take the MRT to Kamphaeng Phet Station Exit 2, and walk for about 8 minutes to reach the park entrance."}, {"address": "8 Kamphaeng Phet 3 Rd, Chatuchak, Bangkok 10900", "feature": "\u2b50 4.3 stars | Mixt Chatuchak is a fully air-conditioned shopping mall adjacent to Chatuchak Weekend Market. Beyond being a welcome, cool haven for tired shoppers, its exterior walls and outdoor plaza showcase vibrant graffiti and street murals created by renowned local Thai artists. The bold, colorful art featuring Thai cultural elements and trendy street style makes it a must-visit photo spot for younger generations exploring Chatuchak.", "name": "Mixt Chatuchak Street Art Wall", "transport": "Take the MRT to Kamphaeng Phet Station Exit 2 and walk about 5 minutes, or walk about 10 minutes from BTS Mo Chit Station."}], "name": "Popular Photo Spots"}}, "name": "\u6070\u5716\u6070\u8207\u5317\u66fc\u8c37 (\u5e02\u96c6\u8207\u5728\u5730\u9ad4\u9a57)"}, "chinatown": {"categories": {"cat_1": {"items": [{"address": "661 Charoen Krung Rd, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.6 stars | Located at the end of Yaowarat Road, Wat Traimit is world-famous for housing the world\u0027s largest solid gold Buddha statue. Weighing 5.5 tons, this seated golden Buddha dates back to the Sukhothai period. It was previously covered in plaster to hide it from invading forces and was only rediscovered in 1955 when the plaster cracked during relocation. The main temple structure is a grand multi-tiered white Thai-style building, which also houses the Bangkok Chinatown Heritage Centre inside. The center details the history of Chinese immigration and Chinatown\u0027s development, making it an excellent site for religious and historical exploration.", "name": "Wat Traimit Withayaram Worawihan (Temple of the Golden Buddha)", "transport": "Take the MRT to Wat Mangkon Station and walk for about 8 minutes, or from Hua Lamphong Station and walk for 5 minutes."}, {"address": "423 Charoen Krung Rd, Pom Prap, Pom Prap Sattru Phai, Bangkok 10100", "feature": "\u2b50 4.5 stars | Built in 1871, Wat Mangkon Kamalawat is the oldest and largest Teochew-style Chinese Buddhist temple in Bangkok. It beautifully showcases traditional southern Chinese architectural craftsmanship, including swept-up eaves, intricate carvings, and glazed tile roofs. The temple enshrines the Three Precious Buddhas and the Four Heavenly Kings. It has long served as the central spiritual sanctuary for Bangkok\u0027s Chinese community to pray for good fortune, ward off bad luck (Tai Suey), and wish for peace and health. During Chinese New Year and the Nine Emperor Gods Festival, the temple is filled with incense smoke and bustling crowds, offering a vibrant cultural experience.", "name": "Wat Mangkon Kamalawat (Leng Noei Yi Temple)", "transport": "Take the MRT to Wat Mangkon Station (Exit 3) and walk for about 1 minute."}, {"address": "Yaowarat Rd, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.4 stars | Standing at the center of the roundabout, the Chinatown Gate is an iconic structure funded and built by the Thai-Chinese community to celebrate King Bhumibol Adulyadej\u0027s 72nd birthday. The ceremonial archway features a rich Chinese palace architectural style with ornate carved beams, colorful roof decorations, and dragons playing with a pearl. The plaque bears the inscription \u0027Sheng Shou Wu Jiang\u0027 (Long Live the King) handwritten by Princess Maha Chakri Sirindhorn. Symbolizing the harmony between Thai and Chinese cultures as well as the community\u0027s deep respect for the Thai Royal Family, it serves as the perfect starting point and photo spot for exploring Bangkok\u0027s Chinatown.", "name": "Chinatown Gate (Odeon Circle)", "transport": "Take the MRT to Hua Lamphong Station (Exit 1) and walk for about 6 minutes."}, {"address": "282 Soi Wanit 2, San Chao Rong Kueak, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.3 stars | Tucked deep inside the alleyways of Talat Noi, So Heng Tai Mansion is a Hokkien-style courtyard house (Siheyuan) over 200 years old. Built by the So family who migrated to Thailand during the Qing Dynasty, it preserves rare wooden curved eaves, classic carved doors and windows, and a central courtyard. Combining history with modern flair, the current descendant and owner built a deep-water diving pool in the courtyard, merging heritage conservation with a diving school while operating a cozy nostalgic cafe. Visitors can enjoy a beverage inside this two-century-old historical landmark while soaking in its rich sense of history.", "name": "So Heng Tai Mansion", "transport": "Take the MRT to Hua Lamphong Station or Wat Mangkon Station, then take a tuk-tuk or walk for about 12 minutes."}, {"address": "125 Charoen Krung Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.4 stars | Widely considered the oldest surviving Chinese Taoist shrine in Thailand, Leng Buai Ia Shrine dates back to 1658 during the late Ayutthaya period. Nestled deep within the bustling alleys of old Yaowarat, this compact and exquisite shrine is dedicated to Leng Buai Ia (Leng Buai Seng Wong). The architecture captures the essence of classic Teochew design, housing ancient plaques gifted during the Guangxu and Daoguang reign periods of the Qing Dynasty. Filled with curling incense smoke and a serene ancient ambiance, it is an indispensable cultural treasure for studying early Chinese immigration history in Thailand.", "name": "Leng Buai Ia Shrine", "transport": "Take the MRT to Wat Mangkon Station (Exit 2) and walk for about 3 minutes into the alley."}, {"address": "586 Song Wat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.5 stars | Wat Samphanthawong is a third-grade royal temple originating from the Ayutthaya period, formerly named \u0027Wat Hwa Chuan\u0027 because it was once surrounded by water like an island. Deeply tied to the development of Chinatown, the temple halls are solemn and elegant, blending traditional Thai Buddhist architecture with decorative details funded by the Chinese community. Enshrining Buddha statues renowned for fulfilling prayers, it offers a rare haven of tranquility amidst the bustling commercial district of Chinatown, preserving centuries of local spiritual devotion.", "name": "Wat Samphanthawong Ratchaworawihan", "transport": "Take the MRT to Wat Mangkon Station and walk for about 8 minutes, or take the Chao Phraya Express Boat to Ratchawong Pier and walk for 5 minutes."}, {"address": "Song Wat Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.6 stars | Built along the Chao Phraya River, Song Wat Road is a historic commercial street designated and established by King Rama V in 1906. The avenue preserves a wealth of early 20th-century two-story shophouses built in Neoclassical and Baroque Revival styles, featuring exquisite plasterwork, wooden shutters, and balconies that reflect the prosperous trading golden era. In recent years, the street has attracted hip cafes, art galleries, and independent shops, transforming it into one of Bangkok\u0027s most popular vintage neighborhoods where old-world charm meets modern culture.", "name": "Song Wat Road Historic Buildings", "transport": "Take the MRT to Wat Mangkon Station and walk for about 7 minutes, or take the Chao Phraya Express Boat to Ratchawong Pier (N5)."}, {"address": "1621 Charoen Krung Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.5 stars | Wat Pathum Khongkha is a major royal temple dating back to the Ayutthaya period, extensively restored during the reign of King Rama I. The name translates to \u0027Lotus Pond Temple\u0027. The main ordination hall features exquisite murals depicting Jataka tales (lives of the Buddha) and traditional Thai cosmology. Furthermore, the temple preserves a historical \u0027Execution Stone\u0027, which was used during the early Rattanakosin era for executing royal traitors, giving the temple a fascinating layer of legendary history and deep cultural significance.", "name": "Wat Pathum Khongkha Ratchaworawihan", "transport": "Take the MRT to Hua Lamphong Station or Wat Mangkon Station, then walk for about 10 minutes or take a tuk-tuk."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "661 Charoen Krung Rd, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.6 stars | Located on the 2nd and 3rd floors of Wat Traimit, the Chinatown Heritage Centre is the premier destination to dive into the history of Chinese immigration to Bangkok. Utilizing modern interactive multimedia displays, realistic scale models, and rare historical photographs, the museum vividly recreates the epic journey of Chinese immigrants arriving in Siam aboard red-headed junks from the late 19th to early 20th centuries, building businesses and establishing prosperity along Yaowarat Road. The 4th floor houses the world\u0027s largest solid gold Buddha statue. Combining religious reverence with cultural education, it is well worth spending one to two hours exploring.", "name": "Wat Traimit \u0026 Yaowarat Chinatown Heritage Centre", "transport": "Take the Bangkok MRT to Hua Lamphong Station, Exit 1, and walk about 5 minutes."}, {"address": "1224 Yotha Rd, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.5 stars | Perched on the banks of the Chao Phraya River, Holy Rosary Church is a Gothic Revival Catholic church with over a century of history. Originally established by Portuguese settlers in 1786, the current structure was rebuilt in 1891. The exterior features soaring spires and elegant arches, while the interior is dominated by stunning stained-glass windows imported from France that depict stories from the Old and New Testaments. When sunlight filters through the glass onto the antique wooden pews, it creates an aura of serene sanctity. The church stands as a testament to the unique blending of Western heritage with the vibrant local Chinatown community.", "name": "Holy Rosary Church (Wat Kalawar)", "transport": "Take the Bangkok MRT to Hua Lamphong Station and walk about 10 minutes, or take the Chao Phraya Express Boat to Marine Department Pier and walk 3 minutes."}, {"address": "13 Maitri Chit Rd, Pom Prap, Pom Prap Sattru Phai, Bangkok 10100", "feature": "\u2b50 4.5 stars | Founded in 1837, Maitrichit Baptist Church is the first Protestant Christian church in Thailand\u0027s history, originally built to serve and support Teochew Chinese immigrants arriving in Bangkok. Today, the building showcases a crisp, classical Western architecture with pure white facade walls and elegant arched windows, standing as a peaceful sanctuary amidst bustling Chinatown. Inside, historical photos and artifacts detail early Christian evangelism in Thailand and the development of the Chinese Christian community, making it an essential heritage landmark for exploring the district\u0027s religious diversity.", "name": "Maitrichit Baptist Church", "transport": "Take the Bangkok MRT to Hua Lamphong Station, Exit 3, and walk about 3 minutes."}, {"address": "282 Soi Wanit 2, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.2 stars | Hidden deep within the narrow alleys of Talat Noi, So Heng Tai Mansion is a 200-year-old traditional courtyard residence built by the Hokkien So family who settled in Thailand during the Qing Dynasty. The mansion exquisitely preserves classic Southern Fujian architecture, including swept eaves, intricate carved wooden windows, and a central open courtyard. In a delightful modern twist, the current family descendants transformed the courtyard into a commercial scuba diving pool and opened a charming retro cafe. Visitors can sip iced Thai milk tea while admiring this living architectural treasure of Chinese heritage.", "name": "So Heng Tai Mansion", "transport": "Take the Bangkok MRT to Hua Lamphong Station or Wat Mangkon Station, then take a Tuk-Tuk or walk about 12 minutes into the Talat Noi neighborhood."}, {"address": "23 Soi Charoen Krung 24, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.5 stars | Located adjacent to Chinatown on the banks of the Chao Phraya River, River City Bangkok is the city\u0027s premier art and antiques center. Spanning four floors, this contemporary cultural hub houses dozens of high-end antique shops, private art galleries, and vast exhibition spaces. It regularly hosts curated exhibitions by emerging Thai and international artists, interactive digital art showcases, and prestige art auctions. The rooftop and riverside boardwalk offer stellar spots to watch the sunset over the Chao Phraya River and enjoy nighttime views of riverbank churches, seamlessly blending classic antique collection with contemporary visual arts.", "name": "River City Bangkok", "transport": "Take the Chao Phraya Express Boat to Si Phraya Pier and walk 2 minutes, or take a taxi from MRT Hua Lamphong Station (approx. 5 minutes)."}, {"address": "606 Charoen Krung Rd, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.6 stars | Founded in 1905, Thian Fah Foundation was Thailand\u0027s first charitable hospital. Situated within its complex is a highly revered Guanyin Shrine, rich in historical and artistic value. The shrine houses a magnificent standing wooden statue of Guanyin carved during China\u0027s Song Dynasty and brought from Luoyang; despite centuries of history, it remains impeccably preserved. The shrine\u0027s design features elaborate beams, painted dragon columns, and colorful murals that represent classic Chinese temple craftsmanship. It serves as both a spiritual sanctuary and a tribute to Chinese philanthropic tradition.", "name": "Thian Fah Foundation \u0026 Guanyin Shrine", "transport": "Take the Bangkok MRT to Wat Mangkon Station, Exit 1, and walk about 6 minutes along Yaowarat Road."}, {"address": "225 Chakkrawat Rd, Chakkrawat, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.3 stars | Wat Chakrawat (famously known as the Crocodile Temple) is a major royal temple dating back to the Ayutthaya period, steeped in deep history and quirky local lore. The complex features small historical display spaces, ancient stone landscaping, and a famous courtyard pond housing live giant crocodiles\u2014a tradition rooted in a legendary historical tale of a rogue crocodile captured in the Chao Phraya River and cared for by monks. The temple also shelters a sacred Buddha Footprint shrine and classic Thai carvings, offering an intriguing glimpse into traditional temple culture and local legends.", "name": "Wat Chakrawatrachawat Woramahawihan (Crocodile Temple)", "transport": "Take the Bangkok MRT to Wat Mangkon Station, Exit 1, and walk about 8 minutes."}, {"address": "248 Chiang Mai Rd, Khlong San, Bangkok 10600", "feature": "\u2b50 4.3 stars | Positioned across the river with deep historical ties to Chinatown\u0027s ferry trade, Lhong 1919 originated in the mid-19th century as the \u0027Wang Lee\u0027 steamship port and warehouse built by prominent Chinese merchant family Chen Cihuang. Meticulously restored, this historic heritage site featuring Qing Dynasty Southern Fujian architecture has been revitalized into a lifestyle complex containing a Mazu shrine, mural art galleries, boutique design shops, and cultural heritage exhibits. The complex preserves original painted murals and heavy timber structural beams, vividly reflecting the golden era of Chinese maritime trade with artistic charm.", "name": "Lhong 1919 Heritage \u0026 Creative Park", "transport": "Take a cross-river ferry from Chinatown\u0027s Rachawongse Pier to Din Daeng Pier and walk, or walk 8 minutes from BTS Gold Line Khlong San Station."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Suan Pha Phuok, Phra Pok Klao Bridge, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.5 stars | Built on an abandoned electric train bridge over the Chao Phraya River, this elevated green park connects Bangkok\u0027s Chinatown with the Thonburi district. Featuring lush elevated walkways, relaxing benches, and multi-level observation decks, it is a fantastic hidden gem for enjoying sunset over the Chao Phraya River and viewing historical architecture on both banks. A cool breeze sweeps through in the evening, making it a popular stroll spot for locals and tourists to watch busy river traffic and magnificent temple silhouettes.", "name": "Chao Phraya Sky Park", "transport": "Take the Bangkok MRT to Sanam Chai Station, Exit 8, and walk for about 10 minutes."}, {"address": "139 Soi Somdet Chao Phraya 3, Somdet Chao Phraya, Khlong San, Bangkok 10600", "feature": "\u2b50 4.6 stars | Located just across Memorial Bridge from Chinatown, this hidden garden was built in honor of the mother of King Rama IX. The park beautifully preserves traditional old-world Thai architecture and old factory ruins amidst towering ancient trees and tranquil ponds, exuding rich historical character and a serene atmosphere. A small museum on-site showcases the Princess Mother\u0027s life story, making it a tranquil green retreat to escape the bustle of Chinatown and soak in local history.", "name": "Princess Mother Memorial Park", "transport": "Take a Tuk-Tuk from Chinatown for about 10 minutes, or take a river ferry to Memorial Bridge (N6) Pier and walk for about 8 minutes."}, {"address": "Ong Ang Canal, Chakkrawat, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.4 stars | After a major revitalization by the Bangkok Metropolitan Administration, Khlong Ong Ang transformed from a cluttered vendor area into an artistic green canal walkway. Rich greenery lines the canal alongside vibrant street murals celebrating the multicultural heritage of Chinatown and Phahurat (Little India). On weekend evenings, it comes alive as a pedestrian zone with street performers and creative night markets\u2014a shining example of urban renewal blended with waterfront charm.", "name": "Khlong Ong Ang Canal Park", "transport": "Take the Bangkok MRT to Sam Yot Station, Exit 1, and walk for just 3 minutes."}, {"address": "Unakan Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.3 stars | Built on the grounds of the former Bangkok Central Jail, this lush urban park has been transformed into a vibrant public green space. Preserving historic wall sections and guard towers, the park incorporates elegant fountains, stylized ponds, and open lawns. With its dense shade trees, it is a favorite spot for locals to jog, practice yoga, or walk their dogs, serving as a unique green oasis near Chinatown.", "name": "Rommaninat Park", "transport": "Take the Bangkok MRT to Sam Yot Station, Exit 3, and walk for about 5 minutes."}, {"address": "Soi San Chao Rong Khueak, Talat Noi, Samphanthawong, Bangkok 10100", "feature": "\u2b50 4.4 stars | Located along the banks of the historic Talat Noi neighborhood in Chinatown, this riverside promenade seamlessly connects an ancient Chinese-Thai community with Chao Phraya water views. Centuries-old trees, traditional shophouses, and creative large-scale street murals line the path, offering vistas of modern architecture across the river and passing boats. Perfect for an afternoon stroll, it captures authentic old-Bangkok vibes amidst cool river breezes.", "name": "Talat Noi Waterfront Walkway", "transport": "Take the Bangkok MRT to Hua Lamphong Station, Exit 1, and walk for about 12 minutes to the Talat Noi neighborhood."}, {"address": "254 Phaya Thai Rd, Wang Mai, Pathum Wan, Bangkok 10330", "feature": "\u2b50 4.7 stars | Sitting on the edge of Chinatown, this expansive modern eco-park is a landmark model of sustainable water management in Bangkok. Featuring an inclined landscape designed to collect rainwater, the park boasts sprawling lawns, constructed wetlands, forest pathways, and retention ponds. Elegant and refreshing, it offers stunning views where the city skyline meets rolling greenery at sunset\u2014an ideal spot to relax and appreciate cutting-edge landscape design.", "name": "Chulalongkorn University Centenary Park", "transport": "Take the Bangkok MRT to Sam Yan Station, Exit 2, then take a Tuk-Tuk for about 5 minutes."}, {"address": "Between Rachini Rd and Charoen Krung Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.4 stars | Located west of Chinatown near the Grand Palace, Saranrom Park originally served as a royal garden during the reign of King Rama V. Designed in an elegant 19th-century European landscape style, it blends traditional Thai pavilions, ancient shade trees, fountains, and tropical flora. The park is exceptionally tranquil and well-maintained; you might even spot large water monitor lizards swimming in the ponds\u2014a lovely green refuge of classic royal heritage.", "name": "Saranrom Park", "transport": "Take the Bangkok MRT to Sanam Chai Station, Exit 1, and walk for about 6 minutes."}, {"address": "Maharat Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.5 stars | Situated right along the Chao Phraya River, this compact green park offers unrivaled postcard-worthy views of Wat Arun (Temple of Dawn) across the water. Neatly manicured lawns, riverside paths, and tropical greenery fill the space. As sunset paints the sky, golden light bathes the river and the spires of Wat Arun in breathtaking romance. It is a premier spot for photographers capturing twilight and night views of Bangkok\u0027s iconic waterfront.", "name": "Nagaraphirom Park", "transport": "Take the Bangkok MRT to Sanam Chai Station, Exit 1, and walk for about 8 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Yaowarat Rd, Samphanthawong, Bangkok 10100, Thailand", "feature": "\u2b50 4.5 stars | The most iconic visual landmark of Bangkok\u0027s Chinatown. As night falls, the massive, intricately hung Chinese neon signs on both sides of Yaowarat Road light up simultaneously, bathing the street in a retro, dreamy atmosphere reminiscent of 1980s Hong Kong cinema. This is the ultimate first stop for every visitor to Bangkok. Whether capturing the bustling traffic at the busy intersections or taking a photo against the dazzling sea of lights at a street corner, you\u0027re guaranteed to get breathtaking, cinematic urban shots.", "name": "Yaowarat Road Neon Signscape", "transport": "Take the MRT to Wat Mangkon Station (Exit 1) and walk for about 3 minutes to reach the main Yaowarat Road."}, {"address": "Traimit Rd, Talat Noi, Samphanthawong, Bangkok 10100, Thailand", "feature": "\u2b50 4.4 stars | Located in the center of the traffic circle at the start of Yaowarat Road, this grand and towering Chinese ceremonial archway was built to celebrate King Rama IX\u0027s 72nd birthday, symbolizing a historical milestone for Chinese immigrants settling in Thailand. Designed in classic Chinese palace style with intricately carved beams and painted pillars, the gate features name plaques in both Chinese and Thai. The vibrant red, green, and gold colors gleam brilliantly under the blue sky, making it an iconic entrance landmark for taking check-in photos when entering Chinatown.", "name": "Chinatown Gate / Odeon Circle", "transport": "Take the MRT to Hua Lamphong Station (Exit 1) and walk for about 5 minutes."}, {"address": "661 Tri Mit Rd, Talat Noi, Samphanthawong, Bangkok 10100, Thailand", "feature": "\u2b50 4.6 stars | An ancient temple housing the world\u0027s largest solid gold Buddha statue, weighing an incredible 5.5 tons and radiating a solemn, majestic aura. The elegant white structure with golden roof details is striking, and standing atop the massive white staircase offers a bird\u0027s-eye view of Chinatown\u0027s lively streets. The temple also houses a rich Chinatown History Museum, adding great cultural depth. The main hall of white marble glistens in the sunlight, making it a spectacular photo spot.", "name": "Wat Traimit Withayaram Worawihan (Golden Buddha Temple)", "transport": "Take the MRT to Hua Lamphong Station and walk for about 6 minutes."}, {"address": "423 Charoen Krung Rd, Pom Prap, Pom Prap Sattru Phai, Bangkok 10100, Thailand", "feature": "\u2b50 4.6 stars | Built in 1871, this is Bangkok\u0027s largest and most influential traditional Teochew-style Chinese temple. Dedicated to various Buddhas, Bodhisattvas, and Taoist deities, incense continuously burns here. Featuring red brick walls, green tiles, exquisitely carved pillars, and courtyards filled with blessing lanterns, it exudes a rich oriental vintage charm. During the Lunar New Year and the Vegetarian Festival, the courtyard is draped with red lanterns, creating a stunning scene that attracts countless photography enthusiasts.", "name": "Wat Mangkon Kamalawat (Leng Noei Yi Temple)", "transport": "Take the MRT to Wat Mangkon Station (Exit 3); the temple entrance is right outside the exit."}, {"address": "Song Wat Rd, Samphanthawong, Bangkok 10100, Thailand", "feature": "\u2b50 4.7 stars | Stretching along the Chao Phraya River, Song Wat Road is one of Bangkok\u0027s hottest hip vintage streets in recent years. Once Chinatown\u0027s busiest cargo pier in the 19th century, today it preserves a wealth of old Sino-Portuguese and Baroque-style mansions adorned with massive murals painted by local and international artists. The street is now home to independent cafes, art galleries, and trendy lifestyle shops. Every casual snap taken while strolling here radiates timeless texture and artistic flair.", "name": "Song Wat Road Heritage \u0026 Art Street", "transport": "Take the MRT to Wat Mangkon Station (Exit 1) and walk towards the Chao Phraya River for about 8 minutes."}, {"address": "Soi San Chao Rong Kueak, Talat Noi, Samphanthawong, Bangkok 10100, Thailand", "feature": "\u2b50 4.6 stars | Adjacent to Chinatown, Talat Noi is an ancient neighborhood packed with charming rustic ruins and hipster vibes. Its narrow, winding alleys are filled with lively and fun modern street graffiti murals. The most famous photo spot is an abandoned red-and-yellow vintage Fiat car parked against an old wall, engulfed in lush climbing plants. The entire community offers a seamless blend of industrial scrap metal and authentic Thai-Chinese historic daily life, with delightful surprises around every corner.", "name": "Talat Noi Street Art \u0026 Vintage Car", "transport": "Take the MRT to Hua Lamphong Station (Exit 1) and walk for about 12 minutes to enter the Talat Noi neighborhood."}, {"address": "479-481 Yaowarat Rd, Samphanthawong, Bangkok 10100, Thailand", "feature": "\u2b50 4.5 stars | A boutique theme hotel located in the heart of Yaowarat Road, beautifully recreating the glamorous, romantic, and lavish vibe of 1930s Shanghai. The hotel entrance features a red arched bridge spanning over a pond with carved lanterns. Step inside to find rich crimson hues, retro metallic chandeliers, birdcage seats, and cheongsam-inspired decor. Even if you\u0027re not staying overnight, sipping a custom cocktail at their bar or terrace restaurant will immerse you in an intensely nostalgic atmosphere reminiscent of a Wong Kar-wai film like \u0027In the Mood for Love\u0027.", "name": "Shanghai Mansion Bangkok Lobby", "transport": "Take the MRT to Wat Mangkon Station (Exit 1) and walk for about 4 minutes."}, {"address": "103 Phat Sai, Samphanthawong, Bangkok 10100, Thailand", "feature": "\u2b50 4.3 stars | Founded in 1927, this nearly century-old venue is Bangkok\u0027s oldest traditional Thai-Chinese coffee shop. The interior retains decades-old wooden tables, round marble tops, and traditional coffee brewing tools, creating a heartwarming scene every morning where locals young and old gather to chat. Order a cup of rich traditional Thai black coffee paired with condensed milk butter toast, take a photo at the weathered storefront, and soak in the authentic, irreplaceable everyday charm of Bangkok\u0027s Chinatown.", "name": "Eiah Sae Coffee", "transport": "Take the MRT to Wat Mangkon Station (Exit 1) and walk for about 5 minutes."}], "name": "Popular Photo Hotspots"}}, "name": "\u5510\u4eba\u8857 (\u7f8e\u98df\u8207\u6587\u5316)"}, "rattanakosin": {"categories": {"cat_1": {"items": [{"address": "Na Phra Lan Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.6 stars | The Grand Palace is one of Bangkok\u0027s most famous landmarks. Once the official residence of the Kings of Siam, it still hosts royal ceremonies and official guests. This magnificent complex blends traditional Thai architecture, art, and religious heritage, featuring breathtaking golden spires, intricate murals, and elaborate sculptures. Its most sacred area is Wat Phra Kaew, home to the revered Emerald Buddha. Visitors can immerse themselves in the rich history and grand dignity of the Thai royal court. Please note the strict dress code: shoulders must be covered, and long trousers or skirts are required.", "name": "Grand Palace", "transport": "Take the Chao Phraya Tourist Boat to Tha Chang Pier (N9) and walk from there, or take a taxi/Grab."}, {"address": "Na Phra Lan Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand (Located inside the Grand Palace)", "feature": "\u2b50 4.7 stars | Located within the Grand Palace grounds, Wat Phra Kaew is Thailand\u0027s most sacred temple, housing the Emerald Buddha carved from a single block of jade. The statue\u0027s robes are changed seasonally by the King, symbolizing national prosperity. The opulent temple grounds display the pinnacle of Thai Buddhist art with shimmering golden pagodas, detailed murals, and imposing Yaksha (demon guardian) statues. It is an unmissable destination to experience profound religious devotion and master craftsmanship.", "name": "Wat Phra Kaew (Temple of the Emerald Buddha)", "transport": "Take the Chao Phraya Tourist Boat to Tha Chang Pier (N9) and walk from there, or take a taxi/Grab."}, {"address": "2 Sanam Chai Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.5 stars | As one of Bangkok\u0027s oldest and largest temples, Wat Pho is renowned for its massive Reclining Buddha statue measuring 46 meters long and 15 meters high. Covered in gold leaf, the statue features intricate mother-of-pearl inlay on the soles of its feet, depicting 108 auspicious symbols of the Buddha. Wat Pho is also considered the birthplace of traditional Thai medical education and Thai massage, housing a famous massage school on site. With its stunning stupas and fine murals, it offers a wonderful deep dive into Thai culture.", "name": "Wat Pho (Temple of the Reclining Buddha)", "transport": "Take the Chao Phraya Tourist Boat to Tha Tien Pier (N8) and walk, or take a taxi/Grab."}, {"address": "158 Thanon Wang Doem, Wat Arun, Bangkok Yai, Bangkok 10600, Thailand", "feature": "\u2b50 4.6 stars | Situated on the west bank of the Chao Phraya River, Wat Arun is one of Bangkok\u0027s iconic landmarks, famous for its grand central Khmer-style pagoda (prang). Rising 79 meters high, the spire is decorated with colorful fragments of Chinese porcelain and seashells that sparkle in the sunlight, creating breathtaking views at sunrise and sunset. Visitors can climb a section of the spire for panoramic vistas of the river and Old Town Bangkok. Its intricate artistry makes it a must-visit for photography enthusiasts and culture seekers.", "name": "Wat Arun (Temple of Dawn)", "transport": "Take the Chao Phraya Tourist Boat to Tha Tien Pier (N8), then take a cross-river ferry to the temple, or go by taxi/Grab."}, {"address": "Bamrung Mueang Rd, Sao Chingcha, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.3 stars | Located in front of Wat Suthat in Bangkok\u0027s Old Town, the Giant Swing is an iconic city landmark. This towering red teak structure was historically used in Brahmin swing ceremonies to celebrate harvest festivals and welcome deities to Earth. Though the ritual has long been discontinued for safety, the swing remains a symbolic tribute to Thailand\u0027s rich religious traditions. The surrounding neighborhood is filled with historic buildings and famous street food stalls worth exploring.", "name": "Giant Swing (Sao Ching Cha)", "transport": "Take a taxi/Grab, or take the MRT to Sam Yot Station and walk for about 15 minutes."}, {"address": "Ratchadamnoen Klang Rd, Wat Bowon Niwet, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.0 stars | Located in the center of Bangkok, the Democracy Monument was built in 1939 to commemorate the 1932 Siamese Revolution, which transitioned Thailand from an absolute monarchy to a constitutional monarchy. The four wing-like structures represent the army, navy, air force, and police, while the central pedestal holds a copy of the Constitution. Standing as a monument to political transformation, it sits at a key traffic roundabout and remains a prominent focal point in local history.", "name": "Democracy Monument", "transport": "Take a taxi/Grab, or take the boat to Phan Fa Lilat Pier (N5) and walk about 10-15 minutes."}, {"address": "Na Phra That Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.3 stars | As the largest museum in Thailand, the National Museum Bangkok houses an extraordinary collection of Thai art, history, and cultural artifacts. Housed inside the former 18th-century palace of the Vice King (Front Palace), the museum exhibits range from prehistoric artifacts to royal regalia, ceremonial chariots, intricate Buddhist sculptures, and traditional musical instruments. It is an exceptional destination for anyone looking to gain deep insight into the rich heritage and artistic evolution of Thailand.", "name": "National Museum Bangkok", "transport": "Take the Chao Phraya Tourist Boat to Tha Phra Chan Pier (N10) and walk, or take a taxi/Grab."}, {"address": "344 Thanon Chakkraphatdi Phong, Ban Bat, Pom Prap Sattru Phai, Bangkok 10100, Thailand", "feature": "\u2b50 4.4 stars | Wat Saket is a famous landmark in Bangkok\u0027s Old Town, celebrated for its striking golden chedi standing atop a man-made hill. Visitors climb a winding path of about 300 steps shaded by trees, passing waterfalls and ringing prayer bells along the way. At the top, you are rewarded with a magnificent 360-degree panoramic view of Bangkok\u0027s Old Town, including iconic sights like the Grand Palace and Democracy Monument. Housing sacred Buddha relics, it is both an active place of worship and a fantastic spot for panoramic city views.", "name": "Wat Saket (The Golden Mount)", "transport": "Take a taxi/Grab, or take the boat to Phan Fa Lilat Pier (N5) and walk about 15-20 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Na Phra That Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.3 stars | As one of the largest museums in Southeast Asia, the National Museum Bangkok houses a rich collection of Thailand\u0027s historical, artistic, and cultural heritage. Located on the grounds of the former Front Palace (Wang Na), it displays artifacts spanning from prehistoric times to the modern era, including Buddha statues, royal regalia, weapons, musical instruments, ceramics, and traditional attire. The museum\u0027s architecture itself is of immense historical value, featuring breathtaking murals and classical Thai design. It is an exceptional venue to gain deep insights into Thai Buddhist art, courtly life, and the evolution of its historical eras.", "name": "National Museum Bangkok", "transport": "Take the Chao Phraya Tourist Boat to Tha Chang Pier and walk for about 10\u201315 minutes, or take a taxi/Grab."}, {"address": "4 Sanam Chai Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.4 stars | Museum Siam is a modern, highly interactive museum that tells the story of Thai history and culture through innovative means. Housed in a beautiful European classical style building, it explores the central question \"What does being Thai mean?\" using multimedia displays, hands-on exhibits, and engaging storytelling. The museum covers Thai society, culture, beliefs, and lifestyles from ancient times to the present day, allowing visitors to learn in a fun, relaxed environment. Perfect for families and younger audiences, its unique narrative style sheds traditional museum dullness to offer an inspiring cultural experience.", "name": "Museum Siam", "transport": "Take the MRT Blue Line to Sanam Chai Station (Exit 1) for direct access, or take the Chao Phraya Tourist Boat to Ratchini Pier and walk for about 5 minutes."}, {"address": "The Grand Palace, Na Phra Lan Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.6 stars | Located within the Grand Palace complex, the Queen Sirikit Museum of Textiles is dedicated to preserving, displaying, and promoting Thai textile arts and traditional garments. It houses Queen Sirikit\u0027s exquisite personal collection of Thai silk dresses alongside traditional textiles from across Thailand. Exhibits detail the craftsmanship, historical evolution, and key role of Thai silk in national culture and royal ceremonies. Visitors can admire stunning embroideries, weaving techniques, and lavish designs, gaining deep appreciation for Thai textiles as a refined art form. It is an elegant, educational destination showcasing Thailand\u0027s rich artisan traditions.", "name": "Queen Sirikit Museum of Textiles", "transport": "Located inside the Grand Palace complex (entry required). Take the Chao Phraya Tourist Boat to Tha Chang Pier and walk for about 5\u201310 minutes."}, {"address": "2 Lan Luang Rd, Wat Sommanat, Pom Prap Sattru Phai, Bangkok 10100", "feature": "\u2b50 4.0 stars | The King Prajadhipok Museum commemorates the only monarch in Thai history to voluntarily abdicate the throne. Housed in a grand European-style building, the museum displays the King\u0027s life, personal effects, historical documents, and the political and social transformations during his reign. Exhibits detail Thailand\u0027s pivotal transition from absolute to constitutional monarchy and King Prajadhipok\u0027s role in modernizing and democratizing the nation. It provides insightful learning for visitors interested in modern Thai history and the royal family.", "name": "King Prajadhipok Museum", "transport": "Taking a taxi or Grab is recommended; or take a bus to a nearby stop."}, {"address": "69 Thanon Si Ayutthaya, Dusit, Bangkok 10300", "feature": "\u2b50 4.6 stars | Wat Benchamabophit, also known as the Marble Temple, is one of Bangkok\u0027s most iconic and magnificent temples. Renowned for its construction using Italian Carrara marble, it masterfully blends traditional Thai Buddhist architecture with European neoclassical influences. Its golden roof and pristine white marble walls gleam in the sunlight, housing an exquisite Sukhothai-style Buddha statue inside. The surrounding cloister houses 52 Buddha statues from various regions and eras across Thailand, serving as a mini museum of Buddhist art. Its serene atmosphere and intricate details make it a must-visit destination for photographers and culture seekers alike.", "name": "Wat Benchamabophit (Marble Temple)", "transport": "Taking a taxi or Grab is recommended; or take a bus to a nearby stop."}, {"address": "146 Bamrung Mueang Rd, Wat Ratchabophit, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.5 stars | Wat Suthat is one of Bangkok\u0027s oldest and most prominent royal temples, famous for its impressive scale and detailed murals. Inside stands a massive bronze Buddha, while the ordination hall\u0027s walls feature masterpieces of Thai art illustrating the life of the Buddha and Buddhist cosmology. Standing right in front of the temple is the Giant Swing (Sao Ching Cha), an iconic landmark once used in ancient Brahmin rituals symbolizing the connection between the city and the cosmos. Visitors can immerse themselves in Thailand\u0027s deep spiritual traditions while marveling at magnificent architecture and art.", "name": "Wat Suthat \u0026 Giant Swing", "transport": "Take the MRT Blue Line to Sanam Chai Station and walk for about 10\u201315 minutes, or take a taxi/Grab."}, {"address": "4 Chao Fa Rd, Chana Songkhram, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.1 stars | Housed inside a historic former Royal Mint building, The National Gallery Bangkok is one of Thailand\u0027s premier art institutions. It features Thai artworks spanning from the 17th century to the present, encompassing traditional paintings, sculptures, and modern/contemporary art pieces. The exhibitions trace the evolution of Thai art from classic Buddhist motifs to Western-influenced modern styles. Visitors can admire the skill and unique perspectives of Thai artists while gaining deep insight into the country\u0027s diverse creative landscape\u2014a must-visit treasury for art lovers.", "name": "The National Gallery Bangkok", "transport": "Take the Chao Phraya Tourist Boat to Phra Arthit Pier and walk for about 5\u201310 minutes, or take a taxi/Grab."}, {"address": "2 Atsadang Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200", "feature": "\u2b50 4.7 stars | Built by King Rama V, Wat Ratchabophit is a uniquely ornate royal temple in Bangkok combining traditional Thai architecture with Western Gothic influences. Its exterior is clad in vibrant hand-painted ceramic tiles, while the interior stuns with Italian marble and stained glass windows, creating a fascinating blend of East and West. The central pagoda enshrines sacred relics of the Buddha, and its royal cemetery serves as the final resting place for numerous members of the Thai royal family. Beyond its religious significance, this temple is an architectural masterpiece reflecting the exquisite artistic taste of the Thai monarchy.", "name": "Wat Ratchabophit", "transport": "Take the MRT Blue Line to Sanam Chai Station and walk for about 10\u201315 minutes, or take a taxi/Grab."}], "name": "Art Museums \u0026 Temples"}, "cat_3": {"items": [{"address": "Na Phra That Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.5 stars | Sanam Luang is a vast and historic open field located in the heart of Bangkok\u0027s Rattanakosin Island. Serving as a royal ceremonial site and a vital public space, it is deeply rooted in Thai history and culture, surrounded by iconic landmarks like the Grand Palace, Wat Phra Kaew (Temple of the Emerald Buddha), and Thammasat University. Originally known as \u0027Thung Phra Men\u0027 (the Royal Cremation Ground), it was renamed \u0027Sanam Luang\u0027 (the Royal Field) by King Rama IV. Today, it is a popular spot for locals to relax, fly kites, and join in various cultural events and festivals throughout the year. Its sprawling green lawn offers a rare sense of open space in the bustling city, serving as a peaceful haven and a great vantage point to admire the surrounding grand architecture.", "name": "Sanam Luang (Royal Field)", "transport": "Take the Chao Phraya Tourist Boat to Tha Chang Pier and walk for about 10 minutes; or take various bus routes to the Sanam Luang bus stop."}, {"address": "Thanon Sanam Chai, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.1 stars | Located near the Grand Palace and Wat Pho, Saranrom Park is a historic public park originally built as part of Saranrom Palace by King Rama IV for his princes. Renowned for its tranquil atmosphere and exquisite landscaping, the park features manicured lawns, ancient trees, fountains, and a charming pond home to turtles and fish. Complete with elegant pavilions, walking paths, and historic monuments, it\u0027s an ideal spot for both locals and tourists seeking a moment of peace. It provides a green oasis away from the city\u0027s hustle, allowing visitors to enjoy nature surrounded by historical architecture.", "name": "Saranrom Park", "transport": "Take the Chao Phraya Tourist Boat to Tha Chang Pier or Ratchini Pier and walk about 5-10 minutes; or take a bus to a nearby stop."}, {"address": "Phra Sumen Rd, Chana Songkhram, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.4 stars | Nestled along the banks of the Chao Phraya River around the historic Phra Sumen Fort, Santichaiprakarn Park is one of the most popular riverside parks in Bangkok\u0027s Old City. Famous for its stunning river views, fresh breeze, and iconic backdrop of the Rama VIII Bridge, the park boasts open lawns, shady trees, and a central plaza designed for recreational activities. In the evening, locals and travelers gather here to stroll, jog, dance, or simply take in the sunset. Featuring a traditional Thai pavilion and a small children\u0027s playground, it\u0027s a delightful spot to experience Bangkok\u0027s riverfront life and historical charm.", "name": "Santichaiprakarn Park", "transport": "Take the Chao Phraya Tourist Boat to Phra Arthit Pier\u2014the park is right outside the pier; or take a bus to a nearby stop."}, {"address": "Maha Rat Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.2 stars | Located on the east bank of the Chao Phraya River directly opposite the iconic Wat Arun (Temple of Dawn), Nagaraphirom Park is a relatively new waterfront park offering unmatched panoramic river and temple views. Modern and clean in design, it features spacious walkways, lush green lawns, and comfortable seating areas. It is a prime spot for taking unobstructed photos of Wat Arun and watching the sunset. The park frequently hosts cultural events and markets, making it a great place to unwind and absorb the magic of Bangkok\u0027s riverfront. Its prime location also serves as a convenient transit hub between the Grand Palace, Wat Pho, and Wat Arun.", "name": "Nagaraphirom Park", "transport": "Take the Chao Phraya Tourist Boat to Tha Tien Pier and walk for about 5 minutes; or take a bus to a nearby stop."}, {"address": "Maha Chai Rd, Samran Rat, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 3.9 stars | Located in the heart of Bangkok\u0027s Old City near the Giant Swing and Wat Pho, Rommaninat Park is a charming public park built on the site of a former prison. Designed to honor Thailand\u0027s judicial history while providing a serene green escape, the park features well-maintained lawns, diverse tropical foliage, fountains, and historic monuments. Though cozy in size, its unique past and lovely surroundings make it a favorite local spot for morning exercise, casual walks, and relaxation. The park also houses the Corrections Museum, allowing visitors to learn about Thai legal history while taking in the natural greenery.", "name": "Rommaninat Park", "transport": "Take a bus to the Giant Swing stop and walk about 5 minutes; or take a taxi/tuk-tuk directly there."}, {"address": "Maha Rat Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand (Near Grand Palace)", "feature": "\u2b50 4.1 stars | Built to celebrate the 80th birthday of King Bhumibol Adulyadej (Rama IX), this park is located near the Grand Palace and offers a spacious, beautifully landscaped green environment. It features manicured lawns, vibrant flowerbeds, fountains, and a rich variety of tropical plants. Beyond being a relaxing urban sanctuary, it often serves as a venue for official royal ceremonies and public celebrations. With comfortable walking paths and shaded seating, it\u0027s a peaceful spot to recharge after exploring nearby historic landmarks, offering a clean, solemn oasis in Bangkok\u0027s Old City.", "name": "King Rama IX 80th Birthday Anniversary Park (Chaloem Phrakiat Park)", "transport": "Take the Chao Phraya Tourist Boat to Tha Chang Pier and walk for about 10 minutes; or take a bus to a nearby stop."}, {"address": "344 Thanon Chakkraphatdi Phong, Ban Bat, Pom Prap Sattru Phai, Bangkok 10100, Thailand", "feature": "\u2b50 4.5 stars | Although the \u0027Golden Mount\u0027 itself is man-made, its elevated location and lush surrounding greenery make it a unique natural and scenic experience in Bangkok\u0027s Old City. Visitors climb about 300 gently winding steps framed by leafy trees, misty water features, and cheerful bird chirps, creating a serene atmosphere far removed from urban noise. At the top sits a gleaming golden chedi offering breathtaking 360-degree panoramic views of Bangkok\u2014blending modern skyscrapers in the distance with historic rooftops below. The climb itself is a refreshing outdoor experience, especially in the early morning or late afternoon when cool breezes blow, making it an extraordinary place to soak in history and scenic views.", "name": "Golden Mount (Wat Saket Ratcha Wora Maha Wihan)", "transport": "Take the Khlong Saen Saep Express Boat to Phanfa Leelard Pier and walk about 5 minutes; or take a bus to a nearby stop."}, {"address": "Maha Chai Rd, Wat Bowon Niwet, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.0 stars | Situated on the eastern edge of Bangkok\u0027s Old City around the historic Mahakan Fort\u2014one of only two surviving ancient fortresses in Bangkok\u2014this small and charming park offers a leafy green space where visitors can relax alongside old city walls and the canal moat. Featuring tidy lawns, towering trees, and quiet benches, it is both a lovely neighborhood park for a peaceful stroll and an important historical marker of Bangkok\u0027s ancient defense system. Its tranquil setting stands in pleasant contrast to the surrounding city streets, making it a unique stop to experience the harmonious blend of history and nature.", "name": "Mahakan Fort Park", "transport": "Take the Khlong Saen Saep Express Boat to Phanfa Leelard Pier and walk about 10 minutes; or take a bus to a nearby stop."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Na Phra Lan Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.5 Stars | Bangkok\u0027s most magnificent architectural complex, formerly the residence of the Kings of Siam and a proud symbol of Thailand. Its resplendent golden buildings, intricate murals, and the solemn grandeur of the Temple of the Emerald Buddha draw countless visitors for photos and sightseeing. Rich in history and artistry in every corner, it is the ultimate destination to experience Thai royal culture and religious traditions. Capture awe-inspiring Thai architectural beauty, particularly striking under the sunlight when golden roofs and colorful tiles sparkle brilliantly\u2014an unmissable photo spot.", "name": "The Grand Palace", "transport": "It is recommended to take a taxi, tuk-tuk, or Chao Phraya Tourist Boat to Tha Chang Pier, then walk from there."}, {"address": "158 Thanon Wang Doem, Wat Arun, Bangkok Yai, Bangkok 10600, Thailand", "feature": "\u2b50 4.7 Stars | Situated along the Chao Phraya River, famous for its unique Khmer-style stupas encrusted with colorful porcelain tiles and seashell fragments that shimmer under the sun. At sunset, the golden silhouette created against the twilight sky is one of Bangkok\u0027s most iconic views. Climb the central stupa for sweeping riverside panoramas and marvel at its grand elegance. Lit up at night, Wat Arun shines brilliantly, making it a dream location for night photography.", "name": "Wat Arun (Temple of Dawn)", "transport": "Take the Chao Phraya Tourist Boat to Tha Tien Pier, then take a cross-river ferry to reach the temple."}, {"address": "2 Sanam Chai Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.6 Stars | One of Bangkok\u0027s oldest and largest temples, renowned for its giant Reclining Buddha. Measuring 46 meters long and 15 meters high, the gold-leaf covered statue features feet inlaid with 108 mother-of-pearl auspicious symbols. As the birthplace of traditional Thai massage and medicine, the complex also boasts ornate stupas and murals. It offers a serene atmosphere perfect for admiring exquisite Buddhist artistry and snapping memorable photos.", "name": "Wat Pho (Temple of the Reclining Buddha)", "transport": "Take a taxi, tuk-tuk, or Chao Phraya Tourist Boat to Tha Tien Pier, then walk a short distance."}, {"address": "Bamrung Mueang Rd, Wat Ratchabophit, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.3 Stars | Located in central Bangkok, this towering 27-meter red teak structure was historically used in Brahmin swinging ceremonies. Though the rituals have ended, its iconic architecture and rich historical significance make it a standout landmark. Surrounded by historic sites like Wat Suthat, it provides an exotic backdrop where travelers love taking photos to capture Old Town Bangkok\u0027s charming atmosphere.", "name": "The Giant Swing (Sao Ching Cha)", "transport": "Take a taxi or tuk-tuk, or take the MRT to Sam Yot Station and walk about 15 minutes."}, {"address": "2 Maha Chai Rd, Wat Bowon Niwet, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.5 Stars | Bangkok\u0027s unique \u0027Metal Castle\u0027 features 37 black spires symbolizing the 37 virtues required for enlightenment\u2014one of only three such metal structures remaining in the world. Distinct from traditional Thai temples, its metallic spires and intricate carvings radiate a mysterious elegance under the sun. Head up to the top floor for panoramic views and stunning photo angles. A favorite spot for photography buffs and culture enthusiasts!", "name": "Loha Prasat (Metal Castle / Wat Ratchanatdaram)", "transport": "Take a taxi or tuk-tuk, or take the MRT to Sam Yot Station and walk about 20 minutes."}, {"address": "116 Chak Phet Rd, Wang Burapha Phirom, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.3 Stars | Bangkok\u0027s largest 24-hour wholesale flower market, filled with sweet floral fragrances. Teeming with vibrant flowers, handmade garlands, and ritual offerings from across Thailand, the market buzzes with energy day and night. It\u0027s an extraordinary spot to immerse yourself in local life, photograph busy florists, intricate floral art, and lively street scenes.", "name": "Pak Khlong Talat (Flower Market)", "transport": "Take the Chao Phraya Tourist Boat to Yodpiman River Walk Pier and walk over, or take the MRT to Sanam Chai Station and walk about 10 minutes."}, {"address": "4 Sanam Chai Rd, Phra Borom Maha Ratchawang, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.4 Stars | A modern interactive museum housed in a charming neoclassical European-style building. Through clever multimedia displays, art installations, and hands-on exhibits, it creatively answers the question \u0027What does it mean to be Thai?\u0027 Its fun, artistic spaces offer plenty of quirky photo ops, making it a popular hit for families and young travelers looking for aesthetic shots while discovering Thai history.", "name": "Museum Siam", "transport": "Take the MRT to Sanam Chai Station and exit at Exit 1."}, {"address": "Phra Athit Rd, Chana Songkhram, Phra Nakhon, Bangkok 10200, Thailand", "feature": "\u2b50 4.2 Stars | Phra Sumen Fort is one of only two surviving historic fortresses guarding Bangkok\u0027s past. Next to it lies Santichaiprakarn Park, a scenic riverside spot featuring lush lawns, leafy trees, and gorgeous river vistas. Local residents gather here to relax and exercise, creating an authentic backdrop against the golden
