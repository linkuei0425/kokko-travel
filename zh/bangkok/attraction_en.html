agarindra Rd, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.3 Stars | Located at the intersection of the Silom and Sathorn business districts, this steel arch skywalk is one of Bangkok\u0027s most modern urban landmarks. Its striking geometric steel structure displays sleek linear beauty by day and a futuristic tech vibe when illuminated at night. The skywalk connects numerous stylish skyscrapers nearby; standing in the center lets you capture stunning light trails from the bustling traffic below, making it a favorite location for movie shoots and street style photography.", "name": "Chong Nonsi Skywalk", "transport": "Take the BTS directly to Chong Nonsi Station to connect to the skywalk."}, {"address": "195 Surawong Rd, Suriya Wong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.6 Stars | Established in 1921, Neilson Hays Library is hailed as Bangkok\u0027s most beautiful private library. Designed in an elegant Italian Neoclassical style, its pristine white walls, graceful arches, and light-filled skylights evoke an exquisitely romantic vintage charm. Housing a rich collection of rare English books, the air is filled with a sense of literary history. Its artistic corners and lush garden caf\u00e9 draw countless visitors who adore retro aesthetics and hipster style.", "name": "Neilson Hays Library", "transport": "Take the BTS to Chong Nonsi Station, then take a taxi for about 5 minutes or walk for about 15 minutes."}, {"address": "2 Si Lom Rd, Suriya Wong, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.2 Stars | Situated at the intersection of Silom and Rama IV Roads, this trendy modern landmark embraces a \u0027Ready to Start\u0027 vibe catering to tech enthusiasts and night owls. The mall features eye-catching neon decor, a futuristic open-space layout, and expansive floor-to-ceiling glass windows. The most popular photo spots are the high-floor outdoor platform and open-air restaurants, offering an unobstructed view over Lumpini Park\u0027s lush canopy and the Bangkok skyline. It has become a hot urban lifestyle destination for young adults.", "name": "Silom Edge", "transport": "Take the MRT to Si Lom Station (Exit 2) for direct access, or BTS to Sala Daeng Station (Exit 1) and walk for about 2 minutes."}, {"address": "96 Naradhiwas Rajanagarindra Rd, Silom, Bang Rak, Bangkok 10500", "feature": "\u2b50 4.3 Stars | Located right next to the King Power Mahanakhon, Mahanakhon CUBE is a lifestyle space combining premium dining with contemporary art and design. Its most eye-catching highlights are the dynamic, high-tech LED light corridors and art exhibition spaces, which regularly showcase large-scale installation art in collaboration with international artists. The Thai Taste Hub inside brings together several Michelin-recommended street food stalls, allowing you to enjoy a top-tier visual art experience while snapping ultra-stylish urban photos.", "name": "Mahanakhon CUBE", "transport": "Take the BTS to Chong Nonsi Station; Exit 3 connects directly to the mall."}], "name": "Popular Photo Hotspots"}}, "name": "\u662f\u9686\u8207\u6c99\u541e (\u5546\u696d\u8207\u90fd\u6703\u7da0\u6d32)"}, "sukhumvit": {"categories": {"cat_1": {"items": [{"address": "1325 Sukhumvit Rd, Khlong Tan Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.5 stars | Wat That Thong is a historic royal temple located in Bangkok\u0027s Sukhumvit district, right next to the Ekkamai BTS station, offering convenient access. Renowned for its exquisite Thai architecture and serene atmosphere, this temple serves as an important place for local residents to hold religious ceremonies and practice meditation. Within the temple grounds are several stupas, ordination halls, and monks\u0027 quarters. The main hall houses a dignified Buddha statue with intricate murals on the walls illustrating Buddhist stories. The architectural style harmoniously blends traditional Thai art with modern elements, reflecting its long history and evolving culture. Every year, various Buddhist festivals are celebrated here, drawing numerous devotees and tourists. Wat That Thong is not only a religious center but also a cultural landmark, offering visitors a glimpse into Thailand\u0027s deep-rooted Buddhist traditions and architectural beauty. Its lush, green courtyard provides a rare tranquil retreat in the heart of the city, perfect for a peaceful stroll and reflection.", "name": "Wat That Thong", "transport": "Take the BTS Skytrain to Ekkamai Station, leave via Exit 1, and walk for about 1 minute."}, {"address": "131 Asok Montri Rd, Khlong Toei Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.3 stars | Located within The Siam Society near Sukhumvit Soi 21 (Asok Montri Road), the Kamthieng House Museum is a unique museum showcasing an authentic traditional teakwood stilt house relocated from Chiang Mai in northern Thailand. Built in the mid-19th century, this house perfectly exemplifies the architectural style and way of life of the Lanna region. Inside, visitors can explore various traditional farming and fishing tools, textiles, and everyday items, offering a deep dive into the history, culture, and folklore of rural northern Thailand. The house\u0027s structure, intricate wood carvings, and surrounding tropical garden setting create an immersive cultural experience. It is more than just a building\u2014it is a piece of living history telling the story of the Thai people living in harmony with nature. For travelers interested in traditional Thai architecture and culture, this is an unmissable treasure.", "name": "Kamthieng House Museum", "transport": "Take the BTS Skytrain to Asok Station or the MRT to Sukhumvit Station, then walk for about 10\u201315 minutes."}, {"address": "101 Soi On Nut 7, Sukhumvit 77 Rd, Suan Luang, Bangkok 10250, Thailand", "feature": "\u2b50 4.4 stars | Wat Mahabut, best known for housing the famous Mae Nak Shrine, is located near Sukhumvit Soi 77 (On Nut) and is one of Bangkok\u0027s most famous folk religion landmarks. The temple gained renown through Thailand\u0027s legendary love story of \u0027Mae Nak Phra Khanong,\u0027 attracting countless devotees praying for love, wealth, and good fortune. While the temple features traditional Thai architectural elements, its main draw lies in the legend of Mae Nak and the mystical atmosphere surrounding it. Devotees present flowers, fruit, traditional Thai dresses, and even toys to Mae Nak as offerings and prayers. Small vendor stalls outside sell souvenirs and offerings related to the legend. For travelers seeking to experience Thailand\u0027s unique folk beliefs and cultural folklore, Wat Mahabut offers a fascinating glimpse into local reverence for supernatural forces.", "name": "Wat Mahabut (Mae Nak Shrine)", "transport": "Take the BTS Skytrain to On Nut Station, then take a taxi or motorcycle taxi for a 5\u201310 minute ride."}, {"address": "131 Asok Montri Rd, Khlong Toei Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.2 stars | Founded in 1904, The Siam Society is a historic learned society dedicated to promoting knowledge of the arts, sciences, and culture of Thailand and its neighboring countries. Its headquarters near Sukhumvit Soi 21 (Asok Montri Road) hold significant historical and architectural value, blending traditional Thai elements with colonial style. The society houses a library, lecture halls, and exhibition spaces, regularly hosting lectures, seminars, and cultural events. Beyond its academic role, the compound and tranquil garden are well worth exploring, especially its rare manuscripts and art collections. Serving as both a cornerstone for Thai cultural studies and a public platform for exploring Thailand\u0027s rich history, The Siam Society offers a unique perspective for travelers interested in history, culture, and academic heritage.", "name": "The Siam Society", "transport": "Take the BTS Skytrain to Asok Station or the MRT to Sukhumvit Station, then walk for about 10\u201315 minutes."}, {"address": "928 Sukhumvit Rd, Phra Khanong, Khlong Toei, Bangkok 10110, Thailand", "feature": "\u2b50 4.0 stars | Opened in 1964 near Ekkamai BTS station, the Bangkok Planetarium is Thailand\u0027s oldest planetarium and part of the National Science Centre for Education. Its distinctive dome structure stands out in the Sukhumvit area, boasting a bold modernist design aesthetic typical of the mid-20th century. Inside, an advanced planetarium projector offers an immersive cosmic exploration experience, showcasing the starry sky, planets, and astronomical phenomena. Though its facilities may feel less modern than newer planetariums, its historical significance and educational value make it a notable landmark. For families, science lovers, and architecture enthusiasts, the planetarium offers an engaging, educational space to gaze up at the stars and appreciate the vastness of the universe right in the middle of the city.", "name": "Bangkok Planetarium", "transport": "Take the BTS Skytrain to Ekkamai Station, exit via Exit 2, and walk for about 3 minutes."}, {"address": "928 Sukhumvit Rd, Phra Khanong, Khlong Toei, Bangkok 10110, Thailand", "feature": "\u2b50 3.9 stars | Located adjacent to the Bangkok Planetarium, the National Science Centre for Education is a comprehensive science museum that aims to spark public interest in science and technology through interactive exhibits and hands-on activities. While the building complex is less iconic than the planetarium itself, its overall design and history reflect the evolution of science education in Thailand. The center features multiple exhibition halls covering physics, chemistry, biology, earth sciences, and environmental conservation. Many vintage exhibits have themselves become part of history. It is a fantastic place for families and students to learn and enjoy interactive fun. More than just an educational institution, it stands as a cultural landmark witnessing Thailand\u0027s history of science popularization.", "name": "National Science Centre for Education", "transport": "Take the BTS Skytrain to Ekkamai Station, exit via Exit 2, and walk for about 3 minutes. It is located in the same complex as the Bangkok Planetarium."}, {"address": "100 Sukhumvit 71 Rd, Phra Khanong Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 3.8 stars | Wat Phra Khanong is an ancient temple situated in the Phra Khanong area of Sukhumvit Road. While not as grand as some downtown temples, it carries the long history and cultural memories of the local community. The temple\u0027s modest, traditional architectural style reflects regional Thai temple design, with roots tracing back to the Ayutthaya period. Featuring prayer halls, stupas, and monks\u0027 residences, it serves as an essential place for local residents\u0027 daily worship and traditional ceremonies. Strolling through its courtyard offers a sense of peace and serenity away from the hustle and bustle of Sukhumvit. For visitors wishing to experience authentic local community life and traditional religious culture in Bangkok, Wat Phra Khanong provides a genuine, unpretentious perspective on Thailand\u0027s rich Buddhist heritage.", "name": "Wat Phra Khanong", "transport": "Take the BTS Skytrain to Phra Khanong Station, then walk for about 10\u201315 minutes, or transfer to local transport."}, {"address": "10 Soi Sukhumvit 77, Suan Luang, Bangkok 10250, Thailand", "feature": "\u2b50 3.7 stars | Wat Thong Nai is a historic Buddhist temple located in the On Nut area of Sukhumvit Road, dating back to the reign of King Rama III. Though small in scale, its traditional Thai architectural style and serene environment make it a key spiritual hub for the local neighborhood. The temple houses beautiful Buddha statues and murals showcasing traditional Thai artistic charm. As a local gathering spot for daily prayers, almsgiving, and Buddhist festivals, it offers travelers an authentic window into Thai religious life. Its historical buildings and surrounding greenery provide a peaceful sanctuary in the city. For those seeking to escape tourist crowds and discover Bangkok\u0027s authentic local culture and history, Wat Thong Nai is a hidden gem worth visiting.", "name": "Wat Thong Nai", "transport": "Take the BTS Skytrain to On Nut Station, then take a taxi or motorcycle taxi for a 5-minute ride."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "939 Rama I Rd, Wang Mai, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.5 stars | As Thailand\u0027s premier venue for contemporary art, the Bangkok Art and Culture Centre is conveniently located in the city center and is a must-visit for art lovers and cultural explorers. This modern building features a unique spiral interior that creates a distinct sense of space, hosting a variety of free and ticketed art exhibitions, photography shows, design expos, theatrical performances, and concerts highlighting Thai and international artists. Beyond exhibition spaces, the center houses art bookstores, cafes, design shops, and small galleries, offering a rich cultural experience. It is not only a place to appreciate art, but also a showcase and community platform for young artists, injecting endless artistic energy into Bangkok. Its open, inclusive atmosphere makes it a creative and inspiring oasis in the heart of the city.", "name": "Bangkok Art and Culture Centre (BACC)", "transport": "Take the BTS Skytrain to National Stadium Station (Exit 1), which directly connects to the center via a skywalk."}, {"address": "6 Soi Kasem San 2, Rama 1 Road, Wang Mai, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.6 stars | The Jim Thompson House Museum is a legendary cultural landmark in Bangkok, built by the American silk entrepreneur Jim Thompson. He relocated six traditional Thai teak houses from various parts of Thailand and reassembled them into an exquisite residence, showcasing his passion for Thai art, culture, and architecture. The museum houses a vast collection of precious Southeast Asian artworks, antiques, and Thai silks, each telling a unique story. Visitors must join a guided tour, where guides explain Thompson\u0027s life, his contributions to the Thai silk industry, and the legendary story of his mysterious disappearance. It offers not only fine Thai architecture and art collections, but also a rich historical atmosphere and exotic charm, serving as a wonderful gateway into Thai culture and history.", "name": "Jim Thompson House Museum", "transport": "Take the BTS Skytrain to National Stadium Station (Exit 1) and walk for about 5\u201310 minutes."}, {"address": "131 Soi Sukhumvit 21 (Asok Montri Rd), Khlong Toei Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.2 stars | Part of the Siam Society, the Kamthieng House Museum is located off Sukhumvit Soi 21 (Asok Montri Road) and is a traditional Lanna-style teak house with over 160 years of history. The museum aims to showcase the traditional lifestyle, architecture, and folk beliefs of northern Thailand\u0027s rural regions. Visitors can view traditional farming tools, daily utensils, religious artifacts, and handicrafts to gain deep insight into northern Thai cultural customs and heritage. Surrounded by lush greenery, the tranquil setting feels like stepping into an ancient Thai village. For travelers interested in Thailand\u0027s diverse culture and historical architecture, Kamthieng House offers a unique and serene escape, serving as a rare cultural gem in the Sukhumvit area.", "name": "Kamthieng House Museum, Siam Society", "transport": "Take the BTS Skytrain to Asok Station or the MRT Subway to Sukhumvit Station, then walk for about 10\u201315 minutes."}, {"address": "1325 Sukhumvit Rd, Khlong Tan Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.5 stars | Wat That Thong is a historic and popular royal temple located along Sukhumvit Road, right next to the Ekkamai BTS Station. It is renowned for its grand architecture, beautiful Buddha statues, and peaceful atmosphere. The temple complex features multiple prayer halls, stupas, and monk quarters, with the main hall housing a solemn Buddha image\u2014making it an essential spot for local daily worship. Wat That Thong also serves as an important site for royal cremations and funereal rites, holding a special place in Thai culture. Despite its location in a bustling city center, the interior maintains a rare tranquility and solemnity, allowing visitors to experience the profound depth of Thai Buddhist culture. Its resplendent architectural details and exquisite murals are well worth admiring.", "name": "Wat That Thong", "transport": "Take the BTS Skytrain to Ekkamai Station (Exit 1); the temple is right outside the exit."}, {"address": "123 Soi Ruamrudee, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.6 stars | Holy Redeemer Church is an important Catholic church in central Bangkok, located in the Phloen Chit area near Sukhumvit Road. Renowned for uniquely blending traditional Thai architectural elements with Western Catholic styles, it boasts a majestic exterior and beautifully decorated interior. The spacious, bright hall features vibrant stained-glass windows that glow in the sunlight, creating a sacred and serene atmosphere. It serves not only as a central place for local Catholics to attend Mass and religious activities, but also attracts visitors keen to admire its architectural beauty and peaceful ambience. Surrounded by greenery, it is a serene sanctuary amidst the urban bustle, well worth visiting for spiritual comfort or religious art appreciation.", "name": "Holy Redeemer Church", "transport": "Take the BTS Skytrain to Phloen Chit Station, then walk for about 10\u201315 minutes or take a taxi/motorbike taxi."}, {"address": "11 Convent Rd, Silom, Bang Rak, Bangkok 10500, Thailand", "feature": "\u2b50 4.5 stars | Christ Church Bangkok is the oldest Anglican church in Thailand, located at the intersection of Sathorn Road and Convent Road near the Silom area, easily accessible via BTS from Sukhumvit. Founded in 1864 by British expatriates, the church features elegant Gothic Revival architecture, with red-brick walls and a spire that stand out prominently against Bangkok\u0027s urban skyline. The simple yet solemn interior exudes a strong sense of history through its stained glass and wooden structures. Beyond serving as a place of worship for the local English-speaking community, it hosts regular community events and concerts. A silent witness to Bangkok\u0027s modern history, this tranquil and culturally significant haven is well worth visiting for its architectural charm and heritage.", "name": "Christ Church Bangkok", "transport": "Take the BTS Skytrain to Sala Daeng Station or the MRT Subway to Si Lom Station, then walk for about 5\u201310 minutes."}, {"address": "179 Thanon Witthayu, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.4 stars | Alliance Fran\u00e7aise Bangkok is Thailand\u0027s premier institution for promoting French language and culture, located on Wireless Road (Witthayu Road) just a stone\u0027s throw from Sukhumvit. Beyond offering French language classes, it is a vibrant cultural center hosting diverse art exhibitions, film screenings, concerts, lectures, and live performances throughout the year. Its gallery space frequently displays works by Thai and French artists, adding diverse perspectives to Bangkok\u0027s art scene. Featuring a library, cafe, and bookstore, it provides a comfortable gathering space for culture enthusiasts. For visitors interested in French culture, art, and language, it is an ideal hub to experience European artistic flair and engage in international cultural exchange near Sukhumvit.", "name": "Alliance Fran\u00e7aise Bangkok", "transport": "Take the MRT Subway to Lumphini Station and walk for about 10\u201315 minutes; or take the BTS Skytrain to Phloen Chit Station and transfer to a taxi/motorbike taxi."}, {"address": "18/1 Soi Goethe, Sathorn 1, Thung Maha Mek, Sathorn, Bangkok 10120, Thailand", "feature": "\u2b50 4.4 stars | Goethe-Institut Thailand is Germany\u0027s official cultural institute in Thailand, located near Sathorn Road with easy access from the Sukhumvit area. Like Alliance Fran\u00e7aise, Goethe-Institut promotes German language, culture, and art, standing as an essential hub for international cultural exchange in Bangkok. The institute houses a library, auditorium, and exhibition space, regularly hosting German film screenings, art exhibitions, musical performances, literary lectures, and workshops. These events offer rich opportunities for locals and expats to explore German culture. Its gallery often showcases works by contemporary German artists and addresses German cultural themes. For visitors curious about German art, film, literature, and language, it provides a unique cultural platform and an integral part of Bangkok\u0027s multicultural landscape.", "name": "Goethe-Institut Thailand", "transport": "Take the MRT Subway to Lumphini Station and walk for about 10\u201315 minutes; or take the BTS Skytrain to Sala Daeng Station and transfer to a taxi/motorbike taxi."}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Sukhumvit Road, Khlong Toei, Bangkok 10110, Thailand", "feature": "\u2b50 4.4 stars | Located right on Sukhumvit Road next to the Emporium Department Store, Benchasiri Park is a serene oasis in the heart of Bangkok. Built to commemorate Queen Sirikit\u0027s 60th birthday, the park is famous for its large artificial lake, sculpture gardens, and versatile sports facilities. Visitors can stroll along the lake, jog, ride bicycles, or relax with a picnic on the lawn. Featuring an open-air theater and a children\u0027s playground, it\u0027s an ideal spot for both locals and tourists to enjoy outdoor activities. Many come here in the early morning and late afternoon to exercise and soak in a refreshing touch of nature within the bustling city.", "name": "Benchasiri Park", "transport": "Take the BTS to Phrom Phong Station (E5); the park is right next to the station."}, {"address": "Ratchadaphisek Road, Khlong Toei, Bangkok 10110, Thailand", "feature": "\u2b50 4.7 stars | One of the largest parks in central Bangkok, Benjakitti Park is famous for its vast green spaces, large lake, and recently expanded forest park area. Offering dedicated cycling and jogging tracks, it is a paradise for fitness enthusiasts. Visitors can go boating on the lake, while the newly opened forest park area features thousands of trees simulating a natural wetland ecosystem, offering city dwellers a great chance to reconnect with nature. It is also an exceptional spot to view Bangkok\u0027s skyline, especially at sunset when the view is truly captivating. With modern design and well-equipped facilities, it\u0027s an ideal choice for family outings, dates, or solo relaxation.", "name": "Benjakitti Park", "transport": "Take the MRT to Queen Sirikit National Convention Centre Station (Exit 3), or take the BTS to Asok Station and transfer to the MRT."}, {"address": "Rama IV Road, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.6 stars | Lumphini Park is one of Bangkok\u0027s oldest and largest parks, renowned as the city\u0027s \u0027green lung.\u0027 Although slightly off the central Sukhumvit core, convenient transport options make it a popular choice for both residents and visitors. The park boasts sprawling lawns, a serene lake, fitness areas, and playgrounds. In the early morning, many gather to practice Tai Chi or go jogging, while daytime visitors can rent paddle boats to idle away the hours on the water. You might even spot monitor lizards roaming the lawns, adding a touch of wild charm to this urban oasis. Vibrant and lively, it frequently hosts outdoor events and music concerts.", "name": "Lumphini Park", "transport": "Take the BTS to Sala Daeng Station (S2) or the MRT to Lumphini/Si Lom Station; it\u0027s a short walk from there."}, {"address": "Sukhumvit Soi 10, Khlong Toei, Bangkok 10110, Thailand", "feature": "\u2b50 4.0 stars | Tucked inside Sukhumvit Soi 10, Chuvit Garden is a compact yet exquisite private park donated to the public by a former politician. Despite its modest size, it offers a precious green sanctuary in the bustling Sukhumvit area. Featuring manicured lawns, shady trees, and art installations, it serves as a wonderful spot for local residents to take a quick break, walk their dogs, or enjoy a moment of peace. Free from the hustle and bustle of larger parks, it offers a unique urban serenity, making it a perfect spot to sit down and unwind after shopping or dining.", "name": "Chuvit Garden", "transport": "Take the BTS to Nana Station (E3); it is a 5-10 minute walk away."}, {"address": "4 Soi Somkid, Phloen Chit Road, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.4 stars | Nai Lert Park Heritage Home is not only a historic traditional Thai estate, but it also features a sprawling tropical garden rarely seen in downtown Bangkok. Once the private residence of the prominent Thai diplomat Nai Lert, this lush green estate is now open to the public, offering visitors a glimpse into the lifestyle of past aristocracy while immersing themselves in meticulously landscaped grounds. The park houses rare plant species, winding pathways, and scenic ponds, creating a peaceful atmosphere away from the city noise. Guided tours are available to share history and botanical knowledge, making it an ideal destination for culture and nature enthusiasts.", "name": "Nai Lert Park Heritage Home", "transport": "Take the BTS to Phloen Chit Station (E2); it is about a 10-15 minute walk away."}, {"address": "Sukhumvit Soi 24, Khlong Tan, Khlong Toei, Bangkok 10110, Thailand", "feature": "\u2b50 4.2 stars | Located on Sukhumvit Soi 24, Phrom Phong Park is a small community park that provides a convenient green space for residents of the Phrom Phong neighborhood. While not as vast as Benchasiri Park, it is loved for its clean environment and friendly atmosphere. Equipped with simple walking paths, benches, and pleasant greenery, it\u0027s an ideal spot for locals to walk, walk their dogs, or let children play. For travelers staying nearby, it offers a peaceful corner to temporarily escape the urban bustle.", "name": "Phrom Phong Park", "transport": "Take the BTS to Phrom Phong Station (E5); it is about a 5-10 minute walk away."}, {"address": "Rama IV Road, Khlong Toei, Bangkok 10110, Thailand", "feature": "\u2b50 4.1 stars | Situated in the Khlong Toei district near the southern end of Sukhumvit Road, Khlong Toei Port Park is a relatively new and well-planned community park. Featuring a modern design with spacious lawns, winding trails, and sports facilities, it offers a key outdoor venue for neighborhood residents. Removed from the bustle of typical tourist hotspots, it offers a closer look into local daily life. Here, visitors can absorb Bangkok\u0027s authentic local vibe, jogging, walking, or enjoying the afternoon sun alongside locals. Well-landscaped and green, it serves as a refreshing oasis in the city.", "name": "Khlong Toei Port Park", "transport": "Take the MRT to Khlong Toei Station (Exit 1); it is about a 10-15 minute walk away."}, {"address": "131 Asok Montri Road, Khlong Toei Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.4 stars | The Siam Society is not only a hub for Thai cultural research, but its grounds also feature stunning tropical gardens and traditional Thai architecture. This lush green venue offers visitors a unique experience blending culture and nature. The grounds host a rich variety of tropical plants and traditional Thai stilt houses, such as the Kamthieng House Museum, which showcases traditional lifestyles of Northern Thailand. Strolling through the courtyard, you can feel a sense of tranquil elegance and rich history far removed from city noise. For travelers seeking cultural enrichment alongside natural beauty, this is a hidden treasure not to be missed.", "name": "The Siam Society", "transport": "Take the BTS to Asok Station (E4) or the MRT to Sukhumvit Station; it is about a 10-15 minute walk."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "2 Sukhumvit Road, Soi 57, Bangkok Marriott Hotel Sukhumvit, Bangkok 10110", "feature": "\u2b50 4.5 Stars | Perched on the 45th to 49th floors of the Bangkok Marriott Hotel Sukhumvit, Octave Rooftop Lounge \u0026 Bar offers a breathtaking 360-degree panoramic view of the city, making it the ultimate spot to enjoy Bangkok\u0027s sunsets and dazzling nightscape. The vibe here is chic and sophisticated, featuring three distinct levels ranging from cozy lounge seating to a high-top bar, each thoughtfully designed. Skilled mixologists craft inventive cocktails alongside a varied menu of international bites to satisfy your tastebuds while you soak in the scenery. Whether you are on a romantic date, gathering with friends, or simply seeking Bangkok\u0027s luxurious nightlife, Octave is a must-visit hotspot\u2014especially at dusk when the shifting colors of the sky turn it into a photographer\u0027s paradise.", "name": "Octave Rooftop Lounge \u0026 Bar (Bangkok Marriott Hotel Sukhumvit)", "transport": "Take the BTS to Thong Lo Station, then walk for about 5 minutes."}, {"address": "402 Sukhumvit Soi 55, Thonglor Road, Bangkok 10110", "feature": "\u2b50 4.3 Stars | Tucked away in a quiet alley off Sukhumvit, The Iron Fairies is renowned for its unique and mysterious fairytale-themed decor. The interior resembles a fusion of an ancient blacksmith\u0027s shop and a magical enchanted forest, complete with thousands of dried flower bouquets hanging from the ceiling, cast-iron fairy sculptures embedded in the walls, dim lighting, and live jazz performances. Every corner feels steeped in story, making it an ideal venue for a unique nightlife adventure and creative photo ops. Beyond its striking visuals, the bar serves a fantastic selection of craft beers and signature cocktails for you to savor while immersed in this whimsical world.", "name": "The Iron Fairies Bangkok", "transport": "Take the BTS to Thong Lo Station, then take a taxi or walk for about 15 minutes."}, {"address": "125 Sukhumvit Soi 55, Thonglor Road, Bangkok 10110", "feature": "\u2b50 4.6 Stars | Rabbit Hole is a premier speakeasy-style bar located in Thonglor, celebrated for its masterfully crafted cocktails and low-key luxury atmosphere. Unmarked on the outside save for a simple wooden door, it adds an irresistible air of mystery. Inside, the sleek, minimalist design features dark wood, leather, and brass accents, creating an intimate and comfortable space. The world-class bartenders can tailor bespoke creative cocktails based on your preferences, turning every drink into a work of art. For nightlife lovers seeking high-quality libations and a refined vibe, Rabbit Hole is an absolute must-visit and a top check-in destination for Bangkok\u0027s trendy crowd.", "name": "Rabbit Hole", "transport": "Take the BTS to Thong Lo Station, then take a taxi or walk for about 10 minutes."}, {"address": "335 Thonglor 17, Sukhumvit 55, Bangkok 10110", "feature": "\u2b50 4.4 Stars | The Commons is a stylish, green community space loved by locals and travelers alike for its open-air layout, diverse food choices, and relaxed vibe. It houses an array of independent cafes, artisanal restaurants, bakeries, and creative lifestyle shops, each boasting its own distinct character. The central open-air courtyard and stepped seating area are popular gathering spots to unwind, socialize, and snap great photos. Whether you\u0027re enjoying brunch, sipping coffee, or grabbing drinks with friends, The Commons provides a vibrant and comfy atmosphere, while its modern minimalist architecture and lush greenery make for a perfect photo backdrop.", "name": "The Commons Thonglor", "transport": "Take the BTS to Thong Lo Station, then take a taxi or motorbike taxi for about 5\u201310 minutes."}, {"address": "693 Sukhumvit Road, Khlong Tan Nuea, Watthana, Bangkok 10110", "feature": "\u2b50 4.6 Stars | EmQuartier is one of Sukhumvit\u0027s premier shopping destinations, and its unique \u0027Helix Quarter\u0027 is a masterpiece of architectural design as well as a viral photo hotspot. Famous for its cascading spiral layout, this area features an extensive range of international dining options across every level, spanning Thai, Japanese, and Western cuisine. A massive indoor waterfall and lush botanical decor at the center elevate the dining atmosphere with a touch of nature and luxury. Visitors can snap stunning photos of the dramatic spiral structure and waterfall from various viewpoints, especially at night when illuminated. It is not only a food lover\u0027s paradise but also a prime spot to experience Bangkok\u0027s modern urban sophistication.", "name": "EmQuartier (The Helix Quarter)", "transport": "Take the BTS to Phrom Phong Station, with direct access into the mall from the station."}, {"address": "2, 88 Sukhumvit Road, Khlong Toei Nuea, Watthana, Bangkok 10110", "feature": "\u2b50 4.3 Stars | Terminal 21 Asok is a creative airport-themed shopping mall where each floor represents a world-famous destination, such as Tokyo, London, Rome, Paris, Istanbul, and San Francisco. From boarding-gate style entrances to iconic city landmarks decorated throughout every level, there are delightful surprises and photo opportunities everywhere you turn. Highlights like San Francisco\u0027s Fisherman\u0027s Wharf, London\u0027s red double-decker bus, and Tokyo\u0027s sumo wrestler statues draw crowds of visitors for fun photo ops. Beyond offering a fantastic shopping and dining experience, it serves as an entertaining and exotic hotspot that lets you travel the world right inside Bangkok.", "name": "Terminal 21 Asok", "transport": "Take the BTS to Asok Station or the MRT to Sukhumvit Station, with direct access into the mall."}, {"address": "10 Sukhumvit 12 Alley, Khlong Toei, Bangkok 10110", "feature": "\u2b50 4.0 Stars | Cabbages \u0026 Condoms is a famous Thai restaurant known for its unique concept and social cause. Aimed at promoting sex education and family planning, the venue features condom-themed decorations throughout\u2014including a Santa Claus, mannequin outfits, and art pieces crafted entirely from condoms, filled with lighthearted humor and creativity. Surrounded by lush greenery, the restaurant offers both indoor and outdoor dining spaces serving authentic Thai cuisine. Dining here allows you to enjoy delicious meals while supporting a noble social mission and taking memorable photos in a truly unique atmosphere. It offers a dining experience that is both fun and meaningful.", "name": "Cabbages \u0026 Condoms", "transport": "Take the BTS to Asok Station, then walk for about 10\u201315 minutes, or take a taxi."}, {"address": "136/3 Thonglor Soi 11, Vaddhana, Bangkok 10110", "feature": "\u2b50 4.1 Stars | Audrey Cafe \u0026 Bistro (Thonglor) is famed for its exquisite French-countryside aesthetic and delicious Thai-fusion cuisine. The elegant interior features a color palette of white, pastel blue, and gold, accented by vintage furniture, crystal chandeliers, and fresh flowers, creating a romantic and warm atmosphere where every corner is picture-perfect. The menu offers diverse options ranging from brunch and afternoon tea to dinner, with highlights like their signature Thai Tea Mille Crepe cake and innovative fusion dishes. Whether you\u0027re gathering with friends, on a romantic date, or looking to enjoy an elegant meal in Bangkok, Audrey Cafe \u0026 Bistro is a fantastic check-in spot that transports you to a chic Parisian cafe.", "name": "Audrey Cafe \u0026 Bistro (Thonglor)", "transport": "Take the BTS to Thong Lo Station, then take a taxi or motorbike taxi for about 5\u201310 minutes."}], "name": "Popular Instagrammable Spots"}}, "name": "\u7d20\u5764\u9038 (\u9910\u98f2\u8207\u591c\u751f\u6d3b)"}};
        const cityName = "Bangkok";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
