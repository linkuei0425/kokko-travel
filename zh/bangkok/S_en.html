 "description": "\u2b50 4 Stars | A lush tropical garden oasis showcasing traditional wooden Thai houses and fine lacquerware antiquities.", "duration": "1-1.5 hours", "title": "Suan Pakkad Palace Museum", "transport": "Take the BTS to Phaya Thai Station Exit 4, then walk for about 5 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 Stars | Southeast Asia\u0027s largest indoor aquarium, featuring diverse marine life and an impressive underwater tunnel.", "duration": "2-3 hours", "title": "SEA LIFE Bangkok Ocean World", "transport": "Take the BTS to Siam Station, directly connected to floor B1 of Siam Paragon shopping mall."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 Stars | Comprising a Safari Park and Marine Park, featuring up-close giraffe feeding experiences and thrilling live shows.", "duration": "4-6 hours", "title": "Safari World Bangkok", "transport": "Recommended to take the BTS to Victory Monument Station, then transfer to a taxi or private charter."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | Features a water park home to the world\u0027s largest wave pool alongside a variety of thrilling amusement rides.", "duration": "4-5 hours", "title": "Siam Amazing Park", "transport": "Take the MRT to Min Buri Station, then take a taxi for about 15 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 Stars | A thrilling glass tray skywalk atop one of Bangkok\u0027s tallest skyscrapers, offering unobstructed 360-degree views of the city skyline.", "duration": "1.5-2 hours", "title": "King Power Mahanakhon SkyWalk", "transport": "Take the BTS to Chong Nonsi Station Exit 3, connected via skywalk."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Brings Thailand\u0027s traditional floating market indoors, combining Thai cultural art displays with a modern shopping experience.", "duration": "2-3 hours", "title": "ICONSIAM", "transport": "Take the BTS Gold Line directly to Charoen Nakhon Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | The world\u0027s largest weekend market, featuring authentic Thai handicrafts, clothing, and vibrant local street food.", "duration": "3-4 hours", "title": "Chatuchak Weekend Market", "transport": "Take the BTS to Mo Chit Station or the MRT to Chatuchak Park Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 stars | World-renowned backpacker paradise offering a rich blend of multicultural charm and lively nightlife.", "duration": "2-3 hours", "title": "Khaosan Road", "transport": "Take the MRT to Sam Yot Station, then take a taxi for about 8 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Features a giant pink three-headed elephant statue with stunning stained glass and a blend of Eastern and Western religious art inside.", "duration": "1.5-2 hours", "title": "The Erawan Museum", "transport": "Take the BTS to Chang Erawan Station, then walk or take a songthaew for about 10 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Known as the world\u0027s largest open-air museum, featuring scaled replicas of famous historic Thai architecture.", "duration": "3-4 hours", "title": "The Ancient City", "transport": "Take the BTS to Kheha Station, then take songthaew No. 36 for about 10 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Built primarily from Italian marble, exhibiting an elegant fusion of Thai and Western architectural design and high craftsmanship.", "duration": "1-2 hours", "title": "Wat Benchamabophit (Marble Temple)", "transport": "Take the BTS to Phaya Thai Station, then tak                             border-radius: 16px;

                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
