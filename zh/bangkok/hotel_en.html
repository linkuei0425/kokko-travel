", "feature": "\u2b50 4.5 Stars | A respected 5-star landmark on Sukhumvit, JW Marriott Hotel Bangkok is famous for its faultless service and classic luxury. Its enviable location puts guests just moments from BTS Nana Station, allowing quick access to major shopping centers, restaurants, and entertainment hubs. Elegant rooms offer generous space and state-of-the-art facilities. World-class dining choices abound, featuring the acclaimed Tsu Japanese Restaurant and the legendary New York Steakhouse. Comprehensive amenities\u2014including a large outdoor pool, fitness center, and Quan Spa\u2014ensure a complete, relaxing stay for lovers of refined hospitality.", "name": "JW Marriott Hotel Bangkok", "transport": "Take the BTS Skytrain to Nana Station, then walk for about 3 minutes.", "urls": {"agoda": "#", "booking": "#", "trip": "#"}}, {"address": "57 Witthayu Rd, Lumphini, Pathum Wan, Bangkok 10330, Thailand", "feature": "\u2b50 4.6 Stars | Harmonizing Japanese precision and hospitality with famous Thai warmth, The Okura Prestige Bangkok delivers a uniquely luxurious retreat. Located on Sukhumvit Road with direct skywalk access to BTS Phloen Chit Station, travel could not be easier. Its iconic 25th-floor infinity cantilevered pool overlooks dramatic skyline views. Minimalist, sleek rooms showcase subtle Japanese aesthetics alongside modern comforts and floor-to-ceiling windows. Fine dining awaits at the Michelin-starred Japanese restaurant Yamazato and Up \u0026 Above Restaurant for gourmet international fare. Ideal for guests seeking tranquility, sophistication, and stellar service.", "name": "The Okura Prestige Bangkok", "transport": "Take the BTS Skytrain to Phloen Chit Station; directly connected to the hotel via skywalk.", "urls": {"agoda": "#", "booking": "#", "trip": "#"}}, {"address": "1A Sukhumvit Rd, Khlong Toei Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.5 Stars | A stylish 5-star hotel in the Sukhumvit district, Hyatt Regency Bangkok Su nset. The hotel also features world-class dining, a relaxing spa, and a gym. While priced at a premium, its top-tier experience and meticulous service make it worth every penny, making it the top choice for travelers seeking ultimate luxury and privacy.", "name": "137 Pillars Suites \u0026 Residences Bangkok", "transport": "Take the BTS to Phrom Phong Station, then transfer to the hotel shuttle or a taxi for about 5\u201310 minutes.", "urls": {"agoda": "#", "booking": "#", "trip": "#"}}, {"address": "26/1 Soi Sukhumvit 53, Khlong Tan Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.5 Stars | Volve Hotel Bangkok is a contemporary boutique design hotel located in the Phrom Phong area, attracting young travelers and design enthusiasts with its minimalist, stylish, and functional design philosophy. The hotel\u0027s overall vibe is fresh and bright, making extensive use of warm wood elements and lush greenery to create a cozy atmosphere. While not focused on extravagance, every detail in the rooms is thoughtfully considered, providing high-quality bedding, smart TVs, and ample power outlets to meet modern travel needs. A 24-hour communal lounge offers complimentary coffee, tea, and snacks, making it an ideal spot to relax or work. Ideally situated just a few minutes\u0027 walk from BTS Phrom Phong Station, it is surrounded by major shopping hubs like EmQuartier and Emporium, as well as numerous restaurants and cafes. The energetic and friendly staff deliver efficient, attentive service, making it an ideal choice for travelers seeking great value and sleek design.", "name": "Volve Hotel Bangkok", "transport": "Take the BTS to Thong Lo Station; it\u0027s about a 5-minute walk away.", "urls": {"agoda": "#", "booking": "#", "trip": "#"}}, {"address": "3/1 Soi Sukhumvit 1, Khlong Toei Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.6 Stars | Hidden away in a quiet alley off Sukhumvit, Ad Lib Bangkok is a stylish hotel celebrated for its unique \u0 ibrant cityscape. Amenities include a rooftop infinity pool, a fitness center, and several specialty dining venues, including the popular 35th-floor \u0027Axis \u0026 Spin\u0027 sky bar. Unrivaled in location, it sits directly opposite BTS Asok Station and MRT Sukhumvit Station, surrounded by Terminal 21 and countless dining options. The professional, friendly staff ensure smooth service throughout your stay. It is a highly attractive option for travelers who prioritize transit convenience, modern design, and breathtaking cityscapes.", "name": "The Continent Hotel Bangkok", "transport": "Take the BTS to Asok Station or MRT to Sukhumvit Station; it\u0027s located right outside the exit.", "urls": {"agoda": "#", "booking": "#", "trip": "#"}}, {"address": "10/1 Soi Sukhumvit 39, Khlong Tan Nuea, Watthana, Bangkok 10110, Thailand", "feature": "\u2b50 4.4 Stars | Tucked away in the Phrom Phong neighborhood, Hotel Gahn is a uniquely designed boutique hotel that seamlessly merges \u0027traditional Thai artistry\u0027 with \u0027modern minimalist style.\u0027 Bursting with artistic ambiance, curated Thai artworks and handicrafts grace every corner, creating a culturally rich yet stylish sanctuary. The rooms are clean, warm, and inviting, utilizing natural materials and gentle color palettes to ensure a cozy stay. A compact yet charming pool and lush courtyard offer a tranquil refuge right in the city. Though a bit removed from the BTS station, a complimentary shuttle operates to BTS Phrom Phong Station for easy commuting. The warm and friendly staff offer attentive, personalized hospitality that makes guests feel right at home. Hotel Gahn is a hidden gem for travelers seeking creative design, cultural flair, and a tranquil vibe.", "name": "Hotel Gahn Bangkok", "transport": "Take the BTS to Phrom Phong Station, then transfer to the hotel shuttle or a taxi for about 5\u20137 minutes.", "urls": {"agoda": "#", "booking": "#", "trip": "#"}}], "name": "Stylish Design Hotels"}, "c             document.getElementById('category-buttons').classList.remove('hidden');

        function renderCats() {
            const container = document.getElementById('category-buttons'); 
            container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);

            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
