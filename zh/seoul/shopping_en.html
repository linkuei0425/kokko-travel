large-capacity cloud bag, you can easily find it here.", "name": "SHOOPEN Myeongdong", "transport": "About a 4-minute walk from Exit 6 of Euljiro 1-ga Station, Subway Line 2"}, {"address": "38 Myeongdong 10-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-buy list: OTZ classic chunky shoes, FOLDER exclusive collaboration sneakers, local Korean brand retro running shoes. FOLDER is a highly influential local Korean trendy footwear select chain store, featuring many local and exclusively distributed streetwear shoe brands. Compared to general international footwear chains, FOLDER carries exclusive colorways and Korea-limited editions, especially retro K-style running shoes and artistic chunky shoes, making it a must-visit for unique style seekers.", "name": "FOLDER Myeongdong Flagship Store", "transport": "About a 3-minute walk from Exit 8 of Myeongdong Station, Subway Line 4"}, {"address": "8 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.1 stars | Must-buy list: Mark Gonzales signature angel hoodie, Covernat logo dad hats, local Korean designer street crossbody bags. Wonder Place is an iconic large-scale streetwear select shop in Korea, featuring many local independent designer labels and popular streetwear brands (such as Covernat, Whatitisnt, etc.). The style leans toward American street style and casual Korean wear, offering everything from oversized tops and cargo pants to edgy accessories. It is highly popular among Korean university students and youth.", "name": "Wonder Place Myeongdong", "transport": "About a 2-minute walk from Exit 6 of Myeongdong Station, Subway Line 4"}, {"address": "26 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-buy list: Classic purple double-stripe tracksuits, chunky platform sneakers, large-capacity graffiti crossbody bags. NERDY is a local Korean streetwear brand that has swept across Asia in recent years, famous for vibrant colors and relaxed street fashion. Many K-POP stars and idols are loyal fans. The Myeongdong flagship store features photo-worthy spots and a full product range, with its iconic purple-and-yellow tracksuit being a sought-after fashion staple for tourists.", "name": "NERDY Myeongdong Flagship Store", "transport": "About a 3-minute walk from Exit 6 of Myeongdong Station, Subway Line 4"}, {"address": "17 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-buy list: Sleek K-style tailored blazers, flattering high-waisted knitwear, soft versatile fitted dresses. MIXXO is a renowned local Korean fast-fashion women\u0027s brand tailored specifically for Asian body types. Its clothing styles range from sharp office commuter wear and sweet date-night outfits to casual daily wear. Offering great quality at reasonable prices, its fitted blazers and knitwear collections are top choices for many Korean working women and budget-conscious shoppers.", "name": "MIXXO Myeongdong", "transport": "About a 3-minute walk from Exit 6 of Myeongdong Station, Subway Line 4"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "21 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-buy list: Honey Butter Almonds, Wasabi Almonds, Garlic Bread Almonds. As Myeongdong\u0027s most iconic snack landmark, this store features adorable almond character mascot decor that draws endless crowds of tourists. They offer dozens of surprisingly innovative flavors\u2014including popping candy, tteokbokki, and seaweed\u2014with free samples available for almost every flavor. The beautifully designed, portable packaging makes these almonds the top choice for gifts to bring back to colleagues, family, and friends.", "name": "HBAF Myeongdong Flagship", "transport": "Subway Line 4, Myeongdong Station, Exit 6, approx. 3 mins walk"}, {"address": "12 Myeongdong 7-gil, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: Matcha Milk Spread, Jeju Organic Green Tea Bags, Matcha Wafer Sandwich Biscuits. OSULLOC, a premium Korean tea brand from Jeju Island, features a stylish three-story flagship store in Myeongdong. In addition to exquisite teas and desserts, the retail counter sells beautifully packaged teas and snacks. The rich, velvety matcha milk spread and crispy green tea sandwich cookies are absolute must-haves for tea lovers looking for high-end gifts.", "name": "Osulloc Tea House Myeongdong Flagship", "transport": "Subway Line 2, Euljiro 1-ga Station, Exit 5, approx. 5 mins walk"}, {"address": "29 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-buy list: Taegeukdang Monaka Ice Cream, Traditional Butter Cake, Handmade Vegetable Cookies. Founded in 1946, Taegeukdang is one of Seoul\u0027s oldest bakeries, and its Euljiro branch recreates a classic vintage aesthetic. Their famous Monaka ice cream\u2014crispy on the outside with a rich, creamy filling\u2014is a nostalgic treat loved by locals for generations. The handmade cookies and traditional pastries feature unique retro Korean packaging, making them meaningful souvenirs rich in culture and heritage.", "name": "Taegeukdang Euljiro Tower Store", "transport": "Directly connected to Subway Line 2, Euljiro 1-ga Station, Exit 1-1"}, {"address": "81 Namdaemun-ro, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: Traditional Korean Yakgwa Gift Sets, CheongKwanJang Korean Red Ginseng Extract, Premium Traditional Hangwa. Located on B1 of the Lotte Department Store Main Store in the heart of Myeongdong, this food hall brings together top-tier gift counters from across Korea. You can purchase exquisitely packaged traditional royal court confections like Yakgwa and Hangwa, along with premium Korean roasted seaweed and red ginseng products. It is the premier, high-quality destination for finding elegant gifts for elders or corporate business partners.", "name": "Lotte Department Store Main Store Food Hall", "transport": "Direct connection via underground passage from Subway Line 2, Euljiro 1-ga Station, Exit 7"}, {"address": "55 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-buy list: BUTTER Bear Gummies, Myeongdong Limited Edition Cookie Gift Boxes, Korean-style Illustrated Snacks. BUTTER is a hugely popular domestic lifestyle brand among Korean youth, and its Myeongdong store is packed with adorable items and unique snacks. The food packaging showcases trendy modern Korean illustrations, featuring limited-edition shaped gummies and cute cookies. Affordable and visually delightful, these make fun and charming gifts for younger friends or students.", "name": "BUTTER Lifestyle \u0026 Souvenir Myeongdong Store", "transport": "Subway Line 4, Myeongdong Station, Exit 6, approx. 6 mins walk"}, {"address": "53 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.7 stars | Must-buy list: Delight Project Low-Calorie Bagel Chips, Concentrated Collagen Jellies, TEAZEN Kombucha. More than just a beauty paradise, the Olive Young Myeongdong Town flagship store features a dedicated healthy snack and wellness section that is a huge hit with tourists. The best-selling Delight Project Bagel Chips come in crunchy, low-calorie flavors like Garlic Butter and Honey Butter. Paired with beauty collagen jellies and instant kombucha mix\u2014enormously popular among Korean women\u2014these make perfect healthy and delicious modern Korean treats.", "name": "Olive Young Myeongdong Town Snack Section", "transport": "Subway Line 2, Euljiro 1-ga Station, Exit 5, approx. 4 mins walk"}, {"address": "134 Toegye-ro, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: Hanbok-Pattern Seasoned Seaweed, Korean Landmark Chocolates, Traditional Pattern Snack Packs. Spanning 12 floors, this massive Daiso flagship features a dedicated \u0027K-Souvenir\u0027 zone designed specifically for tourists. Here, you can buy specially packaged seaweed and crisp seaweed snacks featuring traditional Hanbok and Sungnyemun Landmark designs at incredibly wallet-friendly prices. With a huge variety of Korean snacks and themed keychains, its unbeatable value will make you want to fill your bags!", "name": "Daiso Myeongdong Station 12-Story Flagship K-Souvenir Zone", "transport": "Subway Line 4, Myeongdong Station, Exit 1 (right outside)"}, {"address": "11 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-buy list: Korea-Exclusive Shin Ramyun, Honey Butter Chips, Bulk Pack Sesame Oil Roasted Seaweed. Tailored for international tourists, K-Mart is a popular local supermarket in Myeongdong boasting one of the most comprehensive selections of instant noodles and popular snacks in Seoul. The staff thoughtfully group top tourist favorites together and offer box-packing services for easy travel. From unique potato chip flavors to roasted sesame seaweed and exclusive instant noodle varieties, you can get all your snack shopping done in one trip.", "name": "K-Mart Myeongdong Souvenir Supermarket", "transport": "Subway Line 4, Myeongdong Station, Exit 6, approx. 2 mins walk"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "81 Namdaemun-ro, Jung-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \ub0a8\u5927\u9580\u8def 81)", "feature": "\u2b50 4.4 stars | Must-Buy List: Sulwhasoo First Care Activating Serum, Tamburins Perfumed Hand Cream, Cheong Kwan Jang Red Ginseng Extract. As one of Korea\u0027s largest flagship department stores, Lotte Department Store Main Store is located at Euljiro 1-ga Station, directly connected to Lotte Duty Free and Lotte Hotel. It brings together top Korean skincare brands and international luxury fashion. The underground food hall is a hub for authentic local delicacies and exquisite souvenirs, making it a top shopping destination for tourists.", "name": "Lotte Department Store Main Store", "transport": "Directly connected via the underground passage at Exit 7 or 8 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "77 Toegye-ro, Jung-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \ud1f4\uacc4\ub85c 77)", "feature": "\u2b50 4.5 stars | Must-Buy List: Gentle Monster sunglasses, Shinsegae exclusive gourmet gift sets, Sulwhasoo premium skincare sets. Korea\u0027s oldest department store, featuring a main building with a charming modern-vintage architectural style. Its festive 3D media facade projection during Christmas is an iconic Seoul attraction. Alongside luxury brands, both the main and new buildings offer a premium shopping environment, featuring high-end traditional Korean souvenir zones and luxury cosmetics counters.", "name": "Shinsegae Department Store Main Store", "transport": "Directly connected via the underground passage at Exit 7 of Hoehyeon Station (Subway Line 4), or about a 5-minute walk from Exit 5 of Myeongdong Station"}, {"address": "67 Namdaemun-ro, Jung-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \ub0a8\u5927\u9580\u8def 67)", "feature": "\u2b50 4.1 stars | Must-Buy List: Official K-POP idol merchandise \u0026 albums, Stylenanda trendy apparel, Kakao Friends character merchandise. A trendy department store tailored for youth and pop culture enthusiasts. It brings together Korea\u0027s hottest fashion brands, cute stationery, lifestyle items, and official K-POP merchandise stores. A must-visit destination if you want to stay on top of the latest Korean street style and trends.", "name": "Lotte Young Plaza Myeongdong", "transport": "About a 3-minute walk from Exit 7 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "405 Hangang-daero, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \ud55c\uac15\ub300\ub85c 405)", "feature": "\u2b50 4.2 stars | Must-Buy List: Discounted National Geographic windbreakers, Nike running shoes on sale, Beanpole classic casual shirts. Located just one stop away from Myeongdong and Euljiro, this is a prime outlet center right in the heart of the city. Offering year-round discounts from 30% to 70%, it features over 140 popular sportswear, outdoor, and domestic Korean fashion brands\u2014perfect for a final shopping haul before leaving Seoul via train.", "name": "Lotte Outlet Seoul Station Branch", "transport": "Directly connected to Exit 1 of Seoul Station (Subway Line 1/Line 4/KTX)"}, {"address": "40 Myeongdong 8-gil, Jung-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uba85\ub3d98\uae38 40)", "feature": "\u2b50 4.3 stars | Must-Buy List: 38\u2103 printed patterned socks, Korean indie designer hoodies, vintage geometric accessories. Korea\u0027s flagship independent designer select shop spanning multiple floors. It carefully curates creations from hundreds of emerging Korean streetwear brands and indie designers. From clothing, bags, and shoes to lifestyle goods, it\u0027s a paradise for fashion lovers seeking unique, original Korean outfits that stand out.", "name": "ALAND Myeongdong Main Store", "transport": "About a 3-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "37-8 Myeongdong 8-gil, Jung-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uba85\ub3d98\uae38 37-8)", "feature": "\u2b50 4.4 stars | Must-Buy List: 3CE Velvet Lip Tint, 3CE 9-color eyeshadow palette, Pink Hotel exclusive tote bag. The ultra-popular concept flagship store of K-fashion and cosmetics brand 3CE. The entire building is themed as a vintage pink hotel, with floors styled like guest rooms, a swimming pool, and a rooftop caf\u00e9 for a dreamlike experience. Beyond trying and buying the full line of 3CE makeup, you can shop K-style fashion pieces and snap aesthetic photos.", "name": "Stylenanda Pink Hotel Flagship Store", "transport": "About a 2-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "53 Myeongdong-gil, Jung-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uba85\ub3d9\uae38 53)", "feature": "\u2b50 4.5 stars | Must-Buy List: Torriden Low Molecular Hyaluronic Acid Serum, Anua Heartleaf 77% Soothing Toner, Unove Deep Damage Treatment EX. As the largest Olive Young flagship store in Korea, its scale rivals a beauty department store. Spanning two floors, it houses hundreds of emerging Korean skincare and makeup brands while offering immersive tester zones, dedicated consultations, and immediate tax refund services. It is the ultimate holy grail for tourists stocking up on K-beauty and drugstore cosmetics.", "name": "Olive Young Myeongdong Town", "transport": "About a 5-minute walk from Exit 6 of Euljiro 1-ga Station (Subway Line 2), or a 6-minute walk from Exit 8 of Myeongdong Station (Subway Line 4)"}, {"address": "22 Myeongdong 8-gil, Jung-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uba85\ub3d98\uae38 22)", "feature": "\u2b50 4.3 stars | Must-Buy List: Korean handmade hypoallergenic earrings, minimalist leather crossbody bags, French vintage hair accessories. Originating from Dongdaemun, this massive flagship store specializes in local accessories and jewelry in Myeongdong. Famous for floor-to-ceiling walls packed with tens of thousands of earrings, necklaces, rings, and hair clips, it offers unbeatable prices and endless styles. It is a true shopping paradise adored by local young women and travelers alike.", "name": "NyuNyu Myeongdong", "transport": "About a 2-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Myeongdong and Euljiro"}, "seongsu_seoulforest": {"categories": {"cat_1": {"items": [{"address": "277-52 Seongsu-dong 2-ga, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-Buy List: HERA Black Cushion, Custom Liquid Foundation (bespoke shade creation), IOPE Bio Conditioning Essence. Created by Korean beauty giant Amorepacific, this massive experiential concept store was converted from an old auto repair shop, blending industrial aesthetics with lush greenery. The store offers over 30 brands and 1,500 beauty products for free trial. The biggest highlight is booking a session to create your custom-blended foundation and lipstick shade on the spot. It also features a facial cleansing zone and a relaxing garden terrace\u2014a dream paradise for beauty enthusiasts visiting Seongsu.", "name": "AMORE Seongsu (\uc544\ubaa8\ub808\uc131\uc218)", "transport": "Approx. 3-minute walk from Exit 2 of Seongsu Station (Subway Line 2)"}, {"address": "309-145 Seongsu-dong 2-ga, Seongdong-gu, Seoul", "feature": "\u2b50 4.8 stars | Must-Buy List: Blurry Pudding Pot (Lip \u0026 Cheek), Glass Cushion, Mini Pot Keyring. The flagship store of fwee, a beauty brand that recently went viral on Korean social media, stands out as a trendy hotspot with its minimalist architecture and vibrant pop colors. The most viral item is the Blurry Pudding Pot for lips and cheeks, available in 30 vibrant shades with a velvety-smooth mousse texture. With a purchase, you can pick a free adorable mini pudding pot keyring filled with your favorite color to take on the go\u2014a must-visit shrine for beauty-loving youth.", "name": "fwee Agit Seongsu (\ud4cc \uc544\uc9c0\ud2b8 \uc131\uc218)", "transport": "Approx. 5-minute walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "8 Yeonmujang 5-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-Buy List: CHAMO Shell Perfume Hand Cream, PUMKINI Egg Perfume, Perfume Balm. Launched under Gentle Monster, haute fragrance brand Tamburins opened its Seongsu flagship in a visually striking, exposed-concrete geometric sculpture of a building. The store merges contemporary art exhibitions with luxury fragrance experiences, seamlessly blending scent into daily self-care. The iconic Shell Hand Cream features a unique woody and chamomile scent with a rich, non-sticky texture. With its high-design packaging, it makes a top-tier choice for gifts or self-care treats.", "name": "Tamburins Seongsu (\ud0ec\ubc84\ub9b0\uc988 \uc131\uc218)", "transport": "Approx. 4-minute walk from Exit 4 of Seongsu Station (Subway Line 2)"}, {"address": "3F, 19 Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-Buy List: Gentle Night Hand Cream, Santal Cream Body Wash, Mini Perfume Set. Located near lush Seoul Forest, this flagship space belongs to Nonfiction, a cult-favorite Korean niche fragrance and beauty brand. The brand emphasizes pure aesthetic design using clean, premium, low-irritation ingredients. Sun-drenched interiors with warm wooden accents create a soothing atmosphere. Iconic fragrances like Gentle Night (cedarwood \u0026 fig) and Santal Cream (sandalwood \u0026 cardamom) offer rich complexity, while their hand creams and body washes provide deep hydration and long-lasting scent.", "name": "Nonfiction Seongsu (\ub17c\ud53d\uc158 \uc131\uc218)", "transport": "Approx. 7-minute walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "656-56 Seongsu-dong 1-ga, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-Buy List: New Depth Eyeshadow, Radiance Balm, Mood Enhancer Velvet Matte Lipstick. Known for its subtle aesthetic and elegant, low-saturation tones, Korean makeup brand Hince designed its Seongsu flagship like a composer\u0027s serene studio. Visitors can explore a full spectrum of muted Morandi-hued cosmetics. Their naturally pigmented eyeshadows and highlighters\u2014designed to craft that coveted dewy Korean glass skin\u2014are huge favorites among lovers of sophisticated makeup.", "name": "Hince Atelier Seongsu (\ud78c\uc2a4 \uc544\ud2c0\ub9ac\uc5d0 \uc131\uc218)", "transport": "Approx. 5-minute walk from Exit 8 of Ttukseom Station (Subway Line 2)"}, {"address": "322-1 Seongsu-dong 2-ga, Seongdong-gu, Seoul", "feature": "\u2b50 4.7 stars | Must-Buy List: Susie Salmon Multi Perfume, Roland Hand Cream, Custom Stamped Sachet. Granhand is a wildly popular local artisan fragrance brand with the philosophy \u0027Scent is an unseen memory.\u0027 The Seongsu branch exudes relaxation with warm wooden and brass interiors. All multi-use perfume sprays can be used on the body, clothing, and room spaces, with Susie Salmon\u2014featuring crisp apple and floral jasmine notes\u2014standing out as the top bestseller. They also offer a free on-site custom English stamping service on linen pouches, creating a personalized souvenir just for you.", "name": "Granhand Seongsu (\uadf8\ub791\ud578\ub4dc \uc131\uc218)", "transport": "Approx. 6-minute walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "16-24 Seongsu-dong 1-ga, Seongdong-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-Buy List: Oil Essence (Prickly Pear Seed Oil), Moroccan Gardener Hand Cream, Moist Mask. Huxley, a premium Korean skincare brand centered around Sahara prickly pear seed oil, designed its Seongsu showroom to feel like a desert oasis blended with a modern art gallery. Focused on high antioxidants and intense hydration, its signature scent \u0027Moroccan Gardener\u0027 delivers a soothing, natural floral vibe. The hand creams and lightweight, non-sticky oil essences are beloved by those with dry skin and skincare purists alike.", "name": "Huxley Signature Showroom (\ud5c9\uc2ac\ub9ac \uc2dc\uadf8\ub2c8\ucc98 \uc20d)", "transport": "Approx. 6-minute walk from Exit 1 of Ttukseom Station (Subway Line 2)"}, {"address": "13 Yeonmujang 7-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-Buy List: Torriden Dive-In Low Molecule Hyaluronic Acid Serum, Anua Heartleaf 77% Soothing Toner, Unove Deep Damage Treatment EX. \u0027Olive Young N\u0027 is a massive new 5-story flagship store created by Korea\u0027s leading health \u0026 beauty retailer, Olive Young, in Seongsu. Beyond carrying Korea\u0027s best-selling skincare, makeup, and hair care products, it features dedicated zones for emerging K-beauty brands, skin analysis consultations, and a curated K-beauty trend exhibition space, offering an ultra-modern, one-stop drugstore shopping experience.", "name": "Olive Young N Seongsu (\uc62c\ub9ac\ube0c\uc601 N \uc131\uc218)", "transport": "Approx. 2-minute walk from Exit 4 of Seongsu Station (Subway Line 2)"}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "19 Yeonmujang-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc5f0\ubb34\uc7a5\uae38 19)", "feature": "\u2b50 4.5 Stars | Must-Buys: Chubby Bag, Butter Bag, Post Bag. An immensely popular Korean indie bag brand that has taken the younger generation by storm with its minimal retro yet playful designs. Designed like a whimsical exhibition space, the Seongsu flagship showcases various exclusive colorways and high-quality vegan leather bags at very accessible prices\u2014making it a trendsetting landmark you can\u0027t miss when visiting Seongsu-dong.", "name": "STAND OIL Seongsu Flagship Store", "transport": "Approx. 5-minute walk from Exit 4 of Seongsu Station, Subway Line 2"}, {"address": "82 Seongsu-i-ro, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc131\uc218\uc774\ub85c 82)", "feature": "\u2b50 4.6 Stars | Must-Buys: Collaboration Hoodies, Embroidered Label Baseball Caps, Patchwork Long-Sleeve T-shirts. The concept store of top Korean avant-garde designer brand ADER ERROR, the entire building resembles a futuristic space museum filled with immersive art installations. Renowned globally among fashion enthusiasts for its signature deconstructivist designs and iconic Klein Blue, these pieces offer high collectability and bold personal style.", "name": "ADER Space 2.0 Seongsu (ADER ERROR)", "transport": "Approx. 4-minute walk from Exit 3 of Seongsu Station, Subway Line 2"}, {"address": "1-1 Seoulforest 2-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc11c\uc6b8\uc2322\uae38 1-1)", "feature": "\u2b50 4.4 Stars | Must-Buys: Apple Bag, Pocket Mug Bag, Daisy Bag Charms. Founded by a Korean designer couple, the brand\u0027s name means \u0027same temperature\u0027, featuring highly recognizable puffy silhouettes and 3D tailoring. Endorsed by numerous K-POP stars, it offers a rich variety of colors along with customizable charms and chains to let you express your unique personal style.", "name": "SAMO ONDOH Seongsu Flagship Store", "transport": "Approx. 7-minute walk from Exit 5 of Seoul Forest Station, Suin\u2013Bundang Line"}, {"address": "40 Yeonmujang-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc5f0\ubb34\uc7a5\uae38 40)", "feature": "\u2b50 4.5 Stars | Must-Buys: Ballet-style Mary Janes, British-style Snow Boots, Colorful Fashion Rain Boots. Originating from the UK and popularized in Korea, this elegant footwear brand\u0027s Seongsu flagship exudes a charming British vintage cottage atmosphere. Combining classic aesthetic with functionality, its iconic Mary Janes and suede snow boots are elegant, comfortable, and durable\u2014now an essential staple in every Korean woman\u0027s wardrobe.", "name": "Rockfish Weatherwear Seongsu Flagship Store", "transport": "Approx. 6-minute walk from Exit 4 of Seongsu Station, Subway Line 2"}, {"address": "18 Achasan-ro 9-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc544\ucc28\uc0b0\ub85c9\uae38 18)", "feature": "\u2b50 4.3 Stars | Must-Buys: Metal Logo Wallet/Cardholder, Signature Oversized Logo T-shirt, Graffiti Denim Jacket. A trendy brand specializing in Korean minimalist street style, its signature metal-plaque wallet is a must-have item loved by Korean youth. Featuring a sleek industrial store design and versatile tailored apparel, it\u0027s a treasure trove for travelers seeking a cool and edgy look.", "name": "Matin Kim Seongsu Flagship Store", "transport": "Approx. 6-minute walk from Exit 2 of Seongsu Station, Subway Line 2"}, {"address": "83 Achasan-ro, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc544\ucc28\uc0b0\ub85c 83)", "feature": "\u2b50 4.4 Stars | Must-Buys: Slim-fit Blazers, Wide-leg Casual Trousers, Heavyweight Solid T-shirts. The brick-and-mortar label launched by MUSINSA, Korea\u0027s largest online fashion platform, often dubbed the \u0027Korean UNIQLO\u0027 with stylish modern Korean tailoring. Offering exceptional value on versatile basics and trendy pieces, the store boasts a refined ambiance and spacious fitting rooms\u2014making it the ultimate sanctuary to restock your daily wardrobe.", "name": "MUSINSA STANDARD Seongsu Store", "transport": "Directly connected to Exit 3 of Seongsu Station, Subway Line 2"}, {"address": "54 Yeonmujang-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc5f0\ubb34\uc7a5\uae38 54)", "feature": "\u2b50 4.5 Stars | Must-Buys: Court Skate Shoe Series, Dive Platform Sneakers, Logo Streetwear Socks. EPT (East Pacific Trade) is a wildly popular Korean indie footwear brand featuring sneakers that blend American retro skate style with superior comfort. The flagship store sports a clean, stylish interior, and the shoes feature patented cushioned insoles for incredible comfort\u2014perfect for daily walking or street-style looks.", "name": "EPT Seongsu Flagship Store (East Pacific Trade)", "transport": "Approx. 6-minute walk from Exit 3 of Seongsu Station, Subway Line 2"}, {"address": "48 Seongsuil-ro 6-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc131\uc218\uc77c\u8def6\uae38 48)", "feature": "\u2b50 4.6 Stars | Must-Buys: Toni Mini Crescent Bag, Folder Brot Kiss-Lock Bag, Curved Metal Buckle High-Heeled Sandals. A premium Korean indie designer accessories brand whose name derives from the Japanese word for \u0027slow\u0027, advocating timeless, sustainable aesthetics. Featuring signature geometric lines, unique frame closures, and top-tier leather craftsmanship, it is beloved by chic urban women who appreciate fine quality.", "name": "OSOI Seongsu Flagship Store", "transport": "Approx. 7-minute walk from Exit 1 of Seongsu Station, Subway Line 2"}], "name": "Popular Local Clothing, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "14 Seongsuil-ro 8-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc131\uc218\uc77c\ub85c8\uae38 14)", "feature": "\u2b50 4.5 stars | Must-buys: Artisanal Caramel Assorted Gift Box, Sea Salt Caramel Soft Chocolate, Specialty Caramel Spread. This stylish boutique specializes in gourmet handmade caramels, elevating traditional chews into an art form. Using pure natural ingredients and additive-free butter, they offer over a dozen flavors ranging from classic sea salt and truffle to unique Korean pine nut. The beautifully designed paper boxes make these the top choice for stylish gifts when visiting Seongsu-dong.", "name": "Index Caramel Seongsu Store (Index Caramel \uc778\ub371\uc2a4\uce90\ub7ec\uba5c)", "transport": "Approx. 3-min walk from Exit 4 of Seongsu Station, Subway Line 2"}, {"address": "19-8 Seoulforest 2-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc11c\uc6b8\uc2322\uae38 19-8)", "feature": "\u2b50 4.6 stars | Must-buys: Mini Cube Toast, Crispy Toast Rusks, Classic Custard Cream Bun. A wildly popular mini bakery near Seoul Forest, famous for its extraordinarily dense yet pillowy-soft toast. Though the shop is compact, lines always form outside. Their signature mini cube toast is rich and flavorful, while the baked crispy toast rusks are easy to store and make a wonderfully iconic snack souvenir.", "name": "Meal\u00b0 Seoul Forest Main Branch (Meal\u00b0 \ubc00\ub3c4 \uc11c\uc6b8\uc232\ubcf8\uc810)", "transport": "Approx. 4-min walk from Exit 5 of Seoul Forest Station, Suin-Bundang Line"}, {"address": "7 Seongsuil-ro, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc131\uc218\uc77c\ub85c 7)", "feature": "\u2b50 4.3 stars | Must-buys: Peak Matcha Cake, Micro Croissant Gift Set, Black Truffle Croissant. An avant-garde dessert brand under the trendy fashion label Gentle Monster, filled with a mysterious, gallery-like atmosphere. Their creations deliver an avant-garde visual impact, turning desserts into dark works of art. While famous for its dine-in visual experience, the specially packaged micro-croissants and artistic cookie gift sets are super cool souvenirs hugely popular among youth.", "name": "NUDAKE Seongsu Flagship (NUDAKE Seongsu \ub204\ub370\uc774\ud06c \uc131\uc218)", "transport": "Approx. 5-min walk from Exit 4 of Seongsu Station, Subway Line 2"}, {"address": "43 Seoulforest 2-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc11c\uc6b8\uc2322\uae38 43)", "feature": "\u2b50 4.4 stars | Must-buys: Teddy Bear Handmade Cookie Box, French Fruit Tart Gift Box, Handmade Tangy Jam. A French countryside-style dessert cafe hidden in the alleys of Seoul Forest, viral on social media for its heartwarming teddy bear-themed sweets. Focusing on refined French baking, they incorporate cute bear motifs into butter cookies and meringues. The exquisite vintage French tin boxes accompanied by cute cards make these delicious treats an ultimate crowd-pleaser for the young at heart.", "name": "Teddy\u0027s Oven (\ud14c\ub514\uc2a4\uc624\ube10)", "transport": "Approx. 6-min walk from Exit 5 of Seoul Forest Station, Suin-Bundang Line"}, {"address": "3F, 16 Achasan-ro 9-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc544\ucc28\uc0b0\ub85c9\uae38 16 3\uce35)", "feature": "\u2b50 4.7 stars | Must-buys: Custom Engraved Fragrance Mist, Handmade Fragranced Hand Cream, Solid Perfume. A hugely popular independent fragrance brand in Korea with a spacious, minimal design at its Seongsu store. Built on the philosophy of integrating scent into daily life, it offers exceptional quality at great value. Visitors love that buying a fragrance mist includes free custom name or message engraving on the burlap label, creating a unique, memorable scented keepsake.", "name": "Granhand Seongsu (GRANHAND Seongsu \uadf8\ub791\ud578\ub4dc \uc131\uc218)", "transport": "Approx. 5-min walk from Exit 2 of Seongsu Station, Subway Line 2"}, {"address": "104 Achasan-ro, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc544\ucc28\uc0b0\ub85c 104)", "feature": "\u2b50 4.5 stars | Must-buys: DIY Custom Ballpoint Pen, Seongsu-Exclusive Fountain Pen Gift Set, Custom Ink Mixing Experience. Monami is a legendary Korean household stationery brand, and its Seongsu concept store transforms traditional stationery into a chic, modern lifestyle space. Customers can handpick pen refills, barrels, and components to assemble a one-of-a-kind ballpoint pen or try DIY custom ink blending\u2014a perfect gift for stationery lovers back home.", "name": "Monami Concept Store Seongsu (Monami Concept Store Seongsu \ubaa8\ub098\ubbf8\uc2a4\ud1a0\uc5b4 \uc131\uc218\uc810)", "transport": "Direct access from Exit 2 of Seongsu Station, Subway Line 2 (Located on 1F of Seongsu Center Tower)"}, {"address": "7 Yeonmujang 7-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc5f0\ubb34\uc7a57\uae38 7)", "feature": "\u2b50 4.6 stars | Must-buys: Classic Truffle Salt Bread, Fig Cream Salt Bread Box, Black Sesame Salt Bread. A premium salt bread bakery that has taken Seongsu-dong by storm, drawing foodies with its distinctive red-brick exterior and rich buttery aroma. Its salt bread boasts a crisp exterior and a tender, chewy interior full of wheat fragrance and high-grade fermented butter flavor. The elegant takeaway boxes make it a top-rated, exclusive edible souvenir to enjoy back at your hotel or share home.", "name": "Beton Seongsu (Beton Seongsu \ubca0\ud1b5 \uc131\uc218)", "transport": "Approx. 4-min walk from Exit 4 of Seongsu Station, Subway Line 2"}, {"address": "14 Seongsuil-ro 10-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc131\uc218\uc77c\ub85c10\uae38 14)", "feature": "\u2b50 4.4 stars | Must-buys: Classic Glazed Cronut, Biscoff Lotus Cronut Box, Pistachio Cronut. A specialty bakery fusing French croissant dough with American donuts. The crust is amazingly flaky and layered, coated with alluring glazes and luscious fillings. Beautifully boxed gift sets can hold multiple flavors\u2014colorful and eye-catching, making them iconic walking snacks and trendy party gifts in Seongsu-dong.", "name": "Seoul Pastry Seongsu (Seoul Pastry Seongsu \uc11c\uc6b8\ud328\uc2a4\ud2b8\ub9ac \uc131\uc218\uc810)", "transport": "Approx. 5-min walk from Exit 2 of Seongsu Station, Subway Line 2"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "9, Seongsuil-ro 10-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 Stars | Must-Buy List: Le Conte Des Contes designer coats, Epigram curated lifestyle goods, Hanah home scented candles. LCDC SEOUL is an iconic complex fashion shopping space in Seongsu-dong, transforming an old auto repair shop into a modern hub featuring boutique apparel, lifestyle items, and cafes. Home to several local South Korean independent designer brands, it offers unconventional, artistic items\u2014a must-visit spot for fashion enthusiasts seeking unique personal styles.", "name": "LCDC SEOUL Complex Fashion Space", "transport": "About a 5-minute walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "12, Seongsuil-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 Stars | Must-Buy List: Korean trendy designer hoodies, minimalist metal rings, exclusive collaboration sneakers. A massive brick-and-mortar fashion concept store created by MUSINSA, South Korea\u0027s largest online fashion platform. Spanning three floors, it highlights emerging domestic and international designer brands and experimental fashion items. Not only a treasure trove for trendsetters, it frequently hosts limited discounts and sample sales, showcasing Seoul\u0027s cutting-edge street style trends.", "name": "MUSINSA EMPTY Seongsu Concept Store", "transport": "About a 3-minute walk from Exit 4 of Seongsu Station (Subway Line 2)"}, {"address": "82, Seongsuil-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 Stars | Must-Buy List: ADER classic blue label caps, oversized patchwork sweatshirts, avant-garde metal accessories. A large space-themed flagship store created in Seongsu-dong by ADER ERROR, South Korea\u0027s premier streetwear brand. The entire building merges art installations with massive exhibition spaces, offering a shopping experience akin to visiting a contemporary art museum. The store periodically drops limited accessories and outlet deals, drawing fashion lovers worldwide.", "name": "ADER ERROR Seongsu Space Flagship Store", "transport": "About a 6-minute walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "11-1, Achasan-ro 11-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.7 Stars | Must-Buy List: HERA on-site customized cushion foundation, Custom Lip Factory personalized lipstick, AMORE Seongsu exclusive bath \u0026 body travel kits. A grand beauty experience hub transformed from a former car repair shop by Korean beauty giant Amorepacific. It offers free trials for over 1,500 products across more than 30 house brands. Featuring bespoke lipstick and foundation customization services alongside a lush courtyard garden, it stands as one of Seoul\u0027s most iconic beauty shopping landmarks.", "name": "AMORE Seongsu Beauty Flagship Store", "transport": "About a 3-minute walk from Exit 2 of Seongsu Station (Subway Line 2)"}, {"address": "20, Jangchungdan-ro 13-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 Stars | Must-Buy List: Discounted MLB streetwear caps, National Geographic down jackets on sale, FILA retro dad shoes. A large urban outlet located just a few subway stops from Seongsu-dong. Spanning nine floors, it houses hundreds of local Korean and international brands. Offering impressive year-round discounts of 30% to 70%, it is especially recommended for buying Korea-exclusive outdoor apparel and trendy footwear\u2014the top choice for tourists looking for affordable brand-name goods.", "name": "Hyundai City Outlets Dongdaemun", "transport": "About a 4-minute walk from Exit 14 of Dongdaemun History \u0026 Culture Park Station (Subway Line 2 or 4)"}, {"address": "405, Hangang-daero, Yongsan-gu, Seoul", "feature": "\u2b50 4.2 Stars | Must-Buy List: The North Face Korea-exclusive White Label discounted jackets, Beanpole British-style trench coats, Discovery Expedition fleece sweatpants. Located at the heart of Seoul\u0027s transportation hub, this major outlet focuses on off-season discounted items from popular sports, outdoor, and local Korean casual brands. The Korea-exclusive White Label outdoor gear often features massive discounts, and convenient on-site tax refunds make it ideal for shoppers on a tight schedule.", "name": "Lotte Outlet Seoul Station", "transport": "Directly connected to Exit 1 of Seoul Station (Subway Line 1/Line 4)"}, {"address": "40, Yeonmujang-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 Stars | Must-Buy List: British vintage velvet Mary Janes, classic anti-slip rain boots, Morandi-toned wool scarves. Originating from the UK and popularized in South Korea, this renowned footwear brand\u0027s Seongsu flagship features a three-story French classic aesthetic design. The store boasts an exceptionally full collection, ranging from viral Mary Janes to cozy fleece boots essential for autumn/winter. Unique color palettes and exquisite packaging make it a dedicated shopping hotspot for young Korean women.", "name": "Rockfish Weatherwear Seongsu Flagship Store", "transport": "About a 5-minute walk from Exit 4 of Seongsu Station (Subway Line 2)"}, {"address": "63, Wangsimni-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.1 Stars | Must-Buy List: Korean young designer handmade canvas bags, eco-friendly creative ceramic mugs, minimalist silver jewelry from independent brands. Located right next to the entrance of Seoul Forest, this large cultural complex is assembled from over 100 colorful shipping containers. Serving as a display and sales platform for emerging Korean creators and social enterprises, it offers unique handmade stationery, home goods, and eco-fashion items. Youthful, vibrant, and budget-friendly, it\u0027s the top shopping choice after a stroll in Seoul Forest.", "name": "Under Stand Avenue Seoul Forest", "transport": "About a 1-minute walk from Exit 3 of Seoul Forest Station (Suin-Bundang Line)"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Seongsu-dong and Seoul Forest"}};
        const cityName = "Seoul";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
