ping in Dongdaemun.", "name": "No Brand Doota Mall Branch", "transport": "About a 3-minute walk from Exit 8 of Dongdaemun Station."}, {"address": "B2F, 20 Jangchungdan-ro 13-gil, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: CheongKwanJang Korean Red Ginseng Extract Gift Sets, Jeju Tangerine Sandwich Cookies, Traditional Handmade Yakgwa Counters. The upscale food hall on floor B2 of Hyundai City Outlets brings together premium souvenir counters and gourmet supermarkets from all across Korea. In addition to high-end red ginseng products and traditional Korean sweets (Hangwa), it hosts various famous regional brands. The clean, bright shopping environment with immediate tax refunds available makes it ideal for purchasing elegant and classy gifts.", "name": "Hyundai City Outlets Dongdaemun Food Market", "transport": "About a 5-minute walk from Exit 14 of Dongdaemun History \u0026 Culture Park Station."}, {"address": "36 Jongno 52-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-buy list: Apollo Retro Candies, Korean Maltose Candy Sheets, Traditional Grilled Dried Fish Strips. Tucked inside the Changsin-dong Stationery and Toy Wholesale Street in Dongdaemun, this nostalgic snack shop is packed with 1980s and 90s Korean childhood nostalgia. Here, you\u0027ll find classic retro treats that Koreans used to buy at corner stationary stores after school, as well as Dalgona DIY kits. Extremely cheap and full of old-school local charm, it\u0027s a hidden gem for experiencing local Korean nostalgia and picking up fun gifts.", "name": "Changsin-dong Retro Korean Snacks Shop", "transport": "About a 3-minute walk from Exit 4 of Dongdaemun Station."}, {"address": "Inside Dongdaemun Shopping Complex, 266 Jongno, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-buy list: Royal Handmade Honey Yakgwa, Colorful Rice Gangjeong, Sesame Maltose Candy. Located in the traditional Dongdaemun Market area, this historic Korean confectionery shop adheres to time- feature": "\u2b50 4.2 Stars | Must-Buy List: Holika Holika My Fave Mood Eye Palette, Pig Nose Clear Blackhead 3-Step Kit, Piece Matching Shadow. Highly popular in Korea for incredible value for money and dreamy, practical eye shadow palettes. The Hongdae flagship store is fully stocked, especially with Aegyo Sal (under-eye highlight) pencils and anti-puffiness palettes tailored for Asian makeup styles\u2014a must-visit beauty spot for students and travelers.", "name": "Holika Holika Hongdae", "transport": "About a 3-minute walk from Exit 9 of Hongik University Station (Subway Line 2)"}, {"address": "53 Seongmisan-ro 29-gil, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc131\ubbf8\uc0b0\ub85c29\uae38 53)", "feature": "\u2b50 4.7 Stars | Must-Buy List: Rosemary Scalp Scaling Shampoo, Organic Rosehip Oil Cream, Botanical Soothing Body Oil. Tucked in the charming alleys of Yeonnam-dong, Aromatica is a renowned Korean organic, vegan, and sustainable beauty brand. Emphasizing a zero-waste, eco-conscious lifestyle concept, this experience store allows visitors to try clean, natural scalp care treatments and botanical skincare\u2014hugely popular among quality-conscious local youth and eco-minded travelers.", "name": "Aromatica Zero Station (Yeonnam Flagship)", "transport": "About a 12-minute walk from Exit 3 of Hongik University Station (Subway Line 2)"}], "name": "Iconic Local Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "26 Wausan-ro 21-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-buy list: Asymmetrical patchwork geometric sweatshirts, signature ADER blue baseball caps, and deconstructed handbags. More than just a concept flagship store for South Korea\u0027s top independent designer brand ADER Error, this space feels like a futuristic contemporary art gallery. Filled with sci-fi and surrealist spatial installations, it offers an incredible visual experience. Renowned for its asymmetric cuts, deconstructivism, and retro aesthetics, ADER Error is immensely popular among global fashion icons and K-stars, making it an unmissable fashion landmark in Hongdae.", "name": "ADER Error Hongdae Space", "transport": "About an 8-minute walk from Exit 9 of Hongik University Station (Subway Line 2)"}, {"address": "18 Wausan-ro 22-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: Chubby Bag (retro bowling bag), Fluffy Bag (puffy shoulder bag), and Clam Bag (shell-shaped mini bag). A trendy minimalist bag brand that almost every Korean girl owns today, famous for clean lines, rich color palettes, and high-quality vegan leather. The Hongdae flagship features a dreamlike, futuristic audiovisual display space that feels like a modern art exhibition\u2014perfect for photos. It offers premium design aesthetics at an accessible price point.", "name": "STAND OIL Hongdae Flagship Store", "transport": "About a 9-minute walk from Exit 9 of Hongik University Station (Subway Line 2)"}, {"address": "56 Wausan-ro 29-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-buy list: Square-toe suede comfy flats, classic 5cm elegant block-heel ankle boots, and soft leather crisscross sandals. South Korea\u0027s iconic women\u0027s footwear brand, known for affordable prices, vibrant color choices, and supreme comfort. The spacious and bright Hongdae store offers everything from soft K-style flats and sleek boots to summer sandals in dozen-plus shades, making it a go-to destination for buying shoes in every color.", "name": "SAPPUN Hongdae Flagship Store", "transport": "About a 5-minute walk from Exit 8 of Hongik University Station (Subway Line 2)"}, {"address": "39 Jandari-ro 13-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-buy list: T-Logo streetwear oversized tees, American-style cotton hoodies, and multi-pocket cargo pants. Hailed as the Korean version of Supreme, this top streetwear brand seamlessly blends 90s American retro skate culture with Korean tailoring. Featuring unique washed textures and recognizable logo designs, it draws fashion enthusiasts worldwide seeking the latest limited seasonal releases.", "name": "thisisneverthat Hongdae Flagship Store", "transport": "About a 7-minute walk from Exit 1 of Hongik University Station (Subway Line 2)"}, {"address": "23 Eoulmadang-ro 16-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-buy list: Mmlg classic capital logo hoodies, 1987 embroidered baseball caps, and casual everyday tote bags. Mmlg is the casual diffusion line under 87MM, a brand co-founded by famous Korean models Kim Won-joong and Park Ji-woon. Featuring vibrant colors and effortless street style, its durable and high-quality garments are huge favorites among Korean college students\u2014a must-have for crafting authentic K-streetwear style.", "name": "87MM / Mmlg Hongdae Flagship Store", "transport": "About a 10-minute walk from Exit 8 of Hongik University Station (Subway Line 2)"}, {"address": "144 Yanghwa-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: Minimalist wide-leg dress trousers, heavyweight wrinkle-resistant cotton tees, and lightweight technical trench coats. The brick-and-mortar minimalist brand created by MUSINSA, South Korea\u0027s largest online fashion platform. Dubbed the \u0027Korean Uniqlo\u0027, its fits are tailored specifically for Asian body shapes and modern streetwear trends. Offering incredible value for high-quality basics, the fitting rooms even feature professional studio lighting for outfit photo check-ins.", "name": "MUSINSA STANDARD Hongdae", "transport": "Directly accessible from Exit 9 of Hongik University Station (Subway Line 2)"}, {"address": "8 Hongik-ro 3-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.1 stars | Must-buy list: Korean-style textured cardigans, vintage leather shoulder bags, and high-waisted wide-leg jeans. One of Hongdae\u0027s largest budget-friendly select shops, spanning multi-story floors of menswear, womenswear, shoes, bags, and accessories. Impeccably organized, it carries the latest real-time Hongdae street fashion trends at affordable prices, making it a treasure-hunting paradise for budget fashion lovers.", "name": "Market A Hongdae Main Store", "transport": "About a 5-minute walk from Exit 9 of Hongik University Station (Subway Line 2)"}, {"address": "26-24 Eoulmadang-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-buy list: Classic double-stripe purple/green tracksuits, pastel-tone graffiti chunky sneakers, and retro corduroy caps. A local brand that swept K-pop idol culture with its bold color schemes and cozy streetwear aesthetics. The 3-story Hongdae flagship is designed like a retro American home, featuring retail displays and a photogenic caf\u00e9, creating a vibrant and playful atmosphere popular among young fans.", "name": "NERDY Hongdae Flagship Store", "transport": "About a 6-minute walk from Exit 9 of Hongik University Station (Subway Line 2)"}], "name": "Popular Local Clothing, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "B2F, 153 Yanghwa-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc591\ud654\ub85c 153 B2F)", "feature": "\u2b50 4.5 stars | Must-Buy List: Butter Bear plushies, soft cozy home slippers, lifestyle memo pad gift boxes. Located directly inside the Hongik Univ. Station subway passage, BUTTER is one of Korea\u2019s quintessential lifestyle and souvenir brands. The vibrant, adorable shop is packed with soothing knick-knacks and daily items that are stylish yet affordable. Highly popular among students and tourists, it\u0027s a top choice for picking up gifts for friends.", "name": "BUTTER Hongdae Flagship Store", "transport": "Take Subway Line 2 to Hongik Univ. Station, directly connected via Exit 1 passage."}, {"address": "13 Wausan-ro 35-gil, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc640\uc6b0\uc0b0\ub85c35\uae38 13)", "feature": "\u2b50 4.7 stars | Must-Buy List: Korean indie illustrator postcards, handmade eco-friendly fabric drink bags, quirky embroidered patches. A 4-story flagship select store next to the Gyeongui Line Book Street, showcasing curated stationery and goods from local Korean independent designers. From planner supplies and tote bags to ceramic mugs, each floor has a unique theme with a strong hipster aesthetic\u2014perfect for finding truly unique souvenirs.", "name": "Object Hongdae Main Store", "transport": "Take Subway Line 2 to Hongik Univ. Station, Exit 6, approx. 5 mins walk."}, {"address": "162 Yanghwa-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc591\ud654\ub85c 162)", "feature": "\u2b50 4.6 stars | Must-Buy List: Ryan-shaped seaweed snacks, Choonsik limited hooded cape, Hongdae-exclusive keyrings. One of Korea\u0027s premier character brand flagship stores, featuring three spacious floors and a themed cafe. Beyond cute home goods and stationery, it frequently launches Hongdae-exclusive items and specially packaged snack boxes, making it an unmissable shopping and photo spot.", "name": "Kakao Friends Hongdae Flagship Store", "transport": "Take Subway Line 2 to Hongik Univ. Station, Exit 8, approx. 1 min walk."}, {"address": "38 Donggyo-ro 29-gil, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \ub3d9\uad50\ub85c29\uae38 38)", "feature": "\u2b50 4.4 stars | Must-Buy List: Signature premium raw chocolate gift boxes, rich hot chocolate mix packets, special French chocolate crisps. Tucked away in the alleys of Yeonnam-dong, this artisanal chocolate shop is named after the optimal temperature for savoring chocolate. Using premium cocoa beans, the handcrafted chocolates are silky, rich, and balanced. The exquisite packaging makes them ideal high-end dessert gifts.", "name": "17 Degrees Handmade Chocolate (17\ub3c4\uc528)", "transport": "Take Subway Line 2 to Hongik Univ. Station, Exit 3, approx. 8 mins walk."}, {"address": "15 Donggyo-ro 36-gil, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \ub3d9\uad50\ub85c36\uae38 15)", "feature": "\u2b50 4.5 stars | Must-Buy List: Signature Glasses Bear red-bean red mug, leather tablet sleeve, die-cut sticker sets. Centered around a warm yellow bear wearing red glasses, this independent design brand opened a cozy physical store in Yeonnam-dong. The shop features minimal, adorable decor with durable, elegant stationery and tech accessories, making it a beloved local spot for souvenir shopping.", "name": "TETEUM Studio Yeonnam-dong", "transport": "Take Subway Line 2 to Hongik Univ. Station, Exit 3, approx. 6 mins walk."}, {"address": "11 Yeonnam-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc5f0\ub0a8\ub85c 11)", "feature": "\u2b50 4.6 stars | Must-Buy List: Korean creator phone cases, original masking tapes, custom decorative badges. A large stationery and lifestyle store bringing together work from dozens of emerging Korean illustrators. Its wall of neatly displayed stickers and tapes is truly impressive. Offering high-quality paper goods and witty, imaginative merchandise, it\u0027s a haven for unique Korean stationery gifts.", "name": "Made by Hongdae", "transport": "Take Subway Line 2 to Hongik Univ. Station, Exit 3, approx. 3 mins walk."}, {"address": "226 Donggyo-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \ub3d9\uad50\ub85c 226)", "feature": "\u2b50 4.3 stars | Must-Buy List: Signature Butter Red Bean Baguette, rich Basil Salt Bread, handmade French butter cookie gift box. A famous local artisanal bakery on Donggyo-ro renowned for using premium butter and natural yeast. Though compact, it stays busy with takeout traffic as locals and tourists flock here for freshly baked cookie sets and specialty breads\u2014a delicious edible gift from Yeonnam-dong.", "name": "Butter Bakery", "transport": "Take Subway Line 2 to Hongik Univ. Station, Exit 3, approx. 4 mins walk."}, {"address": "156 Yanghwa-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc591\ud654\ub85c 156)", "feature": "\u2b50 4.5 stars | Must-Buy List: Delight Project low-calorie baked bagel chips, TEAZEN Lemon Kombucha, UNOVE Deep Damage Treatment EX. A massive flagship Olive Young store in the Hongdae shopping district. Alongside cosmetics and skincare, its healthy snack aisle is a prime destination for souvenir shopping. Low-cal bagel chips and viral brewed teas are absolute must-buys.", "name": "Olive Young Hongdae Town Flagship Store", "transport": "Take Subway Line 2 to Hongik Univ. Station, Exit 9, approx. 1 min walk."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "188 Yanghwa-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.3 Stars | Must-buy list: K-pop idol merchandise, limited-edition anime figures, CHICOR beauty selections. Located right next to Exit 4 of Hongik University Station, this large multi-complex shopping mall combines K-trend fashion, anime subculture specialty shops, and popular beauty store CHICOR. It is a must-visit shopping spot for younger generations and tourists to discover the latest Korean fashion trends.", "name": "AK Plaza Hongdae", "transport": "Directly accessible from Exit 4 of Hongik University Station (Line 2 / Gyeongui-Jungang Line / AREX)"}, {"address": "152 Arayukro 152beon-gil, Gochon-eup, Gimpo-si, Gyeonggi-do", "feature": "\u2b50 4.5 Stars | Must-buy list: Heavily discounted international brand sneakers, local Korean brand down jackets, famous designer leather goods. A massive outlet center easily accessible from Hongdae, featuring hundreds of international luxury brands and top-quality local Korean brands. Offering deep year-round discounts of 30% to 70%, its spacious canal-side setting and shopping environment are hugely popular with visitors.", "name": "Hyundai Premium Outlet Gimpo", "transport": "Take the subway from Hongik University Station to Gochon Station, then transfer to a shuttle bus or taxi (approx. 20 minutes)."}, {"address": "144 Yanghwa-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.4 Stars | Must-buy list: Slim-fit dress trousers, heavyweight cotton plain T-shirts, minimalist casual blazers. A large physical flagship store created by MUSINSA, Korea\u0027s largest online fashion platform. Featuring a sleek, modern multi-story space with high ceilings, it showcases high-value minimalist daily outfits and exclusive apparel hugely popular among Korean youth.", "name": "MUSINSA Standard Hongdae", "transport": "Approx. 2-minute walk from Exit 9 of Hongik University Station (Line 2)"}, {"address": "13 Wausan-ro 35-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.6 Stars | Must-buy list: Independent illustrator collaboration stickers, handmade fabric canvas bags, original ceramic mugs. An iconic multi-story lifestyle and design store located in Yeonnam-dong, bringing together works from hundreds of local independent Korean creators and designers. Offering everything from stationery and lifestyle goods to home decor, it is filled with heartwarming handmade charm and unique Korean design flair.", "name": "Object Yeonnam", "transport": "Approx. 5-minute walk from Exit 6 of Hongik University Station (Line 2)"}, {"address": "23 Wausan-ro 29da-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.3 Stars | Must-buy list: 3CE velvet lip tints, K-style oversized denim jackets, vintage knitwear. A standalone concept flagship store of STYLENANDA, an iconic Korean fashion brand. Combining the Asia-famous beauty brand 3CE with trendy womenswear, the visually striking retail space features multiple photo zones, making it a top shopping destination for female travelers.", "name": "STYLENANDA Hongdae Flagship", "transport": "Approx. 7-minute walk from Exit 8 of Hongik University Station (Line 2)"}, {"address": "B2, 153 Yanghwa-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.2 Stars | Must-buy list: Cute plush toys, soft blackout sleep masks, mini desktop organizers. Directly accessible via the underground passage at Hongik University Station, this large lifestyle goods store is themed around colorful aesthetics and adorable original characters. Selling affordable everyday knick-knacks, stationery, and stylish home goods, it is an ideal spot to pick up souvenirs and cute items.", "name": "Butter Hongdae", "transport": "Directly connected to Exit 1 underground concourse of Hongik University Station (Line 2)"}, {"address": "29 Yanghwa-ro 16-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.3 Stars | Must-buy list: Korean trendy brand hoodies, independent designer canvas tote bags, designer phone cases. One of Korea\u0027s most iconic multi-brand select stores, spanning multiple floors and bringing together dozens of emerging local designer brands. From streetwear to shoes, bags, and accessories, it is a key shopping hub for getting a pulse on the latest K-fashion trends.", "name": "ALAND Hongdae", "transport": "Approx. 6-minute walk from Exit 9 of Hongik University Station (Line 2)"}, {"address": "45 Yanghwa-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.4 Stars | Must-buy list: Homeplus Korean specialty ramen gift sets, Topten affordable thermal wear, delicate Korean-style earrings. A large open-air shopping complex connected to Hapjeong Station right next to Hongdae, famous for its iconic colorful umbrella canopy display. It houses a large Homeplus supermarket, budget-friendly fashion brands, and unique specialty boutiques, offering an exceptionally spacious and comfortable shopping environment.", "name": "Mecenatpolis Mall", "transport": "Directly connected via underground concourse from Exits 9 or 10 of Hapjeong Station (Line 2 / Line 6)"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Hongdae and Yeonnam-dong"}, "itaewon_hannam": {"categories": {"cat_1": {"items": [{"address": "3F, 242 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: Gentle Night Hand Cream, Santal Cream Perfume, Lip Balm. Located in the fashionable heart of Hannam-dong, the NONFICTION flagship store is adored by Korean hipsters and fashion enthusiasts for its sleek, minimalist design. The brand focuses on clean ingredients and unique woody scents. Its Gentle Night series features a soft scent profile blending sweet fig and subtle suede notes, making it one of Seoul\u0027s most iconic artistic fragrance lines. The shop is spacious, bright, and gallery-like, offering a fantastic fragrance-testing experience.", "name": "NONFICTION Hannam Flagship Store", "transport": "Approx. 5-minute walk from Exit 3 of Hangangjin Station (Subway Line 6)"}, {"address": "238 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-buy list: CHAMO Solid Perfume, Shell Hand Cream, Perfumed Body Lotion. Created by the Gentle Monster team, the famous beauty and fragrance brand Tamburins integrates art gallery spaces seamlessly with fragrance products at its Hannam location. The iconic shell-shaped hand cream and metal-chained solid perfume offer sleek designs that combine visual aesthetics with sophisticated scents. The star scent, CHAMO, carries soothing notes of chamomile and wood\u2014a trendy beauty destination in Hannam-dong you definitely shouldn\u0027t miss.", "name": "Tamburins Hannam Flagship Store", "transport": "Approx. 4-minute walk from Exit 3 of Hangangjin Station (Subway Line 6)"}, {"address": "34 Daesagwan-ro 11-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.7 stars | Must-buy list: Susie Salmon Multi-Perfume, Sachet, Moisturizing Hand Cream. GRANHAND is a wildly popular independent Korean fragrance brand guided by the philosophy that \u0027scents drop memories into daily life.\u0027 Tucked away in a stylish alleyway, the Hannam store offers personalized stamping on fabric labels upon perfume purchases. The classic scent Susie Salmon offers fresh fruity and floral notes, and its rustic yet elegant packaging comes highly recommended by art and lifestyle enthusiasts.", "name": "GRANHAND Hannam", "transport": "Approx. 10-minute walk from Exit 3 of Hangangjin Station (Subway Line 6)"}, {"address": "16 Itaewon-ro 49-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-buy list: Midsummer Forward Perfume, The White Shirt Hand Cream, Scented Hand Wash. Pesade is a rapidly rising Korean niche fragrance brand in Hannam-dong. Its flagship store is housed in a renovated vintage mansion, featuring warm reddish-brown tones and artistic sculptures to create a stylish, inviting space. Specializing in layered perfumes and body care, its bestseller Midsummer Forward blends fresh green leaves with a woody base, drawing stylish shoppers looking for refined scents.", "name": "Pesade Hannam Flagship Store", "transport": "Approx. 6-minute walk from Exit 1 of Hangangjin Station (Subway Line 6)"}, {"address": "14-2 Itaewon-ro 49-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-buy list: Matte Single Eyeshadow, Mood Enhancer Water Liquid Lip, Cushion Foundation. The boutique store of hince, a chic Korean makeup brand, is renowned for its sophisticated Morandi-toned color cosmetics and layered packaging design. The store offers a quiet, relaxed atmosphere to test products thoroughly. Their glossy lip tints and delicate cushion foundations create an effortless Korean \u0027no-makeup\u0027 makeup look, making it a favorite among tourists and local trendsetters alike.", "name": "hince Atelier Hannam", "transport": "Approx. 6-minute walk from Exit 1 of Hangangjin Station (Subway Line 6)"}, {"address": "24 Itaewon-ro 49-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-buy list: Water-based Perfumes, Pommade Concr\u00e8te Hand Cream, Customized Lip Balm. The Hannam flagship store of the century-old French fragrance house Buly 1803 perfectly recreates the vintage elegance of a 19th-century Parisian apothecary. The packaging of their popular hand creams and lip balms can be personalized on-site with exquisite calligraphy. Renowned internationally for alcohol-free, water-based perfumes, it\u0027s the ultimate destination for travelers seeking unique, high-end beauty gifts.", "name": "Officine Universelle Buly 1803 Hannam", "transport": "Approx. 7-minute walk from Exit 1 of Hangangjin Station (Subway Line 6)"}, {"address": "179 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-buy list: Torriden Dive-In Low Molecule Hyaluronic Acid Serum, Anua Heartleaf 77% Soothing Toner, Clio Mascara. Located on Itaewon Boulevard, this large-scale Olive Young concept store features an extensive selection of Korea\u0027s top beauty and skincare brands. Unlike smaller branches, this location offers a dedicated bestseller ranking area and tourist-friendly testing stations, fully stocked with popular Korean sheet masks, hydrating serums, and drugstore makeup. It is the ultimate one-stop shop for trending K-beauty items.", "name": "Olive Young Itaewon Town", "transport": "Approx. 1-minute walk from Exit 2 of Itaewon Station (Subway Line 6)"}, {"address": "38 Itaewon-ro 55-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: 3pm Eau de Parfum, 6am Hand Cream, Hand Cream Gift Set. Inspired by time points in Wimbledon, the Korean lifestyle fragrance brand SW19 captures the essence of different times of day (such as 6am, 3pm, 9pm, Midnight) into signature scents. Designed like an art gallery, the Hannam showroom lets visitors discover their signature scent in a clean, sophisticated ambiance. The popular 3pm fragrance blends refreshing black tea with cedarwood, making it an elegant souvenir for travelers.", "name": "SW19 Hannam Showroom", "transport": "Approx. 8-minute walk from Exit 1 of Hangangjin Station (Subway Line 6)"}], "name": "Local Iconic Cosmetics \u0026 Beauty Stores"}, "cat_2": {"items": [{"address": "58 Itaewon-ro 54-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-Buys: Classic printed daisy oversized T-shirt, flower pattern sweatshirt, cropped knit cardigan. This massively popular Korean local designer brand has a flagship showroom in Hannam-dong, featuring a minimalist architectural exterior that attracts crowds of trendsetters. Its most iconic signature is the classic daisy print (FLOWER MARDI), combining French romance with Korean casual chic. Featuring clean cuts and versatile fits, this is an absolute first-stop must-shop for fashion enthusiasts visiting Hannam-dong.", "name": "Mardi Mercredi Hannam Flagship Store", "transport": "About an 8-minute walk from Exit 3 of Hangangjin Station (Line 6)"}, {"address": "26 Daesagwan-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-Buys: Embroidered baseball cap, corduroy shoulder bag, retro leopard print hair accessories. EMIS is a trendy local Korean brand that has blown up in recent years thanks to endorsements from numerous Korean stars and idols. The store exudes an American retro vibe, featuring baseball caps in diverse styles and colors with face-flattering fits. Additionally, their lightweight and stylish nylon and corduroy bags sell out instantly\u2014affordable and incredibly practical for everyday styling.", "name": "EMIS Hannam Flagship Store", "transport": "About a 10-minute walk from Exit 3 of Hangangjin Station (Line 6)"}, {"address": "11 Itaewon-ro 55-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-Buys: French logo script T-shirt, retro denim jeans, canvas tote bag. Rebranded into one of the leaders of Korean high-street fashion, the Hannam flagship store boasts a spacious, minimalist, and modern interior. Their signature big \"MARITH\u00c9\" letter-logo apparel sparked a global craze. Emphasizing comfortable fabrics and elegant French lines, everything from basic tees to denim jackets makes for an unmissable fashion statement when shopping here.", "name": "MARITH\u00c9 FRAN\u00c7OIS GIRBAUD Hannam Flagship Store", "transport": "About a 6-minute walk from Exit 1 of Hangangjin Station (Line 6)"}, {"address": "58 Itaewon-ro 54-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-Buys: Classic British-style rain boots, Mary Jane ballet flats, down snow slippers. Originally a British rainwear brand, it was redesigned and rebranded by a Korean team into one of the most eye-catching women\u0027s footwear brands. The Hannam-dong store feels like a traditional British town shop, exuding a warm vintage atmosphere. Short rain boots and sleek ballet flats are essential fashion staples here, featuring lightweight textures and soft pastel colorways.", "name": "Rockfish Weatherwear Hannam Flagship Store", "transport": "About an 8-minute walk from Exit 3 of Hangangjin Station (Line 6)"}, {"address": "68 Itaewon-ro 54-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-Buys: Vintage blazer, preppy buttoned cardigan, pleated midi skirt. GROVE is a renowned independent local designer brand in Seoul, specializing in 90s American preppy aesthetic blended with French vintage chic. The Hannam store features elegant, refined decor, showcasing highly popular tailored blazers, color-block knits, and delicate accessories each season\u2014a must-visit boutique for those seeking sophisticated elegance.", "name": "GROVE Hannam Store", "transport": "About a 9-minute walk from Exit 3 of Hangangjin Station (Line 6)"}, {"address": "14 Daesagwan-ro 5-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-Buys: French cursive canvas tote bag, elegant wool sweater, premium loungewear set. Designing around the concept of \u0027French romance in daily life,\u0027 depound\u0027s Hannam-dong showroom is set in a charmingly renovated detached house with a cozy ambience. Beyond their iconic canvas bags printed with cursive English, the store offers exquisite clothing and home goods, making it a favorite spot for youth who love minimalist warmth.", "name": "depound Hannam Showroom", "transport": "About a 12-minute walk from Exit 3 of Hangangjin Station (Line 6)"}, {"address": "41 Itaewon-ro 36-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-Buys: RR logo tank top, cropped hoodie, unisex casual baseball cap. Founded by an emerging Korean designer, local brand Rest \u0026 Recreation quickly swept the K-fashion scene with its minimalist yet edgy unisex style. The Hannam flagship features avant-garde, sleek interior design with its highly recognizable iconic dual-R logo, making it the top choice for travelers into Korean trendy hot-girl chic or gender-neutral streetwear.", "name": "Rest \u0026 Recreation Hannam Flagship Store", "transport": "About an 8-minute walk from Exit 3 of Noksapyeong Station (Line 6)"}, {"address": "64 Hoenamu-ro 13-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-Buys: Stylish graphic crew socks, brand graffiti tote bag, retro sticker merch. MSMR is a Korean local independent designer brand and concept space centered around the humble \u0027sock\u0027. Shopping here isn\u0027t just about beautifully packaged, stylish socks and accessories\u2014the shop also offers complimentary drinks and lovely sticker packs. The vibrant, colorful store decor makes it a highly renowned select shop in the area.", "name": "MSMR Hannam", "transport": "About a 12-minute walk from Exit 2 of Noksapyeong Station (Line 6)"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "241 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.6 Stars | Must-Buy List: Shell Perfume Hand Cream, Egg Perfume, Perfumed Hand Wash. Located in the fashionable heart of Hannam-dong, TAMBURINS is famous for its unique gallery-style space and avant-garde visual design. Their signature Shell Hand Cream is deeply moisturizing with an elegant scent, while the adorable Egg Perfume makes a sophisticated gift that attracts stylish shoppers.", "name": "TAMBURINS Hannam Flagship Store", "transport": "Subway Line 6 Hangangjin Station Exit 1, about a 5-minute walk"}, {"address": "242 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 Stars | Must-Buy List: Gaiac Flower Hand Cream, Mini Perfume Gift Set, Vegan Lip Balm. As and streetwear boutique, gathering dozens of local indie designer labels. From apparel and bags to accessories, it\u0027s the ultimate one-stop shop for authentic K-style fashion elements.", "name": "ALAND Lotte World Mall", "transport": "Direct access to Lotte World Mall from Exit 10 of Jamsil Station (Subway Lines 2 \u0026 8), then take escalator to 3F"}, {"address": "B1, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-Haves: French Tweed-Style Blazers, Versatile Pleated Dresses, Korean-Style Drop-Shoulder Trench Coats. A representative Korean local women\u0027s fashion brand tailored specifically for Asian silhouettes. Known for rapid style updates and highly competitive prices, making it a favorite among local office workers and budget-conscious fashionistas.", "name": "MIXXO Lotte World Mall", "transport": "Direct connection via underground passage from Jamsil Station (Subway Lines 2 \u0026 8) to Lotte World Mall B1"}, {"address": "B1, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.1 stars | Must-Haves: Casual Oversized Blazers, Cable-Knit Cardigans, High-Waisted Wide-Leg Jeans. Samsung Group\u0027s flagship national fast-fashion brand, combining cutting-edge Korean fashion trends with high cost-performance. Offering smart-casual styles, it is a popular everyday shopping spot for local youth.", "name": "8SECONDS Lotte World Mall", "transport": "Direct connection via underground passage from Jamsil Station (Subway Lines 2 \u0026 8) to Lotte World Mall B1"}, {"address": "3F, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-Haves: Disruptor Chunky Sneakers, Korea-Exclusive Vintage Color-Block Hoodies, High-Capacity Trendy Backpacks. A global sportswear brand revitalized through Korean design innovation. The Jamsil flagship store offers an extensive collection of Korea-exclusive sneakers and trendy activewear.", "name": "FILA Lotte World Mall", "transport": "Direct access to Lotte World Mall from Exit 10 of Jamsil Station (Subway Lines 2 \u0026 8), then take escalator to 3F"}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "240 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 240)", "feature": "\u2b50 4.5 stars | Must-Buy List: HBAF Honey Butter Almonds, Market O Real Brownie, Lotte Zero Dark Chocolate Pie. As the flagship concept supermarket of Lotte Group in Jamsil, this store boasts the most comprehensive selection of souvenirs and limited-edition snack zones in Korea. Featuring a dedicated section for top Korean snack souvenirs at affordable prices with frequent promotions, it is the ultimate one-stop shop for tourists stocking up on local snacks, seaweed, and kimchi.", "name": "Lotte Mart ZETTAPLEX Jamsil", "transport": "Directly accessible from Exit 4 of Jamsil Station (Subway Line 2/8)"}, {"address": "B1, Lotte Department Store Jamsil, 240 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 240)", "feature": "\u2b50 4.4 stars | Must-Buy List: Monaka Ice Cream, Traditional Oranda (Crispy Rice Snack), Old-Fashioned Red Bean Bread. Founded in 1946, Taegeukdang is Seoul\u0027s oldest bakery. Its counter inside Lotte Department Store Jamsil recreates an elegant retro charm. The iconic Monaka Ice Cream\u2014featuring a crispy wafer shell filled with rich cream\u2014is a beloved nostalgic treat across generations in Korea. Packed in beautiful vintage-style boxes, it makes for a uniquely charming edible gift.", "name": "Taegeukdang - Lotte Department Store Jamsil Branch", "transport": "Direct access to Lotte Department Store B1 via the underground passage from Jamsil Station (Subway Line 2/8)"}, {"address": "6F, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 300)", "feature": "\u2b50 4.3 stars | Must-Buy List: Signature Vegetable Bread (Yachae-bang), Special Red Bean Bread, Handmade Korean Rice Cookie Gift Set. Established in 1945, Leesungdang is one of Korea\u0027s oldest bakeries. Its store inside Lotte World Mall bakes fresh, warm bread daily. The famous Vegetable Bread delivers an insanely refreshing crunch with its signature cabbage filling. Paired with beautifully packaged traditional rice crackers and artisan pastries, it offers a deliciously authentic taste of Korean heritage.", "name": "Leesungdang - Lotte World Mall Branch", "transport": "Exits 1 or 2 of Jamsil Station (Subway Line 2/8), 6th Floor of Lotte World Mall"}, {"address": "2F, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 300)", "feature": "\u2b50 4.6 stars | Must-Buy List: Jeju Green Tea Milk Spread, Green Tea Wafers, Jeju Floral \u0026 Fruit Tea Bag Assortment Gift Set. OSULLOC, a premium tea brand hailing from Jeju Island, offers sophisticated tea gifts at Lotte World Mall. The best-selling Green Tea Milk Spread is rich yet perfectly sweet\u2014a heavenly match for toast. Featuring elegantly designed tea sets, these make sophisticated gifts for elders or friends, perfectly capturing modern Korean tea culture.", "name": "OSULLOC Tea House - Lotte World Mall Branch", "transport": "Direct access to Lotte World Mall 2F via the underground connection from Jamsil Station (Subway Line 2/8)"}, {"address": "B1, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 300)", "feature": "\u2b50 4.4 stars | Must-Buy List: Cheese \u0026 Chili Fish Cake Bar, Chili Handmade Fish Cake Croquette, Vacuum-Packed Assorted Fish Cake Gift Set. Samjin Amook is a legendary fish cake brand originating from Busan. Its spacious shop in Lotte World Mall serves freshly crafted artisanal fish cakes in innovative flavors. They also offer vacuum-sealed souvenir packs with broth bases for extended shelf life, letting travelers bring home the authentic flavor of traditional Korean street food.", "name": "Samjin Amook - Lotte World Mall Branch", "transport": "Direct access to Lotte World Mall B1 via the underground connection from Jamsil Station (Subway Line 2/8)"}, {"address": "5F, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 300)", "feature": "\u2b50 4.5 stars | Must-Buy List: Milk Cream Donut, Earl Grey Donut, Knotted Chocolate Chip Cookie Gift Set. Cafe Knotted is a wildly popular trendy dessert brand famous across Korea for its iconic yellow smiley bear mascot and luscious, cream-filled donuts. Beyond freshly made donuts, the Lotte World Mall location sells adorable souvenir items like cookie sets in cute smiley tins, gummies, and stationery merchandise\u2014must-buys for lovers of cute pop culture!", "name": "Cafe Knotted - Lotte World Mall Branch", "transport": "Exit 1 of Jamsil Station (Subway Line 2/8), directly leading into Lotte World Mall 5F"}, {"address": "1F, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 300)", "feature": "\u2b50 4.7 stars | Must-Buy List: Spring Onion Pretzel Bagel, Brick Lane Bagel, Maple Walnut Cream Cheese Dip. Currently Seoul\u0027s most viral, queue-worthy bagel phenomenon, the spacious Jamsil branch oozes vintage British charm. Featuring uniquely chewy, dense bagels with imaginative flavors, the shop offers stylish takeaway boxes and insulated bags, making it a top choice for tourists seeking a trendy, high-end edible souvenir.", "name": "London Bagel Museum Jamsil", "transport": "About a 2-minute walk from Exit 10 of Jamsil Station (Subway Line 2/8) to 1F of Lotte World Mall"}, {"address": "18 Seokchonhosu-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc11d\ucd0c\ud638\uc218\ub85c 18)", "feature": "\u2b50 4.6 stars | Must-Buy List: Ang-Butter Walnut Cake, Lemon Butter Walnut Cake, Semi-Dried Persimmon Walnut Gift Box. Bokhodu is a fast-rising trendy confectionery store modernizing traditional Korean walnut cakes (Hodu-gwaja) by stuffing them with thick slabs of rich butter for a deliciously sweet and savory contrast. Packaged in sleek, affordable small square boxes with a longer shelf life than freshly baked pastries, it has quickly become a standout local souvenir.", "name": "Bokhodu Jamsil", "transport": "About an 8-minute walk from Exit 3 of Jamsilsaene Station (Subway Line 2), near Seokchon Lake Park"}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "240 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-Buy List: Sulwhasoo First Care Activating Serum, Tamburins Perfumed Hand Cream, Seongsu-dong designer handmade women\u0027s shoes. An iconic, top-tier department store in South Korea directly connected to the subway station. The B1 food hall and luxury fashion area are hugely popular among Seoul locals and office workers. Features spacious shopping aisles and an exceptionally comprehensive brand selection.", "name": "Lotte Department Store Jamsil", "transport": "Directly accessible via the underground passage from Exit 3 or 4 of Jamsil Station (Subway Line 2 or Line 8)."}, {"address": "300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.7 stars | Must-Buy List: Gentle Monster sunglasses, Ader Error trendy hoodies, London Bagel Museum bagels. An ultra-large, modern shopping complex located right next to the Lotte World Tower. It gathers numerous trendy designer brands and viral hot spots sought after by young Koreans, making it the most iconic landmark shopping paradise in the Jamsil area.", "name": "Lotte World Mall", "transport": "Direct access from Exit 10 or 11 of Jamsil Station (Subway Line 2 or Line 8)."}, {"address": "405 Hangang-daero, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-Buy List: Discounted Nike sneakers, Beanpole classic trench coats, Discovery Expedition down jackets. The most conveniently located Lotte outlet in central Seoul. It offers fantastic discounts ranging from 30% to 80% off on famous domestic Korean and international brands\u2014perfect for bargain-hunting travelers seeking high value.", "name": "Lotte Outlet Seoul Station", "transport": "Take Subway Line 2 from Jamsil Station to Dongdaemun History \u0026 Culture Park Station, transfer to Line 4 to Seoul Station; directly accessible from Exit 1."}, {"address": "B1, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-Buy List: 3355 American vintage graphic tees, Fennec genuine leather wallets, canvas bags by emerging Korean designers. South Korea\u0027s premier flagship store for domestic independent designer selections. Hugely popular among local K-pop enthusiasts, offering everything from uniquely styled men\u0027s and women\u0027s apparel to distinct accessories.", "name": "ALAND (Lotte World Mall Branch)", "transport": "About a 3-minute walk via the underground passage from Jamsil Station (Subway Line 2)."}, {"address": "B1, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-Buy List: Butter yellow cute bear plush cushions, Korean-style textured blackout sleep masks, novelty bathroom graphic towels. A wildly popular Korean lifestyle and stationery brand featuring uplifting original character merch and sleek home decor. Its vibrant, cheerful interior keeps local young women and students coming back for more.", "name": "Butter (Lotte World Mall Branch)", "transport": "About a 2-minute walk via the underground passage from Exit 10 of Jamsil Station (Subway Line 2)."}, {"address": "1F, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-Buy List: Huxley Cactus Seed Secret of Sahara Oil, rom\u0026nd Juicy Lasting Tint, hince Radiance Balm. Created by Shinsegae Department Store, this beauty flagship curator is dubbed the Korean Sephora. Dedicated to sourcing Korea\u0027s hottest niche cosmetics and skincare brands, it is the top destination for local girls seeking trendy makeup.", "name": "CHICOR (Lotte World Mall Branch)", "transport": "Direct access to the mall lobby via the underground passage from Jamsil Station (Subway Line 2)."}, {"address": "2F, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-Buy List: Korean-style drop-shoulder oversized blazers, vintage cable-knit cardigans, high-waisted wide-leg trousers. A signature Korean fast-fashion brand under Samsung Group, tailored specifically for Asian body types. Every season features well-cut, ultra-stylish K-style everyday wear offering incredible value for money.", "name": "8SECONDS (Jamsil Lotte World Mall Branch)", "transport": "Direct access from Exit 11 of Jamsil Station (Subway Line 2)."}, {"address": "3F, Lotte Department Store Jamsil, 240 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-Buy List: New Balance Korea-exclusive colorway sneakers, FOLDER exclusive platform loafers, retro Korean-style running shoes. A trendy multi-brand shoe store under E-Land Group. Alongside major global sports brands, it frequently drops Korea-exclusive colorways and hot collaboration sneakers, making it a go-to secret spot for Seoul fashionistas.", "name": "FOLDER (Lotte Jamsil Branch)", "transport": "Direct access to Lotte Department Store from Exit 3 of Jamsil Station (Subway Line 2)."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Jamsil and Lotte World"}, "jongno_bukchon": {"categories": {"cat_1": {"items": [{"address": "47 Bukchon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.7 stars | Must-buy list: First Care Activating Serum, Concentrated Ginseng Renewing Cream, and Bukchon-exclusive traditional handcrafted fragrance sachets. This flagship store seamlessly blends a 1930s Hanok with a 1960s Western-style mansion, showcasing a harmony of traditional Korean aesthetics and modern luxury skincare. Visitors can enjoy personalized premium Hanbang (traditional Korean herbal medicine) skin consultations in antique gardens and wooden structures, complete with exclusive Hanji (traditional paper) gift-wrapping services. It stands as the most iconic beauty landmark in the Jongno and Bukchon area.", "name": "Sulwhasoo Bukchon Flagship Store", "transport": "Subway Line 3 Anguk Station Exit 2, approx. 8-minute walk"}, {"address": "19 Bukchon-ro 11-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.8 stars | Must-buy list: Susie Salmon Multi-Perfume Spray, Tobermory Moisturizing Hand Cream, and custom-stamped fabric label fragrances. GRANHAND is an immensely popular Korean niche handcrafted fragrance brand tucked away in Bukchon\u0027s traditional Hanok village. Championing the philosophy that scent should be woven into daily life, its products feature vintage styling with linen textures and minimalist typography. On-site perfume purchases come with free custom name stamping on the linen label, making it a huge hit among local youth and travelers alike.", "name": "GRANHAND Bukchon", "transport": "Subway Line 3 Anguk Station Exit 2, approx. 10-minute walk"}, {"address": "84 Yunboseon-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-buy list: CHAMO Shell Perfume Hand Cream, Perfume Balm, and Classic Chain Hand Cream. Renowned for its avant-garde artistic spaces, Korean high-fashion fragrance brand Tamburins opened a flagship store near Anguk Station that fuses earthen artistic installations with architectural beauty. Stepping inside feels like entering a contemporary gallery. Its signature Shell Perfume Hand Cream and design-centric fragrances are among the hottest beauty souvenirs to grab in Seoul.", "name": "Tamburins Anguk Flagship Store", "transport": "Subway Line 3 Anguk Station Exit 1, approx. 3-minute walk"}, {"address": "84 Bukchon-ro 5-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: Santal Cream Hand Cream, Gentle Night Scented Body Lotion, and Vegan Botanical Lip Balm. Nonfiction is an independent Korean brand focusing on clean care and understated luxury scents. The Samcheong flagship store sits in a serene, artistic neighborhood, offering an airy, sun-drenched space. The brand emphasizes non-toxic ingredients and unique olfactory creations; its hand cream and body care lines are particularly revered for their refined textures and Korean minimalist packaging aesthetic.", "name": "Nonfiction Samcheong Flagship Store", "transport": "Subway Line 3 Anguk Station Exit 1, approx. 12-minute walk"}, {"address": "17 Yulgok-ro 3-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-buy list: All-natural Solid Shampoo Bar, Organic Sunscreen, and Botanical Cica Recovery Cream. TONE 28 is a well-known Korean sustainable and organic beauty brand committed to non-toxic natural ingredients and recyclable paper packaging. The Anguk store blends traditional Hanok aesthetics with modern eco-friendly concepts, offering precise skin diagnostic services. It is a must-visit destination for enthusiasts of natural skincare and zero-waste beauty.", "name": "TONE 28 Anguk Space", "transport": "Subway Line 3 Anguk Station Exit 1, approx. 5-minute walk"}, {"address": "9 Insadong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-buy list: 1898 Single Essence, Daily Defense Oil, and Red Ginseng Intensive Repair Mask. DONGINBI is a prestige red ginseng skincare brand under CheongKwanJang, a century-old Korean heritage brand. It fuses high-concentration red ginseng extracts with modern skincare technology. Located in the Insadong cultural district, the shop offers in-depth introductions to traditional Hanbang beauty and hands-on trial experiences\u2014a true hallmark high-end K-beauty store for travelers interested in anti-aging and traditional herbal skin solutions.", "name": "DONGINBI Insadong Store", "transport": "Subway Line 3 Anguk Station Exit 6, approx. 6-minute walk"}, {"address": "104 Samcheong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: Green Tea Seed Serum, Super Volcanic Pore Clay Mask, and Jeju-exclusive scented hand cream. Located in the Samcheong-dong Hanok district, this flagship store combines beauty shopping with a charming organic cafe. The building blends natural wood elements with glass architecture. In addition to shopping the full line of eco-friendly Korean nature-based skincare, visitors can join DIY natural handmade soap workshops, making it a unique shop combining traditional neighborhood charm with immersive beauty experiences.", "name": "Innisfree Jeju House Samcheong", "transport": "Subway Line 3 Anguk Station Exit 1, approx. 15-minute walk"}, {"address": "53 Insadong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-buy list: Torriden DIVE-IN Low Molecular Hyaluronic Acid Serum, Anua Heartleaf 77% Soothing Toner, and Round Lab Dokdo Cleanser. Though part of a major chain, this Insadong branch features a traditional wooden archway entrance and custom traditional displays tailored to the historic district. Gathering countless trending indie K-beauty skincare and cosmetic brands, it is the ultimate hub for grabbing the latest, high-value K-beauty hits.", "name": "Olive Young Insadong Flagship Store", "transport": "Subway Line 3 Anguk Station Exit 6, approx. 4-minute walk"}], "name": "Iconic Local Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "2F, 22 Sajik-ro 9-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc0ac\uc9c1\ub85c9\uae38 22 2\uce35)", "feature": "\u2b50 4.6 stars | Must-Buy List: Korean illustrator collaboration canvas bags, handmade embroidered coin purses, and uniquely patterned socks. Located in the Seochon area of Jongno, One More Bag is a favorite among local hipsters and fashion enthusiasts. It specializes in curating cloth bags and accessories from independent Korean creators and designers. The store features hundreds of unique canvas bags, tote bags, and everyday lifestyle goods. High in quality and rare to duplicate, these items showcase the vibrant spirit of local Korean design.", "name": "One More Bag Independent Select Shop", "transport": "Subway Line 3 Gyeongbokgung Station, Exit 1, approx. 5 mins walk"}, {"address": "35-4 Insadong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d9\uae38 35-4)", "feature": "\u2b50 4.4 stars | Must-Buy List: Modernized daily Hanbok dresses, printed traditional pleated skirts, and Korean-style cropped knit cardigans. Located in the cultural district of Insadong, Teterot Dress artfully blends the elegant lines of traditional Korean Hanbok with modern everyday apparel. Using high-quality cotton, linen, and comfortable fabrics, they craft wearable daily Hanbok that seamlessly fits into modern wardrobes\u2014a beloved choice for local women who appreciate elegance and Korean heritage.", "name": "Teterot Dress Modern Hanbok", "transport": "Subway Line 3 Anguk Station, Exit 6, approx. 4 mins walk"}, {"address": "127 Samcheong-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc0bc\uccad\ub85c 127)", "feature": "\u2b50 4.5 stars | Must-Buy List: BLANKOF signature helmet bags, minimalist technical hooded jackets, and classic embroidered baseball caps. Situated along the beautiful tree-lined street of Samcheong-dong, Slow Steady Club is an iconic high-end streetwear select shop in Korea. The building fuses modern gallery aesthetics, while its house brand BLANKOF is famous for minimalist design and top-tier functionality, highly praised by Seoul trendsetters and fashion bloggers.", "name": "Slow Steady Club Samcheong Flagship Store", "transport": "Subway Line 3 Anguk Station, Exit 1, transfer to Green Village Bus Jongno 11 and get off at Samcheong-dong Community Center Station"}, {"address": "2F, Ssamziegil, 44 Insadong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d9\uae38 44 \uc308\uc9c0\uae38 2\uce35)", "feature": "\u2b50 4.7 stars | Must-Buy List: Stylish Korean-style long trench coats, versatile motif shawls, and Korean handmade knot crossbody bags. Leesle is South Korea\u0027s premier modern Hanbok designer brand, having even created stage outfits for K-pop idols. The store deftly incorporates traditional Korean clothing knots and collars into sleek contemporary fashion, making it perfect for both tourists and locals looking to collect a truly unique style.", "name": "Leesle Modern Hanbok Insadong Branch", "transport": "Subway Line 3 Anguk Station, Exit 6, approx. 5 mins walk inside Ssamziegil"}, {"address": "56 Bukchon-ro 5-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ubd81\ucd0c\ub85c5\uae38 56)", "feature": "\u2b50 4.6 stars | Must-Buy List: Pure linen maxi dresses, minimalist wool knits, and hand-tanned understated leather shoulder bags. Mo-No-Ha is a multi-concept design select store that combines apparel, lifestyle tools, and exhibition space. Its clothing style focuses on earth tones, natural materials, and clean silhouettes, exuding the elegant, serene vibe of Samcheong-dong\u2014highly favored by local Korean women seeking quality living and minimalist aesthetics.", "name": "Mo-No-Ha Samcheong Minimalist Select Shop", "transport": "Subway Line 3 Anguk Station, Exit 2, approx. 8 mins walk"}, {"address": "1F, Ssamziegil, 44 Insadong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d9\uae38 44 \uc308\uc9c0\uae38 1\uce35)", "feature": "\u2b50 4.3 stars | Must-Buy List: Hand-stitched cowhide coin purses, traditional Korean fabric patchwork crossbody bags, and customized engraved leather ID holders. Located inside the Insadong landmark Ssamziegil, this local workshop highlights handcrafted leather goods and cloth bags made by Korean artisans. Durable yet warm with handcrafted charm, the shop offers free on-site engraving services, making it a top choice for authentic, memorable local accessories.", "name": "Ssamziegil Crafts \u0026 Leather Workshop", "transport": "Subway Line 3 Anguk Station, Exit 6, approx. 5 mins walk"}, {"address": "8 Jongno 2-ga, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc885\ub85c2\uac00 8)", "feature": "\u2b50 4.1 stars | Must-Buy List: Regal series handmade leather loafers, Renoir ergonomic women\u0027s heels, and classic genuine leather casual dress shoes. Kumkang Shoes is Korea\u0027s oldest and most prestigious domestic footwear brand. The Jongno main branch showcases the most comprehensive collection of men\u0027s dress shoes and women\u0027s footwear. Tailored specifically to Asian foot shapes, combining comfort with formal aesthetic appeal, it is the premier heritage shop for local Korean office workers and stylish gentlemen and ladies.", "name": "Kumkang Shoes Jongno Main Branch", "transport": "Subway Line 1 Jonggak Station, Exit 11, approx. 1 min walk"}, {"address": "17 Bukchon-ro 5ga-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ubd81\ucd0c\ub85c5\uac00\uae38 17)", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic logo vintage dad hats, French typography graphic T-shirts, and spacious French canvas tote bags. Marith\u00e9 is a French high-street streetwear brand that has swept Korea in recent years. Its Samcheong-dong flagship store uniquely blends traditional Hanok architecture with modern style. Their classic logo caps and canvas bags are must-have staples seen on almost every young adult in Seoul, with the store frequently displaying exclusive colorways and refined accessories.", "name": "Marith\u00e9 Fran\u00e7ois Girbaud Samcheong Flagship Store", "transport": "Subway Line 3 Anguk Station, Exit 1, approx. 9 mins walk"}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "45 Insadong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d9\uae38 45)", "feature": "\u2b50 4.5 stars | Must-Buy List: Rich Green Tea Milk Spread, Jeju Orchid Tea Bag Gift Box, Matcha Wafers. One of South Korea\u0027s most iconic high-end tea brands, whose Insadong flagship store seamlessly blends traditional Hanok architecture with modern tea culture. The crowd-favorite Green Tea Milk Spread boasts a smooth, luscious texture that is sweet without being cloying\u2014perfect paired with toast or crackers. Their elegantly packaged hard-cover Four Seasons Tea Bag gift sets offer a noble yet affordable gift for friends or family.", "name": "O\u0027sulloc Tea House Insadong Flagship Store (\uc624\uc124\ub85d \ud2f0\ud558\uc6b0\uc2a4 \uc778\uc0ac\ub3d9\uc810)", "transport": "Approx. 5-min walk from Exit 6 of Anguk Station, Subway Line 3"}, {"address": "19 Bukchon-ro 11-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ubd81\ucd0c\ub85c11\uae38 19)", "feature": "\u2b50 4.8 stars | Must-Buy List: Classic Sachet, Multi Perfume, Hydrating Scented Hand Cream. One of Korea\u0027s trendiest indie fragrance brands in recent years, tucked away in the charming alleys of Bukchon Hanok Village. Known for its subtle, natural woody and fruity-floral scents. Purchasing a signature fabric sachet includes free on-site custom stamping (such as English names or dates), making it a personalized keepsake and an absolute must-buy souvenir when visiting Bukchon.", "name": "GRANHAND. Bukchon (\uadf8\ub791\ud578\ub4dc \ubd81\ucd0c)", "transport": "Approx. 12-min walk from Exit 2 of Anguk Station, Subway Line 3"}, {"address": "36 Insadong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d9\uae38 36)", "feature": "\u2b50 4.3 stars | Must-Buy List: Peanut \u0026 Nut Dragon Beard Candy, Black Sesame Dragon Beard Candy, Chocolate Dragon Beard Candy. A famous traditional royal dessert shop located on the main street of Insadong. Staff members put on entertaining performances while pulling honey maltose into 16,384 fine threads in multiple languages live, wrapping them around crunchy nuts. Melt-in-your-mouth with rich layers of texture, these easily portable gift boxes make a fun, uniquely traditional Korean snack.", "name": "Insadong Kkul-tarae Royal Dragon Beard Candy (\uc778\uc0ac\ub3d9 \uad81\uc911\ud0c0\ub798)", "transport": "Approx. 6-min walk from Exit 6 of Anguk Station, Subway Line 3"}, {"address": "17 Bukchon-ro 5-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ubd81\ucd0c\ub85c5\uae38 17)", "feature": "\u2b50 4.6 stars | Must-Buy List: Original Korean Illustration Postcards, Embroidered Patch Tote Bags, Unique Designer Stickers. A famous indie lifestyle \u0026 design shop in Samcheong-dong/Bukchon, showcasing creations from up-and-coming local Korean artists. Move past generic souvenirs\u2014this store is packed with cute, warm, aesthetic stationery, tote bags, and everyday goods, making it a treasure trove for creative souls and young travelers.", "name": "Object Samcheong Store (\uc624\ube0c\uc81d\ud2b8 \uc0bc\uccad\uc810)", "transport": "Approx. 10-min walk from Exit 1 of Anguk Station, Subway Line 3"}, {"address": "71 Donhwamun-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ub3c8\ud654\ubb38\ub85c 71)", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade Royal Yakgwa (Honey Cookies), Nine-Color Flower Rice Cake Gift Box, Omija Concentrated Tea Gift Box. A premium traditional confection and rice cake specialty shop directly operated by the Institute of Traditional Korean Food. The traditional Yakgwa features delicate notes of honey and ginger with a soft, non-sticky bite. The exquisite floral rice cakes and traditional tea gift sets are packaged like works of art, exuding traditional luxury and making them top-tier gifts for elders or esteemed guests.", "name": "Jilsiroo - Traditional Rice Cake Shop (\uc9c8\uc2dc\ub8e8)", "transport": "Approx. 5-min walk from Exit 7 of Jongno 3-ga Station, Subway Lines 1, 3, \u0026 5"}, {"address": "44 Insadong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d9\uae38 44)", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Hanji Color Notebooks, Mother-of-Pearl Lacquerware Small Jewelry Boxes, Traditional Hanbok Keychains. Located inside Insadong\u0027s iconic Ssamzigil complex, home to dozens of independent local artisan boutiques. Here, you\u0027ll find refined lifestyle items blending modern aesthetics with traditional Korean craftsmanship (like mother-of-pearl, Hanji paper, and traditional knotting)\u2014each item a unique handcrafted piece of art.", "name": "Ssamziegil Craft Souvenirs (\uc308\uc9c0\uae38 \uacf5\uc608\ud488)", "transport": "Approx. 7-min walk from Exit 6 of Anguk Station, Subway Line 3"}, {"address": "4 Yulgok-ro 3-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc728\uace1\ub85c3\uae38 4)", "feature": "\u2b50 4.7 stars | Must-Buy List: Traditional Mother-of-Pearl Pattern Coasters, Korean Patchwork (Bojagi) Sewing Kits, Modern Ceramic Tea Sets. Situated right by Anguk Station, this museum shop is widely acclaimed as one of the most sophisticated souvenir stores in town. It features everyday objects designed by outstanding Korean craft artists, reimagining classic historical Korean patterns into stylish modern home decor. Superior quality and tastefully unique\u2014a must-visit treasure trove for art and lifestyle lovers.", "name": "Seoul Museum of Craft Art Museum Shop", "transport": "Directly accessible from Exit 1 of Anguk Station, Subway Line 3"}, {"address": "1F Anyoung Insadong, 49 Insadong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d9\uae38 49 \uc548\ub155\uc778\uc0ac\ub3d9 1\uce35)", "feature": "\u2b50 4.6 stars | Must-Buy List: Boksundoga Handmade Sparkling Makgeolli, Red Rice Sparkling Makgeolli, Limited-Edition Traditional Brews. Korea\u0027s premier champagne-style Makgeolli brand, naturally fermented in traditional clay pots to produce rich, natural micro-bubbles and a delightfully fruity, bittersweet taste. Offering free tasting samples and professional shatter-proof travel packaging, it\u0027s the absolute best choice if you\u0027re looking to bring authentic Korean liquor back home.", "name": "Boksundoga Insadong (\ubcf5\uc21c\ub3c4\uac00 \uc778\uc0ac\ub3d9\uc810)", "transport": "Approx. 6-min walk from Exit 6 of Anguk Station, Subway Line 3"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "20 Jangchungdan-ro 13-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-Buy List: FILA classic retro sneakers, MLB Korean-style baseball caps, National Geographic goose down jackets. A massive urban discount shopping mall located extremely close to the Jongno shopping district. Spanning several floors, it brings together many popular local Korean fashion brands and major international sportswear brands. The store frequently offers fantastic discounts ranging from 30% to 70% off, making it perfect for travelers looking to quickly stock up on trendy Korean outfits. The underground food street also features famous local eateries like \u0027Hwangsaengga Kalguksu\u0027, allowing you to enjoy authentic local delicacies while shopping.", "name": "Hyundai City Outlets Dongdaemun (\ud604\ub300\uc2dc\ud2f0\uc544\uc6b8\ub81b \ub3d9\ub300\ubb38\uc810)", "transport": "Take Subway Line 1 or Line 4 to Dongdaemun Station, Exit 8, then walk for about 5 minutes."}, {"address": "81 Namdaemun-ro, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-Buy List: Sulwhasoo First Care Activating Serum, CheongKwanJang Korean Red Ginseng Extract Capsules, Tamburins premium scented hand creams. A flagship department store giant in Seoul located at the intersection of Jongno-gu and Myeongdong, offering the most comprehensive duty-free shop and top-tier counter services. It is the best choice for visitors who want to buy high-end Korean skincare brands and authentic Korean red ginseng gift sets all in one place. The food hall on the B1 floor is a haven for desserts and souvenirs, where you can purchase famous local specialties and exquisite pastries from all over Korea.", "name": "Lotte Department Store Main Store (\ub86f\ub370\ubc31\ud654\uc810 \ubcf8\uc810)", "transport": "Take Subway Line 2 to Euljiro 1-ga Station, Exit 7 or 8; directly connected via the underground passage."}, {"address": "44 Insadong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade Hanbok-style metal charms, traditional Hanji paper pattern handmade lanterns, customized Korean engraving leather keychains. This building with spiral ramps connecting every floor is the most iconic local cultural and creative complex in Insadong. It gathers dozens of personal studios of independent Korean designers and traditional artisans, offering unique items full of handmade warmth and Korean cultural elements, making them highly collectible and locally representative.", "name": "Ssamzigil (\uc308\uc9c0\uae38)", "transport": "Take Subway Line 3 to Anguk Station, Exit 6, then walk for about 5 minutes."}, {"address": "49 Insadong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-Buy List: Line Friends Korean traditional clothing limited edition plushies, Korean mother-of-pearl lacquerware exquisite jewelry boxes, design brand 1101 hand-drawn illustration sticker sets. A modern cultural and shopping complex that recently opened in the Insadong commercial district, combining traditional Hanok elements with a trendy department store concept. The mall houses numerous local young Korean designer brands, stationery shops, and art exhibition spaces, creating a shopping haven that blends modern quality with traditional Korean heritage\u2014a top choice for young people looking for unique finds.", "name": "Anyoung Insadong (\uc548\ub155\uc778\uc0ac\ub3d9)", "transport": "Take Subway Line 3 to Anguk Station, Exit 6, then walk for about 3 minutes."}, {"address": "104 Bukchon-ro 11-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-Buy List: Green Tea Seed Serum Bukchon Limited Edition, Super Volcanic Pore Clay Facial Foam, Bukchon Hanok limited edition scented sachets. Located in Bukchon Hanok Village, this flagship concept store seamlessly blends the natural aesthetic of Korea\u0027s signature beauty brand, Innisfree, with traditional Hanok architecture. In addition to selling the brand\u0027s best-selling skincare products, it offers exclusive Bukchon-limited packaging and Hanji fragrance products. When you get tired from exploring, you can relax in the 2nd-floor Hanok tatami seating area and enjoy specialty teas and desserts made with Jeju ingredients.", "name": "Innisfree Jeju House Bukchon Flagship Store (\uc774\ub2c8\uc2a4\ud504\ub9ac \uc81c\uc8fc\ud558\uc6b0\uc2a4 \ubd81\ucd0c\uc810)", "transport": "Take Subway Line 3 to Anguk Station, Exit 2, then walk for about 12 minutes."}, {"address": "405 Hangang-daero, Yongsan-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-Buy List: Discovery Expedition high-performance windbreaker jackets, Beanpole classic preppy Korean-style shirts, SYSTEM high-quality women\u0027s trench coats. An urban outlet located near the major transit hub of Seoul Station, just minutes away by subway from Jongno-gu. It focuses on high-quality Korean mid-to-high-end fashion and sports brands, offering year-round clearance discounts that are extremely appealing. It is a highly efficient shopping spot for travelers with tight schedules who also want to pick up Korean snacks and instant noodles along the way.", "name": "Lotte Outlets Seoul Station (\ub86f\ub370\uc544\uc6b8\ub81b \uc11c\uc6b8\uc5ed\uc810)", "transport": "Take Subway Line 1 or Line 4 to Seoul Station, Exit 1 for direct access."}, {"address": "51 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-Buy List: Korean typography design mugs, traditional Korean pattern ceramic coasters, stylish indie-designed notebooks. Jongno Tower is an ultra-modern landmark building in Jongno-gu. Its underground and lower floors feature a spacious design bookstore and a curated local creative lifestyle space. Bringing together everyday items, stylish stationery, and exquisite home decor from numerous local Korean designers, it showcases a rich Seoul urban artistic vibe\u2014making it a great place to experience modern Korean design and pick up unique, high-quality souvenirs.", "name": "Jongno Tower (\uc885\ub85c\ud0c0\uc6cc)", "transport": "Take Subway Line 1 to Jonggak Station, directly connected via the underground passage at Exit 3 or 3-1."}, {"address": "Inside Gyeongbokgung Station, 161 Sajik-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-Buy List: Joseon Dynasty royal crown metal bookmarks, Korean mother-of-pearl craft tassel coasters, traditional Dancheong painted silk square scarves. An official local craft store operated directly by the Korea Cultural Heritage Foundation, located at the edge of the historic Gyeongbokgung Palace in Jongno-gu. The store exclusively sells officially certified, high-quality traditional Korean cultural and creative goods, transforming inspirations from national treasure-level relics into practical and exquisite everyday items. With superior quality and guaranteed authenticity, it is a must-visit destination for travelers who love Korean history, culture, and premium design goods.", "name": "K-Heritage Store Gyeongbokgung (K-\ud5e4\ub9ac\ud2f0\uc9c0)", "transport": "Take Subway Line 3 to Gyeongbokgung Station, located inside the underground shopping area towards Exit 5."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Jongno, Bukchon and Insadong"}, "myeongdong_euljiro": {"categories": {"cat_1": {"items": [{"address": "53 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.6 stars | Must-Buys: Rejuran Turnover Ampoule, Torriden Dive-In Low Molecule Hyaluronic Acid Serum, UNOVE Deep Damage Treatment EX. As one of the largest flagship stores of Korea\u0027s premier health \u0026 beauty chain, this multi-story, ultra-spacious store features the trendiest K-Beauty skincare and makeup brands. Offering extensive tester stations and instant tax refund services, it is the ultimate shopping paradise for K-Beauty enthusiasts.", "name": "Olive Young Myeongdong Town Flagship Store", "transport": "Take Subway Line 4 to Myeongdong Station, Exit 6, and walk for about 5 minutes."}, {"address": "37-8 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-Buys: 3CE Multi Eye Color Palette (Overtake), 3CE Velvet Lip Tint, 3CE Face Blush. A dreamlike 6-story flagship store themed around a vintage pink hotel, combining 3CE cosmetics with trendy fashion. Beyond browsing top-selling makeup items, visitors can enjoy an Instagram-mable cafe and an outdoor rooftop lounge, making it the ultimate destination for both shopping and photos.", "name": "Stylenanda Pink Hotel \u0026 3CE Flagship Store", "transport": "Take Subway Line 4 to Myeongdong Station, Exit 6, and walk for about 3 minutes."}, {"address": "50 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-Buys: Lip Sleeping Mask, Water Bank Blue Hyaluronic Serum, Neo Cushion. The flagship store of Laneige, Amorepacific\u0027s iconic skincare brand, features sleek, modern decor centered on hydration and glow. It frequently offers exclusive limited-edition packaging and custom lipstick-making experiences, allowing guests to fully immerse themselves in premier Korean hydration technology.", "name": "Laneige Myeongdong Flagship Store", "transport": "Take Subway Line 4 to Myeongdong Station, Exit 6, and walk for about 4 minutes."}, {"address": "13 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-Buys: Green Tea Seed Serum, Super Volcanic Pore Clay Mask, Green Tea Hydrating Amino Acid Foam Cleanser. A popular eco-friendly brand highlighting Jeju Island botanicals, with a flagship store exuding a relaxing, lush vibe. Offering a complete product line alongside its best-selling green tea and volcanic clay series, it also houses a cozy green-tea-themed caf\u00e9 where shoppers can unwind.", "name": "Innisfree Myeongdong Flagship Store", "transport": "Take Subway Line 2 to Euljiro 1-ga Station, Exit 6, and walk for about 5 minutes."}, {"address": "31 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-Buys: Clean it Zero Cleansing Balm, Prime Primer Finish Powder, Setting Spray. Famous worldwide for its game-changing \u0027Clean it Zero\u0027 cleansing balm, this Korean beauty brand boasts a youthful, vibrant flagship store in Myeongdong. It offers a full range of products tailored for perfect K-beauty base makeup and deep cleansing, making it a must-visit landmark for beauty lovers.", "name": "Banila Co. Myeongdong Flagship Store", "transport": "Take Subway Line 4 to Myeongdong Station, Exit 6, and walk for about 3 minutes."}, {"address": "1F Lotte Dept Store, 81 Namdaemun-ro, Jung-gu, Seoul", "feature": "\u2b50 4.7 stars | Must-Buys: First Care Activating Serum VI, Concentrated Ginseng Renewing Cream, Gentle Cleansing Oil. A premier counter for Sulwhasoo, Korea\u0027s top luxury Hanbang (traditional herbal) beauty brand, located inside the Lotte Department Store Main Branch. It offers personalized skin consultations, elegant gift packaging, and highly concentrated ginseng skincare lines beloved by shoppers seeking premium anti-aging care.", "name": "Sulwhasoo Counter (Lotte Department Store Main Branch)", "transport": "Take Subway Line 2 to Euljiro 1-ga Station; Exit 7 directly connects to Lotte Department Store underground."}, {"address": "52 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-Buys: Soothing \u0026 Moisture Aloe Vera 92% Soothing Gel, Ginseng Royal Silk Watery Cream, Cica Repair Sheet Mask. An iconic landmark located at Myeongdong\u0027s busiest intersection, instantly recognizable by its lush green vertical plant facade. Focusing on affordable, natural botanical skincare, its bulk aloe vera gel and royal ginseng line remain perennial best-sellers among tourists.", "name": "Nature Republic Myeongdong World Store", "transport": "Take Subway Line 4 to Myeongdong Station; located right outside Exit 6."}, {"address": "24 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-Buys: Pig Nose Clear Blackhead 3-Step Kit, My Fave 9-Color Eyeshadow Palette, My Fave Piece Eyeshadow. A local makeup brand renowned for its playful, charming packaging and vibrant color payoff. The flagship store stocks an extensive range of eye shadow shades and budget-friendly skincare treats, making it immensely popular with students and trendy makeup lovers.", "name": "Holika Holika Myeongdong Flagship Store", "transport": "Take Subway Line 4 to Myeongdong Station, Exit 6, and walk for about 4 minutes."}], "name": "Iconic Local Cosmetics \u0026 K-Beauty Stores"}, "cat_2": {"items": [{"address": "40 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Must-buy list: Korean designer brand graphic T-shirts, minimalist high-quality canvas bags, K-style trendy dad shoes. ALAND is South Korea\u0027s most iconic multi-brand lifestyle shop, bringing together dozens of emerging local Korean designer brands. The multi-story main store in Myeongdong offers everything from street style and minimalist hipster aesthetics to sweet K-style fashion, making it a shopping paradise for local Korean youth and overseas tourists looking to discover the latest fashion trends and independent designer clothing.", "name": "ALAND Myeongdong Main Store", "transport": "About a 3-minute walk from Exit 6 of Myeongdong Station, Subway Line 4"}, {"address": "37-8 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Must-buy list: STYLENANDA drop-shoulder sweatshirts, high-waisted tailored jeans, 3CE velvet matte lip tints. Designed around the concept of a \u0027Pink Hotel,\u0027 this flagship store presents a dreamy retro hotel vibe throughout the entire building. Each floor, from the basement to the rooftop caf\u00e9, features a different theme, offering original trendy apparel from the famous Korean fashion brand STYLENANDA as well as its popular cosmetic line 3CE. Its unique cuts and vibrant colors are deeply loved by Korean fashion enthusiasts.", "name": "Stylenanda Pink Hotel Myeongdong Flagship Store", "transport": "About a 3-minute walk from Exit 6 of Myeongdong Station, Subway Line 4"}, {"address": "38-1 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | Must-buy list: Morandi-color loafers, minimalist square-toe low-heel ankle boots, elegant French-style ballet flats. Starting as an online store, SAPPUN is a highly renowned local Korean women\u0027s footwear brand famous for high value-for-money and comfortable designs. The Myeongdong flagship store features an aesthetically pleasing space offering a wide variety of styles\u2014from daily flats and elegant heels to autumn/winter boots. With an extensive color selection and thick, comfortable insoles, it is a shoe lover\u0027s paradise in Myeongdong.", "name": "SAPPUN Myeongdong Flagship Store", "transport": "About a 4-minute walk from Exit 6 of Myeongdong Station, Subway Line 4"}, {"address": "24 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | Must-buy list: Waterproof ultra-lightweight canvas shoes, puffy cloud shoulder bags, versatile K-style bucket hats. SHOOPEN is an affordable national footwear and accessory brand under Korea\u0027s E-Land Group, famous for high practical utility and budget-friendly prices. The spacious store carries men\u0027s, women\u0027s, and children\u0027s shoes, along with trendy backpacks, hats, and accessories. With fast inventory turnover, whether you are looking for versatile canvas shoes or the trendy
