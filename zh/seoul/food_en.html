 uses a clear, mellow beef broth. Biting into a juicy dumpling paired with homemade kimchi makes for a timeless meal, drawing countless diners craving traditional North Korean-style flavors.", "name": "Gaeseong Mandu Koohyang", "transport": "Subway Line 3 Anguk Station, Exit 6, approx. 6 mins walk"}, {"address": "101-1 Samcheong-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc0bc\uccad\ub85c 101-1)", "feature": "\u2b50 4.4 Stars | The quintessential traditional Korean hand-pulled dough soup (sujeobi) spot in Samcheong-dong, recognized by the Michelin Bib Gourmand for multiple years. The sweet and savory broth is simmered from anchovies and fresh vegetables, while the hand-pulled dough flakes are thin, chewy, and coated in rich broth. Loaded with squash, potatoes, and clams, it offers comforting, rich layers of flavor reminiscent of home cooking. Served in traditional Korean earthenware pots that retain heat remarkably well, and paired with complimentary crisp kimchi and radish, this is a can\u0027t-miss humble delicacy when visiting Bukchon Hanok Village and Samcheong-dong.", "name": "Samcheongdong Sujeobi", "transport": "Subway Line 3 Anguk Station, Exit 1, transfer to Green Village Bus Jongno 11 and get off at Samcheong-dong Community Center Station"}, {"address": "78 Bukchon-ro 5-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ubd81\ucd0c\ub85c5\uae38 78)", "feature": "\u2b50 4.3 Stars | Located at the entrance of Bukchon, this highly popular ox-bone noodle soup specialty shop has consistently earned Michelin recommendations. Its hallmark feature is the rich, velvety ox-bone broth base, long-simmered to unleash natural sweetness and a subtle milky aroma. Fresh hand-cut knife noodles are smooth yet delightfully chewy, holding onto the rich broth perfectly. Alongside kalguksu, their golden, crispy fried giant dumplings (wang-mandu) packed with savory filling are a must-order on every table, making for an extraordinarily satisfying feast.", "name": "Hwangsaengga Kalguksu", "transport": "Subway Line 3 Anguk Station, Exit 1, approx. 10 mins walk"}, {"address": "5 Donhwamun-ro 11da-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ub3c8\ud654\ubb38\ub85c11\ub2e4\uae38 5)", "feature": "\u2b50 4.3 Stars | Operating since 1965 in Jongno 3-ga, this legendary seafood kalguksu joint radiates retro nostalgia. The portions are remarkably generous, with huge bowls topped with heaps of fresh clams and mussels. The broth fully absorbs the natural sweetness of the seafood, delivering a refreshing, flavorful punch in every sip. The hand-cut noodles are firm and chewy with great texture. Unlimited self-serve fresh kimchi and radish kimchi are provided for free, offering a spicy-tangy kick that beautifully complements the sweet seafood broth. It comes highly recommended by Jongno locals and food connoisseurs for its incredible value.", "name": "Chanyang-jib", "transport": "Subway Lines 1, 3, 5 Jongno 3-ga Station, Exit 6, approx. 2 mins walk"}, {"address": "41 Dadong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ub2e4\ub3d9\uae38 41)", "feature": "\u2b50 4.1 Stars | Founded in 1932, this historic Seoul-style loach soup (chueotang) institution boasts over 90 years of proprietary culinary craft. Unlike the traditional Southern method of grinding the loach, Yonggeumok offers both whole loach and ground loach options, simmered in a beef bone broth infused with soybean paste, chili paste, and abundant vegetables. The vibrant red broth is rich, spicy, and savory-sweet, featuring delicate loach meat without any fishy odor. Warming, stamina-boosting, and deeply satisfying, it stands as a classic benchmark for discovering Seoul\u0027s historic food heritage.", "name": "Yonggeumok", "transport": "Subway Line 1 Jonggak Station, Exit 5, approx. 5 mins walk"}, {"address": "30-13 Insadong, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d930-13)", "feature": "\u2b50 4.2 Stars | Founded by a former Buddhist monk, this iconic temple cuisine restaurant in Insadong is housed inside a charming traditional Hanok. Utilizing wild mountain herbs, mushrooms, and all-natural ingredients sourced from deep mountains, the kitchen avoids pungent roots and artificial seasonings to craft dozens of delicate Korean temple set-menu side dishes. The flavors are pure, natural, and wonderfully layered, capturing the sweet freshness of wild herbs. During dinner service, guests can enjoy live traditional Korean music and dance performances, offering a top-tier cultural dining experience for both the eyes and taste buds.", "name": "Sanchon", "transport": "Subway Line 3 Anguk Station, Exit 6, approx. 5 mins walk"}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "5 Gyeedong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 Stars | Housed in a traditional Hanok building that combines classic wooden architecture with modern industrial design. The famous Pandoro bread is dusted with fine powdered sugar, boasting a soft-crispy exterior and a dense, fluffy interior that is sweetly satisfying without being cloying. Paired with freshly brewed single-origin drip coffee, rich bittersweet flavors dance on your palate. A favorite among tourists and local youth alike, it is the premier spot to experience Hanok charm and stylish afternoon tea.", "name": "Cafe Onion Bukchon", "transport": "Subway Line 3, Anguk Station Exit 3, approx. 1-min walk"}, {"address": "45 Yulgok-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.6 Stars | Created by the team behind the famous London Bagel Museum, this salt bread specialty shop has taken the Anguk shopping district by storm. The signature soft salt bread features a slightly crisp crust and an amazingly light, bouncy interior, infused with rich butter aroma and a touch of savory rock salt. Paired with custom truffle butter spread and hot creamy soup, every bite is pure bliss. Its European retro-artistic decor also makes it a prime spot for photos.", "name": "Artist Bakery Anguk", "transport": "Subway Line 3, Anguk Station Exit 1, right at the exit"}, {"address": "20 Bukchon-ro 4-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.7 Stars | Seoul\u0027s iconic, phenomenal brunch cafe that sparked a bagel sensation with its British vintage aesthetics. The signature Spring Onion Garlic Cream Cheese Bagel offers a delightful chew, stuffed generously with rich cream cheese and fresh, sweet chives for a bold, layered flavor. The hot Potato Cheese Bagel is wonderfully soft and dense; paired with a bowl of steaming tomato soup, it offers a warm, classic British brunch experience.", "name": "London Bagel Museum Anguk", "transport": "Subway Line 3, Anguk Station Exit 2, approx. 5-min walk"}, {"address": "22-1 Bukchon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.3 Stars | A cozy Hanok cafe overflowing with British countryside charm, featuring tables laden with freshly baked scones and exquisite cakes. The signature Cranberry Butter Scone is golden and crispy on the outside, moist and soft inside with a rich buttery aroma, pairing delightfully with sweet-and-sour homemade strawberry jam. The adorable whipped cream dog-shaped cake is delicate and melts in your mouth. Its relaxed, elegant vibe makes it a fantastic spot for afternoon tea after strolling around Bukchon.", "name": "Cafe Layered Anguk", "transport": "Subway Line 3, Anguk Station Exit 2, approx. 3-min walk"}, {"address": "83 Yulgok-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 Stars | Nestled in a Hanok garden next to the Arario Museum, seamlessly blending vintage Korean poster aesthetics with professional specialty coffee. Their house-roasted espresso boasts rich nutty and chocolatey aromas with a smooth, full-bodied taste. Accompanied by freshly baked daily croissants and French pastries featuring crisp, flaky layers, sipping coffee beneath the open-air Hanok corridor lets you soak in a unique, tranquil atmosphere bridging past and present.", "name": "Fritz Coffee Company Wonseo", "transport": "Subway Line 3, Anguk Station Exit 3, approx. 5-min walk"}, {"address": "64 Bukchon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.4 Stars | Renowned for exquisite pourover coffee and matcha drinks, featuring a rooftop terrace offering sweeping views of Bukchon Hanok Village\u0027s tiled roofs. The signature Matcha Latte uses premium matcha powder, delivering a rich, perfectly balanced bittersweet flavor with velvety milk foam. Pair it with freshly baked cheese waffles\u2014crispy outside, soft inside, and bursting with aroma. Enjoying brunch on the rooftop while taking in the Hanok views is the ultimate way to embrace Bukchon\u0027s slow pace.", "name": "Green Mile Coffee Bukchon", "transport": "Subway Line 3, Anguk Station Exit 2, approx. 10-min walk"}, {"address": "45 Bukchon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 Stars | A premium tea cafe reinterpreting Jeju Island\u0027s traditional Korean tea culture through contemporary aesthetics. The flagship building combines modern steel structure with Hanok wooden accents. The signature Green Tea Mille Crepe Cake features an remarkably delicate texture, with rich bittersweet matcha filling melting in your mouth. Pair it with freshly brewed premium brown rice green tea or Matcha Einsp\u00e4nner for a lingering tea finish. The 3rd floor houses a bar serving non-alcoholic tea-based cocktails for an elevated tea-tasting experience.", "name": "O\u0027sulloc Tea House Bukchon", "transport": "Subway Line 3, Anguk Station Exit 2, approx. 8-min walk"}, {"address": "19-8 Gyeedong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.5 Stars | A wildly popular, cozy brunch cafe designed with an acorn and Ghibli fairy-tale aesthetic. The signature Greek Yogurt Bowl is served with fresh honeycomb, nuts, and seasonal fruits; the yogurt is ultra-thick and tangy-sweet, while the golden honeycomb melts effortlessly. The acorn-shaped black sugar cane madeleine is crispy on the outside, moist inside, and infused with subtle butter fragrance. Surrounded by warm wooden tones and adorable cat illustrations, stepping inside feels as relaxing as entering a storybook forest.", "name": "Dotori Garden Anguk", "transport": "Subway Line 3, Anguk Station Exit 3, approx. 3-min walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "30-1 Insadong 10-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | A renowned three-generation restaurant specializing in traditional Gaeseong handmade dumplings, recommended by the Michelin Bib Gourmand for years. The thin, chewy dumpling skins are filled with a rich combination of fresh cabbage and tender pork. The mild beef bone broth is warm, naturally sweet, and non-greasy. Their pan-fried dumplings boast a golden, crispy skin that bursts with savory juices upon biting\u2014a favorite among local foodies and tourists seeking traditional flavors.", "name": "Gaeseong Mandu Koong", "transport": "About a 5-minute walk from Exit 6 of Anguk Station (Subway Line 3)"}, {"address": "5 Jahamun-ro 5-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.2 stars | Housed in a traditional Hanok, this is Jongno-gu\u0027s most iconic restaurant for royal ginseng chicken soup. Premium young chickens (aged around 45 days) are stuffed with glutinous rice, Korean ginseng, chestnuts, jujubes, and sunflower seeds, then slow-cooked to perfection. The rich, milky-white broth is deeply flavorful, with meat so tender it effortlessly falls off the bone. The soft, smooth rice fully absorbs the essence of ginseng and sweet chicken broth, leaving a memorable taste.", "name": "Tosokchon Samgyetang", "transport": "About a 3-minute walk from Exit 2 of Gyeongbokgung Station (Subway Line 3)"}, {"address": "9 Insadong 12-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.1 stars | Tucked away in a quiet Hanok alley in Insadong, this upscale Han-jeongsik (Korean course meal) bistro seamlessly blends traditional Korean royal court cuisine with regional liquor culture. Signature dishes include soy-marinated crab and secret-recipe braised beef short ribs\u2014tender, melt-in-your-mouth beef with a perfect savory-sweet balance. Paired with fine traditional Korean Makgeolli or Cheongju, the rich aromas enhance the natural sweetness of the meat for a sophisticated dining experience.", "name": "Insadong Dure", "transport": "About a 6-minute walk from Exit 6 of Anguk Station (Subway Line 3)"}, {"address": "78 Bukchon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.2 stars | A highly recommended local noodle shop located at the entrance of Bukchon Hanok Village. The milky broth for its kalguksu (chopped noodles) is simmered from beef bones for hours, pairing wonderfully with fresh, springy, hand-made noodles prepared daily. Accompany your noodles with freshly steamed pork and chive dumplings, featuring soft skins and juicy fillings, along with a bite of spicy, refreshing homemade kimchi for a thoroughly satisfying meal.", "name": "Hwangsaengga Kalguksu", "transport": "About a 10-minute walk from Exit 1 of Anguk Station (Subway Line 3)"}, {"address": "24 Jong-ro 19-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.0 stars | Founded in 1937, this legendary Jongno hangover soup spot carries over 80 years of local culinary tradition. The signature beef bone and ox blood hangover soup is loaded with sweet Napa cabbage, bean sprouts, honeycomb tripe, and fresh ox blood curd. The broth is rich and spicy yet smooth on the palate. The offal is meticulously cleaned with a pleasing chew, while the blood curd is as smooth as soft tofu\u2014an unmissable spot for experiencing Seoul\u0027s traditional nightlife food culture.", "name": "Jongno Cheongjinok", "transport": "About a 3-minute walk from Exit 1 of Jonggak Station (Subway Line 1)"}, {"address": "14-2 Insadong 8-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.1 stars | Tucked away in a charming Insadong alley, this traditional eatery is famous for hand-pulled dough soup (sujebi) served in earthenware jars. The broth is simmered with anchovies and kelp for a savory depth, while the hand-pulled noodles are thin, smooth, and delightfully chewy. Pair it with freshly made oyster and seafood pancakes featuring crispy golden edges and plump, juicy oysters, along with a jar of sweet-and-sour traditional Makgeolli for a nostalgic rustic vibe.", "name": "Insadong Sujebi", "transport": "About a 6-minute walk from Exit 6 of Anguk Station (Subway Line 3)"}, {"address": "39 Donhwamun-ro 11na-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.6 stars | Situated at the border of Jongno 3-ga and Ikseon-dong, this Western-style craft beer bistro subtly incorporates Korean elements. It features local Korean craft beers and made-to-order artisanal pizzas with crispy, wood-fired crusts, gooey cheese, and perfectly balanced toppings. Pair your slice with local tap beers infused with yuzu or floral notes in a vibrant, relaxed setting\u2014a hot spot for international travelers and local youth alike.", "name": "BREW 3.14 (Craft Beer \u0026 Bistro)", "transport": "About a 4-minute walk from Exit 6 of Jongno 3-ga Station (Subway Lines 1, 3, and 5)"}, {"address": "39 Donhwamun-ro 4-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | A legendary local eatery hidden in the alleys of Jongno since 1965, famous for its iconic garlic-loaded spicy braised chicken stew. Served topped with a generous scoop of freshly crushed garlic that melts into the fiery red broth as it boils, the tender chicken absorbs the pungent garlic kick and chili spices. Soft rice cakes soak up the rich flavors, and adding kalguksu noodles at the end to absorb the savory broth creates an unforgettable, spicy, and soul-satisfying meal.", "name": "Jongno Gyerim Dakbokkeumtang", "transport": "About a 3-minute walk from Exit 12 of Jongno 3-ga Station (Subway Line 1)"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "5F, Temple Food Center, 71 Gyeonji-dong, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uacac\uc9c0\ub3d9 71 5\uce35)", "feature": "\u2b50 4.6 stars | Michelin-recommended fine temple cuisine directly operated by the Jogye Order of Korean Buddhism. Meals strictly follow tradition, completely omitting the five pungent roots (alliums: green onion, garlic, chives, leeks, wild rocambole) and any artificial additives, relying purely on natural fermented sauces and seasonal wild greens. The signature Lotus Flower Rice served with various seasonal side dishes offers an exceptionally rich hierarchy of textures\u2014from refreshing and sweet-sour pickled plums to smooth, rich sesame porridge. Every bite lets you savor the purest natural flavors and gentle, velvety textures of the food, making it highly favored by international tourists seeking physical and spiritual purification.", "name": "Balwoo Gongyang (\ubc1c\uc6b0\uacf5\uc591)", "transport": "Approx. 5-minute walk from Exit 1 of Anguk Station (Subway Line 3), or approx. 6-minute walk from Exit 2 of Jonggak Station (Subway Line 1)"}, {"address": "14-5 Insadong 12-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d912\uae38 14-5)", "feature": "\u2b50 4.4 stars | A hugely popular vegan Korean restaurant tucked in the classic alleys of Insadong, perfectly transforming traditional Korean delicacies into plant-based delights. Must-try popular items include vegan Jajangmyeon (black bean noodles) and vegan Donkatsu (pork cutlet). The springy noodles absorb the rich, non-greasy black bean sauce, while the plant-based cutlet is fried to a golden crunch. Biting into it yields a satisfying crunch with a savory, juicy texture nearly indistinguishable from real meat when paired with their special sweet and sour sauce. Featuring traditional Korean tatami/floor seating in a quaint, historic ambiance, it attracts countless vegetarian food lovers on pilgrimage.", "name": "Osegye Hyang (\uc624\uc138\uacc4\ud5a5)", "transport": "Approx. 5-minute walk from Exit 6 of Anguk Station (Subway Line 3)"}, {"address": "30-1 Insadong, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d9 30-1)", "feature": "\u2b50 4.3 stars | A traditional mountain vegetable temple cuisine restaurant founded by a retired Buddhist monk, set inside a charming Hanok building. The meals revolve around over a dozen types of wild mountain greens and herbs gathered deep in the Korean mountains, accompanied by home-brewed natural pine needle tea and soybean paste. The exquisite full course meal includes fluffy wild mushroom rice, mung bean pancakes crisp on the outside and tender inside, and sweet-aftertaste Siberian ginseng wild greens. Every bite fills your mouth with a fresh, herbal aroma. In the evening, you can also enjoy traditional Korean dance and music performances, making it an immersive cultural feast pleasing to both eye and palate.", "name": "Sanchon (\uc0b0\ucd0c)", "transport": "Approx. 6-minute walk from Exit 6 of Anguk Station (Subway Line 3)"}, {"address": "19 Jahamun-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc790\ud558\ubb38\ub85c 19)", "feature": "\u2b50 4.5 stars | A cozy vegetarian Hanok restaurant near Seochon and Gyeongbokgung Palace, specializing in low-salt, low-oil, and allium-free healthy temple dining. Its signature dish, \u0027Lotus Leaf Rice Set\u0027, steams black rice, red beans, ginkgo nuts, and chestnuts wrapped in a fresh lotus leaf. Unwrapping it releases an inviting wave of lotus and rice aromas, yielding a soft, chewy texture with natural sweetness. Complemented by special burdock root pancakes and refreshing sesame-tossed wild greens, the dish offers clear layers of flavor and a light, guilt-free experience, making it the top choice for experiencing traditional Korean wellness dining.", "name": "Maji (\ub9c8\uc9c0)", "transport": "Approx. 3-minute walk from Exit 2 of Gyeongbokgung Station (Subway Line 3)"}, {"address": "1F, 39 Yulgok-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc728\uace1\ub85c 39 1\uce35)", "feature": "\u2b50 4.5 stars | An official temple food culture promotion venue located near Anguk Station, offering vegan traditional teas, healthy pastries, and temple cooking experiences. The natural lotus tea and Omija (five-flavor berry) tea here taste sweet, cool, and refreshing, paired perfectly with handmade red bean rice cakes that are dense, soft, and delicately sweet without being cloying. Free tastings of simple, cool vegetarian snacks and brief hands-on workshops are frequently offered on-site, allowing visitors to experience the Zen philosophy and serene ambiance of traditional Korean plant-based dining in a clean, bright, modern space.", "name": "Korean Temple Food Center (\ud55c\uad6d\uc0ac\ucc30\uc74c\uc2dd\ubb38\ud654\uccb4\ud5d8\uad00)", "transport": "Located right outside Exit 1 of Anguk Station (Subway Line 3)"}, {"address": "30-11 Insadong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d9\uae38 30-11)", "feature": "\u2b50 4.2 stars | A long-standing local favorite specializing in fresh daily handmade tofu, highly popular among vegetarian foodies who love light, healthy food. The signature vegan soft tofu stew boasts a delicious, naturally sweet broth with silky-smooth tofu that melts in your mouth with a rich, pure soybean flavor. The accompanying fresh mountain vegetable bibimbap earns endless praise as well; crisp, juicy wild greens tossed in special sesame oil and soybean paste deliver an authentic, hearty Korean home-cooked vegetarian flavor.", "name": "Insadong Dubu Village (\uc778\uc0ac\ub3d9 \ub450\ubd80\ub9c8\uc744)", "transport": "Approx. 5-minute walk from Exit 6 of Anguk Station (Subway Line 3)"}, {"address": "4-1 Sungkyunkwan-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc131\uade0\uad00\ub85c 4-1)", "feature": "\u2b50 4.6 stars | A cozy vegan cafe and eatery in the Daehak-ro area of Jongno, committed to using organic and locally grown pesticide-free ingredients. The house specialty \u0027Brown Rice Wild Mushroom Curry\u0027 is rich and smooth, blending deep aromatic spices with crisp wild mushrooms for a satisfyingly chewy texture. Additionally, their vegan oat milk latte and freshly baked milk-and-egg-free cookies form a favorite afternoon tea combo for travelers\u2014crispy outside, soft inside, and packed with natural grain aroma for a completely guilt-free gourmet treat.", "name": "Cafe Sun (\uce74\ud398 \uc120)", "transport": "Approx. 7-minute walk from Exit 4 of Hyehwa Station (Subway Line 4)"}, {"address": "10 Insadong 12-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d912\uae38 10)", "feature": "\u2b50 4.3 stars | A vegetarian teahouse hidden in a traditional Hanok alley of Insadong, famous for its natural herbal teas and vegan traditional treats. The house signature \u0027Jujube Tea\u0027 is slow-simmered for hours, resulting in a thick, velvety texture rich in natural sweet flavor. Paired with freshly toasted vegan pine nut cakes and pumpkin cakes\u2014boasting a lightly crisp exterior and soft, sweet filling bursting with rice and nutty aromas\u2014it\u0027s the ultimate vegan spot to rest and unwind after exploring the Insadong district.", "name": "Hyanginaeneun Namu (\ud5a5\uc774\ub098\ub294\ub098\ubb34)", "transport": "Approx. 4-minute walk from Exit 6 of Anguk Station (Subway Line 3)"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "128-1 Bukchon-ro 5-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | A viral street dessert tucked away in a Bukchon alleyway. These hotteok (sweet Korean pancakes) are fried fresh to order, featuring an ultra-crispy exterior that reveals boiling hot, rich brown sugar syrup and fragrant nuts with every bite. Crispy on the outside, soft and chewy on the inside, and never greasy. Beyond the classic sweet brown sugar flavor, their savory-sweet vegetable and meat gravy hotteok is another must-try signature. Crispy on the outside with a moist, full filling, it\u0027s a huge favorite among international tourists and local students alike.", "name": "Samcheongdong Hotteok", "transport": "Metro Line 3, Anguk Station, Exit 1, approx. 10 mins walk"}, {"address": "32 Hwayeodong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | A hugely popular snack bar transformed from a traditional rice store. Their iconic Tteokkochi (fried rice cake skewers) features pure rice cakes fried until light and crispy on the outside and wonderfully chewy and dense on the inside. Slathered in a special sweet and mildly spicy sauce, every bite offers a satisfying chew with a subtle aroma of rice. Super reasonably priced, grabbing a skewer alongside a piping-hot cup of fish cake broth while strolling past is the ultimate way to soak up Bukchon\u0027s nostalgic street vibes.", "name": "Pungnyeon Ssal Nongsan", "transport": "Metro Line 3, Anguk Station, Exit 1, approx. 8 mins walk"}, {"address": "5 Jong-ro 32-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.2 stars | The landmark street food stall of Gwangjang Market. Freshly ground mung bean batter is mixed with bean sprouts and pork, then pan-fried in plenty of oil on a griddle until golden and super crispy. The texture is delightfully layered\u2014crunchy like fried chicken on the outside, while retaining a soft mung bean texture and refreshingly crisp bean sprouts inside. Dipping it into onion-vinegar soy sauce cuts through the richness perfectly, and pairing it with Makgeolli (rice wine) is the ultimate classic Korean market food experience.", "name": "Sunhee\u0027s Bindaetteok", "transport": "Metro Line 1, Jongno 5-ga Station, Exit 8, approx. 2 mins walk"}, {"address": "18 Jahamun-ro 15-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.1 stars | A decades-old staple inside Tongin Market. Unlike typical soup-based tteokbokki, this shop pan-fries rice cakes on a flat griddle with chili oil or soy sauce. The rice cakes are seared until slightly charred with a light crispy crust, delivering a chewy texture infused with a distinct smokiness and fragrant spicy oil. Dry, chewy, and loaded with nostalgic flavor, this unique taste has attracted countless TV shows and foodies on a pilgrimage.", "name": "Tongin Market Wonjo Halmoni Tteokbokki", "transport": "Metro Line 3, Gyeongbokgung Station, Exit 2, approx. 10 mins walk"}, {"address": "42-2 Insadong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.2 stars | A famous old-school dumpling joint hidden in the alleys of Insadong, where you can watch artisans hand-making dumplings on the spot. The must-order Twi-gim Mandu (fried dumplings) are deep-fried to a golden perfection that cracks loudly with every bite, packed with a hearty, juicy filling of minced pork, glass noodles, and vegetables. Paired with refreshingly sweet and sour cold noodles, the contrast between hot and cold creates a delightfully layered culinary experience.", "name": "Bukchon Son Mandu Insadong Main Branch", "transport": "Metro Line 3, Anguk Station, Exit 6, approx. 5 mins walk"}, {"address": "32 Insadong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.0 stars | A highly entertaining Korean royal court dessert stall on the main street of Insadong. Performers enthusiastically explain the process in multiple languages while skillfully pulling a block of hard maltose into over 16,000 fine, silk-like threads. The outer candy strands melt effortlessly on your tongue, revealing a sweet, crunchy filling of peanuts, walnuts, and sesame seeds inside. A stunning visual and taste sensation, making it a classic street treat for strolls.", "name": "Insadong Kkultarae (Dragon\u0027s Beard Candy)", "transport": "Metro Line 3, Anguk Station, Exit 6, approx. 4 mins walk"}, {"address": "88 Changgyeonggung-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | A wildly popular snack spot near South Gate 1 of Gwangjang Market that always draws long queues. Made by adding glutinous rice flour to the batter, these freshly baked fish-shaped pastries have a golden, crispy exterior with a mochi-like, delightfully chewy texture inside. Generously filled to the brim with rich, sweet red bean paste that bursts out at first bite, they also offer crowd-favorite custard cream and sweet potato fillings\u2014a warm slice of happiness you shouldn\u0027t miss during a winter market stroll.", "name": "Gwangjang Market Chapssal Bungeoppang", "transport": "Metro Line 1, Jongno 5-ga Station, Exit 7, approx. 1 min walk"}, {"address": "88 Changgyeonggung-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.0 stars | One of Gwangjang Market\u0027s legendary snacks, nicknamed \u0027Drug Kimbap\u0027 because its addictive flavor keeps you coming back for more. These bite-sized mini gimbap rolls are filled with pickled radish, carrots, and seasoned rice, brushed with aromatic sesame oil, and sprinkled with sesame seeds. Though simple, the crunchy seaweed and tender rice roll, dipped into their signature hot mustard sauce, hits the palate with a tangy, spicy punch\u2014straightforward yet irresistibly delicious.", "name": "Monyeo Mayak Kimbap", "transport": "Metro Line 1, Jongno 5-ga Station, Exit 8, approx. 3 mins walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Jongno, Bukchon, and Insadong"}, "myeongdong_euljiro": {"categories": {"cat_1": {"items": [{"address": "29 Myeongdong 10-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | A decades-old legendary eatery honored with a Michelin Bib Gourmand. Their signature Kalguksu (chopped noodles) features silky, smooth noodles served in a rich, flavorful broth infused with a unique smoky and savory meat aroma. Paired with plump, thin-skinned dumplings (Mandu) and garlic-infused spicy kimchi, it is universally recognized by both tourists and locals as an absolute must-try classic in Myeongdong.", "name": "Myeongdong Kyoja Main Store", "transport": "About a 3-minute walk from Exit 8 of Myeongdong Station (Subway Line 4)"}, {"address": "12 Myeongdong 9-gil, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | Operating since 1939, this premier historic establishment is renowned for its iconic Gomguk (Korean beef soup made with premium Hanwoo beef). The crystal-clear broth delivers an extraordinarily rich and naturally sweet Hanwoo flavor. Featuring tender slices of beef and gaminess-free offal served over sweet white rice submerged in the soup, accompanied by tangy radish kimchi, it offers the ultimate pure taste of traditional Korea.", "name": "Hadongkwan Main Branch", "transport": "About a 4-minute walk from Exit 5 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "38 Eulji-ro 1-gil, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | Open since 1968, this ultra-popular legendary hangover-cure spot focuses solely on a single dish: dried pollack soup (Bukeoguk). The milky-white broth is smooth and comforting, featuring chewy dried pollack, soft tofu, and silky scrambled eggs. Exceptionally fresh and refreshing, it is wildly beloved by local office workers and foreign foodies alike.", "name": "Mugyo-dong Bukeokukjib", "transport": "About a 5-minute walk from Exit 1-1 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "62-29 Changgyeonggung-ro, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Founded in 1946, this Michelin Bib Gourmand recipient is a pioneer of Pyongyang-style cold buckwheat noodles (Naengmyeon). The cold broth, simmered purely from premium Hanwoo beef, is deep, rich, and intensely savory. Combined with springy noodles boasting a high buckwheat content and a subtle nutty aroma, it is considered the ultimate holy grail for Pyongyang Naengmyeon enthusiasts.", "name": "Woo Lae Oak", "transport": "About a 1-minute walk from Exit 4 of Euljiro 4-ga Station (Subway Line 2)"}, {"address": "6-5 Eulji-ro 15-gil, Jung-gu, Seoul", "feature": "\u2b50 4.1 stars | Boasting over 80 years of history, this classic eatery specializes in traditional marinated grilled beef ribs (Galbi). Using traditional charcoal fires, they grill the marinated ribs until smoky and lightly charred on the outside while bursting with juicy tenderness on the inside. The perfectly balanced sweet-and-savory marinade retains the truly authentic BBQ flavors of old-school Seoul.", "name": "Chosun Ok", "transport": "About a 2-minute walk from Exit 6 of Euljiro 3-ga Station (Subway Line 2)"}, {"address": "8-10 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.0 stars | A famous traditional ginseng chicken soup specialty restaurant in Myeongdong with over 50 years of history. They carefully select 49-day-old young chickens stuffed with Korean ginseng, glutinous rice, jujubes, and chestnuts, slowly simmering them to perfection. The meat falls right off the bone with incredible tenderness. The deeply nourishing broth brings together the essence of ginseng and rich chicken flavor, complemented by a complimentary shot of ginseng wine.", "name": "Baekje Samgyetang", "transport": "About a 5-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "24 Eulji-ro 20-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Featured on famous Korean gourmet TV shows, this historic restaurant specializes in traditional blood sausage (Sundae) and pork offal. Their assorted platter includes soft, flavorful traditional blood sausage, pork liver, head meat, and tongue, completely free of any unpleasant odor. Paired with a piping-hot, rich blood sausage soup (Sundaeguk), it offers an immensely satisfying and unique meal highly beloved by local foodies.", "name": "Sansu Gapsan", "transport": "About a 4-minute walk from Exit 10 of Euljiro 4-ga Station (Subway Line 2)"}, {"address": "62-11 Changgyeonggung-ro, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | A legendary ox bone soup (Seolleongtang) institution with over 70 years of history. Premium beef bones are slow-simmered for hours into a milky-white, rich, and non-greasy comforting broth. Generous slices of melt-in-your-mouth beef are topped with fresh scallions and served alongside house-made traditional radish and cabbage kimchi, delivering a deeply satisfying flavor refined through decades of heritage.", "name": "Munhwa Ok", "transport": "About a 2-minute walk from Exit 4 of Euljiro 4-ga Station (Subway Line 2)"}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "3F, 73 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | A highly popular open-air terrace cafe located directly opposite Myeongdong Cathedral. Known for its authentic Italian espresso and freshly made bruschetta, featuring crispy European bread topped with fresh tomatoes, cheese, and basil that offers a satisfying crunch and fragrant bite. The espresso boasts dense, velvety foam with rich cocoa notes. Offering stunning front-row views of the Gothic cathedral, its unbeatable scenery and exquisite treats make it a favorite spot for both tourists and local trendsetters.", "name": "Molto Espresso Bar", "transport": "Approx. 6-min walk from Exit 8 of Myeongdong Station (Subway Line 4)"}, {"address": "10 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | A classic retro cafe in Myeongdong founded in 1993. Stepping inside feels like traveling back to 1990s Seoul. The signature Uji Matcha Ice Cream Waffle is made to order\u2014golden and crispy on the outside, soft and fragrant on the inside, topped with two scoops of rich, bittersweet matcha ice cream and fresh whipped cream. The interplay of warm waffle and cold ice cream creates a wonderfully layered texture, making this historic tea house a must-visit in the Myeongdong shopping district.", "name": "Cafe Coin Myeongdong", "transport": "Approx. 3-min walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "308 Samil-daero, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | A beautifully sunlit, minimalist white bakery cafe infused with Hawaiian vibes. Daily limited-edition \u0027Cube Breads\u0027 come in adorable shapes with a chewy crust and rich fillings like matcha, cheese, or cream, offering an oozing, silky bite that isn\u0027t overly sweet. Pair it with their in-house roasted \u0027Hawaii Kau\u0027 pour-over coffee, featuring bright citrusy notes for a refreshing, light meal\u2014perfect for an invigorating morning brunch in Myeongdong.", "name": "Luft Coffee Myeongdong", "transport": "Approx. 2-min walk from Exit 10 of Myeongdong Station (Subway Line 4)"}, {"address": "2F, 20 Eulji-ro 14-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | A minimalist hip cafe hidden on the 2nd floor of an old building in the alleyways of Euljiro\u0027s traditional printing district. The viral \u0027Fruit Sandwich\u0027 features soft, milky Japanese bread filled with a thick layer of cloud-light whipped cream and studded with fresh strawberries, kiwi, and bananas. Beautifully cross-sectioned, it offers a sweet-and-sour, melt-in-your-mouth flavor that perfectly embodies the trendy \u0027Hipjiro\u0027 aesthetic.", "name": "Bunkasha Euljiro", "transport": "Approx. 2-min walk from Exit 11 of Euljiro 3-ga Station (Subway Lines 2 \u0026 3)"}, {"address": "3F, 52 Supyo-ro, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | A unique cafe located in the retro neighborhood of Euljiro, where guests can choose their favorite cup from a wall filled with vintage porcelain cups to serve their drinks. The popular must-try \u0027Tom \u0026 Jerry Cheesecake\u0027 faithfully recreates the iconic cartoon yellow cheese\u2014with a crunchy yellow chocolate shell enclosing dense, rich cheesecake inside. The slightly tangy dairy richness melts in your mouth, perfectly paired with a flavorful drip coffee for a fun yet gourmet experience.", "name": "Cafe Jan Euljiro", "transport": "Approx. 3-min walk from Exit 11 of Euljiro 3-ga Station (Subway Lines 2 \u0026 3)"}, {"address": "2F, 6 Eulji-ro 12-gil, Jung-gu, Seoul", "feature": "\u2b50 4.1 stars | A trendy secret hangout in Euljiro bursting with 90s retro Y2K nostalgia. The signature dessert, \u0027Handmade Jelly Cake,\u0027 looks like a glistening gem, offering a chewy, refreshing texture with subtle fruity sweetness. Pair it with a \u0027Retro Cream Soda\u0027 topped with a generous scoop of vanilla ice cream and a cherry, where fizzy bubbles dance on your tongue for a cool, nostalgic treat. With its unique visual art and nostalgic flavors, this spot is a hot destination for young explorers.", "name": "George Seoul", "transport": "Approx. 2-min walk from Exit 10 of Euljiro 3-ga Station (Subway Line 2)"}, {"address": "5F, 37-8 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.0 stars | A dreamlike themed cafe located on the rooftop of the Stylenanda Flagship Store in Myeongdong, inspired by vintage California swimming pools. The popular \u0027Cotton Candy Ice Cream Coffee\u0027 features a massive, fluffy cloud of pink cotton candy perched atop a latte, creating a stunning visual impact. For brunch, freshly baked French croissants are flaky, buttery, and rich inside, making this a whimsical sanctuary for photo ops and delightful treats.", "name": "Stylenanda Pink Pool Cafe Myeongdong", "transport": "Approx. 3-min walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "263 Samil-daero, Jung-gu, Seoul", "feature": "\u2b50 4.6 stars | A popular coffee brand co-founded by top Korean baristas and bakers, with the Euljiro location featuring a distinct Korean retro industrial style. Their artisanal Danish pastries and croissants are outstanding\u2014boasting an ultra-crispy, flaky exterior with rich buttery aromas in every bite. Paired with internationally awarded specialty pour-over coffee featuring bright fruit acidity and a smooth caramel finish, it is highly praised by local office workers and coffee enthusiasts alike.", "name": "Fritz Coffee Company Euljiro", "transport": "Approx. 4-min walk from Exit 1 of Euljiro 3-ga Station (Subway Line 2)"}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "14 Chungmuro 9-gil, Jung-gu, Seoul", "feature": "\u2b50 4.1 Stars | Located on Euljiro\u0027s famous \u0027Nogari (Dried Pollack) Beer Street,\u0027 this is the ultimate spot to experience Seoul\u0027s local pojangmacha (street food stall) nightlife and retro pub culture. Their signature pairing is crisp, ice-cold draft beer with lightly fire-roasted, crispy, and chewy dried pollack, dipped in a special spicy sauce and mayonnaise\u2014savory, slightly spicy, and addictive. Every evening, the entire street fills with outdoor tables packed with locals relaxing after work and international tourists. The bustling, vibrant atmosphere lets you fully immerse in Seoul\u0027s authentic late-night drinking culture.", "name": "Manseon Hof (\ub9cc\uc120\ud638\ud504)", "transport": "About a 2-minute walk from Exit 4 of Euljiro 3-ga Station (Subway Line 2 or 3)"}, {"address": "12 Myeongdong 9-gil, Jung-gu, Seoul", "feature": "\u2b50 4.2 Stars | A national-treasure beef bone soup (Gomtang) institution with over 80 years of history, beloved by past Korean presidents and local foodies alike. The Hanwoo beef soup here is crystal clear yet rich in natural beef sweetness; the amber broth glides down smoothly without any gaminess. Filled with tender slices of slow-simmered Hanwoo beef and rice, topped with a generous handful of fresh green onions, the warm, sweet broth wraps around the rice grains to soothe the stomach. Paired with their house-made tangy, crunchy radish and cabbage kimchi, this simple yet unforgettable meal is a must-visit to experience the essence of traditional Korean regional cuisine.", "name": "Hadongkwan Myeongdong Main Store (\ud558\ub3d9\uad00 \uba85\ub3d9\ubcf8\uc810)", "transport": "About a 5-minute walk from Exit 5 of Euljiro 1-ga Station (Subway Line 2), or a 7-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "29 Myeongdong 10-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 Stars | A landmark eatery in Myeongdong recommended by the Michelin Bib Gourmand for consecutive years, drawing crowds since 1966. The signature Kalguksu (chopped noodles) features a rich chicken bone broth loaded with smooth, springy hand-rolled noodles, topped with savory minced pork and delicate wontons. The thin-skinned, juice-packed steamed dumplings burst with flavor at first bite. The unlimited garlic-heavy kimchi is the soul of the meal\u2014its punchy, spicy kick balances perfectly with the comforting noodles. Highly praised by both tourists and locals as an iconic Seoul culinary destination.", "name": "Myeongdong Kyoja Main Branch (\uba85\ub3d9\uad50\uc790 \ubcf8\uc810)", "transport": "About a 3-minute walk from Exit 8 of Myeongdong Station (Subway Line 4)"}, {"address": "6-5 Eulji-ro 15-gil, Jung-gu, Seoul", "feature": "\u2b50 4.1 Stars | Established in 1937, this legendary Euljiro restaurant boasts nearly a century of history specializing in traditional Korean grilled marinated ribs (Galbi). A unique highlight is the veteran head chef grilling seasoned Hanwoo beef ribs over dedicated charcoal fires, creating a charred exterior and a tender, juicy, pink center. The meat is tender yet satisfyingly chewy, coated in a sauce that balances sweet and savory with a deep smoky aroma. The vintage interior retains early Korean nostalgia, attracting food lovers seeking classic regional heritage dishes perfected over time.", "name": "Chosun Ok (\uc870\uc120\uc625)", "transport": "About a 2-minute walk from Exit 6 of Euljiro 3-ga Station (Subway Line 2 or 3)"}, {"address": "48-16 Supyo-ro, Jung-gu, Seoul", "feature": "\u2b50 4.4 Stars | Tucked away in a narrow factory-filled alley in Euljiro, this iconic craft brewery gastropub exemplifies the transformation of an old industrial area into a trendy hip spot. Decorated with dazzling neon lights in pink and purple alongside cyberpunk decor, it offers a futuristic yet retro vibe. They serve a wide array of house-brewed craft beers, from fruity IPAs to rich stouts. The menu features creative Korean-Western fusion dishes like gochujang peach handmade pizza and crispy spicy chicken. The crispy crust and layered flavors paired with cold, smooth craft beer make it a magnet for young locals and international visitors enjoying Seoul\u0027s nightlife.", "name": "Eulji Brewing (\uc744\uc9c0\ub9e5\uc625)", "transport": "About a 3-minute walk from Exit 11 of Euljiro 3-ga Station (Subway Line 2 or 3)"}, {"address": "48-17 Supyo-ro, Jung-gu, Seoul", "feature": "\u2b50 4.5 Stars | A wildly popular Korean BBQ pub in the Euljiro commercial area, specializing in high-quality special pork cuts and Jirisan black pork. The lively atmosphere feels like an authentic alleyway tavern. Their signature special cuts sampler includes pork neck, cheek, and more, grilled by staff to golden, crispy perfection on the outside and juicy tenderness inside. Each bite offers a springy texture and rich fat aroma without feeling greasy. Paired with house-made fish sauce and pickled wild garlic leaves, it\u0027s sweet, tangy, and refreshing. Offering various combinations of soju and craft beer, it\u0027s the top choice to experience Euljiro\u0027s local \u0027meat and booze\u0027 culture.", "name": "Eulji Yukjeom (\uc744\uc9c0\uc721\uc810)", "transport": "About a 3-minute walk from Exit 11 of Euljiro 3-ga Station (Subway Line 2 or 3)"}, {"address": "21-1 Mareunnae-ro, Jung-gu, Seoul", "feature": "\u2b50 4.2 Stars | Open for over 70 years, this traditional Pyongan-do (North Korean) regional restaurant is renowned for its unique Chogye-tang (chilled vinegar chicken soup) and Pyongyang cold noodles. The signature Chogye-tang combines shredded cooked chicken with fresh cucumbers, pears, cabbage, and other vegetables in an icy chicken broth infused with tangy vinegar and a touch of mustard spice. It is refreshingly crisp, appetizing, with tender chicken and crunchy veggies\u2014perfect for summer. They also serve a complimentary, rare side dish of spicy pickled chicken skin, chewy and flavorful, making it a highly recommended local gem among long-time Seoulites and epicures.", "name": "Pyeongraeok (\ud3c9\ub798\uc625)", "transport": "About a 3-minute walk from Exit 12 of Euljiro 3-ga Station (Subway Line 2 or 3)"}, {"address": "54 Supyo-ro, Jung-gu, Seoul", "feature": "\u2b50 4.3 Stars | Tucked deep in an Euljiro alley, this retro Japanese-style oden izakaya may be small and humble, but it overflows with heartwarming hospitality and nostalgic atmosphere. A central oden bar allows diners to sit together and pick springy Korean fish cakes and Japanese oden skewered straight from the bubbling pot. The piping hot broth absorbs the sweet flavors of kelp and radish, warming you up instantly. Don\u0027t miss their grilled capelin\u2014golden and crispy on the outside, packed with rich fish roe inside. Paired with a warm glass of sake or soju, it instantly melts away the cold and fatigue.", "name": "Eulji Oden (\uc744\uc9c0\uc624\ub385)", "transport": "About a 1-minute walk from Exit 11 of Euljiro 3-ga Station (Subway Line 2 or 3)"}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uba85\ub3d98\uae38 27 2\uce35 (2F, 27 Myeongdong 8-gil, Jung-gu, Seoul)", "feature": "\u2b50 4.7 stars | The Myeongdong branch of Korea\u0027s most famous 100% vegan Western restaurant, focusing entirely on plant-based dishes without animal products. The classic \u0027Mushroom Avocado Burger\u0027, beloved by tourists and local vegans alike, features a toasted crispy bun and a hearty, juicy homemade patty crafted from black beans and oats. Topped with fresh avocado and custom vegan mayo, it offers incredible layers of flavor. Additionally, their vegan red velvet cake and oat milk latte are popular must-tries. Bright and filled with greenery, it is a premier vegan haven in the Myeongdong shopping district.", "name": "Plant Cafe Myeongdong (\ud50c\ub79c\ud2b8 \uba85\ub3d9\uc810)", "transport": "About a 3-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uba85\ub3d9\uae38 73 2\uce35 (2F, 73 Myeongdong-gil, Jung-gu, Seoul)", "feature": "\u2b50 4.4 stars | A well-known classic North Indian restaurant near Myeongdong Cathedral, offering an extensive and clearly labeled menu of vegan and lacto-ovo vegetarian curries. The acclaimed \u0027Chana Masala\u0027 paired with freshly baked whole wheat flatbread (Roti) is rich and aromatic with spices; the chickpeas are simmered until soft and creamy, bursting with natural bean flavor and complex spice layers. With an elegant atmosphere, it is a favorite among both international tourists and local plant-based food lovers.", "name": "Taj Indian Restaurant (\ud0c0\uc9c0 \uba85\ub3d9\uc810)", "transport": "About a 5-minute walk from Exit 5 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uba85\ub3d910\uae38 21-8 (21-8 Myeongdong 10-gil, Jung-gu, Seoul)", "feature": "\u2b50 4.2 stars | Tucked away in the alleys of Myeongdong, this traditional Korean tofu specialty shop handcrafts tofu daily using carefully selected high-quality soybeans. The signature \u0027Wild Vegetable Soft Tofu Set Meal\u0027 features a natural kelp broth base paired with silky-smooth fresh tofu and a variety of seasonal mountain vegetable side dishes. It boasts a light, refreshing, and sweet finish with a velvety bean flavor. An excellent refreshing vegetarian option for travelers looking to savor authentic Korean flavors while maintaining a vegetarian diet.", "name": "Duran Tofu Restaurant (\ub450\ub780 \uba85\ub3d9\uc810)", "transport": "About a 4-minute walk from Exit 8 of Myeongdong Station (Subway Line 4)"}, {"address": "\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uba85\ub3d910\uae38 2 3\uce35 (3F, 2 Myeongdong 10-gil, Jung-gu, Seoul)", "feature": "\u2b50 4.5 stars | Located on Myeongdong\u0027s main street, this authentic vegetarian-friendly Indian restaurant offers abundant vegan and allium-free options. The popular \u0027Vegetable Samosa\u0027 features an ultra-crispy fried shell stuffed with rich mashed potatoes and green peas, delivering a satisfying crunch and fragrant bite. Paired with specialty spinach curry and turmeric rice, it strikes a perfect balance of chewy texture and comforting flavors, drawing countless international travelers.", "name": "Jyoti Indian Restaurant (\uc870\ud2f0 \uc778\ub3c4\ub808\uc2a4\ud1a0\ub791 \uba85\ub3d9\uc810)", "transport": "About a 2-minute walk from Exit 8 of Myeongdong Station (Subway Line 4)"}, {"address": "\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uc744\uc9c0\ub85c12\uae38 12 (12 Eulji-ro 12-gil, Jung-gu, Seoul)", "feature": "\u2b50 4.3 stars | A long-established local vegetarian-friendly soy specialty shop tucked in the printing alley of Euljiro. Its \u0027Handcrafted Soybean Set Meal\u0027 uses local Korean soybeans freshly cooked daily. The tofu has a firm yet elastic texture, and when dipped in custom savory-sweet soy sauce, it highlights the purest bean aroma and creamy texture. Many of the accompanying Korean banchan (side dishes) are also vegan pickled dishes, making it hugely popular among Euljiro office workers seeking healthy, guilt-free meals.", "name": "Gamagol Tofu (\uc744\uc9c0\ub85c \uac00\ub9c8\uace8 \ub450\ubd80)", "transport": "About a 2-minute walk from Exit 11 of Euljiro 3-ga Station (Subway Line 2/3)"}, {"address": "\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uba85\ub3d94\uae38 15 (15 Myeongdong 4-gil, Jung-gu, Seoul)", "feature": "\u2b50 4.6 stars | A cozy Myeongdong outpost of the globally renowned vegan chain, specializing in 100% plant-based Korean and Western cuisine. The highly popular \u0027Vegan Korean Bulgogi Bibimbap\u0027 uses soy protein mock meat stir-fried in a signature Korean sauce until fragrant and chewy. Mixed with fresh lettuce and sesame oil, it bursts with mouthwatering aromas without any off-taste, perfectly recreating classic Korean comfort food.", "name": "Loving Hut Cafe (\ub7ec\ube59\ud5db \uba85\ub3d9\uc810)", "transport": "About a 4-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uc744\uc9c0\ub85c12\uae38 28 1\uce35 (1F, 28 Eulji-ro 12-gil, Jung-gu, Seoul)", "feature": "\u2b50 4.5 stars | A popular Hawaiian poke spot located near Euljiro 3-ga that offers soul-satisfying vegetarian bowl options. The signature \u0027Special Grilled Tofu Brown Rice Bowl\u0027 features organic tofu pan-seared until golden and crisp on the outside yet tender inside, paired with brown rice, edamame, red onions, and custom sesame dressing. Crispy, flavorful, filling, yet low-calorie, it comes highly recommended by Euljiro hipsters and health-conscious diners.", "name": "Hooked Poke (\ud6c5\ud2b8\ud3ec\ucf00 \uc744\uc9c0\ub85c\uc810)", "transport": "About a 3-minute walk from Exit 9 of Euljiro 3-ga Station (Subway Line 2/3)"}, {"address": "\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uba85\ub3d96\uae38 23 (23 Myeongdong 6-gil, Jung-gu, Seoul)", "feature": "\u2b50 4.4 stars | A vintage-vibed classic cafe in Myeongdong offering a variety of vegetarian-friendly traditional Korean desserts and plant milk drinks. A must-try is the \u0027Plant-Based Milk Korean Green Tea Bingsu\u0027, made with a rich soy milk shaved ice base that is fine, silky, and melts in your mouth. Topped with sweet, tender red beans and chewy rice cakes, it is delightfully balanced without being overly sweet\u2014a perfect spot for a relaxing plant-based afternoon tea while exploring Myeongdong.", "name": "Cafe Coin (\uce74\ud398\ucf54\uc778 \uba85\ub3d91\ud638\uc810)", "transport": "About a 5-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Street stalls around Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | A classic highlight of the Myeongdong Night Market, this piping-hot street snack features a whole fresh egg cracked directly onto sweet batter and baked to perfection. One bite reveals soft, fluffy sweet cake on the outside paired with a rich, savory burst of soft-boiled yolk inside. The perfect blend of sweet and savory keeps you coming back for more, making it a winter street-food must-try for locals and tourists alike.", "name": "Myeongdong Traditional Egg Bread (Gyeran-ppang)", "transport": "About a 2-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "Street stalls at Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | Fresh lobster sliced in half, layered with generous garlic cheese, and torched at high heat until golden and bubbling. The lobster meat is firm, juicy, and packed with sweet ocean flavor, complemented by gooey, stretchy cheese and rich buttery garlic aromas. Offering fantastic texture and visual appeal, it\u0027s a popular luxury snack for international tourists snapping photos along Myeongdong Walking Street.", "name": "Myeongdong Grilled Cheese Lobster", "transport": "About a 3-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "Street stalls at Myeongdong 2-ga, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | Alternating skewers of traditional Korean white rice cakes and mozzarella cheese blocks are pan-grilled until golden and crispy outside, then drizzled with sweet condensed milk or signature hot sauce. Crispy on the outside and soft on the inside, the chewy rice cake offers a rich rice flavor, while the melted cheese stretches endlessly. It\u0027s a hugely delightful sweet-and-savory grab-and-go street treat.", "name": "Myeongdong Grilled Cheese \u0026 Rice Cake Skewers", "transport": "About a 4-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "Street stalls at Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.1 stars | A whole potato is spiral-cut, stretched along a long bamboo skewer, and deep-fried to golden perfection before being dusted with onion, cheese, or spicy seasoning powder. Crispy and crunchy like ultra-thick freshly fried potato chips, some variations even add a German sausage in the middle for extra heartiness. Eye-catching and easy to eat, it\u0027s a huge hit among young adults and tourists.", "name": "Myeongdong Tornado Potato", "transport": "About a 3-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "Street stalls at Chungmuro 2-ga, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Made-to-order traditional Korean sweet pancakes (hotteok) shallow-fried until crispy, golden, and pleasantly chewy. The inside oozes with molten brown sugar, cinnamon, and a crunchy mix of sunflower seeds and crushed peanuts. Piping hot, nutty, and sweet without being overwhelming, this comforting dessert always draws long queues on the streets of Myeongdong.", "name": "Myeongdong Handmade Nut \u0026 Brown Sugar Hotteok", "transport": "About a 2-minute walk from Exit 8 of Myeongdong Station (Subway Line 4)"}, {"address": "Street stalls at Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Premium fish paste wrapped around fresh shrimp, rice cake, or cheese, either freshly fried or simmered in rich broth. The fish cakes are springy, tender, and rich in umami, soaking up flavorful soup brewed with kelp and radish. In chilly weather, taking a bite of hot fish cake followed by a cup of sweet, slightly spicy warm broth is a comforting ritual loved by locals and visitors alike.", "name": "Myeongdong Fish Cake \u0026 Shrimp Skewers (Eomuk)", "transport": "About a 3-minute walk from Exit 6 of Myeongdong Station (Subway Line 4)"}, {"address": "Street stalls at Myeongdong 9-gil, Jung-gu, Seoul", "feature": "\u2b50 4.6 stars | Featuring plump, sweet local Korean strawberries wrapped in smooth red bean paste or matcha filling, all encased in soft, chewy handmade glutinous rice skin. Cut open, it reveals a striking colorful cross-section. The juicy burst of sweet-and-sour strawberry creates a perfect balance with the soft mochi and sweet bean paste, making it one of Myeongdong\u0027s most popular handheld treats.", "name": "Myeongdong Fresh Strawberry Chapssaltteok (Strawberry Mochi)", "transport": "About a 5-minute walk from Exit 5 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "Alley stalls at Euljiro 3-ga, Jung-gu, Seoul", "feature": "\u2b50 4.0 stars | Tucked in the alleys of Euljiro, this old-school street stall serves retro Korean hot dogs\u2014sausages wrapped in thick yeast batter and diced potatoes, fried golden-crisp, then dusted with sugar and drizzled with ketchup. They also offer grilled blood sausage (sundae) skewers drizzled with spicy sauce, chewy and devoid of gaminess. Delivering authentic street-cart (pojangmacha) flavors, it\u0027s popular with local office workers and adventurous foodies.", "name": "Euljiro Heritage Hotdog \u0026 Sundae Skewers", "transport": "About a 1-minute walk from Exit 12 of Euljiro 3-ga Station (Subway Lines 2/3)"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Myeongdong and Euljiro"}, "seongsu_seoulforest": {"categories": {"cat_1": {"items": [{"address": "45 Yeonmujang-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 Stars | Featured on the popular Korean food show \u0027The Nation\u0027s Big Three,\u0027 this is the soul food of Seongsu-dong! Open for decades, it is an extremely popular classic eatery beloved by locals and tourists alike. The signature pork bone soup (gamjatang) features large bone-in pork tenderly simmered for hours in a rich, spicy, vibrant red broth enhanced with perilla powder and perilla leaves for a distinct aroma. The meat is melt-in-your-mouth tender, falling off the bone effortlessly with just chopsticks, and tastes even better dipped in their special mustard sauce. Pro tip: after finishing the pork bones and soft potatoes, add fried rice and shredded seaweed to crisp up a fragrant rice crust on the hot iron pot\u2014an unforgettable treat!", "name": "Somunnan Seongsu Gamjatang (Legendary Seongsu Pork Bone Soup)", "transport": "About a 3-minute walk from Exit 4 of Seongsu Station (Subway Line 2)"}, {"address": "27 Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 Stars | Located on the famous \u0027Seoul Forest Galbi Alley\u0027 in Seongsu-dong, this original traditional charcoal BBQ spot has used premium Korean pork and a secret sauce for decades. The signature charcoal-grilled marinated pork ribs are soaked in a special fruity marinade, then grilled over hot charcoal to produce an enticingly charred crust, juicy texture, and a perfect sweet-and-savory balance. Ordering ribs comes with a full table of fresh wrap vegetables, kimchi, plus a complimentary rich kimchi stew and steamed egg. Excellent value for money and an authentic Korean street-side tent vibe make this place packed with evening crowds every day.", "name": "Daeseong Galbi", "transport": "About a 5-minute walk from Exit 8 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "7 Achasan-ro 7-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 Stars | Hailed as one of \u0027Seoul\u0027s Top Three Jokbal (Pork Trotters)\u0027, this powerhouse classic restaurant has been rooted locally for years and is always packed. Their savory braised pork trotters are freshly simmered daily with secret medicinal herbs and aged marinade. The skin shines with a glossy amber hue, rich in collagen and pleasantly chewy, while the lean meat remains moist, tender, and odor-free. Each bite delivers a rich herbal aroma combined with a sweet and savory taste. Pair it with their custom sweet salted shrimp sauce or garlic kimchi, wrapped in fresh perilla leaves for a perfect balance of savory fat and crisp greens\u2014an irreplaceable delicacy for Seoul foodies.", "name": "Seongsu Jokbal", "transport": "About a 2-minute walk from Exit 4 of Seongsu Station (Subway Line 2)"}, {"address": "134 Wangsimni-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 Stars | Tucked away in a quiet alley in Seongsu-dong, this traditional old-school restaurant is famous for its hand-cut noodle soup (Kalguksu) and boiled pork wraps (Bossam). The handmade noodles feature natural, irregular thickness with a wonderfully chewy texture, served in a mild, flavorful white broth slow-simmered from bones and anchovies. The signature Bossam uses fresh pork belly simmered until incredibly tender, perfectly balanced between lean and fat without feeling greasy. Wrapped in freshly made, crunchy, and spicy raw kimchi, every juicy bite delivers an authentic and heartwarming Korean home-style flavor.", "name": "Family Sonkalguksu Bossam", "transport": "About a 2-minute walk from Exit 1 of Ttukseom Station (Subway Line 2)"}, {"address": "68 Achasan-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.2 Stars | A time-honored soup restaurant specializing in traditional ox bone soup (Seolleongtang) and beef tripe soup for decades, beloved by local seniors and office workers in Seongsu-dong. They insist on slow-boiling a generous amount of ox bones daily to create a milky-white, pure soul broth with no artificial additives, allowing you to taste the deep, natural sweetness of the beef bone. Served piping hot with thick tender slices of beef and wheat noodles, just add chopped scallions, salt, and pair with their house-made tangy cubed radish kimchi (kkakdugi) for a warm and nourishing meal.", "name": "Hanyang Seolleongtang", "transport": "About a 4-minute walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "4-8 Seongdeokjeong 15-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 Stars | Located in the historic Ttukdo Traditional Market in Seongsu-dong, this long-standing shop specializes in handmade tofu. Every morning, they use high-quality local Korean soybeans and traditional methods to freshly grind and craft tofu, yielding an extraordinarily rich soybean aroma. The signature handmade soft tofu dish is cloud-soft, silky, and melts in your mouth, releasing pure natural soybean flavor. Enjoy it dipped in special chive soy sauce or order a spicy tofu kimchi stew to truly feel the simple charm and warmth of a traditional Korean market.", "name": "Ttukdo Sondubu", "transport": "About a 10-minute walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "15-1 Achasan-ro 7-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 Stars | An iconic traditional mung bean pancake (Bindaetteok) and Korean pancake spot in Seongsu-dong, making it a top choice for gathering with friends over Makgeolli (rice wine) on rainy days or evenings. Freshly stone-ground soaked mung beans are blended with bean sprouts and minced pork, then pan-fried on a griddle until golden and crispy. Freshly cooked pancakes feature a super crispy exterior with a soft, savory interior bursting with bean and pork flavors. Dipping into their special onion-and-chili soy sauce cuts through the richness, showcasing the classic charm of authentic Korean comfort food.", "name": "Seongsu Bindaetteok", "transport": "About a 3-minute walk from Exit 1 of Seongsu Station (Subway Line 2)"}, {"address": "38 Yeonmujang-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 Stars | A traditional blood sausage soup restaurant that has accompanied Seongsu-dong residents for decades, renowned for its authentic ingredients and rich classic flavor. The signature Sundaeguk features a naturally rich white broth simmered for hours from premium pork bones, resulting in a smooth, hearty taste without any off-odors. Generous portions include handmade chewy glutinous rice blood sausages (sundae) and thick cuts of pork offal. Customize your bowl with salted shrimp sauce for savory depth, perilla powder for aroma, or hot pepper paste for spice. Paired with steaming hot rice, every bite is warming and deeply satisfying, embodying traditional Korean soup rice culture.", "name": "Seongsu Chappal Sundaeguk", "transport": "About a 4-minute walk from Exit 4 of Seongsu Station (Subway Line 2)"}], "name": "Iconic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "8 Achasan-ro 9-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | An iconic industrial-style cafe converted from an abandoned 1950s factory, preserving weathered red bricks and raw concrete walls. The must-try signature dish is the Pandoro, dusted generously with snowflake-like powdered sugar\u2014dense, soft, and melt-in-your-mouth. Paired with rich, in-house roasted Americano, it perfectly embodies Seongsu-dong\u0027s unique mix of rugged charm and refined taste, making it a favorite among domestic and international tourists.", "name": "Cafe Onion Seongsu", "transport": "About a 2-minute walk from Exit 2 of Seongsu Station (Subway Line 2)"}, {"address": "78 Seongsuui-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 stars | One of the pioneers of industrial-style cafes in Seongsu-dong, formerly a rice mill and steel warehouse featuring stunning high doors and vaulted skylights. Blending an art gallery with coffee and food, its signature Tiramisu is moist and rich, boasting deep espresso flavors and smooth mascarpone cheese. Many hipsters and tourists visit specifically to experience the unique fusion of art exhibitions and aromatic coffee.", "name": "Daelim Changgo Gallery Cafe", "transport": "About a 5-minute walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "26 Seongsuui-ro 7-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 stars | A surreal, avant-garde fashion cafe created by eyewear brand Gentle Monster, designed like a contemporary art museum. The highly buzzed-about signature \u0027Peak Cake\u0027 features a pitch-black, crispy croissant crust filled with rich, silky matcha cream. Dipping into the cream offers rich layers of flavor\u2014slightly bitter yet subtly sweet without being cloying\u2014attracting countless trendsetters and foodies for photo ops.", "name": "Nudake Seongsu", "transport": "About a 5-minute walk from Exit 4 of Seongsu Station (Subway Line 2)"}, {"address": "19-8 Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | An immensely popular bakery near Seoul Forest specializing in toast breads, drawing constant queues despite its small shop size. Their uniquely developed Cube Chestnut Toast features a golden, slightly crispy crust with a soft, chewy interior filled with rich, warm chestnut paste and milky aroma. Its exceptional artisanal baking quality makes it a top choice for on-the-go snacks among locals and tourists alike.", "name": "Meal Do Seongsu", "transport": "About a 4-minute walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "22-1 Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 stars | A sun-drenched, two-story bakery cafe near Seoul Forest famous for its top-tier Salt Bread. Freshly baked, the salt bread has a crispy outer shell and a fluffy interior packed with fermented butter aroma, elevated by a delicate sea salt savoriness and chewy texture. Paired with a signature iced latte in the sunlit courtyard, it is a hotspot for enjoying a relaxed brunch in Seongsu-dong.", "name": "Lowide Coffee Bakery", "transport": "About a 5-minute walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "43 Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 stars | An adorable teddy bear-themed cafe oozing French romantic countryside charm, with cozy and beautiful decor across its courtyard and interior. Must-order popular items include the teddy bear-shaped egg tarts and meringue egg brunch. The egg tarts feature a crispy crust with an ultra-smooth, molten filling bursting with rich egg and vanilla bean flavors. Eye-catching aesthetics combined with delicate taste make it immensely popular with female guests and young couples.", "name": "Teddy\u0027s Oven", "transport": "About a 5-minute walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "9 Seongsuui-ro 7-ga-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | A spacious arts and cultural complex cafe made famous as a filming location for the K-drama \u0027Vincenzo\u0027. Its most striking feature is a detailed wooden treehouse perched on tall trees in the courtyard. Brunch options include savory basil pesto avocado paninis and freshly baked artisanal pizzas; the panini boasts a crispy grilled exterior with gooey melted cheese and fresh, sweet veggies. The roomy and comfortable space makes it ideal for relaxing gatherings.", "name": "Cafe Grandpa Factory", "transport": "About a 6-minute walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "14 Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 stars | A European-style two-story villa cafe combining floral design and a fashion boutique, featuring a lush outdoor garden courtyard. The signature French toast is cooked to a golden crisp outside while remaining soft and pudding-like inside, served with fresh berries and pure maple syrup for a rich burst of sweet-and-sour milky flavor. Its elegant, quiet vibe and photo-worthy spots make it a premier choice for brunch in Seongsu-dong.", "name": "Clementines", "transport": "About a 4-minute walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "38 Yeonmujang-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 stars | A legendary, centuries-old famous restaurant with long queues day and night, highly recommended on Baek Jong-won\u0027s Top 3 Chef King! Its signature pork bone soup (Gamjatang) is simmered to perfection; the large pork spine bones easily separate from the tender, melt-in-your-mouth, juicy meat. The broth is rich, spicy, yet not greasy, featuring a unique aroma of perilla powder and a refreshing tangy kick from the mustard dipping sauce. Ordering rice at the end to make seaweed fried rice is an absolute masterpiece, passionately loved by local office workers and tourists alike.", "name": "Somunnan Seongsu Gamjatang (\uc18c\ubb38\ub09c \uc131\uc218 \uac10\uc790\ud0d5)", "transport": "Approx. 3-min walk from Exit 4 of Seongsu Station (Subway Line 2)"}, {"address": "44-13 Seoul-forest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 stars | A Michelin Bib Gourmand-recommended cozy Korean home-style restaurant tucked away in a quiet alley near Seoul Forest. It focuses on warm, traditional local home cooking without added artificial flavorings. The \u0027Spicy Braised Beef Flank Set\u0027 and \u0027Soy-Marinated Crab Set\u0027 are the most popular\u2014the beef is cooked until exceptionally tender, absorbing rich, sweet, and savory sauces. Delicate side dishes like pan-fried tofu and pickles offer a crisp, refreshing texture, delivering a heartwarming, motherly flavor highly favored by young diners who appreciate light, quality Korean meals.", "name": "Grandma\u0027s Recipe (\ud560\uba38\ub2c8\uc758 \ub808\uc2dc\ud53c)", "transport": "Approx. 6-min walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "42 Seongsuil-ro 8-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 stars | A highly talked-about specialty restaurant in Seongsu-dong that incorporates fresh, aromatic water dropwort (Minari) into Korean beef soup rice and raw beef dishes. The signature \u0027Minari Beef Soup Rice\u0027 features a sweet and savory broth brimming with crisp, tender water dropwort full of herbal aroma\u2014soothing and non-greasy. The \u0027Minari Beef Tartare Bibimbap\u0027 is a visual and flavor delight, combining supremely tender Hanwoo beef with a secret sauce for a rich, refreshing texture that attracts foodies from all over.", "name": "Neungdong Minari Seongsu (\ub2a5\ub3d9\ubbf8\ub098\ub9ac \uc131\uc218\uc810)", "transport": "Approx. 4-min walk from Exit 2 of Seongsu Station (Subway Line 2)"}, {"address": "27 Seoul-forest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.2 stars | A legendary landmark with decades of history on Seongsu-dong\u0027s famous Charcoal Grilled Galbi Street, offering the top choice for an authentic, down-to-earth Korean pub vibe. The signature charcoal-grilled pork galbi is served in generous portions, marinated in a sweet savory sauce and grilled over charcoal to a slight char, resulting in juicy, tender meat infused with a rich smoky flavor. Ordering an item comes with a complimentary piping hot, spicy kimchi stew and a huge lettuce basket. Paired with soju or beer, its lively, tipsy atmosphere is beloved by local foodies and travelers.", "name": "Daesung Galbi (\ub300\uc131\uac08\ube44)", "transport": "Approx. 4-min walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "78 Seongsui-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | A multi-concept bistro and gallery converted from an old mill and factory in Seongsu-dong, retaining rugged red bricks and high wooden rafters for a striking industrial aesthetic. Beyond house-roasted coffee and desserts, it serves amazing Western-Korean fusion local dishes and craft beer. Highlights include \u0027Rose Sauce Pasta\u0027 and \u0027Wood-fired Pizza\u0027 with a crust that is crispy outside and soft inside, smoked to perfection. Paired with house-brewed fruity craft beer, it offers a perfect match of artistic visuals and culinary excellence for gatherings.", "name": "Daelim Changgo (\ub300\ub9bc\ucc3d\uace0)", "transport": "Approx. 5-min walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "19 Seoul-forest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 stars | A super popular burger bistro in Seongsu-dong blending American aesthetics with Korean creativity. The daily limited \u0027Wasabi Shrimp Burger\u0027 is the flagship item drawing massive crowds. The shrimp patty is fried to ultimate crispiness outside, stuffed with juicy, bouncy shrimp meat that bursts in your mouth. Balanced with a custom lightly spicy wasabi mayo and fresh shredded cabbage, it feels light and non-greasy. With retro American decor, paired with icy draft beer or soda, it delivers an immensely satisfying meal.", "name": "Zesty Saloon Seongsu (\uc81c\uc2a4\ud2f0\uc0b4\ub871 \uc131\uc218)", "transport": "Approx. 7-min walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "2F, 39 Seongsuil-ro 8-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | A trendy Western-Korean fusion bistro in Seongsu-dong with a secret entrance hidden behind a tiny door reminiscent of a K-drama set. The signature \u0027Darak Omurice\u0027 features an insanely soft, creamy soft-boiled omelet that drapes over aromatic fried rice like a waterfall when cut open, drenched in a special rich red sauce. Another hit, the \u0027Spicy Cream Pasta,\u0027 incorporates Korean chili powder into a rich yet non-greasy sauce. Its striking visual presentation and rich flavors make it a favorite among tourists and youth.", "name": "Seongsu Darak (\uc131\uc218\ub2e4\ub77d)", "transport": "Approx. 4-min walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "42 Seongsuil-ro 8-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 stars | A local specialty eatery representing the bold flavors of Seongsu-dong\u0027s back alleys, specializing in spicy, springy stir-fried webfoot octopus. Exceptionally fresh and bouncy webfoot octopus is stir-fried on a large griddle with a secret red chili sauce, giving it a pleasantly chewy texture and satisfying kick. Pro-tip: wrap it in a perilla leaf with pickled radish slices and dip it in creamy mayonnaise for a perfect combo that balances the heat with rich creaminess. Finish with cheese fried rice, where crispy cheese meets spicy rice, making it an excellent choice for drinking and gathering.", "name": "Seongsu-dong Jjukkumi (\uc131\uc218\ub3d9 \ucb48\uafb8\ubbf8)", "transport": "Approx. 4-min walk from Exit 2 of Seongsu Station (Subway Line 2)"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "1F, 9 Yeonmujang 5-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 Stars | An incredibly popular Mediterranean vegan-style restaurant in Seongsu-dong! It specializes in made-to-order falafel and rich, fresh salad bowls. The falafels are golden and crispy on the outside, fluffy and herb-infused on the inside. Paired with creamy, rich specialty hummus and soft pita bread, every bite offers complex layers of flavor without any of the monotony often associated with vegan food. Extremely loved by local office workers and international tourists alike.", "name": "Chick Peace Seongsu", "transport": "Approx. 3-minute walk from Exit 4 of Seongsu Station (Subway Line 2)"}, {"address": "2F, 43-1 Yeonmujang-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 Stars | A high-end branch of the famous Itaewon hotspot located in Seongsu-dong, offering luxurious vegan Western cuisine in an upscale atmosphere. The signature \u0027Vegan Black Truffle Cream Pasta\u0027 is crafted with oat milk and plant-based cheese, resulting in a rich, velvety sauce infused with a deep truffle aroma. Another highlight, the \u0027Plant-Based Burger,\u0027 features a juicy, perfectly seared patty that rivals real beef in texture\u2014a true testament to fine plant-based dining. Perfect for date nights and special gatherings.", "name": "Monk\u0027s Butcher Seongsu", "transport": "Approx. 5-minute walk from Exit 4 of Seongsu Station (Subway Line 2)"}, {"address": "1F, 20 Achasan-ro 9-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 Stars | A rare Canadian-French vegan bistro in Seongsu-dong, helmed by an expat chef. Their most popular item, the vegan poutine, features piping hot, freshly fried French fries smothered in homemade vegan gravy and plant-based cheese curds\u
