    <script>
        const db = {"dongdaemun": {"categories": {"cat_1": {"items": [{"address": "18 Jongno 40-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Founded in 1978, this immensely popular classic eatery in Dongdaemun is a must-visit traditional culinary gem when traveling to Seoul. The restaurant uses perfectly aged, tender whole young chicken slow-simmered in a broth with scallions, rice cakes, and a generous amount of minced garlic. The soup is light, naturally sweet, and rich with garlic aroma. The chicken is exceptionally soft, juicy, and tender. Dip it into their house-made garlic chili sauce and mustard-vinegar mix for a tangy, spicy, and irresistible flavor. To finish off, add handmade noodles to soak up the rich, essential broth\u2014chewy and highly satisfying. It is an authentic Korean chicken stew praised by both tourists and locals alike.", "name": "Jin Ok-hwa Halmae Original Takk Hanmari", "transport": "Subway Lines 1/4, Dongdaemun Station, Exit 8, about a 5-minute walk into Takk Hanmari Alley"}, {"address": "14 Jongno 40-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | A long-standing classic shop located in Dongdaemun\u0027s Takk Hanmari Alley, beloved by local foodies. Compared to Jin Ok-hwa, Myeongdong Takk Hanmari offers a lighter, sweeter broth made from bone broth slow-simmered into a milky-white essence, paired with incredibly tender whole chicken and dense, soft potatoes. The chicken is springy and juicy. Dip it in a sauce made with fresh chives, chili paste, and special vinegar for rich layers of flavor. The rice cakes absorb the delicious broth becoming chewy without being sticky. Finish your meal by cooking a bowl of rice with seaweed flakes into a savory Korean porridge\u2014an endlessly memorable feast.", "name": "Myeongdong Takk Hanmari Main Branch", "transport": "Subway Lines 1/4, Dongdaemun Station, Exit 8, about a 5-minute walk"}, {"address": "5 Jongno 40-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.2 stars | Tucked away in Dongdaemun\u0027s famous Grilled Fish Alley, this decades-old traditional spot greets you with the irresistible aroma of charcoal-grilled fish as soon as you enter the alley. Using traditional charcoal fires and iron griddles, fresh fish are grilled until their skins are golden and crispy, locking in rich juices. Their signature grilled Spanish mackerel and mackerel feature thick, firm meat with zero fishiness, infused with smoky charcoal flavor and a balanced touch of saltiness. Served with complimentary traditional Korean side dishes and soybean paste soup, it pairs perfectly with rice, drawing countless office workers and longtime Seoul residents.", "name": "Honam Jib Grilled Fish", "transport": "Subway Lines 1/4, Dongdaemun Station, Exit 8, about a 6-minute walk"}, {"address": "29 Jongno 51-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | A highly popular traditional institution inside Changsin Market in Dongdaemun, famous for its addictive, signature spicy sauce. The pig\u0027s trotters are braised until tender and flavorful, then grilled over charcoal to achieve a slightly charred skin packed with smoky flavor, rich collagen, and tender meat. The secret spicy sauce balances fire with a touch of sweetness; though quite spicy, it\u0027s impossible to stop eating. Many diners order rice balls and steamed egg to go with it\u2014a quintessential spot to experience authentic Korean pub culture in Dongdaemun at night.", "name": "Changsin-dong Maeun Jokbal (Spicy Braised Pig\u0027s Trotters)", "transport": "Subway Lines 1/4, Dongdaemun Station, Exit 3, about a 3-minute walk into Changsin Market"}, {"address": "200-4 Jongno, Jongno-gu, Seoul", "feature": "\u2b50 4.6 stars | A renowned traditional beef tartare spot located near the intersection of Dongdaemun and Gwangjang Market, famous for its ultra-fresh yet affordable Hanwoo (Korean beef). The signature Yukhoe (beef tartare) features premium lean beef finely sliced, served with sweet, crisp Korean pear strips and a rich raw egg yolk. When mixed, it offers a silky, melt-in-your-mouth texture brimming with sesame oil aroma and natural fruity sweetness without any fishy odor. Comes with free savory beef and radish soup. A quintessential local spot for after-work drinks and gatherings.", "name": "Changsin Yukhoe Main Branch", "transport": "Subway Line 1, Jongno 5-ga Station, Exit 7, about a 2-minute walk"}, {"address": "455 Toegye-ro, Jung-gu, Seoul", "feature": "\u2b50 4.1 stars | The flagship main branch of the extreme-spicy tteokbokki chain that took all of South Korea by storm, making it a unique landmark eatery in Dongdaemun. Famous for its generous portions and intensely spicy sauce with a powerful kick, the rice cakes are delightfully chewy and served with heaps of melted mozzarella cheese, fish cakes, sausages, and boiled eggs. The rich gooey mozzarella helps cut through the heat, delivering a fiery yet cheesy bite that is immensely popular among youngsters and spice-loving tourists.", "name": "Dongdaemun Yuppgi Tteokbokki Main Branch", "transport": "Subway Lines 2/6, Sindang Station, Exit 10, about a 3-minute walk"}, {"address": "174-1 Jangchungdan-ro, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | An iconic pioneer restaurant with over 50 years of history, located on Jangchung-dong Jokbal Street just south of the Dongdaemun shopping area. The pig\u0027s trotters are braised for hours in a master brine stock, developing an alluring deep amber sheen. The sliced pork trotter has a perfect ratio of fat to lean meat, featuring springy skin and juicy, tender meat with hints of subtle herbal medicinal aromas and savory-sweet soy flavor. Dipped in salted shrimp sauce or wrapped in lettuce with green chili and garlic slices, it offers rich, non-greasy flavor layers\u2014making it one of Seoul\u0027s premier traditional jokbal destinations.", "name": "Pyeongando Jokbal (Jangchung-dong)", "transport": "Subway Line 3, Dongguk Univ. Station, Exit 3, about a 2-minute walk"}, {"address": "11 Jangchungdan-ro 13-gil, Jung-gu, Seoul", "feature": "\u2b50 4.0 stars | Founded in the 1960s, this is the oldest Chinese-Korean restaurant in the Dongdaemun district. Open late into the night, it is a late-night supper sanctuary for night shoppers and locals. Their signature Jajangmyeon (black bean noodles) features a rich, savory-sweet dark sauce poured over fresh, chewy noodles made to order, topped with plenty of soft saut\u00e9ed onions and diced pork. Their Tangsuyuk (sweet and sour pork) boasts a crispy golden crust around tender meat coated in a glossy, sweet-and-sour glaze\u2014a nostalgic classic showcasing authentic Korean-Chinese dining culture.", "name": "Donghwa Banjeom", "transport": "Subway Lines 1/4, Dongdaemun Station, Exit 8, about a 3-minute walk"}], "name": "Famous Local Heritage Restaurants"}, "cat_2": {"items": [{"address": "16 Toegye-ro 62-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 Stars | A famous Instagrammable cafe known across Korea for its unique hidden entrance behind a retro refrigerator door. Incorporating fresh fruit into specialty coffee and light brunch dishes, their signature Fruit Tiramisu and freshly made French Toast offer a delightfully soft, perfectly balanced sweetness. Paired with cold brew fruit coffee for a delightfully layered, sweet and tangy flavor, it\u0027s a mysterious and trendy spot in Dongdaemun for stunning photos.", "name": "Jean Frigo (\uc7a5\ud504\ub9ac\uace0)", "transport": "Subway Lines 2/4/5 Dongdaemun History \u0026 Culture Park Station, Exit 4 (approx. 3-min walk)"}, {"address": "1F, DDP Design Lab, 281 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.3 Stars | A spacious specialty cafe located on the 1st floor of DDP (Dongdaemun Design Plaza), featuring an in-house roasting team and a futuristic, streamlined interior design. Serving delicate brunch croissant paninis, freshly baked quiches, and various artisan pour-over coffees. Known for its rich, smooth coffee aroma and flaky yet soft croissants, it is a favorite among designers and tourists alike.", "name": "Cafe de Fessonia (\uce74\ud398\ub4dc\ud398\uc18c\ub2c8\uc544)", "transport": "Subway Lines 2/4/5 Dongdaemun History \u0026 Culture Park Station, Exit 1 (Direct access to DDP)"}, {"address": "1F, JW Marriott Hotel, 279 Cheonggyecheon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.6 Stars | Situated on the 1st floor of the JW Marriott Hotel, boasting floor-to-ceiling windows with a direct view of South Korea\u0027s Treasure, Heunginjimun (Dongdaemun). It serves luxurious gourmet brunch sets and seasonal themed afternoon teas. Freshly baked British scones paired with velvety cream and homemade jam offer a soft, crumbly texture. Combined with aromatic premium single-estate tea, guests can enjoy fine dining while overlooking a streetscape where historical heritage meets modernity.", "name": "JW Marriott The Lounge (JW \uba54\ub9ac\uc5b4\ud2b8 \ub3d9\ub300\ubb38 \ub354 \ub77c\uc6b4\uc9c0)", "transport": "Subway Lines 1/4 Dongdaemun Station, Exit 8 (Direct connection)"}, {"address": "15-17 Toegye-ro 53-gil, Jung-gu, Seoul", "feature": "\u2b50 4.5 Stars | Tucked away in the alleys of Dongdaemun, this minimalist cafe features a sleek black-and-white aesthetic. Renowned for its generous, beautifully plated brunch platters and freshly made croffles (croissant waffles). The signature Avocado \u0026 Shrimp Open Sandwich topped with a soft-boiled egg is rich, flavorful, and highly nutritious. The croffle is crispy outside and soft inside, drizzled with maple syrup and served with vanilla ice cream\u2014a top choice for a morning energy boost.", "name": "TIFF (\ud2f0\ud504)", "transport": "Subway Lines 2/4/5 Dongdaemun History \u0026 Culture Park Station, Exit 6 (approx. 4-min walk)"}, {"address": "40 Changsin 12-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 Stars | Perched on the hills of Changsin-dong near Dongdaemun, this scenic cafe fuses traditional Korean ingredients with modern donuts and light meals. Highlights include the Corn Makgeolli (sweet rice wine) Donut and Kaesong Cornelian Cherry Donut\u2014crispy on the outside, soft on the inside, pleasantly chewy, and non-greasy. Panoramic glass windows offer sweeping views of the Dongdaemun shopping district and the N Seoul Tower skyline, ideal for a sunlit, lazy brunch.", "name": "Donut Jungsu - Changsin Branch (\ub3c4\ub11b\uc815\uc218 \ucc3d\uc2e0\uc810)", "transport": "Subway Lines 1/4 Dongdaemun Station, Exit 5 -\u003e Transfer to Jongno 03 local bus and get off at Naksan Intersection Station"}, {"address": "B2, DDP, 281 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.3 Stars | A renowned high-end specialty coffee chain inside DDP, famous throughout Korea for its rich organic milk soft-serve ice cream and premium espresso. Morning offerings include freshly baked Portuguese egg tarts with flaky crusts and pudding-smooth custard filling. Paired with their signature Spanish Latte, its silky, indulgent flavor makes for the perfect invigorating breakfast before a Dongdaemun shopping spree.", "name": "Paul Bassett - DDP Branch (\ud3f4\ubc14\uc14b DDP\uc810)", "transport": "Subway Lines 2/4/5 Dongdaemun History \u0026 Culture Park Station, Exit 1 (Direct underground connection)"}, {"address": "286-1 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.2 Stars | Tucked away in a Hanok alley near Dongdaemun, this cozy vintage-style cafe retains original traditional wooden beams and warm timber tones. It serves traditional handmade Korean sweets alongside freshly toasted butter toast\u2014golden and crispy outside, soft as cotton candy inside. Dipped in special red bean paste and salted butter, it delivers a rich balance of sweet and savory flavors, making it popular with visitors seeking a tranquil atmosphere.", "name": "Cafe Heunginjimun (\uce74\ud398 \ud765\uc778\uc9c0\ubb38)", "transport": "Subway Lines 1/4 Dongdaemun Station, Exit 6 (approx. 2-min walk)"}, {"address": "307 Toegye-ro, Jung-gu, Seoul", "feature": "\u2b50 4.5 Stars | Located near the Dongdaemun wholesale market, this stylish cafe attracts coffee aficionados with daily freshly baked French financiers and single-origin pour-over coffee. The signature Salted Caramel Financier features crisp edges, a soft interior, and rich brown butter (hazelnut) aroma. The subtly salty-sweet flavor pairs harmoniously with a brightly acidic light-roasted Ethiopian pour-over, offering the ultimate relaxing pit stop after shopping.", "name": "Sunburst (\uc120\ubc84\uc2a4\ud2b8)", "transport": "Subway Lines 2/4/5 Dongdaemun History \u0026 Culture Park Station, Exit 7 (approx. 3-min walk)"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "18 Jong-ro 40-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.5 Stars | One of the most iconic local traditional eateries in Dongdaemun, Seoul! A fresh, tender whole chicken is simmered in a boiling clear broth loaded with minced garlic, rice cakes, and potatoes. The chicken is incredibly juicy, while the broth is rich, naturally sweet, and packed with garlic and savory chicken essence. Connoisseurs create their own dipping sauce using house chili paste, vinegar, and soy sauce, and top it off by boiling handmade Kalguksu (knife-cut noodles) in the rich broth. Extremely popular with locals and tourists alike, drawing long queues during peak hours.", "name": "Jinokhwa Halmae Original Whole Chicken (\uc9c4\uc625\ud654\ud560\ub9e4\uc6d0\uc870\ub2ed\ud55c\ub9c8\ub9ac)", "transport": "Metro Line 1 or 4, Dongdaemun Station Exit 9, about a 5-minute walk."}, {"address": "29 Jong-ro 51-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.3 Stars | A super popular local gem located in Dongdaemun Changsin Market, famous for signature spicy pork trotters infused with intense charcoal aroma. Braised until soft and chewy, the pork trotters are sliced, slathered in a secret extra-spicy sauce, and grilled directly over charcoal. The skin gets delightfully charred and crispy, while the inside remains gelatinous and bouncy. Every bite offers smoky charred flavors followed by an explosive spicy kick. Best paired with a bowl of flying fish roe rice balls and chilled Makgeolli (rice wine)\u2014a favorite local after-work hangout spot!", "name": "Changsin-dong Spicy Pork Trotters (\ucc3d\uc2e0\ub3d9\ub9e4\uc6b4\uc871\ubc1c)", "transport": "Metro Line 1 or 6, Dongdaemun Station Exit 3, about a 3-minute walk into Changsin Market."}, {"address": "5 Jong-ro 40-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.2 Stars | A historic eatery tucked away in Dongdaemun\u0027s famous Grilled Fish Alley, renowned for freshly grilled fish cooked over traditional charcoal. Golden-crispy Spanish mackerel, mackerel, and cutlassfish line the shopfront, wafting irresistibly smoky aromas. The fish skin is crispy while the flesh remains tender, juicy, and lightly salted\u2014perfect when enhanced with a splash of lemon juice or soy sauce with mustard. Served with generous side dishes and hot Doenjang-jjigae (soybean paste stew), offering an authentic Seoul local dining experience.", "name": "Jeonju-jip Grilled Fish (\uc804\uc8fc\uc9d1)", "transport": "Metro Line 1, Dongdaemun Station Exit 9, about a 6-minute walk into Grilled Fish Alley."}, {"address": "31 Eulji-ro 43-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 Stars | A trendy beef gopchang (tripe/intestine) bistro that sparked a nation-wide craze after K-pop star Hwasa ate here. Sizzling on an iron griddle, fresh small intestines, abomasum, and beef heart are cooked right at your table\u2014complete with a dramatic blowtorch flamb\u00e9 show! The gopchang is crispy on the outside, creamy and rich inside without any unpleasant odor. Dip in custom curry powder or fruity sauces to balance the richness. Vibrant and lively with a classic Korean night-market vibe, it\u0027s the ultimate spot to experience Seoul\u0027s nightlife and beer culture.", "name": "Daehan Gopchang Dongdaemun (\ub300\ud55c\uacf1\ucc3d \ub3d9\ub300\ubb38\uc810)", "transport": "Metro Line 2, 4, or 5, Dongdaemun History \u0026 Culture Park Station Exit 14, about a 3-minute walk."}, {"address": "217-1 Toegye-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.1 Stars | A hidden gem located in an alleyway near Dongdaemun, famous for high-quality marinated pork and beef galbi (short ribs) soaked in a secret house sauce. Grilled over premium oak charcoal, the meat locks in juices, resulting in tender, succulent bites infused with a sweet, savory, and caramelized glaze. The nostalgic, authentic atmosphere draws local office workers for late-night drinks. Enjoying hot BBQ with cold Soju delivers the quintessential Korean pub experience.", "name": "Pyeongwon Charcoal BBQ Ribs (\ud3c9\uc6d0\uc22f\ubd88\uac08\ube44)", "transport": "Metro Line 2 or 4, Dongdaemun History \u0026 Culture Park Station Exit 8, about a 4-minute walk."}, {"address": "11F, JW Marriott Dongdaemun, 279 Cheonggyecheon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.6 Stars | A luxury rooftop lounge located on the top floor of JW Marriott Dongdaemun, offering stunning million-dollar night views of Heunginjimun Gate (Dongdaemun) and the Dongdaemun Design Plaza (DDP). The interior exudes elegant sophistication, serving creative Korean fusion cuisine, top-shelf whiskies, and signature cocktails inspired by traditional Korean ingredients. Enjoy refined dishes and live jazz while overlooking the dazzling city lights\u2014a perfect setting for a romantic and extravagant date night.", "name": "The Griffin Bar - JW Marriott Dongdaemun", "transport": "Metro Line 1 or 4, Dongdaemun Station Exit 8 direct access to hotel, take elevator to 11th floor."}, {"address": "200-4 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.4 Stars | A top-tier local dish restaurant specializing in Korean beef tartare (Yukhoe), located near the border of Dongdaemun and Gwangjang Market. Fresh daily-delivered native Hanwoo beef is julienned and tossed with sesame oil, garlic, and sesame seeds, topped with a raw egg yolk and crisp Korean pear strips. Mixing the rich egg yolk and juicy pear into the beef creates a silky, sweet bite with zero gameiness\u2014bursting with fresh savory flavor and crunch. They also serve live octopus (Sannakji) and Makgeolli, highly loved by local foodies.", "name": "Changsin Yukhoe (\ucc3d\uc2e0\uc721\ud68c)", "transport": "Metro Line 1, Jongno 5-ga Station Exit 7, about a 2-minute walk."}, {"address": "14 Jong-ro 40-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.3 Stars | A famous local traditional eatery located in Dongdaemun\u0027s Dak Han Mari Alley, highly favored by local food lovers. Sharing equal fame with Jinokhwa, its signature broth is slow-simmered with generous cabbage, green onions, and medicinal herbs, resulting in a sweet, clear, and flavorful soup. The chicken is soft and tender, pairing wonderfully with the spicy-tangy chive dipping sauce. After finishing the chicken, order handmade Kalguksu noodles to simmer in the broth, followed by rice and egg to make a savory chicken porridge topped with seaweed for an ultimate comforting meal.", "name": "Myeongdong Dak Han Mari Main Store (\uba85\ub3d9\ub2ed\ud55c\ub9c8\ub9ac \uc2dc\uc870\uc810)", "transport": "Metro Line 1, Dongdaemun Station Exit 9, about a 5-minute walk into Dak Han Mari Alley."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "2F, 2-1 Jibong-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc9c0\ubd09\ub85c 2-1 2\uce35)", "feature": "\u2b50 4.4 stars | A classic Nepalese and Indian restaurant near Dongdaemun Station, highly popular among vegetarians and local foodies alike. They offer an exceptionally rich menu of clearly labeled vegetarian curries, with special recommendations for the \u0027Chana Masala\u0027 (chickpea curry) and \u0027Dal Makhani\u0027 (lentil curry). The rich, spice-infused curries pair perfectly with freshly baked, tandoor-grilled naan that is crispy on the outside, soft on the inside, and lightly charred. Bursting with flavor in every bite, it offers rich, satisfying layers without feeling greasy\u2014an indispensable exotic plant-based feast in the Dongdaemun shopping district.", "name": "Everest Restaurant Dongdaemun", "transport": "Take Seoul Subway Line 1 or 4 to Dongdaemun Station, Exit 3, and walk for about 1 minute."}, {"address": "2F, 14 Changsin-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ucc3d\uc2e0\uae38 14 2\uce35)", "feature": "\u2b50 4.5 stars | One of the very few vegetarian-friendly restaurants in Korea featuring authentic Tibetan and Nepalese cuisine, offering an extensive meat-free and vegan menu. Their signature \u0027Veg Momo\u0027 (steamed dumplings) features a pleasantly chewy wrapper stuffed with juicy cabbage, minced veggies, and unique Tibetan spices. The comforting \u0027Veg Thukpa\u0027 (noodle soup) boasts a naturally sweet broth infused with mild pepper and aromatic vegetable flavors\u2014a bowl of this on a cold day warms you up completely. Its rich, exotic flavors leave a lasting impression.", "name": "Potala Tibetan Nepalese Restaurant Dongdaemun", "transport": "Take Seoul Subway Line 1 or 4 to Dongdaemun Station, Exit 1, and walk for about 2 minutes."}, {"address": "88 Changgyeonggung-ro, Jongno-gu, Seoul (Stall inside Gwangjang Market) (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ucc3d\uacbd\uad81\ub85c 88)", "feature": "\u2b50 4.3 stars | A classic vegetarian food stall inside Gwangjang Market, located right next to the Dongdaemun shopping district. A generous bowl topped with over a dozen fresh seasonal wild herbs, bracken, bellflower root, shiitake mushrooms, and bean sprouts, drizzled with fragrant freshly-pressed sesame oil and sweet-and-savory Korean chili paste. Mixing it all together delivers a crisp, satisfying texture from the wild greens paired with a rich sesame aroma. Bursting with fresh flavor and dietary fiber, it perfectly captures the simple, wholesome charm of traditional Korean market food.", "name": "Gwangjang Market Veggie Bibimbap", "transport": "Take Seoul Subway Line 1 to Jongno 5-ga Station, Exit 8, and walk for about 3 minutes into Gwangjang Market."}, {"address": "5 Jongno 32-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc885\ub85c32\uae38 5)", "feature": "\u2b50 4.2 stars | An ultra-popular traditional pancake spot located near the intersection of Dongdaemun and Gwangjang Market. The signature \u0027Mung Bean Pancake (Bindaetteok)\u0027 is made with freshly stone-ground mung bean paste mixed with plenty of crunchy bean sprouts and fried fresh to order (you can request a purely vegan mung bean version). Fried to a golden, crunchy perfection on the outside, it remains soft, fluffy, and aromatic on the inside. Dipped in the accompanying onion-vinegar soy sauce to cut through the richness, its crunchy-yet-tender texture earns rave reviews from tourists and locals alike.", "name": "Sunhee Ne Bindaetteok", "transport": "Take Seoul Subway Line 1 to Jongno 5-ga Station, Exit 7, and walk for about 2 minutes."}, {"address": "3F, 309 Jong-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc885\ub85c 309 3\uce35)", "feature": "\u2b50 4.6 stars | Highly rated by international travelers and vegetarians, this Indian restaurant clearly labels a variety of vegan and lacto-vegetarian options. Their \u0027Palak Paneer\u0027 (spinach cheese curry) and spiced veggie naan are exceptional; the smooth spinach puree features distinct, layered Indian spices that pair delightfully with fluffy Basmati rice for an appetizing, satisfying meal. Rich in exotic atmosphere, it\u0027s a great spot to relax and enjoy a plant-based meal after shopping.", "name": "Jyoti Indian Restaurant Dongdaemun", "transport": "Take Seoul Subway Line 1 or 4 to Dongdaemun Station, Exit 1, and walk for about 1 minute."}, {"address": "294 Jong-ro, Jongno-gu, Seoul (Street stalls around Dongdaemun Market) (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc885\ub85c 294)", "feature": "\u2b50 4.1 stars | An unmissable classic street snack while exploring the Dongdaemun shopping district! These mini vegetable kimbap rolls feature premium seaweed wrapped around sesame-oil-seasoned white rice, stuffed simply with pickled yellow radish, seasoned spinach, and shredded carrots\u2014100% vegan with no meat or eggs. Taking a bite releases a burst of savory seaweed and aromatic sesame oil, complemented by chewy rice and crunchy radish. Dipped in the signature slightly spicy yellow mustard sauce, it\u0027s refreshingly addictive, earning its name \u0027Mayak\u0027 (narcotic) because you simply can\u0027t stop eating it.", "name": "Dongdaemun Vegetable Mayak Kimbap", "transport": "Take Seoul Subway Line 1 or 4 to Dongdaemun Station, Exit 8; visible at the market street stalls right outside the exit."}, {"address": "307 Toegye-ro, Jung-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \ud1f4\uacc4\ub85c 307)", "feature": "\u2b50 4.3 stars | A cozy Korean eatery tucked away in the alleys of the Dongdaemun shopping district, specifically offering a \u0027Vegan Soft Tofu Stew\u0027 brewed with kelp and shiitake mushroom broth for plant-based diners. Silky, soft fresh tofu bubbles in a piping hot, vibrant red broth alongside enoki mushrooms, onions, and scallions. Smooth and comforting, it\u0027s mildly spicy and rich without being heavy on the stomach. Served with a bowl of fragrant purple rice and homemade vegan side dishes, it is the ultimate soul-warming traditional Korean plant-based meal for cold weather.", "name": "Han\u0027s Veggie Soft Tofu Stew Dongdaemun", "transport": "Take Seoul Subway Line 2, 4, or 5 to Dongdaemun History \u0026 Culture Park Station, Exit 6, and walk for about 4 minutes."}, {"address": "13 Eulji-ro 43-gil, Jung-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc911\uad6c \uc744\uc9c0\ub85c43\uae38 13)", "feature": "\u2b50 4.4 stars | A traditional Korean course meal (Hanjeongsik) restaurant focusing on wellness and healthy eating, located near Dongdaemun History \u0026 Culture Park. Centered around organic seasonal wild greens, they serve a beautifully presented \u0027Wild Green Veggie Set Menu\u0027. A full table spread includes steamed lotus root, pan-fried vegan tofu, various seasoned wild herbs, and vegan soybean paste stew (doenjang-jjigae). The natural sweetness and subtle herbal freshness of the ingredients shine through with rich layers of texture, offering a peaceful, wholesome taste of authentic Korean flavor amid the bustling Dongdaemun area.", "name": "Jinmi Veggie Hanjeongsik Dongdaemun", "transport": "Take Seoul Subway Line 2, 4, or 5 to Dongdaemun History \u0026 Culture Park Station, Exit 14, and walk for about 3 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "5 Jong-ro 32-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | A hugely popular bindaetteok (mung bean pancake) spot located inside Gwangjang Market near the Dongdaemun shopping district. The store uses freshly stone-ground mung bean batter mixed with bean sprouts and pork, frying them until golden brown and crispy on the outside with a dense, savory center rich in mung bean aroma. Crisp on the outside and warm and fluffy inside, dipping it into the accompanying onion soy-vinegar sauce cuts through the richness wonderfully. A classic street food beloved by tourists and locals alike.", "name": "Sunhee\u0027s Bindaetteok (\uc21c\ud76c\ub124\ube48\ub300\ub5a1)", "transport": "About a 2-minute walk from Exit 8 of Jongno 5-ga Station (Subway Line 1)"}, {"address": "403-5 Dongho-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.2 stars | An addictive classic market snack. These bite-sized seaweed rice rolls are stuffed with pickled yellow radish, carrots, and fragrant sesame oil-seasoned rice, then brushed with rich sesame oil and sprinkled with toasted sesame seeds. Supremely simple yet irresistibly tasty with crisp seaweed and chewy rice, the magic touch is dipping them in the special yellow mustard sauce\u2014its subtle spicy kick makes them impossible to stop eating.", "name": "Mother\u0027s Mini Kimbap / Mayak Kimbap (\ubaa8\ub140\uaf2c\ub9c8\ub9c8\uc57d\uae40\ubc25)", "transport": "About a 1-minute walk from Exit 8 of Jongno 5-ga Station (Subway Line 1)"}, {"address": "188 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.6 stars | A wildly popular street dessert that always draws long queues. Made and fried fresh on the spot, these glutinous rice twisted donuts have a crispy golden exterior and a cloud-like, fluffy, chewy interior. Dusting them fresh out of the fryer with cinnamon and fine sugar creates a perfectly balanced sweetness. An unmissable, budget-friendly treat after exploring the Dongdaemun shopping area.", "name": "Gwangjang Market Kkwabeogi / Glutinous Rice Twisted Donuts (\uad11\uc7a5\uc2dc\uc7a5 \ucc39\uc300\uaf48\ubc30\uae30)", "transport": "Right outside Exit 9 of Jongno 5-ga Station (Subway Line 1)"}, {"address": "279 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | A legendary street stall near Dongdaemun History \u0026 Culture Park Station, freshly handmade by a friendly grandfather. Thin, crispy crepes are slathered with a thick layer of Nutella, stuffed with sliced fresh bananas, strawberries, and a whole scoop of vanilla ice cream. Rich in layers with a warm-and-cool contrast, generous toppings, and satisfying sweetness, it\u0027s a huge favorite among young travelers and local students.", "name": "Dongdaemun Halbae Crepe (\ub3d9\ub300\ubb38 \ud560\uc544\ubc84\uc9c0 \ud06c\ub808\ud398)", "transport": "Right outside Exit 13 of Dongdaemun History \u0026 Culture Park Station (Subway Lines 2/4/5)"}, {"address": "200-4 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | A famous classic spot located in the Beef Tartare Alley of Gwangjang Market near Dongdaemun. Fresh Hanwoo beef is thinly shredded and served with sweet, juicy Korean pear strips and a raw egg yolk\u2014silky, naturally sweet, and without any gamey odor. Paired with live octopus chopped fresh to order, the suction cups bounce lively on your tongue, offering a fun, unique textural sensation. A must-try street delicacy for adventurous foodies!", "name": "Changsin Yukhoe (\ucc3d\uc2e0\uc721\ud68c)", "transport": "About a 2-minute walk from Exit 10 of Jongno 5-ga Station (Subway Line 1)"}, {"address": "21 Majang-ro 1-gil, Jung-gu, Seoul", "feature": "\u2b50 4.1 stars | A signature street snack frequently found in Dongdaemun\u0027s bustling nightlife shopping district. Chewy Korean rice cakes and thick blocks of grilling cheese are skewered alternately and pan-grilled until golden and melty. Crisp on the outside and soft inside, topped with sweet condensed milk and a hint of yellow mustard, it offers a perfectly savory-sweet, stretchy cheese fix to satisfy your late-night shopping cravings.", "name": "Dongdaemun Cheese \u0026 Rice Cake Skewer (\ub3d9\ub300\ubb38 \uce58\uc988\ub5a1\uaf2c\uce58)", "transport": "About a 5-minute walk from Exit 8 of Dongdaemun Station (Subway Lines 1/4)"}, {"address": "23 Jibong-ro 2-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | A famous queue-worthy restaurant tucked in Changsin Market near Dongdaemun. Pig trotters are braised in a secret house sauce and then charcoal-grilled, producing smoky, chewy skin packed with collagen and tender, juicy meat. Coated in an intensely spicy signature hot sauce, it delivers a punchy, satisfying heat with a deep charcoal aroma. Highly praised by local foodies who love bold flavors and spicy food.", "name": "Changsin-dong Spicy Pork Feet / Jokbal (\ucc3d\uc2e0\ub3d9 \ub9e4\uc6b4\uc871\ubc1c)", "transport": "About a 3-minute walk from Exit 3 of Dongmyo Station (Subway Lines 1/6)"}, {"address": "18-130 Eulji-ro 6-ga, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | The most popular comforting street dessert in Dongdaemun. Fresh glutinous rice dough is stuffed with brown sugar filling, shallow-fried until golden and crispy, then slit open and packed with a generous mix of sunflower seeds, peanuts, and pumpkin seeds. With a crispy outer shell, hot melted brown sugar syrup inside, and the nutty crunch of mixed seeds, it offers a wonderfully textured and charming snack.", "name": "Dongdaemun Seed Hotteok (\ub3d9\ub300\ubb38 \uc528\uc557\ud638\ub5a1)", "transport": "About a 3-minute walk from Exit 14 of Dongdaemun History \u0026 Culture Park Station (Subway Lines 2/4/5)"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Dongdaemun Shopping District"}, "gangnam_samseong": {"categories": {"cat_1": {"items": [{"address": "COEX Exhibition Hall Seoul Gate Entrance, 524 Bongeunsa-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 stars | A century-old iconic restaurant famous for its beef broth, renowned far and wide for its crystal-clear yet deeply flavorful Hanwoo Seolleongtang (ox bone soup) and Gomtang (beef bone soup). The broth is slow-simmered for hours using 100% premium Korean Hanwoo beef, resulting in a rich, naturally sweet flavor that isn\u0027t greasy at all. Paired with perfectly chewy white rice and special radish kimchi, every spoonful delivers the pure, warming aroma of beef. It is an indispensable Seoul classic beloved by local politicians, business leaders, and tourists alike.", "name": "Hadongkwan COEX Branch (\ud558\ub3d9\uad00 \uc0bc\uc131\ucf54\uc5d1\uc2a4\uc9c1\uc601\uc810)", "transport": "Subway Line 9 Bongeunsa Station Exit 7 (approx. 3-min walk) / Subway Line 2 Samseong Station Exit 5"}, {"address": "13 Yeongdong-daero 85-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 stars | A highly iconic classic hangover soup restaurant in the Samseong-dong area of Gangnam, renowned for its generous portions and rich, deep broth. Its signature Hanwoo Gopchang Haejangguk (beef offal hangover soup) and Gopchang Jeongol (beef intestine hot pot) feature top-tier Hanwoo offal delivered daily from Majang-dong Market. The boiling broth carries a subtle spiciness and a vibrant perilla leaf aroma. The clean, odor-free offal is pleasantly springy and absorbs the delicious broth, perfectly complemented by refreshing cabbage kimchi for a uniquely satisfying local feast.", "name": "Joongang Haejang (\uc911\uc559\ud574\uc7a5)", "transport": "Subway Line 2 Samseong Station Exit 2 (approx. 3-min walk)"}, {"address": "5 Bongeunsa-ro 108-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.2 stars | A legendary Seolleongtang institution with decades of history, best known for its ultra-rich, milky-white beef bone broth and astonishingly thick-cut beef brisket. The broth glides smoothly with natural savory and milky undertones. Served with sweet-and-sour cabbage and radish kimchi that brilliantly elevate the soup\u0027s sweetness, along with piles of fresh green onions available on every table. It is an ideal spot to immerse yourself in traditional Korean soup-and-rice culture.", "name": "Enamjang Samseong Branch (\uc774\ub0a8\uc7a5 \uc0bc\uc131\uc810)", "transport": "Subway Line 9 Bongeunsa Station Exit 5 (approx. 5-min walk) / Subway Line 2 Samseong Station Exit 7"}, {"address": "148 Gangnam-daero 101-gil, Seocho-gu, Seoul", "feature": "\u2b50 4.3 stars | A legendary 24-hour establishment near Sinsa and Nonhyeon in Gangnam, preserving the humble, vintage charm of old-school Korean eateries. The broth packs a deep, authentic ox bone flavor\u2014hearty and robust\u2014loaded with tender beef slices and wheat noodles. Local foodies swear by mixing in table-side radish kimchi juice and heaps of green onions for an extra tangy layer of flavor. Extremely popular among local taxi drivers and late-night diners, offering a truly authentic glimpse into Seoul\u0027s classic culinary life.", "name": "Yeongdong Seolleongtang (\uc601\ub3d9\uc124\ub801\ud0d5)", "transport": "Subway Line 3 / Shinbundang Line Sinsa Station Exit 4 (approx. 5-min walk)"}, {"address": "318 Dosan-daero, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 stars | An upscale traditional Korean restaurant operating since 1981, famous for its high-grade Hanwoo shabu-shabu and mushroom hot pot. Committed to using premium Hanwoo beef and fresh daily vegetable deliveries, the broth is crystal clear and naturally sweet. The thinly sliced Hanwoo beef is cooked to melt-in-your-mouth perfection, followed by a savory Korean rice porridge simmered in the concentrated broth essence to wrap up the meal. With refined, cozy classic decor and attentive table service, it is the premier choice for experiencing classic royal-style Korean hot pot flavors.", "name": "Hanwoori Nonhyeon Main Branch (\ud55c\uc6b0\ub9ac \ub17c\ud604\ubcf8\uc810)", "transport": "Suin-Bundang Line Apgujeong Rodeo Station Exit 5 (approx. 10-min walk)"}, {"address": "34 Nonhyeon-ro 152-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.2 stars | A highly celebrated restaurant in Gangnam specializing in traditional braised short ribs (Galbijjim) and Naengmyeon (cold noodles), heavily recommended on the popular TV show \u0027The Return of Superman\u0027. The signature Galbijjim comes in overwhelming portions, slow-cooked in a savory-sweet marinade until the beef effortlessly falls off the bone\u2014incredibly tender and collagen-rich. Pair it with house-made Hamheung-style cold broth or spicy mixed noodles for a refreshing contrast that leaves you completely satisfied.", "name": "Gangnam Myeonok Main Branch (\uac15\ub0a8\uba74\uc625 \ubcf8\uc810)", "transport": "Subway Line 3 Apgujeong Station Exit 3 (approx. 8-min walk)"}, {"address": "16 Nonhyeon-ro 131-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.1 stars | A multi-generational legendary institution serving authentic Pyeongyang-style cold noodles, revered as a holy grail by cold noodle aficionados. The broth appears clear as water, but a subtle sip reveals a delicately salted, deeply flavorful beef essence. The smooth buckwheat noodles have a hint of nutty grain aroma, complemented perfectly by plump traditional Korean steamed dumplings (Mandu) and sliced boiled pork (Suyuk), showcasing the pure elegance of Northern-style noodle craft.", "name": "Pyeongyang Myeonok Gangnam Branch (\ud3c9\uc591\uba74\uc625 \uac15\ub0a8\uc810)", "transport": "Subway Line 7 Hak-dong Station Exit 8 (approx. 3-min walk)"}, {"address": "B104, B1, COEX, 524 Bongeunsa-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 stars | A branch of the iconic Michelin Bib Gourmand restaurant beloved in Seoul since 1954, famous for Korean cold buckwheat noodles (Memil Soba) and traditional savory pancakes. The house-special bonito broth is chilled and sweet, perfectly harmonizing with springy buckwheat noodles topped with generous grated radish, mustard, and scallions. Made-to-order seafood pancakes and mung bean pancakes (Bindaetteok)\u2014crispy on the outside, tender on the inside\u2014are essential companion dishes on every table.", "name": "Gwanghwamun Mijin COEX Branch (\uad11\ud654\ubb38\ubbf8\uc9c4 \ucf54\uc5d1\uc2a4\uc810)", "transport": "Directly connected to COEX Mall from Subway Line 2 Samseong Station Exit 5 / Subway Line 9 Bongeunsa Station Exit 7"}], "name": "Iconic Local Classic Restaurants"}, "cat_2": {"items": [{"address": "142 Teheran-ro, Gangnam-gu, Seoul (\uc11c\uc6b8 \uac15\ub0a8\uad6c \ud14c\ud5e4\ub780\ub85c 142)", "feature": "\u2b50 4.4 stars | A top-tier brunch brand originally from Sydney, Australia, tucked away in a commercial building near Yeoksam Station in Gangnam. The signature \"Ricotta Hotcakes with Honeycomb Butter and Banana\" has an exceptionally soft, melt-in-your-mouth texture bursting with rich egg and caramel aromas, while the \"Avocado Toast\" is fresh and crisp. Featuring high ceilings, bright lighting, and modern decor, it attracts many Gangnam office workers and tourists looking to enjoy a relaxing morning.", "name": "Bills Gangnam", "transport": "About a 1-minute walk from Exit 3 of Yeoksam Station (Subway Line 2) (1st Floor of Arc Place Building)"}, {"address": "352 Gangnam-daero, Gangnam-gu, Seoul (\uc11c\uc6b8 \uac15\ub0a8\uad6c \uac15\ub0a8\ub300\ub85c 352)", "feature": "\u2b50 4.2 stars | A classic American brunch staple standing strong in the Gangnam shopping district, famous for its generous American platter breakfasts. Made-to-order towering American pancakes and French toast feature a lightly crispy exterior and fluffy interior. Drizzled with maple syrup and custom blueberry jam, it offers a smooth sweet-and-sour touch. Paired with savory bacon and scrambled eggs, the delicious sweet-and-salty blend leaves a lasting impression, making it a highly popular brunch spot in Gangnam.", "name": "Butter Finger Pancakes Gangnam", "transport": "About a 2-minute walk from Exit 4 of Gangnam Station (Subway Line 2 / Shinbundang Line)"}, {"address": "COEX Mall P103, 524 Bongeunsa-ro, Gangnam-gu, Seoul (\uc11c\uc6b8 \uac15\ub0a8\uad6c \ubd09\uc740\uc0ac\ub85c 524 \ucf54\uc5d1\uc2a4\ubab0 P103\ud638)", "feature": "\u2b50 4.3 stars | An iconic Korean brunch chain famous for its homemade fresh cheese and paninis. The most popular item, the \"Ricotta Cheese Salad\", is piled high with thick, soft Ricotta cheese boasting a delicate milky flavor, served alongside freshly baked artisanal cranberry bread for a rich and creamy bite. The \"Honey Cheese Camembert Panini\", hot-pressed to melty, gooey perfection, harmonizes deliciously with sweet honey\u2014crispy outside and soft inside. A must-try treat when shopping at COEX Mall.", "name": "Cafe Mamas COEX", "transport": "Connected directly inside COEX Mall from Exit 7 of Bongeunsa Station (Subway Line 9), about a 3-minute walk"}, {"address": "2F COEX Mall, 513 Yeongdong-daero, Gangnam-gu, Seoul (\uc11c\uc6b8 \uac15\ub0a8\uad6c \uc601\ub3d9\ub300\ub85c 513 \ucf54\uc5d1\uc2a4\ubab0 2\uce35)", "feature": "\u2b50 4.5 stars | Located on the 2nd floor of the COEX Starfield Library, this famous specialty coffee brand from Kyoto blends minimalist pure-white style with grand, soaring bookshelves. The must-order signature \"Spanish Latte\" uses in-house dark roasted coffee beans blended with condensed milk, resulting in a smooth, rich sip with lingering notes of nuts and dark chocolate, perfectly balancing milk and coffee aromas. Sip your coffee while overlooking the sweeping view of the library for a top-tier visual and taste experience.", "name": "% Arabica Seoul COEX", "transport": "Directly connected to COEX Mall from Exits 5 \u0026 6 of Samseong Station (Subway Line 2); located on the 2nd floor of Starfield Library"}, {"address": "B2 COEX Mall, 513 Yeongdong-daero, Gangnam-gu, Seoul (\uc11c\uc6b8 \uac15\ub0a8\uad6c \uc601\ub3d9\ub300\ub85c 513 \ucf54\uc5d1\uc2a4\ubab0 B2)", "feature": "\u2b50 4.3 stars | A sleek multi-concept cafe tucked away in the basement of COEX Megabox cinema. The spacious venue is filled with lush greenery and industrial vintage design. The menu offers a variety of specialty coffee craft drinks and fresh daily desserts, notably the \"Deep Latte\" and \"Tiramisu\". The tiramisu cake is moist and rich with espresso and mascarpone cheese flavors, perfectly sweet without being cloying. Dim, atmospheric lighting and versatile seating make it a fantastic spot to relax after shopping in Gangnam.", "name": "STEM Coffee COEX", "transport": "Walk into COEX Mall B2 from Exit 5 of Samseong Station (Subway Line 2); located next to the Megabox entrance"}, {"address": "1F COEX Mall, 524 Bongeunsa-ro, Gangnam-gu, Seoul (\uc11c\uc6b8 \uac15\ub0a8\uad6c \ubd09\uc740\uc0ac\ub85c 524 \ucf54\uc5d1\uc2a4\ubab0 1\uce35)", "feature": "\u2b50 4.2 stars | A legendary bakery brand originating from San Francisco, USA, taking the world by storm with its sourdough bread and French pastries. The signature \"Banana Cream Pie\" features exquisitely flaky crust layered with rich vanilla custard and fresh banana slices, offering balanced sweetness and rich textures. Their array of freshly made European sandwiches have a crispy crust and dense interior with subtle sourdough tang, making this the ultimate brunch pick for high-quality Western baked goods in the Samseong-dong area.", "name": "Tartine Bakery COEX", "transport": "Connected to COEX Mall 1st Floor from Exit 7 of Bongeunsa Station (Subway Line 9)"}, {"address": "34 Gangnam-daero 102-gil, Gangnam-gu, Seoul (\uc11c\uc6b8 \uac15\ub0a8\uad6c \uac15\ub0a8\ub300\ub85c102\uae38 34)", "feature": "\u2b50 4.4 stars | A massive, forest-themed wooden cafe tucked away in a quiet alley near Gangnam Station. It boasts a spacious basement level, two above-ground floors, and a lush outdoor garden. The signature desserts \"Handcrafted Cr\u00e8me Br\u00fbl\u00e9e\" and \"Chocolate Brownie\" are hugely popular. The brownie has a dense, rich texture paired with a scoop of vanilla ice cream, creating a delightful hot-and-cold contrast. With its spacious, laid-back vibe, it draws countless young people for afternoon tea and brunch.", "name": "Alver Cafe", "transport": "About a 7-minute walk from Exit 11 of Gangnam Station (Line 2), or a 5-minute walk from Exit 6 of Sinnonhyeon Station (Line 9 / Shinbundang Line)"}, {"address": "3F Kakao Friends, 429 Gangnam-daero, Gangnam-gu, Seoul (\uc11c\uc6b8 \uac15\ub0a8\uad6c \uac15\ub0a8\ub300\ub85c 429 \uce74\uce74\uc624\ud504\ub80c\uc988 \uac15\ub0a8\ud50c\ub798\uadf8\uc2ed 3\uce35)", "feature": "\u2b50 4.5 stars | A unique flagship store resulting from a collaboration between Korea\u0027s hottest artisanal donut brand and Kakao Friends. The signature \"Milk Cream Donut\" is golden-fried with a slightly crisp exterior dusted with fine sugar, filled to bursting with cloud-light, velvety custard cream. One bite releases a rich milky flavor that is surprisingly light and not overly sweet. Paired with adorable, creative brunch drinks and exclusive collab merchandise, it\u0027s a top choice in Gangnam for photo ops and visual sweet treats.", "name": "Cafe Knotted Gangnam Kakao Flagship", "transport": "About a 3-minute walk from Exit 10 of Gangnam Station (Subway Line 2), or a 4-minute walk from Exit 7 of Sinnonhyeon Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "22 Eonju-ro 168-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 Stars | A highly representative traditional Korean gastropub in Gangnam, housed in a standalone retro wooden building full of warm nostalgia. The menu features daily fresh-made artisanal Makgeolli (rice wine), paired with seafood pancakes that are crispy outside and tender inside, alongside signature Bossam (steamed pork belly). Each bite of the pancake crackles with rich seafood and scallion flavors, perfectly complemented by sweet, smooth rice wine\u2014a favorite among local Korean office workers and foreign tourists.", "name": "Mukjeon", "transport": "Approx. 8 mins walk from Exit 5 of Apgujeong Rodeo Station (Subway)"}, {"address": "13 Bongeunsa-ro 4-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 Stars | A trendy Korean gastropub tucked away in the alleyways near Gangnam Station, seamlessly blending traditional rice wine with modern cocktail culture. Their signature Green Grape Makgeolli and Strawberry Makgeolli feature a smooth, slushie-like texture packed with rich fruity aroma and zero bitterness. Must-try dishes include spicy Korean cheese chicken and slow-braised pork belly. Fiery spices and rich melted cheese dance on your tongue, refreshed by fruity rice wine\u2014making it a premier after-work spot for Gangnam\u0027s youth.", "name": "Muwol", "transport": "Approx. 4 mins walk from Exit 4 of Sinnonhyeon Station (Subway)"}, {"address": "7 Apgujeong-ro 50-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 Stars | A high-end traditional Korean bistro committed to using zero artificial seasonings, preserving the pure flavors of regional ingredients. The signature grilled Hanwoo beef and soybean paste stew are packed with flavor; the beef is perfectly aged to melt in your mouth with juicy sweetness. Offering a curated selection of fine wines and traditional Korean liquor pairings, its elegant and serene ambiance is beloved by gourmets who appreciate refined regional cuisine.", "name": "Gaehwaok", "transport": "Approx. 6 mins walk from Exit 6 of Apgujeong Rodeo Station (Subway)"}, {"address": "36 Teheran-ro 81-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.6 Stars | A Michelin-recommended Jeju black cattle specialty bistro located near COEX in Samseong-dong. Owning a private farm in Jeju, they air-freight premium black beef directly to Gangnam. The beef is finely marbled and firm; charcoal grilling releases an intensely savory flavor and sweet juices. Paired with house-made Jeju dipping sauces and premium traditional herbal liquors, it delivers an extraordinary Korean regional dining experience.", "name": "Boreumsoe", "transport": "Approx. 7 mins walk from Exit 5 of Samseong Station (Subway)"}, {"address": "7 Eonju-ro 107-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 Stars | An upscale cold noodle and Korean bistro showcasing authentic Pyongyang regional specialties. The signature Pyongyang Naengmyeon features a crystal-clear broth and smooth 100% buckwheat noodles with a subtle grain aroma. Paired with traditional Korean mung bean pancakes and boiled sliced beef, the meal is comforting, delicate, and deeply layered. Enjoyed with chilled Korean soju or rice wine, it offers a genuine taste of North Korean heritage amidst bustling Gangnam.", "name": "Neungra-do (Gangnam Branch)", "transport": "Approx. 6 mins walk from Exit 4 of Eonju Station (Subway)"}, {"address": "41 Gangnam-daero 152-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 Stars | A premier black pork bistro in Gangnam highlighting regional flavors from Jeju Island. Featuring thick-cut premium Jeju black pork belly and shoulder grilled over high charcoal heat, the meat achieves a golden, crispy exterior and juicy, springy bite. Dipped in signature Jeju anchovy sauce, rich savory notes explode on the palate. Paired with traditional Korean Yakju or craft beer, it is a favorite regional food haunt for business professionals and foodies.", "name": "Samdayeon", "transport": "Approx. 5 mins walk from Exit 8 of Sinsa Station (Subway)"}, {"address": "19 Dosan-daero 67-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.8 Stars | A 2-Michelin-starred modern Korean restaurant that seamlessly fuses traditional Korean artisan pastes (\u0027jang\u0027\u2014doenjang, gochujang, ganjang) with seasonal ingredients. The chef reinterprets regional dishes through innovative Western culinary techniques, creating thrilling visual and flavor experiences. Complete with refined drinks pairings featuring top-tier traditional Korean liquors and fine wines, it provides an unmatched fine dining experience in Gangnam.", "name": "Mingles", "transport": "Approx. 10 mins walk from Exit 3 of Apgujeong Rodeo Station (Subway)"}, {"address": "318 Dosan-daero, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 Stars | A iconic, high-end traditional Korean restaurant in Gangnam operating for decades, famous for authentic Hanwoo beef shabu-shabu and royal beef mushroom hot pot. Using top-tier Korean Hanwoo beef sliced paper-thin, the meat melts in your mouth after a quick dip in broth, creating a savory soup infused with fresh vegetable and beef aromas. Served with delicate Korean side dishes (banchan) and paired with premium Baekseju or raspberry wine, it embodies traditional noble hospitality.", "name": "Hanwoori (Main Branch)", "transport": "Approx. 10 mins walk from Exit 10 of Hak-dong Station (Subway)"}], "name": "Specialty Gastropubs \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "2F, 20, Gangnam-daero 102-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.6 stars | This Gangnam branch of Itaewon\u0027s hugely popular vegan restaurant serves 100% plant-based, egg-free, and dairy-free cuisine. The signature \u0027Vegan Cheeseburger\u0027 features a house-made soy protein patty, seared to perfection for a hearty and juicy bite, paired with rich plant-based cheese and custom sauce\u2014easily rivaling any traditional meat burger. Don\u0027t miss their moist, cinnamon-infused vegan carrot cake, a favorite lunch and afternoon tea spot for both tourists and local office workers.", "name": "PLANT Gangnam Branch", "transport": "Metro Line 2 / Shinbundang Line \u0027Gangnam Station\u0027 Exit 11, approx. 7-minute walk"}, {"address": "1F, 11, Hakdong-ro 25-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 stars | A wild American-style vegan fast food paradise, tailor-made for foodies who crave American fast food on a plant-based diet. The popular \u0027Classic Vegan Double Cheeseburger\u0027 uses high-quality pea protein patties, seared until caramelized on the outside while staying juicy inside, topped with melted vegan cheddar cheese and custom BBQ sauce for a savory, multi-layered bite. They also offer vegan boneless nuggets and silky plant-based milkshakes, earning praise from international visitors.", "name": "Style Vegan", "transport": "Metro Line 7 \u0027Hak-dong Station\u0027 Exit 4, approx. 5-minute walk"}, {"address": "21, Eonju-ro 164-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.7 stars | An upscale fine-dining restaurant dedicated to transforming traditional Chinese and Asian cuisine into exquisite plant-based dishes. The signature \u0027Vegan Sweet and Sour Pork\u0027 is crafted from premium shiitake mushrooms and soy protein, deep-fried to crisp perfection with a springy chew, coated in a sweet and sour secret sauce that redefines vegan dining. The \u0027Plant-Based Jajangmyeon\u0027 features rich, savory-sweet black bean sauce and chewy noodles. With its stylish and elegant vibe, it\u0027s ideal for business dinners and sophisticated dates.", "name": "ALT.A Dosan Branch", "transport": "Suin-Bundang Line \u0027Apgujeong Rodeo Station\u0027 Exit 5, approx. 10-minute walk"}, {"address": "69, Gangnam-daero 152-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 stars | A healthy Mediterranean-inspired plant-based restaurant famous for its colorful, balanced hummus bowls. The must-try \u0027Falafel Bowl\u0027 features golden falafel balls crisp on the outside and soft inside, infused with Mediterranean herbs and spices, served with silky smooth hummus, pita bread, and crisp greens. Bursting with flavor and texture, it offers a satisfying yet light meal\u2014a favorite among Gangnam\u0027s trendy locals and fitness enthusiasts.", "name": "Chick Peace Sinsa Gangnam Branch", "transport": "Metro Line 3 / Shinbundang Line \u0027Sinsa Station\u0027 Exit 8, approx. 5-minute walk"}, {"address": "28, Nonhyeon-ro 153-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.1 stars | A bright yellow cottage located near Garosu-gil, specializing in customizable vegan warm salads and turmeric rice bowls. The best-selling \u0027Mushroom and Tofu Warm Salad\u0027 features pan-seared golden tofu saut\u00e9ed with wild mushrooms, topped with nuts and a rich sesame dressing for a warm, fragrant, multi-layered dish. Healthy natural ingredients and friendly customizable options make it a must-visit for wellness-conscious travelers in Gangnam.", "name": "March Rabbit Salad", "transport": "Metro Line 3 \u0027Sinsa Station\u0027 Exit 8, approx. 8-minute walk"}, {"address": "35, Nonhyeon-ro 2-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 stars | A classic flagship location in Gangnam of Korea\u0027s long-established vegan brand, serving a wide variety of traditional Korean vegetarian fare and fusion dishes. Highly recommended is the \u0027Vegan Korean Perilla Seed Mushroom Soup with Rice,\u0027 featuring a velvety, fragrant broth simmered with perilla seeds and mixed mushrooms. The \u0027Vegan Korean Fried Chicken\u0027 uses soy protein to replicate a satisfyingly crispy bite coated in sweet and spicy sauce. Its cozy, homely atmosphere keeps local vegans coming back.", "name": "Loving Hut Gangnam Branch", "transport": "Metro Line 3 / Shinbundang Line \u0027Yangjae Station\u0027, transfer to Bus 4412 and get off at Gaepo-dong"}, {"address": "B1, Hyundai Department Store Trade Center Branch, 517 Teheran-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.2 stars | A vegan bakery located on B1 of Hyundai Department Store in COEX, completely free of eggs, milk, and butter. The signature \u0027Vegan Cream Red Bean Bun\u0027 uses plant-based rice cream and premium red bean paste; the cream is silky and light without being greasy, while the bread itself is naturally leavened, airy, and full of wheat flavor. It shatters the myth that egg- and dairy-free baked goods aren\u0027t delicious\u2014a high-quality sweet treat you shouldn\u0027t miss when shopping at COEX.", "name": "The Bread Blue Hyundai Department Store Trade Center Branch", "transport": "Metro Line 2 \u0027Samseong Station\u0027 Exit 5, direct underground connection to COEX / Hyundai Department Store B1"}, {"address": "B1, COEX Mall, 513 Yeongdong-daero, Gangnam-gu, Seoul", "feature": "\u2b50 4.0 stars | A popular healthy eatery inside COEX Mall offering nutritious vegan warm salads and high-fiber grain bowls tailored for busy city dwellers. The must-try \u0027Roasted Veggie \u0026 Chickpea Bowl\u0027 combines roasted pumpkin, bell peppers, and diced tofu, lightly caramelized for sweetness, served over red quinoa and ten-grain rice, dressed with a refreshing lemon vinaigrette. The texture of distinct grains blends beautifully with the tender roasted veggies, delivering a deeply satisfying, guilt-free meal.", "name": "Sweet Balance COEX Mall Branch", "transport": "Metro Line 9 \u0027Bongeunsa Station\u0027 Exit 7 or Metro Line 2 \u0027Samseong Station\u0027 Exit 6, enter COEX Mall B1"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Around 406 Gangnam-daero, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 stars | Located right near the busy Exit 10 of Gangnam Station, this classic Korean pojangmacha (street food stall) is a favorite after-work and after-school street food spot for office workers and students. The tteokbokki features a rich, sweet, and spicy sauce, while the rice cakes are extremely chewy and completely soaked in special sauce. Paired with golden, crispy deep-fried assorted snacks and piping hot, delicious fish cake broth, biting into a juicy fish cake skewer and taking a sip of hot soup on a cold winter day offers the most authentic flavor of Korean street food. Highly loved by both tourists and locals alike.", "name": "Gangnam Station Exit 10 Pojangmacha Food Stalls", "transport": "About a 1-minute walk from Exit 10 of Gangnam Station (Subway Line 2 or Shinbundang Line)"}, {"address": "396 Gangnam-daero, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 stars | A wildly popular Korean street hotdog chain that deep-fries hotdogs to a golden, crispy perfection and coats them in fine sugar, creating a wonderful blend of sweet and savory flavors. The most popular item, the \u0027Mozzarella Cheese Rice Hotdog\u0027, stretches into long threads of cheese with every bite. The outer rice flour batter is crispy and light, while the melted cheese inside is rich and smooth, followed by a juicy sausage at the bottom. The shop provides various self-serve sauces like yellow mustard, ketchup, and cheese powder, making it a top choice for a tasty street food snack while walking.", "name": "Myungrang Hotdog Gangnam Station Branch", "transport": "About a 2-minute walk from Exit 11 of Gangnam Station (Subway Line 2)"}, {"address": "B1, Starfield COEX Mall, 524 Bongeunsa-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 stars | A hugely popular artisanal Spanish churros specialty shop inside COEX Mall. Made fresh to order using a special five-grain dough, the churros are fried until extraordinarily crispy on the outside while remaining soft and chewy on the inside, then tossed in aromatic cinnamon sugar. Biting into one creates a satisfying crunch as cinnamon and grain flavors burst in your mouth. Pairing it with rich milk soft-serve ice cream is highly recommended; dipping hot, fresh churros into cold, silky ice cream creates an irresistible hot-and-cold contrast that keeps you coming back for more.", "name": "Street Churros Starfield COEX Branch", "transport": "Directly connected to Starfield COEX Mall from Exit 5 or 6 of Samseong Station (Subway Line 2)"}, {"address": "Around 101 Teheran-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.2 stars | A popular winter street food stall hidden on a corner in the Gangnam shopping district, identifiable from afar by the inviting aroma of sweet cake batter. These fish-shaped pastries (Bungeoppang) feature thin skin with generous fillings. The outer edges are fried as crispy as cookies, and for fillings, you can choose between traditional smooth red bean paste or rich, creamy custard. A bite into a hot, fresh one releases an explosion of creamy custard\u2014crispy on the outside, soft on the inside, pleasantly sweet without being cloying. It\u0027s a comforting winter street dessert loved by locals.", "name": "Gangnam Station Gold Bungeoppang Stall", "transport": "About a 1-minute walk from Exit 12 of Gangnam Station (Subway Line 2)"}, {"address": "22 Gangnam-daero 102-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.6 stars | An American street-style toast specialty shop that sparked the Korean toast craze. Thick-cut brioche bread is toasted on both sides with butter until golden and fragrant, stuffed with ultra-soft fluffy scrambled eggs and a signature sweet-and-spicy sauce. The flagship \u0027Bacon Double Cheese Toast\u0027 is crispy on the outside and tender inside, featuring melt-in-your-mouth eggs blended with savory bacon and melted cheese for an addictively delicious taste. Combining great looks with amazing flavor, it has become a trendy must-eat street breakfast and snack for global tourists visiting Gangnam.", "name": "EGG DROP Gangnam Main Store", "transport": "About a 5-minute walk from Exit 11 of Gangnam Station (Subway Line 2)"}, {"address": "3F, Kakao Friends, 429 Gangnam-daero, Gangnam-gu, Seoul", "feature": "\u2b50 4.7 stars | A phenomenal Korean dessert brand located inside the Kakao Friends Flagship Store. Its signature American-style donuts are dusted with fine sugar, offering a soft, pillowy, and delightfully chewy texture stuffed generously with light, non-greasy fresh milk cream or milk custard. From the very first bite, rich dairy aromas bloom in your mouth\u2014delicately sweet and silky smooth. Packaged in their iconic cute yellow smiley face boxes, it\u0027s the ultimate sweet treat for youths and tourists to enjoy while shopping.", "name": "Cafe Knotted Gangnam Kakao Branch", "transport": "About a 3-minute walk from Exit 10 of Gangnam Station (Subway Line 2)"}, {"address": "21 Bongeunsa-ro 4-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 stars | A trendy bakery that perfectly transforms traditional German pretzels into a hit Korean street snack. Baked using special techniques, the pretzel skin is lightly crispy with a subtle salty aroma, while the inside remains delightfully moist, chewy, and rich in wheat flavor. The \u0027Chive Cream Cheese Pretzel\u0027 in particular, spread generously with rich cream cheese and fresh scallions, stuns the taste buds with a sweet and savory harmony. Leaving a delightful aftertaste with every bite, it is currently one of the most talked-about gourmet street snacks in Gangnam.", "name": "BREADYPOST Gangnam Branch", "transport": "About a 4-minute walk from Exit 4 of Sinnonhyeon Station (Subway Line 9 or Shinbundang Line)"}, {"address": "14 Gangnam-daero 102-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 stars | A popular street food spot leading the Korean \u0027Croffle\u0027 (waffle-pressed croissant) craze. Premium French butter croissant dough is pressed in a waffle iron and coated with a layer of caramelized sugar, creating an extraordinarily loud, satisfying crunch with every bite while keeping the inner layers soft and flaky. Popular flavors like \u0027Brown Sugar Boba Croffle\u0027 and \u0027Vanilla Ice Cream Croffle\u0027 pair hot, freshly pressed crispy croffles with cool ice cream, delivering a rich interplay of textures that is simply irresistible.", "name": "Croffle House Gangnam Branch", "transport": "About a 6-minute walk from Exit 11 of Gangnam Station (Subway Line 2)"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Gangnam and Samseong COEX"}, "hongdae_yeonnam": {"categories": {"cat_1": {"items": [{"address": "5 World Cup buk-ro 2-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.3 stars | With decades of history, this classic Korean BBQ joint in Hongdae is a secret favorite among Hallyu stars and local foodies. They insist on using premium Hanwoo beef and fresh pork, grilled over traditional charcoal to achieve a smoky, crispy exterior while remaining juicy and tender inside. Paired with house-made special sauces and sweet-and-sour dips, the flavor of the meat is elevated to perfection. The nostalgic retro ambiance mirrors early Korean pubs, making it popular with both tourists and locals who love a lively, traditional vibe.", "name": "Chosun Hwaro Gu-i (\uc870\uc120\ud654\ub85c\uad6c\uc774)", "transport": "Approx. 3-minute walk from Exit 1 of Hongik Univ. Station (Subway Line 2)"}, {"address": "196 Yanghwa-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.4 stars | A staple in the Hongdae area for years, this traditional spot is famous for its rich and savory pork bone potato soup (gamjatang). Tender pork backbones are slow-cooked for hours until the meat falls off the bone at the touch of a chopstick, melting in your mouth with deep savory goodness. The broth features perilla seed powder, napa cabbage, and custom chili paste, delivering a mild kick balanced by nutty aromas and vegetable sweetness. Fluffy potatoes and chewy rice cakes soaked in the flavorful broth make this the ultimate traditional comfort food and hangover cure after Hongdae\u0027s nightlife.", "name": "Eodaejo Gamjatang (\uc774\ub300\uc870\ubf08\ub2e4\uadc0)", "transport": "Approx. 2-minute walk from Exit 2 of Hongik Univ. Station (Subway Line 2)"}, {"address": "56 Hongik-ro 6-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.2 stars | If you\u0027re craving authentic Busan-style pork soup with rice (Dwaeji Gukbap) in Seoul, this established Hongdae eatery is the top choice. The signature milky-white broth is simmered for hours, leaving no gamey taste and producing a smooth, hearty flavor. Thinly sliced, tender pork with just the right amount of fat combines perfectly with salted shrimp, chives, and spicy paste for layers of rich taste. Pouring piping-hot rice into the savory soup allows every grain to soak up the flavor\u2014a truly comforting meal loved by locals and travelers alike.", "name": "Donsoobaek Hongdae Branch (\ub3c8\uc218\ubc31 \ud64d\ub300\uc9c1\uc601\uc810)", "transport": "Approx. 3-minute walk from Exit 8 of Hongik Univ. Station (Subway Line 2)"}, {"address": "247 Seongsa-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.1 stars | Nestled in Yeonnam-dong, this 24-hour traditional institution has comforted locals through countless nights. The restaurant is renowned for its Korean boiled pork wraps (Bossam) and pork bone soup (Gamjatang). The pork belly is perfectly simmered\u2014juicy, tender, and not greasy at all. Wrapped with homemade sweet-and-spicy kimchi and salted shrimp, every bite offers a delightful crunch and richness. The warm, down-to-earth atmosphere captures the authentic charm of traditional Korean neighborhood dining.", "name": "Songgane Gamjatang Main Branch (\uc1a1\uac00\ub124\uac10\uc790\ud0d5)", "transport": "Approx. 10-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}, {"address": "31 Wausan-ro 21-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.3 stars | A hallmark Hongdae establishment famous for spicy stir-fried chicken (Dakgalbi) cooked in traditional cast-iron pans. Tender, boneless chicken thigh pieces are stir-fried on a hot plate alongside cabbage, rice cakes, and special chili paste until intensely aromatic. The two-cheese version is highly recommended\u2014melted mozzarella and cheddar pull into long strings, coating the spicy, savory chicken in a rich, creamy blend. Finishing the meal by frying rice and seaweed into cheese fried rice is an absolute classic.", "name": "Shin Mi Kyung Hongdae Dakgalbi (\uc2e0\ubbf8\uacbd\ud64d\ub300\ub2ed\uac08\ube44)", "transport": "Approx. 8-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "28 Yeonnam-ro 1-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.4 stars | Tucked away in the alleys of Yeonnam-dong, this local favorite specializes in traditional spicy braised chicken stew (Dak-dori-tang). Tender chicken chunks infuse their rich flavors into a vibrant, dark-red spicy broth bursting with garlic, chili heat, and subtle sweetness. Large potato pieces are cooked until melt-in-your-mouth soft. The chicken absorbs every drop of soup, making it irresistibly good with bowls of warm rice. Featured on numerous Korean food shows, it\u0027s a top gathering spot for local food lovers.", "name": "Choe Sajangne Dak (\ucd5c\uc0ac\uc7a5\ub124\ub2ed)", "transport": "Approx. 5-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}, {"address": "29 Hongik-ro 3-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.3 stars | A hugely popular Hongdae spot carrying over 30 years of traditional braising heritage. Selecting premium fresh pork hind legs, they braise them over long hours with over ten medicinal herbs and secret sauces. The skin turns an irresistible caramel hue\u2014rich in collagen, delightfully chewy, and completely odor-free\u2014while the lean meat stays moist and tender. The signature touch is the massive fresh garlic salad served alongside, whose tangy, zesty dressing perfectly cuts through the richness of the pork for a deliciously refreshed taste.", "name": "Myth Jokbal Hongdae Main Branch (\ubbf8\uc4f0\uc871\ubc1c \ud64d\ub300\ubcf8\uc810)", "transport": "Approx. 5-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "4-1 Yeonnam-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.2 stars | Tucked in a quiet Yeonnam-dong alley, this long-standing noodle house has been making hand-rolled noodles for decades. Their signature traditional knife-cut noodle soup (Kalguksu) features a rich chicken broth base that is savory, clean, and comforting. The chewy, springy handmade noodles are served with tender shredded chicken and plenty of scallions\u2014simple yet exceptionally delicious. Paired with house-made fresh, crunchy, and spicy kimchi, it creates a timeless comforting combination.", "name": "Yeonnam-dong Kalguksu (\uc5f0\ub0a8\ub3d9\uce7c\uad6d\uc218)", "transport": "Approx. 6-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}], "name": "Iconic Local Restaurants"}, "cat_2": {"items": [{"address": "223 Seongmisan-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.4 stars | A perfect blend of British vintage charm and exquisite desserts, filled with a display of freshly baked scones and chiffon cakes. The popular Earl Grey scone is crispy on the outside and dense inside, brimming with aroma when paired with rich spread and whipped cream. Accompanied by a cup of pour-over coffee, it is a dreamy, highly popular spot loved by tourists and trendsetters alike.", "name": "Cafe Layered Yeonnam", "transport": "Subway Line 2, Hongik Univ. Station, Exit 3, approx. 12 mins walk"}, {"address": "24 Seongmisan-ro 29-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.3 stars | Known for its unique minimalist industrial aesthetic and signature Black Sesame Cream Latte. The signature black sesame latte is exceptionally smooth, seamlessly blending rich sesame aromas with velvety foam into a perfectly sweet treat; the classic Truffle Croffle is crispy outside and soft inside, elegantly combining buttery pastry with truffle spread. A very popular and characterful cafe in Yeonnam-dong.", "name": "Cafe Jamjam", "transport": "Subway Line 2, Hongik Univ. Station, Exit 3, approx. 10 mins walk"}, {"address": "172 Seongmisan-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.5 stars | A sunny, cozy cottage cafe styled in warm Japanese cream tones, specializing in handmade lemon cakes and adorable cookies. The lemon cake is moist and soft, bursting with fresh sweet-and-sour lemon flavor and a delicate crunch of frosting. The brunch platter offers freshly toasted bread with homemade jam in a relaxed, leisurely atmosphere embraced by locals and travelers.", "name": "Caf\u00e9 Sk\u00f6n", "transport": "Subway Line 2, Hongik Univ. Station, Exit 3, approx. 14 mins walk"}, {"address": "161-10 Seongmisan-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.6 stars | Delights foodies with ultra-rich handmade butter sandwich cookies and Einsp\u00e4nner coffee. The signature caramel butter sandwich cookie features a crispy outer biscuit filled generously with caramel and fermented butter, melting delightfully in your mouth with rich sweet-and-savory layers. Paired with dark coffee topped with thick cream, it delivers an incomparable dessert experience.", "name": "Butter \u0026 Shelter", "transport": "Subway Line 2, Hongik Univ. Station, Exit 3, approx. 12 mins walk"}, {"address": "53 Donggyo-ro 23-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.5 stars | An iconic customizable healthy brunch cafe in Yeonnam-dong. Guests can freely assemble egg dishes, sausages, smoked salmon, avocado, and multi-grain breads. Toast is grilled crisp outside and soft inside, paired with rich avocado spread and silky scrambled or omelet eggs\u2014a flavorfully rich, balanced, and light meal highly praised by international travelers and healthy eaters.", "name": "Grain Seoul", "transport": "Subway Line 2, Hongik Univ. Station, Exit 1, approx. 8 mins walk"}, {"address": "161-7 Seongmisan-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.2 stars | Renowned for cute puppy-shaped meringue cookies and French baked goods. The handmade Maritozzo cream bun has a slightly crisp crust filled with velvety, light custard, perfectly balanced when enjoyed alongside a smooth cold brew coffee. The fresh, minimalist white Korean-style decor and charming plating ensure guests never stop taking photos.", "name": "Stamp Coffee", "transport": "Subway Line 2, Hongik Univ. Station, Exit 3, approx. 11 mins walk"}, {"address": "161-10 Seongmisan-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.3 stars | A surreal visual cafe that feels like stepping straight into a 2D black-and-white hand-drawn comic book world. The signature chocolate cheesecake looks impossibly realistic, boasting a silky, dense texture with deep chocolate aroma. Paired with a specialty matcha latte, its bittersweet flavor profile and stunning backdrop attract tourists from all over the world.", "name": "Greem Cafe", "transport": "Subway Line 2, Hongik Univ. Station, Exit 3, approx. 12 mins walk"}, {"address": "3 Dokmak-ro 9-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.4 stars | A relaxing brunch cafe enveloped in forest-like lush greenery. Slice into the signature Eggs Benedict to let the silky poached egg yolk flow over a crisp English muffin and rich Hollandaise sauce. Paired with a special avocado beef egg burger and fresh juice, it offers an ultimate cozy brunch retreat inside a tranquil urban oasis.", "name": "Urban Plant Hongdae", "transport": "Subway Line 6, Sangsu Station, Exit 1, 4 mins walk, or Hongik Univ. Station Exit 9, approx. 15 mins walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "327-9 Seogyo-dong, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc11c\uad50\ub3d9 327-9)", "feature": "\u2b50 4.6 Stars | Established in 1992, this long-standing traditional Korean pub seamlessly blends authentic Korean spirits with modern Korean cuisine. Offering over a hundred regional traditional liquors and rice wines (Makgeolli), its must-order signature is the \u0027Cheese Potato Pancake\u0027\u2014golden and crispy on the outside, packed with gooey melted cheese inside. Pair it with seasoned beef tartare (Yukhoe) or spicy stir-fried pig\u0027s trotters for rich, multi-layered flavors. It\u0027s a top choice for locals and tourists alike to experience Korea\u0027s vibrant late-night pub culture.", "name": "\uc0b0\uc6b8\ub9bc1992 (Sanwoolim 1992)", "transport": "About a 6-minute walk from Exit 6 of Hongik Univ. Station (Subway Line 2 / Gyeongui-Jungang Line / AREX)"}, {"address": "228-26 Yeonnam-dong, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc5f0\ub0a8\ub3d9 228-26)", "feature": "\u2b50 4.5 Stars | Nestled in an alley in Yeonnam-dong, this cozy Korean bistro focuses on refined, authentic home-cooked meals and regional specialties. The signature \u0027Spicy Braised Chicken Soup\u0027 features a rich, savory broth with a touch of sweetness, tender, flavorful chicken, and melt-in-your-mouth potatoes. The \u0027Soy Sauce Raw Shrimp\u0027 is plump, sweet, and perfectly fresh. Paired with hot rice topped with seaweed and cold Korean soju, every bite delivers warmth and homemade comfort.", "name": "\uc218\ub77c\uac04 (Surakan)", "transport": "About an 8-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}, {"address": "314-1 Sangsu-dong, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc0c1\uc218\ub3d9 314-1)", "feature": "\u2b50 4.4 Stars | Blending the rustic charm of traditional Gyeongju with modern vintage aesthetics, this cozy gastropub creates an atmospheric dining space accented with warm wood tones and a serene garden. Its specialty, the \u0027Korean Grilled Meat Platter\u0027, includes beef, pork belly, and lamb chops carefully grilled to seal in juiciness. Juicy and fragrant, it is served alongside a curated selection of side dishes and traditional Korean spirits. An exceptionally popular spot for date nights and friendly gatherings.", "name": "\uacbd\uc8fc\uc2dd\ub2f9 (Gyeongju Sikdang)", "transport": "About a 4-minute walk from Exit 1 of Sangsu Station (Subway Line 6), or a 12-minute walk fr
