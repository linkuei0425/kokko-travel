2014savory, rich, and utterly satisfying. Their vegan spinach and mushroom panini is crispy on the outside, tender inside, with oozing melted plant cheese that garners rave reviews. A must-visit for lovers of Western plant-based cuisine.", "name": "Chez Valerie", "transport": "Approx. 6-minute walk from Exit 2 of Seongsu Station (Subway Line 2)"}, {"address": "1F, 43 Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 Stars | A healthy vegan bakery that completely avoids flour, dairy, eggs, and refined sugar! The signature \u0027Vegan Matcha Tart\u0027 features a silky, dense filling akin to raw chocolate set in a crispy rice-flour crust, offering balanced sweetness and a rich tea flavor. The \u0027Vegan Tofu Scone\u0027 is pleasantly dense, moist, and chewy. It\u0027s a beloved spot for health-conscious foodies and those with dietary restrictions, making it the perfect dessert stop after a stroll in Seoul Forest.", "name": "Bbang Honest Seongsu", "transport": "Approx. 7-minute walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "1F, 24-8 Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.2 Stars | An iconic Korean bakery known for low-carb, gluten-free, and vegan cakes. A must-try is the \u0027Vegan Carrot Cake,\u0027 featuring a moist, soft crumb laced with aromatic cinnamon and crunchy chopped nuts, topped with light, guilt-free vegan frosting. They also offer savory vegan quiches and sugar-free desserts. Beautifully crafted and every bit as delicious as traditional sweets, it\u0027s a legendary dessert destination near Seoul Forest.", "name": "Sunny Bread Seongsu", "transport": "Approx. 5-minute walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "1F, 8-1 Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 Stars | A trendy plant-based brunch bar near Seoul Forest, specializing in exquisite vegetarian dishes crafted from fresh produce and whole foods. The signature \u0027Vegan Avocado \u0026 Herb Sourdough Toast\u0027 uses freshly toasted sourdough topped with creamy avocado and special plant cheese, offering refreshing, guilt-free, complex flavors. Combined with a stylish, greenery-filled aesthetic, it is immensely popular among design-loving and wellness-minded youth.", "name": "Pinch Brunch Bar", "transport": "Approx. 4-minute walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "1F, 101-1 Yeonmujang-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 Stars | A super rare 100% vegan doughnut shop in Seoul! Completely free of animal ingredients, they manage to create soft, fluffy, delightfully chewy, and moist doughnuts. The popular flavor \u0027Toasted Coconut Glazed Doughnut\u0027 features toasted, crispy coconut flakes and a perfectly balanced sweet glaze. Paired with a signature oat milk latte, every bite brings pure bliss\u2014an unmissable treat while wandering Seongsu-dong.", "name": "Overte Seongsu", "transport": "Approx. 8-minute walk from Exit 2 of Seongsu Station (Subway Line 2)"}, {"address": "2F, 33 Hallimmal-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 Stars | An Italian vegetarian restaurant centered around local produce and seasonal ingredients, where the chef masterfully transforms Korean fresh vegetables into stunning, gourmet Italian dishes. The signature \u0027Zucchini \u0026 Red Cabbage Vegan Lasagna\u0027 uses thinly sliced vegetables to wrap soy-milk cheese and fresh nut fillings, baked to juicy, savory perfection. Every bite celebrates the natural sweetness and vibrant aromas of fresh produce, making it a highly acclaimed vegetarian haven in the Seongsu area.", "name": "LocalEAT", "transport": "Approx. 3-minute walk from Exit 3 of Oksu Station (Subway Line 3) [Seongdong-gu Vegan Extended Area]"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "56-1 Yeonmujang-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 stars | One of the most eye-catching grab-and-go snacks in Seongsu-dong, baked fresh in limited daily batches. The freshly baked salt bread has a lightly salted outer crust, a crispy, slightly caramelized bottom, and a rich filling infused with premium French butter. Airy yet delightfully chewy and dense upon first bite, it is never greasy, making it the top choice for street food among tourists and local youth alike.", "name": "Jayeondo Salt Bread Seongsu (\uc790\uc5f0\ub3c4\uc18c\uae08\ube75)", "transport": "Approx. 5-min walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "46 Seongsuil-ro 8-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | A traditional food stall nestled on a corner in Seongsu-dong, serving hotteok (sweet Korean pancakes) fried fresh to order. The golden-brown crust is delightfully crispy, stuffed with melted cinnamon brown sugar syrup and aromatic crushed nuts. One bite releases hot, sweet syrup combined with chewy dough, offering a rich explosion of flavor that makes it a must-try nostalgic street dessert when exploring the Seongsu shopping district.", "name": "Seongsu Traditional Hotteok (\uc131\uc218\ub3d9 \uc804\ud1b5\ud638\ub5a1)", "transport": "Approx. 3-min walk from Exit 4 of Seongsu Station (Subway Line 2)"}, {"address": "54-1 Yeonmujang-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 stars | A popular snack shop taking American and European-style pretzels to the next level. The freshly made soft pretzels are wonderfully chewy and elastic, sprinkled with savory sea salt grains, and paired with rich options like scallion cream cheese or chocolate spread. Perfectly balancing sweet and salty with a satisfying texture, these stylish and tasty treats are one of Seongsu-dong\u0027s signature street bakery snacks.", "name": "Breadypost Seongsu (\ube0c\ub808\ub514\ud3ec\uc2a4\ud2b8)", "transport": "Approx. 6-min walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "17 Seongsuil-ro 6-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 stars | An immensely popular Korean bagel shop featuring bagels baked in wood-fired charcoal ovens. The bagels here have a slightly charred crust infused with a smoky wood flavor, while the inside is softer, moister, and springier than standard bagels. Their famous whipped cream bagel is packed with a thick layer of light, pure whipped cream, filling your mouth with a harmonious blend of rich dairy and freshly baked dough\u2014a top pick for strolling and picnicking around Seoul Forest.", "name": "Kokkiri Bagel Seongsu (\ucf54\ub07c\ub9ac\ubca0\uc774\uae00)", "transport": "Approx. 8-min walk from Exit 2 of Seongsu Station (Subway Line 2)"}, {"address": "300 Achasan-ro, Seongdong-gu, Seoul (Next to Exit 3 of Seongsu Station)", "feature": "\u2b50 4.2 stars | A classic street food tent (Pojangmacha) brimming with authentic everyday Korean street vibes. Highly recommended are the freshly fried Korean cheese rice hot dogs and piping-hot savory fishcake skewers. The hot dog is coated in diced potatoes, fried to a golden crunch, dusted with fine sugar, and drizzled with ketchup and yellow mustard\u2014delivering a satisfying cheese pull with every bite. Paired with a warm cup of complimentary delicious broth, it offers rich layers of flavor beloved by locals and travelers alike.", "name": "Seongsu Station Street Snack Bar (\uc131\uc218\uc5ed \ud3ec\uc7a5\ub9c8\ucc28)", "transport": "Right outside Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "19-8 Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 stars | A popular artisan bakery shop near Seoul Forest, famous for its mini milk cube bread. The palm-sized cube bread boasts an extraordinarily dense and tender texture, revealing silky strands as you pull it apart. Filled with chilled, rich custard cream or sweet chestnut paste, its slightly crisp outer crust and velvety filling make it a must-buy street dessert when heading out for a stroll or picnic in Seoul Forest.", "name": "Meal\u00b0 Seongsu Main Branch (\ubc00\ub3c4)", "transport": "Approx. 4-min walk from Exit 5 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "1F, 66 Seongsuil-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | A modern Korean ice cream dessert spot emphasizing exquisite textures and visual beauty. Made with premium fresh milk, the signature Sea Salt Seaweed Caramel Ice Cream features a silky-smooth texture, blending rich milkiness with bittersweet caramel and subtle salty sea salt. Topped with crunchy caramel chips, this cool, layered treat is a favorite stylish walk-and-eat ice cream for Seongsu-dong\u0027s trendy crowd during shopping breaks.", "name": "Gamdo Seongsu (\uac10\ub3c4)", "transport": "Approx. 5-min walk from Exit 3 of Seongsu Station (Subway Line 2)"}, {"address": "12 Seongsuil-ro 10-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 stars | A traditional tteokbokki stall tucked away in an old alley of Seongsu, renowned for its chewy rice cakes and signature sweet-and-spicy sauce. The rice cakes soak up the rich, perfectly balanced sauce, served alongside golden crisp vegetable tempura and seaweed glass noodle rolls (Gimmari). Soaking up the sauce to achieve an irresistibly tender-yet-crispy texture, it delivers an authentic taste of classic Korean street food.", "name": "Seongsu Golden Tteokbokki (\uc131\uc218 \ud669\uae08\ub5a1\ubcf6\uc774)", "transport": "Approx. 4-min walk from Exit 4 of Seongsu Station (Subway Line 2)"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Seongsu-dong and Seoul Forest"}};
        const themeHex = "#7e22ce";
        const cityName = "Seoul";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
