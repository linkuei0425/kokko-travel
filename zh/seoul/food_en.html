om Exit 9 of Hongik Univ. Station"}, {"address": "2F, 383-93 Yeonnam-dong, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc5f0\ub0a8\ub3d9 383-93 2\uce35)", "feature": "\u2b50 4.7 Stars | A hugely popular boutique Italian-Korean fusion bistro in Yeonnam-dong, offering an elegant and cozy atmosphere. Famous for set meals featuring a crispy-on-the-outside, tender-on-the-inside \u0027Aged Sirloin Steak\u0027 alongside a rich \u0027Pink Sauce Shrimp Pasta\u0027. The steak is sliced to reveal a perfect tender pink center, while the slightly spicy pink sauce perfectly balances rich creaminess with the sweetness of fresh shrimp. Paired with a glass of red wine, it\u0027s a top favorite among young diners.", "name": "\ube44\uc2a4\ud2b8\ub85c\uc5f0\ub0a8 (Bistro Yeonnam)", "transport": "About a 6-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}, {"address": "358-111 Seogyo-dong, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc11c\uad50\ub3d9 358-111)", "feature": "\u2b50 4.3 Stars | A lively Joseon-dynasty-themed tavern in the Hongdae area, famed for creative \u0027Fruit \u0026 Honey Makgeolli\u0027 and freshly fried Korean savory pancakes. The signature \u0027Peach Honeycomb Rice Wine\u0027 places a real piece of raw honeycomb straight into the pitcher, complementing the fruity, bubbly Makgeolli for a sweet, refreshing, and crisp taste. Pair it with crispy seafood scallion pancakes or kimchi cheese pancakes for an amazing explosion of savory, crunchy, and sweet flavors\u2014ideal for a fun group night out.", "name": "\uc870\uc120\uc8fc\ub9c9 (Joseon Jumak Hongdae)", "transport": "About a 5-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "227-20 Yeonnam-dong, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc5f0\ub0a8\ub3d9 227-20)", "feature": "\u2b50 4.6 Stars | Tucked away in a quiet alley of Yeonnam-dong, this stylish Korean fusion bistro serves imaginative bar snacks and signature cocktails. The highly acclaimed \u0027Creamy Seafood Tteokbokki\u0027 fuses traditional rice cakes with a rich French white cream sauce and succulent seafood, allowing chewy rice cakes to soak up all the delicious flavor. Pair it with a \u0027Yuzu Perilla Cocktail\u0027 crafted with a traditional Korean soju base; its sweet, tangy, and refreshing taste cuts through rich food effortlessly, making this a prime spot for an elegant night out in Yeonnam.", "name": "\uc5f0\ub0a8\ub9c8\uc2e4 (Yeonnam Masil)", "transport": "About a 10-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}, {"address": "357-3 Seogyo-dong, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc11c\uad50\ub3d9 357-3)", "feature": "\u2b50 4.5 Stars | A highly popular Korean BBQ gastropub in Hongdae, renowned for premium beef cuts and soybean paste stew widely acclaimed as the \u0027best in Seoul\u0027. The signature \u0027Premium Beef Platter\u0027 boasts beautifully marbled meat that melts in your mouth with smoky aromas after charcoal grilling. The accompanying or add-on \u0027Spicy Soybean Paste Stew\u0027, simmered with generous portions of beef brisket, is rich, spicy, and deeply flavorful. Paired with a chilled Korean beer, it offers pure culinary bliss.", "name": "\ub3c4\ub9c8 (Doma Hongdae)", "transport": "About a 6-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "241-48 Yeonnam-dong, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc5f0\ub0a8\ub3d9 241-48)", "feature": "\u2b50 4.8 Stars | A top-rated, upscale traditional Korean liquor bistro in Yeonnam-dong run by a professional sommelier. It specializes in additive-free traditional sakes and rice wines curated from microbreweries across South Korea. The seasonal menu features sophisticated hits like \u0027Cabbage Pork Rolls\u0027 and \u0027Pan-fried Tofu with House Meat Sauce\u0027. Paired with refreshing, slightly tart draft raw rice wines, it delivers a smooth, nuanced taste and an elegant deep dive into local Korean drink and food culture.", "name": "\uccad\uc8fc\ud55c\uc528 (Cheongju Hansi)", "transport": "About a 12-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}], "name": "Specialty Gastropubs \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "2F, 29 Wausan-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.6 Stars | Located in the heart of the Hongdae shopping district, this is one of Seoul\u0027s most beloved plant-based restaurants for both international tourists and local vegans. The signature cauliflower tacos and lentil burgers are stunning\u2014the burger patty is hearty and juicy, paired with house-made plant cheese sauce and fresh lettuce, delivering rich layers and robust flavor with every bite. Don\u0027t miss out on the red velvet cake and peanut butter chocolate cake from the dessert section; dense, moist, and perfectly sweet without being cloying, they completely shatter the stereotype that vegan desserts are dry.", "name": "PLANT Cafe Seoul Hongdae", "transport": "About an 8-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "153-13 Seongmisan-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.5 Stars | Tucked away in the hipster alleys of Yeonnam-dong, this cozy handmade vegan dessert studio specializes in 100% plant-based baking made without eggs, dairy, or refined sugar. Its signature brown rice cake and carrot cake are hugely popular; the cakes are dense with a subtle natural grain aroma, topped with nut-based plant whipped cream that is light, smooth, and guilt-free. Additionally, they offer small weekly batches of organic vegetable soups and ciabatta sandwiches, making it a top choice for a relaxing afternoon tea in Yeonnam-dong.", "name": "Cook \u0026 Book Vegan Bakery", "transport": "About a 12-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}, {"address": "16 Sinchon-ro 1-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.4 Stars | As one of Korea\u0027s most renowned vegan bakeries, this shop strictly avoids milk, eggs, butter, and any animal ingredients. The popular \u0027Salt Croissant\u0027 features a crispy exterior and a chewy, soft interior infused with an elegant plant butter aroma and a hint of saltiness; meanwhile, the \u0027Vegan Cream Bread\u0027 is filled with rich, velvety plant-based custard that melts in your mouth\u2014making it hard to believe it\u0027s entirely dairy- and egg-free. Their strict control over ingredients allows both lactose-intolerant individuals and strict vegans to indulge with peace of mind.", "name": "The Bread Blue (Hongdae Main Branch)", "transport": "About a 3-minute walk from Exit 6 of Hongik Univ. Station (Subway Line 2)"}, {"address": "30 Wausan-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.7 Stars | Subverting traditional perceptions of vegan food, this trendy American-style vegan bistro \u0026 bar features a lively, retro-punk ambiance, making it a great spot for evening gatherings with friends. The signature \u0027Vegan Lasagna\u0027 stacks rich tomato sauce and plant-based meat layers topped with mouthwatering vegan cheese, baked to golden, fragrant perfection. Another highlight, the \u0027Crispy Fried Chili Tofu\u0027, boasts a crunchy crust and tender inside, paired with a custom hot sauce for a satisfying crunch\u2014perfect alongside alcohol-free beer or house sparkling mocktails.", "name": "Drunken Vegan", "transport": "About a 4-minute walk from Exit 2 of Sangsu Station (Subway Line 6), or walkable from the Hongdae shopping district"}, {"address": "15 Yanghwa-ro 7-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.3 Stars | Located in the Hapjeong shopping district near Hongdae, this unique spot specializes in vegan bakery items and handmade vegan burgers. The most popular \u0027Black Bean \u0026 Mushroom Burger\u0027 uses house-baked sourdough buns stuffed with a thick, juicy black bean and mushroom patty alongside custom vegan mayo; every bite bursts with rich savory mushroom sweetness and grain aromas. Their egg-free, dairy-free burst-cream bread is another best-seller, light as a cloud and rivaling any traditional bakery.", "name": "Yummyommyom Vegan Bakery \u0026 Burger", "transport": "About a 3-minute walk from Exit 2 of Hapjeong Station (Subway Lines 2 \u0026 6)"}, {"address": "28 Seongmisan-ro 29-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.8 Stars | A Michelin Bib Gourmand-recommended dining destination delivering an exquisite plant-based experience just a short drive from Hongdae. The chef elevates local seasonal Korean vegetables, transforming humble ingredients like burdock root, lotus root, and pumpkin into artfully crafted rice bowls through delicate techniques. The signature \u0027Caramelized Peach and Roasted Burdock Rice Bowl\u0027 served with a special grain soup offers rich, layered textures where the rice absorbs the pure essence of vegetables\u2014refreshing, naturally sweet, and an ultimate luxury vegan feast for both the eyes and palette.", "name": "Base Is Nice", "transport": "About a 15-minute walk or short bus ride from Exit 3 of Hongik Univ. Station (Subway Line 2)"}, {"address": "29 Donggyo-ro 46-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.4 Stars | Tucked away in Yeonnam-dong, this San Francisco-style bakery is famous for its sourdough vegan bagels made through low-temperature fermentation with natural starter dough. Completely egg- and dairy-free, their bagels feature a golden-crisp exterior and a dense, pleasantly chewy interior that releases a delightful subtle sourdough wheat aroma as you chew. Highly recommended are the \u0027Cinnamon Raisin Bagel\u0027 and \u0027Whole Wheat Sesame Bagel\u0027, paired with their house-made tofu-based vegan cream cheese spread for a rich, smooth experience.", "name": "SF Bagel (Yeonnam-dong)", "transport": "About a 10-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}, {"address": "12 World Cup buk-ro 6-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.2 Stars | A cozy, homey vegan cafe near Hongdae dedicated to serving warm, healthy, and comforting plant-based dishes. Their signature \u0027Plant-Based Meat Brown Rice Gimbap\u0027 combines high-fiber brown rice with generous saut\u00e9ed vegetables and plant-based meat for a perfectly seasoned, refreshing crunch. Meanwhile, the \u0027Vegan Curry Risotto\u0027 is simmered with assorted vegetables and rich curry spices into a thick, velvety sauce that whets the appetite when served over hot rice. Friendly service and a warm wooden interior make it a remarkably relaxing spot.", "name": "Cafe Sun", "transport": "About a 6-minute walk from Exit 1 of Hongik Univ. Station (Subway Line 2)"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "102 Eoulmadang-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.5 stars | A classic representative of Seoul\u0027s popular street food. Freshly fried fermented rice flour dough produces an ultra-crispy crust that is lightly rolled in sugar and drizzled with yellow mustard and ketchup. Every bite delivers an irresistible crunch, opening up to stretchy mozzarella cheese and savory sausage inside. The addictive blend of sweet and savory makes it an essential grab-and-go snack in Hongdae.", "name": "Myungrang Hot Dog - Hongdae Branch", "transport": "Approx. 3-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "60 Eoulmadang-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.3 stars | A legendary Hongdae tteokbokki spot that originated as a humble street cart. The rice cakes are delightfully chewy and springy, perfectly absorbing a rich sauce simmered with Korean chili paste and stock that balances sweet and spicy notes with hints of fried tofu skin. Paired with crispy golden deep-fried bites and chewy sundae (blood sausage) dipped in the spicy sauce, it offers an authentic and comforting local taste.", "name": "Hongdae Jopok Tteokbokki", "transport": "Approx. 8-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "Hongik-ro 3-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.4 stars | A classic hotteok stall located near Hongdae\u0027s pedestrian street. Made fresh to order, the dough is pan-fried until golden with a light char. Crisp on the outside with a soft, chewy texture inside, biting in releases a hot lava center of melted brown sugar, crushed nuts, and cinnamon. Piping hot and sweetly satisfying, it\u0027s a comforting winter street dessert popular among tourists.", "name": "Hongdae Traditional Hotteok Stall", "transport": "Approx. 4-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "70 Eoulmadang-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.6 stars | An eye-catching twist on traditional hot dogs, coated with diced potato cubes and deep-fried to a golden crunch. The outer potato layer is crisp on the outside and soft inside like freshly cooked french fries, contrasting wonderfully with gooey stretchy cheese and juicy sausage. Dusted with cheese powder and custom sauces, it is one of Hongdae\u0027s most popular camera-ready street snacks.", "name": "Hongdae Gamja (Potato) Cheese Hot Dog", "transport": "Approx. 6-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "190 Seongmisan-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.5 stars | Tucked away in the hip alleys of Yeonnam-dong, this popular bungeoppang stall serves fish-shaped pastries with thin, crispy crusts baked fresh on the spot. Biting in reveals warm, smooth fillings\u2014the classic red bean is pleasantly sweet with whole bean textures, while the custard cream is rich and fragrant. Perfectly sized for walking and eating, it attracts trendy youth and tourists alike.", "name": "Yeonnam Mini Bungeoppang", "transport": "Approx. 10-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}, {"address": "Wausan-ro 21-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.2 stars | The source of the most tempting aroma along Hongdae\u0027s nightlife streets. Tender chunks of chicken thigh alternate with green onions on skewers, grilled over open flames to add a delicious charcoal smokiness. Juicy and savory, slathered in a signature sweet-and-spicy sauce or teriyaki glaze with a gentle kick, it is a top late-night street food pick for local youth.", "name": "Hongdae Flame-Grilled Chicken Skewers (Dakkochi)", "transport": "Approx. 5-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "30 Yanghwa-ro 23-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.4 stars | Freshly fried Spanish churros coated in aromatic cinnamon sugar offer a golden-crisp exterior and chewy center. Paired with rich, creamy milk soft-serve ice cream, the hot churros and cold ice cream create an exquisite play of textures and temperatures. Perfectly sweet without being overwhelming, it\u0027s a photo-worthy dessert to enjoy while strolling in Gyeongui Line Forest Park.", "name": "Yeonnam Street Churros \u0026 Ice Cream", "transport": "Approx. 3-minute walk from Exit 3 of Hongik Univ. Station (Subway Line 2)"}, {"address": "118 Eoulmadang-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.3 stars | An iconic nostalgic Korean street treat featuring a whole fresh egg baked right inside a lightly sweet, fluffy cake batter. Served warm, soft, and dense, every bite combines rich egg yolk with chewy egg white and creamy, sweet-savory flavors. Filling and soul-warming, it is an essential street food during chilly winters in Hongdae.", "name": "Hongdae Egg Bread (Gyeran-ppang)", "transport": "Approx. 2-minute walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Hongdae and Yeonnam-dong"}, "itaewon_hannam": {"categories": {"cat_1": {"items": [{"address": "73 Daesagwan-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | A historic 24-hour institution in Hannam-dong, famous for its rich and spicy pork bone broth. The pork spine is stewed to ultimate tenderness, effortlessly falling off the bone at the light touch of chopsticks. Served with plenty of glass noodles, perilla leaves, and velvety potatoes that absorb the savory broth, every bite is rich and deeply satisfying\u2014a quintessential late-night soul food beloved by locals and celebrities alike.", "name": "24-Hour Hannam-dong Gamjatang (24\uc2dc\ubf08\ub2e4\uadc0\uac10\uc790\ud0d5)", "transport": "About an 8-minute walk from Exit 1 of Hannam Station (Gyeongui-Jungang Line)"}, {"address": "38 Daesagwan-ro 34-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | A renowned traditional herbal roast chicken spot beloved by celebrities like Jun Ji-hyun and BTS. The skin is roasted to golden, aromatic perfection, while the meat inside remains remarkably tender and juicy. Stuffed with glutinous rice, ginseng, jujubes, and ginkgo nuts, the sticky rice absorbs all the flavorful chicken juices and herbal aromas. Crisp on the outside and tender on the inside, it offers an unforgettable, sweet-savory bite.", "name": "Hannam Hanbang Tongdak (\ud55c\ub0a8\ud55c\ubc29\ud1b5\ub2ed)", "transport": "About a 7-minute walk from Exit 1 of Hannam Station (Gyeongui-Jungang Line)"}, {"address": "2F, 245 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.2 stars | A decades-old staple in Hannam-dong and the birthplace of \u0027Johnson Tang\u0027 (a famous variation of army stew / Budae Jjigae), frequently featured on Korean dramas and food shows. Unlike typical army stews, this version is packed with cabbage, sausages, ham, and melted cheese. The broth trades harsh spiciness for a smooth, rich flavor elevated by the natural sweetness of cabbage and savory cheese, making it the perfect partner for a hot bowl of rice.", "name": "Bada Sikdang (\ubc14\ub2e4\uc2dd\ub2f9)", "transport": "About a 5-minute walk from Exit 1 of Hangangjin Station (Line 6)"}, {"address": "5 Bogwang-ro 59-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | An iconic handmade dumpling shop in Itaewon, awarded Michelin Bib Gourmand status for multiple consecutive years. Their signature half-cut pan-fried shrimp dumplings feature a lace-like, golden-crisp bottom while keeping the top delicate and chewy. Stuffed with juicy shrimp and pork, every bite bursts with piping-hot, flavorful broth for a delightful crunch-to-tenderness ratio.", "name": "Jonny Dumpling (\uc7c8\ub2c8\ub364\ud50c\ub9c1)", "transport": "About a 3-minute walk from Exit 4 of Itaewon Station (Line 6)"}, {"address": "235 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.1 stars | A long-standing traditional Korean table d\u0027h\u00f4te (Hanjeongsik) restaurant in Itaewon, decorated with cozy, rustic charm. The signature countryside set meal covers the table with over 20 authentic side dishes (banchan), including pickles, braised dishes, savory pancakes, and soybean paste stew. Offering a rich variety of classic flavors\u2014savory, sweet, spicy, and tangy\u2014it\u0027s an affordable way for travelers to experience comforting, authentic Korean home-style dining.", "name": "Sigol Babsang (\uc2dc\uace8\ubc25\uc0c1)", "transport": "About a 6-minute walk from Exit 1 of Hangangjin Station (Line 6)"}, {"address": "1 Usadan-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.0 stars | Famous as one of Seoul\u0027s top three spicy cold noodle spots, this historic eatery sits on the edge of Bogwang-dong and Itaewon. Renowned for its intensely spicy secret sauce, both the spicy cold broth noodles (Mul-naengmyeon) and spicy mixed noodles (Bibim-naengmyeon) feature chewy noodles served in refreshing, tangy broth with shredded cucumber. The icy sensation gives way to a fiery, exhilarating kick, perfectly balanced when paired with their piping-hot steamed giant dumplings.", "name": "Dong-A Naengmyeon (\ub3d9\uc544\ub0c9\uba74)", "transport": "About a 10-minute walk from Exit 3 of Itaewon Station (Line 6)"}, {"address": "48 Daesagwan-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.2 stars | A decades-old ox bone soup joint cherished by Hannam-dong locals, slow-simmering premium beef bones to create a rich, milky-white broth. Clean, savory, and completely free of gaminess, it features tender slices of beef. Mix in thin wheat noodles and steamed rice to soak up the comforting soup, then pair with house-made tangy cubed radish and cabbage kimchi\u2014an absolute top choice for authentic Korean nourishing comfort food.", "name": "Hannam Seolleongtang (\ud55c\ub0a8\uc124\ub801\ud0d5)", "transport": "About a 6-minute walk from Exit 1 of Hannam Station (Gyeongui-Jungang Line)"}, {"address": "6 Itaewon-ro 19-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | A staple traditional Korean barbecue spot in the heart of Itaewon, celebrated for its marinated soy-pork ribs and premium Hanwoo beef. The ribs are marinated in a special fruit-infused sauce and grilled over charcoal until caramelized with a glossy finish. Juicy, smoky, and deeply flavorful, wrap the tender meat in fresh lettuce with garlic slices and ssamjang sauce for a rich, delightfully sweet-and-savory bite that highlights classic K-BBQ charm.", "name": "Itaewon Charcoal BBQ (\uc774\ud0dc\uc6d0\uc22f\ubd88\uac08\ube44)", "transport": "About a 4-minute walk from Exit 1 of Itaewon Station (Line 6)"}], "name": "Iconic Local Traditional Eateries"}, "cat_2": {"items": [{"address": "49 Itaewon-ro 55-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c55\uae38 49)", "feature": "\u2b50 4.6 Stars | An iconic Australian brunch spot in the Itaewon and Hannam-dong area, immensely popular among both foreign tourists and local youth. The signature Avocado \u0026 Shrimp Poached Egg Toast offers rich, flavorful layers\u2014crispy toasted bread topped with smooth mashed avocado, sweet plump white shrimp, and rich hollandaise sauce, delivering a bright, garden-fresh flavor in every bite. Featuring excellent natural light and a modern aesthetic, it frequently has a long queue.", "name": "Summer Lane (\uc378\uba38\ub808\uc778)", "transport": "Subway Line 6 Hangangjin Station, Exit 1, approx. 8-minute walk"}, {"address": "30 Itaewon-ro 45-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c45\uae38 30)", "feature": "\u2b50 4.4 Stars | Tucked away in a quiet alley of Hannam-dong, this garden-style upscale brunch spot offers a warm and elegant European home atmosphere. Its Eggs Benedict and American pancakes are absolute must-try signatures; slice into the poached egg to watch golden yolk flow over special smoked salmon or ham. The French toast features a lightly caramelized golden crust and a custard-soft interior that melts in your mouth with maple syrup, making it a favorite among local socialites.", "name": "Oasis Hannam (\uc624\uc544\uc2dc\uc2a4 \ud55c\ub0a8)", "transport": "Subway Line 6 Hangangjin Station, Exit 1, approx. 7-minute walk"}, {"address": "272 Itaewon-ro, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c 272)", "feature": "\u2b50 4.5 Stars | Located next to Hangangjin Station, this ultimate luxury dessert and bakery temple resembles a modern art museum from the outside. It brings together exquisite French pastries, artisanal breads, and high-end brunch offerings. The signature strawberry mille-feuille and whipped cream chiffon cake feature delicate textures\u2014the cream is rich yet light and not overly sweet, while the pastry is distinctly crisp and buttery. A visually stunning feast for the senses that you cannot miss when visiting Hannam-dong.", "name": "Passion 5 (\ud328\uc1585)", "transport": "Subway Line 6 Hangangjin Station, Exit 3, approx. 1-minute walk"}, {"address": "230-1 Itaewon-ro, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c 230-1)", "feature": "\u2b50 4.3 Stars | A trendy, Instagram-worthy brunch spot inspired by Manhattan, New York, known for stunning colorful presentations and fantastic flavors. The signature Avocado Salmon Burger replaces traditional buns with halves of fresh avocado, stuffed with thick salmon and custom sauce for a refreshingly creamy bite. The Basil Pesto Clam Pasta and Pesto Avocado Toast are equally impressive, featuring rich sauces that cling perfectly to every noodle.", "name": "Little Neck Hannam (\ub9ac\ud2c0\ub125 \ud55c\ub0a8)", "transport": "Subway Line 6 Hangangjin Station, Exit 3, approx. 5-minute walk"}, {"address": "24 Itaewon-ro 49-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c49\uae38 24)", "feature": "\u2b50 4.4 Stars | A minimalist lifestyle space combining curated items and premium coffee, exclusively serving beans from Berlin\u0027s renowned Bonanza Coffee. Their single-origin pour-overs are clean and complex, boasting bright acidity and subtle floral notes. Signature pound cakes and French cannel\u00e9s are crispy outside and soft inside, with balanced matcha and vanilla flavors that pair seamlessly with custom oat milk lattes. Soulful vinyl records play regularly, creating Hannam-dong\u0027s signature chic, slow-paced atmosphere.", "name": "mtl Hannam (mtl \ud55c\ub0a8)", "transport": "Subway Line 6 Hangangjin Station, Exit 1, approx. 9-minute walk"}, {"address": "240 Itaewon-ro, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c 240)", "feature": "\u2b50 4.3 Stars | A famous specialty roastery chain that seamlessly blends industrial aesthetics with lush greenery. The spacious, airy layout is filled with the rich aroma of freshly roasted beans. The latte made with their signature \u0027William Blake\u0027 blend offers a silky-smooth texture with deep notes of dark chocolate and nuts. Paired with house-baked, dense cheesecake that rich-melts on the tongue, it is a top pick for coffee enthusiasts spending a lazy afternoon.", "name": "Anthracite Coffee Hannam (\uc564\ud2b8\ub7ec\uc0ac\uc774\ud2b8 \ud55c\ub0a8)", "transport": "Subway Line 6 Hangangjin Station, Exit 3, approx. 5-minute walk"}, {"address": "24 Hannam-daero 20-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \ud55c\ub0a8\ub300\ub85c20\uae38 24)", "feature": "\u2b50 4.4 Stars | The Korean flagship store of San Francisco\u0027s legendary sourdough bakery, housed in a double-height glass house filled with beautiful natural light. The signature sourdough features a crackly, golden crust and a pleasantly chewy, tangy interior. Toasted sandwiches loaded with thick-cut herb ham and gooey, melted cheese are deeply satisfying. Additionally, the banana cream pie boasts an exceptionally flaky crust and perfectly balanced filling, drawing foodies from all over.", "name": "Tartine Bakery Hannam (\ud0c0\ub974\ud2f4\ubca0\uc774\ucee4\ub9ac \ud55c\ub0a8)", "transport": "Gyeongui-Jungang Line Hannam Station, Exit 1, approx. 10-minute walk"}, {"address": "47 Itaewon-ro 55-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c55\uae38 47)", "feature": "\u2b50 4.5 Stars | A trendy restaurant combining modern Asian bistro flair with classic cafe brunching. Its standout crowd-pleaser, the \u0027Katsu Sando\u0027 (Thick-cut Pork Cutlet Sandwich), features ultra-thick, juicy pork loin fried to golden perfection while staying tender pink inside, served between toasted milk bread with special sauce. Paired with curated cold brew coffee or milk tea, it offers one of Hannam-dong\u0027s most innovative brunch experiences.", "name": "Dotz (\ub2f7\uce20)", "transport": "Subway Line 6 Hangangjin Station, Exit 1, approx. 7-minute walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "26-5 Itaewon-ro 55-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c55\uae38 26-5)", "feature": "\u2b50 4.4 Stars | Tucked away in a quiet alleyway of Hannam-dong, Parc serves healthy, modern Korean home-style cooking with no added MSG. It presents traditional home-cooked recipes from Korean mothers in a sophisticated bistro setting. Signature dishes like grilled black pork and spicy stir-fried octopus offer tender textures and rich sauces. Paired with a curated selection of traditional Korean makgeolli or craft beer, it\u0027s the perfect spot to experience modern Korean food culture.", "name": "Parc Home-style Korean Bistro (Parc Hannam)", "transport": "Subway Line 6, Hannam Station Exit 1, approx. 8 mins walk"}, {"address": "245 Itaewon-ro, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c 245)", "feature": "\u2b50 4.3 Stars | A legendary, classic local Korean eatery located on the border between Itaewon and Hannam-dong, famous for its paper-thin frozen pork belly (samgyeopsal) and rich Cheonggukjang (fermented soybean stew). The pork belly is grilled to golden perfection on a flat top, then wrapped with spicy seasoned scallions for a burst of savory flavor balanced by tangy spice. A wildly popular hot spot for both local celebrities and tourists alike.", "name": "Nari\u0027s House (Nari\u0027s House / \ub098\ub9ac\uc758\uc9d1)", "transport": "Subway Line 6, Hangangjin Station Exit 1, approx. 5 mins walk"}, {"address": "1 Itaewon-ro 15-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c15\uae38 1)", "feature": "\u2b50 4.5 Stars | Itaewon\u0027s most iconic Ko-Mex fusion bistro, pioneering the fusion of Korean kimchi and marinated meats with Mexican tacos and quesadillas. Their signature \u0027Kimchi Carnitas Fries\u0027 feature crispy French fries topped with melted cheese and saut\u00e9ed kimchi, offering rich layers of texture. Paired with their signature Corona Rita, the lively ambiance makes it a vibrant dining destination.", "name": "VATOS Korean-Mexican Fusion Bistro (Vatos Urban Tacos Itaewon)", "transport": "Subway Line 6, Itaewon Station Exit 1, approx. 3 mins walk"}, {"address": "2F, 47 Hannam-daero 20-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \ud55c\ub0a8\ub300\ub85c20\uae38 47 2\uce35)", "feature": "\u2b50 4.6 Stars | A Michelin Bib Gourmand upscale Italian bistro in Hannam-dong boasting a romantic and elegant ambiance. The signature Beef Tartare and fresh White Ragu Pasta offer exquisitely delicate flavors. The raw beef combines truffle aromas with crispy bread, paired wonderfully with red wine curated by an in-house sommelier\u2014making it one of the most popular romantic date spots in Hannam-dong.", "name": "Osteria Orzo Italian Bistro (Osteria Orzo)", "transport": "Gyeongui-Jungang Line, Hannam Station Exit 1, approx. 9 mins walk"}, {"address": "1F, 4 Itaewon-ro 45-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c45\uae38 4 1\uce35)", "feature": "\u2b50 4.5 Stars | A modern Korean bistro situated in a sleek, minimalist space in Hannam-dong. Ingeniously utilizing seasonal local Korean ingredients, it offers savory tapas perfect for drinking, such as Hanwoo beef patties, mildly spicy grilled black pork, and seafood pancakes. The food presentation is artfully exquisite, the meats tender and juicy, paired with traditional Korean soju to showcase a sophisticated new Korean culinary style.", "name": "Gongi Modern Korean Bistro (Gongi / \uacf5\uc774)", "transport": "Subway Line 6, Hangangjin Station Exit 1, approx. 6 mins walk"}, {"address": "1F, 47 Itaewon-ro 55-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c55\uae38 47 1\uce35)", "feature": "\u2b50 4.4 Stars | A trendy bistro in Hannam-dong cleverly blending Chinese, Japanese, and Southeast Asian flavors. A must-order is the \u0027Katsu Sando,\u0027 featuring crispy toast and a thick, juicy, tender pork cutlet. Paired with custom cocktails and chic, hip decor, its trendy ambiance makes it an extraordinarily popular spot that\u0027s always fully booked.", "name": "DOTZ Asian Fusion Bistro (DOTZ)", "transport": "Subway Line 6, Hangangjin Station Exit 1, approx. 7 mins walk"}, {"address": "235 Itaewon-ro, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c 235)", "feature": "\u2b50 4.1 Stars | A long-standing traditional Korean restaurant in Itaewon, famous for its table-filling \u0027Jeolla-do style side dish feast.\u0027 Ordering a main dish comes with over twenty traditional side dishes (banchan), ranging from braised radish and steamed egg to various seasoned wild greens. Offering rich and diverse flavors, it gives diners a cozy, satisfying feeling as if visiting a rustic country home in Korea.", "name": "Sigol Bapsang Rural Table (Sigol Bapsang / \uc2dc\uace8\ubc25\uc0c1)", "transport": "Subway Line 6, Hangangjin Station Exit 1, approx. 6 mins walk"}, {"address": "B1, 16 Itaewon-ro 19-gil, Yongsan-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc6a9\uc0b0\uad6c \uc774\ud0dc\uc6d0\ub85c19\uae38 16 \uc9c0\ud5581\uce35)", "feature": "\u2b50 4.5 Stars | A premier Japanese yakitori bistro located in a cozy basement along an Itaewon alley, featuring live charcoal grilling over Binchotan. The grilled chicken skewers boast a smoky, crispy skin with tender, juicy meat, while their signature beef intestine skewers are delightfully savory and rich. Paired with an ice-cold highball, the warm, buzzing izakaya vibe lets you truly unwind.", "name": "GOU Itaewon Japanese Yakitori Bistro (Gou Itaewon / \uace0\uc6b0)", "transport": "Subway Line 6, Itaewon Station Exit 1, approx. 3 mins walk"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "2F, 20 Itaewon-ro 16-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 Stars | One of Seoul\u0027s most iconic vegan restaurants, famous for its rich and hearty Western-style plant-based dishes. Highly recommended are their \u0027Vegan Cheeseburger\u0027 and \u0027Hummus Salad Bowl\u0027. The burger patty is made from plant protein and mushrooms, seared until lightly charred on the outside, paired with special vegan cheese and fresh vegetables for a dense, juicy bite that completely transforms stereotypes about veg burgers. Their vegan red velvet cake and peanut butter chocolate cake are absolute favorites among dessert lovers, featuring a dense, fluffy texture that isn\u0027t overly sweet\u2014attracting countless tourists and local expats.", "name": "Plant Itaewon", "transport": "Subway Line 6 Itaewon Station, Exit 4, approx. 3-minute walk"}, {"address": "3-4F, 228-1 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.6 Stars | An upscale vegan bistro tucked away in the alleys of Itaewon, featuring elegant decor with a dark vintage atmosphere. It incorporates vegan concepts into fine French and Italian cuisine. The signature \u0027Vegan Beef Wellington\u0027 layers organic mushrooms and plant-based meat inside a crispy pastry crust, releasing a rich aroma and complex layers when sliced. The \u0027Pink Sauce Pasta\u0027 uses nut milk to create a rich, velvety sauce with an amazingly smooth texture\u2014perfect for foodies who appreciate a romantic ambiance and exquisite plant-based dining.", "name": "Monk\u0027s Butcher", "transport": "Subway Line 6 Hangangjin Station, Exit 3, approx. 5-minute walk"}, {"address": "1F, 19 Itaewon-ro 54-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.7 Stars | Located in the trendy Hannam-dong district, this is a rare 100% plant-based modern Chinese restaurant in Korea. The kitchen cleverly uses meat substitutes and tofu to recreate the essence of traditional Chinese cuisine. The must-order \u0027Plant-Based Sweet and Sour Pork\u0027 has an exceptionally crispy exterior and chewy interior, tossed in a rich sweet-and-sour sauce with a texture virtually indistinguishable from real meat. The \u0027Mapo Tofu\u0027 features Sichuan pepper and plant-based minced meat for a numbingly spicy, fragrant, and smooth finish that pairs perfectly with rice, combining trendy decor with mind-blowing flavor.", "name": "Alt.a Hannam", "transport": "Subway Line 6 Hangangjin Station, Exit 1, approx. 6-minute walk"}, {"address": "85 Hoenamu-ro 40-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 Stars | Designed by a renowned spatial design team, this botanical-themed vegan restaurant is located near Gyeongnidan-gil. Surrounded by lush greenery, the entire building feels like a cozy tropical greenhouse. The signature dish, \u0027Basil Pesto Roasted Vegetable Risotto\u0027, uses carefully selected organic brown rice paired with rich homemade basil pesto and colorful roasted seasonal veggies. Each grain absorbs the natural sweetness of the vegetables for a textured, multi-layered flavor. The \u0027Vegan Cashew Soup\u0027 is silky and dense with a natural nutty aroma, making it a favorite among hipsters and health-conscious diners.", "name": "Lazy Farmers", "transport": "Subway Line 6 Noksapyeong Station, Exit 2, transfer to Green Village Bus Yongsan 03 to Gyeongnidan-gil stop, approx. 5-minute walk"}, {"address": "1F, 59 Sinheung-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 Stars | A cozy vegan bistro located on the slopes of Haebangchon (HBC), renowned for light, guilt-free international dishes made without animal ingredients. The signature \u0027Vegetus Special Burger\u0027 uses homemade patties crafted from natural ingredients like lentils and shiitake mushrooms, locking in vegetable juices under a lightly charred crust for a hearty, juicy texture. The \u0027Cheese-Free Vegan Pizza\u0027 replaces traditional cheese with house-made cashew cheese, layered over fresh tomato sauce and an array of roasted vegetables on a crispy, chewy crust\u2014delivering a refreshingly light meal.", "name": "Vegetus", "transport": "Subway Line 6 Noksapyeong Station, Exit 2, approx. 12-minute walk"}, {"address": "55 Hoenamu-ro 35-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 Stars | A spacious hydroponic-themed vegan dessert cafe on Gyeongnidan-gil that combines an aquatic botanical garden with laboratory-style aesthetics for a striking visual experience. All cakes and drinks here are 100% vegan and gluten-free. Highly recommended is the \u0027Vegan Matcha Coconut Tart\u0027\u2014featuring a crispy crust with subtle nutty notes, filled with rich, smooth matcha perfectly blended with coconut milk. The \u0027Vegan Oat Latte\u0027 and smoothie bowls are also crowd favorites, making it a fantastic spot to relax over afternoon tea.", "name": "Savage Garden", "transport": "Subway Line 6 Noksapyeong Station, Exit 2, approx. 10-minute walk"}, {"address": "5-6 Dokseodang-ro 29-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 Stars | An iconic vegan bakery in Hannam-dong offering gluten-free, dairy-free, egg-free, and refined sugar-free treats. They insist on using oat flour, coconut sugar, and organic coconut oil for all baked goods. The must-try \u0027Vegan Matcha Oat Cake\u0027 has a dense, velvety texture with a rich, subtly bitter premium matcha flavor; low in sweetness, it leaves a lingering aftertaste. The \u0027Vegan Tofu Tart\u0027 features a tofu-based filling with a pudding-smooth texture, highly recommended for healthy eaters and those with food allergies.", "name": "Panhonesta Hannam", "transport": "Gyeongui-Jungang Line Hannam Station, Exit 1, approx. 12-minute walk"}, {"address": "1F, 62 Huam-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.6 Stars | An immensely popular vegan brunch spot hidden in the alleys of Haebangchon, dedicated to bringing out the absolute best in tofu. Their signature \u0027Eggless Egg Salad Sandwich\u0027 uses organic tofu mixed with turmeric and a house special sauce to simulate yolk texture, creating a creamy and aromatic spread served inside crispy sourdough bread with fantastic texture. The \u0027Tofu Cabbage Roll Bowl\u0027 combines juicy pan-fried tofu with fresh greens, lightly seasoned for a crisp, delicious finish\u2014a top choice for a healthy, light meal.", "name": "ByTOFU", "transport": "Subway Line 4 Sookmyung Women\u0027s Univ. Station, Exit 2, transfer to Village Bus Yongsan 02 to Haebangchon Entrance stop, approx. 3-minute walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "222 Noksapyeong-daero, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 Stars | An iconic strolling dessert located near Noksapyeong Station. Freshly fried Spanish churros boasting a golden crispy exterior and a soft, chewy interior, dusted with sweet cinnamon sugar. Served hot with a rich aroma, paired with special rich chocolate sauce or soft-serve milk ice cream for an incredibly layered texture. A popular street snack that tourists and local youth must grab while strolling along Gyeongnidan-gil.", "name": "Street Churros Itaewon Main Branch", "transport": "Approx. 3-min walk from Noksapyeong Station Exit 2"}, {"address": "126 Bogwang-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 Stars | A landmark international street food spot in Itaewon. Large pieces of spice-marinated beef or chicken are slow-roasted on a vertical rotisserie. Freshly shaved juicy meat slices with a delightful smoky char are wrapped in a chewy flatbread alongside crunchy shredded cabbage, tomatoes, special white sauce, and hot sauce. Every bite bursts with rich Middle Eastern spices and savory juices, making it the most popular late-night street bite after enjoying the nightlife.", "name": "Sultan Kebab", "transport": "Approx. 1-min walk from Itaewon Station Exit 3"}, {"address": "5 Noksapyeong-daero 32-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 Stars | A long-standing, wildly popular Chinese handmade dumpling spot in Itaewon, famous for its golden and crispy lace-bottomed potstickers (\u0027ice flower dumplings\u0027). The skin is ultra-crispy on one side and tenderly thin on the other. Taking a bite releases a burst of hot, savory juice packed with fresh pork and shrimp. The sensational contrast of crispy and tender textures will keep you coming back for more\u2014an affordable street food legend you shouldn\u0027t miss in Itaewon.", "name": "Johnny Dumpling", "transport": "Approx. 3-min walk from Itaewon Station Exit 4"}, {"address": "38 Daesagwan-ro 34-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.6 Stars | A classic traditional roasted chicken spot in Hannam-dong enthusiastically recommended by Korean celebrities who queue up for it. Whole chickens are stuffed with glutinous rice, red dates, ginseng, and garlic, then slow-roasted over oak charcoal for hours. The skin turns crisp like potato chips, while the meat inside remains amazingly tender and juicy. The sticky rice at the bottom absorbs the rich chicken juices and smoky oak aroma, offering a soft texture with a lightly charred rice crust. Dipped in sweet \u0026 spicy sauce or mustard, every bite is unforgettable.", "name": "Hannam-dong Hanbang Tongdak", "transport": "Approx. 8-min walk from Hannam Station Exit 1 (Gyeongui-Jungang Line)"}, {"address": "174 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 Stars | A traditional Turkish street bakery highly recommended by famous Korean TV food shows. It specializes in freshly made Turkish sesame bagels (Simit) and \u0027Kaymak with honey and bread\u0027, celebrated as a heavenly delight. Freshly baked Simit has a pleasantly chewy texture and rich wheat aroma. Spread with silky, rich clotted cream (Kaymak) and sweet honey, it offers an indulgent milky flavor without being overly sweet\u2014a truly iconic exotic street treat.", "name": "Alpedoz Turkish Bakery", "transport": "Approx. 1-min walk from Itaewon Station Exit 4"}, {"address": "26 Itaewon-ro 42-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 Stars | A trendy cronut (croissant donut) specialty shop creating a buzz in the alleys of Hannam-dong. It perfectly combines the flaky crispiness of a croissant with the fluffy texture of a donut. Freshly fried and coated with a thin layer of glaze, it delivers a satisfying crunch on the outside while remaining light and multi-layered inside. Popular flavors like Pink Strawberry Milk and Cr\u00e8me Br\u00fbl\u00e9e burst with lush fillings upon biting, offering an astonishing taste experience. It\u0027s Hannam-dong\u0027s hottest grab-and-go walking dessert.", "name": "Seoul Pastry Hannam", "transport": "Approx. 7-min walk from Hangangjin Station Exit 3"}, {"address": "145 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.2 Stars | An old-school snack stall tucked around the traditional market area in Itaewon, specializing in classic Korean street bites. Their Tteokbokki features chewy cylindrical rice cakes coated in a rich, sweet, and mildly spicy red chili sauce infused with anchovy broth. Paired with freshly fried crisp assorted vegetable tempura and sundae (blood sausage) soaked in sauce, it creates a rich layered flavor. Full of warm, traditional Korean street vibes, it is loved by local residents and students alike.", "name": "Itaewon Market Bunsik", "transport": "Approx. 4-min walk from Itaewon Station Exit 1"}, {"address": "66 Hannam-daero 27-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 Stars | The pinnacle of American-style donuts in Korea, famous for its super-generous fillings and chewy, substantial dough. The bread is bouncy and full of bite, while the rich filling like peanut cream is astounding. A single bite makes custom custard or aromatic peanut butter ooze out instantly. High in sweetness yet intensely satisfying, pairing it with black coffee while strolling through the artistic alleys of Hannam-dong makes for the most authentic and trendy walking food experience.", "name": "Old Ferry Donut Hannam", "transport": "Approx. 6-min walk from Hangangjin Station Exit 3"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Itaewon and Hannam-dong"}, "jamsil_lotteworld": {"categories": {"cat_1": {"items": [{"address": "48 Wiryeseong-daero, Songpa-gu, Seoul", "feature": "\u2b50 4.5 stars | One of Seoul\u0027s most iconic sundae-guk (blood sausage soup) restaurants, renowned for its elegant Hanok decor and exceptionally rich pork bone broth. The signature Sundae-guk is slow-cooked over low heat for hours, resulting in a milky, rich soup that is completely odor-free with a subtle herbal aroma. The dense, savory handmade blood sausages, combined with chewy pork offal and tender pork slices, make every mouthful deeply satisfying. Paired with house-made crunchy radish kimchi and salted shrimp sauce to elevate the soup\u0027s fresh flavor, it\u0027s an authentic local traditional dish that office workers and tourists alike are willing to queue for.", "name": "Cheongwa Ok - Bangi Main Branch", "transport": "Subway Line 9, Hanseong Baekje Station Exit 3, about 1 minute walk"}, {"address": "8-16 Baekjegobun-ro 7-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.3 stars | A legendary spicy cold noodle institution open for over 40 years since 1983, praised as one of Seoul\u0027s top three spicy cold noodle joints. The signature Spicy Bibim Naengmyeon features chewy, elastic thin noodles coated in a secret devilishly spicy red sauce. Upon taking a bite, subtle sweetness and sesame oil aromas hit first, followed by an explosion of fiery spiciness on the tongue\u2014addictively satisfying. Spice lovers can adjust the flavor with vinegar, mustard, and a sprinkle of sugar, then cool off with a free bowl of piping hot beef bone broth. This thrillingly fiery culinary experience keeps local foodies coming back for more.", "name": "Haeju Naengmyeon", "transport": "Subway Line 2, Jamsilsaenae Station Exit 4, about 5 minutes walk"}, {"address": "30 Ogeum-ro 11-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.4 stars | A decades-old classic tucked in the alleys of Bangi-dong, renowned in the Jamsil district for its unique Spicy Beef and Mushroom Kalguksu (knife-cut noodles). Fresh oyster mushrooms, celery, and tender beef slices are simmered directly in a secret spicy red broth, yielding a rich, savory flavor balanced by natural vegetable sweetness. Freshly hand-cut noodles soak up the savory broth, remaining smooth and wonderfully chewy. After finishing the noodles, be sure to have the staff make their signature fried rice\u2014rice, green onions, and egg mixed with the remaining broth and crisped on the hot pan to form a golden, crunchy crust that completes the meal perfectly.", "name": "Bangi Kalguksu", "transport": "Subway Line 2 or 8, Jamsil Station Exit 10, about 10 minutes walk"}, {"address": "3 Gangdong-daero, Songpa-gu, Seoul", "feature": "\u2b50 4.4 stars | Originating as a modest street stall before becoming Korea\u0027s premier arrowroot cold noodle brand, the Pungnap Main Branch still preserves its original authentic flavor. The signature Mul-Naengmyeon features springy dark noodles made from nutritious arrowroot, served in icy beef broth with a touch of signature spicy sauce\u2014sweet, tangy, refreshing, and instantly cool. Topped with thick Korean pear slices and a boiled egg, every bite is delightfully crisp and sweet. Beyond cold noodles, their thin-skinned, generous handmade king dumplings are an absolute staple ordered at almost every table.", "name": "Yucheon Naengmyeon - Pungnap Main Branch", "transport": "Subway Line 8, Gangdong-gu Office Station Exit 4, about 12 minutes walk"}, {"address": "6 Wiryeseong-daero, Songpa-gu, Seoul", "feature": "\u2b50 4.2 stars | A traditional royal court-style Hanjeongsik (Korean full-course meal) restaurant famous for serving premium Icheon rice and its theatrical, full-table service experience. The sight of servers sliding an entire wooden tabletop loaded with dozens of exquisite dishes directly onto your table is pure visual drama. The signature Icheon stone-pot rice features perfectly chewy, sweet grains, and pouring hot tea over the crispy bottom rice forms a fragrant, traditional nurungji soup. Paired with tender boiled pork bossam, rich marinated raw crab, pan-fried yellow croaker, and a bounty of seasonal side dishes, every bite embodies the essence and warmth of traditional Korean culinary culture.", "name": "Sandeulhae Hanjeongsik - Songpa Branch", "transport": "Subway Line 9, Hanseong Baekje Station Exit 2, immediately upon exiting"}, {"address": "34 Baekjegobun-ro 9-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.6 stars | An iconic premium Hanwoo (Korean beef) restaurant in the Jamsil Sincheon area, renowned for its fresh, hand-cut Hanwoo beef ribs. The restaurant features an open butcher counter where skilled chefs trim and cut top-tier Hanwoo right in front of you. Lightly seared over charcoal, the beef ribs seal in rich juices, creating a lightly caramelized crust and an insanely tender, juicy interior packed with deep beef flavor. Dipped in house sauce and paired with sliced onions, the rich sweetness of the beef fuses flawlessly with the crisp bite of the onions\u2014a must-try traditional BBQ experience for meat lovers in Jamsil.", "name": "Neulpureun Mokjang - Jamsil Sincheon Branch", "transport": "Subway Line 2, Jamsilsaenae Station Exit 4, about 6 minutes walk"}, {"address": "358 Baekjegobun-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.3 stars | A traditional noodle house near Seokchon Station beloved by locals for its astounding portions and richly flavorful seafood broth. Each bowl of the signature Clam Kalguksu is piled high with fresh Manila clams; the clear broth is naturally sweetened by the seafood, tasting pure and satisfying without any fishiness. The golden handmade noodles are silky smooth with a gentle aroma, perfectly soaking up the flavor of the broth. Diners can also enjoy unlimited self-serve barley rice, house kimchi, and rich traditional makgeolli (rice wine)\u2014mixing spicy sauce into barley rice delivers unbeatable value and warmth.", "name": "Hwangdo Bajirak Kalguksu", "transport": "Subway Line 9, Seokchon Station Exit 6, about 2 minutes walk"}, {"address": "55 Ogeum-ro 11-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.3 stars | A famous late-night traditional pojangmacha (street bar) oozing retro nostalgia, perfect for experiencing local Korean nightlife and late-night food culture. The signature Anchovy Noodles feature a rich broth simmered for hours with premium dried anchovies and kelp, spiked with a touch of black pepper heat. The thin noodles absorb the flavorful broth, offering instant warmth and comfort. Beyond noodles, stir-fried spicy pen shell adductor muscles or spicy squid are hot recommendations\u2014savory, spicy, and chewy, perfectly washed down with soju while soaking in the lively local midnight vibe of Seoul.", "name": "Grandma\u0027s Pocha Anchovy Noodles", "transport": "Subway Line 9, Hanseong Baekje Station Exit 3, about 5 minutes walk"}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "43-7 Baekjegobun-ro 41-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.6 Stars | A wildly popular savory pie shop visited by BTS members! Known for a wide variety of sweet and savory pies, tarts, and rich soups. Their signature \u0027Cheddar Cheese Beef Pie\u0027 features a buttery, flaky crust stuffed with generous, juicy, savory minced beef. Served alongside velvety truffle mashed potatoes and rich beef gravy, every layered, flavorful bite delivers pure bliss. A must-visit brunch hotspot along Songridan-gil!", "name": "Ginger Bear Pie Shop (\uc9c4\uc800\ubca0\uc5b4 \ud30c\uc774\uc0f5)", "transport": "Approx. 5-minute walk from Exit 1 of Seokchon Station (Line 8)"}, {"address": "1F, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.7 Stars | An insanely popular British-style bagel bakery inside Lotte World Mall. The bagels here are uniquely chewy, moist, and soft\u2014never dry. The top-rated \u0027Spring Onion Cream Cheese Bagel\u0027 bursts with rich cheese and fresh scallion aromas, paired with a velvety custom spread for an addictive sweet-and-savory balance. Its vintage British decor also makes it a prime photo spot for tourists.", "name": "London Bagel Museum Jamsil (\ub7f0\ub358\ubca0\uc774\uae00\ubba4\uc9c0\uc5c4 \uc7a0\uc2e4\uc810)", "transport": "Directly connected to Lotte World Mall from Exit 10 of Jamsil Station (Lines 2 \u0026 8)"}, {"address": "2F, 12 Baekjegobun-ro 45-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.5 Stars | A cozy, vintage cafe specializing in gluten-free desserts and baked goods. Signature favorites like the \u0027Corn Cheese Chiffon Cake\u0027 and \u0027Basil Tart\u0027 feature incredibly light, fluffy sponges and melt-in-your-mouth whipped cream that\u0027s perfectly balanced in sweetness\u2014you\u0027d never guess they are gluten-free! The rustic wooden interior and beautifully plated treats make it a favorite cozy brunch stop for dessert lovers.", "name": "Cafe Pepper (\uce74\ud398\ud398\ud37c)", "transport": "Approx. 4-minute walk from Exit 1 of Songpanaru Station (Line 9)"}, {"address": "#102, 268 Seokchonhosu-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.4 Stars | An authentic craft bagel shop originating from Brooklyn, NY, located right by Seokchon Lake. Boiled and kettle-baked in the traditional style, their bagels feature a golden, lightly crispy crust and a dense, chewy interior. Highly recommended is the \u0027Smoked Salmon Cream Cheese Bagel Sandwich\u0027, loaded with savory smoked salmon and a thick layer of signature cream cheese\u2014an indulgent treat best enjoyed alongside serene lake views.", "name": "Nickerbocker Bagel Jamsil (\ub2c8\ucee4\ubc84\ucee4\ubca0\uc774\uae00)", "transport": "Approx. 8-minute walk from Exit 2 of Jamsil Station (Line 2), near the East Lake of Seokchon Lake"}, {"address": "1F, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.3 Stars | A classic all-day brunch spot from Sydney, Australia, featuring high ceilings and a chic, sunlit interior. The absolute must-try signature dish is the \u0027Ricotta Hotcakes with Banana and Honeycomb Butter\u0027\u2014cloud-like, fluffy pancakes that melt in your mouth with rich milky notes and sweet banana flavors, elevated with pure maple syrup. A top spot for a relaxed meal inside Lotte World Tower.", "name": "Bills Jamsil (\ube4c\uc988 \uc7a0\uc2e4)", "transport": "Directly connected to Lotte World Mall from Exit 10 of Jamsil Station (Lines 2 \u0026 8)"}, {"address": "4F, 15 Songpa-daero 48-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.4 Stars | A trendy cafe boasting a spectacular rooftop terrace with up-close panoramic views of Lotte World Tower. Their signature \u0027Ice Cream Croffle\u0027 is golden and flaky on the outside with buttery layers inside, topped with a generous scoop of rich vanilla ice cream and delicious syrup. The heavenly contrast between hot croffle and cold ice cream makes this one of Songridan-gil\u0027s top visual and culinary treats.", "name": "Pres Coffee (\ud504\ub808\uc2a4\ucee4\ud53c)", "transport": "Approx. 5-minute walk from Exit 1 of Songpanaru Station (Line 9)"}, {"address": "2F, 6 Baekjegobun-ro 45-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.3 Stars | Tucked away on the second floor along Songridan-gil, this Japanese retro wood-toned cafe offers a quiet, serene escape. Famous for its exquisite homemade Tiramisu and rich Matcha Latte, the tiramisu features rum-and-coffee-soaked cake topped with silky mascarpone cheese, striking a perfect balance between sweet and bitter. An ideal spot to unwind with an elegant afternoon tea.", "name": "Gabaedo Jamsil (\uac00\ubc30\ub3c4 \uc7a0\uc2e4)", "transport": "Approx. 3-minute walk from Exit 1 of Songpanaru Station (Line 9)"}, {"address": "1F, 14 Garak-ro 21-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.2 Stars | A creative watercolor-themed cafe blending painting activities with delicious desserts. Guests receive a watercolor palette and painting paper with their order, allowing them to paint while enjoying brunch. The signature freshly made Souffl\u00e9 Pancakes are cloud-soft and airy, packed with rich egg and vanilla aromas, served with fresh fruit and delicate whipped cream. A hit among couples and friends!", "name": "Peach Gray (\ud53c\uce58\uadf8\ub808\uc774)", "transport": "Approx. 7-minute walk from Exit 2 of Seokchon Station (Line 8)"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "14 Ogeum-ro 11-gil, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc624\uae08\ub85c11\uae38 14)", "feature": "\u2b50 4.6 Stars | The ultimate local favorite gopchang (beef intestines) bistro located in the Bangi-dong Food Street of Jamsil! Their signature combined grilled beef intestines (including small intestine, abomasum, and tripe) are stir-fried over high heat and seared on a hot plate. The exterior is golden and crispy, while every bite offers a rich, savory aroma and delightful chewiness with zero gamy smell. Complimentary piping-hot, flavorful mussel soup is served with the meal, perfectly balanced by a special chive sauce and spicy dip to cut through any richness. Paired with a bottle of soju or beer, it represents the ultimate Korean nightlife and drinking snack.", "name": "Byeolmi Gopchang (Jamsil Bangi Branch)", "transport": "Seoul Subway Lines 2 \u0026 8, Jamsil Station Exit 10, approx. 8-minute walk"}, {"address": "21 Baekjegobun-ro 45-gil, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \ubc31\uc81c\uace0\ubd84\ub85c45\uae38 21)", "feature": "\u2b50 4.8 Stars | A stylish Korean fusion bistro tucked away in the alleyways of Songridan-gil, seamlessly combining traditional Korean regional dishes with modern cocktails. A must-try item is the \u0027Braised Beef Oxtail \u0026 Truffle Pancake\u0027\u2014the beef is braised until melt-in-your-mouth tender, fully infused with rich bone broth essence, while the pancake is crispy outside, soft inside, and fragrant with truffle. Offering dozens of carefully selected regional craft makgeolli and cheongju, its cozy and elegant ambiance makes it a top choice for young locals and tourists looking to enjoy trendy Korean cuisine and a tipsy evening.", "name": "Dankyeong K-Bistro (Songridan-gil)", "transport": "Seoul Subway Line 9, Seokchon Station Exit 2, approx. 6-minute walk"}, {"address": "48 Wiryeseong-daero, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc704\ub840\uc131\ub300\ub85c 48)", "feature": "\u2b50 4.7 Stars | A renowned restaurant in the Jamsil area specializing in traditional sundae (blood sausage) soup and regional specialties, housed in an elegant, retro hanok-style building rich in historical charm. The signature \u0027Cheongwaok Sundae Soup\u0027 features a rich, milky-white broth simmered for hours that is incredibly savory, smooth, and naturally sweet. The sundae has a firm, bouncy texture, and the sliced pork is remarkably tender. Paired with freshly steamed hot pot rice and freshly made chive kimchi, every bite offers the ultimate deliciousness of an authentic Korean classic. Local foodies willingly queue for over an hour for a bowl.", "name": "Cheongwaok (Main Branch)", "transport": "Seoul Subway Line 9, Hanseong Baekje Station Exit 3, approx. 2-minute walk"}, {"address": "34 Baekjegobun-ro 9-gil, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \ubc31\uc81c\uace0\ubd84\ub85c9\uae38 34)", "feature": "\u2b50 4.5 Stars | Jamsil\u0027s most iconic Hanwoo (Korean beef) rib finger BBQ bistro, specializing in premium Hanwoo rib strips cut freshly upon order. Chefs debone and slice the meat right in the open kitchen, revealing beautiful marbling. Once lightly seared over charcoal, juices are sealed inside, yielding a tender yet chewy texture bursting with rich, buttery aromas. Dipped in special salt or sesame oil salt, it delivers an astonishing melt-in-your-mouth sweetness. Paired with house-made soybean paste stew and ice-cold soju, it offers the liveliest, most authentic Korean dining experience.", "name": "Neulpureun Mokjang (Jamsil Main Branch)", "transport": "Seoul Subway Line 2, Jamsilsaenae Station (near Sports Complex Station), approx. 7-minute walk"}, {"address": "29 Olympic-ro 32-gil, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c32\uae38 29)", "feature": "\u2b50 4.7 Stars | An upscale Korean specialty bistro combining retro ambiance with premium meats, famous in Jamsil for its unique aged beef ribs and Tomahawk pork chops. Utilizing a dual technique of low-temperature frying followed by high-temperature searing, the outer layer becomes crispy while slicing reveals tender, juicy pink meat packed with rich flavor. Beyond premium grilled meats, the complementary enoki mushroom soybean paste stew and kimchi stew are wonderfully rich in depth. Paired with red/white wines or traditional cocktails, it elevates regional Korean meat dishes into a refined dining and drinking experience.", "name": "Bangi-ok (Jamsil Bangi Branch)", "transport": "Seoul Subway Lines 2 \u0026 8, Jamsil Station Exit 10, approx. 7-minute walk"}, {"address": "29 Baekjegobun-ro 42-gil, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \ubc31\uc81c\uace0\ubd84\ub85c42\uae38 29)", "feature": "\u2b50 4.4 Stars | A long-standing local restaurant in Jamsil that has been filling the air with enticing aromas for decades, making it the top choice for locals and office workers seeking hangover relief or late-night bites. The signature Gamjatang (pork bone soup) uses large cuts of fresh pork spine, simmered slowly with ample perilla seed powder, dried cabbage, and secret spicy sauce. The pork slides right off the bone, melting in your mouth while fully absorbing the savory, spicy broth. Soft, fluffy potatoes complement a rich, spicy soup that never feels greasy. Finally, the remaining broth is fried with seaweed and rice to create a \u0027signature fried rice,\u0027 complete with crisp, fragrant scorched rice at the bottom for an incredible treat.", "name": "Songpa Halmae Gamjatang", "transport": "Seoul Subway Lines 8 \u0026 9, Seokchon Station Exit 3, approx. 5-minute walk"}, {"address": "18-11 Olympic-ro 32-gil, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c32\uae38 18-11)", "feature": "\u2b50 4.6 Stars | A popular charcoal-grilled pork rib bistro located on Bangi-dong Food Street, specializing in exquisite regional grilled rib dishes. Premium pork ribs are marinated for hours in a secret fruity sauce, then grilled over intense charcoal till the surface turns an alluring caramelized finish. The meat pulls easily off the bone, bouncy and juicy with a delightful sweet-and-savory smoky aroma. The bistro offers a variety of regional Korean craft beers; pairing savory grilled ribs with chilled beer offers rich layers of flavor, making it a huge hit among young diners and couples.", "name": "Buja Deunggalbi (Bangi Branch)", "transport": "Seoul Subway Lines 2 \u0026 8, Jamsil Station Exit 10, approx. 6-minute walk"}, {"address": "35 Baekjegobun-ro 41-gil, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \ubc31\uc81c\uace0\ubd84\ub85c41\uae38 35)", "feature": "\u2b50 4.8 Stars | An atmospheric Korean bistro hidden in the alleys of Songridan-gil, specializing in reinterpreting traditional Korean regional home cooking into exquisite bar bites. Must-order popular dishes include \u0027Korean Beef Tartare with Sea Urchin\u0027 and \u0027Squid Ink Seafood Pancake.\u0027 The raw beef features ultra-fresh Hanwoo with a smooth, sweet texture, blending land-and-sea flavors seamlessly with rich sea urchin on the tongue. The squid ink pancake is ultra-crispy on the outside with juicy, springy squid filling. Offering a rich selection of natural wines and traditional fruit cocktails, its elegant and romantic lighting makes it perfect for dates and cozy drinks.", "name": "Ju-Abang (Songridan-gil K-Wine Bistro)", "transport": "Seoul Subway Lines 8 \u0026 9, Seokchon Station Exit 1, approx. 5-minute walk"}], "name": "Specialty Bistros \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "3F, Lotte World Tower, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.7 stars | Upscale vegan fine dining located on the 3rd floor of Lotte World Tower. The chef elevates local seasonal vegetables and plant-based ingredients to perfection, offering exquisite multi-course tasting menus. Rich in layers with smooth, luxurious textures, it completely transforms the traditional perception of vegetarian cuisine\u2014highly popular among foodies, tourists, and locals alike.", "name": "Forest Kitchen", "transport": "Directly connected via the underground passage at Exits 1 \u0026 2 of Jamsil Station (Subway Lines 2 \u0026 8)"}, {"address": "2F, Lotte Castle Plaza, 269 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.3 stars | Located in Jamsil Lotte Castle Plaza, specializing in healthy, guilt-free dishes made without sugar, butter, or MSG. The menu features clearly labeled plant-based and vegetarian options. Their signature whole pumpkin soup, made with pure soy milk, has a smooth, rich, and naturally sweet texture that is velvety yet refreshing\u2014a top choice for healthy dining in the Jamsil area.", "name": "Dr.Robbin (Jamsil Lotte Castle)", "transport": "Directly accessible from Exit 7 of Jamsil Station (Subway Lines 2 \u0026 8)"}, {"address": "66 Chungmin-ro, Songpa-gu, Seoul (Munjeong-dong)", "feature": "\u2b50 4.5 stars | Located near the Songpa Jamsil area, this rare gem specializes in vegan Korean hangover soups (haejangguk) and pork bone-style potato soups (gamjatang). Using various mushrooms and plant-based meats, they create a rich, slightly spicy broth that perfectly captures the deep flavor of traditional Korean soups, allowing vegetarians to fully enjoy authentic local food culture.", "name": "Zero Vegan", "transport": "About a 5-minute walk from Exit 4 of Jangji Station (Subway Line 8), or reachable by bus transfer from Jamsil Station"}, {"address": "B1 West Tower, Samsung SDS, 125 Olympic-ro 35-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.2 stars | Located on B1 of the Samsung SDS Building near Jamsil Station, this fast-casual eatery serves Mexican-style dishes. It offers highly customizable vegetarian options such as braised tofu (Sofritas), grilled seasonal vegetables, and fresh salsas. Served as hearty burritos or rice bowls with brown rice and black beans, it is packed with flavor and popular among office workers and health-conscious travelers.", "name": "Cuchara (Jamsil Station)", "transport": "About a 4-minute walk from Exit 9 of Jamsil Station (Subway Lines 2 \u0026 8)"}, {"address": "2F, 12 Baekjegobun-ro 45-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.4 stars | Located near Seokchon Lake and Songridan-gil in Jamsil, this highly popular cafe specializes in gluten-free and vegan-friendly baked goods. Their signature vegan rice cakes and scones are made with rice flour and plant-based milk, featuring a moist, tender texture with subtle sweetness. Topped with fresh fruit, dessert lovers who avoid eggs and dairy can enjoy a guilt-free afternoon tea.", "name": "Cafe Pepper", "transport": "About a 5-minute walk from Exit 1 of Songpanaru Station (Subway Line 9), near Seokchon Lake (East Lake)"}, {"address": "2F, Lotte Castle Plaza, 269 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.1 stars | Located in Jamsil Lotte Castle Plaza, offering a lavish traditional Korean full-course meal (Hanjeongsik). Vegetarians can opt for the abundant wild vegetable set meal, featuring dozens of refined side dishes like seasoned mountain herbs, grilled tofu, soybean paste stew (doenjang-jjigae), and fragrant stone-pot purple rice. Enjoying the warm crust tea made from the scorched rice at the end delivers an authentic taste of traditional Korean farm-to-table ingredients.", "name": "Sandeulhae (Jamsil)", "transport": "Directly accessible from Exit 7 of Jamsil Station (Subway Lines 2 \u0026 8)"}, {"address": "20 Olympic-ro 35-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.0 stars | A popular Korean healthy eatery chain near Jamsil Station, offering various vegan and lacto-ovo vegetarian warm salad bowls and wraps. Highly recommended is the vegan hummus and roasted sweet potato warm bowl, served with a signature savory sesame dressing. With crisp greens and chewy grains, it\u2019s a quick and nourishing pick-me-up after a fun day at Lotte World.", "name": "Salady (Jamsil Station)", "transport": "About a 3-minute walk from Exit 8 of Jamsil Station (Subway Lines 2 \u0026 8)"}, {"address": "14 Ogeum-ro 38-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.5 stars | A 100% vegan restaurant located in the Songpa-Jamsil area dedicated to plant-based comfort food. Signature items like the vegan cheese cutlet and plant-based burgers are crafted from soy protein, breaded and fried to golden perfection with a satisfyingly chewy bite. Drizzled with savory custom sauces, they are rich, flavorful, and a big hit among local vegan enthusiasts.", "name": "Loving Hut (Songpa)", "transport": "About a 6-minute walk from Exit 1 of Ogeum Station (Subway Lines 3 \u0026 5), close to the Jamsil commercial area"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "22 Seokchonhosu-ro 12-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.5 Stars | An ultra-popular handmade steamed dumpling shop located inside the Saemaeul Traditional Market in Sincheon! Their signature shrimp dumplings (\uc0c8\uc6b0\ub9cc\ub450) feature a paper-thin, chewy skin wrapped around a whole succulent shrimp and juicy pork filling. Each bite bursts with savory juices infused with fresh ginger and scallion notes. Both locals and visiting foodies willingly queue up for these freshly steamed, highly affordable delicacies.", "name": "PAOPAO Shrimp Dumplings (PAOPAO Mandu / \ud30c\uc624\ud30c\uc624)", "transport": "About a 5-minute walk from Exit 3 of Jamsil Saenae Station (Subway Line 2)"}, {"address": "19 Seokchonhosu-ro 12-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.4 Stars | A popular grab-and-go street bite hidden inside the traditional market. Large, freshly fried boneless chicken pieces are tossed in a signature Korean sweet and spicy sauce and topped generously with finely sliced fresh perilla leaves. The coating is delightfully crispy without being greasy, while the tender chicken melts in your mouth. The aromatic herbal freshness of the perilla leaf perfectly cuts through the sweet sauce, making it addictively delicious\u2014an absolute must-try local spot after exploring Jamsil.", "name": "Perilla Leaf Boneless Fried Chicken (Kkaetnip Dakgangjeong / \uae7b\uc78e\ub2ed\uac15\uc815)", "transport": "About a 6-minute walk from Exit 3 of Jamsil Saenae Station (Subway Line 2)"}, {"address": "8 Olympic-ro 12-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.6 Stars | Korea\u0027s most iconic national street snack! Freshly battered with rice flour dough and fried to order, the crust is ultra-crispy yet deliciously chewy. The popular Mozzarella \u0026 Sausage Hotdog offers an epic cheesy pull in the upper half and a juicy sausage in the lower half. Coated in sugar and drizzled with mustard and ketchup, its perfect balance of sweet and savory makes it an irresistible walk-and-eat treat in the Jamsil shopping district.", "name": "Myungrang Hotdog Jamsil Saenae Branch (Myungrang Hotdog Jamsil Saenae / \uba85\ub791\ud56b\ub3c4\uadf8 \uc7a0\uc2e4\uc0c8\ub0b4\uc810)", "transport": "About a 3-minute walk from Exit 4 of Jamsil Saenae Station (Subway Line 2)"}, {"address": "B1, Lotte World Adventure, 240 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.3 Stars | A classic snack located inside Lotte World Adventure. Made fresh to order, these golden churros are crispy on the outside, soft on the inside, and tossed in fragrant cinnamon sugar while piping hot. Pairing them with rich, creamy vanilla soft-serve ice cream creates a heavenly contrast of hot and cold that is incredibly satisfying\u2014a photogenic staple for every visitor at Lotte World.", "name": "Street Churros Lotte World Branch (Street Churros Lotte World / \uc2a4\ud2b8\ub9bf\uce04\ub7ec\uc2a4 \ub86f\ub370\uc6d4\ub4dc\uc810)", "transport": "Directly connected to B1 floor of Lotte World from Jamsil Station (Subway Lines 2 \u0026 8)"}, {"address": "5F, Lotte World Mall, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.7 Stars | The sensationally popular Korean doughnut bakery! Their signature Milk Cream Donut features a fluffy, pillowy bun dusted with powdered sugar and overflowing with light, silky fresh cream and custard filling. One bite leads to a burst of rich, milky creaminess that isn\u0027t overly sweet. Paired with their iconic yellow smiley face packaging, it\u0027s a huge favorite among youth and tourists alike.", "name": "Caf\u00e9 Knotted Lotte World Mall Branch (Caf\u00e9 Knotted Lotte World Mall / \ub178\ud2f0\ub4dc \uc7a0\uc2e4\ub86f\ub370\uc6d4\ub4dc\ubab0\uc810)", "transport": "Directly connected to 5F of Lotte World Mall from Exit 10 of Jamsil Station (Subway Lines 2 \u0026 8)"}, {"address": "28 Seokchonhosu-ro 12-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.2 Stars | A classic time-honored Korean street food stall hidden inside the Sincheon Saemaeul Traditional Market. The signature combo platter includes nostalgic spicy rice cakes (tteokbokki), sundae (Korean blood sausage), and a variety of freshly fried tempura. The rice cakes are delightfully chewy and coated in a rich, sweet-and-spicy sauce, perfect for dipping the fried snacks. Rich in nostalgic comfort-food flavors, generous portions, and budget-friendly prices, this is the ultimate spot to experience authentic Korean snack culture.", "name": "Orange Bunsik Tteokbokki (Orange Bunsik / \uc624\ub80c\uc9c0\ubd84\uc2dd)", "transport": "About a 5-minute walk from Exit 3 of Jamsil Saenae Station (Subway Line 2)"}, {"address": "Jamsil Underground Shopping Center, 265 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.4 Stars | A popular traditional snack stall inside the Jamsil Underground Shopping Center. Freshly pressed and griddled to order, the hotteok has a golden, crispy exterior with a pleasant chew, filled with melted brown sugar syrup, crunchy nuts, and a hint of cinnamon. Piping hot and deliciously sweet, every bite unleashes a burst of warm syrup\u2014a comforting treat while commuting or shopping during cold winter days.", "name": "Jamsil Underground Hotteok (Jamsil Underground Hotteok / \uc7a0\uc2e4\uc5ed \uc9c0\ud558\uc1fc\ud551\uc13c\ud130 \ud638\ub5a1)", "transport": "Located inside the Underground Shopping Mall at Jamsil Station (Subway Lines 2 \u0026 8)"}, {"address": "Street stall near 111 Ogeum-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.5 Stars | A popular street vendor serving fish-shaped bungeoppang near Jamsil\u0027s Seokchon Lake. Baked fresh on the spot, the waffle-like batter turns biscuit-crispy on the outside. Choose between smooth sweet red bean paste or rich vanilla custard cream\u2014both generously filled from head to tail! Piping hot, crispy on the outside and soft inside, it\u0027s a favorite local snack to enjoy while strolling around Seokchon Lake.", "name": "Hwang-geum Bungeoppang Jamsil Branch (Hwang-geum Bungeoppang / \ud669\uae08\ubd95\uc5b4\ube75 \uc7a0\uc2e4\uc810)", "transport": "About a 7-minute walk from Exit 10 of Jamsil Station or Mongchontoseong Station (Subway Line 8)"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Jamsil and Lotte World"}, "jongno_bukchon": {"categories": {"cat_1": {"items": [{"address": "85-1 Chebu-dong, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uccb4\ubd80\ub3d9 85-1)", "feature": "\u2b50 4.3 Stars | Located in a traditional Hanok right next to Gyeongbokgung Palace, this legendary restaurant is immensely popular and beloved by former Korean presidents and international foodies alike. The signature spring chicken is stuffed with Korean ginseng, chestnuts, jujubes, and glutinous rice, then simmered for hours until the broth turns rich and milky white, filling the air with a deep ginseng and nutty aroma. The chicken meat is extraordinarily tender, easily falling off the bone, while the glutinous rice absorbs the essence of the broth for a dense, smooth texture. Dine-in orders come with a complimentary shot of ginseng wine, which can be enjoyed directly or poured into the soup for added flavor. It is one of Seoul\u0027s most iconic nourishing delicacies.", "name": "Tosokchon Samgyetang", "transport": "Subway Line 3 Gyeongbokgung Station, Exit 2, approx. 5 mins walk"}, {"address": "38-13 Ujeongguk-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc6b0\uc815\uad6d\ub85c 38-13)", "feature": "\u2b50 4.2 Stars | Operating for over 110 years, this legendary ox bone soup spot holds the title of Korea\u0027s first officially registered restaurant. They insist on simmering ox bones and offal over low heat for more than 17 hours with zero artificial flavorings, resulting in a naturally clear, light milky-white broth. It tastes pure, smooth, and gently sweet with a subtle beef aroma. Tables are stocked with plenty of chopped scallions and coarse salt so guests can season to taste. Served with thick slices of tender beef, rice soaked in savory broth, and tangy homemade radish kimchi (kkakdugi), it perfectly embodies authentic Korean culinary tradition.", "name": "Imun Seolnongtang", "transport": "Subway Line 1 Jonggak Station, Exit 3-1, approx. 3 mins walk"}, {"address": "11-3 Insadong 10-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d910\uae38 11-3)", "feature": "\u2b50 4.3 Stars | Tucked away in an alley of Insadong, this Michelin Bib Gourmand restaurant was founded by a grandmother from Gaeseong and has been passed down through three generations. Their oversized handmade dumplings feature thin, chewy wrappers stuffed with pork, tofu, cabbage, and bean sprouts, creating a refreshing, non-greasy flavor profile that highlights the natural sweetness of the ingredients. The classic dumpling soup
