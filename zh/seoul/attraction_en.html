        "item": {
          "@type": "TouristAttraction",
          "name": "Seoul Library (Old Seoul City Hall)",
          "description": "⭐ 4.4 stars | Built in 1926, the old Seoul City Hall is a classic example of Imperial Crown style architecture from modern Korean history. Its Western-style exterior and iconic central dome stand as witnesses to Seoul's urban evolution from the colonial period and the Korean War to the present day. Following the opening of the new City Hall building behind it in 2012, this three-story historic hall was preserved and transformed into the Seoul Library. Inside, visitors can explore the restored former mayor's office, vintage wooden staircases, extensive book collections, and exhibition spaces. The open-air rooftop garden offers fantastic elevated views over Seoul Plaza and the captivating blend of vintage and modern cityscapes.",

        "@type": "ListItem",

          "@type": "TouristAttraction",
          "name": "Sewoon Sangga",
          "description": "⭐ 4.1 stars | Built in 1968 and designed by modern architectural master Kim Swoo-geun, Sewoon Sangga was Korea's first massive mixed-use residential and commercial complex. Stretching 1 kilometer through the Euljiro district, its Bauhaus-inspired mega-structure was once the heart of Korea's electronics and audiovisual industries. Through recent urban renewal projects, it has transformed into a vibrant historic landmark blending retro maker spaces, hipster cafes, and industrial heritage. A walk along its elevated skywalk offers sweeping views contrasting Jongmyo Shrine with the vintage backalleys of Euljiro, showcasing a unique Cold War and mid-century retro urban aesthetic.",

        "@type": "ListItem",

        "item": {
          "@type": "TouristAttraction",
          "name": "Gwangtonggyo Bridge",
          "description": "⭐ 4.2 stars | Spanning Cheonggyecheon Stream near Euljiro 1-ga, Gwangtonggyo was the largest stone bridge in Hanyang (modern-day Seoul) during the Joseon Dynasty, functioning as a vital transportation hub connecting Unjongga (now Jongno) and Namdaemun. The bridge's most fascinating historical detail is that its foundation stones were repurposed from the original tomb of Queen Sindeok, the second wife of King Taejo. These stones feature remarkably intricate carvings of mythical beasts and elegant floral patterns. Buried underground for decades, the bridge was restored in 2005 during the Cheonggyecheon restoration project, bringing its superb Joseon-era stone craftsmanship back to light.",
          "address": {

            "@type": "PostalAddress",

          "address": {
            "@type": "PostalAddress",
            "streetAddress": "5 Chilpai-ro, Jung-gu, Seoul"
          }
        }
      },

        "@type": "ListItem",

          "address": {

          "@type": "TouristAttraction",
          "name": "Bank of Korea Money Museum",
          "description": "⭐ 4.5 stars | Housed in an exquisite Neoclassical stone building completed in 1912—formerly the head office of the Bank of Korea—this museum is designated as a National Historic Site of Korea. The museum displays ancient and modern currencies from around the world, commemorative coins, and the evolution of Korean money. It also offers interactive experience zones where visitors can learn to identify counterfeit bills, simulate money transport armored vehicles, and try lifting a heavy model stack of cash. Combining architectural beauty with economic history, it is an ideal destination for family trips and history enthusiasts alike.",

          "address": {
            "@type": "PostalAddress",

            "@type": "PostalAddress",

    <script>
        const dbData = {"dongdaemun": {"categories": {"cat_1": {"items": [{"address": "288 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Commonly known as Dongdaemun (East Gate), Heunginjimun Gate is one of the eight major gates that surrounded the Hanyang City Wall during the Joseon Dynasty (built in 1396, rebuilt in 1869), and is designated as Treasure No. 1 of South Korea. Its most distinctive architectural feature is its crescent-shaped outer wall (Ongseong), specifically built to reinforce gate defense, making it the only surviving gate in Seoul with this feature. The gatehouse features a double-eaved hip-and-gable roof, combining the rigorous craftsmanship and majestic elegance of the late Joseon period. Illuminated at night, Heunginjimun presents a striking contrast against the surrounding modern traffic, offering a breathtaking visual spectacle where history meets modernity.", "name": "Heunginjimun Gate", "transport": "Take Seoul Subway Line 1 or Line 4 to Dongdaemun Station, Exit 6 or 7, and walk a short distance."}, {"address": "281 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.6 stars | Masterfully designed by the late world-renowned architect Zaha Hadid, Dongdaemun Design Plaza (DDP) is the world\u0027s largest three-dimensional non-standard building. Its futuristic, streamlined silver-white exterior resembles a giant UFO landed in central Seoul, constructed with 45,133 uniquely shaped aluminum panels. The interior seamlessly connects art halls, design labs, creative markets, and a historic park. The column-free curved spaces and geometric interplay of light and shadow create a breathtaking experience. Serving as the home of Seoul Fashion Week, DDP stands as an iconic landmark of modern avant-garde architectural art.", "name": "Dongdaemun Design Plaza (DDP)", "transport": "Take Seoul Subway Line 2, 4, or 5 to Dongdaemun History \u0026 Culture Park Station, Exit 1 for direct access."}, {"address": "Jongno 6-ga, Jongno-gu, Seoul", "feature": "\u2b50 4.6 stars | Located on the slope east of Dongdaemun, Heunginjimun Park features a well-preserved stretch of the Seoul City Wall winding up the ridge of Naksan Mountain. Restored multiple times across different eras under Kings Taejo, Sejong, and Sukjong of the Joseon Dynasty, this wall showcases distinct stonemasonry techniques and historical traces from various periods. As you stroll along the wall path, scenic platforms offer sweeping views of the vibrant Dongdaemun shopping district contrasted with the weathered beauty of the ancient wall, making it one of Seoul\u0027s most romantic and historic fortress trails.", "name": "Heunginjimun Park - Seoul City Wall", "transport": "Take Seoul Subway Line 1 or Line 4 to Dongdaemun Station, Exit 1, and walk about 3 minutes to the park entrance."}, {"address": "238-1 Sungin-dong, Jongno-gu, Seoul", "feature": "\u2b50 4.2 stars | Officially named Donggwanwangmyo, Dongmyo Shrine was built in 1601 (the 34th year of King Seonjo\u0027s reign) as an official shrine dedicated to Guan Yu, the legendary general of Shu Han during China\u0027s Three Kingdoms period. Designated as Treasure No. 142 of South Korea, its unique architecture seamlessly blends Chinese Ming Dynasty styles with traditional Joseon wooden craftsmanship, featuring brick outer walls and elaborate roof ridge decorations. The shrine houses several precious statues of Guan Yu and historical plaques. Its solemn, serene atmosphere forms a fascinating cultural contrast with the bustling Dongmyo Flea Market just outside its walls.", "name": "Dongmyo Shrine (Donggwanwangmyo)", "transport": "Take Seoul Subway Line 1 or Line 6 to Dongmyo Station, Exit 3, and walk about 2 minutes."}, {"address": "Inside DDP Park, 281 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Situated within the outdoor park of Dongdaemun Design Plaza (DDP), the Igansumun Floodgate and Castle Wall Ruins are major Joseon-era historic artifacts unearthed during DDP\u0027s construction. Igansumun was originally a twin-arched stone floodgate beneath the Seoul City Wall designed to channel water out of the city, crafted from durable granite dating back over 600 years. Today, this floodgate and the ruins of the Hadogam military camp are preserved in situ as an open-air historical museum, allowing visitors to admire ancient urban hydraulics and defensive architecture right alongside cutting-edge modern structure.", "name": "Igansumun Floodgate \u0026 Castle Wall Ruins", "transport": "Take Seoul Subway Line 2, 4, or 5 to Dongdaemun History \u0026 Culture Park Station, Exit 1 or 2, and walk to the outdoor park behind DDP."}, {"address": "298 Yulgok-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Situated next to Heunginjimun Park, the Seoul City Wall Museum is dedicated to presenting the 600-year history of the Seoul City Wall. With an elegant and minimalist design, the museum displays rich archaeological artifacts, historical documents, scale models, and interactive multimedia exhibits. It chronicles the Joseon Dynasty\u0027s establishment of Hanyang as capital, wall construction techniques, destruction during the Japanese colonial period, and meticulous modern restoration efforts. The top-floor observatory window offers a close-up panoramic view of Heunginjimun Gate and wall ruins, making it the premier cultural spot to explore Seoul\u0027s ancient urban defense and historical heritage.", "name": "Seoul City Wall Museum", "transport": "Take Seoul Subway Line 1 or Line 4 to Dongdaemun Station, Exit 1, and walk about 5 minutes."}, {"address": "Area of 23-579 Changsin-dong, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | Nestled on the hillside of Changsin-dong northeast of Dongdaemun, this quarry site is a unique historical relic documenting Seoul\u0027s modern urban development. During the Japanese colonial period, high-quality granite was heavily mined here to construct major Western-style buildings like the Japanese General Government Building, Keijo City Hall (now Seoul City Hall), and Keijo Station (now Seoul Station), resulting in dramatic shear rock cliffs. Today, a unique \u0027Cliff Village\u0027 community nestles beneath these massive granite cliffs. Reaching the top rewards visitors with sweeping panoramic views of the Dongdaemun commercial district and the Seoul skyline, showcasing a distinct landscape where industrial history meets local residential life.", "name": "Changsin-dong Quarry Site \u0026 Cliff Village", "transport": "Take Seoul Subway Line 1 or Line 6 to Dongmyo Station or Changsin Station, then transfer to Jongno Village Bus 03 and get off at the Quarry Observatory stop."}, {"address": "274 Cheonggyecheon-ro, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Stretching hundreds of meters along the Cheonggyecheon Stream, Pyeonghwa Market is a monumental modern historical structure built after the Korean War in the 1950s, symbolizing the birthplace of South Korea\u0027s modern textile and garment industry. This long, industrial-style building stands as a testament to the \u0027Miracle on the Han River\u0027 during Korea\u0027s economic boom in the 1960s and 1970s, while also witnessing the poignant history of the Korean labor movement. The Cheonggyecheon bridge in front of the market is named \u0027Jeon Tae-il Bridge,\u0027 featuring a bust statue and memorial plaque for labor activist martyr Jeon Tae-il, making it a key landmark of both industrial history and human rights culture.", "name": "Pyeonghwa Market \u0026 Jeon Tae-il Bridge", "transport": "Take Seoul Subway Line 1 or Line 4 to Dongdaemun Station, Exit 8, and walk about 3 minutes to the Cheonggyecheon stream side."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "281 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | An iconic neo-futuristic landmark designed by world-renowned architect Zaha Hadid, featuring a sleek silver metallic exterior that resembles a UFO landing in central Seoul. The Art Hall hosts international fashion shows, design exhibitions, product launches, and contemporary art displays. Enhanced by ambient lighting at night, it radiates an ultra-futuristic vibe and serves as a premier hub for modern design art and pop culture.", "name": "Dongdaemun Design Plaza (DDP) Art Hall", "transport": "Directly connected to Exit 1 of Dongdaemun History \u0026 Culture Park Station (Subway Lines 2, 4, and 5)"}, {"address": "283 Yulgok-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | Located inside Heunginjimun Park, this modern museum is dedicated to the construction and evolution of the Seoul City Wall. It features rich permanent exhibits and interactive multimedia installations detailing 600 years of history since the Hanyang capital was established during the Joseon Dynasty. From the top-floor exhibition area, visitors can enjoy panoramic views of Dongdaemun Gate and the ancient fortress wall tracing up the hillsides, combining educational history with great scenic outlooks.", "name": "Seoul City Wall Museum", "transport": "Subway Lines 1 \u0026 4, Dongdaemun Station, Exit 1 (approx. 5-minute walk)"}, {"address": "281 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | Situated within Dongdaemun History \u0026 Culture Park, this museum showcases Joseon-era relics and artifacts excavated during the construction of DDP. It houses well-preserved treasures including ancient drainage bridge remnants, water management structures, and military weaponry. Realistic models and historical photos guide visitors through Dongdaemun\u0027s dramatic transformation from a military stronghold and modern stadium to today\u0027s vibrant design hub.", "name": "Dongdaemun History Museum", "transport": "Subway Lines 2, 4, \u0026 5, Dongdaemun History \u0026 Culture Park Station, Exit 1 or 2 (approx. 3-minute walk)"}, {"address": "12-1 Jong-ro 53-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | Located in Changsin-dong near Dongdaemun, this memorial house stands on the site of world-renowned video artist Nam June Paik\u0027s childhood home. Housed in a traditional Hanok, the interior seamlessly blends rustic traditional architecture with avant-garde video art and multimedia installations. Along with displaying his classic works and creative journey, it features a cozy caf\u00e9\u2014making it a charming, hidden artsy haven tucked away in historic alleys.", "name": "Nam June Paik Memorial House", "transport": "Subway Lines 1 \u0026 6, Dongmyo Station, Exit 10 (approx. 5-minute walk)"}, {"address": "387 Toegye-ro, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Located near the Dongdaemun shopping district, this center is one of Seoul\u0027s premier performing arts complexes. Featuring a grand theater, medium theater, and gallery exhibition spaces, it regularly hosts world-class musicals, ballets, classical concerts, and contemporary art exhibitions. As the premiere venue for many internationally acclaimed Korean original musicals, it is an essential cultural spot for performing arts and musical theater lovers.", "name": "Chungmu Arts Center", "transport": "Subway Lines 2 \u0026 6, Sindang Station, Exit 9 (approx. 3-minute walk)"}, {"address": "530 Cheonggyecheon-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 stars | Reached by following Cheonggyecheon Stream eastward from Dongdaemun, this museum features a striking elongated glass facade symbolizing the clear flowing water. Exhibits chronicle the full story of Cheonggyecheon\u2014from a natural Joseon-era stream, post-Korean War wooden shantytowns, and covered elevated expressways during industrialization, to its modern ecological restoration. Scale models and rich historical photos offer deep insights into Seoul\u0027s urban evolution.", "name": "Cheonggyecheon Museum", "transport": "Subway Line 2, Sangwangsimni Station, Exit 2 (transfer to bus), or walk eastward along Cheonggyecheon Stream from Dongdaemun"}, {"address": "280 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.1 stars | Situated on the edge of the bustling Dongdaemun shopping district, this historic Catholic church features a dignified, classical design that offers a peaceful and sacred sanctuary amid the vibrant city energy. The interior boasts rich wooden vaulted ceilings and exquisite stained glass, creating a serene space for reflection. On Sundays and special feast days, solemn church bells and mass ceremonies add a deep spiritual touch to this modern city that never sleeps.", "name": "Dongdaemun Catholic Church", "transport": "Subway Lines 1 \u0026 4, Dongdaemun Station, Exit 6 (approx. 2-minute walk)"}, {"address": "288 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Heunginjimun (Dongdaemun Gate) is National Treasure No. 1 and one of the eight major gates of the Seoul City Wall. The adjacent park slopes gently along the ancient wall, leading to a top-level exhibition area and viewing deck overlooking Dongdaemun Gate and the cityscape. Educational signboards along the path explain wall construction techniques and architecture. Lit up brilliantly at night, it\u0027s a popular spot blending historic heritage with night view aesthetics.", "name": "Heunginjimun Park \u0026 Exhibition Space", "transport": "Directly connected to Exit 1 of Dongdaemun Station (Subway Lines 1 \u0026 4)"}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "70, Jong-ro 6-ga, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | Located right next to Heunginjimun (Dongdaemun Gate), Dongdaemun Seonggwak Park is a hilltop park built along the ancient Hanyangdoseong Seoul City Wall. It features a gentle walking trail that follows the mountain terrain, surrounded by lush vegetation and beautiful seasonal views. At sunset, the ancient stone walls create a striking visual contrast with the modern architecture of the nearby Dongdaemun DDP, making it the best photography spot to capture Seoul\u0027s blend of old and new. When illuminated at night, it exudes an incomparably romantic atmosphere.", "name": "Dongdaemun Seonggwak Park", "transport": "Subway Lines 1 or 4, Dongdaemun Station, Exit 1, about a 2-minute walk."}, {"address": "Cheonggyecheon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Cheonggyecheon Stream is an urban ecological restoration stream running through downtown Seoul. The section passing through the Dongdaemun shopping district (around Ogansugyo and Dasangyo bridges) serves as a relaxing oasis for visitors and locals alike. Strolling along the waterfront promenade, you can enjoy clear waters, lush greenery, as well as fish and birds inhabiting the stream. At night, colorful light fountains and artistic illuminations beneath the bridges create a stylishly modern urban night view.", "name": "Cheonggyecheon Stream - Dongdaemun Area", "transport": "Subway Lines 1 or 4, Dongdaemun Station, Exit 6 or 8, about a 3-minute walk to the stream promenade."}, {"address": "281 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Located inside Dongdaemun Design Plaza (DDP), Dongdaemun History \u0026 Culture Park is an urban park that blends historical relics with futuristic landscape design. The park preserves the Joseon-dynasty Military Training Command site, Igansumun (floodgate), and the light towers from the old Dongdaemun Stadium. Lush green lawns contrast nicely with DDP\u0027s sleek metallic architecture, offering visitors a spacious and culturally rich spot to relax after shopping.", "name": "Dongdaemun History \u0026 Culture Park", "transport": "Subway Lines 2, 4, or 5, Dongdaemun History \u0026 Culture Park Station, Exits 1 or 2 directly connected."}, {"address": "41 Naksan-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Extending upward from Dongdaemun Seonggwak Park, Naksan Park gets its name from its mountain shape resembling a camel\u0027s hump. It features well-preserved sections of the Joseon-dynasty Hanyangdoseong Seoul City Wall, offering shaded walking trails with distinct seasonal beauty year-round. It is one of the premier hidden spots to overlook downtown Seoul and Dongdaemun\u0027s vibrant night cityscape. At night, the illuminated stone wall resembles a golden dragon resting on the ridge, creating a uniquely romantic mood.", "name": "Naksan Park", "transport": "Subway Line 4, Hyehwa Station, Exit 2; or walk uphill along the city wall trail from Dongdaemun Station, Exit 1 (approx. 20 minutes)."}, {"address": "257 Dongho-ro, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | Located south of the Dongdaemun shopping district at the eastern foot of Namsan Mountain, Jangchungdan Park is an elegant park rich in history and serene greenery. Featuring tall trees, small bridges over flowing streams, classic Hanok teahouses, and quiet walking paths, the park was originally established to honor patriots of the Eulmi Incident. Today, it serves as a tranquil escape from the bustling commercial area to enjoy beautiful natural scenery and authentic Korean historic charm.", "name": "Jangchungdan Park", "transport": "Subway Line 3, Dongguk Univ. Station, Exit 6, immediately accessible upon exiting; or about a 12-minute walk from the Dongdaemun commercial district."}, {"address": "158 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.0 stars | Located in a prime spot between the Dongdaemun shopping district and Euljiro, Hunryeonwon Park was historically a site for military training and martial arts examinations during the Joseon Dynasty. Today, it has transformed into a green urban ecological space featuring tall zelkova trees, lush lawns, a skate park, and walking trails. It is a hidden city oasis where local office workers and shoppers relax and soak up the sun.", "name": "Hunryeonwon Park", "transport": "Subway Lines 2 or 5, Euljiro 4-ga Station, Exit 7, or Dongdaemun History \u0026 Culture Park Station, Exit 12, about a 5-minute walk."}, {"address": "Changsin-dong, Jongno-gu, Seoul", "feature": "\u2b50 4.6 stars | Starting at Heunginjimun (Dongdaemun Gate) and stretching along the ridge to Hyehwamun Gate, this is the gentlest and most scenic section of the Seoul City Wall Trail. Walking alongside ancient stone walls, you\u0027ll encounter lush trees and seasonal flowers\u2014cherry blossoms and forsythias in spring, and golden ginkgo leaves and red foliage in autumn. Aside from fresh air, it offers constant opportunities to stop and enjoy breathtaking panoramic views of Dongdaemun and downtown Seoul.", "name": "Seoul City Wall Trail - Naksan Section", "transport": "Subway Lines 1 or 4, Dongdaemun Station, Exit 1, start hiking directly from the city wall trailhead."}, {"address": "23-350 Changsin-dong, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | Located on the hills of Changsin-dong behind the Dongdaemun commercial district, this unique natural landscape park was formerly a quarry used during the Japanese colonial period to supply stone for constructing Seoul Station and City Hall. Following urban regeneration, its massive exposed rock cliffs offer a striking blend of natural grandeur and industrial heritage. The observatory at the top provides an expansive panoramic view overlooking Dongdaemun DDP and the surrounding city skyline, making it a highly talked-about hidden urban marvel in recent years.", "name": "Changsin-dong Quarry Observatory Park", "transport": "Subway Line 6, Changsin Station, Exit 1; transfer to Jongno 03 village bus, get off at Naksan Intersection (Naksan Samgeori) stop, and walk about 3 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "281 Eulji-ro, Jung-gu, Seoul", "feature": "\u2b50 4.5 Stars | Designed by world-renowned architect Zaha Hadid, this surreal, futuristic building is Seoul\u0027s most iconic modern landmark and fashion hub. At night, it resembles a silver spaceship landing in the city center, with its curved aluminum facade shimmering under ambient lighting. The column-free interior and geometric staircases are prime photo spots for fashionistas and photography lovers alike. The plaza continuously hosts international art exhibitions, Seoul Fashion Week, and creative markets.", "name": "Dongdaemun Design Plaza (DDP)", "transport": "Take Seoul Subway Line 2, 4, or 5 to Dongdaemun History \u0026 Culture Park Station, Exit 1 (direct access)."}, {"address": "Jongno 6-ga, Jongno-gu, Seoul", "feature": "\u2b50 4.6 Stars | A hilltop park adjacent to Heunginjimun Gate, winding along the ancient Seoul City Wall. It offers the best vantage point for capturing the dramatic contrast between traditional city gates and modern skyscrapers. At dusk and night, warm lights along the wall combined with DDP\u0027s neon glow create a breathtaking, layered night view. In autumn, waving golden silver grass fills the park, attracting visitors to snap romantic K-drama style photos.", "name": "Heunginjimun Park", "transport": "Take Seoul Subway Line 1 or 4 to Dongdaemun Station, Exit 1, and walk about 3 minutes."}, {"address": "288 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.3 Stars | Commonly known as Dongdaemun, this historic gate was the eastern entrance of the Hanseong Fortress Wall during the Joseon Dynasty and is designated as Korea\u0027s Treasure No. 1. The centuries-old landmark creates a captivating contrast against surrounding modern traffic, making it a favorite spot for long-exposure light trail photography. Its unique semi-circular outer wall (Ongseong) and illuminated double-eaved roof look magnificent at night.", "name": "Heunginjimun Gate", "transport": "Take Seoul Subway Line 1 or 4 to Dongdaemun Station, Exit 6 or 7."}, {"address": "Changsin-dong, Jongno-gu, Seoul", "feature": "\u2b50 4.4 Stars | Running through downtown Seoul, the Cheonggyecheon Stream meets the Dongdaemun shopping district at Ogansugyo Bridge, offering a relaxing waterfront space perfect for photos. Exquisite lighting installations and waterfront art adorn the stream banks, reflecting Dongdaemun\u0027s glittering neon lights at night. Seasonal lantern festivals and markets make it a popular photo spot for couples and tourists.", "name": "Cheonggyecheon Ogansugyo Area", "transport": "Take Seoul Subway Line 1 or 4 to Dongdaemun Station, Exit 8, and walk about 2 minutes to the stream bank."}, {"address": "Sindang-dong, Jung-gu, Seoul", "feature": "\u2b50 4.3 Stars | Located within DDP\u0027s green park area, this space seamlessly blends Joseon Dynasty military barracks ruins, the Igansumun floodgate, and modern green walkways. Presenting ancient historical relics as an open-air museum, the ancient stone walls contrast strikingly with DDP\u0027s futuristic curves. Scattered with modern art sculptures amidst lush greenery, it offers an artistic blend of history, culture, and modern design.", "name": "Dongdaemun History \u0026 Culture Park", "transport": "Take Seoul Subway Line 2, 4, or 5 to Dongdaemun History \u0026 Culture Park Station, Exit 1 or 2."}, {"address": "275 Jangchungdan-ro, Jung-gu, Seoul", "feature": "\u2b50 4.2 Stars | Located right outside DOOTA Mall, a landmark shopping center in Dongdaemun, this spacious plaza radiates trendy street style vibes. Featuring large brand art installations, trendy pop-up stores, and creative seating, it attracts many fashion lovers for street style photography. At night, dazzling giant LED screens from surrounding towers and glowing plaza decor capture the vibrant nightlife energy of Seoul.", "name": "DOOTA Mall Outdoor Plaza", "transport": "Take Seoul Subway Line 1 or 4 to Dongdaemun Station, Exit 8, and walk about 3 minutes."}, {"address": "36 Jongro 52-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.3 Stars | A unique retro street district near Dongdaemun bringing together hundreds of wholesale toy and stationery shops. The street is filled with eye-catching toys, scale models, and K-pop merchandise, evoking nostalgic childhood fun. Giant Spider-Man and Iron Man figures hanging outside store entrances serve as popular photo spots, attracting adults and kids alike to discover treasures and snap fun, vintage-vibe photos.", "name": "Changsin-dong Toy \u0026 Stationery Street", "transport": "Take Seoul Subway Line 1 or 6 to Dongmyo Station, Exit 6, and walk about 1 minute."}, {"address": "20 Jangchungdan-ro 13-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 Stars | Centrally located in Dongdaemun, Hyundai City Outlets features an open-air plaza and entrance area that frequently hosts exclusive giant art installations and adorable characters, making it a photo favorite among youth. Decorated with charming lighting, the outdoor lounge area offers a cozy ambiance. Surrounded by trendy lifestyle and food brands, it\u0027s a great spot to snap stylish photos of Seoul\u0027s modern urban lifestyle.", "name": "Hyundai City Outlets Dongdaemun Plaza", "transport": "Take Seoul Subway Line 2, 4, or 5 to Dongdaemun History \u0026 Culture Park Station, Exit 14, and walk about 4 minutes."}], "name": "Popular Photo Spots"}}, "name": "Dongdaemun Shopping District"}, "gangnam_samseong": {"categories": {"cat_1": {"items": [{"address": "531 Bongeunsa-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.6 Stars | Nestled among the bustling skyscrapers of Samseong-dong, Bongeunsa Temple is a thousand-year-old sanctuary built during the Silla Kingdom with over 1,200 years of history. Its most famous landmark is the striking 23-meter-tall statue of Maitreya (the Future Buddha), standing tall on the hillside overlooking the Gangnam cityscape, creating a powerful contrast between ancient tradition and modern life. The temple offers a Templestay program and houses a vast collection of precious Joseon Dynasty Buddhist woodblock carvings, making it a serene cultural haven in the heart of the busy city.", "name": "Bongeunsa Temple", "transport": "About a 1-minute walk from Exit 1 of Bongeunsa Station (Subway Line 9)"}, {"address": "1 Seolleung-ro 100-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 Stars | Listed as a UNESCO World Heritage Site, the Seolleung and Jeongneung Royal Tombs are a rare historic oasis right in the vibrant heart of Gangnam. This quiet complex contains the tombs of King Seongjong (the 9th monarch of the Joseon Dynasty), his queen, and King Jungjong (the 11th monarch). Surrounded by lush ancient forests with well-maintained walking trails, it offers a close-up look at Joseon royal tomb architecture and stone carvings. It\u2019s a wonderful retreat for locals and visitors alike to escape the urban noise and connect with history and nature.", "name": "Seolleung and Jeongneung Royal Tombs", "transport": "About a 5-minute walk from Exit 10 of Seolleung Station (Subway Line 2 or Suin-Bundang Line)"}, {"address": "B1-1F, COEX Mall, 513 Yeongdong-daero, Gangnam-gu, Seoul", "feature": "\u2b50 4.7 Stars | Located at the center of COEX Mall, Starfield Library is one of contemporary Seoul\u0027s most iconic interior architectural landmarks. Towering 13-meter-tall curved bookshelves house over 50,000 books and magazines, lit by warm illumination and natural sunlight filtering through a grand glass ceiling to create a futuristic yet cozy atmosphere. It serves not only as a free public reading and relaxation space, but also as a world-famous photo spot and host venue for various cultural lectures.", "name": "Starfield Library", "transport": "Directly connected via the passageway from Exits 5 or 6 of Samseong Station (Subway Line 2)"}, {"address": "20 Dosan-daero 45-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 Stars | Dosan Park was built to honor Dosan Ahn Chang-ho, a prominent independence activist and educator in modern Korean history. The park features lush greenery and peaceful pathways, housing the joint tomb of Ahn Chang-ho and his wife alongside his bronze statue. Inside the park, the Memorial Hall showcases rare personal photographs, manuscripts, and historical documents detailing key turning points in Korea\u0027s modern journey, making this leafy retreat a deeply educational and cultural landmark amid Gangnam\u0027s trendy neighborhood.", "name": "Dosan Park \u0026 Dosan Ahn Chang-ho Memorial Hall", "transport": "About a 12-minute walk from Exit 3 of Apgujeong Station (Subway Line 3), or near Exit 5 of Apgujeong Rodeo Station (Suin-Bundang Line)"}, {"address": "32 Taekwando-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 Stars | Established in 1972 on a hill in Yeoksam-dong, Gangnam, Kukkiwon is the global headquarters and core hub for the development of Taekwondo. Its architecture harmoniously blends traditional Hanok rooflines with modern concrete structures, conveying a grand and dignified presence. As the ultimate institution for international black belt testing and instructor training, it also houses a Taekwondo museum showcasing the origins, history, and global spread of this traditional martial art\u2014a true holy land for martial arts enthusiasts.", "name": "Kukkiwon (World Taekwondo Headquarters)", "transport": "About a 7-minute walk from Exit 12 of Gangnam Station (Subway Line 2)"}, {"address": "317 Dosan-daero, Gangnam-gu, Seoul", "feature": "\u2b50 4.2 Stars | The Horim Art Center Gangnam Branch is a masterwork of architectural design seamlessly combining modern minimalism with traditional Korean ceramic aesthetics. Featuring warm yellow brickwork and smooth, curving geometric forms inspired by Goryeo celadon and Joseon white porcelain, the exterior itself is a work of art. Inside, it permanently exhibits National Treasure-level ancient ceramics, metalworks, and fine paintings. The dialogue between the building and its historical artifacts makes it a refined cultural highlight in the Sinsa-dong and Apgujeong areas.", "name": "Horim Art Center Gangnam", "transport": "About a 10-minute walk from Exit 5 of Apgujeong Rodeo Station (Suin-Bundang Line)"}, {"address": "511 Yeongdong-daero, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 Stars | Completed in 1988 and standing 54 stories tall (approx. 228 meters), Trade Tower Seoul is one of the most iconic historical skyscrapers in Samseong-dong, Gangnam. Its distinctive stepped, terraced design with steel-and-glass curtain walls symbolizes the rapid economic growth of the \u0027Miracle on the Han River.\u0027 Integrated seamlessly with the COEX Convention \u0026 Exhibition Center, InterContinental Hotel, and Lotte Duty Free, it stands as a historic monument to South Korea\u2019s international trade and an irreplaceable fixture of Gangnam\u0027s skyline.", "name": "Trade Tower Seoul", "transport": "Directly connected to Exit 6 of Samseong Station (Subway Line 2)"}, {"address": "440 Teheran-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.1 Stars | Located at the heart of Teheran-ro, POSCO Center stands as a classic fusion of South Korea\u0027s modern steel industry and commercial architecture. This steel-and-glass building is renowned for its soaring atrium, which houses a massive two-story cylindrical saltwater aquarium as well as a monumental steel sculpture crafted from scrap metal by world-renowned artist Frank Stella. Its avant-garde engineering and artistic integration make it a distinctive architectural landmark in Gangnam\u0027s business district.", "name": "POSCO Center", "transport": "About a 6-minute walk from Exit 1 of Seolleung Station (Subway Line 2 or Suin-Bundang Line)"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "27 Apgujeong-ro 80-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 stars | Located in the bustling district of Apgujeong, K-Hyundai Museum of Art is one of Gangnam\u0027s most iconic contemporary art spaces in Seoul. Breaking away from the solemn atmosphere of traditional museums, it focuses on interactive exhibitions combining pop culture, trends, and digital multimedia. Frequently hosting Instagrammable contemporary art special exhibitions, it is immensely popular among younger generations and art lovers alike. Spanning six floors, the exhibition space regularly rotates different themes\u2014ranging from modern paintings and installation art to light-and-shadow immersive experiences\u2014offering visitors a visually striking and inspiring sensory feast.", "name": "K-Hyundai Museum of Art", "transport": "Subway Suin-Bundang Line \u0027Apgujeongrodeo Station\u0027 Exit 5, approx. 5 mins walk"}, {"address": "6 Eonju-ro 317-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 stars | Nestled near Dosan Park, Horim Museum Sinsa Branch is an exquisite space that seamlessly blends traditional Korean art with modern architectural aesthetics. Featuring a striking exterior composed of red brick and metallic geometric structures, the building itself is a work of art. Inside, it houses an extensive collection of precious ancient Korean artworks, including celadon, white porcelain, Buncheong ware, as well as ancient paintings and calligraphy. Tucked away from the urban hustle, this tranquil and elegant haven is the ultimate destination to delve into Korea\u0027s traditional cultural heritage and master craftsmanship.", "name": "Horim Museum Sinsa Branch", "transport": "Subway Line 3 \u0027Apgujeong Station\u0027 Exit 3 or Suin-Bundang Line \u0027Apgujeongrodeo Station\u0027 Exit 5, approx. 12 mins walk"}, {"address": "11 Eonju-ro 133-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 stars | Located in Nonhyeon-dong, Platform-L is a cutting-edge multi-disciplinary cultural center designed by a renowned architectural firm, featuring an iconic geometric grid facade and an open courtyard. Far more than just an exhibition space, it serves as a dynamic platform encompassing contemporary art exhibitions, performing arts, film screenings, and design seminars. Dedicated to supporting cross-disciplinary creations by emerging artists, its exhibitions are avant-garde and experimental. With an exquisite cafe and a curated design lifestyle shop on-site, it exudes a rich artistic vibe\u2014perfect for immersing yourself in the pulse of contemporary design.", "name": "Platform-L Contemporary Art Center", "transport": "Subway Line 7 \u0027Hakdong Station\u0027 Exit 10, approx. 4 mins walk"}, {"address": "441 Dosan-daero, Gangnam-gu, Seoul", "feature": "\u2b50 4.6 stars | Crafted by Pritzker Prize-winning architects Herzog \u0026 de Meuron, SONGEUN Art Space instantly became an architectural and artistic landmark in Cheongdam-dong upon opening, thanks to its striking sharp-angled triangular design and meticulously textured concrete exterior. The center focuses on promoting exceptional domestic and international contemporary art, offering expansive column-free exhibition halls and underground spaces interplayed with light and shadow. Free to the public (advance reservation required) and offering top-tier guided tours, it is an absolute must-visit in Gangnam for world-class contemporary art and design.", "name": "SONGEUN Art Space", "transport": "Subway Suin-Bundang Line \u0027Apgujeongrodeo Station\u0027 Exit 3, approx. 10 mins walk"}, {"address": "827 Eonju-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.2 stars | Housed within space*c, a cultural center established by the famous Korean cosmetics brand Coreana, the Coreana Museum of Art is a specialized institution focusing on research and discourse surrounding the body, feminism, and contemporary aesthetics. It regularly curates deeply insightful and forward-thinking special exhibitions featuring video art, paintings, sculptures, and installations. In addition to the art museum, the building also houses the Coreana Cosmetics Museum, displaying historic Korean women\u0027s cosmetic artifacts and beauty history, offering a truly unique aesthetic perspective.", "name": "Coreana Museum of Art", "transport": "Subway Line 3 \u0027Apgujeong Station\u0027 Exit 3, approx. 8 mins walk"}, {"address": "440 Teheran-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 stars | Located on the B1 floor of the POSCO Center building near Samseong-dong and Seolleung Station, POSCO Art Museum is a prime example of corporate patronage dedicated to enriching culture and the arts. The museum regularly hosts modern art exhibitions, traditional Korean painting shows, and sponsored exhibitions for emerging young artists. The building\u0027s main atrium features a breathtaking large cylindrical aquarium and impressive public art installations, making it a serene cultural oasis amidst the bustling business district where office workers and visitors alike can enjoy high-quality contemporary art for free.", "name": "POSCO Art Museum", "transport": "Subway Line 2/Suin-Bundang Line \u0027Seolleung Station\u0027 Exit 1, approx. 6 mins walk"}, {"address": "27 Teheran-ro 33-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 stars | Situated along Teheran-ro in the heart of Gangnam, Yeoksam-dong Catholic Church combines modern architectural beauty with a solemn and sacred atmosphere. The main sanctuary boasts graceful geometric lines and a grand interior design, with stained glass windows casting a brilliant yet serene glow when sunlight filters through. Serving as a spiritual sanctuary for local parishioners, its sleek and elegant architectural style also draws many photography and architecture enthusiasts seeking a moment of peace amidst the vibrant energy of Gangnam.", "name": "Yeoksam-dong Catholic Church", "transport": "Subway Line 2 \u0027Yeoksam Station\u0027 Exit 8, approx. 5 mins walk"}, {"address": "45 Apgujeong-ro 36-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 stars | Located in the Apgujeong/Sinsa-dong area, Somang Presbyterian Church is one of the largest and most historic Christian churches in Gangnam. The expansive church complex seamlessly blends Gothic elements with modern red-brick architecture, set amidst lush greenery and a tranquil environment. Hosting inspiring worship services alongside cultural spaces and community centers, it serves as a key cultural landmark to observe contemporary Korean Christian heritage and local community life in Gangnam.", "name": "Somang Presbyterian Church", "transport": "Subway Line 3 \u0027Apgujeong Station\u0027 Exit 2, approx. 8 mins walk"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "20 Dosan-daero 45-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 Stars | Dosan Park is a memorial park established to honor Ahn Chang-ho (pen name Dosan), a prominent Korean independence activist. Located between the bustling Apgujeong and Cheongdam-dong luxury shopping districts, it serves as a serene urban oasis. Lush with green trees, the park features the Ahn Chang-ho Memorial Hall, a bronze statue, and smooth, tidy walking paths. Beautiful throughout the seasons, cherry blossoms bloom here in spring, while golden ginkgo and red maple leaves line the paths in autumn. It is the perfect place to relax and enjoy a quiet touch of nature after boutique shopping or cafe-hopping nearby.", "name": "Dosan Park", "transport": "Take Subway Suin\u2013Bundang Line to Apgujeongrodeo Station (Exit 5) and walk for about 10 minutes."}, {"address": "1 Seolleung-ro 100-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 Stars | Designated as a UNESCO World Heritage site, Seonjeongneung is a rare, expansive royal tomb park nestled among Gangnam\u0027s bustling skyscrapers. It holds Seonneung (the tombs of King Seongjong, the 9th monarch of the Joseon Dynasty, and Queen Jeonghyeon) and Jeongneung (the tomb of King Jungjong, the 11th monarch). The park features a vast pine forest and ancient lush trees with a circular shaded trail, making it an excellent retreat for office workers and visitors to escape the heat, take a leisurely stroll, and experience a rich blend of history and nature.", "name": "Seonjeongneung Royal Tombs Park", "transport": "Take Subway Line 2 or Suin\u2013Bundang Line to Seolleung Station (Exit 10) and walk for about 5 minutes."}, {"address": "531 Bongeunsa-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.6 Stars | Located directly opposite COEX in Samseong-dong, Bongeunsa is an ancient temple with over a thousand years of history. Built against the hillside, it is surrounded by lush woodlands and beautifully manicured mountain gardens. Beyond its magnificent 23-meter-tall statue of Maitreya Buddha, the trails behind the temple are rich in phytoncides, featuring magnolias and cherry blossoms in spring, scenic lotus ponds in summer, and vibrant autumn foliage. From the higher points of the temple grounds, visitors can enjoy a unique urban vista where COEX and modern Gangnam skyscrapers intersect.", "name": "Bongeunsa Temple Grounds", "transport": "Take Subway Line 9 to Bongeunsa Station (Exit 1) and walk for about 2 minutes."}, {"address": "Area of Dogok-dong, Gangnam-gu, Seoul (Yangjaecheon-ro, Gangnam-gu, Seoul)", "feature": "\u2b50 4.5 Stars | Yangjaecheon is an ecological stream spanning Gangnam-gu and Seocho-gu, flanked by spacious, clean waterfront parklands and dedicated bike lanes. It is famed for its spring Yangjaecheon Cherry Blossom Festival, where cherry blossoms and forsythias weave a pink and yellow floral canopy. In summer and autumn, soaring dawn redwood trees and silver grass create captivating scenery. With egrets and ducks swimming in the stream, the ecosystem is beautifully preserved, making it a favorite spot for morning jogs and evening walks among local Gangnam residents.", "name": "Yangjaecheon Stream Park", "transport": "Take Subway Line 3 or Suin\u2013Bundang Line to Dogok Station (Exit 4) and walk for about 8 minutes to reach the Yangjaecheon walking trail."}, {"address": "26 Samseong-ro 133-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.2 Stars | Situated in Cheongdam-dong, an area known for high-end residences and luxury boutiques, Cheongdam Park is a wooded urban park that preserves its natural hilly terrain. Densely shaded with trees, it offers wooden boardwalk trails, exercise equipment, badminton courts, and pavilions for resting. In contrast to Gangnam\u0027s bustling commercial streets, the vibe here is serene and peaceful\u2014perfect for travelers looking to escape crowds, take a light hike, or enjoy a morning forest bath.", "name": "Cheongdam Park", "transport": "Take Subway Line 7 to Cheongdam Station (Exit 14) and walk for about 3 minutes."}, {"address": "221-124 Jamwon-ro, Seocho-gu, Seoul", "feature": "\u2b50 4.4 Stars | Located right next to Sinsa-dong and Apgujeong in Gangnam, Jamwon Hangang Park stretches 5.4 kilometers along the Han River. It features expansive grassy lawns, dedicated cycling tracks, an outdoor swimming pool, and the popular Pink Muhly Garden. In autumn, the sea of pink blooms draws crowds of visitors taking photos. At dusk, it becomes a hotspot for viewing the Han River sunset and the illuminated N Seoul Tower across the water, exuding a uniquely relaxed Gangnam vacation vibe.", "name": "Jamwon Hangang Park", "transport": "Take Subway Line 3 to Sinsa Station (Exit 5) and walk for about 15 minutes to reach the Hangang Park entrance."}, {"address": "Area of Gaepo-dong, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 Stars | Situated in southern Gangnam-gu with an elevation of about 293 meters, Daemosan is Gangnam\u0027s premier natural forest park and hiking destination. Featuring gentle slopes with well-maintained boardwalks and dirt trails, it is ideal for family-friendly hikes. The summit observatory offers an unobstructed panoramic view of Gangnam, Lotte World Tower, and the distant Han River. Covered in vibrant foliage during autumn, it is the top spot to experience nature\u0027s charm right on the outskirts of Seoul.", "name": "Daemosan Natural Park", "transport": "Take Subway Line 3 to Irwon Station (Exit 4) and walk for about 10 minutes to reach the trailhead."}, {"address": "27 Teheran-ro 7-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.1 Stars | Located in Gangnam\u0027s bustling financial center (near Yeoksam Station and Kukkiwon), Yeoksam Park is a compact and charming urban oasis. Built along a gentle hill, it features dense trees, resting pavilions, and a circular walking path, cleverly screening out the noisy traffic outside. A secret garden for local professionals to unwind or take lunch breaks, the park comes alive in spring with blooming cherry blossoms and sweet-scented lilacs.", "name": "Yeoksam Park", "transport": "Take Subway Line 2 to Gangnam Station (Exit 12) or Yeoksam Station (Exit 4) and walk for about 7 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "513 Yeongdong-daero, Gangnam-gu, Seoul (Inside COEX Mall, Samseong-dong)", "feature": "\u2b50 4.7 stars | Located inside COEX Mall, Starfield Library is one of Seoul\u0027s most iconic and popular landmarks for photos. Featuring towering 13-meter-high bookshelves reaching up to the ceiling, it houses over 50,000 books and magazines, radiating an awe-inspiring glow and cultural charm. Equipped with comfortable seating and reading spaces, every shot here looks like a magazine cover\u2014whether flooded with daytime sunlight streaming through the glass ceiling or lit up by warm yellow lights glowing against the book walls at night. It is an unmissable hotspot when visiting Seoul.", "name": "Starfield Library", "transport": "Subway Line 2 Samseong Station, Exit 5 or 6, about a 3-minute walk via the underground passage"}, {"address": "50 Apgujeong-ro 46-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.5 stars | HAUS DOSAN is a trendy, futuristic flagship complex created by the renowned Korean eyewear brand Gentle Monster. It combines its fragrance brand Tamburins and the unique dessert cafe Nudake. The entire building is filled with avant-garde art installations and surreal exhibition spaces, featuring dynamic giant kinetic robots and visually striking artwork. Attracting countless fashionistas and influencers for photos, it is the premier destination in Gangnam to experience Korea\u0027s cutting-edge trend art.", "name": "HAUS DOSAN", "transport": "Subway Suin-Bundang Line Apgujeong Rodeo Station, Exit 5, about a 10-minute walk"}, {"address": "531 Bongeunsa-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.6 stars | Bongeunsa Temple is an ancient temple with over a thousand years of history, nestled amid the bustling skyscrapers of Samseong-dong, creating a striking contrast between the ancient and modern. The 23-meter-tall Maitreya Buddha statue inside the temple grounds is a popular photo spot\u2014majestic against the backdrop of modern skyscrapers, offering a unique sense of serenity and grandeur. In spring, the grounds bloom with cherry and plum blossoms, drawing countless photography enthusiasts.", "name": "Bongeunsa Temple", "transport": "Subway Line 9 Bongeunsa Station, Exit 1, about a 2-minute walk"}, {"address": "Sinsa-dong area, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 stars | Lined with ginkgo trees along the entire street, Sinsa-dong Garosu-gil is bathed in golden leaves during autumn, exuding a romantic European vibe. Home to international and local designer boutiques, chic Instagrammable cafes, and trendy pop-up shops, it is not only a hub for fashion lovers but also offers stylish street-photography backdrops everywhere you turn. A must-visit destination to experience Seoul\u0027s sophisticated urban lifestyle.", "name": "Garosu-gil", "transport": "Subway Line 3 or Shinbundang Line Sinsa Station, Exit 8, about a 5-minute walk"}, {"address": "513 Yeongdong-daero, Gangnam-gu, Seoul (COEX East Gate Plaza)", "feature": "\u2b50 4.2 stars | Erected to commemorate Psy\u0027s global hit song \"Gangnam Style,\" this bronze sculpture stands outside the east gate of the COEX Convention \u0026 Exhibition Center. The giant bronze hands recreate the iconic crossed-wrist horse-riding dance move. When visitors stand beneath the sculpture, music automatically plays along with night light effects. It is a fun, iconic photo spot that pop music fans and tourists around the world must visit when in Gangnam.", "name": "Gangnam Style Statue", "transport": "Subway Line 2 Samseong Station, Exit 6, about a 2-minute walk"}, {"address": "Around 407 Apgujeong-ro, Gangnam-gu, Seoul", "feature": "\u2b50 4.3 stars | Located in Cheongdam-dong and Apgujeong, K-Star ROAD is a unique street designed specifically for K-pop fans. The entire street is lined with large bear-shaped sculptures called GangnamDols, painted with logos and motifs of top K-pop groups like BTS, EXO, Super Junior, and TWICE. Fans can walk along the street to find their favorite idol sculptures for photos while immersing themselves in Gangnam\u0027s rich K-wave culture.", "name": "K-Star ROAD", "transport": "Subway Suin-Bundang Line Apgujeong Rodeo Station, Exit 2"}, {"address": "1 Seolleung-ro 100-gil, Gangnam-gu, Seoul", "feature": "\u2b50 4.4 stars | Designated as a UNESCO World Heritage site, Seonjeongneung holds the royal tombs of King Seongjong and King Jungjong of the Joseon Dynasty. Surrounded by bustling skyscrapers and modern office buildings, this sprawling green park creates a unique urban oasis visual spectacle. Lush pine forests and traditional royal tombs form highly atmospheric walking trails, attracting visitors seeking scenic, nature-filled, and artistic photo backdrops.", "name": "Seonjeongneung Royal Tombs", "transport": "Subway Line 2 or Suin-Bundang Line Seolleung Station, Exit 10, about a 5-minute walk"}, {"address": "513 Yeongdong-daero, Gangnam-gu, Seoul (B1, COEX Mall)", "feature": "\u2b50 4.5 stars | COEX Aquarium is one of Korea\u0027s largest indoor marine aquariums, housing tens of thousands of marine creatures across multiple themed zones. Thoughtfully designed, the mystical underwater tunnel, jellyfish exhibits, and cute manatee and penguin feeding shows offer a rich visual feast. Immersion light projections in aquatic blue tones and a massive underwater viewing wall make it a popular photo spot for romantic dates and dreamlike photography.", "name": "COEX Aquarium", "transport": "Subway Line 9 Bongeunsa Station, Exit 7, about a 3-minute walk"}], "name": "Top Photo Spots"}}, "name": "Gangnam and Samseong COEX"}, "hongdae_yeonnam": {"categories": {"cat_1": {"items": [{"address": "8 Seongsan-ro 15-gil, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc131\uc0b0\ub85c15\uae38 8)", "feature": "\u2b50 4.4 stars | Located in Seogyo-dong, President Choi Kyu-hah\u0027s House is a protected historic building that preserves the modern 1970s Korean architectural style and lifestyle. This long-time residence of South Korea\u0027s 10th president retains original furniture, home appliances, and daily necessities from the era, exuding a nostalgic atmosphere of modest living. Blending traditional Korean details with modern Western architectural elements, it stands as a precious, quiet modern landmark right next to the bustling Hongdae district, allowing visitors to step back in time and experience Seoul\u0027s history from the 1970s and 1980s.", "name": "Choi Kyu-hah\u0027s House", "transport": "Approx. 10 mins walk from Exit 1 of Hongik Univ. Station (Subway Line 2, Gyeongui-Jungang Line, AREX)"}, {"address": "6 Tojeong-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \ud1a0\uc815\ub85c 6)", "feature": "\u2b50 4.6 stars | Perched on a cliff overlooking the Han River, Jeoldusan Martyrs\u0027 Shrine is a solemn and poignant historic landmark in Korean Catholic history. During the Byeongin Persecution of 1866, numerous Catholics were executed here, giving rise to its name \u0027Jeoldusan\u0027 (Beheading Mountain). Designed by a famous architect, the shrine complex features a distinctive dome and memorial building highly acclaimed for architectural artistry. The memorial hall displays a rich collection of martyr artifacts and sacred art, set within peaceful, elegant grounds that seamlessly blend natural beauty with deep historic resonance.", "name": "Jeoldusan Martyrs\u0027 Shrine", "transport": "Approx. 10 mins walk from Exit 7 of Hapjeong Station (Subway Lines 2 \u0026 6)"}, {"address": "46 Yanghwajin-gil, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc591\ud654\uc9c4\uae38 46)", "feature": "\u2b50 4.5 stars | Established in the late 19th century during the late Joseon Dynasty, Yanghwajin Foreign Missionary Cemetery stands as a vital witness to Korea\u0027s modern history, open-port era, and advancements in education and medicine. Over 140 foreign missionaries and family members who contributed deeply to Korea\u0027s modernization\u2014including founders of Yonsei and Ewha Womans Universities\u2014are laid to rest here. Lush with greenery, the cemetery features a historic memorial hall and elegant Western-style cemetery architecture, offering a unique cultural landscape rich in modern Korean history.", "name": "Yanghwajin Foreign Missionary Cemetery", "transport": "Approx. 6 mins walk from Exit 6 of Hapjeong Station (Subway Lines 2 \u0026 6)"}, {"address": "Donggyo-ro 52-gil area, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \ub3d9\uad50\ub85c52\uae38 \uc77c\ub300)", "feature": "\u2b50 4.5 stars | Gyeongui Line Forest Park is a prime example of Seoul\u0027s urban renewal and railway heritage transformation. Originally built in 1905 during the Japanese colonial era, the Gyeongui Line connected Seoul to Sinuiju. After the tracks were moved underground, the abandoned surface rail corridor was transformed into a miles-long linear park, with the Yeonnam section affectionately nicknamed \u0027Yeontral Park.\u0027 Designers intentionally preserved original tracks, crossing signs, and railway infrastructure, beautifully harmonizing modern urban landscape design with a century of rail history.", "name": "Gyeongui Line Forest Park - Yeonnam Section", "transport": "Right outside Exit 3 of Hongik Univ. Station (Subway Line 2, Gyeongui-Jungang Line, AREX)"}, {"address": "87 Jeungsan-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc99d\uc0b0\ub85c 87)", "feature": "\u2b50 4.5 stars | Formerly the Mapo Oil Reserve Base built in response to the 1970s oil crisis, this site remained hidden at the foot of the mountain for over 40 years. In 2017, an urban regeneration project transformed the massive abandoned industrial site into a multi-cultural complex focused on ecology, culture, and art. The six original giant oil tanks and concrete structures were preserved and reimagined into performance halls, exhibition spaces, and public plazas, displaying striking brutalist industrial architecture and sustainable urban concepts.", "name": "Oil Tank Culture Park", "transport": "Approx. 10 mins walk from Exit 2 of World Cup Stadium Station (Subway Line 6)"}, {"address": "65 Eoulmadang-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc5b4\uc6b8\ub9c8\ub2f9\ub85c 65)", "feature": "\u2b50 4.4 stars | KT\u0026G Sangsangmadang is one of Hongdae\u0027s most iconic modern architectural and contemporary culture landmarks. Featuring a striking exterior with bold geometric lines, this seven-story building houses an independent cinema, art gallery, live performance venue, design shop, and cafe. Since opening in 2007, it has championed local Korean indie artists and designers, driving the fusion of Hongdae\u0027s indie culture with modern urban architectural space.", "name": "KT\u0026G Sangsangmadang Hongdae", "transport": "Approx. 10 mins walk from Exit 9 of Hongik Univ. Station (Line 2) or 8 mins walk from Exit 3 of Hapjeong Station"}, {"address": "157 Wausan-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc640\uc6b0\uc0b0\ub85c 157)", "feature": "\u2b50 4.3 stars | Opened in 1985, Sanwoolim Theater is one of the oldest private small theater buildings in the Hongdae area, serving as a living fossil of Korea\u0027s small theater culture and contemporary drama development. Its signature red-brick exterior exudes a rich vintage literary vibe, hosting high-caliber stage plays and literary dramas for decades. The building not only witnessed Hongdae\u0027s evolution from a quiet academic neighborhood into an avant-garde art hub, but also preserves the authentic spatial character of 1980s Seoul theater architecture.", "name": "Sanwoolim Theater", "transport": "Approx. 6 mins walk from Exit 6 of Hongik Univ. Station (Subway Line 2, Gyeongui-Jungang Line, AREX)"}, {"address": "94 Wausan-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc640\uc6b0\uc0b0\ub85c 94)", "feature": "\u2b50 4.3 stars | As Korea\u0027s premier institution for visual arts and architectural design, Hongik University\u0027s campus features the Hongik University Museum of Art (HOMA), embodying the union of modern art education and avant-garde architectural design. The museum\u0027s design boasts open geometric structures, exposed concrete, and floor-to-ceiling glass, showcasing a minimalist aesthetic. Hosting contemporary art exhibits, architectural graduation shows, and international exchange exhibitions, it is an intellectual landmark for understanding Hongdae\u0027s artistic and architectural identity.", "name": "Hongik University Museum of Art (HOMA)", "transport": "Approx. 9 mins walk from Exit 9 of Hongik Univ. Station (Line 2) or 5 mins walk from Exit 2 of Sangsu Station (Line 6)"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "65 Eoulmadang-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc5b4\uc6b8\ub9c8\ub2f9\ub85c 65)", "feature": "\u2b50 4.4 stars | KT\u0026G Sangsangmadang is an iconic complex cultural space in the Hongdae area. This 7-story building houses independent art exhibition halls, design select shops, a vinyl record section, and a performance hall. The galleries on the 4th and 5th floors regularly host special exhibitions featuring emerging Korean artists and international contemporary photographers, showcasing modern paintings, new media art, and sculptures. Exuding avant-garde vibes and modern trends, it is a must-visit sanctuary for experiencing contemporary Korean youth culture, creative arts, and visual design.", "name": "KT\u0026G Sangsangmadang Gallery", "transport": "Subway Line 2, Hongik Univ. Station, Exit 9, approx. 10-minute walk"}, {"address": "42 Seongsan-ro 20-gil, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc131\uc0b0\ub85c20\uae38 42)", "feature": "\u2b50 4.6 stars | Tucked away in a quiet alley at the border of Yeonnam-dong and Seogyo-dong, this historical human rights museum is housed in a repurposed old residence, designed with a sense of privacy and contemplation. The museum poignantly documents the tragic history suffered by \u0027comfort women\u0027 during WWII while actively promoting global women\u0027s human rights and peace movements. Combining historical artifacts, video archives, sound installations, and artwork, it offers visitors a deeply moving and reflective experience, making it a highly educational and meaningful cultural site.", "name": "War \u0026 Women\u0027s Human Rights Museum", "transport": "Subway Line 2, Hongik Univ. Station, Exit 1, transfer to Mapo Bus 05 and get off at Seongsan 1-dong Community Center"}, {"address": "B2, 20 Hongik-ro 3-gil, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \ud64d\uc775\ub85c3\uae38 20 \uc9c0\ud5582\uce35)", "feature": "\u2b50 4.3 stars | Located in the heart of Hongdae, \u0027Coconut Box\u0027 is a unique cultural space blending Balinese resort vibes with digital media art. The venue features several immersive light and shadow exhibition halls that recreate masterpieces by Van Gogh, Klimt, and others using large-scale projection technology. It also offers tropical-style bamboo cabanas for relaxing and fun ball pits. Combining contemporary digital art displays with fantastic photo spots, it is immensely popular among younger generations and couples.", "name": "Coconut Box", "transport": "Subway Line 2, Hongik Univ. Station, Exit 9, approx. 5-minute walk"}, {"address": "26 Yeonnam-ro 7-gil, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc5f0\ub0a8\ub85c7\uae38 26)", "feature": "\u2b50 4.5 stars | Tucked away in an alley near the lively Yeonnam-dong Park, Yeonnam-dong Catholic Church serves as a peaceful spiritual sanctuary for local residents and parishioners. The architecture features a sleek modern Gothic style, with red brick walls, elegant arches, and stained-glass windows creating a tranquil oasis amid the bustling hipster neighborhood. Inside, the solemn atmosphere is enhanced by natural light filtering through stained glass, inviting visitors to pause and soak in a moment of quiet reflection.", "name": "Yeonnam-dong Catholic Church", "transport": "Subway Line 2, Hongik Univ. Station, Exit 3, approx. 10-minute walk"}, {"address": "Munheon Hall, Hongik University, 94 Wausan-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc640\uc6b0\uc0b0\ub85c 94)", "feature": "\u2b50 4.2 stars | As the modern art museum affiliated with Hongik University\u2014South Korea\u0027s premier institution for fine arts\u2014HoMA is located inside the Munheon Hall on campus. It regularly hosts exhibitions showcasing works by top faculty and students, graduation art shows, and international contemporary art exchanges. The spacious, industrial-style gallery features contemporary installations, oil paintings, visual communication designs, and digital media, serving as a hub for Korea\u0027s cutting-edge creative energy and artistic heritage.", "name": "Hongik Museum of Art (HoMA)", "transport": "Subway Line 2, Hongik Univ. Station, Exit 9, approx. 8-minute walk to the main entrance"}, {"address": "157 Wausan-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc640\uc6b0\uc0b0\ub85c 157)", "feature": "\u2b50 4.5 stars | Established in 1985, Sanwoolim Theater is a pioneering cradle of modern Korean theater and arts salons, located along the Gyeongui Line Book Street towards Sinchon. Renowned for high-quality small-theater plays, its annexed gallery and cultural space regularly host indie painting exhibitions, illustration shows, and literary talks. With its quaint, historic building and rich literary ambiance, it stands as an unmissable spiritual landmark of Hongdae\u0027s indie art scene.", "name": "Sanwoolim Theater \u0026 Gallery", "transport": "Gyeongui-Jungang Line, Hongik Univ. Station, Exit 6, approx. 5-minute walk"}, {"address": "B2, 20 Hongik-ro 3-gil, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \ud64d\uc775\ub85c3\uae38 20 \uc9c0\ud5582\uce35)", "feature": "\u2b50 4.1 stars | Located in the basement of central Hongdae\u0027s shopping district, Trickeye Museum is the world\u0027s first interactive trick-art museum to integrate AR (Augmented Reality) technology. It showcases hundreds of 3D optical illusion paintings; by downloading the dedicated app, visitors can watch characters and monsters come to life through their phones. The facility also houses an Ice Museum, delivering a fun, immersive visual experience for visitors of all ages.", "name": "Trickeye Museum Seoul", "transport": "Subway Line 2, Hongik Univ. Station, Exit 9, approx. 5-minute walk"}, {"address": "55-1 Eoulmadang-ro, Mapo-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \ub9c8\ud3ec\uad6c \uc5b4\uc6b8\ub9c8\ub2f9\ub85c 55-1)", "feature": "\u2b50 4.3 stars | Nestled in a quiet neighborhood right next to Hongdae\u0027s main shopping area, Seogyo Presbyterian Church is a historic house of worship in Mapo-gu. Built with grand grey stone and classic Gothic spires, the church displays an elegant, majestic aesthetic that creates a striking contrast with the lively surrounding trendy shops. Architecture enthusiasts often visit to admire its delicate exterior, while romantic lights decorate the building during Christmas and holidays, offering a warm and cultural ambiance.", "name": "Seogyo Presbyterian Church", "transport": "Subway Line 2, Hongik Univ. Station, Exit 9, approx. 7-minute walk"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "239-1 Yeonnam-dong, Mapo-gu, Seoul", "feature": "\u2b50 4.6 stars | Affectionately dubbed \u0027Yeontral Park\u0027 by locals, this long green park was built over a disused railway line. Featuring manicured lawns, clear streams, and trendy cafes lining both sides, it\u0027s the most popular picnic and walking spot in the Hongdae and Yeonnam-dong areas. In the afternoons and evenings, locals and tourists gather on picnic mats to drink beer and soak in the relaxing urban oasis vibes.", "name": "Gyeongui Line Forest Park - Yeonnam-dong Section", "transport": "About 1 min walk from Exit 3 of Hongik Univ. Station (Subway Line 2 / Gyeongui-Jungang Line / AREX)"}, {"address": "50-4 Wausan-ro 35-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.4 stars | Built along the old Gyeongui Line railway, this eco-friendly, hip literary park turns train carriages into miniature bookstores and exhibition spaces. The park is dotted with outdoor sculptures, old train tracks, and landscaped gardens, making it beautiful year-round. Beyond taking a leisurely stroll, you can browse independent bookstores and creative products inside the carriages, offering a unique blend of green nature and literary charm.", "name": "Gyeongui Line Book Street", "transport": "Right outside Exit 6 of Hongik Univ. Station (Subway Line 2 / Gyeongui-Jungang Line)"}, {"address": "117 Wausan-ro 19-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.3 stars | Located behind Hongik University, Wausan Nature Park gets its name from the mountain\u0027s resemblance to a lying cow. It is a rare cool, green sanctuary right in the heart of bustling Hongdae, featuring lush woodlands, badminton courts, fitness equipment, and mountain trails. An observatory point at the top offers views of Hongdae\u0027s commercial district and the Mapo-gu skyline\u2014a secret garden for local morning workouts and escaping the crowds.", "name": "Wausan Sports Park", "transport": "About 12 min walk from Exit 2 of Sangsu Station, or walk up from the back gate of Hongik University"}, {"address": "200-88 Seongsan-dong, Mapo-gu, Seoul", "feature": "\u2b50 4.2 stars | Adjacent to Yeonnam-dong, Seongmisan is a small hill park rich in community spirit, preserving pristine natural ecology and forest trails. The summit offers resting pavilions and exercise facilities, covered with cherry blossoms and azaleas in spring, and vibrant autumn foliage in fall. It\u0027s a peaceful local sanctuary near Hongdae, perfect for slowing down and taking a light hike.", "name": "Seongmisan Park", "transport": "About 10 min walk from Exit 1 of Gajwa Station (Gyeongui-Jungang Line), or walk from Yeonnam-dong"}, {"address": "36-6 Wausan-ro 19-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.1 stars | Commonly known as \u0027Hongdae Free Park\u0027 or \u0027Hongdae Playground\u0027, this park sits right at the heart of the Hongdae shopping district. Though small, it is world-famous for hosting the long-standing Free Market and busking performances. With shaded seating areas, playground facilities, and vibrant street graffiti, it\u0027s the ultimate open green space to soak in Hongdae\u0027s energetic busking and street art culture.", "name": "Hongdae Children\u0027s Park", "transport": "About 8 min walk from Exit 9 of Hongik Univ. Station (Subway Line 2)"}, {"address": "262-1 Yeonhui-dong, Seodaemun-gu, Seoul", "feature": "\u2b50 4.5 stars | Located along the Hongjecheon Stream just north of Yeonnam-dong, this park features a majestic artificial waterfall. Well-maintained waterfront trails, musical fountains, and lush landscaping line the clear stream. Each season brings unique views, especially in spring when blooming cherry blossoms form a pink tunnel. An outdoor cafe right next to the waterfall lets visitors enjoy the natural scenery to the sound of cascading water.", "name": "Hongjecheon Falls Plaza", "transport": "About 15 min walk from Yeonnam-dong, or take Mapo Bus 06 from Hongik Univ. Station and get off at Yeonhui Junction"}, {"address": "467 Maponaaru-gil, Mapo-gu, Seoul", "feature": "\u2b50 4.5 stars | Located right next to Hongdae and Mangwon-dong, this section of Hangang Park boasts expansive riverside lawns and waterfront paths. It houses the famous \u0027Seoul Battleship Park\u0027 featuring decommissioned naval ships, alongside dedicated bike lanes, a swimming pool, and outdoor relaxation areas. In the evening, it offers stunning views of the Han River sunset and Seongsan Bridge lit up at night\u2014a favorite spot for local youth to rent picnic mats and enjoy fried chicken and beer.", "name": "Mangwon Hangang Park", "transport": "Transfer to Mapo Bus 09 from Exit 2 of Mangwon Station (Subway Line 6), or walk about 20 min from Hongdae"}, {"address": "87 Jeungsan-ro, Mapo-gu, Seoul", "feature": "\u2b50 4.5 stars | An eco-friendly park and complex cultural space transformed from a former abandoned oil depot. Six giant oil storage tanks have been cleverly repurposed into exhibition halls, theaters, and eco-pavilions, surrounded by vast open lawns and walking trails along the western slope of Maebongsan. Blending industrial heritage architecture with natural scenery, this spot exudes a futuristic yet artistic atmosphere, making it a unique green destination near Hongdae.", "name": "Oil Tank Culture Park (Culture Tank)", "transport": "About 10 min walk from Exit 2 of World Cup Stadium Station (Subway Line 6)"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "239-1 Yeonnam-dong, Mapo-gu, Seoul", "feature": "\u2b50 4.5 Stars | Affectionately known as \u0027Yeontral Park\u0027, Gyeongui Line Forest Park is an urban green corridor transformed from abandoned railway tracks. It is a favorite outdoor relaxation and photo spot for Hongdae and Yeonnam-dong locals and tourists alike. The park features lush lawns, wooden walkways, and charming boutique shops along the way. On sunny days, young locals and couples gather here to picnic, enjoy takeout coffee or beer, and snap hipster-style photos in this urban oasis. At night, illuminated lights create a uniquely romantic ambiance.", "name": "Gyeongui Line Forest Park", "transport": "Short walk from Exit 3 of Hongik University Station (Subway Line 2, Gyeongui-Jungang Line, Airport Railroad)"}, {"address": "369-1 Seogyo-dong, Mapo-gu, Seoul", "feature": "\u2b50 4.3 Stars | Spanning six stories, this wizarding-themed building is an absolute must-visit spot in Seoul for Harry Potter fans. Every floor is meticulously designed\u2014from the iconic Platform 9\u00be trolley photo-op outside, to Hogwarts-style Great Hall interiors, potion bars, wand shops, and a dragon\u0027s lair inside. Free wizard robes and house scarves are available for visitors to wear for photos. Paired with butterbeer-inspired drinks and magical desserts, it immediately transports you into a fantasy wizarding world.", "name": "943 King\u0027s Cross Cafe", "transport": "Approx. 6 min walk from Exit 9 of Hongik University Station (Subway Line 2)"}, {"address": "223-14 Yeonnam-dong, Mapo-gu, Seoul", "feature": "\u2b50 4.4 Stars | Widely featured by international media, this black-and-white 2D comic book cafe turns reality into a flat illustration. Everything from walls and furniture to coffee cups and cutlery features hand-drawn black outlines on a pure white backdrop, creating a striking optical illusion. Stepping inside feels like walking straight into a webtoon or sketchbook, making it a hit among international tourists looking for stylish, surreal art photos.", "name": "Greem Cafe Yeonnam", "transport": "Approx. 12 min walk from Exit 3 of Hongik University Station (Subway Line 2)"}, {"address": "335-21 Seogyo-dong, Mapo-gu, Seoul", "feature": "\u2b50 4.1 Stars | Created by famous Korean fashion and beauty brand 3CE/Stylenanda, this flagship building combines trendy apparel shopping with a photo-worthy cafe. The top-floor Pink Pool Cafe draws inspiration from a 1950s retro hotel pool, boasting pastel pink decor, neon signs, and vintage sun umbrellas. Every angle offers a retro resort vibe perfect for chic photos, attracting crowds of young fashion enthusiasts.", "name": "Stylenanda Pink Pool Cafe Hongdae", "transport": "Approx. 5 min walk from Exit 8 of Hongik University Station (Subway Line 2)"}, {"address": "Around 360-28 Sangsu-dong, Mapo-gu, Seoul", "feature": "\u2b50 4.0 Stars | Located around the back gate of Hongik University, \u0027Picasso Street\u0027 is a flagship landmark showcasing Hongdae\u0027s artistic spirit and street culture. The walls along this alley are covered with vibrant graffiti, abstract art, and pop-culture murals created by local artists and Hongik students. Since artwork is refreshed periodically, every visit promises new visual surprises, making it an excellent backdrop for cool, urban street photography.", "name": "Hongdae Picasso Street / Mural Street", "transport": "Approx. 8 min walk from Exit 9 of Hongik University Station (Line 2) or Exit 2 of Sangsu Station (Line 6)"}, {"address": "165-5 Donggyo-dong, Mapo-gu, Seoul", "feature": "\u2b50 4.6 Stars | Located in the heart of Hongdae, this massive three-story flagship store is filled with giant figures and merchandise of iconic Kakao characters like Ryan and Apeach. The store features themed photo zones at every corner, including decorated rooms, exhibition walls, and a Kakao-themed cafe on the top floor. With endless cute photo opportunities, it\u0027s one of Seoul\u0027s top destinations for adorable pictures.", "name": "Kakao Friends Flagship Store Hongdae", "transport": "Direct access from Exit 8 or 9 of Hongik University Station (Subway Line 2)"}, {"address": "B2, 357-1 Seogyo-dong, Mapo-gu, Seoul", "feature": "\u2b50 4.3 Stars | Located in a basement space in Hongdae, this large resort-style multi-cultural complex features 32 private Balinese bamboo huts, a giant ball pit, and a massive immersive media art projection wall. Guests can enjoy afternoon tea inside tropical-style huts while capturing stunning photos. Combining artistic exhibits with relaxation spaces, it offers a fantastic urban getaway and photo spot.", "name": "Coconut Box Hongdae", "transport": "Approx. 6 min walk from Exit 9 of Hongik University Station (Subway Line 2)"}, {"address": "223-80 Yeonnam-dong, Mapo-gu, Seoul", "feature": "\u2b50 4.3 Stars | Tucked away in a quiet alley in Yeonnam-dong, this hugely popular European vintage cottage-style dessert cafe is famous for delicate handmade chiffon cakes and adorable animal-shaped scones. The space features warm wooden furnishings, cream-colored walls, vintage decor, and a beautifully arranged pastry display table. Evoking a cozy European countryside aesthetic from every angle, it is a quintessential Yeonnam-dong dessert hotspot with perpetual queues.", "name": "Cafe Highwaist Yeonnam", "transport": "Approx. 12 min walk from Exit 3 of Hongik University Station (Subway Line 2)"}], "name": "Popular Photo-Worthy Hotspots"}}, "name": "Hongdae and Yeonnam-dong"}, "itaewon_hannam": {"categories": {"cat_1": {"items": [{"address": "60 Itaewon-ro 55-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | A modern architectural masterpiece co-designed by three world-renowned architects: Mario Botta, Jean Nouvel, and Rem Koolhaas. The museum is divided into Museum 1 for traditional Korean art, Museum 2 for contemporary art, and the Samsung Child Educational \u0026 Cultural Center. Its exterior cleverly blends composite materials like red brick, rusted steel plates, and glass-reinforced concrete. The building structure alone is a breathtaking work of art, with its famous inner cylindrical spiral staircase serving as a popular visual highlight.", "name": "Leeum, Samsung Museum of Art", "transport": "Subway Line 6, Hangangjin Station, Exit 1, approx. 5 mins walk"}, {"address": "39 Usadan-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Built in 1976, this is South Korea\u0027s firs
