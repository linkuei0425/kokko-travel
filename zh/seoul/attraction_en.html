t and largest Islamic mosque. Perched on a hill in Itaewon, its grand white arches and towering minarets exude an exotic Islamic architectural style. The exterior walls are adorned with intricate Arabic geometric carvings and blue-and-white tiled patterns, topped with a massive white dome that shines brilliantly at sunset. It serves not only as a spiritual hub for Muslims in Korea, but also as a key historical landmark reflecting Itaewon\u0027s multicultural heritage.", "name": "Seoul Central Mosque", "transport": "Subway Line 6, Itaewon Station, Exit 3, approx. 10 mins walk"}, {"address": "217 Seobinggo-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | Built in 1986, this US military officers\u0027 quarters complex bears witness to nearly a century of foreign troop presence in Yongsan. Following the relocation of the military base, the area was converted into a historic and cultural park open to the public. It beautifully preserves iconic American-style two-story red-brick homes, spacious lawns, and vintage street signs, instantly transporting visitors to a small American town. The indoor exhibition hall documents the history of US forces in Korea and the transformation of Yongsan Park, making it a unique landmark blending rich history with nostalgic architectural charm.", "name": "Yongsan Garrison Officers\u0027 Quarters Zone 5", "transport": "Gyeongui-Jungang Line, Seobinggo Station, Exit 1, approx. 5 mins walk"}, {"address": "19 Noksapyeong-daero 40-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.2 stars | A centuries-old landmark of traditional folk belief, Bugundang is a shrine dedicated to praying for village peace and prosperity. Perched high on a hillside in Itaewon, the park preserves historic shrine buildings and ceremonial altars, along with a memorial shrine for anti-Japanese independence martyr Yu Gwan-sun. Beyond its deep cultural roots, it offers stunning panoramic views facing N Seoul Tower and Yongsan, making it a peaceful haven away from the bustling downtown to reflect on Itaewon\u0027s historical transformation.", "name": "Itaewon Bugundang History Park", "transport": "Subway Line 6, Noksapyeong Station, Exit 1, approx. 8 mins walk"}, {"address": "35 Daesagwan-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Designed by the renowned design firm JOH \u0026 Company, this modern multi-use complex is a benchmark of contemporary urban architecture in Hannam-dong. Featuring minimalist light-gray geometric structures and expansive floor-to-ceiling glass, it skillfully leverages the sloping terrain to create a multi-layered courtyard and alleyway feel. Housing art galleries, boutique bookstores, designer brands, and upscale dining, it seamlessly demonstrates the harmonious coexistence of modern minimalist architecture and community living space.", "name": "SOUNDS HANNAM (Sounds Hannam)", "transport": "Subway Line 6, Hangangjin Station, Exit 3, approx. 12 mins walk"}, {"address": "246 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | Designed by an award-winning international team of architects, this contemporary landmark is famous for its massive steel frame and highly transparent glass walls. A bold semi-outdoor open-air plaza sits at the building\u0027s center, offering sweeping views of Hannam-dong and the Han River. Inside, it houses over 10,000 rare vinyl records and music archives, while its avant-garde metallic lines and illuminated design make it the most eye-catching geometric architectural work on Hannam-dong\u0027s art avenue.", "name": "Hyundai Card Music Library \u0026 Understage", "transport": "Subway Line 6, Hangangjin Station, Exit 3, approx. 5 mins walk"}, {"address": "Near 42 Hannam-daero 11-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.1 stars | A traditional historical site located on a hill by the Han River in Hannam-dong, serving as a worship shrine for village guardian deities since the Joseon Dynasty. Constructed with traditional Korean wooden tiled-roof architecture, it houses local deities and the river god of the Han River, hosting annual ritual ceremonies to pray for community peace and safe water passage. The elevated terrace in front of the shrine offers grand views of the Han River and Seongsu Bridge, making it a hidden cultural gem for discovering Hannam-dong\u0027s ancient folk history and scenic nature.", "name": "Hannam-dong Bugundang Shrine", "transport": "Gyeongui-Jungang Line, Hannam Station, Exit 1, approx. 10 mins walk"}, {"address": "250 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | A flagship brand building on Itaewon-ro that seamlessly blends modern industrial aesthetics with an urban oasis concept. Theme-centered around \u0027a botanical garden in the city\u0027, the five-story building features a large metal-mesh fa\u00e7ade paired with trailing greenery, creating a striking visual contrast. Inside, a grand skylight atrium and vertical green walls run through the space, accompanied by a coffee roastery workshop and music experience lounge. It breathes fresh architectural life into Hannam-dong, combining green sustainability with modern design aesthetics.", "name": "MAXIM Plant (Maxim Plant)", "transport": "Subway Line 6, Hangangjin Station, Exit 3, approx. 4 mins walk"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "60 Itaewon-ro 55-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | Jointly designed by world-renowned architects Mario Botta, Jean Nouvel, and Rem Koolhaas, the museum is divided into traditional Korean art (M1) and modern/contemporary art (M2). The collection is remarkably rich and exquisite, featuring national treasure-level Korean ceramics alongside works by famous contemporary artists. The architecture and exhibition spaces complement each other perfectly, making this the most iconic premier art sanctuary in Hannam-dong.", "name": "Leeum Museum of Art", "transport": "Subway Line 6, Hangangjin Station, Exit 1, approx. 8-minute walk"}, {"address": "248 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Located at the core of Hannam-dong\u0027s avant-garde contemporary art scene, this cutting-edge exhibition space is operated by Hyundai Card. Displays cover contemporary visual arts, architecture, experimental design, and interdisciplinary artistic creations. Frequently collaborating with authoritative international museums to introduce innovative exhibitions, it is a must-visit for art lovers who appreciate avant-garde trends and modern aesthetics.", "name": "Hyundai Card Storage", "transport": "Subway Line 6, Hangangjin Station, Exit 3, approx. 5-minute walk"}, {"address": "39 Usadan-ro 10-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Established in 1976, this is Korea\u0027s first and largest Islamic mosque. Blending traditional Islamic geometric aesthetics with towering white minarets, it perches atop the hills of Itaewon. The interior is solemn and serene, while the surrounding area has developed into a unique quarter rich in Halal cuisine and exotic flair, serving as an important landmark for exploring Seoul\u0027s diverse religious cultures.", "name": "Seoul Central Mosque", "transport": "Subway Line 6, Itaewon Station, Exit 3, approx. 10-minute walk"}, {"address": "267 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | The Seoul branch of Pace Gallery, one of the world\u0027s leading contemporary art galleries, is situated in the elegant cultural quarter of Hannam-dong. Showcasing works by internationally renowned contemporary artists and masters, it boasts exceptional exhibition quality and a sleek, modern design, serving as a key hub leading Korea\u0027s premier contemporary art trade and exhibition trends.", "name": "Pace Gallery Seoul", "transport": "Subway Line 6, Hangangjin Station, Exit 3, approx. 3-minute walk"}, {"address": "122-1 Dokseodang-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | The first Asian branch of the renowned Austrian gallery Thaddaeus Ropac, located in Hannam-dong\u0027s Fort Hill building. Spaciously illuminated, it regularly hosts curated exhibitions featuring prominent European contemporary artists and emerging creators, infusing Seoul\u0027s art scene with a rich international flavor.", "name": "Thaddaeus Ropac Seoul", "transport": "Gyeongui-Jungang Line, Hannam Station, Exit 1, approx. 12-minute walk or transfer to a bus"}, {"address": "14 Bogwang-ro 60-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.2 stars | Perched atop the historic hills of Itaewon, this church serves as a sanctuary for local believers. Built with warm red bricks and elegant geometric lines, it exudes a serene atmosphere. Sunlight refracting through its stained-glass windows casts stunning colors inside, offering a peaceful sanctuary amid the bustling multicultural neighborhood.", "name": "Itaewon Catholic Church", "transport": "Subway Line 6, Itaewon Station, Exit 4, approx. 8-minute walk"}, {"address": "213 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Headquartered in New York, international powerhouse Lehmann Maupin\u0027s new exhibition space in Hannam-dong was crafted by a renowned design firm. The sleek, bright two-story space is dedicated to championing modern and contemporary artists from diverse global backgrounds, making it an unmissable destination for world-class artistic vision.", "name": "Lehmann Maupin Seoul", "transport": "Subway Line 6, Itaewon Station, Exit 2, approx. 6-minute walk"}, {"address": "246 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | A multifunctional space blending music culture with contemporary architecture, housing over 10,000 rare vinyl records and art books. Featuring a strikingly designed exterior, its semi-open terrace overlooks the Seoul skyline. The library also hosts occasional music exhibitions and live performances, making it one of Hannam-dong\u0027s most iconic cultural landmarks.", "name": "Hyundai Card Music Library", "transport": "Subway Line 6, Hangangjin Station, Exit 3, approx. 5-minute walk"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "185 Noksapyeong-daero, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | Located on the southern slope of Namsan, near Itaewon and Hannam-dong, this stunning botanical garden features expansive pine forests, wild gardens, ecological ponds, and wooden boardwalks. With distinct seasons\u2014cherry blossoms and azaleas in spring, vibrant autumn foliage and ginkgo trails in fall\u2014it serves as a peaceful urban escape right next to bustling Itaewon, perfect for a relaxing stroll.", "name": "Namsan Outdoor Botanical Garden", "transport": "Subway Line 6 Noksapyeong Station, Exit 3, then transfer to Yongsan 01 local bus and get off at Namsan Botanical Garden Station"}, {"address": "San 1-30, Hannam-dong, Yongsan-gu, Seoul", "feature": "\u2b50 4.6 stars | Situated behind Hannam-dong, Maebongsan Park is a hidden gem favored by locals and photography enthusiasts. The octagonal pavilion offers breathtaking panoramic views of the Han River, Seongsu Bridge, and Lotte World Tower. At sunset and dusk, the sparkling city lights reflecting off the river create a truly mesmerizing night view.", "name": "Maebongsan Park", "transport": "Subway Line 6 Hangangjin Station, Exit 2, then walk uphill for about 15-20 minutes"}, {"address": "185 Seobinggo-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | Formerly a US military golf course, this lush park features expansive rolling lawns, mirror-like lotus ponds, and towering mature trees. Outfitted with well-maintained walking trails, benches, and outdoor sculptures, its relaxing ambiance makes it a favorite spot around Itaewon for family picnics and leisurely outdoor walks.", "name": "Yongsan Family Park", "transport": "Gyeongui-Jungang Line Seobinggo Station, Exit 1, approx. 10-minute walk"}, {"address": "221 Seobinggo-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | A creative park transformed from a former US military housing complex, preserving distinct red-brick American-style houses, wide lawns, and lush greenery that evoke an exotic suburban charm. Featuring cultural exhibition spaces, cafes, and outdoor seating, it\u0027s a trendy, photogenic spot near Itaewon and Noksapyeong combining nature and culture.", "name": "Yongsan Park Officers\u0027 Quarters No. 5", "transport": "Gyeongui-Jungang Line Seobinggo Station, Exit 1, approx. 5-minute walk"}, {"address": "302-17 Ichon-dong, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | Stretching from Hannam-dong to Ichon-dong along the riverbank, this section of Hangang Park offers green lawns, reed paths, and leafy trees. Quieter and more serene than Yeouido Hangang Park, it features cycling paths, walking trails, and outdoor art installations\u2014an ideal spot to watch the sunset and enjoy a refreshing river breeze after shopping in Itaewon or dining in Hannam-dong.", "name": "Ichon Hangang Park", "transport": "Subway Line 4 or Gyeongui-Jungang Line Ichon Station, Exit 4, approx. 15-minute walk to the riverside"}, {"address": "Sowol-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | Sowol-ro is a scenic road connecting upper Itaewon to the slopes of Namsan. Lined with lush trees, wooden boardwalks, and multiple observation platforms, a stroll here offers fresh forest air alongside stunning skyline views of Itaewon and Yongsan-gu. It is exceptionally romantic in autumn when the hillside bursts with colorful foliage.", "name": "Namsan Park Sowol-ro Trail", "transport": "Subway Line 6 Noksapyeong Station, Exit 1, walk towards Sowol-ro via the pedestrian overpass"}, {"address": "Hannam-dong waterfront, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Located at the northern base of Hannam Bridge south of Hannam-dong, this riverside green space and viewing spot offers expansive views of upscale Hannam-dong, the Gangnam skyline, and sparkling reflections on the Han River. Featuring walking trails and viewing platforms, it is a local secret spot for evening strolls, cycling, and taking in city night views.", "name": "Hannam Bridge Observatory \u0026 Riverside Park", "transport": "Gyeongui-Jungang Line Hannam Station, Exit 1, approx. 10-minute walk to the riverside park"}, {"address": "Hannam-dong, Yongsan-gu, Seoul", "feature": "\u2b50 4.1 stars | Tucked away near the trendy streets and luxury residences of Hannam-dong, this refined community park is surrounded by tall trees and flowers. Equipped with simple walking paths, fitness equipment, and wooden benches, its quiet and clean environment makes it a perfect resting spot between browsing designer boutiques and art galleries.", "name": "Hannam Neighborhood Park", "transport": "Subway Line 6 Hangangjin Station, Exit 3, approx. 10-minute walk"}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "60 Itaewon-ro 55-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | Designed by world-renowned architects Mario Botta, Jean Nouvel, and Rem Koolhaas, the Leeum, Samsung Museum of Art is a breathtaking masterpiece of contemporary art in itself. Its most famous photo spots include the iconic black-and-white spiral staircase and the light-filled skylight ceiling, where unique geometric aesthetics draw countless photography enthusiasts. The outdoor exhibition area features large-scale sculptures by contemporary masters like Anish Kapoor, seamlessly blending modern art with traditional Korean garden landscapes. It stands as Hannam-dong\u0027s most representative cultural landmark and a top destination for trendy art lovers.", "name": "Leeum, Samsung Museum of Art", "transport": "Approx. 7-min walk from Exit 1 of Hangangjin Station (Line 6)"}, {"address": "35 Daesagwan-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Sounds Hannam is Hannam-dong\u0027s premier multi-cultural space, seamlessly blending red-brick architecture with sleek steel geometric lines to showcase a refined urban aesthetic. It houses boutique cafes, high-end restaurants, independent bookstores, and design brands like Aesop. The open courtyard and central staircase are favorite photo spots for influencers. Strolling through allows you to immerse yourself in a sophisticated atmosphere, where every angle of the architectural design yields magazine-cover-worthy shots.", "name": "Sounds Hannam", "transport": "Approx. 12-min walk from Exit 3 of Hangangjin Station (Line 6)"}, {"address": "5 Itaewon-ro 54-gil, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | Sayoo is a five-story cultural cafe complex designed around the concept of a \u0027space for thought and freedom.\u0027 Its most popular photo spot is the 5th-floor rooftop terrace, where you can snap dreamy, Parisian-style photos with a charming European-style red-brick building in the background. Each floor features a distinct theme, including an art gallery, a coffee and media room, and a floral studio, making it an enduringly popular romantic photo spot in Hannam-dong.", "name": "Sayoo Cultural Space", "transport": "Approx. 5-min walk from Exit 3 of Hangangjin Station (Line 6)"}, {"address": "Bogwang-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.1 stars | Dating back to the 1960s during the U.S. military presence, Itaewon Antique Furniture Street gathers over a hundred shops specializing in classic European furniture, vintage lighting, and Western antiques. Strolling along this exotic street, you\u0027ll be greeted by elegant window displays featuring 19th-century European clocks, crystal chandeliers, and carved wooden chairs. It is not only a haven for antique collectors but also a unique nostalgic photo spot soaked in charming vintage vibes.", "name": "Itaewon Antique Furniture Street", "transport": "Approx. 3-min walk from Exit 4 of Itaewon Station (Line 6)"}, {"address": "30 Usadan-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.2 stars | Completed in 1976, Seoul Central Mosque is Korea\u0027s first mosque. Its magnificent white domes and towering minarets stand proudly atop the hills of Itaewon, creating a striking skyline silhouette. The main entrance is adorned with intricate blue-and-white Islamic mosaic tiles and Arabic calligraphy, exuding rich exotic art and architectural grace. Besides being the spiritual heart for Korea\u0027s Muslim community, its Middle Eastern-inspired architecture attracts countless visitors seeking visually captivating photos.", "name": "Seoul Central Mosque", "transport": "Approx. 10-min walk from Exit 3 of Itaewon Station (Line 6)"}, {"address": "248 Itaewon-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.4 stars | Created by Hyundai Card, Vinyl \u0026 Plastic is the ultimate sanctuary for vinyl and music lovers. The two-story glass facade vividly showcases tens of thousands of colorful vinyl records and retro cassettes, creating a bold contemporary industrial statement. Inside, listening stations allow visitors to spin their favorite records on the spot. The transparent exterior combined with warm interior lighting makes it one of the most iconic aesthetic landmarks on the streets of Hannam-dong.", "name": "Vinyl \u0026 Plastic by Hyundai Card", "transport": "Approx. 4-min walk from Exit 3 of Hangangjin Station (Line 6)"}, {"address": "Hoenamu-ro, Yongsan-gu, Seoul", "feature": "\u2b50 4.0 stars | Originating near the Army Central Financial Corps, Gyeongnidan-gil was one of Itaewon\u0027s original trendy, hip neighborhoods. This sloping street is packed with quirky independent boutiques, artisan bakeries, vibrant graffiti walls, and open-air bars. As you walk up the hill, many rooftop cafes offer unobstructed views of N Seoul Tower. At dusk and nighttime, the illuminated tower and twinkling cityscape create a romantic backdrop that draws couples and photography enthusiasts alike.", "name": "Gyeongnidan-gil Street", "transport": "Approx. 5-min walk from Exit 2 of Noksapyeong Station (Line 6)"}, {"address": "Noksapyeong-daero, Yongsan-gu, Seoul", "feature": "\u2b50 4.3 stars | Made famous as the iconic filming location where Park Sae-ro-yi frequently stood contemplating in the hit K-drama \u0027Itaewon Class\u0027, Noksapyeong Skybridge offers one of the best spots to admire Seoul\u0027s cityscape and N Seoul Tower. Standing at the center of the bridge, you\u0027ll see busy traffic flowing below while facing the majestic tower directly ahead. Whether under clear daytime skies, during a golden sunset, or amidst glowing city night lights, you can capture legendary photos imbued with K-drama cinematic romance.", "name": "Noksapyeong Skybridge", "transport": "Approx. 3-min walk from Exit 3 of Noksapyeong Station (Line 6)"}], "name": "Popular Check-in Hotspots"}}, "name": "Itaewon and Hannam-dong"}, "jamsil_lotteworld": {"categories": {"cat_1": {"items": [{"address": "300 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 300)", "feature": "\u2b50 4.6 Stars | Standing at 555 meters with 123 floors, Lotte World Tower is the tallest building in South Korea and the 6th tallest supertall skyscraper in the world, serving as modern Seoul\u0027s most iconic architectural landmark. The design draws inspiration from the sleek curves of traditional Korean ceramics and calligraphy brushes, seamlessly blending traditional aesthetics with cutting-edge technology. Inside, the \u0027SEOUL SKY\u0027 observation deck on floors 117\u2013123 features the world\u0027s highest glass-bottomed skywalk, offering panoramic 360-degree views of the Han River and Seoul cityscape. The tower also houses a luxury 6-star hotel, high-end shopping mall, and concert hall, making it an absolute must-visit landmark in the Jamsil area.", "name": "Lotte World Tower", "transport": "Take Seoul Subway Line 2 or Line 8 to Jamsil Station (Exits 1 or 2); an underground passageway leads directly into Lotte World Tower."}, {"address": "21 Garak-ro 7-gil, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uac00\ub77d\ub85c7\uae38 21)", "feature": "\u2b50 4.2 Stars | Located in the heart of Jamsil, the Seokchon-dong Ancient Tombs are a historically rich ancient site comprising royal stone-mound tombs from the Baekje Hanseong Period (18 BC\u2013475 AD). Built by stacking large stones, their structure closely resembles the stone-mound tombs of Goguryeo, confirming the deep historical roots between the founding powers of Baekje and Goguryeo. The largest among them, \u0027Tomb No. 3\u0027, is believed to be the tomb of King Geunchogo or King Geungusu during Baekje\u0027s golden age. Strolling through this peaceful heritage park offers a striking visual contrast between ancient stone mounds and surrounding modern skyscrapers, making it a wonderful landmark to experience Baekje\u0027s thousand-year legacy.", "name": "Seokchon-dong Ancient Tombs", "transport": "Take Seoul Subway Line 8 to Seokchon Station (Exit 6), then walk for about 8 minutes."}, {"address": "424 Olympic-ro, Songpa-gu, Seoul (Inside Olympic Park) (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 424)", "feature": "\u2b50 4.5 Stars | Mongchontoseong Fortress is an earthen wall remnant built by ancient Baekje using natural hills to defend against northern threats, dating back between the 3rd century BC and 4th century AD. Stretching about 2.7 km long, the earthen walls are now seamlessly integrated into Olympic Park. Surrounded by rolling hills and lush green lawns, walking trails along the top offer scenic views of Lotte World Tower and distant mountains. Witness to the power of the ancient Baekje Kingdom, its poetic curving terrain and the famous \u0027Lone Tree\u0027 make it one of Seoul\u0027s most romantic historical-nature landscapes.", "name": "Mongchontoseong Fortress", "transport": "Take Seoul Subway Line 8 to Mongchontoseong Station (Exit 1), or Line 9 to Hanseong Baekje Station (Exit 2)."}, {"address": "47 Jamsil-dong, Songpa-gu, Seoul (East Lake Side of Seokchon Lake Park) (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc7a0\uc2e4\ub3d9 47)", "feature": "\u2b50 4.1 Stars | The Samjeondo Monument (officially the Stele of the Divine Virtues of the Emperor of the Great Qing) is an important Joseon Dynasty historical monument recording King Injo\u0027s surrender to Hong Taiji of the Qing Empire after the Second Manchu Invasion in 1637. The massive stele rests on a beautifully carved stone turtle pedestal (Bixi) and features inscriptions in Manchu, Mongolian, and Chinese, holding immense historical and philological value. Originally located at a Han River ferry crossing, it now stands beside the East Lake of Seokchon Lake Park alongside the ancient Songpanaru Site, serving as a meaningful cultural spot to reflect on a major turning point in Joseon history.", "name": "Samjeondo Monument \u0026 Songpanaru Site", "transport": "Take Seoul Subway Line 2 or Line 8 to Jamsil Station (Exit 2 or 3) and walk towards the East Lake of Seokchon Lake Park."}, {"address": "25 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 25)", "feature": "\u2b50 4.4 Stars | Designed by master Korean architect Kim Swoo-geun, Jamsil Olympic Stadium was built as the flagship venue for the 1986 Asian Games and the 1988 Seoul Summer Olympics. Its sweeping exterior curves are inspired by the elegant silhouette of Joseon Dynasty blue-and-white porcelain, combining traditional Korean aesthetics with modern structural design. Accommodating nearly 70,000 spectators, this magnificent structure is not only a proud symbol of South Korea\u0027s modern sports history, but also a legendary venue for massive concerts by international megastars and top K-POP acts.", "name": "Jamsil Olympic Stadium", "transport": "Take Seoul Subway Line 2 or Line 9 to Sports Complex Station (Exit 6 or 7) for direct access."}, {"address": "113-1 Pungnap-dong, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \ud48d\ub0a9\ub3d9 113-1)", "feature": "\u2b50 4.1 Stars | Pungnaptoseong Fortress is a massive flatland earthen wall located along the Han River, identified by historians as the original site of Wiryeseong or Saseong, the earliest capital of the Baekje Kingdom during the Hanseong Period. The wall measured up to 40 meters wide at the base and over 13 meters high, demonstrating grand scale, formidable royal power, and advanced civil engineering of the time. Numerous artifacts including roof tiles, pottery, and ritual items were excavated here, proving it was a royal palace complex. Designated as a National Historic Site with green parkland, it is a key cultural landmark for understanding early Baekje history and ancient wall construction.", "name": "Pungnaptoseong Fortress", "transport": "Take Seoul Subway Line 8 to Gangdong-gu Office Station (Exit 4), then walk for about 10 minutes."}, {"address": "12 Garak-ro 36-gil, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uac00\ub77d\ub85c36\uae38 12)", "feature": "\u2b50 4.0 Stars | Located in the hilly area of Bangi-dong, Songpa-gu, the Bangi-dong Ancient Tombs are a cluster of royal and aristocratic burial mounds from the Baekje era, alongside the Seokchon-dong tombs. The peaceful park preserves 8 large stone-chamber earthen mound tombs. Excavations uncovered rich Baekje artifacts such as grey stoneware and iron tools. Today, the tomb area is landscaped as a charming green park with walking paths and historical signboards, allowing visitors to enjoy a stroll while experiencing the ancient charm and rich history of the Three Kingdoms Period.", "name": "Bangi-dong Ancient Tombs", "transport": "Take Seoul Subway Line 9 to Hanseong Baekje Station (Exit 3), then walk for about 12 minutes."}, {"address": "71 Wiryeseong-daero, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc704\ub840\uc131\ub300\ub85c 71)", "feature": "\u2b50 4.5 Stars | Inspired by the fluid, natural lines of ancient Baekje earthen walls, the museum building itself is a masterpiece combining modern art with ancient imagery. Situated inside Olympic Park, it is dedicated to preserving and exhibiting the rich historical heritage of the Hanseong Baekje Period (18 BC\u2013475 AD) left in the Jamsil and Songpa areas. Highlights include a striking 17-meter-high cross-section replica of the Pungnaptoseong wall, excavated artifacts, and a restored Baekje ship. The rooftop observation deck offers views of Mongchontoseong and Lotte World Tower, making it an excellent architectural landmark for exploring Jamsil\u0027s ancient and modern history.", "name": "Hanseong Baekje Museum", "transport": "Take Seoul Subway Line 9 to Hanseong Baekje Station (Exit 2), then walk for about 5 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "3F, Lotte World Shopping Mall, 240 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.3 Stars | Located inside the Lotte World Shopping Mall, this folk museum showcases Korea\u0027s complete historical evolution from prehistoric times to the Japanese colonial period through delicate miniature models and historical artifacts. The highlight is a 1:8 scale miniature village vividly depicting royal court life, everyday peasant life, and traditional festival scenes of the Joseon Dynasty. Hands-on traditional craft experiences and traditional wedding performances are also offered, making it perfect for families and international tourists seeking a deep dive into Korean culture.", "name": "Lotte World Folk Museum", "transport": "Subway Line 2/8 Jamsil Station Exit 4, approx. 5 mins walk"}, {"address": "7F, Lotte World Tower, 300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.4 Stars | Situated on the 7th floor of the Lotte World Tower, this high-end contemporary art space is dedicated to showcasing exhibitions from world-class contemporary artists. Featuring spacious, modern exhibition halls, it has hosted special exhibitions by international artists such as James Jean, Kenny Scharf, as well as Snoopy-themed art shows. The rest area offers breathtaking views over Seokchon Lake, seamlessly combining contemporary visual arts with urban landscapes. A must-visit cultural landmark for art lovers in Jamsil.", "name": "Lotte Museum of Art", "transport": "Subway Line 2/8 Jamsil Station Exit 10 or 11, directly connected to Lotte World Tower"}, {"address": "71 Wiryeseong-daero, Songpa-gu, Seoul", "feature": "\u2b50 4.5 Stars | Located within Olympic Park, this municipal museum is dedicated to showcasing the history and culture of the ancient Baekje Kingdom during its Hanseong era (18 BC\u2013475 AD). The building\u0027s architectural design is inspired by the outline of ancient Baekje earthen walls. Housing a rich collection of pottery, ironware, and royal artifacts, it reconstructs the grandeur of the ancient capital 2,000 years ago using giant wall cross-section models and 3D interactive multimedia installations\u2014making it the premier place to learn about the early history of Seoul.", "name": "Hanseong Baekje Museum", "transport": "Subway Line 9 Hanseong Baekje Station Exit 2, approx. 5 mins walk"}, {"address": "424 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.4 Stars | Set amid the lush green environment of Olympic Park, this modern museum perfectly integrates architecture, nature, and contemporary art. Built with natural wood and exposed concrete, the architecture seamlessly blends into the sprawling outdoor sculpture park. The museum regularly hosts diverse contemporary visual art exhibitions, while masterpieces by renowned international sculptors are dotted throughout the outdoor gardens, allowing visitors to immerse themselves in world-class art while strolling through nature.", "name": "SOMA Museum of Art", "transport": "Subway Line 9 Hanseong Baekje Station Exit 2, approx. 3 mins walk"}, {"address": "77 Songpadaero 37-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.6 Stars | Korea\u0027s first public museum themed around books, seamlessly combining the features of a library and a museum. The interior boasts a sleek modern design, featuring a giant central stepped reading space named \u0027Book Da-rum\u0027, a popular photo spot. Exhibition areas cover the history of books, interactions between readers and authors, and hands-on printing craft experiences, alongside dedicated interactive reading spaces for children\u2014making it a highly artistic and educational cultural destination.", "name": "Songpa Book Museum", "transport": "Subway Line 8 Songpa Station Exit 4, approx. 10 mins walk"}, {"address": "240 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.5 Stars | Korea\u0027s first theater dedicated specifically to musical productions, featuring elegant European classical architectural design. Housing around 1,200 seats with top-tier acoustic and stage facilities, it regularly hosts Korean productions of world-famous musicals such as The Phantom of the Opera, The Lion King, and RENT. The opulent interior includes themed cafes and merchandise shops, making it a sanctuary for musical theater fans in Korea.", "name": "Charlotte Theater", "transport": "Subway Line 2/8 Jamsil Station Exit 3, approx. 3 mins walk"}, {"address": "1 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.3 Stars | A large public secondhand bookstore and cultural complex repurposed from an old warehouse, made famous as a filming location for the K-drama Hotel Del Luna. Its signature feature is the visually stunning \u0027Book Tunnel\u0027 formed by arched iron frames down the center. Housing tens of thousands of books from old secondhand bookstores across Seoul, along with independent publications and celebrity collections, it also regularly hosts cultural lectures and exhibitions. A must-visit cultural spot for book lovers and photography enthusiasts.", "name": "Seoul Book Bogo", "transport": "Subway Line 2 Jamsilnaru Station Exit 1, approx. 1 min walk"}, {"address": "11 Olympic-ro 35-gil, Songpa-gu, Seoul", "feature": "\u2b50 4.4 Stars | A historic Catholic church located near the bustling Jamsil area, blending modern aesthetics with solemn religious elegance. The church features exquisite stained-glass windows and a towering bell tower, while its quiet prayer hall offers a peaceful sanctuary for busy city dwellers. Beyond hosting regular weekly masses, the surrounding lush greenery provides a serene ambiance that contrasts sharply with the nearby hustle and bustle of Lotte World.", "name": "Jamsil Catholic Church", "transport": "Subway Line 2/8 Jamsil Station Exit 7, approx. 8 mins walk"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "47 Jamsil-dong, Songpa-gu, Seoul", "feature": "\u2b50 4.6 | Surrounding Lotte World Magic Island and Lotte World Tower, Seokchon Lake Park is one of Seoul\u0027s most iconic urban lakeside parks. Divided into the East and West Lakes, it features a 2.5 km lakeside walking trail lined with mature cherry blossom trees and vibrant greenery. Every spring, the park hosts the lively Seokchon Lake Cherry Blossom Festival, transforming the entire loop into a romantic, fairy-tale pink tunnel that attracts millions of visitors. In autumn, the lake is framed by brilliant red foliage and golden ginkgo trees. With cozy cafes, outdoor stages, and comfortable scenic seating along the shore, as well as spectacular views of Lotte World Tower\u0027s nightly light shows and the illuminated Magic Island castle, it is a premier destination for romantic dates and leisurely family strolls.", "name": "Seokchon Lake Park", "transport": "Subway Line 2 or Line 8, Jamsil Station, Exit 2 or 3; approx. 5-minute walk"}, {"address": "424 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.6 | Built to host the 1988 Seoul Summer Olympics, Olympic Park is a vast urban sanctuary that seamlessly blends sports facilities, historical sites, and rich natural ecology. Its most famous landmark is \u0027The Lone Tree,\u0027 standing solo on a rolling green lawn\u2014a wildly popular photo spot for Instagrammers. The park showcases stunning views across all four seasons: a magnificent rose garden in spring, vibrant sunflower fields in summer, and sweeping displays of cosmos and fluffy pink muhly grass in autumn. Beyond its natural beauty, the park houses the Mongchontoseong Earthen Fortification from the ancient Baekje Kingdom. Its gentle, flat walking paths make it perfect for renting bicycles or enjoying an outdoor picnic.", "name": "Olympic Park", "transport": "Subway Line 9, Hanseong Baekje Station, Exit 2, OR Subway Line 5/9, Olympic Park Station, Exit 3"}, {"address": "65 Hangaram-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.5 | Situated along the banks of the Han River between Jamsil Bridge and Yeongdong Bridge, Jamsil Hangang Park serves as a refreshing urban oasis for Seoul residents. The park boasts sprawling green lawns, well-maintained bicycle lanes, outdoor sports fields, and a dedicated natural ecology learning site. During summer, the open-air swimming pool opens, making it a favorite spot for families to cool off. In the evening, crowds gather on the grass to picnic, savor delivered fried chicken and ramen, and take in the stunning Han River sunsets alongside the shimmering lights of distant bridges. Additionally, the park\u0027s ecological pond is filled with native aquatic plants and wildflowers, making it a peaceful spot for birdwatching and enjoying the cool river breeze.", "name": "Jamsil Hangang Park", "transport": "Subway Line 2, Jamsilsaenae Station, Exit 6 or 7; approx. 10\u201315 minute walk"}, {"address": "300 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.5 | World Park is an exquisitely designed urban green space located right outside Lotte World Tower and Lotte World Mall. Featuring sleek modern landscaping, its lush lawns regularly host large-scale pop-up art installations\u2014such as giant floating ducks or massive pink bears\u2014drawing crowds of eager photo-takers. The park includes elegant fountains, waterfront boardwalks, and cozy wooden lounge areas, seamlessly merging cutting-edge skyscraper design with green nature. Ahead of Christmas each year, the park transforms into a magical winter wonderland, featuring a towering, lavishly decorated Christmas tree and a fairy-tale carousel, making it one of the most festive holiday spots in Seoul.", "name": "Lotte World Tower World Park", "transport": "Subway Line 2 or Line 8, Jamsil Station, Exit 10 or 11 (Direct access)"}, {"address": "88 Olympic-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.2 | Created to commemorate the 1986 Seoul Asian Games, Asia Park is a tranquil community park located right next to Jamsil Sports Complex and the Asia Athletes\u0027 Village apartment complex. Densely shaded by mature trees, the park offers wide stone-paved walkways, outdoor fitness equipment, a children\u0027s playground, and peaceful pavilions for relaxing. Compared to the bustling Seokchon Lake Park, this park offers a remarkably serene atmosphere where locals love to read, take quiet strolls, or walk their pets under the leafy canopy. With flowers blooming in spring and golden ginkgo leaves coating the paths in autumn, it is a hidden green haven near Lotte World for enjoying pure peace and quiet.", "name": "Asia Park", "transport": "Subway Line 2 or Line 9, Sports Complex Station, Exit 9; approx. 2-minute walk"}, {"address": "Along Tancheon Stream, Jamsil-dong, Songpa-gu, Seoul", "feature": "\u2b50 4.3 | Tancheon is a major stream running through Songpa-gu before flowing into the Han River. Its downstream area in Jamsil has been designated as an ecological conservation zone to preserve its rich, pristine waterfront habitat. Thick reed beds, silver grass, and various wildflowers grow wild along both banks, changing dynamically with the seasons. Well-paved walking trails and bike paths run alongside Tancheon, connecting directly to Hangang Park. Far removed from the urban noise, it is an ideal ecological sanctuary for observing migratory birds, listening to nature, and enjoying a relaxing walk\u2014especially during dawn and dusk, when the glow of the sunset reflects poetically off the water.", "name": "Tancheon Ecological Conservation Area", "transport": "Subway Line 2, Sports Complex Station, Exit 4; approx. 10-minute walk to the stream trail"}, {"address": "Seongnaecheon-ro, Songpa-gu, Seoul", "feature": "\u2b50 4.4 | Seongnaecheon Stream Park is a charming waterfront eco-trail that flows through Songpa-gu and cuts across Olympic Park. Transformed by the Seoul Metropolitan Government from a traditional concrete channel into a thriving aquatic ecosystem, the park now features clear streams teeming with fish and egrets. Comfortable, gentle walking paths, stepping stones, and lush flora line both sides of the stream. As a highlight segment of the Songpa Dulle-gil trail, it is lined with canopying cherry blossoms in spring and blooming water plants in summer, making it a beloved local retreat for waterfront relaxation.", "name": "Seongnaecheon Stream Park", "transport": "Subway Line 5, Ogeum Station, Exit 1; approx. 8-minute walk to the stream trail"}, {"address": "Between Hangang Riverside and Seokchon Lake, Jamsil-dong, Songpa-gu, Seoul", "feature": "\u2b50 4.5 | The \u0027Songpa Dulle-gil\u0027 is a 21-kilometer circular eco-trail surrounding the entire Songpa District, with the \u0027Jamsil Waterway\u0027 section stretching from Jamsil Hangang Park toward the Seokchon Lake area. This scenic waterfront path seamlessly merges the expansive views of the Han River, natural woods, and Seoul\u0027s modern urban skyline. The smooth, well-maintained trail features scenic viewing platforms, eco-info boards, and rest benches, making it perfect for long-distance hikes or long jogs. As you move along the route, you can admire the soaring heights of Lotte World Tower from different angles while taking in the refreshing river scenery, offering a fantastic way to immerse yourself in Jamsil\u0027s nature and urban aesthetics.", "name": "Songpa Dulle-gil Jamsil Waterway", "transport": "Subway Line 2, Jamsil Station, Exit 2; walk toward either the Han River or Seokchon Lake"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "300 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 300)", "feature": "\u2b50 4.5 stars | Perched at the top of the Lotte World Tower\u2014the sixth tallest building in the world\u2014SEOUL SKY is the ultimate vantage point for taking in sweeping views of the entire Seoul skyline and the Han River. It features the Guinness World Record-certified \u0027Sky Deck,\u0027 a fully transparent glass-bottomed observation platform suspended 478 meters in the air. Stepping onto the clear glass for a photo is a thrilling, must-try experience. On clear days, you can see all the way to the Incheon coast, while after dark, it offers mesmerizing views of the city\u0027s twinkling lights, making it Seoul\u0027s premier high-altitude landmark.", "name": "Lotte World Tower SEOUL SKY", "transport": "Subway Line 2 or Line 8, Jamsil Station, Exit 10. Direct access to the base of Lotte World Tower via a 2-minute walk."}, {"address": "47 Jamsil-dong, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc7a0\uc2e4\ub3d9 47)", "feature": "\u2b50 4.6 stars | Encircling Lotte World and Lotte World Tower, Seokchon Lake Park is one of Seoul\u0027s most beloved outdoor photo spots. Flanked by thousands of cherry blossom trees, the lake transforms into a dreamy pink canopy every spring, drawing crowds of visitors. The lake also frequently hosts massive public art installations, such as the viral \u0027Rubber Duck\u0027 and \u0027KAWS\u0027 floating exhibits. With the fairytale Magic Castle of Lotte World as its backdrop, it offers a deeply romantic atmosphere both day and night.", "name": "Seokchon Lake Park", "transport": "Subway Line 2 or Line 8, Jamsil Station, Exit 2 or 3. About a 5-minute walk."}, {"address": "240 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 240)", "feature": "\u2b50 4.4 stars | Located on an island in the middle of Seokchon Lake, Magic Island is the outdoor section of Lotte World amusement park, famous for its iconic Disney-esque pink and white castle topped with blue turrets. A favorite spot among young locals and couples, a popular trend here is renting Korean high school uniforms (such as from Ehwa Gyobok) and snapping nostalgic photos with the fairytale castle in the background. Whether enveloped in morning mist or illuminated by dazzling lights at night, it offers picture-perfect, storybook scenes.", "name": "Lotte World Magic Island", "transport": "Subway Line 2 or Line 8, Jamsil Station, Exit 4. Direct access to the Lotte World entrance."}, {"address": "424 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 424)", "feature": "\u2b50 4.5 stars | Standing alone in the middle of a vast, rolling green lawn inside Olympic Park, the \u0027Lone Tree\u0027 (also known as the \u0027One Tree\u0027) is a legendary filming location for Korean dramas, music videos, and wedding photography. Set against a backdrop of open sky and sprawling grass, this perfectly shaped solitary tree evokes a tranquil and cinematic atmosphere. Each season brings its own charm\u2014lush green in spring, golden tones in autumn, and a snow-covered wonderland in winter\u2014making any photo look like a professional masterpiece.", "name": "Olympic Park - Lone Tree", "transport": "Subway Line 9, Hanseong Baekje Station, Exit 2, or Line 8, Mongchontoseong Station, Exit 1. Walk into the park."}, {"address": "Area of Baekjegobun-ro 45-gil, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \ubc31\uc81c\uace0\ubd84\ub85c45\uae38 \uc77c\ub300)", "feature": "\u2b50 4.3 stars | Located right next to the east side of Seokchon Lake, Songridan-gil is a trendy neighborhood that has exploded in popularity among hipster cafe-goers and Instagrammers. Once a quiet residential area, it is now packed with stylish minimalist cafes, retro bakeries, and cozy Japanese-style eateries. Each venue boasts uniquely designed storefronts and aesthetics, attracting fashionable youth for outfit posts and foodie shots. Browsing boutique lifestyle shops and enjoying artisanal desserts here makes for a hip, vibrant Jamsil itinerary.", "name": "Songridan-gil Road", "transport": "Subway Line 9, Songpanaru Station, Exit 1, or Line 2, Jamsil Station, Exit 10. About an 8-minute walk."}, {"address": "300 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 300)", "feature": "\u2b50 4.4 stars | Sprawled between Lotte World Mall and Seokchon Lake, \u0027World Park\u0027 is an expansive outdoor plaza famous for hosting major seasonal events and pop-up installations. Every winter, it transforms into a spectacular Christmas village complete with a towering Christmas tree and a fairytale carousel. In summer, it frequently collaborates with global brands to set up giant art figures and interactive displays. Framed by the soaring Lotte World Tower, any photo taken here captures the festive spirit and modern splendor of Seoul.", "name": "Lotte World Mall World Park", "transport": "Subway Line 2 or Line 8, Jamsil Station, Exit 10. The plaza is immediately outside the exit."}, {"address": "1 Olympic-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \uc62c\ub9bc\ud53d\ub85c 1)", "feature": "\u2b50 4.2 stars | Converted from a former warehouse, Seoul Book Bogo is Korea\u0027s first mega public secondhand bookstore, famously featured in the hit K-drama Hotel Del Luna. The standout highlight for photo enthusiasts is its mesmerising \u0027Book Tunnel,\u0027 created by dozens of arched iron bookshelves that produce an endless, portal-like perspective. Combining vintage charm with literary atmosphere, it attracts photographers and drama fans alike for a unique blend of culture and visual wonder.", "name": "Seoul Book Bogo", "transport": "Subway Line 2, Jamsilnaru Station, Exit 1. About a 1-minute walk."}, {"address": "65 Hangaram-ro, Songpa-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc1a1\ud30c\uad6c \ud55c\uac00\ub78c\ub85c 65)", "feature": "\u2b50 4.5 stars | Offering prime riverside views, Jamsil Hangang Park is an ideal vantage point for taking in the Jamsil Railway Bridge, Lotte World Tower, and stunning Han River sunsets. The park features paved cycling trails, expansive picnic lawns, and seasonal gardens (such as ecological nature zones and rose gardens). In the evening, locals and tourists rent picnic mats, order fried chicken delivery, and snap photos against the backdrop of the sunset and the illuminated Lotte Tower\u2014soaking in Seoul\u0027s signature romantic, relaxed city vibe.", "name": "Jamsil Hangang Park", "transport": "Subway Line 2, Jamsilsaene Station, Exit 6 or 7. About a 10-minute walk toward the Han River."}], "name": "Popular Photo Spots"}}, "name": "Jamsil and Lotte World"}, "jongno_bukchon": {"categories": {"cat_1": {"items": [{"address": "161 Sajik-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.6 stars | Built in 1395 as the main royal palace of the Joseon Dynasty, Gyeongbokgung is the largest and most grand of Seoul\u0027s Five Grand Palaces. Home to iconic structures like Gwanghwamun Gate, Geunjeongjeon Hall, Gyeonghoeru Pavilion, and Hyangwonjeong Pavilion, it is steeped in rich traditional Korean history and culture. Many visitors don traditional Hanbok for free admission and watch the Royal Guard Changing Ceremony at Gwanghwamun, experiencing a magical step back into ancient palace life.", "name": "Gyeongbokgung Palace", "transport": "Subway Line 3, Gyeongbokgung Station, Exit 5, approx. 5-min walk"}, {"address": "99 Yulgok-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Built in 1405 as a secondary palace of the Joseon Dynasty, Changdeokgung is the only palace in Seoul designated as a UNESCO World Cultural Heritage site. Renowned for its architectural layout that seamlessly blends into the surrounding natural landscape, its highlight is the Secret Garden (Huwon). Featuring serene lotus ponds, elegant pavilions, and centuries-old trees, the garden boasts breathtaking foliage in autumn. A guided tour booked in advance is required to explore the peaceful beauty of this royal back garden.", "name": "Changdeokgung Palace", "transport": "Subway Line 3, Anguk Station, Exit 3, approx. 5-min walk"}, {"address": "37 Gyedong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | Nestled between Gyeongbokgung and Changdeokgung Palaces, Bukchon Hanok Village was a traditional residential area for nobility and high officials during the Joseon Dynasty. Preserving hundreds of traditional Hanok houses, its blue-tiled roofs, white walls, and winding alleys create a uniquely nostalgic cityscape. Strolling through the famous \u0027Eight Views of Bukchon\u0027 offers stunning vistas of N Seoul Tower and modern skyscrapers alongside historic charm. The area is also filled with charming Hanok cafes and craft workshops.", "name": "Bukchon Hanok Village", "transport": "Subway Line 3, Anguk Station, Exit 2, approx. 10-min walk"}, {"address": "157 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Jongmyo Shrine is the supreme Confucian sanctuary dedicated to the ancestral tablets of the kings and queens of the Joseon Dynasty, recognized as a UNESCO World Heritage site. The Main Hall (Jeongjeon) displays a solemn and serene architectural beauty, featuring a 101-meter-long wooden structure that is rare in the world. The Jongmyo Jerye (royal ancestral ritual) and Jongmyo Jeryeak (ritual music) held every May showcase impeccably preserved Joseon royal ceremonies and traditional classical music.", "name": "Jongmyo Shrine", "transport": "Subway Lines 1, 3, 5, Jongno 3(sam)-ga Station, Exit 11, approx. 3-min walk"}, {"address": "46 Yulgok-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | Unhyeongung Palace was the private residence of Heungseon Daewongun, the father of Emperor Gojong, and the place where Gojong lived before ascending the throne. Unlike lavish royal palaces, Unhyeongung exudes the elegant and understated beauty of a grand traditional Hanok mansion. The palace exhibits Joseon-era lifestyle artifacts and wax figures, and reenactments of the royal wedding of King Gojong and Empress Myeongseong are held every spring and autumn, making it a key spot for exploring late Joseon history.", "name": "Unhyeongung Palace", "transport": "Subway Line 3, Anguk Station, Exit 4, approx. 1-min walk"}, {"address": "16 Bukchon-ro 7-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Located inside Bukchon Hanok Village, Baek In-je House is a landmark modern Hanok built during the Japanese colonial era and a designated Seoul Tangible Cultural Property. The grand mansion blends traditional Hanok structures with Japanese and Western architectural elements, featuring a charming garden, a second-floor loft, and red-brick walls that reflect the era\u0027s unique architectural transition. A popular filming location for Korean movies, it offers free admission to give visitors a glimpse into high-society life in early 20th-century Seoul.", "name": "Baek In-je House", "transport": "Subway Line 3, Anguk Station, Exit 2, approx. 8-min walk"}, {"address": "55 Ujeongguk-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | Built in 1910, Jogyesa Temple is the head temple of the Jogye Order, the largest sect of Korean Buddhism, located right in the bustling heart of Jongno. The main hall, Daeungjeon, is impressively grand, fronted by an ancient lacebark pine tree over 500 years old. During Buddha\u0027s Birthday celebrations, tens of thousands of vibrant lantern displays illuminate the temple grounds and surrounding streets, drawing visitors worldwide for prayers and photos. It serves as a peaceful urban oasis to experience traditional Korean Buddhist culture.", "name": "Jogyesa Temple", "transport": "Subway Line 1, Jonggak Station, Exit 2, approx. 5-min walk"}, {"address": "99 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.1 stars | Tapgol Park is Seoul\u0027s first modern urban park, built on the site of Wongaksa Temple from the early Joseon era. The park preserves national treasures including the beautifully carved and remarkably well-preserved Ten-Story Stone Pagoda of Wongaksa Temple Site and the Wongaksa Stele. Additionally, it is the birthplace of the famous March 1st Independence Movement in 1919, featuring the Declaration of Independence monument and commemorative statues, making it a site of profound modern historical and cultural significance.", "name": "Tapgol Park", "transport": "Subway Lines 1, 3, 5, Jongno 3(sam)-ga Station, Exit 1, approx. 2-min walk"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "30 Samcheong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 Stars | Situated between Gyeongbokgung Palace and Bukchon Hanok Village, MMCA Seoul is a cultural sanctuary that seamlessly blends traditional Korean architectural aesthetics with modern avant-garde design. Focusing on Korean and international contemporary art exhibitions, its spacious, light-filled galleries frequently host large-scale installations, digital media, and visual arts displays. Beyond its rich art exhibits, the museum\u0027s design shop, caf\u00e9, and landscaped courtyard offer exceptional quality, making it a top choice for exploring contemporary Korean art and enjoying a relaxing afternoon.", "name": "National Museum of Modern and Contemporary Art, Seoul (MMCA Seoul)", "transport": "Subway Line 3, Anguk Station, Exit 1; about a 10-minute walk."}, {"address": "4 Yulgok-ro 4-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.6 Stars | As South Korea\u0027s first public museum dedicated to craft art, SeMoCA was transformed from the historic former site of Whimoon High School. The museum cleverly bridges traditional craft and modern art, showcasing ceramics, metalwork, woodwork, fiber art, and embroidery of great historical and artistic value. Featuring a sleek modern design, interactive zones, and a craft gallery tailored for children, visitors can experience the refined charm of Korean craftsmanship up close.", "name": "Seoul Museum of Craft Art (SeMoCA)", "transport": "Subway Line 3, Anguk Station, Exit 1; walk straight after exiting."}, {"address": "57 Bukchon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 Stars | Located in the heart of Bukchon Hanok Village, Gahoe-dong Catholic Church is a unique sanctuary blending traditional Korean hanok architecture with Western Gothic elements. Holding a profound place in Korean Catholic history, it is the sacred site where Korea\u0027s first foreign priest held its inaugural Mass. Featuring an antique hanok tile-roofed main gate leading to a solemn interior sanctuary, the elevated courtyard also offers stunning views over the surrounding hanok rooftops, attracting countless visitors for photos and quiet reflection.", "name": "Gahoe-dong Catholic Church", "transport": "Subway Line 3, Anguk Station, Exit 2; about a 10-minute walk."}, {"address": "11-4 Insadong 10-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 Stars | Tucked away in the lively alleys of Insadong, the Kyung-in Museum of Fine Art is a cultural space housed in the former residence of Pak Che-sun, a prominent modern Korean figure. The complex comprises three exhibition halls, an outdoor sculpture garden, and a traditional teahouse. Showcasing regular works by Korean painters, calligraphers, and contemporary artists, visitors can enjoy authentic traditional Korean tea and snacks in a lush, elegant hanok courtyard, immersing themselves in a tranquil artistic and historical atmosphere.", "name": "Kyung-in Museum of Fine Art", "transport": "Subway Line 3, Anguk Station, Exit 6 (approx. 6-minute walk); or Line 1, Jonggak Station, Exit 3 (approx. 10-minute walk)."}, {"address": "83 Yulgok-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.4 Stars | Situated right near Anguk Station, Arario Museum is housed in the former office building of \u0027SPACE,\u0027 designed by Kim Swoo-geun, a legendary master of modern Korean architecture. Constructed from black brick, the historic building features an intricate labyrinth of split levels and stairs displaying collector Ci Kim\u0027s extensive contemporary art collection, including works by Nam June Paik, Damien Hirst, and Andy Warhol. The museum seamlessly fuses architectural aesthetics with avant-garde art, offering a captivating viewing experience.", "name": "Arario Museum in Space", "transport": "Subway Line 3, Anguk Station, Exit 3; about a 3-minute walk."}, {"address": "37 Samcheong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 Stars | Located on the eastern side of the Gyeongbokgung Palace grounds, the National Folk Museum of Korea is the best destination to learn about traditional Korean lifestyles, folklore, and daily customs. It features three permanent exhibition halls showcasing life from prehistoric times through the Joseon Dynasty, seasonal farming culture, and life-passage rituals. The outdoor exhibition area recreates early 20th-century Korean streetscapes, traditional hanok buildings, and chimneys, offering an educational and fun experience perfect for families.", "name": "National Folk Museum of Korea", "transport": "Subway Line 3, Anguk Station Exit 1 or Gyeongbokgung Station Exit 5; about a 12-minute walk."}, {"address": "4-5F, Insadong Maru, 35-4 Insadong-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.4 Stars | Located in the heart of Insadong Culture Street, Museum Kimchikan was selected by CNN as one of the world\u0027s top 12 food museums. Through modern technology, interactive media, and tactile exhibits, the museum delves into the history, crafting techniques, and science of fermentation behind kimchi, Korea\u0027s signature dish. Featuring varieties from across the country, fermentation labs, and hands-on workshops where visitors can try making kimchi themselves, it is an engaging, fun, and culturally enriching experience.", "name": "Museum Kimchikan", "transport": "Subway Line 3, Anguk Station, Exit 6; about a 5-minute walk."}, {"address": "55 Ujeongguk-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.3 Stars | Located within the grounds of Jogyesa Temple, the head temple of the Jogye Order of Korean Buddhism, the Central Buddhist Museum is a vital institution preserving over a millennium of Buddhist art and culture. It houses numerous National Treasures, including ancient Buddha statues, intricate Buddhist paintings, sacred scriptures, relics, and ritual objects. The serene and solemn exhibition space, paired with professional lighting and detailed explanations, allows visitors to appreciate the artistic mastery and spiritual depth of Korean Buddhism.", "name": "Central Buddhist Museum", "transport": "Subway Line 3, Anguk Station, Exit 6 (approx. 5-minute walk); or Line 1, Jonggak Station, Exit 2 (approx. 6-minute walk)."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "138-1 Samcheong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | Located north of Seoul\u0027s Bukchon Hanok Village, Samcheong Park rests at the foot of historic Mount Bugaksan. It is a long-standing urban forest park boasting exceptional natural scenery. Nestled among dense trees and babbling streams, the park offers distinct views across all four seasons\u2014especially vibrant during the spring cherry blossoms and autumn foliage. Inside, you\u0027ll also find the famous \u0027Samcheong Park Forest Library,\u0027 where visitors can read and enjoy coffee surrounded by lush greenery. It is a fantastic peaceful sanctuary to escape the city hustle and immerse yourself in nature.", "name": "Samcheong Park", "transport": "Take Subway Line 3 to Anguk Station (Exit 1), then transfer to Village Bus Jongno 02 and get off at Samcheong Park Station."}, {"address": "41 Naksan-gil, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Named for its resemblance to a camel\u0027s hump, Naksan Park is one of Jongno-gu\u0027s most famous natural landmarks and night-view spots. Spanning Daehak-ro and Ihwa Mural Village, the park winds along the ancient Seoul City Wall. Beyond its lush foliage and mountain walking trails, it offers an incredible vantage point overlooking the bustling Seoul cityscape and Namsan Seoul Tower. As the sun sets, golden light washes over the ancient stone walls, turning into a romantic night panorama that attracts couples and photography enthusiasts alike.", "name": "Naksan Park", "transport": "Take Subway Line 4 to Hyehwa Station (Exit 2), then walk about 15 minutes to reach the park entrance."}, {"address": "99 Jong-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.1 stars | Situated in the heart of Jongno 3-ga, Tapgol Park holds immense historical significance as Korea\u0027s first modern public park and the birthplace of the March 1st Independence Movement. Built on the site of the former Wongaksa Temple, it houses national treasures such as the Ten-Story Stone Pagoda and the Wongaksa Stele. Well-maintained with towering ancient trees, the park serves as a rare green oasis amidst the bustling commercial district. Local seniors frequently gather here to play chess and chat, offering a unique glimpse into local daily life.", "name": "Tapgol Park", "transport": "Take Subway Line 1, 3, or 5 to Jongno 3-ga Station (Exit 1), then walk about 2 minutes."}, {"address": "89 Sajik-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | Located at the foot of Mount Inwangsan, Sajik Park stands on the historic site of Sajikdan, where Joseon Dynasty kings prayed to the gods of earth and grain for national peace and prosperity. The park is shaded by dense greenery and quiet trails, lined with centuries-old pine and ginkgo trees that burst into brilliant gold in autumn. Inside, statues of Shin Saimdang and Yi I (Yulgok) honor cultural heritage, while the back connects directly to Inwangsan hiking trails, making it a peaceful refuge blending rich history with scenic nature.", "name": "Sajik Park", "transport": "Take Subway Line 3 to Gyeongbokgung Station (Exit 1), then walk about 5 minutes."}, {"address": "Cheonggyecheon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.5 stars | Cheonggyecheon is an ecologically restored stream flowing through central Seoul, with the stretch passing through Jongno and Insadong being one of its most vibrant and picturesque sections. Strolling along its waterside pathways, visitors can admire clear running waters, swimming fish, and lush stream bank greenery. Unique bridges and water-access steps line the route, while ambient evening lights create a romantic atmosphere. Perfectly blending modern urban design with ecological renewal, it\u0027s the ultimate place to rest your feet and enjoy the tranquil sound of flowing water after shopping.", "name": "Cheonggyecheon Stream (Jongno Section)", "transport": "Take Subway Line 1 to Jonggak Station (Exit 5) or Line 5 to Gwanghwamun Station (Exit 5), then walk about 3 minutes."}, {"address": "Waryonggongwon-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.3 stars | Set on the ridge extending from Mount Bugaksan to Naksan, Waryong Park gets its name from its mountain shape, which resembles a crouching dragon. Enclosed by dense pine forests and seasonal blooms, the park boasts fresh air and vibrant greenery, making it a hidden gem favored by locals. It also marks the junction between the Baegak and Naksan sections of the Seoul City Wall Trail. Walking along the ancient fortress walls inside the park offers a rejuvenating forest bath alongside sweeping views of Seongbuk-gu and Jongno-gu, seamlessly weaving history with natural beauty.", "name": "Waryong Park", "transport": "Take Subway Line 3 to Anguk Station (Exit 2), transfer to Village Bus Jongno 02, and get off at the Waryong Park terminal stop."}, {"address": "104 Daehak-ro, Jongno-gu, Seoul", "feature": "\u2b50 4.4 stars | Located in the heart of Daehak-ro in Jongno-gu, Marronnier Park sits on the former site of Seoul National University\u0027s College of Liberal Arts and Sciences, taking its name from the prominent chestnut trees (Marronniers) planted here. Blending natural greenery with a rich artistic atmosphere, the park is surrounded by numerous small theaters and art galleries. A spacious open lawn and shaded walkways host frequent street performances, live music, and outdoor theater. It\u0027s a wonderful park to relax under majestic trees while soaking up Seoul\u0027s youthful, culturally vibrant energy.", "name": "Marronnier Park", "transport": "Take Subway Line 4 to Hyehwa Station (Exit 2); the park is right outside the exit."}, {"address": "Ogin-dong, Jongno-gu, Seoul", "feature": "\u2b50 4.6 stars | Encircling the slopes of Mount Inwangsan in Jongno-gu, the Inwangsan Jarak-gil Trail is a barrier-free forested trail renowned for its eco-friendly design and beautiful mountain landscapes. Gentle and easy to walk throughout, the path weaves through dense pine groves, cherry blossom trees, and striking rock formations, offering stunning views year-round. Multiple observation decks along the trail provide unobstructed views of Gyeongbokgung Palace, the Blue House, and the entire downtown Seoul skyline\u2014making it a premier urban forest route to escape the city noise and recharge.", "name": "Inwangsan Jarak-gil Trail", "transport": "Take Subway Line 3 to Gyeongbokgung Station (Exit 1), walk past Sajik Park, and follow signs toward the Inwangsan trailhead."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "37 Gyedong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uacc4\ub3d9\uae38 37)", "feature": "\u2b50 4.5 Stars | Bukchon Hanok Village is Seoul\u0027s most iconic traditional architectural complex, preserving traditional Hanok alleys from the Joseon Dynasty. Wandering through the \u0027Eight Views of Bukchon\u0027, every corner offers retro Korean charm perfect for photos. In particular, Bukchon View 6 looking down at N Seoul Tower framed by historic rooftops is a hugely popular check-in spot on social media. Renting a Hanbok to wear here complements the quaint historical backdrop perfectly.", "name": "Bukchon Hanok Village (\ubd81\ucd0c\ud55c\uc625\ub9c8\uc744)", "transport": "Subway Line 3, Anguk Station Exit 2, approx. 5-minute walk"}, {"address": "28 Supyo-ro 28-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc218\ud45c\ub85c28\uae38)", "feature": "\u2b50 4.4 Stars | Ikseon-dong has transformed narrow century-old Hanok alleys into a trendy, hipster sanctuary blending vintage and modern aesthetics. It is packed with unique design-centric cafes, retro clothing boutiques, and handmade craft shops, such as the famous Cheongsudang and Nakwon Station Rail Cafe. The hanging lanterns, cobblestone paths, and old tile-roofed houses make this a dream check-in hotspot for local youth and foreign tourists alike.", "name": "Ikseon-dong Hanok Village (\uc775\uc120\ub3d9\ud55c\uc625\ub9c8\uc744)", "transport": "Subway Lines 1, 3, 5, Jongno 3(sam)-ga Station Exit 4 or 6, approx. 2-minute walk"}, {"address": "44 Insadong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc778\uc0ac\ub3d9\uae38 44)", "feature": "\u2b50 4.2 Stars | Located in the heart of Insadong, Ssamzigil is a creative spiral cultural shopping complex. Its unique architectural design allows visitors to walk seamlessly up accessible courtyard ramps all the way to the rooftop. Along the way, it is filled with indie craft shops, artisan workshops, and cute graffiti walls. The rooftop \u0027Wishing Wall\u0027 and painted murals are fantastic photo spots for couples and friends, serving as one of Insadong\u0027s most eye-catching visual icons.", "name": "Ssamzigil (\uc308\uc9c0\uae38)", "transport": "Subway Line 3, Anguk Station Exit 6, approx. 5-minute walk"}, {"address": "5 Gyedong-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uacc4\ub3d9\uae38 5)", "feature": "\u2b50 4.3 Stars | Cafe Onion Anguk is an Instagrammable cafe Mecca seamlessly combining traditional Hanok structure with minimalist industrial design. High wooden beams, a spacious Korean courtyard, and low floor-seating create a unique play of light and shadow. Their signature Strawberry Snow Mountain pastry and freshly baked goods are not only delicious but also visually stunning. Sitting under the Hanok eaves sipping coffee while snapping stylish photos is a must-do itinerary item when visiting Anguk.", "name": "Cafe Onion Anguk (\uce74\ud398 \uc5b4\ub2c8\uc5b8 \uc548\uad6d)", "transport": "Subway Line 3, Anguk Station Exit 3, approx. 1-minute walk"}, {"address": "161 Sajik-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc0ac\uc9c1\ub85c 161)", "feature": "\u2b50 4.6 Stars | As the main royal palace of the Joseon Dynasty, Gyeongbokgung is grand and majestic. The imposing Gwanghwamun Gate, impressive Geunjeongjeon Hall, and Gyeonghoeru Pavilion floating on water are unmissable scenic photo spots. The daily Royal Guard Changing Ceremony is a grand spectacle that attracts large crowds. Entering in a Hanbok grants free admission and lets you take stunning, classic portraits against the magnificent, historic palace architecture.", "name": "Gyeongbokgung Palace (\uacbd\ubcf5\uad81)", "transport": "Subway Line 3, Gyeongbokgung Station Exit 5, direct access to palace entrance"}, {"address": "Samcheong-ro, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc0bc\uccad\ub85c)", "feature": "\u2b50 4.3 Stars | Nestled between Gyeongbokgung Palace and Bukchon, Samcheong-dong is lined with unique art galleries, distinctive cafes, trendy boutiques, and cozy art spaces. The architecture combines quaint Hanok tile roofs with modern Western-style glass windows, and the ginkgo trees along the street turn a brilliant gold in autumn. Wandering through these artistic corners lets you effortlessly capture stylish, romantic Seoul city vibes.", "name": "Samcheong-dong Cafe Street (\uc0bc\uccad\ub3d9\uce74\ud398\uac70\ub9ac)", "transport": "Subway Line 3, Anguk Station Exit 1, approx. 10-minute walk"}, {"address": "4 Yulgok-ro 3-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \uc728\uace1\ub85c3\uae38 4)", "feature": "\u2b50 4.5 Stars | Seoul Museum of Craft Art is a modern aesthetic space renovated from an old school complex. The exterior features minimalist white walls paired with sweeping curved glass, blending historical depth with avant-garde design. A huge historic tree and modern art sculptures stand on the expansive courtyard lawn, drawing countless photography lovers. Rich, high-quality exhibitions inside, along with the beautiful natural lighting, create a fantastic photo atmosphere, making it a hot new cultural landmark in Jongno.", "name": "Seoul Museum of Craft Art (\uc11c\uc6b8\uacf5\uc608\ubc15\ubb3c\uad00)", "transport": "Subway Line 3, Anguk Station Exit 1, approx. 1-minute walk"}, {"address": "31-9 Donhwamun-ro 11na-gil, Jongno-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc885\ub85c\uad6c \ub3c8\ud654\ubb38\ub85c11\ub098\uae38 31-9)", "feature": "\u2b50 4.4 Stars | Tucked deep inside Ikseon-dong, Cheongsudang is a stunning scenic cafe famous for its fusion of Japanese and Korean Zen aesthetics. The entrance features stepping stones over water, a bamboo forest, and glowing yellow stone lanterns, transporting you to a magical secret forest. Their souffl\u00e9 pancakes and hand-drip coffee are highly praised, while the stone stepping path and lantern walkway at the entrance are viral social media photo backdrops with an immensely romantic vibe.", "name": "Cheongsudang Ikseon (\uccad\uc218\ub2f9)", "transport": "Subway Lines 1, 3, 5, Jongno 3(sam)-ga Station Exit 6, approx. 3-minute walk"}], "name": "Popular Photo Hotspots"}}, "name": "Jongno, Bukchon and Insadong"}, "myeongdong_euljiro": {"categories": {"cat_1": {"items": [{"address": "74 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.6 stars | Myeongdong Cathedral is the birthplace of Korean Catholicism and an iconic landmark of Gothic Revival architecture. Completed in 1898, this solemn structure features a striking exterior crafted from red and gray bricks, a soaring 45-meter spire, and a grand interior with exquisite vaulted ceilings and vibrant stained-glass windows. More than a sacred site for believers, the cathedral served as a crucial sanctuary and spiritual beacon during Korea\u0027s pro-democracy movement. Stepping onto its quiet grounds offers a serene escape from the lively Myeongdong shopping district, surrounding visitors with elegant historical tranquility.", "name": "Myeongdong Cathedral", "transport": "About an 8-minute walk from Exit 8 of Myeongdong Station (Subway Line 4), or a 6-minute walk from Exit 11 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "110 Namdaemun-ro, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | This grand Neoclassical building originally served as the head office of the Bank of Korea. Completed in 1912 during the Japanese colonial period, it was designed by the famous Japanese architect Kingo Tatsuno. Built with granite, the structure fuses Renaissance and Baroque styles, presenting a solid and impressive facade rich with historical character. Today, it operates as a money museum displaying the history of Korean and world currencies, counterfeit detection technologies, and economic development. With free admission, it is an ideal stop for visitors interested in architectural history and financial culture.", "name": "Bank of Korea Money Museum", "transport": "About a 5-minute walk from Exit 7 of Euljiro 1-ga Station (Subway Line 2), or a 7-minute walk from Exit 7 of Hoehyeon Station (Subway Line 4)"}, {"address": "110 Sejong-daero, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Built in 1926, the old Seoul City Hall is a classic example of Imperial Crown style architecture from modern Korean history. Its Western-style exterior and iconic central dome stand as witnesses to Seoul\u0027s urban evolution from the colonial period and the Korean War to the present day. Following the opening of the new City Hall building behind it in 2012, this three-story historic hall was preserved and transformed into the Seoul Library. Inside, visitors can explore the restored former mayor\u0027s office, vintage wooden staircases, extensive book collections, and exhibition spaces. The open-air rooftop garden offers fantastic elevated views over Seoul Plaza and the captivating blend of vintage and modern cityscapes.", "name": "Seoul Library (Old Seoul City Hall)", "transport": "Directly connected to Exit 5 of City Hall Station (Subway Line 1 or 2)"}, {"address": "160 Cheonggyecheon-ro, Jung-gu, Seoul", "feature": "\u2b50 4.1 stars | Built in 1968 and designed by modern architectural master Kim Swoo-geun, Sewoon Sangga was Korea\u0027s first massive mixed-use residential and commercial complex. Stretching 1 kilometer through the Euljiro district, its Bauhaus-inspired mega-structure was once the heart of Korea\u0027s electronics and audiovisual industries. Through recent urban renewal projects, it has transformed into a vibrant historic landmark blending retro maker spaces, hipster cafes, and industrial heritage. A walk along its elevated skywalk offers sweeping views contrasting Jongmyo Shrine with the vintage backalleys of Euljiro, showcasing a unique Cold War and mid-century retro urban aesthetic.", "name": "Sewoon Sangga", "transport": "About a 5-minute walk from Exit 4 of Jongno 3-ga Station (Subway Lines 1, 3, 5), or a 6-minute walk from Exit 6 of Euljiro 3-ga Station (Subway Line 2)"}, {"address": "Near Gwangtonggyo, Cheonggyecheon, Seorin-dong, Jung-gu, Seoul", "feature": "\u2b50 4.2 stars | Spanning Cheonggyecheon Stream near Euljiro 1-ga, Gwangtonggyo was the largest stone bridge in Hanyang (modern-day Seoul) during the Joseon Dynasty, functioning as a vital transportation hub connecting Unjongga (now Jongno) and Namdaemun. The bridge\u0027s most fascinating historical detail is that its foundation stones were repurposed from the original tomb of Queen Sindeok, the second wife of King Taejo. These stones feature remarkably intricate carvings of mythical beasts and elegant floral patterns. Buried underground for decades, the bridge was restored in 2005 during the Cheonggyecheon restoration project, bringing its superb Joseon-era stone craftsmanship back to light.", "name": "Gwangtonggyo Bridge", "transport": "About a 3-minute walk from Exit 2 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "99 Sejong-daero, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | Located just west of Euljiro and City Hall, Deoksugung Palace is unique among Seoul\u0027s five royal palaces for its harmonious blend of traditional Joseon court architecture and modern Western-style structures. Originally the private residence of Prince Wolsan, it later became the imperial palace of Emperor Gojong during the Korean Empire. Within the grounds, Seokjojeon Hall\u2014designed by a British architect\u2014stands as Korea\u0027s grandest Western Neoclassical stone palace. The palace is also famous for its surrounding Stonewall Walkway, celebrated as one of Seoul\u0027s most romantic historic walking paths, steeped in the bittersweet history of the late Korean Empire.", "name": "Deoksugung Palace", "transport": "About a 1-minute walk from Exit 12 of City Hall Station (Subway Line 1 or 2)"}, {"address": "34 Jeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Completed in 1897 along the historic Jeong-dong area near Deoksugung\u
