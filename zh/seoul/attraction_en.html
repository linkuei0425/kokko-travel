0027s Stonewall Walkway, Chungdong First Methodist Church is Korea\u0027s oldest Western-style Protestant church. This simple yet elegant red-brick building features a simplified Gothic design, beautiful internal timber roof framing, and a historic pipe organ. As a cradle for modern education and women\u0027s enlightenment in Korea, as well as a clandestine gathering place for the anti-Japanese independence movement, it has been designated Historic Site No. 256, filled with a strong atmosphere of modern diplomatic and cultural history.", "name": "Chungdong First Methodist Church", "transport": "About an 8-minute walk from Exit 1 or 12 of City Hall Station (Subway Line 1 or 2)"}, {"address": "5 Chilpai-ro, Jung-gu, Seoul", "feature": "\u2b50 4.6 stars | Originally an execution ground during the Joseon Dynasty where numerous Catholic martyrs lost their lives, Seosomun Historical Park was reimagined by the Seoul Metropolitan Government into a subterranean museum that masterfully blends modern minimalist architecture with deep historical memory. Built largely underground, the structure utilizes vibrant red brick walls, dramatic light shafts, and quiet reflection spaces to evoke a solemn, sanctuary-like atmosphere. A winner of multiple international architectural design awards, it is a world-class destination for experiencing Seoul\u0027s religious history and modern spatial design.", "name": "Seosomun Shrine History Museum \u0026 Historical Park", "transport": "About a 6-minute walk from Exit 4 of Chungjeongno Station (Subway Line 2 or 5), or about a 10-minute bus ride from the Euljiro/Myeongdong commercial area"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "74 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.6 stars | Myeongdong Cathedral is the birthplace and spiritual symbol of the Catholic Church in Korea. Built in 1898 in a soaring Gothic red-brick style, it holds immense historical and artistic value. The interior is solemn and peaceful, with vibrant stained-glass windows projecting sacred light and shadow. Beyond its religious significance, it served as a vital sanctuary during Korea\u0027s democratization movement, carrying deep historical memories. The exterior is elegantly illuminated at night, and the basement and surrounding gardens feature cultural spaces and cafes, making it a peaceful cultural landmark in the bustling Myeongdong shopping district.", "name": "Myeongdong Cathedral", "transport": "About an 8-minute walk from Exit 8 of Myeongdong Station (Subway Line 4), or a 10-minute walk from Exit 5 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "39 Namdaemun-ro, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | Housed in an exquisite Neoclassical stone building completed in 1912\u2014formerly the head office of the Bank of Korea\u2014this museum is designated as a National Historic Site of Korea. The museum displays ancient and modern currencies from around the world, commemorative coins, and the evolution of Korean money. It also offers interactive experience zones where visitors can learn to identify counterfeit bills, simulate money transport armored vehicles, and try lifting a heavy model stack of cash. Combining architectural beauty with economic history, it is an ideal destination for family trips and history enthusiasts alike.", "name": "Bank of Korea Money Museum", "transport": "About an 8-minute walk from Exit 6 of Euljiro 1-ga Station (Subway Line 2), or a 5-minute walk from Exit 7 of Hoehyeon Station (Subway Line 4)"}, {"address": "35 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Originally opened in 1936 as the \u0027Meijiza\u0027 theater, this venue served as the National Theater of Korea after the war, witnessing the development of modern Korean drama. After meticulous restoration, this vintage white Gothic-style building was transformed into a modern professional theater dedicated to live performances. It regularly hosts high-quality domestic and international plays, classic drama productions, and contemporary stage performances. The interior retains a classic, elegant ambiance complemented by top-tier sound and lighting facilities, making it a hub for experiencing Korean modern performing arts and culture in Myeongdong.", "name": "Myeongdong Theater", "transport": "About a 5-minute walk from Exit 6 of Myeongdong Station (Subway Line 4), or a 5-minute walk from Exit 6 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "33 Subyo-ro, Jung-gu, Seoul", "feature": "\u2b50 4.3 stars | Located near Euljiro 3-ga, Youngnak Presbyterian Church was founded in 1945 by Pastor Kyung-Chik Han and is a highly representative historic church of the Presbyterian Church of Korea. The existing main sanctuary, built in 1949, is a Gothic Revival stone structure whose majestic spires and solid granite walls exude a solemn and simple beauty. The church played an essential role in post-war social relief and education in Korea. Its classical architecture creates a serene and elegant oasis amidst the busy modern skyscrapers of Euljiro, drawing many visitors interested in architectural history.", "name": "Youngnak Presbyterian Church", "transport": "About a 3-minute walk from Exit 11 of Euljiro 3-ga Station (Subway Lines 2 or 3)"}, {"address": "15 Sejong-daero 19-gil, Jung-gu, Seoul", "feature": "\u2b50 4.7 stars | Located at the intersection of City Hall and Euljiro, this cathedral is a rare religious art treasure in Korea that combines Romanesque architectural elements with traditional Korean Hanok roof elements. Construction began in 1926 and took several decades to fully complete according to original plans. The mosaic murals and Romanesque arches inside the main hall deliver a powerful artistic impact, while the exterior\u0027s red bricks and granite weave an elegant, classical charm. Surrounded by lush greenery in a tranquil setting, it hosts regular organ concerts on set weekdays, drawing countless art and music lovers looking to enrich their souls.", "name": "Seoul Anglican Cathedral", "transport": "About a 3-minute walk from Exit 3 of City Hall Station (Subway Lines 1 or 2)"}, {"address": "40 Cheonggyecheon-ro, Jung-gu, Seoul", "feature": "\u2b50 4.6 stars | Situated along the Cheonggyecheon Stream near Euljiro 1-ga Station, HiKR Ground is a new-concept Korean cultural exhibition space created by the Korea Tourism Organization. The facility blends modern digital media art, K-POP interactive experiences, and contemporary art exhibitions, breaking the mold of traditional museums. Visitors can record K-POP MV scenes in futuristic, colorful spaces, admire Korea\u0027s four seasons on a massive LED media art wall, and view curated special exhibitions by contemporary artists. It is a must-visit hotspot that combines modern trends with cultural arts.", "name": "HiKR Ground", "transport": "About a 3-minute walk from Exit 2 of Euljiro 1-ga Station (Subway Line 2)"}, {"address": "Euljiro Underground Shopping Center (between Euljiro 1-ga Station and Euljiro 3-ga Station), Jung-gu, Seoul", "feature": "\u2b50 4.1 stars | Connecting Euljiro 1-ga Station to Euljiro 4-ga Station, this underground passageway has recently transformed into an art corridor celebrating local culture and everyday life. In collaboration with local artists, the city government turned old underground shopping arcade walls and public areas into an open gallery displaying contemporary paintings, photography, and retro-industrial art installations. Strolling through this underground art street allows visitors to experience Euljiro\u0027s unique \u0027Newtro\u0027 (new + retro) vibe, discover creations by emerging artists, and feel the fresh cultural vitality born from Seoul\u0027s urban renewal.", "name": "Eulji Underground Art Gallery", "transport": "Directly connected to the underground concourses of Euljiro 1-ga Station or Euljiro 3-ga Station (Subway Line 2)"}, {"address": "34 Jeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Founded in 1885, Chungdong First Methodist Church is Korea\u0027s first Methodist church. Its existing Gothic red-brick chapel was constructed in 1897 and is designated as a Historic Site of Korea. Featuring a simple yet dignified exterior, the interior preserves a century-old wooden structure and a classic pipe organ, exuding a profound sense of history. Situated along the beautiful Jeongdong Stonewall Walkway surrounded by modern historical landmarks and cultural spaces, it bursts into vibrant autumn foliage every fall, making it a culturally rich and historical pilgrimage site right next to Euljiro and Deoksugung Palace.", "name": "Chungdong First Methodist Church", "transport": "About a 7-minute walk from Exit 12 of City Hall Station (Subway Lines 1 or 2)"}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "108 Samcheongdong-ro, Jung-gu, Seoul (Hoehyeon-dong 1-ga)", "feature": "\u2b50 4.6 stars | Namsan Park is the most iconic natural green space in central Seoul, located right next to the Myeongdong shopping district. The entire park is covered with lush, dense forests, offering distinct charm across all four seasons\u2014from a romantic tunnel of blooming cherry blossoms in spring to sweeping vibrant red foliage in autumn. Featuring accessible wooden boardwalks, cozy rest pavilions, and multiple observation decks, visitors can stroll along shaded paths for a refreshing forest bath while overlooking the breathtaking Seoul skyline. It is the perfect retreat to escape urban hustle and embrace nature.", "name": "Namsan Park", "transport": "Metro Myeongdong Station Exit 3, about a 10\u201315 minute walk to the cable car station or trail entrance."}, {"address": "Cheonggyecheon Stream area along Euljiro 1-ga to 3-ga, Jung-gu, Seoul", "feature": "\u2b50 4.5 stars | An artificial ecological stream running through central Seoul, spanning the Myeongdong and Euljiro areas. Well-designed waterfront walkways, lush greenery, and artificial waterfalls line both sides of the stream. It serves as an oasis for locals and tourists to unwind in the bustling commercial district, where you can spot herons and stream fish year-round. At night, the illuminated stream and dancing reflections create a wonderfully romantic night view, making it ideal for a leisurely evening stroll.", "name": "Cheonggyecheon Stream - Euljiro \u0026 Myeongdong Section", "transport": "Metro Euljiro 1-ga Station Exit 2, about a 3-minute walk to the Cheonggyecheon stream side."}, {"address": "28 Toegye-ro 34-gil, Jung-gu, Seoul", "feature": "\u2b50 4.4 stars | Located inside Namsangol Hanok Village at the intersection of Myeongdong and Chungmuro, this beautifully designed traditional Korean garden recreates the natural landscaping style of the Joseon Dynasty. It features the artificial lotus pond \u0027Cheonugak Pond\u0027, classical pavilions, winding streams, and seasonal flora. Backed by the foothills of Namsan, the lush trees and peaceful environment allow visitors to enjoy fresh air while soaking in the serene beauty where traditional architecture meets natural scenery.", "name": "Namsangol Hanok Village Traditional Garden", "transport": "Metro Chungmuro Station Exit 3 or 4, about a 5-minute walk."}, {"address": "100-115 Hoehyeon-dong 1-ga, Jung-gu, Seoul", "feature": "\u2b50 4.6 stars | A park located on the western slope of Namsan, close to Myeongdong and Hoehyeon Station. Its most famous feature is the ancient Hanyangdoseong Seoul City Wall undulating along the hillside, complemented by expansive green lawns and dense trees. The park features viewing decks with sweeping views of both Namsan Seoul Tower and downtown skyscrapers. As dusk falls, lit city walls create a stunning contrast with the surrounding landscape, making it a hidden gem for photos and relaxing walks.", "name": "Baekbeom Square Park", "transport": "Metro Hoehyeon Station Exit 4, about an 8-minute walk."}, {"address": "Namsan Park Dulegil Trail Entrance (Myeongdong side), Jung-gu, Seoul", "feature": "\u2b50 4.7 stars | A lush forest trail looping around the foot of Namsan, connecting Myeongdong with surrounding areas. The entire trail is gentle, mostly consisting of wooden boardwalks and well-paved barrier-free paths. Surrounded by tall pines, cherry trees, and maples, it boasts high forest coverage. Whether for a morning jog or an afternoon stroll, you can immerse yourself in negative ions and phytoncides, making it a highly popular nature hiking route near Myeongdong.", "name": "Namsan Dulegil Trail", "transport": "Metro Myeongdong Station Exit 1, walk for about 10 minutes toward the National Theater of Korea to connect to the trail."}, {"address": "159 Cheonggyecheon-ro, Jongno-gu, Seoul (9th Floor Rooftop, Seun Shopping Center)", "feature": "\u2b50 4.3 stars | A multi-dimensional urban rooftop garden located in the heart of Euljiro. Converted from the top floor of an older commercial building, it combines lush greenery, wooden seating decks, and panoramic views. Strolling through the rooftop garden, you can enjoy refreshing breezes while taking in a 360-degree view of Jongmyo Shrine, its surrounding green belt, and Euljiro\u0027s vibrant blend of traditional and modern streetscapes. It is a rare elevated green oasis in the busy city.", "name": "Seun Rooftop Garden", "transport": "Metro Euljiro 3-ga Station Exit 4, about a 6-minute walk."}, {"address": "Supyo-ro, Jung-gu, Seoul (Supyogyo Bridge section of Cheonggyecheon)", "feature": "\u2b50 4.3 stars | A prime green section of Cheonggyecheon Stream near Euljiro 3-ga, centered around the replica of the historic Supyogyo Bridge. The banks are planted with rich aquatic plants, reeds, and weeping willows, forming a natural river ecological corridor. Outfitted with numerous stone benches and steps near the water, local commuters and tourists gather here to listen to flowing waters and enjoy seasonal foliage, making it a vibrant natural nook rich in history.", "name": "Supyogyo Bridge \u0026 Cheonggyecheon Park Area", "transport": "Metro Euljiro 3-ga Station Exit 14, about a 4-minute walk."}, {"address": "258-6 Itaewon-dong, Yongsan-gu, Seoul", "feature": "\u2b50 4.5 stars | An expansive botanical garden located on the southern slope of Namsan Park, separated from Myeongdong by just the mountain ridge. The garden is divided into ecological zones including a wild flower garden, alpine plant garden, aquatic plant garden, and pine forest, housing hundreds of native Korean species and rare plants. Strolling along wooden walkways and trickling streams, visitors can enjoy fresh, fragrant air and vibrant seasonal colors, making it an ideal trekking destination for plant lovers and nature enthusiasts.", "name": "Namsan Outdoor Botanical Garden", "transport": "From Metro Myeongdong Station, take Namsan Yellow Bus No. 01A and get off at Namsan Botanical Garden Station."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "74 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.6 Stars | Blending Gothic red-brick architecture with rich history, this landmark is the birthplace and vital symbol of Korean Catholicism. The most iconic photo angles are from the garden lawn and the grand staircase leading up to the cathedral. Whether bathed in daytime sunlight on red brick walls or softly illuminated by warm lights at night, every shot exudes classic European charm. During Christmas, romantic LED flower displays and a grand Christmas tree draw countless visitors for photo ops.", "name": "Myeongdong Cathedral", "transport": "Approx. 7-min walk from Exit 8 of Myeongdong Station (Line 4), or an 8-min walk from Exit 5 of Euljiro 1-ga Station (Line 2)"}, {"address": "3F, 73 Myeongdong-gil, Jung-gu, Seoul", "feature": "\u2b50 4.5 Stars | Located directly across from Myeongdong Cathedral, this rooftop caf\u00e9 is one of the hottest Instagram hotspots in town. The outdoor terrace offers an unbeatable front-row view of the cathedral and Namsan Tower, instantly transporting you to the streets of Europe. Enjoy authentic, rich Italian espresso and fresh desserts while striking a pose against the grand cathedral backdrop\u2014it\u0027s pure European romance.", "name": "Molto Italian Espresso Bar", "transport": "Approx. 6-min walk from Exit 8 of Myeongdong Station (Line 4)"}, {"address": "37-8 Myeongdong 8-gil, Jung-gu, Seoul", "feature": "\u2b50 4.3 Stars | A wildly popular cosmetics and fashion flagship store styled after a 1950s vintage hotel. Spanning six floors, every corner bursts with dreamlike pink aesthetics\u2014from the 1st-floor hotel lobby reception and 2nd-floor luxury spa pool setup, to the 3rd-floor guest room corridor and the dreamy rooftop lounge with giant pink parasols. It\u2019s a pastel paradise made specifically for photo lovers and trendsetters.", "name": "Stylenanda Pink Hotel Flagship Store", "transport": "Approx. 3-min walk from Exit 6 of Myeongdong Station (Line 4)"}, {"address": "81 Namdaemun-ro, Jung-gu, Seoul", "feature": "\u2b50 4.2 Stars | Situated in the ground-floor outdoor walkway of Lotte Department Store, this is a must-see landmark for K-pop and K-drama fans. The corridor is lined with ultra-high-definition giant LED display walls and celebrity handprints featuring top idols and actors. The dazzling light displays paired with interactive multimedia setups create a high-tech, futuristic backdrop for ultra-stylish photos.", "name": "Lotte Department Store Star Avenue", "transport": "Directly connected to Exit 7 of Euljiro 1-ga Station (Line 2)"}, {"address": "159 Cheonggyecheon-ro, Jung-gu, Seoul", "feature": "\u2b50 4.4 Stars | A trendy hip spot born from urban regeneration that bridges Korea\u0027s historic electronics market with modern culture. Head up to \u0027Sewoon Rooftop\u0027 via stairs or elevator to enjoy panoramic views of Jongmyo Shrine\u0027s greenery and the Seoul skyline. Capture striking photos highlighting the contrast between ancient heritage and modern urban architecture\u2014especially stunning at sunset and nightfall.", "name": "Sewoon Sangga Rooftop Deck", "transport": "Approx. 5-min walk from Exit 12 of Jongno 3-ga Station (Lines 1, 3, 5), or a 6-min walk from Euljiro 4-ga Station (Line 2)"}, {"address": "Eulji-ro 3-ga area, Jung-gu, Seoul", "feature": "\u2b50 4.5 Stars | Affectionately dubbed \u0027Hipjiro,\u0027 this old industrial zone of print shops and ironworks has been cleverly transformed into Seoul\u0027s hipster hotspot. Hidden within its maze-like alleys are signless retro bars, vinyl record cafes, and independent galleries. The contrast of psychedelic neon signs against weathered concrete walls creates a unique Y2K and Korean cyberpunk aesthetic\u2014the perfect playground for streetwear shoots and subculture exploration.", "name": "Euljiro \u0027Hipjiro\u0027 Retro Alleys", "transport": "Around Exit 9 or 10 of Euljiro 3-ga Station (Lines 2 \u0026 3)"}, {"address": "Around Gwanggyo, Cheonggyecheon-ro, Jung-gu, Seoul", "feature": "\u2b50 4.5 Stars | A lush waterfront promenade cutting through downtown Seoul, right next to Myeongdong and Euljiro. The Gwanggyo section features stepping-stone paths, crystal-clear water, and artistic light installations. It serves as a peaceful urban oasis by day and transforms into a romantic, softly lit nightscape. During the autumn Seoul Lantern Festival and Christmas celebrations, it becomes an absolute must-visit visual spectacle.", "name": "Cheonggyecheon Stream (Gwanggyo Area)", "transport": "Approx. 3-min walk from Exit 2 of Euljiro 1-ga Station (Line 2)"}, {"address": "San 1-19, Hoehyeon-dong 1-ga, Jung-gu, Seoul", "feature": "\u2b50 4.3 Stars | The \u0027Namsan Oreumi\u0027 is a free glass-walled inclined elevator connecting the Myeongdong shopping district to the Namsan Cable Car Station. As it ascends, it offers sweeping views of Myeongdong streetscapes and lush Namsan greenery. Upon arrival, the sleek modern elevator, moving traffic, and N Seoul Tower in the background create a stunningly layered backdrop for incredible pictures\u2014whether taken from inside the elevator or on the viewing deck.", "name": "Namsan Oreumi Inclined Elevator \u0026 Cable Car Station", "transport": "Approx. 10-min walk from Exit 3 of Myeongdong Station (Line 4)"}], "name": "Popular Photo Spots"}}, "name": "Myeongdong and Euljiro"}, "seongsu_seoulforest": {"categories": {"cat_1": {"items": [{"address": "27, Wangsimni-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 stars | Built in 1908 near Seoul Forest, the Ttukseom Waterworks Museum is South Korea\u0027s first water purification facility and an iconic modern industrial heritage and cultural landmark in Seoul. The museum beautifully preserves century-old red-brick pump rooms, slow sand filters, and ancient water intake pipes, depicting the history of Korea\u0027s tap water development from the late Joseon Dynasty to the present day. Combining Gothic and European red-brick architectural styles, the building exudes a strong vintage charm that makes visitors feel like stepping back in time. Offering free admission, interactive educational exhibits, and a lush outdoor park, it is a hidden gem blending history, cultural education, and architectural appreciation.", "name": "Ttukseom Waterworks Museum", "transport": "Approx. 5-minute walk from Exit 3 of Seoul Forest Station on the subway"}, {"address": "78, Seongsu-iro, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 stars | Daelim Changgo is one of the most vital architectural landmarks that led Seongsu-dong\u0027s transformation from a declining industrial area into the \u0027Brooklyn of Seoul.\u0027 Built in the 1970s, it originally served as a rice mill before becoming a warehouse for steel and textile factories. Retaining its soaring weathered wooden roof frame, rugged red-brick exterior, and industrial steel structure, Daelim Changgo seamlessly blends historical nostalgia with contemporary art and design. Today, the interior has been reinvented as a complex cultural space housing massive contemporary art installations, a gallery, and a caf\u00e9-restaurant. The giant wooden doors and light-filled vaulted skylights showcase striking industrial architectural aesthetics, making it a classic Seoul landmark for architecture enthusiasts and trendsetters.", "name": "Daelim Changgo Gallery", "transport": "Approx. 5-minute walk from Exit 3 of Seongsu Station on the subway"}, {"address": "14, Seongsu-iro 14-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.2 stars | Seongsu Yeonbang is an exemplary adaptive reuse project transformed from a 1970s chemical factory. The architectural team preserved its classic U-shaped dual-building layout and deep-toned brick exterior while inserting a lush open-air courtyard and transparent glass greenhouse at its center. This converted a previously enclosed, austere manufacturing plant into an open, diverse modern cultural complex. Housing niche designer boutiques, a curated bookstore, stylish restaurants, and specialty caf\u00e9s, the space cleverly connects different zones using metal staircases, industrial catwalks, and expansive floor-to-ceiling windows. It serves as a masterclass in modern urban renewal and industrial heritage revitalization, making it immensely popular with architectural photographers and lifestyle seekers.", "name": "Seongsu Yeonbang", "transport": "Approx. 6-minute walk from Exit 3 of Seongsu Station on the subway"}, {"address": "8, Achasan-ro 9-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | Caf\u00e9 Onion Seongsu is one of the most celebrated landmarks of urban regeneration in Seongsu-dong. Built in the 1970s, the structure served varied roles over half a century, including a metal parts factory, supermarket, restaurant, and worker dormitory. Taking over the space, the design team embraced a philosophy of \u0027extreme preservation\u0027\u2014retaining rusted iron doors, peeling concrete walls, aged red bricks, and weathered voids, while thoughtfully incorporating modern steel-and-glass structures and a rooftop garden. The raw, imperfect beauty of history contrasts sharply yet harmoniously with contemporary transparent elements, allowing visitors to savor freshly baked pastries while wandering through labyrinthine vintage rooms steeped in atmospheric history.", "name": "Caf\u00e9 Onion Seongsu", "transport": "Approx. 2-minute walk from Exit 2 of Seongsu Station on the subway"}, {"address": "Area of Seongsu-dong 2-ga, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | Seongsu-dong was Seoul\u0027s premier light industrial hub during the 1970s and 1980s, giving rise to numerous iconic red-brick factories and small workshops. To preserve this valuable urban heritage, the Seoul Metropolitan Government and Seongdong-gu designated the neighborhood as a \u0027Red Brick Building Preservation Zone.\u0027 The initiative subsidizes the maintenance of historic red-brick structures and encourages new developments to incorporate red-brick aesthetics. Strolling through these streets, you\u0027ll be immersed in warm, retro brick facades, geometric arched windows, and pitched rooflines. The seamless blend of old industrial sites and trendy modern storefronts creates a unique cityscape, acting as an open-air museum ideal for street photography and exploring Seoul\u0027s modern industrial architectural heritage.", "name": "Seongsu-dong Red Brick Street", "transport": "Alleys around Exit 3 or Exit 4 of Seongsu Station on the subway"}, {"address": "Achasan-ro area, Seongdong-gu, Seoul", "feature": "\u2b50 4.1 stars | Seongsu-dong has been South Korea\u0027s premier handmade shoemaking hub since the 1980s, housing thousands of shoe workshops and material suppliers at its peak. The street preserves the low-rise factory architecture and shopfronts of the 1980s, complemented by shoemaking-themed art installations and red-brick display pavilions along the sidewalks. Located beneath the subway station, the \u0027FromSS\u0027 gallery and shoe history exhibition space document the rise, fall, and enduring craftsmanship of this historic district. Walking through the area, the distinctive aroma of leather and the whir of machinery still fill the air, painting an authentic, culturally rich portrait of traditional manufacturing architecture.", "name": "Seongsu Handmade Shoe Street", "transport": "Around Exit 1 and Exit 2 of Seongsu Station on the subway"}, {"address": "32, Seoulforest 2-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 stars | Situated right next to Seoul Forest Park, Galleria For\u00eat is an iconic modern luxury green building landmark designed by Pritzker Prize-winning French architect Jean Nouvel. The twin-tower glass superstructure was designed around the core philosophy of \u0027bringing the natural greenery of Seoul Forest into the building\u0027s interior,\u0027 featuring sleek undulating glass curtain walls and high-tech energy-efficient architecture. The lower floors house a major contemporary art exhibition hall and design mall. The towers reflect futuristic light patterns that echo the changing seasons of Seoul Forest, serving as a flagship masterpiece bridging Seongsu-dong\u0027s industrial past with world-class contemporary architectural design.", "name": "Galleria For\u00eat", "transport": "Approx. 3-minute walk from Exit 4 of Seoul Forest Station on the subway"}, {"address": "83-21, Wangsimni-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 stars | D-Tower Seoul Forest is a high-tech, ultra-modern landmark adjacent to Seoul Forest Station, serving as the global headquarters for K-pop powerhouse SM Entertainment and a dynamic commercial complex. Celebrated for its crisp geometric lines, massive glass curtain walls, and sustainable green technology design, the lower levels connect directly to the subway station and feature \u0027KWANGYA\u0027\u2014a vibrant cultural hub combining digital media art installations, trendy dining, and event spaces. The strikingly futuristic architectural form creates a dramatic contrast with the surrounding low-rise vintage red-brick factories, symbolizing Seongsu-dong\u0027s successful evolution from an industrial heartland into a core hub for modern culture and technology.", "name": "D-Tower Seoul Forest", "transport": "Directly connected to Exit 4 of Seoul Forest Station on the subway"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "83-21 Wangsimni-ro, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc655\uc2ed\ub9ac\ub85c 83-21)", "feature": "\u2b50 4.5 stars | Relocated to the Acro Seoul Forest building in Seongsu-dong, this premier exhibition space blends modern \u0026 contemporary art, design, photography, and lifestyle aesthetics. Renowned for its smooth viewing layout and forward-thinking curated exhibitions, the museum regularly hosts cross-disciplinary special exhibitions with internationally renowned designers and artists. Featuring immersive lighting and installation art that offers a rich sensory experience, it is one of Seongsu-dong\u0027s most iconic trendy art landmarks.", "name": "D Museum Seoul Forest (\ub514\ubba4\uc9c0\uc5c4)", "transport": "Direct connection via Subway Suin-Bundang Line, Seoul Forest Station Exit 4"}, {"address": "B1F Thinktown, 17 Achasan-ro, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc544\ucc28\uc0b0\ub85c 17 \uc0dd\uac01\uacf5\uc7a5 \uc131\uc218 B1F)", "feature": "\u2b50 4.6 stars | Located in the basement level of the Thinktown building in Seongsu-dong, this well-known multimedia art exhibition hall has hosted numerous sensational international contemporary art exhibitions, illustration specials, and digital immersive light shows in Seoul. Featuring soaring high ceilings and advanced projection equipment, the venue transforms classic paintings and modern creations into visually stunning interactive experiences, attracting young audiences who love art and photography.", "name": "Ground Seesaw Seongsu (\uadf8\ub77c\uc6b4\ub4dc\uc2dc\uc18c \uc131\uc218)", "transport": "Subway Line 2, Seongsu Station Exit 4, approx. 7 mins walk"}, {"address": "G205 Galleria Foret, 32-14 Seoulforest 2-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc11c\uc6b8\uc2322\uae38 32-14 \uac24\ub7ec\ub9ac\uc544\ud3ec\ub808 G205)", "feature": "\u2b50 4.4 stars | Nestled inside the Galleria Foret building in Seoul Forest, this high-end contemporary art gallery focuses on introducing top Korean and international modern artists, contemporary sculptures, and installation art pieces. The minimalist white-cube space allows viewers to focus purely on the power of the artwork itself. Featuring many pieces with international collectible value, it is an exquisite gallery that art enthusiasts exploring Seoul Forest should not miss.", "name": "The Page Gallery (\ub354\ud398\uc774\uc9c0\uac24\ub7ec\ub9ac)", "transport": "Subway Suin-Bundang Line, Seoul Forest Station Exit 5, approx. 5 mins walk"}, {"address": "26 Seongsuil-ro 8-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc131\uc218\uc77c\ub85c8\uae38 26)", "feature": "\u2b50 4.3 stars | Established in the 1970s, this historical Catholic church stands at the intersection of vibrant hip cafe streets and old industrial factories. Its classic red-brick facade and soaring spires topped with crosses create a remarkably solemn and peaceful presence amidst the bustling, modern neighborhood of Seongsu-dong. Stained-glass windows cast colorful light into the sanctuary, offering a sacred space for quiet reflection and prayer for local parishioners and visitors alike.", "name": "Seongsu Catholic Church (\uc131\uc218\ub3d9\uc131\ub2f9)", "transport": "Subway Line 2, Seongsu Station Exit 1, approx. 4 mins walk"}, {"address": "63 Wangsimni-ro, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc655\uc2ed\ub9ac\ub85c 63)", "feature": "\u2b50 4.2 stars | Constructed from 116 brightly colored shipping containers, this complex art and cultural innovation platform is located near the entrance of Seoul Forest Park. Combining youth artist galleries, independent designer select shops, an outdoor performance stage, and craft workshops, it regularly hosts art markets and musical performances, showcasing the diverse, inclusive subculture and artistic vitality of Seongsu-dong.", "name": "Under Stand Avenue (\uc5b8\ub354\uc2a4\ud0e0\ub4dc\uc5d0\ube44\ub274)", "transport": "Subway Suin-Bundang Line, Seoul Forest Station Exit 3, approx. 1 min walk"}, {"address": "20 Seongsuil-ro, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc131\uc218\uc77c\ub85c 20)", "feature": "\u2b50 4.4 stars | Converted from an old printing house and abandoned steel plant, this giant industrial-style art exhibition venue retains its mottled brick walls, steel beams, and raw concrete floors. Functioning as a gallery, independent bookstore, photo studio, and arts salon, it frequently hosts launch events for Korean fashion brands, contemporary exhibitions by independent artists, and hybrid musical performances, perfectly embodying the unique charm of Seongsu-dong\u0027s industrial regeneration mixed with contemporary aesthetics.", "name": "Layer 57 (\ub808\uc774\uc5b457)", "transport": "Subway Line 2, Seongsu Station Exit 3, approx. 10 mins walk"}, {"address": "B1F, 83-21 Wangsimni-ro, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc655\uc2ed\ub9ac\ub85c 83-21 B1F)", "feature": "\u2b50 4.5 stars | Located on the B1 level of SM Entertainment\u0027s headquarters, this immersive themed exhibition space blends digital multimedia art, K-POP culture, and futuristic design. The space features massive transparent floor LCD screens and ultra-high-definition panoramic laser light exhibition areas, showcasing artist album concepts, art installations, and exclusive cultural merchandise, serving as an iconic venue bridging pop culture and contemporary digital art.", "name": "KWANGYA@SEOUL (\uad11\uc57c@\uc11c\uc6b8)", "transport": "Direct connection to the building basement from Subway Suin-Bundang Line, Seoul Forest Station Exit 4"}, {"address": "30 Seongsui-ro 3-gil, Seongdong-gu, Seoul (\uc11c\uc6b8\ud2b9\ubcc4\uc2dc \uc131\ub3d9\uad6c \uc131\uc218\uc774\ub85c3\uae38 30)", "feature": "\u2b50 4.1 stars | A traditional Presbyterian church that has grown alongside Seongsu-dong\u0027s community for decades. Its elegant, classic architectural lines and rustic brick and stone structure create a streetscape rich in cultural texture and historical depth, set against the backdrop of surrounding contemporary trendy flagships and hipster cafes. Serving as a spiritual home for locals, it also adds a warm, peaceful cultural ambiance for travelers visiting Seongsu-dong.", "name": "Seongsu Central Presbyterian Church (\uc131\uc218\uc911\uc559\uad50\ud68c)", "transport": "Subway Line 2, Seongsu Station Exit 3, approx. 8 mins walk"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "273 Seoulforest-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 stars | Seoul Forest is a iconic, large-scale ecological park in downtown Seoul, covering an area of 180,000 pyeong (approx. 600,000 m\u00b2) and often dubbed Seoul\u0027s version of New York\u0027s Central Park. The park is divided into four themed zones: Culture \u0026 Arts Park, Eco Forest, Experiential Learning Park, and Waterfront Park. Cherry blossoms and tulips bloom in full glory during spring, while vibrant ginkgo and maple trails light up autumn, making it a fantastic destination to embrace nature and enjoy outdoor picnics.", "name": "Seoul Forest (\uc11c\uc6b8\uc232)", "transport": "Approx. 2-min walk from Exit 3 or 4 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "273 Seoulforest-ro, Seongdong-gu, Seoul (Inside the Eco Forest area)", "feature": "\u2b50 4.5 stars Park (\ub69d\uc12c\ud55c\uac15\uacf5\uc6d0)", "transport": "Direct access from Exit 2 or 3 of Jayang Station (formerly Ttukseom Park Station), Line 7"}, {"address": "273 Seoulforest-ro, Seongdong-gu, Seoul (Inside the Culture \u0026 Arts Park area)", "feature": "\u2b50 4.7 stars | The Mirror Pond and Ginkgo Forest are among the most famous photography and check-in spots inside Seoul Forest. The glassy surface of the Mirror Pond creates a crystal-clear reflection of the surrounding tall dawn redwood trees and blue skies, offering a stunning symmetrical visual. Right next to it, the Ginkgo Forest turns a dazzling golden yellow from late October to early November, carpeting the ground in gold and attracting endless streams of photographers.", "name": "Seoul Forest Mirror Pond \u0026 Ginkgo Forest (\uc11c\uc6b8\uc232 \uac70\uc6b8\uc5f0\ubabb\uacfc \uc740\ud589\ub098\ubb34\uc232)", "transport": "Approx. 5-min walk from Exit 3 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "Deoksugwan-ro, Seongdong-gu, Seoul (Border between Seongsu-dong 2-ga and Seoul Forest)", "feature": "\u2b50 4.3 stars | Seongsu Clouds Bridge is an elevated pedestrian overpass connecting Seoul Forest\u0027s Eco Forest directly to Hangang Park. Crossing over busy roads below, this wide and seamless walkway offers fantastic open views of Seongsu-dong\u0027s modern architectural skyline and the vast Han River. At dusk, it transforms into a hidden gem for catching glowing sunset reflections on the river, making it the finest scenic walking route connecting the two major green spaces.", "name": "Seongsu Clouds Bridge \u0026 Hangang Access (\uc131\uc218\uad6c\ub984\ub2e4\ub9ac)", "transport": "Approx. 15-min walk from Exit 3 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "Jungnangcheon Stream, Seongsu-dong 1-ga, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 stars | Jungnangcheon Stream is a major tributary flowing into the Han River, curving around the north and west sides of Seongsu-dong. Both banks feature exceptionally well-maintained bike paths and walking trails lined with rose gardens and seasonal wildflowers. The cherry blossom boulevard along the stream is breathtaking in spring, while summer and autumn turn it into a tranquil oasis for local residents to bike, jog, and stroll, showcasing a relaxed local side of life away from Seongsu-dong\u0027s bustle.", "name": "Jungnangcheon Stream Ecological Park (\uc911\ub791\ucc9c \uc0dd\ud0dc\uacf5\uc6d0)", "transport": "Approx. 10-min walk to the riverside from Exit 3 of Hanyang University Station (Line 2) or Seoul Forest Station (Suin-Bundang Line)"}, {"address": "273 Seoulforest-ro, Seongdong-gu, Seoul (Waterfront Park area)", "feature": "\u2b50 4.5 stars | Built around the central artificial lake of Seoul Forest, the Waterfront Park offers the openest views and most relaxing ambience in the entire park. The lakeside features a large open-air stage, wooden boardwalks, and water-view decks where wild ducks and koi carp swim freely. Picturesque throughout all four seasons, it is framed by towering green trees and Seongsu-dong\u0027s landmark skyscrapers, capturing a harmonious coexistence between nature and urban life. Perfect for sitting on a bench to relax and unwind.", "name": "Seoul Forest Waterfront Park \u0026 Lake (\uc11c\uc6b8\uc232 \uc218\ubcc0\uacf5\uc6d0)", "transport": "Approx. 5-min walk from Exit 3 of Seoul Forest Station (Suin-Bundang Line)"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "7 Yeonmujang 5-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 Stars | Modeled after the iconic 30 Avenue Montaigne flagship in Paris, this gorgeous glass palace structure is Seongsu-dong\u0027s most striking fashion landmark and top photo spot. Featuring meticulously designed seasonal outdoor gardens, it looks even more dazzling and luxurious when illuminated at night, drawing countless tourists and fashion lovers to visit and take photos.", "name": "Dior Seongsu Concept Store", "transport": "Approx. 3-minute walk from Exit 4 of Seongsu Station (Line 2)"}, {"address": "273 Ttukseom-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.6 Stars | Sprawling over 600,000 square meters, this massive urban forest park features thematic areas including a Culture \u0026 Art Park, Eco Forest, and Wetlands Ecological Field. Breathtaking in all seasons, its cherry blossom avenues in spring and golden ginkgo forests in autumn make it a must-visit destination for photography enthusiasts and a frequent filming location for K-POP music videos.", "name": "Seoul Forest Park", "transport": "Approx. 2-minute walk from Exit 3 of Seoul Forest Station (Suin-Bundang Line)"}, {"address": "82 Seongsui-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 Stars | An immersive concept showroom by Korean streetwear brand ADER Error, seamlessly blending outer space themes, sci-fi installations, and avant-garde art. Every corner feels like a modern art gallery, featuring surreal setups like a giant meteorite pool and a spaceship cockpit, attracting countless streetwear fans to explore and snap photos.", "name": "ADER Space 2.0 Seongsu Flagship Store", "transport": "Approx. 4-minute walk from Exit 3 of Seongsu Station (Line 2)"}, {"address": "78 Seongsui-ro, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 Stars | Preserving its original 1970s red-brick and timber structure from a rice mill and ironworks, this site has been successfully transformed into a spacious complex combining an art gallery, cafe, and dining area. Soaring skylights let in natural sunlight, perfectly complemented by impressive large-scale wooden art installations to reflect Seongsu-dong\u0027s signature blend of industrial retro vibe and modern art.", "name": "Daelim Changgo Gallery COCOLUMN", "transport": "Approx. 5-minute walk from Exit 3 of Seongsu Station (Line 2)"}, {"address": "14 Seongsui-ro 10-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.3 Stars | Converted from a former shoe factory, this four-story minimalist grey concrete building houses curated lifestyle shops, independent designer brands, a stylish cafe, and a rooftop bar. Featuring a geometrically stunning atrium skylight and sleek architectural lines, it is a highly popular photo spot for hipsters and minimalist enthusiasts.", "name": "LCDC SEOUL Cultural Complex", "transport": "Approx. 7-minute walk from Exit 2 of Seongsu Station (Line 2)"}, {"address": "26 Seongsui-ro 7-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.2 Stars | An avant-garde dessert brand under the trendy eyewear label Gentle Monster, designed around the concept of a \u0027Museum of Everyday Objects\u0027. A long central table displays surrealist, art-like desserts. Highlights include their signature black matcha volcano cake and futuristic decor that make taking photos irresistible.", "name": "Nudake Seongsu Flagship Store", "transport": "Approx. 5-minute walk from Exit 4 of Seongsu Station (Line 2)"}, {"address": "7 Achasan-ro 11-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.5 Stars | An experiential flagship store by beauty giant Amorepacific, transformed from a former auto repair shop. Retaining a raw industrial aesthetic, it features a lush courtyard garden, dedicated cleansing areas, and thousands of products from dozens of brands to try for free\u2014making it an aesthetic paradise for skincare and beauty lovers.", "name": "Amore Seongsu", "transport": "Approx. 3-minute walk from Exit 2 of Seongsu Station (Line 2)"}, {"address": "9 Yeonmujang 3-gil, Seongdong-gu, Seoul", "feature": "\u2b50 4.4 Stars | A multi-concept lifestyle space focused on American car customization culture, featuring iconic pink accent walls, customized sports car displays, trendy apparel shops, and the famous donut shop Knotted. Bold colors and street-punk aesthetics collide to make this one of Seongsu-dong\u0027s most distinct trendsetting photo spots.", "name": "Peaches D8NE Streetwear \u0026 Automotive Culture Space", "transport": "Approx.         const cityName = "Seoul";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
