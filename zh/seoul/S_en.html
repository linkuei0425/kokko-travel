    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 Stars | The largest and oldest main palace of the Joseon Dynasty. The Gwanghwamun Royal Guard Changing Ceremony takes place daily at set times, and visitors wearing Hanbok can enter for free to experience traditional Korean history and culture.", "duration": "2-3 hours", "title": "Gyeongbokgung Palace", "transport": "About a 5-minute walk from Exit 5 of Gyeongbokgung Station (Subway Line 3)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 Stars | A UNESCO World Heritage Site and the most remarkably preserved Joseon palace. Its Secret Garden features stunning landscapes across all four seasons, especially renowned for its fiery autumn foliage and golden ginkgo trees.", "duration": "2-3 hours", "title": "Changdeokgung Palace and Secret Garden", "transport": "About a 5-minute walk from Exit 3 of Anguk Station (Subway Line 3)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 Stars | Preserving a traditional cluster of Joseon-era Hanok houses, a stroll here offers views of the Seoul skyline where modern cityscapes intertw with historic architecture, immersing you in a rich Korean cultural atmosphere.", "duration": "1-2 hours", "title": "Bukchon Hanok Village", "transport": "About a 10-minute walk from Exit 2 of Anguk Station (Subway Line 3)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 Stars | Seoul\u0027s most iconic landmark perched atop Namsan Mountain. It offers breathtaking panoramic night views of the entire cityscape, along with romantic love lock walls and an observation deck.", "duration": "2-3 hours", "title": "N Seoul Tower", "transport": "About 15 minutes via Namsan Cable Car from Exit 3 of Myeongdong Station (Subway Line 4)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 Stars | Home to \"Adventure\", the world\u0027s largest indoor theme park, and the outdoor \"Magic Island\". Featuring thrilling rides and vibrant parades, it is perfect for families and couples alike.", "duration": "4-6 hours", "title": "Lotte World", "transport": "Directly connected to Exit 4 of Jamsil Station (Subway Line 2 or Line 8)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 Stars | An ultra-modern, futuristic architectural landmark designed by renowned architect Zaha Hadid. It serves as the epicenter of Seoul\u0027s fashion and design scene, frequently hosting international exhibitions and creative markets.", "duration": "1-2 hours", "title": "Dongdaemun Design Plaza (DDP)", "transport": "Directly connected to Exit 1 of Dongdaemun History \u0026 Culture Park Station (Subway Line 2, 4, or 5)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 Stars | The cathedral church of the Catholic Archdiocese of Seoul and Korea\u0027s first Gothic edifice. Grand on the outside and serene within, it stands as a peaceful spiritual sanctuary amidst the bustling downtown.", "duration": "1 hour", "title": "Myeongdong Cathedral", "transport": "About an 8-minute walk from Exit 8 of Myeongdong Station (Subway Line 4)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 Stars | The only palace featuring a harmonious mix of traditional Korean Hanok architecture and modern Western-style stone buildings. The stone-wall path outside is celebrated as one of \"Korea\u0027s most beautiful paths\", offering a deeply romantic setting blanketed with golden ginkgo leaves in autumn.", "duration": "1-2 hours", "title": "Deoksugung Palace", "transport": "About a 1-minute walk from Exit 12 of City Hall Station (Subway Line 1 or 2)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 Stars | South Korea\u0027s premier museum, displaying hundreds of thousands of precious historical artifacts and artworks from the Paleolithic Age to modern times. Features grand architecture surrounded by picturesque park grounds.", "duration": "3-4 hours", "title": "National Museum of Korea", "transport": "Directly connected to Exit 2 of Ichon Station (Subway Line 4 or Gyeongui-Jungang Line)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.2 Stars | A charming neighborhood steeped in traditional Korean culture, brimming with antique shops, art galleries, traditional teahouses, and the famous creative cultural complex \"Ssamziegil\".", "duration": "2-3 hours", "title": "Insa-dong", "transport": "About a 3-minute walk from Exit 6 of Anguk Station (Subway Line 3)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 Stars | A trendy area where century-old traditional Hanoks have been reimagined into stylish cafes, artisan shops, and unique eateries. Its charming blend of old-world soul and modern vibe attracts countless visitors.", "duration": "2-3 hours", "title": "Ikseon-dong Hanok Village", "transport": "About a 2-minute walk from Exit 4 of Jongno 3-ga Station (Subway Line 1, 3, or 5)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 Stars | One of the world\u0027s largest war-themed memorial museums, documenting the Korean War and Korean military history. The expansive outdoor park exhibits real military aircraft, tanks, and artillery.", "duration": "2-3 hours", "title": "War Memorial of Korea", "transport": "About a 5-minute walk from Exit 12 of Samgakji Station (Subway Line 4 or 6)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 Stars | A thousand-year-old Buddhist sanctuary located in the heart of modern Gangnam. Housing a magnificent 23-meter-tall Maitreya Buddha statue, it offers a serene, meditative sanctuary and temple stay experiences away from the city noise.", "duration": "1-2 hours", "title": "Bongeunsa Temple", "transport": "About a 2-minute walk from Exit 1 of Bongeunsa Station (Subway Line 9)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 Stars | Housed in a former Supreme Court building featuring a preserved red-brick Western facade. It offers free entry to diverse contemporary art exhibitions and permanently showcases renowned works by Korean artist Chun Kyung-ja.", "duration": "1-2 hours", "title": "Seoul Museum of Art", "transport": "About a 5-minute walk from Exit 10 of City Hall Station (Subway Line 1 or 2)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 Stars | A captivating museum showcasing traditional Korean lifestyles, folk beliefs, and daily customs from ancient eras to modern times. The outdoor grounds faithfully recreate 20th-century Korean streetscapes.", "duration": "1-2 hours", "title": "National Folk Museum of Korea", "transport": "About a 10-minute walk from Exit 5 of Gyeongbokgung Station (Subway Line 3)"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | A secondary palace of the Joseon Dynasty featuring Korea\u0027s first Western-style Grand Greenhouse. It offers a tranquil and pleasant atmosphere, vibrant seasonal scenery, and a unique charm during special night openings.", "duration": "1-2 hours", "title": "Changgyeonggung Palace", "transport": "About a 15-minute walk from Exit 4 of Hyehwa Station on Subway Line 4"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Originally a prison built during the Japanese colonial era, this venue has been converted into a memorial hall showcasing the history of Korea\u0027s modern independence movement and human rights values, offering deep historical and educational significance.", "duration": "1-2 hours", "title": "Seodaemun Prison History Hall", "transport": "About a 3-minute walk from Exit 5 of Dongnimmun Station on Subway Line 3"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A UNESCO World Heritage site, this Confucian royal shrine houses the spirit tablets of Joseon Dynasty kings and queens. Its royal ancestral rituals and ceremonial music are beautifully preserved.", "duration": "1-2 hours", "title": "Jongmyo Shrine", "transport": "About a 5-minute walk from Exit 11 of Jongno 3-ga Station on Subway Lines 1, 3, or 5"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | Korea\u0027s first public craft art museum, repurposed from an old school complex. It exhibits works ranging from traditional embroidery, ceramics, and woodworking to contemporary craft art, brimming with design inspiration.", "duration": "1-2 hours", "title": "Seoul Museum of Craft Art", "transport": "About a 1-minute walk from Exit 1 of Anguk Station on Subway Line 3"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | A park built along the ancient Seoul City Wall offering panoramic city and night views. The neighboring Ihwa Village is filled with colorful murals and charming shops, making it a great spot for strolls and photos.", "duration": "2-3 hours", "title": "Naksan Park \u0026 Ihwa Mural Village", "transport": "About a 15-minute walk from Exit 2 of Hyehwa Station on Subway Line 4"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 stars | A quaint palace rich in history, featuring Korea\u0027s early Western-style greenhouse botanical garden. Autumn foliage here is particularly breathtaking.", "duration": "1-2 hours", "title": "Changgyeonggung Palace", "transport": "About a 15-minute walk from Exit 3 of Hyehwa Station on Subway Line 4"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 5 stars | A UNESCO World Herita         let myTrip = { 1: [] };

        // Toggle Mobile Cart Drawer
        function toggleMobileCart() {
            if (cartDrawer.classList.contains('drawer-closed')) {
                cartDrawer.classList.remove('drawer-closed');

                mobileOverlay.classList.remove('hidden');

                cartDrawer.classList.remove('drawer-open');
                cartDrawer.classList.add('drawer-closed');
                mobileOverlay.classList.add('hidden');
            }

        // Smart Route Sorting Algorithm
        function autoSortDay(day) {
            let trips = myTrip[day];
            if(trips.length < 2) {
                alert("Need at least 2 activities to sort!");
                return;
            }
            
            trips.sort((a, b) => {
                let nodeA = (a.transport || "").substring(0, 6);
                let nodeB = (b.transport || "").substring(0, 6);
                
                if (nodeA < nodeB) return -1;
                if (nodeA > nodeB) return 1;
                return 0;
            });
            
            alert(`✨ Day ${day}'s itinerary has been smartly optimized based on transit nodes!`);
            renderCart();
        }

        function scrollFilters(direction) {
            const container = document.getElementById('filter-bar');
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

                tabSchedule.className = "flex-1 py-3.5 md:py-4 tab-active transition-colors flex justify-center items-center gap-2 text-sm md:text-base";
                tabIntercity.className = "flex-1 py-3.5 md:py-4 tab-inactive transition-colors flex justify-center items-center gap-2 text-sm md:text-base border-l border-slate-50";

        function filterCategory(category) {
            currentFilter = category;
            ['All', '🏛️ Attractions', '🛍️ Shopping', '🍜 Dining', ...dynamicCats].forEach(cat => {
                const btn = document.getElementById(`cat-${cat}`);
                if(btn) {
                    if(cat === category) {
                        btn.className = "filter-btn-active text-xs md:text-sm px-4 py-2 rounded-full border font-bold whitespace-nowrap transition-colors shadow-sm";
                    } else {
                        btn.className = "filter-btn-inactive text-xs md:text-sm px-4 py-2 rounded-full border font-medium whitespace-nowrap transition-colors shadow-sm";
                    }
                }
            });
            renderPool();
        }

        function renderPool() {
            poolContainer.innerHTML = '';
            let data = activeTab === 'schedule' ? schedulePool : intercityPool;
            
            if(activeTab === 'schedule' && currentFilter !== 'All') {
                data = data.filter(item => {
                    const cat = item.category || '';
                    const title = item.title || '';
                    const desc = item.description || '';
                    const fullText = (cat + ' ' + title + ' ' + desc).toLowerCase();
                    const filterLower = currentFilter.toLowerCase();

                    if (filterLower.includes('attraction')) {
                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;
                    }
                    
                    return cat.toLowerCase().includes(filterLower);
                });
            }

            if(data.length === 0) {
                poolContainer.innerHTML = `<div class="text-center text-gray-400 py-10 font-medium md:text-lg">No data available for this category</div>`;
                return;
            }

            data.forEach((item, index) => {
                let title = activeTab === 'schedule' ? item.title : item.route;
                let category = activeTab === 'schedule' ? (item.category || 'Featured') : 'Intercity Transport';
                let duration = activeTab === 'schedule' ? item.duration : item.time;
                let transport = activeTab === 'schedule' ? item.transport : item.method;
                let desc = activeTab === 'schedule' ? item.description : 'Suitable for intercity or cross-border travel.';

                let catLower = category.toLowerCase();
                let badgeColor = "bg-slate-50 text-slate-600 border-slate-200";
                
                if(catLower.includes('attraction') || catLower.includes('culture') || catLower.includes('景點') || catLower.includes('文藝')) badgeColor = "bg-sky-50 text-sky-700 border-sky-200";
                if(catLower.includes('shopping') || catLower.includes('market') || catLower.includes('購物') || catLower.includes('商圈')) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(catLower.includes('dining') || catLower.includes('cafe') || catLower.includes('美食') || catLower.includes('名店')) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(dynamicCats.some(dynCat => catLower.includes(dynCat.toLowerCase()))) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";

                let searchKeyword = encodeURIComponent(`${cityName} ${title}`);
                let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>
                        <button onclick="addToTrip('${activeTab}', '${(item.title || item.route).replace(/'/g, "\\'")}')" class="shrink-0 bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white rounded-xl px-4 py-2 font-bold transition-colors border border-sky-100 text-sm shadow-sm">

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
