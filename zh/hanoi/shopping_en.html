 T-Shirts H\u00e0ng H\u00f2m)", "transport": "Located in the heart of the Old Quarter, about a 6-minute walk from the northern shore of Ho\u00e0n Ki\u1ebfm Lake."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Hoan Kiem Lake and the Old Quarter"}, "west_lake_tay_ho": {"categories": {"cat_1": {"items": [{"address": "18 Dang Thai Mai, Quang An, Tay Ho, Ha Noi", "feature": "\u2b50 4.8 stars | Must-Buy List: Rice Extract Fragrance-Free Lip Balm, Green Tea Anti-Acne Handmade Soap, Alpine Centella Asiatica Repairing Serum. C\u1ecf M\u1ec1m is one of Vietnam\u0027s most iconic homegrown botanical skincare brands, prioritizing non-toxic, chemical-free, safe formulations. This warm and cozy Tay Ho branch is a favorite among local women and expats who value natural and organic ingredients. The ultra-popular Rice Lip Balm uses locally sourced Vietnamese rice bran oil for a non-greasy, deeply moisturizing finish. The Centella serum works wonders for soothing skin problems caused by the hot and humid Southeast Asian climate.", "name": "C\u1ecf M\u1ec1m Homelab Tay Ho", "transport": "Take a Grab car or taxi to the intersection of Dang Thai Mai and To Ngoc Van streets; it is about a 2-minute walk from there."}, {"address": "159 Xuan Dieu, Quang An, Tay Ho, Ha Noi", "feature": "\u2b50 4.6 stars | Must-Buy List: \u0110\u1eafk L\u1eafk Coffee Body Scrub, Cao B\u1eb1ng Turmeric Brightening Cleanser, Vietnamese Pomelo Hair Nourishing Spray. Sammi Shop is a famous cosmetic chain in Hanoi, and its Tay Ho branch features a dedicated showcase zone for Cocoon\u2014Vietnam\u0027s premier 100% vegan beauty brand. Cocoon insists on using local Vietnamese agricultural ingredients such as Cao B\u1eb1ng turmeric, \u0110\u1eafk L\u1eafk coffee, and Ti\u1ec1n Giang pomelo. The coffee body scrub infuses a rich Vietnamese coffee scent with gentle exfoliation and botanical oils, while the pomelo scalp spray is a top recommendation among locals for anti-hair loss.", "name": "Sammi Shop Tay Ho - Cocoon Partner", "transport": "Take bus 31 or 55 to Xuan Dieu station, then walk for about 3 minutes; or take a Grab directly to 159 Xuan Dieu."}, {"address": "31 To Ngoc Van, Quang An, Tay Ho, Ha Noi", "feature": "\u2b50 4.7 stars | Must-Buy List: Vietnamese Wild Ginger Rollerball Perfume Oil, Bamboo Charcoal Deep Cleansing Handmade Soap, Rose Hydrating Botanical Hydrosol. NauNau is an independent local indie beauty and fragrance brand founded by a veteran Vietnamese perfumer, tucked away in an artistic alley in Tay Ho. The brand specializes in transforming unique Vietnamese flora into premium skincare and scents. The studio has a deeply relaxing vibe, and all products feature exquisite, recyclable packaging. The wild ginger rollerball oil exudes an elegant, uniquely Southeast Asian floral scent, making it a sophisticated local souvenir.", "name": "NauNau Studio Tay Ho", "transport": "Take a Grab taxi to 31 To Ngoc Van Street; it is only a 5-minute walk to the West Lake waterfront."}, {"address": "68 Tu Hoa, Quang An, Tay Ho, Ha Noi", "feature": "\u2b50 4.5 stars | Must-Buy List: Vietnamese Reishi Anti-Aging Repair Cream, Centella Soothing Toner, Bitter Melon Refreshing Anti-Acne Mask. Skinna is a high-end local beauty brand combining traditional Vietnamese herbal wisdom with modern dermatological science. The Tay Ho concept store offers professional skin analysis, and all products are tailored for tropical climate skin needs. The bitter melon and centella series are highly recommended for calming sun-exposed skin and balancing oil production. Its light, breathable textures are hugely popular with Western expats and local professionals living in Hanoi.", "name": "Skinna Organic Skincare Tay Ho", "transport": "Drive along Tu Hoa Street on the West Lake ring road and take a Grab to 68 Tu Hoa, located near the Tran Quoc Pagoda area."}, {"address": "1 Dang Thai Mai, Quang An, Tay Ho, Ha Noi", "feature": "\u2b50 4.9 stars | Must-Buy List: B\u1ebfn Tre Extra Virgin Coconut Oil Conditioner, Natural Beeswax Hydrating Lip Balm, Bamboo Charcoal Herbal Shampoo Bar. Betterday is Tay Ho\u0027s favorite zero-waste, organic green beauty boutique, curating high-quality natural skincare and handmade cosmetics from across Vietnam. The store is plastic-free and offers bulk refill options, reflecting a strong eco-friendly ethos. Must-buys include pure coconut oil products from B\u1ebfn Tre province, which are chemical-free, pure in texture, and incredible for repairing damaged hair ends and dry skin\u2014a top choice for guilt-free self-care.", "name": "Betterday Organic \u0026 Natural Skincare", "transport": "Located at the head of Dang Thai Mai Street, about a 2-minute walk from Tay Ho Center. Search \u0027Betterday Tay Ho\u0027 on Grab to arrive."}, {"address": "246 Xuan Dieu, Quang An, Tay Ho, Ha Noi", "feature": "\u2b50 4.6 stars | Must-Buy List: Lemonade Dual-Ended Matte Long-Wear Lip Tint, Emmi\u00e9 by Happy Skin Botanical Resurfacing Serum, Vietnamese Clay Mask Hydrating Set. Hasaki is a massive beauty and pharmacy chain in Vietnam. Its Tay Ho flagship is grand and spacious, featuring international cosmetics alongside a huge \u0027Emerging Vietnamese Local Beauty\u0027 zone. Highlights include Lemonade, a brand created by a famous Vietnamese makeup artist with shades tailored for Southeast Asian skin tones and long-lasting lip tints; Emmi\u00e9\u0027s serum is also a locally acclaimed anti-acne hero offering premium quality at budget-friendly prices.", "name": "Hasaki Beauty \u0026 Clinic Tay Ho", "transport": "Located on the main artery of Xuan Dieu. Take bus 31, 41, or 55 to Xuan Dieu station, or take a Grab directly to #246."}, {"address": "110 Xuan Dieu, Quang An, Tay Ho, Ha Noi", "feature": "\u2b50 4.7 stars | Must-Buy List: Of The Sun Original Milk Tea Shade Lipstick, Cocoon Coconut Hydrating Lip Mask, Carenology Blue Tansy Soothing Facial Oil. Renowned for its dreamlike pink decor, the Sociolla Tay Ho flagship is a shopping haven for trendy locals and expats in the West Lake area. Aside from top-rated Asian and international pharmacy cosmetics, it exclusively stocks many rising Vietnamese indie designer brands. The must-buy Of The Sun lipsticks glide on like velvet in flattering shades designed for Asian complexions. Professional beauty consultants and makeup trial stations are available on-site.", "name": "Sociolla Xuan Dieu Flagship", "transport": "Take a Grab vehicle to 110 Xuan Dieu Street, conveniently located in the center of Tay Ho\u0027s upscale commercial district."}, {"address": "88 Xuan Dieu, Quang An, Tay Ho, Ha Noi", "feature": "\u2b50 4.4 stars | Must-Buy List: Golden Star Balm Upgraded Ointment, Sao Thai Duong Herbal Hair Care Shampoo, Centella Asiatica Herbal Anti-Itch Ointment. Pharmacity is Vietnam\u0027s leading pharmacy network, and its Tay Ho flagship is stocked with an extensive selection of traditional pharmacy remedies and herbal supplements. It is the best spot for savvy tourists to pick up legendary local herbal care items, such as Sao Thai Duong natural anti-hair loss shampoo, and herbal soothing ointments with eucalyptus oil and centella extract for insect bites.", "name": "Pharmacity Xuan Dieu Store", "transport": "Located near the intersection of Xuan Dieu and Au Co streets; take a Grab car or bike directly to the entrance."}], "name": "Iconic Local Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "9 Lane 31 Xuan Dieu, Quang An, Tay Ho, Hanoi", "feature": "\u2b50 4.8 stars | Must-Buy List: Naturally indigo-dyed plant-fiber tops, hand-woven hemp tailored wide-leg trousers, hand-embroidered designer shawls. Kilomet109 is a premier sustainable fashion brand founded by renowned Vietnamese designer Thao Vu, combining traditional ethnic minority textile techniques with modern avant-garde tailoring. The shop collaborates directly with indigenous women in the northern mountains, using all-natural dyes like indigo and maple sap alongside organic raw silk and kapok fibers. Every garment here is a unique piece of art, highly favored by West Lake expats and independent fashion lovers.", "name": "Kilomet109 Sustainable Eco-Designer Apparel (Kilomet109)", "transport": "Take a Grab taxi to Xuan Dieu Road; it is about a 2-minute walk from the entrance of the alley."}, {"address": "14 Dang Thai Mai, Quang An, Tay Ho, Hanoi", "feature": "\u2b50 4.5 stars | Must-Buy List: Printed vintage dresses, hand-woven ethnic style tote bags, handmade vintage earrings. Tucked in an alley of Tay Ho\u0027s upscale residential area, Ch\u0103n Con C\u00f4ng takes its name from the traditional Vietnamese peacock duvet motif. It is an iconic vintage and independent fashion boutique in Hanoi. Filled with a rich bohemian vibe and nostalgic atmosphere, the shop curates vintage clothing as well as bags and accessories from young local designers. Local hipsters and expats love to treasure-hunt here for personalized printed clothes and handcrafted bags.", "name": "Ch\u0103n Con C\u00f4ng Vintage \u0026 Independent Design Store (Ch\u0103n Con C\u00f4ng - Vintage Store)", "transport": "Take Bus 31 or 41 to Dang Thai Mai Station, then walk for about 3 minutes."}, {"address": "101 Xuan Dieu, Quang An, Tay Ho, Hanoi", "feature": "\u2b50 4.7 stars | Must-Buy List: Hanoi street culture illustrated T-shirts, Vietnamese illustration heavy canvas tote bags, Vietnamese mythology postcard-style sticker packs. TiredCity is Vietnam\u0027s most successful collaborative brand for emerging local artists, dedicated to turning works by local illustrators into high-quality wearable items. The Tay Ho branch boasts a modern design feel, showcasing trendy T-shirts and durable canvas bags inspired by Hanoi\u0027s motorbikes, Vietnamese coffee, and folklore mythology. Made with premium pure cotton and finely printed patterns, it is the top choice for souvenirs that blend local culture with fashion.", "name": "TiredCity Tay Ho Creative Apparel \u0026 Canvas Bag Specialty Store (TiredCity Tay Ho)", "transport": "Take Bus 31, 41, or 55 to Xuan Dieu Station, then walk for about 1 minute."}, {"address": "33 To Ngoc Van, Quang An, Tay Ho, Hanoi", "feature": "\u2b50 4.6 stars | Must-Buy List: All-natural indigo-dyed handmade scarves, Sapa Black Hmong motif handbags, plant-dyed coin purses. Located in the exotic To Ngoc Van neighborhood of Tay Ho, Indigo Store is run by a local team dedicated to preserving Vietnam\u0027s ethnic minority crafts. All apparel, bags, and accessories in the shop are crafted using hand-woven fabrics and natural indigo dyeing techniques from ethnic groups in Sapa and Cao Bang. The clothing features a minimal, natural ethnic style, while the bags blend traditional embroidery with durable fabrics\u2014exuding quality and warmth, loved by eco-conscious and quality-seeking shoppers.", "name": "Indigo Store Handwoven Textiles \u0026 Accessories (Indigo Store)", "transport": "Take a Grab taxi to To Ngoc Van Street, heading towards West Lake Park."}, {"address": "110 Xuan Dieu, Quang An, Tay Ho, Hanoi", "feature": "\u2b50 4.4 stars | Must-Buy List: Vintage modern Cheongsam-style dresses, French elegant chiffon shirts, minimalist genuine leather handbags. Magonn Design is a highly successful Vietnamese womenswear designer brand, blending Eastern nostalgia with French chic tailoring. The Tay Ho branch offers dresses, silk tops, and leather bags suitable for both daily wear and formal occasions. The brand excels at using lightweight premium Vietnamese fabrics to craft flattering feminine silhouettes. Both local socialites and female expats in Hanoi love shopping here for elegant wardrobe staples.", "name": "Magonn Design Vintage \u0026 Elegant Women\u0027s Wear (Magonn Design - Xuan Dieu)", "transport": "Take Bus 31 or 41 and get off at the Xuan Dieu section; the shop is right there."}, {"address": "44 Xuan Dieu, Quang An, Tay Ho, Hanoi", "feature": "\u2b50 4.5 stars | Must-Buy List: Organic cotton Hanoi landmark illustrated T-shirts, casual canvas backpacks, waterproof totes. Ginkgo is a renowned original local casual fashion brand in Vietnam, famous for using organic cotton and eco-friendly manufacturing processes. Located on Xuan Dieu Boulevard, this spacious store offers high-quality casual wear, canvas bags, and outdoor accessories for men, women, and kids. The core designs revolve around Vietnamese cultural symbols like Ha Long Bay, cyclo rickshaws, and Pho, with ultra-breathable fabrics perfect for Hanoi\u0027s warm weather.", "name": "Ginkgo T-Shirts Organic Cotton Apparel \u0026 Canvas Bags (Ginkgo T-Shirts - Xuan Dieu)", "transport": "Take Bus 31, 41, or 55A to Xuan Dieu Station; short walking distance upon arrival."}, {"address": "5 Dang Thai Mai, Quang An, Tay Ho, Hanoi", "feature": "\u2b50 4.6 stars | Must-Buy List: Hand-beaded party evening bags, vibrant color-blocked leather handbags, sequined handmade geometric pouches. Founded in Hanoi, Ipa-Nima is an internationally acclaimed handcrafted bag brand celebrated for its bold color schemes, intricate hand-beading, and unique structural designs. Deeply rooted in Hanoi for years, the designer skillfully infuses traditional Vietnamese embroidery into Western fashion luxury bags. The showroom near Tay Ho displays the latest seasonal limited-edition bags and accessories. Each handbag resembles a fine piece of art, attracting endless fashion enthusiasts.", "name": "Ipa-Nima Colorful Handcrafted Designer Bags \u0026 Accessories (Ipa-Nima)", "transport": "Take a Grab taxi to the intersection of Dang Thai Mai and Xuan Dieu streets."}, {"address": "10 Lane 432 Au Co, Nhat Tan, Tay Ho, Hanoi", "feature": "\u2b50 4.9 stars | Must-Buy List: Z\u00f3 bark paper woven crossbody bags, handmade paper-dyed fashion earrings, plant-dyed fiber pouches. Z\u00f3 Project is a social enterprise dedicated to reviving Vietnam\u0027s thousand-year-old traditional \u0027Z\u00f3 paper\u0027 (bark paper) craft. In their Tay Ho studio, the founder combines this durable, water-resistant handmade paper with traditional textiles to create stunning paper-woven backpacks, lightweight pouches, and unique accessories. Every item is entirely handmade, featuring unique natural textures and earthy tones\u2014making it a perfect fashion pick blending eco-friendliness with exquisite craft.", "name": "Z\u00f3 Project Handmade Bark Paper Creative Apparel \u0026 Accessories Studio (Z\u00f3 Project - Tay Ho Studio)", "transport": "Take Bus 31, 55A, or 55B to Au Co Station, enter Alley 432, and walk for about 3 minutes."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "64 Xu\u00e2n Di\u1ec7u, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-buy list: Vietnamese single-origin dark chocolate bars, rich cocoa tea bags, handcrafted passion fruit cocoa truffles. Praised by The New York Times as the \u0027best artisanal chocolate,\u0027 this local Vietnamese luxury brand boasts a store by West Lake with a stylish modern hipster aesthetic. Perfectly combining high-quality cocoa beans from the Mekong Delta with exquisite French craftsmanship, its elegant packaging makes it the most popular premium gift for friends and family.", "name": "Maison Marou Premium Artisanal Chocolate (Maison Marou Tay Ho)", "transport": "Take a Grab or taxi to Xu\u00e2n Di\u1ec7u Street; located in the popular expat district on the eastern shore of West Lake."}, {"address": "135 Nguy\u1ec5n \u0110\u00ecnh Thi, Th\u1ee5y Khu\u00ea, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-buy list: Hand-scented West Lake lotus green tea, premium lotus plumule tea, dried handcrafted lotus tea gift set. The most famous traditional specialty of West Lake (Tay Ho) is authentic lotus tea. Using hundred-petal lotuses unique to West Lake and high-quality Thai Nguyen green tea, it is meticulously handcrafted through multiple scents using over a thousand lotus flowers. The tea liquor is sweet, refreshing, and infused with an elegant lotus aroma, making it a state-banquet-level gift representing Hanoi\u0027s heritage.", "name": "Minh Cuong Authentic West Lake Lotus Tea (Tr\u00e0 Sen T\u00e2y H\u1ed3 Minh C\u01b0\u1eddng)", "transport": "Take bus 45 or 144 to Th\u1ee5y Khu\u00ea stop, then walk about 3 minutes to reach the lakeside shop."}, {"address": "58 Xu\u00e2n La, Xu\u00e2n La, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-buy list: Ginger sweet and sour preserved apricot, dried kumquats, spicy dried almond fruits. \u00d4 Mai (preserved salted/sweetened fruits) is Hanoi\u0027s most iconic and historic traditional snack, and Hong Lam is Vietnam\u0027s most renowned heritage brand. The shop offers dozens of sweet and sour preserved fruits and dried fruits made from local produce, hygienically sealed in beautifully designed packaging\u2014a favorite among both locals and tourists.", "name": "Hong Lam Preserved Fruits Tay Ho (\u00d4 Mai H\u1ed3ng Lam Xu\u00e2n La)", "transport": "Take bus 33 or 68 to Xu\u00e2n La stop, then walk about 2 minutes."}, {"address": "Basement 1, Lotte Mall West Lake, 272 V\u00f5 Ch\u00ed C\u00f4ng, Ph\u00fa Th\u01b0\u01a1ng, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-buy list: Vietnamese highland lily tea, low-temperature baked dried bananas, passion fruit concentrate juice. A premium specialty agricultural brand from Da Lat\u2014Vietnam\u0027s highland city of flowers\u2014with a chic counter inside the landmark Lotte Mall West Lake. Highlighting natural, additive-free baked dried fruits, herbal teas, and nuts in warm wooden-toned packaging, it is an excellent spot to pick up healthy snacks and unique gifts.", "name": "L\u0027angfarm Da Lat Specialties (L\u0027angfarm Lotte Mall West Lake)", "transport": "Take bus 25, 90, or 96 to Lotte Mall West Lake stop for direct access to the shopping center."}, {"address": "56 T\u00f4 Ng\u1ecdc V\u00e2n, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-buy list: Jasmine Oolong tea, West Lake premium lotus tea, traditional highland green tea. Huong Mai Tea is one of Hanoi\u0027s most iconic traditional tea houses, featuring a modern flagship store in West Lake\u0027s upscale commercial district. Adhering to traditional artisanal roasting methods, their tea leaves yield a rich, lasting aroma. They also offer exquisite woven bamboo and lacquerware tea gift boxes infused with Oriental charm and refinement.", "name": "Huong Mai Tea Xuan Dieu Branch (H\u01b0\u01a1ng Mai Tea Xu\u00e2n Di\u1ec7u)", "transport": "Take a Grab to T\u00f4 Ng\u1ecdc V\u00e2n Street; located in an upscale residential area filled with charming boutique shops on the eastern shore of West Lake."}, {"address": "1F, Syrena Shopping Center, 51 Xu\u00e2n Di\u1ec7u, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Must-buy list: Phu Quoc hand-picked peppercorns, Marou co-branded cocoa powder, premium Vietnamese skin-on cashews. Located inside Syrena Shopping Center, this high-end grocery store is favored by foreign diplomats and expats in the West Lake area. It brings together Vietnam\u0027s finest specialty agricultural products, specialty coffee beans, artisanal jams, and gourmet seasonings under strict quality control and elegant packaging.", "name": "Annam Gourmet Market Syrena", "transport": "Take bus 31 or 55A to Xu\u00e2n Di\u1ec7u stop, then walk about 1 minute."}, {"address": "114 Xu\u00e2n Di\u1ec7u, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-buy list: Cold-pressed coconut oil soft candies, organic roasted red bean snacks, Vietnamese highland wild honey. Tucked away in a hip alley near West Lake, this independent organic grocery shop emphasizes local small-farm partnerships and sustainable production. It carries many unique local organic snacks, natural dried fruits, and healthy teas not found in standard supermarkets, radiating a trendy hipster vibe and strong local character.", "name": "Betterday Organic Shop", "transport": "Take a Grab to the intersection of Xu\u00e2n Di\u1ec7u and \u0110\u1eb7ng Thai Mai, then walk just a few steps."}, {"address": "254 Th\u1ee5y Khu\u00ea, Th\u1ee5y Khu\u00ea, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Must-buy list: Authentic green bean paste filled green rice cake, stir-fried young rice with fragrant coconut flakes, traditional roasted sticky rice cake. C\u1ed1m (young green rice flakes) is Hanoi\u0027s most iconic seasonal traditional delicacy, and Nguyen Ninh is a decades-old heritage brand. Featuring a vibrant green, chewy outer crust and a pleasantly sweet mung bean filling subtly infused with banana leaf aroma, this is a must-try classic treat to experience Hanoi\u0027s traditional food culture.", "name": "Nguyen Ninh Traditional Young Green Rice Cake Tay Ho (B\u00e1nh C\u1ed1m Nguy\u00ean Ninh Th\u1ee5y Khu\u00ea)", "transport": "Take bus 45 or 144 to any stop along Th\u1ee5y Khu\u00ea, then walk about 2 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "277 \u0110. L\u1ea1c Long Qu\u00e2n, Ph\u00fa Th\u01b0\u1ee3ng, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-Buy List: Marou artisanal chocolates, L\u0027Apog\u00e9e Vietnamese scented candles, Vietblend specialty coffee beans. A brand-new landmark mega shopping complex located on the shores of West Lake, combining luxury shopping, a cinema, an aquarium, and a top-tier food court. The mall features pop-up stores from high-end local Vietnamese designer brands and exquisite souvenir counters. Its bright, spacious, and modern design allows tourists to shop contemporary Vietnamese luxury and major international brands all in one stop, making it West Lake\u0027s premier shopping paradise.", "name": "Lotte Mall West Lake Hanoi", "transport": "Take a Grab taxi to the intersection of L\u1ea1c Long Qu\u00e2n Road and V\u00f5 Ch\u00ed C\u00f4ng Road."}, {"address": "99 \u0110. V\u00f5 Ch\u00ed C\u00f4ng, Xu\u00e2n La, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic Nike running shoes, Adidas track jackets, Mango end-of-season discount dresses. A popular outlet store located around West Lake, perfect for bargain hunting for off-season designer goods. Offering year-round discounts from 30% to 70% off, it\u0027s highly recommended for purchasing apparel and sneakers from famous international brands like Nike, Adidas, Puma, and Mango at attractive local prices. With a wide selection and guaranteed quality, it is loved by local youth and expats alike.", "name": "Tay Ho Factory Outlet", "transport": "Take a Grab taxi heading north along V\u00f5 Ch\u00ed C\u00f4ng Boulevard for about 5 minutes."}, {"address": "51 Xu\u00e2n Di\u1ec7u, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Must-Buy List: Annam Gourmet Vietnamese cashews and dried tropical fruits, Marou green tea chocolate, local artisanal handmade soaps. Located in the heart of the expat enclave on Xu\u00e2n Di\u1ec7u, this shopping center offers a cozy yet refined lifestyle experience. Housing a premium import supermarket and unique clothing boutiques, it is a great spot to pick up high-quality Vietnamese specialties, exquisite organic dried fruits, and upscale daily necessities.", "name": "Syrena Shopping Center", "transport": "Take a Grab taxi to 51 Xu\u00e2n Di\u1ec7u Street, located near the expat residential area on the eastern shore of West Lake."}, {"address": "71 Xu\u00e2n Di\u1ec7u, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-Buy List: Pure mulberry silk printed scarves, organic cotton printed shirts, handmade silk eye masks. An iconic high-end local designer brand in Vietnam specializing in 100% locally produced organic mulberry silk and organic cotton fabrics. Its designs blend Vietnamese tropical flora with traditional motifs, featuring elegant colors and incredible textures. Each garment is a unique creation reminiscent of fine art, making it a favorite among fashion-conscious and eco-friendly travelers.", "name": "Metiseko Tay Ho", "transport": "Walk about 3 minutes from Syrena Shopping Center to reach 71 Xu\u00e2n Di\u1ec7u Street."}, {"address": "49 Xu\u00e2n Di\u1ec7u, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Sapa indigo-dyed embroidered bags, handcrafted handwoven linen cushion covers, tribal botanical-dyed scarves. An independent local brand dedicated to preserving and promoting traditional handicrafts of ethnic minorities in Northwestern Vietnam. All products are handmade by women from Hmong, Thai, and other ethnic minority communities using natural plant dyes and traditional looms. Featuring intricate craftsmanship and deep cultural heritage, this is the perfect place to support local culture and pick up unique souvenirs.", "name": "Chie Crafts Tay Ho", "transport": "Take Bus No. 31 to Xu\u00e2n Di\u1ec7u station, then walk about 2 minutes."}, {"address": "58 \u0110\u1eb7ng Thai Mai, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: Breezy linen crop tops, tailored high-waisted trousers, sleek minimalist dresses. A flagship independent local brand for young women\u0027s fashion in Hanoi, celebrated for its clean minimalist cuts and natural, breathable linen and cotton blends. Designed specifically for Asian silhouettes, the style is fresh, elegant, and affordable, making it a must-visit local fashion spot when shopping in West Lake.", "name": "Naked by VB Tay Ho", "transport": "Take a Grab taxi to \u0110\u1eb7ng Thai Mai Street, located near the lakeside alleys."}, {"address": "114 Xu\u00e2n Di\u1ec7u, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Plastic-free natural bamboo toothbrushes, Vietnamese wild cold-pressed coconut oil, handmade essential oil mosquito repellent. A well-known sustainable lifestyle concept store in the West Lake area, curated with local Vietnamese organic foods, non-toxic household cleaning products, and handmade skincare items. Dedicated to promoting a plastic-free lifestyle, the store features a warm and natural atmosphere, making it a trendy shopping spot for natural Vietnamese skincare and eco-friendly handmade crafts.", "name": "Betterday Organic \u0026 Eco Store Tay Ho", "transport": "Take a Grab taxi to 114 Xu\u00e2n Di\u1ec7u Street."}, {"address": "67 Xu\u00e2n Di\u1ec7u, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-Buy List: Hanoi-themed illustrated T-shirts, Vietnamese street food canvas totes, mythical creature art postcards. One of Vietnam\u0027s top original creative lifestyle brands, collaborating with emerging local artists to turn traditional culture and street food into witty, modern graphic art. Products range from apparel to stationery and home decor, boasting excellent quality and exceptional souvenir value.", "name": "TiredCity Tay Ho", "transport": "Take a Grab taxi to 67 Xu\u00e2n Di\u1ec7u Street; surrounding boutique shops are easily accessible on foot."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "West Lake District and Taihu Upscale Commercial District"}};
        const cityName = "Hanoi";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
    <footer class="text-center py-8 text-gray-400 text-sm md:text-base px-4">
