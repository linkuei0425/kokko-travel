ght along T\u00f4n \u0110\u1ee9c Th\u1eafng Street."}, {"address": "193 Ch\u00f9a B\u1ed1c, Trung Li\u1ec7t, \u0110\u1ed1ng \u0110a, Hanoi", "feature": "\u2b50 4.2 stars | Must-Buy List: Tailored work dresses, lightweight printed chiffon blouses, Vietnamese-style high-waisted wide-leg trousers. GUMAC is a rapidly rising local Vietnamese women\u0027s fashion brand known for its high cost-performance ratio and sleek tailored fits designed for Asian proportions. Situated on Ch\u00f9a B\u1ed1c Street\u2014\u0110\u1ed1ng \u0110a\u0027s famous \u0027Fashion Street\u0027\u2014the store frequently hosts fantastic sales, making it the best spot to experience local office-chic fashion.", "name": "GUMAC Ch\u00f9a B\u1ed1c Womenswear", "transport": "Take bus 12, 18, 26, or 35A to Ch\u00f9a B\u1ed1c station."}, {"address": "29 \u00d4 Ch\u1ee3 D\u1eeba, Ch\u1ee3 D\u1eeba, \u0110\u1ed1ng \u0110a, Hanoi", "feature": "\u2b50 4.0 stars | Must-Buy List: Local brand leather shoes, nostalgic Vietnamese snack gift boxes, delicate embroidered tablecloths. Located next to a major roundabout in \u0110\u1ed1ng \u0110a District, OCD Commercial Center is a historic local shopping mall in Hanoi. Unlike modern international department stores, it features mostly local Vietnamese clothing boutiques, shoe stores, and lifestyle stalls, offering travelers a deep dive into the everyday shopping culture of Hanoi\u0027s residents.", "name": "OCD C\u00e1t Linh Commercial Center", "transport": "Take Hanoi Metro Line 2A to C\u00e1t Linh Station, then walk about 7 minutes."}, {"address": "02 Ch\u00f9a B\u1ed1c, Trung Li\u1ec7t, \u0110\u1ed1ng \u0110a, Hanoi", "feature": "\u2b50 4.3 stars | Must-Buy List: Business casual polo shirts, lightweight wrinkle-resistant blazers, Made-in-Vietnam stretch cropped trousers. Torano is a popular local menswear chain in Vietnam, known for its elegant, refined style and great texture tailored well for East Asian proportions. Its flagship store on Ch\u00f9a B\u1ed1c Street in \u0110\u1ed1ng \u0110a District features a bright, spacious layout with a complete product range. Offering budget-friendly prices and comfortable, breathable fabrics, it\u0027s ideal for picking up everyday wardrobe essentials.", "name": "Torano Ch\u00f9a B\u1ed1c Flagship Store", "transport": "Take bus 12, 21A, or 26 to the Ch\u00f9a B\u1ed1c entrance station."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Dong Da and Temple of Literature Historic Area"}, "french_quarter": {"categories": {"cat_1": {"items": [{"address": "188 B\u00e0 Tri\u1ec7u, Nguy\u1ec5n Du Ward, Hai B\u00e0 Tr\u01b0ng, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-buy list: Vietnamese Brown Rice Natural Lip Balm, Dak Lak Coffee Body Scrub, Grapefruit Seed Hair Root Strengthening Spray. C\u1ecf M\u1ec1m is one of Vietnam\u0027s most iconic local botanical handmade beauty brands, emphasizing non-toxic safety and eco-sustainability. The store features a fresh and elegant ambiance, with all products crafted from local Vietnamese ingredients such as brown rice, coffee, and pomelo peel extracts. Their natural lip balm is moisturizing without being sticky, making it a top choice for tourists to stock up on and give as gifts.", "name": "C\u1ecf M\u1ec1m Green Natural Handmade Cosmetics (C\u1ecf M\u1ec1m Homelab - B\u00e0 Tri\u1ec7u)", "transport": "Take bus 08A, 31, or 35A to 188 B\u00e0 Tri\u1ec7u station, then walk about 1 minute."}, {"address": "L3-08, Tr\u00e0ng Ti\u1ec1n Plaza, 24 Hai B\u00e0 Tr\u01b0ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-buy list: Dak Lak Coffee Body Scrub, Winter Melon Oil-Control Soothing Micellar Water, Calendula Repair \u0026 Moisturizing Cream. Cocoon is currently Vietnam\u0027s hottest 100% vegan domestic beauty brand. Located inside Tr\u00e0ng Ti\u1ec1n Plaza in the French Quarter, this flagship cosmetics counter offers their complete product line. The products emphasize cruelty-free practices with stylish packaging; their signature coffee scrub uses beans from Vietnam\u0027s renowned Central Highlands, boasting a rich aroma and excellent exfoliating power.", "name": "Cocoon Counter at BeautyBox (Cocoon Vietnam at BeautyBox Tr\u00e0ng Ti\u1ec1n Plaza)", "transport": "About a 5-minute walk from the Hanoi Opera House; located on the 3rd floor of Tr\u00e0ng Ti\u1ec1n Plaza."}, {"address": "182 B\u00e0 Tri\u1ec7u, Nguy\u1ec5n Du Ward, Hai B\u00e0 Tr\u01b0ng, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-buy list: Lemonade Dual-Ended Matte Lip Cream, Emmi\u00e9 by Happy Skin Exfoliating Acid Serum, Vedette Natural Clay Mask. Hasaki is a massive chain of beauty and health stores in Vietnam, with its B\u00e0 Tri\u1ec7u branch located near the heart of the French Quarter. Renowned for affordable prices and an incredibly comprehensive selection, it features a dedicated section for emerging local Vietnamese brands, allowing visitors to shop all the hottest local makeup and skincare products under one roof.", "name": "Hasaki Beauty \u0026 Clinic - B\u00e0 Tri\u1ec7u", "transport": "Take bus 08A or 38 to 180 B\u00e0 Tri\u1ec7u station, then walk about 2 minutes."}, {"address": "32 L\u00fd Th\u01b0\u1eddng Ki\u1ec7t, H\u00e0ng B\u00e0i Ward, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Must-buy list: Thorakao Classic Turmeric Acne Cream, Vietnamese Herbal Balm, White Tiger Healing Balm (B\u1ea1ch H\u1ed5 C\u1ed1t). Pharmacity is Vietnam\u0027s largest nationwide pharmacy chain, and its branch on L\u00fd Th\u01b0\u1eddng Ki\u1ec7t Boulevard in the French Quarter offers a bright and clean shopping environment. Beyond prescription medicines, it is packed with iconic, historic Vietnamese cosmeceuticals and herbal ointments\u2014such as Thorakao\u0027s decades-old turmeric cream, which delivers remarkable anti-inflammatory and repair effects at an extremely budget-friendly price.", "name": "Pharmacity Pharmacy - L\u00fd Th\u01b0\u1eddng Ki\u1ec7t", "transport": "Walk west along L\u00fd Th\u01b0\u1eddng Ki\u1ec7t Street from Hanoi Opera House for about 7 minutes."}, {"address": "228 B\u00e0 Tri\u1ec7u, L\u00ea \u0110\u1ea1i H\u00e0nh Ward, Hai B\u00e0 Tr\u01b0ng, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-buy list: Lemonade Matte Sunscreen Primer, Of\u00e9lia Velvet Lip Tint, Skinna Herbal Centella Repair Cream. Sammi Shop is a trendy local beauty concept store beloved by young Vietnamese women and college students. The store carries a vast array of trendy local makeup brands, such as Lemonade and Of\u00e9lia created by famous makeup artists. The shades are tailored specifically for Asian skin tones with long-lasting formulas, making this the best spot to discover unique local makeup.", "name": "Sammi Shop - B\u00e0 Tri\u1ec7u", "transport": "Take bus 31, 35A, or 38 to 228 B\u00e0 Tri\u1ec7u station; the store is right at the bus stop."}, {"address": "160 B\u00e0 Tri\u1ec7u, Nguy\u1ec5n Du Ward, Hai B\u00e0 Tr\u01b0ng, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-buy list: Halio Facial Cleansing Device, Gilaa Saffron Brightening Serum, BareSun Organic Botanical Sunscreen. Lixibox is a high-end Vietnamese beauty boutique featuring both an e-commerce platform and stylish brick-and-mortar stores with a strong French flair. It focuses on premium local skincare startups and beauty devices. All products undergo strict quality control, and the English-speaking staff provide detailed explanations, ensuring a wonderfully comfortable shopping experience.", "name": "Lixibox Beauty Store - B\u00e0 Tri\u1ec7u", "transport": "Take bus 08A or 38 to 160 B\u00e0 Tri\u1ec7u station, then walk about 1 minute."}, {"address": "39 Hai B\u00e0 Tr\u01b0ng, Tr\u00e0ng Ti\u1ec1n Ward, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-buy list: Thorakao Cucumber Hydration Pack, Milaganics Coconut Oil Nourishing Balm, Bior\u00e9 Vietnam Exclusive Edition Sunscreen. Guardian is a well-known beauty and health chain in Southeast Asia, with its Hai B\u00e0 Tr\u01b0ng Street branch in the French Quarter offering a vast array of goods. It features a dedicated corner for heritage Vietnamese beauty products, where Milaganics cold-pressed coconut oil skincare items and Thorakao traditional creams serve as highly distinctive must-buy souvenirs.", "name": "Guardian Drugstore - Hai B\u00e0 Tr\u01b0ng", "transport": "About a 3-minute walk from Tr\u00e0ng Ti\u1ec1n Plaza."}, {"address": "12 Ng\u00f4 Quy\u1ec1n, Tr\u00e0ng Ti\u1ec1n Ward, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-buy list: Vietnamese Agarwood Herbal Essential Oil, Traditional Soapberry Scalp Care Shampoo, Honeysuckle Soothing Anti-Allergy Sheet Mask. Th\u1ea3o M\u1ed9c Xanh is an independent local shop on Ng\u00f4 Quy\u1ec1n Street in the French Quarter specializing in herbal wellness and cosmetics made from legendary Vietnamese botanical remedies. Combining traditional herbal wisdom with modern extraction techniques and zero artificial fragrances, it is highly favored by customers seeking natural healing.", "name": "Th\u1ea3o M\u1ed9c Xanh Herbal Beauty", "transport": "About a 4-minute walk from the Hanoi Opera House."}], "name": "Iconic Local Beauty \u0026 Cosmetics Shops"}, "cat_2": {"items": [{"address": "3 P. Tr\u00e0ng Ti\u1ec1n, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.7 stars | Must-Buy List: 100% Vietnamese printed silk scarves, organic cotton printed shirts, printed silk maxi dresses. Metiseko is an iconic high-end sustainable fashion brand in Vietnam, seamlessly blending French chic aesthetics with traditional Vietnamese silk craftsmanship. Located next to the Opera House, its bold prints and exquisite organic silk garments are a hit with stylish travelers. The exclusive original motifs are rich in Southeast Asian natural flair.", "name": "Metiseko Silk \u0026 Organic Cotton Boutique (Metiseko Trang Tien)", "transport": "Take bus 02, 34, or 40 to Nh\u00e0 H\u00e1t L\u1edbn H\u00e0 N\u1ed9i (Hanoi Opera House) stop, then walk about 2 minutes."}, {"address": "27 P. Tr\u00e0ng Ti\u1ec1n, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.8 stars | Must-Buy List: Deconstructed minimalist blazers, 3D tailored real silk tops, minimalist geometric leather shoulder bags. Founded by an emerging Vietnamese designer duo, this brand specializes in minimalist style and architectural 3D tailoring. Located on Trang Tien Street, their apparel combines clean modern lines with traditional Vietnamese textile details. The quality rivals international luxury brands, making it a must-visit designer label for local fashionistas and foreign travelers.", "name": "Subtle Le Nguyen Independent Designer Boutique (Subtle Le Nguyen)", "transport": "Located on Trang Tien Street, walk west from the Hanoi Opera House along Tr\u00e0ng Ti\u1ec1n Street for about 4 minutes."}, {"address": "9 P. L\u00ea Th\u00e1nh T\u00f4ng, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.9 stars | Must-Buy List: Hand-dyed indigo hemp scarves, traditional botanical-dyed linen dresses, embroidered cotton-linen shawls. A pioneering Vietnamese brand that integrates traditional ethnic minority textile techniques with contemporary high fashion. The founder travels deep into the Vietnamese mountains to collaborate with ethnic women, utilizing natural hemp, maple bark dyes, and natural indigo to create warm, handcrafted, exquisite garments and accessories, each piece being truly unique.", "name": "Kilomet109 Sustainable Craft \u0026 Design Studio (Kilomet109)", "transport": "Take bus 02, 04, or 08A to 22B P. L\u00ea Th\u00e1nh T\u00f4ng stop, then walk about 1 minute."}, {"address": "63 P. Tr\u00e0ng Ti\u1ec1n, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic accordion-pleated geometric handbags, cream minimalist tailored dresses, stylish leather shoulder bags. Led by renowned Vietnamese designer L\u00e2m Gia Khang, this brand is lauded as Vietnam\u0027s answer to C\u00e9line. Known for its elegant monochrome palette and sleek geometric lines, its iconic accordion pleated bags are frequently recommended by international fashion magazines\u2014an absolute must-visit luxury boutique in the French Quarter.", "name": "GIA STUDIOS Minimalist Fashion Flagship (GIA STUDIOS)", "transport": "Located opposite Trang Tien Plaza, about a 5-minute walk from the Hanoi Opera House."}, {"address": "26 P. L\u00ea Th\u00e1nh T\u00f4ng, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.7 stars | Must-Buy List: Hand botanical-dyed linen wide-leg trousers, natural style hand-embroidered shirts, crinkled cotton-linen soft tote bags. Tim Tay means \u0027Hand and Heart\u0027. The brand insists on using natural materials like linen and raw silk, complemented by delicate hand-embroidered motifs. The clothing features relaxed, comfortable cuts emitting a warm, refined natural vibe. Their artisanal shoes, bags, and accessories are hugely popular among hipsters who value comfort and local craftsmanship.", "name": "Tim Tay Natural \u0026 Pure Clothing Studio (Tim Tay)", "transport": "About a 6-minute walk from Hanoi Opera House, or take bus 23 to 28 L\u00ea Th\u00e1nh T\u00f4ng stop and walk for 1 minute."}, {"address": "29 P. Tr\u00e0ng Ti\u1ec1n, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Must-Buy List: French romantic lace dresses, pearl-button velvet tops, hand-embroidered evening clutches. Located in the heart of the French Quarter with elegant, romantic decor. Lalin excels at blending French vintage romance with modern women\u0027s tailoring, choosing skin-friendly, breathable silk and linen fabrics accented with delicate lace and pearl details. It is perfect for female shoppers seeking unique, elegant dresses and handcrafted party clutches.", "name": "Lalin French Vintage Women\u0027s Fashion Boutique (Lalin)", "transport": "Located on Tr\u00e0ng Ti\u1ec1n Avenue, just a 2-minute walk from Tr\u00e0ng Ti\u1ec1n Plaza department store."}, {"address": "73 P. Hai B\u00e0 Tr\u01b0ng, C\u1eeda Nam, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Must-Buy List: Hand-beaded colorful tote bags, sequin patchwork handbags, distinctive geometric leather clutches. Originating in Hanoi and now internationally renowned, Ipa-Nima is famous for its vibrant, avant-garde, and whimsical hand-beaded and leather-patchwork handbags. Every bag in the shop resembles a piece of art, meticulously hand-sewn by local Vietnamese artisans\u2014a distinctive fashion statement guaranteed not to clash.", "name": "Ipa-Nima Handcrafted Designer Bag Boutique (Ipa-Nima)", "transport": "Take bus 31 or 38 to 84 Hai B\u00e0 Tr\u01b0ng stop, then walk about 2 minutes."}, {"address": "20 P. Nh\u00e0 Th\u1edd, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Must-Buy List: Teddy bears wearing conical hats and Ao Dai, hand-embroidered linen dresses, Vietnamese-style cotton-linen tote bags. Founded by a Japanese designer in Hanoi, Nagu is a craft boutique that fuses Japanese delicate aesthetics with traditional Vietnamese embroidery. Beyond its iconic Teddy bears dressed in Ao Dai and conical hats, the store offers skin-friendly pure cotton and linen apparel in simple, elegant cuts, along with beautifully embroidered canvas bags and footwear\u2014making it a top choice for souvenirs.", "name": "Nagu Handcrafted Linen Clothing \u0026 Embroidery Craft Shop (Nagu)", "transport": "Located beside the plaza in front of St. Joseph\u0027s Cathedral, about an 8-minute walk from Trang Tien Plaza."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Boutique Shops"}, "cat_3": {"items": [{"address": "91 Th\u1ee3 Nhu\u1ed9m Street, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.6 stars | Must-buy list: Ba R\u1ecba 76% Single Origin Dark Chocolate, Vietnamese Cashew Sea Salt Chocolate Spread, Dried Cocoa Pulp. Hailed by The New York Times as \u0027the best chocolate\u0027, crafted from meticulously selected premium local Vietnamese cocoa beans. The French Quarter shop offers an elegant shopping and tasting environment, featuring artisanal packaging that fuses French sophistication with Vietnamese craftsmanship\u2014making it a top choice for gifting.", "name": "Maison Marou Hanoi", "transport": "About a 10-minute walk or a 3-minute Grab taxi ride from the Hanoi Opera House."}, {"address": "15 Ng\u00f4 Quy\u1ec1n Street, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.7 stars | Must-buy list: Metropole Signature Blend Coffee Beans, Handmade French Macaron Gift Box, Vietnamese Premium Handcrafted Rambutan Jam. Located inside the century-old Metropole Hotel, offering luxurious high-end souvenirs that seamlessly combine top-tier French baking with local Vietnamese agricultural produce, beautifully presented in exquisite packaging.", "name": "L\u0027\u00c9picerie du Metropole", "transport": "Located diagonally opposite the Hanoi Opera House, just a 2-minute walk away."}, {"address": "1A Tr\u00e0ng Ti\u1ec1n Street, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.4 stars | Must-buy list: Ginger Stir-fried Apricot (\u00d4 mai m\u01a1 x\u00e0o g\u1eebng), Salted Dried Lemon (\u00d4 mai chanh mu\u1ed1i), Spicy Olive Preserves (\u00d4 mai tr\u00e1m). Hanoi\u0027s most famous traditional preserved fruit brand, located in the heart of Tr\u00e0ng Ti\u1ec1n Street. It packs traditional preserves under modern hygienic standards. With a sweet and sour flavor accented by warm ginger notes, it is a hugely popular snack representing Hanoi\u0027s authentic ancient recipes.", "name": "H\u1ed3ng Lam - 1A Tr\u00e0ng Ti\u1ec1n", "transport": "About a 1-minute walk from the Hanoi Opera House along Tr\u00e0ng Ti\u1ec1n Street."}, {"address": "B1 Floor, Tr\u00e0ng Ti\u1ec1n Plaza, 24 Hai B\u00e0 Tr\u01b0ng Street, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.5 stars | Must-buy list: Vietnamese Salt-Roasted Cashews with Skin, Premium Vacuum-Dried Jackfruit Chips, Premium Black Peppercorns. A premium gourmet supermarket located on the basement level of Tr\u00e0ng Ti\u1ec1n Plaza, bringing together the finest specialty agricultural produce and organic snacks from across Vietnam. Bright and clean environment with international-standard packaging, ideal for one-stop souvenir shopping.", "name": "Annam Gourmet Market - Tr\u00e0ng Ti\u1ec1n Plaza", "transport": "Take a bus to the Tr\u00e0ng Ti\u1ec1n Plaza stop, or walk about 4 minutes from the Opera House."}, {"address": "9 Phan Chu Trinh Street, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.3 stars | Must-buy list: Legend Weasel-flavor Drip Coffee Bags, Classic No.8 Coffee Beans, Elegant Metal Phin Filters. The flagship store of Vietnam\u0027s national coffee brand in the French Quarter. It offers a comprehensive range of coffee souvenirs, from luxury gift sets to traditional brewing equipment, with staff providing professional advice on coffee bean selection.", "name": "Trung Nguy\u00ean Legend Caf\u00e9 - Phan Chu Trinh", "transport": "Located right behind the Hanoi Opera House, about a 2-minute walk."}, {"address": "35 Tr\u00e0ng Ti\u1ec1n Street, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.4 stars | Must-buy list: Signature Young Green Rice Popsicle (Kem C\u1ed1m), Coconut Taro Popsicle, Freshly Made Coconut Wafers. Operating since 1958, this legendary Hanoi ice cream and snack shop is a shared memory for all Hanoians. Besides enjoying popsicles on site, packaged traditional Vietnamese rice cakes and crispy wafers sold here are nostalgic snacks that tourists shouldn\u0027t miss.", "name": "Kem Tr\u00e0ng Ti\u1ec1n", "transport": "About a 3-minute walk from the Hanoi Opera House along Tr\u00e0ng Ti\u1ec1n Street."}, {"address": "34 L\u00fd Th\u01b0\u1eddng Ki\u1ec7t Street, H\u00e0ng B\u00e0i, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.6 stars | Must-buy list: Th\u00e1i Nguy\u00ean Premium Lotus Green Tea (Tr\u00e0 Sen), High-Mountain Jasmine Tea Gift Set, Traditional Bamboo-Woven Tea Boxes. A boutique specializing in Vietnam\u0027s finest teas, situated on a spacious tree-lined avenue in the French Quarter. The shop highlights premium lotus tea created by repeatedly infusing high-mountain tea leaves with fresh local flowers, elegantly packaged in bamboo and wooden boxes rich in Oriental aesthetics.", "name": "Tr\u00e0 Vi\u1ec7t - L\u00fd Th\u01b0\u1eddng Ki\u1ec7t", "transport": "Head south from Tr\u00e0ng Ti\u1ec1n Plaza along H\u00e0ng B\u00e0i Street, turn onto L\u00fd Th\u01b0\u1eddng Ki\u1ec7t Street, and walk about 5 minutes."}, {"address": "12 Tr\u00e0ng Ti\u1ec1n Street, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.2 stars | Must-buy list: Traditional Young Green Rice Cake (B\u00e1nh C\u1ed1m), H\u1ea3i D\u01b0\u01a1ng Mung Bean Cake (B\u00e1nh \u0110\u1eadu Xanh), Taro Coconut Chewy Candy. A highly iconic heritage pastry brand in Vietnam. Its green rice cakes feature young sticky rice from Northern Vietnam wrapping smooth mung bean paste\u2014soft, chewy, sweet, and scented with subtle pandan leaf aroma. With elegant packaging and a reasonable shelf life, it makes for a wonderful local traditional souvenir.", "name": "B\u00e1nh C\u1ed1m B\u1ea3o Minh - Tr\u00e0ng Ti\u1ec1n", "transport": "About a 2-minute walk from the Hanoi Opera House."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "24 Hai B\u00e0 Tr\u01b0ng, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy List: Chanel fine fragrances, French wines, delicate Vietnamese embroidered handkerchiefs. Located in the heart of the French Quarter architecture, Tr\u00e0ng Ti\u1ec1n Plaza has been Hanoi\u0027s most iconic landmark department store since 1901. Featuring a rich French colonial exterior, its interior houses top-tier international luxury brands alongside high-end Vietnamese designer boutiques. Beyond being a shopping paradise, it\u2019s a premier spot to experience Hanoi\u0027s French luxury charm and snap Instagram-worthy photos.", "name": "Tr\u00e0ng Ti\u1ec1n Plaza", "transport": "About a 3-minute walk to the Hanoi Opera House, or take bus 02, 09, or 34 to Tr\u00e0ng Ti\u1ec1n station."}, {"address": "7-9 Nguy\u1ec5n V\u0103n Linh, Gia Th\u1ee5y, Long Bi\u00ean, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Must-Buy List: Discounted past-season Nike sneakers, Adidas apparel up to 70% off, Levi\u0027s discounted jeans. Just about a 10-minute drive from the French Quarter, this massive outlet mall is a top choice for both Hanoi locals and tourists hunting for affordable designer deals. The mall features a huge sports brand outlet zone offering clearance discounts from 50% to 70% off. Alongside international brands, it houses a Big C supermarket and local grocery stores, making it perfect for picking up Vietnamese souvenirs on the side.", "name": "Savico Megamall Outlet", "transport": "About a 10-minute Grab taxi ride from the French Quarter, or take bus 34 direct."}, {"address": "38 H\u00e0ng B\u00e0i, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-Buy List: Handcrafted lacquer jewelry/tea boxes, two-tone lacquer bangles, premium printed silk scarves. Hanoia is Vietnam\u0027s premier luxury traditional lacquerware brand, seamlessly blending centuries-old Vietnamese craft with modern French aesthetic design. Every piece is meticulously hand-polished and lacquered over several months by master artisans, offering a refined texture and immense artistic value favored by lifestyle connoisseurs worldwide.", "name": "Hanoia Lacquerware Boutique (Hanoia Tr\u00e0ng Ti\u1ec1n)", "transport": "Located diagonally opposite Tr\u00e0ng Ti\u1ec1n Plaza, about a 4-minute walk from Hanoi Opera House."}, {"address": "26B Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Organic mulberry silk printed maxi dresses, Vietnamese botanical silk scarves, hand-embroidered cushion covers. Founded in Vietnam, Metiseko is an independent French-inspired fashion brand focusing on 100% locally sourced organic mulberry silk and organic cotton. Patterns draw inspiration from Vietnam\u0027s natural landscapes and tropical flora, fusing romantic French silhouettes with Vietnamese flair. Lightweight and comfortable, it offers unique, high-end local fashion.", "name": "Metiseko Silk Boutique (Metiseko Tr\u00e0ng Ti\u1ec1n)", "transport": "Located on Tr\u00e0ng Ti\u1ec1n Street, about a 2-minute walk from Tr\u00e0ng Ti\u1ec1n Plaza."}, {"address": "91A L\u00fd Th\u01b0\u1eddng Ki\u1ec7t, C\u1eeda Nam, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Single-origin dark chocolate bars, rich signature hot chocolate, handcrafted cocoa spreads. Hailed by The New York Times as \u0027the best chocolate,\u0027 Marou was founded by two Frenchmen in Vietnam as a local bean-to-bar artisanal chocolate brand. Carefully sourcing cacao beans from six distinct Vietnamese provinces, their chocolate offers unique fruity and smoky flavor profiles. This flagship store features live bean roasting displays and elegant gift sets, making it an unmissable gourmet dessert souvenir stop in the French Quarter.", "name": "Maison Marou French Quarter Flagship Store (Maison Marou L\u00fd Th\u01b0\u1eddng Ki\u1ec7t)", "transport": "About a 10-minute walk along L\u00fd Th\u01b0\u1eddng Ki\u1ec7t Street from Hanoi Opera House, or a 3-minute Grab taxi ride."}, {"address": "3 Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-Buy List: Vietnamese illustrator collaboration T-shirts, mythical beast art posters, creative Vietnamese mythology sticker sets. TiredCity is a highly iconic local independent design brand in Hanoi, partnering directly with contemporary young Vietnamese illustrators and street artists. Their products blend traditional Vietnamese mythology and folklore with modern streetwear trends, crafting original goods rich in Vietnamese vibe. High quality and wildly imaginative, it\u0027s a popular spot to support local art and pick up unique creative souvenirs.", "name": "TiredCity Independent Art \u0026 Creative Shop (TiredCity Tr\u00e0ng Ti\u1ec1n)", "transport": "Located on the Opera House end of Tr\u00e0ng Ti\u1ec1n Street, just a 2-minute walk from Hanoi Opera House."}, {"address": "20 Nh\u00e0 Th\u1edd, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: Handcrafted Teddy bears wearing conical hats, handmade linen pouches, finely embroidered handkerchiefs. Nagu is a Japanese-concept local handmade boutique brand long established in Vietnam, renowned for its refined elegance and exquisite traditional Vietnamese embroidery. Its signature product is the handcrafted Teddy bear clad in traditional Vietnamese attire and a mini conical hat (N\u00f3n L\u00e1), each uniquely made. The breathable linen clothing and home goods are highly favored by travelers seeking refined lifestyle quality.", "name": "Nagu Handmade Craft \u0026 Lifestyle Boutique (Nagu Nha Tho)", "transport": "Located on the border of St. Joseph\u0027s Cathedral area and the French Quarter, about an 8-minute walk from the French Quarter."}, {"address": "191 B\u00e0 Tri\u1ec7u, L\u00ea \u0110\u1ea1i H\u00e0nh, Hai B\u00e0 Tr\u01b0ng, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy List: Mango discounted fashion, Charles \u0026 Keith end-of-season sale bags, Pedro special deal men\u0027s wallets. Situated on the southern extension of the French Quarter, this shopping complex is a iconic modern fashion shopping landmark in Hanoi. The mall regularly hosts large brand sample sales and end-of-season clearance events, with deep discounts on brands like Zara, Mango, and Pedro. Connected across multiple towers featuring food courts and a supermarket, it\u2019s a convenient one-stop hub for high-street shopping and finding discounted designer labels.", "name": "Vincom Center B\u00e0 Tri\u1ec7u", "transport": "About a 5-minute Grab taxi ride from Hanoi Opera House, or take bus 38 direct."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "French Quarter and Opera Shopping District"}, "gia_lam_ocean_park": {"categories": {"cat_1": {"items": [{"address": "Shophouse S2.01, Vinhomes Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.8 stars | Must-Buy List: Cocoon Winter Melon Cleanser, Thorakao Turmeric Cream. Hasaki is one of Vietnam\u0027s iconic local cosmetics chains, featuring a flagship store in Ocean Park, Gia L\u00e2m. It houses a large collection of local vegan skincare brands, most notably Cocoon, which uses local Vietnamese agricultural products. Affordable yet of excellent quality, it\u0027s the top choice to experience modern Vietnamese green beauty.", "name": "Hasaki Beauty \u0026 Clinic - Ocean Park", "transport": "Take VinBus E01 or E03 and get off at S2.01 stop."}, {"address": "1st Floor, Vincom Mega Mall Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.9 stars | Must-Buy List: Rice Herbal Gentle Cleansing Oil, Lead-Free Natural Botanical Lipstick. C\u1ecf M\u1ec1m is one of Vietnam\u0027s hottest local natural and organic beauty brands in recent years, emphasizing safety, non-toxicity, and eco-friendliness. The store in the Ocean Park commercial area boasts a fresh, elegant decor. Products use local rice, roses, and herbs as key ingredients, packaged beautifully\u2014making them ideal souvenirs.", "name": "C\u1ecf M\u1ec1m Homelab - Ocean Park", "transport": "Take VinBus directly to the 1st floor of Vincom Mega Mall Ocean Park."}, {"address": "128 Ng\u00f4 Xu\u00e2n Qu\u1ea3ng, Tr\u00e2u Qu\u1ef3, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.7 stars | Must-Buy List: Th\u00e1i D\u01b0\u01a1ng Herbal Shampoo, Traditional Herbal Balm. Long Ch\u00e2u is one of Vietnam\u0027s largest pharmacy chains, with a major branch in Tr\u00e2u Qu\u1ef3, Gia L\u00e2m. Beyond standard pharmaceuticals, tourists are drawn to its wide variety of traditional Vietnamese herbal skincare and health supplements. Friendly service with transparent, clearly labeled prices.", "name": "Long Ch\u00e2u Pharmacy (Nh\u00e0 Thu\u1ed1c Long Ch\u00e2u - Tr\u00e2u Qu\u1ef3 Gia L\u00e2m)", "transport": "Take Bus No. 11 from Gia L\u00e2m Station, get off at Ng\u00f4 Xu\u00e2n Qu\u1ea3ng stop, and walk for 2 minutes."}, {"address": "Shophouse S1.08, Vinhomes Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.6 stars | Must-Buy List: Lemonade Matte Liquid Lipstick, Emmi\u00e9 by Happy Skin Peeling Serum. Sammi Shop is a favorite local beauty concept store among young Vietnamese women, specializing in brands founded by popular local designers and influencers. Here, you\u0027ll find smudge-proof makeup and anti-acne skincare tailored for Southeast Asia\u0027s hot, humid climate. The vibrant store layout offers plenty of testers.", "name": "Sammi Shop - Ocean Park", "transport": "Take VinBus E02, get off at the S1.08 bus stop, and walk to the store."}, {"address": "45 Nguy\u1ec5n M\u1eadu T\u00e0i, Tr\u00e2u Qu\u1ef3, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.5 stars | Must-Buy List: Ofelia Velvet Matte Lip Tint, Milaganics Cold-Pressed Coconut Hair Oil. Nuty Cosmetics is a popular local beauty chain in Vietnam known for its diverse selection and great discounts. It features a dedicated zone for local brands, highlighting top Vietnamese influencer brand Ofelia and organic skincare brand Milaganics\u2014an ideal spot for local beauty trinkets and pure coconut oil products.", "name": "Nuty Cosmetics - Gia L\u00e2m", "transport": "Take a taxi or Grab to Nguy\u1ec5n M\u1eadu T\u00e0i Street, Gia L\u00e2m, near the Vietnam National University of Agriculture commercial area."}, {"address": "B1 Floor, Vincom Mega Mall Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.4 stars | Must-Buy List: Vedette Vietnamese Clay Mask, BareTt Botanical Sunscreen. A large health \u0026 beauty store located inside Ocean Park Mega Mall, combining popular Asian beauty items with high-value local Vietnamese skincare. The Vedette Clay Mask series is a longtime local bestseller, fantastic for deep pore cleansing at extremely affordable prices.", "name": "Guardian - Vincom Ocean Park", "transport": "Take VinBus E01 or E03 to the basement mall of Vincom Mega Mall Ocean Park."}, {"address": "Shophouse S2.18, Vinhomes Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.6 stars | Must-Buy List: Sao Th\u00e1i D\u01b0\u01a1ng Herbal Acne Gel, Vietnamese Natural Essential Oil Balm. Pharmacity is Vietnam\u0027s most ubiquitous convenience pharmacy chain. This branch inside Ocean Park provides a clean, bright shopping environment. Beyond modern pharmaceuticals and health supplements, it exclusively carries several locally made herbal repair balms and anti-acne products, making it a handy spot for residents and tourists alike to restock skincare goods.", "name": "Pharmacity - Vinhomes Ocean Park", "transport": "Take VinBus E03, get off at the S2.18 building complex, and walk for 1 minute."}, {"address": "88 X\u00f3m 3, B\u00e1t Tr\u00e0ng, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.7 stars | Must-Buy List: Botanical Lip Balm in Ceramic Jars, Pure Vietnamese Lemongrass Essential Oil. Located near the famous ceramic village in Gia L\u00e2m, this independent traditional herbal cosmetics store inherits Northern Vietnam\u0027s rich Oriental herbal tradition. Combining traditional recipes with exquisite ceramic containers, it offers locally themed essential oils and skincare balms that carry rich cultural heritage and high souvenir value.", "name": "Anipha Organic \u0026 Pharmacy - B\u00e1t Tr\u00e0ng", "transport": "Take Bus No. 47A to the B\u00e1t Tr\u00e0ng Ceramic Village terminal station and walk for about 5 minutes."}], "name": "Iconic Local Beauty \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "1st Floor, Vincom Mega Mall Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.6 Stars | Must-Buy List: UV-protection seamless dresses, printed silk scarves, seamless high heels. FORMAT is a highly reputable high-end Vietnamese fashion brand specializing in elegant, sophisticated clothing and accessories for urban women. Their signature sun-protection series uses high-tech fabrics that are lightweight, breathable, and UV-resistant. Additionally, their silky-smooth scarves featuring Vietnamese elegance are immensely popular among local white-collar workers and tourists alike.", "name": "FORMAT Apparel \u0026 Leather Goods (FORMAT Ocean Park)", "transport": "Take Ocean Park Shuttle Bus (VinBus) E01 or E03 to Vincom Mega Mall stop, then walk for 1 minute."}, {"address": "Shophouse H\u1ea3i \u0110\u0103ng, Vinhomes Ocean Park Urban Area, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.5 Stars | Must-Buy List: Cooling Polo shirts, anti-UV lightweight jackets, bamboo fiber casual pants. YODY is a fast-rising national clothing brand in Vietnam, famous for its exceptional value for money and functional fabrics. The brand carefully develops cooling and UV-blocking materials tailored to Southeast Asia\u0027s hot and humid climate, with cuts specifically designed for Asian body frames. The spacious and bright store attracts many local families and young adults looking for quality daily wear.", "name": "YODY Casual Wear Store (YODY Gia L\u00e2m)", "transport": "Take VinBus E02 to Shophouse H\u1ea3i \u0110\u0103ng stop; the store is right there."}, {"address": "2nd Floor, Vincom Mega Mall Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.4 Stars | Must-Buy List: Elegant pointed-toe pumps, versatile quality tote bags, stylish sandals \u0026 mules. Juno is one of Vietnam\u0027s most famous homegrown fashion shoes and bags brands, offering affordable yet high-quality designs for modern women. Featuring superb comfort and a rich palette of colors, it makes finding the perfect match for daily commutes or vacation outfits effortless\u2014a top choice for experiencing local Vietnamese footwear fashion.", "name": "Juno Women\u0027s Shoes \u0026 Bags (Juno Ocean Park)", "transport": "Take VinBus E01 to Vincom Mega Mall, then head to the 2nd floor."}, {"address": "1st Floor, Vincom Mega Mall Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.7 Stars | Must-Buy List: Minimalist linen short-sleeve shirts, slim-fit cropped casual trousers, lightweight styled jackets. Routine is a designer clothing brand beloved by local hipsters and young professionals in Vietnam, featuring European minimalism and sleek everyday styles. Most items are crafted from natural cotton and linen with smooth tailored lines, making them perfect for Hanoi\u0027s summer weather. Locals frequently shop here for smart, stylish tops and bottoms.", "name": "Routine Minimalist Fashion (Routine Ocean Park)", "transport": "Take VinBus E03 to Vincom Mega Mall stop and walk directly inside."}, {"address": "2nd Floor, Vincom Mega Mall Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.6 Stars | Must-Buy List: French-style genuine leather handbags, handcrafted leather bifold wallets, elegant low-heeled shoes. ELLY is a local accessible luxury brand that blends French romantic style with exquisite Vietnamese leather craftsmanship. All products are made from carefully selected genuine leather, known for its soft, supple, glossy finish and meticulous stitching. For travelers seeking high-quality, reasonably priced leather bags or footwear, this local treasure is a must-visit.", "name": "ELLY Boutique Leather Shoes \u0026 Bags (ELLY Ocean Park)", "transport": "Take VinBus E01 or E02 to Vincom Mega Mall stop."}, {"address": "Shophouse Sao Bi\u1ec3n, Vinhomes Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.5 Stars | Must-Buy List: Natural bamboo fiber shirts, cooling business trousers, premium leather belts. Aristino is a premier high-end menswear brand in Vietnam, specializing in combining Italian elegant tailoring with top-grade local fabrics. Highly recommended are their patented eco-friendly shirts made from bamboo fiber and coffee grounds, offering natural breathability, antibacterial properties, and wrinkle resistance\u2014delivering the ultimate comfortable wearing experience for businessmen and stylish gentlemen.", "name": "Aristino Men\u0027s Fashion (Aristino Gia L\u00e2m)", "transport": "Take VinBus E02 to the Sao Bi\u1ec3n area, then walk for 2 minutes."}, {"address": "1st Floor, Vincom Mega Mall Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.3 Stars | Must-Buy List: Organic cotton printed T-shirts, lightweight windproof jackets, skin-friendly cooling innerwear. Canifa is a long-established Vietnamese clothing giant, focusing on high-quality fashion for the entire family. Its products feature internationally certified natural cotton and wool, vibrant versatile colors, and excellent durability. The Ocean Park branch offers an abundant array of matching parent-child outfits and local motif designs, making it a popular shopping spot for local families.", "name": "Canifa Family Apparel Brand (Canifa Ocean Park)", "transport": "Take VinBus E01 to the main entrance of Vincom Mega Mall."}, {"address": "2nd Floor, Vincom Mega Mall Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.4 Stars | Must-Buy List: Woven texture chain bags, comfortable block-heel sandals, minimalist leather clutches. Vascara is a trendsetting shoe and bag chain brand in Vietnam, renowned for incorporating global fashion elements into elegant local designs. Each season\u0027s bags and shoes boast vibrant novel colors, sturdy craftsmanship, and highly competitive prices, making them immensely popular with local young women and tourists visiting Ocean Park.", "name": "Vascara Women\u0027s Shoes \u0026 Handbags (Vascara Ocean Park)", "transport": "Take VinBus E03 to Vincom Mega Mall stop."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "Hamlet 5, B\u00e1t Tr\u00e0ng, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-buy list: Hand-painted ceramic tea sets, blue-and-white porcelain coffee phin filters, and unique ceramic wind chimes. Located in the core traditional craft village of Gia L\u00e2m District, this is Vietnam\u0027s most iconic ceramic souvenir hub. Tourists can hunt for exclusive ceramic tableware and exquisite ornaments rich in Vietnamese craftsmanship. With affordable prices and a vast variety, it\u0027s an unmissable traditional souvenir destination when visiting Gia L\u00e2m.", "name": "B\u00e1t Tr\u00e0ng Ceramic Market (Ch\u1ee3 G\u1ed1m B\u00e1t Tr\u00e0ng)", "transport": "Take bus 47A directly to B\u00e1t Tr\u00e0ng terminal station, or take a taxi from Ocean Park (approx. 15 minutes)."}, {"address": "1st Floor, Building S2.19, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-buy list: Vinamit mixed dried fruit chips, Trung Nguy\u00ean Vietnamese drip coffee powder, and roasted salted cashews with skin. A landmark supermarket in the Ocean Park commercial zone, bringing together popular snacks and dry goods from across Vietnam. Featuring transparent pricing and a comprehensive selection, whether you\u0027re looking for classic Vietnamese coffee packs or local crunchy nuts, it\u0027s the best spot for tourists to buy snacks and gifts in bulk.", "name": "WinMart Supermarket - Ocean Park Branch (WinMart Ocean Park)", "transport": "Take VinBus E01 or E03 to Building S2.19 stop, then walk for 1 minute."}, {"address": "C\u1ed5 Bi, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-buy list: Gia L\u00e2m specialty mung bean cakes, Vietnamese wild lotus seed tea, and traditional handmade rice crackers. This store specializes in high-quality agricultural specialties from Gia L\u00e2m certified by Vietnam\u0027s OCOP (One Commune One Product) program. Emphasizing all-natural ingredients and local artisanal craft, the elegant packaging paired with premium local flavors makes these products ideal specialty gift boxes for friends and family.", "name": "OCOP Gia L\u00e2m Specialty Store (C\u1eeda H\u00e0ng OCOP Gia L\u00e2m)", "transport": "Take a Grab car from Gia L\u00e2m Railway Station or Ocean Park (approx. 10 minutes)."}, {"address": "Block PT1-05, Mega Grand World, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-buy list: Coconut green sticky rice cake (B\u00e1nh C\u1ed1m), premium Ph\u00fa Qu\u1ed1c fish sauce gift set, and French-style artisanal dried fruits. Located along the waterfront commercial street of Mega Grand World Ocean Park, this shop carefully curates iconic food souvenirs from Northern and Southern Vietnam. Friendly staff offer generous samples; the green sticky rice cake is soft and sweet, and the dried fruit retains rich fruity aromas\u2014making it a must-visit souvenir spot while exploring the park.", "name": "Vietnamese Specialties Souvenir Shop (\u0110\u1eb7c S\u1ea3n Vi\u1ec7t Nam - Grand World Ocean Park)", "transport": "Take the free VinBus shuttle OCT1 or OCT2 and get off at Grand World Square station."}, {"address": "Vincom Mega Mall, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-buy list: Marou single-origin Vietnamese dark chocolate, Vietnamese wild wildflower honey, and hand-roasted herb nuts. This premium supermarket offers a variety of high-end local Vietnamese brands specializing in artisanal souvenirs. From Marou chocolate\u2014once hailed by the New York Times as top-tier chocolate\u2014to pure natural honey, the elegant packaging and superior quality make it a favorite among upscale travelers and lifestyle enthusiasts.", "name": "Annam Gourmet Fine Food Supermarket - Ocean Park (Annam Gourmet Ocean Park)", "transport": "Take VinBus E01 directly to Vincom Mega Mall Ocean Park station."}, {"address": "\u0110T378, Kim Lan, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Must-buy list: Hand-painted lotus ceramic coffee cups, Vietnamese lacquerware dining plate gift sets, and delicate ceramic aroma burners. Located in a famous ceramic production base in Gia L\u00e2m, this brand blends modern design with traditional firing techniques to create porcelain gifts suited for contemporary aesthetics. Lightweight yet durable, featuring patterns rich in Vietnamese cultural charm, they make ideal trendy home decor souvenirs to bring back home.", "name": "Minh Ch\u00e2u Ceramic Souvenir Flagship Store (G\u1ed1m S\u1ee9 Minh Ch\u00e2u Gia L\u00e2m)", "transport": "Take a Grab car from B\u00e1t Tr\u00e0ng Ceramic Village (approx. 5 minutes)."}, {"address": "Shop San H\u00f4 16-02, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-buy list: Ancient tree high-mountain black tea cakes, mountain jasmine tea gift boxes, and natural agarwood gift sets. A refined local tea and aromatic wood souvenir specialty store located in the Ocean Park commercial zone. Featuring organic tea and natural incense from the high mountains of northwestern Vietnam, its elegant rustic packaging and lingering tea aromas make it an excellent choice for travelers seeking sophisticated Vietnamese cultural and creative souvenirs.", "name": "H\u01b0\u01a1ng M\u1ed9c Vietnam Tea \u0026 Souvenir Workshop (H\u01b0\u01a1ng M\u1ed9c Vietnam Tea \u0026 Souvenir)", "transport": "Take VinBus E02 to San H\u00f4 Zone station, then walk for about 3 minutes."}, {"address": "K-Town Zone, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-buy list: Roasted spicy garlic cashews, Vietnamese durian pastry (B\u00e1nh P\u00eda), and coconut crackers. Located in the exotic K-Town commercial area of Ocean Park, this store blends local Vietnamese specialties with popular Asian snacks. The spicy cashews and rich coconut crackers are a hit among young people. Gift wrapping services are available, making it ideal for picking up office snack gifts to share.", "name": "K-Town Snack \u0026 Souvenir Store", "transport": "Take the VinBus K-Town dedicated shuttle to K-Town Square station, then walk for 2 minutes."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Khu \u0111\u00f4 th\u1ecb Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Canifa local Vietnamese cotton apparel, Highlands Coffee drip coffee beans, WinMart premium salted pepper cashews. As the core grand shopping mall inside the Ocean Park complex, this imposing and modern building stands as the largest integrated shopping center in Gia L\u00e2m District. It houses numerous renowned local Vietnamese fashion brands alongside international chains. Canifa, a local favorite, offers exceptional value on high-quality cotton garments, while the massive supermarket on the lower level is the ultimate one-stop spot for local Vietnamese souvenirs and snacks.", "name": "Vincom Mega Mall Ocean Park", "transport": "Take Vinhomes Electric Bus E01, E02, or E03 to Vincom Mega Mall Ocean Park stop."}, {"address": "S2.08 Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy List: Adidas lightweight running shoes (frequently up to 50% off), Nike classic casual sports caps, technical moisture-wicking shirts. As a highly attractive sports outlet near the Gia L\u00e2m area, this center brings together past-season and promotional items from major brands like Adidas and Nike. The store is spacious, covering a wide range of professional footwear, athletic wear, and accessories. Prices are significantly more advantageous than downtown counters, with year-round discounts ranging from 40% to 70%, making it a top destination for tourists and local youth hunting for discounted sports gear.", "name": "Adidas \u0026 Nike Factory Outlet Ocean Park", "transport": "Take the Ocean Park shuttle bus to the S2 zone bus stop, then walk about 3 minutes."}, {"address": "\u0110\u01b0\u1eddng L\u00e0ng C\u1ed5 B\u00e1t Tr\u00e0ng, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-Buy List: Hand-painted blue-and-white ceramic tea sets, vintage glazed vases, handmade ceramic absorbent coasters. The proud highlight of Gia L\u00e2m District is B\u00e1t Tr\u00e0ng Village, a historic pottery hub. This direct-sale flagship showroom, situated in the heart of Gia L\u00e2m, showcases exquisite handmade ceramics that represent local heritage. Every piece in the shop is hand-thrown and hand-painted by veteran local artisans, making each item unique. It is cleaner, neater, and features transparent fixed pricing compared to traditional markets, making it ideal for finding high-quality souvenirs and elegant home decor that showcase Hanoi\u0027s traditional craftsmanship.", "name": "B\u00e1t Tr\u00e0ng Ceramics Showroom Gia L\u00e2m", "transport": "Take Bus 47A from central Gia L\u00e2m to the B\u00e1t Tr\u00e0ng terminus, then walk about 5 minutes."}, {"address": "S1.02 Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: Bamboo fiber odor-resistant men\u0027s short-sleeve T-shirts, seamless breathable athletic shorts, moisture-wicking casual sock sets. Coolmate is a rapidly rising and highly representative local Vietnamese menswear brand in recent years, focusing on high-quality, comfortable, and minimalist performance clothing. Located in Ocean Park, Gia L\u00e2m, this store displays the brand\u0027s most complete line of products. Made with high-quality local Vietnamese fabrics and modern cuts, the products offer incredibly accessible pricing and are deeply loved by local urban men\u2014making it an excellent choice for anyone looking to buy quality local Vietnamese apparel.", "name": "Coolmate Ocean Park Hub", "transport": "Take Bus E02 to the S1.02 Building stop, then walk about 2 minutes."}, {"address": "S2.19 Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Must-Buy List: Cocoon Vietnamese coconut coffee body scrub, Lemonade dual-ended long-lasting lip glaze, Thorakao turmeric facial cleanser. Sammi Shop is a well-known local beauty specialty chain in Vietnam. This branch carries a wide array of high-quality local Vietnamese cosmetic and skincare brands. Among them, \u0027Cocoon\u0027 highlights 100% vegan formulations using indigenous Vietnamese ingredients (such as highland coffee and coconut), making it a hit souvenir. Meanwhile, \u0027Lemonade\u0027 was founded by a prominent rising Vietnamese makeup artist and tailored specifically for Southeast Asia\u0027s climate, making it well worth trying.", "name": "Sammi Shop Ocean Park", "transport": "Take the park shuttle bus to the S2.19 Building stop, then walk about 1 minute."}, {"address": "T\u1ea7ng 1, Vincom Mega Mall Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy List: An Ph\u01b0\u1edbc high-end men\u0027s wrinkle-resistant dress shirts, genuine Vietnamese leather dress belts, premium handmade silk ties. An Ph\u01b0\u1edbc is a historic and prestigious local high-end apparel brand in Vietnam, renowned for superb tailoring and carefully selected fabrics. Although the brand also distributes foreign brands, its self-owned An Ph\u01b0\u1edbc line is highly esteemed by the Vietnamese middle class and business professionals. This branch offers elegantly tailored, highly breathable dress shirts and accessories, perfect as sophisticated gifts for formal occasions.", "name": "An Ph\u01b0\u1edbc Ocean Park", "transport": "Take Electric Bus E01 or E03 to the Vincom Ocean Park main entrance, heading straight to the 1st-floor counter."}, {"address": "S\u1ed1 88 C\u1ed5 Bi, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-Buy List: Gia L\u00e2m specialty embroidered silk scarves, handmade bamboo woven handbags, handcrafted lacquerware tea trays. This independent boutique for handicrafts and traditional silk in Gia L\u00e2m District is dedicated to promoting the exquisite craftsmanship of traditional villages around Hanoi. Partnering directly with local artisans, the shop uses pure natural silk, bamboo, and rattan to create home accessories and ornaments that blend modern aesthetics with traditional elements. Excellent in quality and rich in cultural character, it is a must-visit for travelers who appreciate creative crafts and signature textiles.", "name": "Duy\u00ean H\u00e0 Silk \u0026 Crafts Gia L\u00e2m", "transport": "Take Bus 40 to C\u1ed5 Bi stop, then walk about 4 minutes."}, {"address": "T\u1ea7ng H\u1ea7m B1, Vincom Mega Mall Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: L\u0027angfarm Da Lat specialty dried mixed fruits, TH True MILK rich coconut milk spread, G7 3-in-1 instant drip coffee. This massive hypermarket features a dedicated \u0027Local Vietnamese Specialty Souvenir Discount Zone,\u0027 selling iconic snacks and specialties in bulk boxes and promo bundles. Compared to souvenir shops in tourist districts, pricing here is completely transparent and budget-friendly. It allows you to stock up on specialties from all across Vietnam in one stop\u2014the ideal location for bulk shopping before leaving the Ocean Park resort area.", "name": "WinMart Ocean Park Flagship Store", "transport": "Take Electric Bus E01 or E02 to Vincom Mega Mall stop, then take the elevator down to Basement B1."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Gia Lam District and Ocean Park Resort"}, "old_quarter_hoan_kiem": {"categories": {"cat_1": {"items": [{"address": "14 Ch\u00e2n C\u1ea7m, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-Buy List: Organic Rose Geranium Essential Oil, Scented Roll-on Botanical Oil, Herbal Solid Perfume. NauNau is an iconic independent organic beauty brand in Vietnam. It specializes in clean skincare and fragrances crafted for Asian skin using high-quality local Vietnamese plants and essential oils. Nestled in a quiet alley of the Old Quarter, this cozy store boasts a charming French vintage aesthetic. With chic packaging and affordable prices, it is the top choice for stylish souvenirs.", "name": "NauNau Studio \u0026 Apothecary", "transport": "About a 7-minute walk from the Hoan Kiem Lake Fountain Square."}, {"address": "18 H\u00e0ng B\u00f4ng, H\u00e0ng Gai, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-Buy List: Lead-Free Safe Botanical Lipsticks, Vietnamese Bitter Melon Cleansing Gel, Centella Asiatica Soothing Repair Cream. C\u1ecf M\u1ec1m means \u0027tender grass\u0027 in Vietnamese. It is a highly reputable local plant-based skin care brand that emphasizes \u0027pure as herbs, safe without additives.\u0027 Beloved by young Vietnamese women and expectant mothers, their lipsticks\u2014crafted with natural plant oils and mineral pigments\u2014are deeply hydrating with natural shades, perfect for year-round use.", "name": "C\u1ecf M\u1ec1m HomeLab Natural Beauty Store", "transport": "Take a Grab car or bike to the intersection of H\u00e0ng B\u00f4ng and Ph\u1ee7 Do\u00e3n streets, then walk for 1 minute."}, {"address": "65 H\u00e0ng M\u1eafm, H\u00e0ng B\u1ea1c, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Cao B\u1eb1ng Coffee Body Polish, Ki\u00ean Giang Pomelo Anti-inflammatory Essence, Dragon Fruit Gentle Exfoliating Gel. Cocoon is Vietnam\u0027s top vegan beauty brand sweeping Southeast Asia, famous for utilizing local Vietnamese agricultural produce (like Cao B\u1eb1ng coffee beans, Ki\u00ean Giang pomelo, and Central Highlands cacao) to formulate skincare products. This authorized store offers a complete lineup at budget-friendly prices with frequent promotions, making it extremely popular for gift shopping.", "name": "Sammi Beauty - Cocoon Authorized Store", "transport": "Located on the northeast side of the Old Quarter, about a 3-minute walk from Quan Ch\u01b0\u1edfng Gate (Old City Gate)."}, {"address": "19 H\u00e0ng Khay, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.9 stars | Must-Buy List: Traditional Herbal Lithospermum Healing Balm, Honeysuckle Oil-Control Hydrating Toner, Vietnamese Blumea Soothing Sheet Mask. Skinlosophy is an indie, hipster beauty brand founded in Hanoi that artfully fuses traditional herbal wisdom with modern dermatological science. The store design blends oriental pharmacy aesthetics with contemporary style, supported by exceptionally professional staff. Renowned for acne treatment and sensitive skin repair, it\u0027s a great spot to discover unique local skincare.", "name": "Skinlosophy Vietnam (Herbal Botanical Beauty Studio)", "transport": "Located on the southern shore of Hoan Kiem Lake, about an 8-minute walk from St. Joseph\u0027s Cathedral."}, {"address": "39 H\u00e0ng B\u1ed3, H\u00e0ng B\u1ed3, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic Golden Star Balm (Sao V\u00e0ng), Ph\u1eadt Linh Herbal Medicated Oil, Natural Vietnamese Monk Fruit Cooling Tea. Pharmacity is one of Vietnam\u0027s largest pharmacy chains. Its Old Quarter flagship is bright, clean, and staffed by friendly pharmacists. Here, you can purchase historic Vietnamese \u0027Golden Star Balm\u0027 and various herbal oils at authentic, fair prices, along with quality-guaranteed local herbal wellness tea bags and traditional care products.", "name": "Pharmacity Drugstore H\u00e0ng B\u1ed3 (Ho\u00e0n Ki\u1ebfm Flagship Store)", "transport": "Located in the heart of the Old Quarter, about a 6-minute walk from St. Joseph\u0027s Cathedral."}, {"address": "169 H\u00e0ng B\u00f4ng, H\u00e0ng B\u00f4ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Thorakao Classic Turmeric Acne Cream, Vedette Vietnamese Natural Clay Mask, B\u1ea3o Ph\u01b0\u01a1ng Natural Shampoo. Hasaki is an immensely popular beauty and drugstore chain in Vietnam. Beyond international brands, it features a dedicated section for heritage local Vietnamese beauty products. It\u0027s the perfect place to shop for legacy household brands like Thorakao (famous for turmeric skincare) and affordable natural cosmetics like Vedette, offering fantastic value for money.", "name": "Hasaki Beauty \u0026 Clinic H\u00e0ng B\u00f4ng", "transport": "About a 5-minute Grab ride from Hanoi Railway Station, or a short walk along H\u00e0ng B\u00f4ng Shopping Street."}, {"address": "21 Nguy\u1ec5n Th\u00e1i H\u1ecdc, C\u1eeda Nam, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-Buy List: Charcoal Deep Cleansing Handmade Soap, Vietnamese Coconut Oil Anti-Chapping Lip Balm, Hydrating Jasmine Hydrosol. M\u1ed9c An is a well-known boutique in Hanoi dedicated to handmade organic cosmetics, strictly using 100% natural, non-toxic local botanical ingredients. Filled with a relaxing herbal and floral scent, all soaps and lip balms are fresh-made in small batches with eco-friendly recyclable packaging, perfectly embodying the concept of clean green beauty.", "name": "M\u1ed9c An Organic Handmade Beauty", "transport": "Located in the southwest of Hoan Kiem District near the Temple of Literature, about a 4-minute walk from the Temple."}, {"address": "27 H\u00e0ng B\u00f4ng, H\u00e0ng Gai, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy List: Vietnamese Centella Asiatica Repair Sheet Mask, Natural Plant Essential Oil Mosquito Repellent Spray, Vietnamese Centella Asiatica Whitening Body Lotion. Although Guardian is an Asian retail chain, its Vietnamese stores stock a wide array of local brands tailored to the climate and consumer needs. Located in a bustling area of Hoan Kiem, this store features well-organized displays and frequent Buy-1-Get-1 promos, making it the best one-stop shop for local mosquito repellents, Centella masks, and personal care essentials.", "name": "Guardian Health \u0026 Beauty H\u00e0ng B\u00f4ng", "transport": "Located on H\u00e0ng B\u00f4ng Commercial Street, about a 5-minute walk from the west side of Hoan Kiem Lake."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "20 Nh\u00e0 Th\u1edd, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-buy items: Teddy bears wearing Vietnamese conical hats, handmade linen dresses, hand-embroidered canvas bags. Nagu is a renowned boutique and clothing store in Hanoi located near St. Joseph\u0027s Cathedral. The shop focuses on high-quality linen and natural cotton-linen fabrics, combining minimalist style with local Vietnamese craftsmanship. Their embroidered teddy bears wearing traditional Vietnamese attire or conical hats are iconic keepsake souvenirs every tourist loves.", "name": "Nagu Hanoi - Hand-painted \u0026 Fine Linen Apparel", "transport": "About a 1-minute walk from the main entrance of St. Joseph\u0027s Cathedral (Hanoi Cathedral)."}, {"address": "10 H\u00e0ng B\u00e8, H\u00e0ng B\u1ea1c, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-buy items: Hanoi streetscape organic cotton T-shirts, cyclo-graphic tote bags, eco-friendly bamboo fiber casual shirts. Ginkgo is an iconic local Vietnamese organic apparel brand committed to using organic cotton and sustainable materials. Designs integrate local Vietnamese cultural elements like cyclos, Vietnamese coffee, and Hanoi Old Quarter maps. The fabrics are extremely soft, comfortable, and durable, making it the top choice for stylish, high-quality souvenir T-shirts.", "name": "Ginkgo T-Shirts - Hang Be (Original Organic Cotton Apparel)", "transport": "About a 3-minute walk from the entrance of Ngoc Son Temple on the north side of Hoan Kiem Lake."}, {"address": "61 H\u00e0ng Gai, H\u00e0ng B\u00f4ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-buy items: Hand-embroidered silk pajamas, exquisite embroidered shawls, designer silk robes. Tan My is the most famous three-generation embroidery shop in Hanoi\u0027s Old Quarter, featuring a spacious and artistic interior. The store displays exquisite Vietnamese hand-embroidered products, ranging from luxury silk garments and handmade shawls to home linens, seamlessly combining traditional Vietnamese embroidery with modern fashion tailoring.", "name": "Tan My Design - Fine Embroidery \u0026 Designer Apparel", "transport": "Located on the famous Silk Street (H\u00e0ng Gai), about a 4-minute walk from the northwest corner of Hoan Kiem Lake."}, {"address": "71 H\u00e0ng Gai, H\u00e0ng B\u00f4ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-buy items: French-inspired graphic silk scarves, organic cotton printed dresses, mulberry silk dresses. Metiseko merges French design aesthetics with premium Vietnamese mulberry silk and organic cotton. Known for its exclusive original prints inspired by Vietnam\u0027s tropical flora and cultural icons, the brand offers elegant, flowing silhouettes\u2014a must-visit for fashion lovers seeking quality and uniqueness.", "name": "Metiseko Hanoi - Luxury Silk \u0026 Organic Cotton Fashion", "transport": "Located on H\u00e0ng Gai Silk Street, just a few steps from Tan My Design, and about a 5-minute walk from Hoan Kiem Lake."}, {"address": "49 H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-buy items: Northwest Vietnamese ethnic pattern handbags, handwoven jackets, natural plant-dyed scarves. Chie focuses on promoting the traditional weaving and natural dyeing crafts of Vietnam\u0027s ethnic minorities, collaborating directly with local tribal women artisans. The clothing, bags, and accessories are all handcrafted, with each item featuring unique motifs and colors that combine cultural depth with modern versatility.", "name": "Chie Craft \u0026 Fashion - Handmade Ethnic Apparel \u0026 Accessories", "transport": "Located on H\u00e0ng Tr\u1ed1ng Street, just a 3-minute walk from the western shore of Hoan Kiem Lake."}, {"address": "2A H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-buy items: Vietnamese mythical beast illustration T-shirts, local creative canvas bags, Hanoi architecture print tote bags. TiredCity is a creative streetwear brand hugely popular among young locals and international travelers. Partnering with emerging local Vietnamese illustrators, it transforms Hanoi street culture, folklore, and local cuisine art into clothing and accessories. The designs are modern and playful, making it a treasure trove for edgy local streetwear and designer bags.", "name": "TiredCity Hang Trong - Emerging Vietnamese Artist Apparel \u0026 Merch", "transport": "About a 2-minute walk from the Hoan Kiem Lake Fountain Square (Dong Kinh Nghia Thuc Square)."}, {"address": "76 H\u00e0ng B\u00e0i, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-buy items: French vintage dresses, modernized Vietnamese \u00c1o D\u00e0i, finely tailored shirts. Magonn is a highly successful independent local womenswear brand combining French vintage elegance with Eastern charm. Their dresses feature impeccable tailoring and excel at incorporating traditional \u00c1o D\u00e0i elements into daily wear\u2014ideal for female travelers seeking stylish outfits with a subtle local touch suitable for work or dates.", "name": "Magonn Design - Hang Bai (Vintage Chic Women\u0027s Fashion)", "transport": "About a 3-minute walk from Tr\u00e0ng Ti\u1ec1n Plaza at the southern end of Hoan Kiem Lake."}, {"address": "1 H\u00e0ng D\u1ea7u, H\u00e0ng B\u1ea1c, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Must-buy items: Handmade genuine leather flats, Made-in-Vietnam casual sandals, stylish woven leather shoes. H\u00e0ng D\u1ea7u Street is famous in the Old Quarter as the shoe street. Thanh Binh Shoes is a well-reputed local shoe shop offering transparent pricing on genuine leather and casual footwear. It features a wide array of soft, durable locally made leather shoes and women\u0027s footwear at highly affordable prices, attracting both locals and savvy tourists.", "name": "Thanh Binh Shoes - Hang Dau", "transport": "Located at the intersection of H\u00e0ng D\u1ea7u Street at the north end of Hoan Kiem Lake, about a 2-minute walk from the Ngoc Son Temple entrance."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "11 H\u00e0ng \u0110\u01b0\u1eddng, H\u00e0ng \u0110\u00e0o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy: Ginger Preserved Plum (\u00d4 mai g\u1eebng), Sweet \u0026 Sour Apricot (M\u01a1 x\u00e0o chua ng\u1ecdt), Mung Bean Cake (B\u00e1nh \u0111\u1eadu xanh). H\u1ed3ng Lam is a legendary preserved fruit brand in Hanoi, a must-have for locals during holidays. They offer dozens of traditional preserved fruits and dried fruits made through processes like salting, sugaring, and stir-frying with ginger. Offering rich and multi-layered flavors with exquisite packaging, these make for the most authentic North Vietnamese traditional snacks to bring home to friends and family.", "name": "H\u1ed3ng Lam \u00d4 Mai", "transport": "About a 5-minute walk from the northern end of Hoan Kiem Lake."}, {"address": "15 H\u00e0ng Ngang, H\u00e0ng \u0110\u00e0o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-Buy: Handmade Lotus Green Tea, Jasmine Tea, Thai Nguyen Green Tea. Located in the heart of the Old Quarter, H\u01b0\u01a1ng Mai Tea is a multi-generational handmade tea shop. Its most famous Lotus Tea uses stamen from lotuses grown in West Lake, meticulously infused through a complex process to create an elegantly aromatic tea with a long-lasting finish. Friendly on-site tastings are available, making it ideal for purchasing high-quality gifts.", "name": "H\u01b0\u01a1ng Mai Tea", "transport": "Located on H\u00e0ng Ngang Street in the heart of the Old Quarter, easily reachable on foot."}, {"address": "21 H\u00e0ng \u0110\u01b0\u1eddng, H\u00e0ng \u0110\u00e0o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy: Salted Dried Apricot (M\u01a1 mu\u1ed1i), Stir-fried Kumquat with Ginger (Qu\u1ea5t x\u00e0o g\u1eebng), Licorice Kumquat Candies (K\u1eb9o qu\u1ea5t cam th\u1ea3o). Founded in 1937 on H\u00e0ng \u0110\u01b0\u1eddng Street, Ti\u1ebfn Th\u1ecbnh \u00d4 Mai is one of the oldest traditional preserved fruit shops in Hanoi\u0027s Old Quarter. Preserving ancient family recipes, their dried fruits are pleasantly sweet and sour with hints of ginger and licorice\u2014a quintessential taste of traditional Hanoi beloved by locals and tourists alike.", "name": "Ti\u1ebfn Th\u1ecbnh \u00d4 Mai", "transport": "About a 6-minute walk north along H\u00e0ng \u0110\u00e0o Street from Hoan Kiem Lake."}, {"address": "91 Th\u1ee3 Nhu\u1ed9m, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-Buy: Single Origin Chocolate Bars, Cashew Chocolate Spread, Signature Cocoa Powder. Hailed by the New York Times as one of the best artisan chocolates, Marou uses 100% locally grown Vietnamese cacao, labeling unique flavor profiles based on different origin provinces. The flagship store features a stylish industrial design where you can buy beautifully packaged chocolate gift sets and watch the chocolate-making process through glass walls.", "name": "Maison Marou Hanoi", "transport": "About an 8-10 minute walk from Hanoi Train Street and the southwest side of Hoan Kiem Lake."}, {"address": "52 Nguy\u1ec5n H\u1eefu Hu\u00e2n, L\u00fd Th\u00e1i T\u1ed5, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy: Freshly Ground Arabica Coffee Beans, Classic Roasted Robusta Beans, Mai Blend Drip Coffee Powder. Founded in 1936, C\u00e0 Ph\u00ea Mai is a legendary traditional coffee roaster in Hanoi; the rich aroma of roasted coffee greets you before you even enter. Sticking to traditional recipes and roasting techniques, they offer custom bean selection and freshly ground packaging tailored to your preference\u2014an unmissable souvenir for fans of authentic Vietnamese drip coffee.", "name": "C\u00e0 Ph\u00ea Mai", "transport": "Located on \u0027Coffee Street\u0027 (Nguy\u1ec5n H\u1eefu Hu\u00e2n), about a 5-minute walk from the northeast corner of Hoan Kiem Lake."}, {"address": "12 Nh\u00e0 Chung, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy: Vietnamese Coffee Jam, Premium Roasted Cashew Nuts, Vietnamese Spice Gift Set. Located near St. Joseph\u0027s Cathedral, this boutique gift shop specializes in carefully curated products and specialties from local small farms. Offering excellent quality control and refined packaging, their items range from premium cashews, pepper, and dried fruits to exclusive coffee spreads. With a bright, comfortable environment and English-speaking staff, it is a great spot to pick up sophisticated local snacks.", "name": "Ajisai Hanoi Old Quarter", "transport": "Located right on the street in front of St. Joseph\u0027s Cathedral, about a 1-minute walk."}, {"address": "12 Nha Th\u1ecd, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-Buy: Craft Chili Sauce, Organic Roasted Cashews, Infused Local Spirits. Founded by two local cultural workers, this concept store carefully curates high-quality creative souvenirs and artisanal food from local farms across Vietnam, each with its own story. Their packaging beautifully merges modern aesthetic with traditional elements. The custom chili sauce and spice blends come highly recommended\u2014a wonderfully unique alternative to generic snacks.", "name": "Collective Memory - House of Curiosities", "transport": "Adjacent to St. Joseph\u0027s Cathedral, about a 2-minute walk."}, {"address": "63 L\u00fd Th\u00e1i T\u1ed5, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy: Ph\u00fa Qu\u1ed1c Premium Fish Sauce, Kumquat Pepper Salt, Highland Specialty Coffee Beans. Annam Gourmet is a high-end food market gathering top-tier local ingredients from across Vietnam alongside Southeast Asian gourmet snacks. Here you can easily buy premium Vietnamese condiments, flavored pepper salts, fine coffee beans, nuts, and dried fruits. Clean, bright, and with clear pricing, it\u0027s perfect for a one-stop shop for gourmet food gifts.", "name": "Annam Gourmet Market - Hoan Kiem", "transport": "Located on L\u00fd Th\u00e1i T\u1ed5 Boulevard east of Hoan Kiem Lake, about a 5-minute walk from the lake."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "24 Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-buy list: Trung Nguy\u00ean Legend premium coffee beans, top-tier Vietnamese handmade silk scarves, Marou French artisanal dark chocolate. Located at the southeast corner of Ho\u00e0n Ki\u1ebfm Lake, this French classical-style department store was formerly the \u0027Grands Magasins R\u00e9unis\u0027 during the French colonial era. It houses numerous international luxury brands alongside high-end Vietnamese craft souvenir counters. Powerful air conditioning and grand decor make it the ultimate spot for upscale shopping and cool relaxation after exploring Ho\u00e0n Ki\u1ebfm Lake.", "name": "Tr\u00e0ng Ti\u1ec1n Plaza", "transport": "About an 8-minute walk from the Thang Long Water Puppet Theatre at Ho\u00e0n Ki\u1ebfm Lake."}, {"address": "191 B\u00e0 Tri\u1ec7u, L\u00ea \u0110\u1ea1i H\u00e0nh, Hai B\u00e0 Tr\u01b0ng, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Must-buy list: WinMart skin-on roasted salted cashews, dried mango slices, locally produced fruit wine. A modern dual-tower shopping complex just a few minutes\u0027 drive from Ho\u00e0n Ki\u1ebfm Lake, making it one of Hanoi\u0027s youth-favorite shopping hubs. Beyond contemporary fashion brands, the basement supermarket boasts Hanoi\u0027s most comprehensive selection of local Vietnamese specialties and snacks at fair, transparent prices\u2014perfect for buying all your souvenir gifts in one go.", "name": "Vincom Center B\u00e0 Tri\u1ec7u", "transport": "About a 5-minute Grab car or motorbike ride from the southern end of Ho\u00e0n Ki\u1ebfm Lake."}, {"address": "27 C\u1ed5 Linh, Long Bi\u00ean, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-buy list: Nike/Adidas sneakers at up to 70% off, discounted Canifa local brand apparel, bulk-pack Vietnamese roasted cashews. The closest major outlet destination to the Old Quarter, featuring dedicated outlet clearance zones for off-season sportswear and local Vietnamese brands, often discounted by 50% to 70%. Sprawling floor plans and excellent amenities make this the top choice for affordable activewear and great value local clothing.", "name": "AEON MALL Long Bi\u00ean - Outlet Zone", "transport": "About a 15-minute Grab ride from the Ho\u00e0n Ki\u1ebfm Old Quarter across Ch\u01b0\u01a1ng D\u01b0\u01a1ng Bridge."}, {"address": "13a H\u00e0ng B\u00e8, H\u00e0ng B\u1ea1c, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-buy list: Hand-drawn Hanoi streetscape tote bags, Vietnamese mythology \u0026 folklore illustrated T-shirts, artistic hand-drawn postcard sets. Hanoi\u0027s flagship independent design boutique, collaborating with young local Vietnamese illustrators to transform street culture, scooter swarms, and local cuisine into exquisite creative merchandise. Steeped in contemporary Vietnamese artistic flair, every item here is highly collectible.", "name": "TiredCity Design Concept Store (TiredCity H\u00e0ng B\u00e8)", "transport": "Located inside the 36 Old Streets; about a 7-minute walk from St. Joseph\u0027s Cathedral."}, {"address": "181 H\u00e0ng B\u00f4ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Must-buy list: Cooling UV protection jackets (\u00c1o ch\u1ed1ng n\u1eafng), pure cotton Hanoi-motif T-shirts, Merino wool knitwear. CANIFA is Vietnam\u0027s iconic homegrown clothing brand, often dubbed \u0027Vietnam\u0027s Uniqlo\u0027. This spacious flagship store on H\u00e0ng B\u00f4ng Street features apparel designed specifically for Southeast Asia\u0027s climate. With outstanding quality and budget-friendly prices for UV wear and cotton essentials, it offers a great look into Vietnam\u0027s modern garment industry.", "name": "CANIFA Apparel Flagship Store (CANIFA H\u00e0ng B\u00f4ng)", "transport": "Located on H\u00e0ng B\u00f4ng Street on the west side of the Old Quarter, about a 5-minute walk from the western shore of Ho\u00e0n Ki\u1ebfm Lake."}, {"address": "22 L\u00ea Th\u00e1i T\u1ed5, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.1 stars | Must-buy list: Artisanal Vietnamese lotus tea, premium Ph\u00fa Qu\u1ed1c fish sauce, Vinamit mixed dried fruit chips. Located right by the shores of Ho\u00e0n Ki\u1ebfm Lake, this state-owned general department supermarket is a budget-friendly favorite among local Hanoi residents. While its exterior is modest and classic, the interior offers an extensive selection of products\u2014especially Vietnamese teas, coffees, dried goods, and seasonings\u2014at prices much lower than typical souvenir shops.", "name": "Intimex Lakeside Supermarket (Intimex Supermarket L\u00ea Th\u00e1i T\u1ed5)", "transport": "Located on the lakeside promenade west of Ho\u00e0n Ki\u1ebfm Lake, easily accessible on foot."}, {"address": "15 \u0110\u1ed3ng Xu\u00e2n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.0 stars | Must-buy list: Traditional hand-embroidered silk pajamas, Vietnamese conical hats (N\u00f3n l\u00e1), bulk dried mushrooms and cashews. \u0110\u1ed3ng Xu\u00e2n Market is the largest and oldest multi-story indoor wholesale market in the Old Quarter. The ground floor focuses on dried food items and everyday household groceries, while the second and third floors are packed with traditional apparel, textiles, and handicrafts. Bargaining is common and the atmosphere is lively\u2014ideal for travelers who enjoy hunting for treasures in authentic local wholesale markets.", "name": "\u0110\u1ed3ng Xu\u00e2n Market Wholesale Complex", "transport": "Located at the northern end of the Old Quarter, about a 12-minute walk along H\u00e0ng \u0110\u00e0o Street from the northern shore of Ho\u00e0n Ki\u1ebfm Lake."}, {"address": "33 H\u00e0ng H\u00f2m, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-buy list: Organic cotton Hanoi heritage print T-shirts, lightweight bamboo fiber travel packing cubes, natural essential oils. Ginkgo is a renowned independent eco-fashion brand in Vietnam featuring a sophisticated boutique concept in the Old Quarter. Specializing in high-quality apparel crafted from organic cotton and bamboo fiber, their designs combine traditional Vietnamese motifs with contemporary minimalism. Durable, unique, and stylish, it is a favorite among eco-conscious travelers looking for premium quality.", "name": "Ginkgo Organic Cotton \u0026 Lifestyle Store (Ginkgo
