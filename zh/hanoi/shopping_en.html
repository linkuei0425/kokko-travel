ral Volcanic Stone Diffuser Set. Founded by a veteran Vietnamese perfumer, NauNau seamlessly blends local flora with modern aromatherapy. The shop boasts an elegant, boutique aesthetic. Its signature White Michelia and Frangipani perfume lines beautifully capture Hanoi\u0027s seasonal floral aromas, while its light-textured skincare range is perfectly formulated for Asia\u0027s humid climate.", "name": "NauNau Vietnamese Fragrance \u0026 Skincare (NauNau Ba \u0110\u00ecnh)", "transport": "Take bus route 09A or 144 to \u002718 Phan K\u1ebf B\u00ednh\u0027 stop, then walk for about 2 minutes."}, {"address": "188 \u0110\u1ed9i C\u1ea5n, \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: Centella Repair Sheet Mask, Turmeric Brightening Cleanser, Vietnamese Herbal Reviving Mist. Skinna is a high-end local skincare brand that combines traditional Vietnamese herbalism with organic technology. Products are specially formulated for tropical climates to balance oil and repair the skin barrier. The warm and helpful staff offers detailed skin consultations. Its turmeric and centella lines are particularly effective for brightening dullness and calming acne, making it a hidden gem for insider travelers.", "name": "Skinna Vietnamese Herbal Skincare Boutique (Skinna Ba \u0110\u00ecnh)", "transport": "Take bus route 09A to \u0027170 \u0110\u1ed9i C\u1ea5n\u0027 stop, then walk for about 2 minutes."}, {"address": "45 Gi\u1ea3ng V\u00f5, C\u00e1t Linh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic Golden Star Balm (Cao Sao V\u00e0ng), Bergamot Herbal Green Oil, Traditional Agarwood Soothing Ointment. A historic herbal pharmacy in Ba \u0110\u00ecnh District that preserves centuries of traditional Vietnamese herbal wisdom. Here you can buy authentic, budget-friendly Golden Star Balm and traditional medicated oils famous for soothing insect bites, headaches, and chest tightness. Their herbal multi-purpose balms make fantastic souvenirs infused with authentic Oriental charm.", "name": "Ba \u0110\u00ecnh Traditional Herbal Pharmacy (Nh\u00e0 Thu\u1ed1c \u0110\u00f4ng Y C\u1ed5 Truy\u1ec1n Ba \u0110\u00ecnh)", "transport": "Take Metro Line 2A to \u0027C\u00e1t Linh\u0027 Station, then walk for about 6 minutes."}, {"address": "256 Kim M\u00e3, Kim M\u00e3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Thorakao Turmeric Cleanser (Vietnam\u0027s national staple), Vedette Clay Mask, NaChi Coconut Oil Hair Conditioner. Hasaki is a leading beauty and pharmacy retail chain in Vietnam, and its Kim M\u00e3 location offers a bright, spacious shopping environment. Beside international makeup giants, it features a massive \u0027Local Vietnamese Brands Zone\u0027 where you can pick up classic, time-tested local skincare products like Thorakao at fair, transparent prices.", "name": "Hasaki Beauty \u0026 Clinic Flagship Store (Hasaki Beauty \u0026 Clinic Kim M\u00e3)", "transport": "Take bus route 32, 34, or 38 to \u0027228-230 Kim M\u00e3\u0027 stop, then walk for about 2 minutes."}, {"address": "1st Floor, Vincom Center Metropolis, 29 Li\u1ec5u Giai, Ng\u1ecdc Kh\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-Buy List: Lemonade Velvet Lip Tint (co-created with top Vietnamese makeup artists), Emmi\u00e9 by Happy Skin BHA Exfoliating Pads. Located inside Vincom Metropolis, Sociolla features a massive, futuristic pink retail experience. It curates trendy local and Southeast Asian beauty brands, including Lemonade\u2014a brand founded by a top Vietnamese MUA with lip shades tailored for Asian skin tones. Interactive makeup testing stations and skincare diagnostic tools are available on-site.", "name": "Sociolla Multi-Brand Beauty Concept Store (Sociolla Vincom Metropolis)", "transport": "Take Metro Line 3 to \u0027C\u1ea7u Gi\u1ea5y\u0027 Station, or take bus route 09A or 144 directly to \u0027Li\u1ec5u Giai\u0027 stop."}, {"address": "1st Floor, Vincom Center Metropolis, 29 Li\u1ec5u Giai, Ng\u1ecdc Kh\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: BareSoul Body \u0026 Scalp Dual-Action Scrub, Of\u00e9lia Matte Transfer-Proof Lip Tint. Beautybox is a chic beauty store popular among local youth, specializing in viral online cosmetics brands. Featuring stylish, modern interior decor, it stocks trending local gems like BareSoul herbal body care and Of\u00e9lia cosmetics, celebrated for sleek design and top-tier quality.", "name": "Beautybox Select Beauty Store (Beautybox Vincom Metropolis)", "transport": "Take Metro Line 3 to \u0027C\u1ea7u Gi\u1ea5y\u0027 Station, or take bus route 09A or 144 directly to \u0027Li\u1ec5u Giai\u0027 stop."}], "name": "Local Signature Cosmetics \u0026 Beauty Stores"}, "cat_2": {"items": [{"address": "133 P. Gi\u1ea3ng V\u00f5, Ch\u1ee3 D\u1eeba, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Must-Buy List: Hanoi landmark print T-shirts, Vietnamese-themed hoodies, eco-friendly canvas tote bags. BOO is Vietnam\u0027s most popular local street fashion brand among young people, originating right in Hanoi. The brand focuses on incorporating local Vietnamese cultural elements and humorous graphics into its designs while using organic cotton and eco-friendly materials. The store features a modern industrial vibe, making it the top destination for stylish clothing infused with authentic local flair.", "name": "BOO Streetwear Gi\u1ea3ng V\u00f5", "transport": "Take bus 18, 22A, or 23 to 133 Gi\u1ea3ng V\u00f5 station, then walk for about 1 minute."}, {"address": "26 P. Kim M\u00e3, Kim M\u00e3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.7 stars | Must-Buy List: Minimalist tailored dresses, draped silk tops, structured jackets. Founded by emerging local Vietnamese designers, this high-end womenswear brand has its flagship store on Kim M\u00e3 Street in Ba \u0110\u00ecnh District. Renowned for exquisite tailoring and premium local silk and linen fabrics, its aesthetic blends Oriental elegance with modern minimalism. Favored by the local fashion scene and international visitors alike, it is perfect for travelers seeking unique, high-quality designer clothing.", "name": "Subtle Le Nguyen Designer Womenswear (Kim M\u00e3)", "transport": "Take a taxi or Grab for about 5 minutes from the Imperial Citadel of Th\u0103ng Long."}, {"address": "214 P. Kim M\u00e3, Kim M\u00e3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Must-Buy List: Sweet French-style dresses, lightweight knit cardigans, Korean-style high-waisted knit skirts. M\u00e2y Boutique is an iconic local chain for women\u0027s fashion in Hanoi, featuring a spacious outlet on Kim M\u00e3 Street. It focuses on gentle, sweet, and urban commute styles, offering extremely fast inventory updates at very accessible prices. Highly favored by young local women and college students for everyday outfits, it\u0027s a great spot to experience Hanoi\u0027s current fashion trends and snag high-value pieces.", "name": "M\u00e2y Boutique Womenswear (Kim M\u00e3)", "transport": "Take bus 32 or 34 to 211 Kim M\u00e3 station; the store is right across the street."}, {"address": "20 P. S\u01a1n T\u00e2y, Kim M\u00e3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Must-Buy List: Biti\u0027s Hunter lightweight running shoes, trend-setting collaboration sneakers, Vietnamese-style sandals. Biti\u0027s is Vietnam\u0027s beloved national footwear brand, which recently took the youth market by storm with its Biti\u0027s Hunter sneaker collection. Known for being ultra-lightweight, breathable, and comfortably supportive, their quality rivals major international brands at just a fraction of the cost. This comprehensive branch in Ba \u0110\u00ecnh District is the prime spot for buying durable, comfortable local footwear.", "name": "Biti\u0027s Flagship Footwear Store (Biti\u0027s Experience Store S\u01a1n T\u00e2y)", "transport": "Walk about 10 minutes from Ba Dinh Square, or take bus 09A to S\u01a1n T\u00e2y station."}, {"address": "200 P. \u0110\u1ed9i C\u1ea5n, \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.8 stars | Must-Buy List: Handcrafted modern modified silk \u00c1o D\u00e0i, traditional high-collar silk \u00c1o D\u00e0i, hand-painted silk scarves. A prestigious traditional \u00c1o D\u00e0i boutique on \u0110\u1ed9i C\u1ea5n Street in Ba \u0110\u00ecnh District, carrying on years of tailoring craftsmanship dedicated to Vietnam\u0027s national dress. The shop offers both ready-to-wear pieces and exquisite custom tailoring using top-tier natural Vietnamese silk with intricate embroidery and prints. Many local women come here specifically before major festivals or weddings, making it an exceptional place to acquire authentic Vietnamese sartorial art.", "name": "\u00c1o D\u00e0i Vinh Custom Tailoring \u0026 Boutique (\u0110\u1ed9i C\u1ea5n)", "transport": "Take a Grab taxi from Ba Dinh Square for about 6 minutes."}, {"address": "20 P. Kim M\u00e3, Kim M\u00e3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Must-Buy List: Hand-embroidered linen square bags, Teddy bears in Vietnamese conical hats/\u00c1o D\u00e0i, linen tote bags. Nagu is a renowned local handmade lifestyle brand in Hanoi, specializing in clothing, footwear, bags, and accessories made from natural linen and pure cotton. Its iconic products include handmade teddy bears wearing traditional \u00c1o D\u00e0i or conical hats, alongside delicately embroidered cloth bags and canvas totes. Exuding a refined, artsy vibe, it\u0027s ideal for picking up tasteful souvenirs and personal accessories.", "name": "Nagu Handmade Boutique Bags \u0026 Lifestyle Goods (Kim M\u00e3)", "transport": "Take bus 09A or 32 to Kim M\u00e3 station, then walk for about 2 minutes."}, {"address": "76 P. Kim M\u00e3, Kim M\u00e3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Must-Buy List: Hand-drawn embroidery children\u0027s wear, embroidered linen handbags, hand-embroidered cotton sleepwear. Ninh Khu\u01a1ng is a famous Vietnamese embroidery brand dedicated to preserving and celebrating traditional drawn-thread embroidery techniques. Every apparel item and bag in the store is hand-stitched by skilled artisans, featuring fine detailing and durable quality that resists warping over time. Beyond its popular children\u0027s wear, their embroidered tote bags and women\u0027s handbags are elegant and charming, capturing the essence of Vietnamese craftsmanship.", "name": "Ninh Khu\u01a1ng Hand-Embroidered Apparel \u0026 Bags (Kim M\u00e3)", "transport": "Walk about 12 minutes from the west exit of the Imperial Citadel of Th\u0103ng Long, or take a taxi for about 3 minutes."}, {"address": "143 P. Kim M\u00e3, Kim M\u00e3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Must-Buy List: Lightweight linen blazers, elegant French-style blouses, printed resort maxi dresses. IVY moda is a prominent local high-end fashion brand deeply loved by urban women in Vietnam. This spacious flagship store on Kim M\u00e3 Street showcases a wide array of trendy womenswear, shoes, and bags. Blending Western tailoring techniques with cuts tailored for Asian silhouettes, it uses comfortable, premium fabrics at reasonable prices, making it an ideal destination for chic workwear or stylish vacation attire.", "name": "IVY moda High Fashion Womenswear (Kim M\u00e3)", "transport": "Take bus 32, 34, or 38 to 140 Kim M\u00e3 station; the store is directly across the street."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "11 P. Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | Must-buy list: Signature Ginger Apricot Preserves (\u00d4 mai m\u01a1 x\u00e0o g\u1eebng), Licorice Salted Plums (\u00d4 mai x\u00ed mu\u1ed9i), Perilla Plums. The Ba \u0110\u00ecnh branch of H\u1ed3ng Lam, Vietnam\u0027s famous heritage souvenir brand specializing in traditional preserved and dried fruits. Pickled using ancient methods, these preserved plums offer a unique sweet, sour, and spicy flavor profile that stimulates saliva and quenches thirst, making them a favorite among locals and tourists alike. With exquisite packaging and free samples available in-store, it is the top choice for buying traditional Northern Vietnamese snacks.", "name": "H\u1ed3ng Lam Preserved Fruits (H\u1ed3ng Lam - Nguy\u1ec5n Tri Ph\u01b0\u01a1ng)", "transport": "Take bus 22A or 09A to Nguy\u1ec5n Tri Ph\u01b0\u01a1ng station, then walk for 2 minutes."}, {"address": "218 P. \u0110\u1ed9i C\u1ea5n, \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Must-buy list: L\u00e0ng V\u00f2ng Fresh Young Green Rice (C\u1ed1m m\u1ed9c L\u00e0ng V\u00f2ng), Handmade Green Rice Cake (B\u00e1nh c\u1ed1m), Stir-fried Green Rice with Coconut (C\u1ed1m x\u00e0o). A specialty shop featuring young green rice crafted with traditional methods from Hanoi\u0027s famous V\u00f2ng Village. Green rice (C\u1ed1m) is Hanoi\u0027s most iconic autumn delicacy, offering a delicate grassy aroma and a soft, sweet glutinous rice texture. Handmade strictly with fresh, tender young green rice, their green rice cakes feature a soft, chewy outer crust and sweet mung bean paste filling\u2014an unmissable treat for experiencing Hanoi\u0027s traditional culinary culture.", "name": "C\u1ed1m Thu Hu\u1ec7 Green Rice Specialty Shop (C\u1ed1m Thu Hu\u1ec7 - \u0110\u1ed9i C\u1ea5n)", "transport": "Take bus 09A or 09B to 218 \u0110\u1ed9i C\u1ea5n station."}, {"address": "62 P. Phan K\u1ebf B\u00ednh, C\u1ed1ng V\u1ecb, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 Stars | Must-buy list: Premium West Lake Lotus Tea (Tr\u00e0 Sen T\u00e2y H\u1ed3), High-Mountain Shan Snow Tea (Tr\u00e0 Shan Tuy\u1ebft), Premium Th\u00e1i Nguy\u00ean Green Tea. This specialty tea shop is renowned for strictly selecting high-quality Vietnamese teas. Its signature \u0027West Lake Lotus Tea\u0027 is meticulously crafted by scenting premium green tea inside fresh lotus blossoms through an intricate roasting process. The tea liquor is elegant and fragrant with a long-lasting sweet aftertaste. Elegantly packaged with a touch of royal and scholarly Vietnamese aesthetic, it makes a refined gift choice.", "name": "L\u1ed9c T\u00e2n C\u01b0\u01a1ng Green Tea \u0026 West Lake Lotus Tea (L\u1ed9c T\u00e2n C\u01b0\u01a1ng - Ba \u0110\u00ecnh)", "transport": "Take bus 09A or 144 to Phan K\u1ebf B\u00ednh station and walk for 3 minutes."}, {"address": "64 P. Phan K\u1ebf B\u00ednh, C\u1ed1ng V\u1ecb, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 Stars | Must-buy list: Vietnamese Single Origin Dark Chocolate Bars, Artisanal Hazelnut Spread (Marou Spread), Roasted Cocoa Nibs. Praised by The New York Times as \u0027the best chocolate in the world,\u0027 this local Vietnamese gourmet chocolate brand uses premium cacao beans sourced from various provinces (such as Ti\u1ec1n Giang, L\u00e2m \u0110\u1ed3ng, B\u1ebfn Tre). Emphasizing a bean-to-bar artisanal process, its exquisite packaging blends traditional Vietnamese patterns with French romantic elegance, making it an iconic high-end edible gift.", "name": "Maison Marou Gourmet Chocolate (Maison Marou Ba \u0110\u00ecnh)", "transport": "Take bus 09A to Phan K\u1ebf B\u00ednh station and walk about 3 minutes."}, {"address": "140 P. Gi\u1ea3ng V\u00f5, Kim M\u00e3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 Stars | Must-buy list: Golden Dragon Mung Bean Cakes (B\u00e1nh \u0111\u1eadu xanh), Handmade Coconut Candy (K\u1eb9o d\u1eeba), Peanut Candy (K\u1eb9o l\u1ea1c). A direct factory outlet of a long-standing Hanoi confectionery manufacturer, preserving many traditional Northern Vietnamese nostalgia-inducing snacks. The mung bean cakes melt in your mouth and are delightfully sweet without being cloying, pairing perfectly with hot tea. The coconut candy offers a rich coconut aroma and chewy texture. With very affordable prices and a wide variety of items, it is loved by local families and regulars.", "name": "Hanoi Traditional Confectionery (B\u00e1nh M\u1ee9t K\u1eb9o H\u00e0 N\u1ed9i - Gi\u1ea3ng V\u00f5)", "transport": "Take bus BRT01 or 22A to Gi\u1ea3ng V\u00f5 station, then walk for 2 minutes."}, {"address": "5th Floor, Lotte Center, 54 P. Li\u1ec5u Giai, C\u1ed1ng V\u1ecb, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Must-buy list: \u0110\u00e0 L\u1ea1t Dried Mixed Vegetables \u0026 Fruits (Rau c\u1ee7 s\u1ea5y), Artichoke Herbal Tea (Tr\u00e0 Atis\u00f4), Handmade Passion Fruit Jam. A premium organic local specialty brand from \u0110\u00e0 L\u1ea1t, Vietnam\u0027s highland resort destination, featuring a flagship store inside Lotte Center Ba \u0110\u00ecnh. Products focus on natural and additive-free qualities; the dried fruits and vegetables are delightfully crispy, while Artichoke Tea is a hugely popular cooling health drink in Vietnam. Featuring modern packaging and superior quality, it is great for everyday snacking or gifting.", "name": "L\u0027angfarm Specialty Flagship Store (L\u0027angfarm Store - Li\u1ec5u Giai)", "transport": "Take bus 09A or 22A to Lotte Center station and head to the 5th floor of the shopping mall."}, {"address": "B1 Floor, Lotte Center, 54 P. Li\u1ec5u Giai, C\u1ed1ng V\u1ecb, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars | Must-buy list: Salt-Roasted Cashews with Skin (H\u1ea1t \u0111i\u1ec1u rang mu\u1ed1i), Handcrafted Drip Coffee Powder, Premium Ph\u00fa Qu\u1ed1c Fish Sauce. A high-end gourmet supermarket and specialty store offering a curated selection of Vietnam\u0027s finest agricultural products and delicate foods from across the nation. Here you can buy top-tier roasted skin-on cashews, organically grown Vietnamese pepper, and artisan-roasted phin drip coffee. With a comfortable shopping environment and clear labeling, it is ideal for tourists looking to buy high-quality local products in one go.", "name": "An Nam Gourmet (An Nam Gourmet - Ba \u0110\u00ecnh)", "transport": "Take bus 09A, 22A, or 32 to Lotte Center station and go to basement floor B1."}, {"address": "102 D2 P. Gi\u1ea3ng V\u00f5, Gi\u1ea3ng V\u00f5, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | Must-buy list: Traditional Handmade Green Rice Cakes (B\u00e1nh c\u1ed1m t\u01b0\u01a1i), Green Rice Candy (K\u1eb9o c\u1ed1m), Roasted Dried Green Rice. An authentic specialty shop in Ba \u0110\u00ecnh dedicated to traditional green rice products, committed to natural artisan methods without added colorings or preservatives. Filled with rich mung bean paste and coconut shreds, the green rice cakes offer a delightfully soft and chewy texture with a subtle natural aroma. Vacuum-sealed packaging is available for easy long-distance transport, making it the best choice for experiencing authentic Hanoi traditional desserts.", "name": "C\u1ed1m M\u1ed9c L\u00e0ng V\u00f2ng Traditional Handmade Green Rice Shop (C\u1ed1m M\u1ed9c L\u00e0ng V\u00f2ng - Gi\u1ea3ng V\u00f5)", "transport": "Take bus 18, 22A, or 23 to Gi\u1ea3ng V\u00f5 station and walk about 4 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "54 Li\u1ec5u Giai, C\u1ed1ng V\u1ecb, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | Must-Buy List: Marou artisanal chocolates, L\u0027Apothiquaire Vietnamese natural skin-care essential oils, Y\u00ean Concept signature ceramic mugs. Located inside an iconic twin-tower skyscraper in Ba Dinh District, it combines international luxury brands with high-end Vietnamese cultural and creative products. The basement supermarket is the best place to buy premium Vietnamese souvenirs, and the top floor features an ultra-high observation deck\u2014perfect for enjoying panoramic views of Hanoi after shopping.", "name": "Lotte Department Store Hanoi", "transport": "Take bus 09A or 144 to 54 Li\u1ec5u Giai stop, or take a taxi for about 7 minutes from Ba Dinh Square."}, {"address": "29 Li\u1ec5u Giai, Ng\u1ecdc Kh\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Must-Buy List: Boo original Vietnamese streetwear graphic tees, Cozy Vietnamese lotus tea, Uniqlo Vietnam-exclusive collaboration printed tote bags. Situated in the heart of Ba Dinh District, it is one of Hanoi\u0027s modern shopping landmarks. The mall houses numerous emerging local Vietnamese apparel brands and international fast fashion. With a bright and comfortable ambiance, the basement level also features a large supermarket and specialty dining, making it a favorite among local youth.", "name": "Vincom Center Metropolis", "transport": "Take bus 09A or 144 to 29 Li\u1ec5u Giai stop, then walk about 1 minute."}, {"address": "14 Li\u1ec5u Giai, C\u1ed1ng V\u1ecb, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars | Must-Buy List: Discounted Nike Air Max sneakers, Adidas Essentials hoodies, professional moisture-wicking past-season running t-shirts. Located on Li\u1ec5u Giai Street in Ba Dinh District, this factory outlet is a bargain paradise for sports enthusiasts in Hanoi. Offering year-round discounts from 30% to 70% off on past-season merchandise, it boasts fast inventory updates and guaranteed authenticity. Many travelers visit after shopping at Lotte Department Store to snap up great-value gear.", "name": "Nike \u0026 Adidas Factory Outlet Li\u1ec5u Giai", "transport": "About a 3-minute walk from Lotte Department Store."}, {"address": "43 V\u0103n Mi\u1ebfu, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 Stars | Must-Buy List: Ethnic minority embroidered handbags, hand-painted Vietnamese ceramic tea sets, natural plant-dyed woven scarves. Operated by a non-profit organization, this independent craft boutique is situated adjacent to the Imperial Citadel and the Temple of Literature. Working directly with various ethnic minority tribes in Vietnam, it provides fair-trade, exquisite handmade crafts. Every item is unique and labeled with the artisan\u0027s tribal background, offering superb quality and deep cultural heritage.", "name": "Craft Link Fair Trade Boutique", "transport": "About an 8-minute walk from the South Gate of the Imperial Citadel of Thang Long, or a 3-minute taxi ride."}, {"address": "28 \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 Stars | Must-Buy List: Handwoven rattan bags, Vietnamese coconut oil handmade soaps, deluxe Vietnamese drip coffee sets. Located on \u0110\u1ed9i C\u1ea5n Street in Ba Dinh District, this specialty lifestyle store caters to travelers seeking high-quality souvenirs. Featuring a Japanese-inspired curated aesthetic, the shop showcases a wide array of handcrafted rattan items, lacquerware, and natural organic skincare made by local Vietnamese artisans, all beautifully packaged.", "name": "Ajisai Hanoi Souvenir \u0026 Lifestyle Shop", "transport": "About a 10-minute walk from Ba Dinh Square, or take bus 09A to 28 \u0110\u1ed9i C\u1ea5n stop."}, {"address": "120 Kim M\u00e3, Kim M\u00e3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Must-Buy List: 100% pure handwoven silk scarves, custom tailored \u00c1o D\u00e0i silk fabrics, silk pajama sets. V\u1ea1n Ph\u00fac Village is the oldest and most renowned birthplace of silk in Vietnam. This boutique on Kim M\u00e3 Street in Ba Dinh District brings traditional handmade silk straight to the city center. The shop offers high-grade silk products in various colors and weaves with a light, silky-smooth texture at transparent, affordable prices.", "name": "V\u1ea1n Ph\u00fac Silk Boutique Kim M\u00e3", "transport": "Take bus 18, 32, or 34 to 120 Kim M\u00e3 stop."}, {"address": "25 Th\u1ee5y Khu\u00ea, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | Must-Buy List: Hanoi street imagery T-shirts, folklore and mythology illustrated postcards, mythical beast emblem tote bags. TiredCity is a highly acclaimed independent design brand in Vietnam. Partnering with numerous young local Vietnamese illustrators, it transforms Hanoi\u0027s iconic motorbike cascades, Vietnamese coffee culture, and ancient mythology into trendy fashion apparel and stationery. Products overflow with strong, fresh local vitality.", "name": "TiredCity Graphic Apparel \u0026 Arts", "transport": "About a 5-minute walk or taxi ride from the north side of Ba Dinh Square."}, {"address": "7-9 Nguy\u1ec5n V\u0103n Linh, Gia Th\u1ee5y, Long Bi\u00ean, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 Stars | Must-Buy List: Discounted Levi\u0027s jeans, Puma athletic lifestyle shoes, NinoMaxx (local Vietnamese brand) casual shirts. As a massive suburban outlet center and shopping mall near Hanoi\u0027s city core, it gathers clearance outlets for major international and local Vietnamese apparel brands. Featuring year-round clearance discount zones and a huge variety of products, it is perfect for bulk shopping budget-friendly clothing.", "name": "Savico Megamall Outlet Center", "transport": "Take a taxi across Ch\u01b0\u01a1ng D\u01b0\u01a1ng Bridge from Ba Dinh Square; takes about 15 to 20 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Ba Dinh Square and the Imperial Citadel of Thang Long Area"}, "cau_giay_my_dinh": {"categories": {"cat_1": {"items": [{"address": "136 C\u1ea7u Gi\u1ea5y, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | Must-Buy List: Cocoon Vietnamese Pomelo Hair Tonic, Thorakao Turmeric Acne Cream, Vedette Natural Clay Mask. Cocolux is a local chain beauty store highly favored by young Vietnamese consumers. The Cau Giay branch is spacious and bright, featuring a vast collection of local Vietnamese organic and botanical beauty brands at highly competitive prices. Notably, it stocks the complete line of products from Cocoon, Vietnam\u0027s leading local skincare brand. It\u0027s the perfect spot for travelers looking for high value-for-money Hanoi skincare items.", "name": "Cocolux Cau Giay", "transport": "Take Hanoi Metro Line 2A to C\u1ea7u Gi\u1ea5y Station, then walk about 5 minutes."}, {"address": "182 C\u1ea7u Gi\u1ea5y, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 Stars | Must-Buy List: Lemonade Dual-Ended Matte Lip Tint, Emmi\u00e9 by Happy Skin Peeling Serum, Cocoon Coffee Body Scrub. Hasaki is a leading, rapidly growing beauty and skincare chain in Vietnam. The Cau Giay store is huge, featuring a dedicated professional skincare consultation area. It includes a special \u0027Local Vietnamese Brands\u0027 section where you can find Lemonade beauty products created by a famous Vietnamese influencer. Their long-lasting lipsticks and base makeup, formulated specifically for Southeast Asia\u0027s hot and humid climate, are exceptionally popular among local young women.", "name": "Hasaki Beauty \u0026 Clinic Cau Giay", "transport": "Take Bus No. 26, 32, or 34 to 165 C\u1ea7u Gi\u1ea5y Stop, then walk 1 minute."}, {"address": "126 C\u1ea7u Gi\u1ea5y, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Must-Buy List: Of\u00e9lia Velvet Lip Tint, Lemonade Sunscreen Primer, Thorakao Plantain Hand Cream. Sammi Shop is an iconic beauty chain in Hanoi, immensely popular among college students and young professionals. Located near several university campuses, the Cau Giay branch restocks trendy items rapidly. Alongside best-selling Korean beauty products, it exclusively introduces emerging local independent brands like Of\u00e9lia, offering counter-quality packaging at affordable prices. It\u0027s a fantastic spot for picking up gifts.", "name": "Sammi Shop Cau Giay", "transport": "Take a Grab car or motorbike to 126 C\u1ea7u Gi\u1ea5y Main Street, located near C\u1ea7u Gi\u1ea5y Metro Station."}, {"address": "235 Xu\u00e2n Th\u1ee7y, D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 Stars | Must-Buy List: Th\u00e1i D\u01b0\u01a1ng Herbal Anti-Hair Loss Shampoo, Biona Turmeric Herbal Pearl Cream, Ophtalmo Cooling Eye Drops. Pharmacity is Vietnam\u0027s largest modern pharmacy chain, offering not only pharmaceuticals but also a rich selection of herbal health and beauty care products. The Xuan Thuy branch is clean and bright, with friendly staff. You can find traditional, established Vietnamese heritage brands like Th\u00e1i D\u01b0\u01a1ng herbal shampoo and turmeric cream\u2014all natural, affordable, and household staples in Vietnam.", "name": "Pharmacity Xuan Thuy Cau Giay", "transport": "Take Hanoi Metro Line 3 to National University Station, then walk about 3 minutes."}, {"address": "198 C\u1ea7u Gi\u1ea5y, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 Stars | Must-Buy List: White Tiger Balm, Sao Th\u00e1i D\u01b0\u01a1ng Herbal Whitening Cream, Thorakao Coconut Oil Body Cream. Long Chau Pharmacy is a trusted pharmacy chain under Vietnam\u0027s renowned FPT Group, well-known for its comprehensive product range and fair pricing. The Cau Giay branch stocks an extensive array of local medicated cosmetics and traditional herbal health supplements. Authentic items like White Tiger Balm and classic turmeric skincare are guaranteed, making it a popular spot for foreign tourists to buy local herbal balms in bulk.", "name": "FPT Long Chau Pharmacy Cau Giay", "transport": "Take Bus No. 09B, 16, or 20A to C\u1ea7u Gi\u1ea5y Station, then walk 2 minutes."}, {"address": "T\u1ea7ng B1, The Loop Shopping Center, 241 Xu\u00e2n Th\u1ee7y, D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars | Must-Buy List: Guardian Vietnam-Exclusive Charcoal Centella Mask, Silkygirl Oil-Control Loose Powder, Cocoon Botanical Micellar Water. Located inside The Loop (formerly Indochina Plaza) at the border of My Dinh and Cau Giay, Guardian is a major health and beauty retail chain in Southeast Asia. This branch is neatly organized with a dedicated section for anti-acne and oil-control beauty products tailored for Southeast Asian weather. The store frequently runs Buy 1 Get 1 Free deals or exclusive discount bundles, making it easy to grab local Vietnamese brands and Southeast Asian cosmetics all at once.", "name": "Guardian The Loop Shopping Center", "transport": "Take Hanoi Metro Line 3 to National University Station; the exit connects directly to the basement of The Loop Shopping Center."}, {"address": "T\u1ea7ng 1, The Loop Shopping Center, 241 Xu\u00e2n Th\u1ee7y, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Must-Buy List: Cocoon Coconut Lip Scrub, L\u0027Oreal Vietnam-Exclusive Lightweight Sunscreen, Merzy Warm Velvet Lip Tint. Beauty Box is a major high-end beauty multi-brand store in Vietnam known for its chic and avant-garde style. The Loop store features a spacious try-on area and on-site makeup artist consultations. It brings together top-selling Southeast Asian brands and Vietnam\u0027s premium local vegan brand, Cocoon. Their coconut lip care series is highly recommended for gifts thanks to its natural ingredients and rich Vietnamese coconut aroma.", "name": "Beauty Box The Loop Shopping Center", "transport": "Take Metro Line 3 to National University Station, then walk 2 minutes to enter the 1st floor of The Loop Shopping Center."}, {"address": "T\u1ea7ng 1, The Loop Shopping Center, 241 Xu\u00e2n Th\u1ee7y, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | Must-Buy List: Anessa Vietnam-Exclusive Mild Sunscreen Value Set, Melano CC Whitening Essence, MK Customer Private Label Sensitive Skin Lotion. Located inside The Loop Shopping Center in the heart of Cau Giay commercial district, Japan\u0027s renowned drugstore Matsumoto Kiyoshi brings high-standard service and product selection. Alongside top-selling Japanese skincare items, it specially imports high-efficiency sunscreens and whitening products suitable for Vietnam\u0027s local climate. Bright and comfortable, it\u0027s a great place to find quality sun protection and personal care essentials.", "name": "Matsumoto Kiyoshi The Loop", "transport": "Take Metro Line 3 to National University Station, then walk to the 1st floor of The Loop Shopping Center."}], "name": "Local Representative Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "303 C\u1ea7u Gi\u1ea5y, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Must-Buy List: Tailored women\u0027s blazers, French-style printed chiffon dresses, and slimming high-waisted trousers. IVY moda is an iconic Vietnamese fashion brand specializing in urban commuter and casual wear tailored specifically for Asian women\u0027s body types. The C\u1ea7u Gi\u1ea5y store is spacious and bright with modern displays. Renowned for precise tailoring and high-quality, breathable, comfortable fabrics, it is a top choice for Hanoi\u0027s white-collar women and fashion lovers shopping for work outfits and date dresses.", "name": "IVY moda Women\u0027s Fashion (IVY moda C\u1ea7u Gi\u1ea5y)", "transport": "Take Hanoi Metro Line 2A or a bus to C\u1ea7u Gi\u1ea5y Station, then walk about 5 minutes."}, {"address": "355 C\u1ea7u Gi\u1ea5y, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Must-Buy List: Minimalist genuine leather heels, versatile square handbags, and elegant pointed flats. JUNO is a famous local footwear and bag brand in Vietnam, known for great value, trendy designs, and exceptional comfort. Located on C\u1ea7u Gi\u1ea5y fashion street, this store offers an extensive selection of shoes and bags\u2014from daily commuter leather shoes to party heels and casual bags. It\u0027s a favorite among local young women looking for high-quality yet affordable accessories.", "name": "JUNO Shoes \u0026 Bags (JUNO C\u1ea7u Gi\u1ea5y)", "transport": "Take bus 09B, 16, or 20A to the 370 C\u1ea7u Gi\u1ea5y stop; the store is directly across the street."}, {"address": "271 C\u1ea7u Gi\u1ea5y, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Must-Buy List: Biti\u0027s Hunter Street vintage sneakers, Vietnam limited-edition lightweight running shoes, and comfortable non-slip sandals. Known as Vietnam\u0027s national footwear brand, Biti\u0027s sparked a craze across Southeast Asia with its Hunter series sneakers. The C\u1ea7u Gi\u1ea5y flagship store features a complete line of shoes combining excellent fit, shock absorption, and trendy street style\u2014all at very affordable prices. It\u0027s a must-visit local footwear shopping destination when traveling in Hanoi.", "name": "Biti\u0027s National Footwear Store (Biti\u0027s C\u1ea7u Gi\u1ea5y)", "transport": "Take bus 26, 32, or 34 to the 271 C\u1ea7u Gi\u1ea5y bus stop."}, {"address": "27 C\u1ea7u Gi\u1ea5y, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Must-Buy List: Slim-fit cotton-linen casual trousers, minimalist pure cotton T-shirts, and indie-style button-down long-sleeve shirts. Routine is a local Vietnamese apparel brand beloved by youth and university students, advocating \u0027everyday quality style.\u0027 The brand blends modern minimalism with Western cuts, using highly breathable natural cotton and linen fabrics ideal for Hanoi\u0027s hot summers. This flagship store in C\u1ea7u Gi\u1ea5y offers both men\u0027s and women\u0027s clothing in a stylishly designed shopping environment.", "name": "Routine Men\u0027s \u0026 Women\u0027s Fashion (Routine C\u1ea7u Gi\u1ea5y)", "transport": "Take the Metro to C\u1ea7u Gi\u1ea5y Station and walk about 3 minutes after exiting."}, {"address": "128 Xu\u00e2n Th\u1ee7y, D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Must-Buy List: Elegant patent leather flats, quilted chain bags, and urban commuter medium totes. VASCARA is a top Vietnamese boutique brand for shoes, bags, and accessories, famous for fine handcrafted details and trendy international designs. Located in the Xu\u00e2n Th\u1ee7y university district, this branch is hugely popular with local students and young professionals. Its genuine leather bags and women\u0027s shoes rival international designer brands in quality but at budget-friendly prices, making it a hotspot for tasteful gifts or self-treats.", "name": "VASCARA Shoe \u0026 Bag Boutique (VASCARA Xu\u00e2n Th\u1ee7y)", "transport": "Take Hanoi Metro Line 3 to Xu\u00e2n Th\u1ee7y Station, then walk about 2 minutes."}, {"address": "175 C\u1ea7u Gi\u1ea5y, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Must-Buy List: Everyday Polo cooling shirts, lightweight windproof hooded jackets, and high-stretch wrinkle-resistant casual pants. YODY is a rapidly rising national casual wear brand in Vietnam, focusing on high-performance fabrics and ultra-comfortable clothing for all ages. The store is spacious with friendly service. Its proprietary tech-cooling fabrics and eco-friendly bamboo fiber series are highly praised by locals, making it an excellent spot for high-quality everyday basics.", "name": "YODY Casual Wear Flagship Store (YODY C\u1ea7u Gi\u1ea5y)", "transport": "Take bus 09B, 16, 20A, or 26 to the 165 C\u1ea7u Gi\u1ea5y stop and walk 1 minute."}, {"address": "250 C\u1ea7u Gi\u1ea5y, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.7 stars | Must-Buy List: French retro party cocktail dresses, signature asymmetrical off-shoulder tops, and high-waisted fringe romantic maxi skirts. Elpis Clothing is a renowned independent designer brand in Vietnam, famous for feminine charm, 3D tailoring, and uniquely elegant aesthetics. Many Vietnamese celebrities and influencers are loyal fans. The C\u1ea7u Gi\u1ea5y store features a modern gallery atmosphere, showcasing stylish, highly distinctive pieces perfect for women seeking unique party and date night outfits.", "name": "Elpis Clothing Independent Designer Wear (Elpis Clothing C\u1ea7u Gi\u1ea5y)", "transport": "Take bus 26, 32, or 34 to the stop opposite 240 C\u1ea7u Gi\u1ea5y."}, {"address": "203 C\u1ea7u Gi\u1ea5y, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Must-Buy List: Artisan pencil skirts, lace-trimmed elegant dresses, and French chic cropped jackets. NEM Fashion is a long-established, iconic high-end women\u0027s fashion brand in Vietnam that perfectly blends French elegance with tailored fits for Asian women. The C\u1ea7u Gi\u1ea5y branch showcases a wide range of slim-fit suits, elegant dresses, and premium office wear. Known for fine fabrics and rigorous craftsmanship, it is a classic destination for local middle-class women and business professionals buying formal and occasion wear.", "name": "NEM Fashion Artisan Women\u0027s Wear (NEM Fashion C\u1ea7u Gi\u1ea5y)", "transport": "Take bus 09B, 16, or 26 and get off at the 203 C\u1ea7u Gi\u1ea5y bus stop right in front."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "36 Alley 63 Tran Quoc Vuong, Dich Vong Hau, Cau Giay, Hanoi", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade Green Rice Cakes (B\u00e1nh C\u1ed1m), Stir-Fried Green Rice (C\u1ed1m X\u00e0o), Fresh Green Rice (C\u1ed1m T\u01b0\u01a1i). V\u00f2ng Village in C\u1ea7u Gi\u1ea5y District is the birthplace of Hanoi\u0027s famous young green rice treats (C\u1ed1m)! B\u00e0 Ho\u1ea3n is a traditional, century-old handcrafted brand. Using carefully selected seasonal young glutinous rice mixed with shredded coconut and mung bean filling, their cakes boast a chewy texture with a rich rice aroma and zero preservatives. It\u0027s a top-tier traditional souvenir you can\u0027t miss when visiting C\u1ea7u Gi\u1ea5y!", "name": "B\u00e0 Ho\u1ea3n Traditional Green Rice Cake Shop (B\u00e1nh C\u1ed1m L\u00e0ng V\u00f2ng B\u00e0 Ho\u1ea3n)", "transport": "Take Hanoi Metro Line 3 to C\u1ea7u Gi\u1ea5y Station, then transfer to a Grab for about 5 minutes."}, {"address": "88 Tran Thai Tong, Dich Vong, Cau Giay, Hanoi", "feature": "\u2b50 4.5 stars | Must-Buy List: Salted Dracontomelon Preserves (\u00d4 Mai S\u1ea5u), Sweet \u0026 Sour Spicy Apricot Preserves (\u00d4 Mai M\u01a1 X\u00ed Mu\u1ed9i), Perilla Apricot Preserves (\u00d4 Mai M\u01a1 T\u00eda T\u00f4). As Vietnam\u0027s premier national brand for preserved fruits (\u00d4 Mai), H\u1ed3ng Lam\u0027s flagship store in C\u1ea7u Gi\u1ea5y is a top choice for Hanoians during festive gifting. The store uses secret traditional techniques to preserve local dracontomelon (S\u1ea5u) and apricots, delivering a delicious balance of sweet, sour, salty, and savory flavors. Beautifully packaged, these make excellent office treats to bring back home.", "name": "H\u1ed3ng Lam Preserved Fruits Store (\u00d4 Mai H\u1ed3ng Lam - Tr\u1ea7n Th\u00e1i T\u00f4ng)", "transport": "Take a taxi for about 6 minutes from Metro Line 3 C\u1ea7u Gi\u1ea5y Station to arrive on the main street of Tr\u1ea7n Th\u00e1i T\u00f4ng."}, {"address": "222 Tran Duy Hung, Trung Hoa, Cau Giay, Hanoi", "feature": "\u2b50 4.4 stars | Must-Buy List: Garlic Salted Cashews (H\u1ea1t \u0110i\u1ec1u Ch\u00e1y T\u1ecfi), Da Nang Baked Coconut Crackers (B\u00e1nh D\u1eeba N\u01b0\u1edbng), Vietnamese Highland Artichoke Tea (Tr\u00e0 Atis\u00f4). Located on the border of C\u1ea7u Gi\u1ea5y and Nam T\u1eeb Li\u00eam, Tops Market (formerly Big C Th\u0103ng Long) is one of Hanoi\u0027s largest hypermarkets. It features a massive \u0027Vietnamese Specialty Souvenirs Section\u0027 with an extensive selection at budget-friendly prices\u2014making it the ultimate one-stop shop for tourists stocking up on cashews, dried fruits, coffee, and local snacks.", "name": "Tops Market Th\u0103ng Long (Formerly Big C Th\u0103ng Long)", "transport": "Take bus routes 50 or 60A and get off directly at 222 Tr\u1ea7n Duy H\u01b0ng stop."}, {"address": "52 Tran Duy Hung, Trung Hoa, Cau Giay, Hanoi", "feature": "\u2b50 4.6 stars | Must-Buy List: Legend Drip Coffee Gift Box, G7 Cappuccino Coconut, Classic No.8 Coffee Beans. Trung Nguy\u00ean is Vietnam\u0027s premier local coffee giant, and its branch in the Trung H\u00f2a area of C\u1ea7u Gi\u1ea5y boasts an elegant, spacious setting. In addition to savoring authentic Vietnamese drip coffee on-site, you\u0027ll find a dedicated gift display area. The luxuriously packaged Legend coffee beans and uniquely flavored instant coffees make sophisticated gifts for elders or business partners.", "name": "Trung Nguy\u00ean Legend Caf\u00e9 Flagship Store (Tr\u1ea7n Duy H\u01b0ng)", "transport": "Take bus routes 60A or 107 to 52 Tr\u1ea7n Duy H\u01b0ng stop, then walk about 1 minute."}, {"address": "B1 Floor, Vincom Center Tran Duy Hung, Cau Giay, Hanoi", "feature": "\u2b50 4.4 stars | Must-Buy List: Vinamit Mixed Dried Fruits, Marou Artisanal Vietnamese Chocolate, TH True Milk Coconut Sandwich Biscuits. Located on the B1 level of the modern Vincom Center shopping mall, WinMart offers a clean, bright shopping environment featuring carefully selected premium local brands. Highly recommended are Marou chocolates\u2014hailed as Vietnam\u0027s national pride\u2014and various low-temperature baked, additive-free dried mangoes and bananas, highly popular among young women and family travelers.", "name": "WinMart Supermarket (Vincom Center Tr\u1ea7n Duy H\u01b0ng)", "transport": "Take Metro Line 2A to L\u00e1ng Station, then transfer to a Grab for about 5 minutes to reach Vincom Center."}, {"address": "154 Nguyen Khanh Toan, Quan Hoa, Cau Giay, Hanoi", "feature": "\u2b50 4.8 stars | Must-Buy List: Authentic West Lake Fresh Scented Lotus Tea (Tr\u00e0 Sen \u01af\u1edbp T\u01b0\u01a1i), Ginger Molasses Cake (B\u00e1nh Ch\u00e8 Lam), North Vietnamese Jasmine Green Tea. Located on Nguy\u1ec5n Kh\u00e1nh To\u00e0n Street in C\u1ea7u Gi\u1ea5y District, this gift shop specializes in high-end North Vietnamese specialty teas and traditional handcrafted pastries. Their signature lotus tea infuses premium Th\u00e1i Nguy\u00ean green tea multiple times with real West Lake lotus blossoms, producing an elegant, long-lasting floral fragrance. Paired with aromatic, ginger-spiced B\u00e1nh Ch\u00e8 Lam, it perfectly captures the elegant tea culture of old Hanoi.", "name": "West Lake Lotus Tea \u0026 Hanoi Specialties Store (Tr\u00e0 Sen T\u00e2y H\u1ed3 \u0026 \u0110\u1eb7c S\u1ea3n H\u00e0 N\u1ed9i - Nguy\u1ec5n Kh\u00e1nh To\u00e0n)", "transport": "Take bus routes 38 or 09B and get off directly at 154 Nguy\u1ec5n Kh\u00e1nh To\u00e0n stop."}, {"address": "1st Floor, Keangnam Hanoi Landmark Tower, Pham Hung, Nam Tu Liem, Hanoi", "feature": "\u2b50 4.3 stars | Must-Buy List: Viet-Korea Fusion Soft Dried Mango, Wasabi Cashews, Specialty Vietnamese Coconut Coffee Mix. M\u1ef9 \u0110\u00ecnh is Hanoi\u0027s famous Koreatown, and K-Market is the largest supermarket chain in the area. Here you\u0027ll find uniquely blended Viet-Korean gift products\u2014such as premium Vietnamese dried mango made using low-sugar Korean processing techniques, uniquely seasoned nuts, and convenient portable Vietnamese coffee sachets\u2014all boasting top-notch packaging and quality.", "name": "K-Market M\u1ef9 \u0110\u00ecnh Koreatown (K-Market Keangnam)", "transport": "Take bus routes 21B, 29, or 33 and get off at Keangnam Landmark 72 Tower stop."}, {"address": "44 Alley 86 Chua Ha, Quan Hoa, Cau Giay, Hanoi", "feature": "\u2b50 4.6 stars | Must-Buy List: Freshly Made Conjugal Cake (B\u00e1nh Xu S\u00ea C\u1ed1m), Crispy Dried Green Rice (C\u1ed1m S\u1ea5y Kh\u00f4), Green Rice Pork Sausage (Ch\u1ea3 C\u1ed1m). Tucked away in a traditional alley in C\u1ea7u Gi\u1ea5y District, this beloved local workshop insists on making fresh batches daily by hand. Besides purchasing the freshest green rice, their signature \u0027Conjugal Cake (B\u00e1nh Xu S\u00ea)\u0027 features a chewy, translucent skin wrapped around a rich green rice and coconut filling. A traditional treat for Vietnamese weddings and celebrations, it reflects genuine Hanoi charm and local heritage.", "name": "Huy Linh Traditional Green Rice Workshop (C\u1ed1m T\u01b0\u01a1i L\u00e0ng V\u00f2ng Huy Linh)", "transport": "Take Hanoi Metro Line 3 to C\u1ea7u Gi\u1ea5y Station, then walk or take a Grab for about 3 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "\u0110. M\u1ec5 Tr\u00ec, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy List: Out-of-season discounted clothing from imported Korean brands, high-end local Vietnamese tea gift sets, and signature Korean snacks. Located in the heart of the M\u1ef9 \u0110\u00ecnh Korean enclave, this European castle-style complex combines international brands with a dedicated Korean off-season outlet zone. The basement sale area frequently offers fantastic discounts on affordable sportswear and designer apparel, making it a beloved shopping spot for both locals and expats living nearby.", "name": "The Garden Shopping Center", "transport": "Take bus 29, 33, or 50 to K\u0110T M\u1ec5 Tr\u00ec station, then walk about 3 minutes."}, {"address": "Tr\u1ea7n Duy H\u01b0ng, Trung H\u00f2a, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Vietnam-exclusive UT collaboration T-shirts from Uniqlo, seasonal sale bags from Charles \u0026 Keith, and premium Vietnamese coffee beans from Annam Gourmet. A signature modern high-end landmark mall in C\u1ea7u Gi\u1ea5y district, housing many international fashion brands and premium Vietnamese boutiques. The mall is spacious and bright, with pop-up outlet events frequently hosted in the central atrium, offering surprising bargains of up to 50% off.", "name": "Vincom Center Tr\u1ea7n Duy H\u01b0ng", "transport": "Take bus 22A, 35A, or 50 to 113 Tr\u1ea7n Duy H\u01b0ng station."}, {"address": "181 Tr\u1ea7n Duy H\u01b0ng, Trung H\u00f2a, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Must-Buy List: Cooling UV protection jackets, Vietnamese cotton heat-resistant T-shirts, and discounted cooling underwear. Canifa is Vietnam\u0027s most famous local affordable casual wear giant. This C\u1ea7u Gi\u1ea5y branch features a permanent OUTLET section offering discounts as low as 50% to 70% off. Their UV protection jackets and high-grade pure cotton lines are designed for Southeast Asia\u0027s hot climate, making them must-buy Vietnamese apparel items for tourists.", "name": "Canifa Flagship \u0026 Outlet Tr\u1ea7n Duy H\u01b0ng", "transport": "Take bus 22A or 35A to 181 Tr\u1ea7n Duy H\u01b0ng station."}, {"address": "116 C\u1ea7u Gi\u1ea5y, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Must-Buy List: Slim-fit business shirts, lightweight bamboo fiber POLO shirts, and discounted casual suit pants. Torano is an iconic local menswear brand in Vietnam. This C\u1ea7u Gi\u1ea5y store features a large OUTLET discount area offering high-value casual and business menswear. Most fabrics utilize cooling bamboo fiber and high-stretch materials suited for tropical climates, highly favored by local professionals.", "name": "Torano Outlet C\u1ea7u Gi\u1ea5y", "transport": "Take bus 09B, 16, or 20A to 116 C\u1ea7u Gi\u1ea5y station."}, {"address": "133 Xu\u00e2n Th\u1ee7y, D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: Minimalist linen short-sleeve shirts, slim-fit cropped casual pants, and original Vietnamese design canvas bags. Routine is a local original fashion brand favored by young Vietnamese white-collar workers, advocating a minimalist style with everyday design flair. The Xu\u00e2n Th\u1ee7y store is bright and airy, with clothing tailored specifically for Asian body shapes. The linen and cotton-linen blends offer excellent quality at affordable prices, making it a top choice for purchasing Vietnamese designer apparel.", "name": "Routine Xu\u00e2n Th\u1ee7y", "transport": "Take bus 16, 20A, 26, or 34 to 133 Xu\u00e2n Th\u1ee7y station."}, {"address": "70 C\u1ea7u Gi\u1ea5y, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy List: Morandi-toned oversized shirts, textured leather crossbody pouches, and original design baseball caps. SSStutter is a hugely popular independent designer brand in Hanoi advocating a refined living aesthetic. The store decor is filled with minimalist hipster vibes, offering sleekly tailored clothing at accessible prices with exquisite quality. It attracts many young travelers looking for stylish, high-quality outfits.", "name": "SSStutter C\u1ea7u Gi\u1ea5y", "transport": "Take bus 09B, 16, or 20A to 70 C\u1ea7u Gi\u1ea5y station."}, {"address": "247 C\u1ea7u Gi\u1ea5y, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-Buy List: T-shirts created in collaboration with Vietnamese illustrators, postcards with traditional deity elements, and Hanoi-style digital art stickers. TiredCity is Vietnam\u0027s most famous original local creative brand. Collaborating with emerging Vietnamese illustrators, it blends Hanoi street food and folklore mythology into trendy, high-quality apparel and stationery accessories, serving as a treasure trove of authentic local souvenirs.", "name": "TiredCity C\u1ea7u Gi\u1ea5y", "transport": "Take bus 09B, 16, or 26 to 247 C\u1ea7u Gi\u1ea5y station."}, {"address": "126 Xu\u00e2n Th\u1ee7y, D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: Cocoon Vietnamese winter melon facial cleanser, Cocoon coffee body scrub, and Lemonade double-ended lip tint. Sammi Shop is one of the largest and best-known chain beauty stores in Vietnam. The C\u1ea7u Gi\u1ea5y branch carries a complete selection of popular local organic botanical beauty brand Cocoon and trendy makeup brand Lemonade. Featuring natural ingredients and budget-friendly prices, it is the perfect spot to pick up authentic Vietnamese skincare products.", "name": "Sammi Shop Xu\u00e2n Th\u1ee7y", "transport": "Take bus 16, 20A, 26, or 34 to 126 Xu\u00e2n Th\u1ee7y station."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Cau Giay and My Dinh Modern Commercial District"}, "dong_da": {"categories": {"cat_1": {"items": [{"address": "72 Ch\u00f9a B\u1ed9c, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-Buy List: Cocoon Winter Melon Makeup Remover, Lemonade Matte Lip Tint, Emmi\u00e9 by Happy Skin Peeling Serum. Mint Cosmetics is one of Hanoi\u0027s most iconic local cosmetics chains. Founded in Hanoi with the motto \"Save The Best For You\", this spacious flagship location on Ch\u00f9a B\u1ed9c\u2014the prime shopping street for cosmetics in \u0110\u1ed1ng \u0110a District\u2014boasts an extraordinarily complete inventory. In addition to carrying international bestsellers, it is celebrated for supporting emerging Vietnamese brands like Cocoon (Vietnam\u0027s premier vegan beauty brand) and Lemonade (founded by a famous Vietnamese makeup artist). With bright, clean interiors, fully stocked testers, and friendly, knowledgeable staff, it\u0027s a go-to spot for local young women and travelers hunting for top-quality Vietnamese cosmetics.", "name": "Mint Cosmetics - Ch\u00f9a B\u1ed9c Branch", "transport": "Take bus 12, 21A, 23, 26, or 35A to the 71 Ch\u00f9a B\u1ed9c stop, then walk about 1 minute. Alternatively, take a 7-minute Grab bike ride from the Temple of Literature."}, {"address": "246 Ch\u00f9a B\u1ed9c, Trung Li\u1ec7t, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Must-Buy List: C\u1ecf M\u1ec1m Lip Balm (Son D\u01b0\u1ee1ng C\u1ecf M\u1ec1m), Green Tea \u0026 Centella Anti-Acne Herbal Cream, Pomelo Peel Hair Strengthening Shampoo. C\u1ecf M\u1ec1m is a highly famous and trusted Vietnamese brand specializing in handmade natural herbal cosmetics and skincare, championing non-toxic, organic, and eco-friendly principles. The brand insists on using local Vietnamese natural ingredients like pomelo peel, centella (gotu kola), caffeine, and coconut oil to craft skincare lines tailored for Asian skin and climate. The store features cozy wooden accents and soothing herbal aromas, offering a very relaxing shopping environment. Their classic lip balms and natural herbal soaps are affordable yet elegantly packaged, making them fantastic high-quality Hanoi souvenirs for friends and family.", "name": "C\u1ecf M\u1ec1m Homelab - Ch\u00f9a B\u1ed9c Branch", "transport": "Take bus 12, 21A, 26, or 35A to the 239 Ch\u00f9a B\u1ed9c stop; it\u0027s right across the street. Or take a 5-minute taxi ride from C\u00e1t Linh Metro Station."}, {"address": "134 T\u00f4n \u0110\u1ee9c Th\u1eafng, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: Turmeric Whitening \u0026 Acne Cream (Kem Ngh\u1ec7 Thorakao), Pomelo Essential Hair Spray (X\u1ecbt D\u01b0\u1ee1ng T\u00f3c V\u1ecf B\u01b0\u1edfi), Cucumber Facial Cleanser. Founded in 1961, Thorakao is Vietnam\u0027s beloved heritage cosmetics brand\u2014virtually every Vietnamese person\u0027s \"grandmother\u0027s holy grail skincare solution.\" Located near the Temple of Literature historic area, the store showcases classic products wrapped in vintage charm. For decades, the brand has insisted on using traditional Vietnamese botanical extracts\u2014especially turmeric, pomelo peel, aloe vera, and cucumber. Its turmeric cream is legendary across Vietnam for fading acne scars and brightening skin, all at astonishingly affordable prices. It\u0027s a must-visit cultural and shopping stop for travelers keen on discovering historic local cosmetics and great-value traditional skincare recipes.", "name": "Thorakao Vintage Vietnamese Beauty Store - T\u00f4n \u0110\u1ee9c Th\u1eafng Showroom", "transport": "Walk south from the Temple of Literature entrance along T\u00f4n \u0110\u1ee9c Th\u1eafng Street for about 5 minutes (around 400 meters). Very convenient access."}, {"address": "65 Ch\u00f9a B\u1ed9c, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Cocoon Vietnamese Coffee Body Scrub, Klairs Supple Preparation Facial Toner, Skin1004 Centella Ampoule. Originating in Hanoi, North Vietnam, Sammi Shop is a massive beauty retail chain popular nationwide. This spacious flagship store on Ch\u00f9a B\u1ed9c in \u0110\u1ed1ng \u0110a District is known for its extensive selection of Southeast Asian, Japanese, and Korean beauty products. It features a dedicated section for Cocoon, the viral Vietnamese vegan skincare brand, where you can grab trendy coffee scrubs and turmeric serums all at once. Frequent promotions and highly competitive pricing make it a favorite among university students and young professionals, offering a vibrant glimpse into Hanoi\u0027s contemporary beauty shopping culture.", "name": "Sammi Shop Cosmetics Flagship Store - Ch\u00f9a B\u1ed9c", "transport": "Take bus 12, 21A, 26, 35A, or 44 to the 104 Ch\u00f9a B\u1ed9c stop; it\u0027s right across the street. About an 8-minute drive from the Temple of Literature."}, {"address": "19 Ch\u00f9a B\u1ed9c, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Must-Buy List: Gilaa Saffron Brightening Mask, Merzy Slim Eyeliner, Cocoon Betel Nut Anti-Acne Serum. Th\u1ebf Gi\u1edbi SkinFood (\u0027World of SkinFood\u0027) is a trendy drugstore and beauty chain beloved by young locals in Vietnam. The Ch\u00f9a B\u1ed9c branch in \u0110\u1ed1ng \u0110a District features a bright, minimalist aesthetic and focuses on curating skincare and affordable makeup tailored to Asian skin types. In addition to a rich variety of Korean and emerging Vietnamese brands, it offers interactive tester counters, clear pricing, and frequent discount vouchers. It\u2019s an excellent spot for travelers looking to compare Vietnamese local beauty gems with Asian beauty trends.", "name": "Th\u1ebf Gi\u1edbi SkinFood Beauty Store - Ch\u00f9a B\u1ed9c", "transport": "Take bus 12, 21A, 26, or 35A to the Ch\u00f9a B\u1ed9c intersection stop, then walk 2 minutes; or walk about 10 minutes from Th\u00e1i H\u00e0 Metro Station."}, {"address": "169 Ch\u00f9a B\u1ed9c, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Must-Buy List: Bioderma Sensibio H2O Micellar Water, Cocoon Pomelo Hair Repair Shampoo, La Roche-Posay Cicaplast Baume B5. Hasaki is a major, trusted beauty and pharmacy chain in Vietnam. The Ch\u00f9a B\u1ed9c branch combines cosmetics retail with professional skincare consultation services. The store carries a vast range of goods, from dermocosmetics and health supplements to local Vietnamese vegan makeup. Offering 100% authentic products with transparent pricing and enticing discounts, its well-trained staff provide helpful, professional advice, making it a go-to choice for locals buying daily personal care and cosmetics products.", "name": "Hasaki Beauty \u0026 Clinic - Ch\u00f9a B\u1ed9c", "transport": "Take bus 12, 21A, 26, 35A, or 44 and get off directly at the bus stop in front of the Ch\u00f9a B\u1ed9c store; walk about 5 minutes from the university area in \u0110\u1ed1ng \u0110a District."}, {"address": "152 Ch\u00f9a B\u1ed9c, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Must-Buy List: Lemonade Dual-Ended Cushion Lip Tint, Silkygirl No Sebum Powder, Of\u00e9lia Velvet Lip Cream. Beauty Garden is a Vietnamese multi-brand beauty retail chain, and this branch sits right on Ch\u00f9a B\u1ed9c\u2014\u0110\u1ed1ng \u0110a\u0027s busiest cosmetics shopping strip. The major highlight of this store is its wide selection of trending makeup from Southeast Asia, particularly Vietnamese indie brands like Of\u00e9lia and Lemonade, alongside bestsellers from Thailand and Malaysia. For shoppers wanting to test out signature cosmetics created by famous Vietnamese influencers and makeup artists, this is an affordable, must-visit wonderland for sampling and shopping.", "name": "Beauty Garden Cosmetics Store - Ch\u00f9a B\u1ed9c", "transport": "Take bus 12, 21A, 26, or 35A to Ch\u00f9a B\u1ed9c station, then walk about 1 minute. Takes about 10 minutes by Grab from Hanoi Railway Station."}, {"address": "Vincom Center Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch, 2 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch, Kim Li\u00ean, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Must-Buy List: Cocoon Coffee Face Polish, Cocoon Pomelo Hair Tonic Mist, Cocoon Winter Melon Anti-Acne Toner. Cocoon is Vietnam\u0027s premier 100% vegan and cruelty-free cosmetics brand. Located inside the Guardian store at Vincom Center Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch in \u0110\u1ed1ng \u0110a District, this brand counter showcases their full range of products. Cocoon highlights native Vietnamese agricultural ingredients\u2014such as Cao B\u1eb1ng coffee beans, dragon fruit, betel nut, and \u0110\u1eafk L\u1eafk pomelo peel\u2014crafted into sleek, eco-friendly packages. Featuring full tester lineups and friendly staff, it is an unmissable showcase of local pride when shopping for beauty products in \u0110\u1ed1ng \u0110a.", "name": "Cocoon Vegan Cosmetics Counter - Guardian Vincom Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch", "transport": "Take bus 21A, 26, 35A, or 51 to the Vincom Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch stop. Alternatively, take the C\u00e1t Linh - H\u00e0 \u0110\u00f4ng Metro line to Th\u00e1i H\u00e0 Station, then transfer to a Grab for about 5 minutes."}], "name": "Iconic Local Cosmetics \u0026 Pharmacy Shops"}, "cat_2": {"items": [{"address": "237 Ch\u00f9a B\u1ed9c, Trung Li\u1ec7t, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Must-Buy List: French retro floral dresses, Korean-style knit cardigans, high-waisted pleated skirts. Germe is a renowned local youth fashion brand in Dong Da, Hanoi, widely loved by college students and young professionals for its affordable prices and high-quality designs. Updating its collection weekly with styles ranging from sweet and gentle to sleek Korean minimalism, its flattering cuts are tailored for Asian body shapes\u2014making it a must-visit shopping haven on Ch\u00f9a B\u1ed9c street.", "name": "Germe Shop - Girly Fashion Boutique (Germe Shop Ch\u00f9a B\u1ed9c)", "transport": "Take bus routes 12, 21A, 26, or 35A to Ch\u00f9a B\u1ed9c station, then walk for about 2 minutes."}, {"address": "70 \u0110\u1eb7ng V\u0103n Ng\u1eef, Trung T\u1ef1, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.7 stars | Must-Buy List: Minimalist cotton-linen shirts, Japanese loose linen trousers, hipster pin-buckle leather belts. SSStutter is one of Vietnam\u0027s most iconic local minimalist design brands. Its branch in the trendy \u0110\u1eb7ng V\u0103n Ng\u1eef alley of Dong Da District boasts a chic, textured interior. Championing a \u0027Refined Life\u0027 philosophy, its designs blend Japanese and Western minimalism using highly breathable linen and premium woven fabrics, making it immensely popular among local trendy youth and creative hipsters.", "name": "SSStutter - Minimalist Hipster Clothing (SSStutter \u0110\u1eb7ng V\u0103n Ng\u1eef)", "transport": "Take bus routes 99 or 28 to Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch station, turn into \u0110\u1eb7ng V\u0103n Ng\u1eef alley, and walk for about 4 minutes."}, {"address": "90-94 Ch\u00f9a B\u1ed9c, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Must-Buy List: Affordable luxury commuter blazers, lace-panel dresses, textured soft leather square crossbody bags. Daisy is a pioneer among local original women\u0027s fashion chains in Hanoi. Its flagship store on Ch\u00f9a B\u1ed9c shopping street is bright and spacious. Focusing on elegant workwear and casual chic, the brand offers refined fabrics and crisp tailoring. Its suit jackets and dresses in particular embody the modern Hanoi woman\u0027s elegance at very budget-friendly prices.", "name": "Daisy - Fashionable Women\u0027s Flagship Store (Daisy Shop Ch\u00f9a B\u1ed9c)", "transport": "Take bus routes 12, 21A, or 26 to the 90 Ch\u00f9a B\u1ed9c bus stop; you will arrive immediately."}, {"address": "62 Ch\u00f9a B\u1ed9c, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Must-Buy List: Pointed-toe block heel pumps, elegant metal-buckle shoulder bags, lightweight suede flats. Juno is one of Vietnam\u0027s most famous homegrown fashion footwear and bag brands, situated on the bustling Ch\u00f9a B\u1ed9c shopping street. Specially designed for Asian foot shapes, their shoes feature supple, comfortable leather. Their bag collections follow global trends at a third of boutique prices, making this a go-to destination for local budget fashionistas and travelers alike.", "name": "Juno - Local Shoes \u0026 Bags Specialist (Juno Ch\u00f9a B\u1ed9c)", "transport": "Take bus routes 12, 21A, or 35A to the center of Ch\u00f9a B\u1ed9c shopping street; the prominent store sign is easy to spot."}, {"address": "110 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch, Trung T\u1ef1, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.8 stars | Must-Buy List: Vintage print silk \u00c1o D\u00e0i, handcrafted embroidered dresses, classic-cut linen tops. Magonn Design is a high-end original women\u0027s fashion label founded by Vietnamese designers, located on Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch Street. The brand seamlessly fuses French nostalgic romance with traditional Vietnamese elements, featuring exquisite hand embroidery and premium silk. Its modernized \u00c1o D\u00e0i dresses are artistic keepsakes coveted by many traveling visitors.", "name": "Magonn Design - Original Designer Women\u0027s Wear (Magonn Design Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch)", "transport": "Take bus routes 21A, 26, 35A, or 99 to Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch station, then walk for about 1 minute."}, {"address": "117 Ch\u00f9a B\u1ed9c, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Must-Buy List: Slim-fit stretch cropped casual trousers, heavy-cotton Oxford shirts, crisp windproof jackets. Routine is an immensely popular, rapidly rising Vietnamese local brand for men\u0027s and unisex apparel. Its Dong Da store is neatly organized, emphasizing minimalism, comfort, and a modern urban vibe. Products focus on versatile styling suitable for both work and daily life, featuring durable fabrics and sleek slim cuts\u2014making it the top choice for young local men seeking effortless daily style.", "name": "Routine - Local Men\u0027s \u0026 Casual Wear (Routine Ch\u00f9a B\u1ed9c)", "transport": "Take bus routes 12 or 26 to Ch\u00f9a B\u1ed9c station; the shop is right across the street."}, {"address": "44 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch, Ph\u01b0\u01a1ng Li\u00ean, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Must-Buy List: Stylish woven leather handbags, open-toe low-heeled sandals, chic long wallets. Vascara is a highly acclaimed local Vietnamese accessory brand located in the Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch commercial area. Offering women\u0027s shoes, handbags, wallets, and sunglasses, its style leans modern, sophisticated, and elegant. Built with durable quality and refined designs, the brand frequently collaborates with local designers on limited-edition series, delivering affordable luxury filled with artistic flair.", "name": "Vascara - Women\u0027s Shoes \u0026 Fashion Handbags (Vascara Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch)", "transport": "Take bus routes 21A, 26, 35A, or 99 to 44 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch station, then walk for about 1 minute."}, {"address": "29 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch, Trung T\u1ef1, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.7 stars | Must-Buy List: High-waisted wide-leg suit trousers, cropped designer short-sleeve tees, colorful knit cardigans. LIB\u00c9 is one of Vietnam\u0027s most iconic independent design labels, situated on Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch Street. Vibrant, colorful, and youthful, the brand blends contemporary street trends with comfortable daily wear. The storefront features a photo-worthy Instagrammable aesthetic, while the garments offer structured tailoring and skin-friendly fabrics, making it a favorite among Hanoi\u0027s trendy girls and fashion bloggers.", "name": "LIB\u00c9 Workshop - Trendy Fashion Boutique (LIB\u00c9 Workshop Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch)", "transport": "Take bus routes 21A, 35A, or 99 to Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch station, then walk for about 2 minutes."}], "name": "Popular Local Fashion, Shoe \u0026 Bag Boutiques"}, "cat_3": {"items": [{"address": "58 Qu\u1ed1c T\u1eed Gi\u00e1m, V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Must-Buy List: Temple-exclusive Confucian wooden bookmarks, miniature turtle stela stone carvings, and handwritten calligraphy scrolls of doctoral laureate rolls. Located inside the Temple of Literature grounds, this official souvenir shop is Hanoi\u0027s most scholarly and historical gift spot. It offers exclusive cultural items inspired by the Confucian temple and stelae, making it a favorite for history buffs and culture enthusiasts.", "name": "Temple of Literature Souvenir Shop (V\u0103n Mi\u1ebfu Souvenir Shop)", "transport": "Take Grab or Bus 02 or 38 to the V\u0103n Mi\u1ebfu stop, then walk about 2 minutes."}, {"address": "11A T\u00f4n \u0110\u1ee9c Th\u1eafng, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 Stars | Must-Buy List: Signature ginger-fried apricot preserves, salted chili plums, and candied kumquat preserves. \u00d4 Mai is an iconic royal treat in Hanoi. This time-honored brand\u0027s T\u00f4n \u0110\u1ee9c Th\u1eafng branch offers a wide variety of preserved fruits packaged in elegant jars and gift boxes. Perfectly balancing sweet, sour, ginger, and herbal notes, it\u0027s a top choice for local foodie gifts.", "name": "\u00d4 Mai H\u1ed3ng Lam - T\u00f4n \u0110\u1ee9c Th\u1eafng Branch", "transport": "Walk south along T\u00f4n \u0110\u1ee9c Th\u1eafng Street from the main gate of the Temple of Literature for about 3 minutes."}, {"address": "43 V\u0103n Mi\u1ebfu, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 Stars | Must-Buy List: Ethnic minority handwoven tea bags, high-mountain organic lotus tea gift boxes, and hand-embroidered herbal sachets. Located right opposite the Temple of Literature, Craft Link is the flagship store of a Vietnamese non-profit fair-trade organization dedicated to supporting ethnic minorities and artisans with disabilities. Offering beautifully packaged hand-picked floral teas, artisanal snacks in traditional textiles, and aromatic herbal pouches, it blends high quality with meaningful social impact.", "name": "Craft Link - V\u0103n Mi\u1ebfu", "transport": "Located directly opposite the ticket booth of the Temple of Literature; just cross the street (about a 1-minute walk) from the main entrance."}, {"address": "17 V\u0103n Mi\u1ebfu, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | Must-Buy List: Vietnamese cinnamon dark chocolate, Ph\u00fa Qu\u1ed1c pepper milk chocolate, and Mekong coconut dark chocolate. Alluvia is a famous Vietnamese single-origin bean-to-bar artisanal chocolate brand made with premium cacao from the Mekong Delta. The Temple of Literature branch offers generous on-site tastings. Infused with local Vietnamese spices like cinnamon, pepper, and ginger, and dressed in traditional motif packaging, it makes a refined gift.", "name": "Alluvia Bean to Bar Chocolate - V\u0103n Mi\u1ebfu", "transport": "Located on V\u0103n Mi\u1ebfu Street, about a 2-minute walk from the main gate of the Temple of Literature."}, {"address": "12 C\u00e1t Linh, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars | Must-Buy List: Signature mung bean green rice cakes (B\u00e1nh C\u1ed1m), coconut crispy rice crackers, and traditional handmade peanut sesame brittle. B\u00e1nh C\u1ed1m is Hanoi\u0027s most iconic sweet treat, made from fresh young autumn green rice and mung bean paste. B\u1ea3o Minh is a renowned heritage brand; its C\u00e1t Linh branch offers fresh daily-made cakes and nostalgic tea snacks that are soft, chewy, subtly sweet, and pair wonderfully with Vietnamese green tea.", "name": "B\u00e1nh C\u1ed1m B\u1ea3o Minh - C\u00e1t Linh Branch", "transport": "Take the Hanoi Metro Line 2A to C\u00e1t Linh Station and walk about 4 minutes after exiting."}, {"address": "58 V\u0103n Mi\u1ebfu, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 Stars | Must-Buy List: Signature Weasel coffee beans, premium high-mountain lotus-scented green tea, and deluxe jasmine tea gift sets. H\u01b0\u01a1ng Mai is one of Hanoi\u0027s oldest coffee and tea roasting families. The V\u0103n Mi\u1ebfu branch provides friendly on-site brewing and tasting sessions. Their top-grade Arabica beans and specialty lotus tea are highly popular among travelers. Sealed tins and vacuum packaging ensure long-lasting freshness for your journey home.", "name": "H\u01b0\u01a1ng Mai Caf\u00e9 - V\u0103n Mi\u1ebfu Branch", "transport": "Located near the intersection of V\u0103n Mi\u1ebfu and Nguy\u1ec5n Th\u00e1i H\u1ecdc Streets, about a 2-minute walk from the Temple of Literature."}, {"address": "158 Kh\u00e2m Thi\u00ean, Th\u1ed5 Quan, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 Stars | Must-Buy List: Traditional turmeric fried peanuts, crispy coconut chips, and premium salted roasted cashews with skin. Situated on historic Kh\u00e2m Thi\u00ean Street in \u0110\u1ed1ng \u0110a District, this traditional specialty store offers nostalgic local household snacks. Roasted with signature spices, the nuts are irresistibly crunchy, savory, and non-greasy. Generous portions and fair prices make this an ideal spot for authentic local munchies.", "name": "\u0110\u1eb7c S\u1ea3n H\u00e0 N\u1ed9i Specialty Shop - Kh\u00e2m Thi\u00ean Branch", "transport": "Take Bus 01 or 30 to the Kh\u00e2m Thi\u00ean stop, then walk about 1 minute."}, {"address": "82 Ch\u00f9a B\u1ed9c, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Must-Buy List: Wild Kuding tea bags, low-sugar dried jackfruit chips, and mung bean cakes in natural woven bamboo boxes. Located on bustling Ch\u00f9a B\u1ed9c Street in \u0110\u1ed1ng \u0110a District, this boutique store focuses on healthy, natural Vietnamese snacks and herbal teas. Featuring dried fruits and wellness teas from across Vietnam\u2014packaged eco-friendly in bamboo boxes and tubes\u2014it exudes authentic Vietnamese countryside charm and appeals to health-conscious travelers.", "name": "L\u00e0ng Xanh Vietnamese Souvenir \u0026 Tea - Ch\u00f9a B\u1ed9c Branch", "transport": "Take Bus 12, 18, or 21A to the Ch\u00f9a B\u1ed9c stop, then walk about 2 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "54A Nguy\u1ec5n Ch\u00ed Thanh, L\u00e1ng H\u1ea1, \u0110\u1ed1ng \u0110a, Hanoi", "feature": "\u2b50 4.4 stars | Must-Buy List: Specialty Vietnamese cashews from WinMart, Highlands Coffee drip coffee bags, local Vietnamese apparel brands. Located in the heart of \u0110\u1ed1ng \u0110a District, this multi-story flagship mall brings together top international and local Vietnamese brands. In addition to a large WinMart supermarket perfect for picking up Vietnamese souvenirs, it features a wide array of trendy fashion and fine dining, making it a premier shopping paradise for locals and tourists alike.", "name": "Vincom Center Nguy\u1ec5n Ch\u00ed Thanh", "transport": "Take Grab or bus 22A, 107 to 54A Nguy\u1ec5n Ch\u00ed Thanh station."}, {"address": "163 T\u00f4n \u0110\u1ee9c Th\u1eafng, H\u00e0ng B\u1ed9t, \u0110\u1ed1ng \u0110a, Hanoi", "feature": "\u2b50 4.1 stars | Must-Buy List: Export-quality 100% cotton T-shirts, lightweight affordable windbreakers, comfortable Made-in-Vietnam casual pants. M2 is a representative local Vietnamese outlet chain specializing in affordable Made-in-Vietnam export clothing (VNXK). Located on T\u00f4n \u0110\u1ee9c Th\u1eafng Street near the Temple of Literature, this branch offers a vast selection of factory-export apparel at deep discounts. With great quality and unbeatable prices, it\u0027s a fantastic spot for bargain hunting.", "name": "M2 Fashion Outlet T\u00f4n \u0110\u1ee9c Th\u1eafng", "transport": "Walk south along T\u00f4n \u0110\u1ee9c Th\u1eafng Street from the Temple of Literature for about 8 minutes."}, {"address": "2 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch, Kim Li\u00ean, \u0110\u1ed1ng \u0110a, Hanoi", "feature": "\u2b50 4.3 stars | Must-Buy List: Uniqlo Vietnam-exclusive graphic tees, MUJI lightweight travel pouches, unique local Vietnamese skincare products. This iconic modern department store sits at a bustling commercial intersection in \u0110\u1ed1ng \u0110a District, featuring an avant-garde glass curtain fa\u00e7ade. It houses Japanese flagship stores like Uniqlo and MUJI, alongside emerging Vietnamese fashion brands and a children\u0027s play area, offering an exceptionally bright and spacious shopping environment.", "name": "Vincom Center Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch", "transport": "Take bus 21A, 26, or 35A to 2 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch station."}, {"address": "43 V\u0103n Mi\u1ebfu, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, Hanoi", "feature": "\u2b50 4.6 stars | Must-Buy List: Ethnic minority embroidered robes, hand-painted lacquerware tea sets, hand-woven linen bags. Adjacent to the Temple of Literature, Craft Link is Vietnam\u0027s most famous non-profit fair-trade shop, dedicated to supporting ethnic minorities and traditional artisans. All profits go directly back to rural tribes and disadvantaged communities. Offering exquisite ethnic textiles, handmade ceramics, and bamboo furniture rich in cultural heritage, this store offers a deeply meaningful and heartwarming shopping experience.", "name": "Craft Link V\u0103n Mi\u1ebfu Traditional Handicrafts", "transport": "Located directly opposite the main entrance of the Temple of Literature, just a 1-minute walk."}, {"address": "97 T\u00f4n \u0110\u1ee9c Th\u1eafng, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, Hanoi", "feature": "\u2b50 4.7 stars | Must-Buy List: Vietnamese mythical beast graphic tees, hand-drawn Hanoi streetscape postcards, Dong Ho folk woodcut print-style sticker packs. TiredCity is a wildly popular local independent design brand among Vietnamese youth, collaborating with emerging Vietnamese illustrators to transform traditional culture into cool streetwear and creative merchandise. Located right near the Temple of Literature, it boasts rich local artistic flair.", "name": "TiredCity T\u00f4n \u0110\u1ee9c Th\u1eafng", "transport": "About a 5-minute walk from the Temple of Literature, strai
