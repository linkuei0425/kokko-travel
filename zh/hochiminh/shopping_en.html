y. The extra-large cashews with skin are crispy, fragrant, free of chemical preservatives, and tightly sealed\u2014perfect to bring home as gifts for friends and family.", "name": "Hiep Thanh Dried Fruits \u0026 Nuts Shop (C\u1eeda H\u00e0ng H\u1ea1t Kh\u00f4 Hi\u1ec7p Th\u00e0nh)", "transport": "Take Grab or Bus No. 56 to Ch\u00e2u V\u0103n Li\u00eam Station, then walk for about 1 minute."}, {"address": "82 H\u1ea3i Th\u01b0\u1ee3ng L\u00e3n \u00d4ng, Ph\u01b0\u1eddng 10, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-Buy List: Monk Fruit Soothing Herbal Tea Bags, Premium Vietnamese Chrysanthemum Tea, Lily Bulb Calming Wellness Tea. Located on District 5\u0027s famous Traditional Chinese Medicine Street, this century-old apothecary crafts traditional wellness herbs into modern, convenient tea bag gift sets. Made with high-quality local Vietnamese herbs and traditional medicinal ingredients, these teas offer heat-clearing and detoxifying benefits with a natural sweet aftertaste\u2014a health-conscious gift steeped in Cholon\u0027s herbal heritage.", "name": "Vinh Xuan Herbal Tea Shop - Hai Thuong Lan Ong Street (C\u1eeda H\u00e0ng \u0110\u00f4ng Y V\u0129nh Xu\u00e2n)", "transport": "Take Bus No. 1 to H\u1ea3i Th\u01b0\u1ee3ng L\u00e3n \u00d4ng Station, and you will see the shop right there."}, {"address": "382 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ph\u01b0\u1eddng 11, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-Buy List: Traditional Honey Glazed Pork Jerky, Spicy Beef Jerky, Nostalgic Pork Floss Pastries. Situated on Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Boulevard in District 5, this long-standing jerky shop slow-roasts its meats using traditional Cantonese methods. The jerky is thick, juicy, and infused with an enticing honeyed glaze. Besides jerky, their pork floss pastries are classic nostalgic snacks that Cholon locals grew up enjoying, all packaged in delightful vintage style.", "name": "Bao Huong Cantonese Jerky \u0026 Bakery (Ti\u1ec7m Th\u1ecbt Kh\u00f4 B\u1ea3o H\u01b0\u01a1ng)", "transport": "Take Bus No. 1 or 139 to Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Station, then walk for about 2 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "126 H\u00f9ng V\u01b0\u01a1ng, Ward 12, District 5, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Premium Vietnamese G7 Coffee Gift Boxes, Vinamit Dried Fruits, Charles \u0026 Keith footwear and bags. Located in the heart of District 5, this comprehensive major department store features multiple levels of retail space, bringing together famous international fashion, beauty brands, and a large CGV cinema. The supermarket on the basement level is a fantastic spot for picking up local souvenirs. With a comfortable, well-air-conditioned environment, it is the top choice for Ch\u1ee3 L\u1edbn residents and tourists alike to shop and escape the heat.", "name": "H\u00f9ng V\u01b0\u01a1ng Plaza", "transport": "Take Grab or Bus No. 06 or 56, and get off at H\u00f9ng V\u01b0\u01a1ng Plaza Stop."}, {"address": "190 H\u1ed3ng B\u00e0ng, Ward 12, District 5, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Must-Buy List: Artistic handcrafted woven bags, vintage-style cultural postcards, Vietnamese high-mountain Oolong tea. Formerly known as the famous Thu\u1eadn Ki\u1ec1u Plaza, this space was redesigned into a modern shopping center featuring lush greenery and an artistic vibe. The mall houses \"Ph\u01b0\u01a1ng Nam Book City\"\u2014the most distinctive bookstore complex in Ho Chi Minh City\u2014along with popup stores for local Vietnamese designer brands and retro teahouses, combining rich Chinese historical charm with contemporary creative culture.", "name": "The Garden Mall (Thu\u1eadn Ki\u1ec1u Garden Plaza)", "transport": "Take Bus No. 05 or 08 to B\u1ec7nh vi\u1ec7n R\u0103ng H\u00e0m M\u1eb7t Stop, then walk for about 2 minutes."}, {"address": "922 Nguy\u1ec5n Tr\u00e3i, Ward 14, District 5, Ho Chi Minh City", "feature": "\u2b50 4.0 stars | Must-Buy List: Affordable outlet off-tag clothing, custom \u00c1o D\u00e0i fabrics, quality leather belts. Located in District 5\u0027s bustling Nguy\u1ec5n Tr\u00e3i shopping district, this modern mall adopts an outlet model combining wholesale and retail. It gathers hundreds of local clothing vendors and factory-direct outlets where you can buy trendy women\u0027s, men\u0027s, and children\u0027s apparel at incredible factory discount prices, making it a paradise for local youth hunting for bargains.", "name": "Golden Plaza Shopping Center", "transport": "Take Bus No. 01 or 56 to Ch\u1ee3 Ph\u00f9ng H\u01b0ng Stop, then walk for about 3 minutes."}, {"address": "184 H\u1ed3ng B\u00e0ng, Ward 12, District 5, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Past-season Nike running shoes at 50% off, Adidas windbreakers, affordable moisture-wicking athletic shirts. Located on a main thoroughfare in District 5, this factory outlet for world-renowned sportswear brands offers year-round discounts ranging from 30% to 70% off. Since Vietnam is a major global manufacturing hub for major sportswear brands, you can purchase guaranteed authentic past-season footwear and activewear at unbeatable local prices.", "name": "Nike \u0026 Adidas Factory Outlet - District 5", "transport": "Take Bus No. 08 or 56 and get off opposite the former Thu\u1eadn Ki\u1ec1u Plaza."}, {"address": "271 Nguy\u1ec5n Tr\u00e3i, Ward 2, District 5, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Biti\u0027s Hunter co-branded lightweight running shoes, retro dad shoes, lightweight waterproof sandals. Biti\u0027s is a household-name national footwear brand in Vietnam. Its flagship store is situated in District 5\u0027s prime fashion shopping zone. The interior is spacious and well-lit with an extensive selection. Its flagship product, the Hunter series sneakers, is famous for being ultra-lightweight, durable, and budget-friendly, making it a trendy must-have among young Vietnamese.", "name": "Biti\u0027s Hunter Flagship Store Nguy\u1ec5n Tr\u00e3i", "transport": "Take a Grab car or motorbike ride to Nguy\u1ec5n Tr\u00e3i Street, near the intersection with Ph\u00f9ng H\u01b0ng Street."}, {"address": "238 Nguy\u1ec5n Tr\u00e3i, Ward 3, District 5, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-painted blue-and-white Vietnamese coffee phin filters, exquisite lotus-pattern tea sets, heat-resistant ceramic soup pots. Minh Long is Vietnam\u0027s most iconic top-tier porcelain brand used in state banquets. This showroom in District 5 displays various high-grade porcelain items ranging from traditional painted designs to modern minimalist styles. The product quality is exceptional with strong Oriental artistic aesthetics; the coffee filters and tea sets infused with Vietnamese cultural elements make highly valuable crafts for gifts or personal collection.", "name": "Minh Long Porcelain Showroom - District 5", "transport": "Take Bus No. 06 or 56 to Nguy\u1ec5n Tr\u00e3i Stop, then walk for about 1 minute."}, {"address": "324 Nguy\u1ec5n Tr\u00e3i, Ward 8, District 5, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-Buy List: French retro floral dresses, Korean casual oversized T-shirts, minimalist canvas bags. FM Style is a highly successful local fast-fashion chain in Vietnam. This District 5 branch is known for its affordable outlet prices and fast inventory turnover. The store offers hundreds of lightweight, comfortable clothing options tailored for Southeast Asia\u0027s climate at exceptionally sweet prices, attracting throngs of local students and tourists shopping for modern local fashion.", "name": "FM Style Nguy\u1ec5n Tr\u00e3i", "transport": "Take Bus No. 56 to R\u1ea1p \u0110\u1ed1ng \u0110a Stop, then walk for about 2 minutes."}, {"address": "18 An D\u01b0\u01a1ng V\u01b0\u01a1ng, Ward 9, District 5, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Premium cashew nuts and bird\u0027s nest gift boxes, hand-embroidered Vietnamese silk table runners, genuine leather handbags. Adjacent to An \u0110\u00f4ng Market, this modern multi-story commercial complex features central air conditioning and escalators. The 1st and 2nd floors focus on gold jewelry and local Vietnamese specialties, while the 3rd floor and above bring together numerous local leather goods, handicrafts, and upscale textiles. The shopping environment is far more comfortable than older markets, with higher quality products and superior packaging.", "name": "An \u0110\u00f4ng Plaza", "transport": "Take Bus No. 11 or 45 to Windsor Plaza Hotel Stop; the mall is right next to the hotel."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "District 5 - Cholon Chinatown and Traditional Market Area"}, "district_7_phumyhung": {"categories": {"cat_1": {"items": [{"address": "Ground Floor, Crescent Mall, 101 Ton Dat Tien, Tan Phu Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-buy list: Dak Lak Coffee Body Scrub, Pomelo Hair Tonic, Winter Melon Micellar Water. Cocoon is currently Vietnam\u0027s most iconic 100% vegan botanical beauty brand, focusing on skincare made from high-quality local agricultural produce. This counter located in Crescent Mall, Ph\u00fa M\u1ef9 H\u01b0ng, displays their full product line. The coffee scrub uses crushed Dak Lak coffee beans and cocoa butter, offering superb exfoliation with a rich coffee aroma. The pomelo spray effectively addresses hair loss caused by Vietnam\u0027s hot and humid climate, making it immensely popular among local women and tourists alike.", "name": "Cocoon Vietnam Vegan Cosmetics Counter (Crescent Mall)", "transport": "Take Grab or a taxi to the main entrance of Crescent Mall, then walk to the ground floor atrium cosmetics counter area."}, {"address": "468 Nguyen Thi Thap, Tan Quy Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-buy list: Vedette Green Tea Clay Mask, Emmi\u00e9 B5 Bio-Repair Serum, Thorakao Turmeric Cleanser. Hasaki is Vietnam\u0027s leading beauty chain store with a dominant market share, renowned for highly competitive prices and guaranteed authentic products. Its spacious flagship store on District 7\u0027s main artery, Nguy\u1ec5n Th\u1ecb Th\u1eadp Street, features international top brands as well as a dedicated local Vietnamese beauty section. Tourists can shop for both heritage and emerging Vietnamese skincare brands like Thorakao and Vedette all in one place, enjoying affordable prices and frequent exclusive discounts.", "name": "Hasaki Beauty \u0026 Clinic (Nguy\u1ec5n Th\u1ecb Th\u1eadp)", "transport": "Take Grab to 468 Nguyen Thi Thap Street; there is an eye-catching green Hasaki sign and parking area at the entrance."}, {"address": "144 Nguyen Duc Canh, Tan Phong Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-buy list: Thorakao Turmeric Cream, Pharmacity Herbal Hand Cream, Virgin Coconut Lip Balm. Pharmacity is Vietnam\u0027s largest modern pharmacy chain, originally founded in Ho Chi Minh City. This Ph\u00fa M\u1ef9 H\u01b0ng branch is beautifully situated along a tree-lined boulevard in an upscale residential area. In addition to essential medications, the store stocks a wide variety of Vietnamese herbal health products and local cosmetics. Highly recommended is Thorakao\u0027s decades-old classic Turmeric Cream, famous across Vietnam for its miraculous ability to fade acne scars and heal wounds.", "name": "Pharmacity Flagship Pharmacy (Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh)", "transport": "Take Grab to 144 Nguyen Duc Canh Street in Phu My Hung; it is located in the ground-floor commercial space of a residential building."}, {"address": "1st Floor, Crescent Mall, 101 Ton Dat Tien, Tan Phu Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.8 stars | Must-buy list: Salicylic Acid Gentle Peel Pads, B5 Bio-Repair Sheet Mask, Brightening Serum. Emmi\u00e9 is a high-performance local skincare brand founded by popular Vietnamese beauty blogger Happy Skin, tailored specifically for Southeast Asia\u0027s tropical climate and oily, sensitive skin types. The Ph\u00fa M\u1ef9 H\u01b0ng outlet features a sleek, modern trial zone and professional skin analysis services. Its salicylic acid peel pads and soothing sheet masks are wildly popular among young Vietnamese adults. Featuring elegant, minimal packaging, they make excellent professional-grade skincare gifts with local flavor.", "name": "Emmi\u00e9 by Happy Skin Experience Store (D7 Outlet)", "transport": "Take Grab to Crescent Mall, then take the escalator to the 1st-floor fashion \u0026 beauty area to find the store."}, {"address": "39 Bui Bang Doan, Tan Phong Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-buy list: BareTT Coconut Sunscreen, Vedette Cucumber Foot Scrub, Cocoon Betel Leaf Fresh Wash. Located on B\u00f9i B\u1eb1ng \u0110o\u00e0n Street in the heart of District 7\u0027s Korean community, this Guardian store offers popular Japanese and Korean cosmetics alongside a large, dedicated \u0027Local Vietnamese Products\u0027 section. It highlights body wash and care items made with natural local ingredients like betel leaf, cucumber, and coconut oil. Gentle and pleasantly scented, it\u0027s a great spot to pick up personal care souvenirs.", "name": "Guardian Health \u0026 Beauty (B\u00f9i B\u1eb1ng \u0110o\u00e0n)", "transport": "Take Grab to 39 Bui Bang Doan Street in Phu My Hung, located near numerous Korean restaurants."}, {"address": "1st Floor, Crescent Mall, 101 Ton Dat Tien, Tan Phu Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-buy list: Lemonade Dual Lip Tint, Blush Compact, Sukin Hydrating Mist. Sociolla is a trendy multi-brand beauty store highlighting indie cosmetics from Indonesia and across Southeast Asia, designed for modern young women. Decorated in dreamlike pink hues, this District 7 branch\u0027s biggest draw is its exclusive line of Lemonade, an emerging Vietnamese cosmetics brand created by top makeup artist Qu\u00e1ch \u00c1nh. Tailored for Asian skin tones, Lemonade\u0027s dual lip tint offers outstanding sweat and water resistance\u2014perfect for traveling in tropical Southeast Asia.", "name": "Sociolla Beauty Store (Crescent Mall D7)", "transport": "Take Grab to Crescent Mall; upon entering the 1st floor, you will see the signature pink decor of the Sociolla store."}, {"address": "Ground Floor, SC VivoCity, 1056 Nguyen Van Linh, Tan Phong Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-buy list: Of\u00c9lia Matte Liquid Lipstick, Cocoon Coffee Eye Serum, Lemonade Matte Cushion. Beauty Box is a major high-end beauty concept store in Vietnam, with its SC VivoCity flagship covering a vast area. It features a curated selection of premium Southeast Asian and Vietnamese makeup brands. Highlights include Of\u00c9lia, a pride of local cosmetics created by top Vietnamese beauty influencer Changmakeup. Its velvet matte lipsticks offer a luxurious texture, rich pigment, and non-drying comfort, making them a favorite among HCMC\u0027s chic crowd and a must-buy beauty haul in District 7.", "name": "Beauty Box Flagship Store (SC VivoCity)", "transport": "Take Grab or a bus to the main entrance of SC VivoCity Mall, then walk into the ground floor atrium side hall."}, {"address": "103 Ton Dat Tien, Tan Phu Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.9 stars | Must-buy list: Artisan Herbal Handcrafted Soap, Centella Relief Balm, Organic Cold-Pressed Body Oil. L\u0027Apothiquaire is Ho Chi Minh City\u0027s famed French-style luxury organic cosmetics and aromatherapy boutique. The Ph\u00fa M\u1ef9 H\u01b0ng location evokes the elegant vintage charm of a 19th-century Parisian pharmacy. Combining French aromatherapy techniques with premium local organic herbs (such as centella, lemongrass, and coconut oil), they craft exceptional skincare products and soaps. Highly favored by expats and affluent residents in Ph\u00fa M\u1ef9 H\u01b0ng, its quality is impeccable.", "name": "L\u0027Apothiquaire Artisan Beauty Boutique (Ph\u00fa M\u1ef9 H\u01b0ng)", "transport": "Take Grab to 103 Ton Dat Tien Promenade, located right next to Crescent Lake Walkway."}], "name": "Iconic Local Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "101 Ton Dat Tien, Tan Phu, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Minimalist tailored dresses, vintage cropped tops, textured canvas tote bags. LIB\u00c9 is one of Vietnam\u0027s most iconic local independent designer womenswear brands, renowned for its minimalist yet modern urban aesthetic. Located inside Crescent Mall in Phu My Hung, this branch is bright and spacious, loved by young women and fashion bloggers in Ho Chi Minh City. With excellent quality and reasonable prices, it is a top choice for discovering local Vietnamese designs.", "name": "LIB\u00c9 Workshop Fashion Store (LIB\u00c9 Workshop Crescent Mall)", "transport": "Take a Grab car or motorbike to Crescent Mall; the store is located on the 2nd floor."}, {"address": "101 Ton Dat Tien, Tan Phu, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Linen-blend casual shirts, slim-fit cropped trousers, minimalist embroidered daily T-shirts. Routine is one of Vietnam\u0027s most successful local casualwear brands, featuring highly breathable fabrics suited for Southeast Asian weather and sleek Korean-style cuts. The Phu My Hung branch offers a wide selection of menswear and womenswear with simple, stylish, and highly practical designs\u2014perfect for picking up high-value daily wardrobe essentials.", "name": "Routine Casual Wear Specialty Store (Routine Crescent Mall)", "transport": "Take a Grab to Crescent Mall; located in the 1st floor shopping area inside the mall."}, {"address": "101 Ton Dat Tien, Tan Phu, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: French elegant blazers, party-cut little black dresses, stylish ruched tops. COCO SIN is a well-known local high-street fashion brand in Ho Chi Minh City, creating accessible yet luxurious clothing for modern, confident women. The Phu My Hung branch features exquisite interior decor, crisp silhouette cuts, and glamorous appeal, making it a favorite among local white-collar women and fashionistas.", "name": "COCO SIN Womenswear Boutique (COCO SIN Crescent Mall)", "transport": "Take a Grab to Crescent Mall, 2nd floor."}, {"address": "101 Ton Dat Tien, Tan Phu, District 7, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: French floral tea dresses, vintage print dresses, elegant velvet mini totes. Lep\u0027 is a hugely popular local womenswear brand in Vietnam, renowned for its unique vintage floral prints and elegant French tailoring. The boutique radiates romantic French charm, accentuating gentle feminine curves\u2014perfect for wearing and taking photos in Saigon\u0027s warm climate.", "name": "Lep\u0027 Vintage Print Womenswear (Lep\u0027 Crescent Mall)", "transport": "Take a Grab to Crescent Mall, located on the 3rd floor."}, {"address": "1058 Nguyen Van Linh, Tan Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-Buy List: Commuter leather handbags, elegant pointed kitten heels, woven texture leather bags. Vascara is Vietnam\u0027s most famous domestic boutique brand for shoes and bags, known for high-end international design aesthetics at affordable prices. Located in SC VivoCity in Phu My Hung, this branch is neatly organized with a vast array of comfortable footwear and bags, making it a shopping hotspot for local working women and souvenir hunters.", "name": "Vascara Shoes \u0026 Bags Boutique (Vascara SC VivoCity)", "transport": "Take a Grab to SC VivoCity, 1st floor."}, {"address": "352 Nguyen Thi Thap, Tan Quy, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Versatile heeled sandals, waterproof leather crossbody bags, lightweight cushioned flats. Juno is a household Vietnamese brand for women\u0027s shoes and bags, specializing in stylish footwear tailored specifically for Asian feet. Located in the main commercial district of District 7, this spacious branch offers durable products and frequent discounts, making it a go-to everyday choice for local women.", "name": "Juno Shoes \u0026 Bags Specialty Store (Juno Nguyen Thi Thap)", "transport": "Take a Grab to near the intersection of Nguyen Thi Thap Street and Bui Bang Doan Street."}, {"address": "458 Nguyen Thi Thap, Tan Quy, District 7, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-Buy List: Biti\u0027s Hunter lightweight breathable running shoes, vintage army-style retro sneakers, collaboration dad shoes. Biti\u0027s is a national iconic footwear brand in Vietnam. In recent years, its \u0027Biti\u0027s Hunter\u0027 trendy sneaker line took off globally, becoming a symbol of street culture for Vietnam\u0027s young generation. This District 7 branch offers full stock, lightweight, comfortable sneakers at competitive prices\u2014a must-buy iconic local sneaker when visiting Vietnam.", "name": "Biti\u0027s Hunter Concept Store (Biti\u0027s Hunter Nguyen Thi Thap)", "transport": "Take a Grab along Nguyen Thi Thap main street, near the Phu My Hung area."}, {"address": "468 Nguyen Thi Thap, Tan Quy, District 7, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Must-Buy List: Elegant fitted dresses, Korean-style textured chiffon blouses, versatile high-waisted dress pants. GUMAC is a rapidly rising affordable fast-fashion womenswear brand in Vietnam, providing versatile attire suitable for elegant, professional, and casual occasions. The store near Phu My Hung features a comfortable shopping environment, fast inventory turnarounds, high quality, and exceptional value, making it a popular spot for local women buying workwear.", "name": "GUMAC Fashion Womenswear (GUMAC Nguyen Thi Thap)", "transport": "Take a Grab directly along Nguyen Thi Thap main street to the store."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "120 H\u00e0 Huy T\u1eadp, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Must-buy list: Mekong Delta Single Origin dark chocolate bars, rich cocoa spread, handcrafted boxed gift sets. Vietnam\u0027s premier artisanal bean-to-bar chocolate brand, crafted using carefully selected cocoa beans from six different Vietnamese provinces. The Phu My Hung branch offers an elegant and sophisticated ambiance. Beyond beautifully packaged dark chocolates and uniquely flavored treats, the store serves freshly made cocoa desserts and rich hot chocolate\u2014making it a top choice for premium gifts.", "name": "Maison Marou Phu My Hung", "transport": "Take a Grab or taxi to the tree-lined H\u00e0 Huy T\u1eadp Avenue in Phu My Hung."}, {"address": "SC VivoCity, 1058 Nguy\u1ec5n V\u0103n Linh, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-buy list: Da Lat highland artichoke tea gift sets, mixed dried fruit and vegetable chips, spicy roasted beef jerky. A renowned specialty brand from Da Lat, Vietnam\u0027s cool highland retreat, specializing in natural and healthy agricultural gifts. Featuring stylish, minimalist rustic packaging, the store offers everything from naturally dried herbal teas and dried fruits to traditional chewy candies. Clear hygiene labels and transparent pricing make it a favorite among tourists and locals alike.", "name": "L\u0027angfarm Store SC VivoCity", "transport": "Located inside SC VivoCity shopping mall. Take bus 102 or 139, or take a Grab directly to SC VivoCity."}, {"address": "B1, Crescent Mall, 101 T\u00f4n D\u1eadt Ti\u00ean, T\u00e2n Ph\u00fa, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-buy list: Premium salted roasted skin-on cashews, local Vietnamese wild wildflower honey, Ph\u00fac Long premium highland tea sets. A high-end gourmet supermarket located in the heart of District 7\u0027s upscale community, offering a curated selection of top-quality local produce and specialty products from across Vietnam. The skin-on cashews here are exceptionally plump and of superior quality. With their elegant gift packaging, they make excellent high-end souvenirs for friends and family.", "name": "Annam Gourmet Crescent Mall", "transport": "Take a Grab directly to Crescent Mall, located on Basement 1 (B1)."}, {"address": "101 T\u00f4n D\u1eadt Ti\u00ean, T\u00e2n Ph\u00fa, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-buy list: Legend Weasel-flavor drip coffee powder, classic Vietnamese stainless steel phin filter gift set, specialty dark roast coffee beans. Vietnam\u0027s iconic coffee giant. The Phu My Hung flagship store is spacious and elegant, steeped in rich Vietnamese coffee culture. Tourists can purchase authentic Vietnamese drip coffee sets and premium coffee beans here, with staff available to explain the distinct flavor profiles of beans from different regions.", "name": "Trung Nguy\u00ean Legend Caf\u00e9 Phu My Hung", "transport": "Located along the lakeside promenade at Crescent Mall, easily accessible on foot."}, {"address": "Crescent Plaza, 105 T\u00f4n D\u1eadt Ti\u00ean, T\u00e2n Ph\u00fa, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-buy list: Traditional Vietnamese lotus green tea gift sets, highland oolong tea bags, rich French roast coffee beans. Ph\u00fac Long is a heritage Vietnamese tea and coffee brand, and this branch is situated right on the scenic Crescent Lake in District 7. The store sells traditional Vietnamese teas packaged in elegant tin cans and gift boxes. The lotus tea and jasmine green tea\u2014blending French sophistication with Eastern flair\u2014are rich in flavor and beautifully packaged, highly recommended as travel gifts.", "name": "Ph\u00fac Long Coffee \u0026 Tea Crescent Plaza", "transport": "Located along the Crescent Lake Promenade (Crescent Plaza), easily accessible on foot."}, {"address": "Urban Hill, 51A Nguy\u1ec5n V\u0103n Linh, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-buy list: Vinamit dried jackfruit chips, dried Irwin mango slices, G7 hazelnut 3-in-1 instant coffee. An upscale supermarket brand owned by Vietnamese retail giant Co.op, tailored specifically for the affluent Phu My Hung residential area. It features a curated selection of Vietnam\u0027s most popular high-quality snacks and gifts. The clean, modern shopping environment allows visitors to conveniently pick up dried jackfruit, dried mango, and various popular instant coffee packs all at once, with guaranteed quality and fair pricing.", "name": "Finelife Supermarket Urban Hill", "transport": "Take a Grab to the ground level of the Urban Hill building on Nguy\u1ec5n V\u0103n Linh Boulevard."}, {"address": "80/4A Hu\u1ef3nh T\u1ea5n Ph\u00e1t, T\u00e2n Thu\u1eadn T\u00e2y, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Must-buy list: Crispy Vietnamese coconut crackers, fish sauce flavored peanuts, traditional Vietnamese coconut candy. Vietnam\u0027s largest homegrown supermarket chain, perfect for travelers wanting an authentic local experience and bulk snack shopping at affordable prices. The local snack aisle has everything from flavored coconut biscuits and dried fruits to seasoned nuts, all sold at everyday wholesale-like prices\u2014an unbeatable value stop.", "name": "Co.opmart Hu\u1ef3nh T\u1ea5n Ph\u00e1t", "transport": "Take a Grab or bus 20, 34, or 102 and get off at the Hu\u1ef3nh T\u1ea5n Ph\u00e1t station."}, {"address": "216 Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Must-buy list: Roasted coconut macadamia nuts, freeze-dried dragon fruit slices, premium Vietnamese roasted cashews. Phu My Hung is a well-known Koreatown; although K-Market is a Korean supermarket chain, it features a dedicated local souvenir section tailored to tourists and expats. Here you can find strictly quality-controlled, elegantly packaged Vietnamese nuts and uniquely flavored dried fruits\u2014a delightful, popular shopping spot for expats and travelers.", "name": "K-Market Panorama", "transport": "Take a Grab to Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh Street in the Panorama residential complex."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "101 Ton Dat Tien, Tan Phu, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Marou artisanal Vietnamese chocolate, Cozy local brand tea bags, Gingko eco-friendly cotton graphic T-shirts. An iconic high-end shopping center located along Crescent Lake in Ph\u00fa M\u1ef9 H\u01b0ng, featuring an exceptionally spacious, bright, and green environment. The mall brings together many emerging local Vietnamese designer brands and exquisite home decor, along with MUJI and various cafes. It is not only the top choice for shopping local high-quality souvenirs, but also allows you to enjoy a relaxing waterfront stroll, making it very popular among the local middle class and foreign expats.", "name": "Crescent Mall", "transport": "Take a Grab or taxi to Crescent Mall in Ph\u00fa M\u1ef9 H\u01b0ng; about a 20-minute ride from District 1."}, {"address": "1058 Nguyen Van Linh, Tan Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Vinamit mixed dried fruits, Sense City local design tote bags, YaMe Vietnamese youth streetwear. Co-developed by Singaporean real estate developers and a local Vietnamese conglomerate, this large integrated mall exudes a modern family lifestyle ambiance. In addition to a wide range of international fast fashion, the ground floor and central atrium often host stalls featuring local Vietnamese brands and creative markets, making it a great place to hunt for unique, high-quality local goods. The large supermarket inside features the most comprehensive selection of local Vietnamese specialties in District 7, making shopping extremely convenient.", "name": "SC VivoCity Shopping Center", "transport": "Drive along Nguy\u1ec5n V\u0103n Linh Boulevard towards District 7; approximately 15-20 minutes by Grab."}, {"address": "469 Nguyen Huu Tho, Tan Hung, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Must-Buy List: Archcaf\u00e9 coconut instant coffee, Leng Keng specialty cashews, Th\u1ea1ch B\u00edch volcanic mineral water. As District 7\u0027s most iconic hypermarket and department store complex, this location features a vast local specialty area, making it a must-visit sanctuary for tourists stocking up on popular Vietnamese souvenirs. Beyond the hypermarket, the department store sections cover various local Vietnamese casual wear, leather goods, and home goods counters. Prices are affordable and clearly labeled, offering a fun glimpse into authentic local life.", "name": "Lotte Mart District 7", "transport": "Located at the intersection of Nguy\u1ec5n H\u1eefu Th\u1ecd Street and Nguy\u1ec5n V\u0103n Linh Boulevard. Reachable by taking Bus 34 or 68, or directly via Grab."}, {"address": "137 Nguyen Thi Thap, Tan Phu, District 7, Ho Chi Minh City", "feature": "\u2b50 4.1 Stars | Must-Buy List: Kappa collaboration casual sneakers, Superga discounted Italian canvas shoes, Ecko Unltd American street graphic tees. Hoang Phuc International is Vietnam\u0027s most famous distributor of international brands and outlet operator. This dedicated outlet center in District 7 offers year-round discounts of 50% to 70% off. The spacious store specializes in clearance items from various Western streetwear and casual sportswear brands, with particularly competitive prices on shoes and casual apparel. It is an unmissable gem for shoppers who love hunting for high-quality, bargain brand-name clothes.", "name": "Hoang Phuc International Outlet D7", "transport": "About a 5-minute Grab ride from the central Ph\u00fa M\u1ef9 H\u01b0ng area to Nguy\u1ec5n Th\u1ecb Th\u1eadp Street."}, {"address": "38 Nguyen Van Linh, Tan Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.2 Stars | Must-Buy List: Tommy Hilfiger export-quality men\u0027s Polo shirts, Calvin Klein classic jeans, GAP pure cotton comfortable hoodies. This outlet is a well-known store in Ho Chi Minh City for factory overruns, cut-label items, and brand clearance, specializing in excess factory capacity or off-season apparel from Western brands. Items are sold at 60% to 80% off retail prices, offering high quality and various fits. It attracts many Western expats living in Ph\u00fa M\u1ef9 H\u01b0ng as well as local young people looking for great bargains, making it the top choice for finding high-value Western casual wear in District 7.", "name": "Factory Outlet Phu My Hung", "transport": "Located on the main Nguy\u1ec5n V\u0103n Linh Boulevard; take a Grab and get off near the Ph\u00fa M\u1ef9 H\u01b0ng entrance."}, {"address": "SD 04, Panorama, Ton Dat Tien, Tan Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | Must-Buy List: Organic bamboo fiber Ho Chi Minh landmark graphic tees, hand-drawn map canvas bags of Vietnam, handcrafted embroidered patches. Ginkgo is an iconic original local Vietnamese design apparel brand advocating eco-friendly organic materials combined with local culture. All T-shirts and accessories in the store are originally created by local designers, using high-quality organic cotton and bamboo fiber that feel soft, comfortable, and hold shape well after washing. Far from clich\u00e9 souvenirs, their products transform traditional Vietnamese elements\u2014such as motorbikes, French architecture, and coffee culture\u2014into modern illustrations that are well worth collecting.", "name": "Ginkgo T-Shirts \u0026 Concept Store D7", "transport": "Located in a street-level shop at the Panorama complex in Ph\u00fa M\u1ef9 H\u01b0ng, near Crescent Lake. Very convenient on foot or via Grab."}, {"address": "Ground Floor, SC VivoCity, 1058 Nguyen Van Linh, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Saigon Drip French roast coffee beans, Langfarm Da Lat dried fruit chips, traditional handcrafted Vietnamese cement tile coasters. Co.opXtra is a premier hypermarket joint venture between Vietnam\u0027s largest local retail group, Saigon Co.op, and Singapore\u0027s NTUC. Unlike foreign-owned supermarkets, it strongly emphasizes \u0027Made in Vietnam\u0027 products and goods from local small farmers, featuring special sections dedicated to regional specialties from across Vietnam\u2014ranging from Da Lat flower teas and Phu Quoc fish sauce to local handicrafts. If you want a one-stop shop for high-quality local lifestyle goods and gourmet gift boxes, this is undoubtedly the best choice.", "name": "Co.opXtra Phu My Hung", "transport": "Located on the basement and ground floors of SC VivoCity. Take a Grab to the main entrance of SC VivoCity to enter."}, {"address": "103 Ton Dat Tien, Tan Phu Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.7 Stars | Must-Buy List: Natural lemongrass cold-processed handmade soap, Vietnamese highland organic jasmine essential oil, custom French organic herbal hand cream. Born in Ho Chi Minh City, L\u0027Apothiquaire is a high-end French-style natural beauty and organic skincare brand that seamlessly blends Vietnam\u0027s rich indigenous herbs with French aromatherapy craft. The store displays a charming French vintage apothecary vibe, exuding a relaxing natural fragrance. All skincare products are handcrafted in small batches in Vietnam using natural ingredients; the quality rivals top international luxury brands while carrying a unique tropical aroma, making them sophisticated local souvenirs and beauty picks.", "name": "L\u0027Apothiquaire Artisan Beauty Phu My Hung", "transport": "Located on the front row of the Crescent Lake promenade. Take a Grab to the Crescent Residence promenade area and walk from there."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "District 7 - Phu My Hung Modern International and High-End Residential Area"}};
        const cityName = "Ho Chi Minh";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);

            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');

                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';

                b.onclick = () => selectCat(c, b);
                container.appendChild(b);

            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;

            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
