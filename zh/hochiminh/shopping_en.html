ure, vintage Saigon vibes, and wartime propaganda art into uniquely designed lifestyle products and packaged snacks. A hit among Western and Asian independent travelers looking for unconventional, highly personalized snacks and creative souvenirs.", "name": "S\u00e0i G\u00f2n Kitsch", "transport": "Walk to Ton That Thiep Street near Nguyen Hue Walking Street; about a 3-minute walk."}, {"address": "80 Dong Khoi, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: G7 3-in-1 instant coffee, Legend civet-style coffee beans, traditional stainless steel phin filter. The flagship store of Vietnam\u0027s most iconic national coffee brand, steeped in rich Vietnamese coffee culture. Besides enjoying authentic iced milk coffee on-site, the store offers a comprehensive gift selection ranging from premium coffee beans to budget instant coffee packs, often bundled with classic phin filters. It\u0027s the ultimate classic gift representing Saigon\u0027s warmth and flavor.", "name": "Trung Nguy\u00ean Legend Caf\u00e9 Flagship Store", "transport": "Located in the heart of Dong Khoi Street, diagonally opposite the Saigon Opera House; easily accessible on foot."}, {"address": "B2 Floor, Takashimaya, 92-94 Nam Ky Khoi Nghia, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Vietnamese skin-on salted roasted cashews, Phu Quoc extra virgin fish sauce, organic Vietnamese peppercorns. Vietnam\u0027s upscale gourmet market brand\u2014essentially the Vietnamese version of Eataly. It brings together Vietnam\u0027s highest quality and most elegantly packaged local food products, including artisanal Phu Quoc fish sauce, peppercorns, craft beer brands, and premium nuts. With strict quality control and a bright, immaculate shopping environment, it\u0027s the premier choice for luxury food items and gourmet snacks.", "name": "Annam Gourmet Market Takashimaya", "transport": "Located on Basement B2 of Takashimaya Department Store, directly connected to Nguyen Hue Boulevard and the Ben Thanh Market area."}, {"address": "29-31 Ngo Duc Ke, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Boxed lotus green tea bags, whole-leaf jasmine tea, local roasted drip coffee bags. Founded in 1968, this heritage Vietnamese tea and coffee brand is renowned for its intensely rich tea flavor. Beyond takeaway beverages, the store features a souvenir section offering traditional Vietnamese teas and coffee beans. The lotus and jasmine teas are particularly popular worldwide for their unique natural floral aromas. Rustic packaging with exceptional value for money.", "name": "Ph\u00fac Long Coffee \u0026 Tea", "transport": "Located on Ngo Duc Ke Street near Bitexco Financial Tower; about a 2-minute walk."}, {"address": "27 Dong Khoi, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Organic cotton Saigon illustration T-shirts, eco-friendly bamboo fiber tumblers, exclusive handmade embroidered canvas bags. A renowned local creative lifestyle brand focused on sustainability and organic materials. The shop carries uniquely designed products crafted by local Vietnamese artists, turning Saigon\u2019s scooter sea, banh mi, and coffee culture into vivid, adorable prints. High-quality products perfect for travelers seeking refined design and something beyond generic market souvenirs.", "name": "Ginkgo Concept Store", "transport": "Located on the upscale Dong Khoi Street, about a 5-minute walk from Notre-Dame Cathedral Basilica of Saigon."}, {"address": "69 Dong Khoi, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Must-Buy List: Natural soft dried jackfruit, traditional coconut candy, Vinamit baked mixed veggie chips. Located on Dong Khoi Street in the heart of District 1, this traditional supermarket is a hidden gem favored by savvy travelers and insiders for budget-friendly souvenirs. Unlike typical tourist markets, prices here are clearly marked and fair. It offers an extensive selection of dried fruit chips, cashews, chewy coconut candies, and instant pho noodles\u2014a one-stop shop to stock up on requested gifts for friends and family.", "name": "Lucky Plaza / Satra Mart", "transport": "Located on the 2nd floor of Lucky Plaza at 69 Dong Khoi Street, just steps away from the Grand Hotel."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "65 Le Loi, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-buy list: Marou artisanal bean-to-bar chocolates, CoCo Ichibanya Vietnam-exclusive snack gift boxes, L\u0027angfarm specialty dried fruits and candied preserves. District 1\u0027s most modern premier landmark complex, bringing together top international brands and high-end local Vietnamese souvenir counters. The basement food court is a treasure trove for authentic local specialties and beautifully packaged gourmet goods.", "name": "Takashimaya Vietnam \u0026 Saigon Centre", "transport": "Take a Grab or walk near Ben Thanh Market; it\u0027s about a 3-minute walk away."}, {"address": "72 Le Thanh Ton, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-buy list: Com Tam Moc Vietnamese sauce packs, Thai Cong luxury scented candles, Zara Vietnam-exclusive sandals. A flagship shopping complex located in the heart of District 1, boasting Vietnam\u0027s most comprehensive collection of brand counters and high-end local lifestyle goods. A flagship landmark for experiencing Ho Chi Minh City\u0027s modern trends and shopping culture.", "name": "Vincom Center Dong Khoi", "transport": "Located between Notre Dame Cathedral and the Saigon Opera House, about a 2-minute walk from the Opera House."}, {"address": "26 Ly Tu Trong, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-buy list: Local Brand custom-cut printed graphic tees, Lider designer streetwear crossbody bags, Hades embroidered baseball caps. The ultimate underground independent designer mall beloved by Vietnam\u0027s youth and fashion crowd. It gathers dozens of HCMC\u0027s hottest local apparel and accessory brands, showcasing powerful original Vietnamese streetwear culture.", "name": "The New Playground Ly Tu Trong", "transport": "Located in the basement directly opposite Vincom Center, about a 4-minute walk from the Saigon Opera House."}, {"address": "137 Le Thanh Ton, Ben Thanh, District 1, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-buy list: Discounted Kappa sneakers, Superga classic platform canvas shoes, Ecko Unltd graphic tees. The most well-known and affordable international outlet store in HCMC\u0027s District 1, offering year-round deals of 50\u201370% off. It\u0027s the perfect spot to hunt for bargain authentic sportswear and casual footwear in the city center.", "name": "Hoang Phuc International Outlet Le Thanh Ton", "transport": "About a 3-minute walk from Ben Thanh Market."}, {"address": "34 Le Duan, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-buy list: Vietblend premium local tea gift boxes, Scented Garden handcrafted essential oils, Miss Saigon iconic doll perfumes. One of HCMC\u0027s most iconic department stores featuring classic European architecture. Located right next to the Notre Dame Cathedral, it houses numerous high-end traditional craft counters and premium local home fragrance boutiques.", "name": "Diamond Plaza", "transport": "Located right behind Saigon Notre Dame Cathedral, about a 1-minute walk away."}, {"address": "151/5 Dong Khoi, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-buy list: L\u0027Usine vintage print tote bags, Vietnamese Artisanal handcrafted jams, local designer collaboration home mugs. Combining French industrial cafe dining with curated local indie fashion, this is HCMC\u0027s premier hipster concept store offering a vast selection of original Vietnamese designer apparel and quality lifestyle goods.", "name": "L\u0027Usine Dong Khoi", "transport": "Located on the 2nd floor down an alley off Dong Khoi Street, about a 2-minute walk from the Saigon Opera House."}, {"address": "63B Mac Thi Buoi, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-buy list: Mekong Delta handmade ceramic tableware, woven bamboo heat-resistant placemats, artisanal handcrafted essential oil soaps. Beloved by local tastemakers and tourists alike, this lifestyle concept shop reimagines traditional crafts from the Mekong Delta and Southeast Asia into modern elevated pieces\u2014every single item is unique.", "name": "Sadec District Concept Store", "transport": "Near Dong Khoi Street, about a 3-minute walk from the Saigon Opera House."}, {"address": "101 Dong Khoi, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.8 stars | Must-buy list: Bao Loc pure mulberry silk printed scarves, organic cotton printed Ao Dai, handmade silk cushion covers. A flagship eco-luxury fashion brand in Vietnam using premium local silk and organic cotton. Blending Vietnamese landscapes with French design elegance, it stands as one of District 1\u0027s most refined luxury apparel boutiques.", "name": "Metiseko Dong Khoi", "transport": "Located on prestigious Dong Khoi Street, about a 2-minute walk from the Saigon Opera House."}], "name": "Major Department Stores \u0026 Outlets"}}, "name": "District 1 - Historic City Center and Landmark Sightseeing Area"}, "district_2_thaodien": {"categories": {"cat_1": {"items": [{"address": "64/3 Vo Truong Toan, Thao Dien, Quan 2, Thanh pho Ho Chi Minh", "feature": "\u2b50 4.6 stars | Must-buy list: French Organic Calendula Repair Cream, Herbal Soothing Essential Oils, Handmade Natural Scented Shampoo Bars. A premium organic beauty and skincare boutique combining French perfumery craftsmanship with local Vietnamese herbs, located in an elegant leafy villa in Thao Dien. Focusing on organic ingredients and chemical-free skincare, it is the ultimate choice for lovers of French-Vietnamese fragrances and organic care.", "name": "L\u0027Apothiquaire Artisan Beaut\u00e9 (L\u0027Apothiquaire Artisan Beaut\u00e9 - Thao Dien)", "transport": "Take a Grab taxi directly into the alley on Vo Truong Toan Street."}, {"address": "34 Xuan Thuy, Thao Dien, Quan 2, Thanh pho Ho Chi Minh", "feature": "\u2b50 4.4 stars | Must-buy list: Halio Facial Cleansing Device, Okame Botanical Hydrating Sheet Masks, Lixibox Limited Edition Beauty Sponge. A famous local cosmetics concept store highly popular among young women and trendy hipsters in Vietnam. Bright, minimal, and modern, it offers emerging Vietnamese local beauty brands, exclusive beauty devices, and botanical skincare products with excellent quality and beautiful packaging.", "name": "Lixibox Beauty Concept Store (Lixibox Thao Dien Boutique)", "transport": "Located on Thao Dien\u0027s main street, Xuan Thuy. Take a Grab directly to 34 Xuan Thuy Street."}, {"address": "133 Quoc Huong, Thao Dien, Quan 2, Thanh pho Ho Chi Minh", "feature": "\u2b50 4.5 stars | Must-buy list: Cocoon Winter Melon Anti-Acne Serum, Thorakao Turmeric Cream, Milaganics Pure Coconut Hair Oil. A major local pharmacy chain in Vietnam with high market share and an excellent reputation. Offering an extensive inventory, it is the cheapest and most complete place to buy viral local skincare brand Cocoon and heritage brand Thorakao. Extremely popular among local youth and tourists alike.", "name": "Hasaki Beauty \u0026 Pharmacy (Hasaki Beauty \u0026 Clinic - Quoc Huong)", "transport": "Take bus #43 or Grab and get off at 133 Quoc Huong Street."}, {"address": "56 Tran Ngoc Dien, Thao Dien, Quan 2, Thanh pho Ho Chi Minh", "feature": "\u2b50 4.7 stars | Must-buy list: Centella Soothing Facial Cleanser, Big Tree Natural Lip Balm, Handmade Herbal Shampoo Soap. C\u1ecf M\u1ec1m is an iconic local Vietnamese natural beauty brand emphasizing safety, non-toxicity, and purity. Renowned for its chemical-free philosophy, it uses native ingredients like Centella Asiatica, green tea, and rice bran to craft skincare and bath products, beloved by eco-conscious and health-minded locals.", "name": "C\u1ecf M\u1ec1m HomeLab Natural Cosmetics (C\u1ecf M\u1ec1m HomeLab Thao Dien)", "transport": "Take a Grab to 56 Tran Ngoc Dien Street."}, {"address": "21 Thao Dien, Quan 2, Thanh pho Ho Chi Minh", "feature": "\u2b50 4.3 stars | Must-buy list: Cocoon Coffee Body Scrub, Vietcoco Extra Virgin Coconut Oil, Bare Body Moisturizing Hand Cream. Nam An Market is a premier shopping hub for expats and affluent families in Thao Dien. Its beauty corner curates high-quality local organic cosmetics and hair care products. Highly recommended is its counter for local vegan skincare brand Cocoon, featuring beautifully packaged, natural, and effective products.", "name": "Nam An Market Beauty Corner (Nam An Market - Thao Dien Beauty Corner)", "transport": "Located near the entrance of Thao Dien Street; take a Grab to 21 Thao Dien."}, {"address": "Floor G, Thao Dien Pearl, 12 Quoc Huong, Thao Dien, Quan 2, Thanh pho Ho Chi Minh", "feature": "\u2b50 4.2 stars | Must-buy list: Bior\u00e9 Vietnam Limited Whitening Sunscreen, Cocoon Pomelo Hair Tonic Spray, Skinna Botanical Cleansing Oil. Located inside Thao Dien Pearl Mall, this large chain drugstore features a dedicated \u0027Local Vietnamese Beauty Zone\u0027 alongside major international brands. Neatly displaying local pharmacy brands, natural vegan makeup, and skincare, it is super convenient for tourists to stock up on popular local items in one go.", "name": "Watsons Thao Dien Pearl", "transport": "Take Metro Line 1 to Thao Dien Station and walk about 5 minutes, or take a Grab directly to Thao Dien Pearl Mall."}, {"address": "28 Tran Ngoc Dien, Thao Dien, Quan 2, Thanh pho Ho Chi Minh", "feature": "\u2b50 4.8 stars | Must-buy list: NauNau Custom Natural Perfume, Barespot Organic Turmeric Repair Serum, Natural Bamboo Charcoal Oil-Control Mask. Hidden in Thao Dien\u0027s hip neighborhood, this clean beauty select shop focuses on niche Vietnamese organic cosmetic brands and non-toxic skincare. Featuring a minimalist, artistic vibe with professional skincare consultation and testing, it is a fantastic secret gem for discovering local independent beauty brands.", "name": "Barespot Clean Beauty Studio", "transport": "Take a Grab to 28 Tran Ngoc Dien Street; located inside a trendy creative complex."}, {"address": "41 Thao Dien, Quan 2, Thanh pho Ho Chi Minh", "feature": "\u2b50 4.4 stars | Must-buy list: Azial Natural Organic Handmade Soap, Senseo Natural Herbal Insect Repellent Spray, Mekong Secret Organic Royal Jelly Lip Balm. The organic wellness and beauty department inside Annam Gourmet\u0027s flagship store in Thao Dien features handmade soaps, essential oils, and herbal balms from top local organic estates. Products are strictly certified organic, elegantly packaged with French-Vietnamese colonial aesthetic charm\u2014perfect as sophisticated souvenirs.", "name": "Annam Gourmet Thao Dien Wellness \u0026 Beauty Corner (Annam Gourmet Thao Dien Wellness \u0026 Beauty)", "transport": "Take a Grab directly to 41 Thao Dien Street."}], "name": "Local Iconic Beauty \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "145 Nguy\u1ec5n V\u0103n H\u01b0\u1edfng, Th\u1ea3o \u0110i\u1ec1n, Qu\u1eadn 2, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.7 stars | Must-Buys: Printed Mulberry Silk Scarves, Organic Cotton French Dresses, Bamboo Fiber Men\u0027s Resort Shirts. Metiseko is a renowned premium sustainable fashion brand in Vietnam, founded through a collaboration between French designers and local Vietnamese artisans. The brand incorporates Vietnam\u0027s natural landscapes and cultural elements into elegant print designs, using guaranteed 100% eco-friendly premium mulberry silk and organic cotton. Ultra-light, comfortable, and exceptionally textured, it is an unmissable temple of French-Vietnamese chic in the Thao Dien area.", "name": "Metiseko Sustainable Fashion (Metiseko - Thao Dien)", "transport": "Take a Grab taxi from District 1 city center for about 20 minutes to reach Nguy\u1ec5n V\u0103n H\u01b0\u1edfng Street in Th\u1ea3o \u0110i\u1ec1n."}, {"address": "25 Xu\u00e2n Th\u1ee7y, Th\u1ea3o \u0110i\u1ec1n, Qu\u1eadn 2, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-Buys: Ho Chi Minh City Street View Cotton T-Shirts, Saigon Motorbike Canvas Tote Bags, Vietnamese Geometric Pattern Baseball Caps. Ginkgo is a highly iconic local original apparel brand in Vietnam, featuring products made from 100% Fair Trade certified organic cotton. The apparel designs are filled with contemporary graffiti vibes and local Vietnamese symbols, combining eco-friendly concepts with trendy aesthetics, making it a favorite among hipster tourists and local expats alike.", "name": "Ginkgo Original Design Concept Store (Ginkgo Concept Store Thao Dien)", "transport": "Take Bus No. 43 or a Grab to Xu\u00e2n Th\u1ee7y Street and walk for 1 minute."}, {"address": "20 Ng\u00f4 Quang Huy, Th\u1ea3o \u0110i\u1ec1n, Qu\u1eadn 2, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Must-Buys: Tropical Woven Handbags, Pure Linen Printed Dresses, Genuine Leather Geometric Patchwork Wallets. Brimming with tropical resort vibes, this Thao Dien select shop specializes in independent fashion made from natural materials. The store displays a variety of hand-woven rattan bags and leather accessories crafted by local artisans. The clothing features airy, breezy cuts perfectly suited for Vietnam\u0027s warm climate, effortlessly embodying an elegant and casual Saigon resort style.", "name": "CoCo \u0026 Papaya Handmade Clothing \u0026 Bag Boutique (CoCo \u0026 Papaya)", "transport": "Turn onto Ng\u00f4 Quang Huy Street from the main Th\u1ea3o \u0110i\u1ec1n Street and walk for about 2 minutes."}, {"address": "68 L\u00ea V\u0103n Mi\u1ebfn, Th\u1ea3o \u0110i\u1ec1n, Qu\u1eadn 2, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.8 stars | Must-Buys: Handmade Patchwork Crossbody Bags, Embroidered Bamboo Handbags, Hand-stitched Linen Loungewear. Mekong Quilts is a social enterprise fashion brand dedicated to creating employment opportunities for underprivileged women in Vietnam\u0027s Mekong Delta and northern regions. Their patchwork bags and handcrafted apparel feature remarkably delicate details, blending traditional craftsmanship with modern aesthetics\u2014each item is a unique, heartwarming handmade creation.", "name": "Mekong Quilts Social Enterprise Boutique (Mekong Quilts Thao Dien)", "transport": "Take a Grab to L\u00ea V\u0103n Mi\u1ebfn Street, located near the hipster market area of Thao Dien."}, {"address": "24 Th\u1ea3o \u0110i\u1ec1n, Qu\u1eadn 2, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-Buys: Vietnamese Designer Collaboration Canvas Bags, Minimalist French Cotton-Linen Shirts, Handmade Genuine Leather Shoes. L\u0027Usine is Saigon\u0027s most iconic French lifestyle concept store. The Thao Dien flagship combines a cafe with a trendy fashion area, bringing together clothing, shoes, bags, and accessories from emerging local Vietnamese designers and international independent brands. Its stylish industrial-chic space makes it an excellent destination for discovering uniquely tasteful items.", "name": "L\u0027Usine Vintage \u0026 Lifestyle Concept Store (L\u0027Usine Thao Dien)", "transport": "Take a Grab directly to 24 Th\u1ea3o \u0110i\u1ec1n Street, situated right in the heart of the Thao Dien commercial district."}, {"address": "65 Xu\u00e2n Th\u1ee7y, Th\u1ea3o \u0110i\u1ec1n, Qu\u1eadn 2, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-Buys: Tailored White Shirts, High-Waisted Wide-Leg Jeans, Minimalist Leather Shoulder Bags. A rapidly rising local Vietnamese minimalist fashion brand for urban women, dedicated to creating sleek apparel that combines comfort and design. Featuring impeccable tailoring and high-quality fabrics, its versatile pieces exude effortless confidence, making it a favorite among Saigon fashion bloggers and local working professionals.", "name": "The Blue T-Shirt Minimalist Design Boutique (The Blue T-Shirt Thao Dien)", "transport": "Take a Grab to Xu\u00e2n Th\u1ee7y Street, located in the center of the bustling Xu\u00e2n Th\u1ee7y commercial district."}, {"address": "26 \u0110\u01b0\u1eddng s\u1ed1 10, Th\u1ea3o \u0110i\u1ec1n, Qu\u1eadn 2, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.8 stars | Must-Buys: Plant-Dyed Linen Wide-Leg Pants, Natural Handwoven Asymmetric Tops, Geometric Patchwork Fabric Bags. TimTay is a pioneer of the slow fashion movement in Vietnam, strictly using natural linen, pure cotton, and botanical dyes. All garments are handcrafted by experienced local Vietnamese tailors, emphasizing a relaxed, artistic vibe that is exceptionally breathable and skin-friendly with unique original charm.", "name": "TimTay Sustainable Design Studio (TimTay Studio)", "transport": "Take a Grab and navigate to Street 10 in Thao Dien; it\u0027s a short walk inside a quiet alley."}, {"address": "125 Th\u1ea3o \u0110i\u1ec1n, Qu\u1eadn 2, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Must-Buys: Vietnamese-Designed Sleek Square Crossbody Bags, Elegant Low-Heeled Pointed Sandals, Buckle Leather Tote Bags. Vascara is Vietnam\u0027s most famous and budget-friendly local women\u0027s shoe and bag brand. The Thao Dien store offers a wide variety of the latest trendy styles. Designed to follow international trends while tailored for Asian feet and daily practicality, its soft leather and highly affordable prices make it the top choice for tourists shopping for local Vietnamese footwear and bags.", "name": "Vascara Local Fashion Shoes \u0026 Bags (Vascara Thao Dien)", "transport": "Walk straight along the main Th\u1ea3o \u0110i\u1ec1n Street, and you will easily spot the bright storefront sign."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "90 Xuan Thuy, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-buy list: Single-origin 70% dark chocolate bars, rich cocoa hazelnut spread, handcrafted French cocoa truffle gift boxes. Hailed by The New York Times as \u0027the best local chocolate,\u0027 it is made entirely from refined cocoa beans sourced across six Vietnamese provinces. The flagship store in Thao Dien features an open roasting area and pastry kitchen, where customers can watch cocoa beans transform into premium chocolate. The dark chocolate here boasts vibrant fruity and nutty notes, wrapped in elegant Vietnamese foil-stamped designs\u2014an absolute must-buy luxury souvenir when visiting Thao Dien.", "name": "Maison Marou Thao Dien", "transport": "About a 20-minute Grab taxi ride from District 1; or take bus #43 to Xu\u00e2n Th\u1ee7y station and walk for 2 minutes."}, {"address": "41 Thao Dien, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-buy list: Premium Vietnamese salted roasted cashews, rich dried mango slices with skin, local Ho Chi Minh craft beer gift sets. As Vietnam\u2019s premier gourmet imported and local food market, the Thao Dien branch offers an extensive selection of fine foods. It features a dedicated local Vietnamese specialty section with handpicked pesticide-free organic teas, nutty specialty Vietnamese coffee beans, rare high-end cashews, and craft beers. The bright, comfortable shopping environment and premium packaging make souvenir shopping elegant and effortless.", "name": "Annam Gourmet Market Thao Dien", "transport": "Take a Grab taxi to near the intersection of Thao Dien Street and Nguyen Van Huong Street; or take bus #35 to Thao Dien station."}, {"address": "83 Xuan Thuy, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-buy list: Irregular organic-shaped ceramic teacups, pastel Morandi-toned dessert plates, handmade bamboo cutlery sets. Founded in Vietnam by Belgian and Dutch designers, this top-tier ceramic brand is famous for its ultra-light, durable, organically shaped pieces. The shop is filled with soft, marshmallow-like Morandi-colored tableware, each piece a unique handcrafted creation. Loved by expats and trendy hipsters, it makes a wonderful lifestyle souvenir for your home.", "name": "ama\u00ef grade a - Xuan Thuy", "transport": "Located in the heart of the Xuan Thuy shopping district. Take a Grab directly to 83 Xuan Thuy; easily explore nearby trendy boutiques on foot."}, {"address": "63 Xuan Thuy, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-buy list: Handwoven water hyacinth totes, traditional hand-painted glazed ceramic bowls, embossed handmade glass tumblers. This lifestyle select store merges traditional Vietnamese craftsmanship with modern minimalist aesthetics. Most items are crafted by ethnic minority artisans from the Mekong Delta and northern mountains of Vietnam, featuring finely woven straw bags, vintage hand-painted ceramics, and delicate home goods. Each piece carries rich local cultural colors, making it a high-quality, memorable souvenir.", "name": "Sadec District Thao Dien", "transport": "Take a Grab to Xuan Thuy Street, near the intersection with Quoc Huong; signs along the route are clear."}, {"address": "101 Xuan Thuy, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-buy list: 100% Vietnamese organic mulberry silk printed scarves, natural bamboo fiber printed Boston bags, artsy handcrafted pattern postcard sets. Metiseko is a high-end French-Vietnamese brand specializing in luxury organic mulberry silk and organic cotton textiles. Design inspirations are drawn entirely from Vietnam\u0027s natural landscapes and local cultural elements (such as lotus flowers, rice paddies, and tropical plants). The fabrics are skin-friendly and elegantly colored; whether silk scarves or small fabric accessories, they make top-tier gifts for loved ones.", "name": "Metiseko Thao Dien", "transport": "About a 15-20 minute Grab taxi ride from District 1; or take bus #43 to the Thao Dien area and walk."}, {"address": "29 Dang Huu Phuoc, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-buy list: Vintage Vietnamese glazed ceramic vases, exquisitely embroidered fabric napkins and placemats, organic lotus herbal tea gift sets. Combining Japanese zakka delicate aesthetics with Vietnamese rustic charm, this concept store is a favorite among local Japanese and Western expats. The store sells fine ceramics, fabric goods, delicate embroidery, select local herbal teas, and fragrance products. Each piece is crafted with exquisite detail and warmth\u2014perfect for packing your suitcase with unique gifts.", "name": "Kito Concept Store", "transport": "Located in a quiet alley on Dang Huu Phuoc; setting Grab destination directly there is recommended."}, {"address": "11A Nguyen Van Huong, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-buy list: Pure natural Vietnamese cocoa powder, low-sugar roasted cacao nibs, specialty Vietnamese cinnamon hot cocoa mix packets. Heyday is a local brand dedicated to developing Vietnamese cocoa regions, partnering directly with farmers in Dong Nai and the Mekong region. Their roasting technique preserves the subtle fruity acidity and rich nutty flavor unique to Vietnamese cacao beans. High-purity cocoa powder and cacao nibs are favorites among health-conscious eaters; with affordable prices and stylish design, it offers high-value edible gifts.", "name": "Heyday Cacao Thao Dien", "transport": "Take a Grab taxi to Nguyen Van Huong Street; located near the Saigon River waterfront with an elegant setting and convenient parking."}, {"address": "27 Xuan Thuy, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-buy list: Organic cotton Vietnamese illustration T-shirts, Saigon street scene canvas tote bags, hand-carved eco-friendly bamboo tumblers. Ginkgo is a renowned creative brand in Vietnam known for eco-friendly organic cotton apparel and lifestyle accessories. The printed designs overflow with humor and love for daily Vietnamese life, featuring scenes like overloaded scooters and traditional phin coffee filters. The comfortable, breathable fabric makes these great practical travel souvenirs for friends and family.", "name": "Ginkgo T-Shirts \u0026 Souvenirs Thao Dien", "transport": "Located right along the main Xuan Thuy street with convenient access; Grab rides can drop off directly at the entrance."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "161 Hanoi Highway, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: L\u0027angfarm Highland Mixed Dried Fruits, Phuc Long Oolong Tea Bags, Co.opXtra Premium Local Cashews. Located at the gateway of District 2, this mega shopping mall is a premier landmark combining shopping, dining, and entertainment. It houses numerous well-known local Vietnamese brands and a large supermarket where you can easily stock up on Vietnam\u0027s most iconic local specialties and snacks, making it a favorite spot for expats and tourists alike.", "name": "Vincom Mega Mall Thao Dien", "transport": "Take a Grab taxi or Metro Line 1 to Thao Dien Station, then walk for about 3 minutes."}, {"address": "19 Tran Ngoc Dien, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Designer collaboration canvas bags, handmade genuine leather coin purses, Thao Dien-themed creative postcards. BLOQ is an iconic open-air, container-style lifestyle complex in Thao Dien, bringing together emerging local Vietnamese designer boutiques and charming lifestyle stores. Centered around a semi-open courtyard, it\u0027s a popular spot for local youth and expats to hunt for unique treasures and enjoy a relaxed shopping experience.", "name": "BLOQ Retail \u0026 Lifestyle Complex", "transport": "Turn onto Tran Ngoc Dien Road from Thao Dien main street; it\u0027s a 5-minute walk or a quick Grab motorbike ride."}, {"address": "88 Song Hanh, An Phu, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Annam Gourmet premium single-origin drip coffee bags, Gingko original cotton T-shirts, NauNau natural essential oils. Located in An Phu, this upscale green lifestyle shopping center features a lush, semi-open design with natural ventilation. In addition to international brands, it showcases numerous high-end local Vietnamese lifestyle brands and gourmet supermarkets, making it the perfect destination to explore Ho Chi Minh City\u0027s refined local products and modern shopping culture.", "name": "Estella Place Shopping Center", "transport": "Drive along Song Hanh Road parallel to the highway; it takes about 5 to 8 minutes by taxi from the Thao Dien area."}, {"address": "123 Song Hanh, An Phu, District 2, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Discounted Nike professional running shoes, Adidas collaboration casual jackets, Supersports athletic accessories. Located on Song Hanh Road in District 2, this is one of the few large and popular brand outlets in Ho Chi Minh City. Offering seasonal footwear and sportswear at unbeatable discount prices\u2014often ranging from 30% to 70% off\u2014it\u0027s a must-visit bargain haven for sports and streetwear enthusiasts.", "name": "Nike \u0026 Sports Outlet Song Hanh", "transport": "Located near Estella Place Shopping Center; taking a Grab taxi directly is recommended."}, {"address": "32 Tran Ngoc Dien, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Handwoven rattan placemats, organic essential oil soaps, Vietnamese bamboo home decor. As one of Thao Dien\u0027s longest-standing garden-style shopping yards, this tropical oasis is surrounded by charming independent boutiques. You\u0027ll find handmade crafts, ethnic textiles, eco-friendly skincare products, and children\u0027s apparel. With its laid-back Bohemian vibe, it\u0027s a fantastic spot to discover unique handcrafted items and enjoy a relaxing shopping afternoon.", "name": "The Snap Cafe \u0026 Shopping Yard", "transport": "Located on Tran Ngoc Dien Street; about a 7-minute walk from Thao Dien main street or a short Grab motorbike ride."}, {"address": "63 Xuan Thuy, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade Mekong ceramic tea sets, lacquerware art plates, hand-printed cotton/linen tablecloths. Sadec District is a renowned local craft and design brand in Ho Chi Minh City that transforms traditional craftsmanship from the Mekong Delta into contemporary lifestyle products. The Thao Dien flagship showcases a stunning collection of ceramics, bamboo goods, and woodwork, each reflecting rich Vietnamese aesthetic artistry\u2014ideal for high-quality, memorable souvenirs.", "name": "Sadec District Two", "transport": "Located on Xuan Thuy Street, the busiest commercial strip in Thao Dien; best reached by taking a Grab taxi right to the entrance."}, {"address": "142 Xuan Thuy, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.8 stars | Must-Buy List: 100% Vietnamese organic mulberry silk printed scarves, hand-drawn motif silk shirts, naturally dyed cushion covers. Metiseko is a high-end independent Vietnamese designer brand famed for using 100% locally produced organic silk and organic cotton. Featuring elegant, mansion-like decor, this flagship store incorporates traditional Vietnamese cultural motifs\u2014such as lotus flowers and rice fields\u2014into modern print designs. Every piece is unique, representing the pinnacle of local luxury fashion and home decor.", "name": "Metiseko Thao Dien Flagship Concept Store", "transport": "Easily accessible on foot along Xuan Thuy Street, or a 5-minute drive from Thao Dien Metro Station."}, {"address": "240-242 Pham Van Dong, Hiep Binh Chanh, Thu Duc, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Supersports clearance sneakers, delicate Vietnamese lacquer jewelry boxes, Sense City specialty cashew gift sets. Located near District 2, this massive shopping center features a large dedicated outlet zone and the local Sense City department store area. Beyond international brand clearance outlets, it houses numerous stalls offering local Vietnamese handicrafts and agricultural specialties at budget-friendly prices, making it a favorite shopping haven among locals.", "name": "GigaMall Shopping \u0026 Outlet Center", "transport": "About a 10-to-12-minute taxi ride from the Thao Dien area in District 2 across the Binh Loi Bridge."}], "name": "Major Shopping Malls \u0026 Recommended Outlets"}}, "name": "District 2 - Thao Dien: International Flair and Trendy Hipster District"}, "district_3_culture": {"categories": {"cat_1": {"items": [{"address": "218 Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-Buy List: Handcrafted essential oil perfumes, natural botanical hydrating hand creams, Ylang-Ylang essential oil fragrances. NauNau is a renowned local independent Vietnamese fragrance and natural cosmetics brand founded by a Vietnamese perfumer. The District 3 boutique exudes a warm, hipster ambiance, focusing on skincare and fragrances crafted from local natural plant extracts and premium essential oils. The products are gentle, non-irritating, and beautifully packaged\u2014making them ideal culturally rich souvenirs. The shop also frequently hosts DIY perfume-making workshops, which are highly popular among local youth and hipster travelers.", "name": "NauNau DIY Studio \u0026 Perfume (District 3)", "transport": "Take a Grab car or motorbike to Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u Street; located near Tan Dinh Pink Church, about an 8-minute walk."}, {"address": "71 Tr\u1ea7n Quang Di\u1ec7u, Ward 14, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Cocoon Coffee Body Scrub, Cocoon Turmeric Facial Cleanser, Lana Coconut Oil Nourishing Cream. Hasaki is a leading local beauty and drugstore chain in Vietnam with a massive flagship store on Tr\u1ea7n Quang Di\u1ec7u Street in District 3. The store features a dedicated section for local Vietnamese brands, spotlighting globally famous vegan cosmetics brands like Cocoon. Cocoon specializes in skincare made from local agricultural products such as Cao Bang coffee beans and Hung Yen turmeric. Offering budget-friendly prices and guaranteed authentic products, Hasaki is the most comprehensive and trustworthy spot to shop for best-selling Vietnamese beauty items.", "name": "Hasaki Beauty \u0026 Clinic Flagship Store (Tr\u1ea7n Quang Di\u1ec7u)", "transport": "Take a Grab motorbike or taxi to Tr\u1ea7n Quang Di\u1ec7u Street, near the District 3 Railway Station area."}, {"address": "305 V\u00f5 V\u0103n T\u1ea7n, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.8 stars | Must-Buy List: B3 Calendula Soothing Serum, Witch Hazel Oil-Control Cleansing Water, Herbal Anti-Acne Repair Gel. Zakka Naturals is an acclaimed independent Vietnamese natural skincare brand located on the bustling V\u00f5 V\u0103n T\u1ea7n Street in District 3. The brand was created to address skin issues caused by Southeast Asia\u0027s hot and humid climate using natural botanical formulas. The store boasts a minimalist, bright aesthetic, and all products undergo rigorous dermatological testing. Its Calendula and Witch Hazel series enjoy a stellar reputation across local Vietnamese social media, making it a favorite among young women and budget-conscious shoppers looking for premium local indie beauty products.", "name": "Zakka Naturals Flagship Store (V\u00f5 V\u0103n T\u1ea7n)", "transport": "Take Bus No. 05 or 14 to V\u00f5 V\u0103n T\u1ea7n Stop, then walk for 2 minutes."}, {"address": "46 Cao Th\u1eafng, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Lemonade Dual Matte Tint, Lemonade Soft-Focus Cushion, Of\u00e9lia Velvet Lip Tint. Situated on the vibrant Cao Th\u1eafng shopping street in District 3, BeautyBox is a flagship beauty concept store popular among trendy young locals. Aside from carrying international trendsetting beauty products, it prominently features local makeup brands founded by Vietnamese celebrities\u2014such as Lemonade, created by famous MUA Qu\u00e1ch \u00c1nh and tailored specifically for Southeast Asian skin tones and climates. Featuring stylish decor and spacious trial stations, it\u0027s the perfect one-stop spot for cutting-edge Vietnamese cosmetics.", "name": "BeautyBox Trendy Beauty Concept Store (Cao Th\u1eafng)", "transport": "Take a Grab or bus to the intersection of Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u and Cao Th\u1eafng, then walk for about 1 minute."}, {"address": "284 V\u00f5 V\u0103n T\u1ea7n, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Vietnamese Lotus Hydration Serum, Centella Asiatica Repairing Mask, Green Tea Antioxidant Cleansing Mousse. Skinna is a premium local organic skincare brand combining traditional herbal heritage with modern technology. Its R\u0026D team draws inspiration from ancient Vietnamese royal beauty secrets, utilizing native plant extracts like lotus, centella, and green tea. The District 3 boutique offers a serene, elegant atmosphere with staff providing professional skin consultation. Free of harmful chemicals and elegantly packaged, Skinna\u0027s products are highly favored by women who value skin health and eco-friendliness.", "name": "Skinna Organic Skincare (District 3)", "transport": "Take Grab to the V\u00f5 V\u0103n T\u1ea7n area, conveniently located in the heart of District 3."}, {"address": "219 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Thorakao Traditional Turmeric Acne Cream, Thorakao Pomelo Peel Scalp Care Spray, Goat Milk Moisturizing Facial Wash. Founded in 1961, Thorakao is a household vintage beauty and skincare brand in Vietnam. This District 3 showroom displays classic items tied to generations of childhood memories. The brand\u0027s signature lies in its use of traditional Vietnamese herbal ingredients\u2014such as turmeric, pomelo peel, cucumber, and goat milk\u2014offered at ultra-affordable prices with remarkable effectiveness. In particular, the turmeric cream and pomelo hair spray are top vintage souvenirs frequently stockpiled by savvy international travelers.", "name": "Thorakao Traditional Heritage Showroom (District 3)", "transport": "Take Bus No. 150 to \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Stop, or take a Grab directly to the entrance."}, {"address": "313 Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-Buy List: Vedette Vietnamese Natural Clay Mask, Milaganics Cold-Pressed Pure Coconut Oil, Thorakao Luffa Facial Cleanser. Guardian is a major health and beauty retail chain in Southeast Asia, and its branch on Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u Avenue in District 3 boasts an extensive inventory. The store features a large \u0027Vietnam Best Sellers\u0027 zone displaying top-quality locally made beauty products. Milaganics cold-pressed coconut oil and Vedette mineral clay masks are frequently discounted here, making it ideal for those looking for a quick one-stop shopping spree for local skincare and hydrating cosmetics.", "name": "Guardian Health \u0026 Beauty (Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u)", "transport": "Take a Grab, or walk for about 10 minutes from Tan Dinh Pink Church in District 3."}, {"address": "379-381 V\u00f5 V\u0103n T\u1ea7n, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Golden Star Balm (Cao Sao V\u00e0ng), Thien Thao Medicated Oil (D\u1ea7u Gi\u00f3 Xanh Thi\u00ean Th\u1ea3o), Bao Thanh Herbal Loquat Syrup. FPT Long Ch\u00e2u is one of Vietnam\u0027s largest and most trusted pharmacy chains. Its spacious branch on V\u00f5 V\u0103n T\u1ea7n Street in District 3 is staffed with professional pharmacists. Besides general medicine, it is the best place to purchase traditional Vietnamese healthcare products, herbal ointments, and medicated oils. Classic Golden Star Balm and essential oil balms are sold here at transparent prices with guaranteed authenticity. Many locals and tourists visit specifically to stock up on traditional herbal remedies for mosquito bites, headache relief, and everyday wellness.", "name": "FPT Long Ch\u00e2u Pharmacy (V\u00f5 V\u0103n T\u1ea7n)", "transport": "Take a Grab or bus to the intersection of V\u00f5 V\u0103n T\u1ea7n and Cao Th\u1eafng, then walk for 2 minutes."}], "name": "Local Iconic Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "502 L\u00ea V\u0103n S\u1ef9, Ward 14, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Must-Buys: Minimalist linen dresses, vintage high-waisted wide-leg pants, French floral short-sleeve tops. Dottie is a popular local fashion brand beloved by young Vietnamese women and office workers, situated right in the heart of the L\u00ea V\u0103n S\u1ef9 shopping street in District 3. The brand\u0027s style leans towards fresh minimalism and French romanticism, with tailored cuts that flatter Asian body frames. The bright, comfortable store environment features garments made from breathable linen and cotton blends tailored for tropical weather. With affordable prices and fantastic quality, it\u0027s a prime spot for everyday casual and chic wardrobe additions.", "name": "Dottie Clothing Store (Dottie L\u00ea V\u0103n S\u1ef9)", "transport": "Take Grab or Bus No. 28 to L\u00ea V\u0103n S\u1ef9 station, then walk about 2 minutes."}, {"address": "508 L\u00ea V\u0103n S\u1ef9, Ward 14, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | Must-Buys: Breathable cotton-linen casual shirts, slim-fit cropped trousers, minimalist heavy-cotton T-shirts. ROUTINE is one of Vietnam\u0027s most iconic domestic fashion brands, renowned for excellent tailoring and modern minimalism. While it offers both men\u0027s and women\u0027s apparel, its menswear line is particularly praised by local trendsetters and expats. Designed seamlessly for both weekday commutes and weekend getaways, the clothes use premium breathable cotton-linen and stretchy fabrics for supreme comfort, rivaling international designer brands.", "name": "ROUTINE Menswear \u0026 Fashion (ROUTINE L\u00ea V\u0103n S\u1ef9)", "transport": "Take a Grab car or bike to L\u00ea V\u0103n S\u1ef9 Street; it is located near the Dottie store."}, {"address": "223 L\u00ea V\u0103n S\u1ef9, Ward 13, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Must-Buys: Smart-casual chiffon printed dresses, structured designer skirts, sweet knit cardigans. MARC Fashion is a highly popular homegrown womenswear brand known for blending seasonal trends with effortless elegance. The spacious flagship store in District 3 updates its collections rapidly, offering everything from sharp urban office wear to flowy vacation dresses perfect for Instagram photos. It\u2019s a top go-to shopping destination for local young women.", "name": "MARC Fashion (MARC Fashion L\u00ea V\u0103n S\u1ef9)", "transport": "About a 7-minute Grab ride from Tan Dinh Church (the Pink Church)."}, {"address": "43A Tr\u01b0\u01a1ng \u0110\u1ecbnh, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.8 Stars | Must-Buys: Goodyear welted handcrafted leather shoes, vintage hand-patina loafers, exquisitely crafted leather cardholders. CNES is Vietnam\u0027s premiere handcrafted footwear brand, enjoying a prestigious international reputation. The brand stays committed to traditional Goodyear welted construction, selecting fine calfskin imported from Europe. Its flagship store on Tr\u01b0\u01a1ng \u0110\u1ecbnh Street exudes vintage British charm, offering off-the-rack shoes and bespoke made-to-measure services at roughly one-third the price of European shoes of equivalent quality\u2014an exceptional value.", "name": "CNES Shoemaker Handcrafted Leather Shoes (CNES Shoemaker Tr\u01b0\u01a1ng \u0110\u1ecbnh)", "transport": "Near Tao Dan Park; about a 12-minute walk or a 3-minute Grab ride from Tan Dinh Church."}, {"address": "375-377 Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Must-Buys: Urban chic leather handbags, elegant pointed heels, summer resort sandals. Vascara is a hugely popular and extensive Vietnamese shoes and bags brand, often dubbed Vietnam\u0027s national fashion brand. The branch on Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u Street displays a vast collection of the latest seasonal products, featuring stylish, versatile designs that balance comfort and durability. With highly competitive prices, it\u0027s ideal for travelers looking for high-quality leather goods.", "name": "Vascara Shoes \u0026 Bags (Vascara Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u)", "transport": "Take a Grab and get off near the intersection of Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u and Cao Th\u1eafng."}, {"address": "352 L\u00ea V\u0103n S\u1ef9, Ward 14, District 3, Ho Chi Minh City", "feature": "\u2b50 4.2 Stars | Must-Buys: Ultra-cushioned walking shoes, elegant woven totes, versatile low block-heel shoes. Juno is a hugely popular local brand specializing in footwear specifically tailored to Asian feet, alongside stylish multifunctional bags. The store in District 3\u0027s fashion district carries a comprehensive range of items; its soft-soled shoes and lightweight sandals are daily commute staples for many local women. Affordable and reliable, it\u0027s a go-to spot for finding great-value accessories.", "name": "Juno Trendy Shoes \u0026 Bags (Juno L\u00ea V\u0103n S\u1ef9)", "transport": "Take a Grab car to L\u00ea V\u0103n S\u1ef9 main street; it is surrounded by numerous fashion boutiques."}, {"address": "190 L\u00ea V\u0103n S\u1ef9, Ward 10, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Must-Buys: Vietnamese streetwear hoodies, versatile utility backpacks, original collaboration graphic tees. YaMe is a favorite local streetwear brand among teenagers and university students, rapidly rising in popularity thanks to its unique original prints and wallet-friendly prices. The store features a cool industrial-style interior, offering menswear, womenswear, backpacks, and trendy accessories. Don\u0027t miss this spot if you want to experience authentic youth street culture in Vietnam.", "name": "YaMe Streetwear \u0026 Accessories (YaMe Shop L\u00ea V\u0103n S\u1ef9)", "transport": "Take Bus No. 28 to L\u00ea V\u0103n S\u1ef9 station, or easily reach it by Grab bike."}, {"address": "248 L\u00ea V\u0103n S\u1ef9, Ward 14, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Must-Buys: French minimalist crossbody bags, pastel-toned handbags, elegant versatile pointed flats. Sablanca is a prominent Vietnamese leather goods brand catering to women seeking a refined, elegant lifestyle. The boutique boasts a warm and graceful interior displaying finely stitched high-quality faux leather handbags, shoulder bags, and footwear. With designs balancing practical storage and stylish aesthetics, these items make wonderful gifts for friends and family.", "name": "Sablanca Women\u0027s Shoes \u0026 Bags Boutique (Sablanca L\u00ea V\u0103n S\u1ef9)", "transport": "Take a Grab to the L\u00ea V\u0103n S\u1ef9 store. Convenient parking is available nearby, and it is easy to explore neighboring boutiques on foot."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "168-170 V\u00f5 V\u0103n T\u1ea7n, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Mekong Delta single-origin dark chocolate, rich cocoa spread, artisanal cocoa nib blocks. Praised by The New York Times as the finest chocolate, made entirely from high-quality local Vietnamese cocoa beans. The chic, French retro packaging makes it an absolute top choice for gifts.", "name": "Maison Marou V\u00f5 V\u0103n T\u1ea7n", "transport": "Take a Grab ride from the Pink Church (T\u00e2n \u0110\u1ecbnh Church); takes about 8 minutes."}, {"address": "336 Hai B\u00e0 Tr\u01b0ng, Ward 8, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Salt-roasted skin-on cashews, mixed dried fruits, whole-bean Vietnamese coffee. Located right across from the Pink Church, this century-old traditional market features dry goods stalls packed with options at wallet-friendly prices. Perfect for authentic traditional nuts and addictive local snacks.", "name": "T\u00e2n \u0110\u1ecbnh Market Souvenir Stalls (Ch\u1ee3 T\u00e2n \u0110\u1ecbnh)", "transport": "Located directly opposite the Pink Church (T\u00e2n \u0110\u1ecbnh Church), just a 1-minute walk."}, {"address": "116 V\u00f5 Th\u1ecb S\u00e1u, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Dark chocolate-dipped orange peel, low-sugar dried passion fruit, roasted plain cashews. Founded with an R\u0026D background from Nong Lam University, this healthy snack brand focuses on preserving original fruit flavors and nutrition. Its clean, charming packaging is a huge hit with travelers.", "name": "Nonglamfood - V\u00f5 Th\u1ecb S\u00e1u", "transport": "Walk for about 7 minutes from the Pink Church along V\u00f5 Th\u1ecb S\u00e1u Street."}, {"address": "171 L\u00ea V\u0103n S\u1ef9, Ward 13, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Da Lat artichoke tea, natural dried strawberries, crispy sweet potato sticks. A famous specialty brand hailing from Da Lat, Vietnam\u0027s cool mountain retreat. The store is bright and welcoming, offering a high-quality selection of healthy herbal teas, low-sugar dried fruits, and artisanal candy gift sets.", "name": "L\u0027angfarm Store - L\u00ea V\u0103n S\u1ef9", "transport": "About a 12-minute Grab ride from the Pink Church."}, {"address": "30 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Tropical fruit-filled chocolates, Vietnamese chili dark chocolate, handmade ginger truffles. Specializes in infusing artisanal chocolates with local Vietnamese ingredients like chili, pepper, ginger, and various tropical fruits for truly unique, localized flavor profiles.", "name": "Legendary Chocolatier - Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch", "transport": "About a 4-minute Grab ride or a 10-minute walk from the Pink Church."}, {"address": "168 Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-Buy List: G7 3-in-1 instant coffee, Vinamit vacuum-fried jackfruit chips, Pho broth seasoning packs. A local-favorite supermarket chain in District 3. It boasts a huge souvenir and snack section with transparent, affordable prices\u2014super convenient for grabbing popular everyday snacks.", "name": "Co.opmart Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u", "transport": "About a 6-minute Grab ride from the Pink Church."}, {"address": "42 Tr\u1ea7n Cao V\u00e2n, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: High-mountain jasmine green tea leaves, Royal Lotus tea bags, whole-bean roasted Vietnamese coffee. A heritage tea and coffee brand in Vietnam. Beyond fresh handcrafted beverages, their packaged loose-leaf teas and coffee beans are wildly popular gifts for locals and tourists alike.", "name": "Ph\u00fac Long Coffee \u0026 Tea - Tr\u1ea7n Cao V\u00e2n", "transport": "Located near Turtle Lake Roundabout; about a 5-minute Grab ride from the Pink Church."}, {"address": "41 V\u00f5 V\u0103n T\u1ea7n, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Vietnamese craft beers, premium wild raw honey, Ph\u00fa Qu\u1ed1c top-grade fish sauce gift sets. An upscale gourmet supermarket brand offering curated top-tier agricultural products and independent brand gifts from across Vietnam. Ideal for travelers looking for high-end gift sets.", "name": "Annam Gourmet - V\u00f5 V\u0103n T\u1ea7n", "transport": "About a 7-minute Grab ride from the Pink Church."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "235 Nam Ky Khoi Nghia, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buys: Discounted CK classic logo tees, Gap outerwear, Tommy Hilfiger shirts. This is a renowned authentic brand factory outlet in District 3, Ho Chi Minh City, specializing in overstock and past-season items from Western brands. Prices are typically 50% to 70% off original retail, making it the top treasure-hunting spot for local youth and savvy travelers seeking American casual wear.", "name": "Factory Outlet American Brand Center (Factory Outlet Nam K\u1ef3 Kh\u1edfi Ngh\u0129a)", "transport": "Take bus 04 or 152 to Nam Ky Khoi Nghia stop and walk for about 2 minutes, or take a Grab from Tan Dinh Church (Pink Church) for about 3 minutes."}, {"address": "117 Nguyen Dinh Chieu, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Must-Buys: Bonia leather bags, L\u0027Occitane skincare sets, Co.op Finelife premium local food gift boxes. A boutique mid-sized department store located in the heart of District 3. Combining European elegance with modern retail space, it features an upscale supermarket on the ground floor and various mid-to-high-end international and Vietnamese fashion brands upstairs. It offers a relaxed, uncrowded shopping experience perfect for enjoying District 3\u0027s sophisticated urban lifestyle.", "name": "RomeA Shopping Center", "transport": "Walk for about 10 minutes from Tan Dinh Church (Pink Church) down Nam Ky Khoi Nghia and turn onto Nguyen Dinh Chieu, or take a Grab for about 3 minutes."}, {"address": "168 Nguyen Dinh Chieu, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-Buys: G7 Vietnamese cashew gift boxes, Marou artisanal chocolates, Trung Nguyen drip coffee powder. As the flagship store of Vietnam\u0027s iconic homegrown supermarket chain, this location offers a complete grocery selection along with a dedicated Vietnamese specialty goods section. With transparent and highly competitive pricing, it\u0027s the ultimate hub for locals and tourists to stock up on authentic souvenirs and daily essentials.", "name": "Co.opmart Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u Flagship Store", "transport": "Just a 3-minute walk from RomeA Shopping Center. You can also take Bus 150 to Nguyen Dinh Chieu stop."}, {"address": "64A Truong Dinh, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buys: Organic coconut nourishing cream, artisanal herbal essential oil balms, French bamboo charcoal deep cleansing masks. Housed in an elegant French colonial villa in District 3, this boutique beauty concept store specializes in French luxury skincare and natural organic botanical products. Nestled in a poetic, serene environment, it offers house-formulated herbal skincare alongside curated organic international beauty brands, highly favored by local socialites and international visitors.", "name": "L\u0027Apothiquaire Artisan Beaut\u00e9 Tr\u01b0\u01a1ng \u0110\u1ecbnh", "transport": "About a 4-minute Grab ride from Tan Dinh Church (Pink Church) to reach this tranquil colonial-style residential neighborhood."}, {"address": "286 Le Van Sy, Ward 14, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buys: YaMe original graphic tees, Vietnamese typography hoodies, multi-pocket canvas backpacks. YaMe is a highly iconic local youth streetwear brand and department store located on District 3\u0027s famous clothing street, Le Van Sy. Spanning several floors designed for the younger generation, it offers apparel, shoes, and accessories infused with contemporary Vietnamese street culture, featuring incredible value and original design energy.", "name": "YaMe Original Streetwear Flagship Store (YaMe.vn L\u00ea V\u0103n S\u1ef9)", "transport": "Take Bus 28 to Le Van Sy stop, or take a Grab ride of about 8 minutes from central District 3."}, {"address": "286B Le Van Sy, Ward 14, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buys: Morandi-toned woven sandals, elegant office leather handbags, classic pointed low heels. Vascara is Vietnam\u0027s most famous homegrown brand for women\u0027s shoes, bags, and accessories, specifically tailored to Asian sizing and aesthetics. This flagship store in District 3 boasts an extensive collection ranging from casual daily sandals to sophisticated evening clutches. Offering quality comparable to international designer brands at very accessible prices, it\u0027s a must-visit shoe and bag paradise for female travelers.", "name": "Vascara Vietnamese Footwear \u0026 Bags Flagship Store (Vascara L\u00ea V\u0103n S\u1ef9)", "transport": "Located next to the YaMe Flagship store; take Bus 28 to Le Van Sy stop and walk for 1 minute."}, {"address": "254 Truong Dinh, Ward 9, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buys: Organic cotton Saigon street scene graphic tees, Vietnam map bamboo-fiber tote bags, unique hand-painted ceramic mugs. Ginkgo is a quintessential Saigon brand for organic eco-friendly apparel and lifestyle goods. Crafting items with 100% organic cotton and sustainable materials, they blend local elements like HCMC\u0027s colonial architecture, vintage Vespa scooters, and iconic local foods into stylish designs. With exceptional product quality, it\u0027s the top spot for purchasing fashionable yet meaningful souvenirs.", "name": "Ginkgo Organic Concept Store (Ginkgo Concept Store Tr\u01b0\u01a1ng \u0110\u1ecbnh)", "transport": "About a 5-minute Grab ride from Tan Dinh Church (Pink Church), located on the tree-lined Truong Dinh Street."}, {"address": "323 Le Van Sy, Ward 13, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buys: French-tailored dresses, discounted tailored blazers, Vietnamese silk embroidered tops. Elise is one of Vietnam\u0027s leading high-end womenswear brands, combining French romantic aesthetics with meticulous Vietnamese tailoring. This District 3 location features a year-round dedicated outlet section where you can score top-quality womenswear and fashion accessories at up to 50% off or more\u2014offering remarkable value and local flair.", "name": "Elise Fashion \u0026 Outlet Flagship Store (Elise L\u00ea V\u0103n S\u1ef9)", "transport": "Take Bus 28 to Le Van Sy stop, or take a Grab ride for about 7 minutes from Tan Dinh Church (Pink Church)."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "District 3 - Colonial Architecture and Pink Church Cultural District"}, "district_5_cholon": {"categories": {"cat_1": {"items": [{"address": "241 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o B, Ward 10, District 5, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-buy list: Thorakao Turmeric Facial Cleanser, Pomelo Peel Anti-Hair Loss Essence, Goat Milk Moisturizing Cream. Thorakao is Vietnam\u0027s most iconic heritage cosmetics brand, founded in the 1960s and specializing in local natural botanical extracts. This flagship showroom in District 5 offers an extensive lineup. Its signature turmeric series has been a beloved staple for Vietnamese women since childhood for treating acne, fading spots, and brightening skin\u2014offering exceptional quality at budget-friendly prices that make perfect souvenirs.", "name": "Thorakao Showroom Tran Hung Dao (Classic Vietnamese Natural Cosmetics)", "transport": "Take bus 01 or 56 to Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Station, then walk for about 3 minutes."}, {"address": "102 H\u1ea3i Th\u01b0\u1ee3ng L\u00e3n \u00d4ng, Ward 10, District 5, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-buy list: Herbal Anti-Acne Ointment, Pearl \u0026 Gromwell Soothing Cream, Vietnamese Ginseng Vitality Oil. Nestled on Cho Lon\u0027s famous H\u1ea3i Th\u01b0\u1ee3ng L\u00e3n \u00d4ng Herbal Medicine Street, V\u1ea1n H\u00f2a \u0110\u01b0\u1eddng carries decades of traditional Chinese medicine heritage. Combining traditional herbal recipes with local Vietnamese botanicals, they developed a natural, additive-free skincare line. Their exclusive anti-acne ointment and gromwell cream are immensely popular among locals and tourists alike for effectively soothing and repairing skin.", "name": "V\u1ea1n H\u00f2a \u0110\u01b0\u1eddng Traditional Herbal Pharmacy (Nh\u00e0 Thu\u1ed1c Y H\u1ecdc C\u1ed5 Truy\u1ec1n V\u1ea1n H\u00f2a \u0110\u01b0\u1eddng)", "transport": "Take bus 07 or 150 to H\u1ea3i Th\u01b0\u1ee3ng L\u00e3n \u00d4ng Station, then walk for about 2 minutes."}, {"address": "141-143 Nguy\u1ec5n Tr\u00e3i, Ward 2, District 5, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-buy list: Cocoon Vietnamese Coffee Body Scrub, Vedette Green Clay Deep Cleansing Mask, Thorakao Turmeric Serum. Hasaki is one of Vietnam\u0027s most trendy and popular drugstore chains among youth. This spacious and well-lit branch on the Nguy\u1ec5n Tr\u00e3i shopping street features a massive \u0027Local Vietnamese Brands Zone\u0027 alongside global beauty giants, allowing you to snag popular vegan, natural skincare lines like Cocoon at fantastic prices.", "name": "Hasaki Beauty \u0026 Clinic - Nguy\u1ec5n Tr\u00e3i District 5", "transport": "Take bus 06 or 56 to Nguy\u1ec5n Tr\u00e3i Station, then walk for about 1 minute."}, {"address": "218 Nguy\u1ec5n Tr\u00e3i, Ward 3, District 5, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-buy list: Golden Star Balm (Cao Sao V\u00e0ng), Th\u00e1i D\u01b0\u01a1ng Herbal Anti-Hair Loss Shampoo, Vietnamese Medicated Essential Oils. An Khang is a professional healthcare chain under a renowned Vietnamese retail group, fully stocked with pharmaceuticals and home health essentials. A top pick here is Vietnam\u0027s iconic \u0027Golden Star Balm\u0027 along with various traditional herbal oils\u2014offering transparent pricing and guaranteed authenticity for traditional wellness gifts.", "name": "An Khang Pharmacy - Nguy\u1ec5n Tr\u00e3i District 5 (Nh\u00e0 Thu\u1ed1c An Khang)", "transport": "Take bus 139 or 56 to Nguy\u1ec5n Tr\u00e3i Station to arrive directly."}, {"address": "112 H\u1ea3i Th\u01b0\u1ee3ng L\u00e3n \u00d4ng, Ward 10, District 5, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-buy list: Seven-White Herbal Brightening Powder Mask, Sophora Anti-Acne Handmade Soap, Agarwood \u0026 Mugwort Soothing Bath Pack. Located in the core of Cho Lon\u0027s traditional medicine quarter, this decades-old apothecary finely grinds natural herbs into powders for customers to make DIY face masks. Their cold-process soaps crafted with local herbal ingredients give off a refreshing natural fragrance, attracting clean-beauty enthusiasts looking for non-toxic skincare.", "name": "C\u1ea3nh H\u00f2a Herb \u0026 Traditional Cosmetics", "transport": "Take bus 07 to H\u1ea3i Th\u01b0\u1ee3ng L\u00e3n \u00d4ng Station, then walk for about 3 minutes."}, {"address": "151 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o B, Ward 10, District 5, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-buy list: Lemonade Matte Lip Stain, Cocoon Winter Melon Anti-Acne Soothing Toner, S\u1eafc Ng\u1ecdc Khang Brightening \u0026 Anti-Spot Set. Beauty Garden is a well-known local beauty multi-brand store specializing in hot Southeast Asian and local makeup. It stocks Lemonade, a viral cosmetics brand created by a top Vietnamese makeup artist formulated specifically to endure hot and humid tropical climates\u2014a absolute makeup paradise for beauty lovers visiting District 5.", "name": "Beauty Garden Cosmetics - District 5", "transport": "Take bus 01 to Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Station, then walk for about 2 minutes."}, {"address": "39 Ch\u00e2u V\u0103n Li\u00eam, Ward 14, District 5, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-buy list: Skinna Centella Repair Serum, Pharmacity Pure Coconut Oil Lip Balm, Vietnamese Herbal Cooling Patches. Pharmacity is one of Vietnam\u0027s most ubiquitous modern health and beauty chains. This branch on Ch\u00e2u V\u0103n Li\u00eam Boulevard provides warm and attentive service. It carries a wide selection of wellness products featuring local botanicals (like Centella asiatica and coconut oil), offering strict quality standards, a clean environment, and effortless shopping.", "name": "Pharmacity - Chau Van Liem District 5", "transport": "Take bus 56 to Ch\u00e2u V\u0103n Li\u00eam Station, then walk for about 1 minute."}, {"address": "18 An D\u01b0\u01a1ng V\u01b0\u01a1ng, Ward 9, District 5, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-buy list: Cocoon Pomelo Essential Oil Scalp Hair Tonic, Emmi\u00e9 by Happy Skin Exfoliating Acid Solution, Bior\u00e9 Vietnam Limited Refreshing Sunscreen. Situated inside An Dong Plaza, Guardian is a favorite go-to spot for locals purchasing daily skincare and personal care essentials. It spotlights innovative Vietnamese homegrown brands, such as Emmi\u00e9 by Happy Skin (founded by a famous local beauty blogger) and Cocoon\u0027s complete vegan line, boasting incredible variety and frequent promotions.", "name": "Guardian - An Dong Plaza", "transport": "Take bus 06 or 11 to An D\u01b0\u01a1ng V\u01b0\u01a1ng Station, then walk directly into An Dong Plaza."}], "name": "Local Iconic Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "C\u00f4ng tr\u01b0\u1eddng An \u0110\u00f4ng, Ph\u01b0\u1eddng 9, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Must-Buy List: Hand-embroidered ethnic style bags, Vietnamese floral print dresses, affordable genuine leather belts. An Dong Market is District 5\u0027s most famous wholesale and retail hub for apparel, shoes, and bags in Ho Chi Minh City. Hundreds of local vendors gather from the basement level up to the second floor. Offering an incredible variety of clothing, shoes, and bags, it attracts many locals and savvy tourists looking for hidden gems. Prices are significantly lower than markets in District 1, giving you plenty of room to bargain and hunt for treasures.", "name": "An Dong Market Apparel Zone", "transport": "Take bus No. 06, 11, or 56 and get off at Ch\u1ee3 An \u0110\u00f4ng station, or take a Grab taxi from the city center, which takes about 15 minutes."}, {"address": "18 An D\u01b0\u01a1ng V\u01b0\u01a1ng, Ph\u01b0\u1eddng 9, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-Buy List: Lightweight breathable Ao Dai sets, trendy women\u0027s shoulder bags, local-designed Korean-style womenswear. Located right next to the traditional An Dong Market, An Dong Plaza offers a much more air-conditioned, spacious, and clean shopping environment. Floors 1 to 3 specialize in women\u0027s apparel, footwear, and leather goods, bringing together local Vietnamese trendy brands and independent boutique stalls. With high-quality products and frequently updated styles, it\u0027s a huge favorite among the local Chinese community and female office workers.", "name": "An Dong Plaza Fashion Center", "transport": "Located next to Windsor Plaza Hotel. Use Grab to navigate directly to An Dong Plaza, which drops you off right at the main entrance."}, {"address": "326 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 8, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-Buy List: Biti\u0027s Hunter collaboration sneakers, ultra-lightweight breathable running shoes, comfortable non-slip casual sandals. Biti\u0027s is Vietnam\u0027s iconic national footwear brand, highly popular among the younger generation thanks to its trendy Hunter series in recent years. This flagship store on Nguy\u1ec5n Tr\u00e3i Street in District 5 offers a complete product line, featuring stylish, highly functional, and extremely cost-effective shoes for men and women. It is a must-visit local footwear benchmark when visiting Vietnam.", "name": "Biti\u0027s Hunter Store Nguy\u1ec5n Tr\u00e3i (District 5 Flagship)", "transport": "Take bus No. 01 or 68 to Nguy\u1ec5n Tr\u00e3i station and walk for about 2 minutes, or take a Grab bike directly."}, {"address": "238 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 3, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-Buy List: Handcrafted genuine leather business shoes, woven leather clutches, handmade women\u0027s low-heeled leather shoes. \u0110\u00f4ng H\u1ea3i is a prestigious local brand with a long history, celebrated for its premium handcrafted leather footwear and goods. Using carefully selected premium leather, their shoes are designed specifically for Asian foot shapes\u2014durable, comfortable, and elegantly tailored at just one-third of the price of international luxury brands. It is the top choice for local professionals and tourists seeking fine leather items.", "name": "Gi\u00e0y \u0110\u00f4ng H\u1ea3i Nguy\u1ec5n Tr\u00e3i (Leather Shoes \u0026 Bags)", "transport": "Take a Grab taxi directly to 238 Nguy\u1ec5n Tr\u00e3i, District 5, located in the heart of the Nguy\u1ec5n Tr\u00e3i fashion shopping street."}, {"address": "96 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 3, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-Buy List: Minimalist structured crossbody bags, comfortable high-heeled sandals, stylish 2-way tote bags. JUNO is a wildly popular Vietnamese women\u0027s shoe and bag fashion brand, specializing in affordable trendsetting footwear and refined bags designed for modern women. The store features a bright, contemporary layout with a wide array of stylish designs, catering to both work outfits and daily casual looks. Its high quality and budget-friendly prices make it immensely popular along District 5\u0027s shopping strip.", "name": "JUNO Nguy\u1ec5n Tr\u00e3i (Fashion Women\u0027s Shoes \u0026 Bags)", "transport": "Take bus No. 01 or 139 to Nguy\u1ec5n Tr\u00e3i station, then walk for about 3 minutes."}, {"address": "58 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 3, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-Buy List: Morandi-toned leather chain bags, French elegant pointed flats, classic woven handbag. Vascara is one of Vietnam\u0027s premier accessible luxury brands for women\u0027s shoes and fashion accessories, crafted for women with refined taste. Blending international fashion trends with exquisite local craftsmanship, their bags boast clean, elegant silhouettes and their shoes offer incredible comfort. It is an extremely popular local boutique on District 5\u0027s Nguy\u1ec5n Tr\u00e3i Street.", "name": "Vascara Nguy\u1ec5n Tr\u00e3i (Accessible Luxury Womenswear, Shoes \u0026 Bags)", "transport": "Set Grab destination to 58 Nguy\u1ec5n Tr\u00e3i, situated right in District 5\u0027s busiest fashion shopping district."}, {"address": "54 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ph\u01b0\u1eddng 14, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | Must-Buy List: Premium silk fabrics for traditional Ao Dai, embroidered Cheongsam textiles, handmade ethnic sewing accessories. So\u00e1i K\u00ecnh L\u00e2m Fabric Market is the oldest and largest wholesale fabric market in the Cholon Chinatown area, housing hundreds of stalls specializing in silk, cotton-linen, lace, and embroidered fabrics. Many visitors come here to handpick unique Vietnamese silk or traditional pattern textiles, then take them to nearby tailor shops to get custom-made Ao Dai or bespoke outfits.", "name": "So\u00e1i K\u00ecnh L\u00e2m Fabric Market", "transport": "Take bus No. 01 or 56 and get off at Ch\u1ee3 So\u00e1i K\u00ecnh L\u00e2m station; it is just a 1-minute walk away."}, {"address": "19 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 2, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-Buy List: Breathable linen short-sleeve casual shirts, slim-fit linen trousers, hipster cotton-linen tote bags. Routine is a rapidly rising local designer brand in Vietnam, popular for its minimalist, comfortable style tailor-made for Southeast Asia\u0027s tropical climate. The store heavily features premium linen and pure cotton fabrics with clean, fluid tailoring\u2014perfect for casual daily wear during tropical travels. It is hugely popular among local youths and travelers alike.", "name": "Routine Nguy\u1ec5n Tr\u00e3i (Minimalist Original Apparel)", "transport": "Set Grab destination to the start of Nguy\u1ec5n Tr\u00e3i fashion street, near the boundary between District 5 and District 1."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "721 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 11, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-Buy List: Wildflower Pineapple Cakes, Taiwan-Vietnam Fusion Flaky Pastries, Nougat Gift Boxes. This highly iconic bakery in Cholon\u0027s Chinese community seamlessly blends traditional Taiwanese baking techniques with premium local Vietnamese ingredients. Their pineapple cakes and traditional Chinese pastries come in exquisite, elegant packaging\u2014making them the top souvenir choice for local Chinese during festivals and business occasions.", "name": "Dai Phat Bakery - Cholon Main Store (\u0110\u1ea1i Ph\u00e1t Bakery - District 5)", "transport": "Take Grab or Bus No. 56 to Nguy\u1ec5n Tr\u00e3i Station, then walk for about 2 minutes."}, {"address": "475 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 7, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-Buy List: Teochew Taro Paste \u0026 Egg Yolk Flaky Pastries, Traditional Soft Peanut Candy, Mung Bean Cakes. Located on Nguy\u1ec5n Tr\u00e3i Street in District 5, this time-honored Teochew bakery has preserved decades of handmade pastry crafting. Their signature taro paste and egg yolk pastry features thin crusts with generous fillings that are delightfully sweet without being cloying, while the aromatic peanut candy doesn\u0027t stick to your teeth, perfectly showcasing Cholon\u0027s unique traditional culinary heritage.", "name": "Trieu Phat Teochew Bakery (Ti\u1ec7m B\u00e1nh Tri\u1ec1u Ph\u00e1t)", "transport": "Take a Grab taxi, or take Bus No. 1 or 56 and get off at any stop along Nguy\u1ec5n Tr\u00e3i Street, then walk there."}, {"address": "116-118 H\u1ea3i Th\u01b0\u1ee3ng L\u00e3n \u00d4ng, Ph\u01b0\u1eddng 10, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Must-Buy List: Durian Egg Yolk B\u00e1nh P\u00eda, Taro Egg Yolk Pastry, Savory Pork Jerky. T\u00e2n Hu\u00ea Vi\u00ean is the most famous B\u00e1nh P\u00eda (flaky pastry) brand from S\u00f3c Tr\u0103ng, Vietnam, featuring a flagship store right in District 5. Their iconic durian egg yolk pastry offers rich layers of texture, wrapping rich durian paste and salted egg yolk in paper-thin pastry\u2014an ultimate delicious souvenir you must buy when visiting Vietnam.", "name": "Tan Hue Vien Bakery - District 5 Branch (T\u00e2n Hu\u00ea Vi\u00ean - Branch District 5)", "transport": "Take Bus No. 1 or 56 to H\u1ea3i Th\u01b0\u1ee3ng L\u00e3n \u00d4ng Station, then walk for about 3 minutes."}, {"address": "178/9 Ph\u00f9ng H\u01b0ng, Ph\u01b0\u1eddng 14, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.7 stars | Must-Buy List: Traditional Butter-Roasted Coffee Beans, Cholon House Dark Roast Ground Coffee, Retro Filter Bag Set. Tucked inside Ph\u00f9ng H\u01b0ng Market, this 70-year-old stocking filter coffee stall still roasts beans over charcoal fires with a touch of butter and spirits to enhance the aroma. The house-roasted beans sold here boast a unique smoky and buttery aroma, making it a hidden souvenir gem that savvy coffee enthusiasts travel far to discover.", "name": "Ba Lu Stocking Filter Coffee Specialty (C\u00e0 Ph\u00ea V\u1ee3t Ba L\u00f9)", "transport": "Take Grab to the entrance of Ph\u00f9ng H\u01b0ng Market, walk into the alley for about 1 minute."}, {"address": "T\u1ea7ng tr\u1ec7t Ch\u1ee3 An \u0110\u00f4ng, C\u00f4ng tr\u01b0\u1eddng An \u0110\u00f4ng, Ph\u01b0\u1eddng 9, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-Buy List: Premium Salt-Roasted Cashews with Skin, Rich Vietnamese Coconut Candy, Crispy Jackfruit Chips. Located on the ground floor of An Dong Market, this famous traditional specialty stall is run by a vendor fluent in Mandarin and Cantonese. Offering a comprehensive range of Vietnamese nuts and dried fruits, all items are strictly quality-checked and vacuum-sealed. Discounts are available for bulk purchases, making it the best spot to stock up on souvenir gifts.", "name": "A Thuan Specialty Stall - An Dong Market (Ti\u1ec7m \u0110\u1eb7c S\u1ea3n \u00c1 Thu\u1eadn - Ch\u1ee3 An \u0110\u00f4ng)", "transport": "Take Bus No. 11 or 56 to Ch\u1ee3 An \u0110\u00f4ng Station, enter the ground floor of the market to locate it."}, {"address": "125 Ch\u00e2u V\u0103n Li\u00eam, Ph\u01b0\u1eddng 14, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-Buy List: Grade-A Jumbo Salt-Roasted Cashews, Macadamia Nuts, Freeze-Dried Mango Slices. Hiep Thanh is a nut specialty shop highly recommended by District 5 locals. Unlike tourist markets with inflated prices, prices here are clear and transparent while offering top-notch qualit
