ec5n Gia Tr\u00ed store."}, {"address": "103 Nguy\u1ec5n Gia Tr\u00ed, Ward 25, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-Buy List: C\u1ecf M\u1ec1m Handmade Avocado Lip Balm, Gentle Rice Cleansing Foam, Bamboo Charcoal Deep Scalp Scrub. C\u1ecf M\u1ec1m is a local herbal handcrafted skincare brand loved by hipster youth and young women in Vietnam, focusing on zero artificial colors or synthetic preservatives. The store features a minimalist wooden aesthetic. Their handcrafted lip balms use food-grade oils and natural essential oils for a silky smooth feel. The exquisite packaging makes them ideal souvenirs for friends and family.", "name": "C\u1ecf M\u1ec1m Herbal Skincare - B\u00ecnh Th\u1ea1nh Branch (C\u1ecf M\u1ec1m Homelab - Nguy\u1ec5n Gia Tr\u00ed)", "transport": "About an 8-minute walk from Pearl Plaza shopping center, or ride a motorbike along Nguy\u1ec5n Gia Tr\u00ed Street."}, {"address": "1st Floor, Pearl Plaza, 561A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 25, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Halio Facial Cleansing Device, Okame Hydrating Cream, Lixibox Limited Beauty Sponge Gift Set. Lixibox is a trendy, high-end Vietnamese beauty platform whose physical stores offer a sleek, modern testing experience. Its proprietary beauty appliance brand, Halio, is extremely famous across Southeast Asia; its facial cleansers and silicone devices rival international high-end brands at a fraction of the cost. A top spot to discover beauty gems when visiting Pearl Plaza in B\u00ecnh Th\u1ea1nh.", "name": "Lixibox Experience Store - Pearl Plaza Branch", "transport": "Take HCMC Metro Line 1 to V\u0103n Th\u00e1nh Station, then walk 3 minutes to enter Pearl Plaza\u0027s 1st floor."}, {"address": "Park 1 Building, Vinhomes Central Park, 208 Nguy\u1ec5n H\u1eefu C\u1ea3nh, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: B\u1ea1ch Tuy\u00ea tyle vibe. These shoes are extremely durable and cost only about a third of major international brands, making them the ultimate representative trendy local souvenir from Vietnam.", "name": "Ananas Original Vietnamese Canvas Shoes (Ananas Nguy\u1ec5n Gia Tr\u00ed Flagship)", "transport": "About a 5-minute Grab car or taxi ride from Landmark 81."}, {"address": "147 X\u00f4 Vi\u1ebft Ngh\u1ec7 T\u0129nh, Ph\u01b0\u1eddng 17, B\u00ecnh Th\u1ea1nh, TP. H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-buy list: Minimalist pure cotton T-shirts, casual slim-fit cropped linen trousers. Routine is a flagship Vietnamese fast-fashion brand focusing on minimalist everyday wear tailored for Asian body types. This B\u00ecnh Th\u1ea1nh branch displays an extensive collection of menswear and womenswear, blending sleek Western cuts with Japanese comfort. Fabrics feature breathable linen and pure cotton, perfectly suited for Southeast Asia\u0027s tropical climate. Local office workers and college students highly recommend their trousers and basic tops for their sharp, flattering fits.", "name": "Routine Original Vietnamese Fashion (Routine X\u00f4 Vi\u1ebft Ngh\u1ec7 T\u0129nh)", "transport": "About a 7-minute ride or drive along X\u00f4 Vi\u1ebft Ngh\u1ec7 T\u0129nh Road from Landmark 81."}, {"address": "613 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ph\u01b0\u1eddng 25, B\u00ecnh Th\u1ea1nh, TP. H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-buy list: Elegant pointed low-heel sandals, sleek spacious leather handbags. Vascara is Vietnam\u0027s most famous local women\u0027s shoe and leather goods chain, praised as the country\u0027s go-to accessible luxury brand. Located near a main thoroughfare, this B\u00ecnh Th\u1ea1nh flagship updates its inventory rapidly. The store offers heels, flats, and quality leather bags suitable for everything from daily commutes to evening galas. Designs keep up with global trends, and insoles feature cushioned padding specially tailored for Asian feet\u2014offering pain-free comfort and incredible value for money.", "name": "Vascara Boutique Shoes \u0026 Bags (Vascara \u0110i\u1ec7n Bi\u00ean Ph\u1ee7)", "transport": "Located on the main \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 thoroughfare, about a 3-minute walk or ride from Landmark 81."}, {"address": "L2-07-08, Vincom Center Landmark 81, 720A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ph\u01b0\u1eddng 22, B\u00ecnh Th\u1ea1nh, TP. H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-buy list: Elegantly tailored dresses, French-style business chiffon shirts. IVY moda is a high-end Vietnamese fashion designer brand featuring a refined boutique inside the Landmark 81 shopping mall. The brand highlights premium women\u0027s apparel that combines modern urban independence with grace, focusing on fluid silhouettes and luxurious fabric textures. From polished office attire to evening cocktail dresses, the tailoring is exquisite, making it immensely popular among local middle-class women and professionals.", "name": "IVY moda Elegant Vietnamese Women\u0027s Fashion (IVY moda Landmark 81)", "transport": "Located on the 2nd floor inside Vincom Center Landmark 81; easily accessible on foot."}, {"address": "132 Nguy\u1ec5n Gia Tr\u00ed, Ph\u01b0\u1eddng 25, B\u00ecnh Th\u1ea1nh, TP. H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-buy list: Korean-style waist-cinched commuter dresses, high-waisted tailored suit pants. GUMAC is a rapidly rising affordable fashion brand for women in Vietnam, boasting a large flagship store in the lively university area of B\u00ecnh Th\u1ea1nh. Known for flattering waist-cinching cuts that enhance feminine silhouettes, its designs lean sweet, elegant, and sophisticated urban chic. With a vast variety of products at incredibly budget-friendly prices, it\u0027s a top choice for locals looking for work outfits or date-night attire.", "name": "GUMAC Trendy Women\u0027s Fashion (GUMAC Nguy\u1ec5n Gia Tr\u00ed)", "transport": "About a 5-minute Grab ride from Landmark 81 to D2 Street (Nguy\u1ec5n Gia Tr\u00ed)."}, {"address": "246 X\u00f4 Vi\u1ebft Ngh\u1ec7 T\u0129nh, Ph\u01b0\u1eddng 21, B\u00ecnh Th\u1ea1nh, TP. H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Must-buy list: Comfortable air-cushioned heels, stylish shoulder bags with metallic buckles. Juno is one of Vietnam\u0027s top two local leaders in women\u0027s footwear and handbags alongside Vascara. This B\u00ecnh Th\u1ea1nh branch carries a comprehensive product line tailored for modern city women. Juno\u0027s footwear features anti-slip soles and pressure-relieving air cushions for fatigue-free walking, while its handbags are famous for quality leather and sleek hardware\u2014making it a must-visit spot for tourists hunting for affordable, high-quality shoes and bags.", "name": "Juno Women\u0027s Shoes \u0026 Handbags (Juno X\u00f4 Vi\u1ebft Ngh\u1ec7 T\u0129nh)", "transport": "About a 6-minute Grab car or bike ride from Landmark 81."}, {"address": "270 Nguy\u1ec5n Gia Tr\u00ed, Ph\u01b0\u1eddng 25, B\u00ecnh Th\u1ea1nh, TP. H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.7 stars | Must-buy list: Handcrafted French lace evening dresses, ethereal fringe-cut dresses. Elpis Clothing is a renowned high-end independent designer women\u0027s label in Vietnam, highly favored by local celebrities and influencers. The boutique exudes French romantic luxury, with each garment handcrafted by skilled local artisans featuring stunning tailored cuts and delicate lace paneling. If you\u0027re looking for unique, high-end designer dresses with quality comparable to luxury global brands, this fashion treasure trove is a must-visit.", "name": "Elpis Clothing Luxury Independent Designer Brand (Elpis Clothing Nguy\u1ec5n Gia Tr\u00ed)", "transport": "About a 5-minute Grab ride from Landmark 81."}, {"address": "157/1A Nguy\u1ec5n Gia Tr\u00ed, Ph\u01b0\u1eddng 25, B\u00ecnh Th\u1ea1nh, TP. H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | cated on the B1 floor of Vincom Center Landmark 81, accessible directly via the mall\u0027s main elevators."}, {"address": "Floor L2, Vincom Center Landmark 81, 720A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Routine linen short-sleeve shirts, slim-fit trousers, chic canvas tote bags. Vietnam\u0027s most iconic local fast-fashion brand for men and women, with cuts tailored specifically for Asian body types. Featuring a minimal, modern style with great quality at very accessible prices, it is a huge favorite among Ho Chi Minh City\u0027s young professionals and fashion enthusiasts.", "name": "Routine Vincom Landmark 81", "transport": "Located on the 2nd floor (L2) of Vincom Center Landmark 81."}, {"address": "Floor B1, Vincom Center Landmark 81, 720A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.8 stars | Must-Buy List: Dak Lak coffee body scrub, pomelo hair growth spray, turmeric facial cleanser. Vietnam\u0027s leading vegan and cruelty-free botanical cosmetics brand, specializing in ingredients sourced from local Vietnamese crops like coffee, pomelo, turmeric, and winter melon. Featuring stylish minimalist packaging and very affordable prices starting from just a few dollars, it has become a must-buy local skincare brand when visiting Ho Chi Minh City in recent years.", "name": "Cocoon Vietnam Landmark 81", "transport": "Located in the B1 shopping area of Vincom Center Landmark 81."}, {"address": "503 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 25, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Discounted Nike running shoes, Adidas performance T-shirts, Under Armour athletic backpacks. A hugely popular authentic brand outlet center in B\u00ecnh Th\u1ea1nh District, specializing in clearing out past-season odd sizes from international sportswear and Western fashion brands. Discounts often reach 50% to 70% off, making it a must-visit for budget-conscious travelers looking to hunt for affordable genuine sportswear.", "name": "Factory Outlet \u0110i\u1ec7n Bi\u00ean Ph\u1ee7", "transport": "Take a Grab taxi along \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 main road; located in B\u00ecnh Th\u1ea1nh District near the university area."}, {"address": "Floor L1, Vincom Center Landmark 81, 720A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Single-origin dark chocolate bars, pure cocoa powder, artisanal bonbon chocolate gift sets. Hailed by The New York Times as \u0027the best chocolate,\u0027 this is a world-renowned premium Bean-to-Bar chocolate brand crafted locally in Vietnam. All cocoa beans are sourced from six different Vietnamese provinces, and the packaging features an elegant French-Vietnamese style, making it a highly sophisticated gift.", "name": "Maison Marou Landmark 81", "transport": "Located on the L1 lobby shopping area of Vincom Center Landmark 81."}, {"address": "Floor L2, Vincom Center Landmark 81, 720A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Elegant pointed-toe heels, woven textured handbags, minimalist leather bifold wallets. Vietnam\u0027s most famous national fashion footwear and bag brand for women, featuring designs that closely follow international trends while offering high comfort. With affordable prices and quality comparable to department store counters, it is the top choice for Vietnamese women commuting and dating\u2014perfect for budget fashionistas seeking great-value shoes and bags.", "name": "Vascara Vincom Landmark 81", "transport": "Located on the 2nd floor (L2) of Vincom Center Landmark 81."}, {"address": "Floor B1, Vincom Center Landmark 81, 720A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Da Lat artichoke wellness tea, freeze-dried strawberries, artisanal soft dried persimmons. A specialty agricultural product brand hailing from Da Lat, Vietnam\u0027s famed mountain resort, renowned for high-quality, natural, additive-free products with exquisite packaging. The store offers beautifully packaged herbal teas, dried fruits, and natural preserves, making it a dream select store for health-conscious food lovers and souvenir seekers.", "name": "L\u0027angfarm Store Landmark 81", "transport": "Located in the B1 shopping area of Vincom Center Landmark 81."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Binh Thanh District - Landmark 81 \u0026 Riverside Commercial Area"}, "cuchi_suburbs": {"categories": {"cat_1": {"items": [{"address": "\u0110\u01b0\u1eddng 15, Ph\u00fa H\u00f2a \u0110\u00f4ng, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Must-Buy List: Natural Lemongrass Mosquito Repellent Essential Oil, Nourishing Handmade Coconut Oil Soap, Turmeric Whitening Mask Paste. Located on an herbal farm in the suburbs of Cu Chi, this little shop focuses on natural skincare extracted from local organic crops. Its mosquito repellent oil is a must-have for exploring the Cu Chi Tunnels. The handmade coconut oil soap and turmeric mask paste are also hugely popular among travelers looking for chemical-free skincare products.", "name": "Cu Chi Herbal Eco Cosmetics Shop", "transport": "Recommended to hire a private car or take Bus No. 79 to Phu Hoa Dong Station and walk for 10 minutes."}, {"address": "12 T\u1ec9nh L\u1ed9 8, Th\u1ecb tr\u1ea5n C\u1ee7 Chi, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-Buy List: White Tiger Balm, Vietnamese Herbal Medicated Oil, Herbal Anti-Acne Powder Mask. Passed down through generations, this shop infuses traditional Vietnamese herbal essence into daily beauty and skincare routines. The ancient-formula herbal acne mask powder is exceptionally effective against skin issues caused by hot and humid weather. Many local women and tourists visit specifically to buy their herbal cure-all oils and soothing balms.", "name": "Cu Chi Traditional Herbal \u0026 Cosmetics Shop (Ti\u1ec7m \u0110\u00f4ng Y \u0026 M\u1ef9 Ph\u1ea9m Truy\u1ec1n Th\u1ed1ng C\u1ee7 Chi)", "transport": "Take Bus No. 94 to Cu Chi Bus Station, then walk about 5 minutes."}, {"address": "364 T\u1ec9nh L\u1ed9 8, Ph\u01b0\u1edbc V\u0129nh An, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-Buy List: Thorakao Turmeric Cleanser, Vedette Freesia Clay Mask, Milaganics Coconut Body Oil. Pharmacity is a large drugstore chain in Vietnam, and its Cu Chi Town branch offers a comprehensive selection. It features a dedicated section for famous local Vietnamese cosmetics, where you can purchase high-quality plant-based skincare and daily essentials at very affordable prices.", "name": "Pharmacity Pharmacy Cu Chi Town Branch", "transport": "About a 3-minute taxi ride from the center of Cu Chi Town."}, {"address": "Qu\u1ed1c L\u1ed9 22, T\u00e2n Th\u00f4ng H\u1ed9i, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.7 stars | Must-Buy List: Turmeric Cream, Pomelo Peel Anti-Hair Loss Shampoo, Goat Milk Moisturizing Lotion. Thorakao is a classic national beauty brand in Vietnam with over half a century of history, specializing in natural botanical ingredients. This direct-sale store offers the most complete product line. Its turmeric cream, particularly effective for acne scars and dullness, is budget-friendly and highly effective\u2014a must-buy Vietnamese souvenir.", "name": "Thorakao Natural Cosmetics Northwest Store", "transport": "Head along Highway 22 toward Cu Chi; take Bus No. 74 and get off at Tan Thong Hoi Station."}, {"address": "88 Qu\u1ed1c L\u1ed9 22, Th\u1ecb tr\u1ea5n C\u1ee7 Chi, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.8 stars | Must-Buy List: Dak Lak Coffee Body Scrub, Gentle Winter Melon Micellar Water, Pomelo Hair Nourishing Spray. Cocoon is a Vietnamese vegan skincare brand that has swept Southeast Asia in recent years, carefully selecting local agricultural produce like highland coffee beans, winter melon, and pomelo peel. The Cu Chi hub provides a comfortable environment to try products, which feature beautifully textured packaging\u2014perfect for eco-conscious consumers who value natural ingredients.", "name": "Cocoon Vegan Beauty Cu Chi Hub", "transport": "Take Bus No. 74 or 94 to Cu Chi Roundabout, then walk for 3 minutes."}, {"address": "\u0110\u01b0\u1eddng Nguy\u1ec5n Th\u1ecb Rung, T\u00e2n Th\u1ea1nh \u0110\u00f4ng, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Must-Buy List: Papaya Seed Antioxidant Cream, Bamboo Charcoal Deep Cleansing Balm, Herbal Soothing Balm. An M\u1ed9c is an independent local organic skincare workshop in Cu Chi that insists on fresh, small-batch handcrafted products. Combining local Vietnamese tropical plants with modern skincare tech, their gentle, non-irritating formulas are ideal for sensitive skin. Visitors can even experience blending their own herbal skincare products on-site.", "name": "An Moc Herbal \u0026 Organic Care Workshop", "transport": "Recommended to hire a private car or take a Grab taxi."}, {"address": "152 T\u1ec9nh L\u1ed9 8, Th\u1ecb tr\u1ea5n C\u1ee7 Chi, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-Buy List: Biona Pearl Beauty Cream, Sao Vang Golden Star Balm, Softcakes Herbal Lip Balm. Long Chau is a massive, well-known pharmacy chain in Vietnam, and this flagship store in Cu Chi Town is bright and spacious. In addition to essential medications, it stocks many famous traditional Vietnamese beauty classics, making it a great spot to pick up affordable, nostalgic cosmetics.", "name": "Nh\u00e0 Thu\u1ed1c Long Ch\u00e2u Pharmacy Cu Chi Flagship", "transport": "About an 8-minute walk from Cu Chi Bus Station."}, {"address": "T\u1ec9nh L\u1ed9 15, An Nh\u01a1n T\u00e2y, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-Buy List: Mint Herbal Cooling Soothing Balm, Tamanu Oil, Camellia Nourishing Hand Cream. This rustic little shop is located right on the route to the Cu Chi Tunnels, specializing in repair products extracted from wild Vietnamese herbs. Pure Tamanu Oil is highly recommended; it works wonders on sun-damaged skin and insect bites, making it the perfect post-outdoor remedy.", "name": "Green Field Herbal Care Store Cu Chi", "transport": "Take Bus No. 79 to An Nhon Tay Market Station and walk for about 2 minutes."}], "name": "Iconic Local Beauty \u0026 Pharmacy Shops"}, "cat_2": {"items": [{"address": "123 Provincial Road 8, C\u1ee7 Chi Town, C\u1ee7 Chi District, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Hunter series retro sneakers, EVA lightweight sandals, and classic chunky sneakers. Biti\u0027s is Vietnam\u0027s most iconic national footwear brand, famous for its extreme durability and affordable prices. Extremely popular among locals and students, its footwear is ideal for exploring the C\u1ee7 Chi Tunnels and outdoor eco-tours.", "name": "Biti\u0027s C\u1ee7 Chi Flagship Store", "transport": "Take Bus No. 94 from central Ho Chi Minh City to C\u1ee7 Chi Bus Station and walk for about 5 minutes, or visit as a stopover during a private car charter to the C\u1ee7 Chi Tunnels."}, {"address": "32 Provincial Road 8, C\u1ee7 Chi Town, C\u1ee7 Chi District, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Must-Buy List: Vietnamese motif print T-shirts, heavy-duty cargo shorts, and UV-protection functional jackets. YaMe is one of the favorite affordable streetwear brands among Vietnamese youth, focusing on local designs and comfortable fits. The C\u1ee7 Chi store is bright and fully stocked, making it the top choice for high-CP-value Vietnamese streetwear.", "name": "YaMe Streetwear Shop C\u1ee7 Chi", "transport": "Take Bus No. 79 or 94 to C\u1ee7 Chi Town Bus Stop, then walk for about 3 minutes."}, {"address": "21 Provincial Road 8, C\u1ee7 Chi Town, C\u1ee7 Chi District, Ho Chi Minh City", "feature": "\u2b50 4.2 Stars | Must-Buy List: Korean-style linen wide-leg pants, floral vacation dresses, and indie canvas tote bags. FM Style is a highly popular budget fast-fashion chain in Vietnam, selling trendy apparel and accessories. Greatly favored by local women and students, it\u0027s a great place to pick up cost-effective everyday and resort outfits.", "name": "FM Style Affordable Clothing C\u1ee7 Chi", "transport": "Walk for about 4 minutes from C\u1ee7 Chi Bus Terminal (B\u1ebfn xe C\u1ee7 Chi)."}, {"address": "Ph\u00fa Hi\u1ec7p Hamlet, Ph\u00fa H\u00f2a \u0110\u00f4ng Commune, C\u1ee7 Chi District, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | Must-Buy List: Handwoven rattan bags, bamboo water bottle holders, and Vietnamese non la sun hats. This charming local boutique combines traditional C\u1ee7 Chi craftsmanship with eco-tourism. It features hand-crafted natural bamboo and rattan bags and accessories made by local artisans, offering a rich rustic Vietnamese vibe that is eco-friendly and durable.", "name": "C\u1ee7 Chi Handicraft \u0026 Bamboo Bag Shop", "transport": "Located near the main rural road leading to the C\u1ee7 Chi Tunnels; taking Grab, a private car charter, or a taxi is recommended."}, {"address": "88 Provincial Road 8, C\u1ee7 Chi Town, C\u1ee7 Chi District, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Anti-UV cooling hoodies, Vietnamese outdoor motif T-shirts, and casual backpacks. A well-known Vietnamese casual apparel brand specializing in sun-protective, moisture-wicking functional clothing tailored for Southeast Asia\u0027s climate. An ideal store for tourists to stock up on outdoor gear before tunnel adventures and eco-tours.", "name": "Couple TX Outdoor \u0026 Casual Wear C\u1ee7 Chi", "transport": "Walk about 6 minutes from C\u1ee7 Chi Bus Station, or take a taxi directly from the city center."}, {"address": "15 Provincial Road 8, C\u1ee7 Chi Town, C\u1ee7 Chi District, Ho Chi Minh City", "feature": "\u2b50 4.1 Stars | Must-Buy List: Handmade leather sandals, minimalist commuter handbags, and elegant mules. A local footwear and bag brand tailored for Vietnamese women, combining stylish design with comfort. The C\u1ee7 Chi store offers budget-friendly prices, making it a popular spot for local women to shop for everyday shoes and accessories.", "name": "Mochardo Shoes \u0026 Bags C\u1ee7 Chi", "transport": "Located near the main road in central C\u1ee7 Chi; about a 2-minute Grab bike ride from C\u1ee7 Chi Bus Terminal."}, {"address": "48 Provincial Road 8, C\u1ee7 Chi Town, C\u1ee7 Chi District, Ho Chi Minh City", "feature": "\u2b50 4.2 Stars | Must-Buy List: American retro T-shirts, tactical crossbody bags, and denim jackets. Totoshop is an original Vietnamese streetwear brand loved by the younger generation. The C\u1ee7 Chi location updates its stock rapidly, offering a wide array of clothing, shoes, and bags blending local design elements with global trends.", "name": "Totoshop Trendy Clothing C\u1ee7 Chi", "transport": "About a 3-minute walk from C\u1ee7 Chi Town Central Bus Stop."}, {"address": "205 National Route 22, C\u1ee7 Chi Town, C\u1ee7 Chi District, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Custom-tailored Vietnamese \u00c1o D\u00e0i, handmade silk shawls, and patterned fabric tote bags. A long-standing boutique in C\u1ee7 Chi offering both ready-to-wear and custom \u00c1o D\u00e0i blending traditional and modern styles. Featuring handcrafted silk and fabric bags, it\u0027s a wonderful stop to experience traditional Vietnamese attire culture.", "name": "Minh Th\u01b0 Fashion \u0026 Ao Dai C\u1ee7 Chi", "transport": "Located along National Route 22, about a 15-minute taxi ride from the main entrance of the C\u1ee7 Chi Tunnels."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "TL15, Ph\u00fa Hi\u1ec7p, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Bullet shell craft bottle openers, wooden tank models, woven straw hats of female Vietnamese soldiers. The official souvenir shop located inside the C\u1ee7 Chi Tunnels complex features unique historical and military-themed keepsakes. Each craft item is rich with the history of the C\u1ee7 Chi resistance, particularly the hand-carved tank models made from scrap metal and wood\u2014a must-have collectible souvenir when visiting the C\u1ee7 Chi Tunnels.", "name": "B\u1ebfn \u0110\u00ecnh Tunnels Souvenir Shop", "transport": "Take a private car or chartered vehicle along Provincial Road 15 (TL15) directly into the B\u1ebfn \u0110\u00ecnh sector of the C\u1ee7 Chi Tunnels."}, {"address": "Ph\u00fa H\u00f2a \u0110\u00f4ng, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Ph\u00fa H\u00f2a \u0110\u00f4ng thin rice paper, spicy mixed rice paper snacks, roasted coconut rice crackers. Ph\u00fa H\u00f2a \u0110\u00f4ng Village is the birthplace of C\u1ee7 Chi\u0027s legendary handmade rice paper. This tourist shop showcases the entire craft process, from grinding rice batter to sun-drying the sheets. The rice paper here boasts excellent texture, a crispy crunch, and a rich rice aroma, making it perfect for making Vietnamese spring rolls at home or enjoying as a snack.", "name": "Ph\u00fa H\u00f2a \u0110\u00f4ng Rice Paper Craft Village Shop (L\u00e0ng ngh\u1ec1 B\u00e1nh Tr\u00e1ng Ph\u00fa H\u00f2a \u0110\u00f4ng Shop)", "transport": "Take a taxi for about 15 minutes along Provincial Road 15 (TL15) from C\u1ee7 Chi town center."}, {"address": "Ph\u00fa M\u1ef9 H\u01b0ng, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: All-natural passion fruit jam, fresh goat\u0027s milk handmade soap, organic dried lily tea. Located inside C\u1ee7 Chi\u0027s famous green eco-farm, this specialty shop focuses on home-grown organic produce and healthy snacks. The products are free of chemical additives, full of natural aroma, and packaged in a charming, rustic style\u2014making them very popular with eco-tour day-trippers looking for healthy gifts.", "name": "N\u00f4ng Trang Xanh Organic Store (Green Farm Organic Specialty Center)", "transport": "It is recommended to hire a private car or take a taxi from downtown Ho Chi Minh City; the farm is located in Ph\u00fa M\u1ef9 H\u01b0ng Commune."}, {"address": "National Route 22 (QL22), T\u00e2n Th\u00f4ng H\u1ed9i, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade C\u1ee7 Chi peanut candy, crispy roasted salted cashews, black sesame maltose crackers. A well-established local souvenir shop located along a main highway in suburban C\u1ee7 Chi, famous for its traditionally crafted maltose peanut candy. Plump, crunchy peanuts held together with a sweet, non-sticky glaze make it the perfect match for a hot cup of tea\u2014a nostalgic snack brimming with Southern Vietnamese rural flavor.", "name": "T\u1ea5n Ph\u00e1t Peanut Candy \u0026 Nut Specialty Shop (\u0110\u1eb7c S\u1ea3n K\u1eb9o \u0110\u1eadu Ph\u1ed9ng T\u1ea5n Ph\u00e1t)", "transport": "Drive west along National Route 22 (QL22); the shop\u0027s eye-catching signboard is visible along the roadside in the T\u00e2n Th\u00f4ng H\u1ed9i section."}, {"address": "T\u00e2n Th\u1ea1nh \u0110\u00f4ng, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade woven rattan tote bags, eco-friendly bamboo straw sets, woven bamboo coasters. Run by local artisans, this lifestyle craft workshop and souvenir shop uses C\u1ee7 Chi\u0027s abundant bamboo and rattan resources to create elegant everyday items. Every piece is meticulously hand-woven, featuring delicate textures and a subtle bamboo scent, making them a huge hit with hipster travelers and foreign tourists alike.", "name": "M\u00e2y Tre L\u00e1 C\u1ee7 Chi Bamboo \u0026 Rattan Workshop \u0026 Souvenirs", "transport": "Takes about 10 minutes by taxi or Grab from C\u1ee7 Chi town center."}, {"address": "B\u00ecnh M\u1ef9, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-Buy List: C\u1ee7 Chi sun-dried beef jerky, pure wild honey, crispy jackfruit chips. Located inside the B\u00ecnh M\u1ef9 Eco-Village complex, this specialty shop gathers premium dried goods and delicious snacks produced by local farmers around C\u1ee7 Chi. The unique sun-dried beef jerky is slightly spicy, chewy, and flavorful\u2014paired with local wild honey, it makes a thoughtful local gift for family and friends.", "name": "B\u00ecnh M\u1ef9 Eco-Village Specialty Shop (C\u1eeda h\u00e0ng \u0110\u1eb7c s\u1ea3n L\u00e0ng Sinh Th\u00e1i B\u00ecnh M\u1ef9)", "transport": "Take a taxi or private vehicle along the Saigon Riverfront Road (S\u00f4ng S\u00e0i G\u00f2n) into the B\u00ecnh M\u1ef9 Eco-Village."}, {"address": "Ph\u00fa Hi\u1ec7p, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Baked C\u1ee7 Chi cassava chips, cassava crackers with peanut dipping sauce, brown sugar cassava cake. This unique shop reinterprets cassava\u2014the legendary wartime staple of the C\u1ee7 Chi Tunnels\u2014with modern agricultural branding. The baked cassava chips are thin, crispy, non-greasy, and carry a hint of natural sweetness and roasted aroma, offering a distinct gift that blends history with delicious flavor.", "name": "C\u1ee7 Chi Cassava \u0026 Agricultural Gift Shop", "transport": "Located near the entrance of the C\u1ee7 Chi Tunnels; easily accessible on foot after finishing your tunnel tour."}, {"address": "Khu Ph\u1ed1 3, C\u1ee7 Chi Town, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Must-Buy List: Freshly baked coconut sesame crackers, handmade mung bean cakes, traditional coconut candy. A specialty stall area inside C\u1ee7 Chi\u0027s traditional local market, where you can watch locals make and sell authentic street pastries and dried snacks. With affordable prices and fresh-baked treats, it offers tourists an authentic taste of Vietnamese rural shopping culture.", "name": "C\u1ee7 Chi Market Local Food \u0026 Snack Stalls (Ch\u1ee3 C\u1ee7 Chi)", "transport": "Take city bus route 79 or 94 and get off at the Ch\u1ee3 C\u1ee7 Chi stop, then walk to the market."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "1239 T\u1ec9nh L\u1ed9 8, Trung An, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Must-Buy List: Vietnamese coconut egg rolls, locally roasted cashews, Vinamilk yogurt. As the largest commercial complex in C\u1ee7 Chi, it blends modern shopping with local lifestyle features. Featuring various local Vietnamese brand counters and a large supermarket, it is an excellent spot to stock up before visiting the C\u1ee7 Chi Tunnels or to pick up authentic Vietnamese souvenirs at prices much more affordable than downtown tourist areas.", "name": "Satra Centre Mall C\u1ee7 Chi", "transport": "Take Bus No. 74 to C\u1ee7 Chi Bus Station, then transfer to Bus No. 87; or drive along Highway QL22 and turn onto T\u1ec9nh L\u1ed9 8 to reach."}, {"address": "National Route 22, B\u00e0 \u0110i\u1ec3m, H\u00f3c M\u00f4n, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Past-season Nike sneakers, Adidas performance activewear, Puma backpacks. Located near National Route 22 (QL22), the main artery leading to the C\u1ee7 Chi Tunnels, this is a famous suburban factory outlet center. Bringing together outlet stores of numerous international and local Vietnamese sportswear brands, it frequently offers amazing discounts ranging from 30% to 70% off\u2014a treasure-hunting paradise for athleisure enthusiasts.", "name": "An S\u01b0\u01a1ng Factory Outlet Zone", "transport": "Drive from downtown Ho Chi Minh City along Highway QL22 toward C\u1ee7 Chi for about 40 minutes."}, {"address": "\u0110. Qu\u1ed1c L\u1ed9 22, T\u00e2n Th\u00f4ng H\u1ed9i, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | Must-Buy List: Hand-painted blue-and-white tea sets, exquisite Vietnamese coffee phin filters, lotus pattern dinnerware. Minh Long is Vietnam\u0027s premier and most iconic national-treasure porcelain brand. This suburban showroom offers a complete range of bone china tableware and artistic ceramics. Blending traditional Vietnamese culture with French elegance, these items hold great collectible value. With superior quality, it also offers a higher chance of finding exclusive discounted sets compared to downtown counters.", "name": "Minh Long Porcelain C\u1ee7 Chi Showroom", "transport": "Charter a car or ride a motorbike along Highway QL22 toward C\u1ee7 Chi to reach."}, {"address": "T\u1ec9nh L\u1ed9 15, Ph\u00fa H\u00f2a \u0110\u00f4ng, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Handwoven bags, handmade bamboo placemats, rattan picnic baskets. The C\u1ee7 Chi region boasts a long tradition of bamboo and rattan weaving. This local workshop and retail shop showcases various household goods and fashion accessories handcrafted by local artisans. Made entirely of natural, eco-friendly materials, the products feature delicate details and rich Southern Vietnamese rustic charm. Affordable and stylish, it is a favorite among foreign tourists.", "name": "C\u1ee7 Chi Bamboo \u0026 Rattan Craft Shop", "transport": "It is recommended to take a taxi or charter a car directly to the countryside workshop on T\u1ec9nh L\u1ed9 15."}, {"address": "TL15, An Nh\u01a1n T\u00e2y, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.7 Stars | Must-Buy List: Handmade thin C\u1ee7 Chi rice paper, crispy sesame crackers, traditional peanut candy. C\u1ee7 Chi is not only famous for its tunnels but also known as the \u0027Land of Rice Paper\u0027 in Vietnam. This local specialty shop displays and sells the most authentic handmade C\u1ee7 Chi rice paper and various traditional snacks made with traditional methods. Direct from the source guarantees freshness and deliciousness; thin, pliable rice paper is delicious eaten directly or used to wrap spring rolls, making it a wonderful local gift.", "name": "\u0110\u1eb7c S\u1ea3n B\u00e1nh Tr\u00e1ng C\u1ee7 Chi Shop", "transport": "Located on the main road T\u1ec9nh L\u1ed9 15 on the way to the C\u1ee7 Chi Tunnels (B\u1ebfn D\u01b0\u1ee3c section); recommended to stop by via chartered car during your trip."}, {"address": "51 T\u1ec9nh L\u1ed9 8, C\u1ee7 Chi Town, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.2 Stars | Must-Buy List: Vietnamese designer trendy T-shirts, casual shorts, high-quality canvas tote bags. YaMe is an iconic local Vietnamese youth streetwear and accessory chain tailored for young adults. This branch located in C\u1ee7 Chi Town offers a vast selection of high-value clothing created by local Vietnamese designers. Tailored for Asian body types with stylish cuts and very affordable prices, it is a must-visit store to experience authentic Vietnamese street fashion.", "name": "YaMe.vn C\u1ee7 Chi", "transport": "Take Bus No. 74 to C\u1ee7 Chi Bus Station and walk for about 5 minutes."}, {"address": "88 T\u1ec9nh L\u1ed9 8, C\u1ee7 Chi Town, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Thorakao coconut oil hand cream, Vedette Vietnamese natural clay mask, Cocoon coffee \u0026 centella cleansing balm. Hasaki is a leading local beauty and drug store chain in Vietnam with a huge market share. The C\u1ee7 Chi store brings together numerous domestic organic skincare brands (such as Cocoon and Thorakao) as well as international cosmetics. Here, you can buy skincare products developed with local Vietnamese botanical ingredients at the best prices\u2014offering great quality and authentic local flavor.", "name": "Hasaki Beauty \u0026 Clinic C\u1ee7 Chi", "transport": "Located in the bustling commercial area of T\u1ec9nh L\u1ed9 8 in C\u1ee7 Chi Town, accessible by taxi or Bus No. 74."}, {"address": "Provincial Road 8, Ph\u01b0\u1edbc V\u0129nh An, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Must-Buy List: G7 Vietnamese drip coffee powder, Marou premium Vietnamese chocolate, Trung Nguy\u00ean Sang Tao coffee beans. Co.opmart is Vietnam\u0027s most famous and long-standing local hypermarket chain. In addition to daily necessities, this large branch in C\u1ee7 Chi features a massive local specialty section with ample stock and transparent pricing. It is the premier spot for purchasing famous Vietnamese coffee, tea, and dried fruit souvenirs.", "name": "Co.opmart C\u1ee7 Chi", "transport": "Take Bus No. 74 and get off at Co.opmart C\u1ee7 Chi Station."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Suburbs - Cu Chi Tunnels \u0026 Eco Day Tour Zone"}, "district_1_buivien": {"categories": {"cat_1": {"items": [{"address": "147B Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, C\u00f4 Giang Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Turmeric Nourishing Facial Cream, Pomelo Peel Anti-Hair Loss Shampoo, Goat Milk Facial Cleanser. Founded in 1961, Thorakao is a national treasure legacy beauty brand in Vietnam, famous for its affordable yet highly effective herbal ingredients. The showroom in District 1 offers the most complete product lineup. The turmeric cream is renowned for fading acne scars and brightening skin tone. Budget-friendly and brimming with nostalgic Vietnamese vintage charm, it makes a fantastic unique souvenir.", "name": "Thorakao Traditional Herbal Cosmetics Flagship Store (Thorakao Showroom Tr\u1ea7n H\u01b0ng \u0110\u1ea1o)", "transport": "About an 8-minute walk from Pham Ngu Lao Street."}, {"address": "141 C\u1ed1ng Qu\u1ef3nh, Nguy\u1ec5n C\u01b0 Trinh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Cocoon Coffee Body Scrub, Cocoon Winter Melon Refreshing Anti-Acne Cleanser, Cocoon Pomelo Hair Repair Spray. Hasaki is a local pharmacy and beauty chain giant in Vietnam, where the 100% vegan local beauty brand Cocoon is immensely popular. Utilizing local Vietnamese specialties like Dak Lak coffee beans, Cao Bang winter melon, and Central Highlands pomelo, Cocoon features natural, cruelty-free ingredients that are highly praised by local youth and backpackers alike.", "name": "Cocoon Vegan Botanical Beauty Specialty - Hasaki C\u1ed1ng Qu\u1ef3nh Branch (Hasaki Beauty \u0026 Clinic C\u1ed1ng Qu\u1ef3nh)", "transport": "About a 5-minute walk from Pham Ngu Lao Street, located near the intersection of C\u1ed1ng Qu\u1ef3nh and Nguy\u1ec5n Tr\u00e3i streets."}, {"address": "218 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-Buy List: Tropical Floral \u0026 Fruit Perfume Spray, Natural Essential Oil Solid Perfume, Handcrafted Herbal Roll-On Oils. Founded by a famous Vietnamese perfumer, NauNau is an independent local beauty and skincare brand specializing in natural botanical essential oils and romantic French-Vietnamese scent blending. The store boasts an artisanal, hipster vibe, with products exuding distinct notes of bougainvillea, Saigon coffee, and tropical fruits\u2014making it a premier choice for high-quality cosmetics souvenirs in the Pham Ngu Lao area.", "name": "NauNau Vietnamese Handcrafted Fragrance \u0026 Skincare (NauNau Essential Oil \u0026 Cosmetics B\u00f9i Vi\u1ec7n)", "transport": "Located on the main street of B\u00f9i Vi\u1ec7n Walking Street, within easy walking distance."}, {"address": "160 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Nguy\u1ec5n C\u01b0 Trinh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Halio Smart Facial Cleansing Device, Okame Hyaluronic Acid Hydrating Mask, Lemonade Dual-Ended Matte Lipstick. Lixibox is one of Vietnam\u0027s most popular modern beauty chains, known for curating top-tier local brands and beauty devices. The famous brand Lemonade available here was created by a renowned Vietnamese makeup artist specifically for Southeast Asian skin types, boasting exceptional sweat and oil resistance. Its house brand, Okame masks, is also perfectly tailored for Vietnam\u0027s hot climate.", "name": "Lixibox Premium Beauty Flagship Store (Lixibox Tr\u1ea7n H\u01b0ng \u0110\u1ea1o)", "transport": "About a 6-minute walk from Pham Ngu Lao Street."}, {"address": "129 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Vietnamese Dragon Balm (Green Menthol Ointment), Opodex Anti-Itch Cream for Bug Bites, Vedette Coconut Oil Clay Mask. Pharmacity is Vietnam\u0027s largest local pharmacy chain, and its 24-hour B\u00f9i Vi\u1ec7n location is a lifesaver for night-owl backpackers. Beyond daily pharmaceuticals, it houses an extensive collection of essential local home ointments and affordable herbal clay masks at fair prices\u2014making it a great spot to experience local pharmacy culture.", "name": "Pharmacity B\u00f9i Vi\u1ec7n Pharmacy (Pharmacity B\u00f9i Vi\u1ec7n)", "transport": "Located in the heart of B\u00f9i Vi\u1ec7n Street, easily accessible on foot."}, {"address": "228 Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-Buy List: Vedette Cucumber Deep Cleansing Clay Mask, Milaganics Cold-Pressed Extra Virgin Coconut Oil, Emmi\u00e9 Brightening Antioxidant Serum. Guardian is a personal care staple found across Vietnam\u0027s streets, and this branch features a dedicated \u0027Local Vietnamese Brands Zone\u0027. Milaganics and Vedette are long-established natural brands in Vietnam; their pure hair coconut oil and natural clay masks offer incredible value for budget-conscious beauty hunters.", "name": "Guardian Pham Ngu Lao Beauty \u0026 Pharmacy Chain (Guardian Ph\u1ea1m Ng\u0169 L\u00e3o)", "transport": "Located on the main Pham Ngu Lao Street, close to the bus stop near Terminal 21."}, {"address": "235 Nguy\u1ec5n Tr\u00e3i, Nguy\u1ec5n C\u01b0 Trinh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Lemonade Smudge-Proof Eyeliner, Cocoon Turmeric Brightening Mask, Bio-Essence Skin Repair Mist. Nuty is a wildly popular local beauty multi-brand retail store in Ho Chi Minh City, attracting crowds of young shoppers with its comprehensive product categories and great discounts. It brings together numerous trendy local Vietnamese brands, especially long-wearing eye and lip makeup tailored for Southeast Asia\u0027s hot and humid climate, drawing many foreign tourists looking for hidden gems.", "name": "Nuty Cosmetics Nguy\u1ec5n Tr\u00e3i Branch (Nuty Cosmetics Nguy\u1ec5n Tr\u00e3i)", "transport": "Cross the street from Pham Ngu Lao Street to Nguy\u1ec5n Tr\u00e3i Street, about a 7-minute walk."}, {"address": "151 Nguy\u1ec5n Tr\u00e3i, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Emmi\u00e9 by Happy Skin Soothing Cleansing Gel, Thorakao Olive Hand Cream, Milaganics Green Tea Anti-Acne Mist. Sammi Shop is an extremely popular affordable beauty boutique in Vietnam featuring many emerging local skincare brands. Notably, the Emmi\u00e9 skincare line created by a well-known beauty influencer is formulated specifically for sensitive and acne-prone skin, enjoying stellar local reviews. It is a must-visit store for discovering the latest Vietnamese beauty trends.", "name": "Sammi Shop Curated Beauty Store (Sammi Shop Nguy\u1ec5n Tr\u00e3i)", "transport": "About an 8-minute walk from Pham Ngu Lao Street along C\u1ed1ng Qu\u1ef3nh and turning onto Nguy\u1ec5n Tr\u00e3i Street."}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "254 \u0110\u1ec1 Th\u00e1m, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buys: Organic cotton HCMC landmark print T-shirts, eco-friendly canvas shoulder bags. Located on \u0110\u1ec1 Th\u00e1m Street in the heart of the Ph\u1ea1m Ng\u0169 L\u00e3o commercial area, Ginkgo is an iconic local Vietnamese organic cotton apparel brand. The store focuses on high-quality organic cotton and exclusive graphic prints inspired by local Vietnamese culture. With an artsy style and excellent quality, it is exceptionally popular among Western backpackers and travel enthusiasts.", "name": "Ginkgo Organic Cotton Clothing (Ginkgo T-Shirts - \u0110\u1ec1 Th\u00e1m)", "transport": "About a 2-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Walking Street"}, {"address": "41 Nguy\u1ec5n Tr\u00e3i, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buys: Vintas retro classic canvas sneakers, Urbas street colorway high-top sneakers. Ananas is an original local footwear brand that has swept through the young generation in Vietnam, featuring a pineapple as its iconic logo. Located on the edge of the Ph\u1ea1m Ng\u0169 L\u00e3o area, this store offers a wide range of retro and street-style canvas shoes that are affordable, durable, and make the perfect souvenir to experience modern Vietnamese streetwear culture.", "name": "Ananas Local Trendy Canvas Shoes (Ananas Shoes - Nguy\u1ec5n Tr\u00e3i)", "transport": "About a 7-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "52 Nguy\u1ec5n Tr\u00e3i, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buys: French-cut printed dresses, high-waisted linen wide-leg trousers. Lib\u00e9 is a hugely popular local independent designer womenswear brand in Vietnam, blending French romance with tropical casual chic. The clothing features tailored cuts and breathable, light fabrics specially designed for the Southeast Asian climate, making it a favorite among local young women and stylish travelers.", "name": "Lib\u00e9 Workshop Women\u0027s Clothing Boutique (Lib\u00e9 Workshop - Nguy\u1ec5n Tr\u00e3i)", "transport": "About a 5-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Park"}, {"address": "1st Floor, 229 Ph\u1ea1m Ng\u0169 L\u00e3o, District 1, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-Buys: Handmade patchwork tote bags, embroidered linen handbags. This charming shop emphasizes Fair Trade and social enterprise responsibility, located in the core of the Ph\u1ea1m Ng\u0169 L\u00e3o area. All products are 100% handcrafted by underprivileged local Vietnamese women. The patchwork patterns combine traditional craft with modern aesthetics, resulting in sturdy, uniquely warm, and one-of-a-kind pieces.", "name": "Mekong Quilts Social Enterprise Handmade Bags \u0026 Apparel (Mekong Quilts - Ph\u1ea1m Ng\u0169 L\u00e3o)", "transport": "Located on the main strip of Ph\u1ea1m Ng\u0169 L\u00e3o Street, near the intersection with \u0110\u1ec1 Th\u00e1m"}, {"address": "70 Nguy\u1ec5n Tr\u00e3i, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buys: Minimalist breathable linen shirts, slim-fit stretch casual cropped trousers. Routine is an immensely successful local Vietnamese affordable casual wear brand for men and women, with a store on Nguy\u1ec5n Tr\u00e3i Street next to the Ph\u1ea1m Ng\u0169 L\u00e3o area. Its clothing boasts superb tailoring, featuring mainly earth tones and solid colors that are comfortable and high-quality.", "name": "Routine Vietnamese Fast Fashion (Routine - Nguy\u1ec5n Tr\u00e3i)", "transport": "About a 6-minute walk from B\u00f9i Vi\u1ec7n Walking Street"}, {"address": "12 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.8 stars | Must-Buys: Upcycled waterproof canvas backpacks, color-blocked multifunctional crossbody bags. D\u00f2ng D\u00f2ng is one of the most popular sustainable fashion brands in Vietnam, specializing in remaking upcycled tarps and billboard vinyl into stylish bags. Each bag features unique colorways and textures, and is highly waterproof and durable, making it a big hit among backpackers and trendsetters.", "name": "D\u00f2ng D\u00f2ng Eco-Friendly Canvas Bags (D\u00f2ng D\u00f2ng Studio - B\u00f9i Vi\u1ec7n)", "transport": "Located at the eastern entrance of B\u00f9i Vi\u1ec7n Walking Street, about a 1-minute walk"}, {"address": "77 Nguy\u1ec5n Tr\u00e3i, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-Buys: Minimalist solid sleeveless tank tops, high-waisted tailored straight-leg trousers. Originating in Ho Chi Minh City, Nosbyn is an independent womenswear brand known for its minimalism and premium feel. Made from breathable high-quality fabrics in elegant, timeless color palettes, its pieces are perfect for Vietnam\u0027s hot climate and everyday styling, earning high acclaim from local fashion insiders.", "name": "Nosbyn Minimalist Womenswear Brand (Nosbyn - Nguy\u1ec5n Tr\u00e3i)", "transport": "About a 6-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Park"}, {"address": "28 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buys: Handmade leather coin purses, Ho Chi Minh City impression handcrafted canvas bags. The Craft House brings together leather goods, bags, and lifestyle accessories from numerous independent local designers in Vietnam. Located in the lively B\u00f9i Vi\u1ec7n nightlife area, the store offers delicately crafted leather and textile goods with a rich local creative flair, making it a very popular selective shop for accessories.", "name": "The Craft House Creative Accessories \u0026 Bags (The Craft House - B\u00f9i Vi\u1ec7n)", "transport": "Located within B\u00f9i Vi\u1ec7n Walking Street, easily accessible on foot"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "193 \u0110\u1ec1 Th\u00e1m, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-Buy: Da Lat dried mango slices, Jerusalem artichoke tea, spicy beef jerky. Hailing from the cool mountain resort town of Da Lat, this renowned specialty shop is famous for its natural and healthy goods. Featuring chic, modern packaging, it offers high-quality dried fruits, herbal teas, and regional snacks at fair, transparent prices, making it a favorite souvenir spot among backpackers.", "name": "L\u0027angfarm Store \u0110\u1ec1 Th\u00e1m", "transport": "About a 3-minute walk from Pham Ngu Lao Street"}, {"address": "189 C\u1ed1ng Qu\u1ef3nh, Ph\u01b0\u1eddng Nguy\u1ec5n C\u01b0 Trinh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-Buy: Vinamit dried jackfruit, salted skin-on cashews, Da Nang coconut crackers. Located on the edge of the Pham Ngu Lao district, this large local supermarket chain is a treasure trove for locals and savvy travelers hunting for budget-friendly Vietnamese snacks. Here, you can get famous-brand cashews, dried fruits, instant Vietnamese coffee, and fish sauce at genuine local prices\u2014saving you the hassle of bargaining at tourist night markets.", "name": "Co.opmart C\u1ed1ng Qu\u1ef3nh", "transport": "About a 5-minute walk from the western exit of Bui Vien Walking Street"}, {"address": "219 Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-Buy: G7 3-in-1 instant coffee, Creative 8 coffee beans, traditional Vietnamese phin filters. A flagship branch of Vietnam\u0027s national coffee powerhouse, located right in the heart of Pham Ngu Lao Street. Beyond enjoying authentic, rich phin drip coffee in-store, you\u0027ll find an extensive selection of gift sets and accessories. Their elegant packaging and iconic bold flavor make these perfect gifts for family and colleagues.", "name": "Trung Nguy\u00ean Legend Coffee - Ph\u1ea1m Ng\u0169 L\u00e3o", "transport": "Located on the main strip of Pham Ngu Lao Street, a 1-minute walk from September 23 Park"}, {"address": "168-170 Calmette, Ph\u01b0\u1eddng Nguy\u1ec5n Th\u00e1i B\u00ecnh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Must-Buy: Single-origin dark chocolate bars, Vietnamese chili dark chocolate, roasted cocoa nibs. Praised by The New York Times as creating \u0027the best chocolate,\u0027 this boutique is just a short walk from Bui Vien Street. Crafted from 100% locally sourced Vietnamese cocoa beans, their products feature exquisite packaging made from traditional handcrafted paper paired with modern designs. Rich, fruity, and nutty in flavor, it\u2019s a premium souvenir blending refined taste with local authenticity.", "name": "Maison Marou Calmette", "transport": "About an 8-minute walk from the eastern end of Bui Vien Street, or a 3-minute Grab ride"}, {"address": "\u0110\u01b0\u1eddng C\u1ed1ng Qu\u1ef3nh, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | Must-Buy: Handcrafted coconut candy, seasoned grilled dried squid, dried lotus seeds. Situated at the western end of Pham Ngu Lao Street, this traditional local market offers a far more authentic vibe and budget-friendly prices compared to Ben Thanh Market. Stalls are piled high with nostalgic Vietnamese snacks and dried seafood. The friendly vendors make it an ideal spot for travelers seeking a real market experience while shopping for traditional treats.", "name": "Th\u00e1i B\u00ecnh Market (Ch\u1ee3 Th\u00e1i B\u00ecnh)", "transport": "Located at the intersection of Pham Ngu Lao and Cong Quynh Streets, easily reachable on foot"}, {"address": "04 Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Must-Buy: Vietnamese herbal teas, chili garlic peanuts, handcrafted embroidered pouches. Located underground beneath September 23 Park, this modern complex merges Taka Plaza with local handicraft and snack stalls. Air-conditioned, well-lit, and featuring clearly displayed fixed prices, it sells colorful Vietnamese keepsakes and beautifully packaged snacks\u2014perfect for a comfortable, stress-free shopping session.", "name": "Central Market - Local Snacks \u0026 Crafts", "transport": "Located underground in September 23 Park opposite Pham Ngu Lao Street; enter via Gate 1"}, {"address": "84 B\u00f9i Vi\u00ean, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 stars | Must-Buy: Hand-carved coconut shell bowls, wooden Ao Dai figurines, premium boxed cashew gift sets. An independent craft and souvenir shop right next to the lively Bui Vien Walking Street, filled with tropical vibes that draw many international travelers. It curates high-quality wooden carvings, lacquerware, and eco-friendly coconut crafts made by local artisans, alongside neatly packaged nut gifts\u2014all uniquely Vietnamese and reasonably priced.", "name": "Saigon Crafts \u0026 Souvenirs - B\u00f9i Vi\u00ean", "transport": "Located on the main Bui Vien Walking Street strip, easily reachable on foot"}, {"address": "121 \u0110\u1ec1 Th\u00e1m, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-Buy: Original salted skin-on cashews, wasabi cashews, honey-roasted macadamias. An independent shop on De Tham Street specializing in high-grade Vietnamese nuts. Sourced from Binh Phuoc province\u2014renowned worldwide for top-quality cashews\u2014their jumbo-sized nuts are roasted using signature techniques to achieve a crunchy, non-greasy texture. Free samples of creative flavors are available, and vacuum-sealed packaging ensures freshness, making this a high-value stop in the backpacker district.", "name": "King of Cashew (Vua H\u1ea1t \u0110i\u1ec1u)", "transport": "Turn onto De Tham Street from Pham Ngu Lao Street and walk about 2 minutes"}], "name": "Must-Buy Souvenirs \u0026 Specialty Snacks"}, "cat_4": {"items": [{"address": "04 Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Must-Buys: Handwoven rattan bags, Vietnamese embroidered pouches, and local graphic tees. Located beneath September 23 Park, Sense Market is a shopping treasure trove right next to the backpacker haven of Pham Ngu Lao Street. Combining the vibe of a traditional night market with the comfort of a modern mall, it brings together many local Vietnamese independent creators and clothing boutiques with transparent pricing\u2014perfect for bargain hunting. It also features an underground food court packed with Southeast Asian delicacies, making it easy to recharge whenever you get tired of shopping.", "name": "Sense Market Underground Central Market (Sense Market / Asiana Food Town)", "transport": "A 2-minute walk from Pham Ngu Lao Street to the underground entrance at September 23 Park."}, {"address": "212 C\u00e1ch M\u1ea1ng Th\u00e1ng 8, Ph\u01b0\u1eddng 10, Qu\u1eadn 3, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Must-Buys: Superdry windproof hooded jackets, Columbia outdoor hiking shoes, and Nike athletic performance wear. Just a 5-minute drive from the Pham Ngu Lao area, this outlet is famous among locals for overstock, export overruns, and factory outlet goods. Offering incredible year-round discounts of 50% to 70% off, it\u0027s ideal for backpackers looking to stock up on windbreakers, hiking backpacks, and high-quality sportswear. With high volume and great quality, it\u0027s a budget-shopping paradise known to savvy travelers.", "name": "Factory Outlet - C\u00e1ch M\u1ea1ng Th\u00e1ng 8 Branch", "transport": "About a 5-minute Grab ride from Pham Ngu Lao Street."}, {"address": "254 \u0110. Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Must-Buys: Organic cotton Saigon scooter graphic tees, lightweight bamboo fiber casual shirts, and original Vietnamese landscape canvas totes. Ginkgo is Vietnam\u0027s premier sustainable fashion brand, crafting high-quality organic cotton and bamboo apparel designed specifically for travelers. Their designs are steeped in Vietnamese culture, transforming iconic street scooters, French colonial architecture, and traditional scripts into stylish, artistic graphic prints. The clothing boasts excellent cuts, supreme comfort, and durability.", "name": "Ginkgo Eco-Fashion Pham Ngu Lao Flagship Store", "transport": "Located on the main street of Pham Ngu Lao, just a 3-minute walk from Bui Vien Street."}, {"address": "235 Nguy\u1ec5n V\u0103n C\u1eeb, Ph\u01b0\u1eddng Nguy\u1ec5n C\u01b0 Trinh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Must-Buys: LYN trendy women\u0027s bags, CoCoXim Vietnamese fragrance \u0026 skincare sets, and local youth designer collab apparel. Situated on the border of District 1 and District 5 right next to the Pham Ngu Lao backpacker hub, NowZone is a favorite shopping mall among Saigon\u0027s youth and students. Unlike high-end luxury department stores, it focuses on affordable and trendy local brands, hosting numerous creative Vietnamese clothing boutiques and cosmetics shops, alongside generous end-of-season sales.", "name": "NowZone Fashion Mall", "transport": "About a 10-minute walk along C\u1ed1ng Qu\u1ef3nh Road from Pham Ngu Lao Street, or a 3-minute Grab ride."}, {"address": "26 L\u00fd T\u1ef1 Tr\u1ecdng, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.7 stars | Must-Buys: Oversized minimalist Vietnamese streetwear tees, original handmade silver necklaces, and industrial-style utility crossbody bags. Just a few minutes\u0027 drive from Pham Ngu Lao Street, this underground complex is the ultimate holy land for Ho Chi Minh City\u0027s independent street fashion brands. Housing dozens of boutiques by emerging local designers, its raw concrete industrial aesthetics and vibrant neon lights make it a hit with trendy youth. If you\u0027re looking for unique, one-of-a-kind Vietnamese streetwear, this is the place to go.", "name": "The New Playground Underground Fashion Mall (L\u00fd T\u1ef1 Tr\u1ecdng)", "transport": "About a 7-minute Grab ride from Pham Ngu Lao Street."}, {"address": "52 Ph\u1ea1m H\u1ed3ng Th\u00e1i, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | Must-Buys: Kappa retro sneakers, Dr. Martens classic leather boots, and Ecko Unltd American streetwear hoodies. Ho\u00e0ng Ph\u00fac is one of Vietnam\u0027s largest international fashion distributors, and this branch near the Pham Ngu Lao commercial area serves as a dedicated factory outlet. The store features year-round clearance sales on famous brands like Kappa, Superga, and Dr. Martens, allowing shoppers to score classic footwear and casual wear at incredible 60% to 70% discounts off retail prices.", "name": "Ho\u00e0ng Ph\u00fac International Brands Outlet - Ph\u1ea1m H\u1ed3ng Th\u00e1i Branch", "transport": "About a 7-minute walk from Pham Ngu Lao Street, heading towards Ben Thanh Market."}, {"address": "189 C\u1ed1ng Qu\u1ef3nh, Ph\u01b0\u1eddng Nguy\u1ec5n C\u01b0 Trinh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Must-Buys: G7 Vietnamese drip black coffee powder, skin-on roasted salted cashews, and natural Vietnamese coconut oil hand cream. Situated at the end of Pham Ngu Lao Street, Co.opmart is one of Vietnam\u0027s most famous and long-standing local supermarket chains. For backpackers looking to buy souvenirs and daily essentials at true local prices, this is the ultimate spot. Beyond the supermarket on the second floor, you\u0027ll also find affordable local clothing counters, specialty food booths, and footwear sales.", "name": "Co.opmart C\u1ed1ng Qu\u1ef3nh Department Store \u0026 Supermarket", "transport": "About a 4-minute walk from the western exit of B\u00f9i Vi\u1ec7n Walking Street."}, {"address": "145 B\u00f9i Vi\u1ec7n, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Must-Buys: Eggshell inlay lacquer jewelry boxes, handcrafted lacquer tea sets, and ethnic motif handmade silk scarves. Located in the heart of Bui Vien Street, this boutique serves as a premier showcase and gallery for high-end traditional Vietnamese craftsmanship. Every item in the shop is handcrafted by local artisans, artfully blending traditional Vietnamese lacquerware techniques with modern aesthetic design. Far superior to typical street market souvenirs, the lacquerware and lifestyle goods here are exquisite, making them perfect for premium, elegant gifts.", "name": "Duy T\u00e2n Lacquerware \u0026 Handicrafts (Saigon Artisans B\u00f9i Vi\u1ec7n)", "transport": "Located right in the center of B\u00f9i Vi\u1ec7n Walking Street, easily accessible on foot."}], "name": "Shopping Malls \u0026 Recommended Outlets"}}, "name": "District 1 - Pham Ngu Lao and Bui Vien Backpacker Nightlife District"}, "district_1_center": {"categories": {"cat_1": {"items": [{"address": "72 L\u00ea Th\u00e1nh T\u00f4n, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Cao Bang Coffee Body Scrub, Winter Melon Gentle Micellar Water, Pomelo Hair Tonic Spray. Currently Vietnam\u0027s hottest local vegan skincare brand, with its entire product line internationally cruelty-free certified. The brand carefully selects signature Vietnamese agricultural products as main ingredients, such as Cao Bang coffee beans, Mekong Delta winter melon, and natural pomelo peel. With sleek minimalist design and ultra-affordable prices, it is immensely popular among local youth and foreign tourists alike\u2014making it a top-priority skincare souvenir when visiting Ho Chi Minh City.", "name": "Cocoon Vietnam Vegan Skincare (Cocoon Vietnam - Vincom Center)", "transport": "Take a Grab ride to Vincom Center \u0110\u1ed3ng Kh\u1edfi, then head down to the cosmetics counter section on floor B2."}, {"address": "64A M\u1ea1c Th\u1ecb B\u01b0\u1edfi, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Chamomile Soothing Face Cream, Botanical Essential Oil Body Oil, Witch Hazel Balancing Toner. Founded in Ho Chi Minh City, this premium French herbal cosmetics brand merges French elegant skincare philosophy with local Vietnamese organic botanical extracts. The District 1 flagship store features decor steeped in the vintage romance of a 19th-century French apothecary. Offering premium natural skincare products and custom essential oil blending, it is a must-visit destination for anyone seeking high-end, sophisticated skincare.", "name": "L\u0027Apothiquaire Artisan Beauty Flagship Store (M\u1ea1c Th\u1ecb B\u01b0\u1edfi)", "transport": "Turn onto M\u1ea1c Th\u1ecb B\u01b0\u1edfi Street from Nguy\u1ec5n Hu\u1ec7 Walking Street; it is about a 3-minute walk."}, {"address": "42 Nguy\u1ec5n Hu\u1ec7, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-Buy List: Saigon Memories Roll-on Perfume Oil, Vietnamese White Ginger Lily Hydrating Perfume, Natural Essential Oil Herbal Handmade Soap. Founded by a renowned Vietnamese perfumer, this indie/hipster fragrance and skincare brand embraces the philosophy of \u0027capturing Vietnamese stories through scent.\u0027 All items are handcrafted using local Vietnamese flora and natural essential oils, delivering fresh, natural aromas infused with a unique Southeast Asian tropical charm. The shop also offers a DIY perfume-making experience, making it super popular among young women and travelers.", "name": "NauNau Aromatherapy \u0026 Artisan Beauty (Nguy\u1ec5n Hu\u1ec7)", "transport": "Located inside the famous \u0027The Cafe Apartment at 42 Nguyen Hue.\u0027 Walk to the entrance from Nguy\u1ec5n Hu\u1ec7 Walking Street, then take the elevator or stairs to the 3rd floor."}, {"address": "143 \u0110\u1ec1 Th\u00e1m, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Must-Buy List: Turmeric Cleansing Milk, Pomelo Peel Hair Growth Serum, Natural Goat Milk Hydrating Shampoo. Established in 1961, this heritage Vietnamese beauty brand is a shared memory across generations of local women. For decades, it has stayed true to traditional herbal formulations using Vietnamese natural turmeric, pomelo peel, centella asiatica, and aloe vera. Offering unbeatable affordability and impressive results\u2014especially its renowned turmeric acne-healing series\u2014it is a quintessential local classic.", "name": "Thorakao Classic Heritage Beauty Showroom (\u0110\u1ec1 Th\u00e1m)", "transport": "Located in the Ph\u1ea1m Ng\u0169 L\u00e3o tourist area. Turn onto \u0110\u1ec1 Th\u00e1m Street from Ph\u1ea1m Ng\u0169 L\u00e3o Street; it is about a 2-minute walk."}, {"address": "140 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Natural Rice Facial Scrub, Plant Lip Balm, Unscented Pure Handmade Soap. A wildly popular Vietnamese natural herbal beauty brand advocating clean, non-toxic skincare that is \u0027as safe as food.\u0027 Free from sulfates and preservatives, all products are crafted using natural ingredients like Vietnamese rice bran, mung beans, and avocado. Featuring minimalist aesthetic packaging, its gentle, non-irritating formulations are perfect for sensitive skin types.", "name": "C\u1ecf M\u1ec1m HomeLab Natural Herbal Beauty (Tr\u1ea7n H\u01b0ng \u0110\u1ea1o)", "transport": "Located on Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Boulevard, about a 5-minute Grab taxi ride from Ben Thanh Market."}, {"address": "81 Nguy\u1ec5n Tr\u00e3i, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Lemonade Dual-Ended Matte Lip Velvet, Caryophy Portulaca Acne Ampoule, Thorakao Turmeric Cream Mask. One of Vietnam\u0027s largest homegrown beauty and pharmacy chains, often dubbed the \u0027Watsons of Vietnam.\u0027 The District 1 flagship store boasts an extraordinarily vast selection: beyond major international brands, it features a dedicated section for top-tier local makeup and skincare brands. With frequent exclusive discounts and bundle deals, it is the best one-stop spot to haul Vietnam\u0027s best-selling beauty and pharmacy products.", "name": "Hasaki Beauty \u0026 Clinic Flagship Store (Nguy\u1ec5n Tr\u00e3i)", "transport": "Take a Grab ride to Nguy\u1ec5n Tr\u00e3i shopping street; located near the Ph\u00f9 \u0110\u1ed5ng Roundabout."}, {"address": "159 \u0110\u1ed3ng Kh\u1edfi, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: White Tiger Balm (B\u1ea1ch H\u1ed5 Ho\u1ea1t L\u1ea1c Cao), Thien Thao Medicated Oil, B\u1ea3o Thanh Herbal Throat Lozenges. Vietnam\u0027s most iconic modern pharmacy chain with the largest market share. Bright blue-and-white storefronts pepper every street and alley of Ho Chi Minh City, with the \u0110\u1ed3ng Kh\u1edfi outlet serving as a fully stocked flagship store. Beyond over-the-counter medications, this is the safest and most reliable venue to buy traditional Vietnamese herbal balms, medicated oils, medicated skincare ointments, and popular local health supplements.", "name": "Pharmacity Flagship Chain Pharmacy (\u0110\u1ed3ng Kh\u1edfi)", "transport": "Located on the upscale \u0110\u1ed3ng Kh\u1edfi shopping street, only about a 3-minute walk from Notre-Dame Cathedral Basilica of Saigon."}, {"address": "65 L\u00ea L\u1ee3i, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Lemonade Dual Long-Lasting Eyeliner, Ofelia Velvet Lip Cream, Emmi\u00e9 by HappySkin Soothing Exfoliating Essence. A major multi-brand trendy beauty boutique gathering vibrant emerging Vietnamese local brands. We especially recommend local makeup lines created by top Vietnamese makeup artists and fashion influencers (like Lemonade and Ofelia), specifically tailored for Asian skin tones with long-wearing, sweat-resistant formulas perfect for the tropical climate. It is the premier front-line destination for experiencing contemporary Vietnamese beauty trends.", "name": "Beauty Box Trendy Beauty Select Shop (Saigon Centre)", "transport": "Located on the 1st floor of Saigon Centre (Takashimaya Department Store). Take a Grab ride directly to the main entrance of Saigon Centre."}], "name": "Iconic Local Beauty \u0026 Drugstore Brands"}, "cat_2": {"items": [{"address": "26 L\u00fd T\u1ef1 Tr\u1ecdng, B\u1ebfn Ngh\u00e9 Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: French retro cut dresses, Morandi-toned knit tops, minimal high-waisted wide-leg trousers. An iconic local youth womenswear brand in Ho Chi Minh City, famous for blending Korean minimalism with French romantic tailoring. Offering great quality at affordable prices, it\u0027s a favorite among local college students and young women. The store interior is bright and minimalistic with comfortable fitting rooms, making it the top choice for everyday versatile yet stylish pieces.", "name": "Lib\u00e9 Workshop Flagship Store", "transport": "Take a Grab or walk to the intersection of L\u00fd T\u1ef1 Tr\u1ecdng and \u0110\u1ed3ng Kh\u1edfi streets; located inside the old apartment building at No. 26."}, {"address": "26 L\u00fd T\u1ef1 Tr\u1ecdng, B\u1ebfn Ngh\u00e9 Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Vietnamese street-style printed graphic tees, patchwork baseball caps, cargo-style crossbody bags. Hidden in a basement in District 1, this underground fashion labyrinth is a hub for HCMC\u0027s cool youth and trendsetters. Housing dozens of local Vietnamese independent designer brands (such as HBS, Levents, etc.), it focuses on streetwear, Y2K, and utility/cargo styles, bursting with vibrant local subculture energy.", "name": "The New Playground Underground Concept Store", "transport": "Located in the basement of the old building opposite the \u0110\u1ed3ng Kh\u1edfi entrance of Vincom Center; look for the eye-catching neon signs at the entrance."}, {"address": "88 M\u1ea1c Th\u1ecb B\u01b0\u1edfi, B\u1ebfn Ngh\u00e9 Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: \u0027One Step\u0027 minimalist low-top canvas sneakers, Vietnamese culture-inspired slip-ons, original cotton canvas socks. \u0027M\u1ed9t\u0027 means \u0027One\u0027 in Vietnamese. It\u0027s an authentic local hipster shoe brand emphasizing a philosophy of \u0027simplifying down to the bare essentials.\u0027 Featuring molded rubber soles paired with breathable uppers tailored for tropical climates, these elegant shoes are loved by local creatives and expats alike.", "name": "M\u1ed9t Shoes - Minimalist Canvas Shoes", "transport": "Near the Saigon Opera House; about a 2-minute walk after turning onto M\u1ea1c Th\u1ecb B\u01b0\u1edfi Street from \u0110\u1ed3ng Kh\u1edfi Street."}, {"address": "106 L\u00ea L\u1ee3i, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Quilted chain crossbody bags, elegant pointed low heels, artisan woven handbags. Known as the \u0027Vietnamese version of Charles \u0026 Keith,\u0027 this household women\u0027s shoe and accessory brand has a beautiful boutique on L\u00ea L\u1ee3i Boulevard in District 1. The product range covers workplace pumps, flat sandals, and various leather handbags\u2014offering highly competitive prices and designs that follow international fashion week trends. A popular stop for souvenirs or personal accessories.", "name": "Vascara Shoes \u0026 Bags (Vascara L\u00ea L\u1ee3i)", "transport": "Located on L\u00ea L\u1ee3i Boulevard in District 1, just a 3-minute walk from B\u1ebfn Th\u00e0nh Market."}, {"address": "22B Nguy\u1ec5n Tr\u00e3i, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Lace patchwork crop tops, ruffled mini skirts, baddie-style metal waist chains. An iconic Vietnamese \u0027it-girl/baddie\u0027 brand that blew up across Southeast Asia and Korean idol circles! Famous for bold cuts, sweet-yet-edgy party styles, and body-flattering silhouettes. The store showcases many stage-ready and nightlife-inspired designs\u2014a must-visit for girls who love highlighting their figure and edgy personal style.", "name": "LSEOUL Trendy Womenswear (LSEOUL Nguy\u1ec5n Tr\u00e3i)", "transport": "Located on the Nguy\u1ec5n Tr\u00e3i fashion street near Ph\u1ea1m Ng\u0169 L\u00e3o Street; most convenient to reach via Grab car or bike."}, {"address": "77 M\u1ea1c Th\u1ecb B\u01b0\u1edfi, B\u1ebfn Ngh\u00e9 Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Must-Buy List: Solid linen blazers, simple V-neck linen dresses, loose versatile shirts. Nosbyn is one of the pioneer brands of modern minimalist fashion in Vietnam. Its design focuses on clean lines, geometric tailoring, and high-quality natural fabrics (like linen and pure cotton), perfectly suited for HCMC\u0027s warm climate. The understated luxury vibe makes it popular among polished local working women and Western tourists alike.", "name": "Nosbyn Studio - Minimalist Tailored Womenswear", "transport": "Located on M\u1ea1c Th\u1ecb B\u01b0\u1edfi Street, near the Saigon Riverbank and \u0110\u1ed3ng Kh\u1edfi shopping area; easily reachable on foot."}, {"address": "132-134 \u0110\u1ed3ng Kh\u1edfi, B\u1ebfn Ngh\u00e9 Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Must-Buy List: Modern printed revamped \u00c1o D\u00e0i, silk embroidered handbags, traditional motif printed silk scarves. Founded by renowned Vietnamese designer Th\u1ee7y Nguy\u1ec5n, this high-fashion brand seamlessly blends Vietnam\u0027s traditional national dress (\u00c1o D\u00e0i) with modern haute couture. Using top-grade silk and intricate hand embroidery, the collection radiates rich Oriental artistic flair. Even if you don\u0027t purchase, visiting offers a visually stunning cultural and fashion experience.", "name": "Th\u1ee7y Design House - Modern \u00c1o D\u00e0i \u0026 High Fashion", "transport": "Located on District 1\u0027s luxury shopping street, \u0110\u1ed3ng Kh\u1edfi Street, near the Hotel Continental Saigon."}, {"address": "102 Nguy\u1ec5n Tr\u00e3i, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Must-Buy List: Versatile sandals, daily commuter leather totes, block-heel Mary Janes. A household budget shoe and bag chain in Vietnam, famous for incredible value and extreme comfort. Designed specifically for Southeast Asian foot shapes, the footwear keeps walking effortless, while the bag quality punches way above its price point. With spacious stores and friendly service, it\u0027s the best spot to experience local everyday shopping.", "name": "Juno Shoes \u0026 Bags (Juno Nguy\u1ec5n Tr\u00e3i)", "transport": "Located in the Nguy\u1ec5n Tr\u00e3i fashion shopping district, about a 5-minute walk from the New World Saigon Hotel."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "168 Calmette, Nguyen Thai Binh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Must-Buy List: Single-origin Vietnamese dark chocolate bars, rich artisanal cocoa spread, premium cocoa powder. Praised by The New York Times as \u0027the best local chocolate,\u0027 Maison Marou was founded in Vietnam by two Frenchmen using carefully selected cacao beans from six different Vietnamese provinces. The shop features a modern, industrial decor where customers can watch the roasting and bean-to-bar chocolate-making process through glass windows. With beautifully packaged products blending French vintage aesthetic with Vietnamese map designs, this is a high-end souvenir spot in District 1 you shouldn\u0027t miss.", "name": "Maison Marou Saigon (Flagship Store)", "transport": "Take a Grab or walk to Calmette Street; about an 8-minute walk from Ben Thanh Market."}, {"address": "B2-21, Saigon Centre, 65 Le Loi, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Must-Buy List: Mixed baked dried fruit \u0026 veggie chips, natural Da Lat artichoke tea, passion fruit concentrate syrup. A famous souvenir chain from the highland resort town of Da Lat, specializing in natural, additive-free agricultural products. The store is tastefully arranged, neatly categorized, and offers generous free samples. Featuring elegant, minimalist packaging that combines local charm with modern aesthetic, the prices are very affordable\u2014perfect for gifting elders or health-conscious friends.", "name": "Langfarm Store Saigon Centre", "transport": "Located on Basement B2 of Saigon Centre (Takashimaya); a 3-minute walk from Metro Line 1 Ben Thanh Station."}, {"address": "43 Ton That Thiep, Ben Nghe, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Must-Buy List: Vintage Vietnam War propaganda poster canvas bags, hand-painted Vietnamese motif coasters, special packaged gift cashews. A delightful and whimsical creative gift shop that blends traditional Vietnamese cult
