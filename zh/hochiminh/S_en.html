    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | The former Presidential Palace of South Vietnam featuring striking modernist architecture and rich historical significance. Inside, the original meeting rooms and underground command bunker are preserved in their authentic state.", "duration": "1.5-2 hours", "title": "Independence Palace", "transport": "Take a Grab or taxi to District 1, about a 5-minute drive from the city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A vibrant pink French-style church, making it one of Ho Chi Minh City\u0027s most dreamily picturesque landmarks and photography hotspots.", "duration": "1 hour", "title": "T\u00e2n \u0110\u1ecbnh Church (The Pink Church)", "transport": "Located in District 3, about a 10-minute Grab ride from the city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Built in the late 19th century, this neo-Romanesque red-brick cathedral features towering twin spires and stands as one of Ho Chi Minh City\u0027s most iconic French colonial landmarks.", "duration": "0.5-1 hour", "title": "Notre-Dame Cathedral Basilica of Saigon", "transport": "Located in the heart of District 1, just a 1-minute walk from the Central Post Office"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | A grand classical post office designed by French architects, featuring magnificent vaulted ceilings and a giant portrait of Ho Chi Minh. It remains fully operational today.", "duration": "0.5-1 hour", "title": "Saigon Central Post Office", "transport": "Located in District 1, right next to Notre-Dame Cathedral, easily accessible on foot"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Displays historical photographs, weapons, equipment, and military aircraft from the Vietnam War, offering a profoundly moving space to reflect on the realities of war and the value of peace.", "duration": "1.5-2 hours", "title": "War Remnants Museum", "transport": "Located in District 3, about a 5-minute drive from the heart of District 1"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | A vintage military residence transformed into a hip architectural hub, housing a delightful mix of uniquely styled cafes and artisanal boutiques.", "duration": "1-2 hours", "title": "The Cafe Apartments", "transport": "Located on Nguyen Hue Walking Street, easily walkable from major hotels in District 1"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.0 stars | Ho Chi Minh City\u0027s largest and oldest traditional indoor market, offering an abundance of local Vietnamese handicrafts, apparel, and authentic street food.", "duration": "1-2 hours", "title": "Ben Thanh Market", "transport": "Located at the transit hub of District 1 near Ben Thanh Station, accessible on foot"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.2 stars | A world-famous backpacker hub and nightlife epicenter, bustling with bars, international eateries, and street performances that showcase the city\u0027s vibrant non-stop energy.", "duration": "2-3 hours", "title": "Pham Ngu Lao Street \u0026 Bui Vien Walking Street", "transport": "Located in District 1, easily reached on foot or by taxi"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | An elegant French Gothic building hosting the spectacular Vietnamese bamboo circus show \"AO Show,\" blending traditional heritage with modern performing arts.", "duration": "1-2 hours", "title": "Saigon Opera House", "transport": "Located on Dong Khoi Street in District 1, just a 3-minute walk from Nguyen Hue Walking Street"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | A magnificent French Baroque-style building fronted by a plaza featuring the iconic statue of President Ho Chi Minh, stunningly illuminated at night.", "duration": "0.5 hour", "title": "Ho Chi Minh City Hall (People\u0027s Committee Building)", "transport": "Located at the top of Nguyen Hue Boulevard in the core of District 1, easily accessible on foot"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.1 stars | A unique mega theme park themed around Vietnamese mythology and religion, featuring massive deity sculptures, wave pools, and thrilling rides.", "duration": "3-4 hours", "title": "Suoi Tien Theme Park", "transport": "Located in District 9, about a 40-minute Grab ride from District 1 city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | Experience Vietnam\u0027s unique 1,000-year-old traditional folk art, accompanied by live traditional music performing enchanting rural myths and stories.", "duration": "1 hour", "title": "Golden Dragon Water Puppet Theatre", "transport": "Located next to Tao Dan Park in District 1, about a 5-minute drive from the city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | Perched on the 49th floor, offering 360-degree panoramic views of Ho Chi Minh City and the winding Saigon River\u2014the ultimate spot for city sunsets and nightscapes.", "duration": "1 hour", "title": "Bitexco Financial Tower Skydeck", "transport": "Located on Hai Trieu Street in District 1 near the Saigon River, convenient on foot or by car"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.0 stars | A sprawling park complex featuring lush gardens, lakes, a water park, and amusement rides, making it a beloved recreational destination for local families.", "duration": "3-4 hours", "title": "Dam Sen Cultural Park", "transport": "Located in District 11, about a 25-minute Grab ride from District 1 city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | One of Ho Chi Minh City\u0027s oldest and most famous Chinese temples, featuring intricate Shiwan ceramic roof reliefs and atmospheric incense coils suspended overhead.", "duration": "1 hour", "title": "Ba Thien Hau Temple (Suet Shing Assembly Hall)", "transport": "Located in Chinatown (Cholon), District 5, about a 20-minute Grab ride"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A yellow and white historic building blending French and Vietnamese architecture, featuring elegant vintage spiral staircases, stained glass, and a rich collection of modern Vietnamese art masterpieces.", "duration": "1.5-2 hours", "title": "Ho Chi Minh City Museum of Fine Arts", "transport": "Located in District 1, near Ben Thanh Market, about a 5-minute walk"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.2 stars | Built in Indochinese Eclectic architectural style, featuring a rich collection of artifacts from prehistoric times to the Nguyen Dynasty, presenting thousands of years of Vietnamese history.", "duration": "1.5 hours", "title": "Museum of Vietnamese History", "transport": "Located next to Saigon Zoo and Botanical Gardens in District 1, about a 10-minute drive from the city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.1 stars | Established in 1865, this is one of the world\u0027s oldest zoological and botanical gardens, boasting over a thousand ancient trees and a wide array of rare animals amidst lush greenery.", "duration": "2-3 hours", "title": "Saigon Zoo and Botanical Gardens", "transport": "Located on the northeast side of District 1, about a 10-minute drive from the city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", " urs", "title": "Banh Mi Huynh Hoa", "transport": "Located on L\u00ea Th\u1ecb Ri\u00eang Street in District 1; take a Grab directly to the storefront."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.3 Stars | A local favorite for authentic beef pho, serving rich and savory sweet broth alongside a generous plate of fresh Thai basil and herbs.", "duration": "1 hour", "title": "Pho Phu Vuong", "transport": "Located on L\u00ea Anh Xu\u00e2n Street in District 1, close to New World Saigon Hotel, reachable on foot."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.1 Stars | A renowned historic restaurant famous for traditional B\u00e1nh X\u00e8o. Golden, crispy crepes filled with shrimp, pork, and bean sprouts, wrapped in fresh lettuce leaves for a refreshing bite.", "duration": "1 hour", "title": "Banh Xeo 46A", "transport": "Located on \u0110inh C\u00f4ng Tr\u00e1ng Street in District 1, near Tan Dinh Pink Church, about a 3-minute walk."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.2 Stars | One of Saigon\u0027s most famous broken rice (C\u01a1m T\u1ea5m) spots. Features massive, freshly grilled pork chops oozing with aromatic sweet-and-savory glaze\u2014a must-try spot for local food lovers.", "duration": "1 hour", "title": "Com Tam Ba Ghieu", "transport": "Located on \u0110\u1eb7ng V\u0103n Ng\u1eef Street in Ph\u00fa Nhu\u1eadn District; taking a Grab is recommended."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.4 Stars | Michelin Bib Gourmand recommended restaurant serving authentic home-style Vietnamese cuisine. Housed in a renovated heritage home with a tranquil and elegant ambiance\u2014even loved by Hollywood star Angelina Jolie.", "duration": "1.5 hours", "title": "Cuc Gach Quan", "transport": "Located on \u0110\u1eb7ng T\u1ea5t Street in District 1; recommended to take a Grab directly there."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.7 Stars | Vietnam\u0027s most popular Japanese-style artisanal wood-fired pizza joint. Featuring house-made fresh burrata cheese, their signature cheese pizza and crab pasta are absolute must-tries!", "duration": "1.5 hours", "title": "Pizza 4P\u0027s Le Thanh Ton", "transport": "Located in an alley on Le Thanh Ton in District 1\u0027s Japantown; take a Grab and walk in."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.5 Stars | A wildly popular local spot specializing in Northern Vietnamese Bun Cha. Enjoy fresh charcoal-grilled pork meatballs paired with sweet-and-sour dipping sauce and abundant fresh herbs\u2014delicious, affordable, and clean.", "duration": "1 hour", "title": "Bun Cha 145", "transport": "Located in the Bui Vien / Pham Ngu Lao street area in District 1, easily accessible on foot."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.3 Stars | An open-air garden restaurant hidden atop an old apartment building. Brimming with rustic charm and lush greenery, it serves incredibly flavorful and authentic traditional Vietnamese dishes.", "duration": "1.5 hours", "title": "Secret Garden Restaurant", "transport": "Located on the rooftop of an old apartment building on Pasteur Street in District 1; requires walking up the stairs."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.4 Stars | A unique chain cafe themed around vintage Vietnamese military style. The signature Coconut Frozen Coffee is a must-order\u2014rich, creamy, and refreshingly cool.", "duration": "1 hour", "title": "Cong Caphe (Yersin)", "transport": "Located on Yersin Street in District 1, near Ben Thanh Market. Easily reachable on foot or via Grab."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.2 Stars | A hugely popular traditional Vietnamese dessert shop offering durian coconut soup, shaved ice desserts, and various fruit jellies\u2014the perfect treat to beat the heat!", "duration": "0.5 hours", "title": "Che My 2", "transport": "Located on Nguyen Tri Phuong Street in District 10, easily accessible by Grab."}, {"category": "Vung Tau", "description": "\u2b50 4.7 Stars | Vung Tau\u0027s most iconic landmark, this massive statue of Jesus stands atop Mount Nho with arms outstretched over the ocean. Visitors can climb inside up to the shoulders for a breathtaking panoramic view of the bay.", "duration": "2-3 hours", "title": "Christ the King Statue", "transport": "A 10-minute Grab or taxi ride from Vung Tau city center to the base of Mount Nho, followed by a climb of about 847 steps to reach the top."}, {"category": "Vung Tau", "description": "\u2b50 4.5 Stars | Vung Tau\u0027s premier beach for swimming and water sports, featuring miles of soft white sand and gentle waves. The coastline is packed with seafood restaurants and exciting water activities like parasailing.", "duration": "2-4 hours", "title": "Back Beach (Bai Sau)", "transport": "Located on the eastern coast of Vung Tau, about a 5-10 minute walk or taxi ride from downtown."}, {"category": "Vung Tau", "description": "\u2b50 4.6 Stars | A historic lighthouse built during the French colonial era atop Mount Nho. It offers unobstructed 360-degree views of Vung Tau city and the coastline. Along the mountain road, be sure to sample famous local French-style yogurt and soft-boiled eggs.", "duration": "1-2 hours", "title": "Vung Tau Lighthouse", "transport": "About a 15-minute scooter ride or taxi journey up the winding mountain road from downtown."}, {"category": "Vung Tau", "description": "\u2b50 4.4 Stars | A vibrant hilltop resort theme park featuring a water park, ziplines, thrill rides, and an eco-zoo\u2014perfect for family fun and stunning elevated photo opportunities.", "duration": "4-6 hours", "title": "Ho May Park", "transport": "Take the 10-minute Ho May Cable Car from Front Beach waterfront directly up to the mountain peak park."}, {"category": "Vung Tau", "description": "\u2b50 4.6 Stars | A dramatic cape stretching into the sea, home to the iconic \"Gate to Heaven\" stone arch. Bracing sea breezes and wide-open ocean panoramas make this a scenic secret spot for sunsets and cliffside coastal photography.", "duration": "1-2 hours", "title": "Nginh Phong Cape", "transport": "Located at the southernmost tip of the Vung Tau peninsula, a 10-minute drive south along the coastal road from Back Beach."}, {"category": "Vung Tau", "description": "\u2b50 4.4 Stars | An elegant French colonial villa that once served as a governor\u0027s retreat. The romantic white architecture houses antique Qing Dynasty ceramics salvaged from shipwrecks, surrounded by lovely frangipani gardens.", "duration": "1-2 hours", "title": "White Palace (Bach Dinh)", "transport": "Situated on the hillside near Front Beach, just a 5-minute taxi ride from the city center."}, {"category": "Vung Tau", "description": "\u2b50 4.3 Stars | A rugged, undeveloped hill offering sweeping views of Back Beach and the city skyline. Its landscape shifts dramatically with the seasons, from sun-baked wilderness to lush greenery.", "duration": "1-2 hours", "title": "Pig Hill (Doi Con Heo)", "transport": "Located near Back Beach; it is best to take a scooter or taxi to the foot of the hill and hike up."}, {"category": "Vung Tau", "description": "\u2b50 4.3 Stars | A sacred spiritual center for local fishermen housing giant whale skeletons. Vung Tau fishermen revere whales as sea deities, hosting vibrant annual sea-worship festivals here.", "duration": "1 hour", "title": "Whale Temple (Thang Tam Temple)", "transport": "Located on Hoang Hoa Tham Street in the city center, about a 5-minute walk or drive from Back Beach."}, {"category": "Vung Tau", "description": "\u2b50 4.5 Stars | A serene Mahayana Buddhist temple complex set hillside, featuring a soaring 19-meter giant statue of Shakyamuni Buddha and an elegant white pagoda set amidst tranquil surroundings.", "duration": "1-2 hours", "title": "Thich Ca Phat Dai (Shakyamuni Buddha Park)", "transport": "Located at the northern slope of Big Mountain, about a 15-minute drive from downtown Vung Tau."}, {"category": "Vung Tau", "description": "\u2b50 4.4 Stars | A famous ocean-facing Buddhist temple housing a massive 21-meter Reclining Buddha. Featuring exquisite traditional Vietnamese ceramic mosaic work, it offers a peaceful atmosphere and picturesque views.", "duration": "1 hour", "title": "Nirvana Vihara (Niet Ban Tinh Xa)", "transport": "Located along the coastal road of Mount Nho, about a 5-minute taxi ride from Front Beach."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.5 Stars | V\u0169ng T\u00e0u\u0027s most renowned ocean-view seafood restaurant, featuring unbeatable sunset views. Serves fresh, live-caught crab, prawns, grilled squid, and more, paired with excellent service and ambiance.", "duration": "1.5-2.5 hours", "title": "G\u00e0nh H\u00e0o Seafood Restaurant", "transport": "Located along Tr\u1ea7n Ph\u00fa coastal boulevard, about a 10-minute taxi ride from the city center."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.4 Stars | A famous restaurant with charming vintage d\u00e9cor, specializing in V\u0169ng T\u00e0u\u0027s signature street food \"B\u00e1nh Kh\u1ecdt\" (Vietnamese mini savory pancakes). Served topped with fresh shrimp and herbs, wrapped in fresh lettuce, and dipped in custom fish sauce.", "duration": "1 hour", "title": "B\u00e1nh Kh\u1ecdt C\u00f4 Ba V\u0169ng T\u00e0u", "transport": "Located on Ho\u00e0ng Hoa Th\u00e1m Street in the city center, easily accessible on foot or by taxi."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.3 Stars | V\u0169ng T\u00e0u\u0027s oldest and immensely popular spot for B\u00e1nh Kh\u1ecdt with long queues. Made-to-order mini shrimp pancakes are crispy on the outside and soft inside, topped with savory dried shrimp powder\u2014a local favorite highly recommended for an authentic taste.", "duration": "1 hour", "title": "B\u00e1nh Kh\u1ecdt G\u1ed1c V\u00fa S\u1eefa", "transport": "Located on Nguy\u1ec5n Tr\u01b0\u1eddng T\u1ed9 Street, less than a 5-minute Grab ride from the city center."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.2 Stars | A bustling traditional local seafood market offering fresh daily catches straight from fishing boats at affordable prices. On-site cooking services are available so you can immerse yourself in the lively local atmosphere.", "duration": "1-2 hours", "title": "X\u00f3m L\u01b0\u1edbi Seafood Market", "transport": "Located near Phan B\u1ed9i Ch\u00e2u Street in the city center, not far from Front Beach, about a 5-minute drive."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.5 Stars | A lush coastal park shaded by swaying coconut palms and dotted with modern sculptures. It is a delightful spot for evening strolls, bicycle rides, and admiring golden sunsets.", "duration": "1-2 hours", "title": "Front Beach Park", "transport": "Located along the Front Beach coastline on the west side of V\u0169ng T\u00e0u, within easy walking distance from the city center."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.4 Stars | One of V\u0169ng T\u00e0u\u0027s oldest temples, housing an ancient gilded stone Buddha statue. The surroundings are tranquil and historic, complemented by lush, green gardens.", "duration": "1 hour", "title": "Linh S\u01a1n C\u1ed5 T\u1ef1 Temple", "transport": "Located on Ho\u00e0ng Hoa Th\u00e1m Road in the city center, extremely convenient to reach."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.3 Stars | A secluded, hidden gem of a beach with crystal-clear waters and fewer crowds. Featuring strong crashing waves, it is perfect for relaxing by the shore to listen to the ocean and an exquisite spot for moon-gazing at night.", "duration": "1-2 hours", "title": "V\u1ecdng Nguy\u1ec7t Beach", "transport": "Nestled at the foot of Small Mountain, accessible via a hidden footpath below the Christ the King statue trail."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.1 Stars | A large night market featuring dozens of open-air seafood stalls, specializing in freshly grilled seafood, stir-fried snails, and cold beer. Open late into the night, it is a great spot to soak up the vibrant evening food scene.", "duration": "1.5-2.5 hours", "title": "V\u0169ng T\u00e0u Night Market", "transport": "Located right behind The Imperial Hotel at Back Beach, easily accessible on foot or by taxi."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.5 Stars | A grand white statue of the Virgin Mary holding baby Jesus, standing prominently on the hillside. With magnificent architecture and a serene, solemn vibe, the summit offers panoramic ocean views, making it a revered pilgrimage site for Catholics and tourists alike.", "duration": "1-2 hours", "title": "Our Lady of V\u0169ng T\u00e0u Statue", "transport": "Located along the Big Mountain coastline (B\u00e3i D\u00e2u area), about a 15-minute taxi ride from the city center."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.6 Stars | A scenic strip of oceanfront cafes lining the coastline, offering authentic Vietnamese coffee paired with breathtaking sea views. Sitting on an outdoor terrace watching the crashing waves and glowing sunset is wonderfully relaxing.", "duration": "1-2 hours", "title": "Tr\u1ea7n Ph\u00fa Coastal Coffee Street", "transport": "Stretching along Tr\u1ea7n Ph\u00fa Coastal Road, easily reached by taxi or motorbike."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.5 Stars | Showcasing over 500 historical and modern weapons as well as military uniforms from around the world. With its rich, impeccably maintained collection, this private museum is a must-visit for military enthusiasts and history buffs.", "duration": "Approx. 1.5 hours", "title": "Worldwide Arms Museum", "transport": "About a 5-minute Grab ride from downtown V\u0169ng T\u00e0u."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.3 Stars | Formerly a quarry, this hidden spot now offers breathtaking panoramic views over the entire V\u0169ng T\u00e0u coastline and Back Beach. The scenery is spectacularly dramatic as the sun sets.", "duration": "Approx. 1 hour", "title": "\u0110\u1ed3i Con Heo Sunset Viewpoint", "transport": "About a 10-minute Grab or motorbike ride from Back Beach, followed by a short walk up a somewhat steep slope."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.4 Stars | An ancient temple perched on a small solitary island off the coast. Accessible on foot only during specific low tides along a stone path emerging from the sea, making for a truly mystical experience.", "duration": "Approx. 1.5 hours", "title": "H\u00f2n B\u00e0 Temple", "transport": "Located off the coast of Back Beach. Accessible on foot via an exposed rocky seabed path during low tide, or by small boat during high tide."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.5 Stars | A famous Buddhist temple situated on a hillside, featuring a massive 21-meter Reclining Buddha statue. Offering sweeping views of the deep blue ocean, the atmosphere here is tranquil and peaceful.", "duration": "Approx. 1 hour", "title": "Ni\u1ebft B\u00e0n T\u1ecbnh X\u00e1 Pagoda", "transport": "About an 8-minute drive or ride along the coastal road from Pineapple Beach (B\u00e3i D\u1ee9a)."}, {"category": "V\u0169ng T\u00e0u", "description": "\u2b50 4.2 Stars | One of V\u0169ng T\u00e0u\u0027s oldest Buddhist temples, housing a centuries-old Buddha statue. The quiet, rustic surroundings showcase a rich traditional Vietnamese Buddhist heritage.", "duration": "Approx. 45 minutes", "title": "Linh S\u01a1n C\u1ed5 T\u1ef1 Temple", "transport": "Located on Ho\u00e0ng Hoa Th\u00e1m Street in the city center, very convenient to reach on foot or by motorbike."}, {"category": "Vung Tau", "description": "\u2b50 4.3 stars | A pristine, secluded beach tucked away at the foot of the mountain. With bigger waves and fewer crowds, it offers a tranquil, romantic vibe and incredible views for nighttime moon-gazing.", "duration": "Approx. 1 hour", "title": "Vong Nguyet Beach (B\u00e3i V\u1ecdng Nguy\u1ec7t)", "transport": "Located at the foot of Mount Small (Christ the King), accessible by walking down the stone steps from the base of the mountain."}, {"category": "Vung Tau", "description": "\u2b50 4.1 stars | A modern marina oozing exotic charm, packed with colorful sailboats and yachts. It\u0027s a hugely popular spot for Instagrammable photos and taking boat trips to Go Gang Island and Long Son Island.", "duration": "Approx. 1.5 hours", "title": "Vung Tau Marina", "transport": "Located next to the Vung Tau Industrial Zone; taking a Grab taxi is recommended, about a 20-minute ride."}, {"category": "Vung Tau", "description": "\u2b50 4.6 stars | Floating seafood restaurants located around Long Son Island where you can feast on live seafood caught right on the spot. Famous far and wide for its deliciously sweet and juicy local oysters.", "duration": "Approx. 2.5 hours", "title": "Long Son Floating Seafood Village (L\u00e0ng B\u00e8 Long S\u01a1n)", "transport": "About a 30-minute drive from downtown Vung Tau; hiring a private car or taking a taxi is recommended."}, {"category": "Vung Tau", "description": "\u2b50 4.4 stars | A prime oceanfront cafe with a minimalist all-white aesthetic. Huge floor-to-ceiling windows let you sip coffee while soaking in breathtaking sea views and sunsets\u2014a major hit with the younger crowd.", "duration": "Approx. 1.5 hours", "title": "Soho Coffee Oceanfront Cafe", "transport": "Located along Ha Long Street on Front Beach; very convenient to reach by scooter or ride-hailing services."}, {"category": "Vung Tau", "description": "\u2b50 4.5 stars | Vung Tau\u0027s most iconic souvenir shop. Freshly baked, fluffy sponge cakes filled with savory salted egg yolk and rich cheese deliver an irresistible sweet-and-savory bite that keeps long queues forming constantly.", "duration": "Approx. 30 mins", "title": "Original Salted Egg Sponge Cake Store (B\u00e1nh B\u00f4ng Lan Tr\u1ee9ng Mu\u1ed1i G\u1ed1c C\u1ed9t \u0110i\u1ec7n)", "transport": "Located on Nguyen Truong To Street in the city center; easily accessible via Grab or scooter."}, {"category": "Vung Tau", "description": "\u2b50 4.3 stars | A hugely popular local spot for Banh Khot (crispy savory mini pancakes). Golden and crunchy on the outside, topped with fresh whole shrimp, and served with crisp herbs and dipping fish sauce for a wonderfully refreshing taste.", "duration": "Approx. 1 hour", "title": "Goc Vu Sua Banh Khot (B\u00e1nh Kh\u1ecdt G\u1ed1c V\u00fa S\u1eefa)", "transport": "Located at 14 Nguyen Truong To Street, about a 5-minute drive from Front Beach."}, {"category": "Vung Tau", "description": "\u2b50 4.4 stars | A budget-friendly, local favorite seafood joint famous for lemongrass steamed snails, scallion-oil grilled oysters, and butter-sauteed crabs. Sea-view seats are in high demand!", "duration": "Approx. 1.5 hours", "title": "Quan Oc Tu Nhien Seafood \u0026 Snails (Qu\u00e1n \u1ed0c T\u1ef1 Nhi\u00ean)", "transport": "Has multiple branches in Vung Tau; the Tran Phu coastal branch offers the best scenic views. Taking a ride is recommended."}, {"category": "Vung Tau", "description": "\u2b50 4.2 stars | More pristine and peaceful than the main city beaches in Vung Tau. In the early morning, you can witness fishermen hauling in their nets at the bustling fish market for a genuinely authentic Vietnamese fishing village experience.", "duration": "Approx. 2 hours", "title": "Long Hai Fish Market \u0026 Beach (Ch\u1ee3 C\u00e1 Long H\u1ea3i \u0026 B\u00e3i Bi\u1ec3n Long H\u1ea3i)", "transport": "About 25 km from downtown Vung Tau; renting a scooter or hiring a private car is recommended."}, {"category": "Vung Tau", "description": "\u2b50 4.3 stars | A lush coastal park shaded by swaying coconut palms and dotted with modern sculptures. Perfect for an evening stroll to catch the ocean breeze and admire breathtaking sunsets.", "duration": "Approx. 1 hour", "title": "Front Beach Park (C\u00f4ng vi\u00ean B\u00e3i Tr\u01b0\u1edbc)", "transport": "Located along the downtown coastline, easily accessible on foot."}, {"category": "Vung Tau", "description": "\u2b50 4.1 stars | An indoor night market dedicated to late-night seafood feasts. Rows of stalls showcase fresh fish, shrimp, and shellfish with transparent pricing, making it a go-to night spot for delicious grilled seafood.", "duration": "Approx. 2 hours", "title": "Vung Tau Night Market Seafood Stalls (Ch\u1ee3 \u0110\u00eam V\u0169ng T\u00e0u)", "transport": "Located behind The Imperial Hotel at Back Beach; reachable by foot or taxi."}, {"category": "Vung Tau", "description": "\u2b50 4.4 stars | Standing 25 meters tall on the slopes of Big Mountain, this majestic white statue of the Virgin Mary faces the sea with the mountains behind it. The sanctuary offers a serene, sacred atmosphere and sweeping ocean panoramas.", "duration": "Approx. 1.5 hours", "title": "Our Lady of Bai Dau Shrine (\u0110\u1ee9c M\u1eb9 B\u00e3i D\u00e2u)", "transport": "Located along the Tran Phu coastal road, about a 10-minute ride by Grab or scooter."}, {"category": "Vung Tau", "description": "\u2b50 4.0 stars | A deep blue lake formed from a former quarry, featuring crystal-clear turquoise waters. Equipped with wooden boardwalks and small boats along the shore, it has become a popular hidden gem for photo shoots and wedding photography.", "duration": "Approx. 1 hour", "title": "Ho Xanh Blue Lake (H\u1ed3 Xanh V\u0169ng T\u00e0u)", "transport": "Located off National Route 51 on the way to Vung Tau, about 15 km from the city center; hiring a car or riding a scooter is recommended."}, {"category": "Vung Tau", "description": "\u2b50 4.5 stars | Rich, creamy coconut ice cream served right inside a fresh coconut shell, topped with crispy coconut flakes and roasted peanuts. Refreshing and sweet, it\u0027s an absolute must-try summer treat in Vung Tau.", "duration": "Approx. 30 mins", "title": "Con Dao Coconut Ice Cream (Kem D\u1eeba C\u00f4n \u0110\u1ea3o V\u0169ng T\u00e0u)", "transport": "Located around the city center and coastal roads; easily accessible by Grab or on foot."}, {"category": "Vung Tau", "description": "\u2b50 4.3 stars | Shaded by dense lush trees with fresh, invigorating air. Reaching the summit rewards you with sweeping views of Vung Tau city and the coastline\u2014a top choice for morning runners and hiking enthusiasts.", "duration": "Approx. 2 hours", "title": "Big Mountain Hiking Trail (N\u00fai L\u1edbn V\u0169ng T\u00e0u)", "transport": "You can start hiking from the trail entrance on Vi Boi Street, or take the cable car up to the hilltop park."}, {"category": "Vung Tau", "description": "\u2b50 4.3 stars | Perched on a seaside cliff, this scenic cafe boasts an open-air terrace with expansive views. Listening to the crashing waves while savoring authentic Vietnamese drip coffee is pure bliss.", "duration": "Approx. 1.5 hours", "title": "Lightfield Coffee \u0026 Tea V\u0169ng T\u00e0u", "transport": "Located along the Tran Phu coastline, easily reachable via Grab or motor scooter."}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.5 stars | A famous islet in the Mekong Delta. Experience gliding through water coconut canals on a sampan, sample fresh tropical fruits, and enjoy traditional Vietnamese folk music performances.", "duration": "2-3 hours", "title": "Th\u1edbi S\u01a1n Island (Unicorn Island)", "transport": "A 15-minute wooden boat ride from M\u1ef9 Tho Tourist Boat Station"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.6 stars | M\u1ef9 Tho\u0027s oldest and most magnificent Buddhist temple, blending French architecture, Khmer style, and traditional Chinese carvings. The grounds feature massive statues of the Laughing Buddha and Reclining Buddha.", "duration": "1-2 hours", "title": "V\u0129nh Tr\u00e0ng Pagoda", "transport": "About 10 minutes by taxi or Grab from M\u1ef9 Tho city center"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.3 stars | Home to the intriguing Coconut Religion ruins, showcasing a unique chapter of religious history. The island also offers hands-on coconut candy making experiences and lush ecological scenery.", "duration": "2 hours", "title": "Ph\u1ee5ng Island (Phoenix Island)", "transport": "A 20-minute boat ride along the Mekong River from M\u1ef9 Tho Pier"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.0 stars | Experience authentic Mekong waterborne trade culture, where vendors hang sample fruits on bamboo poles at the bow of their boats. Early morning offers the liveliest atmosphere.", "duration": "1-2 hours", "title": "M\u1ef9 Tho Floating Market", "transport": "Charter a small wooden boat from M\u1ef9 Tho Pier early in the morning"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.2 stars | The best place to soak up local daily life, selling fresh tropical fruits, seafood, and famous dried M\u1ef9 Tho noodle ingredients\u2014perfect for picking up local souvenirs.", "duration": "1-2 hours", "title": "M\u1ef9 Tho Central Market", "transport": "Located in the city center, easily accessible on foot or by cyclo"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.1 stars | An islet famed for its abundant rambutans, longans, and other tropical fruits. Visitors can stroll through orchards to pick fresh fruit and immerse themselves in charming rural landscapes.", "duration": "1.5 hours", "title": "R\u1ed3ng Island (Dragon Island)", "transport": "About a 10-minute sightseeing boat ride from M\u1ef9 Tho Pier"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.2 stars | The most pristine and tranquil among the four major river islands, featuring traditional floating houses and orchards, where you can savor authentic, home-cooked Mekong delicacies.", "duration": "1.5 hours", "title": "Quy Island (Turtle Island)", "transport": "A 20-minute boat ride on the Mekong River"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.4 stars | Built in the early 20th century, this Gothic-style Catholic cathedral features soft pink walls and a majestic bell tower, making it a distinctive city landmark.", "duration": "30-45 minutes", "title": "M\u1ef9 Tho Cathedral", "transport": "A 10-minute walk or a 3-minute taxi ride from M\u1ef9 Tho Central Market"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.3 stars | A lush riverside park along the Ti\u1ec1n River, popular among locals for evening strolls and catching sunsets, offering breathtaking river views of R\u1ea1ch Mi\u1ec5u Bridge.", "duration": "1 hour", "title": "L\u1ea1c H\u1ed3ng Park", "transport": "Located along the Ti\u1ec1n River bank in M\u1ef9 Tho, easily walkable from the city center"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.5 stars | A cable-stayed bridge connecting M\u1ef9 Tho with B\u1ebfn Tre Province. A major engineering feat on the Mekong River, it illuminates enchantingly at night and is a favorite spot for photographers.", "duration": "30 minutes", "title": "R\u1ea1ch Mi\u1ec5u Bridge", "transport": "Drive along National Route 60, or view it from the riverside park"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.2 stars | A temple showcasing Vietnam\u0027s unique Caodaist faith, featuring vibrant architecture that blends Eastern and Western religious elements, with the sacred \"Divine Eye\" painted inside the sanctuary.", "duration": "45 minutes", "title": "M\u1ef9 Tho Caodaist Temple", "transport": "About an 8-minute taxi ride from the city center"}, {"category": "M\u1ef9 Tho", "description": "\u2b50 4.1 stars | Brimming with bustling evening stalls serving Vietnamese savory pancakes (B\u00e1nh X\u00e8o), grilled seafood, desserts, and budget-friendly clothes and accessories, bursting with vibrant n                 if(btn) {
                    if(cat === category) {
                        btn.className = "filter-btn-active text-xs md:text-sm px-4 py-2 rounded-full border font-bold whitespace-nowrap transition-colors shadow-sm";
                    } else {
                        btn.className = "filter-btn-inactive text-xs md:text-sm px-4 py-2 rounded-full border font-medium whitespace-nowrap transition-colors shadow-sm";
                    }
                }
            });
            renderPool();
        }

        function renderPool() {
            poolContainer.innerHTML = '';
            let data = activeTab === 'schedule' ? schedulePool : intercityPool;
            
            if(activeTab === 'schedule' && currentFilter !== 'All') {
                data = data.filter(item => {
                    const cat = item.category || '';
                    const title = item.title || '';
                    const desc = item.description || '';
                    const fullText = (cat + ' ' + title + ' ' + desc).toLowerCase();
                    const filterLower = currentFilter.toLowerCase();

                    if (filterLower.includes('attraction')) {
                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;
                    }
                    
                    return cat.toLowerCase().includes(filterLower);
                });
            }

            if(data.length === 0) {
                poolContainer.innerHTML = `<div class="text-center text-gray-400 py-10 font-medium md:text-lg">No data available for this category</div>`;
                return;
            }

            data.forEach((item, index) => {
                let title = activeTab === 'schedule' ? item.title : item.route;
                let category = activeTab === 'schedule' ? (item.category || 'Featured') : 'Intercity Transport';
                let duration = activeTab === 'schedule' ? item.duration : item.time;
                let transport = activeTab === 'schedule' ? item.transport : item.method;
                let desc = activeTab === 'schedule' ? item.description : 'Suitable for intercity or cross-border travel.';

                let catLower = category.toLowerCase();
                let badgeColor = "bg-slate-50 text-slate-600 border-slate-200";
                
                if(catLower.includes('attraction') || catLower.includes('culture') || catLower.includes('景點') || catLower.includes('文藝')) badgeColor = "bg-sky-50 text-sky-700 border-sky-200";
                if(catLower.includes('shopping') || catLower.includes('market') || catLower.includes('購物') || catLower.includes('商圈')) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(catLower.includes('dining') || catLower.includes('cafe') || catLower.includes('美食') || catLower.includes('名店')) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(dynamicCats.some(dynCat => catLower.includes(dynCat.toLowerCase()))) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";

                let searchKeyword = encodeURIComponent(`${cityName} ${title}`);
                let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>
                        <button onclick="addToTrip('${activeTab}', '${(item.title || item.route).replace(/'/g, "\\'")}')" class="shrink-0 bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white rounded-xl px-4 py-2 font-bold transition-colors border border-sky-100 text-sm shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i>Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="${badgeColor} border text-xs px-2.5 py-1 rounded-md font-bold">${category}</span>
                        <span class="bg-rose-50 text-rose-600 border border-rose-100 text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${duration}</span>
                    </div>
                    <p class="text-sm md:text-base text-gray-600 mb-5 leading-relaxed">${formattedDesc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm md:text-base text-gray-700 flex items-start gap-3">
                        <span class="${activeTab === 'schedule' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                            <i class="fa-solid ${activeTab === 'schedule' ? 'fa-train-subway' : 'fa-ship'}"></i>
                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);
            });
        }

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
