and exotic contemporary architectural landmark in District 7.", "name": "Tajma Sago Castle - Chloe Gallery", "transport": "Located within the Crescent Lake area. It is recommended to use Grab navigated directly to Chloe Gallery, or walk for about 8 minutes from Crescent Mall."}, {"address": "\u0110\u01b0\u1eddng Nguy\u1ec5n Th\u1ecb Th\u1eadp, Ph\u01b0\u1eddng T\u00e2n Quy, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | T\u00e2n Quy \u0110\u00f4ng Communal House is one of the few well-preserved traditional Vietnamese rural historic buildings in District 7, with roots dating back to the 19th-century land reclamation period of Southern Vietnam. Nestled in a bustling residential neighborhood, it retains the classic ancestral hall architecture of southern villages, featuring a three-courtyard layout and double-eaved hip roofs adorned with exquisite carved ceramic figures and dragons chasing pearls. Dedicated to the city guardian deity and local pioneers, the shrine is framed by heavy mahogany carvings, exhaling a quiet, solemn, and rustic aura. It witnesses a century of transformation in South Saigon from desolate marshlands to a modern urban district, holding immense historical and cultural value.", "name": "T\u00e2n Quy \u0110\u00f4ng Communal House (\u0110\u00ecnh T\u00e2n Quy \u0110\u00f4ng)", "transport": "About 7 minutes by scooter or taxi from central Ph\u00fa M\u1ef9 H\u01b0ng; or take bus No. 139 to Nguy\u1ec5n Th\u1ecb Th\u1eadp Street and walk to the destination."}, {"address": "C\u1ea7u T\u00e2n Thu\u1eadn, Ph\u01b0\u1eddng T\u00e2n Thu\u1eadn \u0110\u00f4ng, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 stars | Spanning the K\u00eanh T\u00e9p canal, T\u00e2n Thu\u1eadn Bridge is one of the oldest transport hubs connecting District 4 and District 7, with history dating back to French colonial engineering. Today\u0027s T\u00e2n Thu\u1eadn Bridge consists of Bridge 1 and Bridge 2, having witnessed the rise of the Saigon River port industrial zone and the T\u00e2n Thu\u1eadn Export Processing Zone (EPZ). Not only marks the birthplace of South Saigon\u0027s industrialization and modern urban development, its industrial structure intersecting railway and road lines also exudes a strong mid-20th-century industrial heritage feel. Standing at the bridgehead, visitors can look out over a unique historic port landscape woven together by bustling port cranes and modern skyscrapers.", "name": "T\u00e2n Thu\u1eadn Bridge \u0026 Surrounding Area (C\u1ea7u T\u00e2n Thu\u1eadn)", "transport": "Located at the northern entrance of District 7, about 12 minutes by taxi from District 1 through District 4; or take bus No. 20 directly."}, {"address": "48/2 \u0110\u01b0\u1eddng s\u1ed1 15, Ph\u01b0\u1eddng T\u00e2n Quy, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | T\u00e2n Quy Parish Church is one of the oldest centers of Catholic faith in District 7. Built in the mid-20th century and renovated several times, the church\u0027s architecture fuses Gothic pointed arches with minimalist local Vietnamese style. A towering bell tower topped with a cross serves as a visual landmark for the surrounding neighborhood. Inside, the main altar is adorned with warm wood carvings and stained glass windows, creating a solemn and sacred light effect when sunlight streams through. Surrounded by lush trees, it is not only a spiritual sanctuary for local devotees but also an important architectural heritage site to experience District 7\u0027s unique blend of old and new.", "name": "T\u00e2n Quy Parish Church (Nh\u00e0 th\u1edd Gi\u00e1o x\u1ee9 T\u00e2n Quy)", "transport": "About an 8-minute Grab ride from Crescent Mall in Ph\u00fa M\u1ef9 H\u01b0ng; or take bus No. 34 to the Nguy\u1ec5n Th\u1ecb Th\u1eadp intersection and walk for 6 minutes."}, {"address": "167 \u0110\u01b0\u1eddng Hu\u1ef3nh T\u1ea5n Ph\u00e1t, Ph\u01b0\u1eddng T\u00e2n Thu\u1eadn \u0110\u00f4ng, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Situated near the banks of the Saigon River in District 7, Thu\u1eadn Ph\u00e1t Parish Church is a Catholic landmark featuring a prominent modern Neo-Gothic architectural style. The church boasts striking white and sky-blue exterior walls, flanked by double bell towers that rise gracefully with sleek lines. Inside, high vaulted ceilings are accompanied by colorful stained glass depicting biblical stories and intricate statues. Beyond its exquisite craftsmanship, the church records the evolution of District 7\u0027s waterfront community. During festivals and mass services, the melodious chime of church bells echoes through the riverbank streets, displaying immense architectural charm rich in cultural heritage.", "name": "Thu\u1eadn Ph\u00e1t Parish Church (Nh\u00e0 th\u1edd Gi\u00e1o x\u1ee9 Thu\u1eadn Ph\u00e1t)", "transport": "About a 10-minute taxi ride from Ph\u00fa M\u1ef9 H\u01b0ng along Hu\u1ef3nh T\u1ea5n Ph\u00e1t Road; or take bus No. 20 directly to the bus stop near the church."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "02-04 Street 9, Him Lam Urban Area, Tan Hung Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Artinus 3D Art Museum is District 7\u0027s most iconic visual art museum, spanning over 4,000 square meters. Featuring works created by an outstanding team of South Korean artists, it is divided into nine themed zones including Ocean, Animals, Masterpieces, Vietnamese Culture, Fairy Tales, and Fantasy. The exhibits cleverly use optical illusions and intricate murals, allowing visitors to step directly into the paintings to capture fun, dynamic, and interactive photos\u2014making it a perfect visual feast for families, kids, and young adults alike.", "name": "Artinus 3D Art Museum", "transport": "About a 10-minute Grab or taxi ride from Phu My Hung city center; or take Bus No. 31 to the Him Lam area and walk."}, {"address": "53 Nguyen Thi Thap, Tan Quy Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Located on the bustling, wide stretch of Nguy\u1ec5n Th\u1ecb Th\u1eadp Street in District 7, Tan Quy Catholic Church is an important Catholic faith and cultural center for the local community. The church features an elegant modern Gothic architectural style, with its towering bell tower and graceful spires standing solemnly in the sunlight. The spacious, bright interior with solemn stained glass windows and wooden pulpits conveys a rich sense of religious art. During weekend masses and Christmas, colorful light displays illuminate the scene, attracting many worshippers and visitors to experience its peaceful and serene spiritual atmosphere.", "name": "Tan Quy Catholic Church (Gi\u00e1o x\u1ee9 T\u00e2n Quy)", "transport": "Located on the main thoroughfare of Nguyen Thi Thap, about a 7-minute drive from Crescent Mall in Phu My Hung."}, {"address": "Villa 4, Street 5, Nam Phu Compound, Tan Thuan Dong Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | Lotus Gallery is one of Ho Chi Minh City\u0027s oldest and most prestigious private contemporary art galleries, now set within a lush villa compound in District 7. Dedicated to promoting local Vietnamese contemporary artists and master-level works, it exhibits a diverse array of mediums including traditional lacquer, watercolor, oil painting, and modern sculpture. Nestled in an elegant and serene environment, it regularly hosts unique special exhibitions and art talks, drawing international collectors and art enthusiasts alike\u2014making it a sophisticated destination to deeply explore the evolution of modern Vietnamese art.", "name": "Lotus Gallery", "transport": "Recommended to take a Grab or private car directly to the Nam Phu residential area, about a 12-minute drive from the heart of Phu My Hung."}, {"address": "799 Nguyen Van Linh, Tan Phu Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | The Saigon Exhibition and Convention Center (SECC) is Phu My Hung\u0027s iconic international convention landmark. Beyond large commercial expos, it serves as Ho Chi Minh City\u0027s premier venue for international art fairs, contemporary design exhibitions, photography shows, and major cultural festivals. The venue boasts highly modern facilities, pillarless open spaces, and top-tier audiovisual equipment. During major arts and cultural exhibitions, visitors can admire contemporary creations from top global and local Vietnamese artists, making it the ultimate portal to modern Southeast Asian art trends.", "name": "Saigon Exhibition and Convention Center (SECC) - Arts \u0026 Cultural Section", "transport": "Located on Nguyen Van Linh, Phu My Hung\u0027s main artery, just a 5-minute walk from Crescent Mall with extremely convenient transport access."}, {"address": "477 Huynh Tan Phat, Tan Thuan Dong Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Situated on Hu\u1ef3nh T\u1ea5n Ph\u00e1t Street in District 7, Thuan Phat Catholic Church is a historic and beloved local religious landmark. Its architecture beautifully blends French colonial charm with traditional Vietnamese design elements, featuring cream-white exterior walls paired with twin bell towers for a refined, elegant look. The interior sanctuary is exquisitely crafted, with fine wood carvings and vibrant stained glass complementing each other to create a solemn, peaceful haven amid the bustling city, reflecting the harmonious fusion of traditional faith and modern life in District 7.", "name": "Thuan Phat Catholic Church (Gi\u00e1o x\u1ee9 Thu\u1eadn Ph\u00e1t)", "transport": "About a 10-minute drive from Crescent Mall in Phu My Hung, or take Bus No. 20 and get off at the Huynh Tan Phat stop, followed by a short walk."}, {"address": "79/33/20 Street 79, Tan Quy Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Tucked away in a quiet alley in District 7\u0027s Tan Quy area, Kieu Dam Catholic Church combines modern aesthetics with a warm community feel. Designed with sleek geometric lines, its soaring bell tower topped with a cross serves as a prominent neighborhood landmark. The interior play of light and shadow is breathtaking, as natural daylight pours through skylights above to create a sacred and artistic spatial experience. Peaceful during weekdays, it is an immersive spot to experience local life and faith in District 7.", "name": "Kieu Dam Catholic Church (Gi\u00e1o x\u1ee9 Ki\u1ec1u \u0110\u00e0m)", "transport": "Recommended to ride a scooter or take a Grab bike/car into the alley off Street 79; about an 8-minute drive from Phu My Hung."}, {"address": "79 Street 10, Nam Long Residential Area, Tan Thuan Dong Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Nestled in the upscale Nam Long residential community of District 7, South Saigon Evangelical Church is a Protestant chapel showcasing modern minimalist aesthetics. Its clean, crisp lines are complemented by abundant glass panels and natural wood elements, breaking away from traditional heavy church aesthetics to convey openness, inclusivity, and contemporary design. The bright interior hall is equipped with high-spec sound systems, regularly hosting musical worships and cultural sharing sessions, embodying the unique multicultural and modern arts atmosphere of District 7\u0027s international district.", "name": "South Saigon Evangelical Church (H\u1ed9i Th\u00e1nh Tin L\u00e0nh Nam S\u00e0i G\u00f2n)", "transport": "About a 10-minute drive from Starlight Bridge in Phu My Hung; turn into the Nam Long community via Tran Trong Cung Street."}, {"address": "86/1A Huynh Tan Phat, Phu My Ward, District 7, Ho Chi Minh City", "feature": "\u2b50 4.2 Stars | Located in the southern extension of the Phu My Hung residential area, Phu My Catholic Center is a neighborhood church filled with warm human touch. Its design beautifully incorporates local architectural flavor, seamlessly blending southern Vietnamese traditional pavilion structures with Catholic chapel elements. The central courtyard features an intricate Grotto of Our Lady set against a lush garden backdrop. Radiating a deep sense of tranquility, a visit here allows you to appreciate the rich cultural heritage and religious art resulting from the blend of old and new communities around Phu My Hung.", "name": "Phu My Catholic Center (Gi\u00e1o h\u1ecd Ph\u00fa M\u1ef9)", "transport": "About a 6-minute drive south along Huynh Tan Phat from the core of Phu My Hung."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "R\u1ea1ch \u0110\u0129a, Ph\u01b0\u1eddng T\u00e2n Ph\u00fa, Qu\u1eadn 7, TP. H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.6 Stars | Located in the heart of Ph\u00fa M\u1ef9 H\u01b0ng, Crescent Lake Park surrounds a beautiful man-made crescent-shaped lake. The park features well-maintained scenic walking trails lined with lush trees and vibrant flowers, making it a favorite spot for morning jogs, casual strolls, and relaxation among locals and expats alike. At night, the colorful reflections of the Starlight Bridge and surrounding modern commercial buildings create an exceptionally romantic atmosphere, making it one of the most iconic and impeccably maintained urban green spaces in District 7, Ho Chi Minh City.", "name": "Crescent Lake Park (C\u00f4ng vi\u00ean H\u1ed3 B\u00e1n Nguy\u1ec7t)", "transport": "We recommend taking a Grab or taxi directly to \u0027H\u1ed3 B\u00e1n Nguy\u1ec7t\u0027, or take bus #139 or #34 to Crescent Mall station and walk for about 3 minutes."}, {"address": "L\u00f4 M5, M6, M7, \u0110\u01b0\u1eddng 16, Ph\u01b0\u1eddng T\u00e2n Ph\u00fa, Qu\u1eadn 7, TP. H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 Stars | Stretching for hundreds of meters along the river, Sakura Park is the flagship waterfront park of the upscale Ph\u00fa M\u1ef9 H\u01b0ng Midtown residential complex. The park is planted with numerous Pink Trumpet Trees (often called Singapore Sakura), creating a blooming sea of pink and a deeply romantic landscape during flower season. Designed with subtle modern Japanese garden elements, it features waterfront platforms, a dancing fountain area, children\u0027s playgrounds, and sculpture galleries. Combining elegant aesthetics with recreational functionality, it is a highly popular check-in spot for photos.", "name": "Sakura Park Midtown (C\u00f4ng vi\u00ean Sakura Park)", "transport": "Take a Grab directly to \u0027Midtown Ph\u00fa M\u1ef9 H\u01b0ng\u0027 or \u0027Sakura Park\u0027. Alternatively, walk east along T\u00f4n D\u1eadt Ti\u00ean Street from Crescent Lake Park for about 12 minutes."}, {"address": "Khu \u0111\u00f4 th\u1ecb Ph\u00fa M\u1ef9 H\u01b0ng, Ph\u01b0\u1eddng T\u00e2n Ph\u00fa, Qu\u1eadn 7, TP. H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.6 Stars | Spanning across Crescent Lake, the Starlight Bridge seamlessly connects with the lush parklands at both ends, forming Ph\u00fa M\u1ef9 H\u01b0ng\u0027s most popular evening leisure space. The park area features vast, well-manicured lawns and shaded walkways. As cool evening breezes roll in, it draws crowds for exercise and gatherings. At nightfall, the bridge\u0027s rainbow waterfall fountain and starry LED bridge floor light up, casting brilliant reflections that harmonize with the park\u0027s natural night view to create one of Ho Chi Minh City\u0027s most romantic waterfront scenes.", "name": "Starlight Bridge Promenade \u0026 Park (C\u1ea7u \u00c1nh Sao \u0026 C\u00f4ng vi\u00ean)", "transport": "Take a Grab and set the location directly to \u0027C\u1ea7u \u00c1nh Sao\u0027 to step right into the park promenade area."}, {"address": "\u0110\u01b0\u1eddng T\u00f4n D\u1eadt Ti\u00ean, Ph\u01b0\u1eddng T\u00e2n Phong, Qu\u1eadn 7, TP. H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 Stars | Canal Park runs through the central spine of Ph\u00fa M\u1ef9 H\u01b0ng\u0027s luxury residential area, lined with European-style architecture and charming cafes. Centered around a clean central canal, the park features neatly manicured tropical foliage, shaded tree pavilions, and artistic sculptures. Strolling along this green waterfront corridor offers an exotic leisure vibe and a remarkably serene atmosphere, making it an ideal nature-friendly spot to experience the elegant, slow-paced lifestyle of Ph\u00fa M\u1ef9 H\u01b0ng\u0027s upscale community.", "name": "Canal Park (C\u00f4ng vi\u00ean K\u00eanh \u0110\u00e0o)", "transport": "Starting from Crescent Mall, walk along T\u00f4n D\u1eadt Ti\u00ean Boulevard for about 5 minutes to arrive."}, {"address": "\u0110\u01b0\u1eddng Nguy\u1ec5n V\u0103n Linh, Ph\u01b0\u1eddng T\u00e2n Ph\u00fa, Qu\u1eadn 7, TP. H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 Stars | Serving as a major green lung in District 7, this park boasts high foliage coverage that beautifully preserves Southern Vietnam\u0027s unique riverbank and natural forest ecosystem. Towering trees fill the air with fresh oxygen, complemented by wooden boardwalks stretching to the river\u0027s edge and restful pavilions\u2014perfect for ecological exploration and peaceful relaxation. Free from heavy commercial noise, it offers a slice of raw, natural beauty that makes it a hidden urban sanctuary for nature lovers, bird watchers, and outdoor enthusiasts.", "name": "Nam Sai Gon Park (C\u00f4ng vi\u00ean Nam S\u00e0i G\u00f2n)", "transport": "Located alongside Nguy\u1ec5n V\u0103n Linh Boulevard, it is best reached by motorbike or by setting Grab destination to \u0027C\u00f4ng vi\u00ean Nam S\u00e0i G\u00f2n\u0027."}, {"address": "\u0110\u01b0\u1eddng Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh, Ph\u01b0\u1eddng T\u00e2n Phong, Qu\u1eadn 7, TP. H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.2 Stars | Tucked inside a quiet residential neighborhood of Ph\u00fa M\u1ef9 H\u01b0ng, Wonderland Park is a welcoming, family-friendly community park suitable for all ages. Shaded by abundant greenery, it offers well-kept sprawling lawns perfect for picnics and play, alongside comprehensive playground equipment and walking paths. Safe, orderly, and elegant, it radiates a warm family leisure vibe, making it a great location to savor the premium living environment of Ph\u00fa M\u1ef9 H\u01b0ng and enjoy a relaxing afternoon.", "name": "Wonderland Park (C\u00f4ng vi\u00ean Wonderland)", "transport": "Easily accessible by taking a Grab to \u0027Wonderland Park Phu My Hung\u0027 or \u0027\u0110\u01b0\u1eddng Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh\u0027."}, {"address": "\u0110\u01b0\u1eddng 19, Ph\u01b0\u1eddng T\u00e2n Ph\u00fa, Qu\u1eadn 7, TP. H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.1 Stars | Situated around the M\u1ef9 Ph\u00fa Villa area in Ph\u00fa M\u1ef9 H\u01b0ng, M\u1ef9 Ph\u00fa Park is celebrated for its high-quality landscape gardening and serene, elegant ambiance. Filled with vibrant tropical flowers and tall shade trees, it features a circular walking track, benches, and outdoor fitness equipment, all surrounded by gracefully designed private villas. Strolling here allows visitors to soak in lush greenery while experiencing the refined atmosphere of District 7\u0027s premier international residential and educational enclave.", "name": "My Phu Park (C\u00f4ng vi\u00ean M\u1ef9 Ph\u00fa)", "transport": "A quick 3-to-5-minute Grab or motorbike ride from Crescent Mall will bring you directly to the M\u1ef9 Ph\u00fa community area."}, {"address": "Khu H\u01b0ng V\u01b0\u1ee3ng, Ph\u01b0\u1eddng T\u00e2n Phong, Qu\u1eadn 7, TP. H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.0 Stars | H\u01b0ng V\u01b0\u1ee3ng Park is a vibrant green corner in the H\u01b0ng V\u01b0\u1ee3ng Koreatown area of Ph\u00fa M\u1ef9 H\u01b0ng. Flanked by Korean restaurants, bakeries, and specialty cafes, the park itself offers a refreshing green sanctuary. Equipped with basic exercise equipment and a kids\u0027 play area, it is a favorite spot for locals and international visitors to stroll and chat after enjoying delicious Korean food, offering a unique glimpse into the blend of Southeast Asian and Korean culture.", "name": "Hung Vuong Park (C\u00f4ng vi\u00ean H\u01b0ng V\u01b0\u1ee3ng)", "transport": "Take a Grab to \u0027Khu H\u01b0ng V\u01b0\u1ee3ng 1/2/3, Qu\u1eadn 7\u0027 and walk straight into the central community park."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "C\u1ea7u \u00c1nh Sao, T\u00e2n Ph\u00fa, District 7, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Starlight Bridge over Crescent Lake is one of the most romantic and iconic landmarks in Phu My Hung, connecting the parks on both banks. As night falls, the bridge surface and the fountains on both sides light up with colorful LED lights, resembling a glowing waterfall against the night sky and creating a romantic, futuristic starry visual effect. It is a favorite spot for local couples, night photography enthusiasts, and influencers. Strolling across the bridge allows you to feel the cool breeze and mesmerizing neon glow, making it a romantic nightlife attraction in District 7 that you shouldn\u0027t miss.", "name": "Starlight Bridge (C\u1ea7u \u00c1nh Sao)", "transport": "It is recommended to take a Grab or taxi to Crescent Mall, then walk along the waterfront for about 3 minutes."}, {"address": "Phu My Hung Midtown, Street 16, T\u00e2n Ph\u00fa, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Located along the river in the upscale Phu My Hung Midtown residential area, this is Vietnam\u0027s first landscape park themed around Japanese cherry blossoms. The park is planted with Singapore sakura trees along the riverbank, blooming into a vibrant sea of pink during the flowering season. Designed with a blend of Japanese Zen gardens and modern waterfront promenades, it features elegant winding paths, fountain pools, and a unique children\u0027s play area. Whether you visit for an early morning jog or an afternoon photoshoot to capture trendy Japanese aesthetic photos, it is an extremely popular check-in location.", "name": "Midtown Sakura Park (C\u00f4ng vi\u00ean Sakura)", "transport": "About a 20 to 25-minute Grab ride from the center of District 1, Ho Chi Minh City."}, {"address": "T\u00f4n D\u1eadt Ti\u00ean, T\u00e2n Ph\u00fa, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Built along the expansive Crescent Lake, The Crescent Park features a lush marble promenade flanked by tall, towering palm trees. The air here is fresh and the streets are pristine, exuding the relaxed, sophisticated charm of a European-style luxury district. Lined with exquisite cafes and specialty restaurants, many photo lovers enjoy sitting outdoors in the afternoon sunshine, or using the crescent-shaped lake and modern architecture as a backdrop for city aesthetic photos. It is the best place to experience the modern, refined lifestyle of Ho Chi Minh City.", "name": "The Crescent Park (C\u00f4ng vi\u00ean H\u1ed3 B\u00e1n Nguy\u1ec7t)", "transport": "Take bus 139 or 34 to Crescent Mall station and walk to the waterfront park."}, {"address": "02-06 Phan V\u0103n Ch\u01b0\u01a1ng, T\u00e2n Ph\u00fa, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Nestled along the shores of Crescent Lake, this castle-style estate was formerly the famous white castle Tajmasago inspired by the Taj Mahal, now transformed into the tasteful Chloe Gallery resort venue. The architecture seamlessly blends Mughal-Arabic style with contemporary European aesthetics, featuring grand white walls, intricately carved arches, luxurious fountain courtyards, and a serene infinity pool. Many influencers and fashion magazines favor this location for high-end fashion shoots or elegant afternoon teas, showcasing an unparalleled sense of luxury.", "name": "Chloe Gallery (Tajmasago Castle)", "transport": "Take a Grab or taxi to the end of Phan V\u0103n Ch\u01b0\u01a1ng Street, located right behind Crescent Park."}, {"address": "101 T\u00f4n D\u1eadt Ti\u00ean, T\u00e2n Ph\u00fa, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Crescent Mall is an iconic international high-end shopping center in Phu My Hung, featuring a sleek, modern curved exterior that harmonizes with its elegant waterfront plaza. The spacious outdoor plaza in front of the mall frequently hosts seasonal art installations, holiday light displays, and fashion markets\u2014such as large-scale themed decorations during Christmas and Lunar New Year\u2014attracting countless visitors for photos. The surrounding clean, wide streets and minimalist storefronts of international brands are also ideal for modern urban street-style photography.", "name": "Crescent Mall \u0026 Plaza", "transport": "Buses 34, 102, and 139 stop directly nearby, or take a 20-minute Grab ride from the city center."}, {"address": "Nguy\u1ec5n V\u0103n Linh, T\u00e2n Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Built to commemorate Mr. Lawrence S. Ting, a Taiwanese entrepreneur who made significant contributions to the development of Phu My Hung, this park is a hidden green oasis nestled within the bustling district. At its center lies a picturesque lake with small bridges, flowing water, and lush tropical flora, brimming with tranquil Oriental garden aesthetics. Lacking excessive commercial noise, it offers a peaceful atmosphere, making it a secret photo gem for lovers of nature, vintage vibe photography, and fresh aesthetic portraits.", "name": "Lawrence S. Ting Park (C\u00f4ng vi\u00ean \u0110inh Thi\u1ec7n L\u00fd)", "transport": "Located on main boulevard Nguy\u1ec5n V\u0103n Linh; search for \u0027Lawrence S. Ting Park\u0027 on Grab for direct navigation."}, {"address": "02 Street No. 9, Him Lam Urban Area, T\u00e2n H\u01b0ng, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Spanning over 4,000 square meters, Artinus is Ho Chi Minh City\u0027s largest 3D trick art museum, featuring hundreds of lifelike 3D murals created by a professional team of Korean artists. The museum is divided into several themed zones, including Ocean World, Fantasy Forest, World Masterpieces, Vietnamese Culture, and Giant\u0027s House. Visitors can step right into the artwork and pose creatively to capture striking optical illusion photos. It is an extremely popular indoor spot for fun moments with friends and family and eye-catching social media stories.", "name": "Artinus 3D Art Museum", "transport": "About a 10-minute Grab ride from central Phu My Hung, located next to Him Lam Community Park."}, {"address": "C\u1ea7u Ph\u00fa M\u1ef9, T\u00e2n Thu\u1eadn \u0110\u00f4ng, District 7, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Ph\u00fa M\u1ef9 Bridge is the most spectacular cable-stayed bridge spanning the Saigon River in Ho Chi Minh City, connecting District 7 and District 2. Its towering twin towers and crisscrossing steel cables display a bold, modern geometric aesthetic. The most famous photography angle is during sunset, when the golden light bathes the Saigon River and sky, creating a magnificent silhouette of the bridge. At night, long-exposure shots capture light trails from passing traffic alongside the massive structure, making it a prime location for photography enthusiasts to shoot cool industrial and dramatic sunset shots.", "name": "Ph\u00fa M\u1ef9 Bridge Viewpoint (C\u1ea7u Ph\u00fa M\u1ef9)", "transport": "It is recommended to take a Grab to the viewing walkway or riverside high ground near the District 7 bridgehead for the best angle."}], "name": "Popular Photo Spots"}}, "name": "District 7 - Phu My Hung Modern International and High-End Residential Area"}};
        const cityName = "Ho Chi Minh";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
