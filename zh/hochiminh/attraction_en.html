en-air viewing terrace, it offers panoramic views without needing an expensive observation deck ticket. Simply order a craft cocktail or afternoon tea to soak in the luxurious sky-high vistas during sunset or twilight and capture effortlessly glamorous photos.", "name": "Blank Lounge Landmark 81", "transport": "Enter through the Vinpearl Luxury hotel lobby inside Vincom Center Landmark 81, and take the express elevator straight to the 75th floor."}, {"address": "48/10 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Hidden like a peaceful oasis amidst the bustling cityscape of B\u00ecnh Th\u1ea1nh District, this tourist village is just a few minutes\u0027 drive from Landmark 81. Preserving authentic traditional Vietnamese countryside scenery, it features lush coconut groves, thatched pavilions, rustic wooden bridges, and lotus ponds. Stepping here feels like transporting to the Mekong Delta, making it a fantastic photo spot for traditional style or indie portraits.", "name": "V\u0103n Th\u00e1nh Tourist Village", "transport": "Take a Grab or taxi along the main \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 thoroughfare, then turn into Alley 48/10 to reach the village entrance."}, {"address": "Ph\u1ea1m Vi\u1ebft Ch\u00e1nh, Ward 19, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Known as the \u0027Little Tokyo\u0027 of B\u00ecnh Th\u1ea1nh District, this neighborhood is packed with unique Japanese izakayas, independent cafes, craft beer bars, and stylish boutiques. At night, glowing red lanterns light up the streets, creating a retro Japanese and atmospheric alleyway vibe that attracts trendy locals and international travelers for dining and street photography.", "name": "Ph\u1ea1m Vi\u1ebft Ch\u00e1nh Japanese Hipster Quarter", "transport": "Located just across the bridge from District 1, take a Grab to the entrance of Ph\u1ea1m Vi\u1ebft Ch\u00e1nh Street and explore the surrounding alleys on foot."}, {"address": "B\u00ecnh Qu\u1edbi, Ward 28, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Thanh \u0110a Island is a unique peninsula encircled by the Saigon River, offering a rare slow-paced and rustic escape within Ho Chi Minh City. Lined with vintage riverside cafes, it commands magnificent views of the Landmark 81 skyline across the water. Sunset here is especially poetic and nostalgic, making it a favorite secret spot for local photography enthusiasts.", "name": "Thanh \u0110a Island Riverside Park", "transport": "Take a Grab across the bridge onto the island, and follow B\u00ecnh Qu\u1edbi Street to access riverside restaurants and green spaces."}, {"address": "561A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 25, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A modern commercial complex located on the major \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 thoroughfare in B\u00ecnh Th\u1ea1nh. It boasts a grand, sleek modern exterior and a naturally lit high-ceiling atrium. Inside, you\u0027ll find popular dining brands, a boutique cinema, and fashion stores. The large plaza outside frequently hosts festive installations (like Christmas displays), making it a popular seasonal photo spot.", "name": "Pearl Plaza Shopping Center", "transport": "Take a Grab or a bus (such as routes 06 or 150) and get off at the Pearl Plaza stop, which drops you off directly at the main entrance."}, {"address": "C\u1ea7u S\u00e0i G\u00f2n, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Situated along the riverbanks near Saigon Bridge\u2014which connects B\u00ecnh Th\u1ea1nh District with District 2 (Th\u1ee7 \u0110\u1ee9c City)\u2014this area is one of the best vantage points to admire and photograph Ho Chi Minh City\u0027s modern skyline. In the evening, tourists and photographers gather at the bridge park or nearby waterfront restaurants to capture glittering traffic streams against the backdrop of Landmark 81, experiencing Saigon\u0027s vibrant yet romantic nightlife.", "name": "Saigon Bridge Riverside Viewpoint (C\u1ea7u S\u00e0i G\u00f2n)", "transport": "Take a Grab to the park under the bridge or the riverside road on the B\u00ecnh Th\u1ea1nh side of Saigon Bridge, then walk to the best viewing spots."}], "name": "Top Photo Spots"}}, "name": "B\u00ecnh Th\u1ea1nh District - Landmark 81 and Riverside Commercial Area"}, "cuchi_suburbs": {"categories": {"cat_1": {"items": [{"address": "TL15, Ph\u00fa Hi\u1ec7p, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.6 stars | The Ben Duoc section is the most authentic and best-preserved part of the Cu Chi Tunnels network, relatively untouched by commercialization. It showcases the ingenious underground survival strategies of North Vietnamese guerrillas during the Vietnam War. Spanning over 200 kilometers across three underground levels, the complex includes command centers, meeting rooms, hospitals, kitchens, and living quarters. Accompanied by professional guides, visitors can descend into real tunnels to experience the narrow, dark conditions, and admire the clever smokeless design of the \u0027Hoang Ngoc Stove\u0027. It is an essential landmark for understanding Vietnam War history.", "name": "Cu Chi Tunnels - Ben Duoc Section / \u0110\u1ecba \u0111\u1ea1o B\u1ebfn D\u01b0\u1ee3c", "transport": "Take Bus No. 79 directly from Ho Chi Minh City center, or book a day tour with hotel pick-up or private charter service."}, {"address": "Nhu\u1eadn \u0110\u1ee9c, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 stars | Located closer to downtown Ho Chi Minh City, the Ben Dinh section is the most popular choice for day tour groups. The tunnels here have been slightly widened to accommodate international visitors, while still preserving their original underground tactical stronghold structure. The park features displays of ingenious traps made from scrap metal and bamboo, booby trap pits, and the wreckage of a destroyed American M41 tank. Additionally, there is a live-fire shooting range where visitors can experience firing an AK-47 or M16 rifle for an adrenaline-pumping battlefield atmosphere.", "name": "Cu Chi Tunnels - Ben Dinh Section / \u0110\u1ecba \u0111\u1ea1o B\u1ebfn \u0110\u00ecnh", "transport": "Recommended to take a dedicated day tour bus from District 1, Ho Chi Minh City; travel time is around 1.5 to 2 hours."}, {"address": "TL15, Ph\u00fa Hi\u1ec7p, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.7 stars | Located within the Ben Duoc Tunnels complex, this grand traditional Vietnamese temple was built to commemorate over 44,000 martyrs who sacrificed their lives in the Cu Chi and Saigon-Gia Dinh regions during the Anti-French and Vietnam Wars. The temple architecture blends traditional Vietnamese halls with modern relief carving craftsmanship, featuring a central 9-story landscape tower offering panoramic views of the Cu Chi forest and Saigon River. The inner walls are inscribed with the names of the fallen, creating a solemn atmosphere that reflects the heavy history and national spirit of the land.", "name": "Ben Duoc Memorial Temple / \u0110\u1ec1n T\u01b0\u1edfng Ni\u1ec7m Li\u1ec7t S\u0129 B\u1ebfn D\u01b0\u1ee3c", "transport": "Located inside the Ben Duoc Tunnels site, easily accessible on foot from the tunnel entrance."}, {"address": "Ph\u00fa Hi\u1ec7p, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 stars | A large-scale outdoor historical and cultural recreation area that faithfully reconstructs rural life and wartime scenes of the Cu Chi Liberation Zone between 1961 and 1972. Divided into several thematic eras, the park features full-scale replicas of bamboo houses, underground thatched huts, schools, weaving workshops, handmade munition factories, and swamp guerrilla battlefields. Through lifelike mannequins and historical scenes, visitors gain an educational look into how Vietnamese peasants farmed while fighting against great powers during the war.", "name": "Cu Chi Reconstructed Liberation Zone / Khu T\u00e1i Hi\u1ec7n V\u00f9ng Gi\u1ea3i Ph\u00f3ng C\u1ee7 Chi", "transport": "Connected to the Ben Duoc Section; accessible on foot or by electric buggy with a combo ticket."}, {"address": "Ph\u1ea1m H\u00f9ng, Long Th\u00e0nh B\u1eafc, H\u00f2a Th\u00e0nh, T\u00e2y Ninh, Vietnam", "feature": "\u2b50 4.6 stars | Often paired with the Cu Chi Tunnels for popular day tours, this is the headquarters of Caodaism, located in Tay Ninh Province northwest of Cu Chi. Caodaism is a unique syncretic religion originating in Vietnam, integrating teachings from Buddhism, Taoism, Confucianism, Christianity, and Islam. Built between 1933 and 1955, the architecture features a vibrant blend of Gothic steeples, traditional Chinese palace design, and mosque domes. The giant \u0027Divine Eye\u0027 mural inside the main hall and colorful dragon-wrapped columns are breathtaking, with visitors welcome to observe solemn group prayer ceremonies held daily at noon.", "name": "Cao Dai Holy See / T\u00f2a Th\u00e1nh T\u00e2y Ninh", "transport": "About a 1-hour drive from Cu Chi Tunnels; usually visited via a booked \u0027Cu Chi Tunnels + Cao Dai Temple\u0027 day tour or private charter."}, {"address": "Th\u1ea1nh T\u00e2n, T\u00e2y Ninh, Vietnam", "feature": "\u2b50 4.7 stars | As the highest peak in Southern Vietnam, Ba Den Mountain has long been a mystical religious sanctuary and strategic military stronghold. The mountain features ancient 18th-century temples like \u0027Chua Ba\u0027 alongside modern landmarks such as Asia\u0027s largest bronze statue of the Goddess of Mercy. During the Vietnam War, it served as a heavily contested high point between US and North Vietnamese forces, with wartime bunkers and military observation posts still preserved on the slopes. Visitors can ride a modern cable car to the summit to enjoy sweeping plain views and explore historical ruins.", "name": "Ba Den Mountain Complex / Khu Relic N\u00fai B\u00e0 \u0110en", "transport": "About a 1.5-hour drive from the Cu Chi Tunnels; best visited as part of a day trip combining Cu Chi and Tay Ninh."}, {"address": "B\u00e0 \u0110i\u1ec3m, H\u00f3c M\u00f4n, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 stars | Located in Hoc Mon District between Cu Chi and downtown Saigon, this site is one of the important birthplaces of modern anti-French revolutionary movements in Vietnam. Renowned in the 18th century for its vast betel leaf and pepper plantations, it earned the name \u002718 Betel Garden Villages\u0027. During the anti-French and Vietnam Wars, dense betel groves and secret underground bases served as crucial cover for resistance forces, housing early secret headquarters for Communist Party leaders. Today, the historical site features monuments and exhibition halls preserving underground shelters and ancient traditional residences.", "name": "Hoc Mon 18 Betel Garden Villages / Khu Di T\u00edch 18 Th\u00f4n V\u01b0\u1eddn Tr\u1ea7u", "transport": "Located near Highway 22; can be visited en route from downtown HCMC to Cu Chi Tunnels via taxi or private charter."}, {"address": "Xu\u00e2n Th\u1edbi Th\u01b0\u1ee3ng, H\u00f3c M\u00f4n, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 stars | Located in Hoc Mon District, the Nga Ba Giong Historical Site commemorates the countless Vietnamese revolutionaries and leaders executed by the French colonial government during the 1940 Nam Ky Uprising. Spanning a vast area, the site features a magnificent traditional shrine, an exhibition hall displaying wartime artifacts and photos, and a memorial stone park symbolizing indomitable spirit. With its lush greenery and serene environment, it is a key landmark for exploring modern Vietnamese independence history.", "name": "Nga Ba Giong Memorial Area / Khu Di T\u00edch L\u1ecbch S\u1eed Ng\u00e3 Ba Gi\u1ed3ng", "transport": "About 20 km from downtown Ho Chi Minh City on the route to Cu Chi; recommended to visit via private charter or Bus No. 13 transferred to a taxi."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "TL15, Ph\u00fa M\u1ef9 H\u01b0ng, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.7 stars | Located inside the B\u1ebfn D\u01b0\u1ee3c section of the C\u1ee7 Chi Tunnels complex, the B\u1ebfn D\u01b0\u1ee3c Memorial Temple honors tens of thousands of martyrs who sacrificed their lives in the iron land of C\u1ee7 Chi during the Vietnam War. Combining museum and memorial functions, this grand traditional Vietnamese-style complex features a towering, solemn main hall with walls inscribed with over 44,000 martyrs\u0027 names. Surrounded by lush eco-gardens and lotus ponds, visitors can feel a profound historical reverence and gain deep insight into the struggle of the C\u1ee7 Chi people through artifacts, dioramas, and historic photos\u2014a must-visit cultural landmark blending history and nature.", "name": "Cu Chi Tunnels B\u1ebfn D\u01b0\u1ee3c Memorial Temple (\u0110\u1ec1n B\u1ebfn D\u01b0\u1ee3c)", "transport": "Recommended to hire a private car or taxi from central Ho Chi Minh City, or take Bus No. 79 from An S\u01b0\u01a1ng Bus Station directly to the B\u1ebfn D\u01b0\u1ee3c Tunnels complex."}, {"address": "746 TL15, Ph\u00fa Hi\u1ec7p, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 stars | The B\u1ebfn \u0110\u00ecnh Tunnels Museum is one of the most popular historical display areas for foreign tourists visiting the C\u1ee7 Chi Tunnels. The museum preserves a wealth of real Vietnam War artifacts, including improvised weapons used by tunnel troops, booby trap replicas, communication gear, and heavy military equipment like U.S. M41 tanks and B-52 bomb craters. Offering rich video guides and English-speaking tour guides, it seamlessly blends traditional museum exhibits with real underground battlefield ruins, allowing visitors to deeply experience the harsh living conditions and unique warfare ingenuity of the era.", "name": "Cu Chi Tunnels B\u1ebfn \u0110\u00ecnh Museum (\u0110\u1ecba \u0110\u1ea1o B\u1ebfn \u0110\u00ecnh)", "transport": "Take Bus No. 13 from the city center to C\u1ee7 Chi Bus Station, then transfer to Bus No. 79, or join a day tour/charter directly."}, {"address": "288 TL8, TT. C\u1ee7 Chi, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.2 stars | The C\u1ee7 Chi District Traditional House is an important window into local history and traditional folk culture. The hall houses a rich collection of local relics, farming tools, traditional rice noodle and handcrafted rice paper making equipment, as well as historical documents and photos from the revolutionary war. The well-organized exhibits detail C\u1ee7 Chi\u0027s transformation from an ordinary rural village into the famous \u0027Iron Land\u0027. It is a quiet, informative stop for travelers seeking in-depth cultural exploration and a broader socio-historical context beyond the tunnels.", "name": "C\u1ee7 Chi District Traditional House (Nh\u00e0 Truy\u1ec1n Th\u1ed1ng Huy\u1ec7n C\u1ee7 Chi)", "transport": "Take Bus No. 13 to C\u1ee7 Chi Bus Station and walk for about 5 minutes, or travel by scooter."}, {"address": "58 TL8, TT. C\u1ee7 Chi, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 stars | Located in the center of C\u1ee7 Chi Town, C\u1ee7 Chi Parish Church serves as the spiritual hub for local Catholics. Its architecture elegantly blends Gothic and modern elements, featuring a soaring bell tower and beautiful stained-glass windows that exude serenity in the sunlight. Surrounded by spacious gardens and a Marian grotto landscape, the environment is peaceful. Besides hosting masses and religious events, its striking architectural beauty invites passing travelers to stop for photos and experience the unique blend of traditional and contemporary local faith.", "name": "C\u1ee7 Chi Parish Church (Gi\u00e1o x\u1ee9 C\u1ee7 Chi)", "transport": "Located on TL8, the main road of C\u1ee7 Chi Town. Take Bus No. 13, get off at C\u1ee7 Chi Town, and walk to the church."}, {"address": "TL8, T\u00e2n Th\u1ea1nh T\u00e2y, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 stars | Situated near the T\u00e2n Quy Intersection in C\u1ee7 Chi District, T\u00e2n Quy Parish Church is rich in suburban charm and history. It features a soaring spired bell tower and a grand nave, with refined interior details where wooden structures and elegant light fixtures create a peaceful, solemn atmosphere. The lush parish grounds are filled with tropical plants and flowers. During weekend masses or major celebrations like Christmas, the church is dazzlingly decorated and gathers many local worshippers, making it a great spot to experience suburban Catholic culture and community spirit.", "name": "T\u00e2n Quy Parish Church (Gi\u00e1o x\u1ee9 T\u00e2n Quy)", "transport": "Take Bus No. 84 or 126, get off at T\u00e2n Quy Intersection stop, and walk to the church."}, {"address": "Nguy\u1ec5n Th\u1ecb R\u1ea3o, Ph\u00fa H\u00f2a \u0110\u00f4ng, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.6 stars | Tucked away in Ph\u00fa H\u00f2a \u0110\u00f4ng Commune\u2014famous for traditional handmade rice paper\u2014this historic rural church boasts strong local charm. The architecture blends classical European church lines with Southern Vietnamese vernacular style, featuring elegant light-colored exterior walls contrasting with lush greenery. Far from urban hustle, it offers a serene ambiance. Travelers planning an eco and craft-village day trip in C\u1ee7 Chi often include this tranquil spot to experience how Western faith seamlessly blends with local rural life.", "name": "Ph\u00fa H\u00f2a \u0110\u00f4ng Parish Church (Gi\u00e1o x\u1ee9 Ph\u00fa H\u00f2a \u0110\u00f4ng)", "transport": "Recommended to go by scooter or hired car; turn onto Nguy\u1ec5n Th\u1ecb R\u1ea3o Road from TL15 to arrive."}, {"address": "1 L\u00fd Th\u01b0\u1eddng Ki\u1ec7t, TT. H\u00f3c M\u00f4n, H\u00f3c M\u00f4n, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.1 stars | Located in H\u00f3c M\u00f4n District on the way to C\u1ee7 Chi, this museum bridges the historical narrative between urban Ho Chi Minh City and rural C\u1ee7 Chi. It displays documents, relics, and photos related to the famous \u002718 Betel Nut Villages\u0027 Uprising and anti-French/anti-American resistance, detailing peasant movements and modern local history. The traditional Vietnamese-style building features old farm tools and historical monuments in its courtyard, making it an educational stop for history enthusiasts interested in Vietnam\u0027s modern development.", "name": "H\u00f3c M\u00f4n Traditional Museum (Nh\u00e0 Truy\u1ec1n Th\u1ed1ng Huy\u1ec7n H\u00f3c M\u00f4n)", "transport": "Take Bus No. 24 to H\u00f3c M\u00f4n Town, or add it as an en-route stop on a chartered trip to the C\u1ee7 Chi Tunnels."}, {"address": "V\u00f5 V\u0103n B\u00edch, B\u00ecnh M\u1ef9, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 stars | Nestled in the Saigon River ecological belt near the B\u00ecnh D\u01b0\u01a1ng border in C\u1ee7 Chi, B\u00ecnh M\u1ef9 Parish Church is a small, charming suburban Catholic church. Featuring bright exterior colors, a lifelike Virgin Mary statue in the courtyard, and manicured garden landscaping, it is surrounded by sprawling farmlands and orchards, offering an idyllic pastoral vibe. Peaceful and quiet on weekdays, it is a favorite rest stop for cyclists and eco-tourists exploring C\u1ee7 Chi, showcasing pure rural landscapes and religious tranquility.", "name": "B\u00ecnh M\u1ef9 Parish Church (Gi\u00e1o x\u1ee9 B\u00ecnh M\u1ef9)", "transport": "Recommended to travel by scooter or car along V\u00f5 V\u0103n B\u00edch Road."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "225 744, Ph\u00fa An, B\u1ebfn C\u00e1t, B\u00ecnh D\u01b0\u01a1ng, Vietnam", "feature": "\u2b50 4.3 stars | Phu An Bamboo Village is the largest bamboo botanical garden and eco-reserve in Southeast Asia. Spanning tens of hectares, it boasts a collection of over 300 bamboo species. Strolling along the lush green forest paths beneath a canopy of leaves, gentle breezes carry the refreshing aroma of bamboo, instantly making you forget the hustle and bustle of the city. The park also features an eco-museum detailing the vital role of bamboo in traditional Vietnamese life and ecosystems, making it a wonderful suburban retreat combining natural beauty, ecological education, and great photo ops.", "name": "Phu An Bamboo Village (L\u00e0ng Tre Ph\u00fa An)", "transport": "It is recommended to hire a private car or rent a scooter from Ho Chi Minh City center or the Cu Chi Tunnels; the drive takes about 1.5 hours."}, {"address": "\u1ea4p Ng\u00e3 T\u01b0, Nhu\u1eadn \u0110\u1ee9c, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.1 stars | Known as the \u0027Highland Tribe of Saigon Suburbs,\u0027 Fosaco Eco Village in Cu Chi boasts lush native vegetation, sparkling lakes, and scenic hills. Centered around traditional ethnic minority architecture and natural forest landscapes, the village features verdant trees and winding ponds with a pristine, wild ambiance. Visitors can stroll along forest trails, admire stilt houses and bamboo landscaping, try making traditional Khmer sticky rice in bamboo tubes, and watch craft demonstrations\u2014a hidden green oasis for exploring Cu Chi\u0027s nature and indigenous cultures.", "name": "Fosaco Eco Village (L\u00e0ng Sinh Th\u00e1i Fosaco)", "transport": "Located about a 10-minute drive from the main Cu Chi Tunnels attraction, it\u0027s best reached by taxi or as a stop on a private day tour."}, {"address": "\u1ea4p 2, An Nh\u01a1n T\u00e2y, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.2 stars | Green Noen Eco Farm is the largest green organic eco-farm in Cu Chi, featuring vast green pastures, greenhouse organic fruit and vegetable gardens, a deer park, and a dairy farm. Surrounded by pristine, unpolluted countryside, visitors can hand-pick fresh figs, mushrooms, and veggies, or enjoy feeding deer and milking cows. With ample tree shade, fresh air, and idyllic rural views, it is an ideal spot for families and nature lovers to enjoy a relaxing day out.", "name": "Green Noen Eco Farm (N\u00f4ng Trang Xanh C\u1ee7 Chi)", "transport": "Take Bus #79 from Ho Chi Minh City to get nearby, or hire a private car for a direct 1.5-hour drive."}, {"address": "\u1ea4p B\u1ebfn \u0110\u00ecnh, An Nh\u01a1n T\u00e2y, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | Spanning over 22 hectares along the Saigon River, M\u1ed9t Tho\u00e1ng Vi\u1ec7t Nam Eco Village is surrounded by dense tropical foliage and natural waterways. The park beautifully blends Vietnam\u0027s diverse natural landscapes and gardens, featuring man-made lakes, bamboo trails, herbal gardens, and exquisite craft villages. Visitors can stroll through lush greenery, listen to chirping birds and flowing water, and watch live demonstrations of traditional silk weaving and pottery, experiencing the harmonious blend of Vietnam\u0027s nature and heritage.", "name": "M\u1ed9t Tho\u00e1ng Vi\u1ec7t Nam Eco Village (Khu Du L\u1ecbch Sinh Th\u00e1i M\u1ed9t Tho\u00e1ng Vi\u1ec7t Nam)", "transport": "A 15-minute taxi ride from the Cu Chi Tunnels (B\u1ebfn D\u01b0\u1ee3c section) is recommended."}, {"address": "S\u00e0i G\u00f2n River, Trung An, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.0 stars | Trung An Fruit Orchards is a famous orchard hub in Cu Chi, stretching along the riverbanks with vast groves of tropical fruit trees. During the summer harvest, trees overflow with rambutans, mangosteens, durians, and wax apples. Guests can leisurely stroll beneath shady fruit trees, lounge on hammocks, and pick and savor the freshest fruits right off the branch. Rich in Southern Vietnamese countryside charm, it\u0027s a popular spot for experiencing Cu Chi\u0027s rural agricultural scene.", "name": "Trung An Fruit Orchards (V\u01b0\u1eddn Tr\u00e1i C\u00e2y Trung An)", "transport": "About a 1 hour 20 minute drive or motorbike ride from Ho Chi Minh City along Route TL8."}, {"address": "1147 B\u00ecnh Qu\u1edbi, Ward 28, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | Located on the Thanh \u0110a Peninsula, B\u00ecnh Qu\u1edbi Tourist Village is one of Ho Chi Minh City\u0027s most famous suburban waterfront eco-parks. Designed as a miniature replica of the Mekong Delta landscape, it features swaying coconut palms, sprawling green lawns, lotus ponds, and rustic thatched cottages. Strolling across wooden bridges and along scenic waterside paths offers a peaceful taste of riverland beauty. It is also an ideal spot for nature photography and outdoor picnics.", "name": "B\u00ecnh Qu\u1edbi Tourist Village (L\u00e0ng Du L\u1ecbch B\u00ecnh Qu\u1edbi 1)", "transport": "Take a Grab taxi from District 1 in the city center; it takes about 25 to 30 minutes direct."}, {"address": "\u1ea4p Ch\u1ed1, An Nh\u01a1n T\u00e2y, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | Tucked away in the dense woods of Cu Chi, this wildlife rescue station is operated by a Vietnamese conservation organization. Dedicated to rescuing and rehabilitating endangered animals like bears, pangolins, gibbons, and rare birds, it provides a natural sanctuary for wildlife. Walking through the lush jungle surroundings offers educational insights into native Vietnamese fauna and highlights the importance of rainforest conservation\u2014a meaningful and educational eco-gem.", "name": "Cu Chi Wildlife Rescue Station (Tr\u1ea1m C\u1ee9u H\u1ed9 \u0110\u1ed9ng V\u1eadt Hoang D\u00e3 C\u1ee7 Chi)", "transport": "Located in An Nh\u01a1n T\u00e2y Commune, about a 10-minute drive from the B\u1ebfn D\u01b0\u1ee3c section of the Cu Chi Tunnels. Recommended as a stop on a hired car tour."}, {"address": "\u1ea4p 4, B\u00ecnh M\u1ef9, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 3.9 stars | Situated in B\u00ecnh M\u1ef9 Commune, Cu Chi, right along the Saigon River, this eco-tourism area focuses on serene natural landscapes and waterfront relaxation. With crisscrossing waterways, leafy shade trees, riverside walkways, fishing ponds, and fruit orchards, guests can rent small boats to paddle along clear streams or lounge on riverside hammocks. It offers a wonderfully refreshing slice of rural Southern Vietnam, perfect for a peaceful day trip.", "name": "B\u00ecnh M\u1ef9 Eco Tourism Area (Khu Du L\u1ecbch Sinh Th\u00e1i B\u00ecnh M\u1ef9)", "transport": "About a 50-minute drive from downtown Ho Chi Minh City via H\u00e0 Duy Phi\u00ean Road."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Ph\u00fa Hi\u1ec7p, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.6 stars | The Ben Duoc section is the most historically authentic and extensive part of the Cu Chi Tunnels network. Although further from the city center, it preserves the most genuine underground defense system and tactical trenches. Visitors can crawl through narrow underground passages to experience the tough guerilla life during the Vietnam War, visit underground hospitals, command posts, and booby-trap displays. Surrounded by lush greenery, the park maintains a solemn yet deeply educational atmosphere, making it a must-visit spot for photography and gaining deep insights into modern Vietnamese history.", "name": "Cu Chi Tunnels - Ben Duoc", "transport": "It is recommended to hire a private car, join a day tour, or take Bus No. 13 from the city center to C\u1ee7 Chi station, then transfer to Bus No. 79."}, {"address": "TL15, Ph\u00fa M\u1ef9 H\u01b0ng, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | Located closer to downtown Ho Chi Minh City, the Ben Dinh section is the top choice for most international day tours. It features well-equipped visitor facilities and highly authentic tunnel experience zones where you can navigate narrow passages to feel the thrill of wartime cover and ambush tactics. The site also exhibits tank wreckage, B-52 bomb craters, and terrifying bamboo-stake traps, making it a powerful backdrop for dramatic historical photos.", "name": "Cu Chi Tunnels - Ben Dinh", "transport": "It is recommended to book a day-tour shuttle from the city center, or rent a motorbike/charter a car via Provincial Route 15 (TL15)."}, {"address": "Ph\u00fa Hi\u1ec7p, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.7 stars | Located within the Ben Duoc Tunnels complex, this magnificent memorial temple was built to commemorate tens of thousands of martyrs who gave their lives during the anti-French and anti-American wars. Designed in traditional Vietnamese palace architecture with red-tiled eaves, it radiates solemn dignity. A multi-story observation tower at the center offers panoramic views of the Cu Chi forest and Saigon River from the top. The walls inside are inscribed with the names of fallen heroes, complemented by exquisite wood carvings and bronze murals that reflect immense artistic value and rich cultural history.", "name": "Ben Duoc Memorial Temple", "transport": "Located inside the Ben Duoc Tunnels complex; easily accessible on foot."}, {"address": "Ph\u00fa M\u1ef9 H\u01b0ng, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | Situated within the Cu Chi Tunnels area, the National Defense Sports Shooting Range offers one of the most thrilling experiences during your visit. Under the guidance of professional instructors, visitors can try live-fire shooting with iconic military rifles like the AK-47 and M16. The booming gunshots and genuine recoil deliver an intense sensation of realism, attracting countless thrill-seekers to snap photos and capture this unforgettable live-ammo moment.", "name": "Cu Chi Shooting Range", "transport": "Located within the Cu Chi Tunnels park; access the shooting range after purchasing experience tickets."}, {"address": "\u1ea4p Ng\u00e3 T\u01b0, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.1 stars | Known as the \u0027Central Highlands Bamboo Village\u0027 of suburban Saigon, Fosaco Eco Village is a unique eco-park celebrating Vietnamese ethnic minority culture. The park showcases numerous traditional stilt houses and tribal architecture built with bamboo and thatch, making visitors feel transported to a highland settlement. Featuring lakeside bamboo bridges, unique sculptures, and serene natural scenery, it has a relaxed, exotic vibe\u2014a secret haven for photography enthusiasts looking for vintage and nature-inspired shots.", "name": "Fosaco Eco Village", "transport": "Recommended to travel by chartered car or motorbike along Provincial Route 15 (TL15) from downtown Ho Chi Minh City; about a 10-minute drive from Cu Chi Tunnels."}, {"address": "Trung An, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.3 stars | Nestled along the banks of the Saigon River, Trung An Fruit Garden is a renowned green oasis in Cu Chi famous for tropical fruits like rambutan, mangosteen, durian, and longan. With lush shaded orchards and crisscrossing waterways, visitors can stroll through to pick fresh fruits or relax in riverside gazebos enjoying fresh juices and authentic rustic meals. Away from urban hustle, its rich countryside charm makes it a perfect getaway for taking memorable photos and unwinding.", "name": "Trung An Fruit Garden", "transport": "Recommended to travel by chartered car or motorbike; about 1.5 hours\u0027 drive from downtown Ho Chi Minh City."}, {"address": "721 Nguy\u1ec5n Th\u1ecb R\u00e0nh, An Nh\u01a1n T\u00e2y, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.3 stars | Green Noeen Eco Farm is a distinctive high-tech organic farm and eco-resort in Cu Chi, boasting expansive grounds and rich agricultural landscapes. The farm features organic vegetable greenhouses, mushroom cultivation zones, a dairy cattle farm, and European-style wooden cottages and gardens. Visitors can try hands-on milking, pick pesticide-free produce, and capture refreshing, scenic photos by lotus ponds and sprawling lawns\u2014ideal for family outings and photography.", "name": "Green Noeen Eco Farm", "transport": "Recommended to take a taxi or chartered car via Nguy\u1ec5n Th\u1ecb R\u00e0nh Street."}, {"address": "\u1ea4p 4, Ph\u01b0\u1edbc V\u0129nh An, C\u1ee7 Chi, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.0 stars | Cu Chi Water Park is a comprehensive leisure complex combining water rides with lush ecological scenery. The park features large swimming pools, high-altitude water slides, an artificial lake, and an island zoo inside the lake, all surrounded by abundant tropical flora. Its vibrant landscapes and refreshing water attractions draw crowds looking to splash around and take sunny summer photos, making it a popular hotspot for action and relaxation near Cu Chi.", "name": "Cu Chi Water Park", "transport": "Recommended to take a chartered car, or take city Bus No. 13 to Cu Chi town and transfer to a taxi."}], "name": "Popular Photo Spots"}}, "name": "Suburbs - Cu Chi Tunnels \u0026 Eco Day Tour Zone"}, "district_1_buivien": {"categories": {"cat_1": {"items": [{"address": "\u0110. L\u00ea L\u1ee3i, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.2 Stars | Ben Thanh Market is one of Ho Chi Minh City\u0027s most iconic historic landmarks, built in 1914 during the French colonial era. Its prominent four-faced clock tower has become a spiritual symbol of Saigon. Inside, hundreds of stalls sell traditional handicrafts, textiles, Vietnamese coffee, and local delicacies. Bustling with trade during the day, it showcases vibrant local life alongside French vaulted architecture, located just a few minutes\u0027 walk from the Pham Ngu Lao backpacker area.", "name": "Ben Thanh Market", "transport": "About an 8\u201310 minute walk from Pham Ngu Lao Street."}, {"address": "97A \u0110. Ph\u00f3 \u0110\u1ee9c Ch\u00ednh, Ph\u01b0\u1eddng Nguy\u1ec5n Th\u00e1i B\u00ecnh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 Stars | Situated on the edge of the Pham Ngu Lao area, the Ho Chi Minh City Museum of Fine Arts was originally the opulent mansion of the wealthy Chinese merchant Hui Bon Hoa and his family in the early 20th century. The building seamlessly blends French Neoclassical architecture with traditional Chinese decorative elements, featuring striking yellow exterior walls, ornate stained-glass windows, a classic wrought-iron elevator, and a courtyard garden. Housing a rich collection of modern art and historical artifacts, the building itself is a visual feast that photography enthusiasts and history buffs shouldn\u0027t miss.", "name": "Ho Chi Minh City Museum of Fine Arts", "transport": "About a 7-minute walk from Pham Ngu Lao Street."}, {"address": "45 \u0110. Tr\u01b0\u01a1ng \u0110\u1ecbnh, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 Stars | Built in the late 19th century by Tamil merchants from Southern India who settled in Saigon, the Mariamman Hindu Temple is dedicated to Mariamman, the goddess of rain and fertility. The temple features a breathtaking gopuram (tower gateway) adorned with colorful, vivid statues of Hindu deities. Inside, hand-painted tiles and stone pillars showcase rich Indian religious artistic styles, continuing to attract devout worshippers and curious tourists alike.", "name": "Mariamman Hindu Temple", "transport": "About an 8-minute walk from Pham Ngu Lao Street."}, {"address": "\u0110. Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.1 Stars | Located right next to Pham Ngu Lao and Bui Vien streets, 23 September Park was historically the site of the main Saigon Railway Station during the French colonial period. Although the train station was later demolished and relocated to District 3, the park retains a deep historical footprint while serving as an urban oasis. Its name commemorates September 23, 1945, marking the start of the Vietnamese anti-colonial resistance against French rule. Today, it is a vibrant spot for backpackers and locals to relax, exercise, and enjoy cultural festivals.", "name": "23 September Park \u0026 Historic Railway Site", "transport": "Located directly opposite Pham Ngu Lao Street, a 1-minute walk."}, {"address": "135 \u0110. Nam K\u1ef3 Kh\u1edfi Ngh\u0129a, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 Stars | Formerly known as Norodom Palace during the French colonial era, the Reunification Palace was redesigned in the 1960s by renowned Vietnamese architect Ngo Viet Thu as the presidential residence of South Vietnam. The structure harmonizes Modernist design with Eastern philosophical Feng Shui principles, featuring over a hundred grand rooms with varied functions, an underground war bunker, and a rooftop helipad. In 1975, a North Vietnamese tank crashed through the gates, signaling the end of the Vietnam War\u2014making it a site of immense historical and architectural significance.", "name": "Reunification Palace", "transport": "About 5 minutes by taxi or a 15-minute walk from Pham Ngu Lao Street."}, {"address": "01 C\u00f4ng x\u00e3 Paris, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 Stars | Commonly known as the Red Church, the Saigon Notre-Dame Basilica was built between 1877 and 1880 as a masterpiece of French colonial Gothic architecture. All of its distinctive red bricks were imported directly from Marseille, France, maintaining their vibrant color even after more than a century. The facade features twin spires reaching 58 meters high, with a graceful statue of the Virgin Mary standing in the front square. As one of Ho Chi Minh City\u0027s most iconic landmarks, it showcases stunning classical European architectural craftsmanship.", "name": "Saigon Notre-Dame Basilica", "transport": "About 7 minutes by taxi from the Pham Ngu Lao area."}, {"address": "02 C\u00f4ng x\u00e3 Paris, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.6 Stars | Constructed in the late 19th century and designed by renowned French architects, the Saigon Central Post Office blends Gothic, Renaissance, and French Eclectic architectural styles. Inside, the grand vaulted metal roof structure evokes the charm of a classic European railway station. A large portrait of Ho Chi Minh hangs at the end of the hall alongside two hand-painted historical maps. The original wooden phone booths and intricate tiled floors remain remarkably well-preserved and fully operational today.", "name": "Saigon Central Post Office", "transport": "About 7 minutes by taxi from the Pham Ngu Lao area, located right next to the Notre-Dame Basilica."}, {"address": "\u0110. B\u00f9i Vi\u1ec7n, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.0 Stars | Beyond its reputation as a bustling nightlife hub, Bui Vien Street still preserves a treasure trove of early 20th-century French-style arcades and historic shophouses. Featuring narrow courtyard layouts, wrought-iron balcony railings, and classic louvered windows, these buildings bear witness to Saigon\u0027s evolution from a traditional commercial street to a global backpacker epicenter. As you stroll through the vibrant lights and music, look up to admire the timeless architectural details refined by decades of history.", "name": "Bui Vien Historic Shophouses", "transport": "Located in the heart of the Pham Ngu Lao commercial district, easily explored on foot."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "97A Pho Duc Chinh St, Nguyen Thai Binh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Housed in a stunning yellow French-colonial mansion that once belonged to the wealthy Chinese-Vietnamese merchant H\u1ee9a B\u00f4n H\u00f2a, this museum artfully blends European colonial architecture with subtle Oriental decorative details. Inside, you\u0027ll find an extensive collection of modern Vietnamese artwork, sculptures, lacquer paintings, and battlefield sketches from the Resistance War. The vintage iron spiral staircase, stained glass windows, and classic manual elevator make it an absolute favorite spot for hipsters and backpackers looking to capture film-style photos.", "name": "Ho Chi Minh City Museum of Fine Arts", "transport": "About a 10-minute walk from Pham Ngu Lao Street, or a 3-minute ride via Grab bike."}, {"address": "1 Ton That Tung St, Pham Ngu Lao Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Located in the heart of Pham Ngu Lao Ward, Huyen Sy Church is one of Saigon\u0027s oldest and most famous Gothic Catholic churches. Built in 1902 thanks to donations from Huyen Sy\u2014the wealthiest man in Cochinchina at the time and the grandfather of Vietnam\u0027s last empress, Nam Phuong\u2014it features a striking yellow granite exterior dominated by a 57-meter bell tower. The solemn, peaceful interior offers a serene retreat just a block away from the bustling nightlife of Bui Vien Walking Street, making it a hidden gem for backpackers seeking quiet reflection and timeless Gothic aesthetics.", "name": "Huyen Sy Church (Gi\u00e1o x\u1ee9 Huy\u1ec7n S\u1ef9)", "transport": "Located on the edge of the Pham Ngu Lao area, just a 3 to 5-minute walk from Bui Vien Walking Street."}, {"address": "45 Truong Dinh St, Ben Thanh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Built in the late 19th century, this vibrant Hindu temple is dedicated to Mariamman, the goddess of rain and health. Its most eye-catching feature is the towering Gopuram entrance gate, decorated with vivid, intricately detailed sculptures of Hindu deities. Intricate stone carvings imported from Tamil Nadu in Southern India line the inner walls, while the air carries a rich scent of incense, making it a popular spot for travelers looking to experience exotic religious traditions and snap unique cultural photos.", "name": "Mariamman Hindu Temple", "transport": "About an 8-minute walk (around 600 meters) northeast from Pham Ngu Lao Street."}, {"address": "01 Cong xa Paris, Ben Nghe Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Affectionately known as the \u0027Red Church,\u0027 Notre-Dame Cathedral Basilica of Saigon is Ho Chi Minh City\u0027s most iconic historical landmark. Construction of this Neo-Romanesque marvel began in 1877, using red bricks and stained glass shipped directly from Marseille, France\u2014materials that retain their vibrant hue over a century later. Featuring twin 58-meter spires on its facade and a peaceful statue of the Virgin Mary in the front plaza, this grand and elegant cathedral is a must-visit cultural attraction for anyone visiting District 1.", "name": "Notre-Dame Cathedral Basilica of Saigon", "transport": "About a 7-minute Grab ride or a 20-minute walk from the Pham Ngu Lao area."}, {"address": "28 Vo Van Tan St, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | As one of the most visited museums in Ho Chi Minh City, this institution powerfully documents the harsh realities and historical context of the Vietnam War. Outside, you\u0027ll find captured U.S. military hardware, including tanks, fighter jets, helicopters, and heavy weaponry. Inside, poignant exhibits feature compelling historical photographs, news archives, and a realistic replica of the infamous \u0027tiger cage\u0027 prison cells. Deeply moving and educational, it offers visitors a profound understanding of modern Vietnam\u0027s historical scars and the immense value of peace.", "name": "War Remnants Museum", "transport": "About a 5 to 7-minute Grab ride or a 15-minute walk from Pham Ngu Lao Street."}, {"address": "65 Ly Tu Trong St, Ben Nghe Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Housed in the former Gia Long Palace from the French colonial era, this grand white building seamlessly blends Neoclassical architecture with European estate design. Inside, thematic galleries showcase Saigon\u0027s evolution from a small fishing port into a bustling metropolis, highlighting its geography, folk traditions, commercial history, and revolutionary wartime years. Surrounded by lush gardens and featuring stunning vintage staircases, the building itself is a breathtaking work of art.", "name": "Ho Chi Minh City Museum", "transport": "About a 5-minute Grab ride or a 15-minute walk from the Pham Ngu Lao area."}, {"address": "66 Ton That Thiep St, Ben Nghe Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Tucked away in a vibrant neighborhood of District 1, this temple was built in the late 19th century by Tamil merchants and is dedicated to Murugan, the Hindu god of war. The interior is visually striking, with ceilings and walls lined in colorful, intricately patterned imported tiles. A massive wooden chariot sits at the center of the temple, used in grand processions during annual Hindu festivals\u2014a hidden gem for cultural travelers seeking exotic religious art.", "name": "Sri Thendayuthapani Temple", "transport": "About a 12-minute walk or a 4-minute Grab ride from Pham Ngu Lao Street."}, {"address": "289 Hai Ba Trung St, Ward 8, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Famously known as the \u0027Pink Church,\u0027 Tan Dinh Church is Saigon\u0027s second-largest Catholic church after Notre-Dame Cathedral, built in 1870 during the French colonial era. The structure features a dreamy pastel-pink facade and romantic Gothic Revival architectural details, complete with delicate Romanesque arches, spires, and a lofty bell tower. As sunlight bathes the carved pink walls, it creates a magical atmosphere straight out of a fairytale, making it an insanely popular landmark for culture seekers and photographers visiting District 1.", "name": "Tan Dinh Church (Nh\u00e0 th\u1edd T\u00e2n \u0110\u1ecbnh)", "transport": "About a 10-minute Grab car or bike ride from the Pham Ngu Lao area."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | A long, ribbon-like urban park right next to Ph\u1ea1m Ng\u0169 L\u00e3o and B\u00f9i Vi\u1ec7n Streets, serving as the green lungs of the backpacker district. The park is shaded by lush trees with well-maintained walking paths. In the morning, you can see locals exercising, square dancing, or playing badminton; in the evening, many young students gather here to practice English or host club activities. Below the park lies the underground Sense Market and food court, making it a great spot to beat the heat and experience the authentic pulse of local Saigon life.", "name": "September 23rd Park (C\u00f4ng vi\u00ean 23 th\u00e1ng 9)", "transport": "1 to 3 minutes walk directly from B\u00f9i Vi\u1ec7n or Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "Tr\u01b0\u01a1ng \u0110\u1ecbnh, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | A vast green oasis just a few minutes\u0027 walk from the Ph\u1ea1m Ng\u0169 L\u00e3o area, spanning over 10 hectares with more than a thousand century-old trees. Widely regarded as one of Ho Chi Minh City\u0027s most beautiful parks, it features replica Cham towers, a H\u00f9ng Kings temple, and exquisite landscaped gardens. Early in the morning, you can often witness the traditional \u0027bird cafe\u0027 gatherings, where local elderly men bring birdcages to hang under the trees and compare bird calls\u2014a charmingly nostalgic slice of classic Vietnamese life.", "name": "Tao Dan Park (C\u00f4ng vi\u00ean T\u00e0o \u0110\u00e0n)", "transport": "About an 8\u201310 minute walk or a 3-minute Grab ride from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "Pasteur, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | A classic city park nestled between the Notre-Dame Cathedral Basilica of Saigon and the Independence Palace, named after Vietnam\u0027s Reunification Day. Massive tree canopies form a natural sunshade, making it perfect for sitting casually on the grass to sip on famous local \u0027C\u00e0 ph\u00ea b\u1ec7t\u0027 (sidewalk coffee). It is a favorite hangout spot for university students and young locals, offering a relaxed and lively vibe in the afternoon that captures the youthful energy of Saigon.", "name": "April 30th Park (C\u00f4ng vi\u00ean 30 Th\u00e1ng 4)", "transport": "About a 7-minute ride by Grab car or motorbike from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "T\u00f4n \u0110\u1ee9c Th\u1eafng, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | A newly modernized riverside park stretching along the Saigon River, not far from the backpacker district. Thoroughly renovated, it features wide waterfront promenades, polished geometric gardens, and scenic viewing platforms. Cool and breezy at night, it offers stunning views across the river to the modern skyline of the Th\u1ee7 Thi\u00eam new area and the iconic Landmark 81. A romantic and ideal spot for evening strolls, night views, and embarking on river cruises or water taxis.", "name": "Bach Dang Wharf Park (C\u00f4ng vi\u00ean B\u1ebfn B\u1ea1ch \u0110\u1eb1ng)", "transport": "About an 8-minute Grab ride or a 20-minute walk toward the river from B\u1ebfn Th\u00e0nh Market"}, {"address": "135 Nam K\u1ef3 Kh\u1edfi Ngh\u0129a, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Vast historic grounds surrounding the iconic Independence Palace, boasting hundreds of towering ancient trees and sprawling green lawns. Quiet and serene, it offers a stark contrast to the busy traffic outside. After touring the landmark palace, visitors can stroll past fountains, shaded avenues, and historical artifact exhibits (such as vintage tanks and aircraft), enjoying a tranquil blend of rich history and natural scenery.", "name": "Independence Palace Gardens (C\u00f4ng vi\u00ean Dinh \u0110\u1ed9c L\u1eadp)", "transport": "About a 12-minute walk or a 5-minute Grab ride from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "2 Nguy\u1ec5n B\u1ec9nh Khi\u00eam, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Founded in 1864, this is one of the oldest zoos and botanical gardens in the world. Located on the northeastern edge of District 1, this green treasure trove features thousands of rare plants, century-old trees, and dense tropical foliage. Beyond historical French-style botanical sections and greenhouses, it houses lively animal exhibits\u2014perfect for travelers looking to escape the backpacker bustle and enjoy a fresh, immersive nature walk.", "name": "Saigon Zoo and Botanical Gardens (Th\u1ea3o C\u1ea7m Vi\u00ean S\u00e0i G\u00f2n)", "transport": "About a 10-minute Grab ride from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "V\u00f2ng xoay C\u00f4ng Tr\u01b0\u1eddng Qu\u1ed1c T\u1ebf, Ph\u01b0\u1eddng 6, Qu\u1eadn 3, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | A modernist water-fountain plaza located on the edge of central District 1, surrounded by lush trees and flowerbeds. Built with unique Brutalist concrete landscaping, it features a central lotus-shaped structure standing over a pool. In the evening, it becomes a popular gathering spot for local youth and street vendors selling tropical juices and Vietnamese grilled rice paper (B\u00e1nh tr\u00e1ng n\u01b0\u1edbng), making it a unique landmark blending an urban oasis with local street food culture.", "name": "Turtle Lake Plaza (H\u1ed3 Con R\u00f9a)", "transport": "About an 8-minute Grab ride from the Ph\u1ea1m Ng\u0169 L\u00e3o area"}, {"address": "C\u00f4ng tr\u01b0\u1eddng M\u00ea Linh, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | A circular green plaza park at the edge of the Saigon River and the end of \u0110\u1ed3ng Kh\u1edfi Street, dominated by a grand statue of the historical Vietnamese hero Tr\u1ea7n H\u01b0ng \u0110\u1ea1o. Beautifully redesigned, the park features a circular fountain, manicured lawns, and modern landscaping. Splendidly illuminated at night with a gentle river breeze, it is a lovely spot for travelers to rest while walking along the waterfront, enjoying the unique charm of historical sculpture amidst tropical greenery.", "name": "Me Linh Square Park (C\u00f4ng tr\u01b0\u1eddng M\u00ea Linh)", "transport": "About an 8-minute Grab ride from Ph\u1ea1m Ng\u0169 L\u00e3o Street, or walk from B\u1ebfn Th\u00e0nh Market toward the river"}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "Bui Vien Street, Pham Ngu Lao Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | The beating heart of Saigon\u0027s legendary nightlife, Bui Vien turns into a pedestrian-only zone every evening. The entire street comes alive with dazzling neon signs, pounding EDM beats from lively bars, street performers, and a wide array of local food stalls. As a top choice for global backpackers and local youth, any quick photo captures the vibrant, tropical energetic night vibes of Southeast Asia. A quintessential landmark you simply cannot miss when visiting Ho Chi Minh City.", "name": "Bui Vien Walking Street", "transport": "Take a bus to the C\u00f4ng vi\u00ean 23/9 stop and walk for about 3 minutes, or set your Grab destination directly to Bui Vien Walking Street."}, {"address": "Pham Ngu Lao Street, Pham Ngu Lao Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | As one of the main arteries of the backpacker district, tree-lined Pham Ngu Lao Street is packed with budget hostels, travel agencies, cozy cafes, and long-distance bus stations. By day, it offers a relaxed, leafy hipster vibe with French colonial architecture perfect for leisurely strolls and photos; by night, it transforms into a bustling hub of lively bistros, showcasing Saigon\u0027s vibrant cultural blend.", "name": "Pham Ngu Lao Street", "transport": "Located in the heart of District 1, adjacent to September 23 Park, easily accessible on foot."}, {"address": "Pham Ngu Lao Street, Pham Ngu Lao Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A sprawling green park adjacent to Pham Ngu Lao Street, serving as an urban oasis right beside the bustling nightlife zone. Filled with lush greenery, wide shaded walkways, and colorful flower beds, it\u0027s a popular spot for morning exercises by locals and afternoon strolls by travelers. Host to occasional cultural festivals, creative markets, and food fairs, it\u0027s also a fantastic photography spot for capturing Saigon\u0027s cityscapes and local daily life.", "name": "September 23 Park (C\u00f4ng vi\u00ean 23 Th\u00e1ng 9)", "transport": "Just a 1\u20132 minute walk across the street from Pham Ngu Lao Street or Bui Vien Street."}, {"address": "Cong Quynh - Pham Ngu Lao Intersection, Pham Ngu Lao Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | A traditional local market located at the western end of the Pham Ngu Lao area, offering a more authentic, friendly neighborhood feel compared to Ben Thanh Market. Inside, you\u0027ll find vibrant tropical fruits, traditional Vietnamese clothing, and mouth-watering local street food like pho and b\u00fan ch\u1ea3. Featuring classic nostalgic Vietnamese architecture on the outside, it\u0027s a great spot to experience genuine local Saigon life and capture grounded cultural photos.", "name": "Thai Binh Market (Ch\u1ee3 Th\u00e1i B\u00ecnh)", "transport": "Walk west along Pham Ngu Lao Street for about 5 minutes, or take a bus to the Ch\u1ee3 Th\u00e1i B\u00ecnh stop."}, {"address": "De Tham Street, Pham Ngu Lao Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A key connecting street running between Pham Ngu Lao Street and Bui Vien Street, home to long-established tour operators, bus hubs, and classic international restaurants. Blending nostalgic French charm with modern backpacker culture, the colorful signs and sidewalk cafes at street corners serve as fantastic backdrops for capturing Saigon\u0027s urban street scenes.", "name": "De Tham Street", "transport": "Easily reachable on foot from the intersections at Bui Vien Street or Pham Ngu Lao Street."}, {"address": "04 Pham Ngu Lao Street, Pham Ngu Lao Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | An underground one-stop shopping and dining paradise hidden beneath September 23 Park, seamlessly combining a modern shopping mall with Asian street food stalls. The interior decor blends retro Saigon charm with festive Asian elements, featuring dozens of stalls offering Vietnamese, Thai, Indian, Japanese, and other cuisines. Air-conditioned and comfortable, it\u0027s a popular indoor spot for travelers to escape the heat, enjoy great food, and snap exotic photos.", "name": "Sense Market \u0026 Asiana Food Town", "transport": "Located underground at September 23 Park; the entrance is near Pham Ngu Lao Street\u2014just walk down the park stairs."}, {"address": "Alley 84 Bui Vien, Pham Ngu Lao Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A hidden hipster haven tucked inside an alley off bustling Bui Vien Street, featuring vibrant, creative graffiti murals full of local Vietnamese elements. Away from the noise of the main drag, it offers an indie, artistic atmosphere that attracts trendsetters and photography lovers. It\u0027s the ultimate spot to capture Saigon\u0027s emerging street art culture.", "name": "Bui Vien Street Art Alley 84", "transport": "Located in the alley next to 84 Bui Vien Street, easily accessible on foot from Bui Vien Walking Street."}, {"address": "Do Quang Dau Street, Pham Ngu Lao Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A short street intersecting Bui Vien Street, packed with a high density of bars and open-air cafes. Slightly more intimate and chill than the roaring main street, its small venues lined with fairy lights and lush plants project a charming glow after dark. It\u0027s the perfect spot to sit on a low plastic stool with a cheap beer and capture documentary-style photos that embody the true soul of Saigon\u0027s nightlife.", "name": "Do Quang Dau Street", "transport": "Just a 1-minute walk from Bui Vien Street to turn onto Do Quang Dau Street."}], "name": "Popular Check-in Spots"}}, "name": "District 1 - Pham Ngu Lao and Bui Vien Backpacker Nightlife Area"}, "district_1_center": {"categories": {"cat_1": {"items": [{"address": "02 C\u00f4ng x\u00e3 Paris, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | Built in the late 19th century, the Saigon Central Post Office is a quintessential example of French colonial architecture, designed by the iconic Gustave Eiffel\u0027s team. The grand exterior features a charming pale yellow facade that seamlessly blends Gothic, Renaissance, and French Classical styles. Step inside to discover soaring arched ceilings, vintage wooden telephone booths that instantly transport you back a century, a large portrait of Vietnam\u0027s founding father Ho Chi Minh overlooking the hall, and beautifully patterned antique floor tiles. Functioning as a full-service post office to this day, visitors can send postmarked postcards to loved ones or shop for unique souvenirs while taking stunning retro-style photos.", "name": "Saigon Central Post Office", "transport": "Take bus 03, 18, 19, or 45 to the \u0027B\u01b0u \u0111i\u1ec7n th\u00e0nh ph\u1ed1\u0027 stop, or walk 10\u201315 minutes from Ben Thanh Market."}, {"address": "01 C\u00f4ng x\u00e3 Paris, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | Affectionately known as the \u0027Red Church,\u0027 Saigon Notre-Dame Cathedral is one of Ho Chi Minh City\u0027s most iconic historical landmarks. Constructed between 1877 and 1880, all of its red bricks were imported directly from Marseille, France, retaining their vibrant color after more than a century of weather exposure. Built in a Neo-Romanesque style, the front features twin bell towers rising 57 meters into the sky, while a tranquil statue of the Virgin Mary imported from Italy stands in the front plaza. Although the interior is currently undergoing major restoration, marveling at its magnificent classic facade and soaking in the surrounding French ambiance makes it an absolute must-visit.", "name": "Saigon Notre-Dame Cathedral", "transport": "Located directly opposite the Saigon Central Post Office; take bus 03, 18, or 19 to the \u0027C\u00f4ng x\u00e3 Paris\u0027 stop."}, {"address": "135 Nam K\u1ef3 Kh\u1edfi Ngh\u0129a, B\u1ebfn Th\u00e0nh, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | Also known as the Reunification Palace, this former South Vietnamese presidential home is a pivotal landmark in modern Vietnamese history. On April 30, 1975, North Vietnamese tanks crashed through its main gates, marking the official end of the Vietnam War and the reunification of the nation. Designed by renowned architect Ng\u00f4 Vi\u1ebft Th\u1ee5, the building artfully combines modernism with traditional Feng Shui philosophy, with its exterior layout resembling auspicious Chinese characters. The four-story palace preserves intact presidential offices, grand banquet halls, cabinet rooms, and reception chambers. Below ground lies a fully equipped wartime command bunker, secret tunnels, and shelters, making it an extraordinary living history lesson.", "name": "Independence Palace", "transport": "Take bus 04, 109, or 152 to the \u0027Dinh \u0110\u1ed9c L\u1eadp\u0027 stop, or take a 5-minute walk down L\u00ea Du\u1ea9n Boulevard from Notre-Dame Cathedral."}, {"address": "86 L\u00ea Th\u00e1nh T\u00f4n, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.6 stars | Bursting with French classical romance, this magnificent building originally served as the Saigon City Hall and is now the seat of the Ho Chi Minh City People\u0027s Committee. Built between 1898 and 1909 by French architect Fernand Gard\u00e8s, it exemplifies opulent Neo-Baroque elegance with soft yellow walls, ornate carvings, arched windows, and intricate bas-reliefs. The expansive Ho Chi Minh Plaza and a statue of Chairman Ho Chi Minh sit directly out front. While the government building\u0027s interior is closed to the public, the hall lights up brilliantly at night, offering an exquisite European vibe that makes it one of the city\u0027s most romantic evening photo spots.", "name": "Ho Chi Minh City Hall", "transport": "Located at the northern end of Nguy\u1ec5n Hu\u1ec7 Pedestrian Street; take bus 03, 19, or 36 to the \u0027UB Th\u00e0nh Ph\u1ed1\u0027 stop."}, {"address": "07 C\u00f4ng Tr\u01b0\u1eddng Lam S\u01a1n, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.6 stars | Also known as the Municipal Theatre of Ho Chi Minh City, this elegant opera house was built in 1898 by French architect Eug\u00e8ne Ferret, drawing inspiration from the Petit Palais in Paris. Its Gothic-influenced exterior features delicate reliefs of goddesses, angel statues, and refined colonnades, embodying the height of late 19th-century French architectural charm. Inside, the lushly decorated auditorium seats around 460 guests with exceptional acoustics. Today, it serves as the premier venue for traditional and contemporary Vietnamese artistic performances, most notably the world-famous \u0027AO Show\u0027\u2014an acrobatic masterpiece using bamboo craft and traditional music often called Vietnam\u0027s answer to Cirque du Soleil.", "name": "Saigon Opera House", "transport": "Located at the intersection of \u0110\u1ed3ng Kh\u1edfi Street and Lam S\u01a1n Square; take bus 03, 19, or 45 to the \u0027Nh\u00e0 h\u00e1t Th\u00e0nh Ph\u1ed1\u0027 stop."}, {"address": "97A Ph\u00f3 \u0110\u1ee9c Ch\u00ednh, Ph\u01b0\u1eddng Nguy\u1ec5n Th\u00e1i B\u00ecnh, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | Housed in the former private mansion of wealthy early 20th-century Chinese merchant H\u1ee9a B\u1ed5n H\u00f2a, this striking artistic venue comprises three pastel-yellow buildings that seamlessly blend French Neoclassical architecture with Cantonese design motifs. The interior boasts stunning vintage spiral staircases, vibrant stained-glass windows, French louvred shutters, and one of Vietnam\u0027s oldest working elevators. Exhibitions range from ancient stone carvings and ceramics to realistic Vietnam War-era paintings and contemporary masterpieces. Brimming with artistic elegance and rich history, it is a favorite sanctuary for photography enthusiasts looking to capture retro light and shadows.", "name": "Ho Chi Minh City Museum of Fine Arts", "transport": "A 5\u20138 minute walk from Ben Thanh Market, or take bus 01, 02, or 03 to the \u0027B\u1ea3o t\u00e0ng M\u1ef9 thu\u1eadt\u0027 stop."}, {"address": "65 L\u00fd T\u1ef1 Tr\u1ecdng, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.3 stars | Built in 1890, this grand historic mansion formerly served as the Gia Long Palace and the residence of the South Vietnamese Prime Minister. Its impressive architecture expertly blends French Neoclassical and Neo-Baroque elements. The lush museum grounds display vintage warcraft, including wartime military jets, classic cars, and anti-aircraft guns. Inside, detailed exhibits trace Saigon\u0027s evolution from a modest fishing village through French colonization and the Vietnam War to today\u0027s bustling metropolis. Featuring artifacts, cultural displays, and historical records, its grand wooden staircase and high-ceiled corridors are also a beloved backdrop for local wedding photoshoots.", "name": "Ho Chi Minh City Museum", "transport": "Located near the Independence Palace and City Hall; take bus 04, 18, or 36 to the \u0027B\u1ea3o t\u00e0ng Th\u00e0nh Ph\u1ed1\u0027 stop and walk for 2 minutes."}, {"address": "\u0110\u01b0\u1eddng L\u00ea L\u1ee3i, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.0 stars | Established in 1912, Ben Thanh Market is Ho Chi Minh City\u0027s most iconic and historic covered market, with its famous four-faced clock tower at the south gate serving as a symbol of Saigon. Spanning a massive interior with thousands of vibrant stalls, you can find everything here, including traditional \u00c1o D\u00e0i garments, rich Vietnamese coffee beans, dried fruits and cashews, handcrafted goods, lacquerware, and souvenirs. It\u0027s also a paradise for authentic local street food, offering fresh Pho, spring rolls, savory pancakes, and tropical shaved-ice desserts. As night falls, the surrounding streets transform into a bustling night market filled with lively energy.", "name": "Ben Thanh Market", "transport": "Located in the heart of District 1, adjacent to the Ben Thanh Bus Station and Metro Line 1 B\u1ebfn Th\u00e0nh Station; easily walkable from major city landmarks."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "01 C\u00f4ng x\u00e3 Paris, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Built in the late 19th century during the French colonial era, Notre-Dame Cathedral Basilica of Saigon is one of Ho Chi Minh City\u0027s most iconic Gothic landmarks. Every red brick used in its construction was imported directly from Marseille, France, retaining its vibrant hue after a century of weather. The twin towers soar 57 meters high with majestic elegance, while the interior features exquisite stained glass windows and soaring vaulted ceilings. In the front plaza stands a statue of the Virgin Mary, making it a beloved photo spot for tourists and locals alike, oozing rich French charm and sacred solemnity.", "name": "Notre-Dame Cathedral Basilica of Saigon", "transport": "Take a bus to the C\u00f4ng x\u00e3 Paris stop, or walk about 5 minutes from central District 1."}, {"address": "97A Ph\u00f3 \u0110\u1ee9c Ch\u00ednh, Ph\u01b0\u1eddng Nguy\u1ec5n Th\u00e1i B\u00ecnh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Housed in a striking yellow historic mansion blending Neoclassical and Lingnan architectural styles, this museum was originally the residence of wealthy Chinese merchant Hui Bon Hoa. The museum showcases a rich collection of contemporary Vietnamese art, lacquer paintings, sculptures, and traditional folk art, while preserving a magnificent spiral staircase, stained glass windows, and a retro caged elevator. It is not only a sanctuary for art lovers exploring Vietnam\u0027s art history, but also a top recommendation for photographers drawn to its nostalgic aesthetic and interplay of light and shadow.", "name": "Ho Chi Minh City Museum of Fine Arts", "transport": "Walk about 7 minutes from Ben Thanh Market, or arrive by taxi."}, {"address": "2 Nguy\u1ec5n B\u1ec9nh Khi\u00eam, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Built in 1929, this historical museum features an architectural style that seamlessly blends French design with traditional Vietnamese-Chinese elements, showcasing the unique beauty of \u0027Indochinese architecture.\u0027 The museum houses tens of thousands of precious artifacts spanning from prehistoric times, the Champa Kingdom, and the Nguyen Dynasty to modern history, including exquisite bronzes, stone carvings, and ancient Buddha statues. Additionally, traditional Vietnamese water puppet shows are held at set times daily, allowing visitors to experience vibrant folk performing arts alongside ancient historic treasures.", "name": "Museum of Vietnamese History", "transport": "Located next to the Botanical Gardens; take a bus to the B\u1ea3o t\u00e0ng L\u1ecbch s\u1eed stop, or take a 10-minute taxi ride from the city center."}, {"address": "65 L\u00fd T\u1ef1 Tr\u1ecdng, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Formerly known as Gia Long Palace, the Ho Chi Minh City Museum was built in the 1890s as the Governor-General\u0027s residence of Cochinchina. This grand, pure white French building combines Classical Baroque and Neoclassical design, featuring intricate carvings and elegant grand corridors. The exhibits systematically detail the city\u0027s evolution from a quiet port to a bustling modern metropolis, featuring traditional crafts, commercial growth, and revolutionary artifacts from anti-French and anti-American wars. Fighter jets and classic cars are displayed in the lush gardens, adding a rich multi-layered sense of history.", "name": "Ho Chi Minh City Museum", "transport": "Located in the heart of District 1 near the Independence Palace, about an 8-minute walk from Ben Thanh Market."}, {"address": "135 Nam K\u1ef3 Kh\u1edfi Ngh\u0129a, B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | The Independence Palace is one of the most significant witnesses to modern Vietnamese history, serving as the presidential palace during the South Vietnam era. Designed by renowned Vietnamese architect Ngo Viet Thu, the modernist building fuses Eastern philosophy with modern geometric aesthetics. The interior preserves the 1970s presidential offices, state banquet rooms, cabinet meeting halls, and an underground war command center with communications equipment. The expansive, lush green lawns feature the actual tanks that crashed through the gates in 1975, making it an unmissable landmark for exploring Vietnam\u0027s modern wartime and political history.", "name": "Independence Palace", "transport": "Located in central District 1, accessible by city bus to the Dinh \u0110\u1ed9c L\u1eadp stop, or a 6-minute walk from Notre-Dame Cathedral."}, {"address": "1 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Built between 1902 and 1905, Huy\u1ec7n S\u1ef9 Church is an ancient Gothic church funded by \u0027Huy\u1ec7n S\u1ef9\u0027 (the grandfather of Empress Nam Ph\u01b0\u01a1ng), one of Saigon\u0027s wealthiest men at the time. Constructed with solid granite exterior walls, it exudes a solemn and enduring presence topped with a soaring bell tower cross. Inside, you\u0027ll find beautiful stained glass windows, high vaulted ceilings, and the stone sarcophagi of Huy\u1ec7n S\u1ef9 and his wife behind the main altar, complete with lifelike carved statues. Quieter and more serene than Notre-Dame Cathedral, it is an ideal place to experience a tranquil Catholic atmosphere and fine French architectural detail.", "name": "Huy\u1ec7n S\u1ef9 Church", "transport": "Adjacent to Pham Ngu Lao street, about a 5-minute walk from the backpacker street."}, {"address": "5 T\u00f4n \u0110\u1ee9c Th\u1eafng, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | Situated along the Saigon River, the T\u00f4n \u0110\u1ee9c Th\u1eafng Museum is dedicated to Vietnam\u0027s second president, T\u00f4n \u0110\u1ee9c Th\u1eafng. The museum highlights his extraordinary life, featuring historical artifacts, photographs, and personal belongings from his participation in labor movements, revolutionary career, and imprisonment on C\u00f4n \u0110\u1ea3o island. Recently renovated with modern exhibition facilities, it uses multimedia displays and realistic dioramas to recreate historical scenes, profoundly documenting Vietnam\u0027s 20th-century revolutionary struggles with high educational value.", "name": "T\u00f4n \u0110\u1ee9c Th\u1eafng Museum", "transport": "Located on the Saigon Riverfront, about a 6-minute walk from District 1\u0027s Nguyen Hue Walking Street."}, {"address": "07 C\u00f4ng Tr\u01b0\u1eddng Lam S\u01a1n, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Built in 1898 by French architects, the Saigon Opera House faithfully recreates the luxury and elegance of late 19th-century Parisian opera houses. Its facade features exquisite bas-relief sculptures and angel statues, while the interior boasts exceptional acoustics. Today, it serves as Ho Chi Minh City\u0027s premier performing arts venue, regularly hosting ballet, symphonies, and the world-renowned \u0027A O Show\u0027 (Vietnam\u0027s Cirque du Soleil-style bamboo circus). Illuminated by brilliant lights at night, the opera house shines like a jewel and stands as one of District 1\u0027s most striking cultural landmarks.", "name": "Saigon Opera House", "transport": "Located beside Nguyen Hue Walking Street, easily accessible by taxi or a short walk from major central hotels."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Tr\u01b0\u01a1ng \u0110\u1ecbnh, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 stars | Spanning nearly 10 hectares, Tao Dan Park is one of the largest and lushly shaded urban parks in District 1, Ho Chi Minh City, affectionately known as the city\u0027s green lungs. The park is home to over a thousand soaring trees, including many ancient species that provide cool shade even on scorching afternoons. It serves as a vibrant community hub for morning exercise, strolling, and socializing, where you can often spot folk dancers, Tai Chi practitioners, and bird enthusiasts gathering. Inside, there is a Cham-style memorial tower, refined garden landscapes, and during the Vietnamese Lunar New Year (Tet), it hosts a grand flower and tulip festival that draws thousands of visitors for photos.", "name": "Tao Dan Park", "transport": "About an 8-minute walk from Ben Thanh Market, or take city bus routes 03, 19, or 36 to the Tr\u01b0\u01a1ng \u0110\u1ecbnh stop."}, {"address": "Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.2 stars | 23 September Park is a long, linear green oasis stretching from the vicinity of Ben Thanh Market all the way to Pham Ngu Lao Street (the backpacker district). Originally the site of an old railway station, it was redeveloped into a dynamic urban park. Divided into several sections, it features wide stone paved walkways, open lawns, and ample tree shade, making it a favorite spot for local youth and international backpackers to relax and mingle. Beneath the park lies the famous \u0027Central Market\u0027 underground mall and food hall, seamlessly blending natural greenery with shopping and dining. At dusk, street performers and dance crews often practice here.", "name": "23 September Park", "transport": "Located right next to Pham Ngu Lao Street and Ben Thanh Market, easily reachable on foot; or take a bus to B\u1ebfn xe Ch\u00e2u V\u0103n Li\u00eam or B\u1ebfn Th\u00e0nh station."}, {"address": "Pasteur, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 stars | Situated right in the historic heart of Ho Chi Minh City, 30 April Park lies nestled between the Independence Palace and Notre-Dame Cathedral Basilica. Named after Vietnam\u0027s Liberation Day (April 30, 1975), the park is shaded by decades-old tropical trees that form a dense natural canopy. It is the best place to experience Saigon\u0027s authentic \u0027C\u00e0 ph\u00ea b\u1ec7t\u0027 (ground-mat street coffee) culture, where students and young locals rent small mats to sit on the ground, sip Vietnamese iced coffee, and chat. The shady environment surrounded by elegant French colonial architecture creates a delightfully relaxed, cultural vibe.", "name": "30 April Park", "transport": "Located directly in front of Notre-Dame Cathedral, about a 2-minute walk from the Saigon Central Post Office, or take bus 03, 18, or 30 to the C\u00f4ng vi\u00ean 30/4 stop."}, {"address": "2 Nguy\u1ec5n B\u1ec9nh Khi\u00eam, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.2 stars | Established in 1864, the Saigon Zoo and Botanical Gardens is one of the oldest zoos in the world, serving as a historic and ecological green sanctuary in District 1. The gardens house hundreds of rare tropical plant species and century-old trees, functioning as a living botanical museum. Connected directly to the zoo area, it is home to many rare animals and birds. With its serene, antique atmosphere, vibrant flora, tropical greenhouses, fountains, and French colonial architecture, it is a beloved favorite for families
