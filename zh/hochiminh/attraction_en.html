 and photography enthusiasts, offering a rare natural retreat in the bustling city center.", "name": "Saigon Zoo and Botanical Gardens", "transport": "Take bus 05, 06, 14, or 19 directly to the Th\u1ea3o C\u1ea7m Vi\u00ean stop, or take a 5\u201310 minute Grab ride from downtown District 1."}, {"address": "T\u00f4n \u0110\u1ee9c Th\u1eafng, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 stars | Situated along the Saigon River, Bach Dang Wharf Park is a highly popular riverside park that recently underwent a complete modern landscape upgrade. Stretching along the waterfront, it features freshly paved modern walkways, manicured lawns, wooden boardwalks, and plenty of benches. It offers stunning, unobstructed river views looking out toward the futuristic skyscrapers of District 2 (Thu Thiem) and Landmark 81. Breezy evenings and nights are the liveliest times here, as locals and tourists gather to stroll, admire the night skyline, and watch illuminated river cruises. A ferry terminal and scenic waterfront cafes are located right beside the park.", "name": "Bach Dang Wharf Park", "transport": "Walk to the end of Nguyen Hue Pedestrian Street to reach the riverfront; or take the Saigon Waterbus to B\u1ebfn B\u1ea1ch \u0110\u1eb1ng pier."}, {"address": "Hai B\u00e0 Tr\u01b0ng, Ph\u01b0\u1eddng \u0110a Kao, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 stars | Located in the Da Kao area in northeastern District 1, Le Van Tam Park is a spacious urban park built on the site of a historic French cemetery. Named after the Vietnamese anti-colonial hero Le Van Tam, a memorial monument and statue stand at its center. The park is filled with lush greenery and offers a large children\u0027s playground, outdoor fitness equipment, badminton courts, and a circular jogging track, serving as a primary exercise and recreation spot for nearby residents. Additionally, the park hosts the grand biennial Saigon International Book Fair, filling the entire park with literary charm and cultural activities.", "name": "Le Van Tam Park", "transport": "Take bus 03, 150, or 31 to the C\u00f4ng vi\u00ean L\u00ea V\u0103n T\u00e1m stop, or take a 7-minute Grab ride from the city center."}, {"address": "C\u00f4ng tr\u01b0\u1eddng M\u00ea Linh, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 stars | Positioned where the Saigon River waterfront meets Ton Duc Thang Avenue, Me Linh Square is a historic, circular traffic-roundabout garden park. A grand statue of the national hero Tran Hung Dao stands majestically at the square\u0027s center. Following landscape renovations, the park features vibrant flower beds, elegant fountains, and comfortable seating surrounded by lush lawns. Sitting in this plaza park, visitors can enjoy refreshing greenery while taking in river views and surrounding 5-star luxury hotels\u2014a unique urban oasis steeped in history.", "name": "Me Linh Square Park", "transport": "About a 3-minute walk from Nguyen Hue Pedestrian Street or Bach Dang Wharf Park; also accessible via the city open-top double-decker sight-seeing bus."}, {"address": "C\u00f4ng tr\u01b0\u1eddng Lam S\u01a1n, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 stars | Set in the heart of District 1\u0027s most prestigious plaza district, Lam Son Park sits directly in front of the historic Saigon Opera House and luxury hotels. Designed as an open urban plaza garden, it features neatly arranged flowerbeds, reflecting pools with fountains, and evergreen landscape greenery. At night, the fountain lights up in vibrant colors, harmonizing beautifully with the French colonial architecture of the Opera House to create a romantic European atmosphere. It is a wonderful spot for shoppers exploring Dong Khoi Street to rest, take photos, and enjoy street performances.", "name": "Lam Son Park", "transport": "Located directly in front of the Saigon Opera House, just a 1-minute walk from Dong Khoi Street."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "02 C\u00f4ng x\u00e3 Paris, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Built in the late 19th century, this vibrant yellow French colonial building was designed by the firm of renowned architect Gustave Eiffel and exudes a vintage European charm. The interior features magnificent semi-circular vaulted ceilings, intricate vintage tiled floors, and two historic hand-drawn maps. Beyond being an absolute photo hotspot, visitors can send a postcard stamped with a Saigon postmark, drawing travelers from all over the world.", "name": "Saigon Central Post Office", "transport": "Located opposite Notre Dame Cathedral in District 1. Easily accessible by Grab or on foot from downtown."}, {"address": "01 C\u00f4ng x\u00e3 Paris, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Commonly known as the \u0027Red Church,\u0027 this is one of Ho Chi Minh City\u0027s most iconic landmarks. All the red bricks used in its construction were imported from Marseille, France, retaining their vibrant color even after a century. The majestic Neo-Gothic twin spires and the statue of the Virgin Mary in front create a visually striking, dreamy scene that photography enthusiasts adore both day and night.", "name": "Notre Dame Cathedral Basilica of Saigon", "transport": "Located at Paris Square in District 1, easily reachable on foot from downtown."}, {"address": "42 Nguy\u1ec5n Hu\u1ec7, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Converted from a mid-20th-century US military officers\u0027 housing complex, this nine-story building has become Saigon\u0027s hottest trendy hotspot. From the outside, the grid-like balcony structure hosts an eclectic mix of stylish cafes, handmade boutiques, and trendy shops. At night, vibrant neon signs light up the facade, showcasing a magical fusion of old and new urban vitality.", "name": "The Cafe Apartment", "transport": "Located right on Nguyen Hue Walking Street; easily reachable by walking along the promenade."}, {"address": "\u0110\u01b0\u1eddng Nguy\u1ec5n Hu\u1ec7, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | This spacious central boulevard stretches from City Hall to the Saigon River, flanked by historic French-era buildings and modern skyscrapers. Paved with elegant tiles and featuring fountains and lush greenery, it catches pleasant evening breezes as street performers entertain the crowd\u2014making it the top spot to soak in Saigon\u0027s chic vibe and vibrant nightlife.", "name": "Nguyen Hue Walking Street", "transport": "Situated in the heart of District 1, easily walkable from most hotels in the area."}, {"address": "86 L\u00ea Th\u00e1nh T\u00f4n, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Built in 1902, this French colonial-style palace features an elegant yellow-and-white facade, exquisite relief art, and a refined clock tower at its center. A bronze statue of Ho Chi Minh with a child stands gracefully in front, surrounded by colorful flower beds. At night, golden floodlights illuminate the intricate details, creating a magnificent backdrop ideal for night photography.", "name": "Ho Chi Minh City Hall", "transport": "Located at the head of Nguyen Hue Walking Street, about a 3-minute walk from The Cafe Apartment."}, {"address": "07 C\u00f4ng Tr\u01b0\u1eddng Lam S\u01a1n, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Embodying romantic French Gothic and Neo-Baroque architectural details, this magnificent white theater resembles an elegant Petit Palais. With its intricate pillars and arches warmly illuminated at night, it exudes a charming atmosphere. It hosts the famous bamboo circus \u0027A O Show\u0027 and is a favorite backdrop for wedding photography and stylish street photos.", "name": "Saigon Opera House", "transport": "Located at the intersection of Dong Khoi Street and Lam Son Square, adjacent to the Caravelle Hotel; easily walkable."}, {"address": "\u0110\u01b0\u1eddng Nguy\u1ec5n V\u0103n B\u00ecnh, B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Tucked right next to Notre Dame Cathedral, this lush tree-lined promenade is Ho Chi Minh City\u0027s most sophisticated cultural lane. Spanning about 100 meters, it features beautifully designed independent bookstores, creative souvenir shops, and open-air cafes. Sunlight filtering through the canopy onto vintage bus stops and bookshelves creates a wonderfully relaxed, bohemian ambiance.", "name": "Nguyen Van Binh Book Street", "transport": "Located right next to the Saigon Central Post Office, just a 1-minute walk away."}, {"address": "135 Nam K\u1ef3 Kh\u1edfi Ngh\u0129a, B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Formerly the Presidential Palace of South Vietnam, this massive complex blends traditional Feng Shui with modernist architecture. The sprawling grounds feature manicured lawns and fountains, while the interior preserves luxurious 1970s decor, state reception rooms, a rooftop helipad, and a fascinating underground wartime command bunker\u2014offering compelling photo spots rich in history.", "name": "Independence Palace", "transport": "Situated along a tree-lined avenue in District 1, about an 8-minute walk from the Central Post Office."}], "name": "Popular Photo Spots"}}, "name": "District 1 - Historic City Center and Landmark Sightseeing Area"}, "district_2_thaodien": {"categories": {"cat_1": {"items": [{"address": "505 Xa l\u1ed9 H\u00e0 N\u1ed9i, An Ph\u00fa, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Ph\u00e1p Vi\u1ec7n Minh \u0110\u0103ng Quang is one of the most magnificent Buddhist complexes in District 2, HCMC. Covering several hectares, it showcases a seamless blend of modern and traditional Vietnamese Buddhist architecture. The temple complex features towering pagodas, intricately carved halls, and tranquil landscaped gardens, with solemn Buddha statues enshrined in the main hall. Serving as a spiritual center for local devotees, its spectacular four tall towers and grounded wooden-and-stone structures attract countless photography enthusiasts and lovers of traditional sacred architecture.", "name": "Phap Vien Minh Dang Quang Monastery (Ph\u00e1p Vi\u1ec7n Minh \u0110\u0103ng Quang)", "transport": "Take a Grab or taxi along Hanoi Highway (Xa l\u1ed9 H\u00e0 N\u1ed9i); located near An Phu Station on Metro Line 1."}, {"address": "36 \u0110\u01b0\u1eddng Qu\u1ed1c H\u01b0\u01a1ng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Located in the heart of Thao Dien, Thao Dien Catholic Church is a modern Catholic building combining elegant design with a warm community feel. The exterior features sleek geometric lines and a minimalist cross, while the interior is high-ceilinged, bright, and beautifully lit by stained glass windows that create a serene and sacred atmosphere. Serving Thao Dien\u0027s large international and local Catholic community, Sunday services resonate with prayers in multiple languages, making it a wonderful spot to experience Thao Dien\u0027s multicultural fusion and modern architectural aesthetics.", "name": "Thao Dien Catholic Church (Nh\u00e0 Th\u1edd Th\u1ea3o \u0110i\u1ec1n)", "transport": "Easily accessible by walking or taking a Grab from Quoc Huong Street, the main thoroughfare of Thao Dien."}, {"address": "177 \u0110\u01b0\u1eddng Qu\u1ed1c H\u01b0\u01a1ng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Tucked away in a quiet alley off bustling Thao Dien, Dieu Giac Pagoda is a charming temple built in the mid-20th century, exuding traditional Southern Vietnamese temple architecture. Housing statues of Avalokiteshvara (Guanyin) and Shakyamuni Buddha, its red-tiled eaves and swept roofs contrast beautifully with lush green gardens. Beyond its role as a sacred site, the temple is renowned for its shelter and care for orphans, carrying on a legacy of selfless devotion. Visitors can experience a rare sense of peace, historical depth, and cultural warmth here.", "name": "Dieu Giac Pagoda (Ch\u00f9a Di\u1ec7u Gi\u00e1c)", "transport": "Located on Quoc Huong Street; easily reachable directly at the temple gate via Grab car or motorbike."}, {"address": "\u0110\u01b0\u1eddng Tr\u1ea7n Nao, An Kh\u00e1nh, District 2, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | An Khanh Communal House is a historically significant traditional Vietnamese shrine in District 2, witnessing centuries of development on the east bank of the Saigon River. Constructed in the classic Southern Vietnamese \u0027Nh\u00e0 R\u01b0\u1eddng\u0027 wooden frame style, it features delicate wood carvings of dragons and phoenixes, Chinese calligraphic couplets on pillars, and colorful glazed ceramic ornaments on the roof. Though surrounded by trendy modern neighborhoods, it still honors the ancient tradition of worshipping the village tutelary deity (Th\u00e0nh Ho\u00e0ng), serving as a precious historic relic of local heritage and folk architecture.", "name": "An Khanh Communal House (Dinh Th\u1ea7n An Kh\u00e1nh)", "transport": "About a 5 to 8-minute ride along Tran Nao Street from the Thao Dien area."}, {"address": "50 Khu Ph\u1ed1 1, Ph\u01b0\u1eddng Th\u1ee7 Thi\u00eam, District 2, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Boasting over 160 years of rich history, Thu Thiem Church and the adjacent Lovers of the Holy Cross Convent form one of Saigon\u0027s oldest religious complexes. Blending French colonial charm with local Gothic a Song Saigon", "transport": "Take a ride into the alley of Nguy\u1ec5n V\u0103n H\u01b0\u1edfng, or reserve the hotel\u0027s private water taxi service."}, {"address": "15 Nguy\u1ec5n U\u1ed1ng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | As Ho Chi Minh City\u0027s first independent art center dedicated to contemporary art, its architectural exterior delivers a powerful visual impact, constructed from shipping containers and geometric steel structures. The spacious, bright interior regularly hosts avant-garde art exhibitions, installations, and cultural talks. Rich in futuristic vibes and industrial aesthetics, every angle offers a cool, artistic photo opportunity.", "name": "The Factory Contemporary Arts Centre", "transport": "Take a Grab to Nguy\u1ec5n U\u1ed1ng Street in Thao Dien, about a 20-minute ride."}, {"address": "1 Th\u1ea3o \u0110i\u1ec1n, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | Rang Rang Coffee is one of Ho Chi Minh City\u0027s hottest specialty minimalist coffee brands. Its flagship store in Thao Dien is designed like a transparent glasshouse, featuring fair-faced concrete and silver metallic accents that seamlessly blend futuristic technology with sleek minimalist aesthetics. Beyond serving high-quality single-origin pour-overs and signature drinks, its clean, pure spatial design draws countless fashion influencers for photos.", "name": "Rang Rang Coffee - Thao Dien Flagship", "transport": "Located near the entrance of Thao Dien Street, take a ride directly to 1 Th\u1ea3o \u0110i\u1ec1n Street."}, {"address": "23 Th\u1ea3o \u0110i\u1ec1n, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | Mekong Merchant is a long-standing landmark in Thao Dien, blending traditional Vietnamese rustic thatched-cottage courtyard design with casual Western dining. Stepping inside feels like entering a tropical oasis out of time, with wooden furniture, flagstone paths, and lush greenery exuding natural, rustic charm. Popular among expats for its Mediterranean-inspired menu and fresh coffee, it is an ideal spot to experience Thao Dien\u0027s relaxed, exotic pace of life.", "name": "Mekong Merchant Saigon", "transport": "Take a Grab to 23 Th\u1ea3o \u0110i\u1ec1n Main Street, where you\u0027ll spot its quaint facade."}, {"address": "32 D10, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.7 stars | Hum Vegetarian is an upscale garden restaurant that seamlessly fuses Oriental Zen with a tropical rainforest atmosphere. Surrounded by dense tropical plants, lotus ponds, and gentle flowing water, the architecture makes extensive use of solid wood, woven bamboo, and natural light to create a peaceful, elegant ambiance. Known for its exquisite, creative wellness vegetarian dishes, its aesthetically stunning plating and ethereal garden scenery attract foodies and photographers alike.", "name": "Hum Vegetarian, Garden \u0026 Cafe - Thao Dien", "transport": "Located on D10 Street, about a 20-minute drive from District 1."}, {"address": "32 Tr\u1ea7n Ng\u1ecdc Di\u1ec7n, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | Tucked away in a Thao Dien residential area, The Snap Cafe is a cozy wooden neighborhood lifestyle village. Built with handcrafted woodwork and lush greenery, it houses charming cafes, a handcrafted kids\u0027 play area, artisan jewelry shops, bohemian boutiques, and organic zero-waste stores. Strolling along the outdoor wooden boardwalks lets you soak in Thao Dien\u0027s signature slow-paced resort vibe, while the warm, artisan architectural details offer fantastic backdrops for lifestyle photography.", "name": "The Snap Cafe", "transport": "Located on Tr\u1ea7n Ng\u1ecdc Di\u1ec7n Street near BLOQ Container Village; easily accessible by car or ride-hailing services."}], "name": "Popular Instagrammable Hotspots"}}, "name": "District 2 - Thao Dien: International Vibe \u0026 Trendy Hipster District"}, "district_3_culture": {"categories": {"cat_1": {"items": [{"address": "289 Hai Ba Trung, Ward 8, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Built in 1876 during the French colonial period, the Church of the Sacred Heart of Jesus, commonly known as the \"Pink Church\" (Tan Dinh Church), is the second largest church in Ho Chi Minh City after Notre-Dame Cathedral. The architecture seamlessly blends Romanesque, Gothic, and Renaissance styles, with its most striking feature being the dreamy all-pink exterior adorned with delicate white relief carvings. Inside, the main altar is crafted from Italian marble, while the sanctuary ceiling and vaulted arcades maintain the romantic pink-and-white color scheme, looking extraordinarily beautiful as sunlight filters through the stained glass. It is an iconic historical landmark and a must-visit spot in District 3 for countless tourists and photography enthusiasts.", "name": "Tan Dinh Church / Pink Church (Church of the Sacred Heart of Jesus)", "transport": "Take bus 03, 19, or 31 to the Hai Ba Trung stop, or take a Grab taxi from downtown District 1, arriving in about 10 minutes."}, {"address": "Cong Truong Quoc Te, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Located at the intersection of several major roads in District 3, Turtle Lake\u2014officially named International Square (C\u00f4ng tr\u01b0\u1eddng Qu\u1ed1c T\u1ebf)\u2014is an iconic modernist landmark in Ho Chi Minh City. Built between 1965 and 1972 and designed by Vietnamese architect Nguyen Cao Luyen and others, legend has it that former South Vietnamese President Nguyen Van Thieu consulted a feng shui master who claimed Le Loi Boulevard was a dragon vein. To pin down the dragon\u0027s tail, a tower with a fountain symbolizing a giant turtle and a nail was constructed here. Although the original bronze turtle statue was accidentally destroyed in 1978, the towering lotus-shaped concrete pillars and circular over-water walkway remain fully intact. Today, it has become a popular cultural and historical spot where local youth and students gather in the evening to enjoy street food and embrace a nostalgic atmosphere.", "name": "Turtle Lake Historical Plaza (H\u1ed3 Con R\u00f9a)", "transport": "About a 12-minute walk from the Pink Church, or take a Grab car with the destination set to \u0027H\u1ed3 Con R\u00f9a\u0027."}, {"address": "28 Vo Van Tan, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Established in 1975, the War Remnants Museum is one of Vietnam\u0027s most visited and deeply educational museums, housed in a historical building in District 3 that originally served as the US Intelligence Agency office. The museum comprehensively exhibits authentic historical records, military equipment, and poignant photographic documentation from the Vietnam War. Outdoors, visitors can view American UH-1 helicopters, M48 tanks, and A-37 attack aircraft, while indoor exhibits focus on Agent Orange victims and international anti-war movements. Revealing the grim reality of war from a stark and objective perspective, the museum draws over a million visitors worldwide each year to reflect on history and pray for global peace.", "name": "War Remnants Museum", "transport": "Located near the Independence Palace, about a 5-minute walk from there, or take bus 14 or 28 to the Vo Van Tan stop."}, {"address": "339 Nam Ky Khoi Nghia, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Built between 1964 and 1971, Vinh Nghiem Pagoda is Ho Chi Minh City\u0027s most iconic and expansive Mahayana Buddhist temple complex. Designed by architects from North Vietnam, the temple skillfully blends traditional Vietnamese wooden temple architecture with modern reinforced concrete structures. Its most striking feature is the nearly 40-meter, 7-story Avalokiteshvara (Guan Yin) Tower, whose upturned eaves and exquisite carvings exude rich oriental charm. Housing statues of Shakyamuni Buddha alongside Manjushri and Samantabhadra Bodhisattvas, the serene and elegant sanctuary is a sacred haven for District 3 locals seeking blessings and peace of mind, bustling with incense burners on the 1st and 15th days of the lunar month and during the Lunar New Year.", "name": "Vinh Nghiem Pagoda", "transport": "Take bus 04 or 152 to the Chua Vinh Nghiem stop, or take a Grab from the Pink Church for about 5 minutes."}, {"address": "89 Ba Huyen Thanh Quan, Ward 9, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Built in 1956, Xa Loi Pagoda is the first major Buddhist temple in Ho Chi Minh City constructed in a modern architectural style, as well as a significant witness to modern South Vietnamese history. The name \"Xa Loi\" (Relic) originates from the sacred Buddha relics housed within its tower. The temple\u0027s most prominent hallmark is a 32-meter, 7-story bell tower housing a two-ton bronze bell. In 1963, the South Vietnamese regime launched a raid here known as the Xa Loi Pagoda raids, giving the temple a unique place in Vietnam\u0027s modern religious and political history. Visiting here allows travelers not only to appreciate distinct temple aesthetics but also to ponder this dramatic chapter of history.", "name": "Xa Loi Pagoda", "transport": "Take bus 28 to the Ba Huyen Thanh Quan stop, or walk about 8 minutes from the War Remnants Museum."}, {"address": "180 Nguyen Dinh Chieu, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Built in 1911, the Archbishop\u0027s Palace of Ho Chi Minh City is a French colonial-era complex of profound historical and architectural value in District 3. The main building showcases elegant French colonial charm with yellow walls, green window frames, and graceful arches. The highlight of the compound is a wooden chapel built in 1799, originally the residence of Bishop Pigneau de Behaine. Constructed entirely of traditional Vietnamese timber using carved mortise-and-tenon joinery combined with Catholic motifs, it is one of the oldest surviving and best-preserved wooden structures in Ho Chi Minh City. Although parts of the interior open to the public sporadically, its rustic and solemn silhouette continues to fascinate history and architecture lovers.", "name": "Archbishop\u0027s Palace of Ho Chi Minh City \u0026 Ancient Chapel", "transport": "Take bus 150 to the Nguyen Dinh Chieu stop, or walk about 6 minutes from the War Remnants Museum."}, {"address": "202 Vo Thi Sau, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Founded in 1985, the Southern Women\u0027s Museum is housed in a former residence of a high-ranking South Vietnamese official in District 3. The museum is dedicated to highlighting the extraordinary contributions of southern Vietnamese women in historical evolution, national resistance, cultural heritage, and daily life. Spanning three floors of exhibition halls, it houses over 16,000 artifacts and rare photos, detailing everything from the evolution of the traditional Ao Dai and hand-woven textiles to stories of female heroines during the French and American conflicts. It is not merely a historical venue, but a cultural landmark for understanding the resilience and heritage of Vietnamese women.", "name": "Southern Women\u0027s Museum", "transport": "Take bus 30 or 150 to the Vo Thi Sau stop, or walk about 7 minutes from the Pink Church."}, {"address": "164/235 Tran Quoc Thao, Ward 9, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Meaning \"Moonlight Temple,\" Chantarangsay Pagoda was built in 1946 as Ho Chi Minh City\u0027s first and largest Theravada Khmer-style Buddhist temple. Tucked away in a quiet alley near the canal in District 3, the architecture radiates vibrant Theravada Buddhist and Cambodian Khmer artistic flavors. Inside, visitors will find exquisite golden stupas, mythical creature statues, and resplendent murals illustrating the life of Shakyamuni Buddha. During the Khmer New Year and Loy Krathong (Lantern Festival), Khmer monks and devotees gather here for grand celebrations, showcasing the unique multicultural tapestry of Ho Chi Minh City.", "name": "Chantarangsay Khmer Pagoda", "transport": "Take bus 28 to the Tran Quoc Thao stop, enter Alley 164, and walk about 3 minutes to arrive."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "289 Hai B\u00e0 Tr\u01b0ng, Ward 8, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Commonly known as the Pink Church, this is one of Ho Chi Minh City\u0027s most iconic Roman Catholic churches. Built in the late 19th century during the French colonial period, its architecture blends Romanesque and Gothic elements. Painted in a dreamlike pink with ornate white trim and a towering bell tower, it has become a must-visit landmark for Instagrammers and tourists alike. The internal cloisters and altar are equally exquisite, exuding a rich sense of European religious art.", "name": "T\u00e2n \u0110\u1ecbnh Church (Sacred Heart of Jesus Church)", "transport": "Take bus 03, 19, or 31 to the Hai B\u00e0 Tr\u01b0ng stop and walk for about 2 minutes, or take a Grab directly."}, {"address": "28 V\u00f5 V\u0103n T\u1ea5n, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | One of Ho Chi Minh City\u0027s most visited museums, focusing on the history and profound impact of the Vietnam War. Outside, various U.S. military tanks, armored vehicles, fighter jets, and heavy weaponry left behind from the war are displayed. Inside, powerful historical photos, documents, and equipment are showcased, including dedicated exhibits on the My Lai Massacre and the tragic generational effects of Agent Orange, offering a profound reflection on the cruelty of war and the value of peace.", "name": "War Remnants Museum", "transport": "Take a Grab taxi from Ben Thanh Market in District 1; it takes about 5 to 10 minutes."}, {"address": "202 V\u00f5 Th\u1ecb S\u00e1u, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | This unique museum intimately documents the significant contributions of Vietnamese women throughout history, wartime, and daily life. Divided into several thematic exhibition areas, it details the evolution of the traditional dress (\u00c1o D\u00e0i), women\u0027s handicrafts, agricultural tools, and the remarkable courage shown by Vietnamese women during anti-French and anti-American wars. Housing a wealth of historical photos and artifacts, it offers great insight into local culture and women\u0027s social status.", "name": "Southern Women\u0027s Museum", "transport": "Take bus 04, 152, or 150 to the V\u00f5 Th\u1ecb S\u00e1u stop, or take a Grab."}, {"address": "339 Nam K\u1ef3 Kh\u1edfi Ngh\u0129a, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | One of Ho Chi Minh City\u0027s largest and most iconic modern Buddhist temples, combining traditional Mahayana architecture with modern concrete structure technology. The nearly 40-meter-tall, 8-story pagoda is impressive, featuring intricate carvings of Buddha images and symbols. The serene temple grounds house a main hall dedicated to Shakyamuni Buddha, serving as a vital spiritual center for local worshippers, especially bustling on the 1st and 15th of the lunar month and during Buddhist festivals.", "name": "V\u0129nh Nghi\u00eam Pagoda", "transport": "Take bus 04 or 152 directly along Nam K\u1ef3 Kh\u1edfi Ngh\u0129a avenue, or take a Grab taxi."}, {"address": "89B B\u00e0 Huy\u1ec7n Thanh Quan, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Built in 1956, this is a historically important Buddhist sanctuary and a birthplace of the Buddhist reform movement in former South Vietnam. Its most prominent feature is a 7-story, 32-meter tall bell tower\u2014one of the tallest in Vietnam. Surrounded by lush greenery, the main hall houses a massive statue of Shakyamuni Buddha and sacred Buddha relics. Blending modern design with traditional Vietnamese Buddhist architectural style, it offers a solemn and peaceful atmosphere.", "name": "X\u00e1 L\u1ee3i Pagoda", "transport": "Take a Grab taxi from District 1 city center (about 10 minutes), or take a bus to the \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 stop and walk."}, {"address": "164/1 Tr\u1ea7n Qu\u1ed1c Th\u1ea3o, Ward 9, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Built in 1946, this was the first Khmer Theravada Buddhist pagoda in Ho Chi Minh City. Featuring vibrant Cambodian Khmer architecture, the temple sparkles with multi-tiered spires, golden carvings, and mythical beast statues. Stepping inside feels like being transported to Cambodia; the main hall walls are adorned with vivid murals depicting the life of Buddha, offering a unique cultural look distinct from traditional Vietnamese Mahayana Buddhism.", "name": "Chantarangsay Khmer Pagoda", "transport": "Recommended to take a Grab taxi or GrabBike directly into the alley off Tr\u1ea7n Qu\u1ed1c Th\u1ea3o Street."}, {"address": "38 K\u1ef3 \u0110\u1ed3ng, Ward 9, District 3, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Built in the mid-20th century, this large Catholic church is known for its grand fusion of Gothic and modern architectural styles. Featuring a spacious front plaza, its soaring main hall has exquisite pillars and stained-glass windows, accommodating thousands of worshippers. It serves as an influential religious art and spiritual community hub in Ho Chi Minh City, attracting devoted followers daily for prayer in a serene and sacred setting.", "name": "Ky Dong Church (Redemptorist Church of Saigon)", "transport": "Take bus 28 to the K\u1ef3 \u0110\u1ed3ng stop and walk for 2 minutes, or take a Grab directly."}, {"address": "220/21 Nguy\u1ec5n Tr\u1ecdng Tuy\u1ec3n, Ward 14, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Situated along the canal in District 3, Ph\u00e1p Hoa Pagoda is a historic ancient temple built in 1928. It boasts classic, elegant architecture with multi-tiered upturned eaves and intricate wood carvings. It is best known for its grand floating lantern festival during Vesak (Buddha\u0027s Birthday), when thousands of colorful lanterns float on the canal waters, creating a breathtaking scene of high cultural and spiritual value.", "name": "Ph\u00e1p Hoa Pagoda", "transport": "Take a Grab to the Tr\u01b0\u1eddng Sa canal side road or the alley entrance on Nguy\u1ec5n Tr\u1ecdng Tuy\u1ec3n Street and walk in."}], "name": "Culture, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "International Square (C\u00f4ng tr\u01b0\u1eddng Qu\u1ed1c T\u1ebf), Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Located in the heart of District 3, Ho Chi Minh City, Turtle Lake is a water garden plaza featuring a towering modernist concrete sculpture surrounded by a circular pool. Dozens of century-old trees form a lush, natural canopy overhead. An iconic landmark since the colonial era, it draws many locals in the early mornings and evenings to stroll around or sit under the leafy trees while enjoying Vietnamese street food and iced coffee. Walking along the circular lakeside promenade offers a rich sense of Saigon\u0027s history and a rare slice of urban oasis tranquility.", "name": "Turtle Lake Water Garden Square (C\u00f4ng tr\u01b0\u1eddng Qu\u1ed1c T\u1ebf)", "transport": "Take a Grab ride-hailing car or a bus to the \u0027C\u00f4ng tr\u01b0\u1eddng Qu\u1ed1c T\u1ebf\u0027 stop."}, {"address": "Ho\u00e0ng Sa \u0026 Tr\u01b0\u1eddng Sa Street, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Flowing through District 3, the Nhi\u00eau L\u1ed9c - Th\u1ecb Ngh\u00e8 Canal has been revitalized into one of Ho Chi Minh City\u0027s most beautiful urban waterfront greenways. Stretching several kilometers along Ho\u00e0ng Sa and Tr\u01b0\u1eddng Sa Streets, both banks are adorned with rich tropical flora, neatly manicured lawns, and colorful flowers. Every morning and evening, local residents gather here to jog, exercise, or take leisurely walks. At night, a cool breeze blows as ambient lights shimmer on the water and trees, creating a wonderfully relaxing scene full of authentic local life.", "name": "Nhi\u00eau L\u1ed9c - Th\u1ecb Ngh\u00e8 Canal Green Belt (District 3)", "transport": "Walk directly into the canal greenway from near the Tr\u1ea7n Qu\u1ed1c Th\u1ea3o or L\u00ea V\u0103n S\u1ef9 bridges in District 3."}, {"address": "Tr\u01b0\u01a1ng \u0110\u1ecbnh Street, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | District 3 is renowned for its well-preserved French-style tree-lined avenues, with Tr\u01b0\u01a1ng \u0110\u1ecbnh Street standing out as the most iconic natural green tunnel. Flanked by hundreds of towering mahogany and dipterocarp trees dating back to the French colonial era, their interlocking branches form a sprawling green dome overhead that blocks out the tropical heat. Strolling here under dappled sunlight, surrounded by charming colonial villas and artsy cafes, offers the finest taste of District 3\u0027s unique blend of nature and heritage.", "name": "Tr\u01b0\u01a1ng \u0110\u1ecbnh Street Green Canopy Corridor", "transport": "A 5-minute walk from Turtle Lake Park brings you right onto the leafy promenade of Tr\u01b0\u01a1ng \u0110\u1ecbnh Street."}, {"address": "Hai B\u00e0 Tr\u01b0ng Street, \u0110a Kao Ward, District 1 (Adjacent to District 3), Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Located near the border of District 3 and District 1, L\u00ea V\u0103n T\u00e1m Park is one of the largest urban park spaces in the area. Formerly the French Saint Massieu Cemetery, it was transformed into a spacious, tree-shaded public park. The park features dense tropical woods, wide lawns, towering ancient trees, and meticulously manicured flower beds. Equipped with well-maintained walking trails, children\u0027s playgrounds, and fitness equipment, it is a favorite spot for locals to escape the city bustle, enjoy fresh air, and exercise outdoors.", "name": "L\u00ea V\u0103n T\u00e1m Park", "transport": "Walk northeast along Hai B\u00e0 Tr\u01b0ng Street or take bus No. 03 or 19 to the L\u00ea V\u0103n T\u00e1m Park stop."}, {"address": "289 Hai B\u00e0 Tr\u01b0ng, Ward 8, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | While T\u00e2n \u0110\u1ecbnh Church is world-famous for its dreamy pink Gothic architecture, its inner Sacred Heart Garden is a hidden, exquisite oasis. Lush coconut palms, tropical flowers, and neatly trimmed shrubs complement the vibrant pink walls, creating a serene natural aesthetic. Walking along the cobblestone paths while listening to soft church bells and chirping birds allows visitors to soak in both colonial architectural beauty and graceful garden scenery.", "name": "T\u00e2n \u0110\u1ecbnh Church Garden \u0026 Courtyard", "transport": "Take a Grab or bus No. 03 directly to the \u0027Nh\u00e0 th\u1edd T\u00e2n \u0110\u1ecbnh\u0027 stop."}, {"address": "875 C\u00e1ch M\u1ea1ng Th\u00e1ng 8, Ward 15, District 10 (Border of District 3), Ho Chi Minh City", "feature": "\u2b50 4.2 Stars | Situated on the western edge of District 3, L\u00ea Th\u1ecb Ri\u00eang Park is a sprawling recreational green space rich in natural scenery. It features a large natural lake lined with weeping willows and dense trees that attract various bird species. The park boasts verdant walking trails, peaceful pavilions, flower displays, and recreational facilities. Whether breathing in the fresh morning air by the water or admiring the sunset reflections on the lake, it is a wonderful place to experience the relaxed local lifestyle of Saigon.", "name": "L\u00ea Th\u1ecb Ri\u00eang Park", "transport": "Take bus No. 13 along C\u00e1ch M\u1ea1ng Th\u00e1ng 8 Street or call a ride-hailing car to reach the park."}, {"address": "Tr\u1ea7n Qu\u1ed1c Th\u1ea3o Street, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Tr\u1ea7n Qu\u1ed1c Th\u1ea3o Street is a landscaped green avenue in District 3 bursting with natural charm and cultural heritage. The canopy of mature agarwood and ancient trees stretches across the street, punctuated by small pocket parks and flowerbeds. Thanks to the dense foliage, the air feels noticeably fresh. Tucked away among the greenery are elegant French colonial villas and garden restaurants. A stroll here lets you immerse yourself in both fresh phytoncides and the nostalgic colonial vibe of old Saigon.", "name": "Tr\u1ea7n Qu\u1ed1c Th\u1ea3o Green Avenue \u0026 Garden Spaces", "transport": "Stroll or ride a bicycle from the central area of District 3 to conveniently explore this scenic green avenue."}, {"address": "28 V\u00f5 V\u0103n T\u1ea7n, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Situated in the core of District 3, the War Remnants Museum features not only exhibition halls but also a spacious eco-courtyard that offers a tranquil, reflective atmosphere. Preserving decades-old tropical trees and lush lawns, the leafy shade softens the somber tone of the museum\u0027s exhibits. Wooden benches and open-air caf\u00e9 seating are scattered throughout the garden, inviting visitors to rest and ponder amid dappled sunlight and soothing greenery.", "name": "War Remnants Museum Green Courtyard", "transport": "Take bus No. 14 or 28 to the V\u00f5 V\u0103n T\u1ea7n stop, or walk about 7 minutes from Turtle Lake."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "289 Hai Ba Trung, Ward 8, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Built in 1870, this Roman Catholic church is world-famous for its rare and dreamy bright pink exterior, making it one of the most eye-catching and iconic photo spots in Ho Chi Minh City\u0027s District 3. Blending Gothic, Romanesque, and Baroque architectural styles, its pink-and-white carved columns and Gothic spires look fairytale-like against the blue sky. Whether taking a panoramic shot from the second-floor cafe across the street or capturing the interplay of light and shadow in the side cloister, you can easily snap stunning French-style romantic photos.", "name": "Tan Dinh Church (The Pink Church / Nh\u00e0 th\u1edd T\u00e2n \u0110\u1ecbnh)", "transport": "Take a Grab ride-hail service or bus #03 or #31 to Hai Ba Trung station and walk for about 1 minute."}, {"address": "Cong Truong Quoc Te, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Located at the center of a major traffic roundabout in District 3, Turtle Lake\u2014officially named International Square\u2014is a favorite nighttime gathering place and photo spot for local youth and tourists alike. Soaring modernist concrete pillars and crisscrossing bridges rise from the lake center, which once held a giant bronze turtle statue. In the evening, street food vendors gather here, surrounded by charming French-style cafes and trendy tea shops. Lit up at night, it offers a vibrant atmosphere ideal for experiencing Saigon\u0027s unique evening leisure culture and snapping photos.", "name": "Turtle Lake (H\u1ed3 Con R\u00f9a)", "transport": "A 10 to 15-minute walk from Tan Dinh Church, or take a Grab bike/car directly to the roundabout."}, {"address": "28 Vo Van Tan, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | One of the most visited museums in Ho Chi Minh City, this is an essential spot to gain deep insight into Vietnam\u0027s modern history and take impressive photos. The outdoor display area features heavy military hardware left behind by US forces during the Vietnam War, including US tanks, fighter jets, helicopters, and heavy artillery, creating an imposing backdrop for photos. Inside, a vast collection of authentic, historic photographs and artifacts silently convey the harsh reality of war and the preciousness of peace, inspiring deep reflection in every visitor.", "name": "War Remnants Museum (B\u1ea3o t\u00e0ng Ch\u1ee9ng t\u00edch Chi\u1ebfn tranh)", "transport": "Take a Grab ride or bus #14 or #28 to Vo Van Tan station."}, {"address": "339 Nam Ky Khoi Nghia, Ward 14, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Constructed between 1964 and 1971, Vinh Nghiem Pagoda is one of the largest and most architecturally exquisite modern Mahayana Buddhist temples in Ho Chi Minh City. Its centerpiece is a 7-story, nearly 40-meter-tall Quan Yin tower, constructed by pairing traditional Dai Viet architecture with modern concrete structures. Surrounded by lush greenery in a quiet, elegant setting, its sweeping eaves, detailed woodwork, and graceful Buddha statues attract photography lovers and devout worshippers alike, making it a landmark cultural site in District 3.", "name": "Vinh Nghiem Pagoda (Ch\u00f9a V\u0129nh Nghi\u00eam)", "transport": "Take a Grab or bus #04 or #152 along the main Nam Ky Khoi Nghia avenue to Chua Vinh Nghiem station."}, {"address": "287/2 Nguyen Dinh Chieu, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A trending cafe that blends secret Vietnam War history with retro vintage style. During the war, this building served as a secret liaison base and weapons cache for the Saigon Commandos. The venue meticulously preserves the underground tunnels, hidden trapdoor, and historic radio communication equipment used by commandos. Visitors can sample rich Vietnamese drip coffee and delicious Korean-style broken rice while exploring the narrow secret bunker. Full of 1970s nostalgic charm, every corner offers unique photography opportunities.", "name": "Do Phu Secret Bunker Cafe (C\u00e0 Ph\u00ea \u0110\u1ed7 Ph\u1ee7 - C\u01a1m T\u1ea5m \u0110\u1ea1i H\u00e0n)", "transport": "About a 7-minute Grab ride from District 1 city center into the alley on Nguyen Dinh Chieu Street."}, {"address": "89 Ba Huyen Thanh Quan, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Built in 1956, Xa Loi Pagoda served as the former headquarters of the Saigon Buddhist Association and holds a key place in modern Vietnamese Buddhist history. The temple features a prominent 7-story bell tower housing a massive two-ton bronze bell, with architecture that artfully combines modern geometric lines with traditional Oriental Zen design. Lush garden grounds create a tranquil environment, appealing to visitors interested in culture, history, and serene settings perfect for artistic photography.", "name": "Xa Loi Pagoda (Ch\u00f9a X\u00e1 L\u1ee3i)", "transport": "Take a Grab or bus #28 to Ba Huyen Thanh Quan station, followed by a 2-minute walk."}, {"address": "202 Vo Thi Sau, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Dedicated to showcasing the remarkable contributions and resilience of Vietnamese women throughout national history, wartime, and modern society. The museum features rich collections, with the highlight for photo-seekers being the vibrant exhibition of traditional \u00c1o D\u00e0i dresses across different periods alongside ethnic minority costumes. The dignified architecture and well-lit exhibition halls make it a stylish destination for learning about women\u0027s culture and capturing artistic portraits.", "name": "Southern Women\u0027s Museum (B\u1ea3o t\u00e0ng Ph\u1ee5 n\u1eef Nam B\u1ed9)", "transport": "Take a Grab or bus #04, #30, or #152 to Vo Thi Sau station."}, {"address": "38 Ky Dong, Ward 9, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Nestled in a quiet neighborhood in District 3, Ky Dong Church (Our Lady of Perpetual Help Church) was built in the 1950s and combines modern minimalism with classic Romanesque elements. The spacious interior is filled with natural light, featuring arched ceilings and colorful stained-glass windows that shimmer in the sun. Free from heavy commercialization, it offers a tranquil, solemn atmosphere. With well-kept garden grounds and a Marian grotto outside, it is a favored local spot for wedding photo shoots and peaceful reflection.", "name": "Ky Dong Church (Nh\u00e0 th\u1edd K\u1ef3 \u0110\u1ed3ng)", "transport": "Take a Grab or bus #28 to Ky Dong station and walk for about 3 minutes."}], "name": "Popular Photo Hotspots"}}, "name": "District 3 - Colonial Architecture and Pink Church Cultural Area"}, "district_5_cholon": {"categories": {"cat_1": {"items": [{"address": "710 \u0110. Nguy\u1ec5n Tr\u00e3i, Ward 11, District 5, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | Built in the late 18th century, Ba Thien Hau Temple (Su Cheng Assembly Hall) is one of the oldest and most iconic Mazu temples in Ho Chi Minh City\u0027s Chinatown (Ch\u1ee3 L\u1edbn). The architecture displays exquisite Cantonese porcelain mosaic and stone carvings, with intricate glazed ceramic figurines on the roof ridges telling tales of Chinese folklore and opera. The temple\u0027s antique interior features countless incense coils hanging from the ceiling, swirling with smoke when lit to create a deeply mystical and reverent atmosphere. Inside, historical artifacts from the Guangxu period of the Qing Dynasty, ancient bells, and finely carved wooden palanquins are preserved. It is not only a vital spiritual hub for local ethnic Chinese but also a must-see historical architectural treasure when visiting Ch\u1ee3 L\u1edbn.", "name": "Ba Thien Hau Temple (Su Cheng Assembly Hall / Ch\u00f9a B\u00e0 Thi\u00ean H\u1eadu)", "transport": "Take a Grab car or GrabBike directly to Nguy\u1ec5n Tr\u00e3i Street, or take city bus 01 or 56 to the Nguy\u1ec5n Tr\u00e3i stop and walk from there."}, {"address": "12 \u0110. L\u00e3o T\u1eed, Ward 11, District 5, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | Also known as Guanyin Temple, On Lang Pagoda was founded in the early 19th century by Hokkien immigrants from Jinjiang, Quanzhou. Dedicated to Guanyin (Goddess of Mercy) and Mazu, the temple embodies the essence of traditional Southern Min architecture, featuring upturned eaves and delicate porcelain mosaic craft (Jian-nian). Stepping inside, visitors can admire lifelike carved wooden pillars, resplendent shrines, and rustic brick walls. Its most notable tradition is the \u0027villain hitting\u0027 ritual performed during Jingzhe (Awakening of Insects), where worshippers beat paper figurines with shoes to drive away bad luck\u2014a fascinating display of local cultural faith.", "name": "On Lang Pagoda (On Lang Assembly Hall / H\u1ed9i Qu\u00e1n \u00d4n L\u0103ng)", "transport": "Located on L\u00e3o T\u1eed Street, about a 5-minute walk from Ba Thien Hau Temple, or take a taxi directly to L\u00e3o T\u1eed Street."}, {"address": "678 \u0110. Nguy\u1ec5n Tr\u00e3i, Ward 11, District 5, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | Also known as Guan Di Temple, Nghia An Assembly Hall was established by Teochew Chinese immigrants in Ch\u1ee3 L\u1edbn. The exterior is grand and vibrant, featuring a massive gold-lettered plaque above the main entrance and impressive carved wooden door guardians. The interior showcases the pinnacle of Teochew woodcarving craftsmanship, from gilded wood carvings and carved stone pillar bases to colorful ceramic figures on the roof. The temple primarily honors Guan Sheng Di Jun (Guan Yu), and the back hall houses a life-sized statue of his famous steed, the Red Hare. Worshippers often touch the horse\u0027s head or crawl beneath its belly to pray for good fortune and peace.", "name": "Nghia An Assembly Hall (Guan Di Temple / H\u1ed9i Qu\u00e1n Ngh\u0129a An)", "transport": "Located on Nguy\u1ec5n Tr\u00e3i Street near Ba Thien Hau Temple. Take a Grab ride or bus 01/56 to a nearby stop and walk."}, {"address": "802 \u0110. Nguy\u1ec5n Tr\u00e3i, Ward 14, District 5, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.3 stars | Also known as Zhangzhou Assembly Hall, Ha Chuong Assembly Hall is a Southern Min-style temple built in the early 19th century by immigrants from Zhangzhou. Its signature architectural feature is a pair of majestic carved stone dragon pillars at the entrance, displaying extraordinary 3D relief technique rarely seen in Vietnamese Chinese temples. The bright courtyard, soaring timber frame, and carved eaves convey a serene and solemn beauty. Dedicated to Mazu, it offers a quieter atmosphere compared to other popular spots, making it an ideal historical landmark for admiring traditional Southern Min stone carving.", "name": "Ha Chuong Assembly Hall (H\u1ed9i Qu\u00e1n H\u00e0 Ch\u01b0\u01a1ng)", "transport": "Take a Grab and get off near the intersection of Nguy\u1ec5n Tr\u00e3i Street and Tr\u1ecbnh Ho\u00e0i \u0110\u1ee9c Street; it is about a 2-minute walk."}, {"address": "184 \u0110. H\u00f9ng V\u01b0\u01a1ng, Ward 12, District 5, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | Built in 1902 by Minh Huong descendants and Cantonese merchants, Phuoc An Assembly Hall honors Guan Di and Hua Tuo (the God of Medicine). It is famed for its vibrant colors and rich carvings, with green-glazed ceramic figures, painted wood sculptures, and brassware adorning the verandas. Inside, the air is filled with rich sandalwood incense, and large spiral incense coils hang between the beams, creating a striking visual. The temple also features a beautifully carved wooden sacred horse where devotees attach brass bells to pray for blessings. Exceptionally well-preserved and brightly lit, it is highly photogenic and rewarding to visit.", "name": "Phuoc An Assembly Hall (H\u1ed9i Qu\u00e1n Ph\u01b0\u1edbc An)", "transport": "Located on H\u00f9ng V\u01b0\u01a1ng Boulevard; taking a taxi or Grab is the most convenient option, or take bus 06 or 56 to a nearby stop."}, {"address": "118 \u0110. Tri\u1ec7u Quang Ph\u1ee5c, Ward 11, District 5, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.2 stars | Built during the Xianfeng reign of the 19th century by Fuzhou immigrants, Tam Son Assembly Hall is one of the few ancient halls in Ch\u1ee3 L\u1edbn representing Fuzhou architecture and traditions. Featuring striking red walls and delicate green roof tiles, the interior layout is solemn and elegant. It was originally dedicated to Lady Jinhua (the goddess of fertility), attracting many devotees praying for children and the well-being of women and infants. The temple preserves numerous antique wooden plaques, stone steles, and carved shrines from the Tongzhi and Guangxu periods, offering visitors a profound sense of tranquil, historic charm.", "name": "Tam Son Assembly Hall (H\u1ed9i Qu\u00e1n Tam S\u01a1n)", "transport": "Located on Tri\u1ec7u Quang Ph\u1ee5c Street, just a 3- to 5-minute walk from Ba Thien Hau Temple, making it very accessible."}, {"address": "25 \u0110. H\u1ecdc L\u1ea1c, Ward 14, District 5, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | Built in 1900, Cha Tam Church (St. Francis Xavier Church) was established specifically for the Chinese Catholic community in Ch\u1ee3 L\u1edbn. Its unique architectural style seamlessly fuses European Gothic structures with traditional Chinese cultural elements, such as prominent Chinese couplets at the entrance, a Chinese pavilion-style belfry roof, and a red-and-gold Chinese-style altar. The church holds significant historical weight in modern Vietnam as the place where President Ng\u00f4 \u0110\u00ecnh Di\u1ec7m of the Republic of Vietnam took refuge before his arrest and death in 1963, making it a landmark of religious, artistic, and historical note.", "name": "Cha Tam Church (St. Francis Xavier Church / Nh\u00e0 th\u1edd Cha Tam)", "transport": "Located near the intersection of H\u1ecdc L\u1ea1c Street and Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Street. Take a Grab ride or bus 01 and walk a short distance."}, {"address": "380 \u0110. Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ward 11, District 5, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.3 stars | Established in the early 18th century by Ming Dynasty loyalists (Minh H\u01b0\u01a1ng), Minh Huong Gia Thanh Communal House is designated as a National Historical and Cultural Relic of Vietnam. The ancient architectural style seamlessly blends traditional Southern Chinese ancestral halls with Vietnamese timber construction. Inside hang numerous historically valuable ancient plaques, including imperial plaques bestowed by Nguyen Dynasty emperors. The masterful woodcarvings on the beams and pillars depict the long history of the Minh Huong people pioneering in Vietnam, making it a crucial architectural heritage site for understanding the origins and history of the Ch\u1ee3 L\u1edbn Chinese community.", "name": "Minh Huong Gia Thanh Communal House (\u0110\u00ecnh Minh H\u01b0\u01a1ng Gia Th\u1ea1nh)", "transport": "Located on the main artery Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Street. Easily reachable via city bus 01 or 139, or by Grab car/bike."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "254 Hoc Lac Street, Ward 14, District 5, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Built in 1900, this is an iconic Catholic church in Ho Chi Minh City\u0027s Cholon Chinatown. The church blends Gothic architecture with traditional Chinese color schemes and decorations reminiscent of Mazu temples. The entrance features a Chinese-style archway with Traditional Chinese couplets, and the interior altar possesses a strong Oriental aesthetic. Historically, former President Ngo Dinh Diem was captured here, making it an essential landmark for understanding the fusion of Chinese faith and modern history in HCMC.", "name": "Saint Francis Xavier Church (Cha Tam Church)", "transport": "Take bus 01 or 56 to Ch\u1ee3 B\u00ecnh T\u00e2y station, then walk for about 5 minutes."}, {"address": "120 Tran Binh Trong Street, Ward 2, District 5, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | Dating back to 1720, Cho Quan Church is one of the oldest Catholic churches in Ho Chi Minh City. Rebuilt in 1882, the current structure showcases distinctive arches and a soaring bell tower, blending Romanesque and Gothic architectural styles. The interior exudes a solemn serenity, adorned with elegant stained glass and delicate carved wooden statues\u2014standing as a testament to Saigon\u0027s multicultural history and the early spread of Catholicism in Southern Vietnam.", "name": "Cho Quan Church (Nh\u00e0 th\u1edd Ch\u1ee3 Qu\u00e1n)", "transport": "Take bus 139 to Tr\u1ea7n B\u00ecnh Tr\u1ecdng station, then walk for about 3 minutes."}, {"address": "116 Hung Vuong Street, Ward 9, District 5, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Located on Hung Vuong Boulevard in District 5, St. Joan of Arc Church was built in 1922 and is affectionately known as the \u0027Green Church.\u0027 This Gothic structure is famous for its unique pastel green exterior and towering spires, fronted by a spacious garden with a statue of the Virgin Mary. Its ribbed vaults and exquisite stained glass windows create a serene, peaceful ambiance, making it a masterpiece of French religious architecture in Cholon.", "name": "St. Joan of Arc Church (Nh\u00e0 th\u1edd Th\u00e1nh Jeanne d\u0027Arc)", "transport": "Take bus 06, 08, or 56 to B\u1ec7nh vi\u1ec7n R\u0103ng H\u00e0m M\u1eb7t station, then walk for about 2 minutes."}, {"address": "71 An Binh Street, Ward 6, District 5, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Situated on An Binh Street, St. Anthony Church is a key spiritual center for Cholon\u0027s local Chinese Catholic community. Built in the mid-20th century, it features a warm, minimalist Western architectural style with trilingual signage in Chinese, English, and Vietnamese. Reliefs and statues blending Eastern artistic elements flank the altar, reflecting the unique cultural inclusivity and tight-knit cohesion of District 5\u0027s Chinese Catholic parish.", "name": "St. Anthony Church (Nh\u00e0 th\u1edd An B\u00ecnh)", "transport": "Take bus 01 to Tr\u1ea7n H\u01b0ng \u0110\u1ea1o station, turn onto An Binh Street, and walk for about 4 minutes."}, {"address": "105 Tran Hung Dao Street, Ward 6, District 5, Ho Chi Minh City", "feature": "\u2b50 4.1 Stars | The District 5 Cultural Center is the arts and cultural hub of Cholon, frequently hosting exhibitions on calligraphy, ink wash painting, paper cutting, Cantonese opera, and traditional handicrafts. It showcases numerous historical artifacts and artistic creations from Chinese immigrants, along with regular cultural lectures and workshops. It serves as the ideal gateway for visitors looking to explore both traditional Chinese-Vietnamese arts and contemporary local creations.", "name": "District 5 Cultural Center Art Exhibition Hall", "transport": "Take bus 01, 45, or 139 to Trung t\u00e2m V\u0103n h\u00f3a Qu\u1eadn 5 station."}, {"address": "380 Tran Hung Dao Street, Ward 11, District 5, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Built in 1789, the Minh Huong Gia Thanh Communal House is a national historical and cultural heritage site, serving as a cultural museum for the Minh Huong people (early ethnic Chinese settlers in Vietnam). Inside, it preserves rare Qing Dynasty lacquer paintings, intricately carved wooden couplets, ancient bells, and royal decrees granted by Nguyen Dynasty emperors. The architecture blends southern Chinese courtyards with local Vietnamese elements, showcasing exquisite traditional woodcarving art and rich historical depth.", "name": "Minh Huong Gia Thanh Communal House", "transport": "Take bus 01 or 56 to Tr\u1ea7n H\u01b0ng \u0110\u1ea1o - Tri\u1ec7u Quang Ph\u1ee5c station, then walk for about 2 minutes."}, {"address": "710 Nguyen Trai Street, Ward 11, District 5, Ho Chi Minh City", "feature": "\u2b50 4.7 Stars | Tue Thanh Assembly Hall (Thien Hau Temple) is not only a thriving place of worship, but also an open-air museum of Southern Chinese ceramic art and stone sculpture. Built in 1760, this national monument features roof ridges adorned with late 19th-century Shiwan colorful ceramic figurines depicting classical Chinese opera characters and mythological stories. The hall also houses Qing Dynasty bronze bells, elaborately carved palanquins, and precious historical steles of immense artistic and archaeological value.", "name": "Tue Thanh Assembly Hall - Chinese Stone Carving \u0026 Ceramic Art Museum (Thien Hau Temple)", "transport": "Take bus 06, 56, or 139 to Nguy\u1ec5n Tr\u00e3i station, then walk for about 2 minutes."}, {"address": "678 Nguyen Trai Street, Ward 11, District 5, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | Established by Teochew immigrants in the 19th century, Nghia An Assembly Hall (also known as Guan Di Temple) is an architectural gem designated as a national heritage site. Its defining highlight is the exquisite Teochew woodcarving craftsmanship, with altars and beams fully adorned in gold leaf reliefs depicting flora, fauna, dragons, phoenixes, and scenes from the Romance of the Three Kingdoms. Towering stone dragon pillars, a wooden sacred boat, and ancient sedan chairs showcase Chaozhou\u0027s legendary traditional artistry right in Saigon.", "name": "Nghi An Assembly Hall - Guan Di Temple Woodcarving Art Gallery", "transport": "Take bus 56 or 139 to Nguy\u1ec5n Tr\u00e3i - Ch\u00e2u V\u0103n Li\u00eam station, then walk for about 3 minutes."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "An D\u01b0\u01a1ng V\u01b0\u01a1ng, Ph\u01b0\u1eddng 9, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 Stars | Van Lang Park is the most iconic large urban park and green recreational hub in District 5, located at the intersection of An Duong Vuong and Hong Bang streets. Shaded by lush trees, the park features a massive musical fountain pool and well-paved walking paths. Every morning and evening, local Chinese-Vietnamese residents and students gather here to exercise, take leisurely walks, join square dances, or engage in various outdoor activities. At night, the fountain lights up with a colorful light show, adding a romantic atmosphere. It is a fantastic spot to experience the local vibe of Cho Lon and unwind.", "name": "Van Lang Park (C\u00f4ng vi\u00ean V\u0103n Lang)", "transport": "Take bus routes 06, 11, or 56 to C\u00f4ng vi\u00ean V\u0103n Lang station; or take a Grab ride directly."}, {"address": "Nguy\u1ec5n V\u0103n C\u1eeb, Ph\u01b0\u1eddng 4, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.1 Stars | Situated on the border of District 5 and District 10, near Nguyen Van Cu Street, Hoa Binh Park is a rare green oasis in this bustling commercial district. The park boasts dense vegetation with many tall tropical trees that are decades old, providing excellent shade. Equipped with children\u0027s playground equipment, bench seating, and walking paths, it offers fresh air and a peaceful environment, making it a favorite spot for locals to bring their kids or for seniors to gather and chat.", "name": "Hoa Binh Park (C\u00f4ng vi\u00ean H\u00f2a B\u00ecnh)", "transport": "Take bus routes 06, 38, or 139 to Nguy\u1ec5n V\u0103n C\u1eeb station, then walk about 3 minutes."}, {"address": "\u0110\u01b0\u1eddng V\u00f5 V\u0103n Ki\u1ec7t, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.2 Stars | Extending along Vo Van Kiet Boulevard in District 5, the banks of the Tau Hu Canal have been carefully revitalized into a lush, open waterfront park promenade. Lined with numerous palm trees, vibrant flowers, and green lawns, it features scenic viewing platforms and outdoor fitness equipment. Perfectly blending Cho Lon\u0027s historic canal heritage with modern landscape greening, walking along the riverbank at sunset offers charming views, making it a great location for a stroll and capturing the waterfront ambiance of Cho Lon.", "name": "Tau Hu Canal Waterfront Promenade (B\u1edd k\u00e8 K\u00eanh T\u00e0u H\u1ee7 - V\u00f5 V\u0103n Ki\u1ec7t)", "transport": "Walkable along Vo Van Kiet Boulevard, or take a bus passing through V\u00f5 V\u0103n Ki\u1ec7t, or book a Grab ride to the District 5 canal section."}, {"address": "C\u00f4ng tr\u01b0\u1eddng An \u0110\u00f4ng, Ph\u01b0\u1eddng 9, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.0 Stars | Located near the bustling An Dong Market and Windsor Plaza Hotel in the heart of District 5, An Dong Park Plaza is an open urban plaza that combines shopping leisure with city greenery. Surrounded by tropical flowers, leafy trees, modern bench seating, and landscaped lighting, it is a popular spot for weary shoppers and locals to relax and enjoy a cool, refreshing break amidst the lively commercial district.", "name": "An Dong Park Plaza (C\u00f4ng vi\u00ean An \u0110\u00f4ng)", "transport": "A 1-minute walk from An Dong Market, or take bus routes 11, 45, or 56 to Ch\u1ee3 An \u0110\u00f4ng station."}, {"address": "\u0110\u01b0\u1eddng B\u00e3i S\u1eady, Ph\u01b0\u1eddng 1, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.0 Stars | Located behind Binh Tay Market (Ch\u1ee3 B\u00ecnh T\u00e2y) along Bai Say Street, this linear park was built over a reclaimed canal and is steeped in the history of old Cho Lon. Shaded by mature trees with smooth walking paths, it serves as a cherished hangout for local Chinese-Vietnamese neighbors for daily exercise, playing chess, and catching up. Strolling through allows you to experience the authentic daily pace of the Chinese neighborhood and witness locals of all ages enjoying leisurely moments under the shade.", "name": "Bai Say Street Linear Park (C\u00f4ng vi\u00ean B\u00e3i S\u1eady)", "transport": "About a 3-minute walk from the back exit of Binh Tay Market (Ch\u1ee3 B\u00ecnh T\u00e2y)."}, {"address": "26 Nguy\u1ec5n Th\u1ecb Minh Khai, Ph\u01b0\u1eddng 14, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.1 Stars | Situated in the central area of Cho Lon in District 5, the plaza in front of this historic post office is a charming small urban park that combines cultural heritage with green landscape. The plaza features elegant greenery and ancient trees, surrounding the French-colonial style post office and old street blocks. Every day, locals visit to walk and relax, while photography enthusiasts love to capture the blend of historical architecture and lush nature.", "name": "District 5 Post Office Green Plaza (C\u00f4ng vi\u00ean B\u01b0u \u0110i\u1ec7n Qu\u1eadn 5)", "transport": "Take bus routes 01, 56, or 139 to B\u1ebfn xe Ch\u1ee3 L\u1edbn (Cho Lon Bus Station), then walk about 2 minutes."}, {"address": "\u0110\u01b0\u1eddng Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ph\u01b0\u1eddng 6, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 3.9 Stars | Kim Dong Park is a cozy, charming neighborhood park in District 5, beloved by local residents and children. Featuring lush green lawns, dense tree canopies, children\u0027s play equipment, and fitness stations, it is clean, well-maintained, and filled with a strong sense of community life. It is an excellent micro-attraction for those looking to escape the commercial bustle and enjoy a moment of peaceful nature.", "name": "Kim Dong Park (C\u00f4ng vi\u00ean Kim \u0110\u1ed3ng)", "transport": "Take bus routes 01, 45, or 56 along Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Street, get off, and walk to the park."}, {"address": "217 H\u1ed3ng B\u00e0ng, Ph\u01b0\u1eddng 11, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 Stars | Located in the heart of District 5, the University of Medicine and Pharmacy at Ho Chi Minh City features open courtyards and green campus grounds that serve as a famous urban oasis. Towering trees decades old, exquisite flower beds, and elegant French-style academic buildings complement each other beautifully. The fresh air and tranquil setting draw visitors who enjoy lush plants and vintage architecture, immersing themselves in a rich academic atmosphere surrounded by greenery.", "name": "University of Medicine and Pharmacy Green Campus (Khu\u00f4n vi\u00ean Xanh \u0110\u1ea1i h\u1ecdc Y D\u01b0\u1ee3c TP.HCM)", "transport": "Take bus routes 05, 06, 08, or 56 and get off at the \u0110\u1ea1i h\u1ecdc Y D\u01b0\u1ee3c station."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "710 \u0110. Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 11, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 Stars | Built in the late 18th century, Ba Thien Hau Temple is one of the oldest and most iconic Chinese temples in Cho Lon, dedicated primarily to Mazu, the Goddess of the Sea. Its architecture incorporates exquisite Lingnan style, featuring incredibly intricate and vivid Shiwan ceramic figurines and glazed tile decorations on the roof ridges depicting traditional Chinese opera stories. Stepping inside, incense smoke fills the courtyard, with massive spiral incense coils hanging overhead. Sunbeams piercing through the swirling smoke create magical God rays, making it a top check-in spot for photography enthusiasts and Instagrammers alike.", "name": "Ba Thien Hau Temple (Su Cheng Assembly Hall)", "transport": "Take a Grab car/motorbike ride set to Nguy\u1ec5n Tr\u00e3i Street, or take Bus No. 01 or 56 and get off at a nearby stop, then walk a short distance."}, {"address": "57A Th\u00e1p M\u01b0\u1eddi, Ph\u01b0\u1eddng 2, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.2 Stars | Also known as Cho Lon Wholesale Market, Binh Tay Market was built in the 1920s through donations from the wealthy Chinese merchant Quach Dam. It is the largest wholesale market in Ho Chi Minh City. The building combines traditional Chinese retro tiled roofs with French yellow arched geometric structures, featuring a central garden courtyard housing a bronze statue of Quach Dam\u2014showcasing a unique French-Chinese eclectic architectural style. The vibrant yellow walls and vintage clock tower serve as popular photo backdrops, while the interior bustles with authentic local life and endless wholesale goods.", "name": "Binh Tay Market", "transport": "Take Bus No. 01 directly from District 1 city center to its final stop at Binh Tay Market, or take a Grab ride (approx. 20 minutes)."}, {"address": "678 \u0110. Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 11, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 Stars | Nghia An Assembly Hall is a classic temple established by the Teochew Chinese community, primarily dedicated to Lord Guan (Guan Yu). Renowned for its magnificent wood carvings, gold leaf ornamentation, and a life-sized statue of the Red Hare horse, the temple highlights rich Teochew craftsmanship. The towering red pillars at the entrance and intricately carved wooden beams create a striking visual impact. Grand festivals held during the Lantern Festival and Guan Yu\u2019s birthday draw crowds for blessings and stunning traditional-style photos.", "name": "Nghia An Assembly Hall (Guan Di Temple)", "transport": "Located on Nguy\u1ec5n Tr\u00e3i Street, just a few minutes\u0027 walk from Ba Thien Hau Temple. It is recommended to take a Grab or include it in a walking tour along the same route."}, {"address": "802 \u0110. Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 14, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 Stars | Also known as Zhangzhou Assembly Hall, Ha Chuong Assembly Hall was built by Hokkien immigrants from Zhangzhou to worship Mazu. Its defining feature is the extraordinary stone craftsmanship, notably a pair of massive, intricately carved dragon stone pillars at the entrance that showcase supreme Southern Min stone-carving artistry. Inside, colorful wooden beams, rustic red-brick walls, and light interplay in the courtyard make this a hidden gem for vintage-style photography.", "name": "Ha Chuong Assembly Hall", "transport": "Take a Grab ride set to 802 Nguy\u1ec5n Tr\u00e3i Street, or take Bus No. 56 and disembark at a nearby stop."}, {"address": "12 \u0110. L\u00e3o T\u1eed, Ph\u01b0\u1eddng 11, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 Stars | Built by Chinese immigrants from Jinjiang, Quanzhou, On Lang Assembly Hall is commonly known as the Guanyin Temple, dedicated to the Goddess of Mercy and other deities. Featuring vibrant Hokkien architecture, it boasts exquisite eaves, colorful porcelain mosaic decorations (Jianci), and rich traditional folklore customs. Its serene, classic atmosphere and steady stream of worshippers make it a captivating location for culture lovers and photographers.", "name": "On Lang Assembly Hall (Guanyin Temple)", "transport": "Located on L\u00e3o T\u1eed Street. Take a Grab to the intersection of L\u00e3o T\u1eed and Nguy\u1ec5n Tr\u00e3i streets, then walk in."}, {"address": "118 \u0110. Tri\u1ec7u Quang Ph\u1ee5c, Ph\u01b0\u1eddng 11, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 Stars | Founded in the mid-19th century by the Fuzhou Chinese community, Tam Son Assembly Hall is dedicated to Lady Jinhua (goddess of fertility) and Mazu. Unlike traditional temples with muted tones, this hall features an eye-catching pastel pink and green color scheme. The quiet courtyard is filled with lush greenery, antique wooden furniture, and painted tiles, making it a unique secret spot combining historic heritage with a surprisingly charming pastel vibe.", "name": "Tam Son Assembly Hall", "transport": "Take a Grab ride set to Tri\u1ec7u Quang Ph\u1ee5c Street. Conveniently located near An Dong Market and Ba Thien Hau Temple."}, {"address": "25 \u0110. H\u1ecdc L\u1ea1c, Ph\u01b0\u1eddng 14, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 Stars | Commonly known as Cha Tam Church, St. Francis Xavier Church was built in the early 20th century for local Chinese Catholics. Its uniqueness lies in its seamless blend of European Gothic architecture with traditional Chinese palace elements\u2014featuring Chinese pavilions and calligraphic couplets at the top, along with gold-lettered Chinese plaques at the altar. This rare Gothic-Chinese fusion makes it a historically significant and aesthetically striking landmark.", "name": "St. Francis Xavier Church (Cha Tam Church)", "transport": "Located on H\u1ecdc L\u1ea1c Street, just a 5-to-8-minute walk from Binh Tay Market. Ideal to combine with a visit to Binh Tay Market."}, {"address": "828 \u0110. Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 14, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.3 Stars | Also known as Bon Tou Gong Temple or Laoye Temple, Trieu Chau Assembly Hall is the spiritual heart of the Teochew diaspora in Cho Lon. Dedicated primarily to Bon Tou Gong (the local guardian deity), the temple features astonishing stone carvings, woodcraft, and plaster reliefs, especially the elaborate porcelain-mosaic dragons and mythical beasts along the rooflines. The aged red-brick walls and wooden entrance doors exude timeless charm, making it a top pick for oriental aesthetic photos.", "name": "Trieu Chau Assembly Hall (Laoye Temple)", "transport": "Located at the end of Nguy\u1ec5n Tr\u00e3i Street. Take a Grab ride directly to the location, or take a city bus to the Nguy\u1ec5n Tr\u00e3i Street stop in District 5."}], "name": "Top Check-in Spots"}}, "name": "District 5 - Cholon Chinatown and Traditional Market Area"}, "district_7_phumyhung": {"categories": {"cat_1": {"items": [{"address": "Khu \u0111\u00f4 th\u1ecb Ph\u00fa M\u1ef9 H\u01b0ng, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Starlight Bridge is one of the most iconic modern architectural landmarks in the Ph\u00fa M\u1ef9 H\u01b0ng urban area. Spanning approximately 170 meters across Crescent Lake, the bridge features a unique crescent-shaped streamlined design. Its highlight is the integrated system of hundreds of LED lights and fountains. As night falls, rainbow-like light cascading down with the water creates a dreamy scene reminiscent of stars falling onto the lake surface. As Vietnam\u0027s first pedestrian-only modern scenic bridge, Starlight Bridge seamlessly blends contemporary urban craftsmanship with landscape design, making it a top spot for locals and tourists to take evening strolls, go on dates, and capture photos.", "name": "Starlight Bridge (C\u1ea7u \u00c1nh Sao)", "transport": "Take a Grab or taxi from the city center for about 20-25 minutes; or take bus No. 34 to Crescent Mall station and walk for about 5 minutes."}, {"address": "C\u1ea7u Ph\u00fa M\u1ef9, Ph\u01b0\u1eddng T\u00e2n Ph\u00fa, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Opened in 2009, Ph\u00fa M\u1ef9 Bridge is Ho Chi Minh City\u0027s first major cable-stayed bridge. It serves as a vital traffic artery connecting District 7 with Th\u1ee7 \u0110\u1ee9c City (formerly District 2) and stands as a modern engineering marvel. With a total length exceeding 2,000 meters, its towering main towers and piano-string-like cables display a powerful geometric aesthetic along the Saigon River. From the viewpoint on the Ph\u00fa M\u1ef9 H\u01b0ng side, visitors can overlook the magnificent bend of the Saigon River and the distant skyline of downtown skyscrapers. Symbolizing Ho Chi Minh City\u0027s journey toward becoming a modern global metropolis, the bridge offers visually stunning views, whether silhouetted against a sunset or illuminated at night.", "name": "Ph\u00fa M\u1ef9 Bridge (C\u1ea7u Ph\u00fa M\u1ef9)", "transport": "It is recommended to take a taxi to the bridgehead viewpoint in District 7. Alternatively, take bus No. 20 to a nearby stop."}, {"address": "\u0110\u01b0\u1eddng T\u00f4n D\u1eadt Ti\u00ean, Ph\u01b0\u1eddng T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | Meticulously designed by internationally renowned architecture teams, The Crescent Waterfront is the heart and soul of the upscale Ph\u00fa M\u1ef9 H\u01b0ng residential district. Stretching along the crescent-shaped lake, the architecture seamlessly blends modern European colonnade design, expansive glass curtain walls, and lush green pedestrian promenades. It serves as a prime example of low-density, high-end modern architecture in an eco-friendly, waterfront environment that meets international standards. Lined with international restaurants, cafes, and luxury shopping centers, it offers an elegantly relaxed South Saigon lifestyle, perfectly showcasing the harmony between architecture and nature in contemporary urban planning.", "name": "The Crescent Waterfront (H\u1ed3 B\u00e1n Nguy\u1ec7t)", "transport": "About a 20-minute taxi ride from downtown District 1; or take bus No. 139 or 34 to Crescent Mall station and walk there directly."}, {"address": "06 Phan V\u0103n Ch\u01b0\u01a1ng, Ph\u01b0\u1eddng T\u00e2n Ph\u00fa, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Located on the shores of Crescent Lake in Ph\u00fa M\u1ef9 H\u01b0ng, Tajma Sago Castle is an iconic luxury landmark inspired by the Mughal classical aesthetics of India\u0027s Taj Mahal. Dominated by a pure white palette, the castle features intricate Islamic-style relief carvings and geometric arches on its exterior, while the interior houses an ultra-luxurious modern boutique hotel and art gallery space. The courtyard boasts a deep blue black-marble swimming pool and tropical gardens, reflecting a striking fusion of ancient Eastern palace design and contemporary luxury. This unique castle stands as the most legendary
