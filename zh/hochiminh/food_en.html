Ch\u1ee3 H\u00f2a B\u00ecnh (H\u00f2a B\u00ecnh Market) and walk about 1 minute."}, {"address": "68 B\u00f9i H\u1eefu Ngh\u0129a, Ph\u01b0\u1eddng 5, Qu\u1eadn 5, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 Stars | Tucked away in a market alley, this popular District 5 street stall serves comforting, thick, and smooth soup simmered long in rich broth, brimming with collagen. It comes loaded with chewy deep-sea fish maw, tender sweet shredded crab meat, century egg, and mushrooms. Every piping hot spoonful bursts with savory broth absorbed by the fish maw, beautifully enhanced by cilantro and white pepper. It\u2019s a beloved local comfort food for afternoon tea or late-night snacks.", "name": "H\u00f2a B\u00ecnh Market Fish Maw \u0026 Crab Soup (S\u00fap Cua Bong B\u00f3ng C\u00e1 C\u00f4 L\u1ed9c)", "transport": "Take a Grab to Ch\u1ee3 H\u00f2a B\u00ecnh and walk along B\u00f9i H\u1eefu Ngh\u0129a Street for about 2 minutes."}, {"address": "125 Ph\u00f9ng H\u01b0ng, Ph\u01b0\u1eddng 13, Qu\u1eadn 5, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 Stars | A traditional street rice-paste snack that has been filling the air with aroma for decades. Scooped fresh upon order, the warm steamed rice cake has a gooey, silky-soft texture that melts in your mouth with a rich rice flavor. Topped with fragrant stir-fried minced pork with wood ear mushrooms, crispy fried shallots, and cilantro, then drizzled with a warm sweet-and-savory fish sauce broth. This comforting, melt-in-your-mouth treat is a wonderful way for tourists to taste Ho Chi Minh City\u0027s nostalgic traditional pastries.", "name": "Ph\u00f9ng H\u01b0ng Traditional Hot Rice Cake (B\u00e1nh \u0110\u00fac N\u00f3ng B\u00e0 Gi\u00e0 - Ph\u00f9ng H\u01b0ng)", "transport": "Take a Grab to the entrance of Ph\u00f9ng H\u01b0ng Market; the stall is right there."}, {"address": "110 H\u00f9ng V\u01b0\u01a1ng, Ph\u01b0\u1eddng 9, Qu\u1eadn 5, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | A classic street food institution located at a major District 5 intersection, famous citywide for its signature dry Hu Tieu noodles (H\u1ee7 Ti\u1ebfu Kh\u00f4). Blanched to al dente perfection, the springy, chewy noodles are tossed in a secret savory-sweet sauce with crispy pork lard for irresistible aroma. Generously topped with fresh shrimp, meatballs, and char siu pork, it comes with a side bowl of sweet, rich bone broth. Combining chewy textures and hearty flavors, it showcases a marvelous blend of Teochew and Vietnamese culinary heritage.", "name": "C\u1ea3 C\u1ea7n Dry Noodles \u0026 Steamed Buns (H\u1ee7 Ti\u1ebfu C\u1ea3 C\u1ea7n)", "transport": "Take Bus 06 or 150, or a Grab to the intersection of H\u00f9ng V\u01b0\u01a1ng and Nguy\u1ec5n Tri Ph\u01b0\u01a1ng streets."}, {"address": "238 B\u00f9i H\u1eefu Ngh\u0129a, Ph\u01b0\u1eddng 4, Qu\u1eadn 5, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 Stars | Located in Chinatown, this unique street stall fuses Vietnamese baguette with Cambodian flavors. The baguettes are slathered with butter and a secret sweet and spicy sauce, then charcoal-grilled until golden and crackling crisp on the outside while staying soft inside. Topped with fragrant grilled sausage, pork floss, and sweet-and-sour pickled cucumbers, this irresistible combo of smoky, sweet, spicy, and crunchy textures makes it a bustling night market favorite in Ch\u1ee3 L\u1edbn.", "name": "Ch\u1ee3 L\u1edbn Cambodian Grilled Bread (B\u00e1nh M\u00ec N\u01b0\u1edbng Campuchia C\u00f4 \u0110i\u1ec7p)", "transport": "Take a Grab to B\u00f9i H\u1eefu Ngh\u0129a Street, located near the An \u0110\u00f4ng Market (Ch\u1ee3 An \u0110\u00f4ng) area."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "District 5 - Cholon Chinatown and Traditional Market Area"}, "district_7_phumyhung": {"categories": {"cat_1": {"items": [{"address": "58 B\u00f9i B\u1eb1ng \u0110o\u00e0n, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | A classic pho eatery located in the heart of the Phu My Hung business district. The broth is simmered with abundant beef bones for over 10 hours, creating a clear yet richly savory and naturally sweet flavor. Thick, tender beef slices are served over springy rice noodles topped with plenty of fresh green onions. A top choice for breakfast or a late-night snack among local residents and expats seeking authentic Northern Vietnamese beef pho.", "name": "Phu My Hung Traditional Beef Pho (Ph\u1edf Trang)", "transport": "Take Grab or a taxi to B\u00f9i B\u1eb1ng \u0110o\u00e0n Street in the Ph\u00fa M\u1ef9 H\u01b0ng area; it is within walking distance."}, {"address": "22-24 Nguy\u1ec5n V\u0103n Linh, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 stars | A legendary Southern Vietnamese broken rice brand. Their signature grilled pork chops are marinated in a secret sauce and charcoal-grilled to perfection\u2014slightly charred and crispy on the outside, juicy and tender inside. Served with fragrant broken rice, golden steamed egg loaf, and refreshing pickled daikon and carrots, all drizzled with special fish sauce for a rich, perfectly balanced sweet, savory, and tangy flavor. A must-try classic of Saigon\u0027s food culture.", "name": "Kieu Giang Broken Rice (C\u01a1m T\u1ea5m Ki\u1ec1u Giang)", "transport": "Take bus 102 or 139 to the Nguy\u1ec5n V\u0103n Linh stop, or go directly by Grab."}, {"address": "29 Nguy\u1ec5n Th\u1ecb Th\u1eadp, T\u00e2n Ph\u00fa, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | A famous 24-hour Phnom Penh noodle soup eatery featuring broth simmered for hours with pork bones and seafood for an intensely sweet, flavorful taste. The springy, delicate rice noodles soak up the rich soup, complemented by generous toppings including fresh shrimp, pork liver, minced pork, and quail eggs. Crisp shrimp and savory liver paired with fresh lettuce and cilantro create a wonderfully refreshing meal, attracting both local foodies and late-night diners.", "name": "Thanh Dat Hu Tieu Nam Vang (H\u1ee7 Ti\u1ebfu Nam Vang Th\u00e0nh \u0110\u1ea1t)", "transport": "Located on the main thoroughfare of Nguy\u1ec5n Th\u1ecb Th\u1eadp Street; taking Grab or a taxi is the most convenient option."}, {"address": "208 Ph\u1ea1m Th\u00e1i B\u01b0\u1eddng, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | An authentic Hue beef noodle specialty shop. The broth is infused with rich lemongrass, shrimp paste, and chili oil, giving it a uniquely spicy, aromatic, and deeply comforting flavor profile. The thick, round rice noodles are smooth and springy, accompanied by tender simmered beef shank, handmade pork meatballs, and blood pudding. An absolute must-visit for lovers of bold, aromatic traditional dishes.", "name": "O Thanh Bun Bo Hue (B\u00fan B\u00f2 Hu\u1ebf O Thanh)", "transport": "Located in the Ph\u00fa M\u1ef9 H\u01b0ng residential area, about a 10-minute walk from Crescent Mall, or accessible via Grab."}, {"address": "Crescent Mall, 101 T\u00f4n D\u1eadt Ti\u00ean, T\u00e2n Ph\u00fa, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | A sophisticated Vietnamese restaurant in Crescent Mall that elevates classic street food into a stylish dining experience. Signature Vietnamese grilled dishes and claypot specialties preserve authentic local flavors with perfectly tender meat and precise seasonings. The elegant decor blends 1950s Saigon nostalgia with modern aesthetics, allowing diners to comfortably enjoy authentic home-style Vietnamese cuisine in a refined environment.", "name": "Di Mai Traditional Vietnamese Restaurant (D\u00ec Mai Restaurant - Crescent Mall)", "transport": "Take bus 139 or D1 to Crescent Mall and head to the 3rd floor."}, {"address": "88 B\u00f9i B\u1eb1ng \u0110o\u00e0n, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Traditional Hanoi-style grilled pork noodles cooked over charcoal, imparting an irresistible smoky aroma and juicy flavor to pork belly and patties. Dip springy rice noodles into warm, sweet-and-savory fish sauce broth along with grilled meats and abundant fresh herbs. The refreshing balance of flavors makes it an addictively satisfying meal, and the best place in Phu My Hung to taste authentic Northern flavors.", "name": "Bun Cha Ha Noi 1982 (B\u00fan Ch\u1ea3 H\u00e0 N\u1ed9i 1982)", "transport": "Located in the Korean district on B\u00f9i B\u1eb1ng \u0110o\u00e0n Street in Ph\u00fa M\u1ef9 H\u01b0ng; easily reached by Grab."}, {"address": "74 Nguy\u1ec5n Th\u1ecb Th\u1eadp, B\u00ecnh Thu\u1eadn, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 stars | Renowned for its golden, crispy Vietnamese sizzling pancakes (B\u00e1nh X\u00e8o), featuring a light coconut milk and turmeric aroma. The crispy batter is stuffed with fresh shrimp, sliced pork, mung beans, and crunchy bean sprouts. Wrap pieces in fresh lettuce and mustard greens, then dip into sweet-and-spicy fish sauce for a delightful contrast of textures. Highly popular among families and tourists alike.", "name": "An La Ghien Banh Xeo (B\u00e1nh X\u00e8o \u0102n L\u00e0 Ghi\u1ec1n)", "transport": "Take bus 34 or 139 to Nguy\u1ec5n Th\u1ecb Th\u1eadp Street, or take a Grab."}, {"address": "55 Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | An upscale B\u00e1nh M\u00ec shop in the heart of Phu My Hung. The baguettes feature a delightfully crispy crust that crunches with every bite while remaining soft and airy inside. Stuffed with savory Vietnamese ham, signature pate, cilantro, cucumber, and pickled daikon and carrots, it strikes a perfect balance of savory, sweet, and tangy flavors. Clean, high quality, and consistent, it\u0027s a favorite daily grab-and-go option for local residents.", "name": "Banh Mi 362 (B\u00e1nh M\u00ec 362)", "transport": "Located along the Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh boulevard, about a 3-minute walk from Sky Garden residential complex."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "1 \u0110\u01b0\u1eddng s\u1ed1 39, T\u00e2n Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A top-tier Australian-style brunch paradise tucked away in a quiet, lush alley of Phu My Hung. Decorated in a colonial vintage style paired with tropical greenery, the ambience is exceptionally refined. The signature Eggs Benedict is served atop crispy sourdough bread; when sliced open, the poached egg yolk flows like a golden waterfall, perfectly blending with rich, silky hollandaise sauce and smoked salmon for a velvety, layered taste. The Avocado Poke Bowl is equally refreshing and guilt-free. Paired with a bright, fruity cold brew coffee, it is a favorite slow-living brunch destination for expats and tourists alike.", "name": "The Vintage Emporium District 7", "transport": "It is recommended to take a Grab taxi from District 1, Ho Chi Minh City for about 20 to 25 minutes to arrive at Street 39 in Phu My Hung."}, {"address": "169-170 Ph\u1ed1 Ti\u1ec3u Nam, T\u00e2n Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | The District 7 flagship store of Vietnam\u0027s world-renowned artisanal chocolate brand. Upon entering, you are greeted by the rich, pure aroma of roasting cocoa beans, and the bright, spacious interior allows guests to watch the chocolate-making process. The must-try signature \u0027Classic Hot Chocolate\u0027 uses premium local Vietnamese cocoa, delivering a rich, velvety balance of bitter and sweet with subtle fruity notes. The \u0027Cocoa Almond Croissant\u0027 features a flaky crust that crackles at first bite, filled with warm melted dark chocolate\u2014rich without being overly sweet, making it a favorite for dessert lovers and international travelers.", "name": "Maison Marou District 7", "transport": "About an 8-minute walk from Crescent Mall, or take a Grab taxi directly to Ph\u1ed1 Ti\u1ec3u Nam Street."}, {"address": "99 Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh, T\u00e2n Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A cozy Korean-style specialty pour-over cafe beloved by the Phu My Hung Korean community. The space is minimalist and warm with a sleek Korean aesthetic. The store\u0027s signature \u0027Freshly Baked Ice Cream Waffle\u0027 boasts a golden, crispy exterior and a chewy, soft interior; paired hot with a generous scoop of vanilla ice cream and fresh fruit, the hot-and-cold combination is absolutely stunning. Complemented by their home-roasted Korean dark-roast iced Americano\u2014perfectly balanced in bitterness and sweetness with a pleasant finish\u2014it is a favorite daily afternoon tea and brunch spot for local residents and youth.", "name": "Awesome Coffee", "transport": "Take a Grab taxi to Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh Boulevard; located on the ground floor of the Grand View complex."}, {"address": "CR2-06, Crescent Mall, 107 T\u00f4n D\u1eadt Ti\u00ean, T\u00e2n Ph\u00fa, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A luxurious bistro cafe located right on the banks of Crescent Lake, seamlessly blending French classicism with traditional Vietnamese aesthetics. The signature Vietnamese Drip Coffee (C\u00e0 Ph\u00ea S\u1eefa \u0110\u00e1) uses premium selected beans to filter a deep, aromatic brew that pairs perfectly with sweet condensed milk beneath for a smooth, refreshing cold drink. Brunch items like the \u0027Duck Breast B\u00e1nh M\u00ec\u0027 and \u0027Pan-seared Scallop Pho\u0027 elevate traditional street foods, attracting countless tourists with exquisite plating and stunning lake views.", "name": "RuNam Bistro Crescent Mall", "transport": "Take a Grab to the lake side of Crescent Mall, then walk straight to the 1st floor waterfront storefront."}, {"address": "108 Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh, T\u00e2n Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Phu My Hung\u0027s most iconic Korean artisanal bakery cafe, producing fresh, aromatic bread every morning. The wildly popular \u0027Garlic Butter Cream Cheese Bread\u0027 is baked to a crispy golden finish; slicing it open reveals a rich, overflowing savory-sweet garlic cream cheese filling with a soft, pillowy texture. Paired with a cold Fresh Milk Latte\u2014blending rich dairy with smooth espresso\u2014it offers great portions and delicious flavor, making it a hit for local breakfast runs or relaxing tourist breaks.", "name": "Artisan Bakery \u0026 Cafe", "transport": "Take a Grab taxi to Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh Street; just a few minutes\u0027 walk from the Sky Garden community."}, {"address": "R4-25-26 Ph\u1ea1m V\u0103n Ngh\u1ecb, Sky Garden 1, T\u00e2n Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A classic chain cafe featuring a nostalgic North Vietnamese army aesthetic, with a relaxed and easygoing vibe in its District 7 branch. The timeless signature \u0027Coconut Ice Blended Coffee\u0027 (C\u00e0 Ph\u00ea C\u1ed1t D\u1eeba) fuses rich coconut smoothie with bold Vietnamese espresso, creating an icy, creamy burst of flavor that is refreshing and delightfully sweet. Paired with hot French bread dipped in condensed milk, it is the best way to experience a classic, local-style Vietnamese brunch.", "name": "C\u1ed9ng C\u00e0 Ph\u00ea - Sky Garden", "transport": "Set your destination on Grab to the Ph\u1ea1m V\u0103n Ngh\u1ecb pedestrian street inside Sky Garden 1."}, {"address": "1 Phan Khi\u00eam \u00cdch, T\u00e2n Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A highly popular bakery-cafe hybrid located in the heart of Phu My Hung\u0027s residential area. The store serves a wide array of freshly made sandwiches and delicate French pastries. The signature \u0027Ham \u0026 Cheese Croissant Sandwich\u0027 features buttery, flaky pastry layers filled with savory ham and melted cheese, making every bite hearty and satisfying. Paired with a refreshing Sparkling Cold Brew to beat the heat, it is a morning favorite among local expat families and professionals.", "name": "Paris Baguette Ph\u00fa M\u1ef9 H\u01b0ng", "transport": "Take a Grab taxi near the intersection of Phan Khi\u00eam \u00cdch and Nguy\u1ec5n V\u0103n Linh."}, {"address": "157 Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh, T\u00e2n Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A legendary local Vietnamese tea and coffee brand with a long history, featuring a bright and spacious branch in District 7. The wildly famous \u0027Ph\u00fac Long Peach Oolong Tea\u0027 offers a rich, fragrant tea base that is sweet with zero astringency, loaded with juicy, tender peach slices for a crisp and refreshing drink. Meanwhile, their traditional Iced Milk Coffee uses dark roasted beans to create a robust, bold brew softened by sweet condensed milk, making it a must-visit destination for travelers wanting to experience authentic Vietnamese tea and coffee culture.", "name": "Ph\u00fac Long Coffee \u0026 Tea - Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh", "transport": "Take a Grab taxi to the main avenue of Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh; the storefront is prominent and easy to spot."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "CR2-03-04 Crescent Mall, 107 T\u00f4n D\u1eadt Ti\u00ean, T\u00e2n Ph\u00fa, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Situated along the romantic Crescent Lake in Ph\u00fa M\u1ef9 H\u01b0ng, offering stunning waterfront views. The bistro specializes in modern Western and Asian fusion cuisine. The popular charcoal-grilled crispy beef short ribs are crispy on the outside and tender on the inside, locking in rich juices served with a silky custom red wine sauce. The seared seafood platter features fresh local sea prawns and cuttlefish, seared to a golden crisp with a smoky aroma and satisfying chew. At night, illuminated with charming lights, sipping signature cocktails in the gentle breeze creates a lovely ambiance, highly popular among foreign business professionals and local middle-class patrons.", "name": "Boomerang Bistro Saigon", "transport": "Take a Grab or taxi to the Crescent Lake promenade behind Crescent Mall, then walk about 2 minutes."}, {"address": "2-4 \u0110\u01b0\u1eddng s\u1ed1 2, Khu H\u01b0ng Gia 1, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Perfectly bringing Brussels\u0027 vintage industrial style to Ph\u00fa M\u1ef9 H\u01b0ng, District 7. Serving a variety of malt craft beers brewed locally in Vietnam using authentic Belgian recipes, paired with classic European and Vietnamese bar bites. The signature Belgian Witbier-steamed mussels are plump and sweet with hints of citrus and beer malt aroma\u2014dipping freshly baked baguette into the broth is absolute perfection! The crispy pork knuckle boasts an ultra-crispy skin with juicy, tender meat inside. Combining foreign craft beer culture with top-tier ingredients, it\u2019s the top choice for an evening drink with friends.", "name": "Belgo Belgian Craft Beer Brewery - Phu My Hung", "transport": "About a 5-minute walk from the Ph\u00fa M\u1ef9 H\u01b0ng Sky Garden pedestrian area, or take a Grab directly to the entrance of H\u01b0ng Gia 1 Area."}, {"address": "514 Nguy\u1ec5n Th\u1ecb Th\u1eadp, T\u00e2n Quy, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | A specialty bistro bursting with Latin American vibrant passion, featuring warm earthy interior tones and lush tropical plants. The signature Latin Ceviche uses fresh daily catch cured in zesty lime juice, offering a refreshing citrus kick with tender fish, perfectly paired with crunchy tortilla chips. The slow-roasted Latin short ribs melt in your mouth with deep aromatic notes of cumin and smoked chili. Their signature Tequila cocktails are a standout, drawing foodies who love unique international cuisine.", "name": "Sol Kitchen \u0026 Bar District 7", "transport": "Located on the main thoroughfare Nguy\u1ec5n Th\u1ecb Th\u1eadp; taking a taxi or Grab motorbike directly to the entrance is recommended."}, {"address": "88 Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.7 stars | A secret garden bistro tucked away by the river in Ph\u00fa M\u1ef9 H\u01b0ng, featuring high-end French romantic dining and a private atmosphere. The signature pan-seared foie gras is golden and crispy on the outside, melting in your mouth with rich flavor, balanced beautifully by sweet-and-sour berry sauce and crispy toast. The pan-seared black truffle duck breast offers tender pink meat bursting with juice, springy texture, and rich woody truffle notes. Guests arrive at this waterfront garden via the restaurant\u0027s boat; the breathtaking river views and exquisite cuisine make it a popular date spot for couples and tourists.", "name": "Mars Venus Restaurant - Island Phu My Hung", "transport": "Take a Grab to the intersection of Nguy\u1ec5n \u0110\u1ee9c C\u1ea3nh Street, then take the restaurant\u0027s private boat from the pier or walk along the waterfront path."}, {"address": "59 H\u00e0 Huy T\u1eadp, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | This long-established iconic brand opened an upscale branch in Ph\u00fa M\u1ef9 H\u01b0ng, District 7, elevating traditional Vietnamese comfort food into a refined dining experience. The famous signature Flying Claypot Rice (C\u01a1m Ni\u00eau) features staff breaking the clay pot tableside and tossing the rice across the air to be caught, creating a theatrical show. The claypot rice is delightfully crispy and chewy, paired with braised snakehead fish in caramelized fish sauce or braised pork belly. The sweet and savory sauces coating the fragrant rice captivate locals and tourists alike.", "name": "C\u01a1m Ni\u00eau S\u00e0i G\u00f2n - Ph\u00fa M\u1ef9 H\u01b0ng", "transport": "About an 8-minute walk from Ph\u00fa M\u1ef9 H\u01b0ng Central Park, or take a Grab directly to H\u00e0 Huy T\u1eadp Street."}, {"address": "02-06 Phan V\u0103n Ch\u01b0\u01a1ng, T\u00e2n Ph\u00fa, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Set inside a castle-like building along Crescent Lake, blending opulent Oriental aesthetics with a modern Western bistro experience. Renowned for refined local Vietnamese seafood and Asian fusion dishes\u2014especially the Lemongrass Steamed Lobster, featuring succulently firm meat in a sweet, herbal broth. The Indonesian Beef Satay skewers sizzle on the grill, served with rich, savory, and lightly spicy peanut sauce. Guests can sip craft cocktails in a lush tropical garden by the pool; this exclusive castle dining experience is a landmark of Ph\u00fa M\u1ef9 H\u01b0ng\u0027s luxury district.", "name": "Chloe Gallery - Castle Dining \u0026 Bistro", "transport": "Located by Crescent Lake; take a Grab to the corner of Phan V\u0103n Ch\u01b0\u01a1ng Street to spot the striking white castle building."}, {"address": "42 B\u00f9i B\u1eb1ng \u0110o\u00e0n, T\u00e2n Phong, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | A specialty regional bistro that elevates the traditional Northern Vietnamese street food \u0027B\u00fan \u0110\u1eadu M\u1eafm T\u00f4m\u0027 (crispy tofu with rice noodles and fermented shrimp paste) into a chic, nostalgic dining setting. The signature combo platter includes golden handmade fried tofu crispy outside and silky inside, savory blood sausage, boiled pork belly, and crispy spring rolls. The soul sauce\u2014fermented shrimp paste\u2014is custom whisked with lime and chili into a frothy mix, giving an intensely bold flavor explosion. The charming yellow walls and red tiles recreate Hanoi\u0027s Old Quarter vibes.", "name": "\u0110\u1eadu Homme - Northern Vietnamese Cuisine", "transport": "Located on B\u00f9i B\u1eb1ng \u0110o\u00e0n Street in the heart of Ph\u00fa M\u1ef9 H\u01b0ng\u0027s Koreatown; easily accessible directly via Grab."}, {"address": "436 Nguy\u1ec5n Th\u1ecb Th\u1eadp, T\u00e2n Quy, Qu\u1eadn 7, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | A highly famous modern American BBQ smoked meats and local craft beer bistro in Ho Chi Minh City. The signature Baby Back Ribs are slow-smoked for hours over cashew wood and spices, becoming fall-off-the-bone tender and glazed in rich sweet-and-spicy BBQ sauce. Every bite bursts with smoky char and juice, perfectly complemented by crispy sweet potato fries and homemade pickled veggies. Paired with a local Vietnamese craft IPA, its hearty meat-and-beer vibe makes it a favorite spot for young locals and tourists alike.", "name": "Qu\u00e1n \u00dat \u00dat Craft Beer \u0026 BBQ District 7", "transport": "Located in the bustling Nguy\u1ec5n Th\u1ecb Th\u1eadp commercial district; taking a Grab or taxi is the most convenient option."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "52 Street 36, Tan Quy, District 7, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | An upscale vegetarian restaurant hidden in a serene, lush garden near Phu My Hung. Exquisite Vietnamese fusion vegetarian dishes include \u0027Coconut Lotus Seed Rice in Lotus Leaf\u0027 and \u0027Green Papaya Passionfruit Salad.\u0027 The rice absorbs the fragrant lotus seeds and rich coconut milk, resulting in a soft, chewy texture with a subtle sweet finish. The elegant French colonial garden design makes it a sought-after spot for tourists and local expat executives.", "name": "Chay Garden - Vegetarian Restaurant \u0026 Tea House", "transport": "It is recommended to take a Grab or taxi; about an 8-minute drive from Crescent Mall."}, {"address": "105 Nguyen Thi Thap, Tan Hung, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A famous vegetarian restaurant renowned for its authentic organic macrobiotic brown rice dishes. Signature items include \u0027Brown Rice Shiitake Turmeric Porridge\u0027 and \u0027Crispy Fried Brown Rice Cakes.\u0027 The porridge is simmered to a silky smoothness, blending mildly spicy turmeric with rich mushroom aromas to warm the stomach. The brown rice cakes are crispy on the outside, soft and chewy on the inside. Highly favored by health-conscious locals and expats.", "name": "Khai Minh Organic \u0026 Macrobiotic Vegetarian", "transport": "Take Bus 139 to Nguyen Thi Thap station and walk for 3 minutes, or take a taxi directly."}, {"address": "62 Lam Van Ben, Tan Kieng, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A hugely popular local vegetarian spot offering high quality at budget-friendly prices. Highly recommended are the \u0027Vegetarian Pho (Ph\u1edf Chay)\u0027 and \u0027Crispy Vegetarian Spring Rolls.\u0027 The pho broth is slow-simmered for over 10 hours with various fruits, vegetables, and licorice root, creating an unbelievably sweet and flavorful broth. Served with broth-soaked vegan meat slices and springy rice noodles, it offers rich, non-greasy layers of flavor\u2014a comforting delight you shouldn\u0027t miss when visiting the Phu My Hung area.", "name": "Tam Duc Vegetarian Restaurant", "transport": "Take a Grab bike or taxi to Lam Van Ben Street, near Tan Kieng Primary School."}, {"address": "21 Street 10, Tan Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | An internationally renowned vegan brand located in the heart of Phu My Hung\u0027s residential area. Signatures include \u0027Thai Spicy \u0026 Sour Veggie Hot Pot\u0027 and \u0027Western Veggie Burger.\u0027 The hot pot broth is zesty, spicy, and appetite-stimulating, paired with an abundance of fresh organic mushrooms and mountain vegetables. When boiling, it releases strong aromas of lemongrass and kaffir lime leaves, delivering a vibrant, spicy taste that attracts countless foreign tourists and strict vegans.", "name": "Loving Hut Organic Veggie - Phu My Hung", "transport": "About a 10-minute walk from the Sky Garden community in Phu My Hung."}, {"address": "38 Street 79, Tan Quy, District 7, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A serene, Zen-inspired vegetarian space with a modern hipster vibe. Highlights include \u0027Golden Tofu with Truffle Sauce\u0027 and \u0027Vietnamese Claypot Veggie Fish with Ginger.\u0027 The tofu features a golden, crispy crust with a silky-soft interior, rendered irresistible with special truffle sauce. The veggie fish claypot is savory and perfectly pairs with rice, flawlessly mimicking the fibrous texture of real fish. Its unique, sophisticated seasoning is a hit among young foodies.", "name": "Thao Moc Vegetarian Restaurant", "transport": "It is recommended to take a Grab to near the intersection of Street 79 and Nguyen Thi Thap."}, {"address": "390 Nguyen Thi Thap, Tan Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | An established local vegetarian spot offering a rich buffet alongside exquisite \u00e0 la carte dishes. Recommended is the \u0027Vegetarian Vietnamese Crepe (B\u00e1nh X\u00e8o Chay),\u0027 featuring a golden, crispy shell stuffed with bean sprouts, shiitake mushrooms, and mung beans. Wrap it in fresh lettuce and dip into custom vegan fish sauce; the ultimate satisfying crunch and herbal freshness burst in your mouth, leaving an unforgettable aftertaste.", "name": "Hoang Kim Vegetarian Restaurant", "transport": "Take Bus 34 or 102 to Nguyen Thi Thap station; the bright red sign will be clearly visible upon arrival."}, {"address": "184 Nguyen Thi Thap, Binh Thuan, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A cozy vegetarian eatery featuring home-style flavors and affordable prices. Special recommendations include \u0027Sizzling Veggie Beef Tenderloin\u0027 and \u0027Spicy \u0026 Sour Vegetarian Hue Noodle Soup (B\u00fan B\u00f2 Hu\u1ebf Chay).\u0027 The Bun Bo Hue broth is infused with enticing aromas of lemongrass and chili oil, complemented by chewy rice noodles and remarkably realistic plant-based beef. Hearty and multi-layered, it is a daily favorite among local residents.", "name": "An Lac Vegetarian Restaurant", "transport": "Take a taxi or Grab to the main road along Nguyen Thi Thap."}, {"address": "45 C Street, Canh Vien 2 Complex, Phu My Hung, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A hidden, elegant restaurant combining exquisite Zen tea art with modern vegetarian cuisine. Must-tries include \u0027Tricolor Lotus Seed \u0026 Lily Bulb Sweet Soup\u0027 and \u0027Fresh Veggie Rainbow Spring Rolls.\u0027 The rainbow rolls wrap fresh avocado, red cabbage, and shiso leaves, dipped in a custom peanut-sesame sauce\u2014refreshing, juicy, and bursting with flavor. The tranquil dining environment makes it the perfect sanctuary for tourists to unwind and enjoy light bites.", "name": "Hoa Tam Vegetarian \u0026 Tea House", "transport": "Located inside the upscale Canh Vien 2 complex in Phu My Hung; taking a Grab from Crescent Mall takes about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "40B Nguy\u1ec5n Th\u1ecb Th\u1eadp, T\u00e2n H\u01b0ng, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Authentic coastal-style street food located in a bustling area of District 7. Their Vietnamese mini savory shrimp pancakes (B\u00e1nh Kh\u1ecdt) feature a golden, crispy base topped with a juicy, sweet whole shrimp and rich coconut cream. Crunching into a bite releases an explosion of aroma, perfect when wrapped in fresh lettuce and herbs and dipped in sweet and sour fish sauce. Crisp, refreshing, and non-greasy, it\u2019s a favorite among locals and street food lovers.", "name": "C\u00f4 Ba V\u0169ng T\u00e0u - District 7 (Mini Savory Pancakes)", "transport": "Take a Grab or Bus #86 to Nguy\u1ec5n Th\u1ecb Th\u1eadp Intersection stop, then walk about 3 minutes."}, {"address": "168 Nguy\u1ec5n Th\u1ecb Th\u1eadp, B\u00ecnh Thu\u1eadn, District 7, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A classic, highly popular sweet shop in District 7 specializing in traditional Vietnamese sweet soup (Ch\u00e8). The signature mixed coconut milk dessert features jackfruit, red beans, mung beans, nipa palm seeds, and chewy tapioca pearls, drizzled with freshly squeezed rich coconut milk and crushed ice. Refreshingly cool, silky, and delightfully sweet without being overwhelming, it\u2019s the ultimate hot-afternoon treat for locals around Ph\u00fa M\u1ef9 H\u01b0ng.", "name": "Ch\u00e8 M\u1ef9 - Nguy\u1ec5n Th\u1ecb Th\u1eadp (Traditional Vietnamese Sweet Soup)", "transport": "Take a Grab car or motorbike to Nguy\u1ec5n Th\u1ecb Th\u1eadp Street near Street 17; easily accessible."}, {"address": "Ph\u1ea1m V\u0103n Ngh\u1ecb, T\u00e2n Phong, District 7, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A super popular street food stall hidden near the Sky Garden community in Ph\u00fa M\u1ef9 H\u01b0ng, known as \u0027Vietnamese Pizza\u0027. Thin, crispy rice paper is grilled over charcoal, brushed with scallion oil, quail egg, pork floss, cheese, and minced sausage, then finished with spicy mayo and chili sauce. Hot off the grill, the edges are extra crispy, while the filling is savory, rich, and lightly smoky\u2014a perfect grab-and-go snack for an evening stroll.", "name": "Ph\u1ea1m V\u0103n Ngh\u1ecb Da Lat Grilled Rice Paper (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng)", "transport": "Located in the heart of Ph\u00fa M\u1ef9 H\u01b0ng\u0027s Korean area. Walk about 10 minutes from Crescent Mall or take a Grab to Sky Garden 1."}, {"address": "47 Street No. 17, T\u00e2n Quy, District 7, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A classic local nighttime street food stall in the T\u00e2n Quy area of District 7. You can catch the tantalizing aroma of charcoal-grilled betel leaves from afar. Seasoned ground beef is wrapped in wild betel leaves (B\u00f2 L\u00e1 L\u1ed1t) and grilled until juicy, producing a lightly charred exterior, juicy interior, and a unique herbal aroma. Served with rice vermicelli, rice paper, and seasoned fermented shrimp sauce for DIY rolls, creating a savory, tangy, finger-licking flavor combo.", "name": "B\u00f2 L\u00e1 L\u1ed1t Ba Trung - District 7 (Grilled Beef in Wild Betel Leaves)", "transport": "Recommended to take a Grab motorbike or taxi to Street No. 17 in T\u00e2n Quy Ward. Street parking is convenient."}, {"address": "59 Street No. 17, T\u00e2n Quy, District 7, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | A beloved traditional tofu pudding and fruit juice stall tucked in a District 7 alleyway. The signature warm silken tofu pudding (T\u00e0u H\u1ee7) is silky smooth, paired with a rich dark brown sugar ginger syrup and chewy tapioca boba. It melts in your mouth with a harmony of ginger and soy flavors. They also serve freshly blended highland avocado milkshakes and tropical fruit smoothies\u2014rich, satisfying, and a great spot for tourists to experience authentic local desserts.", "name": "T\u00e2n Quy T\u00e0u H\u1ee7 \u0026 Fruit Smoothie (Silken Tofu \u0026 Smoothies)", "transport": "Take a Grab to Street No. 17 in T\u00e2n Quy. Surrounded by street food stalls, it\u0027s ideal to explore on foot along with nearby eats."}, {"address": "143 Street No. 17, T\u00e2n Quy, District 7, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A highly recommended street savory dish by District 7 locals, famous for rich and generous traditional Vietnamese crab soup (S\u00fap Cua). The thick broth is slow-simmered with chicken bones and fresh crab, packed with shredded crab meat, century egg, quail eggs, sweet corn, and wood ear mushrooms. Smooth and savory, its flavor doubles with cilantro, black pepper, and chili oil. A comforting, hot bowl that serves as a popular snack or late-night supper.", "name": "S\u00fap Cua B\u00f4ng - District 7 (Crab Soup)", "transport": "Take a Grab to the intersection of Street No. 17 and Nguy\u1ec5n Th\u1ecb Th\u1eadp, then walk a short distance."}, {"address": "54 Nguy\u1ec5n Th\u1ecb Th\u1eadp, T\u00e2n H\u01b0ng, District 7, Ho Chi Minh City", "feature": "\u2b50 4.0 stars | A well-known diner specializing in Central Highlands and Southern-style Vietnamese savory pancakes (B\u00e1nh X\u00e8o). The turmeric-infused yellow pancakes are impressively large, fried to crisp perfection with an irresistible crunch. Filled with bean sprouts, pork belly, and fresh shrimp, it\u0027s eaten wrapped inside mustard greens or lettuce with fresh herbs and Thai basil, dipped in sweet and sour garlic-chili fish sauce. Refreshing, texturally rich, and showcasing the true essence of traditional market eats.", "name": "B\u00e1nh X\u00e8o Mu\u1ed1i Xi\u1ec3m - Nguy\u1ec5n Th\u1ecb Th\u1eadp (Crispy Vietnamese Pancakes)", "transport": "Take Bus #34 or #86 to Nguy\u1ec5n Th\u1ecb Th\u1eadp stop, or take a Grab directly to the storefront."}, {"address": "432 Nguy\u1ec5n Th\u1ecb Th\u1eadp, T\u00e2n Quy, District 7, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A classic street noodle stall located in the lively commercial district surrounding Ph\u00fa M\u1ef9 H\u01b0ng, specializing in Southern Vietnam\u0027s favorite Phnom Penh rice noodles (H\u1ee7 Ti\u1ebfu Nam Vang). Served either as soup noodles or dry noodles; the rice noodles are springy, and the dry noodle sauce balances sweet and savory flavors. Loaded with toppings like fresh shrimp, pork liver, sliced pork, quail egg, and crunchy fried garlic. Paired with a bowl of sweet pork bone broth, celery, and chives, it\u2019s a flavorful delight loved by locals and visitors alike.", "name": "H\u1ee7 Ti\u1ebfu Nam Vang T\u00e0i X\u01b0a (Phnom Penh Noodle Soup)", "transport": "Easily accessible by taking a Grab along the main thoroughfare of Nguy\u1ec5n Th\u1ecb Th\u1eadp."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "District 7 - Phu My Hung Modern International and High-End Residential Area"}};
        const themeHex = "#ea580c";
        const cityName = "Ho Chi Minh";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
