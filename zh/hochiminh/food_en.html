 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Featuring a nostalgic vintage military-green style and their signature Coconut Smoothie Coffee (C\u1ed1t D\u1eeba C\u00e0 Ph\u00ea). The creamy, sweet coconut blend perfectly marries the bittersweet coffee for a smooth, icy slushie texture\u2014the top pick for backpackers seeking shelter from the heat and soaking in Vietnam War nostalgia.", "name": "C\u1ed9ng C\u00e0 Ph\u00ea - B\u00f9i Vi\u1ec7n Branch", "transport": "Located on the main strip of B\u00f9i Vi\u1ec7n Walking Street, about a 3-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street."}, {"address": "182 \u0110\u1ec1 Th\u00e1m, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A 24-hour retro cafe famous for traditional Vietnamese drip coffee and freshly toasted stuffed lava toast. The bold black coffee boasts deep roasted aromas, paired with perfectly balanced condensed milk and crispy-on-the-outside, soft-on-the-inside toast\u2014drawing crowds of international travelers late into the night.", "name": "\u0110en \u0110\u00e1 Coffee - \u0110\u1ec1 Th\u00e1m Branch", "transport": "Located near the intersection of \u0110\u1ec1 Th\u00e1m Street and B\u00f9i Vi\u1ec7n Street, within easy walking distance."}, {"address": "119 Yersin, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | A cozy spot bringing traditional Northern Vietnamese egg coffee to the South. The egg yolk foam is whipped to a tiramisu-like velvety creaminess\u2014silky with no fishy odor\u2014resting atop rich, aromatic Vietnamese Robusta coffee. Tastes like a rich liquid dessert and is immensely popular with foreign tourists.", "name": "Little HaNoi Egg Coffee - Yersin Branch", "transport": "About a 5-minute walk from B\u1ebfn Th\u00e0nh Market, or a 7-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street."}, {"address": "147R Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A modern 24/7 cafe near the Ph\u1ea1m Ng\u0169 L\u00e3o nightlife hub, highly popular among night owls and digital nomads. Highlights include premium pour-over coffee and freshly toasted paninis\u2014crispy on the outside with gooey, melty cheese fillings for a satisfying meal.", "name": "Snob Coffee - Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Branch", "transport": "About a 2-minute walk from the corner of Ph\u1ea1m Ng\u0169 L\u00e3o Street."}, {"address": "269 Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | A flagship branch of Vietnam\u0027s local coffee giant, serving high-end drip coffee and refined Vietnamese brunch. The signature drip coffee offers a rich, long-lasting flavor with distinct chocolate undertones, paired perfectly with refreshing b\u00e1nh m\u00ec brunch platters for a showcase of premium Vietnamese coffee culture.", "name": "Trung Nguy\u00ean Legend Caf\u00e9 - Ph\u1ea1m Ng\u0169 L\u00e3o Branch", "transport": "Located along the main Ph\u1ea1m Ng\u0169 L\u00e3o street, just a 1-minute walk from September 23rd Park."}, {"address": "165/3 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A peaceful cafe tucked away in a vintage house down an alley off B\u00f9i Vi\u1ec7n Street, famous for exquisite egg coffee and signature Vietnamese specialty drinks. Featuring velvety, rich foam with notes of egg custard and caramel, it offers a serene sanctuary to relax and enjoy dessert-like brunch drinks amidst the nightlife bustle.", "name": "G\u00f3c H\u00e0 N\u1ed9i Caf\u00e9 - B\u00f9i Vi\u1ec7n", "transport": "Located inside Alley 165 off B\u00f9i Vi\u1ec7n Street; walk about 20 meters into the alley following the sign from the main street."}, {"address": "277 Nguy\u1ec5n Th\u00e1i H\u1ecdc, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | The ultimate spot to experience authentic Vietnamese street coffee culture sitting on low plastic stools. Their signature Iced Milk Coffee (C\u00e0 Ph\u00ea S\u1eefa \u0110\u00e1) strikes a brilliant balance between sweet condensed milk and robust coffee served over crushed ice, paired with a pork b\u00e1nh m\u00ec for the quintessential local morning routine.", "name": "Vy Coffee - Nguy\u1ec5n Th\u00e1i H\u1ecdc Branch", "transport": "Located at the intersection of Nguy\u1ec5n Th\u00e1i H\u1ecdc and Ph\u1ea1m Ng\u0169 L\u00e3o streets, easily accessible on foot."}, {"address": "103 L\u00ea Th\u1ecb H\u1ed3ng G\u1ea5m, Nguy\u1ec5n Th\u00e1i B\u00ecnh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A top-rated brunch spot blending modern minimalist style with subtle Vietnamese touches, famous for avocado poached egg toast and craft cold brews. The cold brew offers refreshing citrusy acidity, paired with creamy avocado toast and soft-boiled eggs\u2014a highly recommended energizing breakfast option beloved by Western travelers.", "name": "M2C Modern To Cafe - L\u00ea Th\u1ecb H\u1ed3ng G\u1ea5m Branch", "transport": "About a 5-minute walk from the border of the Ph\u1ea1m Ng\u0169 L\u00e3o district (Nguy\u1ec5n Th\u00e1i H\u1ecdc Street)."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "103 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Located in the heart of B\u00f9i Vi\u1ec7n Street, this bistro is famous for its affordable, high-quality seafood and Vietnamese stir-fries. The signature fresh oysters are plump, visually striking, and smooth on the palate with a natural ocean savoriness, perfectly complemented by a special herb-lemon sauce for a sweet and sour kick. The grilled squid is aromatic, nicely chewy, and pairs wonderfully with an ice-cold Vietnamese craft beer. The lively and relaxed outdoor seating allows tourists and local youth alike to fully immerse themselves in the buzzing nightlife of the Ph\u1ea1m Ng\u0169 L\u00e3o area.", "name": "Five Oysters Seafood \u0026 Grill", "transport": "About a 3-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street to No. 103 on B\u00f9i Vi\u1ec7n Walking Street."}, {"address": "145 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A popular eatery that blends traditional Northern Vietnamese B\u00fan Ch\u1ea3 (Hanoi-style grilled pork with rice noodles) with a refined bistro vibe. Charcoal-grilled pork patties and pork slices are herb-marinated and grilled to perfection\u2014smoky on the outside, tender and juicy on the inside. Dipped into warm, sweet-and-sour fish sauce broth and paired with chilled, chewy rice noodles and fresh herbs, every bite offers vibrant layers of flavor. The restaurant also serves Vietnamese craft beers and cocktails, attracting countless foreign backpackers with its clean and stylish dining atmosphere.", "name": "B\u00fan Ch\u1ea3 145 B\u00f9i Vi\u1ec7n", "transport": "Located in the middle section of B\u00f9i Vi\u1ec7n Walking Street, about a 2-minute walk after turning onto \u0110\u1ec1 Th\u00e1m Street from Ph\u1ea1m Ng\u0169 L\u00e3o Street."}, {"address": "195 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City (Rooftop of Duc Vuong Hotel)", "feature": "\u2b50 4.2 stars | Perched on the top floor of the Duc Vuong Hotel, this is one of B\u00f9i Vi\u1ec7n\u2019s iconic rooftop view bistros. The signature honey-glazed grilled pork ribs are coated in a rich, sweet sauce with tender, fall-off-the-bone meat. Guests can relax on a cozy terrace filled with bamboo decor and lantern lights, sipping tropical passion fruit cocktails while overlooking the vibrant night view of the Ph\u1ea1m Ng\u0169 L\u00e3o commercial area\u2014offering romance at surprisingly affordable prices.", "name": "The View Rooftop Bar \u0026 Restaurant", "transport": "Take the elevator directly to the rooftop of Duc Vuong Hotel."}, {"address": "227 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A long-standing exotic bistro in the Ph\u1ea1m Ng\u0169 L\u00e3o area, perfectly fusing rich Indian spice traditions with Vietnamese dining culture. The signature Butter Chicken is creamy and flavorful, paired with fresh, warm garlic naan that\u0027s crispy outside and soft inside. The restaurant also offers cold draft beers and unique Indian Chai cocktails. Exceptionally friendly service and authentic aromatic flavors keep this place consistently at the top of backpacker food lists.", "name": "Baba\u0027s Kitchen", "transport": "Located near the end of B\u00f9i Vi\u1ec7n Street, about a 4-minute walk from the intersection with \u0110\u1ec1 Th\u00e1m Street."}, {"address": "130 Nguy\u1ec5n Tr\u00e3i, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Tucked away on the second floor near the edge of the Ph\u1ea1m Ng\u0169 L\u00e3o area, this cozy restaurant is adorned with colorful handmade traditional Vietnamese lanterns. Specializing in home-style local cuisine, their signature caramelized coconut water prawns are sweet, succulent, and snappy, coated in a rich, savory-sweet sauce that pairs amazingly well with rice. Accompanied by a signature Vietnamese herb cocktail infused with fresh lemongrass and mint, it\u2019s refreshing and perfect for diners seeking an elegant atmosphere and authentic Vietnamese flavors.", "name": "Den Long - Home Cooked Vietnamese Restaurant", "transport": "About a 5-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street to Nguy\u1ec5n Tr\u00e3i Street."}, {"address": "40/24 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Founded by creative young minds, this hidden gem seamlessly fuses Mexican tacos with local Vietnamese ingredients. The signature lemongrass pork tacos feature a crispy shell packed with flavorful marinated pork and fresh cilantro, topped with a zesty, slightly spicy Vietnamese lime sauce for a juicy and layered bite. Paired with house-brewed tropical fruit craft beer, it\u0027s an ideal spot for a lively night out with friends.", "name": "Nonla Guy", "transport": "Located inside Alley 40 on B\u00f9i Vi\u1ec7n Street; about a 1-minute walk into the alley from B\u00f9i Vi\u1ec7n main street."}, {"address": "39/4 B\u00f9i Vi\u1ec7n, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Immersed in nostalgic Vietnamese rustic charm, this pub creates a warm, relaxing vibe with red brick walls and wooden tables. The must-try grilled chicken leg with lemongrass and lime leaves features crispy skin and tender, juicy meat with subtle herbal notes. Paired with fresh local Vietnamese craft dark beer or chilled white wine, it goes down smoothly. Whether enjoying a hearty local dinner or a late-night drink, foodies will be thoroughly satisfied.", "name": "Village Pub \u0026 Vietnamese Kitchen", "transport": "Located in an alley off B\u00f9i Vi\u1ec7n Street near Ph\u1ea1m Ng\u0169 L\u00e3o Park, about a 3-minute walk."}, {"address": "224 \u0110\u1ec1 Th\u00e1m, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A classic iconic bar combining live music performances with Vietnamese bar bites. The Vietnamese fried spring rolls are fried to golden perfection with an incredibly crunchy shell; filled with juicy pork, wood ear mushrooms, and taro, they taste wonderfully refreshing when dipped in sweet and sour fish sauce. Enjoy classic Saigon Gin cocktails while listening to high-energy rock and pop covers by live bands\u2014the atmosphere is electric, embodying the vibrant charm of Ph\u1ea1m Ng\u0169 L\u00e3o\u0027s nightlife.", "name": "Thi Bar Saigon", "transport": "Located near the intersection of \u0110\u1ec1 Th\u00e1m Street and B\u00f9i Vi\u1ec7n Street, about a 2-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "185/26 \u0110. Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.7 stars | A super popular vegan paradise hidden in an alley off Pham Ngu Lao Street. The signature \u0027Vegan Pho\u0027 features a broth simmered for hours with heaps of fresh fruits, vegetables, and spices, resulting in a delightfully sweet and soothing flavor. Paired with silky, chewy rice noodles, generous mock meat slices, and oyster mushrooms, it is truly impressive. Another crowd favorite, the \u0027Vegan Fried Spring Rolls\u0027, boasts paper-thin, golden-crispy skins stuffed with aromatic wood ear mushrooms and shredded taro. Crunching into them with their special sweet and chili sauce is pure bliss. Highly recommended by both health-conscious Western backpackers and local vegetarians.", "name": "Veggie Saigon Vegan Restaurant", "transport": "About a 2-minute walk from Pham Ngu Lao Street into the alley"}, {"address": "178G \u0110. Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | An upscale, refined vegetarian restaurant located at the intersection of Nguyen Trai Street and the Pham Ngu Lao commercial area. It brilliantly reinterprets traditional Vietnamese home-cooked dishes into 100% vegan creations. The signature \u0027Vegan Pineapple Fried Rice\u0027 features perfectly distinct, wok-charred fragrant rice tossed with fresh pineapple chunks, cashews, and vegan floss\u2014chewy, sweet, sour, and appetising. The \u0027Lemongrass Tofu Claypot\u0027 has golden-crispy tofu on the outside and pudding-soft inside, fully absorbing the essence of fragrant lemongrass and savory soy sauce. Its elegant classic decor and exquisite presentation make it a favorite among tourists who value dining quality.", "name": "Nh\u00e0 H\u00e0ng Chay B\u00e0 X\u00e3 - Nguy\u1ec5n Tr\u00e3i", "transport": "About a 5-minute walk from Pham Ngu Lao Street, located on the main Nguyen Trai Street"}, {"address": "204 \u0110. Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | A garden vegetarian bistro with a cozy, bohemian ambiance, hugely popular among global travelers and plant-based food lovers. Their \u0027Vegan Bun Cha (Bun Cha Chay)\u0027 is highly recommended\u2014specially crafted plant-based patties grilled to a light, crispy char, served alongside refreshing cold rice vermicelli, fresh cilantro, mint leaves, and a well-balanced sweet and sour vegan fish sauce. Additionally, their \u0027Vegan Avocado Smoothie\u0027 is velvety smooth and rich with fresh fruity aroma, making it a perfect spot to relax your soul after exploring the nightlife district.", "name": "Prem Vegetarian Bistro", "transport": "About a 6-minute walk from Bui Vien Walking Street"}, {"address": "155 \u0110. Nguy\u1ec5n Th\u00e1i H\u1ecdc, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | A renowned vegetarian restaurant in central Ho Chi Minh City featuring a nostalgic Vietnamese wooden decor. The \u0027Vegan Tom Yum Hot Pot (L\u1ea9u Th\u00e1i Chay)\u0027 is delightfully surprising, featuring a sweet and sour broth bursting with lemongrass and kaffir lime leaves, loaded with silky mushrooms and springy vegan shrimp. The popular \u0027Vegan Banh Xeo (B\u00e1nh X\u00e8o Chay)\u0027 offers an incredibly golden, crispy crepe filled with crunchy bean sprouts and mung beans\u2014wrap it in fresh lettuce leaves for a refreshing, non-greasy bite that international tourists adore.", "name": "S\u00e2n M\u00e2y Vegetarian Restaurant", "transport": "About a 3-minute walk from the intersection of Bui Vien Street and Nguyen Thai Hoc Street"}, {"address": "43 \u0110. Tr\u1ea7n \u0110\u00ecnh Xu, Ph\u01b0\u1eddng C\u00f4 Giang, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.8 stars | A stylish plant-based restaurant featuring organic, healthy concepts with an Italian-Vietnamese fusion cuisine. The popular \u0027Vegan Pesto Risotto\u0027 features plump rice grains saturated in rich basil pesto, paired with aromatic roasted nuts and wild mushrooms for a creamy yet chewy texture. The traditional \u0027Vegan Fresh Spring Rolls\u0027 use organic vegetables and herbs wrapped in thin, chewy rice paper, paired with a rich peanut dipping sauce for a light, guilt-free treat. The warm private home atmosphere and commitment to organic ingredients make it a top-rated hidden gem in the backpacker district.", "name": "The Organik House - Vegetarian \u0026 Vegan Restaurant", "transport": "About a 4-minute walk after turning onto Tran Dinh Xu Street from the western end of Bui Vien Street"}, {"address": "36 \u0110. B\u00f9i Vi\u1ec7n, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | A popular vegan street food stall located on the core strip of the vibrant Bui Vien nightlife street. Its \u0027Vegan Banh Mi\u0027 features an ultra-crispy toasted baguette that crackles with every bite, stuffed with house-made vegan ham, savory sauteed mock meat shreds, pickled radishes, and cilantro. Spread with rich plant-based spread and special soy sauce, it delivers a harmonious blend of salty, sweet, sour, and spicy flavors. Whether as a warm midnight snack after late-night partying or a quick breakfast during the day, it\u0027s a street delicacy backpackers queue up for.", "name": "B\u00e1nh M\u00ec Chay 36 - Bui Vien", "transport": "Located in the heart of Bui Vien Walking Street, easily accessible on foot"}, {"address": "110 \u0110. S\u01b0\u01a1ng Nguy\u1ec7t \u00c1nh, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | A unique Tibetan Buddhist-themed vegetarian restaurant just a few minutes\u0027 walk from Pham Ngu Lao Street. The house-special \u0027Mandala Signature Tofu\u0027 is crispy on the outside and soft inside, coated in a unique spiced sauce that offers a rich and mildly spicy flavor profile. The \u0027Vegan Tibetan Momos\u0027 feature chewy dough filled with finely chopped cabbage, shiitake mushrooms, and tofu, oozing with delicious, sweet broth when bitten into. Peaceful, serene music and unique plateau flavors draw many global travelers seeking tranquility and a distinctive culinary adventure.", "name": "Mandala Vegetarian Restaurant", "transport": "About an 8-minute walk from the north side of Pham Ngu Lao Street"}, {"address": "185/19 \u0110. Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | A cozy little eatery tucked away in the alleys of Pham Ngu Lao, known for its friendly service and simple, delicious vegan home cooking. The signature \u0027Vegan Eggplant Claypot\u0027 stew is cooked until melt-in-your-mouth tender, absorbing rich caramelized soy sauce and peppery aromas, making it immensely satisfying with rice. The \u0027Vegan Fried Wontons\u0027 boast golden-crisp wrappers filled with crunchy shiitake mushrooms and water chestnuts. Offering generous portions at affordable prices with no chemical additives, it\u0027s a highly recommended budget-friendly plant-based treasure among backpackers.", "name": "B\u00fap Chay Vegan Restaurant", "transport": "About a 1-minute walk from the alley entrance at 185 Pham Ngu Lao Street"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "84/7 B\u00f9i Vi\u1ec7n, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 Stars | Hidden in a lively alley off B\u00f9i Vi\u1ec7n Street, this wildly popular smoothie stall is famous for blending generous portions of freshly cut fruits into rich, creamy smoothies. Smooth and velvety, every sip offers a pure blend of fruity sweetness and milky richness. Tourists and local youths love grabbing a mango coconut milk or avocado smoothie on a warm tropical night\u2014refreshing, satisfying, and visually delightful.", "name": "Five Boys Smoothies (Sinh T\u1ed1 Five Boys)", "transport": "About a 3-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street into the alley off B\u00f9i Vi\u1ec7n Street"}, {"address": "37 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 Stars | Hailed by international media as one of the best street b\u00e1nh m\u00ec in Ho Chi Minh City! Opening in the late afternoon, this small stall constantly draws long queues. Grilled pork patties sizzle over charcoal, yielding a crispy exterior and juicy, flavorful filling. Paired with a secret sweet and spicy sauce, pickled radishes, and fresh cilantro, every crunchy bite is packed with rich layers of flavor\u2014a budget-friendly must-try in the backpacker district.", "name": "37 Nguy\u1ec5n Tr\u00e3i Grilled Pork B\u00e1nh M\u00ec (B\u00e1nh M\u00ec 37 Nguy\u1ec5n Tr\u00e3i)", "transport": "About a 5-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "175 C\u00f4n Qu\u1ef3nh, Ph\u01b0\u1eddng Nguy\u1ec5n C\u01b0 Trinh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 Stars | A legendary street-side noodle shop on the edge of the Ph\u1ea1m Ng\u0169 L\u00e3o district, celebrated for its charcoal-grilled pork and crispy spring rolls. The silky, chewy rice noodles are topped with marinated grilled pork slices, crispy yet tender spring rolls, crushed peanuts, and fresh lettuce. Drizzle with signature fish sauce and mix together for an explosion of sweet, sour, savory, and aromatic Southern Vietnamese street flavors.", "name": "Ch\u1ecb Tuy\u1ec1n Grilled Pork Rice Noodle (B\u00fan Th\u1ecbt N\u01b0\u1edbng Ch\u1ecb Tuy\u1ec1n)", "transport": "About a 6-minute walk from B\u00f9i Vi\u1ec7n Street"}, {"address": "B\u00f9i Vi\u1ec7n, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | The most iconic nighttime street snack along the lively B\u00f9i Vi\u1ec7n Street. Paper-thin rice paper is grilled over charcoal, topped with quail eggs, green onions, pork floss, and dried shrimp, then toasted to golden crispiness. Crunchy and smoky with a slight kick of spicy sauce, it\u0027s like a Vietnamese thin-crust pizza\u2014perfect for munching on while taking in the vibrant night market atmosphere.", "name": "B\u00f9i Vi\u1ec7n Vietnamese Pizza (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng B\u00f9i Vi\u1ec7n)", "transport": "Stalls located along the main strip of B\u00f9i Vi\u1ec7n Walking Street"}, {"address": "115 Phan Cung Gi\u1ea3n, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 Stars | This classic warm Vietnamese street dessert once won an international street food award. Sweet bananas are wrapped in sticky rice, enveloped in banana leaves, and grilled over charcoal until charred and fragrant. The sticky rice layer is crispy on the outside and soft inside, wrapping around a warm, sweet-and-sour banana center. Drizzled with warm coconut milk and topped with crushed peanuts, it offers rich layers of flavor without being overly sweet.", "name": "Southern Grilled Banana in Sticky Rice (Chu\u1ed1i N\u1ebfp N\u01b0\u1edbng Nam B\u1ed9)", "transport": "About a 7-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "102 B\u00f9i Vi\u1ec7n, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 Stars | A hugely popular refreshing dessert in the bustling nightlife district of B\u00f9i Vi\u1ec7n. Served in a halved natural fresh coconut shell, chewy pandan sticky rice forms the base, topped with two large scoops of rich coconut ice cream, roasted coconut flakes, and crushed peanuts. The silky cold ice cream melted over warm, fragrant sticky rice creates an irresistible blend of nutty and sweet aromas.", "name": "B\u00f9i Vi\u1ec7n Coconut Sticky Rice Ice Cream (Kem X\u00f4i D\u1eeba B\u00f9i Vi\u1ec7n)", "transport": "Located in the central section of B\u00f9i Vi\u1ec7n Walking Street"}, {"address": "273 V\u00f5 V\u0103n Ki\u1ec7t, Ph\u01b0\u1eddng C\u1ed5 Giang, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 Stars | A classic street BBQ spot that has been filling the air around the backpacker area with mouth-watering aromas for years. Seasoned ground beef is wrapped in fragrant wild betel leaves and charcoal-grilled until sizzling, infusing herbal notes into the meat. Wrap the beef rolls in thin rice paper with rice vermicelli, fresh herbs, and special sauce; each juicy bite bursts with fresh, non-greasy herbal flavors.", "name": "C\u00f4 Li\u00ean Grilled Beef in Wild Betel Leaves (B\u00f2 L\u00e1 L\u1ed1t C\u00f4 Li\u00ean)", "transport": "About an 8-minute walk from the southern end of B\u00f9i Vi\u1ec7n Street"}, {"address": "138 C\u1ed1ng Qu\u1ef3nh, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 Stars | A wildly popular nostalgic street fried-snack stall tucked away on the edge of the backpacker district. Freshly rolled and fried to order, these traditional Vietnamese hollow donuts (B\u00e1nh Ti\u00eau) are coated in aromatic white sesame seeds and fried until golden and puffed up. Crispy on the outside, soft, hollow, and subtly sweet on the inside, they offer rich sesame and dough flavors\u2014a simple yet irresistible afternoon snack loved by locals since childhood.", "name": "C\u1ed1ng Qu\u1ef3nh Sesame Hollow Donuts (B\u00e1nh Ti\u00eau C\u1ed1ng Qu\u1ef3nh)", "transport": "About a 2-minute walk from the intersection of Ph\u1ea1m Ng\u0169 L\u00e3o Street and C\u1ed1ng Qu\u1ef3nh Street"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "District 1 - Pham Ngu Lao and Bui Vien Backpacker Nightlife Area"}, "district_1_center": {"categories": {"cat_1": {"items": [{"address": "1-3 Phan Chu Trinh, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 Stars | A legendary traditional beef pho noodle shop located next to B\u1ebfn Th\u00e0nh Market, made famous by former US President Bill Clinton\u0027s visit. Its beef pho features a rich, sweet broth infused with subtle hints of star anise and cinnamon. Tender, thinly sliced raw beef cooks instantly in the hot broth to lock in juices, paired with smooth, springy rice noodles, fresh basil, and bean sprouts. Offering rich textures, it is a classic landmark for travelers experiencing Vietnam\u0027s national dish for the first time.", "name": "Ph\u1edf 2000", "transport": "Take a bus to the B\u1ebfn Th\u00e0nh Market (Ch\u1ee3 B\u1ebfn Th\u00e0nh) central station, then walk for about 2 minutes."}, {"address": "26 L\u00ea Th\u1ecb Ri\u00eang, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 Stars | Renowned as the best and most extravagant b\u00e1nh m\u00ec shop in Ho Chi Minh City, drawing constant queues. The baguette is baked to ultimate crispiness\u2014crunchy on the outside while soft and dense inside. It is generously stuffed with various traditional Vietnamese cold cuts, homemade pork fillings, rich p\u00e2t\u00e9, special mayonnaise, sweet-and-sour pickled radishes, and fresh cilantro. Extremely flavorful, savory, and immensely satisfying.", "name": "B\u00e1nh M\u00ec Hu\u1ef3nh Hoa", "transport": "About an 8-minute walk from B\u1ebfn Th\u00e0nh Market, or take a Grab motorbike to the intersection of L\u00ea Th\u1ecb Ri\u00eang Street."}, {"address": "46A \u0110inh C\u00f4ng Tr\u00e1ng, Ph\u01b0\u1eddng T\u00e2n \u0110\u1ecbnh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 Stars | A decades-old iconic Vietnamese crepe (b\u00e1nh x\u00e8o) spot in District 1, praised by the late chef Anthony Bourdain. They insist on using traditional charcoal stoves and large cast-iron pans. The crepe is golden, crispy, and subtly infused with coconut milk, stuffed with juicy shrimp, sliced pork, mung beans, and crunchy bean sprouts. Wrap pieces of crepe in fresh lettuce and herbs, dip in fish sauce, and enjoy a crispy, tender, and refreshing bite.", "name": "B\u00e1nh X\u00e8o 46A", "transport": "Located near Tan Dinh Church (the Pink Church), about a 5-minute walk away."}, {"address": "160 Pasteur, Ph\u01b0\u1eddng B\u1ebfn Ngh\u00e9, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | A legendary restaurant set in a French colonial villa in a prime location, bringing together traditional street food from across Vietnam. The center of the restaurant recreates vibrant traditional market stalls. Highlights include thin-skinned spring rolls, crispy shrimp cakes, classic b\u00e1nh x\u00e8o, and bun cha, all served with exquisitely blended sauces. Combining authentic local flavors with high hygiene standards, it is popular with international tourists and local families.", "name": "Nh\u00e0 H\u00e0ng Ngon (Quan An Ngon)", "transport": "Located in the heart of District 1, about a 6-minute walk from the Saigon Opera House."}, {"address": "85 L\u00fd T\u1ef1 Tr\u1ecdng, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | A highly-rated classic eatery specializing in traditional Saigon broken rice (c\u01a1m t\u1ea5m), preserving authentic nostalgic flavors. Well-marinated bone-in pork chops are charcoal-grilled to golden perfection\u2014smoky, juicy, and tender. Served over chewy broken rice, drizzled with sweet-spicy fish sauce, pork crackling, and scallion oil, accompanied by steamed egg loaf and shredded pork skin. The rich blend of sweet and savory aromas keeps you coming back for more.", "name": "C\u01a1m T\u1ea5m M\u1ed9c", "transport": "Located right behind B\u1ebfn Th\u00e0nh Market, about a 3-minute walk."}, {"address": "110 Nguy\u1ec5n Du, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 Stars | A long-standing iconic shop famous for its bold, spicy Hue-style beef noodle soup (B\u00fan B\u00f2 Hu\u1ebf). The broth is simmered slowly with beef bones and lemongrass, enhanced with special shrimp paste for a subtle kick and citrusy aroma. Thick rice noodles soak up the vivid broth, served with tender beef brisket, pork trotters, and blood pudding, along with fresh lettuce and shredded banana blossom. The authentic taste of Hue leaves a lasting impression.", "name": "B\u00fan B\u00f2 Hu\u1ebf \u0110\u00f4ng Ba", "transport": "About a 5-minute walk from the Independence Palace (Dinh \u0110\u1ed9c L\u1eadp)."}, {"address": "145 B\u00f9i Vi\u1ec7n, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 Stars | An immensely popular spot in the Ph\u1ea1m Ng\u0169 L\u00e3o area serving North Vietnamese b\u00fan ch\u1ea3. Freshly grilled pork patties and pork slices feature a smoky charred aroma\u2014crispy outside, juicy inside. Served in warm, sweet-and-sour fish sauce broth alongside springy chilled rice noodles and fresh herbs, it\u0027s amazingly refreshing and appetizing. The delicate presentation is highly praised by travelers.", "name": "B\u00fan Ch\u1ea3 145", "transport": "Located in the heart of Bui Vien Walking Street; easily accessible on foot or via Grab to 145 Bui Vien Street."}, {"address": "4 Phan B\u1ed9i Ch\u00e2u, Ph\u01b0\u1eddng B\u1ebfn Th\u00e0nh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 Stars | A famous crab and tomato noodle soup shop that started as a street stall next to B\u1ebfn Th\u00e0nh Market, handed down through generations. The broth is simmered with tomatoes and crab paste, delivering a rich, tangy, savory seafood flavor. Signature crab patties melt in your mouth, complemented by fried tofu and pig blood curd that burst with flavor in every bite. A beloved traditional Saigon comfort food.", "name": "B\u00fan Ri\u00eau G\u00e1nh - B\u1ebfn Th\u00e0nh", "transport": "Located opposite the East Gate of B\u1ebfn Th\u00e0nh Market, just a 1-minute walk away."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "27 Ng\u00f4 \u0110\u1ee9c K\u1ebf, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.6 stars | Hidden on the second floor of an old apartment building, this industrial-style specialty cafe is Ho Chi Minh City\u0027s pioneer in third-wave coffee. Featuring high ceilings, abundant natural light, warm wooden furniture, and sleek steel elements, it creates a refined, cool industrial aesthetic. Offers high-quality single-origin beans prepared via pour-over, siphon, AeroPress, and more. The pour-over features rich floral and fruity notes with a smooth finish. Paired with signature Eggs Benedict or French toast brunch\u2014richly layered with sweet and savory flavors\u2014it is highly recommended by Western tourists and local digital nomads alike.", "name": "The Workshop Coffee", "transport": "Located near Nguy\u1ec5n Hu\u1ec7 Pedestrian Street, about a 3-minute walk."}, {"address": "151 \u0110\u1ed3ng Kh\u1edfi, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | A hybrid brunch cafe combining French retro charm with a curated fashion concept store, hidden at the end of an old alleyway corridor. Exuding a strong sense of nostalgia from the French colonial era, its signature American Avocado Brunch Plate comes with a soft-boiled poached egg and crispy bacon. The toast is crispy outside and soft inside, topped with creamy avocado puree and special spices for a rich, non-greasy taste. Furthermore, the rounded, smooth latte paired with a slice of fresh-baked marble cheesecake delivers a lingering milky fragrance, making it a top choice for a lazy French-style afternoon.", "name": "L\u0027Usine (\u0110\u1ed3ng Kh\u1edfi Branch)", "transport": "Located on the luxury \u0110\u1ed3ng Kh\u1edfi Street, near the Saigon Opera House, about a 2-minute walk."}, {"address": "Level 3, 2-4-6 \u0110\u1ed3ng Kh\u1edfi, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | A trendy, Instagram-worthy brunch spot famous for its pastel tones and stylish modern decor, loved by young women and influencers. It highlights creative Western brunch classics and exquisite handmade desserts. The signature souffle pancakes are especially recommended\u2014cloud-like, light, and melting in your mouth, served with fresh strawberries and rich vanilla cream that\u0027s perfectly sweet. For savory options, the smoked salmon poached egg toast overflows with golden yolk when cut, combining savory salmon and capers for a delightful double treat for both eyes and taste buds.", "name": "Godmother Bake \u0026 Brunch", "transport": "Located on the 3rd floor of a building near the intersection of \u0110\u1ed3ng Kh\u1edfi and T\u00f4n \u0110\u1ee9c Th\u1eafng Streets, close to the Saigon River."}, {"address": "23 H\u00e0n Thuy\u00ean, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.3 stars | Set inside a two-story vintage French building, this Mediterranean-style cafe offers lush green park views. It specializes in Middle Eastern and Mediterranean brunch, with its signature Shakshuka taking center stage\u2014soft poached eggs simmered in a rich tomato, red pepper, and spice stew, served with freshly baked hot pita bread. Crispy outside and soft inside, dipping it into the rich sauce delivers explosive exotic flavors. Pair it with a fresh passion fruit smoothie for a sweet and refreshing meal. It\u0027s a fantastic spot to enjoy colonial nostalgia and Mediterranean cuisine.", "name": "Au Parc Saigon", "transport": "Located on H\u00e0n Thuy\u00ean Street between Notre-Dame Cathedral and the Independence Palace, just a 2-minute walk to the Cathedral."}, {"address": "119/B5 L\u00ea Lai, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.7 stars | A cozy, trendy cafe specializing in traditional Northern Vietnamese egg coffee and light brunch choices. The signature egg coffee features rich Vietnamese black coffee topped with an ultra-creamy, custard-like whipped egg foam. Free from any fishy egg odor, it emanates rich caramel and dairy aromas with a perfectly balanced sweet and bitter contrast. Paired with specially prepared grilled avocado and egg toast\u2014crispy toast topped with fresh avocado and a soft poached egg\u2014it offers fantastic value, nostalgic vibes, and an essential stop for travelers exploring unique Vietnamese coffee culture.", "name": "Little HaNoi Egg Coffee (L\u00ea Lai)", "transport": "Located in an alley off Ph\u1ea1m Ng\u0169 L\u00e3o Street, near Ph\u1ea1m Ng\u0169 L\u00e3o Park, about a 3-minute walk."}, {"address": "26 L\u00fd T\u1ef1 Tr\u1ecdng, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.4 stars | An iconic chain cafe themed around retro Viet Cong aesthetics, filled with military-green memorabilia, vintage books, and old kerosene lamps for a nostalgic vibe. What truly captivates visitors is their signature Coconut Milk Smoothie Coffee\u2014rich Vietnamese coffee with dark chocolate notes poured over creamy, ice-cold coconut milk slushie. The sweet, smooth coconut milk hits first, followed by deep coffee bitterness\u2014refreshing, cooling, and uniquely complex. Paired with freshly fried toast sticks dipped in condensed milk, it forms a classic, vintage local snack combo.", "name": "C\u1ed9ng C\u00e0 Ph\u00ea (\u0110\u1ed3ng Kh\u1edfi Branch)", "transport": "Located near the intersection of L\u00fd T\u1ef1 Tr\u1ecdng and \u0110\u1ed3ng Kh\u1edfi Streets, near the Saigon Central Post Office, about a 4-minute walk."}, {"address": "96 \u0110\u1ed3ng Kh\u1edfi, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.3 stars | An upscale bistro cafe that seamlessly blends luxurious decor with traditional Vietnamese coffee culture. Featuring ornate wood carvings, crystal chandeliers, and lush greenery, it exudes elegant colonial flair. The exquisite pairing of traditional Vietnamese drip coffee and artisanal French pastry desserts comes highly recommended; the drip coffee extraction process feels like a ceremonial ritual, yielding a rich and sweet flavor. Brunch options highlight Vietnamese-French fusion, such as pan-seared foie gras banh mi and Wagyu pho. Elegant plating and sophisticated ambiance allow guests to savor modern Vietnamese cafe culture in true luxury.", "name": "RuNam Bistro (\u0110\u1ed3ng Kh\u1edfi)", "transport": "Located in the heart of \u0110\u1ed3ng Kh\u1edfi shopping district, directly opposite the Opera House, about a 1-minute walk."}, {"address": "L3-01, Saigon Centre, 65 L\u00ea L\u1ee3i, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City, Vietnam", "feature": "\u2b50 4.5 stars | Located inside Takashimaya Department Store, this modern Japanese cafe features minimalist brunch items, specialty desserts, and large floor-to-ceiling windows overlooking bustling District 1. Every drink and dish reflects artisan craftsmanship: the signature Japanese Matcha Latte is freshly whisked using premium Kyoto matcha powder, offering a rich, pleasantly bitter tea aroma with velvety milk foam. For brunch, the Wagyu Hamburg Steak Eggs Benedict is a must-try\u2014juicy, thick Wagyu beef patties topped with rich Hollandaise sauce and a perfectly cooked poached egg. Cutting into the egg releases warm yolk over the savory meat\u2014a first choice for foodies seeking visual elegance and high quality.", "name": "Miyama Cafe (Saigon Centre)", "transport": "Located on the 3rd floor of Saigon Centre (Takashimaya), extremely convenient to access."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "10 \u0110\u1eb7ng Dung, T\u00e2n \u0110\u1ecbnh, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Tucked away in an old French colonial building in District 1, this renowned local restaurant is famous for its warm, rustic retro decor and authentic Vietnamese home-style cooking. Signature dishes like the caramelized braised pork belly feature melt-in-your-mouth tenderness, perfectly coated in a rich sweet-and-savory sauce, accompanied by refreshing morning glory and tofu\u2014delivering authentic Vietnamese family flavors in every bite. Committed to using fresh local ingredients, they elevate simple home cooking into a refined dining experience beloved by international foodies and local gourmets alike.", "name": "C\u1ee5c G\u1ea1ch Qu\u00e1n", "transport": "Take a Grab or taxi to \u0110\u1eb7ng Dung Street, then walk about 2 minutes."}, {"address": "Top Floor, 158 Pasteur St, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | A hidden open-air rooftop restaurant atop an old apartment building in District 1. Climbing the vintage stairs reveals a lush sky garden adorned with vibrant greenery and glowing lanterns. Specializing in Southern Vietnamese regional cuisine, top recommendations include the Pan-Seared Quail and Crispy Vietnamese Spring Rolls. The spring rolls boast an ultra-crispy skin wrapped around plump shrimp and cilantro, perfectly paired with a sweet and sour signature fish sauce for complex layers of flavor. With its tropical vibes and romantic night views, it\u0027s the ultimate spot for tourists to experience Saigon by night.", "name": "Secret Garden Home-cooked Vietnamese Restaurant", "transport": "Walk about 8 minutes from B\u1ebfn Th\u00e0nh Market, locate the alley entry at 158 Pasteur Street, and head upstairs."}, {"address": "89 T\u00f4n Th\u1ea5t \u0110\u1ea1m, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | Awarded one Michelin star, Anan Saigon is tucked away in an alley near the Old Market (Ch\u1ee3 C\u0169), seamlessly blending Vietnamese street food with modern molecular gastronomy and craft cocktails. Showstopping creations like the \u0027$100 Pho\u0027 and \u0027Fish Sauce Wagyu Pho Roll\u0027 amaze diners\u2014featuring bouncy, springy pho wrapper wraps and juicy, tender seared beef. Paired with custom handcrafted cocktails, it delivers a revolutionary twist on traditional tastes. Its stylish, modern bar ambiance and creative local fare make it a benchmark for top-tier modern bistros in Ho Chi Minh City.", "name": "Anan Saigon - Modern Vietnamese Cuisine \u0026 Bistro", "transport": "Take a taxi to T\u00f4n Th\u1ea5t \u0110\u1ea1m Street; located right next to the Old Market (Ch\u1ee3 C\u0169)."}, {"address": "19 Ng\u00f4 V\u0103n N\u0103m, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Qu\u00e1n B\u1ee5i is dedicated to serving authentic, preservative-free traditional Vietnamese flavors within a cozy, Renaissance-inspired atmosphere. Must-try dishes include the \u0027Sweet and Sour Seafood Soup\u0027 and \u0027Grilled Pork Chop with Broken Rice\u0027. The seafood soup is tantalizingly tangy and appetizing, featuring a sweet, light broth infused with aromatic herbs and tender fish; the grilled pork chop is deeply marinated and savory-juicy. Combining chic, elegant decor with down-to-earth traditional culinary technique, it\u0027s a fantastic venue to experience elegant Vietnamese dining culture.", "name": "Qu\u00e1n B\u1ee5i - Original Classic Vietnamese Restaurant", "transport": "Near the Little Japan area, about a 10-minute walk from the Saigon Opera House."}, {"address": "74 Hai B\u00e0 Tr\u01b0ng, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Tucked inside the courtyard of a colonial-era French opium factory, this bistro exudes rich French romance and timeless historical charm. Offering exquisite French-Vietnamese fusion cuisine, their signature \u0027Duck Breast with Red Wine Sauce\u0027 features crispy skin and succulent meat infused with subtle citrus notes\u2014pairing wonderfully with selected wines or custom French cocktails. The leafy, plant-filled open courtyard offers a relaxed, chilled atmosphere, making it a favorite among Western travelers and local trendsetters.", "name": "The Refinery - French Vietnamese Bistro", "transport": "Located inside the courtyard at 74 Hai B\u00e0 Tr\u01b0ng Street, just a 3-minute walk from the Saigon Opera House."}, {"address": "21 H\u00e0n Thuy\u00ean, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | Located right by Notre-Dame Cathedral and the Independence Palace, this bistro boasts vibrant walls covered in retro Vietnamese propaganda murals, creating a bold and energetic vibe. Known for healthy local light bites and craft drinks, high recommendations go to the \u0027Pork and Shrimp Fresh Spring Rolls\u0027 and \u0027Crispy Roasted Chicken Thigh with Turmeric Rice\u0027. The spring rolls feature thin, springy rice paper wrapped around ultra-crunchy fresh greens, paired with a rich peanut sauce that leaves you wanting more. Refreshing and light on the palate, enjoyed alongside a signature Vietnamese herb cocktail, it\u0027s a super popular spot to unwind afternoon or night.", "name": "Propaganda Vietnamese Bistro", "transport": "Located next to April 30th Park, about a 2-minute walk from Notre-Dame Cathedral."}, {"address": "Second Floor, 63 \u0110\u00f4ng Du, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | Perched on the second floor of a heritage French building on \u0110\u1ed3ng Kh\u1edfi Street, this is one of Ho Chi Minh City\u0027s most iconic stylish hidden speakeasies and bistros. Beyond its highly acclaimed original cocktails, local fusion bites like the \u0027Spicy Vietnamese Wagyu Sliders\u0027 and \u0027Crispy Seafood Tartlets\u0027 shine brilliantly. The seafood tartlets feature an ultra-crispy shell filled with snappy shrimp and fresh tangy sauce, delivering rich layers of taste. Vibrant, atmospheric, and aesthetically designed, it is a premier choice to experience District 1\u0027s chic nightlife and gourmet snacks.", "name": "Layla - Eatery \u0026 Crisp Bar", "transport": "About a 1-minute walk from the Sheraton Hotel; head up the stairs along \u0110\u00f4ng Du Street to the second floor."}, {"address": "74/7H Hai B\u00e0 Tr\u01b0ng, B\u1ebfn Ngh\u00e9, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | Also situated within the historical site of the former opium factory, Hoa T\u00fac was Ho Chi Minh City\u0027s very first refined modern Vietnamese restaurant. Signature dishes include the \u0027Green Papaya Salad with Shrimp\u0027 and \u0027Grilled Sea Bass with Lemongrass\u0027. The grilled sea bass boasts a crispy charred skin and tender, melt-in-your-mouth flesh infused with subtle lemongrass and coconut aromas, elevated even further when dipped in signature salt-pepper-lime juice. Vintage cast-iron railings and a lush green garden courtyard create a deeply elegant dining atmosphere that draws food connoisseurs from all around.", "name": "Hoa T\u00fac Restaurant", "transport": "About a 4-minute walk from behind the Saigon Opera House into the courtyard."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "32 L\u00ea Anh Xu\u00e2n, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | This exquisite vegetarian restaurant seamlessly combines traditional Vietnamese ingredients with modern healthy cooking. The signature lotus root soup and coconut curry are smooth and rich, with a delicate, naturally sweet broth; the fried tofu is crispy on the outside and tender inside, offering rich layers of flavor when dipped in the house-special passion fruit sauce. Filled with warm wooden accents and a lush garden ambiance, it is immensely popular with foreign tourists and hipsters alike.", "name": "Hum Vegetarian Cafe \u0026 Restaurant", "transport": "Take a Grab ride or walk about 3 minutes from Ben Thanh Market."}, {"address": "31 Tr\u1ecbnh V\u0103n C\u1ea5n, C\u1ea7u \u00d4ng L\u00e3nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | A high-end vegetarian sanctuary blending Tibetan and Vietnamese Zen aesthetics. Highly recommended is their Vegetarian Pho (Ph\u1edf Chay)\u2014the broth is slow-simmered for hours with apples, Chinese cabbage, and herbs, producing a clean, smooth taste with natural sweetness. Paired with tender plant-based slices and fresh basil, it rivals any meat version. The warm lighting and exquisite tea selection make it a peaceful favorite for discerning foodies.", "name": "The Shamballa Vegetarian, Restaurant \u0026 Tea House", "transport": "Located near the Ph\u1ea1m Ng\u0169 L\u00e3o area, about an 8-minute walk from B\u00f9i Vi\u1ec7n Walking Street."}, {"address": "19 Nguy\u1ec5n Th\u1ecb Minh Khai, B\u1ebfn Ngh\u00e9 Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A cozy vegetarian bistro tucked away on the second floor of a charming French colonial building. Their fresh spring rolls (featuring konjac \u0027shrimp\u0027) feature a thin, chewy rice paper wrapper stuffed with fresh mint and crunchy cucumber, served with a rich peanut dip for a refreshing taste. With creative, balanced dishes, it\u2019s a favorite hidden gem among local youth and international travelers.", "name": "Pi Vegetarian Bistro", "transport": "About a 7-minute walk from the Saigon Central Post Office."}, {"address": "31 C\u1ed1ng Qu\u1ef3nh, Nguy\u1ec5n C\u01b0 Trinh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A hugely popular, budget-friendly vegetarian eatery founded by a famous Vietnamese celebrity. Must-orders include the aromatic deep-fried mushrooms and coconut curry pot; juicy mushrooms with great texture paired with rich curry poured over fragrant jasmine rice will keep you coming back for more. The wholesome, home-style flavors are light on oil and salt yet full of taste, making it beloved by local vegetarians and travelers seeking authentic Vietnamese comfort food.", "name": "Buddha Chay", "transport": "About a 5-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street."}, {"address": "86 Nguy\u1ec5n Du, B\u1ebfn Ngh\u00e9 Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Specializing in traditional Southern Vietnamese vegetarian hot pots and signature craft dishes. Their signature Water Lily Hot Pot features a delightfully sweet, sour, and mildly spicy broth that stays refreshing on the palate. Packed with fresh veggies, wild mushrooms, and water lily stems\u2014which absorb the flavorful broth and offer a surprisingly crunchy bite. The elegant dining atmosphere draws many families and hot pot enthusiasts.", "name": "B\u00f4ng S\u00fang Vegetarian Restaurant", "transport": "Just about a 3-minute walk from Notre-Dame Cathedral Basilica of Saigon."}, {"address": "37B C\u00f4 B\u1eafc, C\u1ea7u \u00d4ng L\u00e3nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Named after the Vietnamese word for \u0027vegetable\u0027 (\u0027Rau\u0027), this eatery focuses on wholesome whole-food plant-based dishes. A highlight is their Vegetarian B\u00e1nh X\u00e8o (crispy pancake), where the outer crust\u2014infused with turmeric and coconut milk\u2014is cooked to ultimate crunchy perfection. Stuffed with bean sprouts, wild mushrooms, and mung beans, wrapped in fresh lettuce leaves and dipped in special vegan fish sauce, it is crisp, non-greasy, and a top choice for healthy eaters.", "name": "Rou Vegetarian Restaurant", "transport": "About a 5-minute Grab car ride from Ben Thanh Market."}, {"address": "291 Nguy\u1ec5n Tr\u00e3i, Nguy\u1ec5n C\u01b0 Trinh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A fusion vegan spot combining authentic Vietnamese snacks with Southeast Asian flavors. Their signature Vegan Hainanese Chicken Rice features fragrant turmeric rice served with tender mock chicken, pickled radish, and house-made ginger sauce\u2014strikingly authentic and delicious. Another standout is the spicy Vegan Laksa, brimming with coconut milk fragrance. It\u0027s a hugely popular budget-friendly vegan choice in District 1.", "name": "Mani Vegan Restaurant", "transport": "Located in the Nguy\u1ec5n Tr\u00e3i commercial area, about an 8-minute Grab ride from Bitexco Financial Tower."}, {"address": "35 Nguy\u1ec5n Tr\u00e3i, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Located near the backpacker quarter, renowned for its incredible value and authentic Vietnamese vegetarian street eats. Their Vegan B\u00e1nh M\u00ec (B\u00e1nh M\u00ec Chay) is a must-try: a crisp-on-the-outside, soft-on-the-inside baguette stuffed with vegan char siu, custom plant-based spread, pickled cucumbers, and cilantro, achieving a delicious balance of savory, sweet, and tangy flavors. Warm and cozy, it\u0027s a global backpacker favorite.", "name": "Veggie Saigon Vegetarian Restaurant", "transport": "Just about a 6-minute walk from Ben Thanh Market."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "26 L\u00ea Th\u1ecb Ri\u00eang, Ph\u1ea1m Ng\u0169 L\u00e3o Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.6 Stars | Renowned as Ho Chi Minh City\u0027s ultimate banh m\u00ec giant! This legendary long-queue spot is famous for its ridiculously generous fillings. The baguette is baked to extreme crunchiness, crackling with every bite. Inside, it\u0027s packed with thick layers of homemade pork p\u00e2t\u00e9, sliced hams, char siu pork, and crunchy cucumbers. Spicy chilies and sweet-and-sour pickled daikon perfectly balance the richness of the meats. Rich, savory, and multi-layered, this juicy street delicacy is an absolute must-try in District 1.", "name": "Huynh Hoa Banh Mi (B\u00e1nh M\u00ec Hu\u1ef3nh Hoa)", "transport": "Take a Grab or walk about 5 minutes from Pham Ngu Lao Street"}, {"address": "46A \u0110inh C\u00f4ng Tr\u00e1ng, T\u00e2n \u0110\u1ecbnh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.2 Stars | A Michelin-recommended legendary traditional banh xeo spot! Using traditional charcoal fires and large cast-iron skillets, they pour rice batter infused with turmeric and coconut milk into hot pans to fry to golden perfection upon ordering. Crisp and crackling on the outside, it is packed inside with fresh shrimp, pork slices, bean sprouts, and mung beans. To eat, wrap pieces of the pancake with fresh lettuce and herbs, then dip into sweet, sour, and mildly spicy fish sauce. The contrast between crispy warmth and refreshing cool greens creates a rich texturing experience that draws foodies from all over.", "name": "B\u00e1nh X\u00e8o 46A Dinh Cong Trang", "transport": "Take a Grab to near Tan Dinh Church (Pink Church) and walk about 3 minutes"}, {"address": "4 Phan B\u1ed9i Ch\u00e2u, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | A decades-old legendary street stall located right outside Ben Thanh Market! This Vietnamese crab noodle soup features a savory broth simmered with fresh crab essence and tomatoes, boasting an inviting reddish hue that is delightfully sweet and tangy. The bowl is loaded with soft rice vermicelli, a thick patty of silky crab-and-egg cake, tender blood pudding, and juicy fried tofu absorbing the broth. Add a dash of shrimp paste and a squeeze of lime before eating for an explosion of savory, tangy flavors. A truly authentic market flavor in District 1.", "name": "Ben Thanh Market Bun Rieu Ganh (B\u00fan Ri\u00eau G\u00e1nh Ch\u1ee3 B\u1ebfn Th\u00e0nh)", "transport": "Walk about 1 minute from the East Gate of Ben Thanh Market to find the stall"}, {"address": "Nguy\u1ec5n Hu\u1ec7 Walking Street, B\u1ebfn Ngh\u00e9 Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | The hugely popular walking snack known as \u0027Vietnamese Pizza\u0027! Vendors grill paper-thin rice paper over charcoal, brushing it with quail egg, butter, scallions, pork floss, tiny dried shrimp, and a special chili sauce, grilling it until golden and crispy before rolling or slicing it. One bite offers a potato-chip crunch packed with rich egg, savory butter, and a mild kick of spice. It\u0027s the ultimate grab-and-go street snack while strolling down Nguyen Hue Walking Street at night.", "name": "Nguyen Hue Walking Street Grilled Rice Paper (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng)", "transport": "Take the Metro to Ben Thanh Station or walk 3 minutes from the Saigon Opera House to Nguyen Hue Walking Street"}, {"address": "127 \u0110inh Ti\u00ean Ho\u00e0ng, \u0110a Kao Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.1 Stars | A century-old iconic spot for Northern-style fresh steamed rice rolls! Rice batter is spread over cloth and steamed to create silky, translucent sheets that are quickly rolled around seasoned minced pork, wood ear mushrooms, and onions. Fresh out of the steamer, the rolls are amazingly tender and melt-in-your-mouth. Topped with crispy fried shallots and Vietnamese pork ham (ch\u1ea3 l\u1ee5a), then dipped in warm, sweet-and-savory light fish sauce, it is silky, fragrant, non-greasy, and deeply beloved by locals.", "name": "Tay Ho Steamed Rice Rolls (B\u00e1nh Cu\u1ed1n T\u00e2y H\u1ed3)", "transport": "Take a Grab to \u0110inh Ti\u00ean Ho\u00e0ng Street, near the \u0110a Kao area"}, {"address": "Stall 1121, Ben Thanh Market, L\u00ea L\u1ee3i Street, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.2 Stars | A decades-old classic Vietnamese dessert stall hidden inside Ben Thanh Market! Its colorful counter display is a visual treat. The signature \u0027Ch\u00e8 Th\u1eadp C\u1ea9m\u0027 (Mixed Sweet Soup) features mung bean paste, red beans, jackfruit, attap seeds, coconut jelly, and aromatic green pandan jellies, topped with rich homemade coconut cream and shaved ice. Refreshingly cold, it blends chewy, creamy, and crispy textures with fragrant coconut flavors\u2014the perfect cooling treat after an afternoon of market shopping.", "name": "Che Be Ba - Ben Thanh Market (Ch\u00e8 B\u00e9 Ba)", "transport": "Enter the Ben Thanh Market food court area and look for Stall 1121"}, {"address": "115B Nguy\u1ec5n Tr\u00e3i, B\u1ebfn Th\u00e0nh Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.5 Stars | A Michelin Bib Gourmand recommended traditional street dessert! Ripe bananas are wrapped in seasoned sticky rice and banana leaves, then slow-grilled over charcoal until the outer sticky rice becomes smoky and crispy. Sliced into bite-sized pieces before serving, it is drizzled with warm, sweet-and-savory coconut sauce and topped with roasted crushed peanuts. The crispy exterior combined with sweet, soft banana, smooth coconut milk, and crunchy peanuts creates a comforting, addictive warm treat.", "name": "Nguyen Trai Grilled Banana Wrapped in Sticky Rice (Chu\u1ed1i N\u01b0\u1edbng)", "transport": "Walk about 7 minutes from Ben Thanh Market along Nguy\u1ec5n Tr\u00e3i Street"}, {"address": "84 Nguy\u1ec5n Du, B\u1ebfn Ngh\u00e9 Ward, District 1, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | A beloved street side crab soup highly recommended by local office workers and students! This rich, velvety soup is packed with generous ingredients: shredded fresh crab meat, shredded chicken, sweet corn, wood ear fungus, rich century egg, and quail eggs. Perfectly thickened and smooth, the broth delivers intense seafood sweetness balanced with cilantro. Add a sprinkle of pepper and black vinegar to elevate the flavor even further. Comforting, smooth, and warm, it is a wildly popular local treat in District 1.", "name": "Trang Nguyen Du Crab Soup (S\u00fap Cua Trang Nguy\u1ec5n Du)", "transport": "Located right behind Notre-Dame Cathedral Basilica of Saigon, about a 3-minute walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "District 1 - Historic City Center and Landmark Sightseeing Area"}, "district_2_thaodien": {"categories": {"cat_1": {"items": [{"address": "55 Ng\u00f4 Quang Huy, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Tucked away in a lush, green garden, this renowned Vietnamese restaurant elevates classic home-cooked dishes to a refined culinary art. The must-try fried spring rolls feature an extraordinarily crispy shell filled with plump shrimp and aromatic herbs, served with a signature sweet-and-sour fish sauce that wakes up your appetite. The stir-fried beef with lemongrass and the large bowl of sour fish soup are deliciously authentic, delivering a sweet, subtly tangy broth that recreates the cozy warmth of a Vietnamese family table. A beloved favorite for both expats and local foodies.", "name": "Qu\u00e1n B\u1ee5i Garden - Traditional Vietnamese Home Cooking", "transport": "About a 20-minute drive from central Ho Chi Minh City via Saigon Bridge into Thao Dien; or take a Grab ride and get off at the intersection of Ng\u00f4 Quang Huy Street, then walk a few steps."}, {"address": "15 Tr\u00fac \u0110\u01b0\u1eddng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A beloved traditional pho spot rooted in the Thao Dien community for years, famous for its clear, slow-simmered beef bone broth that is rich, smooth, and naturally sweet without being greasy. The tender rare beef slices melt in your mouth, pairing perfectly with springy rice noodles that soak up the flavorful soup. Served with a generous mound of fresh herbs and Thai basil, plus a squeeze of lime for a tangy citrus kick, it\u0027s the top choice for locals starting their morning.", "name": "Ph\u1edf Th\u1ea3o \u0110i\u1ec1n (Thao Dien Beef Pho)", "transport": "Take a Grab car or motorbike to Tr\u00fac \u0110\u01b0\u1eddng Street. Located near the traditional Thao Dien market area, it\u0027s easily accessible."}, {"address": "12 Nguy\u1ec5n Duy Hi\u1ec7u, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Saigon\u2019s iconic local comfort food at its finest! Thick, golden-charred grilled pork chops drizzled with fragrant scallion oil and a signature sweet-and-spicy fish sauce, served over fluffy broken rice. Every bite bursts with smoky barbecue aroma. Adding a steamed egg meatloaf and shredded pork skin creates even richer textures\u2014a savory, sweet explosion that is an absolute must-try to experience Southern Vietnamese food culture.", "name": "C\u01a1m T\u1ea5m Ph\u00fac L\u1ed9c Th\u1ecd - Th\u1ea3o \u0110i\u1ec1n", "transport": "Just a 3-minute walk from Thao Dien\u0027s main street, Qu\u1ed1c H\u01b0\u01a1ng. Take a bus or taxi to the Nguy\u1ec5n Duy Hi\u1ec7u stop."}, {"address": "22 Nguy\u1ec5n C\u1eeb, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A renowned restaurant specializing in traditional Central Vietnamese royal cuisine from Hue. The iconic B\u00fan B\u00f2 Hu\u1ebf features a broth deeply simmered with lemongrass and shrimp paste, offering a delicately spicy, savory flavor infused with herbal notes. Thick rice noodles deliver a satisfying chew alongside tender beef chunks and pig blood curd. Don\u0027t miss their freshly made steamed rice cakes with shrimp (B\u00e1nh B\u00e8o)\u2014soft, silky, and drizzled with sweet-savory fish sauce.", "name": "Qu\u00e1n O Xu\u00e2n - Hue Specialties", "transport": "About a 5-minute Grab bike or taxi ride from Thao Dien\u0027s main avenue into the alleys of Nguy\u1ec5n C\u1eeb Street."}, {"address": "1 Tr\u00fac \u0110\u01b0\u1eddng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Savor authentic Hanoi-style grilled pork noodles without traveling to Northern Vietnam! Charcoal-grilled pork slices and patties are freshly made to order and served in a warm, gently sweet fish sauce broth with green papaya. The meat is crispy on the outside, juicy on the inside, and infused with smoky goodness. Paired with silky rice vermicelli and a bountiful plate of fresh herbs and greens, it\u0027s a light, refreshing meal that wins over both expat and local palates.", "name": "B\u00fan Ch\u1ea3 H\u00e0 N\u1ed9i - Tr\u00fac \u0110\u01b0\u1eddng", "transport": "Located near the intersection of Tr\u00fac \u0110\u01b0\u1eddng and Xu\u00e2n Th\u1ee7y. Take a taxi or bus to the entrance of the Thao Dien area, then a short walk."}, {"address": "32 Street No. 10, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | A legendary vegetarian spot elevating traditional plant-based dining into a fine art form. Using premium local produce and aromatic herbs, crowd favorites like the Tom Yum-style vegetable soup and lemongrass coconut grilled tofu deliver velvety textures and rich flavors. The handmade fresh spring rolls feature chewy, delicate wrappers packed with juicy fillings, completely redefining vegetarian cuisine amidst a serene, lush garden setting.", "name": "Hum Vegetarian, Garden \u0026 Cafe", "transport": "A 15\u201320 minute drive from District 1 into Thao Dien\u0027s Street No. 10. Taking a Grab directly to the destination is recommended."}, {"address": "10 Nguy\u1ec5n V\u0103n H\u01b0\u1edfng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A long-standing staple specializing in Southern Vietnamese crispy pancakes (B\u00e1nh X\u00e8o). The golden batter, infused with coconut milk and turmeric, is fried to an addictively crunch-worthy crisp. Packed with fresh shrimp, pork slices, and heaps of bean sprouts, it\u0027s meant to be wrapped in crisp lettuce or mustard leaves and dipped in sweet-and-sour fish sauce. Crispy, savory, and refreshingly light, this local delicacy is irresistible.", "name": "Qu\u00e1n B\u00e1nh X\u00e8o C\u00f4 Ba (C\u00f4 Ba Crispy Pancakes)", "transport": "Located along the riverside boulevard Nguy\u1ec5n V\u0103n H\u01b0\u1edfng. Reaching it by taxi or motorbike is most convenient."}, {"address": "44 Qu\u1ed1c H\u01b0\u01a1ng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | A traditional neighborhood noodle stall hidden in an alley, highly recommended by locals for its soul-warming B\u00fan B\u00f2 Hu\u1ebf. The deeply aromatic, mildly spicy broth is infused with robust lemongrass and shrimp paste flavors. Generously thick beef slices are simmered to tender perfection, served over chewy rice noodles and crisp bean sprouts. Every bite delivers a rich splash of flavor\u2014the perfect choice for an authentic, down-to-earth Saigon breakfast.", "name": "B\u00fan B\u00f2 Hu\u1ebf Thu D\u00e2n", "transport": "Located on Thao Dien\u0027s main artery, Qu\u1ed1c H\u01b0\u01a1ng Street. Take a taxi or bus to the Th\u1ea3o \u0110i\u1ec1n stop and walk for about 2 minutes."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "23 Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Tucked away in Th\u1ea3o \u0110i\u1ec1n, this rustic garden cafe features decor rich in woven bamboo and wooden elements. Their homemade sourdough brunch is immensely popular\u2014crispy bread crust paired with smooth poached eggs and smoked salmon creates a richly layered, tender texture. Both tourists and local expats love enjoying a leisurely morning here with a rich, aromatic Vietnamese-French coffee.", "name": "Mekong Merchant", "transport": "Take a Grab or taxi to Th\u1ea3o \u0110i\u1ec1n Street; it is easily accessible on foot."}, {"address": "38 Nguy\u1ec5n V\u0103n H\u01b0\u1edfng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Situated along the Saigon River, this is the top pick for scenic cafe dining and brunch. The signature Eggs Benedict features custom hollandaise sauce, tender egg whites, and a richly flowing yolk that fuses perfectly with the crispy English muffin below. Accompanied by a gentle river breeze and a cup of exquisite pour-over cold brew, it is a dream spot to experience the French romance and luxury brunch vibes of Th\u1ea3o \u0110i\u1ec1n.", "name": "The Deck Saigon", "transport": "Recommended to take a Grab directly to the riverfront at the end of Nguy\u1ec5n V\u0103n H\u01b0\u1edfng Street."}, {"address": "97B Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Housed in a minimalistic all-white Mediterranean-style building, LuBu highlights healthy yet distinctive exotic brunch dishes. The must-order Shakshuka is simmered in a rich, spiced tomato sauce, served with runny eggs and freshly baked crispy pita bread that is chewy, tangy, and appetizing. Selecting fresh ingredients, it attracts hipsters and expats looking for healthy dining and Instagram-worthy spots.", "name": "LuBu Saigon", "transport": "Take a Grab to near the intersection of Th\u1ea3o \u0110i\u1ec1n Street and Nguy\u1ec5n V\u0103n H\u01b0\u1edfng."}, {"address": "32 Tr\u1ea7n Ng\u1ecdc Di\u1ec7n, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A lifestyle cafe concept combining select lifestyle shops with a lush garden courtyard, exuding a relaxed neighborhood vibe. The classic Full English Breakfast includes juicy sausages, crispy bacon, and creamy scrambled eggs, while the French toast\u2014crispy on the outside, soft inside, and drizzled with maple syrup\u2014is irresistible. With its laid-back atmosphere, it serves as a cozy base for expat families and trendsetters in District 2 to unwind over afternoon coffee and freshly baked pastries.", "name": "The Snap Cafe", "transport": "Take a Grab to Tr\u1ea7n Ng\u1ecdc Di\u1ec7n Street; the caf\u00e9 is located inside the creative complex."}, {"address": "71 Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A retro 50s-style American deli and diner exuding nostalgic charm. The signature New York bagel is chewy on the outside, soft inside, slathered with a thick layer of cream cheese, and topped with smoked salmon. The American pancakes are soft, fluffy, and richly milky. Paired with bottomless drip coffee or thick milkshakes, it is highly praised by diners who love authentic American flavors.", "name": "Eddie\u0027s New York Deli \u0026 Diner - Thao Dien", "transport": "Take a Grab to the middle section of Th\u1ea3o \u0110i\u1ec1n\u0027s main street."}, {"address": "215 \u0110. Nguy\u1ec5n V\u0103n H\u01b0\u1edfng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A plant-based brunch sanctuary hidden inside a lush poolside villa with strong Bohemian resort vibes. Their popular chia acai smoothie bowl is thick, smooth, cool, and refreshing, topped with crunchy nuts and fresh tropical fruits\u2014both beautiful and guilt-free. Enjoying specialty pour-over coffee surrounded by greenery and water makes guests feel instantly transported away from the city hustle.", "name": "L\u0027Herbanyste", "transport": "Take a Grab to the further end of Nguy\u1ec5n V\u0103n H\u01b0\u1edfng Street."}, {"address": "28 Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | The most iconic independent corner cafe in Th\u1ea3o \u0110i\u1ec1n, serving as a morning staple for both locals and expats. Their signature iced Vietnamese coconut coffee is rich and smooth, perfectly blending coconut aroma with bittersweet coffee and crushed ice for a refreshing chill. The freshly baked chocolate croissant, crispy on the outside and soft inside, is the ultimate pairing dessert, capturing the most authentic yet unpretentious cafe culture of Th\u1ea3o \u0110i\u1ec1n.", "name": "Dolphy Cafe", "transport": "Take a Grab to the prominent corner at the beginning of Th\u1ea3o \u0110i\u1ec1n Street."}, {"address": "6 L\u00ea V\u0103n Mi\u1ebfn, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A hip brunch hub blending an art display space with specialty coffee. The signature avocado sourdough toast is generously spread with smooth avocado mash, a soft poached egg, and a sprinkle of lightly spiced crushed nuts, delivering vibrant and rich layers in every bite. Offering a variety of single-origin pour-over coffees with bright acidity and a sweet finish, it is a favorite among local young artists and trendsetters.", "name": "Soma Saigon", "transport": "Take a Grab to L\u00ea V\u0103n Mi\u1ebfn Street; located quietly and conveniently in an alley."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "55 Ng\u00f4 Quang Huy, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Tucked away in a lush green garden in the Th\u1ea3o \u0110i\u1ec1n area, this bistro elegantly presents traditional Vietnamese home-cooked dishes in a modern bistro style. Signature favorites include pan-seared soft-shell crab with passion fruit sauce\u2014boasting a crispy exterior and tender, juicy crab meat perfectly balanced by the tangy-sweet sauce\u2014and slow-simmered caramelized pork belly pot, rich, savory-sweet, fragrant, and pairs exceptionally well with rice. Paired with house-crafted tropical cocktails, guests can enjoy a Vietnamese culinary feast blending local heritage with chic modern flair in a relaxing natural atmosphere, highly favored by expats and tourists alike.", "name": "Qu\u00e1n B\u1ee5i Garden - Garden Style Vietnamese Home Cooking Bistro (Qu\u00e1n B\u1ee5i Garden)", "transport": "Take a Grab taxi directly to Ng\u00f4 Quang Huy Street in Th\u1ea3o \u0110i\u1ec1n."}, {"address": "47 Xu\u00e2n Th\u1ee7y, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | The Th\u1ea3o \u0110i\u1ec1n branch of Ho Chi Minh City\u0027s most famous American slow-smoked BBQ bistro seamlessly combines Southern American barbecue techniques with local Vietnamese spices. The signature baby back ribs are smoked low and slow over longan wood for hours until fall-off-the-bone tender, infused with a rich smoky aroma and glazed with a sweet and tangy custom passion fruit BBQ sauce. Paired with crisp local craft beer, it perfectly cuts through the richness, creating a vibrant and wild American dining atmosphere\u2014making it a top choice for gatherings and meat lovers.", "name": "Quan Ut Ut - American BBQ \u0026 Craft Beer Bistro (Quan Ut Ut Thao Dien)", "transport": "Located on the main artery of Xu\u00e2n Th\u1ee7y; taking a Grab or riding a motorbike is recommended."}, {"address": "38 Nguy\u1ec5n V\u0103n H\u01b0\u1edfng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A premier open-air bistro situated right on the banks of the Saigon River, famous for captivating sunset river views and exquisite modern Pan-Asian cuisine. Highly recommended dishes include pan-seared Ph\u00fa Qu\u1ed1c black pepper short ribs\u2014seared to a crispy crust with juicy, tender pink meat inside, complemented by the aromatic kick of cracked black pepper\u2014and freshly shucked oysters served with Vietnamese lime-chili sauce, offering a vibrant explosion of sweet ocean flavors and zesty spice. Sipping a signature tropical cocktail as the sun sets amidst gentle breezes and sparkling reflections delivers the ultimate luxurious and romantic nightlife experience.", "name": "The Deck Saigon - Riverside Luxury Bistro (The Deck Saigon)", "transport": "About a 20-minute taxi ride from District 1; you can also reserve the restaurant\u0027s private water taxi."}, {"address": "197/2 Nguy\u1ec5n V\u0103n H\u01b0\u1edfng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A French white-colonial style riverfront bistro nestled within the Villa Song Boutique Hotel, offering fine dining that fuses French culinary techniques with fresh local Vietnamese ingredients. The must-order pan-seared foie gras with caramelized apples melts in your mouth with its rich texture perfectly balanced by tangy-sweet apples. The seared Saigon River sea bass with herb butter sauce features golden crispy skin and delicately tender meat. The outdoor dining area with white umbrellas sits right by the river, offering a quiet and elegant ambience beloved by couples and business diners alike.", "name": "Bistro Song Vie - Estate Riverfront Bistro (Bistro Song Vie Saigon)", "transport": "Take a Grab to Villa Song Hotel near the end of Nguy\u1ec5n V\u0103n H\u01b0\u1edfng Street."}, {"address": "23 Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | One of the oldest and most iconic garden bistros in Th\u1ea3o \u0110i\u1ec1n, crafted with thatched roofs, red brick walls, and traditional woven bamboo to create a charming Southeast Asian farmhouse vibe. Specializing in Mediterranean dishes and Southeast Asian favorites, their fresh wood-fired pizzas boast crispy yet chewy crusts overflowing with rich cheese and herbs, while the Vietnamese green papaya salad with prawns offers a delightfully crunchy, spicy, and tangy kick with succulent prawns. With a laid-back, vintage aesthetic, it is constantly buzzing with tourists and local expats from morning brunch to evening drinks.", "name": "Mekong Merchant - Retro Rustic Bistro (Mekong Merchant Thao Dien)", "transport": "Located on the main street of Th\u1ea3o \u0110i\u1ec1n, about a 15-minute drive from District 1 city center."}, {"address": "18 Street No. 6, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A minimalist cocktail bistro built with earthy clay textures and modern geometric aesthetics, featuring an exquisite open-air pool and garden terrace. The cuisine focuses on refined Mediterranean and flame-grilled dishes. The signature charcoal-grilled spiced lamb chops are coated in herb breadcrumbs, offering juicy, tender meat with subtle smoky notes and no gamey odor. Pair them with their house-developed peaty smoked whisky cocktails for a smooth, complex flavor profile. Exuding a chic vibe, the ambient lighting at night creates a romantic and vibrant atmosphere, making it a hotspot for Ho Chi Minh City\u0027s trendsetters and influencers.", "name": "The Clay - Terracotta Style Mediterranean Bistro (The Clay Saigon)", "transport": "Take a taxi directly to Street No. 6 in Th\u1ea3o \u0110i\u1ec1n."}, {"address": "97B Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A refined Mediterranean bistro specializing in Greek, Spanish, and Italian flavors. Designed with crisp white walls and refreshing blue accents, it radiates a French Riviera resort vibe. The Spanish seafood paella is highly recommended, featuring al dente rice infused with rich lobster and scallop broth, topped with king prawns, mussels, and squid. The pan-seared Iberian pork ribs feature a light crispy skin and juicy, flavorful meat. Accompanied by selected Mediterranean wines, it offers a superb slow-dining experience highly acclaimed by food connoisseurs.", "name": "Lubu - Mediterranean Style Bistro (Lubu Mediterranean Restauran
