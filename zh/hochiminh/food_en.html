    <script>
        const db = {"binh_thanh_landmark": {"categories": {"cat_1": {"items": [{"address": "318/1 B\u00f9i H\u1eefu Ngh\u0129a, Ph\u01b0\u1eddng 1, B\u00ecnh Th\u1ea1nh, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | A decades-old sticky rice stall located next to B\u00e0 Chi\u1ec3u Market, this is one of the most famous traditional street food spots in B\u00ecnh Th\u1ea1nh District. Its signature chicken sticky rice features crispy fried chicken legs or char siu marinated in a unique house sauce, paired with rich, chewy sticky rice, and sprinkled with crispy fried shallots and special chili sauce. Taking a bite reveals crispy skin with juicy meat inside, while the sticky rice absorbs the savory sauce and chicken oil aromas, offering a satisfying, multi-layered texture highly recommended by locals and foodies alike.", "name": "B\u00e0 Chi\u1ec3u Market Chicken Sticky Rice (X\u00f4i G\u00e0 Ch\u1ee3 B\u00e0 Chi\u1ec3u)", "transport": "Take a Grab or taxi to the area around B\u00e0 Chi\u1ec3u Market (Ch\u1ee3 B\u00e0 Chi\u1ec3u), then walk a short distance."}, {"address": "218 B\u00ecnh Qu\u1edbi, Ph\u01b0\u1eddng 28, B\u00ecnh Th\u1ea1nh, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Located on the Thanh \u0110a Peninsula in B\u00ecnh Th\u1ea1nh District, this decades-old duck specialty restaurant is renowned across Ho Chi Minh City. The establishment insists on using high-quality, plump duck cooked in a traditional poached style, yielding thin skin and tender meat completely free of gamey odor. The signature duck platter is paired with a secret ginger fish sauce dip\u2014sweet, sour, mildly spicy, and rich with ginger fragrance. It comes with a refreshing sweet-and-sour cabbage salad, or can be enjoyed alongside warm duck bamboo shoot porridge and duck salad (G\u1ecfi V\u1ecbt), keeping diners coming back for more.", "name": "Thanh \u0110a Duck Rice (Qu\u00e1n V\u1ecbt Thanh \u0110a - G\u1ed1c Nh\u00e0 \u0110\u00e8n)", "transport": "About a 15-minute drive or Grab ride from Landmark 81 to the Thanh \u0110a Peninsula area."}, {"address": "1 Nguy\u1ec5n An Ninh, Ph\u01b0\u1eddng 14, B\u00ecnh Th\u1ea1nh, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | One of the most iconic local broken rice spots in B\u00ecnh Th\u1ea1nh District, consistently drawing crowds during mealtimes. Their grilled pork chops (S\u01b0\u1eddn n\u01b0\u1edbng) are freshly charred over charcoal using traditional methods, producing thick, juicy cuts infused with smoky flavor and a sweet savory marinade. Served over soft, fluffy broken rice alongside steamed egg quiche (Ch\u1ea3 tr\u1ee9ng) and crispy shredded pork skin, all drizzled with a perfectly balanced sweet-and-spicy house fish sauce, this dish offers a delightful interplay of savory and sweet notes\u2014a must-visit to experience authentic Saigon street food culture.", "name": "T\u00e0i Broken Rice (C\u01a1m T\u1ea5m T\u00e0i)", "transport": "Take a taxi or Grab to the intersection of Nguy\u1ec5n An Ninh and L\u00ea Quang \u0110\u1ecbnh streets."}, {"address": "119 V\u0169 T\u00f9ng, Ph\u01b0\u1eddng 2, B\u00ecnh Th\u1ea1nh, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | A well-known classic eatery specializing in traditional Southern-style pan-fried sizzling crepes (B\u00e1nh X\u00e8o Ch\u1ea3o). The golden, crispy batter\u2014made from rice flour and turmeric\u2014is cooked until paper-thin and crunchy, wrapped around a generous filling of fresh shrimp, pork belly, mung beans, and sweet bean sprouts. To eat, wrap a piece of the crispy crepe and filling in fresh lettuce and herbs, then dip into well-balanced sweet-and-sour fish sauce. The crisp freshness of the greens gives way to the golden crunch of the crepe and savory seafood and pork flavors without feeling greasy at all.", "name": "B\u00e0 Hai Pan-Fried Sizzling Crepe (B\u00e1nh X\u00e8o Ch\u1ea3o B\u00e0 Hai)", "transport": "Located near B\u00e0 Chi\u1ec3u Market; taking a Grab to V\u0169 T\u00f9ng Street and walking is recommended."}, {"address": "21 B\u00f9i H\u1eefu Ngh\u0129a, Ph\u01b0\u1eddng 1, B\u00ecnh Th\u1ea1nh, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | A legendary decades-old pho joint serving traditional Northern-style beef pho, hidden in the old quarter of B\u00ecnh Th\u1ea1nh District. Its broth is slow-simmered for hours with marrow bones and traditional Chinese medicinal spices, yielding a crystal-clear yet intensely savory soup brimming with rich beef essence and subtle ginger warmth. The rice noodles are silky smooth, and the thinly sliced rare beef (T\u00e1i) cooks gently in the scalding broth to stay tender and succulent. Finished with sliced raw onion and Thai basil, it perfectly captures the deep, authentic essence of classic Vietnamese pho.", "name": "Quy\u1ec1n Beef Pho (Ph\u1edf Quy\u1ec1n)", "transport": "About a 10-minute Grab ride from Landmark 81."}, {"address": "117 V\u0169 T\u00f9ng, Ph\u01b0\u1eddng 2, B\u00ecnh Th\u1ea1nh, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | A famous local spot specializing in Mekong Delta-style fermented fish noodle soup (B\u00fan M\u1eafm). The soup base is slow-cooked with fermented fish paste, giving off a bold, distinct oceanic aroma blended with herbs that tastes surprisingly sweet and savory rather than overly heavy. The bowl is packed with generous toppings including roasted pork, fresh shrimp, squid, eggplant, and fish balls, served alongside a mound of fresh local Saigon herbs and water lily stems. The thick rice noodles soak up the rich broth, delivering a sensational blend of seafood and herb flavors with every bite.", "name": "V\u0169 T\u00f9ng Western Fermented Fish Noodle Soup (B\u00fan M\u1eafm Mi\u1ec1n T\u00e2y V\u0169 T\u00f9ng)", "transport": "Take a Grab to V\u0169 T\u00f9ng Street, located next to B\u00e1nh X\u00e8o Ch\u1ea3o B\u00e0 Hai."}, {"address": "44 Ung V\u0103n Khi\u00eam, Ph\u01b0\u1eddng 25, B\u00ecnh Th\u1ea1nh, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | A famous traditional steamed rice roll eatery located near Landmark 81 and the D2 university area. Making each batch fresh to order, fermented rice batter is spread thin over a cloth screen and steamed into delicate, translucent rice sheets, wrapped around savory minced pork and wood ear mushrooms. Exceptionally soft and melt-in-your-mouth, these rolls are topped with crispy fried shallots, served with Vietnamese sausage (Ch\u1ea3 l\u1ee5a) and bean sprouts, and dipped in warm dipping fish sauce. Light, fragrant, and satisfying, it is a top choice for an authentic Vietnamese breakfast.", "name": "B\u00e0 Xu\u00e2n Steamed Rice Rolls (B\u00e1nh Cu\u1ed1n B\u00e0 Xu\u00e2n)", "transport": "About a 5-minute Grab ride along Ung V\u0103n Khi\u00eam Road from Landmark 81."}, {"address": "67D \u0110inh Ti\u00ean Ho\u00e0ng, Ph\u01b0\u1eddng 3, B\u00ecnh Th\u1ea1nh, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | A highly praised Hu\u1ebf beef noodle soup specialty shop in B\u00ecnh Th\u1ea1nh District, famous for its rich royal-style broth passed down from the ancient capital of Hu\u1ebf. The broth fuses beef marrow, fragrant lemongrass, and special Vietnamese fermented shrimp paste (M\u1eafm ru\u1ed1c), creating a richly layered, mildly spicy, and aromatic soup. Thick rice noodles have a firm texture, topped with tender braised beef shank, pork knuckle, congealed blood, and chewy beef meatballs. Served with shredded cabbage and fresh mint, its smooth, zesty, and spicy flavor profile delivers an unbeatable Central Vietnamese culinary experience.", "name": "M\u1ea1 T\u00f4i Hu\u1ebf Beef Noodle Soup (B\u00fan B\u00f2 Hu\u1ebf M\u1ea1 T\u00f4i)", "transport": "Take a Grab or bus to near the intersection of \u0110inh Ti\u00ean Ho\u00e0ng and Phan \u0110\u0103ng L\u01b0u streets."}], "name": "Traditional Local Gems"}, "cat_2": {"items": [{"address": "75th-76th Floor, Landmark 81, 720A Dien Bien Phu, Ward 22, Binh Thanh, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Located on the 75th and 76th floors of Landmark 81, this high-altitude lounge offers panoramic views of the Saigon River and Ho Chi Minh City skyline. It serves exquisite British afternoon tea and specialty crafted coffees. The signature French fruit tart features a crisp crust and velvety smooth custard cream, pairing perfectly with rich, silky Vietnamese specialty pour-over coffee for a beautifully balanced bittersweet profile. Tourists love visiting at dusk to sit in the high-altitude outdoor seating area, enjoying treats while taking in the stunning sunset and vibrant night lights.", "name": "Blank Lounge Landmark 81", "transport": "Take a Grab or taxi to Landmark 81, enter via the Vinpearl Hotel elevator, and go directly to the 75th floor."}, {"address": "Saigon Pearl, 92 Nguyen Huu Canh, Ward 22, Binh Thanh, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Tucked away in the upscale Saigon Pearl residential area, this minimalist, pure-white specialty coffee shop sits right by the lush Saigon Riverbank. They roast their own single-origin beans, renowned for professional pour-over and espresso extractions. The signature Vietnamese Iced Milk Coffee (C\u00e0 ph\u00ea s\u1eefa \u0111\u00e1) uses high-quality Arabica beans, beautifully blending rich coffee with creamy milk for a smooth, balanced taste that isn\u0027t overly sweet. For brunch, the sourdough toast topped with poached eggs and smoked salmon features perfectly runny yolks, making it a favorite sunny brunch spot for local hipsters and expats.", "name": "Bosgaurus Coffee Roasters", "transport": "Take a Grab inside the Saigon Pearl community, then walk about 3 minutes to reach the standalone white building near the riverbank."}, {"address": "Landmark 1, Vinhomes Central Park, 208 Nguyen Huu Canh, Ward 22, Binh Thanh, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A modern, minimalist caf\u00e9 featuring fantastic natural lighting and exquisite brunch offerings that attract a stylish crowd. The popular \"Classic Aussie Big Breakfast\" includes grilled sausages, mushrooms, sourdough bread, and velvety scrambled eggs with a rich, moist texture. Pair it with a cold brew coffee boasting fruity, bittersweet notes for a cool, refreshing palate cleanser. The outdoor seating area overlooks park greenery, making it the perfect spot to enjoy a lazy morning around the Landmark 81 neighborhood.", "name": "The Running Bean Vinhomes Central Park", "transport": "Take a Grab to the ground-floor retail section of Landmark 1 in Vinhomes Central Park."}, {"address": "14/14 Nguyen Van Thuong, Ward 25, Binh Thanh, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | A hidden green oasis caf\u00e9 that seamlessly blends a traditional Vietnamese brick townhouse with modern industrial style. Their pour-over coffee and special Coconut Milk Coffee (C\u00e0 ph\u00ea c\u1ed1t d\u1eeba) are hugely popular\u2014the creamy coconut smoothie collides with rich Vietnamese Robusta for an authentic Southeast Asian flavor. For brunch, try the freshly toasted B\u00e1nh M\u00ec, featuring an ultra-crispy crust filled with tender pork p\u00e2t\u00e9 and tangy pickled veggies for a savory, flavorful local taste.", "name": "S\u0027mores Saigon C\u00e0 Ph\u00ea B\u00ecnh Th\u1ea1nh", "transport": "Take a Grab to Nguyen Van Thuong Street, turn into Alley 14, and walk about 1 minute to arrive."}, {"address": "Landmark 4, Vinhomes Central Park, 208 Nguyen Huu Canh, Ward 22, Binh Thanh, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A hugely popular, trendy coffee chain in Saigon featuring a photogenic retro European aesthetic. The signature \"Avocado Cheese Foam Coffee\" and \"Oolong Milk Tea\" are hit choices among young crowds; the rich, velvety salted-sweet cheese foam pairs beautifully with aromatic espresso for rich layers of flavor in every sip. They also offer freshly baked French croissants and cheese tarts with crispy crusts and buttery, soft centers\u2014a wonderful spot to unwind after shopping.", "name": "Katinat Saigon Kafe - Central Park", "transport": "Take a Grab to the ground-floor entrance of Landmark 4 in Vinhomes Central Park."}, {"address": "Park 1, Vinhomes Central Park, 208 Nguyen Huu Canh, Ward 22, Binh Thanh, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A unique caf\u00e9 themed around nostalgic Northern Vietnamese military aesthetics, featuring vintage wooden furniture and iconic army-green tones. The must-try \"Coconut Smoothie Coffee\" is a favorite among locals and tourists alike, pouring smooth, sweet coconut slush into dark-roasted Vietnamese coffee for a cool, refreshing, and wonderfully soothing bittersweet balance. Pair it at brunch with hot toasted bread dipped in condensed milk for a simple yet deeply authentic classic taste.", "name": "C\u1ed9ng C\u00e0 Ph\u00ea Vinhomes Central Park", "transport": "Take a Grab to the outer ground-floor arcade of Park 1 in Vinhomes Central Park."}, {"address": "27/10 Nguyen Huu Canh, Ward 22, Binh Thanh, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Hidden in a quiet alley within a B\u00ecnh Th\u1ea1nh residential area, this minimalist vintage-style caf\u00e9 offers an exceptionally warm and relaxed ambiance. It specializes in exquisite signature creations and single-origin pour-overs that feature clean, floral-fruity notes and bright acidity. Brunch options include honey-drizzled pancakes and hot pressed cheese sandwiches with golden, crispy crusts and gooey melted cheese, highly praised by guests seeking a peaceful read or a leisure morning meal.", "name": "Caf\u00e9 Slow", "transport": "Take a Grab into Alley 27 on Nguyen Huu Canh Street and walk for about 1 minute."}, {"address": "Ground Floor, Landmark 81, 720A Dien Bien Phu, Ward 22, Binh Thanh, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Located on the ground floor of Landmark 81, this upscale French vintage-style caf\u00e9 boasts luxurious, elegant decor. It serves premium Vietnamese traditional drip coffee alongside refined French brunch options. The signature phin drip coffee is incredibly rich and full-bodied with chocolatey, toasted bittersweet notes. Paired with freshly made French toast\u2014crisp outside, pillow-soft inside, soaked in egg batter and maple syrup\u2014it is the top choice for an indulgent afternoon treat or a sophisticated brunch inside the Landmark 81 mall.", "name": "RuNam Boutique Landmark 81", "transport": "Take a Grab directly to the main entrance of Landmark 81 mall; enter the ground floor to spot it immediately."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "75F-76F, Landmark 81, 720A Nguy\u1ec5n H\u1eefu C\u1ea3nh, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Perched on the 75th and 76th floors of Landmark 81, this sky lounge bistro is one of the highest bars in Southeast Asia. It offers creative Vietnamese fusion light bites and exquisite craft cocktails. The signature French Foie Gras Tart paired with local tropical fruit jam features a crispy crust and soft interior, bursting with rich aroma where savory fats blend seamlessly with fruity acidity. Guests can indulge in a luxurious twilight buzz while taking in sweeping views of the Saigon River sunset and dazzling nighttime skyline, making it a favorite among international tourists and local trendsetters.", "name": "Blank Lounge Saigon (Blank Lounge Saigon)", "transport": "Take a Grab or taxi to Landmark 81 in Vinhomes Central Park, then take the dedicated high-speed elevator directly to the 75th floor."}, {"address": "B1-02, Landmark 81, 720A Nguy\u1ec5n H\u1eefu C\u1ea3nh, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A renowned brand that elevates traditional Vietnamese home-style street food into a sophisticated bistro experience. The decor blends French colonial charm with retro Vietnamese elements, focusing on healthy, authentic regional cuisine made without added MSG. The must-try Vietnamese Sweet and Sour Fish Soup features a delicately sweet and mildly tangy broth with tender fish, paired with aromatic claypot braised pork and piping hot jasmine rice. Rich, comforting, and deeply satisfying, it is the top choice for foreign travelers seeking high-quality Vietnamese cuisine and locals enjoying family gatherings.", "name": "Qu\u00e1n B\u1ee5i Central - Landmark 81 (Quan Bui Central)", "transport": "Take a Grab to Landmark 81 Mall and head down to the B1 food hall area."}, {"address": "76th Floor, Landmark 81, 720A Nguy\u1ec5n H\u1eefu C\u1ea3nh, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Perched on the 76th floor at the top of Landmark 81, this premier French sky bistro specializes in luxurious black truffle dishes and fine Western pairings. The prime Angus beef steak topped with freshly shaved black truffles is succulent and tender, allowing the elegant truffle aroma to unfold across your palate in rich layers. Surrounded by elegant, opulence ambience and panoramic river views above the clouds, it is the ultimate luxury choice for celebrating special anniversaries or enjoying a romantic dinner in the sky.", "name": "Truffle Restaurant (Truffle Restaurant Saigon)", "transport": "Head to Landmark 81 and take the dedicated high-speed elevator for fine dining directly to the 76th floor."}, {"address": "88 Ph\u1ea1m Vi\u1ebft Ch\u00e1nh, Ward 19, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Tucked away in the hip, Japanese-influenced neighborhood of Ph\u1ea1m Vi\u1ebft Ch\u00e1nh in B\u00ecnh Th\u1ea1nh District, this craft beer bistro showcases brews from various independent Saigon microbreweries alongside unique Taiwanese-Vietnamese fusion and Western bar bites. The signature grilled sausage has a thin skin and juicy, flavorful filling packed with custom spices; mildly spicy and mouthwatering, it pairs perfectly with a crisp, refreshing IPA. A hit among international backpackers and young local professionals alike.", "name": "B\u1ed9t - Craft Beer \u0026 Bistro (Bot Craft Beer \u0026 Bistro)", "transport": "Take a Grab to Ph\u1ea1m Vi\u1ebft Ch\u00e1nh Street; walk about 2 minutes to spot the vintage industrial-style sign."}, {"address": "Park 1, Vinhomes Central Park, 208 Nguy\u1ec5n H\u1eefu C\u1ea3nh, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Nestled in the lush greenery of Vinhomes Central Park, this upscale lounge bistro presents traditional Southern Vietnamese countryside cuisine with modern, artful presentation. The signature shrimp and pork fresh spring rolls feature paper-thin rice wrappers filled with crisp, sweet greens, served with a rich, custom peanut dipping sauce for a refreshingly light yet flavorful bite. The chic, relaxed indoor and outdoor seating accompanied by riverside breezes attracts high-end residents and discerning foodies alike.", "name": "N\u01a1m Saigon (Nom Saigon Restaurant \u0026 Lounge)", "transport": "Take a Grab to the ground floor of Park 1 building inside Vinhomes Central Park."}, {"address": "119 Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n, Ward 5, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | An iconic local spot in B\u00ecnh Th\u1ea1nh District famous for traditional Vietnamese crispy savory crepes (B\u00e1nh X\u00e8o). Made to order, the golden-crisp crepes are stuffed with sweet shrimp, tender pork slices, and juicy bean sprouts. Wrap a piece in fresh lettuce and aromatic herbs, then dip it into sweet-and-savory fish sauce\u2014the result is a satisfying crunch that is crisp without being greasy, blending fresh herb aromas with savory juices. A must-visit for foodies craving authentic local street delicacies.", "name": "B\u00e1nh X\u00e8o B\u00e0 Hai (Banh Xeo Ba Hai - Binh Thanh)", "transport": "Take a Grab to Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n Street; the restaurant is located in a vibrant street food area."}, {"address": "122 Nguy\u1ec5n H\u1eefu C\u1ea3nh, Ward 22, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Located near the riverfront, this nostalgic, retro-style restaurant serves authentic traditional dishes from Central and Southern Vietnam. The signature Golden Braised Pork Belly with Bamboo Shoots features pork belly slow-cooked to melt-in-your-mouth perfection\u2014rich yet not greasy\u2014in a sweet and savory sauce that pairs amazingly with rice. The rustic interior, adorned with woven bamboo and warm yellow walls, evokes the comforting warmth of a mother\u0027s home cooking, making it popular among families and travelers seeking traditional flavors.", "name": "B\u1ebfp M\u1eb9 Qu\u00e1n (Bep Me Quan - Nguyen Huu Canh)", "transport": "Take a Grab to Nguy\u1ec5n H\u1eefu C\u1ea3nh Street, near the entrance to Vinhomes Central Park."}, {"address": "58 Ph\u1ea1m Vi\u1ebft Ch\u00e1nh, Ward 19, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A tropical ocean-themed bistro nestled in the vibrant international foodie enclave of Ph\u1ea1m Vi\u1ebft Ch\u00e1nh in B\u00ecnh Th\u1ea1nh. Focusing on seafood-centric international dishes and creative handcrafted cocktails, the signature Garlic Butter Grilled King Prawns are plump and firm, bathed in rich garlic butter sauce that delivers an explosion of ocean flavors. Pair it with a custom tropical fruit cocktail for total satisfaction. The lively and enthusiastic bar vibe makes it an ideal spot to experience B\u00ecnh Th\u1ea1nh nightlife and catch up with friends.", "name": "Captain Phook Restaurant \u0026 Bar (Captain Phook)", "transport": "Take a Grab to Ph\u1ea1m Vi\u1ebft Ch\u00e1nh Street; situated right in the bustling middle section of the street."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "9 Nguy\u1ec5n Gia Tr\u00ed, Ward 25, B\u00ecnh Th\u1ea1nh District, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A stylish vegetarian restaurant located near the bustling Nguy\u1ec5n Gia Tr\u00ed commercial area, seamlessly blending traditional Vietnamese ingredients with modern culinary techniques. The signature Grilled Lemongrass Tofu is crispy on the outside and tender inside, rich with the spicy fragrance of lemongrass and special sauces, making every bite juicy and layered with flavor. The Wild Mushroom and Lotus Seed Soup is sweet, warm, and soothing, showcasing the natural umami of wild mushrooms and the soft texture of lotus seeds. Surrounded by lush greenery and Zen-inspired Japanese decor, it is highly favored by local office workers and international tourists alike.", "name": "Kasa Vegetarian Restaurant", "transport": "About a 7-minute ride by Grab car or taxi from Landmark 81."}, {"address": "315 L\u00ea Quang \u0110\u1ecbnh, Ward 7, B\u00ecnh Th\u1ea1nh District, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Located near the famous Ph\u00e1p Hoa Pagoda in B\u00ecnh Th\u1ea1nh District, this long-standing vegetarian restaurant is renowned for serving authentic traditional Vietnamese vegetarian cuisine. The Vegetarian B\u00e1nh M\u00ec (B\u00e1nh M\u00ec Chay) comes highly recommended\u2014filled with custom vegan ham, crispy vegan meat floss, and pickled daikon and carrots. The baguette is toasted to a delightful crunch, yielding a fantastic balance of savory and sweet flavors. Generous portions and reasonable prices make this a prime spot to experience local vegetarian culture.", "name": "Ph\u00e1p Hoa Vegetarian Restaurant (Nh\u00e0 H\u00e0ng Chay Ph\u00e1p Hoa)", "transport": "Take Bus No. 18 to L\u00ea Quang \u0110\u1ecbnh Stop, then walk for about 2 minutes."}, {"address": "291 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ward 15, B\u00ecnh Th\u1ea1nh District, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | An elegant vegetarian eatery on \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Boulevard specializing in light, healthy plant-based cuisine. The popular Vegetarian Fresh Spring Rolls are packed with fresh lettuce, rice vermicelli, and special vegan shrimp, paired perfectly with a rich peanut dipping sauce for a refreshingly crisp bite. Featuring modern, chic decor and located just a few minutes\u0027 drive from the Landmark 81 area, it\u0027s an ideal spot for a light, relaxing dinner after shopping.", "name": "Mani Vegetarian - \u0110i\u1ec7n Bi\u00ean Ph\u1ee7", "transport": "About a 5-minute drive from Landmark 81 along \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Boulevard toward District 1."}, {"address": "74 Ung V\u0103n Khi\u00eam, Ward 25, B\u00ecnh Th\u1ea1nh District, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A cozy, unpretentious vegetarian spot on Ung V\u0103n Khi\u00eam Street, popular in B\u00ecnh Th\u1ea1nh District for its varied vegetarian buffets and set meals. The Vegetarian Thai Hot Pot (L\u1ea9u Th\u00e1i Chay) offers an exciting burst of flavor\u2014lemongrass, kaffir lime leaves, and chili come together for a vibrant Southeast Asian taste. The sour and spicy broth is comforting and appetizing, cooked with fresh mushrooms and tofu. The homey atmosphere and warm service offer travelers an authentic taste of local Vietnamese hospitality.", "name": "B\u1ed3 \u0110\u1ec1 T\u00e2m Vegetarian Restaurant (C\u01a1m Chay B\u1ed3 \u0110\u1ec1 T\u00e2m)", "transport": "About a 12-minute walk or 3-minute Grab ride from the Vinhomes Central Park complex."}, {"address": "353 Phan V\u0103n Tr\u1ecb, Ward 11, B\u00ecnh Th\u1ea1nh District, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | The B\u00ecnh Th\u1ea1nh branch of a well-known Vietnamese vegetarian chain, celebrated for consistent quality and creative dishes. The Vegetarian Pho (Ph\u1edf Chay) is exceptional, featuring a broth slow-simmered for hours with onions, radishes, and spices that matches meat broth in depth and natural sweetness. Served with springy rice noodles and an array of fresh mushrooms, it\u0027s deliciously smooth. Bright, clean, and air-conditioned, it is a high-quality vegetarian stop you shouldn\u0027t miss.", "name": "C\u00e2y \u0110\u1ec1 Vegetarian Restaurant - Phan V\u0103n Tr\u1ecb", "transport": "Take Bus No. 24 to Phan V\u0103n Tr\u1ecb Stop, then walk for about 3 minutes."}, {"address": "143/7 Ung V\u0103n Khi\u00eam, Ward 25, B\u00ecnh Th\u1ea1nh District, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A hidden gem tucked away in an alley off Ung V\u0103n Khi\u00eam Street, offering a quiet, pleasant atmosphere. The signature Coconut Curry Vegan Chicken is rich and silky, with sweet coconut milk coating tender tofu skin and potatoes. Paired with freshly toasted French bread to soak up the creamy gravy, every bite is wonderfully crispy yet soft and full of flavor. Warm hospitality and friendly prices attract many local college students and vegetarian travelers alike.", "name": "Duy\u00ean D\u00e1ng Vegetarian Eatery (Chay Duy\u00ean D\u00e1ng)", "transport": "About a 6-minute ride by Grab motorbike or car from Landmark 81 into the alley."}, {"address": "157/38 Nguy\u1ec5n Gia Tr\u00ed, Ward 25, B\u00ecnh Th\u1ea1nh District, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A modern vegetarian bistro blending Western plant-based concepts with local Vietnamese ingredients. The Truffle Mushroom Risotto comes highly recommended; cooked to al dente perfection, the rice absorbs rich truffle aromas and mushroom essence into a creamy, irresistible dish. Situated near Landmark 81 and the riverside district, its minimalist aesthetic attracts a stylish young crowd for photos, making it a top Western vegetarian pick in B\u00ecnh Th\u1ea1nh.", "name": "Green Oasis Vegetarian Bistro", "transport": "About a 6-minute drive from Landmark 81, near the vibrant D2 Street student hub."}, {"address": "220/50A X\u00f4 Vi\u1ebft Ngh\u1ec7 T\u0129nh, Ward 21, B\u00ecnh Th\u1ea1nh District, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A cozy vegetarian hotpot restaurant near the B\u00ecnh Th\u1ea1nh riverside, specializing in natural, healthy hotpot sets. The signature Herbal Nourishing Hotpot is simmered with over ten Chinese herbs and fresh vegetables, offering a smooth, sweet, and comforting broth. Served with fresh seasonal greens and handmade tofu skin, it is delicious and wholesome. The warm, inviting atmosphere makes it a perfect gathering spot after a scenic walk along the Saigon River.", "name": "Thi\u1ec1n T\u00e2m Vegetarian Hotpot (Chay Thi\u1ec1n T\u00e2m)", "transport": "About a 5-minute drive from Landmark 81 heading along the riverside road."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "318/1 B\u00f9i H\u1eefu Ngh\u0129a, Ward 2, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | One of the most legendary late-night street food spots in B\u00ecnh Th\u1ea1nh District! Fragrant sticky rice is topped with golden, crispy fried chicken legs or char siu pork drenched in a rich, special sauce, finished with scallion oil and signature chili sauce. Every bite offers chewy, perfectly cooked sticky rice, crispy chicken skin, juicy meat, and a mouthwatering sweet-and-spicy sauce. A late-night street food paradise for locals and tourists alike.", "name": "B\u00e0 Chi\u1ec3u Market Chicken Sticky Rice (X\u00f4i G\u00e0 B\u00e0 Chi\u1ec3u)", "transport": "About a 12-minute Grab taxi ride from Landmark 81 to the back of B\u00e0 Chi\u1ec3u Market."}, {"address": "120 Nguy\u1ec5n Gia Tr\u00ed, Ward 25, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Located in B\u00ecnh Th\u1ea1nh\u0027s vibrant university neighborhood, this small street stall specializes in made-to-order Vietnamese pizza (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng). Crispy grilled rice paper is topped with quail eggs, scallions, pork floss, sausage, and rich melted cheese, all charcoal-grilled to aromatic perfection. Crispy on the outside and savory on the inside, it pairs perfectly with an iced Vietnamese kumquat tea\u2014a huge favorite among young students and travelers.", "name": "D2 Street Grilled Corn \u0026 Vietnamese Pizza Stall (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng \u0026 B\u1eafp N\u01b0\u1edbng Nguy\u1ec5n Gia Tr\u00ed)", "transport": "About a 5-minute drive or ride from Landmark 81; head along \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 and turn into Nguy\u1ec5n Gia Tr\u00ed Street."}, {"address": "90 V\u0169 T\u00f9ng, Ward 2, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A top-tier authentic street delicacy tucked away in the alleys of B\u00ecnh Th\u1ea1nh. Rich coconut milk and curry aromas infuse tender, gamey-free beef offal\u2014including tripe, lungs, and heart. Served piping hot to dip with crispy baguette or tossed with instant noodles, it delivers a tender, bouncy texture and a rich, sweet, slightly spicy broth. One of Ho Chi Minh City\u0027s most iconic local street foods.", "name": "V\u0169 T\u00f9ng Street Beef Offal Stew (Ph\u00e1 L\u1ea5u B\u00f2 V\u0169 T\u00f9ng)", "transport": "About a 10-minute Grab bike ride from Landmark 81, located near B\u00e0 Chi\u1ec3u Market (Ch\u1ee3 B\u00e0 Chi\u1ec3u)."}, {"address": "521 X\u00f4 Vi\u1ebft Ngh\u1ec7 T\u0129nh, Ward 26, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A comforting street food highly recommended by B\u00ecnh Th\u1ea1nh locals. This rich soup is packed with ingredients: sweet fresh crab meat, century egg, sweet corn, mushrooms, and creamy pig brain. Smooth and savory on the palate, the sweet crab blends beautifully with the unique flavor of the century egg. Sprinkled with black pepper and cilantro, it offers remarkable depth\u2014the perfect comforting snack for any afternoon or evening.", "name": "H\u1ea1nh Crab Soup (S\u00fap Cua H\u1ea1nh)", "transport": "Drive north along X\u00f4 Vi\u1ebft Ngh\u1ec7 T\u0129nh Road from Landmark 81 for about 6 minutes."}, {"address": "119 L\u00ea Quang \u0110\u1ecbnh, Ward 14, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Specializing in southern-style golden crispy Vietnamese crepes (B\u00e1nh X\u00e8o). Golden batter infused with coconut milk is fried to ultimate crispiness, stuffed with fresh shrimp, pork belly, bean sprouts, and mung bean paste. Enjoy it wrapped in fresh lettuce and herbs, dipped in a custom sweet-and-sour fish sauce. Every crunchy bite blends crisp fresh greens with sizzling crepe flavors for a light, non-greasy treat.", "name": "B\u00e0 Hai Special Vietnamese Crispy Crepe (B\u00e1nh X\u00e8o B\u00e0 Hai)", "transport": "About a 15-minute taxi ride from Landmark 81, located on the main L\u00ea Quang \u0110\u1ecbnh thoroughfare."}, {"address": "009 Block N, Thanh \u0110a Apartments, Ward 27, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A hugely popular dessert stall located on the Thanh \u0110a Peninsula in B\u00ecnh Th\u1ea1nh. Their signature Thai sweet soup (Ch\u00e8 Th\u00e1i) is loaded with durian flesh, jackfruit, nipa palm seeds, red and white jellies, and rich coconut milk. Cool and smooth, the rich aroma of durian meshes with crunchy fresh fruits for a balanced sweetness\u2014an essential refreshing tropical dessert after exploring B\u00ecnh Th\u1ea1nh\u0027s riverside area.", "name": "Thanh \u0110a Thai Sweet Soup \u0026 Vietnamese Desserts (Ch\u00e8 Th\u00e1i Thanh \u0110a)", "transport": "About a 10-minute drive towards B\u00ecnh Qu\u1edbi from Landmark 81, arriving at the Thanh \u0110a residential complex."}, {"address": "135 D5, Ward 25, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A specialty street food featuring Central Vietnamese Phan Rang flavors. These bite-sized mini rice cakes (B\u00e1nh C\u0103n) are baked fresh in traditional terracotta pans\u2014seared and crispy on the outside, soft and savory on the inside, topped with fresh shrimp, squid, or beef. Dip them into warm fish sauce or savory peanut sauce accompanied by shredded green mango for a vibrant, multi-layered sour, spicy, and savory taste.", "name": "C\u00f4 Ba Phan Rang Mini Rice Cakes (B\u00e1nh C\u0103n Phan Rang C\u00f4 Ba)", "transport": "About a 4-minute walk or motorbike ride from Landmark 81, extremely close to Vinhomes Central Park."}, {"address": "36 D5 Street, Ward 25, B\u00ecnh Th\u1ea1nh, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | An extraordinarily popular sizzling b\u00e1nh m\u00ec skillet stall in B\u00ecnh Th\u1ea1nh. Served on a piping hot cast-iron skillet, sunny-side-up eggs, homemade Vietnamese meatloaf, pate, sliced beef, and sausages sizzle aromatically. Dip crispy, light baguettes into runny egg yolks and savory pate sauce for a deeply satisfying, rich local comfort food experience in B\u00ecnh Th\u1ea1nh.", "name": "C\u00f4 Ba H\u1eadu Sizzling Skillet B\u00e1nh M\u00ec (B\u00e1nh M\u00ec Ch\u1ea3o C\u00f4 Ba H\u1eadu)", "transport": "About a 3-minute drive from Landmark 81, located on the lively D5 foodie street."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Binh Thanh District - Landmark 81 and Riverside Commercial Area"}, "cuchi_suburbs": {"categories": {"cat_1": {"items": [{"address": "8 Nguy\u1ec5n Giao, TT. C\u1ee7 Chi, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Cu Chi\u0027s most famous legendary spot for tender veal! Using local young cattle only a few months old, the meat is exceptionally fine, juicy, and carries a subtle milky aroma. Must-try signature dishes include charcoal-grilled tender beef chunks and lemon-marinated beef salad. Thickly sliced beef is grilled tableside over charcoal until golden brown\u2014crispy on the outside, tender on the inside, juicy and bouncy with every bite. Served with Cu Chi\u0027s signature fresh herb platter and a unique fermented fish sauce (M\u1eafm N\u00eam), it delivers a rich, multi-layered profile of sour, spicy, salty, and savory flavors. A top culinary holy land for foodies visiting the Cu Chi Tunnels.", "name": "B\u00f2 T\u01a1 Xu\u00e2n \u0110\u00e0o (Cu Chi Tender Beef BBQ)", "transport": "It is recommended to take a Grab car or private charter from Ho Chi Minh City along Highway 22. It is about a 5-minute drive from the center of Cu Chi town."}, {"address": "358 Qu\u1ed1c L\u1ed9 22, \u1ea4p B\u1ebfn \u0110\u00f2 1, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | A decades-old traditional beef restaurant beloved by locals. Their \u0027Steamed Tender Beef with Fermented Shrimp Paste and Rice Paper\u0027 is an irreplaceable signature dish. The beef is fresh, tender, and odor-free, slow-steamed at low temperatures with lemongrass and special spices to achieve an incredibly smooth, melt-in-your-mouth texture. Diners can wrap tender beef slices along with pickled cucumber, starfruit slices, bitter melon, and various wild herbs into paper-thin Cu Chi rice paper, then dip into rich, customized fermented shrimp paste. Generous portions and affordable prices.", "name": "B\u00f2 T\u01a1 C\u1ee7 Chi Minh C\u1ee5 (Minh Cu Cu Chi Tender Beef)", "transport": "Located along Highway 22, about a 20-minute drive from the entrance of the Cu Chi Tunnels\u2014perfect for a dining stop on your return journey from the tunnels."}, {"address": "\u0110\u01b0\u1eddng TL15, \u1ea4p Ph\u00fa Hi\u1ec7p, Ph\u00fa M\u1ef9 H\u01b0ng, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 stars | A traditional riverside restaurant adjacent to the Ben Duoc Cu Chi Tunnels memorial site, offering authentic Southern Vietnamese countryside specialties. A must-try is \u0027Steamed Cassava with Peanut Sesame Salt\u0027 (Khoai M\u00ec Mu\u1ed1i V\u1eebng), perfectly recreating the classic staple food of tunnel guerillas during the Vietnam War; the cassava is soft, dense, and naturally sweet. Additionally, their fried river fish and grilled river shrimp are crispy outside and tender inside. Enjoying these meals inside a pavilion along the Saigon River lets you immerse yourself in rich history and rustic charm.", "name": "Nh\u00e0 H\u00e0ng B\u1ebfn D\u01b0\u1ee3c (Ben Duoc Restaurant)", "transport": "Located right inside the B\u1ebfn D\u01b0\u1ee3c Cu Chi Tunnels complex, easily accessible on foot. From the city center, take Bus No. 13 and transfer to Bus No. 79 to arrive directly at the park."}, {"address": "Qu\u1ed1c L\u1ed9 22, T\u00e2n Th\u00f4ng H\u1ed9i, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | A famous morning eatery in Cu Chi operating for over 30 years, specializing in B\u00fan M\u1ecdc (pork ball rice vermicelli soup adapted from North Vietnamese traditions). The broth is slow-simmered for over 10 hours using pork marrow bones and sugarcane, resulting in a clear, sweet, and deeply savory soup. The bowl is loaded with handmade mushroom pork meatballs, bouncy pork balls, and sliced pork leg, paired with silky rice vermicelli, topped with fried shallots and fresh cilantro. A fragrant, comforting bowl that builds your appetite.", "name": "Qu\u00e1n B\u00fan M\u1ecdc Minh Qu\u00fd (Minh Quy Traditional Bun Moc)", "transport": "Located along Highway 22 (near T\u00e2n Th\u00f4ng H\u1ed9i). Take city bus No. 13 and get off at T\u00e2n Th\u00f4ng H\u1ed9i station to reach the shop."}, {"address": "\u0110\u01b0\u1eddng Nguy\u1ec5n Th\u1ecb R\u1ea9y, Trung An, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | Situated in a lush riverside eco-park in the Cu Chi countryside, this is a prime spot to experience an authentic farm-style feast. Signature dishes include \u0027Steamed Mudfish with Galangal\u0027 and \u0027Wild Herb River Seafood Hotpot.\u0027 The catch of the day comes fresh from local waterways, with delicate, sweet fish meat free of earthy odors. The hotpot broth features local wild flowers and herbs, rendering a sweet, sour, refreshing, and non-greasy taste. Enjoying local farm dishes inside thatched pavilions along the river is highly recommended by tourists and local Vietnamese families alike.", "name": "Nh\u00e0 H\u00e0ng Sinh Th\u00e1i B\u1ebfn Tr\u1ea1i (Ben Trai Eco-Riverside Restaurant)", "transport": "Located in the rural area of Trung An. A private charter or Grab taxi is recommended, approximately a 15-minute drive from Cu Chi town center."}, {"address": "259 Qu\u1ed1c L\u1ed9 22, T\u00e2n Th\u00f4ng H\u1ed9i, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | A legendary roadside stand en route to Cu Chi! This unique \u0027Durian Sugarcane Juice\u0027 is Cu Chi\u0027s most mind-blowing refreshing street drink. Freshly squeezed sugarcane juice is blended with pure, high-quality Monthong durian pulp, offering both the crisp sweetness of sugarcane and the creamy aromatic richness of durian in one sip. Cold, smooth, and perfectly sweet, it impresses every visitor. It attracts countless tourists and motorcyclists daily to grab a large cup to beat the heat.", "name": "N\u01b0\u1edbc M\u00eda S\u1ea7u Ri\u00eang V\u01b0\u1eddn Cau (V\u01b0\u1eddn Cau Durian Sugarcane Juice)", "transport": "Located along the main Highway 22 route from Ho Chi Minh City to Cu Chi Tunnels. Vehicles can pull over directly on the roadside to make a quick purchase."}, {"address": "T\u1ec9nh L\u1ed9 15, Ph\u00fa H\u00f2a \u0110\u00f4ng, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Ph\u00fa H\u00f2a \u0110\u00f4ng village in Cu Chi is famous for its century-old tradition of handmade sun-dried rice paper, and this iconic shop perfectly combines freshly steamed rice sheets with local Cu Chi flavors. The signature \u0027Steamed Handmade Pork Rice Paper Rolls\u0027 features thin, chewy rice wraps infused with rice fragrance, stuffed with fresh herbs and tender boiled pork belly, dipped into house fish sauce balanced with lime and chili. Refreshing and rich in texture, they also sell various dry rice papers to take home\u2014a great place to immerse yourself in local food culture.", "name": "Qu\u00e1n B\u00e1nh Tr\u00e1ng Ph\u00fa H\u00f2a \u0110\u00f4ng (Phu Hoa Dong Rice Paper Shop)", "transport": "Located along Provincial Route 15 in Ph\u00fa H\u00f2a \u0110\u00f4ng village. Accessible via Bus No. 79. Hiring a private car alongside a tunnel tour is recommended."}, {"address": "\u0110\u01b0\u1eddng Trung An, Trung An, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Tucked deep inside a Cu Chi orchard farm, this classic floating traditional restaurant is famous locally for \u0027Bamboo Herb Roasted Free-Range Chicken\u0027 and \u0027Green Pepper Stewed River Eel.\u0027 Using local free-range chickens, the meat is tender yet firm with rich savory fat, slow-roasted over charcoal to achieve crispy skin and aromatic juicy meat. Paired with Cu Chi\u0027s signature sticky rice, it offers a crispy yet soft, subtly sweet bite. Surrounded by lotus ponds and fruit trees, it delivers an authentic Southern Vietnamese countryside banquet experience.", "name": "Qu\u00e1n \u0102n Eco V\u01b0\u1eddn S\u00f4ng C\u1ee7 Chi (Cu Chi River Garden Eco Restaurant)", "transport": "Located in the Trung An area, close to the Trung An Fruit Orchards. It is recommended to take a taxi or hire a private vehicle."}], "name": "Famous Local Traditional Establishments"}, "cat_2": {"items": [{"address": "Nguy\u1ec5n Th\u1ecb R\u1ebft, \u1ea4p 2, X\u00e3 An Nh\u01a1n T\u00e2y, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Located inside an organic farm in Cu Chi, featuring lush greenery and fresh air. It specializes in fresh milk coffee and light organic brunch options. Warm, aromatic Vietnamese drip coffee paired with panini sandwiches or crispy baguettes made from farm-fresh vegetables offers a crispy outside, soft inside texture with juicy sweetness. Highly popular with families and hikers.", "name": "Green Noen Eco Cafe \u0026 Brunch (N\u00f4ng Trang Xanh Green Noen Eco Cafe)", "transport": "About a 10-minute taxi ride from the Cu Chi Tunnels (B\u1ebfn D\u01b0\u1ee3c area)."}, {"address": "Ph\u00fa Hi\u1ec7p, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | Situated along the Saigon River, offering magnificent river views and a breezy, relaxed atmosphere. The signature Coconut Smoothie Coffee is highly recommended\u2014slightly bitter, rich Vietnamese Robusta combined with sweet, smooth coconut smoothie for a cool, creamy bittersweet flavor. Paired with a hot, freshly made B\u00e1nh M\u00ec, it\u0027s the perfect spot to recharge after exploring the Cu Chi Tunnels.", "name": "B\u1ebfn D\u01b0\u1ee3c Riverside Coffee", "transport": "Located near the entrance of the B\u1ebfn D\u01b0\u1ee3c Cu Chi Tunnels site, about a 3-minute walk."}, {"address": "T\u1ec9nh L\u1ed9 15, X\u00e3 Ph\u00fa H\u00f2a \u0110\u00f4ng, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | A garden cafe filled with traditional Vietnamese countryside charm, surrounded by vibrant green rice fields and pavilions. The specialty Egg Coffee is silky smooth, perfectly combining rich egg aroma with bittersweet coffee without any fishiness. The brunch menu features Seafood H\u1ee7 Ti\u1ebfu with a sweet, clear broth and abundant toppings, favored by travelers looking to experience a relaxed local pace.", "name": "H\u01b0\u01a1ng L\u00faa Garden Cafe (C\u00e0 Ph\u00ea S\u00e2n V\u01b0\u1eddn H\u01b0\u01a1ng L\u00faa)", "transport": "Drive along Provincial Road 15 (TL15) towards Cu Chi; located near the center of Ph\u00fa H\u00f2a \u0110\u00f4ng commune."}, {"address": "Nguy\u1ec5n V\u0103n Kh\u1ea1, X\u00e3 Ph\u1ea1m V\u0103n C\u1ed9i, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 stars | Featuring cool thatched huts and floating bamboo pavilions, creating a peaceful and comfortable natural atmosphere. The signature Iced Milk Coffee (C\u00e0 Ph\u00ea S\u1eefa \u0110\u00e1) has a strong aroma, excellent bittersweet balance, and a rich taste. For brunch, the freshly fried crispy B\u00e1nh X\u00e8o stuffed with shrimp, pork, and bean sprouts dipped in special fish sauce is highly recommended\u2014crispy, juicy, and lip-smackingly good.", "name": "An Nhi\u00ean Garden Cafe (C\u00e0 Ph\u00ea V\u01b0\u1eddn An Nhi\u00ean C\u1ee7 Chi)", "transport": "About a 15-minute Grab or taxi ride from Cu Chi town center."}, {"address": "\u1ea4p Ph\u00fa Hi\u1ec7p, X\u00e3 Ph\u00fa M\u1ef9 H\u01b0ng, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | A forest-themed rest area cafe designed for visitors to the tunnels, surrounded by towering trees. It offers classic Salted Coffee, where a sweet and salty milk foam highlights the nutty notes of dark roast coffee, creating rich layers of flavor. Pair it with a steaming plate of freshly steamed tapioca dipped in crushed peanuts and sugar\u2014soft, sweet, and rich in local historical and cultural charm.", "name": "Rest Area Coffee Cu Chi Tunnels", "transport": "Located inside the visitor rest plaza of the Cu Chi Tunnels (B\u1ebfn \u0110\u00ecnh area)."}, {"address": "\u0110\u01b0\u1eddng Trung An, X\u00e3 Trung An, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.6 stars | A wooden boardwalk cafe built over a large lotus pond, filled with lotus fragrance during bloom season. The Lotus Seed Vanilla Latte is highly recommended, blending locally steamed lotus seeds into silky milk foam for an elegant scent and creamy texture. Pair it with local B\u00fan Ch\u1ea3 (grilled pork with rice vermicelli) for brunch\u2014smoky, juicy grilled meat with sweet and sour sauce and fresh herbs, very refreshing and appetizing.", "name": "Lotus Pond Garden Cafe (C\u00e0 Ph\u00ea \u0110\u1ea7m Sen C\u1ee7 Chi)", "transport": "Located near Trung An Fruit Garden area; chartering a vehicle or riding a motorbike is recommended."}, {"address": "T\u1ec9nh L\u1ed9 8, X\u00e3 T\u00e2n Th\u1ea1nh T\u00e2y, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | An open-air cafe blending modern hipster style with natural rural charm, featuring a beautiful pond and hammock resting areas. The specialty Avocado Coffee blends fresh, rich avocado puree with espresso for a thick, milk-shake-like texture with balanced bittersweet notes. Brunch also offers a variety of Western-Vietnamese fusion baked goods, making it a relaxing sanctuary away from the hustle and bustle.", "name": "Ch\u00f2i M\u1edbi Eco Cafe (C\u00e0 Ph\u00ea Ch\u00f2i M\u1edbi C\u1ee7 Chi)", "transport": "Turn in from Provincial Road 8 (TL8), about a 10-minute drive from the Cu Chi Town People\u0027s Committee."}, {"address": "S\u00f4ng S\u00e0i G\u00f2n, X\u00e3 An Ph\u00fa, C\u1ee7 Chi, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | A waterfront cafe located within a Cu Chi eco-resort, featuring a relaxing garden filled with tropical plants. The signature Avocado Toast with Poached Egg paired with pour-over single-origin Vietnamese coffee offers natural fruit acidity and floral notes, refreshing and smooth. The toast is crispy outside and soft inside, with running yolk coating rich avocado spread for a complex texture\u2014loved by tourists who enjoy premium brunches and Instagrammable spots.", "name": "Oasis Eco Riverside Cafe", "transport": "Recommended to take an eco-tour day trip shuttle or charter a car from downtown Ho Chi Minh City."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "8 Nguyen Giao, Cu Chi Town, Cu Chi, Ho Chi Minh City", "feature": "\u2b50 4.3 Stars | A highly acclaimed specialty restaurant in Cu Chi famous for its tender young beef dishes, sourced from calves just a few months old. The pinkish meat is incredibly soft, tender, and carries a rich milky aroma. Must-try signature dishes include charcoal-grilled beef chunks, poached beef with shrimp paste, and Cu Chi\u2019s specialty steamed cassava (Khoai m\u00ec) served with crushed peanut and sesame salt. The burst of juicy flavors in every bite is unforgettable, and its garden-style dining ambiance receives rave reviews from both tourists and locals alike.", "name": "Xuan Dao Cu Chi Tender Beef (B\u00f2 T\u01a1 Xu\u00e2n \u0110\u00e0o)", "transport": "Recommended to take a Grab or hire a private car from central Ho Chi Minh City; travel time is approximately 1.5 hours."}, {"address": "Highway 22, Ap Upper, Cu Chi, Ho Chi Minh City", "feature": "\u2b50 4.2 Stars | A traditional garden-style beef specialty restaurant located along Cu Chi\u0027s main highway, featuring spacious and lush green surroundings. Popular items include the grilled beef wrapped in foil and the sweet and sour beef hotpot. The tender beef slices are rolled in rice paper with plenty of wild sour greens and fresh herbs, dipped in special fish sauce for a light, non-greasy bite with wonderfully complex layers of flavor. It\u0027s the perfect culinary spot to recharge after touring the Cu Chi Tunnels.", "name": "Hong Dao Tender Beef Restaurant (B\u00f2 T\u01a1 H\u1ed3ng \u0110\u00e0o)", "transport": "Accessible by driving along Highway QL22 toward Cu Chi. Hiring a private car or taking a taxi is recommended."}, {"address": "Phu Hiep, Cu Chi, Ho Chi Minh City", "feature": "\u2b50 4.0 Stars | Located right next to the Ben Duoc Tunnels site along the Saigon River, this scenic restaurant serves authentic Cu Chi countryside fare and fresh river seafood. Must-try specialties are the steamed cassava with crushed peanuts and steamed Saigon River fish. The soft, sweet cassava faithfully recreates the historical wartime diet of tunnel soldiers, while the river fish is fresh, sweet, and free of earthy smells. Dining inside a cool riverside bamboo pavilion while soaking in the river views and gentle breezes offers a delightful resort-like vibe.", "name": "Ben Duoc Riverside Scenic Restaurant (Nh\u00e0 H\u00e0ng B\u1ebfn D\u01b0\u1ee3c)", "transport": "Located within the Ben Duoc Tunnels complex; easily accessible on foot."}, {"address": "233 Provincial Road 15, Phu Hoa Dong, Cu Chi, Ho Chi Minh City", "feature": "\u2b50 4.1 Stars | A garden-style restaurant embracing Southern Vietnamese water-town vibes, complete with artificial ponds and private woven-bamboo pavilions. Its specialties include stir-fried wild boar with lemongrass and chili, as well as charcoal-grilled field rat. Marinated in house sauces and grilled to perfection, these unique ingredients yield a crispy skin and springy, tender meat without any off-putting odor\u2014a hit among adventurous foodies. They also serve authentic Vietnamese sweet and sour fish soup with a refreshing broth, making it a great spot for exotic local tastes.", "name": "Ben Cat Garden Local Cuisine Restaurant (Nh\u00e0 H\u00e0ng S\u00e2n V\u01b0\u1eddn B\u1ebfn C\u00e1t)", "transport": "Recommended to take a taxi or Grab from downtown Cu Chi; travel time is around 15 minutes."}, {"address": "22 Street 179, Ap 4A, Binh My, Cu Chi, Ho Chi Minh City", "feature": "\u2b50 4.0 Stars | A riverside floating restaurant located within the Binh My Eco-Park, boasting lush greenery and rustic charm. The menu features freshly caught loach stew and lemongrass roasted chicken\u2014crispy and golden on the outside, juicy on the inside, and delicious when dipped in lemon, salt, and pepper. Guests can dine in stilt houses over the water while enjoying fishing or boating trips, making it a hugely popular casual dining venue for families and tour groups near Cu Chi.", "name": "Binh My Eco-Farm Restaurant (Khu Du L\u1ecbch Sinh Th\u00e1i B\u00ecnh M\u1ef9 - Nh\u00e0 H\u00e0ng)", "transport": "Cross the bridge from District 12 of Ho Chi Minh City into Binh My Commune, Cu Chi; takes around 45 minutes by chartered car."}, {"address": "Nhuan Duc, Cu Chi, Ho Chi Minh City", "feature": "\u2b50 3.9 Stars | A local specialty restaurant designed for visitors to the Ben Dinh Tunnels, imbued with a strong Vietnam War historic atmosphere. Signature dishes include claypot braised pork in coconut water and Cu Chi steamed cassava. The steamed cassava is chewy yet soft with a subtle taro-like aroma, paired perfectly with sweet and savory peanut-sesame salt. Dining here offers not only good food but also a memorable connection to local history and tunnel culture.", "name": "Ben Dinh Tunnels Traditional Restaurant (Nh\u00e0 H\u00e0ng B\u1ebfn \u0110\u00ecnh)", "transport": "Located near the entrance of the Ben Dinh Tunnels complex; easily accessible on foot."}, {"address": "259 Highway 22, Tan Thong Hoi, Cu Chi, Ho Chi Minh City", "feature": "\u2b50 4.4 Stars | A legendary shop along the Cu Chi highway, famous across Ho Chi Minh City for its signature durian sugarcane juice. Freshly pressed sugarcane juice is blended with rich, smooth durian puree, creating a refreshing, sweet drink where delicate sugarcane notes temper the bold flavor of durian. They also sell traditional street snacks like cassava cake and Vietnamese rice crackers\u2014crispy on the outside and chewy inside\u2014making it an essential pitstop on the way to Cu Chi.", "name": "Vuon Cau Durian Sugarcane Juice \u0026 Local Snacks (N\u01b0\u1edbc M\u00eda S\u1ea7u Ri\u00eang V\u01b0\u1eddn Cau)", "transport": "Situated along Highway QL22; easily reached by chartered car or by taking a Cu Chi-bound bus and getting off nearby."}, {"address": "2 TL8, Cu Chi Town, Cu Chi, Ho Chi Minh City", "feature": "\u2b50 4.1 Stars | A long-established local eatery renowned for its signature Cu Chi pork trotter rice noodle soup and classic Southern Vietnamese home-style dishes. The bone broth is light, sweet, and non-greasy, while the pork trotters are meticulously cleaned, tender, gelatinous, and chewy. Served with house-made spicy dipping sauce and a generous platter of fresh herbs, it offers rich and satisfying flavors. They also serve local staples like grilled pork chop rice and stir-fried morning glory, making it a fantastic stop for authentic comfort food after visiting the tunnels.", "name": "Bun Trang Cu Chi Pork Trotter Rice Noodle \u0026 Local Dishes (B\u00fan Trang C\u1ee7 Chi)", "transport": "Located at the TL8 intersection in central Cu Chi Town; easily accessible via Bus No. 79 or Grab."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "172 Provincial Road 8, C\u1ee7 Chi Town, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A stylish vegetarian restaurant located in the heart of C\u1ee7 Chi Town, popular among locals and tourists visiting the C\u1ee7 Chi Tunnels. It serves a variety of exquisite traditional Vietnamese vegetarian dishes, with the \"Vegetarian Pho\" and \"Lotus Seed Vegetarian Hot Pot\" being the most famous. The broth for the vegetarian pho is simmered slowly with plenty of vegetables and herbal ingredients\u2014sweet, rich, and completely MSG-free\u2014served with tender rice noodles, savory veggie floss, and wild mushrooms for rich layers of texture. With its peaceful atmosphere and elegant wooden decor, it\u0027s the perfect place to relax and enjoy a healthy, guilt-free lunch after exploring the tunnels.", "name": "Hoa Tam Vegetarian Restaurant (Nh\u00e0 H\u00e0ng Chay Hoa T\u00e2m)", "transport": "About a 20-minute drive or taxi ride from the C\u1ee7 Chi Tunnels (B\u1ebfn D\u01b0\u1ee3c section) to C\u1ee7 Chi Town center."}, {"address": "49 Nguy\u1ec5n V\u0103n Kh\u1ea1, C\u1ee7 Chi Town, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | An affordable local vegetarian spot on Nguy\u1ec5n V\u0103n Kh\u1ea1 Street, known for its high value and authentic Southern Vietnamese home-style flavors. The most popular dish is the \"Vegetarian B\u00fan B\u00f2 Hu\u1ebf (B\u00fan B\u00f2 Hu\u1ebf Chay)\", featuring a mildly spicy broth infused with rich lemongrass aroma, topped with thick veggie char siu, fried tofu, and fresh cilantro. Juices burst in your mouth when you bite into the fried tofu, creating a unique texture. The friendly owner is always warm and welcoming, making this a fantastic choice for travelers who want to experience local life and light plant-based meals.", "name": "Bat Nha Vegetarian Eatery (Qu\u00e1n Chay B\u00e1t Nh\u00e3)", "transport": "About a 10-minute walk from C\u1ee7 Chi Bus Station, or a 3-minute Grab bike ride."}, {"address": "104 Highway 22, C\u1ee7 Chi Town, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Located along Highway 22, this is a top vegetarian stop for private charter drivers and tourists traveling between Ho Chi Minh City, T\u00e2y Ninh, or the C\u1ee7 Chi Tunnels. The restaurant specializes in \"Self-Service Vegetarian Buffet (C\u01a1m Chay T\u1ef1 Ch\u1ecdn)\", offering over 20 daily freshly stir-fried vegetable dishes and soy products. Highly recommended are the \"Sweet and Sour Veggie Ribs\" and \"Crispy Veggie Fish Skin\"\u2014crispy on the outside, coated in a sweet and savory sauce, and wonderfully chewy, making it hard to believe it\u0027s 100% plant-based.", "name": "Thien Duyen Vegetarian Restaurant (Qu\u00e1n Chay Thi\u1ec7n Duy\u00ean)", "transport": "Drive along Highway 22 toward C\u1ee7 Chi; located near the entrance of C\u1ee7 Chi Town with convenient parking."}, {"address": "37 Nguy\u1ec5n V\u0103n Kh\u1ea1, C\u1ee7 Chi Town, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | This cozy vegetarian eatery is known for its light, healthy, and refreshing meals. Highly recommended is the \"Vegetarian Fresh Spring Rolls (G\u1ecfi Cu\u1ed1n Chay)\", featuring translucent, chewy rice paper wrapped around fresh lettuce, herbs, vegetarian ham, and glass noodles, served with a rich homemade peanut dipping sauce\u2014refreshing and appetizing with every bite. The serene and peaceful atmosphere provides a cozy refuge to relax and recharge after a sweaty adventure at the tunnels.", "name": "An Lac Vegetarian Eatery (Qu\u00e1n Chay An L\u1ea1c)", "transport": "About a 25-minute drive from the B\u1ebfn \u0110\u00ecnh section of the C\u1ee7 Chi Tunnels."}, {"address": "247 Provincial Road 8, T\u00e2n Th\u1ea1nh \u0110\u00f4ng, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Located along Provincial Road 8, Tu Tam is a renowned traditional vegetarian spot in C\u1ee7 Chi. The signature \"Vegetarian Claypot Rice (C\u01a1m Ni\u00eau Chay)\" is a must-try: cooked in a clay pot until a crispy golden crust forms at the bottom, topped with special veggie meat sauce, sauteed mushrooms, aromatic ginger threads, and black pepper, creating an amazingly rich texture and aroma. Locals flock here for takeout on the 1st and 15th of the lunar month, making it an unmissable spot to experience authentic Southern Vietnamese rice culture.", "name": "Tu Tam Vegetarian (Qu\u00e1n Chay T\u1eeb T\u00e2m)", "transport": "Recommended to go by rented motorbike or private car; located along the main Provincial Road 8."}, {"address": "65 Street 458, Trung An, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Located near C\u1ee7 Chi Eco-Farm, Dieu Hanh specializes in farm-to-table organic vegetable dishes. Their \"Vegetarian Mi Quang (M\u00ec Qu\u1ea3ng Chay)\" is widely praised\u2014yellow turmeric rice noodles served with a splash of rich savory broth, topped with crushed peanuts, plant-based shrimp, and grilled rice crackers. Crushing the crackers into the noodles offers a delightful double-texture of crispy and tender. The spacious, bright dining area is ideal for tour groups or families enjoying a green lunch.", "name": "Dieu Hanh Vegetarian Eatery (Qu\u00e1n Chay Di\u1ec7u H\u1ea1nh)", "transport": "About a 5-minute drive from Trung An Fruit Garden, or a 15-minute ride from the C\u1ee7 Chi Tunnels."}, {"address": "12/4D Song H\u00e0nh, T\u00e2n Xu\u00e2n, H\u00f3c M\u00f4n, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A high-quality vegetarian restaurant near the border of C\u1ee7 Chi and H\u00f3c M\u00f4n, famous for its lotus-themed dishes. The classic \"Steamed Fragrant Rice in Lotus Leaf\" wraps fresh lotus seeds, lily bulbs, wild mushrooms, and jasmine rice inside a fresh lotus leaf before steaming. Unwrapping it releases a delicate floral fragrance; the rice absorbs the gentle aroma, making it soft, sticky, and sweet. Additionally, their special \"Vegetarian Tom Yum Soup\" is hugely popular\u2014perfectly balanced spicy and sour flavors that refresh your energy in the warm Ho Chi Minh suburbs.", "name": "Sen Hong Vegetarian Restaurant (Qu\u00e1n Chay Sen H\u1ed3ng)", "transport": "Located at the intersection of Highway 22 and Song H\u00e0nh Road, a major transit route between downtown and the C\u1ee7 Chi Tunnels."}, {"address": "89 Provincial Road 15, Ph\u00fa H\u00f2a \u0110\u00f4ng, C\u1ee7 Chi, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Located in Ph\u00fa H\u00f2a \u0110\u00f4ng Commune, Tam An is a charming vegetarian eatery with a rustic countryside atmosphere. The signature \"Vegetarian Hu Tieu Nam Vang (H\u1ee7 Ti\u1ebfu Nam Vang Chay)\" is truly special\u2014the broth is simmered for hours with radish, sugarcane, and mushrooms to create a naturally sweet and savory flavor, paired with chewy rice noodles, crispy fried veggie wontons, and tender king oyster mushrooms. With wallet-friendly prices and authentic flavors, it\u0027s a favorite stop for independent travelers exploring local food after visiting the tunnels.", "name": "Tam An Vegetarian (Qu\u00e1n Chay T\u00e2m An)", "transport": "Located along the main TL15 road en route to the B\u1ebfn D\u01b0\u1ee3c section of the C\u1ee7 Chi Tunnels, making it very convenient to stop by."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "TL15, Ph\u00fa Hi\u1ec7p, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.6 stars | This is an iconic vintage snack and a must-try when visiting the Cu Chi Tunnels. Fresh out of the steamer, the cassava releases a subtle herbal aroma, offering a dense, soft, yet wonderfully chewy texture. Dipped in a special blend of crunchy crushed peanuts, sesame seeds, and a touch of salt, it creates an explosion of sweet and savory flavors. After exploring the narrow underground tunnels, tasting this staple food of wartime soldiers lets you deeply appreciate the rich history and local heritage. Extremely popular among domestic and international tourists alike.", "name": "Cu Chi Tunnels Traditional Steamed Cassava (Khoai M\u00ec H\u1ea5p Mu\u1ed1i \u0110\u1eadu C\u1ee7 Chi)", "transport": "Take Bus No. 13 or No. 79 to the Cu Chi Tunnels entrance and walk, or join a chartered day tour."}, {"address": "259 QL22, T\u00e2n Th\u00f4ng H\u1ed9i, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.7 stars | A hugely popular thirst-quencher located along the main road to the Cu Chi Tunnels. The owner perfectly blends freshly squeezed, sweet sugarcane juice with rich, custom durian puree. The first sip brings the crisp sweetness of sugarcane, followed by a burst of creamy durian aroma\u2014sweet without being cloying, and unbelievably smooth. Exceptionally refreshing and ice-cold, it\u0027s a must-drink street delicacy that almost every tourist holds while strolling through the hot Cu Chi outdoor eco-park.", "name": "Vuon Cau Durian Sugarcane Juice (N\u01b0\u1edbc M\u00eda S\u1ea7u Ri\u00eang V\u01b0\u1eddn Cau C\u1ee7 Chi)", "transport": "Drive along Highway 22 toward Cu Chi or take Bus No. 13, get off at T\u00e2n Th\u00f4ng H\u1ed9i Station, and walk for 2 minutes."}, {"address": "Ch\u1ee3 C\u1ee7 Chi, \u0110\u01b0\u1eddng 358, TT. C\u1ee7 Chi, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 stars | The most eye-catching charcoal-grilled dessert stall right at the entrance of the Cu Chi Traditional Market. Freshly shredded cassava is mixed with coconut shreds, coconut milk, and a bit of condensed milk, then grilled over charcoal until the outer crust turns golden and fragrant. The exterior is slightly crispy, while the filling remains delightfully soft, chewy, and rich in coconut and cassava sweetness. Served hot off the grill, its irresistible aroma makes many passing foodies and travelers pause to grab a bite.", "name": "Cu Chi Market Freshly Grilled Cassava Cake (B\u00e1nh Khoai M\u00ec N\u01b0\u1edbng Ch\u1ee3 C\u1ee7 Chi)", "transport": "Take Bus No. 13 to the C\u1ee7 Chi Bus Station and walk about 5 minutes to the entrance of Cu Chi Traditional Market."}, {"address": "112 TL8, TT. C\u1ee7 Chi, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.6 stars | Cu Chi\u0027s most famous specialty is its tender young beef. This street food stall slices freshly steamed, tender beef thinly, paired with local dew-soaked rice paper, fresh herbs, cucumber, and pickled radish shreds. Rolled by hand and dipped in special fish sauce or fermented shrimp paste, the pleasantly chewy rice paper wraps around juicy, sweet beef and crisp vegetables, offering rich layers of texture. Highly recommended by both locals and visitors.", "name": "Cu Chi Tender Beef Rice Paper Roll Stall (B\u00e1nh Tr\u00e1ng Cu\u1ed1n B\u00f2 T\u01a1 C\u1ee7 Chi)", "transport": "Take a taxi for about 3 minutes from the Cu Chi Bus Station, or walk along Provincial Road 8."}, {"address": "45 \u0110\u01b0\u1eddng Ph\u1ea1m V\u0103n C\u1ed9i, Ph\u1ea1m V\u0103n C\u1ed9i, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 stars | A traditional street snack that is immensely popular in the afternoons and evenings across Cu Chi. Using sweet, locally grown glutinous corn, it is slow-roasted over charcoal until plump and cooked, then brushed with rich butter and vibrant green scallion oil. With one bite, the chewy sweetness of the corn and the smoky charcoal aroma burst forth, balanced by the savory-sweet scallion sauce. Deliciously fragrant and addictive, it\u0027s a local market signature you shouldn\u0027t miss.", "name": "Cu Chi Charcoal Grilled Corn with Scallion Oil (B\u1eafp N\u01b0\u1edbng M\u1ee1 H\u00e0nh C\u1ee7 Chi)", "transport": "Located near the Ph\u1ea1m V\u0103n C\u1ed9i eco-agricultural area; hiring a private car or riding a scooter is recommended."}, {"address": "88 TL15, T\u00e2n Th\u1ea1nh \u0110\u00f4ng, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 stars | This roadside stall draws crowds of passersby with its golden, crispy freshly fried banana fritters. Flattened local small bananas are coated in a specially blended rice flour batter with black sesame seeds, then deep-fried in hot oil until puffed and golden. The exterior is incredibly crunchy, while the banana filling turns tender, rich, and intensely sweet from the heat. The contrasting textures paired with sesame fragrance will turn anyone into a repeat customer.", "name": "Cu Chi Traditional Fried Banana Fritters (B\u00e1nh Chu\u1ed1i Chi\u00ean C\u1ee7 Chi)", "transport": "Head along Provincial Road 15 toward the Cu Chi Tunnels; take Bus No. 79 and get off at T\u00e2n Th\u1ea1nh \u0110\u00f4ng Station."}, {"address": "154 Nguy\u1ec5n V\u0103n Kh\u1ea1, TT. C\u1ee7 Chi, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.5 stars | Pitted large segments of jackfruit freshly harvested from local Cu Chi fruit farms are filled with fragrant multicolored sticky rice steamed in coconut milk, then topped with crunchy crushed peanuts and fresh coconut shreds. The first bite offers the crisp, sweet flesh of jackfruit, immediately followed by soft, fragrant coconut sticky rice. Fruit and rice aromas intertwine beautifully on the tongue to create a wonderful tropical flavor, making it a huge hit among dessert-loving tourists.", "name": "Cu Chi Fresh Jackfruit Sticky Rice (X\u00f4i M\u00edt C\u1ee7 Chi)", "transport": "Located on Nguy\u1ec5n V\u0103n Kh\u1ea1 Street in Cu Chi Town; take a Grab or taxi for about 5 minutes from the Cu Chi Roundabout."}, {"address": "12 TL7, An Nh\u01a1n T\u00e2y, C\u1ee7 Chi, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh, Vietnam", "feature": "\u2b50 4.4 stars | A classic mixed rice paper salad you cannot miss when visiting Cu Chi, the hometown of rice paper. The owner takes soft, chewy dew-soaked rice paper, cuts it into small strips, and tosses it evenly with calamansi juice, shredded green mango, beef jerky, quail eggs, fresh herbs, and a secret spicy chili oil. The rice paper absorbs the sweet, sour, salty, and spicy dressing, turning irresistibly chewy. Combined with the tart crunch of mango and savory beef jerky, every bite is an appetite-arousing feast, making it the top choice for young travelers and local students.", "name": "Cu Chi Mixed Rice Paper Salad Stall (B\u00e1nh Tr\u00e1ng Tr\u1ed9n C\u1ee7 Chi)", "transport": "Located along Provincial Road TL7 in An Nh\u01a1n T\u00e2y Commune; take Bus No. 79 to the opposite side of An Nh\u01a1n T\u00e2y Agricultural Market."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Suburbs - Cu Chi Tunnels \u0026 Eco Day Tour District"}, "district_1_buivien": {"categories": {"cat_1": {"items": [{"address": "323 Ph\u1ea1m Ng\u0169 L\u00e3o, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 Stars | Located at the intersection of Ph\u1ea1m Ng\u0169 L\u00e3o and B\u00f9i Vi\u1ec7n streets, this classic legendary ph\u1edf shop is a beloved favorite among international backpackers and locals alike. Its flagship dish, beef brisket ph\u1edf (Ph\u1edf N\u1ea1m), features a rich, savory broth simmered for hours, infused with aromatic herbal nuances and natural beef sweetness. Hand-cut beef chunks are slow-cooked until melt-in-your-mouth tender, served over chewy rice noodles, fresh Thai basil, and bean sprouts. Soaking up all the delicious broth, every comforting bite offers incredible depth of flavor\u2014making it the ultimate late-night comfort food after an evening out.", "name": "Ph\u1edf Qu\u1ef3nh", "transport": "About a 1-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "145 B\u00f9i Vi\u1ec7n, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 Stars | Situated in the heart of B\u00f9i Vi\u1ec7n Walking Street, this famous spot serves authentic Northern Vietnamese grilled pork rice noodles (b\u00fan ch\u1ea3). Their signature charcoal-grilled pork patties and belly slices feature a smoky, charred aroma while remaining crispy outside and tender inside. Dip the rice noodles and fresh greens into the warm, sweet-and-sour fish sauce broth to experience an explosion of savory meatiness balanced by crisp vegetables. Tourists also love its clean, refined dining ambiance.", "name": "B\u00fan Ch\u1ea3 145", "transport": "About a 2-minute walk from the center of B\u00f9i Vi\u1ec7n Walking Street"}, {"address": "62 Nguy\u1ec5n V\u0103n Tr\u00e1ng, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 Stars | Located just steps away from the Ph\u1ea1m Ng\u0169 L\u00e3o commercial area, this iconic b\u00e1nh m\u00ec shop is famous for its freshly house-baked crisp baguettes. Golden and flaky on the outside while soft and airy on the inside, the warm rolls are packed with rich pate spread, Vietnamese pork sausage (ch\u1ea3 l\u1ee5a), freshly roasted barbecue pork, pickled daikon and carrots, and fresh cilantro. The rich, savory meat filling paired with refreshing sweet-and-sour crunch offers a perfectly balanced bite\u2014a classic flavor Saigon locals have grown up loving.", "name": "B\u00e1nh M\u00ec H\u1ed3ng Hoa", "transport": "About a 5-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "243 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng Nguy\u1ec5n C\u01b0 Trinh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 Stars | A spacious, longstanding traditional ph\u1edf restaurant near the Ph\u1ea1m Ng\u0169 L\u00e3o district specializing in classic Saigon-style ph\u1edf. The broth is simmered slowly over many hours with rich beef bones, yielding a deliciously sweet, clear, non-greasy base. Fresh thinly sliced rare beef is ladled over piping hot noodles, cooking to a delicate pink perfection that melts tender and juicy in your mouth. Served with a generous platter of fresh herbs and homemade chili sauce, its rich Vietnamese herbal aromas will leave you craving more.", "name": "Ph\u1edf H\u00f9ng (Nguy\u1ec5n Tr\u00e3i)", "transport": "About a 6-minute walk or a 2-minute Grab ride from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "155 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | A time-honored steamed rice roll eatery that has served the neighborhood for decades, making every order fresh to order. The translucent, silky-thin rice crepe wraps a flavorful filling of seasoned minced pork and wood ear mushrooms, topped generously with crispy fried shallots and pork sausage slices. Drizzle with their homemade sweet dipping sauce to enjoy a smooth, comforting, savory-sweet delicacy\u2014a truly authentic Vietnamese local brunch experience.", "name": "B\u00e1nh Cu\u1ed1n Thi\u00ean H\u01b0\u01a1ng", "transport": "About a 4-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "111 B\u00f9i Th\u1ecb Xu\u00e2n, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | Operating for decades, this traditional Vietnamese sticky rice and dessert shop is a go-to comfort spot for locals. The signature savory sticky rice (x\u00f4i m\u1eb7n) is loaded with shredded chicken, Chinese sausage, quail eggs, and fragrant fried shallot oil; every grain of sticky rice is chewy, fragrant, and rich. Round off your meal with a bowl of colorful mung bean ch\u00e8 scented with rich coconut milk\u2014satisfyingly sweet and deliciously authentic to Saigon\u0027s traditional flavor.", "name": "X\u00f4i Ch\u00e8 B\u00f9i Th\u1ecb Xu\u00e2n", "transport": "About a 6-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "139 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng Ph\u1ea1m Ng\u0169 L\u00e3o, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 Stars | A classic broken rice stand that has grown alongside the backpacker district, famous for its fresh lemongrass pork chops grilled over charcoal. The thick, well-marinated pork chops are grilled to golden perfection with a rich smoky sizzle. Served over nutty broken rice alongside steamed egg loaf (ch\u1ea3 tr\u1ee9ng), crisp cucumber, and pickled greens, drizzled with scallion oil and sweet fish sauce, it delivers a hearty and supremely satisfying Saigon classic.", "name": "C\u01a1m T\u1ea5m M\u1ee5i", "transport": "About a 4-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}, {"address": "175c C\u00f4n Qu\u1ef3nh, Ph\u01b0\u1eddng Nguy\u1ec5n C\u01b0 Trinh, Qu\u1eadn 1, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 Stars | A legendary grilled pork noodle shop near the Ph\u1ea1m Ng\u0169 L\u00e3o district that draws eager daily crowds. Tender slices of pork are deeply marinated with aromatic lemongrass and grilled over charcoal to smoky perfection. Served over soft rice noodles with crispy golden spring rolls and stir-fried beef, topped with roasted peanuts, fried shallots, and tangy sweet fish sauce\u2014a flavorful, juicy, and refreshingly complex dish that visitors simply cannot miss.", "name": "B\u00fan Th\u1ecbt N\u01b0\u1edbng Ch\u1ecb Tuy\u1ec1n", "transport": "About a 5-minute walk from Ph\u1ea1m Ng\u0169 L\u00e3o Street"}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "184
