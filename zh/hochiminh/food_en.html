t \u0026 Bar)", "transport": "Drive along Th\u1ea3o \u0110i\u1ec1n Main Street to No. 97B; look for the distinct white building."}, {"address": "32 D10, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | A Zen-inspired bistro that elevates traditional Vietnamese vegetarian cuisine to refined perfection, set in a tranquil garden filled with tropical flora. Must-try signatures include palm sugar lemongrass konjac rolls\u2014chewy, refreshing, and infused with cool lemongrass and deep brown sugar aromas\u2014and the rich coconut wild vegetable stew, featuring fresh coconut juice slow-simmered with local wild greens and tofu for a silky, naturally sweet broth. Complemented by natural herbal mocktails or floral teas, it strips away any clich\u00e9 vegetarian blandness to deliver a revitalizing, palate-pleasing experience loved by global travelers and health enthusiasts.", "name": "Hum Vegetarian - Garden Fine Dining Bistro (Hum Vegetarian, Garden \u0026 Cafe)", "transport": "Take a Grab to D10 Street in Th\u1ea3o \u0110i\u1ec1n; nestled in a quiet alley."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "32 D10 Street, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | A tranquil oasis located in Th\u1ea3o \u0110i\u1ec1n, this high-end vegetarian restaurant perfectly merges Southeast Asian herbs with fresh ingredients. The signature \u0027Tom Yum Lemongrass \u0026 Mushroom Pot\u0027 features a rich and velvety broth bursting with coconut milk and lemongrass aromas, accompanied by tender oyster mushrooms and firm tofu. The \u0027Lotus Herb Sticky Rice\u0027 offers a subtle fragrance of lotus leaves and a crunchy nutty texture, creating a deeply rich layering of flavors. With its exquisite garden landscaping and flowing ponds, it is an incredibly relaxing escape\u2014a top choice for travelers seeking a luxurious, hipster ambiance and healthy cuisine.", "name": "Hum Vegetarian, Garden \u0026 Restaurant", "transport": "Take a Grab taxi from downtown Ho Chi Minh City for about 20 minutes to reach D10 Street in Thao Dien."}, {"address": "14 Tran Ngoc Dien, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A supreme nut-cheese paradise crafted specifically for vegans and those with lactose intolerance! They naturally ferment pure cashews to produce a variety of plant-based cheeses with a smooth, velvety texture, subtle tangy nutty notes, and rich creaminess. The \u0027Cashew Cheese Platter with Sourdough Bread\u0027 is highly recommended\u2014crispy on the outside, soft on the inside sourdough spread thickly with truffle cashew cheese, melting in your mouth alongside fresh figs and nuts for incredible complexity. The outdoor garden seating exudes European slow-life charm, making it a favorite among expats and influencers.", "name": "Kashew Cheese Cafe", "transport": "Take Grab to Tran Ngoc Dien Street; it is located within the trendy market area and easily reachable on foot."}, {"address": "31 Vo Truong Toan, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.8 stars | Hidden in the alleys of Thao Dien, this French colonial-style historic villa is surrounded by lush greenery and serves light, healthy French-Vietnamese fusion vegetarian cuisine. A must-try is the \u0027Coconut Curry Vegetable Pot\u0027\u2014the soup base is rich and aromatic without being greasy, featuring sweet potatoes and potatoes stewed until melt-in-your-mouth tender, perfect for dipping with warm, crispy-yet-soft French baguette. The warm, elegant, and verdant setting offers a feast for both the eyes and palate, making it immensely popular with families and discerning foodies.", "name": "Chay Garden - Vegetarian Restaurant \u0026 Coffee", "transport": "About an 18-minute taxi ride from downtown, located near the intersection of Vo Truong Toan Street."}, {"address": "203 Nguyen Van Huong, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Located near the Saigon River waterfront, this minimalist and stylish vegan restaurant features cross-border plant-based fusion dishes combining American and Southeast Asian flavors. Popular picks include the \u0027Vegan Tacos\u0027, made with pan-seared portobello mushrooms and custom guacamole\u2014chewy tortillas packed with juicy, savory fillings and a gentle spicy kick\u2014and the \u0027Thai Tom Yum Konjac Seafood Noodles\u0027, which use springy konjac to mimic seafood textures in a delightfully refreshing, tangy, and spicy broth. With bright modern decor and a refreshing river breeze, it is a hotspot for young trendsetters in Thao Dien.", "name": "Veganizta", "transport": "Located along the riverside section of Nguyen Van Huong Street; taking a Grab directly to the entrance is recommended."}, {"address": "25 Street 38, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Imbued with a rich traditional Vietnamese and ancient Indian aesthetic, this vegetarian restaurant exudes a serene aroma and warm woody vibes. The \u0027Traditional Vegetarian Pho\u0027 is highly recommended\u2014the broth is slow-simmered for hours from various vegetables and herbal spices, delivering a clean, sweet taste infused with basil and cilantro aromas. Silky handmade rice noodles absorb the flavorful broth, complemented by tender vegan beef slices and fresh mushrooms for distinct layers of texture. Generous portions at affordable prices make it hugely popular among locals and vegetarian connoisseurs alike.", "name": "Metta Vegetarian", "transport": "Just a 3-minute walk around the corner from Thao Dien Street, the main thoroughfare."}, {"address": "39 Nguyen U Di, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A secret vegan oasis hidden within a jungle-like garden in Thao Dien, completely surrounded by lush greenery as if you have stepped into a tropical rainforest. A must-try is the \u0027Vegan Bun Cha\u0027, featuring grilled tofu and homemade plant patties instead of pork. Dipped in a perfectly sweet-and-sour vegan fish sauce and paired with fresh lettuce and rice vermicelli, each bite is crisp, refreshing, and bursting with flavor. The open-air dining environment harmonious with nature offers a deeply healing vibe, captivating tourists who love discovering quiet, hidden gems.", "name": "M\u1ea7m Vegan Bistro", "transport": "Take a taxi to the end of Nguyen U Di Street and follow the leafy signs to reach the bistro."}, {"address": "19 Street 46, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A trendy spot specializing in healthy Western light meals and egg-free, dairy-free baking, celebrated for using high-quality organic ingredients. Their signature \u0027Vegan Cheeseburger\u0027 features a plant patty topped with homemade vegan cheese; seared to crispy perfection on the outside while juicy inside, it rivals real beef. Paired with sweet-and-tangy beetroot and a rye bun that is crisp outside and soft inside, the flavors are exceptionally rich. With a vibrant and relaxed atmosphere, it is a favorite lunch and afternoon tea spot for Thao Dien expats.", "name": "Filo Vegan Eatery", "transport": "Take Grab to Street 46; it is about a 1-minute walk away."}, {"address": "12 Quoc Huong, Thao Dien, District 2, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A popular restaurant that recreates refined Vietnamese home-style dishes in 100% vegetarian versions. Recommended is the \u0027Claypot Braised Tofu \u0026 Vegan Meat\u0027, where the savory, rich sauce deeply infuses into silky tofu and springy plant-based protein, pairing exceptionally well with rice. The \u0027Vietnamese Fried Spring Rolls\u0027 feature a golden, crispy skin packed juicy with wood ear mushrooms, taro, and shredded carrots\u2014delivering a satisfying crunch with every bite. The warm, elegant wooden decor creates a charming atmosphere, making it a fantastic spot to experience traditional Vietnamese vegetarian dining.", "name": "B\u00e0 X\u00e3 Vegetarian Restaurant", "transport": "Located on Quoc Huong Street, a main road in Thao Dien, making transport extremely convenient."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "238 Nguy\u1ec5n V\u0103n H\u01b0\u1edfng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | A hugely popular Vietnamese b\u00e1nh m\u00ec stall located in the heart of Th\u1ea3o \u0110i\u1ec1n. The bread is toasted to ultra-crispy perfection, crunching delightfully with every bite. Inside, it\u0027s packed with savory homemade pork pate, pickled daikon and carrots, fresh cucumber, and signature sauce. Richly layered yet never greasy, it\u2019s a classic daily snack favored by expats and locals alike.", "name": "C\u00f4 \u0110i\u1ec7p B\u00e1nh M\u00ec (B\u00e1nh M\u00ec C\u00f4 \u0110i\u1ec7p)", "transport": "Take a Grab taxi or motorbike to near the intersection of Nguy\u1ec5n V\u0103n H\u01b0\u1edfng and Xu\u00e2n Th\u1ee7y streets."}, {"address": "168/1 Nguy\u1ec5n V\u0103n H\u01b0\u1edfng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | An iconic multi-concept outdoor market hub in Th\u1ea3o \u0110i\u1ec1n\u0027s trendy neighborhood. It features a variety of quality street food stalls offering everything from freshly grilled Mexican street corn to American smoked pulled pork sliders and artisanal churros. The food is crisp on the outside, tender on the inside, and full of aromatic flavor. Paired with exotic shipping-container decor and relaxed music, it\u2019s a favorite among tourists and hipsters.", "name": "Saigon Outcast Street Food \u0026 Market", "transport": "Take a Grab into the alley off Nguy\u1ec5n V\u0103n H\u01b0\u1edfng; walk about 2 minutes to spot the container-styled open-air complex."}, {"address": "66 Qu\u1ed1c H\u01b0\u01a1ng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A classic street food staple known as \u0027Vietnamese Pizza\u0027. Thin rice paper is grilled fresh to order, topped with rich butter, quail eggs, scallions, and pork floss. Charcoal-grilled to an ultra-crispy, satisfying crunch infused with subtle smoky notes, every bite releases rich egg aroma and a perfect balance of sweet and savory flavors\u2014a must-try local snack during an afternoon stroll in Th\u1ea3o \u0110i\u1ec1n.", "name": "Th\u1ea3o \u0110i\u1ec1n Grilled Rice Paper (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng Th\u1ea3o \u0110i\u1ec1n)", "transport": "Take HCMC Metro Line 1 to An Ph\u00fa Station, then transfer to a taxi or walk for about 12 minutes."}, {"address": "39 L\u00ea V\u0103n Mi\u1ebfn, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | A natural craft gelato shop tucked away in an alley of Th\u1ea3o \u0110i\u1ec1n. Made fresh daily with carefully selected local tropical fruits and premium fresh milk. Popular flavors like \u0027Vietnamese Coffee\u0027 and \u0027Passionfruit Sorbet\u0027 feature an exceptionally silky-smooth texture that melts in your mouth with a balanced sweet-sour flavor profile\u2014the ultimate cooling treat during a hot Saigon afternoon stroll.", "name": "Ralf\u0027s Artisan Gelato", "transport": "Turn into the alley off L\u00ea V\u0103n Mi\u1ebfn from Xu\u00e2n Th\u1ee7y shopping street; a 3-minute walk will bring you right there."}, {"address": "11 Qu\u1ed1c H\u01b0\u01a1ng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A highly iconic local street dessert stall. Must-tries include Thai-style Ch\u00e8 Th\u00e1i and traditional coconut milk dessert soup, packed with toppings like jackfruit, nipa palm seeds, grass jelly, and rich coconut milk. Refreshingly sweet without being sickly, crushed ice adds vibrant textural layers\u2014a top choice for travelers experiencing authentic Vietnamese dessert culture.", "name": "Ch\u00e8 Th\u00e1i C\u00f4 Mai - Th\u1ea3o \u0110i\u1ec1n", "transport": "Take a Grab car to the intersection of Qu\u1ed1c H\u01b0\u01a1ng street; it\u0027s just a 5-minute walk from Th\u1ea3o \u0110i\u1ec1n\u0027s main commercial hub."}, {"address": "42 Xu\u00e2n Th\u1ee7y, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | An aromatic fried banana stall on Xu\u00e2n Th\u1ee7y Street. Local sweet bananas are selected, flattened, lightly battered, and deep-fried to golden-crisp perfection. With a biscuit-like crispy exterior and a steaming, soft, chewy inside brimming with natural fruity sweetness, this delightful contrast keeps customers coming back for more.", "name": "Th\u1ea3o \u0110i\u1ec1n Fried Banana \u0026 Sweet Potato Stall (B\u00e1nh Chu\u1ed1i Chi\u00ean Th\u1ea3o \u0110i\u1ec1n)", "transport": "Located right on Xu\u00e2n Th\u1ee7y main street; easily spotted while taking a casual stroll through the Th\u1ea3o \u0110i\u1ec1n cultural neighborhood."}, {"address": "89 Qu\u1ed1c H\u01b0\u01a1ng, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | An extraordinarily popular street food spot for grilled pork noodle bowls in Th\u1ea3o \u0110i\u1ec1n. Freshly charcoal-grilled herb-marinated pork slices and crispy fried spring rolls are served over chewy rice vermicelli and fresh greens, drizzled with a sweet-and-sour fish sauce dressing. Juicily smoky pork and crispy, generously filled spring rolls deliver a mouthwatering freshness in every bite at fantastic value.", "name": "Ki\u1ec1u B\u1ea3o Grilled Pork Rice Noodles - Th\u1ea3o \u0110i\u1ec1n (B\u00fan Th\u1ecbt N\u01b0\u1edbng Ki\u1ec1u B\u1ea3o)", "transport": "Take Metro Line 1 to Th\u1ea3o \u0110i\u1ec1n Station, then walk or take a motorbike taxi for about 5 minutes."}, {"address": "15 Xu\u00e2n Th\u1ee7y, Th\u1ea3o \u0110i\u1ec1n, District 2, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A top-tier smoothie stand located in Th\u1ea3o \u0110i\u1ec1n\u2019s trendy street district. Fresh seasonal tropical fruits like mango, avocado, and red dragon fruit are blended with condensed milk and crushed ice into an irresistibly thick, velvety smoothie. Silky-smooth with intense natural fruit flavors and no artificial syrups, it\u0027s the ultimate refreshing drink to hold while wandering Th\u1ea3o \u0110i\u1ec1n\u0027s charming streets.", "name": "Th\u1ea3o \u0110i\u1ec1n Fresh Fruit Smoothies \u0026 Juices (Sinh T\u1ed1 Th\u1ea3o \u0110i\u1ec1n)", "transport": "Situated in the heart of Xu\u00e2n Th\u1ee7y boutique street, surrounded by hip indie shops and easily accessible on foot."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "District 2 - Thao Dien: Expat Charm \u0026 Hipster Chic District"}, "district_3_culture": {"categories": {"cat_1": {"items": [{"address": "303 V\u00f5 V\u0103n T\u1ea7n, Ph\u01b0\u1eddng 5, Qu\u1eadn 3, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 Stars | One of Saigon\u0027s most prestigious traditional Southern-style beef pho institutions. The broth is slow-simmered with beef bones for tens of hours, making it rich, sweet, and subtly infused with notes of Thai basil and licorice. The signature combo beef pho features tender raw beef slices, cooked beef chunks, bouncy beef balls, and chewy tendon. The beef balls burst with savory juices while the beef slices melt in your mouth. Served with fresh Thai basil, sliced onions, sweet bean sauce, and chili sauce, its rich flavor profile keeps customers coming back. A beloved classic lauded by tourists and locals alike.", "name": "Ph\u1edf L\u1ec7 (V\u00f5 V\u0103n T\u1ea7n)", "transport": "About a 7-minute Grab taxi ride from Tan Dinh Church (The Pink Church)."}, {"address": "14/5F K\u1ef3 \u0110\u1ed3ng, Ph\u01b0\u1eddng 9, Qu\u1eadn 3, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 Stars | Hidden in an alleyway in District 3 for over 40 years, this chicken glass noodle eatery is packed daily with local foodies. The soul of the dish lies in its golden, clear pure chicken broth\u2014sweet, savory, and never greasy. Made with local free-range chicken, the meat has crispy skin, tender chicken, and zero dryness, topped off with homemade scallion oil for extra aroma. The glass noodles soak up the pure chicken essence, offering a smooth yet chewy bite. Complemented by mint leaves, cilantro, fried shallots, and a squeeze of lime juice and chili sauce, it unleashes layers of refreshing flavors.", "name": "Mi\u1ebfn G\u00e0 K\u1ef3 \u0110\u1ed3ng (Chicken Glass Noodle Soup)", "transport": "About a 12-minute walk or a 3-minute ride from the Pink Church."}, {"address": "14/5C K\u1ef3 \u0110\u1ed3ng, Ph\u01b0\u1eddng 9, Qu\u1eadn 3, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | A storied noodle shop serving traditional Northern Vietnamese flavors, this comforting spot is a childhood favorite for many District 3 residents. Generous bowls of rice vermicelli come packed with homemade pork meatballs (M\u1ecdc)\u2014including wood-ear mushroom pork balls, shiitake pork balls, and sausage slices. The pork bone broth is clear, bright, and sweet. Thin rice vermicelli absorbs the soup, pairing wonderfully with juicy, springy meatballs. Finished with fried shallots and cilantro, it delivers a fresh, light, non-greasy taste that will make you polish off every last drop of broth.", "name": "B\u00fan M\u1ecdc K\u1ef3 \u0110\u1ed3ng (Pork Meatball Rice Vermicelli)", "transport": "Located right next to Mi\u1ebfn G\u00e0 K\u1ef3 \u0110\u1ed3ng, about a 3-minute ride from the Pink Church."}, {"address": "11A Cao Th\u1eafng, Ph\u01b0\u1eddng 2, Qu\u1eadn 3, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 Stars | A decades-old classic steamed rice roll spot on Cao Th\u1eafng Street. Made fresh to order, the steamed rice sheets are feather-thin, translucent, and delightfully chewy. The rolls are stuffed with seasoned minced pork, wood-ear mushrooms, and shallots, paired with crispy fried shrimp cakes, sliced Ch\u1ea3 L\u1ee5a (Vietnamese pork sausage), and crunchy bean sprouts. Drizzle with sweet dipping sauce blended with fish sauce, lime, and minced garlic to experience the satisfying contrast between silky rolls and crispy cakes. A quintessential choice for Vietnamese breakfast or afternoon tea.", "name": "B\u00e1nh Cu\u1ed1n H\u1ea3i Nam (Steamed Rice Rolls)", "transport": "About a 6-minute Grab ride from Turtle Lake (H\u1ed3 Con R\u00f9a) in District 3."}, {"address": "389 V\u00f5 V\u0103n T\u1ea7n, Ph\u01b0\u1eddng 5, Qu\u1eadn 3, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 Stars | Founded around 1975, this legendary H\u1ee7 Ti\u1ebfu spot is famous for its meticulously prepared broth and premium ingredients. The signature chewy rice noodles sit in a naturally sweet broth slow-simmered from pork bones, dried squid, and dried shrimp. The signature bowl comes loaded with fresh jumbo shrimp, pork liver, pork heart, minced pork, and quail eggs. The shrimp is sweet and snappy, while the offal is expertly cleaned and delightfully tender. Served with celery, chives, and house-made dipping sauce, both the soup and dry versions enjoy an outstanding reputation.", "name": "H\u1ee7 Ti\u1ebfu H\u1ed3ng Ph\u00e1t (Phnom Penh Noodle Soup)", "transport": "About a 3-minute walk from Ph\u1edf L\u1ec7 (V\u00f5 V\u0103n T\u1ea7n branch)."}, {"address": "11A T\u00fa X\u01b0\u01a1ng, Ph\u01b0\u1eddng 7, Qu\u1eadn 3, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | With a name meaning \u0027addictive after one bite\u0027, this famed B\u00e1nh X\u00e8o spot is known for its gigantic, golden, ultra-crispy crepe. Infused with coconut milk and turmeric, the batter is cooked on a sizzling skillet until crackling crisp. Filled with fresh shrimp, pork slices, mung beans, and heaps of bean sprouts, you wrap a piece of hot crepe in fresh lettuce, mustard greens, and perilla leaves, then dip it into sweet, sour, and mildly spicy fish sauce. The fresh greens perfectly balance the crispiness, delivering total culinary satisfaction.", "name": "B\u00e1nh X\u00e8o \u0102n L\u00e0 Ghi\u1ec1n (Sizzling Pancakes)", "transport": "About a 5-minute Grab ride from the Pink Church."}, {"address": "105 Tr\u01b0\u01a1ng \u0110\u1ecbnh, Ph\u01b0\u1eddng 6, Qu\u1eadn 3, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 Stars | A legendary late-night goat hotpot institution highly praised by locals, situated on tree-lined Tr\u01b0\u01a1ng \u0110\u1ecbnh Street. Premium goat meat is slow-simmered with traditional herbal remedies and fermented bean curd, producing a rich, fragrant broth free of gamey odor. The meat melts tenderly while the skin remains delightfully gelatinous and springy. Add taro, morning glory, fried tofu skin, and egg noodles to the bubbling pot, then dip everything into house-made fermented bean curd sauce. It offers an incredible taste and an authentic glimpse into local nightlife gatherings.", "name": "L\u1ea9u D\u00ea Tr\u01b0\u01a1ng \u0110\u1ecbnh (Goat Hotpot)", "transport": "About a 5-minute walk from the edge of Tao Dan Park (C\u00f4ng vi\u00ean T\u00e0o \u0110\u00e0n)."}, {"address": "260 V\u00f5 V\u0103n T\u1ea7n, Ph\u01b0\u1eddng 5, Qu\u1eadn 3, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 Stars | A classic broken rice spot beloved by generations of District 3 locals, easily found by the irresistible aroma of charcoal-grilled pork chops. The signature grilled pork chop is thick, juicy, marinated in a secret sauce, and grilled to caramelized perfection. Served over chewy broken rice drizzled with scallion oil, homemade shredded pork skin (B\u00ec), and steamed egg loaf (Ch\u1ea3), topped off with sweet savory fish sauce, it delivers a rich combination of textures that leaves a lasting impression.", "name": "C\u01a1m T\u1ea5m Tr\u1ea7n Qu\u00fd C\u00e1p (Broken Rice)", "transport": "About a 2-minute walk from across Ph\u1edf L\u1ec7."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "193A/D3 Nam K\u1ef3 Kh\u1edfi Ngh\u0129a, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Tucked away in a quiet alleyway of District 3, this lush garden caf\u00e9 merges French colonial architecture with modern luxury. Their Spaghetti Carbonara features a rich, creamy sauce, paired brilliantly with a brunch platter of sourdough toasted crisp on the outside and soft inside for rich layers of texture. The cold brew offers refreshing citrus notes, pairing perfectly with the moderately sweet Matcha Basque Cheesecake. With a romantic atmosphere filled with greenery, it is the ultimate peaceful getaway for hipsters and foodies alike.", "name": "Oromia Coffee \u0026 Lounge", "transport": "Take a Grab or taxi to Nam K\u1ef3 Kh\u1edfi Ngh\u0129a Street; it is about a 1-minute walk from the alley entrance."}, {"address": "287/2 Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | More than just a caf\u00e9, this was a secret Viet Cong intelligence base during the Vietnam War! The shop preserves underground tunnels, vintage radios, and antique motorcycles. Their signature Vietnamese egg coffee (C\u00e0 Ph\u00ea Tr\u1ee9ng) boasts a smooth, mousse-like texture, achieving a perfect balance between rich egg foam and intense black coffee; the accompanying Korean-style broken rice is irresistibly aromatic. Its unique immersive history and authentic flavors make it a favorite for history buffs and coffee lovers worldwide.", "name": "\u0110\u1ed7 Ph\u1ee7 Secret Base Caf\u00e9 (C\u00e0 Ph\u00ea \u0110\u1ed7 Ph\u1ee7 - C\u01a1m T\u1ea5m \u0110\u1ea1i H\u00e0n)", "transport": "About a 5-minute Grab ride from Tan Dinh Church (Pink Church)."}, {"address": "109/36 Nguy\u1ec5n Thi\u1ec7n Thu\u1eadt, Ward 2, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Founded in 1938, this is one of Ho Chi Minh City\u0027s oldest surviving traditional filter (V\u1ee3t) coffee shops. They strictly use clay pots and cloth net filters to brew coffee, simmering the beans over a low flame to release unique caramel and rich woody aromas. The signature iced coffee with condensed milk (C\u00e0 Ph\u00ea S\u1eefa \u0110\u00e1) is exceptionally smooth and fragrant, perfectly sweet with subtle smoky charcoal undertones. Sitting on small plastic stools in a vintage alleyway to sip your brew offers the purest taste of old Saigon culture.", "name": "Cheo Leo Caf\u00e9", "transport": "Take Bus 150 or Grab to the alley entrance at Nguy\u1ec5n Thi\u1ec7n Thu\u1eadt, then walk for about 2 minutes."}, {"address": "33 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A flagship minimalist caf\u00e9 located on a bustling street in District 3, boasting high ceilings and glass architecture with incredible natural light that makes it super relaxing. A must-try is the Eggs Benedict Big Breakfast\u2014cut open the poached eggs to let golden yolk drizzle over crispy English muffins and smoked salmon, complimented by a slightly tangy, velvety hollandaise sauce. Pair it with pour-over single-origin specialty coffee, featuring pleasant acidity and floral-fruity notes. Its ultra-modern design draws crowds of young locals and foreign tourists.", "name": "The Running Bean Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch", "transport": "Extremely convenient, located just a 2-minute walk from Turtle Lake."}, {"address": "274 Hai B\u00e0 Tr\u01b0ng, Ward 8, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Situated right across from the famous Tan Dinh Church (Pink Church), this caf\u00e9 boasts a fantastic second-floor view. Known for its vintage North Vietnamese military aesthetic, its signature Coconut Smoothie Coffee (C\u00e0 Ph\u00ea C\u1ed1t D\u1eeba) is a standout\u2014pouring rich, bittersweet Vietnamese coffee over creamy coconut ice slush for an ice-cream-like, refreshing texture. Sitting on the outdoor terrace, sipping sweet coconut coffee while admiring the romantic architecture of the Pink Church makes it a prime spot for photo ops.", "name": "C\u1ed9ng C\u00e0 Ph\u00ea - Hai B\u00e0 Tr\u01b0ng", "transport": "Located right across from the Pink Church, a 1-minute walk away."}, {"address": "12 Tr\u01b0\u01a1ng \u0110\u1ecbnh Street, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | A hidden gem caf\u00e9 blending old Saigon red-brick architecture with modern green foliage, offering an interior filled with artistic light and shadows. Their High Mountain Oolong Cold Brew delivers an elegant tea and fruity aroma with a crisp, refreshing finish. The French Toast Brunch features a caramelized, crispy exterior and cloud-soft interior, heavenly when paired with maple syrup and vanilla ice cream. Its elegant, serene vibe and exquisite offerings make it a renowned retreat in District 3.", "name": "S\u0027mores Saigon C\u00e0 Ph\u00ea - Tr\u01b0\u01a1ng \u0110\u1ecbnh", "transport": "About a 5-minute walk from Tao Dan Park."}, {"address": "75 B\u00e0n C\u1edd, Ward 3, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Meaning \u0027Escape Saigon\u0027, true to its name, this caf\u00e9 is hidden in a quiet alley next to a bustling market in District 3, featuring Wabi-Sabi aesthetics and vintage industrial decor. The Salted Cream Egg Coffee is highly recommended: thick salted cream merges flawlessly with smooth egg cream. The first sip yields velvety salted cream followed by the bold, rich black coffee, creating a beautifully layered sweet-and-savory profile. Paired with a crunchy bowl of house-roasted nut granola, it\u2019s a favorite among local hipsters.", "name": "Tr\u1ed1n S\u00e0i G\u00f2n C\u00e0 Ph\u00ea", "transport": "Near B\u00e0n C\u1edd Market; take a Grab to the alley entrance at 75 B\u00e0n C\u1edd Street and walk in."}, {"address": "168 T\u00fa X\u01b0\u01a1ng, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Founded by French chocolatiers and dubbed the \u0027Chanel of Vietnamese Chocolates\u0027, this flagship caf\u00e9 and brunch destination resides in an old French colonial villa on T\u00fa X\u01b0\u01a1ng Street. Beyond offering top-tier bean-to-bar artisanal chocolates, its Chocolate Croissant Brunch is a standout must-try: a flaky, multi-layered croissant bursting with rich dark chocolate fudge with every bite. Paired with a specially crafted Cacao Pulp Americano\u2014where tangy-sweet fruity aromas meet decadent cacao notes\u2014it offers an immensely elegant tasting feast.", "name": "Maison Marou T\u00fa X\u01b0\u01a1ng", "transport": "Take a Grab or taxi to near the intersection of T\u00fa X\u01b0\u01a1ng Street and Tr\u01b0\u01a1ng \u0110\u1ecbnh Street."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "32 V\u00f5 V\u0103n T\u1ea7n, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Nestled in a lush French colonial villa in District 3, this restaurant transforms traditional Vietnamese vegetarian cuisine into refined bistro fare. Signature dishes like Turmeric Coconut Soup and Pan-Seared Lotus Root Cakes are rich, smooth, and multi-layered. Crispy on the outside and tender inside, they shatter vegetarian stereotypes, making this spot a favorite among health-conscious tourists and local hipsters.", "name": "Hum Vegetarian, Lounge \u0026 Restaurant", "transport": "About a 5-minute Grab ride from Tan Dinh Church (Pink Church)"}, {"address": "33 L\u00ea Qu\u00fd \u0110\u00f4n, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Housed in a charming French colonial mansion, G\u1ea1o specializes in refined regional Vietnamese home cooking. Signature dishes like Crispy Roast Chicken and Lemongrass Grilled Fish feature golden, crispy skin and juicy, tender meat. Paired with house-made fish sauce dip, it combines classic traditional flavors with an elegant dining atmosphere\u2014a top choice for authentic Vietnamese cuisine.", "name": "G\u1ea1o Restaurant", "transport": "About a 3-minute walk from the War Remnants Museum"}, {"address": "27 T\u00fa X\u01b0\u01a1ng, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A renowned regional restaurant famous for its dramatic show: servers toss and break open hot clay pots to serve the crisp claypot rice. The rice edges are delightfully crispy while the grains remain chewy and fragrant. Paired with savory fish sauce dip and caramelized braised pork belly, the rich balance of sweet and savory flavors leaves guests raving.", "name": "C\u01a1m Ni\u00eau S\u00e0i G\u00f2n (Claypot Rice - T\u00fa X\u01b0\u01a1ng)", "transport": "Take a taxi to the intersection of T\u00fa X\u01b0\u01a1ng St. and L\u00ea Qu\u00fd \u0110\u00f4n St., then walk for 1 minute"}, {"address": "16 L\u00ea Qu\u00fd \u0110\u00f4n, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Specializing in fresh seafood and traditional regional snacks from Central Vietnam, including Nha Trang. Must-try savory crispy pancakes (B\u00e1nh X\u00e8o) and shrimp rice rolls offer a crispy, satisfying texture. Wrap them in fresh lettuce and herbs, then dip into their special sweet and tangy fermented sauce for an authentic, refreshing, non-greasy taste of Central Vietnam.", "name": "Kho\u00e1i Restaurant (Central Vietnamese Cuisine)", "transport": "About a 6-minute Grab ride from Tan Dinh Church (Pink Church)"}, {"address": "193A Nam K\u1ef3 Kh\u1edfi Ngh\u0129a, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Set in a restored 1930s French villa, Ngon Villa offers high-quality traditional dishes from all across Vietnam paired with handcrafted cocktails. The signature seafood pancake features a thin, crispy crust packed with succulent, sweet shrimp. Blending romantic colonial nostalgia with fine mixology, it offers an atmospheric luxury dining experience.", "name": "Ngon Villa Saigon", "transport": "About a 7-minute walk from Tan Dinh Church (Pink Church)"}, {"address": "72 Nguy\u1ec5n Th\u1ecb Minh Khai, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Located on the rooftop of Centec Tower, this high-sky lounge serves fusion dishes combining local Vietnamese ingredients with European culinary flair. The charcoal-grilled pork ribs are smoky and charred outside while succulent inside. Coupled with crafted cocktails and stunning night views of District 3, it is a premier destination for experiencing HCMC\u0027s vibrant nightlife and food scene.", "name": "Shri Restaurant \u0026 Lounge", "transport": "Take a taxi to Centec Tower and head up to the 23rd floor rooftop"}, {"address": "32C Cao Th\u1eafng, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Hidden in a quiet alley inside a charming old French villa in District 3, this salmon-themed bistro excels in French cuisine. The signature pan-seared salmon steak features a crispy skin with delicate, moist, tender flesh, paired with tangy fruity sauces and fine wines\u2014a harmonious blend of European gastronomy and romantic ambience.", "name": "The Salmonoid", "transport": "About a 5-minute taxi ride from District 3 parks"}, {"address": "1 Tr\u01b0\u01a1ng \u0110\u1ecbnh, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A regional eatery full of Northern Vietnamese nostalgia, featuring Hanoi\u0027s iconic dish: B\u00fan \u0110\u1eadu M\u1eafm T\u00f4m (rice noodles with fried tofu and fermented shrimp paste). The fresh fried tofu is golden-crisp outside and silky inside, served alongside rich handmade blood sausages. Dipped into fermented shrimp paste zested with calamansi lime, it offers an intensely savory, flavorful, and deeply authentic taste.", "name": "\u0110\u1eadu Homemade (Tr\u01b0\u01a1ng \u0110\u1ecbnh)", "transport": "Located next to Tao Dan Park, about a 5-minute walk from the War Remnants Museum"}], "name": "Specialty Bistros \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "32 Vo Van Tan, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.7 stars | Hidden in a lush, tree-lined alley in District 3, this restaurant is famous for its refined and healthy plant-based cuisine. The signature lotus seed fried rice carries a subtle fragrance of lotus leaves; each grain of rice is light, fluffy, and distinct, paired with crunchy nuts and a variety of fresh vegetables for a rich layered texture. Highly praised by both tourists and locals for seamlessly combining traditional Vietnamese ingredients with modern cooking techniques, its peaceful tropical garden-like ambiance allows guests to calmly enjoy a sophisticated, guilt-free vegetarian feast.", "name": "Hum Vegetarian, Cafe \u0026 Restaurant", "transport": "Take a Grab or taxi to near the intersection of Vo Van Tan and Tran Quoc Thao streets; it\u0027s about a 2-minute walk from there."}, {"address": "19 Vo Van Tan, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Filled with warm wooden tones and a trendy artistic vibe, this vegetarian bistro specializes in handmade Southeast Asian-inspired vegetarian dishes. The signature Lemongrass Tofu Pancake has a golden, crispy exterior and smooth, tender tofu inside, served with a special sweet and savory dip that creates a wonderful layered texture without feeling greasy. Beloved by young locals and foreign tourists for its affordable prices and creativity, it elevates simple vegetarian ingredients into delicious and visually stunning meals.", "name": "Pi Vegetarian Bistro", "transport": "About a 5-minute taxi ride from the Pink Church (Tan Dinh Church)."}, {"address": "52 Vo Van Tan, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.6 stars | Nestled inside a French colonial-style mansion, this restaurant boasts a spacious and lush garden setting. The must-try \u0027Coconut Mushroom and Bamboo Shoot Soup\u0027 offers a naturally sweet broth infused with a rich coconut milk aroma, featuring silky mushrooms and tender, crunchy bamboo shoots that make every sip smooth and comforting. Its exotic, elegant atmosphere combined with visually impressive and tasty plant-based dishes make it a popular choice for family gatherings and Instagram-worthy moments.", "name": "Chay Garden - Vegetarian Restaurant \u0026 Coffee", "transport": "Located in a prime area of District 3; take a Grab to the entrance of Alley 52 Vo Van Tan Street and walk right in."}, {"address": "339 Nam Ky Khoi Nghia, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Attached to the famous ancient Vinh Nghiem Pagoda in District 3, this restaurant is renowned for authentic Vietnamese temple vegetarian food. The signature Vegetarian Pho (Ph\u1edf Chay) features a rich, sweet, and comforting broth simmered for hours with roasted mushrooms, radishes, and plant spices. Served with springy rice noodles and fresh herbs, its flavor rivals traditional meat pho. Retaining pure Buddhist vegetarian tradition at reasonable prices, it attracts countless local devotees and travelers seeking authentic flavors.", "name": "Vinh Nghiem Vegetarian Restaurant (Nh\u00e0 H\u00e0ng Chay V\u0129nh Nghi\u00eam)", "transport": "Take bus 04 or 152 to Chua Vinh Nghiem station and walk 1 minute into the pagoda grounds."}, {"address": "155 Nguyen Dinh Chieu, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Specializing in a diverse variety of traditional Vietnamese vegetarian hot pots and specialty snacks. The \u0027Thai Style Spicy \u0026 Sour Vegetarian Hot Pot\u0027 comes highly recommended; the broth combines the tangy, aromatic flavors of lemongrass, kaffir lime leaves, and fresh tomatoes, loaded with fresh mushrooms, seasonal vegetables, and bean products. The frozen tofu absorbs the savory soup and bursts with flavor upon biting, creating an unforgettable experience. Local families adore its warm, minimalist atmosphere and great value portions.", "name": "Bong Sung Vegetarian Food \u0026 Coffee", "transport": "About an 8-minute walk or a 2-minute taxi ride from Turtle Lake (H\u1ed3 Con R\u00f9a) in District 3."}, {"address": "204 Nguyen Dinh Chieu, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Hidden on the second floor of an old apartment building, this hidden-gem vegetarian bistro serves fusion meatless dishes. The \u0027Roti with Hummus and Veggie Curry\u0027 is particularly popular; the highly aromatic curry is rich and smooth, paired with freshly baked flatbread that is crispy outside and soft inside. Its cozy bohemian decor and carefully crafted healthy dishes attract many foreign backpackers and hipster wellness enthusiasts.", "name": "Prem Bistro Vegetarian", "transport": "Located near the War Remnants Museum, about a 5-minute walk from the museum."}, {"address": "291 Dien Bien Phu, Ward 7, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A vegetarian restaurant blending flavors from across Southeast Asia with a remarkably diverse menu. The \u0027Malaysian Satay Fried Noodles\u0027 are a must-try: noodles packed with rich satay and turmeric aroma, stir-fried over high heat for great wok hei, served with crispy fried vegetarian spring rolls and fresh bean sprouts that crunch loudly with delicious flavor. Local office workers and vegetarian lovers appreciate the fast service and bold, flavorful yet non-greasy dish style.", "name": "Mani Vegetarian Restaurant", "transport": "Located on Dien Bien Phu Boulevard; taking a Grab bike or taxi directly there is recommended."}, {"address": "107K Truong Dinh, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Highly praised for refined yet affordable modern Vietnamese home-style vegetarian food. The signature \u0027Edible Flower Fried Spring Rolls\u0027 feature edible flowers and fresh mushrooms wrapped inside a golden, translucent crispy shell that crackles with every bite, revealing a juicy sweet filling served with a tangy homemade passionfruit dip. Its clean, bright modern decor and creatively crafted plant-based dishes allow tourists to easily experience the freshness and elegance of modern Vietnamese vegetarian cuisine.", "name": "Ba Xa Vegetarian Restaurant (Nh\u00e0 H\u00e0ng Chay B\u00e0 X\u00e3)", "transport": "About a 6-minute walk from Tao Dan Park."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "53 Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u, Ward 6, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A historic street breakfast spot founded in 1958, it is recognized as one of the birthplaces of Vietnamese skillet baguette (B\u00e1nh M\u00ec Ch\u1ea3o). The baguette is toasted to ultimate crispiness on the outside, served alongside a piping-hot skillet of fried eggs, homemade meat patties, sausage, and savory pork liver p\u00e2t\u00e9. Crispy on the outside, soft on the inside, and rich with savory flavor, taking a bite dipped in the runny egg yolk and signature sauce offers delicious, irresistible layers. Locals and international foodies alike love sitting on low plastic stools in the alleyway to savor this classic treat filled with colonial history.", "name": "H\u00f2a M\u00e3 Skillet Baguette (B\u00e1nh M\u00ec H\u00f2a M\u00e3)", "transport": "Take a Grab ride to the corner of Nguy\u1ec5n \u0110\u00ecnh Chi\u1ec3u and M\u1ea1c \u0110\u0129nh Chi, then walk for about 1 minute."}, {"address": "38 Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Located on the famous Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n food street in District 3, this is Ho Chi Minh City\u0027s most iconic Vietnamese mixed rice paper stall. Every bite of chewy, shredded rice paper is packed with beef jerky, quail eggs, shredded green mango, fried peanuts, and fresh herbs, tossed in a tangy, spicy, savory signature sauce and calamansi juice. It is delightfully chewy, refreshing, and incredibly flavorful. Always bustling with young locals and curious travelers, it\u0027s a top landmark for experiencing vibrant street snack culture.", "name": "Uncle Vi\u00ean\u0027s Special Rice Paper Mix (B\u00e1nh Tr\u00e1ng Tr\u1ed9n Ch\u00fa Vi\u00ean)", "transport": "Take a Grab to Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n Street and walk into the food street to queue up."}, {"address": "16C K\u1ef3 \u0110\u1ed3ng, Ward 9, District 3, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A legendary dessert shop with over 40 years of history, specializing in various traditional Vietnamese sweet soups (Ch\u00e8). The signature mixed Ch\u00e8 features mung bean paste, red beans, coconut jelly, sweet jackfruit, and rich coconut milk served over crushed ice. Smooth and creamy in texture, with chewy jackfruit and refreshing shaved ice, it provides the ultimate heat relief. Sweet without being heavy, it is beloved by local families and tourists alike\u2014a perfect cool stop after strolling through District 3.", "name": "K\u1ef3 \u0110\u1ed3ng Traditional Sweet Soup (Ch\u00e8 K\u1ef3 \u0110\u1ed3ng)", "transport": "About a 10-minute walk from Saigon Railway Station, or take a Grab directly to K\u1ef3 \u0110\u1ed3ng Street."}, {"address": "519 Nguy\u1ec5n Th\u1ecb Minh Khai, Ward 2, District 3, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A popular roadside stall with constant queues, famous for its hearty, ingredient-packed crab soup. Thickened to perfection, every comforting spoonful is loaded with tender crab meat, shiitake mushrooms, century egg, and quail eggs. The smooth, velvety broth melts on your tongue, elevated by fresh cilantro and pepper. Offering amazing flavor and great value, the stall is perpetually crowded with dine-in and takeout patrons during afternoon tea and late-night hours.", "name": "H\u1ea1nh Rich Crab Soup (S\u00fap Cua H\u1ea1nh)", "transport": "Take bus #150 to the Nguy\u1ec5n Th\u1ecb Minh Khai stop and walk for about 2 minutes."}, {"address": "H\u1ebbm 212 Nguy\u1ec5n Thi\u1ec7n Thu\u1eadt, Ward 3, District 3, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | A delicious traditional street food hidden in the alleys of the bustling B\u00e0n C\u1edd Market (Ch\u1ee3 B\u00e0n C\u1edd). Originating from the Mekong Delta, this fried shrimp cake blends batter, whole mung beans, and fresh whole shrimp, fried to a golden crunch. It snaps crisply on the outside while remaining soft and moist inside with juicy shrimp. Enjoy it wrapped in fresh lettuce and aromatic herbs dipped in sweet-and-sour fish sauce\u2014crispy, light, and never greasy, making it an unmissable market delicacy.", "name": "Aunt Ho\u00e0ng\u0027s Fried Shrimp Cake - B\u00e0n C\u1edd Market (B\u00e1nh C\u1ed1ng C\u00f4 Ho\u00e0ng - Ch\u1ee3 B\u00e0n C\u1edd)", "transport": "Take a Grab to the entrance of Ch\u1ee3 B\u00e0n C\u1edd (B\u00e0n C\u1edd Market) and walk into the alley food stall section."}, {"address": "56 Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n, Ward 5, District 3, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Known as \u0027Vietnamese Pizza\u0027, this is a classic street food snack enjoyed by day and night. Paper-thin rice paper is grilled over hot coals, cracked with a quail egg, and topped with scallions, pork floss, sausage slices, and cheese until crisp and lightly charred at the edges. Crunchy and hot, it features a rich, savory-sweet filling with a subtle smoky aroma. Served piping hot, it is a hugely popular hand-held treat enjoyed while exploring District 3\u0027s vibrant food street.", "name": "Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n Grilled \u0110\u00e0 L\u1ea1t Rice Paper (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng \u0110\u00e0 L\u1ea1t - Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n)", "transport": "Take a Grab to the Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n Street food area, where you can easily find the live grilling stalls on foot."}, {"address": "122 Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n, Ward 4, District 3, Ho Chi Minh City", "feature": "\u2b50 4.0 stars | An affordable street spot to experience Ho Chi Minh City\u0027s iconic late-night snail culture (\u0027\u0102n \u1ed0c\u0027). The stall offers fresh, made-to-order sea snails cooked in mouthwatering styles such as sizzling scallion oil, chili lemongrass, or rich salted egg yolk butter. The snail meat is tender and delightfully springy; dipped in spicy calamansi salt and pepper, it is bursting with flavor and pairs amazingly with an ice-cold beer. It is immensely popular with local night owls and travelers seeking authentic nightlife.", "name": "Li\u1ec5u Spicy Stir-Fried Snails (\u1ed0c Li\u1ec5u - Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n)", "transport": "Take a Grab motorbike or taxi to Nguy\u1ec5n Th\u01b0\u1ee3ng Hi\u1ec1n Street and walk to the stall."}, {"address": "444 L\u00ea V\u0103n S\u1ef9, Ward 14, District 3, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | A long-standing eatery specializing in Southern Vietnam\u0027s iconic fermented fish noodle soup (B\u00fan M\u1eafm). The broth is slow-cooked from rich fermented fish paste, creating a deeply savory, umami-filled flavor with subtle sweetness. Generously topped with crispy roasted pork belly, fresh shrimp, squid, and eggplant, the soft rice noodles absorb the rich soup. Served with a heap of fresh wild greens and bitter melon slices, it offers complex, bold Southeast Asian flavors that true foodies will adore.", "name": "No. 444 Fermented Fish Noodle Soup (B\u00fan M\u1eafm 444)", "transport": "Take bus #28 to the L\u00ea V\u0103n S\u1ef9 stop, or take a Grab directly to the restaurant entrance."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "District 3 - Colonial Architecture and Pink Church Cultural Area"}, "district_5_cholon": {"categories": {"cat_1": {"items": [{"address": "415 Nguy\u1ec5n Tr\u00e3i, Ward 7, District 5, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Located in District 5, Ph\u1edf L\u1ec7 is an iconic, time-honored Vietnamese noodle shop highly favored by local Chinese residents and foreign tourists alike. The broth is slow-simmered for hours with beef bones and secret herbs, yielding a rich, sweet flavor with a deep beefy aroma. The signature combination beef ph\u1edf features tender rare beef slices, flavorful braised beef shank, and bouncy beef balls. The noodles absorb the savory broth, delivering rich layers of texture in every bite. Paired with fresh basil, cilantro, and a squeeze of fresh lime juice, it cuts through the richness and enhances the flavor, leaving an unforgettable aftertaste.", "name": "Ph\u1edf L\u1ec7", "transport": "Take a Grab or taxi; it is near the District 5 Cultural Center, about a 3-minute walk away."}, {"address": "301 Nguy\u1ec5n Tr\u00e3i, Ward 7, District 5, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Established decades ago, C\u01a1m G\u00e0 \u0110\u00f4ng Nguy\u00ean is an unmissable traditional Cantonese restaurant in the Ch\u1ee3 L\u1edbn Chinatown area. The poached chicken here is of top quality\u2014smooth skin, tender meat, and savory chicken jelly, making every bite sweet, juicy, and never dry. The rice absorbs the essence of chicken fat and broth, glowing with an appetizing golden hue and boasting perfectly distinct, chewy grains. Dipped in the signature ginger oil and sweet soy sauce, the aromas explode in your mouth, attracting countless foodies to this charmingly nostalgic classic eatery.", "name": "C\u01a1m G\u00e0 \u0110\u00f4ng Nguy\u00ean (\u0110\u00f4ng Nguy\u00ean Chicken Rice)", "transport": "Take a 5-minute Grab ride from An \u0110\u00f4ng Market, or take a pleasant stroll down Nguy\u1ec5n Tr\u00e3i Street to reach it."}, {"address": "213 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, Ward 9, District 5, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Located at a busy intersection in District 5, C\u1ea3 C\u1ea7n is a local institution with over half a century of history. It is best known for its signature dry hu tieu (rice noodles), tossed in a special sweet and spicy sauce that coats the chewy noodles perfectly, served with huge house-made meatballs and fresh shrimp. Additionally, their giant steamed Cantonese-style pork buns are wildly popular, featuring a fluffy, slightly sweet dough filled with quail eggs, mushrooms, and juicy minced meat\u2014bursting with savory broth in every bite. It is a timeless comfort food beloved by generations of locals.", "name": "Qu\u00e1n \u0102n C\u1ea3 C\u1ea7n (C\u1ea3 C\u1ea7n Pork Buns \u0026 Dry Noodles)", "transport": "Located at the intersection of Nguy\u1ec5n Tri Ph\u01b0\u01a1ng and H\u00f9ng V\u01b0\u01a1ng. You can also take a bus and get off at the 213 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng stop."}, {"address": "99 Ch\u00e2u V\u0103n Li\u00eam, Ward 14, District 5, Ho Chi Minh City", "feature": "\u2b50 4.0 stars | D\u00e2n \u00cdch is a unique Chinese hotpot restaurant in Ch\u1ee3 L\u1edbn that preserves authentic old-school flavors, still using traditional chimney copper pots heated by real wood charcoal. The signature fish hotpot broth is simmered for hours with pork bones and seafood, creating a rich, mellow flavor. It comes with generous ingredients, including thick slices of fresh fish, handmade shrimp balls, squid, pork skin, and fresh seasonal vegetables. The tender fish, springy meatballs, and special satay dipping sauce offer a nostalgia-filled dining experience\u2014making it a top choice for family gatherings and cultural immersion.", "name": "L\u1ea9u C\u00e1 D\u00e2n \u00cdch (D\u00e2n \u00cdch Charcoal Fish Hotpot)", "transport": "Located only about 400 meters from Ch\u00f9a \u00d4n L\u0103ng (On Lang Pagoda), a 5-minute walk away."}, {"address": "138 Ch\u00e2u V\u0103n Li\u00eam, Ward 11, District 5, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Situated in the heart of Chinatown, H\u00e0 K\u00fd is a famous dessert shop that has carried on traditional Cantonese flavors for decades. Offering dozens of hot and cold traditional sweet soups, its most popular item is the steamed milk pudding\u2014silky, smooth, and melting in your mouth with rich milky flavor. The black sesame soup and walnut soup are aromatic, velvety, and balanced in sweetness, ground down to ultimate smoothness. Herbal options like quail egg with lotus seeds or double-boiled duck soups are also available, making this the perfect refreshing stop after exploring Ch\u1ee3 L\u1edbn.", "name": "Ti\u1ec7m Ch\u00e8 H\u00e0 K\u00fd (H\u00e0 K\u00fd Chinese Desserts)", "transport": "Located along Ch\u00e2u V\u0103n Li\u00eam Boulevard; take a Grab and drop off directly at 138 Ch\u00e2u V\u0103n Li\u00eam."}, {"address": "357 Nguy\u1ec5n Tr\u00e3i, Ward 7, District 5, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | M\u00ec V\u1ecbt Ti\u1ec1m H\u1ea3i S\u01b0 is a renowned Chinese herbal braised duck noodle shop in District 5, famous for its signature duck leg noodles. The whole duck leg is deep-fried then slow-braised, achieving a crispy skin and fall-off-the-bone tenderness without any gamey taste. The broth, simmered with over a dozen Chinese medicinal herbs, is delightfully sweet and warming. Paired with chewy handmade egg noodles, this dish offers rich textures and flavors that draw food lovers from all over.", "name": "M\u00ec V\u1ecbt Ti\u1ec1m H\u1ea3i S\u01b0 (H\u1ea3i S\u01b0 Braised Duck Noodle Soup)", "transport": "Go straight along the main street of Nguy\u1ec5n Tr\u00e3i; take a taxi or Grab and get off near the intersection of Nguy\u1ec5n Tr\u00e3i and Hu\u1ef3nh M\u1eabn \u0110\u1ea1t."}, {"address": "218 Tri\u1ec7u Quang Ph\u1ee5c, Ward 11, District 5, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | Passed down through generations by Teochew Chinese in Ch\u1ee3 L\u1edbn, Qu\u1ea3ng Tr\u00ed serves a unique satay noodle soup distinct from Taiwanese or Hong Kong styles. The soup boasts a rich blend of peanuts, coconut milk, and aromatic spices. The thick, savory satay broth coats the rice noodles beautifully. Served with tender poached beef or venison slices, fresh cucumber, tomato, and Thai basil, it offers a zesty, rich, and slightly spicy flavor profile\u2014a hidden culinary gem highly praised by locals.", "name": "H\u1ee7 Ti\u1ebfu Sa T\u1ebf Qu\u1ea3ng Tr\u00ed (Qu\u1ea3ng Tr\u00ed Satay Noodle Soup)", "transport": "Located in the historic Tri\u1ec7u Quang Ph\u1ee5c street, just a 3-minute walk from Ch\u00f9a \u00d4ng (Guan Di Temple)."}, {"address": "78 Nguy\u1ec5n Tr\u00e3i, Ward 3, District 5, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | Originating in District 5, Th\u1ecd Ph\u00e1t is the flagship store of a traditional Chinese pastry brand that has taken Vietnam by storm. The signature large steamed bun features thin dough and generous filling; the dough is traditionally fermented, yielding a fluffy, pillowy chew with subtle wheat aromas. The savory filling is packed with mushrooms, pork, quail eggs, and salted egg yolk, bursting with juicy flavor in every warm bite. They also offer BBQ pork buns, custard buns, and Cantonese siu mai, drawing endless streams of takeout customers and standing as an icon of Ch\u1ee3 L\u1edbn\u0027s traditional bun-making craft.", "name": "B\u00e1nh Bao Th\u1ecd Ph\u00e1t (Th\u1ecd Ph\u00e1t Dim Sum \u0026 Steamed Buns)", "transport": "Located at the beginning of Nguy\u1ec5n Tr\u00e3i Street near the border of District 1 and District 5, making it easily accessible via Grab."}], "name": "Famous Traditional Local Eateries"}, "cat_2": {"items": [{"address": "Phung Hung Market, Ward 14, District 5, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | Tucked inside Phung Hung Market in District 5, this 70-year-old traditional cloth-filter coffee spot is the ultimate icon of Cholon\u0027s Chinese coffee culture. The owner insists on roasting coffee beans over traditional charcoal with a touch of butter and salt, slow-filtering the brew through a long cloth net. Every sip offers a rich, bittersweet aromatic coffee with subtle notes of caramelized butter and a velvety texture. Paired with condensed milk, it\u0027s pleasantly sweet without being cloying\u2014a beloved staple for longtime neighborhood locals and vintage flavor hunters alike.", "name": "Ba L\u00f9 Net Drip Coffee (C\u00e0 Ph\u00ea V\u1ee3t Ba L\u00f9)", "transport": "It is recommended to take a Grab or taxi to the entrance of Phung Hung Market (Ch\u1ee3 Ph\u00f9ng H\u01b0ng) and walk into the market alleyways."}, {"address": "118/1D Nguyen Trai, Ward 3, District 5, Ho Chi Minh City", "feature": "\u2b50 4.4 stars | Inspired by bird nests and sweeping curves, this Instagrammable minimalist cafe is tucked away in a quiet alley in District 5. The warm cream-white and earthy tones create a richly layered ambiance. They serve top-tier pour-over coffee, specialty sparkling drinks, freshly baked gourmet desserts, and brunch platters. The toast is crispy outside and soft inside, loaded with savory cheese and smoked chicken that bursts with savory flavor\u2014a relaxing sanctuary perfect for young travelers and aesthetics-lovers to snap photos.", "name": "September Cafe \u0026 Cake", "transport": "Take a Grab to the entrance of Lane 118, Nguyen Trai Street; it\u0027s about a 1-minute walk inside."}, {"address": "57 Chau Van Liem, Ward 14, District 5, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | One of Vietnam\u0027s hottest specialty coffee chains in recent years, this District 5 location on Chau Van Liem Boulevard blends modern vintage greenery aesthetics with Cholon\u0027s vibrant streetscape. The signature Egg Coffee (C\u00e0 Ph\u00ea Tr\u1ee9ng) features a dense, silky whipped egg yolk mousse that melts in your mouth like sweet custard cream without any fishy smell, creating a marvelous contrast with the bold, bittersweet Vietnamese Robusta coffee below. Highly popular among youth and international tourists.", "name": "Katinat Saigon Kafe - Chau Van Liem Branch (Katinat Saigon Kafe Ch\u00e2u V\u0103n Li\u00eam)", "transport": "Take Bus No. 56 to Chau Van Liem Stop and walk for about 2 minutes, or take a Grab directly."}, {"address": "188 Chau Van Liem, Ward 11, District 5, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A historic and iconic tea and coffee powerhouse in Vietnam, this spacious and bright branch is set in District 5\u0027s old heritage neighborhood. Beyond classic highland black coffee, their milk teas and fruit teas are second to none. The signature Peach Black Tea boasts a deeply fragrant tea base paired with sweet fruity aromas and crunchy peach slices; the milk tea is bold in tea strength, smooth, and perfectly balanced in bittersweet notes\u2014the ultimate refreshing thirst-quencher after exploring District 5\u0027s markets on a hot summer day.", "name": "Ph\u00fac Long Coffee \u0026 Tea - Chau Van Liem Branch (Ph\u00fac Long Coffee \u0026 Tea Ch\u00e2u V\u0103n Li\u00eam)", "transport": "Take a Grab or bus to the intersection of Chau Van Liem and Hong Bang, then walk for 1 minute."}, {"address": "75 Nguyen Trai, Ward 2, District 5, Ho Chi Minh City", "feature": "\u2b50 4.2 stars | A cozy, stylish cafe located in District 5\u0027s bustling commercial district. Lush green plants and a peaceful ambiance make it an ideal spot for a leisurely brunch. The menu highlights signature cold brews and handmade European brunch bread platters. Their specialty Salted Cream Coffee (C\u00e0 Ph\u00ea Mu\u1ed1i) tops rich black coffee with a savory-sweet creamy foam\u2014delivering a smooth, salty-sweet sip followed by deep, aromatic coffee bitterness. The rich complexity makes it a hit with local office workers and hipsters.", "name": "M\u1ea1ch Coffee \u0026 Tea", "transport": "It takes about 10 minutes by Grab from Pham Ngu Lao Street to Nguyen Trai Street."}, {"address": "322-324 Huynh Man Dat, Ward 4, District 5, Ho Chi Minh City", "feature": "\u2b50 4.5 stars | This independent cafe on Huynh Man Dat Street in District 5 is widely praised for its sleek modern design and warm, friendly service. Their light brunch menu features made-to-order dishes like freshly grilled panini sandwiches and avocado toast, featuring crisp exteriors, soft interiors, and fresh ingredients. Paired with a freshly ground caffe latte with silky smooth foam and a gentle, aromatic coffee finish, it\u2019s an ideal hangout to experience Saigon\u0027s relaxed local pace of life.", "name": "Lucid Coffee \u0026 Tea", "transport": "Take a Grab to Huynh Man Dat Street; it is located near the border of District 5 and District 1."}, {"address": "147 Nguyen Trai, Ward 2, District 5, Ho Chi Minh City", "feature": "\u2b50 4.1 stars | Brimming with rustic nostalgic charm, this cafe incorporates traditional Vietnamese wooden furniture and vintage trinkets into its space, echoing the deep history of District 5\u0027s Cholon area. The signature Iced Coconut Milk Coffee (C\u00e0 Ph\u00ea D\u1eeba) is a massive favorite\u2014blending creamy, icy coconut slush with bittersweet coffee into a refreshing dessert-like treat that is pleasantly sweet. It\u0027s an insider spot for travelers looking to sample unique Vietnamese coffee creations.", "name": "An C\u00e0 Ph\u00ea - Nguyen Trai Branch (An C\u00e0 Ph\u00ea Nguy\u1ec5n Tr\u00e3i)", "transport": "Easily accessible by taking a Grab motorbike or taxi to 147 Nguyen Trai Street."}, {"address": "683 Nguyen Trai, Ward 11, District 5, Ho Chi Minh City", "feature": "\u2b50 4.3 stars | A large branch of Vietnam\u0027s leading coffee chain situated in District 5\u0027s Chinatown, offering spacious, cozy seating and a rich selection of food and drinks. Their brunch line-up includes crispy, richly filled B\u00e1nh M\u00ec sandwiches and toasted cheese croissants. Pair your meal with the signature Lemongrass Orange Cold Brew (Cold Brew Cam S\u1ea3), featuring vibrant citrus and lemongrass notes that are delightfully tart, sweet, and palate-cleansing\u2014perfect for enjoying a hearty morning meal.", "name": "The Coffee House - 683 Nguyen Trai Branch (The Coffee House 683 Nguy\u1ec5n Tr\u00e3i)", "transport": "Take Bus No. 06 or 56 to Nguyen Trai Station and walk for 2 minutes, or take a Grab directly."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "89 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 2, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | Founded in 1945, this iconic Cantonese eatery in Cholon is legendary for its refined Cantonese poached chicken and Hainanese chicken rice. The chicken features golden, springy skin with tender, juicy meat subtly infused with herbal aromas, paired with fragrant golden rice cooked in chicken fat and broth. The house-made ginger paste and dark soy sauce add the perfect finishing touch, attracting countless foodies and international tourists seeking traditional retro Chinese flavors.", "name": "Dong Nguyen Chicken Rice (C\u01a1m G\u00e0 \u0110\u00f4ng Nguy\u00ean)", "transport": "Take bus 01, 06, or 56 to Nguy\u1ec5n Tr\u00e3i Station, then walk about 2 minutes."}, {"address": "99 Ch\u00e2u V\u0103n Li\u00eam, Ph\u01b0\u1eddng 14, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 Stars | Located in the heart of District 5, this old-school Teochew restaurant has operated for over 40 years. It is best known for its traditional chimney charcoal hotpot. The signature squid, fish ball, and fish head hotpot broth is sweet and refreshing with a subtle smoky aroma; the handmade fish balls are springy and crisp, while fresh fish pieces soak up the rich essence of the broth. Filled with a nostalgic old-time Chinese diner vibe, it\u0027s a top local pick for evening beer gatherings with family and friends.", "name": "Dan Ich Charcoal Fish Hotpot (L\u1ea9u C\u00e1 D\u00e2n \u00cdch)", "transport": "Take bus 07 or 56 to Ch\u00e2u V\u0103n Li\u00eam Station, then walk about 3 minutes."}, {"address": "18 Ch\u00e2u V\u0103n Li\u00eam, Ph\u01b0\u1eddng 10, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 Stars | One of Cholon\u0027s most iconic Hong Kong-style dim sum and traditional breakfast spots, steaming every dish fresh to order for decades. The steaming Ha Gow (shrimp dumplings) feature translucent skin packed with sweet, crunchy whole shrimp; the pork and crab roe Siu Mai is juicy and savory, while the Xiao Long Bao is bursting with flavorful soup. Paired with a hot pot of Chrysanthemum Pu-erh tea, it offers an authentic morning tea culture beloved by local neighbors and global food connoisseurs alike.", "name": "Tien Phat Dim Sum (Ti\u1ebfn Ph\u00e1t Dim Sum)", "transport": "Take bus 01 or 56 to the H\u1ed3ng B\u00e0ng - Ch\u00e2u V\u0103n Li\u00eam intersection, then walk about 4 minutes."}, {"address": "274 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ph\u01b0\u1eddng 11, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 Stars | A classic refined Chinese regional cuisine restaurant that flawlessly merges traditional Cantonese culinary skills with fresh local Vietnamese ingredients. The signature Crispy Roasted Chicken features glass-like crispy skin while remaining succulently tender inside; the steamed grouper showcases exquisite heat control, offering sweet and delicate flesh. Offering a rich variety of Chinese delicacies paired with fine drinks, it\u0027s an excellent choice for experiencing Cholon\u0027s vibrant dining and wine culture.", "name": "Tan Nha Restaurant (Nh\u00e0 H\u00e0ng T\u00e2n Nh\u00e3)", "transport": "Take bus 01 or 139 to Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Station, then walk about 1 minute."}, {"address": "213 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, Ph\u01b0\u1eddng 9, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | Located at a bustling intersection in District 5, this renowned eatery has passed down its secret dark-sauce dry Hu Tieu noodles for half a century. Chewy, translucent rice noodles are tossed in a rich, sweet, and savory signature sauce, accompanied by tender pork ribs, fresh meat slices, and specialty shrimp balls for a multi-layered flavor profile. Served with a bowl of sweet, rich broth, its comforting traditional taste makes it a prime late-night dining spot for locals and tourists.", "name": "Ca Can Dry Noodles (H\u1ee7 Ti\u1ebfu C\u1ea3 C\u1ea7n)", "transport": "Take bus 14 or 27 to Nguy\u1ec5n Tri Ph\u01b0\u01a1ng Station, then walk about 2 minutes."}, {"address": "418 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ph\u01b0\u1eddng 11, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 Stars | As one of Cholon\u0027s oldest grand Chinese banquet restaurants, it exudes nostalgic 1980s luxury dining charm. Specializing in authentic Cantonese and Teochew feasts, its signature crispy suckling pig features crackling skin brimming with savory aroma, while the roasted duck offers crisp skin and tender meat infused with herbal notes. Its vintage atmosphere makes it ideal for large family gatherings and enjoying classic heritage dishes.", "name": "Ai Hue Restaurant (Nh\u00e0 H\u00e0ng \u00c1i Hu\u00ea)", "transport": "Take bus 01, 06, or 56 to the Tr\u1ea7n H\u01b0ng \u0110\u1ea1o - H\u1ea3i Th\u01b0\u1ee3ng L\u00e3n \u00d4ng Station, then walk about 2 minutes."}, {"address": "18 An D\u01b0\u01a1ng V\u01b0\u01a1ng, Ph\u01b0\u1eddng 9, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 Stars | Situated inside the Windsor Plaza Hotel, this award-winning fine Cantonese restaurant and bistro offers exquisite Hong Kong-style dim sum and high-end Cantonese stir-fries. Highlights include signature roasted duck and braised fish maw in abalone sauce, crafted with premium ingredients and elegant presentation. Featuring sommelier-recommended wines and premium Chinese teas in an upscale ambiance, it is District 5\u0027s premier destination for fine Chinese dining and pairing.", "name": "Ngan Dinh Restaurant - Windsor Plaza", "transport": "Take a Grab or taxi directly to the 5th floor of Windsor Plaza Hotel."}, {"address": "132 L\u00ea H\u1ed3ng Phong, Ph\u01b0\u1eddng 3, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 Stars | A hugely popular goat specialty bistro in District 5 serving dishes that fuse Vietnamese and Chinese culinary traditions. The signature herbal goat hotpot is slow-simmered with over ten Chinese medicinal herbs, resulting in a rich, savory broth without any gamey odor. Tender skin-on, bone-in goat meat is stewed to perfection and served with fermented bean curd dip. Paired with ice-cold Vietnamese beer, it is an incredible spot to experience Ho Chi Minh City\u0027s local nightlife and authentic regional food.", "name": "Bau Sen Goat Hotpot (Qu\u00e1n L\u1ea9u D\u00ea B\u00e0u Sen)", "transport": "Take bus 11 or 139 to L\u00ea H\u1ed3ng Phong Station, then walk about 3 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "742 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 11, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 stars | A classic Chinese vegetarian restaurant located in the heart of Cho Lon (Chinatown), famous for authentic Cantonese and Teochew vegetarian cuisine. The signature Eight-Treasure Soup has a rich, velvety broth loaded with intricately carved vegetarian abalone, shiitake mushrooms, and shredded bamboo shoots, offering rich layers of texture. The vegetarian steamed dumplings feature thin skins wrapped around generous fillings, bursting with the sweet juices of fresh vegetables and sesame oil in every bite. Committed to avoiding excessive artificial additives, it is beloved by local senior Chinese residents and health-conscious foreign travelers.", "name": "Bat Buu Vegetarian Restaurant (Nh\u00e0 H\u00e0ng Chay B\u00e1t B\u1eedu)", "transport": "Take a Grab or Bus No. 56 to Nguy\u1ec5n Tr\u00e3i Station, then walk for about 3 minutes."}, {"address": "155 B\u00f9i H\u1eefu Ngh\u0129a, Ph\u01b0\u1eddng 7, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | Boasting classic, elegant decor and a peaceful ambiance, this restaurant seamlessly blends local Vietnamese ingredients with traditional Chinese vegetarian cooking. Highly recommended is their \u0027Vegetarian Roast Duck\u0027\u2014crispy and golden-brown on the outside with a satisfyingly chewy filling inside, served with custom sweet bean sauce and crisp cucumbers, making it remarkably close to the real thing. Another signature dish, \u0027Stir-fried Tofu with Lemongrass,\u0027 is infused with aromatic local herbs, crispy on the outside and tender inside, making it a top choice for local family gatherings.", "name": "Cat Tuong Vegetarian Restaurant (Nh\u00e0 H\u00e0ng Chay C\u00e1t T\u01b0\u1eddng)", "transport": "Take Bus No. 1 or No. 56 to B\u00f9i H\u1eefu Ngh\u0129a Station, then walk for about 2 minutes."}, {"address": "331 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 7, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | Hidden in a bustling corner of Nguy\u1ec5n Tr\u00e3i Street, this affordable little shop attracts large crowds with its budget-friendly and diverse vegetarian buffet (C\u01a1m Chay). The vegetarian Pho (Ph\u1edf Chay) broth is simmered with generous amounts of radishes, shiitake mushrooms, and sugarcane, resulting in a naturally sweet and refreshing taste. The vegetarian spring rolls are stuffed with taro and wood ear mushrooms, fried to a crisp perfection that crunches delightfully with every bite. Tourists can experience the most authentic street-level vegetarian culture of Cho Lon here.", "name": "Phuong Hoang Vegetarian Eatery (Qu\u00e1n Chay Ph\u01b0\u1ee3ng Ho\u00e0ng)", "transport": "Take a Grab car from An \u0110\u00f4ng Market; it takes about 5 minutes to arrive."}, {"address": "355 V\u00f5 V\u0103n Ki\u1ec7t, Ph\u01b0\u1eddng 1, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 stars | Focusing on mindful eating and macrobiotic brown rice cuisine (Th\u1ef1c d\u01b0\u1ee1ng Macrobiotic), this is a unique healthy vegetarian space in District 5. The restaurant uses organic brown rice to craft creative main dishes, with special recommendations including the \u0027Brown Rice Veggie Sushi\u0027 and \u0027Brown Rice Pancake\u0027. The rice grains are delightfully chewy and burst with natural grain aromas. Paired with house-made MSG-free vegetable broth, the meal is refreshing and light, making it exceptionally popular among young adults and health-conscious foodies.", "name": "Khai Minh Organic Vegetarian Restaurant (Qu\u00e1n Chay Kh\u1ea3i Minh)", "transport": "Take a Grab along V\u00f5 V\u0103n Ki\u1ec7t Riverside Boulevard and get off at door number 355."}, {"address": "243 Hu\u1ef3nh M\u1eabn \u0110\u1ea1t, Ph\u01b0\u1eddng 4, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 stars | Tuong Van is a daily favorite among many District 5 locals, specializing in affordable, generous portions of vegetarian dim sum and self-serve fast meals. A must-order is the \u0027Vegetarian Beef Stew Noodles (H\u1ee7 Ti\u1ebfu B\u00f2 Kho Chay)\u0027, which features a rich, thick red broth simmered with natural daikon, carrots, and spices. Paired with tender, chewy plant-based meat chunks and silky noodles that soak up the flavorful broth, every bite offers a marvelous blend of spice and sweet undertones.", "name": "Tuong Van Vegetarian Restaurant (C\u01a1m Chay T\u01b0\u1eddng V\u00e2n)", "transport": "Walk for about 8 minutes from the Cambodian Market (Ch\u1ee3 Campuchia) in District 5, or take a Grab motorbike."}, {"address": "70 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o B, Ph\u01b0\u1eddng 7, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 stars | A traditional vegetarian eatery deeply rooted in Cho Lon\u0027s Chinatown for years, radiating a warm, homey feel. Applying Cantonese roast meat techniques to vegetarian dishes, their \u0027Vegetarian Char Siu Rice\u0027 features slightly charred pieces glistening with sweet honey glaze that are juicy and satisfying to bite into. Served over rice drizzled with shiitake mushroom gravy and accompanied by sweet-and-sour pickles, the flavor is spectacular. Their vegetarian hot and sour soup is also incredible\u2014appetizingly tangy, with wood ear fungus and shredded tofu creating a rich texture.", "name": "Huu Duyen Vegetarian Eatery (Qu\u00e1n Chay H\u1eefu Duy\u00ean)", "transport": "Take Bus No. 1 or No. 68 to Tr\u1ea7n H\u01b0ng \u0110\u1ea1o B Station, then walk for about 1 minute."}, {"address": "110 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, Ph\u01b0\u1eddng 7, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.1 stars | Thien Truc Vegetarian is renowned for its fresh local Vietnamese wild greens and exquisite vegetarian hot pots. The popular \u0027Fresh Mushroom \u0026 Bamboo Shoot Hot Pot\u0027 features a golden, crystal-clear broth infused with various fresh mushrooms, bamboo shoots, and herbal spices. Simmered with tender fresh tofu and bouncy vegetarian meatballs, it glides smoothly down the throat with a hint of natural sweetness. The homemade lemongrass dipping sauce adds a perfect finishing touch, elevating the fresh ingredients with a zesty, layered citrus tang.", "name": "Thien Truc Vegetarian Eatery (Qu\u00e1n Chay Thi\u00ean Tr\u00fac)", "transport": "Located on the main thoroughfare of Nguy\u1ec5n Tri Ph\u01b0\u01a1ng; take Bus No. 56 to Nguy\u1ec5n Tri Ph\u01b0\u01a1ng Station and arrive immediately."}, {"address": "213 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 2, Qu\u1eadn 5, Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.0 stars | A hidden gem tucked away in an alley off Nguy\u1ec5n Tr\u00e3i Street, offering a variety of classic Vietnamese vegetarian snacks and freshly stir-fried dishes. The signature \u0027Vegetarian B\u00e1nh X\u00e8o (B\u00e1nh X\u00e8o Chay)\u0027 features a golden-brown crust fried paper-thin and crispy, stuffed generously with mung bean sprouts, shiitake mushrooms, and pressed tofu. Dipped in house-made coconut-water vegan fish sauce, it is deliciously savory, tangy, sweet, and immensely crispy. The wallet-friendly prices attract countless foodies.", "name": "Dieu Hanh Vegetarian Eatery (C\u01a1m Chay Di\u1ec7u H\u1ea1nh)", "transport": "Take a Grab ride from Ben Thanh Market; it takes about 10 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "476 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ph\u01b0\u1eddng 2, Qu\u1eadn 5, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.2 Stars | Tucked away in a Ch\u1ee3 L\u1edbn alleyway, this decades-old traditional Cantonese dessert shop earned its nickname from the prominent electric pole standing next to its original stall. It offers over twenty traditional Hong Kong and Teochew sweet soups (Ch\u00e8), such as lily bulb lotus seed soup, almond tofu, steamed egg custard, and mistletoe tea with egg. Smooth, pleasantly sweet, and light, the highlights include melt-in-your-mouth lotus seeds and silky-soft egg custard bursting with rich egg and milky aromas. It\u0027s a top pick for tourists soaking in night-time nostalgia or locals looking for a late-night sweet treat.", "name": "Electric Pole Sweet Soup (Ch\u00e8 Nh\u00e0 \u0110\u00e8n - Ch\u00e8 Ch\u00e2u Giang)", "transport": "Take a Grab or Bus 01 or 56 to Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Station, then walk about 2 minutes."}, {"address": "122 Ph\u00f9ng H\u01b0ng, Ph\u01b0\u1eddng 13, Qu\u1eadn 5, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.4 Stars | One of the most iconic traditional street snacks in Ch\u1ee3 L\u1edbn\u0027s Chinatown. Made to order, these chive cakes feature a golden, crispy exterior packed with a generous, flavorful chive filling. Each crunch delivers hot, juicy, and aromatic tender chives. Served fried with a whole beaten egg and drizzled with custom sweet soy sauce, the rich blend of silky and crunchy textures makes it a favorite among foodies and tourists craving bold, savory street flavors.", "name": "Ph\u00f9ng H\u01b0ng Market Chive Cake (B\u00e1nh H\u1eb9 Ph\u00f9ng H\u01b0ng)", "transport": "Located inside Ph\u00f9ng H\u01b0ng Market (Ch\u1ee3 Ph\u00f9ng H\u01b0ng). Taking a Grab to Ph\u00f9ng H\u01b0ng Street and walking in is recommended."}, {"address": "78 Nguy\u1ec5n Tr\u00e3i, Ph\u01b0\u1eddng 3, Qu\u1eadn 5, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.3 Stars | Located in a bustling district of District 5, Th\u1ecd Ph\u00e1t is Ho Chi Minh City\u0027s most famous flagship store for steamed delicacies. Their signature big pork bun features a soft, pillowy, and bouncy dough stuffed with quail eggs, salted egg yolk, mushrooms, and savory seasoned minced pork\u2014juicy, hearty, and perfectly sweet-and-savory. They also serve Shumai, Xiao Long Bao, and various Chinese dim sum. Its grab-and-go convenience and authentic flavors make it a must-buy street bite for local commuters and travelers alike.", "name": "Th\u1ecd Ph\u00e1t Steamed Buns \u0026 Dim Sum (B\u00e1nh Bao Th\u1ecd Ph\u00e1t)", "transport": "Take a Grab to the intersection of Nguy\u1ec5n Tr\u00e3i and Tr\u1ea7n B\u00ecnh Tr\u1ecdng streets; it\u0027s a short walk from there."}, {"address": "183 B\u00f9i H\u1eefu Ngh\u0129a, Ph\u01b0\u1eddng 5, Qu\u1eadn 5, H\u1ed3 Ch\u00ed Minh", "feature": "\u2b50 4.5 Stars | A well-known offal food stall near H\u00f2a B\u00ecnh Market, famous for its beef offal stewed for hours in a rich coconut milk curry. The tripe, intestines, and lungs are meticulously cleaned without any gamey odor, boasting a delightfully chewy yet tender texture that absorbs the luscious, aromatic curry broth. Dunking a crispy-on-the-outside, soft-on-the-inside Vietnamese baguette into the fragrant sauce creates an addictive layer of flavors that keeps you coming back for more.", "name": "H\u00f2a B\u00ecnh Market Beef Offal Baguette (Ph\u00e1 L\u1ea5u B\u00f2 C\u00f4 L\u1ea5m - Ch\u1ee3 H\u00f2a B\u00ecnh)", "transport": "Take a Grab to next to
