rean specialty store for handmade stuffed donuts, nestled in an alley near Gwangalli Beach. Crispy and golden on the outside, soft and chewy on the inside, these donuts are packed with rich fillings. Signature flavors like Creme Brulee and Yellow Cheese are indulgent yet well-balanced. Pair one with a refreshing Iced Americano for the ultimate sweet treat, or grab a box to enjoy as a beach picnic!", "name": "Cupnut Gwangalli: Handmade Stuffed Doughnuts (\ucef5\ub11b \uad11\uc548\ub9ac\uc810)", "transport": "Busan Metro Line 2, Gwangan Station, Exit 3, about a 9-minute walk."}, {"address": "12 Samickhaebyeon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.2 Stars | Tucked away beside Gwangalli Beach, this multi-concept green garden cafe seamlessly blends natural greenery with vintage artistic decor. The brunch menu centers around exquisite Italian cuisine, including freshly baked thin-crust pizzas topped with fragrant cheese and fresh mushrooms, as well as superb handmade French desserts and specialty coffees. The spacious, comfortable garden courtyard provides a serene and relaxing dining escape right next to the bustling shore.", "name": "La Bella Citta Green Garden Brunch Cafe (\ub77c\ubca8\ub77c\uce58\ud0c0)", "transport": "Busan Metro Line 2, Geumnyeonsan Station, Exit 3, about a 12-minute walk."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "125 Gwangnam-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.6 stars | A famous craft beer gastropub founded in Busan by British brewers, blending American and British brewing techniques with local Korean ingredients. The spacious interior boasts an industrial aesthetic that draws many international tourists and local youth. The signature IPA and stout feature rich, layered flavors with a deep malt aroma and a subtly bitter, fruity finish\u2014pairing perfectly with crispy American-style fried chicken or handcrafted burgers. With its lively evening atmosphere, it\u0027s the ultimate spot to experience Gwangalli\u0027s nightlife and international pub culture.", "name": "Gorilla Brewing Company Gwangan Flagship (\uace0\ub9b4\ub77c\ube0c\ub8e8\uc789)", "transport": "Busan Metro Line 2 Gwangan Station, Exit 3, approx. 7-minute walk"}, {"address": "237 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.4 stars | A Spanish-style bistro located right on the beachfront of Gwangalli, offering front-row, unbeatable views of the Gwangan Bridge. The menu features freshly made Spanish tapas, seafood urchin risotto, and pan-seared seafood platters. The seafood paella is highly recommended\u2014the rice absorbs a rich, flavorful stock, yielding a firm texture packed with sweet ocean flavors. Paired with a curated selection of wines and craft beers, you can savor delicious food while enjoying the glittering night lights of Gwangan Bridge and the sound of crashing waves. Its romantic vibe makes it a favorite among couples and tourists.", "name": "CLAM Gwanganli Ocean View Bistro (CLAM / \ud074\ub7a8 \uad11\uc548\ub9ac\uc810)", "transport": "Busan Metro Line 2 Gwangan Station, Exit 5, approx. 10-minute walk towards the beach"}, {"address": "4F, 153 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.5 stars | Perched on a high floor along the Gwangalli beachfront, this craft beer gastropub commands stunning views overlooking Gwangan Bridge. It specializes in authentic New York-style thin-crust pizza and local Korean craft brews. The pizza crust is crispy on the outside and soft inside with a hint of wood-fired char, generously topped with gooey, savory melted cheese that pairs blissfully with a local Busan craft IPA. Sitting by the window at sunset offers a breathtaking panoramic view of the bridge against the evening sky.", "name": "SOL Taphouse NY Pizza \u0026 Craft Beer (Sol Taphouse / \uc194\ud0ed\ud558\uc6b0\uc2a4)", "transport": "Busan Metro Line 2 Geumnyeonsan Station, Exit 1, approx. 7-minute walk to the beach"}, {"address": "9-32 Gwanganhaebyeon-ro 370beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.5 stars | A legendary spot for Busan\u2019s ultimate soul food, Dwaeji Gukbap (pork rice soup), located near Waterfront Park on the east side of Gwangalli Beach. The rich, milky-white broth is simmered for hours, offering a naturally sweet and savory taste with zero gamey odor. The thick pork slices are incredibly tender and melt in your mouth. Mix in salted shrimp and seasoned chives to elevate the flavor profile instantly. Soaking the fragrant steamed rice into the hearty soup makes every bite irresistible\u2014a iconic local dish you simply cannot miss in Gwangalli.", "name": "Subyeon Best Pork Rice Soup Millak Main Branch (Subyeon Best Pork Backbone Stew / \uc218\ubcc0\ucd5c\uace0\ub3fc\uc9c0\uad6d\ubc25)", "transport": "Busan Metro Line 2 Gwangan Station, transfer to a bus to Millak Waterfront Park, then approx. 3-minute walk"}, {"address": "604 Suyeong-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.3 stars | A must-try local specialty in Busan, Nakgopsae combines sweet octopus, rich beef intestines, and bouncy shrimp stir-fried in a skillet with a signature Korean spicy sauce. As it bubbles, it releases a mouthwatering spicy aroma. The beef intestines are savory and rich, the octopus is tenderly chewy, and the sauce is deep, sweet, and fiery. Ladle the piping-hot stir-fry over white rice, top with plenty of shredded seaweed, and mix well for a rich, satisfying taste explosion with a thrilling spicy kick.", "name": "Kuk-i-ne Nakgopsae Gwangan Branch (\uad6d\uc774\ub124\ub099\uacf1\uc0c8)", "transport": "Busan Metro Line 2 Gwangan Station, Exit 3, approx. 3-minute walk"}, {"address": "197 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.4 stars | A highly popular American-style gastropub situated on the beachfront strip of Gwangalli, featuring semi-open outdoor seating directly facing the dazzling lights of Gwangan Bridge. The bar serves a variety of cocktails, draft beers, and American eats such as fried chicken, cheese platters, and French fries. The Korean-style seasoned fried chicken, with its crispy skin and juicy meat, is a favorite pub snack that goes wonderfully with their custom cocktails. Upbeat music paired with gentle sea breezes makes it an ideal spot to unwind with friends over late-night drinks.", "name": "Happy Monk Gwanganli Ocean View Bar (Happy Monk / \ud574\ud53c\ubabd\ud06c)", "transport": "Busan Metro Line 2 Gwangan Station, Exit 5, approx. 9-minute walk"}, {"address": "13 Gwanganhaebyeon-ro 279beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.7 stars | A legendary, highly acclaimed Japanese tonkatsu gastropub in Busan known for its long waitlists. It uses premium Jirisan black pork, fried using a special charcoal-aging technique. The signature thick-cut pork cutlet is wrapped in an delicate, ultra-crispy breading while the interior remains a tempting juicy pink, bursting with rich juices and subtle smoky charcoal notes at first bite. Enjoyed with truffle salt, fresh wasabi, or house-made tonkatsu sauce, it delivers an exquisite dining experience that stands out as a prime culinary highlight of Gwangalli.", "name": "Tonshou Gwangan Branch (Tonshou / \ud1a4\uc1fc\uc6b0 \uad11\uc548\uc810)", "transport": "Busan Metro Line 2 Gwangan Station, Exit 5, approx. 12-minute walk (near Millak Raw Fish Center)"}, {"address": "183 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.3 stars | A famous cocktail bar and American gastropub chain along the Gwangalli coastal avenue, famous for its flair bartending shows and vibrant atmosphere. The kitchen serves up a fusion of American and Mexican flavors, including freshly made pulled pork tacos, cheesy nachos, and combo pizzas. The soft tacos are filled with tangy, savory ingredients that pair deliciously with the bartenders\u0027 signature fruity cocktails. Outdoor seating overlooks the Gwangan Bridge, making it a hot spot for soaking in Gwangalli\u0027s tropical beach vibes and nightlife.", "name": "Fuzzy Navel Gwanganli Beach Branch (Fuzzy Navel / \ud37c\uc9c0\ub124\uc774\ube14 \uad11\uc548\uc810)", "transport": "Busan Metro Line 2 Geumnyeonsan Station, Exit 1, approx. 8-minute walk"}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "24, Gwangan-ro 49beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.7 Stars | One of Gwangalli\u0027s most iconic vegan spots, sourcing fresh, local organic ingredients. Popular dishes include vegan tacos, veggie burgers topped with oat milk tartar sauce, and seasonal Japanese set meals. Crispy on the outside, tender and juicy on the inside, the burger patties rival real meat, making this a favorite among hip locals and foreign tourists alike.", "name": "Love Urth (\ub7ec\ube0c\uc5bc\uc2a4)", "transport": "Busan Metro Line 2, Gwangan Station, Exit 3, approx. 6-min walk"}, {"address": "37, Gwangan-ro 21beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.6 Stars | A cozy plant-based bistro tucked away in the alleys of Gwangalli, specializing in animal-free Southeast Asian and American dishes. Signature items include vegan Pad Thai and tofu-steak burritos, boasting rich, layered flavors and savory house-made sauces. The seared tofu offers a lightly crispy skin with a soft, juicy interior\u2014an ideal evening retreat for relaxing over delicious plant-based food.", "name": "Home Gwangalli (\ud648)", "transport": "Busan Metro Line 2, Gwangan Station, Exit 1, approx. 5-min walk"}, {"address": "18-4, Suyeong-ro 408beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.5 Stars | A leafy garden-style vegetarian restaurant near Gwangalli and Namcheon-dong serving heartwarming, farm-to-table comfort food. Must-try specialties are the Tofu Curry Rice and Soy Milk Sesame Noodles. The thick, rich curry paired with roasted seasonal vegetables delivers natural sweetness and tender textures. Surrounded by a lush garden, dining here feels like enjoying a healthy meal tucked away in a peaceful forest.", "name": "Ecotopia (\uc5d0\ucf54\ud1a0\ud53c\uc544)", "transport": "Busan Metro Line 2, Namcheon Station, Exit 1, approx. 4-min walk"}, {"address": "17, Guangnam-ro 48beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.6 Stars | A vegan rice bakery operating entirely free of milk, eggs, butter, and refined flour. Signature treats like the vegan soy cream buns and rice chiffon cakes offer a chewy, moist texture that never feels dry. With fillings that are perfectly balanced in sweetness alongside subtle hints of soy and rice, it\u0027s ideal for dairy/egg-allergic folks or anyone seeking guilt-free desserts.", "name": "Apr.25 Vegan Bakery (4\uc6d425\uc77c)", "transport": "Busan Metro Line 2, Geumnyeonsan Station, Exit 1, approx. 5-min walk"}, {"address": "8, Gwanganhaebyeon-ro 15beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.4 Stars | A cozy bakery specializing in naturally fermented vegan sourdough bread and plant-based desserts. Their vegan scones are golden-crisp on the outside and wonderfully fluffy inside. Paired with a smooth, aromatic matcha latte made with oat milk, it\u0027s a popular choice for grabbing an afternoon vegan tea break after a walk along Gwangalli Beach.", "name": "Vane Bakery (\ubca0\uc778 \ubca0\uc774\ucee4\ub9ac)", "transport": "Busan Metro Line 2, Geumnyeonsan Station, Exit 3, approx. 7-min walk"}, {"address": "12, Gwangan-ro 35beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.5 Stars | An exquisite cafe specializing in raw vegan and gluten-free desserts. Their signature vegan nut cheesecake uses zero dairy, skillfully blending cashews and coconut oil to achieve a delightfully silky, rich cheese texture. Balanced with a sweet-and-sour berry compote, it\u0027s light and refreshing\u2014a huge favorite among health-conscious and low-sugar dessert lovers.", "name": "Sogil Vegan Dessert Cafe (\uc18c\uae38 Cafe)", "transport": "Busan Metro Line 2, Gwangan Station, Exit 1, approx. 4-min walk"}, {"address": "22, Suyeong-ro 388beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.3 Stars | A cozy and warm vegan Korean spot known for traditional plant-based dolsot bibimbap (stone pot rice) and vegan doenjang jjigae (soybean paste stew). Crafted using custom vegetable broth and fresh mountain herbs, the crispy rice crust at the bottom of the sizzling stone pot pairs delightfully with the rich, savory soybean stew\u2014perfectly satisfying vegetarians looking to experience authentic Korean flavors.", "name": "Doran Doran Korean Vegan Restaurant (\ub3c4\ub780\ub3c4\ub780)", "transport": "Busan Metro Line 2, Namcheon Station, Exit 3, approx. 3-min walk"}, {"address": "191, Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.4 Stars | Located just steps away from Gwangalli Beach, this health food spot specializes in fresh plant-based salad bowls and plant-protein wraps. The popular Vegan Plant-Meat Mushroom Salad Bowl features chewy plant-based meat with a subtle smoky charred flavor, tossed with fresh crisp greens and house-made sesame dressing\u2014the ultimate grab-and-go light meal before hitting the beach.", "name": "Greeny Table Gwangalli (\uadf8\ub9ac\ub2c8\ud14c\uc774\ube14)", "transport": "Busan Metro Line 2, Gwangan Station, Exit 5, approx. 8-min walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "219 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.5 Stars | Fried to a crisp golden perfection, this hotteok is stuffed with molten brown sugar lava and a generous mix of sunflower seeds, crushed peanuts, and sesame seeds. Each bite delivers an explosion of warm, sweet brown sugar syrup balanced by savory, crunchy nuts\u2014a must-try classic snack while strolling along Gwangalli Beach.", "name": "Gwangalli Wonjo Ssiat Hotteok (Seed-Filled Sweet Pancake)", "transport": "Metro Line 2, Gwangan Station, Exit 5 (approx. 10-min walk); located along the coastal promenade right in front of Gwangalli Beach"}, {"address": "205 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.6 Stars | One of Busan\u0027s most famous traditional fish cake spots. Freshly made and fried on the spot, the bouncy fish cakes burst with savory seafood flavor. Highlights include the cheese fish cake and shrimp fish cake rolls, filled with gooey melted cheese that stretches with every bite. The shop also serves complimentary piping-hot fish cake broth, making it the ultimate cozy treat for winter beach strolls.", "name": "Goraesa Eomuk (Fish Cake) - Gwangan Branch", "transport": "Metro Line 2, Gwangan Station, Exit 3 (approx. 9-min walk); near the main avenue of the beach"}, {"address": "191 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.3 Stars | Baked fresh to order, this large coin-shaped waffle cake boasts a crispy exterior, soft interior, and a rich milky aroma. It is stuffed with a massive block of mozzarella cheese that stretches endlessly when pulled hot, creating a delicious balance of sweet waffle and savory, creamy cheese. It\u0027s a hugely popular grab-and-go snack for taking photos with Gwangandaegyo Bridge in the background!", "name": "Gwangalli 10 Won Bread", "transport": "Metro Line 2, Gwangan Station, Exit 5 (approx. 8-min walk)"}, {"address": "142 Gwangnam-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.4 Stars | Busan-style tteokbokki featuring thick, chewy rice cakes simmering in a deep red, rich, sweet-and-spicy sauce. The rice cakes absorb every bit of the secret chili paste broth. Paired with crispy fried seaweed rolls and fish cake skewers drenched in spicy sauce, this satisfyingly hearty street meal is a beloved local comfort food.", "name": "Gwangalli Halmae Tteokbokki (Grandma\u0027s Rice Cakes)", "transport": "Metro Line 2, Geumnyeonsan Station, Exit 1 (approx. 5-min walk)"}, {"address": "23 Millaksubyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.2 Stars | A popular street food stall near the Millak Raw Fish Center. Whole fresh squids and plump prawns are coated in a light batter and flash-fried to golden perfection. Crisp on the outside and succulent inside without feeling greasy, it\u0027s the ideal snack to take to the waterfront park for a picnic with cold beer while taking in the night view of Gwangandaegyo Bridge.", "name": "Millak Waterfront Park Fried Seafood Stall", "transport": "Metro Line 2, Gwangan Station, Exit 5; transfer to Suyeong-gu Bus No. 02 and get off at Millak Waterfront Park Stop"}, {"address": "225 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.1 Stars | A super popular grill stall along the Gwangalli promenade. Skewers of tender chicken thigh and scallions are flame-grilled over charcoal to a light smokey char, then brushed with signature sweet teriyaki sauce or fiery spicy sauce. Juicy, sizzling hot, and packed with smoky flavor, it\u0027s a perfect quick treat for an evening beach stroll.", "name": "Gwangalli Beachside Charcoal-Grilled Chicken Skewers", "transport": "Metro Line 2, Gwangan Station, Exit 3 (approx. 10-min walk)"}, {"address": "179 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.7 Stars | A trendy dessert spot on the Gwangalli coast. Rich, creamy organic local milk ice cream is topped with a generous slab of freshly cut natural honeycomb. The dense, velvety milk soft-serve pairs brilliantly with the chewy, aromatic floral honeycomb, offering a perfectly sweet, non-cloying treat that\u0027s ideal for summer beach photos.", "name": "Honey Bee Gwangalli (Honeycomb Ice Cream)", "transport": "Metro Line 2, Geumnyeonsan Station, Exit 3 (approx. 7-min walk)"}, {"address": "15 Suyeong-ro 725beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.4 Stars | Classic traditional market eats located near Gwangalli Beach. The authentic soondae (blood sausage) is tender without any gamey odor, served with Busan\u0027s signature seasoned ssamjang (bean paste) and salt. Pair it with steamed pork offal and spicy traditional tteokbokki for an authentic taste of old Busan wrapped in warm market hospitality.", "name": "Suyeong Paldo Market Soondae \u0026 Street Snacks", "transport": "Metro Lines 2 \u0026 3, Suyeong Station, Exit 2 (approx. 3-min walk)"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Gwangalli Beach and Cafe Street"}, "haeundae_centum": {"categories": {"cat_1": {"items": [{"address": "23 Jungdong 1-ro 43beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.4 Stars | Founded in 1970, this iconic blowfish restaurant is one of Busan\u0027s most representative traditional culinary institutions. The signature clear pufferfish soup features tender, firm, and chewy pufferfish simmered with abundant celery and bean sprouts. The broth is exceptionally sweet, refreshing, and non-greasy, making it a beloved favorite among local foodies and those seeking the ultimate hangover cure. Dipping the meat into their special vinegar sauce highlights the natural umami\u2014a classic flavor that leaves a lasting impression.", "name": "Geumsu Bokguk Haeundae Main Branch", "transport": "Busan Metro Line 2, Haeundae Station, Exit 3, approx. 7-min walk"}, {"address": "325 Jungdong 2-ro 10beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.3 Stars | Operating since 1964, this legendary Korean BBQ spot is famous for its charming Hanok-style architecture and secret marinade recipe. Using premium Hanwoo beef ribs marinated in a secret sauce, the meat is grilled on a uniquely grooved iron skillet, yielding tender, melt-in-your-mouth bites packed with rich charcoal aromas and sweet savory notes. Finishing the meal with potato starch noodles cooked in the concentrated juices provides a delightfully chewy experience\u2014a legendary feast you cannot miss in Haeundae.", "name": "Haeundae Somunnan Amso Galbi", "transport": "Busan Metro Line 2, Jung-dong Station, Exit 7, approx. 8-min walk"}, {"address": "612-2 U-dong, Haeundae-gu, Busan", "feature": "\u2b50 4.1 Stars | Boasting over 50 years of history, this classic beef rice soup joint has won over countless diners with its affordable prices and deeply flavorful traditional broth. Beef, napa cabbage, and bean sprouts are slow-cooked in large cauldrons, resulting in a sweet, refreshing broth with a subtle kick of spice and melt-in-your-mouth beef chunks. As the rice absorbs the savory broth, every bite becomes rich and satisfying\u2014especially when paired with homemade radish kimchi and chives for an authentic taste of local Busan heritage.", "name": "Haeundae Wonjo Halmae Gukbap", "transport": "Busan Metro Line 2, Haeundae Station, Exit 1, approx. 3-min walk"}, {"address": "56 Jadong-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.4 Stars | A premier destination for Busan\u0027s iconic wheat cold noodles (Milmyeon). Made from high-quality wheat flour, these noodles offer a springier, chewier texture than typical Korean cold noodles. The highlight of their signature soup cold noodles is the chilled, herbal-infused broth paired with a special spicy sauce and shredded cucumbers\u2014delivering a sweet, tangy, and refreshing splash. The spicy stir-style noodles are delightfully sweet and savory. Pairing your meal with their thin-skinned, juicy steamed dumplings makes for a perfect dining experience.", "name": "Haeundae Gaya Milmyeon", "transport": "Busan Metro Line 2, Jung-dong Station, Exit 10, approx. 8-min walk"}, {"address": "133 Gunam-ro 24beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.2 Stars | The iconic home of Busan\u0027s legendary \u0027Nakgobsae\u0027 (spicy octopus, beef tripe, and shrimp stew), widely endorsed by Korean celebrities and TV shows. Tender octopus, juicy beef intestines, and crisp shrimp are simmered in a secret spicy sauce with heaps of chives, creating a rich, fiery stew. Mix these aromatic ingredients along with seaweed flakes into a big bowl of warm rice for a rich, multi-textured, delightfully chewy meal that will keep you coming back for another spoon.", "name": "Gaemijip Haeundae Main Branch", "transport": "Busan Metro Line 2, Haeundae Station, Exit 5, approx. 3-min walk"}, {"address": "28 Gunam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.3 Stars | Open 24 hours, this famous long-standing eatery serves Busan\u0027s staple pork soup rice (Dwaeji Gukbap), adored by locals and tourists alike. Slow-cooked over many hours into a milky white broth, the soup is rich and deeply comforting without any gamey odor. Generous slices of tender, juicy pork are accompanied by firm, springy sundae (Korean blood sausage). Season it to taste with salted shrimp, fresh chives, and spicy paste for a piping hot meal that warms you to the core\u2014a true taste of Busan\u0027s timeless comfort food.", "name": "Miryang Sundae Pork Rice Soup Haeundae Branch", "transport": "Busan Metro Line 2, Haeundae Station, Exit 5, approx. 2-min walk"}, {"address": "51 Marine City 3-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.4 Stars | Honoring authentic Korean home-cooking traditions, this famous establishment elevates classic seaweed soup\u2014traditionally served on special occasions\u2014to new heights. Premium seaweed is slow-simmered with beef, clams, or flounder to create a milky, incredibly savory, and thick broth featuring silky-smooth seaweed. Each order comes with a magnificent table spread of traditional banchan (side dishes) including pan-fried fish, japchae, and various kimchis. Hearty, healthy, and opulent, it is a treasured nostalgic feast for local families.", "name": "Pungwonjang Seaweed Soup Marine City Branch", "transport": "Busan Metro Line 2, Dongbaek Station, Exit 1, approx. 15-min walk"}, {"address": "6 Jungdong 1-ro 19beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.2 Stars | A longtime staple in Haeundae for traditional health-boosting cuisine, this restaurant specializes in nourishing ginseng chicken soup (Samgyetang). Young, tender chickens are stuffed with sticky rice, Korean ginseng, red dates, and garlic before being simmered to perfection. The meat easily falls off the bone and stays remarkably tender, while the glutinous rice absorbs the rich, soothing essence of the broth. Savoring a bowl infused with the subtle aroma of fresh ginseng warms the body and soul, highlighting Korea\u0027s time-honored culinary traditions.", "name": "Haeundae Samgyetang", "transport": "Busan Metro Line 2, Haeundae Station, Exit 1, approx. 5-min walk"}], "name": "Local Iconic Traditional Restaurants"}, "cat_2": {"items": [{"address": "3F-5F, 28 Dalmaji-gil 62beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.5 stars | Featuring traditional Jeju Island stone walls and floors covered in wood chips, combined with massive floor-to-ceiling glass windows facing the azure ocean views of Haeundae. Must-try signature drinks include the \u0027Jeju Hallabong Green Tea\u0027 and rich Marble Latte, pleasantly sweet without being cloying. Enjoying the ocean breeze while watching the rolling waves makes this one of Haeundae\u0027s most iconic and visually striking ocean-view cafes.", "name": "Rendeja-Vous Haeundae", "transport": "Subway Line 2 Haeundae Station Exit 3, approx. 15-min walk or 5-min taxi ride to near Mipo Port"}, {"address": "6F, 120 Dalmaji-gil 117beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.6 stars | Perched high on Dalmaji-gil, featuring unbeatable panoramic views and a spacious outdoor viewing deck. The signature \u0027Snowing Coffee\u0027 features specially whipped cream poured live over cold brew coffee, resembling falling snowflakes with striking visual appeal. The cream is silky smooth with a rich coffee aroma; paired with freshly baked vanilla waffles and cheesecake, it\u0027s the top choice for a luxurious afternoon tea.", "name": "Snowing Cloud Cafe", "transport": "Subway Line 2 Jung-dong Station Exit 7, take Haeundae-gu Town Bus No. 2 to Dalmaji Cathedral Station, then walk 3 minutes"}, {"address": "4F, 175 Dalmaji-gil 117beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.4 stars | A massive multi-concept space combining contemporary art exhibitions with a scenic cafe, featuring giant sculptures, colorful light art, and multiple themed photo spots. Signature offerings include rainbow crepe cake and fruit tarts paired with specialty cold brew coffee. Exquisite presentation intertwined with rich, layered sweetness allows guests to indulge in a dual feast for both the eyes and taste buds.", "name": "Cafe In Busan", "transport": "Subway Line 2 Jung-dong Station Exit 7, approx. 7-min taxi ride to the high point of Dalmaji-gil"}, {"address": "1F, 17 Gunam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.7 stars | Highlighting Italian espresso and vintage British pub style, popular among local youth and international tourists alike. The signature \u0027Busano Espresso\u0027 is topped with a torched vanilla sugar crust, delivering a rich bittersweet and caramelized taste. Paired with freshly baked French croissants or an Australian-style brunch platter, it offers a sophisticated and exotic atmosphere.", "name": "Casa Busano Haeundae", "transport": "Subway Line 2 Haeundae Station Exit 3, walk about 3 minutes along the Gunam-ro pedestrian street"}, {"address": "11 Udong 1-ro 38beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.5 stars | Tucked away in an alley along Haeoridan-gil, this American outdoor-style cafe is famous for its delightful French toast and custom Flat White. The French toast is seared to golden perfection, dusted with powdered sugar, and served with fresh berries and maple syrup\u2014crispy on the outside, silky and pudding-like inside, making it a highly popular brunch spot in the neighborhood.", "name": "Raw \u0026 Sweet Haeundae", "transport": "Subway Line 2 Haeundae Station Exit 4, walk about 5 minutes into the alleys of Haeoridan-gil"}, {"address": "22 Gunam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.3 stars | Korea\u0027s ultra-popular donut brand features a three-story flagship store in Haeundae with playful yellow decor full of whimsical charm. The signature Milk Cream Donut bursts with light, non-greasy filling that balances sweetness perfectly. Paired with an Americano or morning specialty drink, it\u0027s a must-try stroll dessert and brunch experience when visiting Haeundae.", "name": "Cafe Knotted Haeundae", "transport": "Subway Line 2 Haeundae Station Exit 5, walk about 2 minutes along Gunam-ro"}, {"address": "31 Jungdong 1-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.4 stars | One of Busan\u0027s most famous traditional French bakeries, filled with the rich aroma of freshly baked bread. The signature giant cream puffs (Choux \u00e0 la Cr\u00e8me) feature a crispy crust overflowing with smooth, lightly sweet custard cream that bursts upon taking a bite. Various quiches and apple pies also make excellent brunch choices to pair with pour-over coffee.", "name": "OPS Bakery Haeundae Main Store", "transport": "Subway Line 2 Haeundae Station Exit 1, walk about 7 minutes to near the entrance of Haeundae Market"}, {"address": "78 Dalmaji-gil 62beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.5 stars | A rooftop ocean-view cafe situated at the end of the old Mipo Railway, offering breathtaking panoramic views of the Gwangan Bridge and Haeundae coastline. The signature handmade chocolate lava cake paired with single-origin pour-over coffee delivers a rich, smooth chocolate flavor with a perfect balance of sweet and bitter. Lounging on the rooftop outdoor sofa with the sea breeze creates an unmatched, relaxing resort experience.", "name": "Edge 993", "transport": "Subway Line 2 Haeundae Station Exit 3, walk approx. 20 minutes, or take the Blue Line Park Beach Train to Mipo Station and walk about 5 minutes"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "23 Jungdong1-ro 43beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.4 stars | A classic Busan landmark established in 1970, famous for serving pufferfish in light, flavorful soups. Their signature earthenware pufferfish soup features a crystal-clear broth naturally sweetened with bean sprouts and celery. The pufferfish meat is springy and chewy, perfectly complemented by a dip in their special vinegar sauce. Enjoying a steaming bowl late at night warms the stomach and cures hangovers, making it a beloved spot for locals and tourists alike.", "name": "Geumsu Bokkuk Haeundae Head Office (\uae08\uc218\ubcf5\uad6d \ud574\uc6b4\ub300\ubcf8\uc810)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 1, approx. 7 mins walk"}, {"address": "32 Jungdong2-ro 10beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.3 stars | A landmark Korean rib restaurant operating since 1964, featuring beautiful Hanok-style courtyard architecture. Their Hanwoo (Korean beef) ribs are exceptionally tender with balanced marbling, sizzled over a custom iron grill with a perfectly balanced sweet-and-savory marinade. A must-try highlight is adding \u0027potato noodles\u0027 around the grill ring at the end to soak up all the rich meat juices and sauce\u2014their chewy, smooth texture is utterly addictive!", "name": "Haeundae Somunnan Amso Galbi-jip (\ud574\uc6b4\ub300\uc18c\ubb38\ub09c\uc554\uc18c\uac08\ube44\uc9d1)", "transport": "Busan Metro Line 2, Jung-dong Station, Exit 7, approx. 8 mins walk"}, {"address": "118 Cheongsapo-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.2 stars | Located along the Cheongsapo coast in Haeundae, this renowned spot offers an authentic local pojangmacha (food stall)-style seafood gastropub experience. Freshly grilled giant clams, scallops, and eels are served at peak freshness. The highlight is their signature foil bowl filled with butter and onions\u2014simply snip the cooked seafood inside to meld with the savory melted butter. Paired with chilled local Busan soju and the calming sound of crashing waves, it\u2019s an unbeatable nightlife experience.", "name": "Suminine Grilled Clams (\uc218\ubbfc\uc774\ub124)", "transport": "Take the Haeundae Blueline Park Beach Train to Cheongsapo Station, approx. 5 mins walk"}, {"address": "52 Dongbaek-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.1 stars | An ultimate waterfront gastropub boasting glittering night views of Haeundae and Centum City skyscrapers. Their classic Fish \u0026 Chips features fresh Atlantic cod with a golden, crispy crust and tender, juicy fish inside, making it a perfect pairing with draft beer and house sauces. The outdoor terrace seating offers panoramic views of bay reflections and the city skyline, making it an essential late-night hot spot in Busan.", "name": "The Bay 101 Fingers \u0026 Chat (\ub354\ubca0\uc774101 \ud551\uac70\uc2a4\uc564\ucc57)", "transport": "Busan Metro Line 2, Dongbaek Station, Exit 1, approx. 10 mins walk"}, {"address": "70 Dalmaji-gil 62beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.6 stars | A sophisticated gastropub specializing in modern regional seafood set meals. Their signature \u0027Raw Marinated Seafood Platter\u0027 gathers shrimp, crab, abalone, salmon, and octopus, marinated in a unique herbal soy sauce for a sweet, silky, and utterly fresh bite. Served with hot stone pot rice (sotbap) and a special egg yolk dipping sauce, it is a peak feast for both eyes and palate, best paired with sake or local soju.", "name": "Mipo Jip Haeundae (\ud574\uc6b4\ub300 \ubbf8\ud3ec\uc9d1)", "transport": "Take the Haeundae Blueline Park Beach Train to Mipo Station, approx. 3 mins walk"}, {"address": "13 Haeundaehaebyeon-ro 265beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.3 stars | A famous specialty restaurant that elevates traditional Korean seaweed soup (miyeok-guk) to gourmet dining levels. The broth is slow-simmered with clams into a rich, milky-white soup packed with rich umami flavors. The \u0027Abalone and Flounder Seaweed Soup\u0027 is highly recommended, combining whole fresh abalones and delicate flounder meat rich in collagen. Served with complimentary grilled saury and generous side dishes, it offers a deep taste of local culinary culture.", "name": "Obok Miyeok Haeundae (\uc624\ubcf5\ubbf8\uc5ed \ud574\uc6b4\ub300\uc810)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 7, approx. 5 mins walk"}, {"address": "46 Haeundae-ro 570beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.5 stars | A celebrated local craft brewery pub born in Busan, seamlessly blending British pub culture with Korean regional vibes. They feature over a dozen house-brewed craft taps, including IPAs, stouts, and fruity sours. The food menu highlights gourmet American craft burgers, pulled pork quesadillas, and spicy fried chicken. With its lively, relaxed atmosphere, it\u0027s the perfect night out for drinks and food with friends.", "name": "Gorilla Brewing Haeundae (\uace0\ub9b4\ub77c\ube0c\ub8e8\uc789 \ud574\uc6b4\ub300\uc810)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 5, approx. 3 mins walk"}, {"address": "117 Dalmaji-gil 117beon-ga-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.4 stars | An upscale art-gallery gastropub nestled halfway up Dalmaji-gil Hill, converted from a former art gallery into an artistic dining haven. It serves refined Italian and French fusion local dishes featuring local seasonal seafood and premium ingredients, such as abalone pasta and aged steaks. Floor-to-ceiling windows offer sweeping views of the Haeundae coastline and Dongbaek Island, paired with an extensive wine cellar\u2014making it a premier choice for a romantic luxury dining experience.", "name": "Kitchen Dongbaek (\ud0a4\uce5c\ub3d9\ubc31)", "transport": "Busan Metro Line 2, Jung-dong Station, Exit 5, then approx. 5 mins by taxi"}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "28 Dalmaji-gil 62beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.6 stars | A cozy vegan bistro located near Haeundae Dalmaji-gil, popular with international tourists and local plant-based food lovers. The signature vegan burger features a house-made bean and nut patty that is crispy on the outside, tender on the inside, and bursting with juicy smoky flavor. Paired with freshly baked crispy fries and custom vegan mayo, the layers of flavor are rich yet not greasy. Another favorite, the plant-milk pasta, has a rich and creamy texture with smooth sauce coating every strand, delivering a warm and comforting delight.", "name": "Home Vegan Bistro (\ud648\ube44\uac74\ube44\uc2a4\ud2b8\ub85c)", "transport": "About a 15-minute walk from Exit 7 of Jung-dong Station (Subway Line 2), or transfer to Haeundae-gu Village Bus No. 2"}, {"address": "19 Udong 1-ro 20beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.4 stars | A highly-rated Haeundae branch of the world-renowned vegan chain, making it a reliable top choice for vegetarian travelers visiting Busan. The restaurant offers a diverse range of Korean and Western vegan dishes. The signature vegan fried chicken is made with plant-based meat, coated in a secret special sauce, and fried to a golden crispiness. Every bite delivers an amazingly satisfying texture paired with sweet and mild spicy sauce aromas that easily rival traditional Korean fried chicken. The vegan Jajangmyeon (black bean noodles) and vegan seafood noodle soup are equally delicious, featuring rich broths and springy noodles.", "name": "Loving Hut Haeundae (\ub7ec\ube59\ud5db \ud574\uc6b4\ub300\uc810)", "transport": "About a 6-minute walk from Exit 4 of Haeundae Station (Subway Line 2)"}, {"address": "2F, 257 Haeundaehaebyeon-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.3 stars | A top-tier Indian restaurant facing Haeundae Beach, offering an abundant variety of vegan and lacto-vegetarian options. The Palak Paneer (spinach cheese curry) and Dal Curry (lentil curry) are highly recommended; sauces are slow-cooked with fresh spices to achieve a smooth, rich flavor packed with herbal and aromatic curry notes. Paired with freshly baked whole-wheat roti that boasts a smoky charred aroma and a chewy texture, dipping it into the rich curry offers a satisfying, deeply layered meal\u2014a perfect plant-based feast after a seaside stroll.", "name": "Ganga Haeundae Branch (\uac15\uac00 \ud574\uc6b4\ub300\uc810)", "transport": "About an 8-minute walk from Exit 5 of Haeundae Station (Subway Line 2)"}, {"address": "9F, Shinsegae Department Store Centum City, 15 Centum 4-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.5 stars | An elegant and sophisticated vegetarian-friendly Indian restaurant located inside the Shinsegae Department Store at Centum City. The menu features clearly labeled vegetarian curries, such as chana masala (chickpea curry) and vegetable curry, where chickpeas and veggies are cooked until tender, absorbing every bit of aromatic spice to melt in your mouth with a tangy, appetizing taste. Notably, their airy yet chewy vegan naan paired with special herb sauce or vegan yogurt sauce offers a light, guilt-free experience highly praised by shoppers and travelers.", "name": "Agra Shinsegae Centum City Branch (\uc544\uadf8\ub77c \uc2e0\uc138\uacc4\ubc31\ud654\uc810 \uc13c\ud140\uc2dc\ud2f0\uc810)", "transport": "Directly connected to Shinsegae Department Store via the underground passageway at Centum City Station (Subway Line 2)"}, {"address": "78 Centum jungang-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.7 stars | A modern salad and vegan light-eats eatery in the Centum City commercial district, hugely popular among local office workers and health-conscious tourists. Their signature vegan grain bowl is loaded with quinoa, roasted warm vegetables, and pan-seared house-made tofu, finished with a house sesame-ginger dressing for a crisp, hearty, and multi-textured flavor. The vegan avocado toast uses crispy barley sourdough topped with creamy mashed ripe avocado and crushed nuts, bursting with natural wholesome fats and wheat aromas.", "name": "Cow \u0026 Veggie (\uce74\uc6b0\uc564\ubca0\uc9c0)", "transport": "About a 7-minute walk from Exit 4 of Centum City Station (Subway Line 2)"}, {"address": "17 Haeundae-daero 744beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.6 stars | A must-visit vegan bakery in the Haeundae area where all baked goods are free from milk, eggs, and butter. The signature vegan rice salt croissant boasts a crispy exterior and a moist, springy interior, delivering subtle rice sweetness combined with the savory note of premium sea salt. The vegan rice chiffon cake is soft and velvety without being dry, paired with special soy whipped cream for a cloud-like, light indulgence that dessert lovers can enjoy completely guilt-free.", "name": "POTT Vegan Bakery Cafe (\ud31f \ube44\uac74\ubca0\uc774\ucee4\ub9ac)", "transport": "About a 5-minute walk from Exit 1 of Jung-dong Station (Subway Line 2)"}, {"address": "91-1 Jadong-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.2 stars | A traditional handmade tofu specialty restaurant near Jangsan Station in Haeundae, loved by locals and vegetarian travelers seeking authentic regional flavors. The vegan soft tofu stew (Sundubu-jjigae) uses premium soybeans freshly ground daily, with a clear broth simmered gently from kelp and napa cabbage. The tofu is extraordinarily silky, melting in your mouth with a rich, pure natural soybean aroma. The accompanying Korean side dishes (banchan) are all vegan-pickled, offering a crisp, appetizing taste of authentic Korean home cooking.", "name": "Jangsan Handmade Tofu (\uc7a5\uc0b0\ub9f7\ub3cc\uc21c\ub450\ubd80)", "transport": "About an 8-minute walk from Exit 10 of Jangsan Station (Subway Line 2)"}, {"address": "17-6 Dalmaji-gil 117beon-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.5 stars | Tucked away in an artistic alley along Haeundae Dalmaji-gil, this cozy vegan cafe features a lush green garden setting. Specializing in gluten-free vegan cakes and rich plant-milk coffees, their signature gluten-free vegan rich chocolate cake is made with high-purity dark chocolate and oat milk, offering a dense, silky texture akin to raw chocolate with a perfectly balanced bittersweet flavor. Paired with a rich iced oat milk latte, it provides a smooth, lingering finish\u2014the perfect spot to enjoy a relaxing afternoon in Haeundae.", "name": "Jacky\u0027s Vegan Cafe (\uc7ac\ud0a4\uc2a4\ube44\uac74\uce74\ud398)", "transport": "Take Exit 5 of Jung-dong Station (Subway Line 2), transfer to the green village bus, and get off at Dalmajiryeong Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "43 Jungdong 1-ro, Haeundae-gu, Busan (Inside Haeundae Traditional Market)", "feature": "\u2b50 4.3 stars | Made-to-order and fried to golden perfection, these hotteok feature an ultra-crispy crust bursting with rich brown sugar syrup, fragrant sunflower seeds, pumpkin seeds, and crushed peanuts. The piping-hot nutty aroma intermingles with rich sweetness, making it the most beloved street snack that draws long queues from tourists and locals alike in Haeundae Traditional Market.", "name": "Haeundae Famous Seed Hotteok (Ssiat Hotteok)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 3, approx. 5 mins walk"}, {"address": "40 Gunam-ro 41beon-gil, Haeundae-gu, Busan (Inside Haeundae Traditional Market)", "feature": "\u2b50 4.2 stars | One of Busan\u0027s top three tteokbokki spots! The thick, chewy rice cakes thoroughly absorb a rich, sweet, and spicy signature sauce. Paired with golden crispy vegetable tempura and savory fish cake soup, the delicious sweet-and-spicy flavor profile leaves a lasting impression, keeping the place perpetually packed.", "name": "Sanggukne Tteokbokki", "transport": "Busan Metro Line 2, Haeundae Station, Exit 3, approx. 6 mins walk"}, {"address": "14 Gunam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.4 stars | One of Busan\u0027s most legendary fish cake shops, easily recognized by the giant iconic fish cake sculpture at the entrance. The store offers a vast array of freshly made fish cakes\u2014ranging from cheese and chili fish cakes to fish cake noodles. Tender, springy, and bursting with rich fish flavor, this is a classic street food experience you can\u0027t miss in Haeundae.", "name": "Goraesa Fish Cake (Haeundae Branch)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 5, approx. 2 mins walk"}, {"address": "B1, Shinsegae Department Store Centum City, 35 Centumnam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.3 stars | Busan\u0027s very first fish cake brand with nearly a century of heritage, elevating traditional street food to gourmet heights. Their signature fish cake croquettes feature a crispy golden shell stuffed with rich cheese, shrimp, or curry. Crispy on the outside, tender and juicy on the inside, it\u0027s an exquisite must-try snack while shopping at Centum City.", "name": "Samjin Amook (Shinsegae Centum City Branch)", "transport": "Busan Metro Line 2, Centum City Station, directly connected to Shinsegae Department Store B1"}, {"address": "29 Gunam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.5 stars | Made-to-order Korean corn dogs coated in rice flour batter, lightly dusted with sugar, and drizzled with custom sauces for an insanely crispy bite. The Mozzarella Cheese Hot Dog is highly recommended\u2014biting into it yields an impressively long cheese pull with a savory-sweet, aromatic delight that is hugely popular with youth and tourists.", "name": "Myeongrang Hot Dog (Haeundae Branch)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 3, approx. 3 mins walk"}, {"address": "2-24 Marine City-gil, Haeundae-gu, Busan", "feature": "\u2b50 4.1 stars | A cluster of outdoor street tents overflowing with Busan\u0027s vibrant late-night atmosphere, lined up in iconic orange tents along the coast. Renowned for freshly steamed seafood and lobster sets, the seafood is delightfully sweet and plump. Paired with hot ramyeon and soju, it offers a deep immersion into Busan\u0027s unique pojangmacha (tent bar) culture.", "name": "Haeundae Pojangmacha Village", "transport": "Busan Metro Line 2, Haeundae Station, Exit 5, approx. 10 mins walk"}, {"address": "40 Jungdong 1-ro, Haeundae-gu, Busan (Inside Haeundae Traditional Market)", "feature": "\u2b50 4.2 stars | You can catch the smoky charcoal aroma from afar inside Haeundae Traditional Market. Jumbo chicken skewers are brushed with sweet-and-spicy Korean sauce or soy glaze and grilled over real charcoal until lightly charred. The chicken is tender and juicy, layered with sweet grilled green onions\u2014a quintessential grab-and-go street snack.", "name": "Haeundae Market Handmade Chicken Skewers (Dak-kkochi)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 3, approx. 5 mins walk"}, {"address": "Gunam-ro 41beon-gil, Haeundae-gu, Busan (At the entrance of Haeundae Traditional Market)", "feature": "\u2b50 4.3 stars | Iconic Korean winter street treats! The egg bread (gyeran-ppang) features a whole fresh egg baked inside, creating a moist, savory-sweet delight. The fish-shaped pastry (bungeoppang) has a crispy thin crust stuffed generously with hot red bean paste or rich custard. Each bite brings warm happiness, hugely favored by locals and visitors alike.", "name": "Haeundae Market Handmade Bungeoppang \u0026 Gyeran-ppang", "transport": "Busan Metro Line 2, Haeundae Station, Exit 3, approx. 4 mins walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Haeundae and Centum City"}, "nampo_jagalchi": {"categories": {"cat_1": {"items": [{"address": "31 BIFF gwangjang-ro, Jung-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc911\uad6c \ube44\ud504\uad11\uc7a5\ub85c 31)", "feature": "\u2b50 4.3 stars | Founded in 1947, this insanely popular iconic restaurant boasts over 70 years of master craftsmanship. Their signature classic wonton soup features paper-thin, nearly translucent wonton skins that melt in your mouth almost without chewing. The refined broth, simmered long hours with dried anchovies and kelp, is clear, sweet, and lightly infused with sesame oil. This comforting, light taste of nostalgia is not only a shared culinary memory across three generations of locals, but also a must-visit legendary spot in Busan for countless tourists.", "name": "18 Beon Wandang Jib", "transport": "Subway Line 1 Jagalchi Station Exit 7, approx. 3 mins walk"}, {"address": "56-14 Gwangbok-ro, Jung-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc911\uad6c \uad11\ubcf5\ub85c 56-14)", "feature": "\u2b50 4.2 stars | Tucked away in a lively alley of Nampo-dong, this iconic noodle shop is the top choice to sample Busan\u0027s unique wheat cold noodles (Milmyeon), a local tradition since the Korean War era. The signature cold soup noodles feature a refreshing broth infused with Korean medicinal herbs and beef bones, offering a subtly sweet finish. Made from wheat flour, the noodles are chewier and easier to bite through than traditional buckwheat cold noodles. Topped with house-made spicy sauce, shredded cucumber, and sweet pear strips, it offers an irresistible sweet, sour, and spicy flavor profile. Slurping the ice-slush broth and bouncy noodles on a hot summer day delivers an instant cooling sensation, making it immensely popular with both local foodies and travelers.", "name": "Halmae Gaya Milmyeon", "transport": "Subway Line 1 Nampo Station Exit 1, approx. 5 mins walk"}, {"address": "6 Jagalchi-ro 23beon-gil, Jung-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc911\uad6c \uc790\uac08\uce58\ub85c23\ubc88\uae38 6)", "feature": "\u2b50 4.4 stars | Located behind Jagalchi Market, this decades-old legendary indoor charcoal-grilled tripe market stall offers an incredible retro vibe filled with rich smoky charcoal aromas. The venue consists of over a dozen traditional food stalls. They select ultra-fresh beef tripe, small intestines, and abomasum, marinated in a special garlic sauce and grilled over charcoal until the outer layer is golden and crispy while the inside remains juicy and savory. Chewy, richly aromatic, and completely free of offal odor, every bite is a perfect harmony of beef fat and smoky goodness. Local foodies love ordering a portion of salt-grilled or spicy stir-fried tripe paired with a bottle of soju to experience the authentic nightlife charm of Busan.", "name": "Baekhwa Yang Gopchang", "transport": "Subway Line 1 Jagalchi Station Exit 10, approx. 3 mins walk"}, {"address": "16 Nampo-gil, Jung-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc911\uad6c \ub0a8\ud3ec\uae38 16)", "feature": "\u2b50 4.1 stars | Operating since 1959, this is Busan\u0027s oldest restaurant specializing in ginseng chicken soup (Samgyetang). Tender young chickens raised for around 45 days are stuffed with Korean ginseng, glutinous rice, jujubes, and garlic, then slow-cooked for hours. The meat falls off the bone effortlessly and is tender and juicy. The rich, milky-white broth absorbs the pure essence of chicken and the herbal aroma of ginseng, delivering a warm, velvety sweet taste. The stuffed glutinous rice soaks up all the soup, offering a smooth, cozy texture. Served with a complementary shot of ginseng liquor\u2014which can be enjoyed straight or poured into the soup for enhanced flavor\u2014it is a traditional, nourishing delicacy suitable for all seasons.", "name": "Nampo Samgyetang", "transport": "Subway Line 1 Nampo Station Exit 1, approx. 4 mins walk"}, {"address": "11 Gudeok-ro 22beon-gil, Jung-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc911\uad6c \uad6c\ub355\ub85c22\ubc88\uae38 11)", "feature": "\u2b50 4.3 stars | A decades-old iconic ox bone soup (Seolleongtang) restaurant located in the Gwangbok-ro shopping district, famous for its deeply flavorful milky-white beef bone broth and top-tier pickled radish cubes. Simmered over high heat for an entire day, the velvety broth is rich yet light and non-greasy, infused with a natural beef bone aroma. Tender slices of beef pair perfectly with rice and wheat noodles submerged in the soup for a deeply satisfying meal. The absolute star is their house-made pickled radish cubes (Kkakkdugi)\u2014sweet, spicy, crunchy, and juicy\u2014which create a heavenly balance with the rich soup. It remains a top choice for locals seeking a warm, hearty brunch.", "name": "Seoul Kkakkdugi", "transport": "Subway Line 1 Nampo Station Exit 7, approx. 3 mins walk"}, {"address": "31 Gwangbokjungang-ro, Jung-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc911\uad6c \uad11\ubcf5\uc911\uc559\ub85c 31)", "feature": "\u2b50 4.6 stars | A legendary Nampo-dong pizzeria famous throughout South Korea since 1992, making it one of Busan\u0027s most iconic local eateries despite not being traditional Korean food. Its standout feature is the incredibly generous topping of 100% pure Imsil cheese, which creates an epic cheese stretch when served piping hot, boasting a rich, velvety milk flavor. The crust is crispy and airy, while combinations like bulgogi toppings and cheese-stuffed crust edges are executed to perfection. Even with a two-hour wait, it continues to draw food lovers and locals from all over Korea.", "name": "Lee Jae-mo Pizza", "transport": "Subway Line 1 Jungang Station Exit 5, approx. 7 mins walk, or Nampo Station Exit 7, approx. 8 mins walk"}, {"address": "21-1 Junggu-ro 39beon-gil, Jung-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc911\uad6c \uc911\uad6c\ub85c39\ubc88\uae38 21-1)", "feature": "\u2b50 4.5 stars | Tucked away in a quiet alley of Gukje Market, this traditional sandwich stall run by a warm elderly couple for decades is packed with nostalgic local charm. Their signature butter cabbage toast is freshly grilled on a hot griddle until both sides are golden and crispy, packed with fresh shredded cabbage, a fried egg, ham, and cheese, then finished with a drizzle of sweet nostalgic sauce. Crispy on the outside and soft inside, the fresh crunch of cabbage perfectly blends with savory ham and rich cheese. Paired with a fresh strawberry-banana juice, it is a classic street food breakfast you cannot miss when visiting Nampo-dong.", "name": "Sinchang Toast", "transport": "Subway Line 1 Jagalchi Station Exit 3, approx. 8 mins walk"}, {"address": "13 Gwangbok-ro, Jung-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \u4e2d\u5340 \u5149\u5fa9\u8def 13)", "feature": "\u2b50 4.0 stars | One of the pioneer shops located on Bupyeong-dong Jokbal Street in Nampo-dong, this famous joint is the originator of Busan\u0027s signature chilled mustard pig\u0027s trotters (Naengchae Jokbal). Thinly sliced braised pig\u0027s trotters are tossed with shredded cucumber, jellyfish, and the restaurant\u0027s signature sweet-and-sour mustard sauce. The pork skin is delightfully bouncy and rich in collagen, complemented by the refreshing sauce with its mild spicy kick and zesty mustard tang. Totally different from traditional hot jokbal, its chilled, refreshing texture makes it an essential local specialty for food lovers visiting Busan.", "name": "Hanyang Jokbal", "transport": "Subway Line 1 Jagalchi Station Exit 3, approx. 4 mins walk"}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "5 Jungang-daero 41beon-gil, Jung-gu, Busan (\ubd80\uc0b0 \u4e2d\u5340 \u4e2d\u592e\ub300\ub85c41\ubc88\uae38 5)", "feature": "\u2b50 4.6 stars | Tucked away in an alleyway in Nampo-dong, this beautifully designed cafe uniquely blends specialty coffee culture with creative postcards. They serve high-quality signature Einsp\u00e4nners and handcrafted financier cakes with a rich, soft texture that\u0027s sweet without being overpowering. The warm, wood-toned interior flooded with natural light makes for a relaxed brunch experience\u2014where you can even mail a postcard to your future self! A highly recommended trendy spot for both tourists and local Busan youth.", "name": "Good Ol\u0027 Days Cafe (\uad7f\uc62c\ub370\uc774\uc988)", "transport": "About a 2-minute walk from Exit 1 of Jungang Station or a 5-minute walk from Exit 7 of Nampo Station on Busan Metro Line 1."}, {"address": "19 Junggu-ro 44beon-gil, Jung-gu, Busan (\ubd80\uc0b0 \u4e2d\u5340 \u4e2d\uad6c\ub85c44\ubc88\uae38 19)", "feature": "\u2b50 4.5 stars | Tucked away in a lively alley of Gukje Market, this classic British-style cafe feels like stepping back in time to old-world Europe. Smooth, sultry jazz music fills the air alongside rich coffee aromas. Their signature Einsp\u00e4nner features velvety sweet cream atop deep, bittersweet espresso, creating a beautifully layered sip. Paired with warm, freshly baked butter waffles\u2014crisp on the outside and soft on the inside\u2014it\u0027s an absolute dream for vintage atmosphere and jazz lovers.", "name": "Regular House Vintage Jazz Cafe (\ub808\uade4\ub7ec\ud558\uc6b0\uc2a4)", "transport": "About an 8-minute walk from Exit 7 of Jagalchi Station or a 10-minute walk from Exit 1 of Nampo Station on Busan Metro Line 1."}, {"address": "35 Daecheong-ro 126beon-gil, Jung-gu, Busan (\ubd80\uc0b0 \u4e2d\u5340 \ub300\uccad\ub85c126\ubc88\uae38 35)", "feature": "\u2b50 4.5 stars | Housed in a renovated 3-story red-brick building, this Korean minimalist cafe features soft lighting and minimalist artistic furniture. Signature menu items include made-to-order French toast and seasonal fruit waffles. The toast, soaked in egg custard and seared to golden perfection, offers a light, cloud-like texture. Paired with rich cheddar cheese and vanilla ice cream, the sweet and savory combination is stunning, making it a hot spot for Instagram-worthy brunching in Nampo-dong.", "name": "Cuorino Cafe (\ucfe0\uc624\ub9ac\ub178)", "transport": "About a 6-minute walk from Exit 17 of Jungang Station or an 8-minute walk from Exit 8 of Nampo Station on Busan Metro Line 1."}, {"address": "22 Junggu-ro 29beon-gil, Jung-gu, Busan (\ubd80\uc0b0 \u4e2d\u5340 \u4e2d\uad6c\ub85c29\ubc88\uae38 22)", "feature": "\u2b50 4.3 stars | A beloved decades-old institution located inside Gukje Market, famous for its affordable and delicious freshly made Korean teppan toast. The owner griddles the bread in sizzling butter until golden and crispy, stuffing it with shredded cabbage, fresh ham, melted cheese, and a signature sweet sauce for a juicy, fragrant bite. Paired with a glass of freshly made rich soy milk or fresh fruit juice, this simple, comforting meal is an essential traditional breakfast experience for visitors to Nampo-dong.", "name": "Sinchang Toast (\uc2e0\ucc3d\ud1a0\uc2a4\ud2b8)", "transport": "About a 6-minute walk from Exit 7 of Jagalchi Station on Busan Metro Line 1, located inside Gukje Market food street."}, {"address": "3F, 14 Gwangbok-ro 97beon-gil, Jung-gu, Busan (\ubd80\uc0b0 \u4e2d\u5340 \uad11\ubcf5\ub85c97\ubc88\uae38 14 3\uce35)", "feature": "\u2b50 4.6 stars | Run by a warm and friendly Taiwanese-Korean couple, this cozy postcard-themed cafe is a beloved brunch landmark for international travelers in Nampo-dong. They offer generous brunch platters featuring freshly seared sausages, bacon, silky scrambled eggs, and thick-cut buttered toast made with fresh, quality ingredients. Paired with their in-house roasted single-origin pour-over coffee\u2014smooth with a sweet finish\u2014it\u0027s the perfect spot to enjoy a meal while writing travel postcards.", "name": "Check In Busan Cafe (\uccb4\ud06c\uc778\ubd80\uc0b0)", "transport": "About a 2-minute walk from Exit 7 of Nampo Station on Busan Metro Line 1."}, {"address": "11 Daepyeong-ro, Jung-gu, Busan (\ubd80\uc0b0 \u4e2d\u5340 \ub300\ud3c9\ub85c 11)", "feature": "\u2b50 4.4 stars | Converted from a 1950s rice warehouse, this historic industrial-style cafe preserves original wooden beams and red-brick walls, radiating vintage character. Overlooking sweeping views of Busan Port, its signature latte boasts rich dairy notes with nut and caramel coffee undertones. Pair it with daily baked French croissants or Basque burnt cheesecake featuring a caramelized exterior and dense, creamy interior. The spacious and airy layout makes it a favorite relaxing getaway for architecture and harbor view lovers.", "name": "Notice Harbor Warehouse Cafe (\ub178\ud2f0\uc2a4)", "transport": "About an 8-minute walk from Exit 2 of Nampo Station on Busan Metro Line 1."}, {"address": "2F, 54-2 Gwangbok-ro, Jung-gu, Busan (\ubd80\uc0b0 \u4e2d\u5340 \uad11\ubcf5\ub85c 54-2 2\uce35)", "feature": "\u2b50 4.4 stars | The flagship main branch of Sulbing, Korea\u0027s iconic shaved ice chain, located in the bustling Gwangbok-ro shopping district of Nampo-dong. Their signature Injeolmi Sulbing features a mountain of snow-fine milk ice dusted with aromatic roasted soybean powder and chewy rice cake bites\u2014melting instantly in your mouth with balanced sweetness. Paired with freshly toasted Injeolmi toast filled with gooey melted rice cakes, it offers fantastic texture and is a must-visit dessert stop in Nampo-dong.", "name": "Sulbing Nampo Main Branch (\uc124\ube59 \ubcf8\uc810)", "transport": "About a 5-minute walk from Exit 1 of Nampo Station on Busan Metro Line 1."}, {"address": "12 Gwangbokjungang-ro, Jung-gu, Busan (\ubd80\uc0b0 \u4e2d\u5340 \uad11\ubcf5\uc911\uc559\ub85c 12)", "feature": "\u2b50 4.3 stars | Situated on the vibrant Gwangbok-ro Fashion Street, this cozy 3-story specialty cafe combines rustic woodwork and classic aesthetics to create a unique, comfortable atmosphere. The cafe carefully selects quality beans from around the world for in-house roasting, serving clean, smooth pour-over coffees with vibrant floral and fruity acidity. Their popular handmade fruit chiffon cake features an exceptionally light texture paired with fresh whipped cream and strawberries\u2014delicate like a cloud, making it the perfect spot for afternoon tea during a shopping break.", "name": "Gwangbokdong Coffee (\uad11\ubcf5\ub3d9\ucee4\ud53c)", "transport": "About a 6-minute walk from Exit 1 of Nampo Station or a 7-minute walk from Exit 1 of Jungang Station on Busan Metro Line 1."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "13 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.2 stars | Located on Nampo-dong\u0027s famous Jokbal Street, this spot is one of the birthplaces of cold-cut braised pig\u0027s trotters (Naengchae Jokbal). Thinly sliced trotters are served with crisp cucumbers, jellyfish, and a signature sweet-and-sour mustard sauce. Chewy, refreshing, and palette-cleansing, it is the ultimate local delicacy to pair with Korean soju, loved by local office workers and visiting foodies alike.", "name": "Original Hanyang Jokbal (Hanyang Jokbal / \uc6d0\uc870\ud55c\uc591\uc871\ubc1c)", "transport": "Approx. 3-minute walk from Exit 3 of Jagalchi Subway Station"}, {"address": "6 Jagalchi-ro 23beon-gil, Jung-gu, Busan", "feature": "\u2b50 4.4 stars | The most iconic, time-honored grilled tripe \u0026 intestine bistro inside Jagalchi Market. Composed of dozens of individual stalls, it radiates a vibrant, authentic Korean market atmosphere. Fresh beef tripe, small intestines, and abomasum are grilled over charcoal until sizzling and fragrant\u2014crispy on the outside, juicy and wonderfully chewy on the inside. Dipped in signature spicy or sesame oil sauce and washed down with soju, it offers a hearty taste of Busan\u0027s rugged, passionate port flavor.", "name": "Baekhwa Yanggopchang (Baekhwa Yanggopchang / \ubc31\ud654\uc591\uacf1\ucc3d)", "transport": "Approx. 2-minute walk from Exit 10 of Jagalchi Subway Station"}, {"address": "31 Junggu-ro 33beon-gil, Jung-gu, Busan", "feature": "\u2b50 4.3 stars | A classic grilled intestine specialty restaurant tucked in Bupyeong-dong\u0027s alleys, so popular it\u0027s always packed. They serve two classic styles: salt-grilled and spicy stir-fried. The spicy stir-fry features tender, chewy intestines cooked with abundant vegetables in a rich, fiery sauce that gets flavor-packed as it simmers. Ending the meal with fried rice mixed into the leftover sauce is the absolute highlight! Its lively atmosphere makes it a perfect night spot for drinks with friends.", "name": "Daejeong Yanggopchang (Daejeong Yanggopchang / \ub300\uc815\uc591\uacf1\ucc3d)", "transport": "Approx. 5-minute walk from Exit 3 of Jagalchi Subway Station"}, {"address": "6 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.1 stars | A prime representative of Busan\u0027s must-eat local specialty, pork soup rice (Dwaeji Gukbap). The rich, milky broth is slow-simmered for hours, completely free of gamey odor, offering a smooth and deeply comforting flavor. Served piping hot, each bowl is loaded with tender, thick pork slices and artisanal Korean blood sausage (sundae). Customizing it with salted shrimp, chives, and spicy paste creates complex layers of flavor. It\u0027s Nampo-dong\u0027s ultimate comforting, soul-warming meal.", "name": "Milyang Sundae Dwaeji Gukbap Nampo Branch (Milyang Sundae Dwaeji Gukbap / \ubc00\uc591\uc21c\ub300\ub3fc\uc9c0\uad6d\ubc25)", "transport": "Approx. 4-minute walk from Exit 7 of Jagalchi Subway Station"}, {"address": "10 Gwangbok-ro 49beon-gil, Jung-gu, Busan", "feature": "\u2b50 4.5 stars | A Japanese pub-style fish cake (oden) bar tucked in a bustling Nampo-dong alley, hugely popular among local youth and young professionals. High-quality Busan fish cakes simmer in a savory kelp and bonito broth, keeping them hot, bouncy, and delicious. Gather around cozy wooden tables to select your favorite skewers, paired with cold draft beer or sake. It\u0027s the ultimate cozy spot for a relaxed nightcap in Nampo-dong.", "name": "Busanjip Oden Bar (Busanjip Oden Bar / \ubd80\uc0b0\uc9d1)", "transport": "Approx. 5-minute walk from Exit 1 of Nampo Subway Station"}, {"address": "56-14 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.2 stars | A legendary decades-old institution famous for Milmyeon (Busan-style wheat cold noodles). Made from wheat flour, the noodles are bouncier and chewier than traditional buckwheat noodles. Served in a chilled herbal broth infused with spicy sauce, every bite is delightfully tangy, refreshing, and cool. Pair it with warm steamed dumplings for a sensational hot-and-cold contrast\u2014a true soul food experience in Nampo-dong.", "name": "Nampo Gaya Milmyeon (Nampo Gaya Milmyeon / \ud560\ub9e4\uac00\uc57c\ubc00\uba74)", "transport": "Approx. 4-minute walk from Exit 7 of Nampo Subway Station"}, {"address": "31 Gwangbokjungang-ro, Jung-gu, Busan", "feature": "\u2b50 4.6 stars | A legendary American-style gastropub in Nampo-dong, widely acclaimed as serving the best pizza in Busan. They use 100% natural Imsil Korean cheese, loaded so generously that fresh slices stretch for impressive lengths! The crust is crispy on the outside, soft inside, and richly buttery, topped with a secret tomato meat sauce and hearty ingredients. Long lines are constant, making this a true culinary landmark for locals and tourists alike.", "name": "Lee Jae Mo Pizza (Lee Jae Mo Pizza / \uc774\uc7ac\ubaa8\ud53c\uc790)", "transport": "Approx. 6-minute walk from Exit 1 of Jungang Subway Station"}, {"address": "52 Jagalchihaean-ro, Jung-gu, Busan", "feature": "\u2b50 4.3 stars | An authentic hagfish (sea eel) specialty restaurant near Jagalchi Market. Fresh hagfish is stir-fried over high heat on a hot griddle with plenty of onions, scallions, and a signature spicy Korean sauce. The hagfish is delightfully springy and flavorful, capturing the energetic vibe of a coastal stir-fry joint. Wrapping up the meal by frying rice with leftover sauce and seaweed flakes is the ultimate treat, perfectly showcasing Busan\u0027s fiery local charm.", "name": "Chunsun-ae Grandma Eel (Chunsun-ae Grandma Eel / \ucd98\uc120\uc774\ub124 \uacf0\uc7a5\uc5b4)", "transport": "Approx. 3-minute walk from Exit 10 of Jagalchi Subway Station"}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "15, Daecheong-ro 126beon-gil, Jung-gu, Busan", "feature": "\u2b50 4.6 Stars | Tucked away in the alleys of Nampo-dong, this classic Korean vegetarian restaurant is a favorite among plant-based food lovers and local tourists alike. Specializing in healthy, nourishing temple-style vegetarian cuisine, its most popular dish is the \u0027Perilla Seed Knife-Cut Noodles\u0027 (Kalguksu). The rich, creamy broth radiates the alluring aroma of natural perilla seeds and sesame, paired with silky, chewy noodles that deliver a sense of warmth and pure plant essence in every bite. Additionally, the steamed lotus leaf rice served with dozens of refreshing vegetable side dishes offers rich layers of texture, completely breaking the stereotype that vegetarian food is bland or monotonous.", "name": "Dajeon Vegetarian Restaurant (\u591a\u60c5\u7d20\u98df / \ub2e4\uc804)", "transport": "Busan Metro Line 1, Nampo Station, Exit 1, about a 7-minute walk."}, {"address": "107, Bosu-ro, Jung-gu, Busan", "feature": "\u2b50 4.5 Stars | Located at the boundary between Bosu-dong Book Street and Nampo-dong, Nayuta Cafe is a cozy, artisanal vegan bistro featuring chef-curated private dining. The restaurant offers a daily changing omakase-style plant-based menu based on fresh, seasonal ingredients, such as vegan Japanese curry, coconut vegetable pasta, and homemade vegan nut cheese tarts. The curry is remarkably smooth and rich with the natural sweetness of fresh vegetables, made without any animal products or chemical additives. With its quiet, comfortable atmosphere, it\u2019s an ideal spot for travelers looking to slow down and enjoy a relaxed meal.", "name": "Nayuta Cafe (Nayuta \u852c\u98df\u5496\u5561\u9928 / \ub098\uc720\ud0c0\uce74\ud398)", "transport": "Busan Metro Line 1, Jagalchi Station, Exit 3, about a 10-minute walk or transfer to a local neighborhood bus toward Bosu-dong."}, {"address": "12, Gwangbok-ro 97beon-gil, Jung-gu, Busan", "feature": "\u2b50 4.7 Stars | Located near the Gwangbok-ro shopping district, this stylish bakery is crafted specifically for vegans and those with lactose intolerance. Refusing to use milk, eggs, butter, or white sugar, the baker achieves an amazingly soft texture using sugar-free soy milk, brown rice oil, and natural brown sugar. The signature \u0027Vegan Whole Wheat Salt Bread\u0027 features a crispy exterior and a pillowy, soft interior infused with subtle hints of natural sea salt. Meanwhile, the \u0027Vegan Matcha Red Bean Scone\u0027 boasts a rich tea flavor and a dense yet moist texture, making it a must-try street treat while shopping in Nampo-dong.", "name": "April Weather Vegan Bakery (\u56db\u6708\u5929\u6c23\u7d14\u7d20\u9eb5\u5305\u5e97 / 4\uc6d4\uc758 \ub0a0\uc528)", "transport": "Busan Metro Line 1, Nampo Station, Exit 7, about a 4-minute walk."}, {"address": "Stall in Zone 3, Gukje Market, 36 Junggu-ro, Jung-gu, Busan", "feature": "\u2b50 4.3 Stars | Located in the food alley of Gukje Market, this iconic, long-standing food stall serves a highly representative local vegetarian comfort food: Dried Radish Greens Soup with Rice (Siraegi Gukbap). Slow-simmered with dried radish leaves and rich soybean paste, the broth is savory, sweet, and packed with dietary fiber. The radish greens are stewed until tender and melt-in-your-mouth soft. Served alongside fragrant white rice and homemade garlic-free vegan kimchi, this comforting dish is light on the stomach and offers an authentic taste of Busan\u0027s bustling local market culture.", "name": "Gukje Market Siraegi Gukbap (\u570b\u969b\u5e02\u5834\u8001\u5b57\u865f\u4e7e\u83dc\u6e6f\u98ef / \uad6d\uc81c\uc2dc\uc7a5 \uc2dc\ub798\uae30\uad6d\ubc25)", "transport": "Busan Metro Line 1, Jagalchi Station, Exit 7, about a 6-minute walk into Gukje Market."}, {"address": "8, Gudeok-ro 34beon-gil, Jung-gu, Busan", "feature": "\u2b50 4.4 Stars | Located near the Nampo-dong commercial district, this trendy, hip cafe specializes in healthy, low-carb, whole-food plant-based dining. Their signature \u0027Avocado \u0026 Chickpea Rainbow Warm Salad Bowl\u0027 is loaded with freshly sliced avocado, roasted bell peppers, purple rice, and flavorful roasted chickpeas, all drizzled with a rich homemade sesame dressing that delivers multi-layered flavors and a refreshing bite. They also offer dairy-free oat milk lattes and vegan smoothies, making it a popular spot for foodies and plant-based diners alike.", "name": "E-Eum Vegan Cafe \u0026 Bowl (\uc774\uc74c \u852c\u98df\u8f15\u98df\u5f69\u8679\u7897 / \uc774\uc74c)", "transport": "Busan Metro Line 1, Nampo Station, Exit 1, about a 3-minute walk."}, {"address": "10, Gwangbok-ro 55beon-gil, Jung-gu, Busan", "feature": "\u2b50 4.4 Stars | Tucked in the back alleys of Nampo-dong, this decades-old noodle shop is a summer favorite and a go-to spot for plant-based diners. The restaurant insists on using 100% locally grown Korean soybeans, freshly grinding them daily to create an incredibly rich and completely natural cold soybean broth with zero chemical additives. The chilled, creamy soup clings perfectly to the springy, chewy noodles. Each bite offers a rich, nutty soy flavor with a subtle touch of savoriness and sweetness, topped with fresh cucumber slices for a delightfully refreshing and filling summer meal.", "name": "Halmae Kongguksu (\u91dc\u5c71\u50b3\u7d71\u8001\u724c\u8c46\u6f3f\u9eb5 / \ud560\ub9e4\ucf69\uad6d\uc218)", "transport": "Busan Metro Line 1, Nampo Station, Exit 1 or 3, about a 5-minute walk."}, {"address": "5, Gwangbok-ro 67beon-gil, Jung-gu, Busan", "feature": "\u2b50 4.2 Stars | Located near the entrance of Yongdusan Park, this traditional Korean vegetarian diner specializes in temple-style dishes and wild mountain vegetable cuisine. Their signature \u0027Wild Vegetable Bibimbap\u0027 features five kinds of fresh mountain herbs, bellflower roots, bracken, and shiitake mushrooms served over hot steaming rice, drizzled with nutty sesame oil and special vegan gochujang sauce. With every bite, the fresh fragrance of wild herbs and fragrant sesame oil bursts on your palate. Crunchy, chewy, and full of flavor, it\u2019s a wonderful, energizing meal before or after visiting Busan Tower.", "name": "Yongdusan Wild Vegetable Bibimbap (\u9f8d\u982d\u5c71\u91ce\u83dc\u62cc\u98ef / \uc6a9\ub450\uc0b0 \uc0b0\ucc44\ube44\ube54\ubc25)", "transport": "Busan Metro Line 1, Nampo Station, Exit 7, about a 3-minute walk down the alley near the Yongdusan Park escalator."}, {"address": "Inside Bupyeong Kkangtong Market, 48 Bupyeong 1-gil, Jung-gu, Busan", "feature": "\u2b50 4.5 Stars | Situated inside Bupyeong Kkangtong Market, this traditional stall serves freshly fried mung bean pancakes\u2014a wildly popular plant-based street snack in the Nampo-dong area. Pure ground mung bean batter is mixed with bean sprouts, chopped kimchi, and bracken, then pan-fried on a hot griddle until golden and ultra-crispy. Hot off the griddle, it crackles on the outside while remaining dense, flavorful, and soft on the inside, with subtle nutty notes and a mild kimchi kick. Completely meat-free, it tastes even better dipped in the house-made onion soy sauce!", "name": "Jayeonsim Mung Bean Pancake (\u81ea\u7136\u5fc3\u852c\u98df\u7da0\u8c46\u9905 / \uc790\uc5f0\uc2ec \ub179\ub450\uc804)", "transport": "Busan Metro Line 1, Jagalchi Station, Exit 3 or 5, about an 8-minute walk into Kkangtong Market."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "36 Biff gwangjang-ro, Jung-gu, Busan", "feature": "\u2b50 4.3 stars | Busan\u0027s most famous traditional street sweet. Steaming glutinous rice dough is shallow-fried to golden, crispy perfection, then sliced open and packed with sunflower seeds, peanuts, pumpkin seeds, and brown sugar nut crumbles. Crispy on the outside and chewy on the inside, the molten brown sugar syrup blends with crunchy nuts for a rich sweet-and-savory bite\u2014a must-try hot snack that draws long lines of tourists and locals alike.", "name": "Original Seed Hotteok (BIFF Square Ssiat Hotteok)", "transport": "Metro Line 1 Jagalchi Station, Exit 7, about a 3-minute walk"}, {"address": "48 Bupyeong 1-gil, Jung-gu, Busan", "feature": "\u2b50 4.4 stars | A hugely popular tteokbokki stall inside Bupyeong Kkangtong Market, featured on famous Korean TV food shows. Its secret? Absolutely no added water\u2014the rich, spicy sauce is crafted solely from the natural sweet juice released by simmered shredded radish. The rice cakes are delightfully chewy, soaked in radish sweetness and spicy aromas. Pairing it with crispy tempura dipped in the sauce is pure bliss, leaving foodies craving more.", "name": "Lee Ga Tteokbokki", "transport": "Metro Line 1 Jagalchi Station, Exit 3, about a 7-minute walk"}, {"address": "54 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.2 stars | An iconic Busan fishcake shop crafting springy, preservative-free fishcakes from fresh fish paste. Served piping hot, these tender and bouncy snacks come with diverse fillings like cheese, rice cakes, octopus, and chili peppers. Reheating service and complimentary savory fishcake broth are available on-site, making it a comforting street food treat to warm your heart and belly on a chilly day.", "name": "Goraesa Fishcake (Nampo Branch)", "transport": "Metro Line 1 Nampo Station, Exit 1, about a 3-minute walk"}, {"address": "39 Bupyeong 1-gil, Jung-gu, Busan", "feature": "\u2b50 4.0 stars | A unique old-school Busan traditional street dish featuring chewy glass noodles tossed in a special spicy, savory sauce, topped with spinach, pickled radish strips, and shredded fishcake. Smooth, refreshing, and appetizing with a subtle hint of sesame oil, it perfectly embodies the resilient local culinary heritage born during the Korean War.", "name": "Bupyeong Market Bibim Dangmyeon (Spicy Glass Noodles)", "transport": "Metro Line 1 Jagalchi Station, Exit 5, about an 8-minute walk"}, {"address": "52 Jagalchi-ro, Jung-gu, Busan", "feature": "\u2b50 4.1 stars | Authentic street stalls surrounding Jagalchi Market famous for grilled hagfish prepared fresh to order. Seared over blazing charcoal and slathered in a bold spicy sauce, the eel meat is remarkably snappy and juicy with a smoky finish. Wrap a piece with perilla leaf and raw garlic slices for an explosion of flavor\u2014the ultimate way to soak up Busan\u0027s lively harbor atmosphere.", "name": "Jagalchi Grilled Eel Alley Stalls", "transport": "Metro Line 1 Jagalchi Station, Exit 10, about a 2-minute walk"}, {"address": "15 Bupyeong 3-gil, Jung-gu, Busan", "feature": "\u2b50 4.1 stars | Tucked away in a Bupyeong Market alleyway, this specialty stall simmers golden fried tofu pouches in giant iron pots filled with rich, flavorful broth. Each golden pouch is stuffed with glass noodles and seasoned minced meat; biting into one releases an explosion of savory broth. Paired with soft, chewy noodles and unlimited sweet fishcake soup, it\u0027s an addictive local comfort food.", "name": "Bupyeong Halmae Yubu Jeongol (Fried Tofu Pouch)", "transport": "Metro Line 1 Jagalchi Station, Exit 3, about an 8-minute walk"}, {"address": "32 BIFF gwangjang-ro, Jung-gu, Busan", "feature": "\u2b50 3.9 stars | A coastal Korean classic featuring plain white rice tightly wrapped in roasted seaweed, served alongside spicy seasoned squid/octopus and tangy radish kimchi. The fragrant rice rolls balance the fiery, zesty sides perfectly in alternating bites. Easy to carry and eat on the go, it\u0027s a popular staple for shoppers exploring the square.", "name": "BIFF Square Chungmu Gimbap", "transport": "Metro Line 1 Jagalchi Station, Exit 7, about a 3-minute walk"}, {"address": "38 Bupyeong 2-gil, Jung-gu, Busan", "feature": "\u2b50 4.0 stars | One of the most popular stalls at Bupyeong Kkangtong Night Market, serving paper-thin flat dumplings pan-fried to a golden crisp. They are smothered in piles of finely shredded cabbage and tossed in a punchy spicy sauce. The satisfying crunch of the skin combined with sweet cabbage and spicy dressing delivers fantastic texture\u2014a delightful must-eat night market snack.", "name": "Bupyeong Night Market Napjak Mandu (Flat Dumplings)", "transport": "Metro Line 1 Jagalchi Station, Exit 3, about a 7-minute walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Nampo-dong and Jagalchi Market"}, "seomyeon": {"categ
