        const db = {"gamcheon_yeongdo": {"categories": {"cat_1": {"items": [{"address": "141-1 Dongsam-dong, Yeongdo-gu, Busan", "feature": "\u2b50 4.4 stars | A decades-old traditional wheat noodle shop in Yeongdo. The broth is simmered for hours with medicinal herbs and pork bones, resulting in a refreshing and naturally sweet flavor. The noodles are springy and chewy, served with a secret spicy sauce and thick-cut pork slices. Savory and fragrant in every bite, it\u0027s a soul food favorite for locals and foodies visiting Yeongdo.", "name": "Dongsam-dong Halmeoni Milmyeon", "transport": "From Nampo Subway Station, take Bus 101 or 30 to Dongsam-dong Stop, then walk for about 3 minutes."}, {"address": "Gamji Beach, Dongsam-dong, Yeongdo-gu, Busan", "feature": "\u2b50 4.3 stars | A classic hub where active female divers (Haenyeo) catch, slice, and serve fresh seafood on the spot. Highlights include sea urchin, abalone, sea anemone, and sea urchin gimbap. Exceptionally fresh and sweet with a rich briny taste, enjoying this seafood on the rocky shore with Jinro Soju offers the most authentic local Busan fishing village experience.", "name": "Taejongdae Haenyeo Chon", "transport": "From Nampo Subway Station, take Bus 8, 30, or 88 to Taejongdae Terminus, then follow the signs and walk to Gamji Beach."}, {"address": "257 Taejong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.2 stars | Yeongdo\u2019s most iconic historic Korean-Chinese restaurant, renowned for its generous Seafood Jjambpong (spicy noodle soup). The soup boasts a smoky, fiery aroma and rich seafood flavor, loaded with a whole octopus, fresh shrimp, and plenty of shellfish. The chewy noodles absorb the spicy broth perfectly, earning rave reviews from visitors to Taejongdae.", "name": "Taejongdae Jjambpong", "transport": "Take Bus 8, 30, or 66 to Taejongdae Elementary School Stop, then walk for about 2 minutes."}, {"address": "2-35 Joong-ri-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.5 stars | A traditional seafood spot preserved by local divers for decades. A must-try is the \u0027Sea Urchin Gimbap,\u0027 featuring fresh sea urchin laid over warm rice rolls wrapped in seaweed. The sea urchin melts in your mouth like rich, creamy butter, pairing wonderfully with sesame oil-seasoned rice. It\u2019s a signature local secret highly recommended by Busan residents.", "name": "Yeongdo Haenyeo Cultural Center Seafood Stalls", "transport": "Take Bus 7, 9, or 71 to Jung-ri Stop, then walk for about 5 minutes toward the seaside cultural center."}, {"address": "12-1 Bongraeshijang-gil, Yeongdo-gu, Busan", "feature": "\u2b50 4.3 stars | A legendary pork soup restaurant inside the traditional Bongrae Market in Yeongdo. The milky-white broth is rich yet non-greasy, completely free of any gamey odor. Thick slices of tender pork melt in your mouth. Served with salted shrimp, chives, and special chive kimchi, a warm bowl is overflowing with authentic, heartwarming Busan tradition.", "name": "Bongrae Market Somunnan Dwaeji Gukbap", "transport": "From Nampo Subway Station Exit 6, take Bus 6, 7, 9, or 82 to Yeongdo Police Station Stop, then walk into Bongrae Market."}, {"address": "610 Jeoryeong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.4 stars | Established in 1985, this renowned hillside Korean BBQ institution in Yeongdo offers breathtaking Taejongdae ocean views. Featuring premium Hanwoo beef and signature marinated galbi, the succulent meat is grilled over charcoal to lock in smoky savory goodness. It remains a top-tier choice for family gatherings and VIP dining.", "name": "Mokjangwon", "transport": "Take Bus 7, 71, or 508 to Mokjangwon Stop for direct access."}, {"address": "203 Gamnae 2-ro, Saha-gu, Busan", "feature": "\u2b50 4.1 stars | Located in the heart of Gamcheon Culture Village, this specialty spot crafts traditional handmade fishcakes using a high proportion of real fish paste. Served piping hot, the chewy fishcake skewers soak up a sweet cabbage and kelp broth, bursting with savory juices in every bite. It is a comforting street snack favorite while exploring the vibrant village.", "name": "Gamnae Rest Area Traditional Eomuk", "transport": "From Toseong Subway Station Exit 6, transfer to local minibus Saha 1-1 or Seo-gu 2-2, and get off at Gamcheon Culture Village Stop."}, {"address": "301 Taejong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.2 stars | A cherished local restaurant in Yeongdo\u0027s Cheonghak-dong, specializing in handmade sundae (blood sausage) and pork offal soup. The dense, flavorful sundae is stuffed with glass noodles and aromatic herbs, rich without any gamey smell. Enjoyed dipped in coarse salt or salted shrimp, it delivers an authentic taste of Busan\u0027s working-class heritage.", "name": "Cheonghak-dong Traditional Sundaeguk", "transport": "Take Bus 8, 30, or 88 to Cheonghak Market Stop, then walk for about 3 minutes."}], "name": "Local Heritage Eateries"}, "cat_2": {"items": [{"address": "180 Haeyang-ro 195beon-gil, Yeongdo-gu, Busan", "feature": "\u2b50 4.5 stars | A massive multi-cultural complex located by the Yeongdo seaside, featuring striking geometric architecture and cascading floor-to-ceiling windows. It offers daily freshly baked exquisite pastries, such as flaky, rich croissants and strawberry tarts, along with a selection of specialty cold brews. Sitting in the spacious tiered seating area, you can enjoy unobstructed, magnificent views of Busan Port and ships coming and going, making it a favorite among both tourists and local youth.", "name": "P.ARK Cafe \u0026 Bakery", "transport": "Take Busan City Bus No. 66 or 186, get off at the National Institute of Maritime and Fisheries Development station, and walk for about 5 minutes."}, {"address": "28 Wabal-ro 29beon-gil, Yeongdo-gu, Busan", "feature": "\u2b50 4.4 stars | A trendy container-style cafe converted from an old steel factory, perched high on the mountaintop of Yeongdo offering stunning panoramic views. Their signature sparkling drinks and pour-over single-origin coffees feature unique flavors, paired perfectly with dense Basque burnt cheesecake that balances rich dairy and subtle caramel bitterness. At night, the outdoor terrace commands beautiful night views of the Busan Harbor Bridge and port, making its sleek industrial aesthetic a hot spot for social media check-ins.", "name": "Sinki Industry", "transport": "Take Green Local Bus Yeongdo 5 from Nampo Station and get off at Sinheung Blue Sky Apartment station."}, {"address": "20 Bongnaehang-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.6 stars | A branch founded by a World Barista Champion, housed in a converted old shipyard warehouse in Yeongdo. Soaring steel structures and massive professional roasters showcase a striking industrial aesthetic. Selecting top-tier single-origin beans globally, their pour-over coffee is rich in layers with a balanced sweetness and acidity. Paired with French croissants crisp on the outside and soft inside, it delivers an ultimate taste treat\u2014a true pilgrimage site for coffee lovers visiting Busan.", "name": "Momos Coffee Yeongdo Roastery \u0026 Coffee Bar", "transport": "Take Metro Line 1 to Nampo Station (Exit 8), transfer to Bus No. 8 or 88, get off at Bongnae Market station, and walk for about 8 minutes."}, {"address": "658 Taejong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.3 stars | A four-story large bakery cafe located on Yeongdo\u0027s eastern coastline, offering stunning views facing the blue ocean. The signature item is the exclusive \u0027Yeongdo Grandma Bread,\u0027 made with squid ink dough filled with rich cream that offers a chewy texture and sweet-savory flavor in every bite. Enjoying a fragrant cafe latte on the outdoor rooftop terrace with a sea breeze captures Busan\u0027s unique and relaxing island atmosphere.", "name": "Cafe 38.5", "transport": "Take Bus No. 8, 30, or 88 from Nampo Station, get off at Dongsam-dong Police Substation, and walk for about 3 minutes."}, {"address": "14-13 Cheonghak-dong, Yeongdo-gu, Busan", "feature": "\u2b50 4.2 stars | A retro-stylish crossover cafe created by the renowned eyewear brand CARIN, transforming a 5-story old building into a cozy space filled with Scandinavian design aesthetic. Their tiramisu and Black Forest cakes are silky and refined without being overly sweet, pairing delightfully with a smooth Viennese espresso. The rooftop terrace is one of the best photography spots to capture panoramic views of the Busan Harbor Bridge.", "name": "CARIN Yeongdo Place", "transport": "Take Busan Local Bus Yeongdo 5, get off at Cheonghak Assembly Hall station, and walk up the slope for about 2 minutes."}, {"address": "121 Okcheon-ro, Saha-gu, Busan", "feature": "\u2b50 4.1 stars | Situated near the entrance of Gamcheon Culture Village, boasting an unobstructed open-air viewing terrace. It serves various fresh fruit teas, velvety lattes, and classic American waffles. Crisp on the outside and fluffy inside, the waffles melt in your mouth when dipped in maple syrup and whipped cream. Visitors can savor brunch desserts while taking in 360-degree views of Gamcheon\u0027s colorful block-like village stacked along the mountain and the distant harbor.", "name": "Avant Garde Cafe", "transport": "From Exit 6 of Toseong Station (Metro Line 1), take Local Bus Saha 1-1, Seo-gu 2, or Seo-gu 2-2, get off at Gamcheon Culture Village station, and walk for about 1 minute."}, {"address": "177-ga Gamnae 2-ro, Saha-gu, Busan", "feature": "\u2b50 4.0 stars | A cozy, small cafe cooperatively run by local residents of Gamcheon Culture Village, converted from an old public bathhouse. It offers affordable traditional Korean citron tea, omija tea, and rich coffee, along with freshly baked Korean red bean egg bread featuring a crispy crust and a warm, sweet, dense filling. Sitting on the second-floor outdoor patio lets you gently blend into the relaxed daily life of this artistic village.", "name": "Gamnae Cafe", "transport": "From Exit 6 of Goejeong Station, take Local Bus Saha 1 or Saha 1-1, get off at Gamnae Market station, and walk for about 2 minutes."}, {"address": "172 Gamnae 2-ro, Saha-gu, Busan", "feature": "\u2b50 4.2 stars | A hidden gem cafe with incredible views tucked deep within the painted alleys of Gamcheon Culture Village. Famous for its terrace facing the iconic Little Prince mural, it serves aromatic siphon-brewed coffee and specialty matcha lattes paired with soft, sweet honey toast bursting with rich butter aroma. Sitting by the window while enjoying delicious treats and viewing the colorful terraced houses makes it the perfect resting and photo spot.", "name": "Cafe Wooin", "transport": "From Exit 6 of Toseong Station, take Local Bus Saha 1-1 to Gamcheon Culture Village station, and walk along the main street for about 5 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "2 Gamji-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.5 Stars | Located next to Gamji Beach in Taejongdae, this tented grill street is a favorite late-night drinking spot among Busan locals. Freshly grilled clams are generously layered with rich cheese and butter, filling the air with a tantalizing aroma over high-heat charcoal. With every bite, sweet seafood juices burst in your mouth. Paired with local Korean soju, it offers the ultimate way to experience Yeongdo\u0027s authentic coastal street-stall atmosphere.", "name": "Taejongdae Clam Tent Village (Taejongdae Jogaegui Village)", "transport": "Take Busan City Bus No. 8, 30, 88, or 101 to the \u0027Taejongdae (Bus Terminus)\u0027 stop, then walk about 8 minutes to Gamji Beach."}, {"address": "2-35 Jungrihaean-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.3 Stars | Yeongdo\u0027s iconic local open-air dining experience features fresh sea urchin, abalone, and sea urchin kimchi gimbap harvested directly from the sea by local female divers (Haenyeo). Golden, sweet sea urchin is generously piled atop seaweed rice rolls\u2014delivering a rich explosion of ocean flavors and aromatic rice with every bite. Paired with a glass of chilled Busan Makgeolli while listening to the waves, this is the most authentic taste of Yeongdo.", "name": "Yeongdo Haenyeo Cultural Center", "transport": "Take Bus No. 7, 70, or 508 to the \u0027Jungri\u0027 stop, then walk along the coastal trail for about 5 minutes."}, {"address": "65 Wachon-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.4 Stars | A long-standing local scenic restaurant boasting stunning Busan ocean views, combining charcoal-grilled Hanwoo beef with a fine dining and pub experience. Carefully selected premium native Korean beef sizzles over charcoal, creating a mouthwatering aroma and tender, juicy meat. Enjoy high-end, authentic cuisine paired with the restaurant\u0027s curated red wines or locally brewed stout while taking in sweeping views of the Pacific Ocean.", "name": "Mokjangwon", "transport": "Take Bus No. 7, 70, or 508 to the \u0027Mokjangwon\u0027 stop for direct access."}, {"address": "234 Jeoryeong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.2 Stars | An oceanfront bistro near Huinnyeoul Culture Village, offering unrivaled views of the blue ocean from the cliffside. The menu highlights local Italian-style Western dishes infused with fresh Busan seafood alongside handcrafted cocktails\u2014such as Creamy Shrimp Pasta and Pan-Seared Squid Rice. Rich in flavor and deeply layered, paired with refreshing alcoholic beverages, it is a highly recommended romantic date spot for young tourists and couples.", "name": "Yeongdo AETHER Ocean View Bistro (AETHER Bistro)", "transport": "Take Bus No. 7, 82, or 508 to the \u0027Huinnyeoul Culture Village\u0027 stop, then walk about 3 minutes."}, {"address": "2 Wachon-ro 214beon-gil, Yeongdo-gu, Busan", "feature": "\u2b50 4.3 Stars | A unique scenic bistro converted from shipping containers with an industrial steel aesthetic, situated at the peak of Yeongdo mountain overlooking the sweeping night views of Busan Port and Yeongdo Bridge. It offers special local craft beers, stouts, crispy fried chicken, and cheese platters. The crisp, slightly bitter beer pairs perfectly with golden, crunchy fried chicken, creating a fantastic atmosphere under the glittering night cityscape.", "name": "Sinki Industry", "transport": "Take Yeongdo-gu Village Bus No. 5 to the \u0027Sinki Industry\u0027 stop."}, {"address": "136 Gamnae 2-ro, Saha-gu, Busan", "feature": "\u2b50 4.1 Stars | Tucked beside the rainbow stairs of Gamcheon Culture Village, this quaint local eatery preserves the traditional flavors of the hillside community. The signature Mountain Vegetable Bibimbap features fresh local wild greens and special chili paste; mixed thoroughly, it offers a refreshing and rich taste. Paired with golden, crispy pajeon (scallion pancake) and a pot of cold makgeolli, it perfectly embodies the warm, nostalgic charm of Gamcheon\u0027s terraced village.", "name": "Gamcheon Culture Village Gamnae Restaurant", "transport": "Take Busan Metro Line 1 to Toseong Station (Exit 6), transfer to Saha-gu Minibus 1-1, 2, or 2-2 to the \u0027Gamcheon Culture Village\u0027 stop, and walk for 2 minutes."}, {"address": "99 Taejong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.2 Stars | A popular local pub-style eatery deeply rooted in Yeongdo for many years, loved by local residents and foodies alike. Specializing in spicy octopus, tripe, and shrimp stew (Nak-Gop-Sae) as well as braised pig\u0027s trotters, the fresh, tender octopus is simmered in a spicy, flavorful sauce that thickens as it cooks. Mixing it with rice is incredibly satisfying, and pairing it with Korean soju is the ultimate way to experience Busan\u0027s authentic local food culture.", "name": "Yeongdo Eunha Sikdang", "transport": "Take Metro Line 1 to Nampo Station (Exit 8), cross the Yeongdo Bridge, and walk for about 7 minutes."}, {"address": "180 Haeyang-ro 195beon-gil, Yeongdo-gu, Busan", "feature": "\u2b50 4.6 Stars | Busan\u0027s largest oceanfront cultural complex features an ultra-modern bistro \u0026 pub. It serves delicate local dishes made with fresh Yeongdo ingredients, such as grilled king prawn seafood platters and specially aged steaks, paired with local Busan independent craft beers. Expansive floor-to-ceiling windows offer panoramic ocean views, making for an exceptional overall dining experience.", "name": "Yeongdo P.ARK Dining \u0026 Pub", "transport": "Take Bus No. 186 or 66 to the \u0027National Maritime Museum\u0027 stop, then walk about 5 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "10-63 Gamcheon-dong, Saha-gu, Busan", "feature": "\u2b50 4.6 stars | A traditional vegan teahouse tucked away in the alleyways of Gamcheon Culture Village, famous for its naturally brewed Schisandra (Omija) tea and handmade red bean cakes. Soft and chewy mugwort rice cakes are coated in rich roasted soybean powder, offering a smooth, sweet bite that doesn\u0027t stick to your teeth. Paired with refreshing, slightly tart Omija juice, it\u0027s the perfect vegan snack for tourists needing a break while exploring the hillside trails.", "name": "Gamnae Dawon (\uac10\ub0b4\ub2e4\uc6d0)", "transport": "Take Saha-gu Mini-bus No. 1-1 from Exit 6 of Toseong Subway Station and get off at Gamcheon Culture Village Stop."}, {"address": "153 Bongnae-dong 2-ga, Yeongdo-gu, Busan", "feature": "\u2b50 4.8 stars | An industrial-chic cafe backed by a World Barista Champion, offering oat milk alternatives and plant-based vegan desserts for plant-based eaters. Their vegan brown sugar oat latte is exceptionally velvety and smooth, paired beautifully with plant-milk scones crisp on the outside and soft inside. The rich nutty grains blend seamlessly with the fruity acidity of the coffee beans, making it a hit with local hipsters and global tourists alike.", "name": "Momos Coffee Yeongdo (\ubaa8\ubaa8\uc2a4\ucee4\ud53c \uc601\ub3c4\uc810)", "transport": "Take Bus No. 82 or 85 from Exit 6 of Nampo Subway Station and get off at Bongnae Market Stop."}, {"address": "244 Jeoryeong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.5 stars | A vegan teahouse featuring stunning ocean views of Yeongdo, serving additive-free plant-based Korean teas and steamed pumpkin cakes. The pumpkin cake is light, fluffy, and smooth, with a subtle natural sweetness and delicate osmanthus aroma. Accompanied by house-blended warm jujube tea, it goes down smoothly, making it a favorite spot for visitors to enjoy a vegan afternoon tea while gazing out at the deep blue sea.", "name": "Yuenji Tea House (\uc778\uc5f0\ub2e4\uc6d0)", "transport": "Take Bus No. 7, 71, or 508 from Exit 6 of Nampo Subway Station and get off at Huinnyeoul Culture Village Stop."}, {"address": "115 Okcheon-ro, Saha-gu, Busan", "feature": "\u2b50 4.4 stars | A traditional local snack stall committed to using zero animal fats or additives, specializing in hot vegan red bean porridge and summer red bean shaved ice. The red beans are simmered to a lush, velvety texture while retaining distinct grains that melt in your mouth with a deep, soothing sweetness. Chewy handmade rice balls add a delightful texture, making this a popular old-school comfort food in Gamcheon Culture Village.", "name": "Gamcheon Red Bean Porridge (\uac10\ucc9c\ub2e8\ud325\uc8fd)", "transport": "Transfer to Saha-gu Mini-bus No. 1 from Exit 6 of Goejeong Subway Station and get off at Gamcheon Elementary School Stop."}, {"address": "102 Taejong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.7 stars | A signature fully vegan casual eatery in Yeongdo, renowned for its plant-meat avocado wraps and house-special soy yogurt bowls. The wrap is lightly seared and crispy, packed with tender plant-based meat and crunchy lettuce, topped with a custom vegan nut sauce. Refreshing, juicy, and dynamic in flavor, it is hugely popular among health-conscious youth and international travelers.", "name": "Green Vegan Kitchen Yeongdo (\uadf8\ub9b0\ube44\uac74\ud0a4\uce5c)", "transport": "Walk across Yeongdo Bridge from Exit 8 of Nampo Subway Station for about 10 minutes."}, {"address": "24 Jeonmang-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.3 stars | A traditional Korean temple cuisine restaurant near the entrance of Taejongdae, specializing in 100% onion/garlic-free (allium-free) vegan wild herb bibimbap and soybean paste soup. The mountain herbs are seasonal, tender, crisp, and wonderfully aromatic. Mixed into hot steamed rice with house-fermented savory soybean paste, it offers a rich flavor profile without any greasiness\u2014a top choice before exploring Taejongdae Resort Park.", "name": "Taejongdae Sanhae Vegetarian (\uc0b0\ud574\ucc44\uc2dd\ub2f9)", "transport": "Take Bus No. 8, 30, or 186 from Exit 6 of Nampo Subway Station, get off at Taejongdae Terminus, and walk for 5 minutes."}, {"address": "45 Sanrok-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.6 stars | A cozy home-style vegan restaurant at the foot of Mt. Bongrae in Yeongdo, featuring steamed pumpkin set meals and acorn jelly (dotorimuk). The acorn jelly is springy and silky, drizzled with special sesame soy sauce and cilantro for an ultra-refreshing taste with a subtle sweet-bitter finish. The pumpkin set displays a pure, natural sweetness that is wholesome and light, highly recommended by local regulars.", "name": "Bongraesan Cheongshim Vegetarian Rice (\uccad\uc2ec\ucc44\uc2dd\ubc25\uc0c1)", "transport": "Take Bus No. 9 from Exit 6 of Nampo Subway Station, get off at Yeongdo-gu Office Stop, and walk for 8 minutes."}, {"address": "71 Gamcheon-ro, Saha-gu, Busan", "feature": "\u2b50 4.5 stars | A highly-rated plant-based Korean full-course (Hanjeongsik) restaurant in the Gamcheon area, offering a colorful variety of vegetarian side dishes and pan-fried lotus root patties. The lotus root patties feature a crispy exterior with a dense, savory center laced with subtle ginger and shiitake mushroom aromas. Paired with house-brewed sweet rice punch (sikhye) and purple rice, its rich and satisfying flavor profile earns high praise even from non-vegetarians.", "name": "Gamnyeong Sanchae Vegetarian (\uac10\ub839\uc0b0\ucc44\uc6d0)", "transport": "Transfer to Community Bus No. 1-1 from Toseong Subway Station and get off at Gamcheon Market Stop."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "144 Gamnae 2-ro, Saha-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc0ac\ud558\uad6c \uac10\ub0b42\ub85c 144)", "feature": "\u2b50 4.6 stars | An unmissable signature walking dessert when visiting Gamcheon Culture Village! Deep-fried to elastic, golden perfection, taking a bite releases rich, warm brown sugar syrup packed with sunflower seeds, pumpkin seeds, and peanuts. Crispy on the outside, soft on the inside, with a sweet, nutty crunch that isn\u0027t cloying\u2014the perfect treat to enjoy while taking photos around the colorful hillside village.", "name": "Gamcheon Seed Hotteok (\uac10\ucc9c \uc528\uc557\ud638\ub5a1)", "transport": "Take Busan Metro Line 1 to Toseong Station (Exit 6), transfer to minibus Saha-gu 1-1, Seo-gu 2, or Seo-gu 2-2, and get off at Gamcheon Culture Village Stop."}, {"address": "115 Gamnae 2-ro, Saha-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc0ac\ud558\uad6c \uac10\ub0b42\ub85c 115)", "feature": "\u2b50 4.4 stars | A cozy, popular street snack found along the stepped alleys of Gamcheon. Made fresh with a high proportion of real fish paste, these skewers are firm, springy, and bursting with umami\u2014far superior to flour-heavy alternatives. Paired with house-brewed hot fish broth infused with savory radish, sipping hot soup and enjoying chewy fishcakes in the breezy village is loved by both locals and tourists.", "name": "Gamcheon Handmade Fishcake (\uac10\ucc9c \uc218\uc81c\uc5b4\ubb35)", "transport": "Take Busan Metro Line 1 to Goejeong Station (Exit 6), transfer to minibus Saha-gu 1 or Saha-gu 1-1, and get off at Gamcheon Culture Village Entrance Stop."}, {"address": "186 Gamnae 2-ro, Saha-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc0ac\ud558\uad6c \uac10\ub0b42\ub85c 186)", "feature": "\u2b50 4.5 stars | A retro shop hidden among the rainbow-colored houses, specializing in traditional Korean shaved ice desserts. The fine, fluffy snow ice is topped with house-simmered whole red beans and chewy rice cakes. Rich and nutty without being overly sweet, it\u0027s drizzled with condensed milk and aromatic roasted soybean powder (injeolmi) for marvelous layers of flavor. A refreshing must-stop oasis for visitors strolling around on warm summer days.", "name": "Gamcheon Traditional Red Bean Shaved Ice (\uac10\ucc9c \ud325\ube59\uc218)", "transport": "Take Busan Metro Line 1 to Toseong Station (Exit 6), transfer to minibus Seo-gu 2, get off at Gamcheon Elementary School Stop, and walk about 2 minutes."}, {"address": "2-35 Jungrihaean-ro, Yeongdo-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc601\ub3c4\uad6c \uc911\ub9ac\ud574\uc548\ub85c 2-35)", "feature": "\u2b50 4.7 stars | A unique seaside market snack on Yeongdo Island, famous for combining freshly harvested seafood gathered by traditional female divers (Haenyeo) with freshly made kimbap. Pairing aromatic sesame oil kimbap with a piece of raw sea urchin or sliced octopus creates magic: the sea urchin melts like butter on your tongue, unleashing pure sweetness complemented by chewy rice and crunchy pickled radish. An unforgettable coastal culinary icon.", "name": "Yeongdo Haenyeo Culture Center Kimbap (\uc601\ub3c4\ud574\ub140\ubb38\ud654\uc804\uc2dc\uad00)", "transport": "Take Busan Metro Line 1 to Nampo Station (Exit 6), transfer to Bus 7 or 508, get off at Jungri Beach Stop, and walk about 5 minutes."}, {"address": "244 Jeoryeong-ro, Yeongdo-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc601\ub3c4\uad6c \uc808\uc601\ub85c 244)", "feature": "\u2b50 4.3 stars | The most eye-catching oceanfront snack stand in Huinnyeoul Culture Village! Outdoor ocean-facing seats offer panoramic views of the deep blue sea. The freshly cooked spicy Korean ramen comes loaded with prawns and clams, making the broth savory and spicy. Paired with specialty kimbap rolled with fragrant sesame oil and spicy filling, enjoying piping hot ramen in the refreshing sea breeze draws long queues of eager travelers.", "name": "Huinnyeoul Jeombang Ocean View Ramen (\ud770\uc5ec\uc6b8\uc810\ube75)", "transport": "Take Busan Metro Line 1 to Nampo Station (Exit 6), transfer to Bus 8, 30, or 82, get off at Huinnyeoul Culture Village Stop, and walk about 3 minutes."}, {"address": "816 Taejong-ro, Yeongdo-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc601\ub3c4\uad6c \ud0dc\uc885\ub85c 816)", "feature": "\u2b50 4.2 stars | A long-standing street snack stall at the entrance of Taejongdae Resort Park. Whole fresh squid is slathered in rich butter and a special honey sauce, then grilled on a flat top until golden and charred. Crispy on the edges yet tender and chewy inside, it offers a lingering sweet-and-savory buttery aroma. Grabbing a bag to snack on while heading into Taejongdae is a nostalgic local experience for visitors.", "name": "Taejongdae Butter Grilled Squid Stall (\ud0dc\uc885\ub300 \ubc84\ud130\uc624\uc9d5\uc5b4\uad6c\uc774)", "transport": "Take Busan Metro Line 1 to Nampo Station (Exit 6), transfer to Bus 8, 30, or 66, and get off at Taejongdae Terminal to reach the park entrance."}, {"address": "49 Daeping-ro, Yeongdo-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc601\ub3c4\uad6c \ub300\ud3c9\ub85c 49)", "feature": "\u2b50 4.4 stars | A beloved traditional market pastry stall cherished by Yeongdo locals. Known for old-school Korean twisted doughnuts (kkwabeogi) and corn dogs. The freshly fried doughnuts are dusted with fine white sugar\u2014crispy on the outside, light and fluffy like cotton candy inside, with rich egg and wheat aromas. The corn dogs feature thick batter wrapped around a big sausage, crispy, tender, and deeply satisfying. Enjoy authentic market comfort food for just a few coins!", "name": "Yeongdo Bongnae Market Traditional Doughnut \u0026 Hotdog (\uc601\ub3c4 \ubd09\ub0b4\uc2dc\uc7a5 \ub3c4\ub108\uce20)", "transport": "Take Busan Metro Line 1 to Nampo Station (Exit 8), cross Yeongdo Bridge, and walk about 8 minutes to enter Bongnae Market."}, {"address": "35 Gamjihaean-ro, Yeongdo-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uc601\ub3c4\uad6c \uac10\uc9c0\ud574\uc548\ub85c 35)", "feature": "\u2b50 4.6 stars | Iconic open-air seafood stalls located along Taejongdae\u0027s pebble beach. Clams, abalones, and scallops are grilled right over charcoal, drizzled with butter, signature Korean spicy sauce, and generous melted cheese. Juicy, plump seafood sizzling over hot coals combined with savory cheese and the sound of waves crashing against pebbles draws foodies from afar for an incredible sensory feast.", "name": "Taejongdae Jagalmadang Grilled Seafood Snacks (\ud0dc\uc885\ub300 \uc790\uac08\ub9c8\ub2f9 \uc870\uac1c\uad6c\uc774)", "transport": "Take Busan Metro Line 1 to Nampo Station (Exit 6), transfer to Bus 8 or 30 to Taejongdae Terminal, then walk about 10 minutes along the Gamji Coastal Trail to reach the pebble beach."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Gamcheon Culture Village and Yeongdo Taejongdae"}, "gijang_lotte": {"categories": {"cat_1": {"items": [{"address": "10 Eupnae-ro 104beon-gil, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.6 Stars | A decades-old staple inside Gijang Market specializing in king crab and snow crab, highly recommended by both tourists and locals alike. Crabs are selected fresh from the tanks upon ordering and steamed in giant high-pressure steam kettles. The crab meat is plump, springy, and naturally sweet, while the crab paste is rich and velvety smooth. The most popular way to finish your meal is having the rich crab paste stir-fried with white rice, Korean sesame oil, and shredded seaweed into \u0027Crab Paste Fried Rice\u0027, served right back inside the crab shell\u2014an unforgettable depth of fresh seafood flavor.", "name": "Cheonghae Snow Crab (\uae30\uc7a5 \uccad\ud574\uc655\uac8c)", "transport": "Take the Donghae Line to Gijang Station (Exit 1) and walk about 8 minutes into Gijang Market."}, {"address": "553-1 Sirang-ri, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.5 Stars | A centuries-old local specialty unique to Gijang, utilizing high-temperature straw fires to flash-roast live hagfish, sealing in their succulent juices and smoky straw aroma. After peeling off the charred outer skin, the hagfish meat inside is incredibly springy, tender-crisp, and juicy with a distinct charcoal scent. Guests can enjoy it plain dipped in sesame oil and salt, or stir-fried with a special spicy sauce and wrapped in fresh perilla leaves and garlic. Packed with authentic local flavor, this is an ancient culinary experience you cannot miss in East Busan.", "name": "Gijang Haebyeon Jipbul Gomjangeo (\uae30\uc7a5\ud574\ubcc0\uc9da\ubd88\uacf0\uc7a5\uc5b4)", "transport": "From Songjeong Station (Donghae Line), transfer to Bus 139, get off at \u0027Sirang-ri Entrance\u0027 (\uc2dc\ub791\ub9ac\uc785\uad6c) stop, and walk about 5 minutes."}, {"address": "119-1 Yeonhwa-ri, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.7 Stars | An iconic gathering spot of haenyeo (female divers) stalls along the Yeonhwa-ri coast in Gijang, famous far and wide for its thick abalone porridge cooked fresh to order in traditional brass pots. Slow-cooked with fresh abalone viscera, the deep-green porridge has a velvety smooth texture bursting with rich ocean flavor, generously filled with large, chewy abalone slices in every bite. Enjoying this alongside raw seafood platters\u2014sea urchins, sea anemones, and sea cucumbers gathered by the haenyeo themselves\u2014while gazing at the ocean makes for East Busan\u0027s most representative traditional fishing village dining experience.", "name": "Yeonhwari Haenyeo Village Abalone Porridge (\uc5f0\ud654\ub9ac \ud574\ub140\ucd0c \uc804\ubcf5\uc8fd)", "transport": "About a 7-minute taxi ride from Haedong Yonggungsa Temple; or take Bus 181 to \u0027Yeonhwa-ri\u0027 stop and walk for 3 minutes."}, {"address": "71 Daebyeonhang-gil, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.4 Stars | A renowned long-standing establishment located at Gijang Daebyeon Port, specializing in Gijang\u0027s signature local delicacy: \u0027Giant Anchovy Cuisine\u0027. Unlike small anchovies, the giant anchovies here are plump, tender, and succulent. The restaurant debones fresh anchovies and tosses them with shredded cabbage and a house-made Korean spicy-sour vinegar sauce to create \u0027Raw Anchovy Salad\u0027, offering a crisp, tangy, and non-fishy taste. Additionally, the slow-simmered \u0027Braised Anchovy Stew\u0027 and crispy \u0027Fried Anchovies\u0027 are local foodie favorites, showcasing the authentic seafood culture of Gijang\u0027s traditional port.", "name": "Ehwajang Raw Fish Restaurant - Anchovy Dishes (\uc774\ud654\uc7a5\ud69f\uc9d1)", "transport": "Take Bus 181 to \u0027Daebyeon Port\u0027 stop and walk about 2 minutes."}, {"address": "14 Chaseong-ro 417beon-gil, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.3 Stars | A classic rustic culinary restaurant nestled inside a traditional Hanok complex in Gijang, offering a serene and quaint Korean garden atmosphere. The signature dish, \u0027Yellow Clay Kiln Roasted Duck\u0027, involves roasting a whole premium duck at high temperatures inside a custom yellow clay kiln for several hours. This results in a thin, crispy skin while locking in the juices, leaving the meat tender, moist, and infused with mild herbal and earthy roasted aromas. Served with over a dozen refined traditional Korean side dishes (banchan) and soybean paste stew, dining here feels like enjoying a royal banquet in a noble Korean estate of old.", "name": "Heuksiru - Yellow Clay Kiln Roasted Duck (\ud759\uc2dc\ub8e8)", "transport": "Take the Donghae Line to Gijang Station, then take a taxi for about 5 minutes."}, {"address": "62 Songjeonggwangyeog-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.5 Stars | A highly popular, queue-worthy noodle house near Songjeong Beach in East Busan, renowned for crafting its noodles daily using freshly ground wheat and traditional methods. Its signature \u0027Noodle Soup\u0027 features a light, sweet dashi broth brewed with generous amounts of anchovies and kelp, paired with exceptionally springy and chewy noodles. The unique handmade \u0027Fresh Mandu\u0027 (steamed dumplings) feature paper-thin skins stuffed with savory, juicy meat filling. Complemented by spicy mixed raw fish cold noodles and Korean gimbap, it offers artisanal quality at affordable prices, beloved by both local families and tourists.", "name": "Songjeongjip Traditional Handmade Noodle House (\uc1a1\uc815\uc9d1)", "transport": "Take the Donghae Line to Songjeong Station (Exit 2) and walk for about 7 minutes."}, {"address": "16 Eupnae-ro 104beon-gil, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.4 Stars | Tucked away inside Gijang Traditional Market for over 40 years, this old-school handmade noodle shop is a true local institution. The owner insists on hand-kneading and knife-cutting the dough daily, producing noodles of rustic, uneven thickness bursting with handmade warmth and chewy texture. The soul-soothing broth is simmered with local Gijang anchovies, enhanced with plentiful chives, perilla powder, and a signature spicy seasoning paste, creating a rich, flavorful, and slightly spicy soup. Generous portions at extremely wallet-friendly prices make this a heartwarming comfort food that locals have grown up on.", "name": "Gijang Wonjo Son-kalguksu (\uae30\uc7a5\uc6d0\uc870\uc190\uce7c\uad6d\uc218)", "transport": "Take the Donghae Line to Gijang Station (Exit 1) and walk about 6 minutes into Gijang Market."}, {"address": "308 Ilgwang-ro, Ilgwang-myeon, Gijang-gun, Busan", "feature": "\u2b50 4.6 Stars | A flagship destination along the Ilgwang coast in Gijang, famous for its long lines and iconic cockle and beef dishes. The signature \u0027Large Tray Cockle \u0026 Beef Bibimbap\u0027 visually stuns by covering a giant bamboo platter with fresh mud cockles, spicy stir-fried beef, and seasoned rice. The cockles are plump, springy, fresh, and free of fishiness; when mixed with the signature sauce and wrapped in crispy seaweed or fresh lettuce, the layers of flavor are extraordinary. Combined with an unobstructed sea view, it is a renowned hot spot blending traditional local seafood with modern deliciousness.", "name": "Bareut Sikdang - Cockle Bibimbap (\ubc14\ub987\uc2dd\ub2f9)", "transport": "Take the Donghae Line to Ilgwang Station (Exit 1), then take a taxi for about 6 minutes."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "286 Haean-ro, Jangan-eup, Gijang-gun, Busan", "feature": "\u2b50 4.6 Stars | As the pioneer of ocean-view cafes in Gijang, it features step-terraced architecture designed by an award-winning architect, offering an unobstructed 270-degree view of the blue ocean through floor-to-ceiling glass walls. The signature pour-over specialty coffee carries delicate citrus acidity, perfectly paired with a rich, sweet Mont Blanc chestnut tart and freshly baked croissants that offer a captivating crisp-yet-soft texture. The spacious outdoor daybed area is a favorite spot for both tourists and locals to relax, stroll, and enjoy a breezy afternoon tea.", "name": "Waveon Coffee (\uc6e8\uc774\ube0c\uc628 \ucee4\ud53c)", "transport": "Take the Donghae Line to Ilgwang Station, then take a taxi for about 15 minutes; or take Bus 180 and get off at \u0027Seosaengposeong Fortress\u0027 stop, then walk."}, {"address": "7-10 Chilamhaean-ro, Ilgwang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.7 Stars | Created by Korean Master Baker Lee Heung-yong, this immensely popular mega garden cafe took all of Busan by storm with its legendary \u0027Salt Bread\u0027 (Salt Croissant). Freshly baked salt croissants feature an ultra-crispy golden crust that bursts with rich buttery aroma upon first bite, accompanied by a soft, chewy interior perfectly balanced with subtly salty rock salt. Pair it with house-made cold brew coffee for a delightfully crisp taste. Combining Japanese garden aesthetics with stunning ocean views, it draws endless crowds of foodies lining up every day.", "name": "Chilam Saagye (\uce60\uc554\uc0ac\uacc4)", "transport": "Take the Donghae Line to Ilgwang Station, then take a taxi for about 10 minutes, or take a Gijang-gun local village bus towards Chilam Port."}, {"address": "32 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.5 Stars | Located near Haedong Yonggungsa Temple, this massive four-story ocean-view cafe is famous for its terraced outdoor beanbag seating. The brunch platter here features crisp-on-the-outside, soft-on-the-inside French toast, seared bacon, and fresh salad, drizzled with special maple syrup for a delightful sweet-and-savory profile. The signature \u0027Coral Blue Sea Salt Latte\u0027 tops smooth cream with a hint of subtle salinity\u2014visually stunning and rich in flavor. It is an ideal spot to relax after visiting Lotte World Adventure Busan or Haedong Yonggungsa Temple.", "name": "Coralani (\ucf54\ub784\ub77c\ub2c8)", "transport": "Take Bus 1001, 100, or 181 and get off at \u0027Haedong Yonggungsa Temple / National Institute of Fisheries Science\u0027 stop, then walk about 8 minutes."}, {"address": "34-16 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.4 Stars | Nestled on a headland where Songjeong Beach meets Gijang, this hidden ocean-view cafe is surrounded by lush pine forests and surrounded by the sea on three sides. The signature Banana Cheese Tart offers a dense, smooth texture rich in creamy dairy and natural fruit aroma, perfectly encased in a flaky, non-greasy crust. Pairing it with a deep dark roast coffee creates a wonderful contrast of bitterness and sweetness. Sitting on the rooftop open terrace lets you admire waves crashing against the rocks, making it a favorite among couples and photography enthusiasts.", "name": "Cafe Yoon (\uce74\ud398\uc724)", "transport": "Take a taxi for about 5 minutes from Songjeong Beach, or take Bus 181 and get off at \u0027Songjeong 2-daegyo Bridge\u0027, then walk about 12 minutes."}, {"address": "354 Ilgwang-ro, Ilgwang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.6 Stars | Designed around the concept of an \u0027Ocean Theater,\u0027 this striking architectural gem boasts a massive ocean-facing amphitheater seating area with expansive floor-to-ceiling panoramic windows. The bakery\u0027s star offering, the Cream Strawberry Tart, features smooth custard cream and juicy, sweet strawberries over a crispy crust. The specialty Lime Ade is refreshing, zesty, and effervescent\u2014the perfect summer refresher. The ever-changing light over the breathtaking coastline makes guests feel like they are watching a blockbuster cinematic masterpiece.", "name": "Gritvi Ilkwang (\uadf8\ub9bf\ube44 \uc77c\uad11)", "transport": "Take the Donghae Line to Ilgwang Station (Exit 2), then take a taxi for about 7 minutes."}, {"address": "864 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.5 Stars | Radiating Jeju Island charm with its minimalist stone-wall architecture built along the Gijang coastline, this modern cafe offers a sleek yet cozy vibe. Its popular bakery item, the \u0027Butter Russian Bread\u0027, boasts a lightly crispy exterior and an incredibly fluffy interior, filling every bite with rich, savory butter aroma. Paired with a smooth oat milk latte, it delivers a wonderful depth of flavor. Horizontal picture windows frame the turquoise sea perfectly, making it an ultimate Instagram-worthy hotspot.", "name": "Peak Square (\ud53c\ud06c\uc2a4\ud018\uc5b4)", "transport": "Take Bus 180 and get off at \u0027Sinam\u0027 stop, then walk about 5 minutes; or take a taxi for about 12 minutes from Donghae Line Gijang Station."}, {"address": "98 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.3 Stars | Located in the Osiria Complex of East Busan, this spacious cafe boasts an American vintage industrial aesthetic featuring high ceilings, antique furniture, and lush greenery. The brunch menu offers freshly made \u0027Steak French Panini\u0027\u2014crisp on the outside, tender inside, packed with juicy beef and melted cheese for a hearty, savory treat. Paired with house-roasted dark espresso that finishes with notes of dark chocolate and toasted nuts, it is a hugely popular stop for visitors coming from Lotte World.", "name": "Cafe De 220VOLT Osiria (\uce74\ud398\ub4dc220\ubcfc\ud2b8 \uc624\uc2dc\ub9ac\uc544)", "transport": "Take the Donghae Line to Osiria Station (Exit 1), then walk about 15 minutes or take a 3-minute taxi ride."}, {"address": "860 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.6 Stars | Featuring a sprawling green lawn and sleek white modern architecture, this oceanfront brunch cafe oozes relaxed resort vibes. The popular \u0027Basil Cheese Focaccia\u0027 has a wonderfully chewy, springy dough infused with aromatic basil and savory olive oil, tasting sweeter and richer with every bite. Pair it with a cold brew White Peach Oolong Tea for a crisp, sweet finish. The spacious outdoor seating area provides unobstructed ocean views, making it an iconic sanctuary for relaxation in East Busan.", "name": "Off.O (\uc624\ud504\uc624)", "transport": "Take Bus 180 and get off at \u0027Sinam\u0027 stop, then walk about 6 minutes; or take a taxi for about 10 minutes from Gijang Station."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "16, Eubnae-ro 104beon-gil, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uc74d\ub0b4\ub85c104\ubc88\uae38 16)", "feature": "\u2b50 4.4 stars | Located inside Gijang Market, this iconic seafood establishment is famous for its ultimate delicious steamed snow crabs and king crabs. Steamed fresh to order, the crab meat is plump, bouncy, juicy, and sweet, carrying a subtle hint of ocean salinity that fills your palate with rich marine flavors. Gastronomes rave about the Crab Paste Fried Rice\u2014made by mixing rich crab butter with sesame oil, seaweed, and rice\u2014boasting a dense, savory texture. Paired with abundant complementary Korean side dishes and crab leg soybean paste soup, it\u0027s impossible to stop eating. The bustling market atmosphere and friendly cooking service make this a top choice for tourists and Busan locals celebrating special occasions.", "name": "Gijang Daege Crab (\uae30\uc7a5\ub300\uac8c)", "transport": "Approx. 5-minute walk from Exit 1 of Gijang Station on the Donghae Line"}, {"address": "368-1 Sirang-ri, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uc2dc\ub791\ub9ac 368-1)", "feature": "\u2b50 4.2 stars | Located near Haedong Yonggungsa Temple and Lotte World, this prestigious traditional royal-style Han-jeongsik (Korean full-course dinner) restaurant in Gijang serves lavish tables packed with authentic local Busan specialties. Main dishes offer choices like aromatic soy sauce marinated crab, flame-grilled pork, or grilled yellow croaker. Accompanying side dishes exceed a dozen varieties, including silky steamed eggs, sweet seasonal vegetables, and signature kimchi, served alongside sticky, fragrant sorghum stone pot rice woven with mushroom aromas. Housed in a rustic and elegant traditional Hanok, it is immensely popular among families and tourists who can enjoy a lavish Korean feast in a warm, classical atmosphere.", "name": "Pungwonjang Sigol Babsang (\ud48d\uc6d0\uc7a5 \uc2dc\uace8\ubc25\uc0c1\uc9d1)", "transport": "Take Bus 1001 or 139 to \u0027Haedong Yonggungsa Temple Entrance\u0027 stop, then walk about 7 minutes"}, {"address": "10F, Ananti Hilton, 268-32 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uae30\uc7a5\ud574\uc548\ub85c 268-32)", "feature": "\u2b50 4.5 stars | Perched on the top floor of the luxury resort Ananti Cove, this premier oceanfront bar and lounge commands an unobstructed 270-degree panorama of the East Sea. The interior features sleek wooden arches and modern luxury aesthetics, creating an unmatched ambience. It serves high-caliber grilled seafood platters, premium aged steaks, and exquisite craft cocktails. The grilled seafood is crispy outside, tender inside, with succulent lobsters and scallops elevated by custom sauces. As night falls, gentle waves and candlelight draw couples and visitors seeking high-end luxury, making it East Busan\u0027s most iconic romantic date spot.", "name": "McQueen\u0027s Bar at Ananti Cove (\ub9e5\ud038\uc988 \ubc14)", "transport": "About a 10-minute taxi ride from Songjeong Station (Donghae Line), or take Bus 1001 to Osiria Station and transfer to a local neighborhood bus"}, {"address": "482 Cheolma-ro, Cheolma-myeon, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \ucca0\ub9c8\uba74 \ucca0\ub9c8\ub85c 482)", "feature": "\u2b50 4.3 stars | Cheolma-myeon in Gijang-gun is Busan\u0027s most famous origin of premium Hanwoo beef, featuring a cluster of specialized regional eateries serving top 1++ grade Hanwoo. Grilled directly over charcoal, the marbling of the Hanwoo beef is breathtakingly perfect; a quick sear seals in the intense juices, creating a melt-in-your-mouth tender texture infused with rich, pure beef aroma. Served alongside house-blended seasoned salt, fresh lettuce wraps, and local wild mountain vegetable side dishes, the meal perfectly cuts through the fat. Deeply loved by local epicures and visiting meat enthusiasts, this is a must-visit destination to experience Busan\u0027s top-tier beef culture.", "name": "Cheolma Hanwoo Village (\ucca0\ub9c8\ud55c\uc6b0\ub9c8\uc744)", "transport": "Approx. 20-minute taxi ride from Nopo Station (Subway Line 1), or take Geumjeong-gu Local Bus No. 2-1"}, {"address": "119-2 Yeonhwa-ri, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uc5f0\ud654\ub9ac 119-2)", "feature": "\u2b50 4.4 stars | Located along the coast of Yeonhwa-ri in Gijang, these traditional seafood stalls and regional eateries serve fresh catches harvested directly by local Haenyeo (female divers). The signature \u0027Assorted Seafood Platter\u0027 includes sea urchin, abalone, sea cucumber, live octopus, and sea squirt, boasting a crisp, sweet texture packed with ocean flavor\u2014best enjoyed dipped in sesame oil salt or chogochujang (vinegar red pepper paste). A must-order after the raw seafood is the \u0027Earthenware Pot Abalone Porridge\u0027 with its rich, vibrant green hue; the rice is simmered until velvety smooth with a fragrant sesame oil aroma, warming your stomach and satisfying your soul. A local Gijang dining experience no seafood lover should miss.", "name": "Yeonhwari Haenyeo Seafood Village (\uc5f0\ud654\ub9ac \ud574\ub140\ucd0c)", "transport": "Take Bus 181 or 1003 to \u0027Yeonhwa-ri\u0027 stop, then walk about 3 minutes"}, {"address": "154 Jukseong-ri, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uc8fd\uc131\ub9ac 154)", "feature": "\u2b50 4.1 stars | Situated near the famous Jukseong Dream Church, this is the most authentic coastal sea eel restaurant in Gijang. Freshly caught sea eels are grilled over charcoal until the skin is lightly charred and crispy, while the meat remains chewy, firm, and collagen-rich. Served with secret spicy sauce or simply salt-grilled, wrapping the eel in perilla leaves with sliced ginger removes any greasiness and explodes with aroma. Highly favored by locals for its rich nutritional value and uniquely tender-chewy texture, enjoying sizzling grilled eel by the harbor while admiring the fishing port view offers a truly quintessential local flavor.", "name": "Jukseong Sea Eel Restaurant (\uc8fd\uc131\ubb35\uc740\uc9c0\uc7a5\uc5b4\uad6c\uc774)", "transport": "From Gijang Station, transfer to Gijang-gun Local Bus No. 6, get off at \u0027Jukseong Dream Church\u0027 stop, and walk about 5 minutes"}, {"address": "393-7 Daebyeon-ri, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \ub300\ubcc0\ub9ac 393-7)", "feature": "\u2b50 4.2 stars | Large fresh anchovies, a prized specialty of Gijang, are nationally renowned in Korea. This local restaurant specializing in anchovy rice wraps slow-simmers large anchovies with special spicy Korean sauce, pickled plums, and vegetables. Simmered until the bones are soft and the meat tender without any fishiness, the succulent anchovies absorb the sweet and savory spicy sauce. Wrapped in fresh lettuce, perilla leaves, and warm white rice, layered aromas and crisp textures burst in every bite. Accompanied by steaming hot anchovy broth, it showcases deep traditional fishing village heritage and attracts endless food lovers.", "name": "Miroga Gijang Anchovy Wrap (\ubbf8\ub85c\uac00 \uba78\uce58\uc308\ubc25)", "transport": "Take Bus 181 to \u0027Daebyeon Port\u0027 stop, then walk about 4 minutes"}, {"address": "135 Hwarim-ri, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \ud654\ub9bc\ub9ac 135)", "feature": "\u2b50 4.3 stars | Nestled at the quiet foot of a mountain in Gijang, this traditional Hanok garden restaurant specializes in healthy yellow mud clay kiln-roasted duck and steamed duck with sweet pumpkin. Premium duck stuffed with dozens of medicinal herbs and glutinous rice is slow-roasted in a yellow clay kiln until the skin turns golden-crispy and the tender meat effortlessly pulls off the bone, infusing a delicate herbal and charcoal aroma. Served with exquisite side dishes and refreshing cold noodles that balance the meal. Featuring classical Hanok architecture and elegant gardens, dining here offers a sophisticated, historic charm\u2014an exceptional place to sample traditional high-end local health cuisine.", "name": "Heoksiru Mud Duck Dining (\ud759\uc2dc\ub8e8)", "transport": "About an 8-minute taxi ride from Gijang Station (Donghae Line)"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "122 Gijang-daero, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uae30\uc7a5\ub300\ub85c 122)", "feature": "\u2b50 4.3 stars | Located in Gijang, this traditional yellow-earth folk village style restaurant specializes in health-conscious vegetarian Han-jeongsik (Korean full-course meal). Its signature Lotus Leaf Rice wraps glutinous rice, black beans, pine nuts, jujubes, and chestnuts in a fresh lotus leaf before steaming over high heat. Opening the leaf releases a refreshing herbal aroma, while the rice is delightfully soft, chewy, and subtly sweet. Accompanied by dozens of seasonal side dishes made from locally harvested wild vegetables, rich soybean sauce, and refreshing acorn jelly, it offers rich layers of flavor that are hugely popular among tourists seeking natural tastes and health-conscious local seniors.", "name": "Heuksiru - Mud House Lotus Leaf Rice \u0026 Wild Vegetable Han-jeongsik (\ud759\uc2dc\ub8e8)", "transport": "Take the Donghae Line to Gijang Station (Exit 1), then take a taxi for about 5 minutes."}, {"address": "86 Yonggung-gil, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uc6a9\uad81\uae38 86)", "feature": "\u2b50 4.2 stars | A vegan street snack located in the shopping street at the entrance of Haedong Yonggungsa Temple, this traditional treat is a must-try for visitors. Hand-pounded using fresh locally grown Gijang mugwort and premium glutinous rice, its vibrant green color is inviting, and its texture is delightfully chewy with a rich natural herbal aroma. The shop offers plain cakes served with roasted soybean powder, as well as cakes stuffed with low-sugar red bean paste. Lightly sweet, non-greasy, and entirely free of animal products, it is a comforting and satisfying vegetarian dessert.", "name": "Haedong Yonggungsa Temple Traditional Mugwort Cake (\ud574\ub3d9\uc6a9\uad81\uc0ac \uc465\ub5a1)", "transport": "Take Busan Metro Line 2 to Haeundae Station (Exit 7), transfer to Bus No. 181, get off at Haedong Yonggungsa Temple \u0026 National Institute of Fisheries Science stop, and walk for about 10 minutes."}, {"address": "65 Daebyeon-ro, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \ub300\ubcc0\ub85c 65)", "feature": "\u2b50 4.1 stars | Tucked away at the foot of the mountains in East Busan, this long-standing vegetarian restaurant specializes in meat-free vegan wild vegetable bibimbap (Sanchae Bibimbap). Featuring over seven types of wild greens (such as bellflower root, bracken fern, shiitake mushrooms, zucchini, and seasonal herbs), each vegetable is lightly saut\u00e9ed in pure sesame oil and sea salt to retain its crispness and unique fresh fragrance. Mixed with custom fermented soybean red pepper paste and piping hot purple rice, every bite is crunchy, juicy, and infused with rich sesame oil flavor\u2014the ultimate way to experience traditional Korean wild mountain cuisine.", "name": "Gijang Local Sanchae Bibimbap (\uae30\uc7a5 \uc0b0\ucc44\ube44\ube54\ubc25)", "transport": "Take the Donghae Line to Gijang Station (Exit 2), transfer to Local Bus No. 6, get off at Daebyeon Port Entrance, and walk for about 3 minutes."}, {"address": "29 Yeonhwa 1-gil, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uc5f0\ud6541\uae38 29)", "feature": "\u2b50 4.3 stars | Situated along the picturesque coast of Yeonhwa-ri in Gijang, this cozy eatery specializing in healthy lotus leaf rice offers wonderful pure vegetarian set meals. The signature lotus leaf rice is steamed with multi-grains and jujubes, infusing the sticky, chewy rice with the subtle fragrance of the lotus leaf and leaving a lingering sweet finish on the palate. The set includes golden, crispy vegetarian pancakes filled with crunchy chives and shredded carrots, homemade organic tofu, and refreshing pickled yam. Light and guilt-free, it is especially popular among female diners.", "name": "Yeonhwari Lotus Leaf Rice Health Set (\uc5f0\ud654\ub9ac \uc5f0\uc78e\ubc25\uc815\uc2dd)", "transport": "Take the Donghae Line to OSIRIA Station (Exit 1), then take a taxi for about 7 minutes to reach coastal Yeonhwa-ri."}, {"address": "11 Osiria-ro, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uc624\uc2dc\ub9ac\uc544\ub85c 11)", "feature": "\u2b50 4.4 stars | Located near Lotte World and Lotte Outlet in East Busan, this Indian restaurant offers a wide variety of vegan and lacto-ovo vegetarian curries. Highly recommended are the Chana Masala (chickpea curry) and Palak Paneer (spinach curry with paneer), cooked slowly with natural spices and fresh tomatoes to create a rich, creamy, and spicy flavor profile. Paired with freshly baked vegan Roti or Garlic Naan dipped into the savory sauce, the combination of aromatic spices and warm bread provides an unforgettable taste experience for vegetarians exploring East Busan\u0027s entertainment area.", "name": "Annapurna Indian Vegetarian Curry OSIRIA (\uc548\ub098\ud478\ub974\ub098)", "transport": "Take the Donghae Line to OSIRIA Station (Exit 1) and walk for about 8 minutes."}, {"address": "34 Dongbusangwangwang-ro, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \ub3d9\ubd80\uc0b0\uad00\uad11\ub85c 34)", "feature": "\u2b50 4.0 stars | Located in the East Busan commercial area, this vegan buffet caters to diners seeking healthy, burden-free meals. All dishes are completely meat-free and made without artificial additives. Highlights include soy-based sausages, crispy plant-based fried \u0027chicken\u0027 (karaage), refreshing vegetable konjac cold noodles, and vegan soybean tofu stew. The fried items are golden, crispy, and non-greasy, while the plant-based meats offer surprisingly realistic texture and juicy flavor. Featuring a bright, cozy atmosphere, an extensive salad bar, and handcrafted plant-milk desserts, it is a fantastic dining spot for families and vegans visiting Lotte World.", "name": "Green Table Healthy Vegan Buffet OSIRIA (\uadf8\ub9b0\ud14c\uc774\ube14)", "transport": "Take the Donghae Line to OSIRIA Station (Exit 1) and walk for about 5 minutes toward the Lotte Mall complex."}, {"address": "39 Yonggung-gil, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uc6a9\uad81\uae38 39)", "feature": "\u2b50 4.2 stars | Located near Haedong Yonggungsa Temple, this affordable local vegetarian restaurant is famous for its healthy barley rice. The plump barley grains offer a unique popping texture and subtle nutty grain aroma. Ordering the vegetarian set meal brings a large bowl filled with fresh lettuce, shredded radish, bean sprouts, and shiitake mushrooms. Heap the mountain vegetables over the barley rice, add a spoonful of rich homemade soybean paste and pure sesame oil, and mix thoroughly for a crispy, refreshing bite paired with a hot bowl of vegan soybean paste soup (doenjang-guk)\u2014satisfying and wholesome.", "name": "Gijang Well-Being Barley Rice (\uae30\uc7a5 \uc6f0\ube59 \ubcf4\ub9ac\ubc25)", "transport": "Take Bus No. 181 or 1001, get off at Haedong Yonggungsa Temple stop, and walk for about 4 minutes along the pedestrian street towards the temple."}, {"address": "708 Sirang-ri, Gijang-eup, Gijang-gun, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \uae30\uc7a5\uad70 \uae30\uc7a5\uc74d \uc2dc\ub791\ub9ac 708)", "feature": "\u2b50 4.1 stars | An elegant scenic restaurant located near Lotte World, offering a variety of vegetarian and vegan Western light meals. The signature Avocado Chickpea Salad features perfectly ripe sliced avocado, toasted sweet nuts, and a tangy red wine vinaigrette, delivering a creamy texture balanced with nutty crunch. They also serve Truffle Wild Mushroom Olive Oil Pasta cooked to perfect al dente tenderness, boasting a rich yet elegant truffle aroma. Onion- and garlic-free options are available for strict vegans, making it a great choice for young travelers craving Western-style vegetarian cuisine.", "name": "Slow Garden OSIRIA - Western Vegetarian Bistro (\uc2ac\ub85c\uc6b0\uac00\ub4e0)", "transport": "Take the Donghae Line to OSIRIA Station (Exit 1), transfer to Bus No. 1001, get off at Lotte World stop, and walk for about 3 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "86 Yonggung-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.3 stars | A popular stall located in the shopping street at the entrance of Haedong Yonggungsa Temple. The made-to-order seed sugar pancake (Ssiat Hotteok) has a golden, crispy skin filled with rich, melted dark brown sugar, sunflower seeds, and crushed peanuts. One bite releases a burst of piping-hot, sweet aroma with wonderfully rich layers of texture. The cheese hot dog is also a highlight, coated in a crunchy batter with potato cubes and filled with gooey, stretchy cheese\u2014the perfect sweet-and-savory walking snack after visiting the temple.", "name": "Haedong Yonggungsa Ssiat Hotteok \u0026 Cheese Hot Dog", "transport": "Take Bus 1001, 100, or 181 to \u0027Haedong Yonggungsa Temple \u0026 National Institute of Fisheries Science\u0027 stop, then walk about 10 minutes."}, {"address": "16 Eupnae-ro 104beon-gil, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.5 stars | Located in the heart of Gijang Traditional Market, this popular steamed dumpling stall constantly billows rich white steam. Their signature Wang-Mandu (King Dumpling) features a fluffy, sweet outer skin stuffed with savory pork, glass noodles, and fresh chives full of flavorful juices. The thin-skinned steamed pork dumplings are delightfully juicy with a rich, nostalgic taste, making this spot a favorite among both locals and visiting foodies.", "name": "Gijang Market King Dumpling \u0026 Steamed Mandu", "transport": "Take the Donghae Line train to Gijang Station (Exit 1), then walk about 5 minutes to reach Gijang Market."}, {"address": "42 Dongbusangwangwang-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.4 stars | A hit street snack stand among youth and families inside Lotte World Adventure Busan. The churros are fried to golden perfection\u2014crispy on the outside, soft inside\u2014and dusted generously with cinnamon sugar, served alongside rich chocolate dipping sauce. Their eye-catching giant cheese hot dog with long, stretchy cheese is an absolute must-try photo-worthy treat. Enjoying these delicious sweet and savory treats while exploring the theme park is the ultimate fun experience!", "name": "Lotte World Busan Churros \u0026 Cheese Hot Dog Stand", "transport": "Take the Donghae Line train to OSIRIA Station (Exit 1), then walk about 10 minutes."}, {"address": "16 Daehwa-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.6 stars | A classic street food stall inside Gijang Market using top-quality authentic Busan fish cakes (Eomuk). The broth, slow-simmered with green onions and radish, is incredibly savory and sweet. The spicy rice cakes (Tteokbokki) feature thick, chewy rice cakes coated in a thick, rich sweet-and-spicy sauce. Bouncy, chewy, and bursting with flavor, this is an indispensable street food stop when exploring Gijang Traditional Market.", "name": "Gijang Market Busan Eomuk \u0026 Spicy Tteokbokki", "transport": "Take the Donghae Line train to Gijang Station (Exit 1), enter Gijang Market, and walk about 3 minutes."}, {"address": "Along Yonggung-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.2 stars | The most alluring source of aroma along the path leading to Haedong Yonggungsa Temple. Fresh squid is pressed and grilled on hot iron plates right before your eyes, releasing an irresistible smoky seafood scent. Tender yet delightfully chewy, the flavor intensifies with every bite. Paired with a dab of mayonnaise and signature hot sauce, it offers a burst of sweet ocean flavor\u2014the ultimate local snack to munch on while enjoying the sea views and ancient temple grounds.", "name": "Haedong Yonggungsa Freshly Grilled Squid Stand", "transport": "Take Bus 181 or 1001 to \u0027Haedong Yonggungsa Temple\u0027 stop and walk along the entrance shopping street path."}, {"address": "105 Eupnae-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.5 stars | Located on the edge of Gijang Market, this handmade pastry stall is famous for its daily fresh-made twisted donuts (Kkwaebegi). Served piping hot, these twisted donuts are golden and fluffy, lightly dusted with fine sugar\u2014crispy on the outside, airy and chewy inside, with no greasiness at all. They also serve freshly made glutinous rice red bean donuts and traditional rice cakes, offering a nostalgic sweetness highly recommended by local food enthusiasts.", "name": "Gijang Market Fresh Kkwaebegi \u0026 Rice Donuts", "transport": "Take the Donghae Line train to Gijang Station (Exit 1), then walk about 6 minutes."}, {"address": "147 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.3 stars | A refined street food counter inside Lotte Mall Dongbusan. Their specialty is golden, crispy fish-shaped waffle cakes (Bungeoppang), freshly baked using a custom batter. The crust is super crispy, filled generously with options like sweet red bean paste, rich custard, or gooey cheese. Hot, creamy, and delightful, it\u0027s the perfect sweet pit stop during a shopping spree.", "name": "Lotte Mall Dongbusan Bungeoppang \u0026 Red Bean Cakes", "transport": "Take the Donghae Line train to OSIRIA Station (Exit 1), then walk about 5 minutes into Lotte Mall."}, {"address": "Sirang-ri Coast, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.4 stars | An outdoor food stand near the East Busan coastline border close to Songjeong, specializing in freshly grilled prawns and crispy Korean seafood pancakes (Pajeon). Packed with local Gijang green onions, fresh prawns, and squid chunks, the pancake is fried to a golden, crunchy crisp with rich seafood flavor. Paired with piping hot grilled cheese prawns, the sweet and tender seafood is a huge favorite for coastal road-trippers and tourists alike.", "name": "East Busan Coastal Grilled Prawns \u0026 Seafood Pancake Stand", "transport": "Take Bus 1001 or 139 to \u0027Sirang-ri Entrance\u0027 stop, then walk toward the coastal trail."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Gijang and East Busan (Lotte World, Haedong Yonggungsa Temple)"}, "gwangalli": {"categories": {"cat_1": {"items": [{"address": "271 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.5 Stars | Located on the front row of the Gwangalli beachfront, this legendary traditional pork soup rice restaurant is a soul food staple for Busan locals and tourists alike. The broth is made by slow-simmering high-quality pork bones for dozens of hours, yielding a deep milky-white soup that is rich, sweet, and entirely odor-free. The signature pork soup rice is topped with thick, tender slices of pork that release savory juices and rich bone broth aromas with every bite, while the handmade sundae (Korean blood sausage) offers a dense, soft texture with subtle herbal notes. It is recommended to taste the rich, original broth first, then mix in chives, salted shrimp, and special spicy paste for a complex, savory, and mildly spicy flavor profile. Served with crisp, refreshing kimchi and raw garlic, every bite is warming and satisfying. At night, sit by the window to enjoy views of the glittering Gwangan Bridge.", "name": "Miryang Sundae Dwaeji-gukbap Gwangalli Branch", "transport": "Busan Metro Line 2, Gwangan Station, Exit 3, about a 10-minute walk to the front of Gwangalli Beach."}, {"address": "33 Namcheonbada-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.4 Stars | A classic Hanwoo beef BBQ establishment upholding decades of traditional craftsmanship, this is one of Gwangalli\u0027s most famous grand traditional restaurants. Specializing in traditional Eonyang-style marinated grilled beef, premium Hanwoo beef is thinly sliced, marinated in special soy sauce, minced garlic, and honey, then direct-grilled over charcoal net screens. Served fresh off the grill, the beef exudes a rich smoky charcoal aroma, melting in your mouth with a sweet-savory balance of juicy tender goodness. Wrapping the beef in fresh perilla leaves, lettuce, and garlic slices perfectly offsets any richness. The time-tested meat quality and authentic charcoal techniques attract endless gourmands and local connoisseurs, making this a high-quality traditional Korean feast you cannot miss in Gwangalli.", "name": "Eonyang Bulgogi Busanjip", "transport": "Busan Metro Line 2, Geumnyeonsan Station, Exit 1, about a 6-minute walk."}, {"address": "247-1 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.3 Stars | Gaemijip, Busan\u0027s most famous traditional spicy stir-fried octopus eatery, boasts a front-row oceanview branch in Gwangalli\u2014making it the ultimate spot to savor traditional Nak-Gop-Sae (Octopus + Beef Small Intestine + Shrimp). The signature spicy sauce combines sweet, snappy small octopus, rich fatty beef intestines, and bouncy shrimp simmered in broth until thick and glossy. The octopus delivers a fresh, chewy bite, while the intestines overflow with savory fat, complemented by juicy shrimp for a marvelous triple texture. Ladle a generous spoonful of spicy stir-fry over hot white rice, sprinkle with shredded seaweed and bean sprouts, and mix together for a sweet, spicy, and savory bowl so appetizing you won\u0027t be able to stop.", "name": "Gaemijip Gwangalli Branch", "transport": "Busan Metro Line 2, Gwangan Station, Exit 3, about a 9-minute walk toward the beachfront road."}, {"address": "140 Gwangnam-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.3 Stars | Wheat noodles (Milmyeon) are Busan\u0027s iconic traditional cold noodle dish, and Gaya Milmyeon is a legendary brand passed down through generations. The broth is slow-boiled with medicinal herbs and pork bones, then chilled into a refreshing slush. Made from high-gluten flour, the noodles are springier, more resilient, and easier to bite through than traditional buckwheat cold noodles. The signature Water Milmyeon features a subtle sweet-spicy chilled broth that cools you to your core, while the Spicy Mixed Milmyeon is coated in a rich, spicy red sauce. Paired with hot, freshly steamed Mandu (traditional large dumplings with thin skin and juicy filling) dipped in vinegar soy sauce, this combination of chewy cold noodles and juicy dumplings is the ultimate refreshing treat on a hot summer day or after a beach stroll.", "name": "Gwangalli Gaya Milmyeon", "transport": "Busan Metro Line 2, Gwangan Station, Exit 5, about a 5-minute walk."}, {"address": "17 Suyeong-ro 666beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.6 Stars | A classic hotspot located near Gwangalli in Suyeong-gu\u0027s traditional grilled intestine alley, famous for fresh, high-grade Hanwoo beef intestines and tripe (Yang). The restaurant preserves Old Busan\u0027s bustling table-side grilling service where attentive staff cook house-marinated beef large intestines, small intestines, and tripe over high heat on special iron grills until golden and crispy. Premium tripe is tender-chewy with an elegant springiness, while the large intestines release a rich, savory aroma with a crisp exterior and juicy interior. Dipped in the house-made garlic-onion vinegar sauce, the subtle tanginess balances the richness and highlights the offal\u0027s sweetness. Paired with traditional Korean soju, it\u0027s a fantastic spot to experience Busan\u0027s local late-night culture and traditional food scene.", "name": "Suyeong Yang Gopchang Gwangalli Main Branch", "transport": "Busan Metro Line 2, Suyeong Station, Exit 5, about a 3-minute walk."}, {"address": "282 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.4 Stars | A pioneer of Korean pufferfish cuisine founded in 1970, the Gwangalli branch serves the most authentic traditional hangover pufferfish soup (Bokguk). Using carefully selected fresh pufferfish, abundant soybean sprouts, celery, and water parsley, clear soup (Eunbok-guk) is simmered in traditional earthenware pots. The pufferfish meat is firm and fine-textured like chicken, rich in collagen and completely free of fishy odor. The broth is exquisitely clear, light, and sweet, featuring the natural freshness of vegetables and premium pufferfish. Enjoy the delicate broth first, then add a drop of Korean rice vinegar according to preference to add depth, complemented by various handmade side dishes. Every bite reflects half a century of culinary craftsmanship.", "name": "Geumsu Bokguk Gwangalli Branch", "transport": "Busan Metro Line 2, Gwangan Station, Exit 3, about an 11-minute walk to the east side of Gwangalli Beach."}, {"address": "25-8 Suyeong-ro 388beon-gil, Suyeong-gu, Busan", "feature": "\u2b50 4.6 Stars | Tucked away in an alleyway in Namcheon-dong at the southern end of Gwangalli Beach, this classic traditional dessert house is surrounded by lush ivy and bamboo groves, feeling like an urban oasis. For decades, the shop has insisted on serving only the simplest and purest traditional shaved ice with red bean (Patbingsu) and hot red bean porridge. The shaved ice uses whole red beans slow-cooked in-house, layered over fine shaved ice, and dusted with subtle green tea powder and syrup. The red beans are soft and fluffy without being overly sweet, melting in your mouth with rich bean aroma and hints of earthy green tea. Unpretentious, nostalgic, and very affordable, it is a cherished childhood taste for Gwangalli locals.", "name": "Namcheon-dong Boseong Nokcha", "transport": "Busan Metro Line 2, Namcheon Station, Exit 3, about a 6-minute walk."}, {"address": "60 Millaksuchansijang-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.4 Stars | Adjacent to the eastern end of Gwangalli Beach, Millak Fish Market is one of Busan\u0027s most iconic traditional seafood hubs. Maintaining an authentic sea-to-table tradition, the first floor houses dozens of live fish stalls selling fresh flounder, sea bream, rockfish, and live octopus. After choosing your seafood, stallholders slice it with impressive skill into delicate, fresh traditional raw fish (Hoe). The sashimi boasts an amazingly firm and chewy texture with a natural ocean sweetness. Take your slice up to second-floor restaurants for preparation, or pack it up to enjoy on a picnic mat along Gwangalli Beach with traditional sweet-and-sour chili sauce (Chogochujang) and ssamjang\u2014a true taste of Busan\u0027s coastal heritage with a refreshing ocean breeze.", "name": "Millak Fish Market Raw Fish", "transport": "Busan Metro Line 2, Gwangan Station, Exit 3, about 5 minutes by taxi, or a 15-minute walk east along Gwangalli Beach."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "3F \u0026 5F, 165 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.5 Stars | Famous for its iconic Jeju-style basalt stone walls and wood-chip floors, this cafe features massive floor-to-ceiling windows offering spectacular views of the Gwangan Bridge. Their signature \u0027Rendezja-Vous\u0027 milk tea is rich and fragrant, pairing perfectly with their soft, melt-in-your-mouth pound cake. A top favorite for tourists and local youth alike\u2014grab a seat by the window for instagrammable photos while unwinding to stunning coastal views.", "name": "Rendezja-Vous Gwangalli: Jeju-Style Ocean View Cafe (\ub791\ub370\uc790\ubdf0 \uad11\uc548\ub9ac\uc810)", "transport": "Busan Metro Line 2, Gwangan Station, Exit 3, about a 10-minute walk towards the beachfront building."}, {"address": "3F, 237 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.6 Stars | A popular Korean dessert cafe located right on the front row of the Gwangalli beachfront, specializing in healthy, wheat-free rice cakes and custom hand-crafted drinks. The Matcha Sesame Rice Cake has a rich, dense texture with a subtle rice aroma and bold tea flavor, beautifully complimented by smooth, light cream. With its calm, sophisticated wooden interior and unobstructed views of Gwangan Bridge, it\u2019s a must-visit sanctuary for dessert lovers.", "name": "Chasonchak Ocean View Cafe (\ucc28\uc120\ucc45)", "transport": "Busan Metro Line 2, Gwangan Station, Exit 3, about a 12-minute walk."}, {"address": "5F, 229 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.7 Stars | Styled in pure white and warm wooden accents, this cafe creates a cozy, bright atmosphere reminiscent of a sunny beach. Their handmade fresh cream fruit cakes are insanely popular\u2014boasting moist, delicate cake sponge layered with light, non-greasy cream and generous chunks of fresh seasonal fruit. Pair your slice with a rich latte or a refreshing fruit sparkling drink while basking in the natural sunlight and taking in the azure blue sea of Gwangalli Beach.", "name": "Sandis Ocean View Cream Cake Cafe (\uc0cc\ub514\uc2a4)", "transport": "Busan Metro Line 2, Geumnyeonsan Station, Exit 1, about a 10-minute walk."}, {"address": "2F, 148 Gwangnam-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.3 Stars | A classic and highly acclaimed brunch spot hidden in the alleys of Gwangalli, famous for its made-to-order Dutch Baby pancakes and seasonal fruit French toast. The piping hot Dutch Baby is crispy on the outside, fluffy on the inside, and packed with rich egg aroma, topped with fresh fruits and vanilla ice cream. Featuring carefully selected ingredients and hand-brewed single-origin coffee, it is a top pick for foodies seeking quality meals and a cozy, elegant atmosphere.", "name": "Fruity Brunch Cafe (\ud504\ub8e8\ud2f0)", "transport": "Busan Metro Line 2, Gwangan Station, Exit 5, about an 8-minute walk."}, {"address": "3F \u0026 4F, 125 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.5 Stars | Designed like a dream Mediterranean beach resort, this cafe features an outdoor sand landscape and an open-air rooftop terrace. Their brunch platter is generous and flavorful, featuring French toast (crispy outside, tender inside), seared bacon, sunny-side-up eggs, and fresh salad. Their pastas and thin-crust pizzas are also exceptional. Enjoy the gentle sea breeze and delicious food while soaking in unbeatable panoramic views of Gwangan Bridge.", "name": "Isle Blue Resort-Style Rooftop Ocean View Brunch Cafe (\uc544\uc77c\ub4dc\ube14\ub8e8)", "transport": "Busan Metro Line 2, Geumnyeonsan Station, Exit 3, about an 8-minute walk."}, {"address": "7F, 239 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.4 Stars | A high-floor ocean view cafe offering panoramic, unobstructed views of the entire Gwangan Bridge and coastline through its expansive glass windows. The signature Coconut Latte and Matcha Latte are rich and smooth, pairing deliciously with their crispy Croffles (croissant waffles) topped with maple syrup and a large scoop of ice cream. The cafe also conveniently offers free luggage storage and board games, making it the perfect rest stop for travelers.", "name": "Dubuks Gwangalli: High-Rise Panoramic Ocean View Cafe (\ub69c\ubc85\uc2a4 \uad11\uc548\ub9ac\uc810)", "transport": "Busan Metro Line 2, Gwangan Station, Exit 3, about a 12-minute walk."}, {"address": "172 Gwangnam-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.5 Stars | A super popular Ko
