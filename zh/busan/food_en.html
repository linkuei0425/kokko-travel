ories": {"cat_1": {"items": [{"address": "33 Seomyeon-ro 68beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \ubd80\uc0b0\uc9c4\uad6c \uc11c\uba74\ub85c68\ubc88\uae38 33)", "feature": "\u2b50 4.4 stars | Founded in 1946, this iconic three-generation establishment is the most famous landmark on Seomyeon Pork Rice Soup Street. Its rich, deep white pork bone broth is slow-simmered for hours without any gamey odor, paired with melt-in-your-mouth, perfectly marbled warm sliced pork and offal. Add salty salted shrimp, chives, and signature spicy sauce when eating to instantly layer the soup with rich sweetness. With rice soaking up the flavorful broth, every bite is velvety and smooth\u2014making it a top comfort food choice for locals and tourists arriving in Busan around the clock.", "name": "Songjeong Samdae Gukbap (\uc1a1\uc8153\ub300\uad6d\ubc25)", "transport": "Approx. 3-min walk from Exit 1 of Seomyeon Station (Subway Lines 1 \u0026 2)"}, {"address": "56 Seomyeon-ro 56beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \ubd80\uc0b0\uc9c4\uad6c \uc11c\uba74\ub85c56\ubc88\uae38 56)", "feature": "\u2b50 4.3 stars | A decades-old, hugely popular old-school noodle shop inside Seomyeon Market. The noodles are freshly kneaded and hand-cut on-site by skilled chefs, giving them an exceptionally springy and bouncy texture. After boiling, they are drenched in a light, sweet broth simmered from bonito and dried anchovies, then topped with plenty of crown daisy, crushed sesame, and a special red chili paste. Savoring a hot bowl delivers a savory-sweet depth, with the hand-cut noodles absorbing all the rich soup for an utterly satisfying slurping experience. Its incredibly budget-friendly coin prices continue to draw endless crowds.", "name": "Gijang Son Kalguksu (\uae30\uc7a5\uc190\uce7c\uad6d\uc218)", "transport": "Approx. 4-min walk from Exit 7 of Seomyeon Station (Subway Lines 1 \u0026 2)"}, {"address": "21-5 Seomyeon-ro 68beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \ubd80\uc0b0\uc9c4\uad6c \uc11c\uba74\ub85c68\ubc88\uae38 21-5)", "feature": "\u2b50 4.2 stars | Operating for over half a century since 1963, this traditional ginseng chicken soup legend selects premium young chickens stuffed with sticky rice, jujubes, Korean ginseng, and garlic, then simmers them for hours in rich chicken broth. The tender meat separates effortlessly from the bone, while the rich, velvety soup yields an elegant ginseng fragrance and natural sweetness. The broth-soaked sticky rice offers a dense, comforting texture, making it a timeless favorite for local Busanites seeking a nourishing wellness boost year-round.", "name": "Sam O Jeong (\uc0bc\uc624\uc815)", "transport": "Approx. 3-min walk from Exit 7 of Seomyeon Station (Subway Lines 1 \u0026 2)"}, {"address": "33-4 Gayadaero 784beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \ubd80\uc0b0\uc9c4\uad6c \uac00\uc57c\ub300\ub85c784\ubc88\uae38 33-4)", "feature": "\u2b50 4.5 stars | A unique, classic night-market style grilled intestine hub in Seomyeon. Inside, multiple independent stalls run by friendly aunties serve up fresh beef small intestines, large intestines, and tripe. Grilled over charcoal, the aunties personally cook everything to golden, crispy perfection. Each bite offers a crispy, chewy exterior bursting with rich, juicy flavor, which pairs magnificently with the house-made garlic soy sauce or spicy dip. The nostalgic indoor stall ambiance lets foodies fully immerse themselves in Busan\u0027s authentic nightlife culture.", "name": "Munhwa Yanggopchang (\ubb38\ud654\uc591\uacf1\ucc3d)", "transport": "Approx. 5-min walk from Exit 7 of Seomyeon Station (Subway Lines 1 \u0026 2)"}, {"address": "28 Seojeon-ro 25beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \ubd80\uc0b0\uc9c4\uad6c \uc11c\uc804\ub85c25\ubc88\uae38 28)", "feature": "\u2b50 4.1 stars | Milmyeon (wheat cold noodles) is Busan\u0027s iconic specialty, and this classic shop is a time-honored favorite in the Seomyeon district. Combining wheat flour with sweet potato starch, the noodles are easier to bite through than regular cold noodles while retaining a chewy bounce. The chilled broth is brewed with traditional herbs and beef bones, served with thinly sliced pork, shredded cucumbers, and a special spicy sauce for a refreshing balance of sweet, sour, and mild spice. Perfect for hot summer days, pairing it with a basket of freshly steamed, juicy dumplings makes for an immensely satisfying meal.", "name": "Seomyeon Milmyeon (\uc11c\uba74\ubc00\uba74)", "transport": "Approx. 6-min walk from Exit 8 of Seomyeon Station (Subway Lines 1 \u0026 2)"}, {"address": "27 Seomyeon-ro 68beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \ubd80\uc0b0\uc9c4\uad6c \uc11c\uba74\ub85c68\ubc88\uae38 27)", "feature": "\u2b50 4.3 stars | A 50-year-old staple on Seomyeon\u0027s Pork Rice Soup Street, adored by local food lovers. The milky-white broth is slow-boiled strictly with pork bones, delivering a clean, non-gamey taste with subtle creamy notes. Thick slices of pork belly are stewed until silky-soft and succulent. Diners can choose a mix of tender pork, offal, or blood sausage. Pouring the scalding broth over warm rice and pairing it with moderately tangy homemade kimchi and salted shrimp delivers pure old-school comfort in every bite.", "name": "Pohang Dwaeji Gukbap (\ud3ec\ud56d\ub3fc\uc9c0\uad6d\ubc25)", "transport": "Approx. 3-min walk from Exit 1 of Seomyeon Station (Subway Lines 1 \u0026 2)"}, {"address": "54 Gayadaero 784beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \ubd80\uc0b0\uc9c4\uad6c \uac00\uc57c\ub300\ub85c784\ubc88\uae38 54)", "feature": "\u2b50 4.1 stars | A famous hand-pulled noodle restaurant near Lotte Department Store in Seomyeon. The kitchen stays committed to pulling noodles freshly by hand on demand, creating noodles with varied thickness that are incredibly bouncy and chewy. The signature Jajangmyeon features a savory-sweet, thick black bean sauce stir-fried with diced onions and pork, coating the hot, fresh hand-made noodles seamlessly. Paired with crispy yet tender sweet and sour pork (Tangsuyuk), it is an unmissable comfort Chinese-Korean feast in Seomyeon.", "name": "Beomtaesa Saeson Jajangmyeon (\ubc94\ud0dc\uc0ac\uc190\uc9dc\uc7a5)", "transport": "Approx. 2-min walk from Exit 7 of Seomyeon Station (Subway Lines 1 \u0026 2)"}, {"address": "24-3 Central-ro 691beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0\uad11\uc5ed\uc2dc \ubd80\uc0b0\uc9c4\uad6c \uc911\uc559\ub300\ub85c691\ubc88\uae38 24-3)", "feature": "\u2b50 4.6 stars | A nationally renowned Korean BBQ destination famous for its thick-cut pork, with constant queues at its Seomyeon branch. Featuring 3.5cm thick wet-aged pork belly and pork neck, expert staff precisely measure the grill temperature before grilling the meat to perfection for you. The pork seals in juicy goodness with a crisp, golden-brown crust, bursting with natural sweetness and savory fat. Enjoyed with pickled wild garlic leaves, washed kimchi, and coarse salt, every bite is rich without feeling greasy, making it the ultimate dining pick for both locals and travelers.", "name": "Matchandle Wang Sogeum Gui Seomyeon (\ub9db\ucc2c\ub4e4\uc655\uc18c\uae08\uad6c\uc774 \uc11c\uba74\uc810)", "transport": "Approx. 5-min walk from Exit 7 of Seomyeon Station (Subway Lines 1 \u0026 2)"}], "name": "Iconic Local Eateries"}, "cat_2": {"items": [{"address": "18 Jungang-daero 692beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc911\uc559\ub300\ub85c692\ubc88\uae38 18)", "feature": "\u2b50 4.6 stars | A flagship brand representing specialty coffee in Busan. Its most famous signature drink, the \u0027Haesuyeom\u0027 (Sea Salt Coffee), features a rich combination of espresso and cold brew topped with a thick, velvety layer of sweet and salty cream. Every sip offers a perfectly balanced, smooth flavor profile. Spanning a spacious, industrial-style environment, it\u2019s a favorite tranquil spot for local office workers and tourists to enjoy expert pour-over coffee and delicious pastries.", "name": "Blackup Coffee (Seomyeon Main Branch)", "transport": "Subway Line 1/2 Seomyeon Station, Exit 2, approx. 3 mins walk"}, {"address": "38 Jeonpo-daero 209beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc804\ud3ec\ub300\ub85c209\ubc88\uae38 38)", "feature": "\u2b50 4.3 stars | A massive 3-story factory-style cafe located at the entrance of Jeonpo Cafe Street. The high-ceiling space is filled with vintage camper vans and antique furniture. The signature \u0027Strawberry Tart and Fresh Waffles\u0027 feature a crispy crust and rich, flavorful filling with delightful layers. Paired with a signature latte, it\u2019s a top choice for a late-night cafe visit in Seomyeon.", "name": "Vintage 38 Cafe", "transport": "Subway Line 2 Jeonpo Station, Exit 7, approx. 3 mins walk"}, {"address": "26 Jeonpo-daero 199beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc804\ud3ec\ub300\ub85c199\ubc88\uae38 26)", "feature": "\u2b50 4.4 stars | An iconic minimalist coffee shop in Busan known for in-house roasting. Its famous signature cold brew cream coffee, \u0027Tomorrow\u0027, features light, silky-smooth sweet cream floating atop iced cold brew with subtle fruity acidity. The first sip delivers sweet creamy gentle bliss followed by a refreshing, deep coffee finish. The sleek two-story white building with an outdoor terrace is a favorite among trendsetters.", "name": "FM Coffee (Jeonpo Branch)", "transport": "Subway Line 2 Jeonpo Station, Exit 7, approx. 2 mins walk"}, {"address": "43 Jeonpo-daero 207beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc804\ud3ec\ub300\ub85c207\ubc88\uae38 43)", "feature": "\u2b50 4.5 stars | A wildly popular American-style brunch spot in Seomyeon, famous for its freshly made-to-order Souffl\u00e9 Pancakes and American Brunch Platter. The souffle pancakes are as fluffy and soft as clouds, melting instantly in your mouth with sweet maple syrup and fresh fruit. The hearty brunch platter includes crispy bacon, sunny-side-up eggs, and golden hash browns, drawing crowds of tourists for photos and great food.", "name": "Dunt Daunt Brunch Cafe", "transport": "Subway Line 2 Jeonpo Station, Exit 7, approx. 4 mins walk"}, {"address": "39 Jeonpo-daero 209beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc804\ud3ec\ub300\ub85c209\ubc88\uae38 39)", "feature": "\u2b50 4.4 stars | A cozy, Nordic-style brunch cafe tucked away in an alley off Jeonpo Cafe Street, specializing in Avocado Shrimp Toast and French Toast. The French toast is cooked to golden-crisp perfection, thoroughly infused with egg and milk flavor\u2014crispy on the outside, tender on the inside, and lightly sweet. The refreshing avocado toast pairs fresh shrimp with signature sauce, making it a healthy and elegant favorite.", "name": "Offon Brunch Cafe", "transport": "Subway Line 2 Jeonpo Station, Exit 7, approx. 3 mins walk"}, {"address": "38 Jungang-daero 680beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc911\uc559\ub300\ub85c680\ubc88\uae38 38)", "feature": "\u2b50 4.2 stars | A renowned dessert shop in Seomyeon famous for its grand, multi-layered Rainbow Cake and various handmade chiffon cakes. Each vibrant layer of the Rainbow Whipped Cream Cake offers subtle fruity aromas, separated by light, non-greasy whipped cream with a moist, melt-in-your-mouth texture. Featuring an elegant and bright interior, it offers high-quality herbal teas and rich coffee\u2014a perfect spot for a dreamy afternoon tea.", "name": "MOLLE Handmade Cake Cafe", "transport": "Subway Line 1/2 Seomyeon Station, Exit 2, approx. 5 mins walk"}, {"address": "15 Jeonpo-daero 209beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc804\ud3ec\ub300\ub85c209\ubc88\uae38 15)", "feature": "\u2b50 4.5 stars | An iconic European-style artisanal bakery in the Seomyeon-Jeonpo area. Their signature Palmier is coated in rich caramel, delivering an insanely flaky and crispy crunch. The Matcha Croissant is bursting with rich, bittersweet matcha custard, offering a delightful explosion of buttery pastry and tea aroma in every bite. Items often sell out as soon as they leave the oven, making this a must-visit for bakery enthusiasts.", "name": "Bakers Bakery Cafe", "transport": "Subway Line 2 Jeonpo Station, Exit 7, approx. 4 mins walk"}, {"address": "46-7 Jungang-daero 692beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc911\uc559\ub300\ub85c692\ubc88\uae38 46-7)", "feature": "\u2b50 4.3 stars | A 3-story American retro country-style cafe renovated from an old house, featuring a cozy outdoor rooftop terrace. The popular Basque Burnt Cheesecake is rich, dense, and creamy, with deep cheese flavors melting in your mouth alongside a subtle hint of caramelization. It pairs wonderfully with a fruity, slightly bitter Americano. With unique vintage antique furniture and warm lighting, it\u2019s a wonderful spot to relax and chat into the night.", "name": "Cafe Knock Out", "transport": "Subway Line 1/2 Seomyeon Station, Exit 2, approx. 4 mins walk"}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "29 Seomyungang-ga 29beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.4 stars | A representative authentic Busan delicacy passed down through three generations. The broth is carefully simmered from pork bones for tens of hours, resulting in a refreshing, non-greasy milky-white appearance. Rich savory aroma accompanies tender fresh pork slices, making every sip warming and smooth. Pro tip: add salted shrimp, chives, and chili paste to enhance the savory layers of the broth. Local office workers and visiting tourists alike love coming here late at night or early in the morning to enjoy a steaming bowl of pork rice soup and experience the most authentic local warmth of Busan.", "name": "Songjeong Samdae Pork Rice Soup (\uc1a1\uc815\uc0bc\ub300\uad6d\ubc25)", "transport": "About a 3-minute walk from Exit 1 of Seomyeon Station (Subway Line 1/2)"}, {"address": "13-8 Seomyun-ro 33beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.3 stars | A traditional classic restaurant located on Seomyeon\u0027s famous Gopchang (grilled tripe/intestines) Street, boasting a rich nostalgic vintage atmosphere. The shop specializes in fresh beef and pork tripe, expertly grilled tableside by staff until the outer skin turns golden crisp while remaining chewy, juicy, and infused with an alluring smoky charcoal flavor inside. Wrapped in fresh lettuce with special garlic sauce, it offers a rich yet non-greasy savoriness. It is not only a fantastic spot for locals to sip soju with friends after work, but also a landmark location to experience Busan\u0027s vibrant nightlife culture.", "name": "Munhwa Gopchang (\ubb38\ud654\uacf1\ucc3d)", "transport": "About a 4-minute walk from Exit 7 of Seomyeon Station (Subway Line 1/2)"}, {"address": "24-3 Jungang-daero 691beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.6 stars | A renowned Korean BBQ establishment specializing in thick-cut aged pork, with the Seomyeon branch being exceptionally popular. The restaurant uses premium local Korean pork aged and cut into 3.5cm thick slices, cooked by professional staff who precisely control the grill temperature tableside. The golden, crispy crust locks in rich juices, giving a firm and springy texture that bursts with natural meat flavor upon every bite. Paired with fine salt, seasoned pollack intestine sauce, or tangy washed kimchi, the flavor profile is rich and multi-layered. An unmissable culinary feast for meat lovers visiting Busan.", "name": "Matchandeul Wang Sogeum-gui Seomyeon Branch (\ub9db\ucc2c\ub4e4\uc655\uc18c\uae08\uad6c\uc774 \uc11c\uba74\uc810)", "transport": "About a 5-minute walk from Exit 7 of Seomyeon Station (Subway Line 1/2)"}, {"address": "56 Seomyungang-ga 29beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.2 stars | Tucked away inside Seomyeon Market, this decades-old traditional eatery is famous for its chewy, freshly hand-cut noodles. The rich, flavorful anchovy broth offers a comforting classic taste, topped generously with minced garlic, chili powder, crown daisy, and signature sauce before serving. The springy noodles absorb the rich broth, rendering a smooth and aromatic bite. Offering satisfying warmth at an affordable price, it represents a cherished childhood memory for locals and a top choice for tourists exploring traditional Busan noodle dishes.", "name": "Kijang Hand-Cut Noodles (\uae30\uc7a5\uc190\uce7c\uad6d\uc218)", "transport": "About a 3-minute walk from Exit 7 of Seomyeon Station (Subway Line 1/2, inside Seomyeon Market)"}, {"address": "22 Dongcheon-ro 85beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.5 stars | A highly popular Western-style bistro with incredible ambiance in the Seomyeon shopping district, featuring industrial vintage decor and romantic lighting. The signature dish, \u0027Cream Fried Chicken\u0027, drenches crispy fried chicken in a rich, smooth house-made cream sauce\u2014crispy on the outside, tender and juicy on the inside with stunning flavor layers. Another popular dish, the thick rolled omelet, offers a silky, melt-in-your-mouth texture. Paired with curated craft beers or cocktails, it seamlessly blends Western dining culture with Korean social dining habits, making it an exquisite nightlife choice for young locals and travelers in Seomyeon.", "name": "83 Bistro Seomyeon (83\ube44\uc2a4\ud2b8\ub85c)", "transport": "About a 6-minute walk from Exit 6 of Seomyeon Station (Subway Line 1/2)"}, {"address": "16-12 Seojun-ro 10beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.4 stars | A trendy social landmark combining a stylish American-style bar with refined bistro dining, featuring moody lighting and spacious, comfortable seating. The menu offers a wide selection of signature cocktails, craft beers, and refined Korean-Western fusion dishes. Highlights include their fish and chips and baked cheese meat sauce platter\u2014crispy outside, piping hot, and overflowing with rich cheese aromas. With a relaxed and vibrant atmosphere, it is immensely popular among trendy local youth and serves as an ideal spot to unwind with friends over drinks after shopping in Seomyeon.", "name": "AC Bar \u0026 Bakery (AC\ubc14 \uc11c\uba74)", "transport": "About a 5-minute walk from Exit 2 of Seomyeon Station (Subway Line 1/2)"}, {"address": "48 Seomyun-ro, Busanjin-gu, Busan", "feature": "\u2b50 4.3 stars | A classic cold wheat noodle restaurant representing Busan\u0027s unique culinary culture. Unlike Pyongyang buckwheat cold noodles, Busan\u0027s Milmyeon noodles are crafted from wheat flour and sweet potato starch, giving them an exceptionally elastic and silky texture. The broth, simmered with traditional Korean herbal ingredients and beef, is served icy cold, sweet, and refreshing to cut through richness. Topped with a spicy red sauce, shredded cucumber, and boiled egg, it delivers a sweet, tangy, and refreshingly cold sensation\u2014an ideal local dish to beat summer heat or cleanse the palate after enjoying BBQ.", "name": "Gaegeum Milmyeon Seomyeon Direct Store (\uac1c\uae08\ubc00\uba74 \uc11c\uba74\uc810)", "transport": "About a 5-minute walk from Exit 7 of Seomyeon Station (Subway Line 1/2)"}, {"address": "34 Dongcheon-ro 95beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.6 stars | An exquisite specialty establishment that seamlessly fuses traditional Korean cuisine with modern bistro concepts. The interior creates an inviting ambiance blending classic Korean aesthetics with modern minimalism. It specializes in various regional Makgeolli (rice wine) and craft refined sakes. Signature dishes include freshly made \u0027Seafood Green Onion Pancake\u0027 (Haemul Pajeon) and \u0027Spicy Stir-fried Beef\u0027. The pancake features a golden, crispy crust bursting with sweet shrimp and squid. This local food and drink pairing attracts countless foodies eager to experience modern Korean dining culture.", "name": "Juandang Seomyeon (\uc8fc\uc548\ub2f9)", "transport": "About a 5-minute walk from Exit 8 of Seomyeon Station (Subway Line 1/2)"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "2F, 54 Central-daero 702beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.6 stars | Located on the 2nd floor of the Seomyeon shopping district, this long-standing traditional Korean vegan restaurant is a must-visit sanctuary for vegetarians visiting Busan. Signature dishes include specially crafted vegan galbi (ribs) made from soy powder and mushrooms, dolsot bibimbap, and rich soybean paste stew (doenjang-jjigae). The vegan galbi has a firm, chewy texture coated in a sweet and mildly spicy Korean sauce, tasting every bit as satisfying as real meat. The interior features abundant wood and Hanji paper, creating a peaceful teahouse atmosphere. The complimentary burdock tea and array of handmade Korean banchan (side dishes) are a real treat, making it a favorite among tourists and local plant-based eaters alike.", "name": "Dajeon Vegetarian Restaurant (\u591a\u7530\u7d20\u98df / \ub2e4\uc804)", "transport": "Busan Metro Line 1 \u0026 2, Seomyeon Station, Exit 2, approx. 5 mins walk"}, {"address": "51 Jeonpo-daero 209beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.7 stars | Nestled in the alleys of Jeonpo Cafe Street in Seomyeon, this stylish vegan bistro specializes in Western and international plant-based cuisine. The signature hummus burger features house-baked wheat bread stuffed with a thick, juicy plant-based patty and custom nut sauce; each bite offers distinct layers with a subtle herbal aroma that is truly impressive. Additionally, the vegan cream pasta and falafel are crowd favorites. The cozy, hip atmosphere lights up beautifully at night, completely shattering traditional stereotypes of vegetarian dining.", "name": "HOME Vegan Bistro (\ud648)", "transport": "Busan Metro Line 2, Jeonpo Station, Exit 7, approx. 4 mins walk; or approx. 10 mins walk from Seomyeon Station"}, {"address": "8 Jeonpo-daero 210beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.5 stars | A highly renowned vegan dessert shop in the Seomyeon area. All cakes and tarts are completely free of milk, eggs, and butter, made instead with oat milk, coconut oil, and plant-based bases. The popular Fig Tofu Tart has a silky, dense texture with balanced sweetness and zero soy odor, while the Matcha Raw Chocolate Tart boasts a rich, bittersweet matcha flavor paired with a hearty crust that you\u0027ll fall in love with at first bite. Even non-vegetarian tourists frequently visit to enjoy a guilt-free, exquisite afternoon tea.", "name": "VEGENIQUE Vegan Bakery (\ubca0\uc9c0\ub2c8\ud06c)", "transport": "Busan Metro Line 2, Jeonpo Station, Exit 7, approx. 3 mins walk"}, {"address": "17 Seojeon-ro 38beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.4 stars | A tasteful cafe combining traditional Korean rice cakes with modern vegan concepts, tailored for vegetarians and lactose-intolerant patrons. The signature Sweet Pumpkin Rice Cake features a moist and chewy texture with whipped plant-based cream that melts in your mouth without being overly sweet. The handmade chopped rice cakes pair perfectly with plant-milk lattes. Emphasizing natural, raw flavors without artificial additives, its warm and serene Japanese-inspired wooden interior offers a relaxing spot to enjoy guilt-free treats.", "name": "Onsaenae Vegan Cafe (\uc628\uc0c8)", "transport": "Busan Metro Line 1, Seomyeon Station, Exit 8, approx. 7 mins walk"}, {"address": "692 Central-daero, Busanjin-gu, Busan", "feature": "\u2b50 4.3 stars | Located at the intersection of Seomyeon Underground Shopping Center and the main commercial area, this healthy meal box spot offers an extensive range of plant-based and vegan options. The best-selling Avocado Chickpea Salad Bowl features crisp organic greens, fresh ripe avocado, and roasted chickpeas drizzled with homemade lemon tahini dressing, making it wonderfully refreshing yet deeply satisfying. The Grilled Cheese \u0026 Apple Panini (substitutable with vegan cheese) is crispy on the outside, tender inside, with a perfect sweet and savory balance\u2014a favorite among local commuters and health-conscious travelers.", "name": "Saladseller Seomyeon (\uc0d0\ub7ec\ub4dc\uc140\ub7ec)", "transport": "Directly accessible via Seomyeon Underground Shopping Center, or walk straight from Busan Metro Seomyeon Station, Exit 2"}, {"address": "12 Dongcheon-ro 85beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.5 stars | Tucked away in the bustling streets of Seomyeon, this lush vegan bistro focuses on healthy vegetarian meals made from whole foods. The Truffle Wild Mushroom Risotto is highly recommended, slow-cooked with a variety of fresh mushrooms, vegan butter, and truffle oil. The rice absorbs the natural sweetness of the mushrooms and rich truffle aroma, resulting in a smooth, satisfying dish that never feels greasy. Decorated with lush greenery and minimal aesthetics, it provides a clean, refreshing dining sanctuary in Seomyeon.", "name": "Slow Garden Vegan Bistro (\uc2ac\ub85c\uc6b0\uac00\ub4e0)", "transport": "Busan Metro Line 2, Jeonpo Station, Exit 5, approx. 5 mins walk"}, {"address": "8 Busanjinchang-ro 24beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.2 stars | A cozy health-focused Korean spot tailored specifically for vegetarians, breaking free from traditional Hansik limitations that often include fish sauce or meat. The signature Wild Vegetable Dolsot Bibimbap is topped with colorful seasonal wild greens, shiitake mushrooms, and tofu. The crispy scorched rice at the bottom releases an irresistible aroma, paired with custom garlic-free vegan gochujang sauce. Every mixed bite is crunchy and rich in flavor. Served with warm clear broth and pickled radish to refresh the palate, it\u0027s the ultimate choice for vegetarian travelers seeking authentic Korean cuisine.", "name": "Green Table Bibimbap (\uadf8\ub9b0\ud14c\uc774\ube14)", "transport": "Busan Metro Seomyeon Station, Exit 12, approx. 6 mins walk"}, {"address": "15 Jeonpo-daero 225beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.6 stars | A wildly popular Mediterranean plant-based eatery near Jeonpo Cafe Street, featuring fully vegan Mediterranean salad bowls and wraps. The must-try signature Falafel Bowl boasts crispy, fragrant falafel with soft, herb-infused centers, served alongside homemade vegan tartar sauce and freshly roasted vegetables for a rich, non-greasy texture profile. Popular among foreign tourists and local youth who grab a vibrant salad bowl for park picnics, offering hearty portions and balanced nutrition.", "name": "April Green (\uc5d0\uc774\ud504\ub9b4\uadf8\ub9b0)", "transport": "Busan Metro Line 2, Jeonpo Station, Exit 7, approx. 6 mins walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Near 692 Jungang-daero, Busanjin-gu, Busan", "feature": "\u2b50 4.5 stars | Made-to-order and fried to a golden crisp, this Korean pancake (Hotteok) is snipped open and stuffed with aromatic seeds and nuts like sunflower seeds, peanuts, and sesame. Crispy on the outside and chewy on the inside, the rich molten brown sugar syrup blends seamlessly with the crunchy nuts. Sweet, nutty, and wonderfully textured, it\u0027s a top-rated street food snack beloved by tourists and locals alike in Seomyeon.", "name": "Seomyeon Seed Hotteok (\uc11c\uba74 \uc528\uc557\ud638\ub5a1)", "transport": "Approx. 2-min walk from Exit 7 of Seomyeon Station (Busan Metro Line 1 \u0026 2)"}, {"address": "Near 68 Seomyeon-ro, Busanjin-gu, Busan", "feature": "\u2b50 4.3 stars | Featuring Busan\u0027s signature thick rice cake strips and hearty fish cakes tossed in a rich, sweet, and spicy red sauce. The thick rice cakes absorb the savory flavor of broth and spicy sauce, offering a satisfyingly chewy texture with a subtle rice aroma. The thick sauce perfectly coats fried bites and fish cakes, making it a classic bite to experience traditional Korean street tent (pojangmacha) food culture.", "name": "Seomyeon Food Alley Tteokbokki (Pojangmacha) (\uc11c\uba74 \uba39\uc790\uace8\ubaa9 \ub5a1\ubcf6\uc774)", "transport": "Approx. 3-min walk from Exit 1 of Seomyeon Station (Busan Metro Line 1 \u0026 2)"}, {"address": "39 Jeonpo-daero 209beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.6 stars | Made-to-order Korean corn dogs coated in rice batter for an ultra-crispy, non-greasy crust. The signature Mozzarella Cheese Hotdog delivers an epic cheese pull with rich creamy flavor, followed by a juicy sausage in the lower half. Roll it in granulated sugar and drizzle with honey mustard and ketchup for a sweet-and-savory combo that youth and travelers can\u0027t get enough of.", "name": "Myeongrang Hotdog Seomyeon (\uba85\ub791\ud56b\ub3c4\uadf8 \uc11c\uba74\uc810)", "transport": "Approx. 4-min walk from Exit 2 of Seomyeon Station (Busan Metro Line 1 \u0026 2)"}, {"address": "Seomyeon Underground Shopping Center, 737 Jungang-daero, Busanjin-gu, Busan", "feature": "\u2b50 4.7 stars | A legendary Busan fish cake brand with an 80-year history, crafting gourmet fish cake snacks infused with ingredients like cheese, chili, and shrimp. Exceptionally bouncy and savory, each bite comes with a lightly toasted exterior. Sip on their complimentary steaming hot fish cake broth for the ultimate cozy treat while shopping at Seomyeon Underground Shopping Center.", "name": "Samjin Amook Seomyeon Underground (\uc0bc\uc9c4\uc5b4\ubb35 \uc11c\uba74\uc9c0\ud558\uc0c1\uac00\uc810)", "transport": "Located inside Seomyeon Underground Shopping Center, directly connected to Seomyeon Station"}, {"address": "56 Seomyeon-ro, Busanjin-gu, Busan", "feature": "\u2b50 4.4 stars | Freshly fried-to-order twisted donuts made with glutinous rice flour and lightly dusted with sugar. Lightly crispy on the outside and super fluffy yet chewy on the inside, they carry a rich dough and rice aroma. Non-sticky, surprisingly non-greasy, and addictively sweet, this simple nostalgic snack is impossible to eat just one of!", "name": "Seomyeon Glutinous Rice Kkwabaegi (\uc11c\uba74 \ucc39\uc300\uaf48\ubc30\uae30)", "transport": "Approx. 3-min walk from Exit 7 of Seomyeon Station (Busan Metro Line 1 \u0026 2)"}, {"address": "Inside Seomyeon Market, 39 Seomyeon-ro, Busanjin-gu, Busan", "feature": "\u2b50 4.2 stars | Tucked inside Seomyeon Traditional Market, this iconic stall serves steaming hot Korean blood sausage (sundae) stuffed with glass noodles for a chewy, hearty texture. Served alongside freshly sliced pork liver and offal, pair it with Busan\u0027s signature ssamjang or seasoned chili salt. Clean, savory, and flavorful with zero gaminess, it offers an authentic market vibe rich in local hospitality.", "name": "Seomyeon Market Sundae \u0026 Offal (\uc11c\uba74\uc2dc\uc7a5 \uc21c\ub300)", "transport": "Approx. 4-min walk from Exit 7 of Seomyeon Station (Busan Metro Line 1 \u0026 2)"}, {"address": "16 Jungang-daero 692beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.5 stars | Korea\u0027s most famous street toast chain! Bread slices are griddled with rich butter to golden perfection, brushed with their signature sweet fruit-infused sauce, and stuffed with freshly cooked shredded cabbage omelets, pickles, and melted cheese. Served piping hot, each bite is crispy, fluffy, sweet, and savory\u2014making it a wildly popular grab-and-go breakfast or afternoon treat.", "name": "Isaac Toast Seomyeon Branch No. 1 (\uc774\uc0ad\ud1a0\uc2a4\ud2b8 \uc11c\uba741\ud638\uc810)", "transport": "Approx. 3-min walk from Exit 2 of Seomyeon Station (Busan Metro Line 1 \u0026 2)"}, {"address": "Street stall near 702 Jungang-daero, Busanjin-gu, Busan", "feature": "\u2b50 4.3 stars | A hugely popular traditional corner stall in Seomyeon shopping district. Their egg bread (gyeran-ppang) features a whole fresh egg baked right inside, offering a fluffy, savory-sweet delight. Their fish-shaped pastries (bungeoppang) come stuffed with rich sweet red bean or creamy custard filling, baked to a golden crisp outside with hot, oozing centers\u2014the ultimate winter comfort street food!", "name": "Seomyeon Egg Bread \u0026 Bungeoppang Street Food (\uc11c\uba74 \uacc4\ub780\ube75\u00b7\ubd95\uc5b4\ube75)", "transport": "Approx. 1-min walk from Exit 15 of Seomyeon Station (Busan Metro Line 1 \u0026 2)"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Seomyeon Shopping District and Underground Mall"}, "songdo_dadaepo": {"categories": {"cat_1": {"items": [{"address": "620-24 Amnam-dong, Seo-gu, Busan", "feature": "\u2b50 4.6 stars | Located right next to the Amnam Park Station of the Songdo Marine Cable Car, this is one of Busan\u0027s most iconic clusters of traditional local seafood tents. Long-established stalls like \u0027Haewol-jip\u0027 are hugely popular among locals and foodies. The signature grilled clams are served with rich melted cheese, steak, and buttered shrimp. Scallops and large clams sizzle over charcoal, releasing tempting, sweet juices. They are springy, savory, subtly smoky, and come in extraordinarily generous portions\u2014offering an authentic taste of port-town warmth and traditional open-air dining.", "name": "Amnam Park Shellfish Tents (\uc554\ub0a8\uacf5\uc6d0 \uc870\uac1c\uad6c\uc774)", "transport": "Take the Songdo Marine Cable Car to \u0027Songdo Sky Park Station\u0027 and walk for about 5 minutes, or take Bus 7, 71, or 95 to Amnam Park Station."}, {"address": "143 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.4 stars | A famous traditional eatery near Songdo Beach, boasting decades of expertise in simmering rich pork bone broth. The milky-white broth is smooth, comforting, and completely free of gamey odors. Tender slices of pork and chewy blood sausage swim in the warm soup, offering a balanced savory-sweet flavor. Locals love adding plenty of salted shrimp and chives for extra zest; as the rice soaks up the savory soup, it becomes rich and comforting\u2014a must-try classic meal to warm your soul after visiting the Songdo Cable Car.", "name": "Songdo 100-Year House Dwaeji Gukbap (\uc1a1\ub3c4\ubc31\ub144\uac00\ub3fc\uc9c0\uad6d\ubc25)", "transport": "Take Bus 7, 26, 30, 71, or 95 to Songdo Beach Station, then walk for about 3 minutes."}, {"address": "34 Chungmu-daero, Seo-gu, Busan", "feature": "\u2b50 4.3 stars | With decades of history, this legendary pufferfish specialty restaurant is a go-to secret spot among locals and connoisseurs for hangover cures and nourishment. The signature clear pufferfish soup features fresh pufferfish meat slow-cooked with water dropwort and bean sprouts. The broth is exceptionally sweet, clean, and refreshing, while the fish is firm, springy, and rich in collagen. Dipping the meat into their special vinegar soy sauce elevates the flavor even further, leaving a delightful aftertaste that is both satisfying and refreshing.", "name": "Songdo Halmae Bokguk (\uc1a1\ub3c4\ud560\ub9e4\ubcf5\uad6d)", "transport": "Take Subway Line 1 to Jagalchi Station (Exit 1), then transfer to Bus 7, 26, or 30 and get off at Songdo Entrance Station."}, {"address": "680 Dadae 1-ro, Saha-gu, Busan", "feature": "\u2b50 4.5 stars | A long-established noodle shop near Dadaepo Beach, famous for its strikingly generous seafood portions. The broth is simmered with abundant clams, small crabs, and kelp, delivering an intensely savory flavor with a subtle hint of black pepper. The handmade knife-cut noodles are pleasantly chewy and absorb the rich seafood broth wonderfully. Pro tip: Pair it with their spicy homemade kimchi\u2014the tangy, spicy kick complements the sweet seafood broth perfectly, making it a favorite among families and tourists alike.", "name": "Dadaepo Beodnamu Jip Kalguksu (\ubc84\ub4dc\ub098\ubb34\uc9d1 \ud574\ubb3c\uce7c\uad6d\uc218)", "transport": "Busan Subway Line 1, Dadaepo Beach Station Exit 1, about a 3-minute walk."}, {"address": "1582-7 Dadae-dong, Saha-gu, Busan", "feature": "\u2b50 4.2 stars | A traditional local spot preserving decades of rustic flavors, specializing in marsh clam soup made with local clams from the Nakdong River estuary. The clear soup is loaded with fresh chives and small clams, delivering a sweet, soothing finish with a light briny touch. Though the clams are tiny, they are abundant and tender. Served alongside a variety of traditional Korean side dishes and bibimbap sauce, you can pour your rice directly into the soup or mix it up bibimbap-style\u2014an authentic local taste showcasing Busan\u0027s heritage.", "name": "Dadaepo Halmae Jaecheopguk (\ub2e4\ub300\ud3ec \ud560\ub9e4\uc7ac\ucca9\uad6d)", "transport": "Busan Subway Line 1, Dadaepo Port Station Exit 1, about a 5-minute walk."}, {"address": "129 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.4 stars | A traditional raw fish restaurant located right along the Songdo beachfront, offering breathtaking ocean views and fresh live seafood. The signature assorted sashimi is skillfully sliced, featuring firm, chewy flesh with a sweet natural richness. Wrapping the fish in perilla leaves with classic Korean ssamjang creates a delightful multi-layered taste. The complimentary spicy fish stew (Maeuntang) served at the end is a true highlight\u2014bursting with garlic and pepper aromas, its spicy and sweet flavor will have you asking for extra rice. An ideal spot to experience traditional Busan seafood culture.", "name": "Songdo Haebyeon Hoejip (\uc1a1\ub3c4\ud574\ubcc0\ud69f\uc9d1)", "transport": "Take Bus 7, 26, or 30 to Songdo Beach Station, then walk along the coastal promenade for about 4 minutes."}, {"address": "690 Dadae 1-ro, Saha-gu, Busan", "feature": "\u2b50 4.5 stars | A long-standing, famous BBQ restaurant in Dadaepo, specializing in thick-cut Jirisan black pork. The meat is tender with beautifully balanced marbling. Grilled to a golden, crispy perfection on a custom hot plate, every bite releases rich, savory juices that are sweet and delicious without feeling overly greasy. Paired with pickled side dishes, kimchi, and soybean paste stew (Doenjang-jjigae), this spot offers a deeply satisfying taste of classic Korean BBQ heritage.", "name": "Dadaepo Jirisan Black Pork (\ub2e4\ub300\ud3ec \uc9c0\ub9ac\uc0b0 \ud751\ub3fc\uc9c0)", "transport": "Busan Subway Line 1, Dadaepo Beach Station Exit 1, about a 2-minute walk."}, {"address": "608-2 Amnam-dong, Seo-gu, Busan", "feature": "\u2b50 4.3 stars | A traditional eel and hagfish specialty restaurant located near the entrance of the Amnam Park Coastal Walkway in Songdo. Preserving authentic charcoal grilling techniques, freshly prepared hagfish is stir-fried on a hot plate with a signature spicy-sweet red sauce. The hagfish is delightfully snappy and chewy, infused with a smoky charred aroma that instantly whets your appetite. To finish, the remaining sauce is tossed with rice and seaweed to create a crispy fried rice\u2014a beloved hot spot for local foodies and drink lovers.", "name": "Songdo San-ag-eo Chon (\uc1a1\ub3c4 \uc0b0\uc7a5\uc5b4\ucd0c)", "transport": "Take Bus 7, 71, or 95 to Amnam Park Station, then walk for about 4 minutes."}], "name": "Iconic Traditional Local Eateries"}, "cat_2": {"items": [{"address": "624 Amnam-dong, Seo-gu, Busan", "feature": "\u2b50 4.6 Stars | Situated on the cliffside of the Songdo coast, this massive seven-story bakery cafe offers panoramic views of the blue ocean and the Songdo Marine Cable Car. The cafe specializes in freshly baked artisanal bread and exquisite tart desserts. Their signature \u0027Salted Butter Croissant\u0027 is crispy on the outside, fluffy and rich on the inside, bursting with buttery aroma and a subtle hint of salt with every bite. Many visitors come during sunny afternoons to relax on the outdoor terrace step seating, savoring crispy French toast alongside rich Americano coffee while soaking in Songdo\u0027s sea breeze and the sight of cable cars gliding across the sky.", "name": "EL16.52 Bakery Cafe", "transport": "Take Busan Metro Line 1 to Jagalchi Station, transfer to Bus No. 7 or 71, get off at Amnam Park Station, and walk for about 5 minutes."}, {"address": "143 Songdobeach-ro, Seo-gu, Busan", "feature": "\u2b50 4.3 Stars | Located directly in front of Songdo Beach, TCC Cafe is most famous for its rooftop outdoor screening area and panoramic ocean view deck. It serves high-quality specialty hand-drip coffee and thick-cut caramelized French toast. The toast is slightly charred and sweet on the outside, soft and cloud-like inside, creating an amazing hot-and-cold sensation when paired with premium vanilla ice cream. Enjoying a delicious brunch while gazing out at cable cars crossing the sea makes this a favorite photo spot for local youth and tourists alike.", "name": "TCC Songdo Ocean View Cafe", "transport": "Take Busan Metro Line 1 to Nampo Station, transfer to Bus No. 26 or 30, get off at Songdo Beach Station, and walk for about 2 minutes."}, {"address": "3F, 181 Amnampark-ro, Seo-gu, Busan", "feature": "\u2b50 4.2 Stars | Located on the 3rd floor of the Songdo Marine Cable Car Amnam Park Station (the top cable car terminal), this cafe offers an unbeatable view overlooking the entire Songdo Strait. Popular highlights include the \u0027Waffle Brunch Platter\u0027 and the \u0027Ocean Blue Sparkling Drink.\u0027 The freshly baked waffles are crispy outside and soft inside, paired with savory bacon, scrambled eggs, and fresh greens for a delightful mix of sweet and savory. The sparkling drink features a beautiful blue gradient that is refreshingly sweet and sour. Sitting by the glass windows and watching cable cars float smoothly through the sky makes you feel as relaxed as if you were resting in the clouds.", "name": "Cafe Cloud 308", "transport": "Take the Songdo Marine Cable Car to Amnam Park Top Station and go directly to the 3rd floor of the tower."}, {"address": "1578-4 Dadae-dong, Saha-gu, Busan", "feature": "\u2b50 4.5 Stars | Located near Dadaepo Beach, this large ocean-view bakery cafe is deeply loved by locals and tourists. The signature \u0027Six-Sided Garlic Cream Bread\u0027 features a golden, crispy crust filled with rich, bursting garlic butter that melts irresistibly in your mouth. Paired with a slightly bitter signature latte, it balances the rich flavors perfectly. The spacious two-story hall with floor-to-ceiling windows allows guests to enjoy delicious baked treats while taking in Dadaepo\u0027s famous sunset views.", "name": "EASYYO 61 Bakery Cafe", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station (Exit 1) and walk for about 8 minutes."}, {"address": "42 Molundae 1-ro, Saha-gu, Busan", "feature": "\u2b50 4.4 Stars | Situated along the Dadaepo coastline, this chic brunch cafe is renowned for its sleek white decor and cozy atmosphere. Try their \u0027Classic Eggs Benedict Brunch\u0027\u2014slicing open the poached eggs reveals rich yolks flowing over toasted English muffins and smoked salmon, all complemented by tangy hollandaise sauce for an incredibly velvety texture. Additionally, the \u0027Rich Chestnut Basque Cheesecake\u0027 has a dense texture infused with deep chestnut sweetness, making it the perfect afternoon tea treat to enjoy alongside ocean views and Dadaepo\u0027s evening glow.", "name": "Cafe Clam Dadaepo Ocean View Cafe", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station (Exit 2) and walk for about 5 minutes."}, {"address": "612 Amnam-dong, Seo-gu, Busan", "feature": "\u2b50 4.4 Stars | Tucked away next to the coastal cliffs of Songdo, this standalone cafe boasts unobstructed ocean views. Their signature \u0027Red Bean Butter Scone\u0027 is tender and buttery, layered with smooth red bean paste and a thick slice of cold butter that melts in your mouth with a perfectly balanced sweet and savory taste. Sitting on the outdoor terrace while listening to waves crash against the rocks and sipping a rich Dutch cold brew coffee makes this a hidden brunch gem for travelers seeking a tranquil atmosphere and natural scenery.", "name": "Cafe Halat Cliffside Cafe", "transport": "Take Busan Metro Line 1 to Jagalchi Station, transfer to Bus No. 7, get off at Amnam Park Entrance Station, and walk for about 7 minutes."}, {"address": "682 Dadaepo-ro, Saha-gu, Busan", "feature": "\u2b50 4.3 Stars | Located near Dadaepo Beach, this Instagram-worthy cafe is famous for its breathtaking sunset views. The popular \u0027Strawberry Souffle Pancake\u0027 is made to order; its cloud-like fluffy pancakes melt in your mouth, served with abundant house-made custard cream and fresh strawberries for a sweet, comforting bliss. The cafe also features sea-facing high-stool seating where you can sip a \u0027Brown Sugar Boba Latte\u0027 as the sky transforms into magical shades of pink and purple\u2014a soul-soothing experience not to be missed when visiting Dadaepo.", "name": "Cafe VP Ocean View Sunset Cafe", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station (Exit 4) and walk for about 6 minutes."}, {"address": "626 Dadaepo-ro, Saha-gu, Busan", "feature": "\u2b50 4.5 Stars | This cozy Korean-style brunch cafe is located near the Molundae Coastal Walk in Dadaepo. The signature \u0027Avocado \u0026 Smoked Chicken Sandwich\u0027 uses natural sourdough toasted crisp outside and soft inside, packed with thick avocado slices, tender smoked chicken, and custom seed mustard sauce for a fresh, nutrient-rich meal. Paired with a \u0027Matcha Cream Latte\u0027\u2014where earthy matcha seamlessly blends with sweet cream\u2014this place comes highly recommended by both travelers and locals as the perfect spot to recharge after a walk.", "name": "Cafe Mandarina Cozy Cafe", "transport": "Take Busan Metro Line 1 to Dadaepo Port Station (Exit 1) and walk for about 7 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "620-24 Amnam-dong, Seo-gu, Busan", "feature": "\u2b50 4.6 stars | Located right next to the Songdo Cable Car Amnam Park Station, this is a unique local seafood tent cluster in Busan. It specializes in freshly grilled giant scallops, abalone, cheese shrimp, and cheesy baked seafood. Paired with ice-cold Korean soju or beer, you can enjoy stunning ocean views with a pleasantly tipsy vibe, making it a favorite among young locals and tourists alike.", "name": "Amnam Park Shellfish Food Tents (\uc554\ub0a8\uacf5\uc6d0 \uc870\uac1c\uad6c\uc774 \ud3ec\uc7a5\ub9c8\ucc28)", "transport": "Take the Songdo Marine Cable Car to Amnam Park Station and walk about 3 minutes; or take Bus 7 or 71 and get off at Amnam Park Station."}, {"address": "1551-1 Dadae-dong, Saha-gu, Busan", "feature": "\u2b50 4.5 stars | Located next to Dadaepo Beach, this spot is famous for allowing guests to savor thick-cut charcoal-grilled pork belly while watching Busan\u0027s most beautiful sunset. Blending outdoor camping vibes with a stylish bistro pub ambiance, it serves special Korean dipping sauces and highballs, creating a lively yet romantic atmosphere.", "name": "Dadaepo Sunset BBQ \u0026 Pub (\ub2e4\ub300\ud3ec\uc11d\uc591\uc9d1)", "transport": "Busan Metro Line 1 Dadaepo Beach Station, Exit 1, walk about 8 minutes."}, {"address": "4-1 Morundae 1-ro, Saha-gu, Busan", "feature": "\u2b50 4.4 stars | A historic local pub in Dadaepo, renowned for its seafood pancakes packed with octopus and green onions, boiled octopus, and artisanal makgeolli (rice wine). The outdoor dining area faces the sea directly; as evening breezes blow, sipping custom rice wine with crispy pancakes offers an authentic Busan port town vibe.", "name": "Dadaepo Halmae-jib Pub (\ub2e4\ub300\ud3ec \ud560\ub9e4\uc9d1)", "transport": "Busan Metro Line 1 Dadaepo Beach Station, Exit 2, walk about 5 minutes."}, {"address": "151 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.3 stars | A specialty restaurant famous for its overflowing live seafood stew, brimming with octopus, abalone, crab, and various shellfish that create an incredibly sweet and savory broth when boiled. Ordering a hot pot of seafood stew paired with authentic Busan C1 soju while enjoying the dazzling night view of the Songdo Skywalk in the evening is the top choice for experiencing local Busan food culture.", "name": "Songdo Seafood Stew \u0026 Soju House (\uc1a1\ub3c4\ud574\ubb3c\ud0d5)", "transport": "Take Bus 7, 26, or 30 to Songdo Beach Station, then walk about 3 minutes."}, {"address": "79 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.4 stars | Situated along the Songdo coastline, this venue blends traditional Korean sashimi with a modern bistro concept. It serves fresh, farm-direct flounder and sea bream sashimi platters alongside seared seafood pub snacks. Paired with selected sake or soju, large floor-to-ceiling windows offer a stunning view of the marine cable cars gliding through the night sky.", "name": "Songdo Coast Raw Fish \u0026 Sake (\uc1a1\ub3c4\uc5f0\uc548\ud69f\uc9d1)", "transport": "Take Bus 7 or 26 to Songdo Beach Station, then walk about 4 minutes."}, {"address": "285 Dadaehaean-ro, Saha-gu, Busan", "feature": "\u2b50 4.2 stars | An industrial-style shellfish bistro near Dadaepo Port. In addition to extravagant platters of cheesy grilled scallops, it offers craft beers and international pub dishes like seafood pasta. Illuminated by neon lights at night, it draws many young adults looking to gather for drinks after watching the Dadaepo Sunset Fountain of Dreams.", "name": "Dadaepo Sea Breeze Shellfish \u0026 Beer (\ub2e4\ub300\ud3ec \ubc14\ub2e4\ubc14\ub78c \uc870\uac1c\uad6c\uc774)", "transport": "Busan Metro Line 1 Dadaepo Port Station, Exit 1, walk about 6 minutes."}, {"address": "93 Janglimsijang-ro, Saha-gu, Busan", "feature": "\u2b50 4.3 stars | Located in the colorful Janglim Port area (Busan\u0027s \u0027Venice\u0027), this pub combines Burano-style charm with local Busan seafood night-stall favorites. Offering spicy stir-fried octopus and pork, grilled seafood skewers, and ice-cold beers, its bright colorful buildings paired with sunset views over the harbor make it an excellent spot for photos and late-night snacks.", "name": "Janglim Port Venice Seafood Pub (\uc7a5\ub9bc\ud56d \ud574\ubb3c\ud3ec\ucc28)", "transport": "Busan Metro Line 1 Janglim Station, Exit 1, transfer to Saha-gu Village Bus No. 5 and get off at Janglim Port Entrance."}, {"address": "34 Chungmu-daero, Seo-gu, Busan", "feature": "\u2b50 4.5 stars | Transforms Busan\u0027s iconic pork rice soup (Dwaeji Gukbap) into a late-night diner with a bistro atmosphere. Rich white broth served with thick slices of fresh pork and homemade kimchi is complemented at night by local craft draft beer and spicy blood sausage (sundae) platters\u2014attracting foodies seeking a warm, satisfying meal after enjoying night ocean views.", "name": "Songdo Cheil Pork Soup \u0026 Local Beer (\uc1a1\ub3c4\uc81c\uc77c\ub3fc\uc9c0\uad6d\ubc25)", "transport": "Take Bus 7, 9, or 71 to Songdo Entrance Station, then walk about 2 minutes."}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "127 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.5 stars | Located next to Songdo Beach, this plant-based restaurant is tailored specifically for vegetarians and vegans. Its signature vegan tofu stew features a rich seaweed and shiitake mushroom broth paired with dense, silky freshly-made uncurdled tofu and a variety of mushrooms, creating a savory, smooth, and mildly spiced soup. Piping hot and meltingly soft in every bite, it is a cozy, healing meal ideal for travelers before or after taking the cable car.", "name": "Songdo Vegan Tofu Stew (Songdo Vegan Tofu / \uc1a1\ub3c4 \ucc44\uc2dd\ub450\ubd80)", "transport": "Take Busan Metro Line 1 to Nampo Station, transfer to Bus 7 or 26, get off at Songdo Beach Station, and walk about 3 minutes."}, {"address": "15 Molundae 1-gil, Saha-gu, Busan", "feature": "\u2b50 4.3 stars | Situated near Dadaepo Beach and the entrance to the Molundae walking trail, this restaurant specializes in all-natural wild mountain vegetable bibimbap. Plentiful bracken fern, bellflower root, shiitake mushrooms, and fresh seasonal green vegetables are layered over steaming hot rice in a stone pot, served with a special vegan gochujang sauce. The crispy browned rice at the bottom adds rich textural contrast and a refreshing mountain aroma, making it hugely popular among hikers and plant-based diners.", "name": "Dadaepo Mountain Vegetable Bibimbap (Dadaepo Mountain Vegetable Bibimbap / \ub2e4\ub300\ud3ec \uc0b0\ucc44\ube44\ube54\ubc25)", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station Exit 1, walk about 5 minutes."}, {"address": "181 Amnamgongwon-ro, Seo-gu, Busan", "feature": "\u2b50 4.6 stars | Perched near the top station of the Songdo Marine Cable Car, this cafe offers 100% plant-based, dairy-free, and egg-free desserts alongside pour-over plant-milk coffee. The signature vegan matcha oat tart boasts an extra-crispy crust and a smooth, rich filling infused with deep tea flavor and a balanced sweetness. Large floor-to-ceiling windows look straight out onto the deep blue ocean and gliding cable cars, making it the finest spot to enjoy a guilt-free afternoon tea with sea views.", "name": "Songdo Green View Vegan Cafe (Songdo Green View Vegan Cafe / \uc1a1\ub3c4 \ube44\uac74\uce74\ud398)", "transport": "Take the Songdo Marine Cable Car to Amnam Park Station, walk about 2 minutes after exiting."}, {"address": "700 Dadae-ro, Saha-gu, Busan", "feature": "\u2b50 4.4 stars | Close to the Dadaepo Sunset Fountain of Dreams, this establishment serves exquisite Korean vegan set meals. Highlights include grilled soy protein slices that are crisp on the outside and tender inside, fried burdock, and a variety of organic seasonal vegetable side dishes. The vegan BBQ is juicy and flavorful, rich with sweet Korean BBQ marinade notes and a satisfying soy-protein bite that wins over even non-vegetarians.", "name": "Dadaepo Sunset Vegan Dining (Dadaepo Sunset Vegan Dining / \ub2e4\ub300\ud3ec \ub178\uc744\ucc44\uc2dd\uc815\uc2dd)", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station Exit 4, walk about 4 minutes."}, {"address": "620-53 Amnam-dong, Seo-gu, Busan", "feature": "\u2b50 4.2 stars | A cozy eatery located at the trail entrance of Amnam Park, specializing in fully plant-based vegetable gimbap. Nutritious brown rice wraps braised burdock, pickled radish, carrots, and spinach, brushed generously with aromatic sesame oil. Every bite delivers a delightful burst of crispy seaweed and fresh vegetables with a light, solid finish\u2014a top snack pick while strolling over to the Songdo Yonggung Suspension Bridge.", "name": "Amnam Park Vegan Gimbap (Amnam Park Vegan Gimbap / \uc554\ub0a8\uacf5\uc6d0 \uc57c\ucc44\uae40\ubc25)", "transport": "Take the Songdo Marine Cable Car to Amnam Park Station, walk about 3 minutes towards the Yonggung Suspension Bridge."}, {"address": "1588-2 Dadae-dong, Saha-gu, Busan", "feature": "\u2b50 4.1 stars | Right next to the entrance of Molundae Nature Park, this spot is renowned for traditional pure buckwheat vegetable pancakes. Pan-fried to golden crispy edges with a soft, chewy center, the pancake is packed with abundant greens and vegan kimchi. Served with a custom savory vegan soy sauce, its subtle tangy and spicy flavor highlights the distinct nutty aroma of buckwheat\u2014a must-eat post-hike treat for locals and tourists.", "name": "Molundae Buckwheat Vegan Pancake (Molundae Buckwheat Vegan Pancake / \ubab0\uc6b4\ub300 \uba54\ubc00\uc804)", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station Exit 2, walk about 6 minutes."}, {"address": "79 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.7 stars | This seaside bakery specializes in milk-free, egg-free, and butter-free vegan breads and handcrafted cookies. The signature vegan rice bread features a crisp outer crust and a cloud-soft interior, offering a delicate natural rice flavor as you chew. Taking a loaf to enjoy while walking along Songdo Beach is both healthy and delicious, offering marvelous ocean vistas favored by health-conscious travelers.", "name": "Songdo Seaside Vegan Bakery (Songdo Seaside Vegan Bakery / \uc1a1\ub3c4 \ube44\uac74 \ubca0\uc774\ucee4\ub9ac)", "transport": "Take Bus 7, 9, 26, or 30 to Songdo Beach Station, walk about 2 minutes."}, {"address": "102 Dadaehaean-ro, Saha-gu, Busan", "feature": "\u2b50 4.5 stars | Combining traditional Korean tea culture with healthy plant-based eating, this unique tea house sits on the Dadaepo coastline. The vegan pumpkin porridge and traditional pine nut tea are strongly recommended; the pumpkin porridge is silky and fine, melting effortlessly in your mouth with a natural, subtle sweetness, while the rich pine nut tea gently warms the body. Its rustic, peaceful ambience makes it the ideal resting spot after watching a breathtaking Dadaepo sunset.", "name": "Dadaepo Lotus Health Vegan Tea House (Dadaepo Lotus Health Vegan Tea House / \ub2e4\ub300\ud3ec \uc5f0\ud654\ucc44\uc2dd\ucc3b\uc9d1)", "transport": "Take Busan Metro Line 1 to Dadaepo Port Station Exit 1, walk about 8 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "171 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.3 stars | Located at the top observatory of the Songdo Cable Car, this snack stand\u0027s signature items are crispy-on-the-outside, soft-on-the-inside Korean corn dogs and freshly grilled cheese sausage skewers. Coated with powdered sugar and yellow mustard, every juicy bite offers firm, springy sausage meat. Paired with stunning Songdo ocean views, it\u0027s a must-buy sweet-and-savory walk-and-eat treat for cable car riders.", "name": "Songdo Sky Park Snack Bar", "transport": "Take Busan Metro Line 1 to Jagalchi Station, then transfer to Bus No. 7 to Songdo Cable Car Station"}, {"address": "100 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.5 stars | Ssiat Hotteok (seed-stuffed Korean pancake) is an iconic Busan snack you can\u0027t miss! Pan-fried in butter to a golden crisp, the pancake is cut open and stuffed with fragrant sunflower seeds, peanuts, and pumpkin seeds. Slightly salty yet sweet on the outside, with a gooey molten brown sugar center and crunchy nuts inside, it\u2019s served piping hot, sweet, and satisfying\u2014a huge favorite among locals and tourists alike.", "name": "Songdo Seaside Ssiat Hotteok", "transport": "Take Bus No. 26 to Songdo Beach Station and walk for about 3 minutes"}, {"address": "5 Amnamgongwon-ro, Seo-gu, Busan", "feature": "\u2b50 4.4 stars | Serving authentic Busan fish cakes boiled fresh to order! Containing over 80% real fish paste, these skewers are wonderfully bouncy and packed with umami flavor. Simmered in a rich anchovy and kelp broth, the soft, flavorful fish cakes soak up every bit of savory goodness. Enjoying a hot skewer with a free cup of warm broth while strolling in winter is pure bliss.", "name": "Songdo Handmade Fish Cake Stall", "transport": "Take Bus No. 7, 9, or 71 and get off at Amnam Park Station"}, {"address": "620-53 Amnam-dong, Seo-gu, Busan", "feature": "\u2b50 4.2 stars | A popular street food spot near the Songdo Yonggung Suspension Bridge, serving large whole squids grilled fresh over charcoal and slathered in a special sweet-and-spicy sauce. The charcoal fire imparts an irresistible smoky aroma to the thick, chewy squid meat. Bursting with savory sauce and sweet seafood flavor, it\u0027s the ultimate energy-boosting snack along the Songdo Coastal Walk.", "name": "Amnam Park Grilled Squid \u0026 Seafood", "transport": "Take the Songdo Marine Cable Car to Sky Park Station, then walk to the entrance of Amnam Park"}, {"address": "1582-1 Dadae-dong, Saha-gu, Busan", "feature": "\u2b50 4.4 stars | A traditional street food stall near Dadaepo Beach, famous for thick rice cakes simmered in a rich, thick Korean chili sauce. Chewy and soft, the rice cakes perfectly absorb the sweet and spicy sauce. Pair them with golden-crisp deep-fried shrimp and vegetables dipped into the tteokbokki sauce for incredible depth of flavor\u2014a must-visit food stop after watching the Dadaepo sunset.", "name": "Dadaepo Sunset Tteokbokki \u0026 Twigim", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station (Exit 4) and walk for about 2 minutes"}, {"address": "696 Dadae-ro, Saha-gu, Busan", "feature": "\u2b50 4.6 stars | A traditional winter street dessert that locals line up for! The outer crust is baked paper-thin and cookie-crisp, overflowing with silky red bean paste and rich custard cream. Biting into a fresh, hot bungeoppang reveals a melt-in-your-mouth blend of sweet red bean and creaminess, creating a delicious contrast between the toasted exterior and soft filling.", "name": "Dadaepo Golden Bungeoppang", "transport": "Take Busan Metro Line 1 to Dadaepo Harbor Station (Exit 2) and walk for about 3 minutes"}, {"address": "94-1 Dadae-dong, Saha-gu, Busan", "feature": "\u2b50 4.1 stars | A traditional market-style food stall serving freshly sliced authentic Korean blood sausage (sundae) and steamed injeolmi (rice cake with roasted soybean powder). The sundae is dense and savory, perfectly complemented by seasoned salt, while the hand-pounded injeolmi is generously coated in fragrant soybean powder, offering a chewy, addictive flavor rich in old-school charm.", "name": "Dadaepo Traditional Sundae \u0026 Injeolmi", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station (Exit 1) and walk for about 5 minutes"}, {"address": "93 Jangrimsijang-ro, Saha-gu, Busan", "feature": "\u2b50 4.3 stars | A popular snack stall right next to the Venetian-style photo spot at Jangrim Port. Large chunks of juicy chicken thigh are skewered with green scallions, charcoal-grilled to smoky perfection, and brushed with special teriyaki or spicy sauce. Tender and juicy, every bite bursts with rich flavor balanced by crisp, sweet scallions\u2014perfect to enjoy while taking in the colorful harbor views.", "name": "Jangrim Port Rainbow Chicken Skewer", "transport": "Take Busan Metro Line 1 to Jangrim Station, then transfer to Saha-gu Mini Bus No. 2 to Jangrim Port"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Songdo Marine Cable Car and Dadaepo"}};
        const themeHex = "#0284c7";
        const cityName = "Busan";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
