shion trends in one visit.", "name": "Wonderplace Seomyeon Store", "transport": "Busan Metro Line 1/Line 2 Seomyeon Station Exit 2, about a 4-minute walk"}, {"address": "26, Jungang-daero 692beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.2 Stars | Must-Buy List: Korean floor-length cargo pants, geometric leather crossbody bags, cropped knit cardigans. Market A is a massive locally operated trendy fashion select store centered around minimalist, edgy, and modern Korean style. The interior of the Seomyeon store is neatly organized and color-coded, offering a wide selection of high-quality unisex apparel made in Korea, alongside designer footwear and bags, making it a favorite among Busan fashion lovers.", "name": "Market A Seomyeon Store", "transport": "Busan Metro Line 1/Line 2 Seomyeon Station Exit 2, about a 5-minute walk"}, {"address": "694 Jungang-daero, Busanjin-gu, Busan", "feature": "\u2b50 4.5 Stars | Must-Buy List: Korea-exclusive collaboration sneakers, OTZ retro bump shoes, textured canvas tote bags from Korean brands. FOLDER is a local Korean footwear select store. Beyond carrying major international brands, its biggest draw lies in its exclusive limited-edition sneakers and trendy accessories created in collaboration with local Korean designers and brands. Well-stocked with unique styles, the Seomyeon store is a must-visit for sneakerheads and young shoppers looking for one-of-a-kind looks.", "name": "FOLDER Seomyeon Store", "transport": "Busan Metro Line 1/Line 2 Seomyeon Station Exit 2, walk straight for about 2 minutes"}, {"address": "2F, NC Department Store, 92 Dongcheon-ro, Busanjin-gu, Busan", "feature": "\u2b50 4.1 Stars | Must-Buy List: French soft-style linen dresses, Korean-designed woven shoulder bags, sleek chiffon wide-leg pants. TWEE is a famous local fast-fashion women\u0027s clothing brand in Korea, showcasing a seamless blend of sweet, minimalist, and chic urban styles. Most clothes are designed locally in Korea, with fresh arrivals of trendy apparel and exquisite handbags stocked weekly. Offering budget-friendly prices and great quality, it is immensely popular among young women in Busan.", "name": "TWEE Seomyeon NC Store", "transport": "Busan Metro Line 1/Line 2 Seomyeon Station Exit 4 or 6, about a 7-minute walk"}, {"address": "Seomyeon Underground Shopping Center, 737 Jungang-daero, Busanjin-gu, Busan", "feature": "\u2b50 4.3 Stars | Must-Buy List: High-waisted flattering wide-leg pants, soft knit cropped tops, textured leather square bags. Located inside the expansive Seomyeon Underground Shopping Center, this independent women\u0027s boutique is a local secret spot for Busan girls hunting for fashion treasures. The store carefully selects high-quality, Made in Korea apparel that flatters Asian silhouettes with unique designs. Combined with friendly advice from the staff, you can put together stylish, high-end Korean outfits at budget-friendly prices.", "name": "307 Studio Women\u0027s Clothing Store (Seomyeon Underground Mall)", "transport": "Inside Seomyeon Station Underground Shopping Mall area, Busan Metro Line 1/Line 2"}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "B1, Lotte Department Store Busan Main Store, 772 Gaya-daero, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uac00\uc57c\ub300\ub85c 772 \ub86f\ub370\ubc31\ud654\uc810 \ubd80\uc0b0\ubcf8\uc810 B1)", "feature": "\u2b50 4.5 Stars | Must-Buy List: Chili Fishcakes, Cheese Shrimp Ball Fishcakes, Assorted Fishcake Gift Box. Founded in 1953, Samjin Amook is Busan\u0027s most iconic traditional fishcake brand. The store serves freshly made and fried fishcakes with a firm, springy texture packed with savory flavor. Tourists love purchasing the chilled, vacuum-sealed gift boxes to bring home or enjoy as a late-night snack; the cheese and chili flavors are top bestsellers.", "name": "Samjin Amook - Lotte Department Store Busan Main Store", "transport": "Direct access from Seomyeon Station (Busan Metro Line 1/2) via the underground connection directly to Lotte Department Store B1."}, {"address": "B1, Lotte Department Store Busan Main Store, 772 Gaya-daero, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uac00\uc57c\ub300\ub85c 772 \ub86f\ub370\ubc31\ud654\uc810 \ubd80\uc0b0\ubcf8\uc810 B1)", "feature": "\u2b50 4.4 Stars | Must-Buy List: Hakuyen-mae Cake, Giant Cream Puffs, Madeleine Gift Box. OPS is a legendary bakery brand originating from Haeundae, Busan. The Seomyeon branch is located inside Lotte Department Store. Its famous \u0027Hakuyen-mae Cake\u0027 boasts a rich egg flavor and honey sweetness, serving as a cherished childhood memory for locals. Its shelf-stable packaging makes it an ideal souvenir for friends and family.", "name": "OPS Bakery - Lotte Department Store Busan Main Store", "transport": "Direct access from Seomyeon Station (Busan Metro Line 1/2) via the underground connection directly to Lotte Department Store B1."}, {"address": "16 Jungang-daero 692beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc911\uc559\ub300\ub85c 692\ubc88\uae38 16)", "feature": "\u2b50 4.3 Stars | Must-Buy List: Abalone Fishcake, Cheese Fishcake Bar, Fishcake Noodle Meal Kit. Goraesa is another historic fishcake brand in Busan, famous for using pure fish meat with no added preservatives. The Seomyeon branch offers a comfortable dine-in area and a dedicated section for vacuum-sealed souvenirs. Its exclusively developed fishcake noodles and luxurious fishcakes wrapped around whole abalones are top choices for gifts.", "name": "Goraesa Amook - Seomyeon Branch", "transport": "Approx. 3-minute walk from Exit 2 of Seomyeon Station (Busan Metro Line 1/2)."}, {"address": "15 Jeonpo-daero 209beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc804\ud3ec\ub300\ub85c209\ubc88\uae38 15)", "feature": "\u2b50 4.6 Stars | Must-Buy List: Chocolate Palmiers, Dirty Chocolate Buns, Garlic Butter Bread. Located o very visitor\u0027s basket.", "name": "Olive Young - Seomyeon Town Flagship Store", "transport": "Approx. 2-minute walk from Exit 2 of Seomyeon Station (Busan Metro Line 1/2)."}, {"address": "Seomyeon Underground Shopping Center, 737 Jungang-daero, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc911\uc559\ub300\ub85c 737 \uc11c\uba74\uc9c0\ud558\uc0c1\uac00)", "feature": "\u2b50 4.2 Stars | Must-Buy List: Mini Roll Cake Gift Box, Mocha Layer Cake, Macaron Gift Box. Jeonghangwoo Cake is a classic local Busan dessert brand, and this store in the underground mall allows travelers to grab sweet treats conveniently. Its mini roll cakes are fluffy, tender, and gently sweet. Beautifully packaged in gift boxes with various flavor combinations, it\u0027s an ideal spot to pick up local dessert gifts while exploring the underground mall.", "name": "Jeonghangwoo Cake - Seomyeon Underground Branch", "transport": "Located inside the Seomyeon Underground Shopping Center (Seomyeon Station, Busan Metro Line 1/2)."}, {"address": "11 Jeonpo-daero 209beon-gil, Busanjin-gu, Busan (\ubd80\uc0b0 \ubd80\uc0b0\uc9c4\uad6c \uc804\ud3ec\ub300\ub85c209\ubc88\uae38 11)", "feature": "\u2b50 4.6 Stars | Must-Buy List: Busan-Exclusive Illustrated Cracker Gift Boxes, Local Artisanal Jam, Specialty Dried Fruit Tea Bags. Object is an iconic Korean lifestyle and design store. Besides original stickers and stationery, the Seomyeon branch specially curates unique snacks and souvenirs crafted by independent local brands, such as beautifully illustrated cracker boxes and artisanal fruit teas, which are immensely popular among indie craft lovers and female travelers.", "name": "Object - Seomyeon Branch", "transport": "Approx. 4-minute walk from Exit 7 of Jeonpo Station (Busan Metro Line 2)."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "772 Jungang-daero, Busanjin-gu, Busan", "feature": "\u2b50 4.5 stars | Must-Buy List: OPS French bakery cheese bun metro to Osiria Station, Exit 1, and walk approx. 10 minutes"}, {"address": "694 Jungang-daero, Busanjin-gu, Busan", "feature": "\u2b50 4.7 stars | Must-Buy List: Musinsa slim-fit dress pants, minimalist heavy-weight 100% cotton T-shirts, Korean-style tailored oversized blazers. A massive physical flagship store opened in Seomyeon by Musinsa, South Korea\u0027s largest online fashion platform. Highlighting high value, sleek minimalism, and ultra-stylish K-fashion essentials, it is highly praised by local college students and trendsetters\u2014a must-visit destination for modern Korean minimalist styling.", "name": "Musinsa Standard Seomyeon", "transport": "Approx. 3-minute walk from Exit 2 of Seomyeon Station (Busan Metro Line 1)"}, {"address": "772 Gaya-daero, Busanjin-gu, Busan", "feature": "\u2b50 4.6 stars | Must-Buy List: Postcards by local Busan illustrators, handmade scented candles, designer collaboration ceramic cups and plates. A multi-functional complex building dedicated to arts, performances, and local design selections. The Design Square on the 2nd floor specializes in creative lifestyle items and cultural products by independent Busan and Korean designers. Every item is uniquely crafted with local artistic charm, making it the best spot for unique, high-quality souvenirs.", "name": "KT\u0026G Sangsang Madang Busan", "transport": "Approx. 7-minute walk from Exit 7 of Seomyeon Station (Busan Metro Line 1)"}, {"address": "11 Jeonpo-daero 209beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.5 stars | Must-Buy List: Korean independent illustrator tote bags, handmade woven placemats, heartwarming decorative embroidered patches. Located near Jeonpo Cafe Street in Seomyeon, Object is an iconic Korean creative selection store. Featuring handpicked stationery, accessories, and home goods from hundreds of local independent artists and emerging designers, the shop is filled with cozy, playful charms\u2014a beloved lifestyle shop among local young women.", "name": "Object Seomyeon", "transport": "Approx. 4-minute walk from Exit 7 of Jeonpo Station (Busan Metro Line 2)"}, {"address": "22 Jungang-daero 692beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Korean oversized drop-shoulder hoodies, cargo multi-pocket wide pants, street fashion beanies. Troubadour is an iconic Korean flagship chain for independent streetwear. The massive Seomyeon store showcases thousands of locally designed menswear and unisex street style pieces. Neatly organized by color and style, with budget-friendly prices and rapid inventory updates, it\u0027s a must-visit spot to catch the latest wave of Busan street fashion.", "name": "Troubadour Seomyeon", "transport": "Approx. 4-minute walk from Exit 2 of Seomyeon Station (Busan Metro Line 1)"}, {"address": "31 Jungang-daero 692beon-gil, Busanjin-gu, Busan", "feature": "\u2b50 4.2 stars | Must-Buy List: Folder exclusive colorway retro running shoes, Korea-exclusive Otazu canvas shoes, stylish Korean design socks. FOLDER is Korea\u0027s premier local sneaker and footwear boutique, situated right in the heart of Seomyeon\u0027s shopping district. Beyond offering limited-edition releases from major brands, it features exclusive shoes and accessories designed in collaboration with Korean designers, making it a trendy treasure trove for K-sneaker enthusiasts.", "name": "FOLDER Seomyeon", "transport": "Approx. 4-minute walk from Exit 2 of Seomyeon Station (Busan Metro Line 1)"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Seomyeon Shopping District and Underground Mall"}, "songdo_dadaepo": {"categories": {"cat_1": {"items": [{"address": "4 Dadaenakjo 2-gil, Saha-gu, Busan", "feature": "\u2b50 4.5 Stars | Must-Buy List: Care Plus Acne Dressing Patch, Torriden Dive-In Low Molecular Hyaluronic Acid Serum, Skinfood Carrot Carotene Calming Water Pad. Located near Dadaepo Beach Station, this is an essential beauty restock stop for visitors after taking in the mbo-sized Mochi Toner offers incredible value for money, serving as the top hydrating choice for savvy shoppers.", "name": "TONYMOLY Dadaepo Branch (\ud1a0\ub2c8\ubaa8\ub9ac \ub2e4\ub300\uc810)", "transport": "Busan Metro Line 1, Dadaepo Harbor Station, Exit 1, approx. 6-min walk"}, {"address": "670 Dadae-ro, Saha-gu, Busan", "feature": "\u2b50 4.3 Stars | Must-Buy List: CNP Propolis Energy Ampule, Beyond Deep Moisture Body Lotion, The Face Shop Rice Water Bright Cleansing Oil. A cosmetics concept store under LG Household \u0026 Health Care that brings together derma-skincare from CNP and botanical care from Beyond. Bright and clean, the shop provides plenty of testers and exclusive value sets, making it a go-to location for locals stocking up on essentials.", "name": "Nature Collection Dadaepo Branch (\ub124\uc774\ucc98\uceec\ub809\uc158 \ub2e4\ub300\uc810)", "transport": "Busan Metro Line 1, Dadaepo Harbor Station, Exit 2, approx. 7-min walk"}, {"address": "710 Dadae-ro, Saha-gu, Busan", "feature": "\u2b50 4.1 Stars | Must-Buy List: Aloe Vera 92% Soothing Gel, Ginseng Royal Silk Watery Cream, Argan Essential Deep Care Hair Pack. Focused on natural botanical skincare, this brand\u0027s soothing aloe gel and hair pack are absolute lifesavers for post-sun recovery after spending time at the beach. Conveniently situated in Dadaepo\u0027s coastal commercial area, it is extremely popular with tourists.", "name": "Nature Republic Dadaepo Branch (\ub124\uc774\ucc98\ub9ac\ud37c\ube14\ub9ad \ub2e4\ub300\ud3ec\uc810)", "transport": "Busan Metro Line 1, Dadaepo Beach Station, Exit 3, approx. 4-min walk"}, {"address": "310 Nakdong-daero, Saha-gu, Busan", "feature": "\u2b50 4.6 Stars | Must-Buy List: Dong-A Pharmaceutical Ciracle Acne Gel, Lemona Vitamin C Powder, Vita500 Collagen Drink. A massive local pharmacy situated in the hub area between Songdo and Dadaepo, boasting a comprehensive selection of products. It sells pharmacy-exclusive repair cosmeceuticals and beauty health supplements at affordable prices with frequent bundle discounts. Highly recommended by locals!", "name": "Saha Central Pharmacy (\uc0ac\ud558 \uc911\uc559\uc57d\uad6d)", "transport": "Busan Metro Line 1, Saha Station, Exit 2, approx. 1-min walk"}, {"address": "429 Dadae-ro, Saha-gu, Busan", "feature": "\u2b50 4.5 Stars | Must-Buy List: Unove Deep Damage Treatment EX, d\u0027Alba First Spray Serum, rom\u0026nd Juicy Lasting Tint. Located in Dadaepo\u0027s bustling Natgae dining and shopping district, this spacious store gets new releases extremely fast. It offers a much more comfortable, uncrowded shopping experience than busy tourist hubs, allowing you to easily test and shop for trending K-beauty items.", "name": "Olive Young Dadae Natgae Station Branch (\uc62c\ub9ac\ube0c\uc601 \ub2e4\ub300\ub0ab\uac1c\uc5ed\uc810)", "transport": "Busan Metro Line 1, Natgae Station, Exit 4, approx. 2-min walk"}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "2F, Art Malling, 1413 Nakdong-namro, Saha-gu, Busan", "feature": "\u2b50 4.3 stars | Must-buy list: Waterproof canvas shoes, ultra-lightweight genuine leather casual shoes, and Morandi-hued knit tote bags. As a representative Korean budget-friendly shoe and bag brand, SHOOPEN offers diverse designs tailored to Asian foot shapes. Located inside Art Malling Shopping Mall in the heart of the Dadaepo living zone, the spacious and bright store carries everything from versatile daily flats and non-slip sneakers to high-quality bags\u2014a top pick for local youth and families.", "name": "SHOOPEN Art Malling Hadan Branch (SHOOPEN Art Malling Hadan / \uc288\ud39c)", "transport": "Directly connected to Art Malling Shopping Mall via Exit 3 of Hadan Station (Busan Metro Line 1)"}, {"address": "3F, Art Malling, 1413 Nakdong-namro, Saha-gu, Busan", "feature": "\u2b50 4.2 stars | Must-buy list: Natural cotton basic T-shirts, cooling organic cotton loungewear, and lightweight down jackets. TOPTEN10 is on : Romantic tweed-style cropped jackets, pastel lace tops, and feminine soft knitwear. ROEM is a well-known Korean women\u0027s fashion brand specializing in romantic, elegant styles with delicate details. Its graceful tailoring is hugely popular with local women, making it an ideal place to find standout outfits for coastal photo ops.", "name": "ROEM Art Malling Hadan Branch (ROEM Art Malling Hadan / \ub85c\uc5e0)", "transport": "Directly connected via Exit 3 of Hadan Station (Busan Metro Line 1)"}, {"address": "2F, Art Malling, 1413 Nakdong-namro, Saha-gu, Busan", "feature": "\u2b50 4.4 stars | Must-buy list: Korean IP collaboration short-sleeve pajama sets, high-stretch casual jeans, and heavyweight minimalist hoodies. SPAO is one of South Korea\u0027s premier homegrown fast-fashion brands, famous for affordable basics and iconic anime/character collaborations. This massive store boasts a comprehensive selection\u2014comfortable loungewear and cotton hoodies are absolute bargains for locals and visitors alike.", "name": "SPAO Art Malling Hadan Branch (SPAO Art Malling Hadan / \uc2a4\ud30c\uc624)", "transport": "Directly accessible from Exit 3 of Hadan Station (Busan Metro Line 1)"}, {"address": "1F, 704 Dadae-ro, Saha-gu, Busan", "feature": "\u2b50 4.6 stars | Must-buy list: Korean resort-style woven straw totes, handmade comfortable soft-sole leather sandals, and relaxed linen vacation dresses. Located near Dadaepo Beach Station, this independent local boutique features curated items chosen by a Korean designer. Focusing on resort and casual styles crafted from cool linen and pure cotton, alongside premium leather and straw shoes and bags, it\u0027s a hidden gem for unique local fashion after exploring Dadaepo Beach and the fountain.", "name": "Lily Apparel \u0026 Shoes Dadaepo (\ub9b4\ub9ac\uc637\uac00\uac8c)", "transport": "About a 3-minute walk from Exit 1 of Dadaepo Beach Station (Busan Metro Line 1)"}, {"address": "1F, 100 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.7 stars | Must-buy list: Songdo coastal embroidered canvas bags, handmade woven sun hats, and lightweight windproof beach cover-ups. Situated near the Songdo Marine Cable Car station, this unique independent boutique blends coastal elements with carefully selected original Dongdaemun clothing and handmade footwear/accessories. With highly unique, one-of-a-kind pieces, its handcrafted woven bags and lightweight UV-protective jackets are especially beloved by local women and tourists exploring the cable car and coastal walks.", "name": "Songdo Ocean Breeze Boutique (\uc1a1\ub3c4 \uc624\uc158\ube0c\ub9ac\uc988)", "transport": "Take Busan City Bus 6, 26, 30, or 71 to \u0027Songdo Beach\u0027 stop and walk for 2 minutes"}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "171 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.5 stars | Must-Buy List: Cable car snow globes, Busan seagull plushies, and Songdo-exclusive blueberry sandwich cookies. Located inside the Songdo Marine Cable Car station building, this exquisite souvenir shop is a must-visit for tourists after riding the cable car. The store features high-quality themed merchandise inspired by Songdo\u0027s ocean views and cable cars, making them perfect keepsakes or gifts for loved ones.", "name": "Busan Air Cruise Souvenir Shop (Songdo Bay Station)", "transport": "Take Busan Metro Line 1 to Jagalchi Station, transfer to Bus No. 34 or 26, get off at Songdo Beach Stop, and walk for about 5 minutes."}, {"address": "129 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.6 stars | Must-Buy List: Cheese fishcake sticks, vacuum-sealed assorted fishcake gift boxes, and fishcake seafood ramen kits. An iconic fishcake brand in Korea, this branch is uniquely located along the Songdo coast. It offers a variety of freshly made and fried creative fishcakes, along with vacuum-sealed gift boxes so tourists can easily take them back to their hotels or bring them home as iconic Busan souvenirs.", "name": "Goraesa Fishcake (Songdo Branch)", "transport": "Take Bus No. 26, 30, 71, or 96, get off at Songdo Beach Stop, and walk for about 3 minutes."}, {"address": "37 Amnampark-ro, Seo-gu, Busan", "feature": "\u2b50 4.7 stars | Must-Buy List: Songdo sea salt butter sand cookies, caramel nut tarts, and drip coffee bags. A hugely popular artisanal bakery in Songdo in recent years, this shop uses carefully selected local Songdo sea salt and rich butter to craft handmade sand cookies. With a crispy outer shell, rich filling, and exquisite packaging, they are a top choice for Instagram photos and gifts.", "name": "Songdo Sand", "transport": "Take Bus No. 7 or 71, get off at Amnam Park Stop, and walk for about 2 minutes."}, {"address": "72 Janglim-ro 93beon-gil, Saha-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Rainbow wooden house keychains, authentic Busan seaweed snack gift sets, and Venetian-style postcard sets. Located in Janglim Harbor\u2014often called the \u0027Venice of Busan\u0027\u2014this shop incorporates the vibrant colors of the harbor\u0027s rainbow houses into various souvenirs. Beyond exclusive cultural and creative goods, it sells handmade seaweed snacks and dried seafood created in partnership with local fishery cooperatives, making it a hit among young travelers.", "name": "Janglim Harbor Gift Shop", "transport": "Take Busan Metro Line 1 to Janglim Station, transfer to Saha-gu Local Bus No. 3-1, and get off at the Janglim Harbor Entrance Stop."}, {"address": "686 Dadae-ro, Saha-gu, Busan", "feature": "\u2b50 4.4 stars | Must-Buy List: Busan roasted seaweed bulk gift packs, traditional Korean yakgwa (honey pastry) gift boxes, and organic citron tea marmalade. This local Nonghyup supermarket is the best place to buy authentic local souvenirs and traditional Korean snacks. Compared to big chain hypermarkets, you\u0027ll find more high-quality seaweed, traditional teas, and specialty pastries produced by local Busan agricultural and fishery cooperatives at very reasonable prices.", "name": "NH Hanaro Mart Dadaepo", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station (Exit 1) and walk for about 3 minutes."}, {"address": "193 Amnampark-ro, Seo-gu, Busan", "feature": "\u2b50 4.2 stars | Must-Buy List: Ocean-inspired scented candles, Yonggung Suspension Bridge acrylic standees, and specialty roasted shredded squid. Located right next to the entrance of Songdo Yonggung Suspension Bridge, this cozy shop sells unique souvenirs inspired by stunning ocean views and dragon palace legends. Its specially prepared hand-roasted shredded squid is flavorful and non-greasy, making it a must-try local snack when visiting the bridge.", "name": "Songdo Yonggung Suspension Bridge Souvenir Shop", "transport": "Take Bus No. 7, 9, or 71 to the Amnam Park terminus, then follow the walking path to the entrance of Yonggung Suspension Bridge."}, {"address": "20 Molundae 1-ro, Saha-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Crispy dried yellow croaker, premium sea mustard gift boxes, and roasted dried anchovy snacks. Located near the start of the Molundae Trail in Dadaepo, this is the top choice for locals and in-the-know travelers buying premium dried seafood. The store carefully selects seafood caught along the Busan coast and processes it into convenient travel snacks and cooking packs packed with authentic local flavor.", "name": "Molundae Dried Seafood \u0026 Marine Products Specialty Store", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station (Exit 2) and walk for about 7 minutes."}, {"address": "14 Molundae 1-ro, Saha-gu, Busan", "feature": "\u2b50 4.5 stars | Must-Buy List: Sunset glow night lights, Dadaepo Sunset Fountain snow globes, and handmade dried fruit tea bags. Situated beside the famous Dadaepo Sunset Fountain of Dream, this store specializes in creative merchandise and unique snacks inspired by the sunset views. The exquisite dried fruit tea bags are made with local Korean fruits, suitable for both hot and cold brewing\u2014making them perfect souvenirs to commemorate the beautiful sunset.", "name": "Dadaepo Sunset Souvenir Shop", "transport": "Take Busan Metro Line 1 to Dadaepo Beach Station (Exit 4) and walk for about 2 minutes to reach the fountain plaza."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1413 Nakdong-namro, Saha-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Korean fashion brand TOPTEN casual wear, OLLIE women\u0027s shoes, local Korean skincare cleansers. A large comprehensive shopping mall located at Hadan Station in Saha-gu, directly connected to the Dadaepo Metro Line, making it a favorite shopping spot for Hadan and Dadaepo residents. The mall brings together numerous local Korean fashion brands, designer lifestyle items, and lifestyle stores, with prices much more affordable than the city center.", "name": "Art Malling Hadan Branch (\uc544\ud2b8\ubab0\ub9c1 \ud558\ub2e8\uc810)", "transport": "Directly connected to Exit 3 or 5 of Hadan Station, Busan Metro Line 1"}, {"address": "168 Myeongjigukje 6-ro, Gangseo-gu, Busan", "feature": "\u2b50 4.5 stars | Must-Buy List: SPAO collaboration pajamas, E-Mart Traders bulk Korean seaweed, local designer tote bags. A large complex outlet and shopping center located about a 15-minute drive from Dadaepo Beach, housing numerous international and Korean brand outlet stores with discounts ranging from 50% to 70% off. Featuring a spacious, comfortable shopping environment and a variety of local home \u0026 lifestyle selection shops, it is the most popular shopping paradise in West Busan.", "name": "Starfield City Myeongji (\uc2a4\ud0c0\ud544\ub4dc \uc2dc\ud2f0 \uba85\uc9c0)", "transport": "Take Bus 3 or 58-2 from Dadaepo Beach Station and get off at Myeongji International New Town Station"}, {"address": "20-1 Jungang-dong 7-ga, Jung-gu, Busan", "feature": "\u2b50 4.6 stars | Must-Buy List: Sulwhasoo First Care Activating Serum, OSULLOC Green Tea Spread, Gentle Monster sunglasses. A flagship Lotte shopping complex located just a 10-minute drive from Songdo Marine Cable Car, featuring Korea\u0027s largest indoor musical fountain and a dedicated Lotte Outlet area. It houses top Korean skincare brands and high-quality local designer apparel. The rooftop sky garden also offers panoramic views of the Songdo coast and Busan Port.", "name": "Lotte Department Store Gwangbok Branch (\ub86f\ub370\ubc31\ud654\uc810 \uad11\ubcf5\uc810)", "transport": "Directly accessible via the underground passage from Exit 10 of Nampo Station on Busan Metro Line 1, or take Bus 7 from Songdo for about 12 minutes"}, {"address": "93 Janglimsijang-ro, Saha-gu, Busan", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade cheese fishcake sticks, vacuum-packed assorted fishcake gift sets, specialty fishcake soup base. Located at Janglim Pogu in Dadaepo\u2014often called the \u0027Venice of Busan\u0027\u2014this factory outlet operated directly by a local traditional fishcake manufacturer offers authentic Busan fishcakes at discounted prices. All products are made from fresh fish caught daily, with freshly fried fishcakes offering a bouncy, chewy texture. It\u0027s a signature must-buy souvenir from Dadaepo.", "name": "Janglim Pogu Fishcake Factory Outlet (\uc7a5\ub9bc\ud3ec\uad6c \uc5b4\ubb35 \uc9c1\uc601\uc810)", "transport": "About a 12-minute walk from Exit 1 of Janglim Station on Busan Metro Line 1"}, {"address": "171 Songdohaebyeon-ro, Seo-gu, Busan", "feature": "\u2b50 4.2 stars | Must-Buy List: Songdo ocean-scented candles, cable car-shaped handmade cookies, hand-drawn postcards of Busan landmarks. Unique independent souvenir shops located inside the stations at both ends of the Songdo Cable Car, specializing in exclusive original products featuring Songdo and Busan ocean motifs. Most items are designed by local young artists from Busan, embodying a rich sense of local maritime culture and artisanal warmth.", "name": "Songdo Cable Car Station Gift Shop (\uc1a1\ub3c4\ud574\uc0c1\ucf00\uc774\ube14\uce74 \uae30\ud504\ud2b8\uc20d)", "transport": "Take Bus 7, 26, or 71 to Songdo Beach Station, then walk to the Cable Car Station"}, {"address": "686 Dadae-ro, Saha-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Yeongnam region (Busan) exclusive sesame oil, traditional handmade Korean Yakgwa, vacuum-packed fresh perilla leaves. TOP MART is the most iconic local supermarket chain in the Yeongnam region (Busan, Gyeongnam). The Shin-Dadaepo branch is large in scale, well-known for its excellent value and wide variety of local food products. Many tourists come here specifically to hunt for local small-farm brands and traditional Korean snacks not found in big downtown supermarkets.", "name": "TOP MART Shin-Dadaepo Branch (\ud0d1\ub9c8\ud2b8 \uc2e0\ub2e4\ub300\uc810)", "transport": "About a 3-minute walk from Exit 2 of Dadaepo Port Station on Busan Metro Line 1"}, {"address": "1390 Nakdong-namro, Saha-gu, Busan", "feature": "\u2b50 4.1 stars | Must-Buy List: ON AIR thermal underwear, heat-tech stretch jeans, affordable pure cotton plain T-shirts. A large standalone outlet store for TOPTEN\u2014Korea\u0027s popular budget fashion brand\u2014located in the Hadan shopping area. It frequently hosts great-value 1+1 deals and end-of-season outlet discounts. With trendy Korean styles tailored for Asian fits, it is the top choice for purchasing high-quality, affordable daily Korean apparel.", "name": "TOPTEN10 Hadan Outlet (\ud0d1\ud150 \ud558\ub2e8\uc810)", "transport": "About a 2-minute walk from Exit 1 of Hadan Station on Busan Metro Line 1"}, {"address": "229 Dadaehaean-ro, Saha-gu, Busan", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade ocean-blue ceramic mugs, seashell paperweights, sunset-inspired handmade linen tote bags. A local independent craft and selection shop on the Dadaepo coast, co-run by local Busan ceramicists and artisans. Inspired by Dadaepo\u0027s beautiful sunsets and ocean views, they create a unique range of home lifestyle goods with high collectible value and authentic local charm.", "name": "Dadaepo Sea Breeze Craft Studio \u0026 Lifestyle Shop (\ub2e4\ub300\ud3ec \ud574\ud48d \ub3c4\uc608\uacf5\ubc29)", "transport": "About a 5-minute walk from Exit 1 of Dadaepo Beach Station on Busan Metro Line 1"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Songdo Marine Cable Car and Dadaepo"}};
        const cityName = "Busan";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
