n village, this independent beauty lab specializes in handcrafted natural aromatherapy cosmetics and ocean mud cleansing masks sourced from the Busan coast. All products are preservative-free and ideal for sensitive skin, with on-site custom essential oil blending workshops available.", "name": "Gamcheon Aroma \u0026 Sea Mud Beauty Lab", "transport": "Get off at Gamcheon Elementary School Bus Stop in Gamcheon Culture Village, then walk down the painted stairs for about 3 minutes."}, {"address": "120 Taejong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buys: Soothing \u0026 Moisture Aloe Vera 92% Soothing Gel, Ginseng Royal Silk Watery Cream, Black Bean Anti-Hair Loss Shampoo. A roadshop store of the famous Korean beauty brand located on Yeongdo\u0027s main avenue, emphasizing nature-inspired skincare. Its signature aloe vera gel and ginseng skincare line are immensely popular. The store frequently offers tourist-friendly Buy-1-Get-1-Free promotions and generous free samples.", "name": "NATURE REPUBLIC Yeongdo Store", "transport": "Take Busan Metro Line 1 to Nampo Station (Exit 6), cross Yeongdodaegyo Bridge, and walk for about 5 minutes."}, {"address": "418 Taejong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.7 stars | Must-Buys: Donginbi Red Ginseng Concentrated Serum, Cheong Kwan Jang Korean Red Ginseng Extract EVERYTIME, Hanbang Herbal Nourishing Sheet Masks. A specialty store combining internal Korean Red Ginseng supplements with Donginbi, a premium red ginseng skincare brand. The shop offers professional Hanbang skin analysis. Their red ginseng serum deeply nourishes and combats signs of aging\u2014making it a top-tier beauty gift for parents or a luxurious treat for yourself when visiting Taejongdae.", "name": "Cheong Kwan Jang \u0026 Hanbang Beauty Yeongdo", "transport": "Take Busan Metro Line 1 to Nampo Station (Exit 6), transfer to Bus 8, 30, or 66, get off at Yeongdo-gu Office Station, and walk for 1 minute."}], "name": "Iconic Local Beauty rd industrial-chic vibe.", "name": "AREA6 Leather \u0026 Goods Studio", "transport": "Take Metro Line 1 to Nampo Station (Exit 6), transfer to Bus 8, 30, 66, or 88, get off at Yeongdo Police Station, and walk for 3 minutes."}, {"address": "144 Gamnae 2-ro, Saha-gu, Busan", "feature": "\u2b50 4.4 stars | Must-Buy List: Little Prince embroidered sun hats, Gamcheon painted mural patterned cotton socks, trendy cloth tote bags. A unique select shop located along the main sightseeing route of Gamcheon Culture Village, inspired by Gamcheon\u0027s iconic Little Prince theme. It sells a variety of original embroidered hats, cute painted socks, and Korean loose-fit casual wear at budget-friendly prices with great sentimental value.", "name": "Little Prince \u0026 Fox Apparel \u0026 Accessories", "transport": "Take Busan Metro Line 1 to Toseong Station (Exit 6), transfer to local minibus Saha 1-1 to near the Little Prince Statue in Gamcheon Culture Village."}, {"address": "175 Gamnae 1-ro, Saha-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade crochet woven bags, Korean-style cool linen shirts, distinctive tassel crossbody bags. Tucked away in the alleys of Gamcheon Culture Village, this independent boutique features hand-crocheted shoes, bags, and natural linen/cotton clothing made by local artisans. With very limited quantities for each item, you won\u0027t easily run into someone wearing the same piece, making it very popular with travelers who appreciate unique craftsmanship.", "name": "Gamcheon Handcraft \u0026 Vintage Outfit", "transport": "Take local minibus Saha 2 to Gamcho Market Station, then walk into the painted alleyways."}, {"address": "830 Taejong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.2 stars | Must-Buy List: Nautical striped loose T-shirts, ocean wave embroidered canvas shoes, Japanese-style tote bags. Located near Taejongdae Scenic Area, this local trendy apparel store specializes in Busan coastal-style casual wear and indie shoes \u002 World Barista Champion. Converted from an old harbor warehouse, the Yeongdo flagship store boasts an industrial aesthetic and stunning harbor views. Their self-roasted coffee beans offer rich aromas and stylish packaging, making them an incredible gift choice for coffee lovers.", "name": "MOMOS COFFEE Yeongdo Roastery (\ubaa8\ubaa8\uc2a4\ucee4\ud53c \uc601\ub3c4\uc810)", "transport": "Take Subway Line 1 to Nampo Station (Exit 2), transfer to Bus 82 or 85, get off at \u0027Bongnae Market\u0027 stop, and walk about 8 minutes."}, {"address": "180 Haeyang-ro 195beon-gil, Yeongdo-gu, Busan", "feature": "\u2b50 4.4 Stars | Must-Buy List: Yeongdo Sea Salt Butter Cookie Gift Set, Signature Handmade Salt Bread Gift Set, P.ARK Estate-Grade Drip Coffee Bags. P.ARK is a massive multi-cultural oceanfront complex in Yeongdo whose bakery freshly crafts exquisite baked goods every day. A traveler favorite is the signature butter cookies inspired by the Yeongdo ocean seascape; beautifully packaged in sleek modern tins with a rich, crispy texture, they make elegant gifts for friends and family.", "name": "P.ARK Bakery \u0026 Cafe Yeongdo (\ud53c\uc544\ud06c)", "transport": "Take Subway Line 1 to Nampo Station (Exit 6), transfer to Bus 186 or 66, get off at \u0027National Maritime Museum\u0027 stop, and walk about 5 minutes."}, {"address": "140 Gamnae 2-ro, Saha-gu, Busan", "feature": "\u2b50 4.3 Stars | Must-Buy List: Handmade cheese-stuffed fishcake bar, Sea urchin-flavored fishcake slices, Gamcheon exclusive fishcake \u0026 scallop soup base pack. Located along the main sightseeing walkway of Gamcheon Culture Village, this specialty fishcake shop emphasizes traditional handmade preparation using a high ratio of fresh fish paste. Beyond hot, freshly fried fishcake skewers perfect for snacking on the go, they also offer vacuum-sealed specialty gift sets and concentrated soup bases for long travel, letting you bring authentic Busan ocean flavors home.", "name": "Gamcheon Traditional Fishcake (\uac10\ucc9c\uc5b4\ubb35)", "transport": "Take Local Bus Saha 1-1, get off at the entrance of \u0027Gamcheon Culture Village\u0027, and walk about 3 minutes along the main painted street."}, {"address": "2-35 Joongrihaean-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.4 Stars | Must-Buy List: Yeongdo wild dried seaweed \u0026 kelp gift box, Handmade sea anemone-flavored crispy snacks, Haenyeo-illustrated canvas tote bag. Located near Taejongdae, the Yeongdo Haenyeo Cultural Center showcases traditional female diver culture. Its attached souvenir shop sells dried seafood and marine snacks harvested and processed directly by local Yeongdo Haenyeo. Pure quality without artificial additives makes these gifts rich in local maritime heritage and human touch.", "name": "Yeongdo Haenyeo Cultural Center Souvenir Shop (\uc601\ub3c4\ud574\ub140\ubb38\ud654\uc804\uc2dc\uad00)", "transport": "Take Subway Line 1 to Nampo Station (Exit 6), transfer to Bus 7 or 508, get off at \u0027Jungri\u0027 stop, and walk about 10 minutes."}, {"address": "243 Gamnae 1-ro, Saha-gu, Busan", "feature": "\u2b50 4.2 Stars | Must-Buy List: Hand-painted Gamcheon village ceramic mug, Village-shaped scented candle, Colorful house wooden memo clip. Tucked away along the stairways of Gamcheon Culture Village, this cozy shop is jointly run by local residents and a community arts cooperative. All items are limited-edition creations by local artisans, transforming Gamcheon\u0027s iconic block-like colorful houses into heartwarming everyday sundries and home fragrances\u2014truly unique treasures loaded with artisanal warmth.", "name": "Gamcheon Gyeodan-jip Souvenir Shop (\uacc4\ub2e8\uc9d1)", "transport": "From the entrance of Gamcheon Culture Village, follow the main walking path until you reach the base of the 148 Stairs."}, {"address": "836 Taejong-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.3 Stars | Must-Buy List: Taejongdae clam-shaped red bean walnut pastry, Busan sea salt caramel pastry, Taejongdae camellia tea bag gift set. Situated near the entrance of Taejongdae Resort Park, this specialty gift shop features freshly baked warm pastries shaped creatively like Taejongdae\u0027s iconic coastal clams. Crisp on the outside and generously filled with sweet red bean paste and chopped walnuts, they are pleasantly sweet without being cloying. Packaged with Taejongdae lighthouse scenery, it is the perfect tasty souvenir from your trip.", "name": "Taejongdae Clam Bread Store (\ud0dc\uc885\ub300 \uc870\uac1c\ube75)", "transport": "Take Subway Line 1 to Nampo Station (Exit 6), transfer to Bus 8, 30, or 88, get off at \u0027Taejongdae Bus Depot\u0027 terminal stop, and walk about 2 minutes."}], "name": "Must-Buy Special Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "20-1 Jungang-dong 7-ga, Jung-gu, Busan", "feature": "\u2b50 4.5 stars | Must-Buy List: Sulwhasoo First Care Activating Serum, Samjin Amook Assorted Gift Set, Gentle Monster Sunglasses. Located right next to Yeongdo Bridge, this iconic mega-shopping center is the ultimate shopping pitstop when heading to Yeongdo and Gamcheon Culture Village. It features the world\u0027s largest indoor musical fountain, while the rooftop sky garden offers a stunning 360-degree panoramic view of the Yeongdo Bridge opening show and Busan Port. The mall gathers top Korean beauty brands, trendy fashion, and a bustling local food court, blending shopping and sightseeing seamlessly.", "name": "Lotte Department Store Gwangbok Branch", "transport": "Take Busan Metro Line 1 to Nampo Station, Exit 10 (direct connection)"}, {"address": "147 Dangsa-ri, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.6 stars | Must-Buy List: National Geographic Lightweight Down Jacket, MLB K-style Baseball Cap, Nike Retro Running Shoes. As the largest European castle-style outlet mall near Busan, it houses over 500 international and local Korean brands offering year-round discounts from 30% to 70% off. Beyond being a shopping paradise, it features a Santorini-style relaxation plaza, a large carousel, and a lighthouse observatory, making it a perfect spot to spend a half-day treasure hunting and taking photos.", "name": "Lotte Premium Outlets Dong-Busan", "transport": "Take the Donghae Line to Osiria Station, Exit 1, then walk for about 5 minutes"}, {"address": "36 Taejong-ro 99beon-gil, Yeongdo-gu, Busan", "feature": "\u2b50 4.6 stars | Must-Buy List: Chili Cheese Fish Cake Bar, Handmade Assorted Fish Cake Gift Set, Fish Cake Soup Broth Pack. This flagship store of a century-old traditional brand in Yeongdo transforms a classic fish cake shop into a bakery-style experience store. Offering over 80 types of freshly made and fried specialty fish cakes, the store is filled with an irresistible aroma. Besides tasting piping-hot fish cakes on site, visitors can browse vacuum-packed souvenir sections and the Fish Cake Culture Museum, making it an unmissable iconic local brand in Busan.", "name": "Samjin Amook Yeongdo Flagship Store", "transport": "Take Bus No. 88 or 101 from Busan Station, get off at Bongnae Market Stop, and walk for about 3 minutes"}, {"address": "2-347 Gamcheon-dong, Saha-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Glow-in-the-dark Little Prince \u0026 Fox Postcards, Gamcheon Painted House Wooden Magnets, Delicate Metal Little Prince Bookmarks. An iconic independent lifestyle and creative shop located in the heart of Gamcheon Culture Village, beloved by international travelers. Collaborating with local artists, it offers an exclusive range of merchandise themed around Gamcheon\u0027s terraced rainbow houses and the Little Prince. The shop features a warm, cozy atmosphere where you can pick up exquisite souvenirs while enjoying sweeping, unbeatable views of the surrounding mountains and sea.", "name": "Gamcheon Little Prince Souvenir Shop", "transport": "Take Metro Line 1 to Toseong Station, Exit 6, then transfer to Saha Village Bus 1-1 and get off at Gamcheon Culture Village Stop"}, {"address": "244 Huinnyeoul-gil, Yeongdo-gu, Busan", "feature": "\u2b50 4.4 stars | Must-Buy List: Huinnyeoul Azure Coast Scented Candles, Yeongdo Wave Woven Canvas Bags, Hand-painted Coastal Mural Postcard Sets. Tucked away along the cliffside walkway of Huinnyeoul Culture Village in Yeongdo, this charming boutique store sells crafts and coastal trinkets by local creators. Incorporating Yeongdo\u0027s deep blue ocean and white house aesthetic into daily items, the products exude rich local coastal charm, making it the best spot for hipster-style souvenir shopping along the coast.", "name": "Huinnyeoul Jeomppang \u0026 Craft Shop", "transport": "Take Bus No. 7, 71, or 508 from Nampo Station Exit 6, and get off at Huinnyeoul Culture Village Stop"}, {"address": "178 Gamnae 2-ro, Saha-gu, Busan", "feature": "\u2b50 4.2 stars | Must-Buy List: Hand-painted Wooden Puppet Figurines, Gamcheon Village Scenery Canvas Coasters, Handmade Vintage Ceramic Pins. Jointly run by Gamcheon Culture Village residents and local artists, this specialty workshop focuses on 100% handcrafted wood carvings and ceramic crafts. Every item possesses a unique handcrafted warmth, perfectly storytelling Gamcheon\u0027s transformation from a neglected hillside area into a thriving art village. It\u0027s a local gem offering high sentimental and artistic collection value.", "name": "Gamcheon Wood Puppet \u0026 Gift Craft", "transport": "Take Metro Line 1 to Goejeong Station, Exit 6, transfer to Saha Village Bus 1 and get off at Gamcheon Elementary School Stop, then walk for about 2 minutes"}, {"address": "24 Jeonmang-ro, Yeongdo-gu, Busan", "feature": "\u2b50 4.4 stars | Must-Buy List: Yeongdo Lighthouse Metal Keychains, Busan Sea Salt Handmade Soap Gift Box, Haenyeo (Female Diver) Glass Mugs. Located near Yeongdo\u0027s Taejongdae Resort Park, this specialty shop focuses on promoting local Haenyeo culture and ocean-themed creative crafts. Gathering works from emerging Busan designer -gun, Busan", "feature": "\u2b50 4.5 stars | Must-Buys: Korean Ginseng Skincare Capsules, Joint Chondroitin Supplements, Mosquito Repellent Herbal Ointment. A long-standing neighborhood pharmacy located right at the entrance of Gijang Market, trusted deeply by local residents. Alongside conventional medications, it displays a variety of locally developed Korean herbal skincare creams and health supplements. Friendly pharmacists and affordable prices make it perfect for visitors wishing to experience local traditional Korean medicinal skincare culture.", "name": "Gijang Sae-Seoul Pharmacy", "transport": "Approx. 5-min walk from Exit 1 of Gijang Station (Donghae Line), right next to the entrance of Gijang Market."}], "name": "Iconic Local K-Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "128 Sirang-ri, Gijang-eup, Gijang-gun, Busan (Lotte Mall Dong-Busan)", "feature": "\u2b50 4.5 stars | Must-Buy List: French Bulldog graphic T-shirts, oversized hoodies, stylish cargo dad hats. A famous street fashion brand founded by local Korean designers, renowned across South Korea for its iconic French Bulldog logo. The store offers plenty of exclusive discounted items and Dong-Busan limited bundle deals. With great tailoring and a unique personality, it\u0027s a must-visit for young people who love Korean K-street fashion.", "name": "Lifework (Lotte Mall Dong-Busan)", "transport": "Approx. 10-minute walk from Exit 1 of OSIRIA Station on the Donghae Line"}, {"address": "128 Sirang-ri, Gijang-eup, Gijang-gun, Busan (Lotte Mall Dong-Busan)", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic monogram baseball caps, chunky dad sneakers, monogram mini crossbody bags. A textbook example of how a local Korean brand reinvented Major League Baseball logos into a top-tier Korean streetwear label. This spacious outlet features a comprehensive product line from washed dad hats to trendy footwear and bags. With deep discounts, it is a shopping haven for tourists looking to stock up on shoes and accessories.", "name": "MLB Korea (Lotte Outlet Dong-Busan)", "transport": "Approx. 10-minute walk from Exit 1 of OSIRIA Station on the Donghae Line"}, {"address": "128 Sirang-ri, Gijang-eup, Gijang-gun, Busan (Lotte Mall Dong-Busan)", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic C Logo canvas tote bags, vintage American graphic tees, lightweight hooded down jackets. A highly popular Korean casual brand specializing in high-quality American vintage styles. This store frequently offers end-of-season discounts and spend-and-save promotions. Their canvas bags are sturdy and durable, and their clothing fits Asian body types exceptionally well, making it a favorite among young Busan locals.", "name": "Covernat (Lotte Outlet Dong-Busan)", "transport": "Approx. 10-minute walk from Exit 1 of OSIRIA Station on the Donghae Line"}, {"address": "128 Sirang-ri, Gijang-eup, Gijang-gun, Busan (Lotte Mall Dong-Busan)", "feature": "\u2b50 4.5 stars | Must-Buy List: Yellow frame logo backpacks, short goose down jackets, outdoor-style hoodies. A trendy outdoor apparel and bag brand exclusively designed and operated by a Korean enterprise, seamlessly blending functionality with Korean fashion. The Dong-Busan store offers a complete lineup, allowing you to pick up iconic K-drama celebrity coats and backpacks at discounted prices.", "name": "National Geographic Apparel (Lotte Mall Dong-Busan)", "transport": "Approx. 10-minute walk from Exit 1 of OSIRIA Station on the Donghae Line"}, {"address": "128 Sirang-ri, Gijang-eup, Gijang-gun, Busan (Lotte Mall Dong-Busan)", "feature": "\u2b50 4.3 stars | Must-Buy List: Classic Jeep logo sweatshirts, chunky platform dad shoes, American workwear baseball caps. Redefined by a Korean fashion group into a stylish Korean outdoor-casual look, this American off-road brand enjoys immense local popularity. Their chunky dad shoes are comfortable and leg-lengthening, while their versatile casual backpacks and caps offer incredible value for money.", "name": "Jeep Apparel (Lotte Outlet Dong-Busan)", "transport": "Approx. 10-minute walk from Exit 1 of OSIRIA Station on the Donghae Line"}, {"address": "16 Daehwa-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.2 stars | Must-Buy List: Handmade Korean woven straw hats, high-stretch linen wide-leg pants, lightweight genuine leather bags. A charming cluster of independent clothing, shoe, and bag shops inside Gijang Traditional Market, capturing the authentic everyday charm of Busan\u0027s classic trade. Mostly run by friendly local \u0027ajummas\u0027, these shops offer a vast selection of simple, comfortable Made-in-Korea linen clothing and lightweight bags at affordable prices, served with warm hospitality.", "name": "Gijang Traditional Market Clothing \u0026 Bag Alley", "transport": "Approx. 8-minute walk from Exit 1 of Gijang Station on the Donghae Line"}, {"address": "128 Sirang-ri, Gijang-eup, Gijang-gun, Busan (Lotte Mall Dong-Busan)", "feature": "\u2b50 4.4 stars | Must-Buy List: Teddy bear embroidered knit sweaters, American varsity jackets, corduroy canvas tote bags. An affordable fashion brand under Korea\u0027s E-Land Group, famous for its vintage California campus aesthetic. The spacious Dong-Busan store offers a rich variety of items, with its iconic bear collection and stylish large-capacity totes being massive hits among students and budget-conscious shoppers.", "name": "WHO.A.U (Lotte Mall Dong-Busan)", "transport": "Approx. 10-minute walk from Exit 1 of OSIRIA Station on the Donghae Line"}, {"address": "128 Sirang-ri, Gijang-eup, Gijang-gun, Busan (Lotte Mall Dong-Busan)", "feature": "\u2b50 4.6 stars | Must-Buy List: Korean-style Mary Jane flats, simple square-toe low-block boots, elegant suede loafers. Starting as a trendy Korean online brand, SAPPUN has swept across Asia with its affordable yet high-quality women\u0027s footwear. This Dong-Busan boutique allows in-person try-ons, featuring cushioned, ultra-comfortable insoles and flattering cuts\u2014a must-visit shoe stop for female travelers visiting Gijang.", "name": "SAPPUN (Lotte Mall Dong-Busan)", "transport": "Approx. 10-minute walk from Exit 1 of OSIRIA Station on the Donghae Line"}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "104 Eupnae-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.7 stars | Must-buy list: Gijang premium wild seaweed, selected thick-cut kelp, seaweed soup packs. Due to fast sea currents and crystal-clear water, Gijang produces seaweed with an exceptionally thick and chewy texture. This local long-established direct outlet offers the highest quality wild seaweed and kelp. Highly loved by Korean families and tourists alike, it yields an incredibly savory and rich broth when cooked.", "name": "Gijang Seaweed \u0026 Kelp Specialty Store (\uae30\uc7a5\ubbf8\uc5ed\ub2e4\uc2dc\ub9c8)", "transport": "Approx. 8-minute walk from Exit 1 of Gijang Station, Donghae Line"}, {"address": "70 Daebyeonhaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.6 stars | Must-buy list: Crispy anchovy crackers, handmade anchovy sauce, premium dried large anchovies. Located by the famous Daebyeon Port in Gijang, this shop specializes in the region\u0027s most renowned anchovy products. The crispy anchovy crackers offer a crunchy texture packed with rich ocean umami, making them the perfect snack with beer. The anchovy sauce is an essential staple for authentic Korean cuisine seasoning.", "name": "Daebyeon Port Anchovy Specialty Shop (\ub300\ubcc0\ud56d \uba78\uce58\ud2b9\uc0b0\ud488)", "transport": "Take Gijang-gun Village Bus No. 13 to Daebyeon Port Stop, then walk for about 2 minutes"}, {"address": "268-3 Sirang-ri, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.8 stars | Must-buy list: Gijang-exclusive specialty drip coffee, handmade caramel chocolate gift sets, local Korean natural jams. A trendy lifestyle boutique located within the luxurious Ananti Cove resort, selling a curated selection of elegantly packaged gourmet food souvenirs. The refined packaging incorporates elements of the East Busan coastline, making them ideal high-end gifts for family and friends.", "name": "Eternal Journey Ananti Cove (\uc774\ud130\ub110\uc800\ub2c8)", "transport": "Take Express Bus No. 1001 to Haedong Yonggungsa Temple Stop, then transfer to a taxi for about 5 minutes"}, {"address": "86 Yonggung-gil, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.4 stars | Must-buy list: Handmade pumpkin malt candy, handmade seaweed chips (Gim-bugak), crispy puffed rice cakes. Located along the shopping street at the entrance of Haedong Yonggungsa Temple, where you can watch artisans handcraft traditional Korean malt candy and puffed rice treats on the spot. The seaweed crisps feature a light coating of glutinous rice, fried to golden perfection with rich sesame and seaweed aromas\u2014a must-buy traditional snack when visiting the temple.", "name": "Yonggung Traditional Snack Shop (\uc6a9\uad81 \uc804\ud1b5\uac15\uc815)", "transport": "Take Bus No. 1001 or 181 to Haedong Yonggungsa Temple / National Institute of Fisheries Science Stop, then walk for about 10 minutes"}, {"address": "1F, Lotte Outlet, 147 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.7 stars | Must-buy list: Chili cheese fishcake bar, assorted fishcake gift sets, fishcake croquettes. Located inside Lotte Outlet, this is a branch of Busan\u0027s iconic fishcake brand. In addition to tasting freshly prepared, high-quality fishcakes on-site, they offer refrigerated and vacuum-sealed gift boxes\u2014making it convenient for travelers to pack back to their hotel or purchase as Busan\u0027s most iconic gourmet gift.", "name": "Samjin Amook - Lotte Outlet Dong-Busan (\uc0bc\uc9c4\uc5b4\ubb35)", "transport": "Approx. 10-minute walk from Exit 1 of OSIRIA Station, Donghae Line"}, {"address": "42 Dongbusangwangwang-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.6 stars | Must-buy list: Brick Financier, dark chocolate brick cake, brand-exclusive drip coffee bags. A boutique dessert brand famous for its cute brick-shaped pastries, located in the Lotte World commercial area. The financiers are moist, dense, and rich in buttery aroma. Their adorable brick shape makes them super Instagrammable, and the beautiful gift boxes make them a wonderful dessert souvenir for your East Busan trip.", "name": "Brick Sand - Lotte World Busan (\ube0c\ub9ad\uc0cc\ub4dc)", "transport": "Approx. 12-minute walk from Exit 1 of OSIRIA Station, Donghae Line"}, {"address": "16 Eupnae-ro 104beon-gil, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.5 stars | Must-buy list: Freshly grilled butter shredded squid, seasoned dried pollack, crispy baked fish skin chips. Located in the heart of traditional Gijang Market, packed with various dried seafood snacks. The freshly grilled butter squid emits a mouthwatering aroma with a soft and chewy texture, while the perfectly savory-sweet seasoned dried pollack is an immensely popular Korean beer snack. Reasonably priced with free samples available on-site.", "name": "Gijang Market Dried Seafood Shop (\uae30\uc7a5\uc2dc\uc7a5 \uac74\uc5b4\ubb3c)", "transport": "Approx. 5-minute walk from Exit 1 of Gijang Station, Donghae Line, into Gijang Market"}, {"address": "147 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.5 stars | Must-buy list: Busan-exclusive honey butter almonds, bulk Korean seaweed gift packs, Korean soybean paste \u0026 chili paste combos. A massive supermarket located in the East Busan shopping district, offering the most comprehensive collection of local Korean snacks, cookies, and specialties. Features dedicated sections for Busan local goods and tourist top-sellers, letting you buy all popular Korean snacks in one go with instant tax refund service available.", "name": "Lotte Mart Dong-Busan - Korean Snack Zone (\ub86f\ub370\ub9c8\ud2b8 \ub3d9\ubd80\uc0b0\uc810)", "transport": "Approx. 10-minute walk from Exit 1 of OSIRIA Station, Donghae Line"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "147 Dongbusangwangwang-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.5 Stars | Must-Buy List: Nike Korea-exclusive discounted sneakers, National Geographic functional outdoor jackets, Gentle Monster trendy sunglasses. Designed in the architectural style of Santorini, Greece, this massive outlet is Eastern Busan\u0027s ultimate shopping paradise. Featuring over 500 international luxury and popular local Korean brands, it offers year-round discounts ranging from 30% to 70% off, making it a favorite among both tourists and local Busan residents.", "name": "Lotte Premium Outlets Dongbusan", "transport": "Take the Donghae Line to Osiria Station (Exit 1), then walk for about 10 minutes."}, {"address": "113 Jeongwon-ro, Jangan-eup, Gijang-gun, Busan", "feature": "\u2b50 4.4 Stars | Must-Buy List: Classic MLB baseball caps and dad shoes, Discovery Expedition outdoor down jackets, Mardi Mercredi graphic T-shirts. This large open-air shopping center features American and European village architecture, housing popular Korean streetwear brands and international luxury boutiques. Equipped with large child-friendly play facilities and a food court, it is one of Gijang\u0027s premier outlet shopping destinations.", "name": "Shinsegae Simon Premium Outlets Busan", "transport": "Take city bus 37, 182, or 188 and get off at the \u0027Shinsegae Outlet\u0027 stop."}, {"address": "268-32 Gorang-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.7 Stars | Must-Buy List: Gijang sea salt handcrafted scented candles, Korean independent designer hand-woven bags, Eternal Journey exclusive scented hand cream. Located inside a luxury resort in Gijang, this sophisticated local lifestyle boutique boasts an elegant and grand space. It specializes in handcrafted artisanal goods, high-quality original clothing, and coastal-themed cultural products, embodying the unique and luxurious lifestyle of Gijang.", "name": "Eternal Journey Ananti Cove", "transport": "Take bus 1001 or 139 to \u0027Haedong Yonggungsa Temple / National Fisheries Science Museum\u0027 stop, then take a taxi or walk for about 15 minutes."}, {"address": "17 Dongbusangwangwang-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.3 Stars | Must-Buy List: Local Korean Design Skin children\u0027s bumper play mats, Ohouse Korean-style home fragrance ceramic sets, quality wooden Korean tableware sets. As Lotte Group\u0027s first standalone home aesthetics and lifestyle complex, it brings together dozens of premium Korean furniture, kitchen aesthetics, and lifestyle specialty stores, making it the top destination for discovering minimalist Korean home decor.", "name": "Maison Lotte Dongbusan", "transport": "Take the Donghae Line to Osiria Station (Exit 1), then walk for about 8 minutes."}, {"address": "16 Eupnae-ro 104beon-gil, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.6 Stars | Must-Buy List: Premium traditional hand-dried Gijang seaweed, ready-to-eat Korean shredded grilled squid, natural anchovy and kelp stock bags. This local specialty market features Gijang\u0027s proudest local produce. Thanks to the convergence of ocean currents, Gijang produces some of the highest-quality seaweed and dried seafood in Korea. Long-established shops offer vacuum-sealed packaging, making it an essential stop for authentic local souvenirs in Eastern Busan.", "name": "Gijang Dried Seafood \u0026 Seaweed Specialty Market", "transport": "Take the Donghae Line to Gijang Station (Exit 1), then walk for about 7 minutes."}, {"address": "17 Dongbusangwangwang-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.4 Stars | Must-Buy List: IKEA Korea-exclusive yellow bag pouch, lingonberry jam soft cookies, Korean compact low-profile storage tables. As the largest IKEA flagship store outside the Seoul metropolitan area, it features exclusive showrooms tailored for coastal living in Busan, along with a spacious food court serving Korean-inspired menu items, providing a comfortable and spacious all-in-one shopping experience.", "name": "IKEA Dongbusan", "transport": "Take the Donghae Line to Osiria Station (Exit 1), then walk for about 10 minutes."}, {"address": "10 Dongbusangwangwang 2-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.2 Stars | Must-Buy List: Trendy hats worn by K-pop idols, handcrafted leather goods by Busan artisans, Gijang ocean-themed cultural sticker sets. Located directly opposite Lotte World Adventure Busan, this open-air lifestyle complex features boutiques by young local Busan designers and chic lifestyle shops. It\u0027s a hidden gem for picking up unique, stylish Korean streetwear items you won\u0027t see anywhere else.", "name": "Time Terrace Osiria Local Brand Select Store", "transport": "Take the Donghae Line to Osiria Station (Exit 1), then walk for about 12 minutes."}, {"address": "86 Yonggung-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.3 Stars | Must-Buy List: Zodiac guardian deity keychains, traditional Korean mother-of-pearl lacquer jewelry boxes, handmade bronze lotus wind chimes. Located at the entrance of the iconic Haedong Yonggungsa Temple in Gijang, this specialty store offers traditional Korean crafts with decades of heritage, Oriental religious blessing charms, and unique souvenirs featuring Busan\u0027s coastal charm.", "name": "Haedong Yonggungsa Cultural Souvenir Store", "transport": "Take bus 1001, 139, or 181 and get off at the \u0027Haedong Yonggungsa Temple / National Fisheries Science Museum\u0027 stop, then walk for about 10 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Gijang and East Busan (Lotte World, Haedong Yonggungsa Temple)"}, "gwangalli": {"categories": {"cat_1": {"items": [{"address": "183 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.6 stars | Must-Buy nds from Korea and Japan. With a warm interior layout and products combining functionality with chic looks, it\u2019s a perfect spot to hunt for accessories while strolling along Gwangalli Beach.", "name": "Breeze Select Shoe \u0026 Bag Boutique (Breeze Select)", "transport": "Subway Line 2, Gwangan Station, Exit 5, approx. 4 mins walk"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "191 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.6 stars | Must-buy: Handmade Butter Caramel Sand Cookies, Raspberry Cheese Sand Cookies, Sea Salt Caramel Sand Cookies. A highly representative handmade sand cookie specialty shop in Gwangalli with limited daily quantities freshly made on-site. Crafted with high-quality fermented butter and local ingredients, the cookies feature a crispy outer shell with a rich milky aroma and a smooth, creamy filling that isn\u0027t overly sweet. Packaging features the iconic Gwangan Bridge pattern, making it a fantastic, limited-edition Busan souvenir for friends, family, or yourself.", "name": "Gwangan Sand", "transport": "Subway Line 2 Gwangan Station, Exit 3 or 5, about a 10-minute walk to the coastal road."}, {"address": "245-1 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.7 stars | Must-buy: Gwangan Bridge Night View Postcards, Handmade Ocean Scented Candles, Dolphin Keychains. A creative lifestyle select shop located right on the Gwangalli beachfront, co-operated by local young artists and residents. The store sells various creative goods and unique souvenirs inspired by Gwangalli\u0027s ocean views, the Gwangan Bridge, and the sea of Busan. The handmade scented candles capture the imagery of blue ocean waves, and the exquisite illustrated postcards can be mailed directly from the shop, making it immensely popular among independent travelers.", "name": "Orange Sea", "transport": "Subway Line 2 Gwangan Station, Exit 3, about a 12-minute walk to the beach."}, {"address": "103 Gwangnam-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.5 stars | Must-buy: Red Velvet Cream Cheese Lava Cookie, Matcha Cream Cheese Cookie, Dark Chocolate Walnut Cookie. Busan\u0027s trendiest American-style handmade soft cookie shop, drawing long queues even before daily fresh batches come out of the oven. The cookies are thick and packed with generous fillings; the red velvet cookie, in particular, bursts with rich cream cheese, offering a stunning balance of sweet and savory flavors. Packed in exquisite, colorful vintage gift boxes, these are perfect to enjoy as afternoon tea at your hotel or to take home as a memorable dessert gift.", "name": "My Favorite Cookie", "transport": "Subway Line 2 Geumryeonsan Station, Exit 1, about a 6-minute walk."}, {"address": "129 Gwangnam-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.4 stars | Must-buy: Pink Tulip Ornaments, Vintage Heart-Shaped Mirrors, Gwangalli Limited Sticker Sets. Brimming with a cozy pastel vibe, this lifestyle select shop is a hugely popular spot for cute, romantic gifts along the Gwangalli Coffee Street. The store is filled with romantic floral decor, quality stationery, exquisite jewelry, and various delicate home ornaments. Everything is beautifully packaged with care, making it ideal whether you\u0027re treating yourself to a cute souvenir or picking out an aesthetic Korean-style gift for your bestie.", "name": "Love Is Giving", "transport": "Subway Line 2 Gwangan Station, Exit 3, about an 8-minute walk."}, {"address": "35 Gwangnam-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.6 stars | Must-buy: Hakwonjeon Honey Sponge Cake, Giant Cream Puffs (Choux Cream), French Apple Pie. Originating in Busan, OPS is a legendary European-style bakery brand famous nationwide, with its Gwangnam branch featuring classic French decor. The highlights are the giant cream puffs with crisp shells bursting with rich fresh cream, and the nostalgia-filled \u0027Hakwonjeon\u0027 honey sponge cakes, perfect for gifting. With a soft, airy texture and stylish European tins or paper boxes, these are must-buy treats representing classic Busan flavor.", "name": "OPS Bakery (Gwangnam Branch)", "transport": "Subway Line 2 Namcheon Station, Exit 1, about a 5-minute walk."}, {"address": "7 Millaksubyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.5 stars | Must-buy: Busan Honey Butter Sand Cookies, Rich Caramel Sand Cookies, Sea Salt Cheese Sand Cookies. A refined souvenir bakery specializing in sand cookies themed around Busan\u0027s coastal essence, carefully baked using local Korean honey and premium butter. The outer biscuit is stamped with wave motifs echoing the blue sea, encasing gooey rich caramel and smooth butter inside for a wonderfully textured taste. With sleek, modern box packaging, it has become one of Gwangalli\u0027s hottest Instagram-worthy gift boxes recently.", "name": "Gwangalli Bada Sand", "transport": "Subway Line 2 Gwangan Station, Exit 5, transfer to a bus or walk about 15 minutes to the vicinity of Millak Waterfront."}, {"address": "125 Gwangnam-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.6 stars | Must-buy: Busan Pale Ale Cans, Gwangan Bridge IPA, Branded Craft Beer Glassware. A renowned craft beer brewery founded through a collaboration between expat brewers and a local Busan team, with its headquarters located right in Gwangalli. Beyond enjoying fresh craft beer on tap, you can pick up exclusive canned craft beers to go along with high-quality merch. Featuring tropical fruity notes and cool Gwangan Bridge graffiti art on the cans, it\u0027s a unique and trendy local gift for friends who enjoy craft beer.", "name": "Gorilla Brewing Company (Gwangan)", "transport": "Subway Line 2 Gwangan Station, Exit 3, about a 7-minute walk."}, {"address": "219 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.3 stars | Must-buy: Wooden Gwangan Bridge Standees, Busan Ocean Wave Embroidered Drink Carrier Bags, Seagull Metal Bookmarks. A multi-brand souvenir shop located right along Gwangalli Beach, bringing together Busan-themed creations from various independent Korean designers. The shop offers a wide variety of goods ranging from quality stationery and lifestyle items to handmade accessories, all reasonably priced and stylish. The items featuring Gwangan Bridge nightscapes and embroidered drink bags are particularly sleek, portable, and ideal to bring home.", "name": "Gwangan Gift Shop", "transport": "Subway Line 2 Gwangan Station, Exit 3 or 5, about a 10-minute walk to the beach."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "35 Centum nam-daero, Haeundae-gu, Busan", "feature": "\u2b50 4.6 Stars | Must-Buy List: Gentle Monster sunglasses, Tamburins scented hand cream, OSULLOC green tea gift sets. Certified by Guinness World Records as the world\u0027s largest department store, located just two subway stops from Gwangalli Beach. Housing top international luxury brands, premier Korean indie designer labels, and a massive underground food hall, it is an absolute must-visit shopping paradise when traveling to Gwangalli.", "name": "Shinsegae Department Store Centum City", "transport": "Directly connected via the underground passage at Centum City Station (Subway Line 2)"}, {"address": "147 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.5 Stars | Must-Buy List: National Geographic outdoor down jackets, classic discounted Nike sneakers, Longchamp lightweight tote bags. The largest Mediterranean-style mega outlet in the Busan suburbs, featuring over 500 international and top Korean brands offering year-round discounts of 30% to 70% off. Styled like Greece\u0027s Santorini, it features a giant Ferris wheel alongside great bargain shopping, making it a hugely popular landmark for tourists.", "name": "Lotte Premium Outlet Dong-Busan", "transport": "From Gwangalli, take Subway Line 2 to BEXCO Station, transfer to the Donghae Line to OSIRIA Station, Exit 1, and walk for about 5 minutes"} hitheater seating overlooks the Gwangan Bridge, making it the premier destination to experience Busan\u0027s local youth creativity and unique shopping culture.", "name": "Millak The Market", "transport": "About an 18-minute walk from Exit 5 of Gwangan Station (Subway Line 2), or transfer to Suyeong-gu Minibus No. 2 to Millak Waterfront Park Station"}, {"address": "225 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.5 Stars | Must-Buy List: Ocean-themed handmade scented candles, woven bags from independent Korean brands, minimalist cotton tees. Situated in the heart of Gwangalli Cafe Street, this chic boutique select shop features apparel and lifestyle items carefully curated from emerging local Korean designers. Focusing on a simple, natural, and resort-inspired aesthetic, the store also sells handmade fragrances and home decor created by local Busan artists.", "name": "LUFT Select Shop Gwanganli", "transport": "About a 10-minute walk from Exit 3 of Gwangan Station (Subway Line 2) towards the beach promenade"}, {"address": "245-1 Gwanganhaebyeon-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.6 Stars | Must-Buy List: Hand-painted Gwangan Bridge night view mugs, ocean diffuser bottles, Busan postcards, and illustration stickers. Located right by Gwangalli Beach, this iconic local artists\u0027 cooperative specializes in unique, one-of-a-kind handmade souvenirs crafted by Busan artists and residents. Every item is inspired by the Gwangalli sea and Gwangan Bridge, brimming with local warmth and charm. It is the top destination for authentic, Gwangalli-exclusive souvenirs.", "name": "Orange Sea Creator Select Shop (Orange Sea / \uc624\ub80c\uc9c0\ubc14\ub2e4)", "transport": "About a 10-minute walk from Exit 5 of Gwangan Station (Subway Line 2), located on the front row right before Gwangalli Beach"}, {"address": "1F, 129 Gwangnam-ro, Suyeong-gu, Busan", "feature": "\u2b50 4.5 Stars | Must-Buy List: Vintage bear ceramic mugs, pink aesthetic Korean home decor, ctly connected to 1F Shinsegae Mall via the underground passageway from Centum City Station (Subway Line 2)"}, {"address": "1F, Shinsegae Centum City Mall, 35 Centumnam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.8 stars | Must-Buy List: Shell Perfume Hand Cream (CHAMO), Perfume Balm (PUMKINI), Classic Perfume Collection. A top-tier avant-garde Korean fragrance and skincare brand renowned for its unique artistic spaces and captivating scents. The counter boasts a gallery-like vibe. Their popular shell hand creams and perfume balms feature delicate textures and minimalist, beautiful packaging, making them stylish yet practical souvenirs.", "name": "TAMBURINS Shinsegae Centum City Store", "transport": "Directly connected to 1F Shinsegae Mall via the underground passageway from Centum City Station (Subway Line 2)"}, {"address": "1F, Main Building, Shinsegae Department Store, 35 Centumnam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.5 stars | Must-Buy List: First Care Activating Serum, Concentrated Ginseng Renewing Serum, First Care Activating Mask. Korea\u2019s iconic luxury traditional herbal skincare brand. Located inside the world\u0027s largest department store, this high-end counter offers professional skincare consultations and exquisite gift-wrapping services. Ideal for travelers seeking high-performance anti-aging skincare or luxury gifts for elders.", "name": "Sulwhasoo Counter - Shinsegae Centum City", "transport": "Directly connected via the underground passageway from Centum City Station (Subway Line 2)"}, {"address": "1F, Main Building, Shinsegae Department Store, 35 Centumnam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.4 stars | Must-Buy List: Black Cushion, Sensual Powder Matte Liquid / Lip Gloss, Hydro-Dew Plumping Primer. A premium luxury K-beauty brand under Amorepacific, famous for flawless base makeup and natural nude lips. Professional makeup artists at the counter offer color matching services to help you find the exact base and lip shades best suited for your skin tone.", "name": "HERA Counter - Shinsegae Centum City", "transport": "Direct access from Centum City Station (Subway Line 2)"}, {"address": "16 Gunam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Green Tea Seed Hyaluronic Serum, Super Volcanic Pore Clay Mask, Green Tea Cleansing Water. A classic Korean eco-friendly skincare brand highlighting natural ingredients from Jeju Island. Located on Haeundae\u0027s bustling main avenue, this bright and comfortable shop offers gentle, affordable products, making it a great place for daily skincare and cleansing essentials.", "name": "innisfree Haeundae Gunam-ro Store", "transport": "About a 2-minute walk from Exit 5 of Haeundae Station (Subway Line 2)"}, {"address": "15 Centumnam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.2 stars | Must-Buy List: IOPE Air Cushion, LANEIGE Lip Sleeping Mask, MAMONDE Moisture Ceramide Intense Cream. A beauty multi-brand store under Amorepacific, bringing together popular Korean brands like IOPE, LANEIGE, and MAMONDE. They frequently offer local promotions such as tax-free shopping or BOGO deals, making it easy to stock up on classic K-beauty staples in one go.", "name": "ARITAUM Centum City Store", "transport": "About a 3-minute walk from Exit 9 of Centum City Station (Subway Line 2)"}, {"address": "1F, Lotte Department Store Centum City, 59 Centumnam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Dr.Jart+ Cicapair Cream, CNP Propolis Energy Active Ampoule, Mediheal Watermide Essential Mask. A dedicated section inside Lotte Department Store Centum City featuring top Korean derma and cosmeceutical brands. The shopping environment is more relaxed and less crowded than typical street shops, offering guaranteed product quality, direct department store tax refunds, and gift-with-purchase perks.", "name": "Lotte Department Store Centum City - K-Beauty Corner", "transport": "Directly connected to Lotte Department Store via the underground passageway from Centum City Station (Subway Line 2)"}], "name": "Iconic Local Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "Near 197 Haeundaehaebyeon-ro, Haeundae-gu, Busan, South Korea", "feature": "\u2b50 4.6 stars | Must-buy list: BALANSA Busan-exclusive collab T-shirts, iconic baseball caps, retro vinyl merch canvas bags. This is a truly iconic local street culture brand in Busan, founded by a local crew blending music, subculture, and vintage selects. Besides their own label, they frequently collaborate with major international brands for Busan-exclusive items\u2014a must-visit spot in Haeundae for lovers of streetwear and independent fashion.", "name": "SOUND SHOP BALANSA (Busan Local Streetwear Select Shop)", "transport": "Approx. 5 minutes by taxi from Subway Line 2 Centum City Station or Haeundae Station"}, {"address": "Hyper Ground, B2 Floor, Shinsegae Department Store Centum City, 35 Centumnam-ro, Haeundae-gu, Busan, South Korea", "feature": "\u2b50 4.7 stars | Must-buy list: Vintage font baseball caps, printed tote bags, corduroy shoulder bags. One of Korea\u0027s hottest local designer accessory and clothing brands in recent years, featuring a popular store inside Shinsegae Centum City. Known for minimalist yet Y2K retro-colored designs, it draws crowds of young Koreans and celebrity fans. Caps and bags sell out instantly upon restock, making it a must-visit shopping destination in Haeundae for trendy accessories.", "name": "EMIS Trendy Accessories \u0026 Apparel (EMIS Shinsegae Centum City)", "transport": "Subway Line 2 Centum City Station Exit 10 directly connects to Shinsegae Department Store B2"}, {"address": "B2 Floor, Shinsegae Department Store Centum City, 35 Centumnam-ro, Haeundae-gu, Busan, South Korea", "feature": "\u2b50 4.5 stars | Must-buy list: Chubby Bag (bowling bag), Butter Bag (shoulder bag), Post Bag (crossbody square bag). An immensely popular and affordable local Korean designer handbag brand, renowned for quality faux leather, clean lines, and high functionality. The counter displays the latest seasonal collection in vibrant colors. Budget-friendly and versatile, it\u0027s a go-to brand for students and smart shoppers visiting Centum City.", "name": "STAND OIL Popular Designer Bags (STAND OIL Shinsegae Centum City)", "transport": "Directly accessible via the underground passage from Subway Line 2 Centum City Station to Shinsegae Department Store B2"}, {"address": "Hyper Ground, B2 Floor, Shinsegae Department Store Centum City, 35 Centumnam-ro, Haeundae-gu, Busan, South Korea", "feature": "\u2b50 4.8 stars | Must-buy list: Classic daisy print T-shirts, sweatshirts, printed canvas totes. A hugely popular Korean designer label taking the fashion scene by storm with its signature bold daisy motif and relaxed French casual style. The counter carries a full spectrum of color options and the latest seasonal womenswear. High-quality textures and instantly recognizable designs make it a favorite among fashion enthusiasts.", "name": "Mardi Mercredi French-Style Floral Apparel (Mardi Mercredi Shinsegae Centum City)", "transport": "Directly connected via the underground concourse from Subway Line 2 Centum City Station"}, {"address": "B2 Floor, Shinsegae Department Store Centum City, 35 Centumnam-ro, Haeundae-gu, Busan, South Korea", "feature": "\u2b50 4.6 stars | Must-buy list: Mary Jane ballet flats, stylish short rain boots in vibrant shades, cozy plaid scarves. A footwear and accessory counter revitalized by a Korean creative team into a viral sensation. Highlights include soft, elegant Mary Janes and Morandi-hued rain boots that blend water-resistant utility with sweet K-style aesthetics\u2014a highly popular stop for shoes and bags in Haeundae\u0027s Centum area.", "name": "Rockfish Weatherwear British Style Footwear \u0026 Accessories (Rockfish Weatherwear Shinsegae Centum City)", "transport": "Subway Line 2 Centum City Station directly connects to B2 Trendy Mall of Shinsegae Department Store"}, {"address": "B2 Floor, Shinsegae Department Store Centum City, 35 Centumnam-ro, Haeundae-gu, Busan, South Korea", "feature": "\u2b50 4.4 stars | Must-buy list: French slogan canvas totes, wool knitwear, minimalist leather box bags. A local Korean designer brand featuring soft, warm cream tones and minimalist elegance. From signature embroidered tote bags to refined accessories and quality everyday wear, the shop radiates a cozy K-drama outfit vibe. It\u0027s the ultimate destination for effortlessly chic wardrobe staples.", "name": "depound Lifestyle Apparel \u0026 Accessories (depound Shinsegae Centum City)", "transport": "Direct underground access from Subway Line 2 Centum City Station Exit 10"}, {"address": "B2 Floor, Shinsegae Department Store Centum City, 35 Centumnam-ro, Haeundae-gu, Busan, South Korea", "feature": "\u2b50 4.5 stars | Must-buy list: Classic C Logo T-shirts, American casual hoodies, spacious backpacks. One of Korea\u0027s most iconic domestic street casual brands, famous for durable fabrics and versatile C-logo designs. The counter offers a wide selection of unisex clothing, hats, and trendy backpacks with relaxed, comfortable fits\u2014embodying the youthful street fashion of Korea.", "name": "COVERNAT Korean Casual Streetwear (COVERNAT Shinsegae Centum City)", "transport": "Directly connected via the underground passage from Subway Line 2 Centum City Station"}, {"address": "Hyper Ground, B2 Floor, Shinsegae Department Store Centum City, 35 Centumnam-ro, Haeundae-gu, Busan, South Korea", "feature": "\u2b50 4.7 stars | Must-buy list: Marith\u00e9 font logo crewneck T-shirts, French berets, casual denim jeans. Skyrocketed to fame under local Korean creative direction, this brand has become a staple of Korean street style with its minimalist French casual vibe and classic logo lettering. The store features popular colorways of graphic tees, quality jackets, and headwear\u2014making it a super hot clothing counter in Centum City.", "name": "Marith\u00e9 Fran\u00e7ois Girbaud Retro Casual Apparel (Marith\u00e9 Fran\u00e7ois Girbaud Shinsegae Centum City)", "transport": "Connected via the underground shopping area from Subway Line 2 Centum City Station Exit 10"}], "name": "Popular Local Clothing, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "14 Gunam-ro, Haeundae-gu, Busan (\ubd80\uc0b0 \ud574\uc6b4\ub300\uad6c \uad6c\ub0a8\ub85c 14)", "feature": "\u2b50 4.4 Stars | Must-Buy List: Molten Cheese Fishcake Roll, Abalone \u0026 Fresh Shrimp Fishcake, Vacuum-Packed Fishcake Gift Sets. Founded in 1963, Goraesa is Busan\u0027s iconic fishcake brand. Its Haeundae flagship store is easily recognizable by the giant fishcake skewer landmark at the entrance. Proudly flour-free and preservative-free, their fishcakes are made from high-purity fresh fish meat, offering a springy and firm texture. The store features a dine-in area with freshly heated options as well as a wide variety of vacuum-sealed refrigerated gift sets\u2014an absolute must-try souvenir when visiting Haeundae!", "name": "Goraesa Eomuk - Haeundae Branch (\uace0\ub798\uc0ac\uc5b4\ubb35 \ud574\uc6b4\ub300\uc810)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 5, about a 2-minute walk."}, {"address": "2F, 38 Udong 1-ro, Haeundae-gu, Busan (\ubd80\uc0b0 \ud574\uc6b4\ub300\uad6c \uc6b0\ub3d91\ub85c 38 2\uce35)", "feature": "\u2b50 4.6 Stars | Must-Buy List: Busan Natural Honey Caramel Sand Cookies, Sea Salt Caramel Cream Cheese Cookies, Handmade Caramel Sauce Gift Box. Tucked away in a hip alley along Haeeridan-gil, this ultra-popular souvenir shop specializes in cute bear-stamped sandwich cookies celebrating Busan\u0027s ocean vibes. Made with natural honey from local Busan apiaries, premium French fermented butter, and rich cream cheese, the cookies are wonderfully crispy with a filling that is sweet yet perfectly balanced. Featuring high-quality packaging with charming blue ocean motifs, it\u0027s a hot item highly sought after by local youth and travelers alike.", "name": "Busan Bada Sand - Main Store (\ubd80\uc0b0\ubc14\ub2e4\uc0cc\ub4dc)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 4, about a 5-minute walk (inside Haeeridan-gil alley)."}, {"address": "31 Jungdong 1-ro, Haeundae-gu, Busan (\ubd80\uc0b0 \ud574\uc6b4\ub300\uad6c \uc911\ub3d91\ub85c 31)", "feature": "\u2b50 4.3 Stars | Must-Buy List: Signature Giant Cream Puff (Super Choux), Pollock Roe Baguette, Orange Pound Cake (Hakwon-jeon). A legendary bakery renowned as one of Busan\u0027s top three bakeries. The Haeundae main branch radiates classic European elegance, baking over a hundred varieties of exquisite breads and pastries daily. Their famous giant cream puff is stuffed with rich custard cream inside a crisp shell, while the orange pound cake features retro packaging and a moist texture\u2014making it a perfect gift representing Busan\u0027s dessert culture.", "name": "OPS Bakery - Haeundae Main Branch (\uc635\uc2a4 \ud574\uc6b4\ub300\uc810)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 1, about a 6-minute walk."}, {"address": "B1, Shinsegae Department Store, 35 Centumnam-daero, Haeundae-gu, Busan (\ubd80\uc0b0 \ud574\uc6b4\ub300\uad6c \uc13c\ud140\ub0a8\ub300\ub85c 35 B1)", "feature": "\u2b50 4.5 Stars | Must-Buy List: Chili Stuffed Meat Fishcake, Cheese Croquette Fishcake, Assorted Fishcake Soup Kit Gift Box. Established in 1953, Samjin Amhook is Busan\u0027s oldest fishcake brand, known for transforming traditional fishcakes into a bakery-style concept. The counter at Shinsegae Centum City offers dozens of freshly fried fishcakes along with beautifully packaged refrigerated gift boxes and soup kits\u2014convenient for taking back to your hotel or home (check customs regulations or opt for sealed processed items). The rich cheese and spicy chili flavors are hugely popular among visitors.", "name": "Samjin Amhook - Shinsegae Centum City Branch (\uc0bc\uc9c4\uc5b4\ubb35 \uc2e0\uc138\uacc4\ubc31\ud654\uc810 \uc13c\ud140\uc2dc\ud2f0\uc810)", "transport": "Busan Metro Line 2, Centum City Station, direct access via underground connection to Shinsegae Department Store B1 Food Hall."}, {"address": "27 Dalmaji-gil 117beon-gil, Haeundae-gu, Busan (\ubd80\uc0b0 \ud574\uc6b4\ub300\uad6c \ub2ec\ub9de\uc774\uae38117\ubc88\uae38 27)", "feature": "\u2b50 4.2 Stars | Must-Buy List: Busan Mooncake Gift Box, Korean Red Bean Walnut Cake, Brown Rice Truffle Sea Salt Cookies. Named after Haeundae\u0027s famous Dalmaji-gil (Moontan Road), this specialty dessert shop is supervised by a master craftsman of Korea. Fusing traditional Korean confections (Hangwa) with modern French pastry techniques, they have developed exquisite pastries adorned with moon motifs. With moderate sweetness and healthy ingredients, their elegant gift boxes make refined presents for family, elders, and friends.", "name": "Dalmaji Pang - Haeundae Branch (\ub2ec\ub9de\uc774\ube75)", "transport": "Busan Metro Line 2, Jung-dong Station, Exit 7, take Haeundae-gu Bus No. 2 to Dalmaji-gogae Station, then walk for 3 minutes."}, {"address": "29 Gunam-ro, Haeundae-gu, Busan (\ubd80\uc0b0 \ud574\uc6b4\ub300\uad6c \uad6c\ub0a8\ub85c 29)", "feature": "\u2b50 4.5 Stars | Must-Buy List: Natural Wild Raw Honeycomb Jars, Sea Salt Honeycomb Handmade Gummy Candies, Royal Jelly Spread. A honey-themed lifestyle and gift store on Haeundae Main Street, selecting pure wild honeycombs from Gyeongsangnam-do and Busan\u0027s suburbs. The shop sells beautifully packaged honeycomb products and snacks. The Sea Salt Honeycomb Gummies brilliantly pair Haeundae sea salt with natural honey sweetness, offering a chewy, non-sticky texture\u2014a healthy, delicious snack loaded with local flavor.", "name": "Haeundae Kkulbeol-dang (\ud574\uc6b4\ub300\uafc0\ubc8c\ub2f9)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 3, about a 3-minute walk."}, {"address": "20 Udong 1-ro, Haeundae-gu, Busan (\ubd80\uc0b0 \ud574\uc6b4\ub300\uad6c \uc6b0\ub3d91\ub85c 20)", "feature": "\u2b50 4.7 Stars | Must-Buy List: Handmade Nut Rice Crunch (Gangjeong), Seaweed \u0026 Sesame Handmade Candy, Handmade Malt Peanut Candy Gift Box. This traditional Korean sweet shop offers a modern twist on \u0027Gangjeong\u0027 (traditional puffed rice snacks). Using locally grown Korean rice and premium nuts, they replace cane sugar with low-sugar maltose and slow-bake at low temperatures. The result is immensely aromatic, crispy, and not overly sweet. Wrapped in chic, trendy packaging, it\u0027s a fantastic spot to sample traditional Korean tea snacks and pick up souvenirs.", "name": "Haeridangil Traditional Treats - Haeridan Gangjeong (\ud574\ub9ac\ub2e8 \uac15\uc815)", "transport": "Busan Metro Line 2, Haeundae Station, Exit 4, about a 4-minute walk (inside Haeeridan-gil)."}, {"address": "B1, Shinsegae Department Store, 35 Centumnam-daero, Haeundae-gu, Busan (\ubd80\uc0b0 \ud574\uc6b4\ub300\uad6c \uc13c\ud140\ub0a8\ub300\ub85c 35 B1)", "feature": "\u2b50 4.4 Stars | Must-Buy List: Busan Rice Cracker Gift Box, Premium Gijang Seaweed Set, Special Edition Busan Distilled Soju. Located in the food hall of the world\u0027s largest department store, Shinsegae Centum City, this specialty shop gathers the finest regional goods from Busan and the Gyeongsang region. Here, you can shop in one stop for premium Gijang seaweeds, Busan specialty rice crackers, and traditional craft liquors/soju gift sets from local breweries\u2014a top choice for travelers with limited time looking for high-end local souvenirs.", "name": "Busan Specialty Shop - Shinsegae Centum City (\uc2e0\uc138\uacc4\ubc31\ud654\uc810 \uc13c\ud140\uc2dc\ud2f0\uc810 \ubd80\uc0b0\ud2b9\uc0b0\ud488\uad00)", "transport": "Busan Metro Line 2, Centum City Station, direct access via underground connection to Shinsegae Department Store B1."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "35 Centumnam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.8 stars | Must-Buy List: Matin Kim designer T-shirts, Spa Land jjimjilbang (sauna) vouchers, local Busan handcrafted fragrance sets. Certified by Guinness World Records as the world\u0027s largest department store, it not only houses luxury international fashion houses, but its B2 \u0027Hyper Ground\u0027 floor is also a premier destination for trendy young Korean indie designer brands. Tourists can shop for the latest Korean fashion trends and local specialty gifts all in one place\u2014a must-visit shopping paradise in Haeundae Centum City.", "name": "Shinsegae Department Store Centum City Flagship Store", "transport": "Directly connected via the underground passage at Centum City Station (Busan Metro Line 2)"}, {"address": "147 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.6 stars | Must-Buy List: National Geographic Korea-exclusive down jackets, Beanpole classic leather bags, MLB Korean-style baseball caps. Located in the Dong-Busan Tourism Complex near Haeundae, this massive Santorini-inspired outlet features over 500 brands. It offers unbeatable discounts, especially on high-end Korean outdoor and casual labels, making it the top choice for outlet shopping.", "name": "Lotte Premium Outlet Dong-Busan", "transport": "Take Bus 1001 from Haeundae Station, or take the Donghae Line metro to Songjeong Station and transfer to a local bus for about 10 minutes"}, {"address": "15 Centum 4-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.5 stars | Must-Buy List: Marith\u00e9 Fran\u00e7ois Girbaud embroidered sweatshirts, Tamburins classic perfumed hand creams, LOCAL SELECT creative lifestyle items. Connected to the main Shinsegae building, this extension mall focuses on youth culture, fashion, and lifestyle aesthetics. It features popular Korean independent designer labels and local niche perfume boutiques. Bright, modern, and stylish, it leans more into contemporary pop culture and indie creations than the main building.", "name": "Shinsegae Centum City Mall", "transport": "Connected to Centum City Station (Busan Metro Line 2) via the underground skywalk through the main Shinsegae building"}, {"address": "59 Centumnam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Sulwhasoo First Care Activating Serum gift sets, traditional Busan dried seafood gift boxes, History of Whoo luxury skincare sets. Situated right next to Shinsegae, this department store is smaller in scale but offers a very comfortable, less crowded shopping environment. Staff are welcoming, and the selection of premium Korean cosmetics and skincare counters is exceptional, often featuring exclusive gift sets for international visitors.", "name": "Lotte Department Store Centum City", "transport": "Directly connected via the underground passage at Centum City Station (Busan Metro Line 2)"}, {"address": "813 Haeundae-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.2 stars | Must-Buy List: SPAO Korean collaboration pajamas, Shoopen lightweight canvas shoes, Roem elegant Korean-style dresses. A budget-friendly local department store located near Jangsan Station in Haeundae, showcasing everyday brands under the Korean E-Land Group along with permanent outlet discounts. Free from tourist crowds and popular with locals, it offers high value for money on trendy Korean apparel, shoes, and bags.", "name": "NC Department Store Haeundae", "transport": "Directly connected to Exit 2 of Jangsan Station (Busan Metro Line 2)"}, {"address": "1133 Jeonggwan-ro, Jangan-eup, Gijang-gun, Busan", "feature": "\u2b50 4.4 stars | Must-Buy List: Discovery Expedition Korean-edition outdoor jackets, HAZZYS British-style knitwear, COVERNAT casual hoodies. Designed in the style of a charming American village, this sprawling luxury outlet features major international brands and top Korean casual fashion labels. Although located a bit farther from Haeundae\u0027s city center, it offers deep discounts, extra tax refund benefits, and gift promotions, making it a bargain hunter\u0027s dream.", "name": "Shinsegae Simon Premium Outlets Busan", "transport": "Take direct Bus 1008 from Haeundae Station; takes approximately 45 minutes"}, {"address": "B1 Shinsegae Dept Store, 35 Centumnam-ro, Haeundae-gu, Busan", "feature": "\u2b50 4.3 stars | Must-Buy List: Discounted Korean designer trench coats, jumbo-sized K-Beauty skincare sets, quality Korean-made wool scarves. Tucked away inside Shinsegae Department Store, this self-service off-price concept outlet brings together past-season items from dozens of emerging Korean designer brands and global labels. With an open-style setup and discounts up to 50%\u201370% off original prices, it\u0027s a hidden gem for discovering unique fashion pieces.", "name": "Shinsegae Factory Store Centum City", "transport": "Directly connected underground to Centum City Station (Busan Metro Line 2)"}, {"address": "147 Gijanghaean-ro, Gijang-eup, Gijang-gun, Busan", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade cookies from local Busan bakeries, Kodak Apparel Korean retro jackets, Lifework graphic print T-shirts. A massive lifestyle complex combining an indoor shopping mall, Lotte Mart, and an outlet store. It features a huge section dedicated to trendy Korean streetwear and local specialty foods. When you need a break, head to one of the many famous local Busan restaurants located inside for a seamless shopping and dining experience.", "name": "Lotte Mall Dong-Busan", "transport": "Take Bus 1001 from Haeundae Station (Busan Metro Line 2) and get off at Lotte Outlet Station"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Haeundae and Centum City"}, "nampo_jagalchi": {"categories": {"cat_1": {"items": [{"address": "38 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.6 stars | Must-buy list: Torriden Dive-In Low Molecule Hyaluronic Acid Serum, Unove Deep Damage Treatment EX, Delight Project Protein Seaweed Chips. This is a massive flagship store located in the Gwangbok-ro shopping district of Nampo-dong, offering Korea\u0027s latest and best-selling cosmetics, skincare, and drugstore items. The store is spacious and remarkably well-organized, featuring interactive tester zones and a best-seller ranking wall. It is the ultimate shopping haven for tourists stocking up on K-Beauty essentials.", "name": "OLIVE YOUNG Gwangbok Main Store", "transport": "Subway Line 1 Nampo Station Exit 1, approx. 3 mins walk"}, {"address": "39 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.5 stars | Must-buy list: HERA Black Cushion, ROMAND Juicy Lasting Tint, Huxley Secret of Sahara Oil Essence. Created by Shinsegae Department Store, this curated K-Beauty store is known as the Korean Sephora. The Gwangbok branch brings together numerous mid-to-high-end independent Korean beauty brands and niche designer skincare products. Offering an exceptionally rich hands-on testing experience, it\u0027s ideal for travelers seeking premium and niche beauty products.", "name": "CHICOR Busan Gwangbok", "transport": "Subway Line 1 Nampo Station Exit 1, approx. 3 mins walk"}, {"address": "54 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.4 stars | Must-buy list: Green Tea Seed Serum, Super Volcanic Pore Clay Mask, Black Tea Youth Enhancing Ampoule. Located on Nampo-dong\u0027s core shopping street, this multi-story standalone concept store features a design filled with natural lush greenery. Beyond offering classic Jeju-ingredient skincare products, the store frequently runs exclusive discounts and gift-with-purchase promotions. The friendly staff is multilingual, ensuring a welcoming shopping experience.", "name": "Innisfree Gwangbok Flagship Store", "transport": "Subway Line 1 Nampo Station Exit 7, approx. 4 mins walk"}, {"address": "45-1 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.3 stars | Must-buy list: Clean It Zero Cleansing Balm, Ultimate Coverage Cushion, Prime Primer Finish Powder. A classic Korean makeup and cleansing brand whose cleansing balm is a globally renowned star product. The Gwangbok store\u0027s bright, pink-themed decor attracts many shoppers, and it frequently offers exclusive bundle deals unique to the Gwangbok-ro branch, featuring impressive bulk discounts.", "name": "BANILA CO Busan Gwangbok", "transport": "Subway Line 1 Nampo Station Exit 1, approx. 4 mins walk"}, {"address": "40 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.4 stars | Must-buy list: CLIO Kill Cover Cushion, Peripera Ink Velvet Lip Tint, Goodal Green Tangerine Vita C Dark Spot Serum. This store brings together ultra-popular affordable Korean makeup and skincare brands like CLIO, Peripera, and Goodal. The Nampo branch updates its cosmetics inventory very rapidly, featuring a huge variety of colors and trendy packaging for lip products and eyeshadow palettes\u2014a must-visit spot for young shoppers looking to collect every shade.", "name": "CLUB CLIO Busan Nampo", "transport": "Subway Line 1 Nampo Station Exit 1, approx. 3 mins walk"}, {"address": "47 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.2 stars | Must-buy list: IOPE Bio Conditioning Essence, LANEIGE Lip Sleeping Mask, MAMONDE Rose Water Toner Mist. A multi-brand beauty and drugstore under Amorepacific, serving as a one-stop shop for staple Korean household brands like Laneige, IOPE, Hanyul, and Mamonde. The spacious Gwangbok store boasts a remarkably comprehensive product lineup and frequent promotional events, making it a great place to buy Korean hydrating and nourishing skincare products.", "name": "ARITAUM Busan Gwangbok", "transport": "Subway Line 1 Nampo Station Exit 1, approx. 4 mins walk"}, {"address": "52 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.1 stars | Must-buy list: Soothing \u0026 Moisture Aloe Vera 92% Soothing Gel, Ginseng Royal Silk Watery Cream, Green Propolis Soothing Ampoule. A classic Korean skincare brand known for natural plant-based ingredients, located prominently on a corner of Gwangbok-ro. The jumbo-sized aloe vera gel and luxurious gold-flake ginseng cream are huge hits with international tourists, and their bulk-buy promotional bundles offer exceptional value.", "name": "NATURE REPUBLIC Busan Gwangbok", "transport": "Subway Line 1 Nampo Station Exit 7, approx. 4 mins walk"}, {"address": "31 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.2 stars | Must-buy list: Intense Care Gold 24K Snail Cream, Liptone Get It Tint, Floria Nutra Energy Toner. A K-Beauty brand famous for creative packaging and high cost-performance, with its Gwangbok branch in Nampo-dong serving as a directly operated flagship store. Alongside cute-shaped hand creams and sheet masks, its premium snail repair skincare series is especially popular among mature women. Visitors can often uncover heavily discounted gift sets here.", "name": "TONYMOLY Gwangbok Flagship Store", "transport": "Subway Line 1 Jagalchi Station Exit 7, approx. 5 mins walk"}], "name": "Iconic Local Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "51 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.4 Stars | Must-Buy List: Minimalist multi-color canvas bags, lightweight waterproof casual loafers, highly elastic comfortable white sneakers. SHOOPEN is an iconic budget-friendly shoe and bag specialty store under Korea\u0027s E-LAND Group, famous for its unbeatable value for money. The store offers a dazzling array of trendy footwear, hats, and bags that are immensely popular among Korean students and local youth. Not only are the shoe styles diverse and modern, but their canvas bags and backpacks also seamlessly blend practical functionality with stylish design\u2014making it a must-visit accessory treasure hunting spot on Gwangbok-ro Shopping Street.", "name": "SHOOPEN Gwangbok", "transport": "Busan Metro Line 1, Nampo Station, Exit 1, about a 3-minute walk."}, {"address": "37-1 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.6 Stars | Must-Buy List: Classic heavy-weight C Logo hoodies, American vintage workwear backpacks, reversible fleece jackets. COVERNAT is a hugely popular local streetwear brand in Korea that artfully blends American vintage casual with Japanese workwear aesthetics. The Gwangbok Flagship Store features a unique industrial aesthetic design with an impressively rich display. Its signature \u0027C\u0027 logo series is extraordinarily popular across South Korea, featuring sturdy fabrics and sharp cuts\u2014a must-visit store for anyone looking to experience authentic Korean street culture.", "name": "COVERNAT Gwangbok Flagship Store", "transport": "Busan Metro Line 1, Nampo Station, Exit 1, about a 4-minute walk."}, {"address": "34 Gudeok-ro, Jung-gu, Busan", "feature": "\u2b50 4.7 Stars | Must-Buy List: Slim-fit tailored trousers, heavy-weight cotton drop-shoulder T-shirts, minimalist leather shoulder bags. Launched as the in-house physical brand of MUSINSA\u2014Korea\u0027s largest online fashion platform\u2014it highlights high quality, minimalism, and reasonable prices. The Nampo flagship store boasts an incredibly spacious shopping area and a high-tech fitting room experience zone. Its apparel emphasizes excellent tailored silhouettes and versatile color palettes; its slim suit trousers and plain tops are especially praised by Korean office workers and university students.", "name": "MUSINSA STANDARD Nampo", "transport": "Busan Metro Line 1, Jagalchi Station, Exit 10, about a 2-minute walk."}, {"address": "40 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.3 Stars | Must-Buy List: Korea-exclusive New Balance retro running shoes, FOLDER exclusive collaboration canvas sneakers, Korean street-style platform sandals. FOLDER is a highly influential Korean multi-brand footwear shop, assembling top international brands alongside exclusive collaborations with local Korean designers. The store often drops Korea-exclusive colorways or rare shoe models ahead of time, making it a sacred pilgrimage site for sneakerheads. The staff also offer professional outfit advice and sizing assistance.", "name": "FOLDER Gwangbok Flagship", "transport": "Busan Metro Line 1, Nampo Station, Exit 1, about a 4-minute walk."}, {"address": "61-1 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.2 Stars | Must-Buy List: ON AIR thermal heat-tech innerwear, cool-touch high-stretch casual pants, comfortable pure cotton solid T-shirts. TOPTEN10 is a famous Korean fast-fashion staple, focusing on practical, functional wardrobe basics for everyday life. The Gwangbok branch is vast and extremely well-stocked, offering everything from basic undergarments and loungewear to four-season casual clothing. With affordable prices and comfortable fabrics, it attracts crowds of locals and tourists during sale seasons.", "name": "TOPTEN10 Gwangbok", "transport": "Busan Metro Line 1, Jagalchi Station, Exit 7, about a 5-minute walk."}, {"address": "12-1 Gwangbokjungang-ro, Jung-gu, Busan", "feature": "\u2b50 4.5 Stars | Must-Buy List: Hongdae-style retro knit cardigans, high-waisted flattering wide-leg jeans, minimalist leather underarm shoulder bags. Originating from Seoul\u0027s vibrant Hongdae district, Market A is a renowned trendy select shop chain known for its keen, trend-setting Korean style. The Gwangbok branch is arranged in a clean, minimalist fashion, thoughtfully color-coded and style-categorized. It carries cutting-edge Korean fashion apparel and unique women\u0027s bags at budget-friendly prices, making outfit-clashing a thing of the past.", "name": "Market A Gwangbok", "transport": "Busan Metro Line 1, Nampo Station, Exit 7, about a 6-minute walk."}, {"address": "54 Gwangbok-ro, Jung-gu, Busan", "feature": "\u2b50 4.3 Stars | Must-Buy List: Classic Crayon Shin-chan collaboration pajamas, American varsity jackets, seamless cozy loungewear sets. SPAO is one of South Korea\u0027s iconic fast-fashion brands, beloved by youth. Beyond trendy everyday wear, SPAO is most famous for its viral collaboration sleepwear and apparel featuring popular anime and cartoon characters. Offering great quality at unbeatable value, the well-organized Gwangbok store is ideal for the whole family to shop together.", "name": "SPAO Gwangbok", "transport": "Busan Metro Line 1, Nampo Station, Exit 1, about a 4-minute walk."}, {"address": "Underground 12, Gudeok-ro, Jung-gu, Busan", "feature": "\u2b50 4.1 Stars | Must-Buy List: Korean dresses direct from Dongdaemun, genuine Korean handmade leather square bags, soft leather comfortable platform Mary Janes. Spanning underground between Nampo Station and Jagalchi Station, Nampo Underground Shopping Center is a favorite budget fashion hub for Busan locals. It houses hundreds of independent boutiques selling clothes, shoes, and bags that closely track current Korean trends. Featuring transparent, affordable prices, many shops offer high-quality \u0027Made in Korea\u0027 leather shoes and bags, making it a thrilling treasure trove for bargain hunters.", "name": "Nampo Underground Shopping Center Fashion Shops", "transport": "Directly connected via the underground pedestrian passage between Busan Metro Line 1 Nampo Station and Jagalchi Station."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "36 Taejong-ro 99beon-gil, Yeongdo-gu, Busan", "feature": "\u2b50 4.6 stars | Must-Buys: Fish cake croquettes, Chili pepper fish cake sticks, Cheese fish cakes. Founded in 1953, this authentic local fish cake brand is located just across the bridge from Nampo-dong. Beyond housing a Fish Cake History Museum, it offers freshly made, piping-hot fish cakes that are crispy on the outside, soft on the inside, and packed with savory flavor. Their vacuum-packed gift boxes are top choices for souvenir shoppers.", "name": "Samjin Amook Yeongdo Main Store", "transport": "Subway Line 1 Nampo Station Exit 8, about a 10-minute walk across the Yeongdodaegyo Bridge."}, {"address": "34-1 Gudeok-ro, Jung-gu, Busan", "feature": "\u2b50 4.4 stars
