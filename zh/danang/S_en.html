    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.7 stars | Da Nang\u0027s most famous iconic landmark, featuring a spectacular fire and water breathing show every Saturday and Sunday evening at 9:00 PM.", "duration": "1-2 hours", "title": "Dragon Bridge", "transport": "About a 5-minute Grab ride from the city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | A Gothic-style cathedral built during the French colonial period. Its dreamy pink exterior makes it a popular photo spot.", "duration": "1 hour", "title": "Da Nang Cathedral (Pink Church)", "transport": "Located by the Han River in the city center, just a 3-minute walk from Han Market"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A scenic site composed of five limestone peaks named after the five elements. The mountains house numerous natural limestone caves and ancient pagodas.", "duration": "2-3 hours", "title": "The Marble Mountains", "transport": "About a 20-minute Grab ride from downtown to the base of the mountains"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.8 stars | A famous hilltop resort featuring the world-renowned \"Golden Bridge\", French Village architecture, and an indoor amusement park.", "duration": "5-7 hours", "title": "Sun World Ba Na Hills", "transport": "About a 45-minute drive from Da Nang city center to the cable car station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Home to a majestic 67-meter-tall white Lady Buddha statue, offering panoramic views of Da Nang Bay and the turquoise coastline.", "duration": "1-2 hours", "title": "Linh Ung Pagoda (Son Tra Peninsula)", "transport": "About a 15-minute drive along the coastline from My Khe Beach"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.7 stars | Acclaimed as one of the world\u0027s six most attractive beaches, featuring fine white sand and gentle waves, perfect for wading and watching the sunrise.", "duration": "2-3 hours", "title": "My Khe Beach", "transport": "Located on the east coast, about 5-10 minutes by car or walking across the bridge from the city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | Housing the world\u0027s largest collection of ancient Champa sculpture art, the building\u0027s architecture beautifully blends French and Cham styles.", "duration": "1-2 hours", "title": "Museum of Cham Sculpture", "transport": "Located at the western end of the Dragon Bridge, easily accessible on foot"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.2 stars | Da Nang\u0027s oldest large indoor traditional market, a fantastic spot to buy souvenirs, Vietnamese cashews, and custom-made Ao Dai.", "duration": "1-2 hours", "title": "Han Market", "transport": "Situated by the Han River in the city center, easily reached on foot or by taxi"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | A romantic riverside promenade decorated with red heart lanterns, perfect for couples to stroll and enjoy the night views of the Han River and Dragon Bridge.", "duration": "1 hour", "title": "Love Lock Bridge \u0026 DHC Marina", "transport": "Located on the east bank of the Han River; take a ride to the east end of Dragon Bridge and walk 2 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | A comprehensive museum showcasing Da Nang\u0027s geographical history, folklore, and historical events from the French and American wars.", "duration": "1-2 hours", "title": "Da Nang Museum", "transport": "Located inside the ancient Dien Hai Citadel ruins, about a 5-minute drive from Han Market"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | Featuring the giant \"Sun Wheel\" Ferris wheel, the park showcases iconic architectural replicas of ten Asian countries alongside exciting thrill rides.", "duration": "3-4 hours", "title": "Asia Park", "transport": "Located on the south end of the Han River\u0027s west bank, about a 10-minute drive from the city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Vietnam\u0027s largest 3D optical illusion art museum, featuring nine themed zones for fun, creative, and interactive photo experiences.", "duration": "2 hours", "title": "Art in Paradise Da Nang (3D Trick Art Museum)", "transport": "About a 10-15 minute Grab ride from the city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.2 stars | Vietnam\u0027s longest suspension bridge, standing at the mouth of the Han River\u2014an exceptional spot for taking in sunset and harbor views at dusk.", "duration": "0.5-1 hour", "title": "Thuan Phuoc Bridge", "transport": "Located at the mouth of the Han River, about a 10-minute drive from the city center"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | A century-old vintage yellow lighthouse built during the French colonial era, offering rich historical charm and breathtaking, endless ocean views.", "duration": "1 hour", "title": "Son Tra Lighthouse", "transport": "Located deep in the Son Tra Peninsula; recommended to go by motorbike or private car, taking about 30 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.2 stars | A temple of Caodaism, an indigenous Vietnamese religion. It venerates the \"Divine Eye\" and uniquely blends elements of Confucianism, Buddhism, Taoism, and Christianity.", "duration": "0.5-1 hour", "title": "Cao Dai Temple Da Nang", "transport": "Located in the city center near Da Nang Museum, easily accessible on foot or by vehicle"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A wellness resort park combining natural hot springs, mud baths, a water park, and lush forest scenery\u2014perfect for relaxing body and mind.", "duration": "4-5 hours", "title": "Nui Than Tai Hot Springs Park", "transport": "Located in the western mountains of Da Nang, about a 45-60 minute chartered car ride from the city center."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | One of Da Nang\u0027s most bustling night markets, lined with stalls offering freshly grilled seafood, authentic local Vietnamese snacks, and souvenirs.", "duration": "1-2 hours", "title": "Son Tra Night Market", "transport": "Located next to the eastern end of the Dragon Bridge, within easy walking distance."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.2 stars | A traditional Buddhist temple offering a peaceful sanctuary amidst the city bustle, featuring a large white Buddha statue and a serene atmosphere.", "duration": "1 hour", "title": "Phap Lam Pagoda", "transport": "Located on a main thoroughfare in the city center, about a 5-minute drive from Han Market."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.8 stars | Hailed as the \"World\u0027s Most Magnificent Pass\" and recognized by National Geographic as one of the 50 must-visit destinations in a lifetime, offering breathtaking mountain and ocean vistas.", "duration": "1-2 hours", "title": "Hai Van Pass", "transport": "Located at the mountain summit between Da Nang and Hue, about a 45-minute ride by chartered car or motorbike from the city center."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | A quieter cove compared to My Khe Beach, featuring crystal-clear water, rocky shores, and pristine natural charm.", "duration": "2 hours", "title": "Tien Sa Beach", "transport": "Located on the northwest side of the Son Tra Peninsula, about a 20-minute drive from the city center."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Dien Hai Citadel is a special national historical monument in Da Nang, built in the 19th century during the Nguyen Dynasty as a crucial defensive fortress against French-Spanish invasions. Its well-preserved walls and ancient cannons evoke a deep sense of history.", "duration": "1-2 hours", "title": "Dien Hai Citadel", "transport": "About a 5-minute Grab ride from downtown Da Nang."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | Displays over 2,500 precious artifacts and historical photographs showcasing Da Nang\u0027s natural ecology, folk culture, war history, and urban development\u2014the best cultural spot to truly understand the city.", "duration": "1.5-2 hours", "title": "Da Nang Museum", "transport": "Located inside the Dien Hai Citadel site, about a 10-minute walk from Han Market."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.2 stars | The outdoor exhibition area features tanks, fighter aircraft, and heavy weaponry from the Vietnam War, while indoor galleries display a replica of Ho Chi Minh\u0027s residence and military archives\u2014a must-visit for history and military enthusiasts.", "duration": "1-2 hours", "title": "Zone 5 Military Museum \u0026 Ho Chi Minh Museum", "transport": "About an 8-minute taxi ride from Da Nang International Airport."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | Built in 1934, Phap Lam Pagoda is a serene Mahayana Buddhist temple with an 11-meter-tall golden Buddha statue and lush gardens, making it a popular spot for locals seeking peace and blessings.", "duration": "1 hour", "title": "Phap Lam Pagod ji display, perfect for year-round fun.", "duration": "3-4 hours", "title": "Mikazuki Water Park 365", "transport": "About a 20-minute Grab ride from downtown Da Nang."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Nestled at the foot of the Ba Na Mountains, this natural hot spring resort offers Japanese mud baths, natural mineral spring water parks, and tea baths\u2014making it a premier wellness destination to relax and unwind.", "duration": "3-5 hours", "title": "Nui Than Tai Hot Springs Park", "transport": "About a 45-minute drive or private transfer from downtown Da Nang."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Built in 1830 during the reign of Emperor Minh Mang of the Nguyen Dynasty, this ancient royal temple is a recognized Vietnamese national historical and cultural site, celebrated for its serene elegance and rich heritage.", "duration": "1-2 hours", "title": "Tam Thai Pagoda", "transport": "Located on Water Mountain within the Marble Mountains; about a 10-minute walk after reaching the summit via elevator."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | A seaside plaza park where hundreds of pigeons flock every morning and evening. Known affectionately as Pigeon Park, it\u0027s a wonderfully scenic spot for photography, sea views, and relaxation.", "duration": "1 hour", "title": "Bien Dong Park (East Sea Park)", "transport": "Located at the northern end of My Khe Beach, about a 5-minute drive from the Dragon Bridge."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Zones", "description": "\u2b50 4.5 stars | Situated near the Dragon Bridge and the Love Lock Bridge, this vibrant market brings together local Vietnamese street food, grilled seafood, and souvenir stalls with a lively nighttime atmosphere.", "duration": "1.5 - 2 hours", "title": "Son Tra Night Market (Dragon Bridge Night Market)", "transport": "Located just a 3-minute walk from the eastern side of the Dragon Bridge, extremely easy to reach via Grab."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Zones", "description": "\u2b50 4.3 stars | One of Da Nang\u0027s most iconic traditional markets. The second floor specializes in custom tailor-made traditional Ao Dai dresses and fabrics, while the ground floor is packed with local delicacies, dried goods, and cashews.", "duration": "1 - 2 hours", "title": "Han Market (Ch\u1ee3 H\u00e0n)", "transport": "Located along the Han River in central Da Nang, a 5 to 10-minute Grab ride from most major city hotels."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Zones", "description": "\u2b50 4.6 stars | Da Nang\u0027s largest and most modern night market. Clean and well-organized, it features global food stalls, handmade craft vendors, and live music performances.", "duration": "2 - 3 hours", "title": "Helio Night Market", "transport": "Located on 2/9 Street in Hai Chau District, near Asia Park; about 10 minutes by Grab from the city center."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Zones", "description": "\u2b50 4.2 stars | A beloved local traditional market packed with authentic Vietnamese street food stalls. Offering wallet-friendly prices, it provides a genuine taste of local daily life.", "duration": "1 - 2 hours", "title": "Con Market (Ch\u1ee3 C\u1ed3n)", "transport": "Located at the intersection of H\u00f9ng V\u01b0\u01a1ng and \u00d4ng \u00cdch Khi\u00eam Streets, directly opposite GO! Da Nang Mall and easily walkable."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Zones", "description": "\u2b50 4.4 stars | A modern, stylish department store in Da Nang complete with international fashion brands, an ice-skating rink, a cinema, and diverse dining choices\u2014all in comfortably air-conditioned spaces.", "duration": "2 - 3 hours", "title": "Vincom Plaza Da Nang", "transport": "Located on Ng\u00f4 Quy\u1ec1n Avenue on the east bank of the Han River, conveniently accessible just across the Han River Bridge."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Zones", "description": "\u2b50 4.5 stars | The top hypermarket choice for tourists shopping for Vietnamese souvenirs, offering everything from cashews, coffee, and instant noodles to dried mangoes, along with convenient luggage storage services.", "duration": "1.5 - 2.5 hours", "title": "Lotte Mart Da Nang", "transport": "Located on N\u1ea1i Nam Street in Hai Chau District, near Asia Park; accessible directly to the entrance via Grab or taxi."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Zones", "description": "\u2b50 4.1 stars | A boutique shopping mall sitting right along the scenic Han River front, featuring cafes, brand stores, and international dining options. The second-floor food court allows you to enjoy meals with sweeping river views.", "duration": "1 - 2 hours", "title": "Indochina Riverside Mall", "transport": "Located along the B\u1ea1ch \u0110\u1eb1ng riverfront boulevard next to the Han River, just a 3-minute walk from Han Market."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Zones", "description": "\u2b50 4.3 stars | The Da Nang branch of Vietnam\u0027s major supermarket chain GO!, featuring fresh produce and local specialties at budget-friendly prices\u2014a fantastic spot for buying souvenirs in bulk.", "duration": "1.5 - 2.5 hours", "title": "GO! Da Nang Mall (Formerly Big C)", "transport": "Located on H\u00f9ng V\u01b0\u01a1ng Street in the heart of downtown, only a 5-minute drive from Da Nang Railway Station."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Zones", "description": "\u2b50 4.0 stars | A cozy night market catering primarily to youth and students, selling affordable trendy clothing, shoes, accessories, and popular local street food.", "duration": "1 - 1.5 hours", "title": "Le Duan Night Market s | A premium gourmet supermarket offering beautifully packaged high-end Vietnamese coffee, dried fruits, and imported food items in a clean and pleasant environment.", "duration": "0.5 - 1 hour", "title": "Joly Mart (Han River Branch)", "transport": "Located on Tr\u1ea7n Ph\u00fa Street in Hai Chau District, about a 3-minute walk from Han Market."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.5 stars | A stylish hipster venue combining a creative souvenir shop and a cozy cafe, selling Da Nang postcards, handmade wood carvings, and designer trinkets in a relaxed atmosphere.", "duration": "1 hour", "title": "Danang Souvenirs \u0026 Cafe (Bach Dang Branch)", "transport": "Located on B\u1ea1ch \u0110\u1eb1ng Road right along the front row of the Han River bank, easily accessible on foot."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.0 stars | An authentic night market mainly serving students and locals, featuring dirt-cheap prices on clothing and daily goods alongside a delicious, high-value food area.", "duration": "1 - 2 hours", "title": "Hoa Khanh Night Market (Ch\u1ee3 \u0110\u00eam H\u00f2a Kh\u00e1nh)", "transport": "Located in Lien Chieu District (Li\u00ean Chi\u1ec3u), about a 20-minute drive from the city center; taking Grab is recommended."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.0 stars | A grand duty-free mall in a luxury beachfront location bringing together world-renowned luxury brands, perfumes, cosmetics, and fine dining for a duty-free shopping experience.", "duration": "1 - 2 hours", "title": "VV Mall Duty Free Da Nang", "transport": "Located on V\u00f5 Nguy\u00ean Gi\u00e1p Road south of My Khe Beach; directly accessible by taxi."}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.6 stars | An exquisite shop specializing in high-quality Vie                 }
            });
            renderPool();
        }

        function renderPool() {
            poolContainer.innerHTML = '';
            let data = activeTab === 'schedule' ? schedulePool : intercityPool;
            
            if(activeTab === 'schedule' && currentFilter !== 'All') {
                data = data.filter(item => {
                    const cat = item.category || '';
                    const title = item.title || '';
                    const desc = item.description || '';
                    const fullText = (cat + ' ' + title + ' ' + desc).toLowerCase();
                    const filterLower = currentFilter.toLowerCase();

                    if (filterLower.includes('attraction')) {
                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;
                    }
                    
                    return cat.toLowerCase().includes(filterLower);
                });
            }

            if(data.length === 0) {
                poolContainer.innerHTML = `<div class="text-center text-gray-400 py-10 font-medium md:text-lg">No data available for this category</div>`;
                return;
            }

            data.forEach((item, index) => {
                let title = activeTab === 'schedule' ? item.title : item.route;
                let category = activeTab === 'schedule' ? (item.category || 'Featured') : 'Intercity Transport';
                let duration = activeTab === 'schedule' ? item.duration : item.time;
                let transport = activeTab === 'schedule' ? item.transport : item.method;
                let desc = activeTab === 'schedule' ? item.description : 'Suitable for intercity or cross-border travel.';

                let catLower = category.toLowerCase();
                let badgeColor = "bg-slate-50 text-slate-600 border-slate-200";
                
                if(catLower.includes('attraction') || catLower.includes('culture') || catLower.includes('景點') || catLower.includes('文藝')) badgeColor = "bg-sky-50 text-sky-700 border-sky-200";
                if(catLower.includes('shopping') || catLower.includes('market') || catLower.includes('購物') || catLower.includes('商圈')) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(catLower.includes('dining') || catLower.includes('cafe') || catLower.includes('美食') || catLower.includes('名店')) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(dynamicCats.some(dynCat => catLower.includes(dynCat.toLowerCase()))) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";

                let searchKeyword = encodeURIComponent(`${cityName} ${title}`);
                let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>
                        <button onclick="addToTrip('${activeTab}', '${(item.title || item.route).replace(/'/g, "\\'")}')" class="shrink-0 bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white rounded-xl px-4 py-2 font-bold transition-colors border border-sky-100 text-sm shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i>Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="${badgeColor} border text-xs px-2.5 py-1 rounded-md font-bold">${category}</span>
                        <span class="bg-rose-50 text-rose-600 border border-rose-100 text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${duration}</span>
                    </div>
                    <p class="text-sm md:text-base text-gray-600 mb-5 leading-relaxed">${formattedDesc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm md:text-base text-gray-700 flex items-start gap-3">
                        <span class="${activeTab === 'schedule' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                            <i class="fa-solid ${activeTab === 'schedule' ? 'fa-train-subway' : 'fa-ship'}"></i>
                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);
            });
        }

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
