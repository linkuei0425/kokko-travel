nd rustic wooden stalls draw countless travelers eager to experience authentic Vietnamese everyday food culture.", "name": "Ch\u1ee3 Qu\u00ea Traditional Food Stalls", "transport": "Located in the heart of the French Village at Ba Na Hills; simply stroll over to the traditional market square."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills)", "feature": "\u2b50 4.0 Stars | A charmingly rustic spot that brings the classic flavors of Hoi An Ancient Town directly to Ba Na Hills. Its signature dish is Cao L\u1ea7u (Hoi An Noodles). Made using traditional techniques, the thick rice noodles are satisfyingly chewy, drizzled with a savory signature sauce, and topped with braised pork belly and crispy fried noodle crackers. The warm, nostalgic ambiance with yellow walls and red lanterns makes you feel as though you\u0027ve stepped into Hoi An, making it popular among heritage food lovers.", "name": "Hoi An Restaurant at Ba Na Hills", "transport": "Take the cable car to the summit and walk along the main street of the French Village for about 5 minutes."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Morin Hotel Area, Sun World Ba Na Hills)", "feature": "\u2b50 4.0 Stars | A classic, historic restaurant offering authentic Central Vietnamese home cooking and local specialties. A must-try is Nem L\u1ee5i (Lemongrass Pork Skewers), featuring seasoned minced pork wrapped around lemongrass stalks and grilled over charcoal. The meat is firm with a subtle lemongrass aroma; wrap it in paper-thin rice paper with fresh herbs and cucumber, then dip into rich peanut sauce for a crispy, juicy, and aromatic bite. A perfect showcase of traditional Vietnamese culinary arts.", "name": "Morin Restaurant", "transport": "Located inside the Morin Hotel at Ba Na Hills, about a 2-minute walk from the French Village central plaza."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills)", "feature": "\u2b50 4.1 Stars | A spacious, highly authentic Vietnamese-themed restaurant renowned for its piping-hot Hue Beef Noodle Soup (B\u00fan B\u00f2 Hu\u1ebf). The vibrant red broth is slow-simmered with beef bones, lemongrass, and shrimp paste, producing a rich, spicy, and deeply aromatic flavor. Thick rice noodles absorb the savory essence of the broth, complemented by melt-in-your-mouth beef chunks and pork knuckles. A hugely popular comfort food perfect for chilly mountaintop weather.", "name": "Club Restaurant", "transport": "Located in the heart of the Ba Na Hills summit amusement park area, near the main cable car station exit."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Du D\u00f4me Square, Sun World Ba Na Hills)", "feature": "\u2b50 4.4 Stars | A renowned restaurant combining premium local ingredients with traditional wood-fired charcoal grilling. Their signature pork and lamb Shashlik skewers are marinated in house-special spices and grilled over open embers until perfectly charred and crispy outside, while locking in juicy tenderness inside. Paired with tangy dipping sauce and crisp sliced onions, it offers a visually striking and mouthwatering feast widely acclaimed as a must-eat at Ba Na Hills.", "name": "Kavkaz Restaurant", "transport": "Located right next to Du D\u00f4me Square in the French Village at the top of Ba Na Hills; easily accessible on foot."}, {"address": "TL602, Hoa Ninh, Hoa Vang, Da Nang (Near Ba Na Hills Cable Car Station entrance)", "feature": "\u2b50 4.2 Stars | A traditional local restaurant situated along the mountain road at the foot of Ba Na Hills, frequented by savvy travelers before or after visiting the mountain. Famous for its authentic Vietnamese Sour \u0026 Spicy Seafood Soup (Canh Chua), it features freshly caught local fish and shrimp simmered with pineapple, tomatoes, and tamarind for a sweet, tangy, and refreshing flavor. Pair it with stir-fried morning glory and aromatic garlic pan-fried pork for a hearty home-style meal that showcases the true charm of Central Vietnamese home cooking.", "name": "Hoang Bach Restaurant", "transport": "Located on the main TL602 road right before the entrance to the Ba Na Hills Cable Car base station. Hiring a private car or taking a taxi is recommended."}], "name": "Iconic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (French Village)", "feature": "\u2b50 4.4 Stars | Located within the French Village of Ba Na Hills, this Starbucks boasts a European castle-style facade. It serves classic cold brews, espressos, and freshly baked French croissants. Tourists love sitting on the second-floor outdoor terrace, sipping a nutty pour-over Americano while overlooking performances on the European-style plaza and rolling mountain mists, soaking in an incomparably romantic French brunch atmosphere.", "name": "Starbucks Sun World Ba Na Hills", "transport": "Take the Ba Na Hills Cable Car to French Village Station and walk about 3 minutes."}, {"address": "French Village, Sun World Ba Na Hills, Da Nang", "feature": "\u2b50 4.2 Stars | A specialty cafe designed around a 19th-century vintage post office theme, filled with nostalgic French flair. The signature Vietnamese drip coffee is rich and aromatic, paired with the sweet taste of condensed milk for a smooth finish. Matched with hot pressed sandwiches and fresh French apple pie for brunch, it\u0027s a favorite for photography lovers and those seeking a slow-paced break.", "name": "Caf\u00e9 Postal", "transport": "Take the Ba Na Hills Cable Car to French Village; easily accessible on foot."}, {"address": "Le Jardin D\u0027Amour, Sun World Ba Na Hills, Da Nang", "feature": "\u2b50 4.1 Stars | A dreamy oasis cafe located within the Le Jardin D\u0027Amour gardens, surrounded by lush greenery and vibrant flower beds. Serving freshly ground cappuccinos, lattes, and colorful tropical fruit salads. Sitting in the sun-drenched glasshouse, sipping a crisp passion fruit sparkling drink paired with rich cheesecake, makes for the ultimate relaxing brunch spot after strolling through the gardens.", "name": "Caf\u00e9 Doumer", "transport": "Take the Ba Na Hills Cable Car to Night Station, then walk into Le Jardin D\u0027Amour."}, {"address": "Central Square, French Village, Sun World Ba Na Hills, Da Nang", "feature": "\u2b50 4.3 Stars | Housed in a domed building right by Central Square, this cafe serves European street-style brunch options and specialty coffees. The coconut cold brew comes highly recommended\u2014a velvety, sweet blend of bold Vietnamese coffee and refreshing coconut milk. Paired with crispy-on-the-outside, soft-on-the-inside French garlic bread, it offers a delightful taste experience.", "name": "Caf\u00e9 Du D\u00f4me", "transport": "Located in the core plaza area of French Village, a 2-minute walk from the cable car station."}, {"address": "Debay Wine Cellar, Sun World Ba Na Hills, Da Nang", "feature": "\u2b50 4.5 Stars | Tucked above a nearly century-old French wine cellar, offering an elegant and tranquil setting. Beyond wine, coffee connoisseurs adore their signature wine-infused cold brew and single-origin pour-overs. Paired with a sophisticated cheese and charcuterie platter for brunch, the rich layers of flavor provide a warm, luxurious indulgence amid the cool mountain climate.", "name": "Debay Wine Cellar Bar \u0026 Caf\u00e9", "transport": "Take the Debay Cable Car line to Wine Cellar Station; right outside the station."}, {"address": "French Village Promenade, Sun World Ba Na Hills, Da Nang", "feature": "\u2b50 4.0 Stars | A sunlit cafe famous for freshly baked breads and exquisite pastries. Daily freshly baked egg tarts and golden croissants exude a rich buttery aroma, crisp on the outside and soft within. Paired with a fresh strawberry milkshake or a caramel macchiato, it\u2019s the perfect vibrant brunch spot for families starting their morning at Ba Na Hills.", "name": "Rosa Bakery \u0026 Caf\u00e9", "transport": "Take the cable car to French Village and walk along the shopping street for about 4 minutes."}, {"address": "French Village Upper Street, Sun World Ba Na Hills, Da Nang", "feature": "\u2b50 4.2 Stars | A romantic cafe inspired by the fairytale classic, featuring whimsical decor blended with French elegance. The popular Pandan Latte offers subtle notes of taro and herbal fresh aroma with a smooth taste. Paired with freshly made bacon and egg waffle brunch, balancing sweet and savory flavors, it\u0027s a popular check-in spot for families and female travelers alike.", "name": "Caf\u00e9 Le Petit Prince", "transport": "Located on the upper street of French Village, reachable on foot."}, {"address": "French Village Corner, Sun World Ba Na Hills, Da Nang", "feature": "\u2b50 4.1 Stars | Nestled on a French-style street corner, this cozy cafe exudes the relaxed vibe of Paris\u0027s Left Bank. Serving classic espressos alongside hearty all-day brunch platters (featuring sunny-side-up eggs, German sausages, and roasted tomatoes). With perfectly balanced coffee and generous portions, it is a favorite pit stop for visitors to recharge between park attractions.", "name": "Bistro Du Coin", "transport": "Located in the alley behind the French Village Church, about a 3-minute walk."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills French Village)", "feature": "\u2b50 4.3 stars | Located in the heart of the French Village, this giant domed building combines the charm of a classic German pub with Vietnamese regional specialties. Highlighted by foodies, its fresh draft craft beers pair perfectly with crispy-on-the-outside, tender-on-the-inside roasted German pork knuckles, sausage platters, traditional Vietnamese grilled meat skewers, and roasted chicken. Sit down to a festive atmosphere complete with live exotic music and dance performances. The pork knuckle features crackling skin and juicy meat, while a cold beer cuts through the richness\u2014making it the top choice for experiencing vibrant pub culture on Ba Na Hills.", "name": "Beer Plaza Restaurant", "transport": "Take the Ba Na Hills Cable Car to Hoi An Station or Bordeaux Station, arrive at the mountaintop French Village, and walk for about 3 minutes."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills French Village)", "feature": "\u2b50 4.1 stars | A stylish restaurant specializing in authentic local Vietnamese dishes and traditional Central Vietnam snacks, featuring decor that blends traditional Vietnamese woodwork with French colonial elegance. The restaurant offers a wide variety of Vietnamese specialties, such as M\u00ec Qu\u1ea3ng, Cao L\u1ea7u, and freshly grilled lemongrass pork skewers. The noodle broths are rich and sweet, complemented by crispy shrimp crackers and fresh greens for vibrant layers of flavor. Tourists love being able to savor authentic regional Vietnamese comfort food in a comfortable, elegant bistro setting.", "name": "Club Restaurant", "transport": "Take the cable car to the mountaintop French Village, then walk about 2 minutes to reach Club Restaurant."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills Du D\u00f4me Square)", "feature": "\u2b50 4.2 stars | Imbued with Eastern European and Central Asian flair, this specialty barbecue restaurant is one of the most unique bistros on Ba Na Hills. Large skewers of beef, lamb, and pork are slow-roasted over low charcoal heat, resulting in a lightly charred, fragrant exterior and a tender, juicy interior. Paired with house-made sweet-and-sour red sauce, authentic pickles, and a cold craft beer, the rich meat and beer flavors blend seamlessly\u2014a favorite spot for hearty eaters and beer lovers.", "name": "Kavkaz Baku Restaurant", "transport": "Located next to Du D\u00f4me Square at the top of the French Village; take the cable car to the top terminus station and walk over."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills Du D\u00f4me Square)", "feature": "\u2b50 4.0 stars | A large specialty restaurant located next to Du D\u00f4me Square, offering hundreds of Vietnamese regional dishes from north to south alongside international cuisine. Must-try highlights include made-to-order Vietnamese crispy pancakes (B\u00e1nh X\u00e8o) and hot beef/chicken noodles (Ph\u1edf). The pancakes feature a golden, crispy shell stuffed with shrimp, pork, and bean sprouts, dipped in a signature fish sauce blend for a smoky yet refreshing bite. With a lively atmosphere, spacious seating, and extensive drink options, it is ideal for families and group travelers to enjoy hot local delicacies together.", "name": "Arapang Restaurant", "transport": "Take the Ba Na Hills Cable Car straight to the mountaintop French Village; located inside the main building at Du D\u00f4me Square."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills French Village)", "feature": "\u2b50 4.2 stars | Evoking the romantic atmosphere of a Parisian street bistro, Brasserie specializes in classic French dishes and Vietnamese fusion cuisine. Signature dishes like French roasted spring chicken and spice-rubbed Vietnamese roasted ribs are highly praised for their rich aromas and juicy tenderness. Paired with a glass of fine wine or freshly brewed Vietnamese iced drip coffee, sitting at outdoor tables overlooking European-style streets creates a wonderful illusion of being in Europe\u2014perfect for a leisurely lunch or sunset wine hour.", "name": "Brasserie Restaurant", "transport": "Take the cable car to the French Village central square at the mountaintop, then walk 1 minute along the main street."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills Jardin D\u0027Amour)", "feature": "\u2b50 4.4 stars | Tucked away in the beautiful Jardin D\u0027Amour (Garden of Love), this bistro serves refined French-Vietnamese fusion cuisine and exquisite afternoon tea. Must-try items include Vietnamese lemongrass grilled fish and fresh shrimp spring rolls; the translucent spring roll wraps encase plump shrimp and crisp herbs, perfectly complemented by a tangy peanut-seafood dipping sauce. Surrounded by lush greenery and artistic statues, with the scent of flowers and coffee drifting through the air, it attracts visitors to take photos and savor elegant, peaceful dining.", "name": "Doumer Restaurant", "transport": "Take the cable car to Le Jardin Station (Night Station / Le Jardin Station), then walk into the Jardin D\u0027Amour to find it."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills French Village)", "feature": "\u2b50 4.3 stars | Combining a French bakery with a bistro concept, this eatery is famous for daily fresh-baked Vietnamese baguettes (B\u00e1nh M\u00ec) and French pastries. The B\u00e1nh M\u00ec boasts an ultra-crispy crust filled with rich pate, Vietnamese pork ham, pickled radish, and fresh cilantro, offering a deliciously complex balance of savory and sweet. Paired with a rich iced condensed milk coffee or a light beer, this great-value spot is a popular gathering point to recharge and sample savory snacks.", "name": "Le Petrin Bakery \u0026 Bistro", "transport": "Located along the European-style streets of the French Village; about a 3-minute walk from the mountaintop cable car station, recognizable by its eye-catching bakery sign."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills)", "feature": "\u2b50 4.1 stars | Decorated in a rugged mountain hunter lodge style, Taiga Restaurant highlights piping hot stone bowl Vietnamese beef Ph\u1edf and charcoal-grilled mountain delicacies. The stone bowl Ph\u1edf comes highly recommended; the boiling broth retains heat remarkably well, cooking raw beef slices instantly to tender perfection. The fragrant broth carries notes of Thai basil and fresh lime. Offering various beers and specialty juices, enjoying a hot bowl of soup and grilled meat in the cool mountain climate brings warmth and pure satisfaction.", "name": "Taiga Restaurant", "transport": "Take the cable car to the mountaintop square, then follow signs and walk about 4 minutes to reach the Taiga building area."}], "name": "Specialty Gastropubs \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "Du Dome Square, Sun World Ba Na Hills, Hoa Vang, Da Nang", "feature": "\u2b50 4.2 stars | Located in the heart of Du Dome Square, this large buffet restaurant features a very rich vegetarian section. The vegetarian spring rolls here have a crispy outer shell filled with fragrant wood ear mushrooms and shredded taro, crunching with every bite; paired with a special plant-based sweet and spicy sauce, the flavor is well-layered and not greasy at all. In addition, the rich Vietnamese coconut vegetable curry is a must-try popular dish, simmering fresh carrots and potatoes until soft and creamy. Poured over fragrant Jasmine rice, it makes you want bite after bite, highly praised by plant-based travelers from all over the world.", "name": "Arapang Restaurant - Vegetarian Buffet Section", "transport": "After taking the Ba Na Hills Cable Car to the French Village at the peak, it is about a 3-minute walk to Du Dome Square."}, {"address": "Beer Plaza, French Village, Sun World Ba Na Hills, Hoa Vang, Da Nang", "feature": "\u2b50 4.5 stars | Featuring a giant glass dome architecture, Beer Plaza offers lively music and dance performances alongside surprising vegetarian cold dishes and stir-fry sections. The most signature dish is the grilled seasonal vegetable skewers: thick slices of bell peppers, zucchini, and king oyster mushrooms brushed with herb olive oil and grilled to perfection. Juicy and full of smoky charcoal flavor with every bite, paired with a refreshing vegetarian version of Vietnamese green papaya salad that is sweet, sour, and crunchy. The festive Oktoberfest atmosphere complements the high-quality vegetarian options, making it the top choice for gatherings.", "name": "Beer Plaza Restaurant - Vegetarian Options", "transport": "Located inside Beer Plaza in the French Village, about a 2-minute walk from the central square of the French Village."}, {"address": "French Village, Sun World Ba Na Hills, Hoa Vang, Da Nang", "feature": "\u2b50 4.1 stars | Brimming with French romantic ambiance, Le Louvre Restaurant offers vegetarians a variety of plant-based dishes blending Eastern and Western flavors. The Ratatouille comes highly recommended: tomatoes, yellow zucchini, and eggplant slowly simmered over low heat until melt-in-your-mouth tender, with the sweet and tangy tomato aroma fully infused into the vegetables. Paired with freshly baked crusty European herb bread dipped in rich truffle wild mushroom soup, it is warm and satisfying\u2014the ultimate comfort food when the mountain temperature drops.", "name": "Le Louvre Buffet - Plant-Based Section", "transport": "Located within the French Village complex near Notre-Dame Cathedral, easily accessible on foot."}, {"address": "Fantasy Park Zone, Sun World Ba Na Hills, Hoa Vang, Da Nang", "feature": "\u2b50 4.0 stars | Famous for its international buffet, Taiga Restaurant features an Asian vegetarian stir-fry corner loved by Asian tourists. The classic Vegetarian Stir-fried Pho (Pho Xao Chay) uses wide rice noodles quickly stir-fried over high heat with mushrooms, bean sprouts, and bok choy, delivering a rich wok hei. The noodles are chewy and absorb the savory mushroom sauce completely. Another favorite is the Salt and Pepper Crispy Tofu, coated in a thin golden crust with a silky, velvety center\u2014the contrast of crispy outside and soft inside is irresistible.", "name": "Taiga Restaurant - Asian Vegetarian Corner", "transport": "After taking the cable car to the summit, head to the Fantasy Park zone where directional signage is visible."}, {"address": "French Village, Sun World Ba Na Hills, Hoa Vang, Da Nang", "feature": "\u2b50 4.3 stars | An exquisite Japanese restaurant offering plant-based sushi and tofu dishes for vegetarian enthusiasts. A must-order is the Special Avocado Vegetarian Sushi Roll, featuring soft, fragrant sticky rice wrapped around creamy avocado and crisp cucumber strips, sprinkled with toasted sesame seeds for a light, guilt-free flavor. Additionally, the grilled king oyster mushroom with Japanese teriyaki sauce has a firm, chewy texture comparable to scallops, locking the sweet and savory sauce perfectly inside for a delightful taste surprise.", "name": "Little Tokyo - Vegetarian Sushi \u0026 Tofu", "transport": "Located along the streets of the French Village, about a 5-minute walk from the Golden Bridge cable car station."}, {"address": "Du Dome Square, Sun World Ba Na Hills, Hoa Vang, Da Nang", "feature": "\u2b50 4.0 stars | A unique restaurant filled with Caucasian flair, serving generous portions of charcoal-grilled vegetarian options. The grilled large mushrooms and roasted potato wedges are hidden culinary gems praised by travelers. Whole mushrooms are marinated in secret Russian spices and grilled over charcoal, locking in rich juices that burst in your mouth with every bite. Paired with charcoal-roasted potatoes featuring golden crispy skins and fluffy interiors, served with a special garlic plant-based yogurt sauce, it offers a unique and highly satisfying meal.", "name": "Kavkaz Restaurant - Roasted Veggie Skewers", "transport": "Located around Du Dome Square, not far from Beer Plaza."}, {"address": "Mercure Danang French Village Bana Hills, Sun World Ba Na Hills, Hoa Vang, Da Nang", "feature": "\u2b50 4.4 stars | An elegant French restaurant inside the Mercure Hotel offering exquisite \u00e0 la carte vegetarian set menus. The Truffle Wild Mushroom Risotto comes highly recommended, cooked with Italian Arborio rice that absorbs rich wild mushroom broth and plant-based cream. The rice retains an al dente bite with a rich, smooth texture, releasing a deep truffle aroma that lingers on the tongue. Paired with a delicate fresh vegetable salad tossed in red wine vinaigrette, it is refreshing and tangy\u2014the ultimate spot to enjoy high-quality Western vegetarian dining on Ba Na Hills.", "name": "L\u0027Etable Restaurant - Vegetarian Gourmet", "transport": "Located inside the main building of Mercure Hotel in the French Village; directly accessible upon taking the cable car to the French Village at the peak."}, {"address": "Near Golden Bridge \u0026 French Village walkway, Sun World Ba Na Hills, Hoa Vang, Da Nang", "feature": "\u2b50 4.2 stars | A grab-and-go vegetarian snack \u0026 dessert stand designed for visitors strolling around Ba Na Hills. The standout street treat here is the Vegan Coconut Pandan Layer Cake (B\u00e1nh Da L\u1ee3n), featuring an amazingly soft, chewy texture with subtle aromatic pandan leaf and rich coconut milk sweetness\u2014distinctively layered and pleasantly light. Additionally, fresh-baked vegan banana pancakes boast a crisp crust filled with warm, rich banana puree, making it the perfect treat while exploring the French Village.", "name": "Sun Cafe \u0026 Vegetarian Snack Corner", "transport": "Located in the walkway rest area connecting the Golden Bridge and the French Village."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Sun World Ba Na Hills, An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Next to French Village Square)", "feature": "\u2b50 4.3 stars | A super popular street food stand located right by the French Village Square. Its signature Vietnamese-style herb-marinated BBQ skewers and smoked giant sausages sizzle enticingly over hot charcoal. With a lightly charred exterior rich in smoky aroma, each bite bursts with savory juices and firm, springy texture. Pairing them with special sweet chili sauce or tucking them into a French baguette makes a perfect combo\u2014a favorite grab-and-go street snack for visitors strolling among European-style architecture.", "name": "Ba Na Hills BBQ Skewer Kiosk", "transport": "Take the Ba Na Hills Cable Car to French Village Station, then walk about 2 minutes."}, {"address": "Sun World Ba Na Hills, An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Near Beer Plaza)", "feature": "\u2b50 4.5 stars | Featuring carefully selected authentic German sausages grilled to a crispy, golden-brown perfection. Every bite offers a satisfying snap, giving way to tender, juicy meat infused with delicate herbal and pepper aromas. Served with yellow mustard and sauerkraut, the lightly tangy and spicy flavor cuts through any richness, making it immensely popular with international tourists and families craving delicious, comforting treats.", "name": "Sun World German Sausage Kiosk", "transport": "Take the Hoi An Cable Car to French Village Station, then walk towards Beer Plaza for about 3 minutes."}, {"address": "Sun World Ba Na Hills, An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (European Castle Pedestrian Street)", "feature": "\u2b50 4.2 stars | A sweet dessert stand filled with rich buttery and vanilla aromas. Made-to-order Belgian waffles are crispy on the outside and soft inside, dusted with fine powdered sugar and drizzled with hazelnut cocoa sauce for a balanced sweetness. The French cr\u00eapes are soft and delightfully chewy, wrapped around fresh bananas and whipped cream, creating rich layers of flavor\u2014an absolute must-try walking dessert for photos and energy boosts.", "name": "French Village Cr\u00eape \u0026 Waffle Kiosk", "transport": "Take the Ba Na Hills Cable Car to the mountain peak French Village, then walk to the center of the Castle Shopping Area."}, {"address": "Sun World Ba Na Hills, An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Next to Lunar Castle entrance)", "feature": "\u2b50 4.4 stars | Freshly carved, well-marinated herb chicken and beef are wrapped in pita bread or pocket bread toasted until crispy outside and soft inside. Packed with crisp lettuce, fresh tomatoes, and a special garlic yogurt sauce, the first bite delivers a satisfying crunch followed by juicy meat and fresh veggies. Rich in flavors and very filling, it\u0027s a super convenient energy refill while exploring outdoors.", "name": "Ba Na Hills Doner Kebab Stand", "transport": "Take the mountain Funicular to the Lunar Castle area, then walk 1 minute after getting off."}, {"address": "Sun World Ba Na Hills, An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Golden Bridge Garden Exit)", "feature": "\u2b50 4.6 stars | The most beloved cooling treat under the bright mountaintop sun, serving rich Vietnamese coconut milk ice cream and fresh mango sorbet. The coconut ice cream has a smooth, creamy texture topped with toasted coconut flakes and crushed peanuts. The combination of crunch and creaminess makes it sweet, refreshing, and never dry, highly praised by both adults and kids.", "name": "Sun World Tropical Ice Cream Cart", "transport": "Take the Golden Bridge Cable Car to Golden Bridge Station, walk along the Golden Bridge walkway to the garden exit."}, {"address": "Sun World Ba Na Hills, An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Next to Fountain Square)", "feature": "\u2b50 4.4 stars | Bringing Vietnam\u0027s classic street food, B\u00e1nh M\u00ec, into this European-style mountain town. Freshly baked baguettes are ultra-crispy with a delicate crust, stuffed with rich pork liver p\u00e2t\u00e9, Vietnamese cold cuts, grilled pork belly, and sweet-and-sour pickled radishes. Finished with fresh cilantro and a touch of chili, the harmonious mix of savory, tangy, and spicy flavors creates an unforgettable taste experience.", "name": "Vietnamese Banh Mi \u0026 Baguette Cart", "transport": "After exiting the cable car mountaintop terminal, walk towards Central Fountain Square for about 2 minutes."}, {"address": "Sun World Ba Na Hills, An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Beer Plaza Outdoor Area)", "feature": "\u2b50 4.3 stars | An outdoor food kiosk filled with a festive atmosphere, specializing in made-to-order golden fried chicken and french fries. The chicken features a crispy coating sealing in hot, juicy tenderness, elevated by a custom pepper-salt seasoning. They also serve hot cheesy meat pies with stretchy melted cheese and generous fillings\u2014a hugely popular snack to go with park beer and party vibes.", "name": "Beer Plaza Fried Chicken \u0026 Snacks Kiosk", "transport": "Take the cable car to the top, follow the signs to the outdoor dining area of Beer Plaza."}, {"address": "Sun World Ba Na Hills, An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Next to Roman Walkway)", "feature": "\u2b50 4.1 stars | Freshly fried, piping-hot Spanish churros with a golden, crisp shell and a soft, elastic interior, generously coated in aromatic cinnamon sugar. Delivering an addictive crunch in every bite, dipping them into rich hot chocolate sauce melds bittersweet chocolate with sweet cinnamon aromas for pure satisfaction\u2014one of the park\u0027s iconic strolling desserts.", "name": "Sun World Churros \u0026 Dessert Kiosk", "transport": "Walk through the Roman Walkway area in the French Village to easily spot the eye-catching dessert cart."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Sun World Ba Na Hills Theme Park"}, "city_center": {"categories": {"cat_1": {"items": [{"address": "19 Tr\u1ea7n B\u00ecnh Tr\u1ecdng, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A highly iconic, long-standing M\u00ec Qu\u1ea3ng shop in Da Nang. The thick, chewy noodles infused with golden turmeric offer a delightfully bouncy texture, perfectly absorbing the rich pork-bone and turmeric broth. Topped with juicy shrimp, tender pork belly, crunchy peanuts, and crispy rice crackers, it delivers a rich, multi-layered mouthfeel. Loved by both locals and tourists for its authentic Central Vietnamese flavors and generous portions.", "name": "M\u00ec Qu\u1ea3ng B\u00e0 Mua", "transport": "About an 8-minute walk from the west end of the Dragon Bridge, or a 3-minute Grab ride."}, {"address": "K280/23 Ho\u00e0ng Di\u1ec7u, B\u00ecnh Hi\u00ean, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Tucked deep in an alley, this legendary traditional Vietnamese pancake spot sees long queues every day. Made to order, the golden crispy pancakes crackle pleasantly with every bite, stuffed with sweet grass prawns, bean sprouts, and juicy pork. Wrap a crispy piece with abundant fresh herbs inside paper-thin rice paper, then dip it into their signature thick peanut-pork liver sauce. The savory-sweet, mildly spicy, and crunchy combination is addictive.", "name": "B\u00e1nh X\u00e8o B\u00e0 D\u01b0\u1ee1ng", "transport": "Take a taxi to the alley entrance at 280 Ho\u00e0ng Di\u1ec7u Street, then walk about 50 meters into the alley."}, {"address": "109 Nguy\u1ec5n Ch\u00ed Thanh, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | A famous fish cake noodle soup restaurant with decades of history. The immensely flavorful broth is slow-simmered from fish bones, pumpkin, pineapple, and bamboo shoots, creating a perfectly balanced sweet, savory, and tangy base. Their signature fish cakes come in steamed and fried varieties\u2014bouncy, savory, and without any fishy odor. Paired with smooth rice noodles and house-made chili sauce, it is a refreshing local favorite for breakfast or dinner.", "name": "B\u00fan Ch\u1ea3 C\u00e1 109 (109 Nguy\u1ec5n Ch\u00ed Thanh)", "transport": "Located on Nguy\u1ec5n Ch\u00ed Thanh Street in the city center, about a 7-minute walk from Da Nang Cathedral (Pink Church)."}, {"address": "4 L\u00ea Du\u1ea9n, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.1 stars | A classic restaurant specializing in Central Vietnam\u0027s traditional specialty: Pork Rice Paper Rolls (B\u00e1nh Tr\u00e1ng Th\u1ecbt Heo). Premium boiled pork slices\u2014with a strip of fat on both sides and tender lean meat in the middle\u2014are layered between soft wet rice sheets and crisp dry rice paper. Wrapped with over a dozen fresh herbs like mint and perilla, then dipped in fragrant fermented anchovy sauce (m\u1eafm n\u00eam), it offers a wonderfully rich texture that is savory, tender, non-greasy, and intensely refreshing.", "name": "Qu\u00e1n Tr\u1ea7n - Pork Rice Paper Rolls", "transport": "Located at the western foot of the Han River Bridge, about a 2-minute walk from the bridge."}, {"address": "96 Phan Ch\u00e2u Trinh, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A hugely popular traditional chicken rice spot in H\u1ea3i Ch\u00e2u District. The signature fried chicken leg rice features a large drumstick fried to golden, extra-crispy perfection, locking in every bit of juice. The rice is cooked in chicken broth and turmeric, resulting in flavorful, aromatic grains. Served with a custom chili-lime sauce and pickled cucumbers to cut through the richness, it is a go-to landmark for locals and tourists craving a satisfying meal.", "name": "C\u01a1m G\u00e0 A H\u1ea3i", "transport": "About a 5-minute walk from Da Nang Cathedral (Pink Church)."}, {"address": "20 Nguy\u1ec5n Ch\u00ed Thanh, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | A long-established dry rice noodle spot highly recommended by locals. Fresh rice noodles are topped with crispy pork belly, grilled char siu pork, and pork skin, drenched in a spoonful of savory, aged fermented fish sauce (m\u1eafm n\u00eam), then mixed with roasted peanuts, fried shallots, and fresh herbs. The noodles absorb the savory, sweet, and mildly spicy sauce, bursting with bold, authentic Central Vietnamese flavors in every bite.", "name": "B\u00fan M\u1eafm Ng\u1ecdc", "transport": "About a 6-minute walk from the Museum of Da Nang."}, {"address": "100 Ho\u00e0ng V\u0103n Th\u1ee5, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | A long-standing eatery specializing in traditional Hue and Central Vietnamese steamed rice cake snacks. Rice batter is steamed in small ceramic saucers into delicate, melt-in-your-mouth B\u00e1nh B\u00e8o, topped with minced shrimp, crispy pork cracklings, scallion oil, and a splash of sweet fish sauce. In addition to B\u00e1nh B\u00e8o, their tapioca dumplings (B\u00e1nh L\u1ecdc) feature translucent, chewy skins with savory shrimp fillings, full of local character.", "name": "B\u00e1nh B\u00e8o B\u00e0 B\u00e9", "transport": "About a 6-minute walk from the Dragon\u0027s Head at the west end of the Dragon Bridge."}, {"address": "17 Tr\u1ea7n B\u00ecnh Tr\u1ecdng, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A classic Da Nang eatery serving authentic Hue-style beef noodle soup. The crimson, aromatic broth is slow-simmered for hours with beef bones, lemongrass, and shrimp paste, resulting in a rich, deeply savory, and fragrant flavor. It comes generously loaded with tender stewed beef shank, gelatinous pork knuckle, beef balls, and blood pudding, served over thick rice noodles with crisp fresh greens.", "name": "B\u00fan B\u00f2 Hu\u1ebf 17 Tr\u1ea7n B\u00ecnh Tr\u1ecdng", "transport": "Located about 600 meters from the west end of Dragon Bridge\u2014an 8-minute walk or a 2-minute Grab ride."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "96-98 B\u1ea1ch \u0110\u1eb1ng, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Located right on the Han River waterfront, this nostalgic, military-themed cafe is a classic landmark you cannot miss when visiting Da Nang. The signature \u0027Coconut Coffee\u0027 has a fine, creamy texture; the rich, sweet aroma of the coconut slush merges flawlessly with Vietnam\u0027s bold, dark-roasted coffee, offering a perfectly balanced bittersweet and icy refreshment. The interior is filled with North Vietnamese retro decor and vintage artifacts, while the second-floor porthole windows offer sweeping views of the Han River and Dragon Bridge, making it a favorite among international tourists and local youth.", "name": "C\u1ed9ng C\u00e0 Ph\u00ea - B\u1ea1ch \u0110\u1eb1ng", "transport": "Easily accessible by walking along B\u1ea1ch \u0110\u1eb1ng Street by the river; only about a 2-minute walk from Han Market."}, {"address": "424 \u0110\u01b0\u1eddng 2 Th\u00e1ng 9, H\u00f2a C\u01b0\u1eddng B\u1eafc, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | An iconic specialty coffee roaster in Da Nang, featuring a minimalist industrial architectural style with a large surrounding pool and glasshouse design, making it appear as if floating on water. The cafe focuses on single-origin pour-overs and precise roasting techniques, offering beans from top global origins like Ethiopia and Colombia. Signature pour-overs and cold brews feature distinct flavor profiles with elegant fruity acidity and a long-lasting finish. Paired with exquisite French brunch dishes and croissants, it is a top choice for coffee connoisseurs and photogenic check-ins.", "name": "43 Factory Coffee Roaster", "transport": "About a 5-minute Grab ride from the Dragon Bridge."}, {"address": "96 Tr\u1ea7n Ph\u00fa, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | A minimalist concept cafe combining lifestyle select shop items with sunlit design. A massive translucent skylight floods the interior with soft, bright light. The menu offers a variety of signature specialty coffee drinks and freshly made gourmet brunch items, with the matcha latte and handmade cheesecake standing out for their silky smooth, perfectly balanced sweetness. The high-ceiling layout paired with lush greenery makes it not only a popular spot for photos, but also an ideal place to enjoy a relaxed and leisurely afternoon.", "name": "Wonderlust Danang", "transport": "Located on Tr\u1ea7n Ph\u00fa Street, just about a 3-minute walk from Han Market."}, {"address": "20 L\u00ea H\u1ed3ng Phong, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | A nostalgic, trendy cafe themed around K-drama aesthetics and warm wooden tones, featuring a spacious atmosphere rich with artistic flair. The signature \u0027Salted Cream Coffee\u0027 and \u0027Egg Coffee\u0027 are crowd favorites\u2014the lightly salted cream topping combined with smooth, rich Vietnamese coffee creates a delightful sweet-and-savory profile that keeps you sipping. In addition, the cafe serves generous European-style brunch platters and fresh croissants, attracting many visitors with its aesthetic plating and cozy vibe.", "name": "Reply 1988 Cafe", "transport": "About a 7-minute walk from Da Nang Cathedral; taking a Grab ride is recommended."}, {"address": "77 Tr\u1ea7n Qu\u1ed1c To\u1ea3n, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A popular cafe combining authentic Italian gelato with French-style dessert brunch, featuring an exterior adorned with retro European geometric tiles. The menu centers around dozens of daily fresh-made artisan gelato flavors, featuring dense, smooth textures and refreshingly vibrant fruit flavors. Brunch favorites like French toast and waffles are crispy, soft, and sweet, perfectly paired with a rich iced latte\u2014making it the ultimate retreat to cool down and enjoy sweets on a tropical afternoon.", "name": "Boulevard Gelato \u0026 Coffee", "transport": "Located in the center of H\u1ea3i Ch\u00e2u District, about a 6-minute walk from the western end of the Dragon Bridge."}, {"address": "102 B\u1ea1ch \u0110\u1eb1ng, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | A traditional cafe steeped in vintage Vietnamese nostalgia, nestled along the banks of the Han River. Antique wooden furniture, warm yellow walls, and classic patterned tiles evoke a strong sense of a bygone era. The \u0027Vietnamese Drip Coffee\u0027 here is rich and aromatic, while the \u0027Coconut Smoothie Coffee\u0027 is icy, smooth, and perfectly sweet. Sip your drink on the second-floor balcony while gazing out at the Han River landscape to experience authentic, slow-paced Vietnamese coffee culture.", "name": "\u00dat T\u00edch C\u00e0 Ph\u00ea", "transport": "Located on B\u1ea1ch \u0110\u1eb1ng Street, just a 1-minute walk from Han Market."}, {"address": "233 Nguy\u1ec5n V\u0103n Linh, Nam D\u01b0\u01a1ng, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A premium modern coffee brand highly acclaimed by Da Nang locals, featuring a bright, spacious interior with modern aesthetic design. Beyond serving high-quality traditional Vietnamese and espresso drinks, its brunch platters, sandwiches, and handmade cakes are equally outstanding. The signature \u0027Salt Cream Cold Brew\u0027 comes highly recommended; the savory-sweet cream topping is delicate and perfectly balances the fruity acidity and sweet aftertaste of the cold brew, making it a popular spot for local professionals and tourists alike.", "name": "The Cup Caf\u00e9 - Nguy\u1ec5n V\u0103n Linh", "transport": "Located on Nguy\u1ec5n V\u0103n Linh Boulevard near the main artery to Da Nang International Airport, making it extremely easy to reach by car."}, {"address": "K3/12 Phan Th\u00e0nh T\u00e0i, H\u00f2a Thu\u1eadn \u0110\u00f4ng, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | An eco-garden style cafe hidden in an alleyway in the city center, constructed with abundant natural elements like bamboo, wood, and stone. The cafe boasts a huge koi pond and lush green foliage, filling the air with fresh vibes and a serene atmosphere. A must-order is a rich, aromatic \u0027Vietnamese Iced Milk Coffee\u0027 or a fresh fruit smoothie\u2014smooth and refreshing, making you instantly forget the urban hustle and bustle. Perfect for enjoying a relaxed morning brunch.", "name": "Nia Coffee", "transport": "About a 4-minute Grab ride from the Dragon Bridge to the entrance of the alley."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "04 B\u1ea1ch \u0110\u1eb1ng, Th\u1ea1ch Thang, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | Located along the Han River, Madame L\u00e2n features a rich, yellow French colonial estate style, making it the top choice for sampling Central Vietnamese regional dishes and specialty drinks. The signature \u0027M\u00ec Qu\u1ea3ng\u0027 (Quang Nam noodles) has a rich, savory-sweet broth paired with chewy thick rice noodles, crunchy peanuts, and fresh shrimp, offering rich layers of texture. The \u0027B\u00e1nh X\u00e8o\u0027 (Vietnamese Sizzling Crepe) is fried to golden perfection, packed with fresh shrimp, pork, and bean sprouts, wrapped in fresh lettuce and dipped in a special peanut liver sauce for a delightful mix of crispy and refreshing flavors. At night, lit lanterns create a romantic atmosphere loved by both locals and tourists.", "name": "Madame L\u00e2n Waterfront Restaurant", "transport": "Take a Grab or taxi to B\u1ea1ch \u0110\u1eb1ng Street. Located between the Dragon Bridge and Han River Bridge, it is easily accessible by walking or car."}, {"address": "150-152 B\u1ea1ch \u0110\u1eb1ng, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Situated right on the front line of the Han River, Waterfront features a spacious two-story layout with outdoor view seating, blending Western bistro style with local Vietnamese ingredients. Highly recommended are the \u0027Lemongrass Grilled Pork Skewers\u0027 and the house special \u0027Vietnamese Passionfruit Cocktail\u0027. The grilled meat is mouthwatering, tender, and juicy, pairing perfectly with a sip of a chilled refreshing cocktail. The dishes combine Western fine-dining presentation with traditional Vietnamese spices. At night, guests can directly overlook the brilliant Han River nightscape and the Dragon Bridge fire show, making it a favorite spot for expats and tourists to gather for drinks.", "name": "Waterfront Danang Restaurant \u0026 Bar", "transport": "Located in the heart of B\u1ea1ch \u0110\u1eb1ng Street, just about a 5-minute walk from Han Market."}, {"address": "36 B\u1ea1ch \u0110\u1eb1ng, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | Founded in Da Nang, this Asian award-winning craft brewery taproom sits along the Han River. Its rooftop open-air bar offers unobstructed panoramic views of the Dragon Bridge. The taproom highlights house-brewed craft beers, such as the \u0027Dragon Bridge IPA\u0027 brewed with local Vietnamese spices and tropical fruits, delivering a rich body with a balanced bitter-sweet fruity aroma. Pair it with freshly made \u0027Vietnamese-Style Wood-Fired Pizza\u0027 and \u0027Spicy Fried Chicken Wings\u0027. Sipping local craft beers in the gentle night breeze makes for a unique dining and drinking experience, making this one of the hottest night spots in town.", "name": "7 Bridges Brewing Company Danang Taproom", "transport": "Walkable along B\u1ea1ch \u0110\u1eb1ng Street, located right next to the H\u1ea3i Ch\u00e2u side of the Dragon Bridge."}, {"address": "54 Nguy\u1ec5n Th\u00e1i H\u1ecdc, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 Stars | B\u1ebfp Cu\u1ed1n specializes in traditional Vietnamese spring rolls and wraps (\u0027Cu\u1ed1n\u0027 culture), featuring warm, elegant yellow decor with nostalgic flair. The must-order \u0027Assorted Roll Platter\u0027 includes grilled pork rolls, fresh shrimp spring rolls, and fried spring rolls, served with custom sweet-and-sour fish sauce or rich peanut sauce. Every bite delivers soft yet chewy rice paper, crisp vegetables, and succulent grilled meats\u2014rich in flavor yet light. They also serve signature herbal teas and fruit cocktails, showcasing authentic yet light regional charm, making it very popular among young travelers and families.", "name": "B\u1ebfp Cu\u1ed1n \u0110\u00e0 N\u1eb5ng", "transport": "Located on Nguy\u1ec5n Th\u00e1i H\u1ecdc Street near Han Market (Ch\u1ee3 H\u00e0n), just a 3-minute walk away."}, {"address": "07 B\u1ea1ch \u0110\u1eb1ng, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | This is the only floating landmark bistro on Da Nang\u0027s Han River, designed in an elegant leaf shape with floor-to-ceiling glass windows allowing 360-degree views of the river. The menu features exquisite Central Vietnamese seafood and regional specialties; recommended dishes include \u0027Grilled Lobster with Scallion Oil\u0027 and \u0027Hot \u0026 Sour Seafood Soup\u0027. The lobster meat is firm and snappy, with charcoal aromas blending seamlessly with scallion oil. Finish your meal with a classic \u0027Vietnamese Drip Coffee Cocktail\u0027 for a bittersweet, aromatic experience. Whether taking in the sunny river views by day or the glowing lights by night, it leaves a lasting impression.", "name": "Memory Lounge Danang", "transport": "Floating on the river beside the Han River Bridge, accessible via a dedicated skywalk bridge from B\u1ea1ch \u0110\u1eb1ng Street in H\u1ea3i Ch\u00e2u District."}, {"address": "28 Nguy\u1ec5n Th\u1ecb Minh Khai, Th\u1ea1ch Thang, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | Helmed by a former 5-star hotel executive chef, Luk Lak modernizes traditional dishes from Northern and Central Vietnam. Standout dishes like \u0027Stir-fried Rice Noodle with Duck\u0027 and \u0027Herbal Charcoal-Grilled Goat\u0027 are phenomenal; the goat meat is marinated in various Vietnamese spices and grilled to succulent perfection with zero gamey odor. Pair your meal with their signature \u0027Vietnamese Kumquat Craft Cocktail\u0027 for a refreshing, sweet-and-sour taste. The rustic yet elegant space combined with modern lighting offers diners a high-end Vietnamese culinary feast.", "name": "Luk Lak Vietnam Bistro", "transport": "Located on Nguy\u1ec5n Th\u1ecb Minh Khai Street, about a 5-minute walk from the Da Nang Administrative Center."}, {"address": "143 L\u00ea L\u1ee3i, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Tucked away in the old quarter of H\u1ea3i Ch\u00e2u District, this cellar-style bistro crafted from red brick and wood offers a warm, private atmosphere. Boasting one of Da Nang\u0027s most extensive selections of imported wines and craft beers, its fusion dishes are exceptional\u2014such as the \u0027Pan-Seared Steak with Vietnamese Black Pepper Sauce\u0027 and \u0027Steamed Mussels in Herb Butter\u0027. The mussels are plump and sweet, soaked in rich herbaceous broth. With its elegant ambiance and perfect food-and-wine pairings, it is a top choice for lovers of high-end Western-local fusion cuisine.", "name": "Anchor Winebar \u0026 Restaurant", "transport": "Located on L\u00ea L\u1ee3i Street near the Da Nang Museum; easily accessible by taking a Grab."}, {"address": "K280/23 Ho\u00e0ng Di\u1ec7u, B\u00ecnh Hi\u00ean, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | Hidden deep in an alleyway, this iconic long-standing eatery is packed every day and stands as one of Da Nang\u0027s most representative street food spots. The signature \u0027B\u00e1nh X\u00e8o\u0027 (Vietnamese Sizzling Crepe) is cooked to order, featuring a golden crispy shell stuffed with fresh shrimp, pork, and bean sprouts. It is dipped in a secret hot sauce made from pork liver, peanuts, and glutinous rice, offering a rich, savory flavor that keeps you coming back for more. Pair it with charcoal-grilled pork skewers (\u0027Nem L\u1ee5i\u0027) for a savory, smoky treat. Though simple in decor, its authentic traditional flavor conquers the taste buds of every visitor.", "name": "B\u00e1nh X\u00e8o B\u00e0 D\u01b0\u1ee1ng", "transport": "Located inside Alley 280 on Ho\u00e0ng Di\u1ec7u Street. There is a clear sign at the alley entrance; it is recommended to get dropped off at the entrance and walk about 100 meters inside."}], "name": "Specialty Bistros \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "11 Tr\u1ea7n Qu\u1ed1c To\u1ea3n, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | A classic vegetarian eatery in the heart of H\u1ea3i Ch\u00e2u District, famous for its authentic traditional Vietnamese vegetarian dishes. The signature Vegetarian Qu\u1ea3ng Noodles (M\u00ec Qu\u1ea3ng Chay) features a broth slow-cooked with fresh fruits, vegetables, and shiitake mushrooms, yielding a light, naturally sweet flavor. Paired with chewy rice noodles, crunchy peanuts, and crispy rice crackers, the dish offers rich layers of texture. The serene and peaceful atmosphere attracts countless local residents and food lovers seeking authentic Vietnamese vegetarian flavors.", "name": "Bo De Vegetarian Restaurant (\u83e9\u63d0\u7d20\u98df\u9928)", "transport": "About a 5-minute walk from Dragon Bridge. Take a Grab ride and get off on Tr\u1ea7n Qu\u1ed1c To\u1ea3n Street."}, {"address": "202 Ho\u00e0ng Di\u1ec7u, Nam D\u01b0\u01a1ng, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | A highly budget-friendly restaurant praised by local vegetarians, featuring a diverse vegetarian buffet and made-to-order noodle dishes. Its Vegetarian Ph\u1edf (Ph\u1edf Chay) boasts a clear yet rich broth infused with subtle aromas of star anise and cinnamon. The tender, elastic vegetarian meat slices absorb the flavorful soup, complemented by fresh basil and bean sprouts for a refreshing, non-greasy taste. The bright and clean interior makes it the best spot to experience Da Nang\u0027s everyday vegetarian food culture.", "name": "Ng\u1ecdc Chi Vegetarian Restaurant (\u7389\u829d\u7d20\u98df\u9910\u5ef3)", "transport": "Drive along the main thoroughfare of Ho\u00e0ng Di\u1ec7u, near Da Nang Cathedral (Pink Church). Takes about 3 minutes by Grab taxi."}, {"address": "122 Ho\u00e0ng Di\u1ec7u, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A cozy, homey vegetarian eatery beloved for its traditional Vietnamese vegetarian spring rolls and crispy pancakes (B\u00e1nh X\u00e8o Chay). The vegetarian pancakes are fried to a golden crunch, crackling with every bite, and stuffed with generous amounts of bean sprouts, mushrooms, and tofu. Served with a special sweet-and-sour vegetarian dipping sauce, every bite is filled with fresh vegetable sweetness and crispness. Many foreign tourists rave about its non-greasy vegan pancakes.", "name": "Qu\u00e1n Chay Th\u00fay (\u7fe0\u7d20\u98df\u5c0f\u5403)", "transport": "Located on Ho\u00e0ng Di\u1ec7u Street, about a 4-minute drive from Han Market. Getting there via Grab or scooter is recommended."}, {"address": "15 L\u00ea H\u1ed3ng Phong, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | An elegant, Zen-inspired plant-based restaurant that perfectly fuses traditional Vietnamese ingredients with modern culinary art. Recommended must-try dishes include the \u0027Lotus Flower \u0026 Bamboo Shoot Soup\u0027 and \u0027Herb-Roasted Tofu\u0027\u2014the tofu is crispy on the outside, tender on the inside, absorbing the essence of herbs and special sauce, melting in your mouth with a rich soy flavor. The interior features bamboo and wooden elements, creating a super comfortable and relaxing dining atmosphere, especially favored by travelers who value quality food and dining aesthetics.", "name": "Sangha Vegetarian Restaurant (Sangha \u79aa\u610f\u7d20\u98df\u9910\u5ef3)", "transport": "About an 8-minute walk from the Museum of Da Nang. Take a Grab to the intersection of L\u00ea H\u1ed3ng Phong and Nguy\u1ec5n Ch\u00ed Thanh Streets."}, {"address": "18 Nguy\u1ec5n Th\u1ecb Minh Khai, Th\u1ea1ch Thang, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | A long-established local vegetarian joint specializing in a variety of traditional Vietnamese rice dishes and noodle soups. The Vegetarian Hu\u1ebf Beef Noodle Soup (B\u00fan B\u00f2 Hu\u1ebf Chay) is highly recommended, featuring a broth laced with subtle lemongrass aroma and chili spice, served with thick, smooth rice noodles, savory vegetarian ham, and tofu skin\u2014hearty, warming, and flavorful. With very affordable prices, it is a go-to daily plant-based choice for office workers and locals in H\u1ea3i Ch\u00e2u District.", "name": "Qu\u00e1n Chay An L\u1ea1c (\u5b89\u6a02\u7d20\u98df\u9928)", "transport": "Not far from the Da Nang Administrative Center. Easily accessible by taking a Grab to Nguy\u1ec5n Th\u1ecb Minh Khai Street."}, {"address": "38 Nguy\u1ec5n Ch\u00ed Thanh, Th\u1ea1ch Thang, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | A refined restaurant blending modern hipster vibes with a healthy plant-based philosophy. Its signature Coconut Mushroom Risotto slow-simmers rich coconut milk and sweet mushrooms; the rice absorbs the liquid to deliver a velvety, creamy texture paired with a captivating aroma. Additionally, the fresh vegetable summer rolls feature translucent, chewy wrappers filled with colorful bell peppers, mint leaves, and vegetarian meat, dipped in a rich peanut sauce\u2014refreshing, guilt-free, and perfect for health-conscious diners.", "name": "Khu\u00ea Vegetarian Restaurant (\u594e\u7d20\u98df\u9910\u5ef3)", "transport": "Located on Nguy\u1ec5n Ch\u00ed Thanh Street in the city center, near Han River Bridge. Convenient by Grab or public bus."}, {"address": "179 L\u00fd T\u1ef1 Tr\u1ecdng, Thanh B\u00ecnh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | A warm and simple little eatery focused on authentic Vietnamese vegetarian fast meals and specialty snacks. The popular \u0027Braised Vegetarian Rice\u0027 comes drenched in a rich vegetable and wild mushroom gravy over distinct rice grains, paired with a golden, crispy vegetarian mushroom patty that is crunchy outside, juicy inside, and addictively delicious. The friendly service and generous portions make every visitor feel a homey warmth.", "name": "Qu\u00e1n Chay T\u00e2m Nguy\u1ec7n (\u5fc3\u9858\u7d20\u98df\u9928)", "transport": "Located on L\u00fd T\u1ef1 Tr\u1ecdng Street, about a 10-minute walk from the Da Nang Bay coastline. Taking a Grab is recommended."}, {"address": "113/14 Nguy\u1ec5n Ch\u00ed Thanh, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Tucked away in an alleyway in the city center, this authentic vegetarian spot offers dozens of exquisite Vietnamese vegetarian dishes. Its \u0027Crispy Vegetarian Spring Rolls\u0027 are strongly recommended\u2014deep-fried to a crackling golden crisp, stuffed with taro, wood ear mushrooms, and shredded carrots for a dense, satisfying texture. Wrapped in fresh lettuce leaves before eating, they are refreshing and appetizing. It is also a secret spot for tourists looking to explore hidden local vegetarian bites.", "name": "Qu\u00e1n Chay \u00c2u L\u1ea1c (\u6b50\u6a02\u7d20\u98df\u9928)", "transport": "Located in an alley off Nguy\u1ec5n Ch\u00 et balance, paired with a special beef jerky dipping sauce that makes it irresistible. It\u0027s a favorite afternoon snack among local youth.", "name": "Aunt Hoa Grilled Rice Paper (B\u00e1nh K\u1eb9p D\u00ec Hoa)", "transport": "Take a Grab bike or car to Alley 62A on N\u00fai Th\u00e0nh Road, enter the alley to see the sign."}, {"address": "K280/23 Ho\u00e0ng Di\u1ec7u, B\u00ecnh Hi\u00ean, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.3 Stars | A legendary street food eatery known to everyone in Da Nang! Tucked deep in an alley yet always packed. The signature \u0027Vietnamese Crepe (B\u00e1nh X\u00e8o)\u0027 features a golden, ultra-crispy skin stuffed with fresh shrimp, pork, and bean sprouts. Wrap it with rice paper, fresh lettuce, and herbs, then dip into their signature secret peanut pork liver sauce. Crispy, tender, insanely fragrant, and incredibly satisfying!", "name": "B\u00e0 D\u01b0\u1ee1ng Sizzling Pancake \u0026 Grilled Pork Skewers (B\u00e1nh X\u00e8o B\u00e0 D\u01b0\u1ee1ng)", "transport": "Walk into Alley 280 along Ho\u00e0ng Di\u1ec7u Road for about 50 meters to arrive."}, {"address": "15C H\u1ea3i Ph\u00f2ng, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.2 Stars | A uniquely charming local street dessert stall in Hai Chau District! The tofu pudding is incredibly silky and smooth, melting in your mouth with a rich natural soybean aroma. Served with warm, thick ginger brown sugar syrup, chewy boba pearls, and fresh shredded coconut, it\u0027s comforting and pleasantly sweet. Enjoying a bowl while sitting on a low plastic stool offers an authentic slice of Vietnamese street life.", "name": "H\u1ea3i Ph\u00f2ng Road Traditional Tofu Pudding (T\u00e0u H\u1ee7 H\u1ea3i Ph\u00f2ng)", "transport": "Located on H\u1ea3i Ph\u00f2ng Road near the city center; easily accessible by Grab car or bike."}, {"address": "100 Ho\u00e0ng V\u0103n Th\u1ee5, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.1 Stars | A time-honored stall specializing in traditional Central Vietnamese steamed rice cakes! The signature \u0027B\u00e1nh B\u00e8o\u0027 is steamed in tiny ceramic saucers, topped with saut\u00e9ed dried shrimp bits, crispy pork cracklings, and scallion oil. Spoon it up with a wooden scoop after drizzling with sweet fish sauce\u2014the smooth cake blends seamlessly with the savory shrimp. Their chewy \u0027Tapioca Dumplings (B\u00e1nh B\u1ed9t L\u1ecdc)\u0027 are also a favorite among local foodies.", "name": "B\u00e0 B\u00e9 Rice Cakes \u0026 Traditional Pastries (B\u00e1nh B\u00e8o B\u00e0 B\u00e9)", "transport": "Located on Ho\u00e0ng V\u0103n Th\u1ee5 Road, about an 8-minute walk from the western end of the Dragon Bridge."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Downtown and Han Riverfront (Haizhou District)"}, "marble_mountains": {"categories": {"cat_1": {"items": [{"address": "06 Nguy\u1ec5n Duy Trinh, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Located at the foot of Marble Mountain, this iconic M\u00ec Qu\u1ea3ng shop is a top choice for locals and savvy foodies. The signature pork and shrimp M\u00ec Qu\u1ea3ng features a rich, savory broth slow-simmered with pork bones and turmeric, paired with chewy handmade wide noodles, crispy roasted peanuts, and rice crackers for incredible texture. Adding a dash of fresh lime juice and house chili sauce creates a zesty, mildly spicy flavor that perfectly highlights the charm of traditional Central Vietnamese cuisine.", "name": "M\u00ec Qu\u1ea3ng Ph\u01b0\u01a1ng", "transport": "About a 5-minute walk from the entrance of the Marble Mountains."}, {"address": "43 Ph\u1ea1m Hu\u1ef3nh T\u1ed1, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Hidden in the alleys of the Non Nuoc area, this iconic local spot serves home-style recipes passed down for decades. The shop insists on making turmeric noodles fresh daily, paired with tender stewed free-range chicken and flavorful quail eggs\u2014all locked in a concentrated, rich sauce. Eaten together with cilantro and shredded banana blossom, each bite is refreshing, non-greasy, and infused with rustic herbal aromas, making it a beloved favorite among local families and culinary travelers.", "name": "M\u00ec Qu\u1ea3ng Dung", "transport": "Take a Grab or taxi to Ph\u1ea1m Hu\u1ef3nh T\u1ed1 Street; located near Non Nuoc Stone Carving Village."}, {"address": "49 L\u00ea V\u0103n Hi\u1ebfn, Khu\u00ea M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Situated on a main road in the Marble Mountains area, this classic fish cake noodle shop specializes in daily handmade fish cakes and sailfish chunks using fresh sea fish. The broth is simmered with pumpkin, cabbage, pineapple, and bamboo shoots, creating a warm, naturally sweet, and tangy flavor. The springy fish cakes absorb the delicious broth and are served alongside delicate rice vermicelli and a large plate of fresh greens\u2014an unforgettable stop for an authentic Central Vietnamese breakfast.", "name": "B\u00fan Ch\u1ea3 C\u00e1 \u00dat", "transport": "Take Bus No. 01 to the L\u00ea V\u0103n Hi\u1ebfn stop, then walk for about 2 minutes."}, {"address": "248 L\u00ea V\u0103n Hi\u1ebfn, Khu\u00ea M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | This famous Vietnamese crispy pancake joint is renowned for its ultra-crispy crust. The golden rice flour crepe is stuffed with fresh white shrimp, pork slices, Enoki mushrooms, and bean sprouts, pan-fried to fragrant perfection. Diners wrap pieces of pancake along with fresh lettuce and herbs into paper-thin rice paper, dipped in a rich house-special peanut sauce (N\u01b0\u1edbc L\u00e8o). The combination of crispy, tender, savory, and sweet textures is addictively delicious.", "name": "B\u00e1nh X\u00e8o C\u00f4 Ba", "transport": "Take a taxi along L\u00ea V\u0103n Hi\u1ebfn Boulevard; located in the main commercial hub of the Marble Mountains district."}, {"address": "105 L\u00ea V\u0103n Hi\u1ebfn, Khu\u00ea M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Highly recommended by locals, this specialty eatery serves one of Central Vietnam\u0027s most iconic dishes: dry rice vermicelli with fermented anchovy sauce (B\u00fan M\u1eafm N\u00eam). Chewy rice noodles are topped with sliced grilled pork belly, crispy pork crackling, and peanuts, finished with a ladle of signature savory-pungent fermented sauce. Once tossed together, the bold savory-spicy flavors pair exquisitely with the sweet meats, delivering a truly authentic local taste.", "name": "B\u00fan M\u1eafm N\u00eam B\u00e0 Th\u1ea3o", "transport": "About a 7-minute drive from Non Nuoc Beach."}, {"address": "26 L\u00ea V\u0103n Hi\u1ebfn, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | A long-established restaurant specializing in traditional Central Vietnamese claypot rice, popular with both locals and tourists. White rice is slow-cooked in traditional clay pots to produce a golden, supremely crispy crust at the bottom, which tastes divine drizzled with braised pork or fish sauce. Paired with rich braised king mackerel, stir-fried morning glory, and sour \u0026 spicy seafood soup, it offers a hearty, comforting Vietnamese family dining experience.", "name": "C\u01a1m Ni\u00eau M\u1ed9c", "transport": "Take a Grab ride to the L\u00ea V\u0103n Hi\u1ebfn section, near the entrance to the Marble Mountains scenic area."}, {"address": "80 Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A beloved seafood restaurant close to Non Nuoc Stone Carving Village and the beach, famous for aff
