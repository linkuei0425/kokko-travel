ain Nguy\u1ec5n V\u0103n Linh thoroughfare."}, {"address": "218 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, Th\u1ea1c Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | A Japanese-style wooden garden cafe tucked away in Thanh Kh\u00ea District, surrounded by lush greenery that creates a serene and tranquil vibe. Highly recommended are their single-origin Japanese pour-over coffee and brunch platters. The coffee boasts clean, vibrant fruity notes, perfectly paired with freshly toasted butter toast and a crisp salad for a comforting treat.", "name": "IKIGAI Garden Coffee - Nguy\u1ec5n Tri Ph\u01b0\u01a1ng", "transport": "About a 3-minute drive north along Nguy\u1ec5n Tri Ph\u01b0\u01a1ng Street from Da Nang International Airport."}, {"address": "102 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | A cozy cafe blending hipster art with lush green plants, radiating a charming handcrafted vibe. The must-try here is the authentic Vietnamese Egg Coffee\u2014fresh egg yolks whipped into a luscious, mousse-like froth resting atop hot espresso. Sweet, rich, and remarkably free of any fishy odor, it tastes like a luxurious dessert in a cup.", "name": "T\u1ed5 C\u00e0 Ph\u00ea - \u0110i\u1ec7n Bi\u00ean Ph\u1ee7", "transport": "About 7 minutes by taxi from Da Nang International Airport."}, {"address": "233 Nguy\u1ec5n V\u0103n Linh, Th\u1ea1c Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | A well-known local high-end coffee chain in Da Nang featuring a bright, modern industrial design with spacious seating and abundant natural light. Popular brunch offerings include freshly made cheese paninis and avocado toast, paired with an aromatic Cold Brew that finishes with a crisp, refreshing sweetness\u2014an ideal spot for a relaxing meal before or after a flight.", "name": "The Cup Coffee - Nguy\u1ec5n V\u0103n Linh", "transport": "Located near the main Nguy\u1ec5n V\u0103n Linh thoroughfare, about a 4-minute drive from Da Nang International Airport."}, {"address": "K2/12 H\u00e0 Huy T\u1eadp, Xu\u00e2n H\u00e0, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 Stars | Hidden deep in an alley in Thanh Kh\u00ea District, this vintage cafe set in an old house preserves yellow walls, red tiles, and a nostalgic vibe of old Vietnam. Their signature Salt Coffee is exceptional\u2014a light, salty, velvety foam perfectly balances the bold bitterness of Vietnamese Robusta beans, yielding a silky sweet toffee-like flavor highly recommended by locals.", "name": "C\u00e0 Ph\u00ea Tr\u00fa - H\u00e0 Huy T\u1eadp", "transport": "About an 8-minute Grab ride from Da Nang Railway Station or Airport to the alley entrance."}, {"address": "27 \u0110\u00e0o Duy Anh, Th\u1ea1c Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 Stars | A charming cafe offering a spacious outdoor garden setting and a varied brunch menu in a lively, relaxed atmosphere. The signature hearty American Breakfast and omelet platters are generous, featuring soft, aromatic eggs served with fresh fries and German sausages. Paired with a traditional Vietnamese iced milk coffee (C\u00e0 ph\u00ea s\u1eefa \u0111\u00e1), it makes for an incredibly satisfying meal.", "name": "Zone 7 Coffee \u0026 Restaurant", "transport": "Located on \u0110\u00e0o Duy Anh Street in Thanh Kh\u00ea District, about a 5-minute drive from Da Nang Airport."}, {"address": "242 Nguy\u1ec5n V\u0103n Linh, Th\u1ea1c Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | A legendary Vietnamese tea and coffee chain renowned for its intensely aromatic teas. Beyond their classic Peach Black Tea, their traditionally roasted Vietnamese condensed milk coffee is remarkably rich, featuring a bittersweet finish. Paired with a crispy B\u00e1nh M\u00ec, it is perfect for a quick yet authentic local breakfast.", "name": "Ph\u00fac Long Coffee \u0026 Tea - Nguy\u1ec5n V\u0103n Linh", "transport": "Located on Nguy\u1ec5n V\u0103n Linh Boulevard, just about a 4-minute drive from Da Nang International Airport."}, {"address": "206 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | A tranquil music- and vinyl-themed cafe adorned with vintage audio equipment and tasteful wooden furniture. Their specialty oat milk latte paired with handmade cheesecake is a match made in heaven\u2014the latte features a subtle sweetness with silky foam, while the cheesecake melts in your mouth with rich yet non-cloying flavor. It\u0027s the perfect spot in Thanh Kh\u00ea District to escape the heat and enjoy a relaxed morning.", "name": "Sound Cafe - \u0110i\u1ec7n Bi\u00ean Ph\u1ee7", "transport": "Located along \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Street, about a 3-minute drive from the Thanh Kh\u00ea Administrative Center."}], "name": "Popular Cafes \u0026 Brunch Places"}, "cat_3": {"items": [{"address": "195 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, Th\u1ea1c Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Located in the heart of Thanh Kh\u00ea District near the airport, this is the top choice for experiencing Central Vietnam\u0027s iconic staple, M\u1ef3 Qu\u1ea3ng. The restaurant insists on using freshly ground rice batter daily to craft thick, chewy yellow and white noodles, served with a rich, shallow broth simmered from pork bones, shrimp, and turmeric. The signature special M\u1ef3 Qu\u1ea3ng is highly recommended, packed with fresh shrimp, boiled egg, tender pork, and chicken, topped with crunchy crushed peanuts and cilantro, and served with a distinctive large roasted rice cracker (B\u00e1nh Tr\u00e1ng). The authentic way to eat it is to crumble the rice cracker into the noodles, mixing it with the slightly thick broth and crunchy peanuts for a rich interplay of chewy, crispy, and sweet flavors\u2014a favorite among locals and newly arrived tourists alike.", "name": "M\u1ef3 Qu\u1ea3ng B\u00e0 Mua - Nguy\u1ec5n Tri Ph\u01b0\u01a1ng", "transport": "About a 5-minute taxi ride from Da Nang International Airport"}, {"address": "248 H\u00e0 Huy T\u1eadp, H\u00f2a Kh\u00ea, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Located on the bustling H\u00e0 Huy T\u1eadp main street in Thanh Kh\u00ea District, this eatery is famous for its authentic B\u00ecnh \u0110\u1ecbnh specialty, \u0027Jumping Shrimp Pancakes\u0027 (B\u00e1nh X\u00e8o T\u00f4m Nh\u1ea3y). Unlike typical Vietnamese pancakes, this place sizzles fresh, lively white shrimp directly in small iron skillets. The crust edges are fried to an ultra-golden crisp, while the filling retains the crispness of bean sprouts and the sweet freshness of the shrimp. A bite yields a satisfying crunch, revealing a crispy exterior and a juicy, tender interior. The insider\u0027s way to enjoy it is wrapping the pancake, lettuce, green banana slices, and pickled cucumber in paper-thin moist rice paper, then dipping it into a signature fermented bean sauce. Rich in flavor yet non-greasy, it is a hot spot for local foodies\u0027 evening gatherings.", "name": "B\u00e1nh X\u00e8o T\u00f4m Nh\u1ea3y C\u00f4 Ba - H\u00e0 Huy T\u1eadp", "transport": "About an 8-minute walk from Thanh Kh\u00ea Lake Park or accessible via Grab taxi"}, {"address": "145 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Located in a lively commercial district near the airport, this specialty restaurant is an epicenter for experiencing Vietnam\u0027s local goat meat bistro culture. The restaurant selects high-quality mountain goat meat from the Vietnamese highlands, neutralized of gamy flavors with unique herbal spices, to create dishes that captivate food lovers. The popular \u0027Lime-Tossed Goat Salad\u0027 is refreshing and appetizing with tender yet chewy meat, while the \u0027Goat Hotpot\u0027 features a rich broth simmered with herbal medicine and mushrooms. The boiling soup is sweet and nourishing, while sliced goat meat cooks quickly to melt-in-your-mouth tenderness. Paired with chilled Vietnamese beer and a lively, fun atmosphere, it is a fantastic place to dive into local late-night dining and beer-snack culture.", "name": "D\u00ea Ngh\u0129a 2 Goat Restaurant - Nguy\u1ec5n Tri Ph\u01b0\u01a1ng", "transport": "About a 4-minute drive from Da Nang International Airport"}, {"address": "300 L\u00ea Du\u1ea9n, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.1 stars | Situated on the bustling L\u00ea Du\u1ea9n shopping street in Thanh Kh\u00ea District, this well-known long-standing local restaurant chain offers a spacious, comfortable, and traditional ambiance. The must-order signature dish is the Pork Rice Paper Rolls (B\u00e1nh Tr\u00e1ng Th\u1ecbt Heo), featuring premium pork belly specifically boiled and thin-sliced retaining skin on both ends, served alongside an exceptionally rich fresh herb platter (including cucumber, mint, cilantro, perilla, and over a dozen other greens). Roll the pork and fresh herbs inside rice paper, dip into the soulful fermented fish sauce (M\u1eafm N\u00eam), and savor a savory, spicy, aromatic burst complemented by crunchy vegetables and sweet, succulent pork\u2014an unforgettable delicacy.", "name": "\u0110\u1eb7c S\u1ea3n Tr\u1ea7n Restaurant - L\u00ea Du\u1ea9n", "transport": "About a 3-minute Grab taxi ride from Da Nang Railway Station"}, {"address": "75 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A popular local restaurant on Nguy\u1ec5n Tri Ph\u01b0\u01a1ng street specializing in traditional Vietnamese Claypot Rice (C\u01a1m Ni\u00eau). The highlight of the meal is rice baked over charcoal in small custom clay pots; when served, staff perform a pot-breaking show on site, revealing a golden, crispy crust around the rice. The burnt rice crust is delightfully crunchy with a rich aroma, while the inner rice remains tender. Pair it with braised fish in a claypot (C\u00e1 Kho T\u1ed9) bathed in savory-sweet sauce, stir-fried morning glory, and caramelized pork belly. The sauce seeps into the crispy rice crust for a gratifying bite, bursting with nostalgic Vietnamese homestyle flavors\u2014a huge hit with international tourists and families traveling with elders.", "name": "C\u01a1m Ni\u00eau Nh\u00e0 \u0110\u1ecf 2 - Nguy\u1ec5n Tri Ph\u01b0\u01a1ng", "transport": "Just a 3-minute drive from Da Nang International Airport"}, {"address": "K424/09 L\u00ea Du\u1ea9n, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Tucked away in an alley off L\u00ea Du\u1ea9n in Thanh Kh\u00ea District, this decades-old eatery is the ultimate haven for experiencing Central Vietnam\u0027s legendary dish: dry rice noodles with fermented anchovy sauce (B\u00fan M\u1eafm N\u00eam). A generous bowl of thin rice vermicelli is topped with grilled pork belly, sausages, crispy pork crackling, and crushed peanuts. The soul lies in their secret recipe fermented fish/shrimp sauce (M\u1eafm N\u00eam). Drizzle the sauce and mix well to coat every strand of rice noodle in a slightly spicy, savory, and sweet balance. The aroma of grilled pork and the crunch of pork skin create vibrant layers of texture. Though bold and pungent, this legendary local flavor has fed locals since childhood and draws adventurous travelers from afar.", "name": "B\u00fan M\u1eafm N\u00eam B\u00e0 Thuy\u00ean", "transport": "Take a Grab to the entrance of Alley 424 L\u00ea Du\u1ea9n, then walk about 1 minute"}, {"address": "209-211 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, V\u0129nh Trung, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Located near the Thanh Kh\u00ea commercial district and airport, this local seafood restaurant is known for fresh, reasonably priced, and authentically prepared seafood. Tanks filled with live seafood line the restaurant for catch-to-order dining. Recommended dishes include \u0027Grilled Sweet Snails with Scallion Oil\u0027 and \u0027Lemongrass Steamed Clams\u0027\u2014the snail meat is delightfully chewy and infused with scallion aroma, making it irresistible, while the \u0027Salt and Pepper Soft-Shell Crab\u0027 is golden, crispy, and bursts with sweet crab juice in every bite. Paired with local herb dipping sauces and lime pepper salt, the flavor layers are rich. The vibrant atmosphere makes it an excellent choice for experiencing Da Nang locals\u0027 after-work gatherings over seafood and cold local beer.", "name": "H\u1ea3i S\u1ea3n K\u1ef3 H\u00e0 Seafood Restaurant - Nguy\u1ec5n Tri Ph\u01b0\u01a1ng", "transport": "About a 5-minute drive from Da Nang International Airport"}, {"address": "17 Tr\u1ea7n T\u1ed1ng, Th\u1ea1c Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Hidden on Tr\u1ea7n T\u1ed1ng Street in Thanh Kh\u00ea District, this renowned gem serves authentic Hue-style beef noodle soup (B\u00fan B\u00f2 Hu\u1ebf) originating from the ancient capital. The broth is slow-cooked for hours with beef bones, abundant lemongrass, special shrimp paste, and chili oil, giving it an appetizing bright red hue. Thick round rice noodles provide a springy texture, accompanied by generous toppings: tender braised beef shank, gelatinous pork trotters, hearty beef balls, and silky pig blood curd. The broth delivers an initial burst of rich lemongrass and beef aroma followed by a mildly spicy, savory kick. Served with a heap of fresh basil and bean sprouts, every sip of soup and bite of noodle offers a layered taste of authentic Central Vietnamese cuisine.", "name": "B\u00fan B\u00f2 Hu\u1ebf B\u00e0 Di\u1ec7u", "transport": "About a 6-minute walk from Thanh Kh\u00ea Lake Park"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "267 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, H\u00f2a Kh\u00ea, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Huong Khach Vegetarian Restaurant is a relatively large vegan restaurant with a delightful environment in Thanh Kh\u00ea District, located just about a 5-minute drive from the airport. The specialty here is vegetarian adaptations of traditional Central Vietnamese snacks. The top recommendation is the Vegetarian Mi Quang (M\u00ec Qu\u1ea3ng Chay). Its broth is simmered with plenty of radishes, mushrooms, and corn, creating a sweet and rich carrot aroma. The rice noodles are chewy and absorb the flavorful broth, served with crispy rice crackers and fragrant roasted peanuts for rich textures. Tourists love the spacious, clean, and air-conditioned setting, while locals adore the diverse vegetarian buffet and set meal combinations. It\u0027s a cozy restaurant combining quality and traditional flavors.", "name": "Huong Khach Vegetarian Restaurant (Qu\u00e1n Chay H\u01b0\u01a1ng Kh\u00e1ch)", "transport": "About a 5-minute drive from Da Nang International Airport, located on the main \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 road."}, {"address": "60 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Located near the north exit of Da Nang Airport, Thuy Vegetarian Eatery is a top choice for newly arrived vegetarian travelers and nearby residents. The signature Vegetarian Crispy Pancake (B\u00e1nh X\u00e8o Chay) is made fresh to order. Its golden-brown outer shell is delightfully crunchy, stuffed with abundant mung bean sprouts, wild mushrooms, and dried tofu. Dipped in the special rich peanut bean sauce, each bite is crispy on the outside, tender inside, perfectly balancing savory and sweet without being oily. Prices are very affordable, and the warm, smiling hostesses give diners an authentic taste of local Vietnamese vegetarian hospitality.", "name": "Thuy Vegetarian Eatery (Qu\u00e1n Chay Th\u00fay)", "transport": "About a 3-minute taxi ride from Da Nang Airport."}, {"address": "202 H\u00e0 Huy T\u1eadp, H\u00f2a Kh\u00ea, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Located on lively H\u00e0 Huy T\u1eadp Road, Ngoc Chi Vegan Restaurant is famous for its meticulously prepared and delicious traditional vegetarian noodles. Highly recommended is the Vegetarian Cao Lau (Cao L\u1ea7u Chay), featuring thick, chewy custom brown noodles topped with crispy vegetarian roasted pork, fried dough crackers, and fresh herbs. Drizzled with a rich, savory-sweet special sauce, every mixed bite is packed with aroma and delightful springiness. Generous with ingredients and portions, this restaurant is warmly praised by Thanh Kh\u00ea locals and is a fantastic spot to experience a pure vegan take on traditional Hoi An dishes.", "name": "Ngoc Chi Vegan Restaurant (Qu\u00e1n Chay Ng\u1ecdc Chi)", "transport": "Take Grab or a ride-hailing taxi to H\u00e0 Huy T\u1eadp Road."}, {"address": "491 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Thanh Kh\u00ea \u0110\u00f4ng, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Situated on the main thoroughfare of \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Road in Thanh Kh\u00ea District, Bo De Vegetarian Restaurant is a long-standing traditional eatery. The popular Vegetarian Hue Beef Noodle Soup (B\u00fan B\u00f2 Hu\u1ebf Chay) is amazing, featuring a rich broth infused with enticing aromas of lemongrass, kaffir lime leaves, and a hint of chili oil. Served with springy thick rice noodles, vegetarian ham, and soup-soaked tofu skin, a sip of hot broth warms you up completely. The kitchen carefully selects natural fruits and vegetables for the broth, avoiding excessive artificial seasonings, making its sweet and pure taste beloved by health-conscious diners and religious vegetarians alike.", "name": "Bo De Vegetarian Restaurant (Qu\u00e1n Chay B\u1ed3 \u0110\u1ec1)", "transport": "Drive west along the main \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 thoroughfare; convenient by bus or taxi."}, {"address": "87/04 Tr\u1ea7n Cao V\u00e2n, Tam Thu\u1eadn, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Tucked away in an alley off Tr\u1ea7n Cao V\u00e2n Road, Dieu Hoa Vegetarian is a quintessential Da Nang hidden gem. Its specialty is the Vegetarian Steamed Rice Rolls (B\u00e1nh Cu\u1ed1n Chay). The warm, translucent outer layer is freshly steamed from rice batter, so delicate and paper-thin that it melts in your mouth. Stuffed with wood ear mushrooms, minced shiitake, and diced dried tofu, sprinkled with crispy fried shallots, and drizzled with a mild savory-sweet sauce, its silky texture makes it addictive. Extremely affordable and flavorful, it draws crowds of local office workers and foodies during meal times for takeout.", "name": "Dieu Hoa Alley Vegetarian Eatery (Qu\u00e1n Chay Di\u1ec7u Hoa)", "transport": "Take a ride to Tr\u1ea7n Cao V\u00e2n Road, then walk into Alley 87 for about 30 meters."}, {"address": "418 Tr\u1ea7n Cao V\u00e2n, Xu\u00e2n H\u00e0, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | An Lac Vegan Restaurant is a highly popular budget-friendly vegetarian diner in Thanh Kh\u00ea\u0027s coastal neighborhood. The most acclaimed offering here is the Vegetarian Buffet (C\u01a1m Chay T\u1ef1 Ch\u1ecdn), serving over twenty freshly cooked plant-based dishes daily, including sweet and sour veggie ribs, pan-fried stuffed tofu, and stir-fried seasonal vegetables with enoki mushrooms. Paired with sweet, fluffy white rice and home-cooked warmth in every seasoned dish, a bowl of hot delicious soup is also included. Many travelers love coming here to experience daily local life and enjoy a rich, nutritious, and satisfying plant-based meal at very friendly prices.", "name": "An Lac Vegan Restaurant (Qu\u00e1n Chay An L\u1ea1c)", "transport": "Take city bus No. 02 and get off at Tr\u1ea7n Cao V\u00e2n Road, then walk to the restaurant."}, {"address": "79 Phan Thanh, Th\u1ea1c Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Located near Duy T\u00e2n University, Quang Nam Vegetarian Eatery is a favorite among students and young white-collar workers in the Thanh Kh\u00ea commercial area. The signature Vegetarian Banh Mi (B\u00e1nh M\u00ec Chay) features a crust baked to light, airy, crispy perfection. It is packed with homemade vegetarian pate, veggie ham, pickled radish shreds, and fresh cilantro, dressed with a rich plant-based sauce. Crunchy, sweet, tangy, and non-greasy, its quick convenience and delicious flavor make it a top grab-and-go option before heading to the airport.", "name": "Quang Nam Vegetarian Eatery (Qu\u00e1n Chay Qu\u1ea3ng Nam - Phan Thanh)", "transport": "Only about 1.5 km from Da Nang Airport, roughly a 4-minute ride."}, {"address": "112 D\u0169ng S\u0129 Thanh Kh\u00ea, Thanh Kh\u00ea T\u00e2y, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Located on D\u0169ng S\u0129 Thanh Kh\u00ea Road, Tam An Vegetarian Restaurant is known for its warm, comfortable dining atmosphere and exquisite vegetarian noodle soups. A must-try is the Vegetarian Wonton Noodle Soup (M\u00ec Ho\u00e0nh Th\u00e1nh Chay), featuring fresh daily handmade dumplings with thin, smooth wrappers packed with shiitake mushrooms, bamboo shoots, and plant-based meat. Served in a clear, sweet vegetable broth with springy egg-style vegetarian noodles, it offers a refreshing yet deeply savory taste. The staff\u0027s friendly service and strict quality control have earned it high customer return rates and top online ratings.", "name": "Tam An Vegetarian Restaurant (Qu\u00e1n Chay T\u00e2m An)", "transport": "Recommended to ride a scooter or take a Grab taxi to D\u0169ng S\u0129 Thanh Kh\u00ea Road."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "K424/09 L\u00ea Du\u1ea9n, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | Tucked away in an alley in Thanh Kh\u00ea District, this decades-old establishment is a legendary spot for authentic Da Nang fermented fish sauce noodles (B\u00fan M\u1eafm N\u00eam). The signature dry rice vermicelli is drizzled with the house\u0027s special rich fermented fish sauce, paired with crispy yet tender roasted pork belly, sausages, and fresh herbs. Each bite delivers a multi-layered harmony of salty, savory, spicy, and sour flavors that is incredibly appetizing. It\u0027s the top choice for travelers looking to experience bold Central Vietnamese cuisine, as well as a timeless favorite among locals.", "name": "B\u00fan M\u1eafm N\u00eam B\u00e0 Thuy\u00ean (B\u00e0 Thuy\u00ean Fermented Fish Sauce Noodle)", "transport": "About a 7-minute drive from Da Nang International Airport, located in an alley off L\u00ea Du\u1ea9n Street."}, {"address": "175 H\u1ea3i Ph\u00f2ng, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | Da Nang\u0027s most famous dessert shop, its H\u1ea3i Ph\u00f2ng Road branch in Thanh Kh\u00ea District is always packed with eager foodies. The signature Durian Ch\u00e8 Th\u00e1i features premium durian flesh combined with creamy coconut milk, shredded jackfruit, sago pearls, and tender jelly. Rich yet delightfully sweet without being cloying, its smooth, melt-in-your-mouth texture bursting with tropical fruit aroma makes it an unmissable refreshing treat on a hot summer day.", "name": "Ch\u00e8 Th\u00e1i Li\u00ean - H\u1ea3i Ph\u00f2ng (Che Thai Lien Durian Coconut Dessert)", "transport": "About an 8-minute walk from Da Nang Railway Station, or a 3-minute Grab taxi ride."}, {"address": "K142/46 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Hidden in an alleyway in Thanh Kh\u00ea, this hugely popular street food stall specializes in signature Vietnamese grilled rice papers (B\u00e1nh K\u1eb9p). Crispy rice paper is topped with quail eggs, scallions, beef jerky, and savory sauces, then charcoal-grilled to aromatic perfection. Delicately crunchy on the outside with a moist, flavorful topping, it pairs wonderfully with their signature sweet and spicy dipping sauce. Affordable prices and authentic, fresh-off-the-grill taste make it a beloved afternoon snack spot for students and tourists alike.", "name": "B\u00e1nh K\u1eb9p D\u00ec Ho\u00e0ng (Aunt Ho\u00e0ng\u0027s Grilled Rice Papers)", "transport": "About a 6-minute drive from Da Nang Airport along \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Road, then turn into Alley 142."}, {"address": "302 H\u1ea3i Ph\u00f2ng, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 Stars | Located on a bustling street in Thanh Kh\u00ea, this local eatery is renowned for its high-quality, made-to-order Vietnamese crepes (B\u00e1nh X\u00e8o). Golden, crispy crepes stuffed with fresh shrimp, pork, and crunchy bean sprouts are wrapped in fresh lettuce and fragrant herbs, then dipped in a savory homemade peanut and pork liver sauce. Crisp, tender, and refreshing without feeling greasy. They also serve mini quail egg pancakes (B\u00e1nh Kh\u1ecdt), featuring a crispy exterior and soft interior that patrons love.", "name": "B\u00e1nh X\u00e8o H\u00e0 \u0110i\u1ec7p (H\u00e0 \u0110i\u1ec7p Crispy Vietnamese Crepes)", "transport": "Located near Da Nang Railway Station, about a 5-minute walk away."}, {"address": "310 L\u00ea Du\u1ea9n, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | Brings Hu\u1ebf\u0027s iconic street food \"B\u00e1nh \u00c9p\" (pressed cakes) perfectly to Da Nang\u0027s Thanh Kh\u00ea District. Dough, pork, and egg mixture are pressed hot using heavy cast iron molds into thin cakes, yielding a chewy texture with delightfully crispy edges. Rolled up with pickled radish, cucumber, and fresh herbs, then dipped in sauce, it offers complex flavor layers with a smoky, savory aroma. A must-visit destination for street food enthusiasts seeking unique Vietnamese bites.", "name": "B\u00e1nh \u00c9p Hu\u1ebf Kh\u00e1nh - L\u00ea Du\u1ea9n (Kh\u00e1nh Hu\u1ebf Pressed Cakes - L\u00ea Du\u1ea9n)", "transport": "Located on L\u00ea Du\u1ea9n Boulevard, the main commercial strip of Thanh Kh\u00ea District; easily accessible by taxi."}, {"address": "38 B\u00e0u H\u1ea1c 1, V\u0129nh Trung, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | Highly recommended by locals, this traditional fish cake noodle stall is tucked away in a residential alley in Thanh Kh\u00ea. The fish cakes, made fresh daily, come in both steamed and fried varieties, offering a wonderfully springy bite. The broth is slow-simmered with fish, pumpkin, pineapple, and tomatoes, resulting in a naturally sweet, clean taste with no fishy odor. Served with delicate vermicelli noodles that absorb the flavorful broth and plenty of fresh herbs, it captures the authentic coastal flavors of Da Nang.", "name": "B\u00fan Ch\u1ea3 C\u00e1 C\u00f4 S\u01b0\u01a1ng (Aunt S\u01b0\u01a1ng\u0027s Fish Cake Noodles)", "transport": "About a 6-minute walk from the Big C (Go! Da Nang) shopping center."}, {"address": "K172/28 L\u00ea Du\u1ea9n, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.1 Stars | Offering Da Nang\u0027s iconic late-night street food \"\u1ed0c H\u00fat\" (sucking snails), this casual eatery is located in a Thanh Kh\u00ea alleyway with a friendly, relaxed vibe. Fresh snails are stir-fried over high heat with lemongrass, chili, and coconut milk, creating chewy meat soaked in a spicy, aromatic sauce rich in tropical herbal notes. Sucking the snail meat directly from the shell adds a fun element to the meal, traditionally enjoyed alongside crispy cassava crackers.", "name": "\u1ed0c H\u00fat D\u00ec Hu\u1ec7 (Aunt Hu\u1ec7\u0027s Spicy Stir-Fried Snails)", "transport": "Located in an alley off the L\u00ea Du\u1ea9n commercial area, about an 8-minute drive from Da Nang Airport."}, {"address": "165 Hu\u1ef3nh Th\u00fac Kh\u00e1ng, B\u00ecnh Hi\u00ean, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | A long-standing stall specializing in Vietnamese grilled rice papers and street snacks, situated where Thanh Kh\u00ea borders the traditional commercial zone. Their signature soft grilled rice paper (B\u00e1nh Tr\u00e1ng K\u1eb9p D\u1ebbo) retains a satisfyingly chewy bite, filled with rich egg yolk, dried beef, and scallions, then drizzled with a thick kumquat sweet chili sauce. The irresistible sweet and savory flavor combo draws crowds of young locals and travelers alike for an authentic Vietnamese afternoon snack.", "name": "B\u00e1nh Tr\u00e1ng K\u1eb9p D\u00ec Kim (Aunt Kim\u0027s Stuffed Grilled Rice Papers)", "transport": "Easily accessible by taking a Grab taxi to Hu\u1ef3nh Th\u00fac Kh\u00e1ng Street."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Qingxi District and Traditional Commercial District (Airport Vicinity)"}};
        const themeHex = "#c026d3";
        const cityName = "Da Nang";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
