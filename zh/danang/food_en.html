ted on the main northern thoroughfare of the An Thuong area. The signature claypot rice is baked in custom red clay pots, creating a golden, crunchy crispy rice layer at the bottom. Servers perform an entertaining show of breaking and tossing the pot live at your table. The rice is chewy and fragrant, paired perfectly with secret-recipe lemongrass braised pork and caramelized fish to deliver authentic Vietnamese home dining flavors.", "name": "Nh\u00e0 \u0110\u1ecf Claypot Rice 2 (C\u01a1m Ni\u00eau Nh\u00e0 \u0110\u1ecf 2 - Nguy\u1ec5n V\u0103n Tho\u1ea1i)", "transport": "Located on Nguy\u1ec5n V\u0103n Tho\u1ea1i Avenue, about a 5-minute walk from the center of the An Thuong area."}, {"address": "98 Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | A legendary eatery specializing in traditional Central Vietnamese boiled pork wrapped in rice paper. Thinly sliced, perfectly balanced pork belly is tender and non-greasy. Wrap the meat, cucumber slices, and a variety of fresh herbs inside dual-layer rice paper, then dip into the uniquely pungent and rich fermented fish sauce (M\u1eafm N\u00eam). Bursting with herbal freshness and savory richness, it\u0027s a delightful flavor explosion.", "name": "\u0110\u1ea1i L\u1ed9c Pork Rice Paper Rolls (B\u00e1nh Tr\u00e1ng Th\u1ecbt Heo \u0110\u1ea1i L\u1ed9c)", "transport": "About a 7-minute walk from the An Thuong Pedestrian Area."}, {"address": "295 Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | A longstanding local favorite for fish cake noodle soup. The broth is slow-simmered with fish bones, pumpkin, and pineapple, resulting in a sweet, savory taste without any fishiness. Handmade fish cakes come in both steamed and fried varieties, offering a firm, bouncy texture packed with savory flavor. The smooth vermicelli noodles absorb the broth beautifully\u2014add a spoon of local chili paste for an extra kick!", "name": "H\u00e0 Fish Cake Noodle Soup (B\u00fan Ch\u1ea3 C\u00e1 H\u00e0)", "transport": "About a 3-minute Grab bike or taxi ride from the An Thuong Tourist Area."}, {"address": "140 Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | Highly praised by locals, this dry vermicelli dish is a Central Vietnamese specialty featuring fermented fish sauce. The bowl is packed with crispy pork crackling, sliced pork belly, and cured pork sausage (nem chua), tossed with a bold, aromatic fermented fish sauce (M\u1eafm N\u00eam). Chewy noodles, crunchy cracklings, and a perfect harmony of savory, sour, and spicy notes make this a must-try authentic delicacy for foodies.", "name": "C\u00f4 Tri\u1ebft Fermented Fish Sauce Noodles (B\u00fan M\u1eafm N\u00eam C\u00f4 Tri\u1ebft)", "transport": "About an 8-minute walk from An Thuong Pedestrian Street."}, {"address": "L\u00f4 11 V\u00f5 Nguy\u00ean Gi\u00e1p, M\u00e2n Th\u00e1i, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.1 Stars | A famous iconic seafood restaurant adjacent to My Khe Beach and the An Thuong area, renowned for live tank selection and cooked-to-order seafood. Highlights include salt \u0026 pepper crispy fried crab and steamed garlic lobster. The seafood features firm, juicy, and sweet meat. Paired with cold Vietnamese beer and a lively sea breeze, it\u0027s the ultimate destination to experience Da Nang\u0027s authentic seafood late-night dining culture.", "name": "B\u00e9 M\u1eb7n Seafood Restaurant (H\u1ea3i S\u1ea3n B\u00e9 M\u1eb7n)", "transport": "About a 5-minute drive north along the coastal avenue V\u00f5 Nguy\u00ean Gi\u00e1p from the An Thuong area."}, {"address": "53 Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 Stars | A classic eatery specializing in traditional Vietnamese breakfast steak and eggs (B\u00f2 N\u00e9). Served on a piping hot sizzling plate, the beef is tender, juicy, and richly marinated, accompanied by a sunny-side-up egg and flavorful gravy. Dip a crispy yet soft Vietnamese baguette into the rich savory sauce for a deeply satisfying and flavor-packed bite.", "name": "Qu\u1ed1c Minh Sizzling Beef Steak (B\u00f2 N\u00e9 Qu\u1ed1c Minh)", "transport": "About a 10-minute walk from the An Thuong commercial area, or a 3-minute drive."}], "name": "Famous Local Iconic Eateries"}, "cat_2": {"items": [{"address": "43 Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | A top-tier specialty coffee shop in the heart of the An Thuong area, famous for its minimalist steel-and-glass architecture surrounded by water features. They specialize in single-origin pour-over coffee, ranging from light-roast Ethiopian to medium-roast Colombian beans. Don\u0027t miss their signature cold brew and special coconut coffee, paired with fresh, crispy croissants that are flaky outside, soft inside, and bursting with rich buttery aroma. A must-visit sanctuary for coffee enthusiasts and Western travelers visiting Da Nang.", "name": "43 Factory Coffee Roasters", "transport": "About a 5-minute walk from My Khe Beach"}, {"address": "27 Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 Stars | Da Nang\u0027s most famous plant-based brunch spot in An Thuong, highly loved by Western backpackers and health-conscious eaters. Highly recommended is their signature Acai Bowl, packed with fresh fruit and house-made granola, offering a creamy, refreshing, sweet-and-sour start to your day. They also serve toasted sourdough topped with ultra-creamy mashed avocado and soft-boiled eggs for a light, guilt-free meal. The vibrant tropical greenery decor creates a fantastic atmosphere.", "name": "Roots Plant-Based Cafe \u0026 Juice Bar", "transport": "Take a Grab and get off at Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng Street in the An Thuong area"}, {"address": "14/6 Ch\u1ebf L\u1ea1n Vi\u00ean, B\u1eafc M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 Stars | Tucked away in a quiet alley of the An Thuong area, this garden-style brunch cafe features a lush outdoor garden that offers ultimate relaxation. Serving authentic Full English breakfasts and homemade cold brew coffee, their French toast is fried to a golden crisp outside while remaining soft and pudding-like inside, perfectly paired with maple syrup and fresh blueberries. The elegant atmosphere and delicious food attract countless digital nomads spending relaxed mornings here.", "name": "Six On 6 Cafe", "transport": "About an 8-minute walk or a 2-minute motorbike ride from An Thuong main street"}, {"address": "47 An Th\u01b0\u01a1ng 4, B\u1eafc M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | An all-day brunch spot with strong American and Canadian vibes, known for generous portions and a lively, energetic atmosphere. Must-try item: fluffy pancake stacks drizzled with rich Canadian maple syrup and velvety butter. They also serve juicy, cheesy breakfast burgers and custom espresso drinks. With great value and bold flavors, it is the liveliest morning spot in the An Thuong nightlife district.", "name": "Bikini Bottom Express", "transport": "Located on An Thuong 4 Street, easily reachable by walking anywhere around the An Thuong area"}, {"address": "8 An Th\u01b0\u01a1ng 3, B\u1eafc M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | Combining modern industrial style with a tropical resort vibe, this European-style brunch cafe is a highly-rated landmark in An Thuong. Their Eggs Benedict is outstanding\u2014piercing the poached egg reveals a golden yolk running over Hollandaise sauce and smoked salmon, creating rich, creamy layers of flavor. The coffee uses select espresso beans, featuring delicate latte art and velvety microfoam.", "name": "Urban Square Da Nang", "transport": "Located on An Thuong 3 Street, just 300 meters from My Khe Beach"}, {"address": "101 V\u00f5 V\u0103n Ki\u1ec7t, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 Stars | A cozy Mediterranean garden restaurant run by an ex-pat couple, highly praised by international tourists for its brunch and coffee. Signature traditional Spanish tortillas and handcrafted Italian meatball tarts, paired with freshly ground espresso, deliver rich and diverse exotic flavors. The lush green garden and wooden decor create an extraordinarily comfortable and relaxed dining atmosphere\u2014a perfect spot to enjoy Da Nang\u0027s slow-paced lifestyle.", "name": "My Casa", "transport": "Located on V\u00f5 V\u0103n Ki\u1ec7t Avenue near the entrance of the An Thuong area; accessible by Grab"}, {"address": "30 An Th\u01b0\u01a1ng 2, B\u1eafc M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | A cozy, beloved cafe among local expats in An Thuong, focusing on high-quality local Vietnamese beans and foreign single-origin coffee. Their signature Coconut Coffee blends rich espresso with refreshing, sweet coconut slushie into smooth, distinct layers that aren\u0027t overly sweet. Paired with warm, freshly pressed cheese toast, it\u0027s simply irresistible.", "name": "GOAT Coffee Da Nang", "transport": "Located on An Thuong 2 Street, easily accessible on foot"}, {"address": "17 An Th\u01b0\u01a1ng 3, B\u1eafc M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | A bright, cute, and trendy brunch cafe that attracts crowds of tourists with its delicate, well-balanced healthy meals. Highly recommended are the colorful fruit oat bowls and cold-pressed juices, paired with freshly baked homemade waffles that are crispy on the outside and soft inside with a rich egg aroma. The friendly, warm atmosphere makes it a great spot for taking photos and unwinding.", "name": "Bunny\u0027s Cafe \u0026 Bistro", "transport": "Located in the middle of An Thuong 3 Street, about a 2-minute walk from An Thuong Night Market"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "54 Nguy\u1ec5n V\u0103n Tho\u1ea1i, B\u1eafc M\u1ef9 Ph\u00fa, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 Stars | Located in a lively spot on the edge of the An Th\u01b0\u1ee3ng area, this bistro seamlessly blends traditional Vietnamese spring rolls with modern culinary aesthetics. The crowd-favorite signatures are the Five-Color Vietnamese Spring Roll Platter and freshly fried crispy shrimp rolls. Paired with a special sweet-and-sour peanut sauce, the flavors are rich and layered\u2014the golden, crispy skin and juicy, sweet filling will keep you reaching for more. The ambiance blends lush colonial greenery with chic modern lighting, attracting countless Western tourists and local foodies for drinks and delicious bites.", "name": "B\u1ebfp Cu\u1ed1n \u0110\u00e0 N\u1eb5ng - Vietnamese Roll Bistro", "transport": "About a 5-minute walk from My Khe Beach, or easily accessible by Grab taxi."}, {"address": "100 Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng, Ph\u01b0\u1edbc M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | Situated on Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng Street in the heart of the An Th\u01b0\u1ee3ng commercial district, this restaurant evokes the charm of ancient Hoi An with its yellow walls and red-tiled garden setting. It specializes in refined Central Vietnamese regional dishes, including M\u00ec Qu\u1ea3ng, Hoi An Cao L\u1ea7u, and sweet-and-sour seafood hot pot. The signature secret-recipe Cao L\u1ea7u is highly recommended\u2014chewy noodles tossed in rich savory broth and fresh herbs offer a truly unique texture. Lit up by lanterns at night, the atmosphere is delightful, making it perfect for sipping handcrafted cocktails while savoring authentic homemade Vietnamese dishes.", "name": "Ngon Th\u1ecb Hoa - Traditional Garden \u0026 Modern Local Cuisine", "transport": "Located on the main artery of the An Th\u01b0\u1ee3ng nightlife area, about a 3-minute walk from My Khe Beach."}, {"address": "30 An Th\u01b0\u1ee3ng 30, B\u1eafc M\u1ef9 Ph\u00fa, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Tucked away on An Th\u01b0\u1ee3ng 30 Street, this specialty bistro is a popular nightlife hub for Western travelers and expats. It serves draft beers from local Vietnamese craft breweries paired with Central Vietnamese-inspired tapas. Highlights include the spicy grilled pork skewers and Vietnamese-style fried/roasted chicken wings\u2014crispy on the outside, succulent on the inside\u2014which pair perfectly with citrusy craft beers. With its relaxed and energetic outdoor bar vibe, it\u0027s a top choice for evening drinks and casual conversations.", "name": "Section 30 - Craft Beer \u0026 Tapas Bar", "transport": "Walk straight along the An Th\u01b0\u1ee3ng pedestrian area; located near the intersection of An Th\u01b0\u1ee3ng 30 Street."}, {"address": "52 V\u00f5 Ngh\u0129a, Ph\u01b0\u1edbc M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 Stars | Tucked in a quiet alley of the An Th\u01b0\u1ee3ng district, My Casa earns rave local reviews for its cozy garden ambiance. The menu focuses on Spanish tapas fusioned with Central Vietnamese twists, such as pan-seared shrimp with Vietnamese herb sauce, handmade Italian meatballs, and fresh seafood platters. Signature cocktails incorporate local fruits like passion fruit and calamansi for a refreshing, tangy taste. Warm hospitality and romantic evening lighting make it a favorite for couples and food enthusiasts.", "name": "My Casa - Tapas \u0026 Wine Bar", "transport": "Located on V\u00f5 Ngh\u0129a Street in the An Th\u01b0\u1ee3ng area, about a 6-minute walk turning off V\u00f5 Nguy\u00ean Gi\u00e1p near My Khe Beach."}, {"address": "16 An Th\u01b0\u1ee3ng 2, B\u1eafc M\u1ef9 Ph\u00fa, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | Designed for foodies who love exploring regional flavors and pub culture, L\u00fac L\u1eafc elevates traditional Vietnamese street food into refined bistro bites. The signature Shaking Beef (Th\u1ecbt B\u00f2 L\u00fac L\u1eafc) is tender and juicy, paired with a tangy black pepper and lime dipping sauce. Pair it with golden, crispy Vietnamese Crepes (B\u00e1nh X\u00e8o), filled with fresh shrimp and pork. Serving a great selection of draft beers from local Vietnamese microbreweries, it is a trendy hotspot for modern regional Vietnamese cuisine in Da Nang.", "name": "L\u00fac L\u1eafc - Vietnamese Tapas \u0026 Craft Beer", "transport": "Located in the center of An Th\u01b0\u1ee3ng 2 Street; take a Grab to the An Th\u01b0\u1ee3ng pedestrian zone and walk over."}, {"address": "20 An Th\u01b0\u1ee3ng 26, B\u1eafc M\u1ef9 Ph\u00fa, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | Featuring warm wooden decor that exudes rustic Central Vietnamese countryside charm, M\u1ed9c M\u1ea1c serves high-quality regional comfort food at budget-friendly prices. Signature dishes include claypot ginger-braised pork, charcoal-grilled herbal seafood, and stir-fried morning glory. The slow-braised pork is tender and savory, with a rich sauce that goes perfectly over fluffy rice. Eschewing touristy hype, it delivers authentic Da Nang home-cooked flavors beloved by local families and discerning travelers.", "name": "M\u1ed9c M\u1ea1c - Vietnamese Home-Style Cooking", "transport": "Turn onto An Th\u01b0\u1ee3ng 26 Street from the main An Th\u01b0\u1ee3ng road; about a 2-minute walk."}, {"address": "3 An Th\u01b0\u1ee3ng 1, B\u1eafc M\u1ef9 Ph\u00fa, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Voyage is a lively, contemporary nightlife bistro that pairs Da Nang\u0027s fresh seafood with international culinary techniques. Popular dishes include garlic white wine clams, seared tuna carpaccio, and grilled pork neck infused with Central Vietnamese spices. The clams are plump and savory, perfectly paired with a custom Vietnamese lime cocktail. On weekend nights, live DJs set the mood, delivering a fantastic mix of ambient lighting, great music, and exquisite dining.", "name": "Voyage Bistro \u0026 Bar", "transport": "Located at the entrance of An Th\u01b0\u1ee3ng 1 Street, just steps away from the My Khe Beach coastal boulevard."}, {"address": "205 Nguy\u1ec5n V\u0103n Tho\u1ea1i, Ph\u01b0\u1edbc M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | Showcasing traditional cuisine from all three main regions of Vietnam alongside signature Claypot Rice (C\u01a1m Ni\u00eau), this restaurant is an ideal spot to explore Vietnamese food culture. High-temperature clay pots create crispy golden rice at the bottom, perfectly complimented when drizzled with rich pepper-braised fish sauce. The menu also offers various traditional stir-fries and sour fish soup\u2014tangy, sweet, and appetizing. With prompt service and spacious seating, it is great for group dining and experiencing authentic local flavors.", "name": "C\u01a1m Ni\u00eau 3 Mi\u1ec1n - Claypot Rice \u0026 Regional Cuisine", "transport": "Located on Nguy\u1ec5n V\u0103n Tho\u1ea1i, a main thoroughfare in the An Th\u01b0\u1ee3ng tourist zone, making access extremely convenient."}], "name": "Bistros \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "27 Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng, Ph\u01b0\u1edbc M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | A plant-based culinary paradise designed for health enthusiasts and Western travelers. The signature \u0027Rainbow Buddha Bowl\u0027 combines fresh quinoa, avocado, roasted chickpeas, and homemade sesame dressing, offering rich layers in every bite. Creamy avocado paired with crisp lettuce provides a guilt-free, satisfying meal. The \u0027House Special Veggie Burger\u0027 features a thick patty made from black beans and mushrooms, with a lightly charred exterior carrying a rich smoky aroma and a firm texture that rivals real meat. With cozy wooden decor and lush greenery, it is the top choice for enjoying a relaxing brunch in the An Th\u01b0\u01a1ng area.", "name": "Roots Plant-Based Cafe", "transport": "About a 5-minute walk from My Khe Beach, or take a Grab to the intersection of Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng Street and An Th\u01b0\u1ee3ng 2 Street."}, {"address": "16 An Th\u01b0\u1ee3ng 36, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | A popular restaurant combining modern fitness concepts with a vegan diet. Their thick, smooth, smoothie-textured \u0027Acai Bowl\u0027 is topped with chia seeds, toasted coconut flakes, and fresh-cut tropical fruits, delivering a refreshing sweet and tart taste that is immensely popular with Western backpackers and surfers. Additionally, the \u0027Tofu Veggie Wrap\u0027 features a whole-wheat tortilla wrapping pan-fried organic tofu and special hot sauce\u2014slightly crispy on the outside and juicy on the inside. Paired with fresh cold-pressed green juice, it quickly recharges your energy.", "name": "iVegan Supafoods Da Nang", "transport": "Located in a central alley of the An Th\u01b0\u01a1ng area, just a 3-minute walk from the An Th\u01b0\u01a1ng Night Market."}, {"address": "12 An Th\u01b0\u1ee3ng 3, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | A hidden gem known for sugar-free, gluten-free, and vegan desserts. The must-try \u0027Raw Chocolate Tart\u0027 is completely dairy-free, featuring e and wallet-friendly prices, it is loved by locals and highly recommended for tourists looking to sample authentic Da Nang vegetarian street food.", "name": "Karma Vegetarian", "transport": "Located on Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf Street, a major foodie street on the edge of the An Th\u01b0\u01a1ng area; easily accessible by Grab motorbike or car right to the doorstep."}, {"address": "31 An Th\u01b0\u1ee3ng 29, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | A warm, homey vegetarian restaurant famous for its rich array of home-style Vietnamese dishes and buffet options. The \u0027Vegan Bun Bo Hue (Bun Bo Hue Chay)\u0027 is highly recommended, featuring a slightly spicy broth infused with lemongrass, paired with silky vegan meatballs and deep-fried tofu puffs that soak up the soup, delivering crisp, layered flavors with a satisfying spicy kick. Preparing fresh ingredients daily, it is a top pick for travelers seeking an authentic yet light dinner in the An Th\u01b0\u01a1ng area.", "name": "B\u1ebfp Chay H\u01b0\u01a1ng Duy\u00ean (Huong Duyen Vegan Kitchen)", "transport": "About a 4-minute walk from the An Th\u01b0\u01a1ng Pedestrian Street, tucked away in a quiet alley on An Th\u01b0\u1ee3ng 29 Street."}, {"address": "G\u00f3c An Th\u01b0\u1ee3ng 2 - Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A popular street food stand located at the edge of the An Th\u01b0\u01a1ng tourist area. Made to order, the toasted \u0027Vegan Banh Mi\u0027 features an impossibly crispy baguette that crackles with every bite, stuffed with pan-fried vegan ham, homemade cashew spread, pickled daikon and carrots, and fresh cilantro. Balanced with savory mushroom sauce and tangy pickles, it offers a satisfying bite full of local street food charm\u2014the perfect snack for an evening stroll or before hitting the nightlife.", "name": "B\u00e1nh M\u1ef3 Chay An Th\u01b0\u1ee3ng (An Thuong Vegan Banh Mi Stand)", "transport": "Located at the corner of An Th\u01b0\u1ee3ng 2 Street and Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf Street, easily reachable while strolling through the An Th\u01b0\u01a1ng Night Market area."}, {"address": "63 An Th\u01b0\u1ee3ng 26, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | An innovative vegan eatery blending Asian and Western culinary styles. The signature \u0027Vegan Green Curry Rice\u0027 uses fresh coconut milk and Thai herbs to create a rich, creamy, mildly spicy sauce served over hot jasmine rice with tender carrots, potatoes, and tofu cubes. Additionally, the golden crisp \u0027Vegan Tempura Platter\u0027 served with custom tartar sauce is crunchy outside and soft inside without feeling greasy at all. Both local vegans and international travelers praise its exquisite seasoning.", "name": "B\u1ea3o Vegan \u0026 Vegetarian", "transport": "Close to the main strip of An Th\u01b0\u01a1ng Night Market; turn into An Th\u01b0\u1ee3ng 26 Street and walk about 2 minutes to spot the eye-catching green sign."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "\u0110\u01b0\u1eddng An Th\u01b0\u1ee3ng 4, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Extraordinarily crispy Vietnamese pancakes (B\u00e1nh X\u00e8o) stuffed with fresh shrimp, pork, and bean sprouts, paired with aromatic charcoal-grilled pork skewers (Nem L\u1ee5i) and a special peanut dipping sauce. Every bite delivers a satisfying crunch, rich savory flavor balanced by refreshing fresh lettuce\u2014a massive favorite among both foreign tourists and local youth.", "name": "An Th\u01b0\u1ee3ng Night Market Crispy Pancakes \u0026 Grilled Pork Skewers (Ch\u1ee3 \u0110\u00eam An Th\u01b0\u1ee3ng - B\u00e1nh X\u00e8o \u0026 Nem L\u1ee5i)", "transport": "Take a Grab or walk directly to An Th\u01b0\u1ee3ng 4 Walking Street."}, {"ad ", "name": "An Th\u01b0\u1ee3ng Grilled Rice Paper \u0026 Grilled Corn Stand (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng \u0026 B\u1eafp N\u01b0\u1edbng An Th\u01b0\u1ee3ng)", "transport": "Located at the intersection of An Th\u01b0\u1ee3ng 2 and Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng streets, an easy walk away."}, {"address": "80 Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | A local favorite traditional dessert! The signature Durian Thai Sweet Soup (Ch\u00e8 Th\u00e1i Durian) features rich milky goodness packed with jackfruit, red beans, coconut jelly, and shaved ice\u2014rich in texture without being cloying. For those not fond of durian, the coconut milk tapioca sweet soup offers a icy, refreshing taste that brings pure satisfaction on a tropical night.", "name": "An Th\u01b0\u1ee3ng Traditional Vietnamese Sweet Soup (Ch\u00e8 Th\u00e1i \u0026 Ch\u00e8 Li\u00ean An Th\u01b0\u1ee3ng)", "transport": "Take a Grab to Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf Street, near the An Th\u01b0\u1ee3ng pedestrian area."}, {"address": "\u0110\u01b0\u1eddng Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Made-to-order mango, passion fruit, and dragon fruit smoothies with a thick, rich texture and no excessive artificial syrup\u2014delivering pure, intense tropical fruit flavor with fine ice crystals in every sip. The stand also offers freshly opened, cool whole coconuts\u2014sweet, refreshing, and the perfect walking drink.", "name": "An Th\u01b0\u1ee3ng Tropical Fruit Smoothie \u0026 Fresh Coconut Stand (Sinh T\u1ed1 \u0026 D\u1eeba T\u01b0\u01a1i An Th\u01b0\u1ee3ng)", "transport": "Walk along main Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng Street to easily spot stalls along the way."}, {"address": "\u0110\u01b0\u1eddng An Th\u01b0\u1ee3ng 3, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 Stars | Located near My Khe Beach, this charcoal grill stand specializes in freshly grilled squid, shrimp, and snail skewers, brushed with custom chili sauce and scallion oil, sizzling over high heat. The seafood is springy and succulent, bursting with smoky charcoal aroma and sweet juices. Paired with an ice-cold beer, it\u0027s a great snack to soak up the vibrant night atmosphere of the An Th\u01b0\u1ee3ng area.", "name": "An Th\u01b0\u1ee3ng Street Charcoal-Grilled Seafood Skewers (Xi\u00ean N\u01b0\u1edbng H\u1ea3i S\u1ea3n An Th\u01b0\u1ee3ng)", "transport": "Walk to the nightlife core of An Th\u01b0\u1ee3ng 3 Street to find the smoky grill stand."}, {"address": "\u0110\u01b0\u1eddng An Th\u01b0\u1ee3ng 1, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | A zesty, appetite-whetting salad of shredded green mango paired with beef jerky, cilantro, and crushed peanuts, tossed in a signature sweet-and-sour spicy fish sauce dressing for a crispy, juicy, tangy delight. Freshly fried Vietnamese net spring rolls feature an extraordinarily golden crispy exterior with juicy savory fillings. This duo is immensely popular among tourists and young locals alike.", "name": "An Th\u01b0\u1ee3ng Green Mango Salad \u0026 Fried Spring Rolls (G\u1ecfi Xo\u00e0i \u0026 Ch\u1ea3 Gi\u00f2 An Th\u01b0\u1ee3ng)", "transport": "Walk into An Th\u01b0\u1ee3ng 1 Street to easily find this popular stand."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Anshang Special Tourism Zone and Nightlife Street"}, "bana_hills": {"categories": {"cat_1": {"items": [{"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Sun World Ba Na Hills, Du D\u00f4me Square)", "feature": "\u2b50 4.2 Stars | A popular restaurant located at Ba Na Hills Du D\u00f4me Square, offering a rich spread of local traditional Vietnamese cuisine. The piping hot Vietnamese Pho features a sweet, savory, and fragrant broth, silky smooth noodles, tender slices of fresh beef, and abundant
