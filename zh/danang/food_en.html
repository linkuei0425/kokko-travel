local youth alike to escape the hustle and unwind.", "name": "V\u1ec1 Nh\u00e0 Coffee \u0026 Tea", "transport": "About a 5-minute walk from the main entrance of the Marble Mountains"}, {"address": "22 Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | A cozy hipster cafe near the Marble Mountains stone carving street, filled with lush greenery and vintage wooden decor. The signature Egg Coffee is highly recommended\u2014the egg yolk is whipped into a mousse-like foam, balancing the coffee\u0027s bitterness with a gentle sweetness and rich, silky texture reminiscent of a fine dessert. Many tourists head here after exploring the caves to enjoy a warm, comforting cup of traditional egg coffee.", "name": "T\u1ed5 C\u00e0 Ph\u00ea", "transport": "Located on the stone carving street at the foot of the Marble Mountains, about a 3-minute walk away"}, {"address": "326 L\u00ea V\u0103n Hi\u1ebfn, Khu\u00ea M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | An iconic local specialty coffee chain in Da Nang, situated along the main thoroughfare of the Marble Mountains commercial area. Spacious, bright, and well-air-conditioned, it\u0027s a perfect sanctuary from the summer heat. Popular choices include the rich Salted Coffee and hearty Vietnamese brunch platters. The sweet-and-savory salted cream topping paired with dark roast coffee creates a complex, unforgettable flavor profile loved by international tourists and business travelers alike.", "name": "The Cups Coffee - L\u00ea V\u0103n Hi\u1ebfn", "transport": "En route to the Marble Mountains via Grab or taxi, about a 3-minute drive away"}, {"address": "72 L\u00ea V\u0103n Hi\u1ebfn, Khu\u00ea M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A slow-paced garden cafe surrounded by spacious lawns and lush tropical plants, making guests feel as if they\u0027re in a mini botanical garden. It features made-to-order American-style brunch platters, avocado toast, and fresh fruit yogurt bowls, served alongside freshly ground specialty coffee. With rich coffee aromas and refreshing yogurt bowls, it offers a hearty yet wholesome breakfast experience\u2014a top pick for vacationers near Non Nuoc Beach seeking a relaxing morning.", "name": "Lani Coffee", "transport": "About a 5-minute drive from the Non Nuoc Beach resort area"}, {"address": "185 L\u00ea V\u0103n Hi\u1ebfn, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | A popular Instagram-worthy cafe with an elegant, quiet atmosphere and a Korean-style minimalist white aesthetic. Highlights include fruity cold brews and Uji Matcha lattes, served alongside fresh daily-baked croissants and tiramisu. The cold brew offers subtle citrus notes for a crisp finish, while the butter croissants are crispy outside and soft inside. It\u0027s a trendy spot for young travelers to take aesthetic photos and enjoy afternoon treats.", "name": "M\u00e2y Coffee \u0026 Bakery", "transport": "About a 3-minute drive from the Marble Mountains scenic area"}, {"address": "Tr\u01b0\u1eddng Sa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | An upscale French bakery and cafe located along the Non Nuoc Beach resort boulevard, carrying on the exquisite craftsmanship of a historic Saigon brand. It offers authentic French croissants, fruit tarts, and highly aromatic caffe lattes. The croissants are flaky, perfectly layered, and rich in buttery goodness. Paired with a tart and sweet Sicilian lemon iced coffee, it\u0027s a huge hit among international guests staying at nearby five-star resorts.", "name": "Brodard Bakery \u0026 Caf\u00e9", "transport": "Located on the coastal boulevard (Tr\u01b0\u1eddng Sa) near Non Nuoc Beach, easily reachable by walking or taxi from the resort area"}, {"address": "5 Tr\u01b0\u1eddng Sa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | A stunning beachfront brunch cafe overlooking Non Nuoc Beach, where guests can relish delicious meals accompanied by panoramic ocean views. The menu features classic Vietnamese pho, Eggs Benedict brunch platters, and fresh tropical fruit smoothies. The poached eggs are runny and perfectly paired with signature hollandaise sauce on toasted English muffins, offering the ultimate luxury brunch experience soaked in sea breeze.", "name": "Pool House Cafe at Hyatt Regency", "transport": "Located inside Hyatt Regency Resort, about a 4-minute drive from the Marble Mountains"}, {"address": "12 Khu\u00ea M\u1ef9 \u0110\u00f4ng 4, Khu\u00ea M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | A stylish cafe blending minimalist Nordic wooden design with local Vietnamese touches, serving refined specialty coffees and European-style brunch. The signature \u0027Brown Sugar Boba Milk Coffee\u0027 seamlessly combines chewy boba pearls with the bold aroma of espresso\u2014delightfully chewy and perfectly balanced in sweetness. Paired with house-baked Basque burnt cheesecake that melts in your mouth, it comes highly recommended by Western backpackers and locals alike.", "name": "Garten Cafe \u0026 Bistro", "transport": "About a 6-minute drive from the Marble Mountains scenic area"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "199 Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.7 Stars | Located right next to the Marble Mountains area, Laluna is a highly popular local bistro blending traditional Vietnamese flavors with a modern bar vibe. The signature crispy Vietnamese spring rolls are stuffed with juicy shrimp and cilantro, paired with a rich sweet-and-sour peanut sauce for multi-layered texture. Additionally, the rich coconut curry chicken is incredibly tender and full of flavor, making it a favorite among international tourists. Ordering a signature lemongrass cocktail in the evening while enjoying the cool breeze at the outdoor seating is the ultimate way to unwind after hiking the Marble Mountains.", "name": "Laluna Bar \u0026 Restaurant", "transport": "About a 3-minute walk from the Marble Mountains entrance"}, {"address": "88 Tr\u1ea7n V\u0103n D\u01b0, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.4 Stars | Set inside a quaint, traditional Vietnamese wooden mansion with a lush garden, Lam Vien Restaurant creates a strong classic Vietnamese ambience. It specializes in authentic Central Vietnamese local cuisine. The acclaimed \u0027Nem L\u1ee5i\u0027 (grilled pork skewers) is crispy on the outside, juicy on the inside, infused with subtle lemongrass aromas, and wrapped in paper-thin rice paper with fresh lettuce and pickles for a refreshing, non-greasy bite. Another highlight, \u0027Ch\u1ea1o T\u00f4m\u0027 (sugarcane shrimp), features fried shrimp paste wrapped around sugarcane, rendering it sweet and juicy. Elegant yet refined, it is the top choice for authentic Vietnamese home cooking and business gatherings.", "name": "Lam Vien Restaurant", "transport": "About a 7-minute Grab taxi ride from Non Nuoc Beach"}, {"address": "12 Tr\u01b0\u1eddng Sa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.5 Stars | Located near the Non Nuoc Beach resort area, Nh\u00e0 H\u00e0ng Mai creates a refined bistro atmosphere with tasteful bamboo decor and warm lighting. The restaurant specializes in local Da Nang home cooking and fresh seafood. The \u0027B\u00e1nh X\u00e8o\u0027 (Vietnamese sizzling pancake) comes highly recommended, featuring a golden crispy crust stuffed with shrimp, pork, and bean sprouts, dipped in a rich peanut-liver sauce that bursts with flavor at every crunchy bite. The restaurant also offers a wide selection of local craft beers and signature cocktails, seamlessly pairing local delicacies with a relaxed bar feel.", "name": "Nh\u00e0 H\u00e0ng Mai (Mai Vietnamese Restaurant)", "transport": "About a 5 to 10-minute walk from the Non Nuoc Beach hotel area"}, {"address": "42 Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.3 Stars | Hidden at the foot of the Marble Mountains, this long-established noodle shop is an excellent spot to experience Da Nang\u0027s iconic \u0027M\u00ec Qu\u1ea3ng\u0027 (Quang Style Noodles). The thick noodles have a slight yellow hue and a chewy texture, complemented by a concentrated, flavorful broth, turmeric-slow-cooked chicken, fresh shrimp, and quail eggs, topped with crispy peanuts and rice crackers. Crumbling the rice crackers into the bowl creates a wonderful blend of tender and crunchy textures with rich herbal and nutty aromas\u2014highly recommended by locals and foodies alike.", "name": "M\u00ec Qu\u1ea3ng Dung", "transport": "Just a 4-minute walk from the main ticket office of the Marble Mountains"}, {"address": "249 L\u00ea V\u0103n Hi\u1ebfn, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.6 Stars | B\u00e1nh X\u00e8o C\u00f4 Ba is an elegant eatery in the Marble Mountains area specializing in classic Central Vietnamese snacks and local delicacies. Its signature shrimp pancake uses daily fresh-caught small white shrimp, fried to an ultra-golden crispness with sweet, bouncy shrimp filling inside. Wrapped in fresh lettuce and herbs and dipped in a special fermented bean sauce, it delivers a sweet, tangy, and slightly spicy flavor that is wonderfully refreshing. Clean, bright, and air-conditioned, it offers tourists a comfortable and high-quality environment for authentic local dining.", "name": "B\u00e1nh X\u00e8o C\u00f4 Ba", "transport": "About a 3-minute taxi ride from the Marble Mountains scenic area"}, {"address": "Tr\u01b0\u1eddng Sa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.2 Stars | Situated near the Non Nuoc Beach coastline, The Ocean Bistro combines beach resort vibes with creative Central Vietnamese cuisine. The top recommendation is the \u0027Vietnamese Grilled Squid with Lemongrass \u0026 Lime Dip,\u0027 featuring fresh local catch charcoal-grilled to aromatic perfection\u2014tender and juicy, paired with a tangy-spicy dipping sauce that whets the appetite. The menu also offers diverse local snack platters featuring fresh spring rolls, grilled pork skewers, and fried spring rolls. Combined with refreshing tropical cocktails, it is a great spot to gather with friends in the evening.", "name": "The Ocean Bistro", "transport": "Located in the Non Nuoc resort strip, about a 3-minute walk from Non Nuoc Beach"}, {"address": "388 Tr\u01b0\u1eddng Sa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.1 Stars | Located along the main road connecting the Marble Mountains to Non Nuoc Beach, this seafood restaurant is famous for its abundant live catch and authentic Central Vietnamese cooking techniques. The signature \u0027Stir-fried Crab with Lemongrass and Chili\u0027 features sweet, firm meat coated in a rich, spicy sauce that pairs wonderfully with rice. Steamed fresh fish infused with local Marble Mountains herbs boasts tender flesh and a delicate aroma. Offering both lush outdoor garden seating and indoor dining, its generous portions and reasonable prices make it popular among families.", "name": "Nh\u00e0 H\u00e0ng H\u1ea3i S\u1ea3n C\u00e1 M\u1eadp (C\u00e1 M\u1eadp Seafood \u0026 Local Restaurant)", "transport": "About a 4-minute drive or taxi ride from Non Nuoc Beach"}, {"address": "33 V\u00f5 Nguy\u00ean Gi\u00e1p, Khu\u00ea M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.5 Stars | Vesta is a stylish yet tradition-infused bistro bar that artfully incorporates local Da Nang ingredients into modern dishes. The must-try \u0027Lemongrass Grilled Pork Ribs\u0027 are slow-cooked at low temperature and glazed with a honey fish sauce glaze before being grilled to charred perfection. The meat falls off the bone, incredibly tender and juicy. With an extensive craft beer selection, Vietnamese craft cocktails, relaxing music, and an industrial-chic atmosphere, it stands out as a popular nightlife spot to savor refined local dishes near the Marble Mountains and Non Nuoc Beach.", "name": "Vesta Restaurant \u0026 Bar", "transport": "About a 5-minute drive from the Marble Mountains scenic area along the coastal avenue"}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "87 Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.6 Stars | Located at the foot of the Marble Mountains, this highly popular local vegetarian eatery is loved by tourists and pilgrims alike for its great value and wide variety of traditional Vietnamese vegetarian dishes. The signature Vegetarian Pho (Ph\u1edf Chay) features a broth simmered for hours with sugarcane, carrots, and herbs, making it delightfully sweet and flavorful, paired with mushrooms and handmade tofu skin for rich textures. The fried vegetarian spring rolls are crispy to perfection, stuffed with taro and wood ear mushrooms, and served with a sweet chili sauce that keeps you reaching for more.", "name": "Di\u1ec7u Hoa Vegetarian Restaurant (Qu\u00e1n Chay Di\u1ec7u Hoa)", "transport": "About a 3-minute walk from the main entrance of the Marble Mountains."}, {"address": "136 L\u00ea V\u0103n Hi\u1ebfn, Khu\u00ea M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.5 Stars | Located near the Marble Mountains scenic area, this vegetarian restaurant is famous for its cozy, minimalist ambiance and authentic Vegetarian Mi Quang (M\u00ec Qu\u1ea3ng Chay). Its Mi Qu\u1ea3ng uses thick golden rice noodles paired with a turmeric-infused rich broth, pan-fried tofu, peanuts, and crispy rice crackers. Mixed together, the chewy noodles and crunchy peanuts create a multi-layered flavor profile that is refreshing and satisfying\u2014an ideal spot to recharge after exploring the Marble Mountains.", "name": "T\u00e2m Nguy\u1ec7n Vegetarian Restaurant (Qu\u00e1n Chay T\u00e2m Nguy\u1ec7n)", "transport": "Take a Grab or taxi to L\u00ea V\u0103n Hi\u1ebfn Street; it is about a 2-minute drive from the Marble Mountains entrance."}, {"address": "45 Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.4 Stars | Tucked away on Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa Street, this cozy vegetarian spot specializes in home-style Vegetarian B\u00e1nh X\u00e8o (B\u00e1nh X\u00e8o Chay). The crispy golden pancakes are packed with bean sprouts, fresh mushrooms, and herbs. Wrapped in crisp fresh lettuce and dipped in a special peanut sauce, they are aromatic without being greasy. Friendly service and affordable prices make it a favorite resting spot for hikers.", "name": "T\u1eeb T\u00e2m Vegetarian Eatery (Qu\u00e1n Chay T\u1eeb T\u00e2m)", "transport": "Located in the commercial area at the foot of the Marble Mountains, about a 5-minute walk."}, {"address": "36 L\u00ea V\u0103n Hi\u1ebfn, Khu\u00ea M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.3 Stars | An L\u1ea1c Vegetarian Restaurant attracts crowds of locals and tourists with its diverse vegetarian buffet (C\u01a1m Chay Self-service). Over 20 fresh daily dishes are served, including honey-glazed vegetarian char siu, hot and sour vegetarian fish soup, and stir-fried seasonal vegetables. Distinct grains of rice paired with plant-based meats drizzled in signature sauce and tender tofu offer rich, savory flavors that make you forget you are eating vegetarian\u2014perfect for foodies who love variety.", "name": "An L\u1ea1c Vegetarian Restaurant (Qu\u00e1n Chay An L\u1ea1c)", "transport": "Take Bus No. 01 and get off at the L\u00ea V\u0103n Hi\u1ebfn stop; it is about a 1-minute walk."}, {"address": "212 L\u00ea V\u0103n Hi\u1ebfn, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.7 Stars | Featuring an elegant and serene dining atmosphere, this eatery highly recommends its Vegetarian Bun Bo Hue (B\u00fan B\u00f2 Hu\u1ebf Chay). The broth combines the distinct aromas of lemongrass, kaffir lime leaves, and herbs with a subtle spicy kick. Paired with silky rice noodles, firm plant-based ham, and konjac cubes, it offers a tangy, spicy, and vividly layered flavor profile highly praised by Western tourists and health-conscious diners.", "name": "B\u00e1t Nh\u00e3 Vegetarian Eatery (Qu\u00e1n Chay B\u00e1t Nh\u00e3)", "transport": "About a 4-minute drive from Non Nuoc Beach; taking a taxi is recommended."}, {"address": "15 Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.4 Stars | Known for its made-to-order traditional Vietnamese vegetarian snacks, H\u01b0\u01a1ng S\u01b0a\u0027s signature Vegetarian Steamed Rice Rolls (B\u00e1nh Cu\u1ed1n Chay) feature translucent, springy wrappers filled with wood ear mushrooms, jicama, and minced plant-based meat. Topped with crispy fried shallots and dipped in sweet-and-sour vegan fish sauce, it is silky, refreshing, and melts in your mouth. The peaceful vibe and authentic folk decor reflect charming local culture.", "name": "H\u01b0\u01a1ng S\u01b0a Vegetarian Eatery (Qu\u00e1n Chay H\u01b0\u01a1ng S\u01b0a)", "transport": "Located on Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa Street, diagonally opposite the Marble Mountains Stone Carving Village; reachable on foot."}, {"address": "68 Nam K\u1ef3 Kh\u1edfi Ngh\u0129a, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.5 Stars | Located near the Non Nuoc Beach resort area, this restaurant specializes in healthy plant-based vegan dishes. The Stone Pot Vegetarian Seafood Claypot is highly recommended\u2014simmered with wild mushrooms, snow fungus, and fresh vegetables, the broth arrives bubbling hot and delicious, while the mushrooms are delightfully springy with natural sweetness. Additionally, their fresh herbal teas are a highlight: refreshing and perfect for hot summer days.", "name": "Thi\u1ec7n Nh\u00e2n Vegetarian Restaurant (Qu\u00e1n Chay Thi\u1ec7n Nh\u00e2n)", "transport": "About an 8-minute walk from Non Nuoc Beach via Tr\u01b0\u1eddng Sa Road onto Nam K\u1ef3 Kh\u1edfi Ngh\u0129a."}, {"address": "Tr\u01b0\u1eddng Sa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, Da Nang", "feature": "\u2b50 4.8 Stars | Located along the coastal road near Non Nuoc Beach, this stylish, modern vegetarian bistro is very popular among international travelers. The signature Fresh Summer Rolls wrap colorful purple cabbage, herbs, carrots, and grilled tofu in delicate rice paper, served with a rich homemade peanut-sesame dip for an exceptionally crisp, refreshing taste. Bright and elegant, it offers a superb resort dining experience.", "name": "Lotus Vegan House", "transport": "Located on the main resort strip along Non Nuoc Beach; a 5 to 10-minute walk from many nearby resorts."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Ch\u1ee3 B\u1eafc M\u1ef9 An, 25 Nguy\u1ec5n B\u00e1 L\u00e2n, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | The most famous walk-and-eat dessert inside B\u1eafc M\u1ef9 An Market, hailed as Da Nang\u0027s must-try dream avocado ice cream. Rich and silky freshly blended avocado puree is paired with a scoop of sweet, creamy coconut ice cream, topped with crispy coconut chips and roasted peanuts. With every bite, the smooth, chilled avocado blends perfectly with creamy coconut notes, creating rich, delightful layers that are neither too heavy nor overly sweet. Extremely silky and refreshing, it\u0027s a hot-afternoon street treat that locals and tourists willingly line up for.", "name": "Kem B\u01a1 C\u00f4 V\u00e2n - Ch\u1ee3 B\u1eafc M\u1ef9 An (C\u00f4 V\u00e2n Avocado Ice Cream)", "transport": "Take a Grab or taxi to B\u1eafc M\u1ef9 An Market, then walk directly into the food court area to find the stall."}, {"address": "39 Nguy\u1ec5n B\u00e1 L\u00e2n, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | Tucked away in an alley near the Marble Mountains, this popular street food stall specializes in Central Vietnam\u0027s iconic snack: grilled rice paper (B\u00e1nh K\u1eb9p). Made to order, the rice paper is topped with quail eggs, scallions, pork floss, and dried shrimp. Choose between the crispy grilled style (B\u00e1nh K\u1eb9p Gi\u00f2n) or the chewy soft version (B\u00e1nh K\u1eb9p D\u1ebbo). Served piping hot and fragrant, it is paired with the house-special sweet, sour, and spicy kumquat-beef dipping sauce. Crispy on the outside, soft on the inside, and packed with complex flavors, it is a favorite among local students and visitors alike.", "name": "B\u00e1nh K\u1eb9p \u00dat \u1ed0c (\u00dat \u1ed0c Rice Paper Snack)", "transport": "A quick 5-minute ride by scooter or Grab from the southern end of My Khe Beach."}, {"address": "257 L\u00ea V\u0103n Hi\u1ebfn, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | A legendary local B\u00e1nh M\u00ec stall located near the Marble Mountains. The baguette is toasted to absolute perfection, producing a satisfying crunch with every bite. It\u0027s generously stuffed with smooth homemade pate, sliced Vietnamese ham, savory grilled pork, tangy pickled radish and carrots, and fresh cilantro. Drizzled with a savory, sweet-and-tangy special sauce that keeps the inside wonderfully moist, this hearty, crunchy sandwich is the perfect fuel-up snack before exploring the Marble Mountains.", "name": "B\u00e1nh M\u00ec L\u00e0nh L\u00ea V\u0103n Hi\u1ebfn (L\u00e0nh Vietnamese Sandwich)", "transport": "Located diagonally opposite the main entrance to the Marble Mountains; a quick 3-minute walk away."}, {"address": "248 Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | Famous for its fresh-made \u0027Jumping Shrimp Pancakes\u0027, this popular market delicacy in the Marble Mountains district is a must-try. The golden, crispy rice pancake features ultra-thin, crunchy edges and is packed with succulent fresh shrimp, tender pork slices, and crunchy bean sprouts. Wrap a piece of pancake inside a paper-thin rice paper roll with fresh herbs and cucumber, then dip into rich peanut liver sauce or sweet fish sauce. Every bite offers an irresistible contrast of savory crispness and fresh lightness.", "name": "B\u00e1nh X\u00e8o T\u00f4m Nh\u1ea3y C\u00f4 Ba (C\u00f4 Ba Crisp Shrimp Pancake)", "transport": "Take a Grab to Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf food street; look for the prominent yellow sign."}, {"address": "Ch\u1ee3 B\u1eafc M\u1ef9 An, 25 Nguy\u1ec5n B\u00e1 L\u00e2n, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | A renowned traditional Vietnamese sweet soup (Ch\u00e8) stall inside B\u1eafc M\u1ef9 An Market, best known for its \u0027S\u01b0\u01a1ng Sa H\u1ea1t L\u1ef1u\u0027 (pomegranate-seed jelly dessert) and pomelo sweet soup. The colorful \u0027pomegranate seeds\u0027 feature a chewy gelatin exterior encasing crunchy water chestnuts, paired with mung bean paste, grass jelly, and rich coconut milk over shaved ice. Pleasantly sweet and wonderfully textured, this authentic Southeast Asian icy treat is the ultimate way to cool off after a trek around the Marble Mountains.", "name": "Ch\u00e8 C\u00f4 Ch\u00f3t - Ch\u1ee3 B\u1eafc M\u1ef9 An (C\u00f4 Ch\u00f3t Sweet Soup)", "transport": "Located in the central dessert area inside B\u1eafc M\u1ef9 An estaurant)", "transport": "About a 5-minute drive from the northern end of My Khe Beach; taking a Grab taxi is recommended."}, {"address": "99 L\u00ea Quang \u0110\u1ea1o, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | Styled around traditional Vietnamese rural heritage, this unique local restaurant is charmingly decorated with bamboo weaving and lush natural greenery. Their signature \u0027Bamboo Tube Roasted Chicken\u0027 features tender chicken marinated in local herbs and slow-roasted inside bamboo stalks, resulting in crispy golden skin and juicy, bamboo-infused meat. Pair it with their slow-braised clay pot fish\u2014savory, deeply aromatic, and perfect with fragrant rice. Its nostalgic rustic charm and authentic flavors captivate foodies seeking heritage recipes.", "name": "L\u00e0ng Ngh\u1ec7 Rustic Countryside Vietnamese Cuisine (L\u00e0ng Ngh\u1ec7 Restaurant)", "transport": "About an 8-minute walk from the southern end of My Khe Beach, or a 2-minute scooter ride."}, {"address": "Lot 12 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | An open-air beachfront bar and lounge with direct access to My Khe Beach, offering panoramic ocean views and tropical lounge seating. The menu features international fare alongside local seafood tapas, such as Pan-Seared Garlic Butter Prawns\u2014tender, snappy, and perfectly seasoned. Paired with a tropical gin cocktail, it\u0027s pure relaxation. Come nightfall, live DJ beats and thrilling fire shows transform it into one of the liveliest beachfront venues along the shore.", "name": "Esco Beach Bar \u0026 Lounge", "transport": "Situated right along the My Khe Beach sands; easily accessible directly from the beachfront promenade."}, {"address": "248 D\u01b0\u01a1ng \u0110\u00ecnh Ngh\u1ec7, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | A famous local eatery specializing in B\u00ecnh \u0110\u1ecbnh-style \u0027Jumping Shrimp Pancakes\u0027 made with live, fresh daily catches. The pancake base is extra crispy, crackling with every bite, and topped with sweet white prawns and crisp bean sprouts. Served alongside a rich, custom peanut-and-liver dipping sauce and shredded green papaya, it delivers incredible flavor depth and crunch. Unpretentious yet authentic, it offers a real taste of coastal Vietnamese culinary traditions.", "name": "C\u00f4 Ba Jumping Shrimp Crispy Pancakes (B\u00e1nh X\u00e8o T\u00f4m Nh\u1ea3y C\u00f4 Ba \u0110\u00e0 N\u1eb5ng)", "transport": "About a 6-minute walk after turning onto D\u01b0\u01a1ng \u0110\u00ecnh Ngh\u1ec7 Road from the main My Khe Beach avenue."}, {"address": "235 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 Stars | M\u1ef3 Qu\u1ea3ng is Da Nang\u0027s iconic local noodle dish, and B\u00e0 Mua is one of the city\u0027s most revered historic brands. Located on the beachfront avenue, this branch offers a comfortable dining environment. The signature Shrimp \u0026 Pork M\u1ef3 Qu\u1ea3ng features thick yellow rice noodles bathed in a splash of savory, rich broth, topped with sweet shrimp, quail eggs, tender pork, roasted peanuts, and crispy rice crackers. Toss it together for a chewy, flavorful dish packed with authentic Central Vietnamese heritage.", "name": "B\u00e0 Mua Qu\u1ea3ng Noodles - My Khe Branch (M\u1ef3 Qu\u1ea3ng B\u00e0 Mua - V\u00f5 Nguy\u00ean Gi\u00e1p)", "transport": "Located on the main coastal road, V\u00f5 Nguy\u00ean Gi\u00e1p, near several oceanview hotels; easily walkable."}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "27 Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng, Ph\u01b0\u1edbc M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Located in the An Thuong area near My Khe Beach, this vegan caf\u00e9 is famous for its vibrant, healthy plant-based smoothie bowls and plant-milk coffee. The classic Acai Bowl has a smooth texture reminiscent of semi-melted ice cream, paired with crunchy homemade baked nuts and fresh mango slices for a sweet, refreshing, and beautifully layered taste. The Vegan Tofu Burger features pan-fried wild mushrooms and special vegan cheese, served in a crispy toasted bun with a juicy, flavorful filling. With its modern, minimalist wooden decor and greenery-filled environment, it has become a favorite morning refueling station for Western tourists and digital nomads.", "name": "Roots Plant-based Cafe", "transport": "About a 5-minute walk from My Khe Beach."}, {"address": "56 Ho\u00e0ng K\u1ebf Vi\u00eam, B\u1eafc M\u1ef9 Ph\u00fa, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Advocating organic and mindful eating, BAO AN Vegan focuses on providing natural whole-food dishes free of chemical additives. The signature M\u00ec Qu\u1ea3ng Chay (Vegan Quang Noodles) uses a natural vegetable broth simmered with crispy rice crackers, crushed peanuts, and home-grown organic lettuce, offering a smooth texture with rich herbal and turmeric aromas. The Brown Rice Vegan Sushi Roll wraps chewy brown rice around pan-fried tempeh and fresh cucumber, delivering a crisp, light, and guilt-free bite. The serene, cozy Japanese Zen-style space is highly praised by locals and travelers seeking healthy dining.", "name": "BAO AN Vegan", "transport": "Located in the An Thuong tourist area, about a 7-minute walk along Ho\u00e0ng K\u1ebf Vi\u00eam Street from My Khe Beach."}, {"address": "84 Ho\u00e0ng K\u1ebf Vi\u00eam, B\u1eafc M\u1ef9 Ph\u00fa, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | An exquisite restaurant that reinvents traditional Vietnamese street food with a vegan twist. A must-order is the Ph\u1edf Chay (Vegan Vietnamese Pho), where the broth is simmered for hours with radish, taurant", "transport": "Located in the bustling An Thuong pedestrian area, about a 6-minute walk from My Khe Beach."}, {"address": "108 Nguy\u1ec5n V\u0103n Tho\u1ea1i, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | A cozy little restaurant offering the most authentic Central Vietnamese vegetarian dining experience. Highly recommended is the local B\u00fan B\u00f2 Hu\u1ebf Chay (Vegan Hue Beef Noodle Soup), featuring a broth rich in lemongrass and chili aromas, paired with silky thick rice noodles and tender vegan bean curd skin for a sweet, savory, and spicy delight. The Coconut Vegan Hot Pot uses fresh coconut water as a base, simmered with plenty of seasonal wild greens and mushrooms for a light, guilt-free broth. Exceptionally wallet-friendly, its warm hospitality and authentic recipes draw endless repeat customers.", "name": "Qu\u00e1n Chay T\u00e2m An", "transport": "Located on the main road Nguy\u1ec5n V\u0103n Tho\u1ea1i, just about a 5-minute walk from the My Khe Beach intersection."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Mai H\u1eafc \u0110\u1ebf, An H\u1ea3i Trung, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Located at the junction of the eastern side of the Dragon Bridge and the My Khe Beach commercial area, S\u01a1n Tr\u00e0 Night Market is Da Nang\u0027s most vibrant and lively street food hub at night. The most eye-catching stalls feature freshly grilled Vietnamese pizza (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng) and various charcoal-grilled seafood skewers. Piping hot rice paper is brushed with egg liquid, scallions, pork floss, and cheese, then grilled to a golden crisp. Crunchy with every bite, the savory, rich, and mildly spicy filling pairs perfectly with freshly opened coconut water, offering an immersive taste of Vietnam\u0027s bustling coastal night market vibe\u2014a favorite among tourists and young locals alike.", "name": "S\u01a1n p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Located on the coastal boulevard of My Khe Beach, this popular roadside eatery specializes in traditional B\u00ecnh \u0110\u1ecbnh-style Jumping Shrimp Crispy Pancakes (B\u00e1nh X\u00e8o T\u00f4m Nh\u1ea3y). Made to order with ground rice batter, the bottom is fried to a golden crunch, topped with succulent fresh sea shrimp and bean sprouts. Wrap a hot slice in paper-thin dry rice paper along with herbs, cucumber, and pickled papaya, roll it up, and dip into custom fish sauce or rich peanut sauce. The satisfying crunch of the pancake paired with sweet, bouncy shrimp makes for a refreshing, non-greasy delight loved by travelers.", "name": "B\u00e1nh X\u00e8o T\u00f4m Nh\u1ea3y C\u00f4 Ba", "transport": "Located directly on V\u00f5 Nguy\u00ean Gi\u00e1p coastal boulevard fronting My Khe Beach; easily walkable from major beach hotels."}, {"address": "177 Nguy\u1ec5n V\u0103n Tho\u1ea1i, An H\u1ea3i \u0110\u00f4ng, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Set in the vibrant M\u1ef9 An area near My Khe Beach, this sizzling street snail and seafood stall is a classic spot to experience local \u0027Nh\u1eadu\u0027 (drinking and social dining) night culture. The counter is lined with fresh daily catches of sea snails, clams, and blue crabs, stir-fried with lemongrass, lemongrass coconut milk, garlic chili, or salt-grilled. The signature lemongrass stir-fried snails are plump and chewy, dripping with rich coconut curry and spicy sauce. Paired with a chilled Vietnamese beer and crispy shrimp crackers, it captures the authentic, addictive tropical flavors of this coastal town.", "name": "\u1ed0c K\u1ec1u M\u1ef9 Kh\u00ea Street Seafood", "transport": "Located on the busy main thoroughfare of Nguy\u1ec5n V\u0103n Tho\u1ea1i, about a 7-minute walk from the southern section of My Khe Beach."}, {"address": "42 V\u00f5 V\u0103n Ki\u1ec7t, An H\u1ea3i Trung, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Located at an alley entrance in the My Khe Beach tourist area, this traditional coconut ice cream stall is a favorite summer cooling spot. Serving fresh, high-quality young coconuts from B\u1ebfn Tre province, the hollowed-out whole coconut acts as a bowl filled with velvety vanilla-coconut ice cream, topped with roasted peanuts, toasted coconut flakes, and sweet cherries, served alongside a refreshing glass of fresh coconut water. Smooth and creamy, the fragrant coconut flavor and crunchy toppings create marvelous textures, and you can scrape out the sweet young coconut flesh after finishing the ice cream\u2014a hit with tourists and Instagrammers alike.", "name": "D\u1eeba B\u1ebfn Tre C\u00f4 H\u1eb1ng - Coconut Ice Cream", "transport": "Walk west along V\u00f5 V\u0103n Ki\u1ec7t from My Khe Beach plaza for about 4 minutes to spot the prominent coconut-themed stall."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "My Khe Beach Coastal Resort Area"}, "son_tra": {"categories": {"cat_1": {"items": [{"address": "L\u00f4 11 V\u00f5 Nguy\u00ean Gi\u00e1p, M\u00e2n Th\u00e1i, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | The most iconic, long-standing seafood stall on the Son Tra Peninsula coastline in Da Nang! Famous for its daily fresh catch, diners can personally select live seafood from large tanks and have it cooked to order. Must-try dishes include grilled sweet snails with scallion oil, featuring plump and bouncy meat, and salt and pepper stir-fried crab with sweet, spicy, and savory crab meat. Sitting at the breezy open-air street stall seats, enjoying sea breezes and a table full of seafood, is a truly authentic classic experience loved by locals and tourists alike when visiting Son Tra.", "name": "B\u00e9 M\u1eb7n Seafood Restaurant (H\u1ea3i s\u1ea3n B\u00e9 M\u1eb7n)", "transport": "About a 10-minute drive south from Linh Ung Pagoda along Ho\u00e0ng Sa Road."}, {"address": "95V+2G5, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, An H\u1ea3i Trung, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | A classic Central Vietnamese institution with decades of history, famous for authentic Quang noodles (M\u00ec Qu\u1ea3ng) and signature pork rice paper rolls. The pork rolls feature high-quality pork belly (30% fat, 70% lean), served with an abundant fresh herb platter, paper-thin rice paper, and dipped in rich, aromatic fermented anchovy sauce (M\u1eafm N\u00eam) for a crisp, layered, and non-greasy bite. The M\u00ec Qu\u1ea3ng features a rich broth and fragrant rice noodles, capturing the true essence of traditional Central Vietnamese culinary culture.", "name": "B\u00e0 Mua Quang Noodles \u0026 Pork Rice Paper Rolls (B\u00e1nh Tr\u00e1ng Th\u1ecbt Heo B\u00e0 Mua)", "transport": "About an 8-minute drive after turning onto Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Road from the foot of the Son Tra Peninsula."}, {"address": "1 Ho\u00e0ng Sa, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.1 stars | A well-established local seafood restaurant adjacent to M\u00e2n Th\u00e1i Fishing Port on the Son Tra Peninsula, known for first-hand fresh catch at affordable prices. The signature garlic butter grilled lobster features firm, succulent meat infused with rich creamy garlic flavors, while the steamed flower crab perfectly preserves the natural sweetness of the sea and delicate texture. Their cooking methods preserve traditional Central Vietnamese flavors, making it a favorite for local family gatherings and regulars, and a popular food spot before heading up Son Tra Peninsula.", "name": "N\u0103m \u0110\u1eafc Seafood Restaurant (Nh\u00e0 H\u00e0ng H\u1ea3i S\u1ea3n N\u0103m \u0110\u1eafc)", "transport": "Located on Ho\u00e0ng Sa Road at the entrance of Son Tra Peninsula; visible right at the foot of the mountain when driving or riding a scooter."}, {"address": "82 H\u00e0 Th\u1ecb Th\u00e2n, An H\u1ea3i Trung, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A historic traditional fish cake noodle specialty shop in Son Tra. The signature B\u00fan Ch\u1ea3 C\u00e1 uses fresh daily fish paste handmade into two styles of fish cakes\u2014fried and steamed\u2014offering a firm and elastic texture. The broth is slow-simmered for hours using pumpkin, cabbage, pineapple, and fish bones, resulting in a refreshing, naturally sweet broth with a subtle tangy touch. Paired with delicate rice vermicelli and special chili sauce, every bite reflects decades of unchanged dedication and pure flavors.", "name": "H\u00e0 Th\u1ecb Th\u00e2n Fish Cake Noodles (B\u00fan Ch\u1ea3 C\u00e1 H\u00e0 Th\u1ecb Th\u00e2n)", "transport": "Take a Grab or taxi to H\u00e0 Th\u1ecb Th\u00e2n Street in Son Tra, about a 3-minute drive from the Son Tra end of the Dragon Bridge."}, {"address": "L\u00f4 10 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.0 stars | A popular seafood restaurant along the coastal road leading to Son Tra Peninsula, famous locally for generous portions of live crabs and diverse seafood dishes. The signature stir-fried crab features juicy, plump crab meat infused with a unique savory and spicy sauce; grilled white prawns and basil stir-fried clams are also must-order dishes. The dining area is spacious and comfortable with front-row sea views, making it an ideal spot for a feast after visiting Linh Ung Pagoda.", "name": "Cua Bi\u1ec3n Seafood Restaurant (Nh\u00e0 h\u00e0ng H\u1ea3i S\u1ea3n Cua Bi\u1ec3n)", "transport": "Head north along the coastal avenue V\u00f5 Nguy\u00ean Gi\u00e1p toward Son Tra Peninsula."}, {"address": "L\u00f4 A1-A2 Ph\u1ea1m V\u0103n \u0110\u1ed3ng, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | An iconic traditional Central Vietnamese restaurant chain in Da Nang, with a grand and elegant branch in Son Tra. Its famous \u0027Special Pork Rice Paper Rolls\u0027 features uniquely sliced pork with rind on both edges, wrapped in special double-layered rice paper with over a dozen fresh herbs, and dipped in a secret fermented fish sauce. It offers an incredibly fresh, crisp, and non-greasy taste. With its comfortable and refined atmosphere, it\u0027s a top choice for authentic, delicate Da Nang cuisine.", "name": "Tr\u1ea7n Pork Rolls \u0026 Central Vietnamese Cuisine (\u1ea8m Th\u1ef1c Tr\u1ea7n)", "transport": "Located on Ph\u1ea1m V\u0103n \u0110\u1ed3ng Avenue in Son Tra, about a 2-minute drive from the northern part of My Khe Beach."}, {"address": "L\u00f4 14 V\u00f5 Nguy\u00ean Gi\u00e1p, M\u00e2n Th\u00e1i, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.1 stars | A budget-friendly, long-standing seafood restaurant highly recommended by locals, right on the coastal avenue at the foot of Son Tra. Renowned for great value and uncompromised quality, authentic seafood dishes include signature grilled cuttlefish that is crispy outside and tender inside with a chewy texture, as well as steamed razor clams topped with crushed peanuts and fragrant scallion oil. Without fancy decor, it offers genuine local warmth and the freshest seafood, making it very popular with foodies who love traditional street stall dining.", "name": "M\u01b0\u1eddi \u0110\u00f4 Seafood Restaurant (Nh\u00e0 H\u00e0ng H\u1ea3i S\u1ea3n M\u01b0\u1eddi \u0110\u00f4)", "transport": "Drive along V\u00f5 Nguy\u00ean Gi\u00e1p Avenue toward Son Tra Peninsula; located right along the coast in the M\u00e2n Th\u00e1i area."}, {"address": "254 Nguy\u1ec5n V\u0103n Tho\u1ea1i, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | A famous traditional Binh Dinh-style \u0027jumping shrimp\u0027 crispy pancake shop located in Son Tra. The restaurant insists on using fresh, live small shrimps cooked to order in small cast-iron pans. The pancake edges are golden and crispy while the inner layer retains a soft rice batter texture. Wrapped around sweet, bouncy live shrimp and bean sprouts, paired with sweet and sour fish sauce and refreshing shredded cucumber and radish, every crunchy bite bursts with aroma, perfectly recreating authentic traditional Central Vietnamese street food flavors.", "name": "C\u00f4 Ba Jumping Shrimp Crispy Pancakes (B\u00e1nh X\u00e8o T\u00f4m Nh\u1ea3y C\u00f4 Ba)", "transport": "Take a Grab to Nguy\u1ec5n V\u0103n Tho\u1ea1i Street, near the border of My Khe Beach and Son Tra District."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "Ho\u00e0ng Sa Street, Th\u1ecd Quang, S\u01a1n Tr\u00e0, Da Nang", "feature": "\u2b50 4.5 Stars | Located along the coast of the S\u01a1n Tr\u00e0 Peninsula, this spot is famous for its Santorini-inspired Mediterranean blue-and-white architecture. It offers breathtaking ocean views, with its signature coconut coffee serving up a refreshing, creamy blend of rich coconut aroma and dark roast coffee. The brunch platter features freshly baked sourdough\u2014crispy on the outside, soft on the inside\u2014paired with smoked salmon and poached eggs for rich layers of flavor. It\u0027s a popular landmark for tourists taking Instagram-worthy photos while enjoying the sea breeze.", "name": "S\u01a1n Tr\u00e0 Marina (Santorini Cafe Da Nang)", "transport": "It is recommended to take a Grab or rent a motorbike and drive along Ho\u00e0ng Sa Street towards the S\u01a1n Tr\u00e0 Peninsula."}, {"address": "11 L\u00ea \u0110\u1ee9c Th\u1ecd, Th\u1ecd Quang, S\u01a1n Tr\u00e0, Da Nang", "feature": "\u2b50 4.6 Stars | A green hidden sanctuary tucked away at the foot of S\u01a1n Tr\u00e0 Mountain, surrounded by lush tropical plants. Their Vietnamese Egg Coffee boasts a custard-like smooth texture with whipped egg yolks that are dense and completely odorless, perfectly complementing the intense bittersweet black coffee beneath. The French toast brunch is golden, crispy, and rich with milky flavor, making it a favorite for travelers seeking a serene ambiance and high-quality meals.", "name": "Son Tra Retreat - Garden Lounge \u0026 Eatery", "transport": "Take a Grab taxi from the city center across the bridge to the end of L\u00ea \u0110\u1ee9c Th\u1ecd Street, near the entrance to the S\u01a1n Tr\u00e0 Peninsula."}, {"address": "22 L\u00ea \u0110\u1ee9c Th\u1ecd, Th\u1ecd Quang, S\u01a1n Tr\u00e0, Da Nang", "feature": "\u2b50 4.4 Stars | A trendy hipster cafe that sparked the avocado coffee (C\u00e0 Ph\u00ea B\u01a1) craze in Da Nang. Freshly whipped avocado puree creates an ultra-smooth and rich texture, topped with fragrant toasted coconut chips, and drizzled with espresso for an astonishing blend of sweet, savory, and layered flavors. The vintage Vietnamese decor, affordable prices, and authentic flavors keep both local youth and tourists coming back.", "name": "Tr\u00ecnh C\u00e0 Ph\u00ea - L\u00ea \u0110\u1ee9c Th\u1ecd", "transport": "Located on L\u00ea \u0110\u1ee9c Th\u1ecd Street, about a 5\u20138 minute ride down the mountain road from Linh \u1ee8ng Pagoda."}, {"address": "Tr\u01b0\u01a1ng \u0110\u1ecbnh, M\u1eabn Th\u00e1i, S\u01a1n Tr\u00e0, Da Nang", "feature": "\u2b50 4.3 Stars | Located near M\u1eabn Th\u00e1i Beach at the foot of S\u01a1n Tr\u00e0 Peninsula, specializing in Central-Southern Vietnam\u0027s classic salt coffee. A thick layer of savory-sweet salted cream delivers a velvety texture; a gentle sip reveals a perfect clash between salty freshness and rich condensed milk coffee, sweet without being cloying, with a lingering finish. Outdoor seating offers distant views of the Lady Buddha at Linh \u1ee8ng Pagoda and the beach cityscape.", "name": "M\u1eabn Th\u00e1i Ocean Salt Coffee (C\u00e0 Ph\u00ea Mu\u1ed1i Bi\u1ec3n M\u1eabn Th\u00e1i)", "transport": "Head down from S\u01a1n Tr\u00e0 Peninsula into Tr\u01b0\u01a1ng \u0110\u1ecbnh Street, then walk or ride to M\u1eabn Th\u00e1i Beach."}, {"address": "Ho\u00e0ng Sa, Th\u1ecd Quang, S\u01a1n Tr\u00e0, Da Nang", "feature": "\u2b50 4.2 Stars | An outdoor scenic cafe perched on the oceanfront cliffs of the S\u01a1n Tr\u00e0 Peninsula, featuring unbeatable ocean views and the soothing sound of waves. The cold brew drip coffee has a rich flavor with nutty and dark chocolate notes. Paired with a freshly made Vietnamese fruit yogurt bowl\u2014refreshing, tangy, sweet, and topped generously\u2014it\u0027s the best pit stop after riding around the peninsula and visiting Linh \u1ee8ng Pagoda.", "name": "B\u00e3i C\u00e1t V\u00e0ng Ocean Cafe", "transport": "Drive along Ho\u00e0ng Sa Street deeper into the S\u01a1n Tr\u00e0 Peninsula; located along the coastline en route from Linh \u1ee8ng Pagoda to B\u00e3i B\u1eafc."}, {"address": "Ho\u00e0ng Sa Street, S\u01a1n Tr\u00e0, Da Nang", "feature": "\u2b50 4.1 Stars | A high-altitude scenic cafe located halfway up the S\u01a1n Tr\u00e0 Peninsula, overlooking the entire Da Nang Bay and My Khe Beach. The signature drip milk coffee is rich and smooth with a nicely balanced bittersweet tone. Paired with freshly baked pandan waffles that are lightly crispy on the outside, chewy inside, and infused with rich coconut and taro aroma. Enjoying afternoon tea amidst lingering clouds makes it a favorite for tourists who love panoramic views and stunning photos.", "name": "Ch\u00e2n M\u00e2y Cafe S\u01a1n Tr\u00e0", "transport": "It is recommended to rent a manual motorbike or hire a private car, and drive up Ho\u00e0ng Sa Street towards the higher points of S\u01a1n Tr\u00e0 Mountain to see the sign."}, {"address": "120 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, Da Nang", "feature": "\u2b50 4.5 Stars | A high-rise luxury brunch and scenic lounge located on the northern side of S\u01a1n Tr\u00e0, boasting luxurious views overlooking the S\u01a1n Tr\u00e0 Peninsula where the sea meets the sky. The classic brunch platter features delicate Eggs Benedict and freshly seared sausage, with rich, oozing poached egg yolks. The premium cold brew coffee offers a mildly bright acidity with floral and fruity notes, delivering an extraordinarily refreshing taste. A top choice for beating the heat with a high-quality, delicious brunch.", "name": "Horizon Bar - Four Points by Sheraton Danang", "transport": "Drive north along V\u00f5 Nguy\u00ean Gi\u00e1p Street to the border of S\u01a1n Tr\u00e0 Peninsula; located on the 36th floor of the Four Points by Sheraton hotel."}, {"address": "15 Ho\u00e0ng Sa, Th\u1ecd Quang, S\u01a1n Tr\u00e0, Da Nang", "feature": "\u2b50 4.4 Stars | A cozy, natural wooden hipster cafe near the entrance to the S\u01a1n Tr\u00e0 Peninsula. The signature coconut ice cream coffee is highly recommended, blending rich coconut ice cream with freshly pulled espresso for a luscious contrast of hot and cold, delivering a silky-sweet texture. Brunch options like flaky croissant sandwiches are buttery and layered, perfectly balanced with cheese and ham\u2014drawing many travelers looking for a relaxing morning before visiting Linh \u1ee8ng Pagoda.", "name": "M\u00e2m Coffee \u0026 Tea - S\u01a1n Tr\u00e0", "transport": "Located near the beginning of Ho\u00e0ng Sa Street; easily visible when riding or taking a Grab past the entrance to the S\u01a1n Tr\u00e0 Peninsula."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "InterContinental Danang Sun Peninsula Resort, Bai Bac, Son Tra, Da Nang", "feature": "\u2b50 4.6 stars | A premium scenic restaurant nestled halfway up Son Tra Peninsula, famous for its iconic upside-down conical hat-shaped private booths suspended over the cliff. It offers exquisite classic Vietnamese local dishes and modern Asian cuisine. The \u0027Da Nang Quang Noodles (M\u00ec Qu\u1ea3ng)\u0027 is highly recommended\u2014boasting a rich, savory broth paired with springy handmade rice noodles and fresh seafood for a rich flavor profile. The crispy \u0027Vietnamese Pancake (B\u00e1nh X\u00e8o)\u0027 stuffed with fresh shrimp and bean sprouts, paired with signature peanut dipping sauce, delivers a delightful crunch and sweetness in every bite. Both tourists and high-end local foodies rave about its unbeatable ocean views and exquisite culinary offerings.", "name": "Citron Restaurant", "transport": "Recommended to take a Grab or private charter to the InterContinental Resort on Son Tra Peninsula."}, {"address": "11 Le Van Luong, Tho Quang, Son Tra, Da Nang", "feature": "\u2b50 4.5 stars | Hidden at the foot of Son Tra Peninsula amidst lush greenery, this secret garden lounge seamlessly blends mountain natural scenery with modern stylish design. Specializing in refined local cuisine and craft cocktails, its signature dish \u0027Herb \u0026 Lemongrass Roasted Chicken\u0027 features crispy skin and juicy meat with hints of rich herbs and delicate smoke. The \u0027Charcoal-Grilled Spicy Seafood Platter\u0027 uses daily fresh catches\u2014sweet, plump, and springy\u2014served with a tangy homemade chili-lime sauce to whet your appetite. Its cozy and atmospheric ambiance makes it a perfect spot to relax with a drink and savor quality food after visiting Linh Ung Pagoda.", "name": "Son Tra Retreat - Garden Lounge \u0026 Restaurant", "transport": "About an 8-minute drive down from Linh Ung Pagoda, or take a Grab to Le Van Luong Street."}, {"address": "InterContinental Danang Sun Peninsula Resort, Bai Bac, Son Tra, Da Nang", "feature": "\u2b50 4.7 stars | Helmed by a Michelin-starred chef, this top-tier French-Vietnamese bistro located inside the luxury resort on Son Tra Peninsula recreates the classic mansion architecture of French Indochina. It masterfully combines Central Vietnamese local ingredients with high-end French culinary techniques. Highlights include \u0027Duck Confit with Local Vietnamese Herbs\u0027, featuring golden, crispy skin and melt-in-your-mouth tender meat complemented by elegant herbal notes. With a curated wine collection and impeccable dining service, every visiting gourmet is treated to an extraordinary, sensory-rich luxury feast.", "name": "La Maison 1888", "transport": "Take a Grab or book a resort shuttle to Son Tra Peninsula."}, {"address": "InterContinental Danang Sun Peninsula Resort, Bai Bac, Son Tra, Da Nang", "feature": "\u2b50 4.4 stars | A relaxed ocean-view bistro adjacent to the private beach of Son Tra Peninsula, offering the ultimate dining experience of feeling the sand between your toes. Specializing in grilled fresh seafood and Central Vietnamese local specialties, the \u0027Grilled Lobster with Garlic Butter\u0027 is a must-try\u2014boasting firm, springy meat soaked in rich garlic butter sauce. The \u0027Lime \u0026 Spicy Grilled Squid\u0027 is pleasantly chewy with a subtle smoky aroma. Swaying to the sounds of waves and gentle sea breezes with a cold craft beer or cocktail, this is the perfect venue to soak up the laid-back resort vibe.", "name": "Barefoot Restaurant", "transport": "Take a Grab or private charter to the beach area of InterContinental Danang Resort on Son Tra Peninsula."}, {"address": "Lot 11 Hoang Sa, Tho Quang, Son Tra, Da Nang", "feature": "\u2b50 4.2 stars | An ultra-popular local seafood spot located along Hoang Sa Road at the foot of Son Tra Peninsula, right on the way to Linh Ung Pagoda. Renowned for cooked-to-order, ultra-fresh seafood, popular dishes include \u0027Grilled Razor Clams with Scallion Oil\u0027, offering a tender, bouncy texture infused with rich green onion aroma, and the \u0027Spicy \u0026 Sour Seafood Hotpot\u0027 with a refreshing broth packed with fresh shrimp, squid, and fish fillets that burst with flavor when simmered. The lively atmosphere and authentic local preparation draw long queues of both tourists and locals.", "name": "B\u00e9 M\u1eb7n Seafood Restaurant (Nh\u00e0 h\u00e0ng H\u1ea3i S\u1ea3n B\u00e9 M\u1eb7n)", "transport": "Take a Grab along Hoang Sa Coastal Boulevard to reach."}, {"address": "Hoang Sa, Tho Quang, Son Tra, Da Nang", "feature": "\u2b50 4.1 stars | A local specialty restaurant adjacent to the famous \u0027Green Lake (H\u1ed3 Xanh)\u0027 on Son Tra Peninsula, featuring picturesque mountain-and-lake views and cool, pleasant breezes. The menu highlights regional dishes blending mountain forest and marine ingredients. Highly recommended are the \u0027Salt \u0026 Pepper Soft-Shell Crab\u0027\u2014crispy on the outside, succulent on the inside, and perfectly seasoned to pair with rice\u2014and the \u0027Steamed Grouper with Lemongrass \u0026 Lime\u0027, offering delicate fish meat infused with subtle citrus and lemongrass aromas. Its serene setting and great value authentic flavors make it a popular retreat after exploring Linh Ung Pagoda.", "name": "Green Lake Seafood \u0026 Scenic Restaurant (Nh\u00e0 h\u00e0ng H\u1ea3i S\u1ea3n H\u1ed3 Xanh)", "transport": "About a 5-minute drive down Hoang Sa Road from Linh Ung Pagoda, located right next to Green Lake."}, {"address": "Lot 12 Hoang Sa, Tho Quang, Son Tra, Da Nang", "feature": "\u2b50 4.0 stars | A welcoming local restaurant situated along the Son Tra Peninsula coastline, boasting panoramic ocean views of Da Nang Bay. Insisting on daily catches fresh from local fishermen, it serves authentic Central Vietnamese home-style dishes and seafood fare. The \u0027Sweet \u0026 Sour Stir-Fried Squid\u0027 is perfectly balanced and tender-crisp, making it an ideal companion to rice, while the \u0027Stir-Fried Clams with Lemongrass \u0026 Chili\u0027 features plump, juicy clams with a refreshing spicy kick. Friendly service and mesmerizing ocean views make it a favorite for family gatherings and travelers seeking authentic local tastes.", "name": "Bien Ngoc Son Tra Seafood Restaurant (Nh\u00e0 h\u00e0ng Bi\u1ec3n Ng\u1ecdc S\u01a1n Tr\u00e0)", "transport": "Take a Grab straight down Hoang Sa Road; located near the entrance to Son Tra Peninsula."}, {"address": "412 Hoang Sa, Tho Quang, Son Tra, Da Nang", "feature": "\u2b50 4.1 stars | A long-standing local restaurant located on the coastal avenue of Son Tra Peninsula, famous for its commitment to fresh ingredients and authentic Central Vietnamese seasoning. The signature \u0027Grilled Seafood Rice Paper Roll\u0027 wraps fresh grilled shrimp and squid inside delicate rice paper with plenty of fresh herbs and dipping sauce, offering a clean, multi-layered taste. The \u0027Steamed Flower Crab in Coconut Water\u0027 allows the sweet crab meat to absorb natural coconut subtle sweetness. Spacious with a true local atmosphere, it is a great spot to enjoy authentic regional specialties after visiting Son Tra Peninsula and Linh Ung Pagoda.", "name": "Cay Dua 1 Local Seafood Restaurant (Nh\u00e0 h\u00e0ng C\u00e2y D\u1eeba 1)", "transport": "Take a Grab or ride a scooter along Hoang Sa Coastal Road to arrive."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Ch\u00f9a Linh \u1ee8ng, B\u00e3i B\u1ee5t, Ho\u00e0ng Sa, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Located inside Linh Ung Pagoda, this free vegetarian hall serves fresh local vegetables and traditional Vietnamese tofu dishes. The food is refreshing and non-greasy, featuring signature stir-fried lemongrass tofu and vegetable spring rolls with crispy wrappers and sweet fillings. It attracts pilgrims and tourists visiting the Lady Buddha to experience a tranquil dining atmosphere.", "name": "Linh Ung Pagoda Vegetarian Dining Hall", "transport": "Take a Grab or taxi from Da Nang city center to Linh Ung Pagoda on Son Tra Peninsula; the ride takes about 20 minutes."}, {"address": "L\u00ea \u0110\u1ee9c Th\u1ecd, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | An exquisite vegetarian restaurant located at the foot of Son Tra Peninsula. Its signature mushroom coconut soup is wonderfully sweet and light with melt-in-your-mouth coconut meat. Paired with special vegetarian pho, the broth is rich yet light on the stomach. Locals and tourists alike praise its elegant presentation and serene environment, making it a top pick to recharge after exploring Son Tra.", "name": "Lien Hoa Vegetarian Restaurant (Qu\u00e1n Chay Li\u00ean Hoa - S\u01a1n Tr\u00e0)", "transport": "Take a Grab or ride a motorbike along L\u00ea \u0110\u1ee9c Th\u1ecd Street towards Son Tra Peninsula to reach the restaurant."}, {"address": "Ng\u00f4 Quy\u1ec1n, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | This budget-friendly vegetarian eatery is famous for its diverse vegetarian buffet. Choose from over ten freshly made plant-based dishes. The signature vegetarian char siu is pleasantly chewy with a balanced sweet-and-savory flavor, served alongside Thai jasmine rice and sweet-and-sour vegetable soup. It is well-loved by local pilgrims visiting Linh Ung Pagoda.", "name": "Bo De Tam Vegetarian Eatery (Qu\u00e1n Chay B\u1ed3 \u0110\u1ec1 T\u00e2m)", "transport": "Take Bus No. 12 or a taxi and get off at the intersection of Ng\u00f4 Quy\u1ec1n Street and L\u00ea \u0110\u1ee9c Th\u1ecd Street."}, {"address": "Ho\u00e0ng Sa, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Specializing in vegetarian B\u00e1nh X\u00e8o (Vietnamese crispy pancakes) and vegetarian Mi Quang. The pancakes feature a golden, ultra-crispy crust packed with bean sprouts, king oyster mushrooms, and seasoned soy products. Dipped in a rich peanut-sesame sauce, it offers vibrant layers of flavor, allowing vegetarian travelers to savor authentic Central Vietnamese street food.", "name": "Tu Tam Vegetarian Pancakes (Qu\u00e1n Chay T\u1eeb T\u00e2m - B\u00e1nh X\u00e8o Chay)", "transport": "Head along the Ho\u00e0ng Sa coastal road toward Son Tra Peninsula; located near Th\u1ecd Quang Fishing Port."}, {"address": "Y\u1ebft Ki\u00eau, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Widely acclaimed for its herbal vegetarian hotpot and Thai-style spicy and sour hotpot. The broth is simmered for hours using fresh fruits, vegetables, and traditional Chinese herbs, offering a naturally sweet aftertaste. Ingredients include mountain mushrooms, tender tofu, and indigenous Vietnamese wild greens, making it a very popular dining spot around Son Tra.", "name": "An Lac Vegetarian Hotpot \u0026 Restaurant (Nh\u00e0 H\u00e0ng Chay An L\u1ea1c)", "transport": "Take a taxi directly to Y\u1ebft Ki\u00eau Street in the Th\u1ecd Quang ward."}, {"address": "Nguy\u1ec5n Panh, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Highlights Central Vietnam\u0027s specialty vegetarian Mi Quang. The vibrant turmeric noodles are pleasantly springy, drizzled with a rich mushroom and peanut broth, and topped with crunchy peanuts, plant-based slices, and fresh herbs. A delicious, fragrant meal option on the way to Linh Ung Pagoda.", "name": "Tinh Tam Vegetarian Mi Quang (Qu\u00e1n Chay T\u1ecbnh T\u00e2m - M\u00ec Qu\u1ea3ng Chay)", "transport": "Ride a motorbike or take a Grab to Nguy\u1ec5n Panh Street."}, {"address": "Tr\u01b0\u01a1ng Sa, M\u1eabn Th\u00e1i, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Features an antique, tranquil ambiance. Recommended dishes include handmade vegetarian rice paper rolls and coconut vegetarian curry. The fresh rice rolls wrap purple cabbage, mint, and pan-fried mock duck, served with a sweet and sour lime dipping sauce; the creamy coconut curry goes perfectly with crispy French baguette slices.", "name": "Giac Ngo Handmade Vegetarian (Qu\u00e1n Chay Gi\u00e1c Ng\u1ed9)", "transport": "Drive along Tr\u01b0\u01a1ng Sa Street next to M\u1eabn Th\u00e1i Beach for about 5 minutes."}, {"address": "Phan B\u1ed9i Ch\u00e2u, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | A hidden gem vegetarian spot that wins foodies over with refreshing vegetarian pho and crispy Vietnamese rice paper pizza (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng). The pho broth boasts natural fruit and vegetable sweetness, fragrant with sliced plant-based beef and Thai basil. The rice paper pizza is potato-chip crispy, topped with vegetarian meat floss and secret sauce.", "name": "Green Clean Vegetarian Pho \u0026 Rice Paper Pizza (Qu\u00e1n Chay S\u1ea1ch Green)", "transport": "Take a Grab motorbike to Phan B\u1ed9i Ch\u00e2u Street."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Ho\u00e0ng Sa, Ph\u01b0\u1eddng Th\u1ecd Quang, Qu\u1eadn S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Located along the coastal road of the Son Tra Peninsula, this popular street food stall is famous for its made-to-order \u0027Vietnamese Pizza\u0027 (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng). A paper-thin rice paper base is grilled over charcoal until golden and extra crispy, then brushed with tender quail eggs, rich butter, scallions, shredded dried beef, and a signature sweet-and-spicy sauce. Taking a bite yields an insanely satisfying crunch, releasing bursts of scallion and egg aromas complemented by a rich, sweet-and-spicy sauce that balances the savory notes. Whether for locals taking an evening stroll or tourists heading to Linh Ung Pagoda, stopping by for a slice to eat while taking in the magnificent sea view is an absolute must.", "name": "Son Tra Peninsula Grilled Rice Paper (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng B\u00e9 Ni - S\u01a1n Tr\u00e0)", "transport": "Take a taxi or ride a motorbike along the Ho\u00e0ng Sa coastal road toward the Son Tra Peninsula to arrive."}, {"address": "\u0110\u01b0\u1eddng Ho\u00e0ng Sa, Ph\u01b0\u1eddng Th\u1ecd Quang, Qu\u1eadn S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | At the base of the winding road to Linh Ung Pagoda, a collection of highly popular refreshing coconut dessert stalls awaits. Their signature offerings are chilled freshly opened whole coconuts and two-layered \u0027Whole Coconut Jelly\u0027 (Ch\u00e8 D\u1eeba Tr\u00e1i) set inside the shell using natural coconut water. The top layer is rich, creamy coconut milk jelly, while the bottom layer is crystal-clear, refreshing pure coconut water jelly. Silky-smooth and melt-in-your-mouth, it carries a delicate natural sweetness. On a hot Vietnamese afternoon, sitting on roadside plastic chairs, sipping chilled coconut water, scooping smooth coconut jelly, and gazing out over the azure harbor is a traveler favorite on Son Tra Peninsula.", "name": "Son Tra Coastal Coconut Jelly \u0026 Fresh Coconut Water Stall (Ch\u00e8 D\u1eeba Tr\u00e1i S\u01a1n Tr\u00e0 - Ho\u00e0ng Sa)", "transport": "From Da Nang city center, head straight along Vo Nguyen Giap onto Ho\u00e0ng Sa Road; you will see the roadside stalls past Man Thai Beach."}, {"address": "76 L\u00ea \u0110\u1ee9c Th\u1ecd, Ph\u01b0\u1eddng Th\u1ecd Quang, Qu\u1eadn S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Tucked away at the foot of Son Tra Mountain, this authentic eatery is a fantastic spot to sample Central Vietnam\u2019s traditional crispy pancakes (B\u00e1nh X\u00e8o) and grilled lemongrass pork skewers (Nem L\u1ee5i). The freshly fried turmeric rice crepe features a super golden, crispy crust loaded with fresh shrimp, sliced pork, and crunchy bean sprouts. Wrap pieces of pancake with fresh herbs, basil, cilantro, and green mango strips in thin rice paper, then dip into the house-special rich sauce made from pork liver, peanuts, and sesame. Rich in layers with crisp exterior, tender interior, and a harmony of sweet, sour, and savory flavors, it\u0027s a hit among foodies and tourists alike.", "name": "Son Tra 76 Vietnamese Pancakes \u0026 Lemongrass Pork Skewers (B\u00e1nh X\u00e8o \u0026 Nem L\u1ee5i 76 S\u01a1n Tr\u00e0)", "transport": "Take a Grab car or motorbike to near the intersection of L\u00ea \u0110\u1ee9c Th\u1ecd and Ho\u00e0ng Sa Road."}, {"address": "B\u00e3i bi\u1ec3n M\u1eabn Th\u00e1i, \u0110\u01b0\u1eddng Ho\u00e0ng Sa, Qu\u1eadn S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Situated next to Man Thai Fishing Village at the entry of Son Tra Peninsula, these street seafood stalls serve fresh, affordable ocean delicacies straight from the catch. Highlights include made-to-order grilled scallops with scallion oil (S\u00f2 \u0110i\u1ec7p N\u01b0\u1edbng M\u1ee1 H\u00e0nh) and fried baby squid with fish sauce (M\u1ef1c Chi\u00ean M\u1eafm). The scallops are plump and chewy, dressed in sizzling scallion oil and crunchy roasted peanuts for a juicy, sweet mouthful; the fried baby squid is crispy outside, tender inside, with a savory, lightly spicy flavor. As dusk falls, lit-up stalls attract crowds of tourists and locals enjoying authentic harbor snacks in the sea breeze.", "name": "Man Thai Beach Street Seafood Stalls (Ch\u1ee3 H\u1ea3i S\u1ea3n M\u1eabn Th\u00e1i Street Food)", "transport": "Take a taxi to the street seafood stall area along Man Thai Beach (B\u00e3i bi\u1ec3n M\u1eabn Th\u00e1i)."}, {"address": "\u0110i\u1ec3m Stopover Ho\u00e0ng Sa, Ph\u01b0\u1eddng Th\u1ecd Quang, Qu\u1eadn S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Located near a scenic viewpoint halfway up the Son Tra Peninsula, this mobile dessert stall serves Da Nang\u0027s iconic street dessert, avocado ice cream (Kem B\u01a1). Freshly ripened butter avocados from the Vietnamese highlands are blended into a silky, rich puree, topped with a scoop of sweet coconut milk ice cream, and finished with a generous sprinkle of toasted coconut flakes and roasted peanuts. Stir slightly before enjoying: the buttery richness of avocado fuses delightfully with cool coconut sweet ice cream, while crispy coconut chips add a fun crunch\u2014a must-try refreshing treat on your way to Linh Ung Pagoda.", "name": "Son Tra Viewpoint Avocado Ice Cream (Kem B\u01a1 S\u01a1n Tr\u00e0 Viewpoint)", "transport": "Ride a motorbike or hire a private vehicle along Ho\u00e0ng Sa winding road toward Linh Ung Pagoda; stop at the roadside scenic view stopover."}, {"address": "G\u00f3c \u0111\u01b0\u1eddng Y\u1ebft Ki\u00eau \u0026 Ho\u00e0ng Sa, Ph\u01b0\u1eddng Th\u1ecd Quang, Qu\u1eadn S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | A popular walking snack unique to the street stalls along the Son Tra Peninsula coastline. Unlike standard Banh Mi, the baguette is sliced open, brushed generously with sweet butter and spicy chili sauce, then flattened and grilled over charcoal until ultra-crispy. It is then topped with flavorful pork floss (Ch\u00e0 B\u00f4ng), quail eggs, and scallions. One bite yields a crackling crunch as warm buttery aromas and sweet-savory pork floss melt in your mouth\u2014an addictive blend of sweet, salty, and spicy, perfect for munching while strolling along the beach.", "name": "Son Tra Coastal Crispy Butter \u0026 Pork Floss Banh Mi (B\u00e1nh M\u1ef3 Ch\u00e0 B\u00f4ng N\u01b0\u1edbng S\u01a1n Tr\u00e0)", "transport": "Located in the street food cluster near the intersection of Y\u1ebft Ki\u00eau and Ho\u00e0ng Sa streets; take a taxi to the foot of Son Tra Mountain to find it."}, {"address": "Ch\u00e2n n\u00fai S\u01a1n Tr\u00e0, \u0110\u01b0\u1eddng Ho\u00e0ng Sa, Qu\u1eadn S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Pushed on wooden handcarts by elderly vendors near the foot of Linh Ung Pagoda, this traditional food cart sells authentic old-fashioned tofu pudding (T\u00e0u H\u1ee7). Handcrafted with an extraordinarily delicate, silky-smooth texture akin to white silk, it melts instantly on the tongue with pure soy fragrance. Drizzled with warm, rich golden ginger syrup and topped with chewy tapioca pearls, the mild heat of the ginger warms away the ocean breeze\u0027s chill, while the sweet syrup highlights the tender pudding. Preserving decades-old traditional flavors, this nostalgic dessert is a cherished favorite for food lovers.", "name": "Son Tra Mountain Foot Traditional Ginger Tofu Pudding Cart (T\u00e0u H\u1ee7 Xe \u0110\u1ea9y S\u01a1n Tr\u00e0)", "transport": "Located near the entrance at the foot of Son Tra Mountain near Ho\u00e0ng Sa Road; look for mobile handcart vendors along the street."}, {"address": "25 Ng\u00f4 Cao Th\u01a1m, Ph\u01b0\u1eddng Th\u1ecd Quang, Qu\u1eadn S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | A classic, well-known street food stall in the Son Tra district selling \u0027B\u00e1nh K\u1eb9p\u0027 (soft or crisp stuffed grilled rice paper). Unlike dry-grilled rice paper, their highlight is \u0027B\u00e1nh K\u1eb9p Tr\u1ee9ng C\u00fat D\u1ebbo\u0027 (soft grilled rice paper with soft-boiled quail egg). The rice paper is spread with savory p\u00e2t\u00e9, dried beef, scallion oil, and soft-boiled quail eggs, then grilled until the exterior is lightly charred while keeping the inside gooey and moist. Cut into bite-sized pieces and dipped in the house-special sweet-and-sour liver sauce, it offers a chewy, juicy, savory explosion\u2014a rich creamy yolk blending perfectly with fragrant p\u00e2t\u00e9. Highly recommended as a late-night snack by youth and travelers.", "name": "Son Tra Cau Ba Stuffed Grilled Rice Paper (B\u00e1nh K\u1eb9p C\u1eadu Ba S\u01a1n Tr\u00e0)", "transport": "Take a Grab to Ng\u00f4 Cao Th\u01a1m Street; it is only a 3-minute drive from the Son Tra coastal road."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Son Tra Peninsula and Linh Ung Pagoda Scenic Area"}, "thanh_khe": {"categories": {"cat_1": {"items": [{"address": "K424/09 L\u00ea Du\u1ea9n, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.3 stars | A decades-old staple famous for authentic Central Vietnamese fermented fish sauce noodles (B\u00fan M\u1eafm N\u00eam). As soon as it\u0027s served, the rich and distinct aroma of fermented fish sauce fills the air. Toppings include boiled pork belly, crispy roasted pork, peanuts, and green banana slices. Richly layered in texture, the soft rice noodles absorb the savory, tangy, and sweet signature fish sauce. Paired with crisp fresh lettuce and savory roasted pork fat, every bite delivers a powerful burst of traditional flavor\u2014highly recommended by local foodies and adventurous travelers.", "name": "B\u00e0 Thuy\u00ean Fermented Fish Sauce Noodle Soup (B\u00fan M\u1eafm N\u00eam B\u00e0 Thuy\u00ean)", "transport": "About an 8-minute drive from Da Nang International Airport. Follow Nguy\u1ec5n V\u0103n Linh, turn onto L\u00ea Du\u1ea9n, and locate it inside the alleyway."}, {"address": "235 Nguy\u1ec5n V\u0103n Linh, Th\u1ea1c Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.2 stars | One of Da Nang\u0027s most iconic Quang noodle brands, located in a bustling district near the airport. The restaurant makes thick, chewy turmeric rice noodles fresh daily, coated in a concentrated, flavorful broth simmered from shrimp and pork. Toppings include fresh white shrimp, quail eggs, and crunchy peanuts, served with large crispy rice crackers to crush and mix in. Offering a rich and vibrant texture, the springy noodles absorb the savory broth, complemented by nutty peanuts and fresh cilantro. A beloved favorite among locals and tourists alike.", "name": "B\u00e0 Mua Quang Noodle (M\u00ec Qu\u1ea3ng B\u00e0 Mua - Nguy\u1ec5n V\u0103n Linh)", "transport": "Only about a 5-minute drive from Da Nang International Airport, located directly on the main street of Nguy\u1ec5n V\u0103n Linh."}, {"address": "478 L\u00ea Du\u1ea9n, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.4 stars | A classic old shop specializing in traditional Central Vietnamese \u0110\u1ea1i L\u1ed9c-style pork rice paper rolls. Perfectly marbled, tender boiled pork belly with chewy skin is thinly sliced and wrapped in delicate rice paper along with cucumber, fresh herbs, and shredded green mango. Dipped into well-balanced anchovy sauce (M\u1eafm N\u00eam), the soft bite of rice paper and crisp veggies hits first, followed by the sweetness of the pork and the savory, spicy depth of the fish sauce. A must-try traditional delicacy when visiting Thanh Kh\u00ea District.", "name": "\u0110\u1ea1i L\u1ed9c Ngon Pork Rice Paper Rolls (B\u00e1nh Tr\u00e1ng Th\u1ecbt Heo \u0110\u1ea1i L\u1ed9c Ngon)", "transport": "About a 7-minute walk from Da Nang Railway Station, or a 9-minute drive from the airport."}, {"address": "248 H\u00e0 Huy T\u1eadp, H\u00f2a Kh\u00ea, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.5 stars | A famous traditional eatery renowned for its \u0027jumping shrimp pancakes\u0027, made exclusively with fresh, lively shrimp sourced daily. The golden, crispy pancake base yields a satisfying crunch with every bite, stuffed with sweet, bouncy mini shrimp and crisp bean sprouts. Served with a generous platter of fresh greens and a sweet peanut dipping sauce. The aromatic charred crust perfectly harmonizes with the sweet seafood, making it crisp, non-greasy, and a top choice for local family dinners and tourist food itineraries.", "name": "C\u00f4 Ba Jumping Shrimp Crispy Pancakes (B\u00e1nh X\u00e8o T\u00f4m Nh\u1ea3y C\u00f4 Ba)", "transport": "About a 6-minute taxi ride from Da Nang International Airport to the H\u00e0 Huy T\u1eadp street section."}, {"address": "394 H\u00f9ng V\u01b0\u01a1ng, V\u0129nh Trung, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.1 stars | A long-standing eatery in Thanh Kh\u00ea District specializing in old-school fish cake noodle soup. The broth is slow-simmered for hours using fresh fish bones, pumpkin, pineapple, and tomatoes, resulting in a rich, savory flavor with a natural sweet and subtle tangy note. The handmade fish cakes are bouncy, flavorful, and incredibly fresh. Soft rice noodles soak up the comforting broth, complemented by pickled bamboo shoots and fresh herbs\u2014light and refreshing, drawing crowds of locals every morning and afternoon for a taste of home.", "name": "B\u00e0 L\u1eadp Traditional Fish Cake Noodle Soup (B\u00fan Ch\u1ea3 C\u00e1 B\u00e0 L\u1eadp)", "transport": "Located near Big C (GO!) Shopping Center, about a 7-minute drive from Da Nang Airport."}, {"address": "401 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, H\u00f2a Kh\u00ea, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.4 stars | A classic Hu\u1ebf beef noodle soup shop hidden along \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Boulevard. The broth is simmered for hours with plenty of lemongrass, shrimp paste, and beef bones, giving it a vibrant reddish hue and a rich, deeply savory flavor with an addictive kick of spice. Smooth, thick round rice noodles are served with tender beef brisket, chewy beef tendon, and silky pork blood pudding for incredible texture. Many departing travelers make a special stop here to savor this authentic taste of Central Vietnam before leaving.", "name": "B\u00e0 Th\u1ee7y Hu\u1ebf Beef Noodle Soup (B\u00fan B\u00f2 B\u00e0 Th\u1ee7y)", "transport": "About a 5-minute drive from the north exit of Da Nang International Airport to the \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 street section."}, {"address": "175 H\u1ea3i Ph\u00f2ng, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.6 stars | One of the original branches of Da Nang\u0027s most famous traditional dessert brand. Its signature \u0027Durian Coconut Milk Dessert Soup (Ch\u00e8 Th\u00e1i S\u1ea7u Ri\u00eang)\u0027 is famous across Vietnam, featuring premium durian flesh paired with fresh jackfruit strips, boba pearls, and rich handmade coconut milk. Smooth and creamy in texture, the durian flavor is rich without being overwhelming, beautifully complemented by coconut cream
