 C (GO!) Shopping Center; about a 5-minute drive from the airport."}, {"address": "122 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic Curcuma Cream (turmeric cream), Pomelo anti-hair loss shampoo, Bamboo charcoal deep cleansing mask. Thorakao is a national-heritage Vietnamese beauty brand with decades of history, famous nationwide for its natural turmeric and herbal formulas. This specialty store in Thanh Kh\u00ea retains vintage packaging and extremely affordable prices\u2014a secret spot for insiders looking for traditional Vietnamese skincare classics.", "name": "Thorakao Official Dealer - Thanh Kh\u00ea (Classic Heritage Brand)", "transport": "Drive along \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Road; about a 3-minute drive from Thanh Kh\u00ea Park."}, {"address": "268 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-Buy List: Sacidic herbal acne essence, Milaganics cold-pressed coconut oil, Vietnamese natural strawberry color-changing lip balm. Beauty Garden is a beloved local cosmetics chain in Central and Southern Vietnam. The \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 store sits in the heart of Thanh Kh\u00ea\u0027s traditional commercial district, displaying emerging local skincare and fragrance brands at transparent prices with friendly service.", "name": "Beauty Garden Cosmetics - \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Branch", "transport": "About a 4-minute drive from Da Nang Railway Station, or a 7-minute taxi ride from the airport."}, {"address": "350 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, H\u00f2a Kh\u00ea, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-Buy List: Traditional White Tiger Balm, Dermatoniton herbal acne gel, Golden Star Balm (Cao Sao V\u00e0ng). Long Ch\u00e2u is one of Vietnam\u0027s largest pharmacy chains. Located on the main \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 thoroughfare in Thanh Kh\u00ea, it offers not just medicines but also herbal health products, traditional herbal balms, essential oils, and medical-grade local repair creams with guaranteed quality.", "name": "Long Ch\u00e2u Pharmacy - \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Branch", "transport": "About a 6-minute drive heading north from Da Nang International Airport."}, {"address": "486 L\u00ea Du\u1ea9n, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-Buy List: Naexy Centella repair cream, C\u1ecf M\u1ec1m herbal lip balm, B\u1ea3o Ph\u01b0\u01a1ng green tea antioxidant essential oil. Located at the intersection of Thanh Kh\u00ea and the L\u00ea Du\u1ea9n shopping district, Nuty Cosmetics is a trendy local favorite. Beyond international brands, it features a dedicated section for emerging Vietnamese brands offering aesthetic artisanal fragrances, herbal soaps, and handmade skincare items perfect for souvenirs.", "name": "Nuty Cosmetics - L\u00ea Du\u1ea9n Branch", "transport": "About a 6-minute walk from Da Nang Railway Station, or an 8-minute drive from the airport."}, {"address": "158 Nguy\u1ec5n V\u0103n Linh, V\u0129nh Trung, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: B\u1ea3o Thanh herbal throat lozenges, Vietnamese Ph\u1eadt Linh oil, Thorakao turmeric facial cleanser. Pharmacity is a ubiquitous modern pharmacy chain in Vietnam. This spacious flagship store near the airport features a dedicated Vietnamese specialty herbal skincare section, combining traditional Vietnamese herbal wisdom with modern cosmetics. It is the perfect last stop to stock up on local ointments and cosmetics before heading home.", "name": "Pharmacity Flagship Store - Nguy\u1ec5n V\u0103n Linh Branch 2", "transport": "Just a 4-minute drive from Da Nang International Airport, making transportation extremely convenient."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "236 L\u00ea Du\u1ea9n, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-Buy List: Linen-style casual shirts, Korean-style graphic T-shirts, women\u0027s high-waisted wide-leg trousers. A large budget-friendly chain apparel brand founded locally in Da Nang. Its flagship store on L\u00ea Du\u1ea9n Street in Thanh Kh\u00ea District is immensely popular among local college students and young professionals. The store mainly features resort-wear and Korean everyday casual styles for men and women, with breathable fabrics tailored for Southeast Asia\u0027s hot climate. With super affordable prices, it\u0027s a quintessential local staple.", "name": "FM Style Casual Fashion (FM Style L\u00ea Du\u1ea9n)", "transport": "Take a taxi or Grab to near the intersection of L\u00ea Du\u1ea9n and Tr\u1ea7n Cao V\u00e2n roads."}, {"address": "09 Nguy\u1ec5n V\u0103n Linh, B\u00ecnh Hi\u00ean, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: Biti\u0027s Hunter lightweight breathable running shoes, stylish woven sandals, classic durable kids\u0027 sneakers. Biti\u0027s is Vietnam\u0027s household national footwear brand, which has successfully rebranded into a trendy street fashion label in recent years thanks to its popular Biti\u0027s Hunter series. Located on the main thoroughfare of Nguy\u1ec5n V\u0103n Linh in Thanh Kh\u00ea District, this flagship store offers a complete selection of styles. Renowned for exceptional durability and comfort, its casual shoes and sandals are the top local choice for travel or daily wear.", "name": "Biti\u0027s National Footwear Specialty Store (Biti\u0027s Hunter Nguy\u1ec5n V\u0103n Linh)", "transport": "About a 5-minute drive from Da Nang International Airport, located on Nguy\u1ec5n V\u0103n Linh Boulevard."}, {"address": "261 L\u00ea Du\u1ea9n, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-Buy List: Hipster-style cotton/linen dresses, tailored graphic tees, minimalist leather shoulder bags. A charming independent boutique situated on L\u00ea Du\u1ea9n\u0027s fashion street in Thanh Kh\u00ea District, focusing on minimalist, artistic, and trendy street styles. With new arrivals updated weekly, it is a favorite spot for local Instagrammers and youth in Da Nang. The clothing designs are unique enough to avoid outfit clashes, and accessories like leather handbags and hats are equally distinctive.", "name": "XonXit Trendy Apparel for Men \u0026 Women (XonXit Shop \u0110\u00e0 N\u1eb5ng)", "transport": "Take a city bus or Grab to the L\u00ea Du\u1ea9n shopping street area, then walk right over."}, {"address": "301 L\u00ea Du\u1ea9n, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-Buy List: French retro floral dresses, beach vacation backless dresses, refined soft leather tote bags. N\u00e2u Boutique is a local independent clothing brand immensely popular among women in Da Nang\u0027s Thanh Kh\u00ea District, specializing in French light-luxury and tropical island resort styles. The interior features cozy wooden tones, and the clothes are mostly crafted from breathable, cool fabrics with cuts tailored comfortably for Asian body shapes.", "name": "N\u00e2u Women\u0027s Boutique (N\u00e2u Boutique)", "transport": "About an 8-minute walk along L\u00ea Du\u1ea9n Road from Da Nang Railway Station."}, {"address": "142 H\u00e0 Huy T\u1eadp, H\u00f2a Kh\u00ea, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade rattan/straw bucket bags, Vietnamese printed silk scarves, hand-embroidered canvas totes. An independent craft grocery and accessory shop located in the H\u00e0 Huy T\u1eadp area of Thanh Kh\u00ea District, specializing in handmade woven bags that fuse traditional Vietnamese craftsmanship with modern aesthetics. The rattan bags feature delicate craftsmanship and trendy designs, perfect for pairing with beach resort outfits in Da Nang. A must-visit specialty shop for tourists.", "name": "M\u00e2y Specialty Woven Bags \u0026 Accessories (M\u00e2y Store \u0110\u00e0 N\u1eb5ng)", "transport": "Located in Thanh Kh\u00ea District north of the airport; about a 7-minute Grab ride away."}, {"address": "125 Nguy\u1ec5n V\u0103n Linh, Nam D\u01b0\u01a1ng, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Must-Buy List: Top-grain cowhide men\u0027s bifold wallets, bespoke handmade leather shoes, vintage handcrafted leather briefcases. This local leather workshop focuses on crafting high-quality handmade leather footwear and bags, enjoying top reviews in the commercial district near the airport in Thanh Kh\u00ea. Every product is hand-stitched by local artisans using durable leather that develops a lovely patina over time. Custom engraving services are also available at surprisingly affordable prices.", "name": "Gia T\u1ed9c Handmade Leather Crafts (Gia T\u1ed9c Leather Crafts)", "transport": "Located on Nguy\u1ec5n V\u0103n Linh Boulevard connecting to the airport, highly convenient to reach."}, {"address": "132 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Must-Buy List: Stylish platform strap sandals, Korean-style leather crossbody bags, Martens-style ankle boots. Salavi is a flagship store for affordable fashion footwear and bags in Da Nang, highly favored by students in Thanh Kh\u00ea District. The shop carries a wide variety of trendy shoes and bags with rapid turnover of new styles at budget-friendly prices\u2014offering everything from comfortable sandals for sightseeing to chic bags for daily wear.", "name": "Salavi Trendy Shoes \u0026 Bags for Men \u0026 Women (Salavi Shop \u0110\u00e0 N\u1eb5ng)", "transport": "Located on \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, a main thoroughfare in Thanh Kh\u00ea District; easily reachable by bus or Grab."}, {"address": "284 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-Buy List: Genuine cowhide men\u0027s sandals, durable genuine leather casual shoes, portable genuine leather key pouches. T\u00e0i L\u1ed9c is a long-standing local handmade shoe store rooted in Thanh Kh\u00ea District for years, renowned for genuine materials and exceptional comfort and durability. It is the top choice for locals looking to buy work shoes or casual leather sandals. The owner insists on using high-quality leather at prices far lower than big brand chains, showcasing the warm local hospitality and craftsmanship of Da Nang\u0027s traditional commercial district.", "name": "T\u00e0i L\u1ed9c Heritage Leather Shoes \u0026 Bags (T\u00e0i L\u1ed9c Shoes \u0026 Leather)", "transport": "About a 6-minute drive from Da Nang International Airport, easily accessible by taxi."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "274 Nguy\u1ec5n Tri Ph\u01b0\u01a1ng, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-Buy List: Da Nang specialty dried beef (B\u00f2 kh\u00f4), Vietnamese river goby/anchovies in sweet and spicy sauce (C\u00e1 b\u1ed1ng s\u00f4ng Tr\u00e0), roasted coconut crackers (B\u00e1nh d\u1eeba n\u01b0\u1edbng). Located just a 5-minute drive from the airport, this large souvenir supermarket is the ultimate last-minute shopping stop for many travelers before boarding. Prices are transparent and the selection is remarkably complete, offering everything from Central Vietnam\u0027s famous dried seafood to local specialties. The house-packaged spicy dried beef and honey-glazed small dried fish are highly recommended\u2014perfectly balanced in sweet and savory flavors, making them fantastic snacks to pair with drinks or bring home to friends and family.", "name": "Thien Phu Specialty Supermarket - Nguyen Tri Phuong Branch (Si\u00eau Th\u1ecb \u0110\u1eb7c S\u1ea3n Thi\u00ean Ph\u00fa - Nguy\u1ec5n Tri Ph\u01b0\u01a1ng)", "transport": "About a 5-minute taxi ride from Da Nang International Airport terminals."}, {"address": "200 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: Traditional roasted sesame rice crackers (B\u00e1nh kh\u00f4 m\u00e8), maltose puffed rice cakes (B\u00e1nh n\u1ed5), cane sugar peanut candy (K\u1eb9o \u0111\u1eadu ph\u1ee5ng). Ba Lieu Me is a traditional pastry brand representing Da Nang\u0027s intangible cultural heritage with decades of history. Its flagship item, \"B\u00e1nh kh\u00f4 m\u00e8\", is made from white rice, glutinous rice, maltose, and toasted white sesame seeds. It offers a light, crispy texture that melts into a soft chewiness, rich with sesame aroma and cane sugar sweetness. The branch on Dien Bien Phu Street in Thanh Khe District is well-stocked and features elegant packaging, making it a culturally meaningful must-buy souvenir.", "name": "Ba Lieu Me Traditional Sesame Rice Cracker Shop - Dien Bien Phu Branch (B\u00e1nh Kh\u00f4 M\u00e8 B\u00e0 Li\u1ec5u M\u1eb9 - \u0110i\u1ec7n Bi\u00ean Ph\u1ee7)", "transport": "About a 6-minute scooter ride from Da Nang Railway Station along L\u00ea Du\u1ea9n onto \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Street."}, {"address": "04 Duy T\u00e2n, H\u00f2a Thu\u1eadn Nam, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng (Boundary between Thanh Khe and airport commercial area)", "feature": "\u2b50 4.4 stars | Must-Buy List: Sun-dried semi-dry squid (M\u1ef1c m\u1ed9t n\u1eafng), Da Nang specialty cashews (H\u1ea1t \u0111i\u1ec1u rang mu\u1ed1i), Da Nang style chili sauce (T\u01b0\u01a1ng \u1edbt \u0110\u00e0 N\u1eb5ng). Situated on Duy Tan Street, a major thoroughfare connecting to the airport, Huong Da Specialty Store is spacious and provides a comfortable, fully air-conditioned shopping environment. The store\u0027s most popular items are the semi-dried squid and sweet \u0026 sour dried squid threads made from fresh squid caught off the Central Vietnam coast, offering a thick, delightfully chewy texture. Additionally, their traditional handmade Da Nang chili sauce features a unique, fragrant kick without being overly fiery\u2014a hidden culinary favorite among savvy travelers buying in bulk.", "name": "Huong Da Central Vietnam Souvenir Flagship Store - Duy Tan Branch (Si\u00eau Th\u1ecb \u0110\u1eb7c S\u1ea3n H\u01b0\u01a1ng \u0110\u00e0 - Duy T\u00e2n)", "transport": "Located on Duy Tan Boulevard right outside Da Nang International Airport exit; under 3 minutes by car."}, {"address": "81 Tr\u1ea7n Cao V\u00e2n, Tam Thu\u1eadn, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-Buy List: Signature galangal-leaf wrapped fermented pork rolls (Tr\u00e9 B\u00e0 \u0110\u1ec7), special garlic fermented beef rolls (Nem chua b\u00f2), traditional Vietnamese shrimp paste (M\u1eafm ru\u1ed1c). \"Tr\u00e9\" is a highly representative fermented meat delicacy from Central and Southern Vietnam, made from shredded pig head skin and pork mixed with toasted sesame seeds, galangal, and garlic. Ba De (B\u00e0 \u0110\u1ec7) is the most prestigious heritage brand in Da Nang, with its Thanh Khe store drawing long lines of locals and foodies daily. Traditionally wrapped in guava or galangal leaves, it boasts a tangy, slightly spicy flavor with a bouncy texture, making it the ultimate local snack to pair with Vietnamese beer.", "name": "Ba De Specialty Fermented Pork Shop (Tr\u00e9 B\u00e0 \u0110\u1ec7)", "transport": "Take a Grab ride and get off at the corner of Tr\u1ea7n Cao V\u00e2n Street and Th\u00e1i Th\u1ecb B\u01b0\u1edfi Street."}, {"address": "316 H\u00e0 Huy T\u1eadp, H\u00f2a Kh\u00ea, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-Buy List: Top Coco original roasted coconut crackers (B\u00e1nh d\u1eeba n\u01b0\u1edbng truy\u1ec1n th\u1ed1ng), green tea flavored coconut crackers (B\u00e1nh d\u1eeba v\u1ecb tr\u00e0 xanh), sesame roasted coconut crackers (B\u00e1nh d\u1eeba n\u01b0\u1edbng m\u00e8). The manufacturer behind the hugely popular \"Top Coco Roasted Coconut Crackers\" loved by international tourists is My Phuong Food, located in Thanh Khe District. At this direct factory outlet, you can purchase the freshest batches with the complete lineup of flavors. Unlike ordinary market brands, their products carefully select fresh shredded coconut from Quang Nam Province and glutinous rice flour, baked at high temperatures to release an intensely rich coconut aroma. Crisp and refreshing, it is an absolute top pick on any souvenir shopping list.", "name": "My Phuong Food - Top Coco Coconut Cracker Factory Store (M\u1ef9 Ph\u01b0\u01a1ng Food - B\u00e1nh D\u1eeba N\u01b0\u1edbng Top Coco)", "transport": "Turn onto H\u00e0 Huy T\u1eadp Street from Thanh Khe\u0027s main thoroughfare \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 and ride straight for about 400 meters."}, {"address": "04 Ho\u00e0ng Hoa Th\u00e1m, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-Buy List: 100% pure beef Vietnamese sausage (Ch\u1ea3 b\u00f2 \u0111\u1eb7c bi\u1ec7t), premium pepper pork rolls (Ch\u1ea3 l\u1ee5a), house-marinated garlic white sauce (T\u1ecfi ng\u00e2m). Da Nang beef sausage (Ch\u1ea3 b\u00f2) is famous throughout Vietnam, and \"Ba Huong\" (B\u00e0 H\u01b0\u1eddng) is widely recognized as one of the most authentic decades-old shops near the railway station and Thanh Khe area. This shop insists on adding no preservatives or borax, using fresh local beef blended with whole black pepper and fish sauce, wrapped in banana leaves, and steamed to perfection. Sliced to reveal a delicate pink hue, it offers a springy texture bursting with savory juices. The store provides professional vacuum packaging, making it convenient for travelers to bring back to their hotels or take home abroad as souvenirs.", "name": "Ba Huong Premium Da Nang Beef Sausage Shop (Ch\u1ea3 B\u00f2 B\u00e0 H\u01b0\u1eddng)", "transport": "Located near Da Nang Railway Station; only a 3-minute walk from the main station exit."}, {"address": "46 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Must-Buy List: Freshly grilled tamarind-marinated baby squid (M\u1ef1c rim me), Central Vietnam specialty sour shrimp paste (M\u1eafm t\u00f4m chua), skin-on salted roasted cashews (H\u1ea1t \u0111i\u1ec1u c\u00f2n v\u1ecf). This complex commercial building blends a traditional market with a modern shopping mall format, where veteran dried food vendors gather on the second floor and surrounding vendor areas. Prices for snacks and souvenirs here are much more down-to-earth compared to purely tourist-driven markets. Highly recommended picks include \"M\u1ef1c rim me\" (sweet, sour, and spicy baby squid grilled in tamarind sauce) and premium whole skin-on roasted cashews, offering outstanding quality alongside the joy of friendly interactions with local vendors.", "name": "Thanh Khe Supermarket Market - Specialty Dried Goods Area (Ch\u1ee3 Si\u00eau Th\u1ecb \u0110\u00e0 N\u1eb5ng)", "transport": "Located on \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Boulevard; take a bus or Grab ride and get off at the Ch\u1ee3 Si\u00eau Th\u1ecb stop."}, {"address": "192 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-Buy List: Da Nang traditional drip coffee beans (C\u00e0 ph\u00ea b\u1ecdt \u0110\u00e0 N\u1eb5ng), chewy dried mango (M\u1ee9t xo\u00e0i s\u1ea5y d\u1ebbo), roasted pepper dried anchovies (C\u00e1 c\u01a1m kh\u00f4). Specializing in high-quality agricultural products from Central and Southern Vietnam, Qu\u00e0 Mi\u1ec1n Trung operates a large retail branch on Thanh Khe\u0027s main avenue. The store curates premium ingredients from the Central Highlands and coastal regions, with special highlights being their house-roasted highland Robusta coffee beans and exquisitely dried fruit slices. The staff are welcoming and offer generous free samples. All food products pass strict hygiene inspections, giving safety-conscious travelers total peace of mind when shopping for traditional local treats.", "name": "Qua Mien Trung Central Vietnam Souvenir Center - Dien Bien Phu Branch (Qu\u00e0 Mi\u1ec1n Trung - \u0110i\u1ec7n Bi\u00ean Ph\u1ee7)", "transport": "Located on the main shopping avenue \u0110i\u1ec7n Bi\u00ean Ph\u1ee7; about a 4-minute car ride from the railway station."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "255-257 H\u00f9ng V\u01b0\u01a1ng, V\u0129nh Trung, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-buy list: Vietnamese G7 3-in-1 coffee, Vinamit dried mixed fruit chips, MAROU artisanal dark chocolate. Located in the heart of Thanh Kh\u00ea District, this massive shopping center (formerly Big C) is the top choice for both locals and tourists buying daily supplies and souvenirs. The interior is spacious and bright, featuring chain restaurants and a movie theater on the upper floors. The supermarket boasts the most comprehensive selection of local Vietnamese specialties in Da Nang at highly competitive prices.", "name": "GO! \u0110\u00e0 N\u1eb5ng (V\u0129nh Trung Plaza)", "transport": "Take a Grab or taxi to V\u0129nh Trung Plaza; or drive about 8 minutes from Da Nang International Airport."}, {"address": "432 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, H\u00f2a Kh\u00ea, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.1 stars | Must-buy list: Discounted running shoes, moisture-wicking athletic T-shirts, limited-edition sports backpacks. Situated on \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, a main commercial artery in Thanh Kh\u00ea District, this outlet center features major international sportswear brands. Offering year-round discounts from 30% to 70% off on past-season items\u2014including top-selling Nike and Adidas shoes and apparel\u2014it\u0027s a prime spot for grabbing high-value sports gear.", "name": "Adidas \u0026 Nike Factory Outlet (\u0110i\u1ec7n Bi\u00ean Ph\u1ee7)", "transport": "Take a Grab or city bus and get off on \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Avenue; about a 5-minute drive from Da Nang Railway Station."}, {"address": "236 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Ch\u00ednh Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-buy list: Vietnamese hipster graphic T-shirts, lightweight affordable linen shirts, minimalist wide-leg trousers. FM Style is a leading homegrown budget fashion brand originating in Da Nang, and its flagship store in Thanh Kh\u00ea District is huge. The store specializes in trendy apparel tailored for young adults, featuring cuts suited for Asian fits and light, breathable fabrics\u2014perfect for tropical city travel wear.", "name": "FM Style \u0110\u00e0 N\u1eb5ng (\u0110i\u1ec7n Bi\u00ean Ph\u1ee7)", "transport": "Take a Grab to the intersection of \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 and H\u00e0 Huy T\u1eadp."}, {"address": "478 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, Thanh Kh\u00ea \u0110\u00f4ng, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Must-buy list: Specialty Vietnamese cashews, Th\u1ea1ch D\u1eeba coconut jelly, Langfarm dried fruits and candied treats. Operated by Vietnam\u0027s largest domestic retail group, this hypermarket is located on a bustling avenue in Thanh Kh\u00ea District. Imbued with an authentic local lifestyle vibe compared to foreign-owned malls, it features a large fresh market alongside fashion counters and local household goods, making it a great place to experience local shopping culture.", "name": "Co.opmart \u0110\u00e0 N\u1eb5ng", "transport": "Take a Grab or city bus to the Co.opmart \u0110\u00e0 N\u1eb5ng stop; the entrance is right there."}, {"address": "268 H\u00f9ng V\u01b0\u01a1ng, T\u00e2n Ch\u00ednh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buy list: Thorakao coconut oil hand cream, Vedette natural clay mask, C\u1ecf M\u1ec1m botanical lip balm. Located on the H\u00f9ng V\u01b0\u01a1ng shopping street in Thanh Kh\u00ea District, Beauty Garden is a hugely popular domestic cosmetics and skincare chain in Vietnam. Beyond carrying international beauty lines, it focuses heavily on top Vietnamese skincare brands, offering natural and budget-friendly local beauty products.", "name": "Beauty Garden \u0110\u00e0 N\u1eb5ng (H\u00f9ng V\u01b0\u01a1ng)", "transport": "Walk about 3 minutes along H\u00f9ng V\u01b0\u01a1ng Road from GO! \u0110\u00e0 N\u1eb5ng."}, {"address": "412 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, H\u00f2a Kh\u00ea, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-buy list: Everyday Polo eco-friendly coffee fiber shirt, lightweight UV-protection cooling jacket, super-stretch casual pants. Yody is a popular local casual fashion brand that has risen rapidly in Vietnam, with a spacious and well-stocked store in Thanh Kh\u00ea District. The brand is renowned for developing innovative eco-friendly fabrics, such as breathable polo shirts made from recycled coffee grounds, making it a favorite among locals and business travelers alike.", "name": "Yody \u0110\u00e0 N\u1eb5ng (\u0110i\u1ec7n Bi\u00ean Ph\u1ee7)", "transport": "Take a Grab to the \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 store; only about a 10-minute drive from the airport."}, {"address": "198 Nguy\u1ec5n T\u1ea5t Th\u00e0nh, Thanh B\u00ecnh, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-buy list: Da Nang dried grilled squid, B\u00e1nh C\u1ed1m coconut green bean cakes, premium fish sauce gift set. Situated along the coastal boulevard in Thanh Kh\u00ea District, this large specialty store is a signature destination for local souvenirs. Featuring clear and transparent pricing along with elegant gift packaging services, it allows you to easily pick up all of Da Nang\u0027s iconic dried seafood and traditional pastries in one stop.", "name": "\u0110\u1eb7c S\u1ea3n Thi\u00ean Ph\u00fa (Nguy\u1ec5n T\u1ea5t Th\u00e0nh)", "transport": "Take a Grab or taxi along the Nguy\u1ec5n T\u1ea5t Th\u00e0nh coastal road to arrive."}, {"address": "82 H\u00e0 Huy T\u1eadp, Xu\u00e2n H\u00e0, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-buy list: Handmade leather bifold wallets, vintage genuine leather braided belts, customized leather keychains. Tucked away in a residential commercial area of Thanh Kh\u00ea District, this independent handcrafted leather workshop is favored by discerning locals. Using high-quality leather, local Da Nang artisans hand-stitch a variety of leather goods at prices far more accessible than major international brands. Free on-site English letter embossing customization is also available.", "name": "H\u1ed3ng Nh\u00e2n Leather \u0026 Craft (Thanh Kh\u00ea)", "transport": "Take a Grab and get off on H\u00e0 Huy T\u1eadp Road, near Thanh Kh\u00ea District Park."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Qingxi District and Traditional Commercial District (Airport Area)"}};

                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
