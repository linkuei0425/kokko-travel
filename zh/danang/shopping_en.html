d Han Riverfront (Hai Chau District)"}, "marble_mountains": {"categories": {"cat_1": {"items": [{"address": "350 Ngu Hanh Son, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.6 stars | Must-buy list: Cocoon Vietnamese Coffee Body Scrub, Thorakao Turmeric Acne Cream, Vedette Clay Mask. Hasaki is an iconic local chain beauty store in Vietnam, known for its affordable prices and exceptionally comprehensive inventory. Located near the Non Nuoc Beach area, this branch attracts many tourists stocking up on sunscreen and after-sun care products. The store features various popular local Vietnamese organic skincare brands, with coffee-based exfoliators made from local Vietnamese coffee beans being the top favorite.", "name": "Hasaki Beauty \u0026 Clinic Ngu Hanh Son", "transport": "About a 7-minute Grab taxi ride from Non Nuoc Beach."}, {"address": "56 Le Quang Dao, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.4 stars | Must-buy list: Pharmacity Pure Coconut Oil, White Tiger Balm, Vietnamese White Flower Oil. Pharmacity is one of Vietnam\u0027s largest pharmacy and beauty chains, and this branch near the An Thuong tourist area and Non Nuoc Beach is a fantastic spot for visitors to hunt for treasures. In addition to pharmaceuticals, it offers a wide range of locally produced Vietnamese herbal skincare items and natural essential oils, all with guaranteed quality and transparent pricing.", "name": "Pharmacity Le Quang Dao", "transport": "About a 5-minute walk along Vo Nguyen Giap Road turning onto Le Quang Dao from the southern end of My Khe Beach or Non Nuoc Beach."}, {"address": "420 Ngu Hanh Son, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.5 stars | Must-buy list: Bao Thanh Herbal Cough Syrup, Sao Vang Golden Star Balm (Vietnamese Tiger Balm), Cocoon Centella Hydrating Mist. FPT Long Chau is a highly reputable local drugstore chain in Vietnam. Beyond prescription and OTC medicines, it stocks numerous traditional Vietnamese herbal skincare products and natural ointments. This spacious and bright branch in the Ngu Hanh Son district features friendly staff, making it an excellent stop for purchasing local medicinal balms and natural cosmetics.", "name": "FPT Long Chau Pharmacy Ngu Hanh Son", "transport": "Take a taxi or Grab straight down Ngu Hanh Son Boulevard to reach the store directly."}, {"address": "12 An Thuong 2, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.7 stars | Must-buy list: Vietnamese Cajuput Essential Oil, Handmade Coconut Oil Soap, Lemongrass Mosquito Repellent \u0026 Soothing Spray. Located at the boundary between the Marble Mountains and the coastal resort area, this independent beauty boutique specializes in 100% locally made Vietnamese natural herbal skincare products and essential oils. The owner carefully selects organic herbs from the central highlands to extract oils\u2014cajuput oil in particular is a household staple in Vietnam for infant care and soothing relief.", "name": "Viet Nature Organic Cosmetics", "transport": "About an 8-minute ride from the Marble Mountains scenic area, or a 3-minute walk from the An Thuong pedestrian area."}, {"address": "120 Truong Sa, Hoa Hai, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.8 stars | Must-buy list: Da Nang Volcanic Mud Deep Cleansing Mask, Tropical Coconut Body Scrub, Vietnamese Herbal Heat Compress Pack. Combining a spa experience with organic skincare retail, this boutique is situated near the luxury resorts along Non Nuoc Beach. Using local agricultural products like coffee, cacao, and volcanic mud, the store formulates exclusive natural skincare lines. The gentle textures and rich aromas make these products popular local souvenirs requested by international travelers.", "name": "Green Spa Boutique Non Nuoc", "transport": "Located on Truong Sa Boulevard near major resorts on Non Nuoc Beach; reachable on foot or via resort shuttle."}, {"address": "88 Chau Thi Vinh Te, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.6 stars | Must-buy list: Saffron Organic Hydrating Serum, Iranian Saffron Sheet Masks, Premium Saffron Tea Bags. Saffron Viet is a premier Vietnamese wellness and beauty brand store featuring a location in Ngu Hanh Son. The boutique focuses on incorporating precious saffron into daily cosmetics and anti-aging skincare, offering beautifully packaged gift sets perfect for elders or close friends.", "name": "Saffron Viet Da Nang", "transport": "About a 5-minute Grab ride from the main thoroughfares around Ngu Hanh Son district."}, {"address": "154 Nguyen Van Thoai, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.3 stars | Must-buy list: OPC Medicated Herbal Oil, Enaon Aloe Vera After-Sun Soothing Gel, Thorakao Milk \u0026 Cucumber Facial Wash. Medigo is a well-known pharmacy and cosmetics chain in Vietnam, and its Ngu Hanh Son flagship is exceptionally well-stocked. Beyond after-sun recovery and sunscreens, you can find nostalgic skincare products from the heritage Vietnamese brand Thorakao, offering great local charm at budget-friendly prices.", "name": "Medigo Health \u0026 Beauty Ngu Hanh Son", "transport": "Located at the intersection of Nguyen Van Thoai and Ngu Hanh Son; extremely convenient by bus or taxi."}, {"address": "45 Huyen Tran Cong Chua, Hoa Hai, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.7 stars | Must-buy list: Bamboo Charcoal Blackhead Removal Soap, Vietnamese Agarwood Hand Cream, Ylang-Ylang Soothing Massage Oil. Tucked away near the foot of the Marble Mountains, this unique boutique specializes in artisanal beauty products extracted from local bamboo charcoal, agarwood, and tropical flora. All products emphasize zero chemical additives and are packaged in eco-friendly bamboo tubes and paper boxes, exuding a chic aesthetic rooted in Vietnamese tradition.", "name": "Bamboo Wellness \u0026 Beauty", "transport": "Just a 3-minute walk from the entrance to the Marble Mountains."}], "name": "Local Representative Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "42 An Th\u01b0\u1ee3ng 4, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-Buy List: Handcrafted straw tote bags, Bohemian floral dresses, wide-brim straw sun hats. Located in the popular An Th\u01b0\u1ee3ng quarter near M\u1ef9 An Beach, this boutique is a favorite among Western travelers and young local women. Specializing in light, comfy resort wear and exquisite hand-woven bags, its tropical holiday styles make it the ultimate fashion pitstop before heading to the beach for photos.", "name": "Pura Vida Beachwear \u0026 Bags", "transport": "Take a Grab or taxi to An Th\u01b0\u1ee3ng 4 Street, then walk for about 2 minutes."}, {"address": "112 Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-Buy List: Breathable linen wide-leg pants, minimalist cotton dresses, handmade breathable flats. Located on the bustling Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf Street in Ng\u0169 H\u00e0nh S\u01a1n, this shop is a local secret for affordable, high-quality women\u0027s clothing. Featuring carefully selected natural linen and pure cotton fabrics tailored for Da Nang\u0027s hot coastal climate, the styles are fresh, elegant, and finely textured.", "name": "G\u1ea1o Boutique Fashion", "transport": "About a 5-minute Grab ride from the southern section of M\u1ef9 Kh\u00ea Beach."}, {"address": "15 An Th\u01b0\u1ee3ng 26, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Must-Buy List: Handmade genuine leather crossbody bags, vintage-style leather backpacks, hand-carved leather sandals. An independent boutique combining local leather craft and hipster apparel, located in the An Th\u01b0\u1ee3ng expat district. All leather items are hand-stitched by local Vietnamese artisans, offering durable quality, competitive pricing, and on-site custom engraving.", "name": "Hope Made Leather \u0026 Craft", "transport": "About a 6-minute walk from M\u1ef9 An Beach along An Th\u01b0\u1ee3ng 26 Street."}, {"address": "25 Nguy\u1ec5n B\u00e1 L\u1ea1n, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-Buy List: Vietnamese tropical coconut tree print shirts, woven beach bags, budget-friendly flip-flops. B\u1eafc M\u1ef9 An Market is not only a local food haven but also a treasure-hunting spot for clothes inside. Here, you can snag vibrant tropical print shirts, swimwear, and casual footwear at unbeatable local market prices.", "name": "B\u1eafc M\u1ef9 An Market Fashion Zone", "transport": "Take a bus or Grab to B\u1eafc M\u1ef9 An Market and walk straight inside to the clothing stall area."}, {"address": "88 Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: Vintage printed short-sleeve shirts, American retro denim jackets, handmade canvas tote bags. Highly recommended by Da Nang\u0027s trendy youth, this vintage clothing store is tucked away in an alley in Ng\u0169 H\u00e0nh S\u01a1n. It features a curated collection of one-of-a-kind secondhand vintage items and creations from independent local Vietnamese designers, oozing strong personality and street aesthetic.", "name": "T\u1ee5i Ti\u1ec7m Vintage \u0026 Clothes", "transport": "Take a Grab car or motorbike to Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf Street."}, {"address": "55 Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-Buy List: Vietnamese real silk \u00c1o D\u00e0i, hand-embroidered silk scarves, resort-style silk pajamas. Adjacent to the Marble Mountains attraction and Non Nuoc Beach resort area, this workshop specializes in premium traditional Vietnamese silk wear. Travelers can buy ready-to-wear lightweight silk dresses or choose high-quality fabrics for express tailor-made clothing.", "name": "Non Nuoc Silk \u0026 Resort Wear", "transport": "Located at the foot of the Marble Mountains; about a 3-minute walk from the stone carving street at the base."}, {"address": "65 An Th\u01b0\u1ee3ng 2, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.9 stars | Must-Buy List: 24-hour custom genuine leather shoes, handmade woven leather bags, vintage leather briefcases. Inheriting the exquisite leather craftsmanship of famous Hoi An shops, this location operates in the An Th\u01b0\u1ee3ng shopping area. It specializes in tailoring pure leather shoes and bags within 24 to 48 hours, featuring exceptional quality and after-sales repair guarantees.", "name": "Friendly Custom Leather Shoes \u0026 Bags", "transport": "Take a Grab to An Th\u01b0\u1ee3ng 2 Street; the store is right there."}, {"address": "28 An Th\u01b0\u1ee3ng 3, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: Beach lace cover-ups, woven bags with wooden handles, fringed beach sandals. This charming boutique offers chic resort outfits tailored for women visiting Non Nuoc Beach and M\u1ef9 Kh\u00ea Beach. It aggregates resort-style brands from across Southeast Asia along with local Vietnamese designer footwear and bags, offering sophisticated, unique designs.", "name": "M\u00e2y Clothing \u0026 Accessories", "transport": "About a 3-minute walk from the center of the An Th\u01b0\u1ee3ng Pedestrian Zone."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "452 Le Van Hien Street, Khue My Ward, Ngu Hanh Son District, Da Nang", "feature": "\u2b50 4.6 stars | Must-buy items: Garlic roasted skin-on cashews, Da Nang coconut crackers, Honey-glazed grilled squid flakes. Huong Da Supermarket is one of the most iconic local specialty brands in Central Vietnam. Located at the foot of the Marble Mountains, this spacious and brightly lit branch features transparent pricing on all items. It brings together the most authentic souvenirs from Da Nang and the surrounding Central Vietnam area. The skin-on cashews are crunchy and full-flavored, while the coconut crackers are rich yet not overly sweet\u2014perfect for tourists looking to buy all kinds of authentic local snacks in one stop.", "name": "Huong Da Central Vietnam Specialties Supermarket - Marble Mountains Branch", "transport": "About a 3-minute Grab car ride from the entrance of the Marble Mountains Scenic Area."}, {"address": "42 Huyen Tran Cong Chua, Hoa Hai Ward, Ngu Hanh Son District, Da Nang", "feature": "\u2b50 4.5 stars | Must-buy items: Mini marble elephant carvings, Natural stone teacup sets, Jade stone bracelets. Tien Hieu is a long-standing local workshop and souvenir shop in Non Nuoc Stone Carving Village, passing down traditional stone carving techniques for generations. They transform heavy stone sculptures into portable, delicate souvenirs. The mini stone elephants and natural stone tea sets are elegant and reasonably priced. The shop also provides proper protective packaging against impacts, making these items highly memorable local keepsakes.", "name": "Tien Hieu Fine Arts Stone \u0026 Souvenirs", "transport": "Located on Huyen Tran Cong Chua Street at the foot of the Marble Mountains, about a 2-minute walk from the ticket office."}, {"address": "Truong Sa Street, Hoa Hai Ward, Ngu Hanh Son District, Da Nang", "feature": "\u2b50 4.4 stars | Must-buy items: Hand-carved stone incense burners, Lucky marble Gua Sha boards, Natural Feng Shui stone spheres. Nestled between Non Nuoc Beach and the Marble Mountains, this workshop showcases handcrafted works by several local master artisans. Aside from large Buddha statues, the lightweight marble Gua Sha boards and stone incense burners are hugely popular among travelers. The unique natural marble veins appeal greatly to visitors who love natural textures.", "name": "Non Nuoc Stone Carving Village Specialty Shop", "transport": "About an 8-minute walk from Non Nuoc Beach along Truong Sa coastal avenue toward the Marble Mountains."}, {"address": "192 Le Van Hien Street, Khue My Ward, Ngu Hanh Son District, Da Nang", "feature": "\u2b50 4.5 stars | Must-buy items: Da Nang dried mango chunks, Salt \u0026 pepper crispy lotus seeds, Drip coffee powder gift boxes. Tailor-made for travelers who love Central Vietnamese flavors, this specialty store offers a wide variety of products and generous free samples. Popular items include low-temperature dried mangoes that retain their rich fruit flavor and crunchy salt-and-pepper lotus seeds. Beautifully packaged, they make excellent gifts for family, friends, and colleagues.", "name": "Dac San Qua Mien Trung Specialty Gifts - Marble Mountains Branch", "transport": "About a 5-minute Grab car ride from the Marble Mountains Scenic Area."}, {"address": "88 Huyen Tran Cong Chua, Hoa Hai Ward, Ngu Hanh Son District, Da Nang", "feature": "\u2b50 4.7 stars | Must-buy items: Handmade toasted coconut crackers, Macadamia nuts, Vietnamese charcoal-roasted cashews. This independent local shop near the Marble Mountains is family-run and specializes in additive-free roasted nuts and traditional coconut crackers. Their coconut crackers boast a rich charcoal aroma and coconut milk flavor, while the cashews are freshly charcoal-roasted daily in limited batches\u2014offering superior freshness and crunch compared to mass-produced supermarket options.", "name": "Ngu Hanh Son Local Nuts \u0026 Coconut Snack Shop", "transport": "About a 2-minute walk from the Huyen Tran Cong Chua exit of the Marble Mountains Scenic Area."}, {"address": "08 Truong Sa Street, Hoa Hai Ward, Ngu Hanh Son District, Da Nang", "feature": "\u2b50 4.3 stars | Must-buy items: Vietnamese handcrafted woven bags, Coconut shell lacquer bowls, Vietnamese herbal essential oils. Located next to the Non Nuoc Beach resort area, this boutique-style souvenir store highlights handicrafts and beachwear accessories created by local Vietnamese designers. The colorful coconut shell lacquer bowls are eco-friendly and stylish, while the handcrafted woven straw bags are extremely popular for beach photos and bringing home.", "name": "Non Nuoc Beach Souvenir \u0026 Boutique Gift Shop", "transport": "Located along the resort strip, about a 6-minute walk from Danang Marriott Resort \u0026 Spa."}, {"address": "305 Le Van Hien Street, Khue My Ward, Ngu Hanh Son District, Da Nang", "feature": "\u2b50 4.4 stars | Must-buy items: Honey-spicy dried squid, Fish sauce seasoned shrimp crackers, Da Nang specialty dried small fish. Located near the coast in the Marble Mountains district, this seafood specialty shop is famous for its high-quality dried seafood. Their signature honey-spicy dried squid becomes more flavorful with every chew, making it a fantastic snack with drinks. The vacuum-sealed fish sauce shrimp crackers and dried small fish comply with flight regulations, highly recommended for seafood lovers.", "name": "Hai Phong Dried Seafood \u0026 Specialty Gifts", "transport": "Take bus No. 01 to the Le Van Hien stop and walk for 1 minute, or take a Grab car."}, {"address": "558 Le Van Hien Street, Hoa Hai Ward, Ngu Hanh Son District, Da Nang", "feature": "\u2b50 4.2 stars | Must-buy items: Archcaf\u00e9 coconut coffee, Vinamit mixed dried fruits, G7 3-in-1 instant coffee. This Non Nuoc branch of WinMart+, Vietnam\u0027s largest supermarket chain, features a dedicated section for tourist specialties alongside daily necessities. With fair and clearly labeled prices, it is perfect for late-night shopping or grabbing popular Vietnamese coconut coffee mix and dried fruit chips before departure.", "name": "WinMart+ Non Nuoc Branch", "transport": "About a 2-minute Grab ride (car or motorbike) from the entrance of the Marble Mountains Scenic Area."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "08 V\u00f5 Nguy\u00ean Gi\u00e1p, Khu Khu\u00ea M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-Buy List: Duty-free luxury perfumes, discounted Coach designer bags, and Vietnam G7 Black Gold Coffee gift sets. Located on the beachfront prime spot of the Marble Mountains area, this large duty-free and outlet mall brings together numerous international mid-to-high-end brands and luxury outlet counters. It frequently offers end-of-season discounts starting from 70% off, making it the top shopping choice for acquiring international designer handbags, off-season sportswear, and luxury duty-free cosmetics at incredible bargains.", "name": "VV Mall Da Nang (Duty Free \u0026 Brand Outlet)", "transport": "Take a Grab or taxi heading south along V\u00f5 Nguy\u00ean Gi\u00e1p Street to arrive."}, {"address": "06 N\u1ea1i Nam, H\u00f2a C\u01b0\u1eddng B\u1eafc, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: Salted skin-on cashews, ARCHCAFE coconut coffee powder, and premium pure fish sauce. This is the largest complex department store and supermarket around the Marble Mountains, spanning five floors. Beyond international brand counters, the 2nd and 3rd floors are a paradise for tourists to stock up on local Vietnamese specialties. The store offers free luggage storage services and features extensive exhibition areas for local food brands, making it a must-visit spot to complete your souvenir shopping before leaving Da Nang.", "name": "Lotte Mart Da Nang", "transport": "Take a Grab from Non Nuoc Beach across Ti\u00ean S\u01a1n Bridge (C\u1ea7u Ti\u00ean S\u01a1n); it takes about an 8-minute drive."}, {"address": "Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-Buy List: Marble tea sets, natural jade bracelets, and hand-carved stone ornaments. Located at the foot of the Marble Mountains, Non Nuoc Stone Carving Village has a heritage spanning centuries, and this is the area\u0027s most iconic flagship showroom for local art. The exhibition features exquisite sculptures crafted by local master artisans using natural Marble Mountains marble, ranging from tableware to jewelry. International shipping is available, making it a shopping highlight rich in local culture and craftsmanship.", "name": "Non Nuoc Fine Arts Marble Showroom", "transport": "A 3-minute walk from the Marble Mountains scenic area entrance, or take a Grab to Huy\u1ec1n Tr\u00e2n C\u00f4ng Ch\u00faa Street."}, {"address": "254 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Must-Buy List: The North Face waterproof jackets, discounted Nike running shoes, and Samsonite lightweight carry-on luggage. Located along the coastal boulevard at the border of the Marble Mountains and My Khe Beach, this brand outlet focuses on discounted off-season international goods manufactured in Vietnam for export. Items are priced at 40% to 60% off regular boutique prices, making it ideal for travelers seeking great deals on outdoor gear, performance apparel, and casual athletic footwear.", "name": "Factory Brand Outlet Vo Nguyen Giap", "transport": "Walk or take a Grab along the coastal boulevard of V\u00f5 Nguy\u00ean Gi\u00e1p Street toward the An Th\u01b0\u1ee3ng area."}, {"address": "38 An Th\u01b0\u1ee3ng 2, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-Buy List: Handcrafted genuine leather wallets, Bohemian woven straw bags, and natural essential oil solid perfumes. Hidden in the expat-friendly An Th\u01b0\u1ee3ng quarter near the Marble Mountains, this unique local independent boutique is run by a team of young Vietnamese designers. Featuring pure handcrafted real leather accessories and lifestyle goods infused with traditional Vietnamese weaving techniques, every piece offers superb quality and a hipster aesthetic\u2014an ideal choice for acquiring unique local finds.", "name": "An Thuong Leather \u0026 Craft Boutique", "transport": "About a 5-minute Grab ride along the coastal route from Non Nuoc Beach to the An Th\u01b0\u1ee3ng tourist quarter."}, {"address": "184 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-Buy List: Hand-painted Vietnamese ceramic tile coasters, craft single-origin Da Nang chocolates, and Ao Dai-themed painted tea gift boxes. This iconic shop combines local cultural creative goods with specialty coffee, featuring a curated selection of products from local Vietnamese creators and small-scale farmers. Here you can find high-quality lifestyle items inspired by Vietnamese cement tiles, pure additive-free organic chocolates, and uniquely packaged teas\u2014perfect for selecting refined and tasteful souvenirs.", "name": "Danang Souvenirs \u0026 Craft House (Vo Nguyen Giap Branch)", "transport": "Take a Grab along V\u00f5 Nguy\u00ean Gi\u00e1p Street; it is located right on the beachfront front row."}, {"address": "120 Tr\u01b0\u01a1ng \u0110\u0103ng Qu\u1ebf, H\u00f2a H\u1ea3i, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Must-Buy List: 100% pure silk hand-embroidered scarves, custom-tailored Vietnamese Ao Dai, and handmade pure linen casual shirts. Situated next to the Non Nuoc Beach resort area, this premium silk boutique preserves traditional Vietnamese silk-weaving techniques. Offering carefully selected high-quality natural silk and breathable linen fabrics, the store sells beautiful silk scarves and handmade clothing, while also providing a 24-hour express custom tailoring service for traditional Vietnamese Ao Dai and resort wear.", "name": "Marble Mountain Silk \u0026 Tailor Boutique", "transport": "About a 5-minute taxi ride from the major resorts along Non Nuoc Beach."}, {"address": "55 Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-painted mother-of-pearl coconut bowls, natural woven bamboo placemat sets, and pure natural coconut oil hand balms. Popular among European and Korean travelers, this local independent lifestyle shop specializes in eco-friendly home goods made from local Vietnamese natural coconut shells and bamboo. The lacquerware and mother-of-pearl painted coconut bowls are vibrant and exquisite, balancing practicality with decorative value. Affordable and full of tropical island vibes, it\u0027s a delightful spot to shop.", "name": "CoCo Handicrafts \u0026 Souvenirs", "transport": "Within walking distance along Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng Street in the Marble Mountains area, close to the coastal hotel cluster."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Marble Mountains and Non Nuoc Beach Area"}, "my_khe_beach": {"categories": {"cat_1": {"items": [{"address": "65 V\u00f5 V\u0103n Ki\u1ec7t, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Must-buy list: Centella Natural Repair Soap, Coconut Oil Lip Balm, Indigo Herbal Shampoo. This is an iconic Vietnamese local vegan and natural skincare brand, focusing on chemical-free and eco-friendly products. Located on a main street near My Khe Beach, the store features a stylish wood-toned interior. Many tourists come specifically to purchase skincare products made from local Vietnamese herbs and essential oils. Affordably priced with exquisite packaging, they make high-quality souvenirs.", "name": "C\u1ecf M\u1ec1m Homelab Herbal Beauty Specialty Store (C\u1ecf M\u1ec1m Homelab Vo Van Kiet)", "transport": "About an 8-minute walk from My Khe Beach, or a 2-minute Grab ride."}, {"address": "157 Nguy\u1ec5n V\u0103n Tho\u1ea1i, An H\u1ea3i \u0110\u00f4ng, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-buy list: Vedette Clay Mask, Thorakao Turmeric Cream, Cocoon Coffee Body Scrub. Hasaki is a well-known large Vietnamese chain for beauty and drugstore products. The branch on Nguyen Van Thoai Street near My Khe Beach has an exceptionally comprehensive selection. In addition to major international brands, it features a huge section dedicated to local Vietnamese cosmetics, where you can buy popular domestic vegan skincare products like Cocoon at great local prices.", "name": "Hasaki Beauty \u0026 Clinic Flagship Store (Hasaki Beauty \u0026 Clinic Nguyen Van Thoai)", "transport": "About a 5-minute walk along Nguyen Van Thoai Street from My Khe Beach."}, {"address": "135 Nguy\u1ec5n V\u0103n Tho\u1ea1i, An H\u1ea3i \u0110\u00f4ng, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buy list: Golden Star Balm (Sao V\u00e0ng Balm), White Tiger Balm, B\u1ea3o Thanh Herbal Cough Syrup. Long Chau is one of Vietnam\u0027s largest national chain pharmacies, offering fair and transparent pricing. Located near My Khe Beach, this bright and clean store has professional pharmacists on hand and offers various traditional Vietnamese universal balms, soothing herbal oils, and mosquito repellents. It is the best choice for purchasing after-sun soothing products or local remedies after swimming at the beach.", "name": "Long Chau Pharmacy Nguyen Van Thoai Branch (Nh\u00e0 Thu\u1ed1c FPT Long Ch\u00e2u Nguyen Van Thoai)", "transport": "About a 6-minute walk from the My Khe Beach coastline."}, {"address": "94 Nguy\u1ec5n V\u0103n Tho\u1ea1i, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-buy list: Lana Herbal Whitening Cream, NaChi Coconut Essential Oil Hand Cream, Vietnamese Herbal Hydrating Mask. Popular among young Vietnamese women and tourists, this cosmetics chain is located near the My Khe resort area. The shop gathers many affordable, high-quality beauty items from Southeast Asia and local Vietnam. Clear product categorization and frequent discounts make it a great spot to purchase locally developed plant-extract creams and hydrating mists.", "name": "Beauty Garden Cosmetics Select Shop (Beauty Garden Da Nang)", "transport": "About a 7-minute walk from My Khe Beach, or a 3-minute Grab ride."}, {"address": "220 Nguy\u1ec5n V\u0103n Tho\u1ea1i, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-buy list: Thorakao Turmeric Facial Wash, Coconut Oil Hair Serum, Cucumber Cleansing Cream. Thorakao is a classic national beauty brand in Vietnam with decades of history, famous for natural ingredients like turmeric, cucumber, and coconut. This specialized agent shop near My Khe in Son Tra offers a full range of vintage-packaged skincare items. Extremely affordable and effective for acne care and skin nourishment, it\u0027s the ultimate choice to experience traditional Vietnamese beauty wisdom.", "name": "Classic Vietnamese Beauty Brand Thorakao Agent Shop (Thorakao Cosmetics Agent Son Tra)", "transport": "Located on the main artery of the My Khe Beach commercial area, about a 4-minute walk from the beach."}, {"address": "110 V\u00f5 V\u0103n Ki\u1ec7t, An H\u1ea3i \u0110\u00f4ng, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-buy list: Sunplay Vietnam Limited Edition Sunscreen, D\u1ea7u Gi\u00f3 Xanh Green Medicated Oil, Thorakao Lip Balm. Pharmacity is a modern pharmacy chain found everywhere in Vietnam. This 24-hour branch near My Khe Beach offers regular over-the-counter medicine along with a rich variety of everyday cosmetics and sun-repair products. Clean and comfortable with clear pricing, it is super convenient for tourists needing remedies for sunburns or quick drugstore purchases.", "name": "Pharmacity Convenience Drugstore (Pharmacity Vo Van Kiet)", "transport": "About a 5-minute walk from the My Khe Beach landmark area."}, {"address": "322 Ng\u00f4 Quy\u1ec1n, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-buy list: Vietnamese Ph\u1eadt Linh Oil (D\u1ea7u Ph\u1eadt Linh), Lingzhi Herbal Refreshing Balm, Centella Repair Cream. Phuoc Thien Pharmacy is a long-established local pharmacy chain deeply trusted by Da Nang residents. This branch in Son Tra District near the My Khe resort area provides many local Vietnamese specialty balms and herbal pouches. With friendly service and clear, fair pricing, it is an authentic place to buy iconic Vietnamese herbal balms and health supplements.", "name": "Phuoc Thien Pharmacy Son Tra Coastal Branch (Nh\u00e0 Thu\u1ed1c Ph\u01b0\u1edbc Thi\u1ec7n Ngo Quyen)", "transport": "About a 4-minute Grab ride from My Khe Beach."}, {"address": "12 An Th\u01b0\u1ee3ng 3, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.9 stars | Must-buy list: Da Nang Lemongrass Handmade Soap, Cold-Pressed Coconut Oil Massage Cream, Vietnamese Lavender Herbal Stress Relief Mist. Tucked away in the An Thuong ex-pat area right next to My Khe Beach, this boutique store specializes in local Vietnamese organic handmade soaps and natural essential oil products. Items are handcrafted using locally grown herbs and premium coconut oil, beautifully packaged in eco-friendly woven bags that give off a tropical island resort vibe. It is a charming local cosmetics spot in the My Khe Beach area.", "name": "Green Garden Organic Handcrafted Soap \u0026 Essential Oil Shop (Green Garden Natural Cosmetics An Thuong)", "transport": "Just a 3-minute walk from the southern section of My Khe Beach."}], "name": "Representative Local Beauty \u0026 Pharmacy Shops"}, "cat_2": {"items": [{"address": "24 An Th\u01b0\u01a1ng 26, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Must-buys: Minimalist genuine leather tote bags, handcrafted vegetable-tanned passport covers, vintage leather coin purses. Located in the An Thuong tourist area, this artisan leather studio specializes in exquisite leather goods handcrafted by local artisans. The shop oozes a chic hipster craft vibe, using high-quality leather at affordable prices. Highly popular among foreign tourists and local fashion enthusiasts, making it the perfect spot to pick out a unique leather bag as a souvenir.", "name": "OAK Leather Studio Da Nang", "transport": "Take a Grab or taxi to An Th\u01b0\u01a1ng 26 Street; it\u0027s about a 1-minute walk from there."}, {"address": "33 An Th\u01b0\u01a1ng 4, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-buys: Sun-protection rashguards, Da Nang limited-edition graphic tees, casual waterproof beach flip-flops. This is the most famous American-style surf and beachwear shop around My Khe Beach, offering a wide array of surfer-style apparel, printed shirts, and beach accessories. The laid-back atmosphere attracts countless beachgoers and surfers looking for stylish and practical seaside gear.", "name": "Surf Shack Beachwear \u0026 Sandals (Surf Shack Da Nang)", "transport": "Walk about 5 minutes from My Khe Beach straight down An Th\u01b0\u01a1ng 4 Street to see the shop."}, {"address": "105 Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-buys: French vintage vacation dresses, hand-woven straw hats, Bohemian handbags. Tucked away in the alleys near My Khe Beach, this local independent concept store focuses on light, breathable resort-style womenswear and natural woven accessories. The clothing designs blend Vietnamese romance with modern aesthetics using fabrics tailored for Central Vietnam\u0027s hot climate\u2014a must-visit wardrobe treasure trove for ladies looking to take stunning photos at My Khe Beach.", "name": "K\u00c0 Seaside Independent Concept Store (K\u00c0 Concept Store Da Nang)", "transport": "Take a Grab to Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf Road; it\u0027s about a 3-minute walk from the An Thuong area."}, {"address": "12 An Th\u01b0\u01a1ng 2, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buys: Natural breathable pure linen wide-leg pants, Thai-style straw shoulder bags, vintage handmade wooden-bead sandals. Specializing in 100% natural pure cotton and linen apparel designed for tropical beach vacations. The clean, relaxed cuts offer supreme comfort. Paired with their top-selling handmade bamboo and straw bags, you can effortlessly create a chic beach-stroll look\u2014highly recommended by locals and Western travelers alike.", "name": "Cozy Linen \u0026 Cotton Clothing \u0026 Straw Bag Boutique (Cozy Linen \u0026 Cotton Boutique)", "transport": "From My Khe Beach, turn onto An Th\u01b0\u01a1ng 2 Street off Nguy\u1ec5n V\u0103n Tho\u1ea1i; it\u0027s about a 4-minute walk."}, {"address": "248 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-buys: Traditional round bamboo woven bags, hand-painted wooden clogs, tropical floral clutches. A tourist-favorite local craft and accessory shop selling rattan woven bags and traditional wooden clogs handmade by Vietnamese artisans. Featuring diverse designs with strong Central Vietnamese flair, each woven bag comes with delicate interior lining\u2014durable and highly collectible, making it a popular stop along My Khe Beach.", "name": "My Khe Sunshine Woven Bags \u0026 Handmade Clogs (Danang Straw Bags \u0026 Wooden Clogs)", "transport": "Located on V\u00f5 Nguy\u00ean Gi\u00e1p coastal boulevard, right across from My Khe Beach, easily reachable on foot."}, {"address": "78 Nguy\u1ec5n V\u0103n Tho\u1ea1i, B\u1eafc M\u1ef9 Ph\u00fa, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-buys: Backless \u0026 off-the-shoulder maxi beach dresses, woven knotted sandals, resort-style floral sun-protection shirts. Located on the main thoroughfare leading to My Khe Beach, this local Vietnamese clothing store offers trendy resort wear and casual footwear for seaside getaways. With rapidly updated styles and highly competitive prices, whether you\u0027re looking for a romantic maxi dress or versatile summer sandals, you\u0027ll find incredible value here.", "name": "N\u00e0ng Th\u01a1 Resort Style Womenswear \u0026 Sandals (N\u00e0ng Th\u01a1 Boutique)", "transport": "Take a bus or Grab to Nguy\u1ec5n V\u0103n Tho\u1ea1i Road; located just 500 meters from the My Khe Beach landmark area."}, {"address": "45 An Th\u01b0\u01a1ng 1, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-buys: Custom handmade leather sandals, vintage saddle bags, woven leather bracelets. An independent handcrafted leather and footwear shop rooted in Da Nang, offering premium ready-made leather bags and custom shoe-making services. The owner excels at blending traditional Vietnamese leathercraft with modern minimalism. Their sandals are lightweight, durable, and comfortable, drawing many visitors who appreciate quality and uniqueness.", "name": "Wildflower Vintage Leather \u0026 Handmade Shoes Workshop (Wildflower Leather \u0026 Handmade Shoes)", "transport": "Walk into An Th\u01b0\u01a1ng 1 Street from the main My Khe Beach swimming area entrance; takes about 6 minutes."}, {"address": "88 Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng, Ph\u01b0\u1edbc M\u1ef9, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-buys: Vietnamese coconut tree print Cuban collar shirts, canvas-printed patchwork tote bags, matching family print beach shorts. M\u00e2y is a unique local tropical lifestyle clothing brand near My Khe Beach, famous for vibrant prints of Vietnamese flora and ocean graffiti. Featuring lightweight and easy-to-wash fabrics, it\u0027s perfect for buying matching family or couples\u0027 outfits to create a fun, joyful beach look.", "name": "M\u00e2y Tropical Wear \u0026 Print Bags", "transport": "Located in the Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng pedestrian commercial district, about a 3-minute walk from My Khe Beach."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "198 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-buy list: Da Nang roasted skin-on salted cashews, premium dried mangoes, premium dried beef shank. This is the largest and most highly rated specialty hub along My Khe Beach. Bright and spacious, it specializes in premium agricultural products from Central/Southern Vietnam and Da Nang. All snack souvenirs undergo strict quality control. Their salted cashews are especially recommended\u2014plump and intensely aromatic, making this the top choice for tourists to shop for souvenirs before heading home.", "name": "Thien Phu Specialty Supermarket - My Khe Beach Branch (Si\u00eau Th\u1ecb \u0110\u1eb7c S\u1ea3n Thi\u00ean Ph\u00fa - V\u00f5 Nguy\u00ean Gi\u00e1p)", "transport": "Take a Grab or taxi to the main road along My Khe Beach, V\u00f5 Nguy\u00ean Gi\u00e1p Street."}, {"address": "An Th\u01b0\u1ee3ng 4, Ph\u01b0\u1eddng M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-buy list: Vietnamese handmade coconut crackers, Da Nang pepper salt, signature herbal tea bags. Located in the vibrant, exotic An Thuong tourist area right by My Khe Beach, this night market is surrounded by unique street stalls and local gift shops. Besides enjoying delicious food, you can buy handmade snacks crafted by local women and natural dried flower teas\u2014affordable and rich in local flavor.", "name": "An Thuong Night Market \u0026 Souvenir Market", "transport": "About a 5-minute walk from My Khe Beach into the An Thuong tourist district."}, {"address": "120 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-buy list: Charcoal-grilled shredded squid, spicy Da Nang shrimp crackers, premium peppercorns. Located right next to the coastline, Loc Ninh Specialty Store is famous for offering the freshest dried seafood and Central Vietnamese snacks. The shredded squid and spicy shrimp crackers are freshly processed by local fishing villages with minimal chemical additives. Beautifully packaged with great moisture resistance, they make wonderful gifts for family and friends.", "name": "Loc Ninh Central Vietnam Specialty Supermarket (Si\u00eau Th\u1ecb \u0110\u1eb7c S\u1ea3n L\u1ed9c Ninh)", "transport": "Located on coastal V\u00f5 Nguy\u00ean Gi\u00e1p Avenue; riding a scooter or taking a Grab is recommended."}, {"address": "125 Nguy\u1ec5n V\u0103n Tho\u1ea1i, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buy list: Traditionally air-dried Da Nang beef jerky, handmade mung bean cakes, rich coconut candy. Located on Nguy\u1ec5n V\u0103n Tho\u1ea1i Street, this gift shop is a hidden gem for independent travelers. It focuses on traditional Central Vietnamese jerky and pastries. Their air-dried beef is made from local cattle marinated with signature spices\u2014flavorful and pleasantly chewy; the handmade mung bean cake melts in your mouth with a balanced, non-cloying sweetness.", "name": "Nang Mien Trung Specialty Gifts Store (\u0110\u1eb7c S\u1ea3n N\u1eafng Mi\u1ec1n Trung)", "transport": "About a 6-minute walk along Nguy\u1ec5n V\u0103n Tho\u1ea1i Street from My Khe Beach."}, {"address": "116 Nguy\u1ec5n V\u0103n Tho\u1ea1i, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-buy list: Archcaf\u00e9 coconut flavor coffee, Marou artisan craft chocolate, premium Vietnamese phin drip coffee beans. A trendy hipster-style caf\u00e9 and gift boutique combining specialty local Vietnamese coffee beans with premium snacks. Beyond enjoying fresh hand-brewed drip coffee on-site, you can browse award-winning Marou chocolates and curated coffee gift sets. With chic, high-textured packaging, it is the ultimate choice for sophisticated gift-giving.", "name": "Joy Box Coffee \u0026 Souvenir", "transport": "Take a bus or Grab to the intersection of Nguy\u1ec5n V\u0103n Tho\u1ea1i and Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng Streets."}, {"address": "25 Nguy\u1ec5n M\u00e3nh, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buy list: Traditional candied dried fruits, fish sauce packet sets, crispy jackfruit chips. If you want to experience authentic local Da Nang daily life and pick up budget-friendly treats, Bac My An Market is a secret spot you shouldn\u0027t miss. The specialty stalls offer incredibly affordable traditional snacks and dried fruit chips. Warm local vendors generous with free samples allow you to discover old-school preserved fruits and homemade sauces rarely seen elsewhere.", "name": "Bac My An Market Specialty Stalls", "transport": "Located about 1.5 km south of My Khe Beach; riding a scooter or taking a 5-minute taxi ride is recommended."}, {"address": "240 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Must-buy list: Vinamit mixed dried fruit \u0026 vegetable chips, G7 hazelnut instant coffee, Vietnamese specialty cashew gift boxes. Located along the coast, this large supermarket features an exceptionally rich \u0027Must-Buy Vietnamese Local Snacks Zone\u0027 tailored for tourists. Fully stocked with transparent pricing and long operating hours, it\u0027s perfect for stocking up on iconic snacks and branded coffee after a late-night stroll along the beach.", "name": "K-Market Coastal Flagship Store (K-Market V\u00f5 Nguy\u00ean Gi\u00e1p)", "transport": "Located directly opposite My Khe Beach, easily accessible on foot."}, {"address": "280 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-buy list: Da Nang limited handmade chocolate cookies, Vietnamese premium herbal teas, aesthetic creative design snack packs. An iconic cultural and creative souvenir brand in Da Nang, this beachside branch boasts an elegant and refined setting. In addition to creative souvenirs, their signature snack packs feature illustrations of Da Nang\u0027s Dragon Bridge and My Khe Beach. Packed with delicious artisanal cookies and curated tea bags, they beautifully combine aesthetic charm with authentic local flavor.", "name": "Danang Souvenirs \u0026 Coffee - My Khe Beach Branch", "transport": "Located on V\u00f5 Nguy\u00ean Gi\u00e1p Avenue with a highly visible landmark, convenient to reach on foot or by vehicle."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Vo Nguyen Giap Street, Khue My, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.3 stars | Must-Buy List: Duty-free international cosmetics, premium Vietnamese agarwood fragrances, imported resort-style apparel. Located along the beautiful My Khe Beach coastal strip, this is one of Da Nang\u0027s newest coastal shopping centers. The mall brings together major international duty-free brands and boutiques in a bright, spacious setting, with a top floor offering sweeping views of the blue ocean. Many travelers staying at nearby five-star seaside resorts come specifically to shop for luxury international brands and fine Vietnamese agarwood crafts, making it one of the few large shopping complexes in the resort area that combines shopping, dining, and ocean views.", "name": "VV Mall Da Nang", "transport": "Take a Grab or taxi directly along the coastal Vo Nguyen Giap Avenue; located near Pullman Resort."}, {"address": "6 Nai Nam 9, Hoa Cuan Bac, Hai Chau, Da Nang", "feature": "\u2b50 4.5 stars | Must-Buy List: G7 coconut coffee packs, Vietnamese cashews, premium dried fruits, Marou artisanal local chocolate. Just a 5\u201310 minute drive from My Khe Beach, this is the top multi-purpose shopping hub for beach resort tourists looking to buy local specialties and souvenirs. The multi-story mall features apparel, cosmetics, a massive supermarket, and a food court. Both locals and tourists love the vast selection and transparent pricing of Vietnamese snacks and produce. The 3rd-floor souvenir section is especially popular with travelers stocking up on Vietnamese coffee and nuts.", "name": "Lotte Mart Da Nang", "transport": "About an 8-minute ride via Grab from My Khe Beach."}, {"address": "186 Vo Nguyen Giap, Phuoc My, Son Tra, Da Nang", "feature": "\u2b50 4.1 stars | Must-Buy List: Past-season Nike running shoes, Adidas breathable sports tops, Superdry beach slides, and UV sun protection jackets. Located on a main thoroughfare near My Khe Beach, this dedicated outlet center focuses on discounted items from major international sportswear and casual brands. The store offers year-round savings ranging from 30% to 70% off, featuring lightweight water sports gear, sun protection wear, and sneakers ideal for Southeast Asian beach holidays\u2014a great treasure hunt spot for outdoor and water activity enthusiasts.", "name": "Da Nang Sportswear \u0026 Brand Outlet", "transport": "Located on the main coastal avenue of My Khe Beach, about a 5-minute walk from key landmarks along the beach."}, {"address": "126 Vo Nguyen Giap, Phuoc My, Son Tra, Da Nang", "feature": "\u2b50 4.6 stars | Must-Buy List: Woven tote bags featuring iconic Da Nang landmarks, hand-painted Ao Dai journals, special blend Vietnamese drip coffee packs. A signature local lifestyle and souvenir shop in Da Nang that seamlessly blends a cafe with curated lifestyle goods. The store stocks a wide variety of craft items, homeware, and unique souvenirs designed by local Vietnamese creators. Decorated in a cozy, hipster resort style, it allows travelers to pick up high-quality, distinctive local goods while relaxing with an authentic Vietnamese drip coffee.", "name": "Danang Souvenirs \u0026 Cafe Beachfront", "transport": "Situated right on the front line of My Khe Beach with ocean views, easily accessible on foot."}, {"address": "262 Tran Phu, Phuoc My, Son Tra, Da Nang", "feature": "\u2b50 4.4 stars | Must-Buy List: Pure cotton handmade embroidered napkins, hand-woven rattan bags, natural Vietnamese coconut oil skincare products. Hoa Ly is an independent boutique near My Khe Beach highly favored by Japanese, European, and American travelers. The owner carefully selects high-quality handcrafted items and lifestyle goods from across Vietnam, ranging from delicate embroidered cloth bags and lacquerware to natural organic beauty products. With a focus on product quality and refined design details, its beautifully packaged items make it an ideal place for premium gift shopping.", "name": "Hoa Ly Shop Da Nang", "transport": "About a 7-minute walk from My Khe Beach through the An Thuong area."}, {"address": "42 An Thuong 2, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.7 stars | Must-Buy List: Linen resort dresses, breathable printed sun shirts, handmade beaded beach earrings. This shop is a renowned local independent designer clothing boutique in the An Thuong area near My Khe Beach. Designed specifically for tropical island vacations, the entire collection features high-quality natural linen and pure cotton fabrics with clean cuts full of French resort flair. Beyond clothing, the store also carries handmade wooden and seashell accessories, making it a go-to spot for female travelers buying stylish beach outfits on their first day in Da Nang.", "name": "Cat Cat Studio", "transport": "Just a 3-minute walk from the An Thuong pedestrian area near My Khe Beach."}, {"address": "15 An Thuong 3, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade genuine leather vintage totes, carved leather wallets, Cham-pattern handcrafted ceramic cups. Combining Champa cultural elements, this independent craft boutique sits in the heart of the My Khe Beach tourist district. All leather items are hand-cut and stitched by local artisans, offering a durable texture and a rich vintage vibe. Beyond leather goods, the store incorporates traditional central Vietnamese Cham motifs into unique ceramics and home decor\u2014a must-visit for travelers seeking distinct style and artisanal craft.", "name": "Champa Leather \u0026 Craft Boutique", "transport": "About a 4-minute walk along An Thuong 3 Street from My Khe Beach."}, {"address": "An Thuong 4, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.2 stars | Must-Buy List: Vietnamese handmade bamboo lampshades, woven straw picnic bags, scented soy candles. Located in the An Thuong expat enclave just behind My Khe Beach, this small multi-concept lifestyle boutique market brings together several independent local shops from Da Nang. Visitors can browse local handmade crafts, natural fragrance products, and unique casual wear all in one spot. The market boasts a relaxed open-air and semi-open setting with a lively ambiance at night, making it one of the most popular evening shopping destinations in the My Khe Beach area.", "name": "An Thuong Beachside Boutique Market", "transport": "Adjacent to the An Thuong tourist area near My Khe Beach, about a 3-minute walk from the coastline."}], "name": "Department Stores \u0026 Recommended Outlets"}}, "name": "My Khe Beach Coastal Resort Area"}, "son_tra": {"categories": {"cat_1": {"items": [{"address": "120 Ho\u00e0ng Sa, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 Stars | Must-Buy List: Cold-pressed virgin coconut oil lip balm, organic coconut body cream, natural coconut silk exfoliator. Specializing in vegan skincare extracted from high-quality coconuts of South-Central Vietnam, this store is located along the main road leading to the S\u01a1n Tr\u00e0 Peninsula. Featuring pure and natural ingredients, it is immensely popular among eco-friendly beauty lovers. Its natural fragrance and intense moisturizing effects make it the ultimate post-sun repair essential after a day at the beach.", "name": "Cocosani Natural Cosmetics S\u01a1n Tr\u00e0 Branch", "transport": "Take a Grab or taxi along Ho\u00e0ng Sa Road towards the S\u01a1n Tr\u00e0 Peninsula for about 5 minutes."}, {"address": "254 Ho\u00e0ng Sa, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | Must-Buy List: Green Cross Herbal Mosquito Repellent, Vietnamese Centella Asiatica repairing serum, White Tiger Balm. Pharmacity is one of Vietnam\u0027s largest pharmacy chains, and this branch is conveniently situated on the coastal road at the foot of the S\u01a1n Tr\u00e0 Peninsula. It offers a wide selection of local herbal ointments and trending Vietnamese botanical beauty products\u2014super handy for bug repellent during hikes or post-sun skincare repair.", "name": "Pharmacity Ho\u00e0ng Sa S\u01a1n Tr\u00e0 Branch", "transport": "About an 8-minute drive downhill from Linh \u00dang Pagoda to Ho\u00e0ng Sa Road."}, {"address": "88 L\u00ea \u0110\u1ee9c Th\u1ecd, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | Must-Buy List: S\u01a1n Tr\u00e0 Mountain natural agarwood essential oil, agarwood anti-aging face cream, handmade herbal soothing soap. Combining the unique agarwood culture of the S\u01a1n Tr\u00e0 Peninsula with local herbs, this store offers premium natural agarwood skincare. Agarwood essential oil provides excellent calming and antioxidant benefits, and all products are completely free of synthetic fragrances\u2014making it the ideal spot for high-quality souvenirs and restorative cosmetics after visiting Linh \u00dang Pagoda.", "name": "Son Tra Agarwood \u0026 Organic Skincare", "transport": "Only about a 3-minute drive from the archway at the foot of Linh \u00dang Pagoda; easily accessible by taxi."}, {"address": "45 Nguy\u1ec5n Panh, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 Stars | Must-Buy List: Da Nang ocean mineral handmade soap, Vietnamese herbal essential oils, natural coffee body scrub. Located in the S\u01a1n Tr\u00e0 District, this local independent beauty workshop specializes in 100% handcrafted natural cleansing and skincare products. Using premium Vietnamese coffee beans, sea salt, and organic cold-pressed plant oils, their products leave skin moisturized without tightness and emit a subtle natural herbal scent\u2014loved by tourists from around the world.", "name": "Sapobon Organic Soap \u0026 Essential Oil S\u01a1n Tr\u00e0", "transport": "Heading downtown from Linh \u00dang Pagoda, take Y\u1ebft Ki\u00eau Road and turn onto Nguy\u1ec5n Panh Road to arrive."}, {"address": "393 Ng\u00f4 Quy\u1ec1n, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Must-Buy List: Cocoon Vietnamese Turmeric Cleanser, Cocoon Coffee Lip Scrub, Bio-Essence Sunscreen. Hasaki is a favorite budget-friendly beauty flagship store among local Vietnamese youth, offering a vast array of popular domestic eco-friendly brands like Cocoon. Here, you can buy uniquely Vietnamese skincare products extracted from natural turmeric, pomelo peel, and coffee at very affordable prices.", "name": "Hasaki Beauty \u0026 Clinic S\u01a1n Tr\u00e0", "transport": "Located on Ng\u00f4 Quy\u1ec1n, a main avenue in S\u01a1n Tr\u00e0 District; about a 10-minute ride via Grab."}, {"address": "560 Ng\u00f4 Quy\u1ec1n, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | Must-Buy List: Vietnamese version of Wong To Yick Woodlock Oil, Thai Shan Golden Herbal Ointment, Centella anti-acne gel. Long Ch\u00e2u is a major professional pharmacy chain in Vietnam offering professional pharmacist consultation. Beyond general pharmaceuticals, it features a dedicated section for local Vietnamese herbal remedies and oriental skincare, making it convenient and fairly priced for travelers seeking local anti-acne products or pain-relieving herbal balms.", "name": "Nh\u00e0 Thu\u1ed1c FPT Long Ch\u00e2u Pharmacy (Ng\u00f4 Quy\u1ec1n Branch)", "transport": "Take a bus or Grab taxi along Ng\u00f4 Quy\u1ec1n Boulevard to the An H\u1ea3i B\u1eafc ward."}, {"address": "18 Phan H\u1ea3i, N\u1ea1i Hi\u00ean \u0110\u00f4ng, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | Must-Buy List: Centella soothing facial mask, Vietnamese lemongrass mosquito repellent balm, green tea oil-control serum. Tucked away near the S\u01a1n Tr\u00e0 coastline, this independent local boutique focuses on developing gentle products for sensitive skin using local Centella Asiatica, green tea, and lemongrass. The light, non-sticky textures are perfect for Da Nang\u0027s hot and humid weather, making it a hidden gem highly recommended by local women.", "name": "Green Nature Herbal Skincare S\u01a1n Tr\u00e0", "transport": "Turn into Phan H\u1ea3i Street from the S\u01a1n Tr\u00e0 coastal road; it\u0027s about a 3-minute walk."}, {"address": "72 L\u00ea V\u0103n L\u01b0\u01a1ng, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Must-Buy List: Vietnamese natural green propolis serum, deep sea water hydrating mist, seaweed brightening facial mask. Located near the S\u01a1n Tr\u00e0 fishing port, this specialty shop combines rich local seaweed resources with Vietnamese wild propolis extraction technology. Its propolis serum works wonders for post-sun repair and fading blemishes. Packaged with a vibrant tropical vibe, it makes for a wonderful local beauty souvenir.", "name": "Son Tra Propolis \u0026 Seaweed Beauty Shop", "transport": "Take a taxi to L\u00ea V\u0103n L\u01b0\u01a1ng Street in Th\u1ecd Quang ward, located near the S\u01a1n Tr\u00e0 Fishing Port."}], "name": "Local Representative Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "99 Ho\u00e0ng Sa, Th\u1ecd Quang, S\u01a1n Tr\u00e0, Da Nang, Vietnam", "feature": "\u2b50 4.5 stars | Must-buy list: Printed Hawaiian shirts, woven straw tote bags, breathable linen shorts. Located on the coastal artery leading to Son Tra Peninsula, this shop is famous for its rich tropical ocean style. It is the top choice for many tourists to buy photo outfits before heading to Linh Ung Pagoda. The shop carefully selects high-quality cotton and linen fabrics produced by local Vietnamese factories, featuring comfortable and breathable cuts tailored for Da Nang\u0027s hot weather. The woven straw bags are all handcrafted by artisans in central Vietnamese villages, offering a sturdy texture and unique style highly popular among local youth and international tourists.", "name": "Son Tra Beachwear \u0026 Accessories", "transport": "About a 7-minute drive south along the Ho\u00e0ng Sa coastal road from Linh Ung Pagoda."}, {"address": "Linh Ung Pagoda Tourist Area, Son Tra Peninsula, Da Nang, Vietnam", "feature": "\u2b50 4.6 stars | Must-buy list: Hand-embroidered lotus silk scarves, vintage bamboo handbags, Vietnamese handmade embroidered coin purses. Located near the Linh Ung Pagoda scenic area, this boutique showroom specializes in traditional Vietnamese silk products and exquisite embroidered bags. All silk in the store comes from the famous Hoi An and Van Phuc silk villages, boasting smooth textures and elegant colors. The best-sellers are the hand-embroidered bags featuring lotus and Linh Ung Pagoda motifs; their meticulous craftsmanship reflects immense traditional value, making them perfect high-end souvenirs.", "name": "Linh Ung Silk \u0026 Embroidered Bags", "transport": "Located in the shopping area just outside the Linh Ung Pagoda complex, within walking distance."}, {"address": "150 Truong Sa, Man Thai, Son Tra, Da Nang, Vietnam", "feature": "\u2b50 4.4 stars | Must-buy list: Pure linen dresses, handmade woven sandals, wide-brim straw sun hats. Situated next to Man Thai Fishing Village at the foot of Son Tra Peninsula, this chic boutique focuses on minimalist and natural resort-style clothing. The entire shop features 100% natural linen and organic cotton, with designs that are both elegant and stylish. The store\u0027s handmade sandals combine local leather with natural plant fibers, making them durable and exceptionally comfortable\u2014a perfect outfit choice for exploring Son Tra attractions and beaches.", "name": "Man Thai Seaside Linen Boutique", "transport": "Take a taxi or rent a scooter along Ho\u00e0ng Sa Road toward the M\u1eabn Th\u00e1i Beach section to easily spot it."}, {"address": "12 Le Duc Tho, Tho Quang, Son Tra, Da Nang, Vietnam", "feature": "\u2b50 4.3 stars | Must-buy list: Painted Da Nang landmark T-shirts, durable canvas tote bags, bamboo sunglasses. This trendy apparel shop features collaborations with local independent illustrators, right at the foot of Son Tra Peninsula. The T-shirt designs blend motifs of the Linh Ung Lady Buddha, Son Tra monkeys, and ocean elements, creating a witty and distinctive style. Their canvas bags and bamboo sunglasses are must-buy items for hipster travelers, reasonably priced and rich in local culture.", "name": "Son Tra Creative Apparel \u0026 Beach Bags", "transport": "Located near the intersection of L\u00ea \u0110\u1ee9c Th\u1ecd and Ho\u00e0ng Sa roads, about a 5-minute drive to the Son Tra Peninsula entrance."}, {"address": "45 Ngo Quyen, Tho Quang, Son Tra, Da Nang, Vietnam", "feature": "\u2b50 4.5 stars | Must-buy list: Full cowhide handmade sandals, woven beach flats, handmade leather bag charms. Founded by local Da Nang shoemakers, this workshop specializes in premium genuine leather and woven footwear. The master cobbler brings over 20 years of shoemaking experience. The shoes feature ergonomic designs allowing long walks around Son Tra Peninsula without tiring your feet, with on-site minor adjustments and customization available. Prices are very affordable compared to international brands, yet the quality is stunning.", "name": "Son Tra Handmade Leather \u0026 Woven Shoes", "transport": "Take a taxi along the main artery of Ng\u00f4 Quy\u1ec1n Road toward the Th\u1ecd Quang area to arrive."}, {"address": "InterContinental Danang Sun Peninsula Resort, Son Tra Peninsula, Da Nang, Vietnam", "feature": "\u2b50 4.8 stars | Must-buy list: Vietnamese designer silk resort dresses, high-end woven beach bags, limited-edition designer swimwear. Situated inside the luxurious InterContinental Resort on Son Tra Peninsula, this top-tier boutique brings together clothing and luxury footwear/bag accessories from Vietnam\u0027s top independent designers. Featuring exquisite silk maxidresses and high-end handmade leather bags, the style is elegant and infused with French Indochine flair. For travelers seeking high fashion and unique taste, this shop offers exclusive local designs you won\u0027t find anywhere else.", "name": "Le Sommet Boutique at InterContinental Son Tra", "transport": "Located inside the InterContinental Danang Sun Peninsula Resort; taking a resort shuttle or booking a taxi is recommended."}, {"address": "88 Yet Kieu, Tho Quang, Son Tra, Da Nang, Vietnam", "feature": "\u2b50 4.2 stars | Must-buy list: Ultra-lightweight breathable sun-protective jackets, non-slip outdoor water shoes, water-resistant lightweight backpacks. Catering to the rich natural ecology and hiking trails of Son Tra Peninsula, this shop specializes in outdoor functional apparel, footwear, and bags suitable for the local climate. They stock high-quality performance clothing manufactured in Vietnam for international export, priced at only half of overseas retail stores. Whether you plan to climb Son Tra peak, visit the thousand-year-old banyan tree, or pay respects at Linh Ung Pagoda, you can find the most practical gear here.", "name": "Son Tra Outdoor \u0026 Trekking Wear", "transport": "Located on Y\u1ebft Ki\u00eau Road toward the Son Tra Naval Port direction, very convenient by car or scooter."}, {"address": "210 Nguyen Phan Vinh, Tho Quang, Son Tra, Da Nang, Vietnam", "feature": "\u2b50 4.7 stars | Must-buy list: Handmade traditional \u00c1o D\u00e0i, pure silk handwoven shawls, vintage embroidered evening clutches. Highly favored by local women, this independent designer boutique highlights traditional Vietnamese \u00c1o D\u00e0i infused with modern tailoring. They use high-quality natural silk and printed fabrics, offering express custom tailoring services. The store displays handmade vintage embroidered bags and pure silk shawls with exquisite details; many tourists taking photo tours to Linh Ung Pagoda come here specifically to pick out a complete outfit.", "name": "CoCo Silk \u0026 Vintage Boutique Son Tra", "transport": "About an 8-minute drive from the Linh Ung Pagoda entrance to reach the store."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "B\u00e3i B\u1ee5t, Linh Ung Pagoda, Tho Quang Ward, Son Tra District, Da Nang", "feature": "\u2b50 4.6 stars | Must-Buy List: Blessed Bodhi seed bracelets, agarwood incense sticks, mini jade Guanyin carvings. Located inside the Linh Ung Pagoda on the Son Tra Peninsula, this souvenir shop is a must-visit for travelers after viewing Southeast Asia\u0027s tallest Lady Buddha statue. The shop sells various blessed prayer accessories and agarwood products consecrated by the pagoda\u0027s monks. Featuring a calming, peaceful fragrance, these items make meaningful souvenirs to bring home blessings and peace.", "name": "Linh Ung Pagoda Souvenir Shop", "transport": "Take a Grab or taxi from Da Nang city center along Ho\u00e0ng Sa Road up the mountain; it takes about 20 minutes to reach the Linh Ung Pagoda parking lot."}, {"address": "88 Ho\u00e0ng Sa, Tho Quang Ward, Son Tra District, Da Nang", "feature": "\u2b50 4.5 stars | Must-Buy List: Pure Son Tra wild wildflower honey, pure propolis drops, natural comb honey. Located at the foot of the Son Tra Peninsula, this shop specializes in wild honey harvested directly from the peninsula\u0027s native forests. Rich in origin with subtle floral and fruity notes, the honey has a deep, pure taste. In addition to wild honey, they also offer propolis and natural honeycomb, making it a top choice for locally authentic wellness souvenirs.", "name": "Son Tra Wild Honey \u0026 Specialty Shop", "transport": "Drive along Ho\u00e0ng Sa Road towards Son Tra Peninsula; the shop is visible near Man Thai Beach."}, {"address": "18 Ho\u00e0ng Sa, Tho Quang Ward, Son Tra District, Da Nang", "feature": "\u2b50 4.4 stars | Must-Buy List: Salted roasted cashews with skin, sugar-free dried mango, premium anchovy fish sauce. Huong Da is a highly iconic local specialty chain in Da Nang. This branch on Ho\u00e0ng Sa Road conveniently serves travelers heading to the Son Tra Peninsula. Bright and spacious, the store features hundreds of Vietnamese and local Da Nang snacks and dried goods. All items are clearly priced with free samples available. The crispy, savory cashews with skin are a top pick for bulk buying before departure.", "name": "Huong Da Local Specialties - Hoang Sa Branch", "transport": "Take a taxi along Ho\u00e0ng Sa Road; conveniently located diagonally opposite Man Thai Beach."}, {"address": "235 Ho\u00e0ng Sa, Tho Quang Ward, Son Tra District, Da Nang", "feature": "\u2b50 4.3 stars | Must-Buy List: Charcoal-grilled ready-to-eat shredded squid, dried flying fish roe, spicy dried scallops. Located near the Man Thai fishing village at the foot of Son Tra Peninsula, this local dried seafood shop collaborates directly with local fishermen to provide fresh processed seafood snacks. The charcoal-grilled shredded squid retains its sweet seafood flavor and smoky aroma, while the spicy dried scallops make a perfect snack to go with drinks\u2014full of rich Da Nang fishing village flavor.", "name": "Man Thai Dried Seafood Souvenirs", "transport": "Accessible by scooter or taxi along the coastal Ho\u00e0ng Sa Road on Son Tra Peninsula."}, {"address": "Mai H\u1eafc \u0110\u1ebf, An Hai Tay Ward, Son Tra District, Da Nang", "feature": "\u2b50 4.3 stars | Must-Buy List: Traditional Vietnamese baked coconut crackers, handmade rattan bags, garlic roasted peanuts. Located in the heart of Son Tra District near the Dragon Bridge, this market is the perfect evening shopping spot after exploring the peninsula. The souvenir stalls gather a wide variety of local snacks and crafts. The crispy baked coconut crackers pack a rich coconut aroma. Affordable and varied, it is ideal for buying gift sets for friends and colleagues all at once.", "name": "Son Tra Night Market Souvenir Stalls", "transport": "Drive about 15 minutes from Linh Ung Pagoda along Ho\u00e0ng Sa and Mai H\u1eafc \u0110\u1ebf roads toward the head of Dragon Bridge."}, {"address": "156 L\u00ea \u0110\u1ee9c Th\u1ecd, Tho Quang Ward, Son Tra District, Da Nang", "feature": "\u2b50 4.7 stars | Must-Buy List: Son Tra wild mountain green tea, natural lotus scented tea, natural Vietnamese agarwood woodchips. A refined local shop specializing in high-quality tea and natural agarwood from around the Son Tra mountain range. Dedicated to promoting Vietnamese tea culture, the shop offers smooth high-mountain green tea with a sweet lingering finish and lotus tea boasting elegant floral notes. It also features top-tier natural agarwood, making it a hidden gem for tea and incense enthusiasts.", "name": "Son Tra Mountain Tea \u0026 Agarwood Shop", "transport": "Located on L\u00ea \u0110\u1ee9c Th\u1ecd Road at the foot of Son Tra Peninsula; taking a Grab or taxi is recommended."}, {"address": "12 Ho\u00e0ng Sa, Phuoc My Ward, Son Tra District, Da Nang", "feature": "\u2b50 4.4 stars | Must-Buy List: Spicy seasoned cuttlefish slices, premium Vietnamese shrimp paste, traditionally brewed fish sauce. A specialty souvenir shop created by the famous Da Nang seafood restaurant B\u00e9 M\u1eb7n, located near the Son Tra coastal road. It focuses on bringing authentic Da Nang seafood flavors straight home. Their signature spicy cuttlefish is addictive and flavorful, while the traditionally brewed fish sauce is a highly sought-after culinary item for foodies.", "name": "B\u00e9 M\u1eb7n Seafood Specialties \u0026 Souvenirs Flagship Store (\u0110\u1eb7c S\u1ea3n Qu\u00e0 T\u1eb7ng B\u00e9 M\u1eb7n)", "transport": "Easily found along the coastal Ho\u00e0ng Sa Avenue heading from My Khe Beach toward Son Tra Peninsula."}, {"address": "45 Nguy\u1ec5n Phan Vinh, Tho Quang Ward, Son Tra District, Da Nang", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade extra-rich coconut crackers, mixed tropical dried fruits, passion fruit concentrate jam. Situated on a main thoroughfare of the Son Tra Peninsula, this independent shop features daily handmade traditional Vietnamese coconut crackers. Crispier and less sweet than mass-market brands, their rich coconut flavor keeps you coming back for more. In addition, additive-free dried fruits and passion fruit jam are huge hits with travelers.", "name": "Danang Handmade Coconut Cake \u0026 Dried Fruit Shop", "transport": "Drive down from Linh Ung Pagoda and turn onto Nguy\u1ec5n Phan Vinh Road; it takes about 5 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "910A Ng\u00f4 Quy\u1ec1n, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | Must-Buy List: WinMart Vietnamese cashews, G7 instant coffee, TH True Milk dairy products. Located in the heart of Son Tra District, this major modern shopping mall features a large WinMart supermarket, making it the perfect pit stop to restock supplies before heading up the Son Tra Peninsula. The mall brings together top international brands and popular local Vietnamese boutiques, with a food court and cinema on the upper floors, offering comfortable air conditioning and an excellent shopping environment.", "name": "Vincom Plaza Da Nang", "transport": "About a 10-minute Grab ride from the foot of Son Tra Peninsula."}, {"address": "198 V\u00f5 Nguy\u00ean Gi\u00e1p, Ph\u01b0\u1edbc M\u1ef9, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 Stars | Must-Buy List: Son Tra Peninsula agarwood bracelets, Da Nang-style dried grilled squid, mung bean cakes. A large specialty department center dedicated to showcasing and selling authentic products from the Son Tra area and Central Vietnam. Beyond a wide array of local food souvenirs, it features a dedicated traditional handicrafts section displaying high-quality agarwood products and stone carvings. Excellent packing services and tax refund consultations are available on-site.", "name": "Trung T\u00e2m \u0110\u1eb7c S\u1ea3n Mi\u1ec1n Trung S\u01a1n Tr\u00e0 (Central Vietnam Specialty Center)", "transport": "Drive south along the Son Tra Peninsula coastal road (V\u00f5 Nguy\u00ean Gi\u00e1p) for about 5 minutes."}, {"address": "486 Ng\u00f4 Quy\u1ec1n, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Must-Buy List: Everyday Cooling Polo Shirts, lightweight anti-UV sun protection jackets, bamboo fiber casual T-shirts. YODY is a quintessential Vietnamese domestic casual wear brand. This flagship store in Son Tra features a dedicated outlet sales area offering great year-round discounts. The brand specializes in high-tech cooling and sun-protective fabrics tailored for Southeast Asia\u0027s climate, combining great quality with budget-friendly prices.", "name": "YODY S\u01a1n Tr\u00e0 Fashion \u0026 Outlet", "transport": "About a 15-minute drive from Linh Ung Pagoda straight down the main road of Ng\u00f4 Quy\u1ec1n."}, {"address": "456 Ng\u00f4 Quy\u1ec1n, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 Stars | Must-Buy List: Nike Air Max running shoes, Dri-FIT moisture-wicking shirts, sports caps with Vietnam-exclusive embroidery. Situated on a main artery in Son Tra, this Nike Outlet is a must-visit treasure trove for sports fans, featuring off-season footwear and athletic apparel at 30% to 70% off year-round. Since Vietnam is a major manufacturing hub for top international sportswear brands, you can often hunt down authentic odd-size items with complete styles at unbelievable bargains.", "name": "Nike Outlet Store Ng\u00f4 Quy\u1ec1n S\u01a1n Tr\u00e0", "transport": "About a 12-minute Grab ride from the entrance of Son Tra Peninsula."}, {"address": "12 Ho\u00e0ng Sa, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 Stars | Must-Buy List: Handwoven rattan picnic bags, carved coconut shell bowls, natural herbal essential oils. Located at the foot of the Son Tra Peninsula, this local independent craft boutique emphasizes 100% Vietnamese handmade artisan products and eco-friendly sustainability. The shop curates a rich collection of bamboo bags, wood carvings, and coconut shell crafts created in Son Tra and neighboring villages, making it the ideal spot to pick up aesthetic, hip souvenirs with a touch of local soul.", "name": "S\u01a1n Tr\u00e0 Eco Crafts \u0026 Gift Center", "transport": "Located right at the start of the Ho\u00e0ng Sa coastal highway on Son Tra Peninsula; convenient for a quick stop along your drive."}, {"address": "320 Ng\u00f4 Quy\u1ec1n, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 Stars | Must-Buy List: Classic Levi\u0027s jeans, Superdry technical windbreakers, Samsonite lightweight luggage. The largest multi-brand Factory Outlet in Son Tra, bringing together numerous international casual brands manufactured in Vietnam. Most items are export overstocks or off-season styles with heavy discounts, making it a budget-luxury shopping center savvy travelers never miss when visiting Son Tra.", "name": "365 Factory Outlet S\u01a1n Tr\u00e0", "transport": "About a 10-minute drive from the foot of Linh Ung Pagoda, located near Vincom Plaza."}, {"address": "125 Nguy\u1ec5n Phan Vinh, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 Stars | Must-Buy List: Toasted coconut crackers (B\u00e1nh D\u1eeba N\u01b0\u1edbng), Da Nang fish sauce beef jerky, Son Tra wild honey. A large local specialty supermarket loved by both locals and tourists, focusing on premium agricultural products from Son Tra Peninsula and nearby rural villages. The store is spacious, brightly lit, clearly priced, and offers free samples so shoppers can confidently pick up authentic traditional Vietnamese snacks and seasonings.", "name": "N\u1eafng Mi\u1ec1n Trung Specialty Supermarket S\u01a1n Tr\u00e0", "transport": "Located in the Th\u1ecd Quang area of Son Tra District, about an 8-minute drive from Linh Ung Pagoda."}, {"address": "88 Ho\u00e0ng Sa, Th\u1ecd Quang, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 Stars | Must-Buy List: Cold-pressed virgin coconut oil hair conditioner, handmade coconut soap, natural cocoa butter lip balm. Situated by the seaside on Son Tra Peninsula, this independent beauty boutique specializes in skincare products formulated with native Vietnamese plants and organic coconut oil. Free of chemical fragrances and beautifully packaged, it is a go-to spot for wellness-minded tourists seeking high-quality local beauty gifts.", "name": "Coconut Island Natural Beauty Boutique S\u01a1n Tr\u00e0", "transport": "Drive along the Ho\u00e0ng Sa coastal avenue on Son Tra Peninsula to arrive."}], "name": "Major Malls \u0026 Recommended Outlets"}}, "name": "Son Tra Peninsula and Linh Ung Pagoda Scenic Area"}, "thanh_khe": {"categories": {"cat_1": {"items": [{"address": "236 Nguy\u1ec5n V\u0103n Linh, Th\u1ea1c Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Must-Buy List: Rice extract hydrating cleansing powder, natural herbal repair lip balm, Centella anti-acne essence. C\u1ecf M\u1ec1m is an iconic Vietnamese vegan, natural skincare brand focusing on natural additive-free ingredients and eco-friendly concepts. Located near the airport and main Nguy\u1ec5n V\u0103n Linh thoroughfare, this branch has a warm, cozy vibe. Very popular among local young women and tourists for its budget-friendly, gentle plant-based skincare products.", "name": "C\u1ecf M\u1ec1m HomeLab - Nguy\u1ec5n V\u0103n Linh Branch", "transport": "About a 5-minute drive from Da Nang International Airport, straight along Nguy\u1ec5n V\u0103n Linh Road."}, {"address": "393 Nguy\u1ec5n V\u0103n Linh, Th\u1ea1c Gi\u00e1n, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: Thorakao Turmeric Cream, Cocoon Coffee Body Scrub, Vedette Yogurt Facial Mask. Hasaki is one of Vietnam\u0027s largest domestic beauty chains, stocking a wide selection of local Vietnamese brands and best-selling Asian cosmetics. With very affordable prices and frequent discounts, it\u0027s the perfect spot to pick up representative Vietnamese skincare products.", "name": "Hasaki Beauty \u0026 Clinic - Nguy\u1ec5n V\u0103n Linh Branch", "transport": "About a 6-minute Grab taxi ride from Da Nang Airport."}, {"address": "298 Nguy\u1ec5n V\u0103n Linh, V\u0129nh Trung, Thanh Kh\u00ea, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-Buy List: Cocoon Pomelo Hair Tonic, Cocoon Winter Melon Micellar Water, Cocoon Coffee Lip Scrub. Cocoon is currently Vietnam\u0027s hottest 100% vegan beauty brand, using local ingredients like pomelo peel, winter melon, and coffee. This flagship-style drugstore in the bustling Thanh Kh\u00ea district offers the most complete lineup of Cocoon\u0027s star products.", "name": "Guardian - Nguy\u1ec5n V\u0103n Linh Branch (Official Cocoon Partner)", "transport": "Only 200 meters from Big
