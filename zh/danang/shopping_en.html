        const dbData = {"an_thuong": {"categories": {"cat_1": {"items": [{"address": "151 Nguy\u1ec5n V\u0103n Tho\u1ea1i, An H\u1ea3i \u0110\u00f4ng, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-Buy List: Vedette Cucumber Sheet Mask, Thorakao Turmeric Nourishing Cream, Cocoon Vietnamese Coconut Lip Balm. Hasaki is one of Vietnam\u0027s iconic flagship beauty chain stores, highly popular among local young women and foreign tourists. The shop boasts a comprehensive product line, especially the turmeric series from the local Vietnamese brand Thorakao, which is remarkably effective for acne scar repair, affordable, and of excellent quality. Additionally, Cocoon vegan skincare products are top best-sellers here. The store is bright, neat, and frequently offers great deals.", "name": "Hasaki Beauty \u0026 Clinic An Thuong", "transport": "About an 8-minute walk from An Thuong Night Market, or a 3-minute Grab taxi ride."}, {"address": "38 An Th\u01b0\u1ee3ng 2, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-Buy List: White Tiger Balm (Cao B\u1ea1ch H\u1ed5), Vietnamese Herbal Cooling Oil, Softela Centella Moisturizing \u0026 Repairing Cream. Pharmacity is one of Vietnam\u0027s largest modern pharmacy chains, located right in the heart of the An Thuong tourist area. In addition to international medicines and health supplements, it is best known among tourists for its full range of traditional Vietnamese herbal skincare products and cure-all balms. White Tiger Balm and herbal cooling oils are travel essentials for relieving fatigue. Staff speak basic English, making for a smooth and convenient shopping experience.", "name": "Pharmacity An Thuong", "transport": "Located in the heart of An Thuong 2 Street, just a 2-minute walk from An Thuong Walking Street."}, {"address": "268 Ng\u00f4 Quy\u1ec1n, An H\u1ea3i B\u1eafc, S\u01a1n Tr\u00e0, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: Cocoon Dak Lak Coffee Body Polish, Na\u0027s Natural Peppermint Essential Oil, Thorakao Facial Cleanser. Beauty Garden is a highly popular local beauty retail chain in Vietnam, featuring a wide selection of unique botanical skincare products from Vietnam and Southeast Asia. Highly recommended is their top seller, the Cocoon Coffee Body Scrub, crafted from Vietnamese highland coffee beans\u2014it boasts a rich aroma and wonderful exfoliating effects. Friendly service and transparent pricing make it an excellent spot for local beauty souvenirs.", "name": "Beauty Garden Da Nang", "transport": "About a 5-minute Grab bike or taxi ride from the An Thuong area."}, {"address": "69 L\u00ea Quang \u0110\u1ea1o, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-Buy List: Golden Star Balm (Cao Sao V\u00e0ng), Thorakao Natural Herbal Insect Repellent, Vietnamese Turmeric Acne Gel. Long Ch\u00e2u is a pharmacy chain giant under FPT, a listed company in Vietnam, with convenient locations around An Thuong. The store offers a rich variety of local natural skincare products and traditional universal balms. Golden Star Balm is Vietnam\u0027s iconic national-tier remedy, extremely effective for dizziness and insect bites with nostalgic vintage packaging. Professional pharmacists on site can recommend local soothing gels for sun-exposed skin discomfort.", "name": "FPT Long Ch\u00e2u Pharmacy An Thuong", "transport": "Located on the main street of L\u00ea Quang \u0110\u1ea1o, just a 3-minute walk from An Thuong Walking Street."}, {"address": "12 Ch\u00e2u Th\u1ecb V\u0129nh T\u1ebf, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Must-Buy List: Highland Pomelo Hair Tonic Spray, Vietnamese Betel Leaf Intimate Wash, Coffee Lip Scrub. Cocoon is a 100% vegan local beauty brand that has taken the international market by storm, emphasizing ingredients sourced from Vietnamese specialty plants (such as highland coffee, pomelo peel, and winter melon). The partner boutique near the An Thuong area carries a complete range of Cocoon products. Their Pomelo Hair Spray effectively strengthens hair roots with a refreshing scent, while the natural Winter Melon Anti-Acne Serum is a true lifesaver in tropical climates, brimming with authentic local flair.", "name": "Cocoon Vegan Beauty Selection An Thuong", "transport": "About a 7-minute walk or a 2-minute Grab ride from the An Thuong Tourist Area."}, {"address": "45 An Th\u01b0\u1ee3ng 30, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: Cold-Processed Organic Coconut Oil Handmade Soap, Citronella \u0026 Lemongrass Insect Repellent Balm, Vietnamese Bamboo Charcoal Deep Cleansing Mask. Tucked away in the alleys of An Thuong, this independent handmade beauty shop specializes in products extracted from natural herbs of Northern Sapa and the Central Highlands. All handmade soaps are cold-processed using pure organic coconut oil and essential oils without chemical additives. The lemongrass repellent balm is tailor-made for Southeast Asia\u0027s climate\u2014pleasantly scented, gentle on skin, and loved by foreign tourists and Western backpackers alike.", "name": "Sapa Organic Soap \u0026 Beauty An Thuong", "transport": "About a 4-minute walk along An Thuong 30 Street from My Khe Beach."}, {"address": "12 An Th\u01b0\u1ee3ng 4, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-Buy List: Ylang Ylang Botanical Massage Oil, Centella Soothing \u0026 Hydrating Facial Mist, Natural Coconut Repairing Hand Cream. An Thuong Herbal \u0026 Natural Beauty is a charming independent boutique in the area, emphasizing locally sourced ingredients and small-batch handmade production. Their signature Centella mist is specifically formulated to soothe and repair skin after beach sun exposure with instant results, while the Ylang Ylang massage oil offers rich nourishment and an enchanting tropical floral scent\u2014making it a high-quality vacation souvenir to bring home.", "name": "An Thuong Herbal \u0026 Natural Beauty", "transport": "Located on An Thuong 4 Street, just a 3-minute walk from the core area of An Thuong Night Market."}, {"address": "88 Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-Buy List: Biona Turmeric Acne Cream, Buddha Medicated Oil (D\u1ea7u Ph\u1eadt Linh), Fresh Royal Jelly Moisturizing Repair Essence. Medi-Care is a hybrid pharmacy and cosmetics shop providing a convenient shopping environment for tourists in An Thuong. It highlights traditional Vietnamese turmeric formulations and bee-farm derived skincare products. Biona Turmeric Cream is a classic local anti-acne hero\u2014incredibly affordable yet amazingly effective. Additionally, the shop carries a variety of natural face masks and moisturizing creams ideal for skin hydration after beach outings.", "name": "Medi-Care Pharmacy \u0026 Beauty An Thuong", "transport": "Located on Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng Street, just a 1-minute walk from the An Thuong Bar Street."}], "name": "Iconic Local Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "12 An Th\u01b0\u01a1ng 26, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-buys: Handmade genuine leather sandals, woven leather tote bags, refined cowhide short wallets. Located in the An Thuong tourist area, this small handmade leather shop is beloved by both foreign tourists and local trendsetters, specializing in 100% hand-stitched genuine leather footwear and bags. Rich with the scent of leather, master craftsmen transform premium hides into durable yet stylish accessories. The breathable leather sandals are perfect for Da Nang\u0027s warm weather, and minor custom adjustments can be made on-site to fit your feet perfectly.", "name": "Oasis Handcraft \u0026 Leather", "transport": "About a 3-minute walk from An Thuong Night Market."}, {"address": "34 An Th\u01b0\u01a1ng 3, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-buys: Printed sun-protection surf shirts, original brand graphic T-shirts, lightweight waterproof boardshorts. A trendy staple near My Khe Beach designed for water sports enthusiasts and beachgoers. Packed with ocean and surf vibes, the shop offers stylish, high-UPF surfwear. Their original Da Nang ocean-motif tees are popular souvenirs\u2014lightweight, moisture-wicking, and highly praised by younger crowds.", "name": "Danang Surf \u0026 Beachwear Shop", "transport": "Located on An Thuong 3 Street, about a 5-minute walk from My Khe Beach."}, {"address": "55 An Th\u01b0\u01a1ng 2, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Must-buys: Lightweight pure linen resort dresses, loose breathable men\u0027s linen shirts, handmade linen sun hats. This artistic, hipster-style concept boutique highlights natural linen apparel in minimalist and earthy aesthetics. All linen garments are crafted in local Vietnamese workshops, featuring relaxed, sophisticated cuts that are incredibly breathable\u2014ideal for An Thuong\u2019s slow-paced lifestyle. Beyond clothing, the shop displays ceramics from local independent artists, making it a wonderful spot for unique apparel and home decor.", "name": "Linen \u0026 Clay Boutique", "transport": "Take a taxi to the intersection of An Thuong 2 and Tran Bach Dang Street; it\u0027s just a short walk away."}, {"address": "88 Tr\u1ea7n B\u1ea1ch \u0110\u1eb1ng, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buys: Round woven straw/bamboo bags, printed canvas beach totes, handmade Instagram-worthy picnic basket bags. Overflowing with Southeast Asian resort charm, this specialty accessory shop features walls lined with woven straw, rattan, and sturdy canvas bags crafted by traditional Vietnamese artisans. The selection is vast and meticulously made, ranging from photo-ready hard-shell round rattan bags to spacious resort canvas totes, offering far better quality and value than typical night market stalls.", "name": "Tropical Breeze Rattan \u0026 Canvas Bags", "transport": "Walk along Tran Bach Dang Street, the main artery of the An Thuong tourist area."}, {"address": "19 An Th\u01b0\u01a1ng 4, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-buys: Lace patterned fringe cover-ups, printed backless maxi dresses, handmade beaded ethnic-style sandals. A favorite hidden gem boutique among women visiting Da Nang, this shop exudes romantic and vibrant bohemian coastal vibes. The store\u2019s main highlights are breezy resort maxi dresses and bikini cover-ups with unique prints that stand out. Perfect for stunning photos on My Khe Beach, accompanied by exquisite ethnic accessories and beaded slides.", "name": "Boho Chic Coastal Fashion", "transport": "Located on An Thuong 4 Street, about a 4-minute walk from My Khe Beach."}, {"address": "42 L\u00ea Quang \u0110\u1ea1o, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-buys: Custom traditional Vietnamese Ao Dai, natural silk pajama sets, handmade silk scarves. An excellent choice to experience traditional Vietnamese textile craft in An Thuong. The shop offers premium natural Vietnamese silk fabrics alongside quick, professional custom tailoring services. Customers can receive tailor-made Ao Dai or luxury silk shirts within 24 to 48 hours. The craftsmanship is refined, and prices are often more transparent and reasonable than in Hoi An Ancient Town.", "name": "An Thuong Silk \u0026 Custom Tailor", "transport": "Located on Le Quang Dao, a main commercial street, making it extremely convenient to reach."}, {"address": "67 An Th\u01b0\u01a1ng 1, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buys: Custom vintage cowhide slides, lightweight genuine leather casual shoes, handmade leather key pouches. Combining a working studio with a retail showroom, this local footwear brand specializes in handmade leather shoes and small goods. The owner insists on local artisanal techniques to craft comfortable, durable leather shoes and sandals. Its minimalist vintage style is a hit with expats. Beyond off-the-rack items, customers can semi-customize footwear by selecting leather colors, featuring quick turnaround times and friendly service.", "name": "Footprint Local Shoe \u0026 Leather Lab", "transport": "Located along the middle section of An Thuong 1 Street, close to several cozy cafes."}, {"address": "15 An Th\u01b0\u01a1ng 5, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Must-buys: Local independent designer map-printed T-shirts, embroidered canvas bucket hats, eco-friendly recycled fabric crossbody bags. Hidden in the alleys of the An Thuong tourist area, this trendy concept store showcases clothing and street accessories from emerging local Vietnamese designers. Emphasizing sustainable fashion merged with local culture, its designs incorporate Da Nang landmarks and daily Vietnamese life in a fresh, stylish way. Using mostly organic cotton and recycled fibers, it\u0027s the ultimate spot to support local design and pick up authentic original wear.", "name": "Nomad Concept Store \u0026 Apparel", "transport": "Walk into the alley along An Thuong 5 Street, near the popular expat area."}], "name": "Popular Local Clothing, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "154 Ng\u0169 H\u00e0nh S\u01a1n, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-Buy List: Crispy roasted coconut crackers, special Vietnamese beef jerky, dried anchovies/small fish. Located just steps away from the An Th\u01b0\u01a1ng Area, this local traditional market is the best place to buy authentic and affordable Vietnamese snacks. The market features numerous stalls specializing in dried goods and souvenirs with prices more friendly than chain supermarkets, allowing you to experience the warmth of a traditional market and enjoy free samples.", "name": "M\u1ef9 An Traditional Market (M\u1ef9 An Market - Specialty Snacks)", "transport": "About an 8-minute walk from An Th\u01b0\u1ee3ng Walking Street (An Th\u01b0\u1ee3ng 2)."}, {"address": "239 Nguy\u1ec5n V\u0103n Tho\u1ea1i, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: Black pepper dark chocolate, pistachio dark chocolate, kumquat white chocolate. A premium artisan chocolate brand blending French chocolatier expertise with local Vietnamese cocoa beans. The shop sources cocoa from famous regions in Southern Vietnam and infuses them with uniquely Vietnamese flavors. The colorful, beautifully designed square boxes look highly sophisticated, making them the most presentable gift for friends and family.", "name": "Pheva Chocolate An Th\u01b0\u01a1ng (Pheva Chocolate Da Nang)", "transport": "Located on Nguy\u1ec5n V\u0103n Tho\u1ea1i Avenue, about a 3-minute walk from the An Th\u01b0\u01a1ng Area entrance."}, {"address": "12 An Th\u01b0\u1ee3ng 2, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Must-Buy List: MAROU single-origin dark chocolate, G7 hazelnut cappuccino, Vinamit mixed dried vegetables. A convenient mini-mart located in the heart of the An Th\u01b0\u01a1ng tourist area. Although smaller than major shopping malls, it curates all the top local Vietnamese snacks and drinks favored by international tourists. Highly efficient to shop with fair and transparent pricing, making it perfect for grabbing last-minute souvenirs after a night out.", "name": "WinMart+ An Th\u01b0\u01a1ng 2 Convenience Store", "transport": "Located in the heart of the An Th\u01b0\u1ee3ng 2 walking district, easily accessible on foot."}, {"address": "6 Tr\u1ea7n Th\u1ecb L\u00fd, H\u00f2a C\u01b0\u1eddng B\u1eafc, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-Buy List: Grade-A4 roasted salted cashews with skin, ARCHCAF\u00c9 coconut coffee powder, Cozy lotus tea bags. A massive flagship hypermarket located near the An Th\u01b0\u01a1ng Area, serving as a must-visit souvenir paradise for travelers in Da Nang. The supermarket features a huge dedicated \u0027Vietnamese Souvenir Zone\u0027 with an exceptionally comprehensive selection, offering on-site cardboard box packaging services. It is the top choice for bulk souvenir and snack shopping.", "name": "Lotte Mart Da Nang", "transport": "About a 7-minute Grab taxi ride from the An Th\u01b0\u01a1ng Tourist Area."}, {"address": "48 An Th\u01b0\u1ee3ng 3, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-Buy List: Pure cold-pressed coconut oil, handmade turmeric honey cake, natural herbal tea bags. A famous local Vietnamese natural and organic gift brand, featuring snacks and beauty skincare products made from indigenous Vietnamese plants and agricultural produce. The shop boasts a fresh, natural ambience with pure, additive-free product formulas, highly popular among health-conscious Western and Asian tourists.", "name": "M\u1eb9 Ken House An Th\u01b0\u1ee3ng (Natural Care \u0026 Specialty Snacks)", "transport": "Located on An Th\u01b0\u1ee3ng 3 Street, about a 5-minute walk from M\u1ef9 Kh\u00ea Beach."}, {"address": "An Th\u01b0\u1ee3ng 4, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-Buy List: Freshly roasted spicy cashews, handmade Vietnamese coconut candy, handwoven bamboo mini bags. The bustling An Th\u01b0\u01a1ng Night Market gathers many charming souvenir and craft stalls in the evening. Here, you can buy freshly roasted, aromatic flavored cashews and mixed nuts, as well as select Vietnamese-style woven crafts, soaking up the vibrant tropical night market atmosphere while browsing.", "name": "An Th\u01b0\u1ee3ng Night Market Snacks \u0026 Souvenirs", "transport": "Located within the An Th\u01b0\u01a1ng Night Market pedestrian zone, easily reachable on foot."}, {"address": "88 An Th\u01b0\u1ee3ng 26, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.8 stars | Must-Buy List: Premium Vietnamese high-mountain oolong tea, Phu Quoc premium fish sauce, hand-picked Vietnamese herbal peppercorns. An independent boutique specializing in high-end local specialties, carefully curating the finest agricultural goods from across Vietnam. The shop offers tea tasting, elegant classical packaging infused with rich Vietnamese aesthetics, making it an exceptional place to pick up luxury gifts or high-quality treats for yourself.", "name": "Viet Sense Local Gifts \u0026 Tea Boutique", "transport": "Located on An Th\u01b0\u1ee3ng 26 Street near several popular resorts, about a 4-minute walk."}, {"address": "32 An Th\u01b0\u1ee3ng 10, M\u1ef9 An, Ng\u0169 H\u00e0nh S\u01a1n, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-Buy List: Special handmade dried mango, coconut-flavored coffee beans, cat-themed handmade snack pouches. A beloved indie gift shop popular among young travelers, blending traditional Vietnamese specialties with cute cat-themed creative goods. Dried fruits and coffee beans sold here are produced in partnership with local smallholder farmers, packaged playfully with great quality\u2014a truly unique hidden shopping gem in the An Th\u01b0\u01a1ng Area.", "name": "Cat House Souvenir \u0026 Specialty", "transport": "Located on An Th\u01b0\u1ee3ng 10 Street, about a 6-minute walk from M\u1ef9 Kh\u00ea Beach."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Vo Nguyen Giap Street, Khue My, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.3 stars | Must-Buy List: Discounted international brand perfumes, high-quality premium Vietnamese coffee beans, and hand-carved wooden arts and crafts. Located right along the coastline adjacent to My Khe Beach and the An Thuong Tourist Area, this is the largest modern comprehensive shopping mall in the area. It features numerous international brands, outlet counters, and a large duty-free shop, drawing crowds of foreign tourists hunting for bargains. Bright and spacious with comfortable air conditioning, you can easily step outside to enjoy unbeatable ocean views when you\u0027re tired of shopping. It\u0027s the top choice around the An Thuong area for acquiring premium luxury goods and vacation gear.", "name": "VV Mall Da Nang Duty-Free \u0026 Outlet Zone", "transport": "About a 3-minute Grab ride or a 10-minute walk along the coastal avenue from the heart of the An Thuong Tourist Area."}, {"address": "160 Nguyen Van Thoai, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.4 stars | Must-Buy List: Clearance running shoes, breathable moisture-wicking shirts, and casual beach sports caps. Situated right at the entrance intersection of the An Thuong district, this brand outlet offers high-quality discounted sports gear tailored for outdoor and beach enthusiasts. It features year-round discounts from 30% to 70% off on past-season items, boasting a particularly complete selection of lightweight running shoes and sandals perfect for seaside wear. It\u0027s a favorite secret spot for Western backpackers and expats to buy affordable, authentic sportswear.", "name": "Adidas \u0026 Nike Sports Brand Outlet Da Nang", "transport": "Located on the main thoroughfare of Nguyen Van Thoai Street, about a 5-minute walk from An Thuong Pedestrian Street."}, {"address": "68 An Thuong 2, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.6 stars | Must-Buy List: Hand-painted Da Nang landmark mugs, traditional Vietnamese phin drip coffee filter sets, and locally designed embroidered canvas bags. As Da Nang\u0027s most iconic local creative lifestyle and souvenir brand, the An Thuong branch seamlessly combines a detailed craft showcase with a relaxing cafe environment. Collaborating directly with local Vietnamese artists and artisans, the store offers unique, one-of-a-kind souvenirs and specialty coffee beans. With its trendy tropical indie vibe, visitors can sip authentic local drip coffee while browsing through exquisite gifts.", "name": "Danang Souvenirs \u0026 Coffee - An Thuong Branch", "transport": "Located along the main section of An Thuong 2 Street in the tourist area, an easy walk from anywhere nearby."}, {"address": "33 An Thuong 4, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.7 stars | Must-Buy List: Locally designed rashguards/surf shirts, handmade coconut shell accessories, and natural beach reef-safe balm. Established in the An Thuong area for years, this independent local surf boutique and outlet store is co-run by local surf enthusiasts. It brings together independent Vietnamese action sports brands and discounted past-season items from international labels, offering a colorful range of boardshorts, bikinis, and surf gear. Radiating the cool surf culture of My Khe Beach, it is highly beloved by Western travelers and surfers alike.", "name": "Surf Shack Da Nang Outlet \u0026 Beachwear", "transport": "Situated on An Thuong 4 Street, just a 3-minute walk from the My Khe Beach shoreline."}, {"address": "48 Nguyen Van Thoai, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.5 stars | Must-Buy List: Vietnamese designer summer resort dresses, lightweight men\u0027s linen shirts, and stylish hand-woven straw hats. FM Style is an influential local affordable fashion chain in central and southern Vietnam. The An Thuong branch is specially tailored for the beach district, stocking a vast array of tropical resort-style clothing and accessories at extremely budget-friendly prices with fast-updating styles. Whether you need a last-minute Instagram-worthy beach dress or comfortable cotton-linen casual wear, this store covers all your fashion cravings.", "name": "FM Style Fashion Store - An Thuong District", "transport": "Located on Nguyen Van Thoai Street, the main thoroughfare at the northern entrance of An Thuong district, about a 3-minute walk."}, {"address": "12 An Thuong 26, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.5 stars | Must-Buy List: Pure natural silk scarves, custom-tailored traditional Ao Dai, and handmade geometric bamboo woven bags. This independent cultural boutique emphasizes traditional Vietnamese aesthetics and is loved by travelers who appreciate fine craftsmanship. The store highlights silk products and bamboo artworks from Hoi An and Quang Nam Province, boasting exquisite quality and transparent pricing. Friendly staff share the captivating stories behind each item, making it an elegant shopping spot rich in local heritage right in An Thuong.", "name": "Co Ba Da Nang Souvenir \u0026 Silk Shop", "transport": "Located on An Thuong 26 Street, close to several trendy cafes and international restaurants, easily accessible on foot."}, {"address": "216 Nguyen Van Thoai, My An, Ngu Hanh Son, Da Nang", "feature": "\u2b50 4.6 stars | Must-Buy List: Natural mixed dried fruits and vegetables, Da Lat specialty herbal tea gift sets, and pure wildflower honey. L\u0027angfarm is a renowned Vietnamese brand specializing in high-quality agricultural specialties sourced from the Da Lat Highlands and across Vietnam. The An Thuong store provides a bright and clean shopping environment, with all products subject to strict quality control and beautiful packaging, making them ideal souvenirs for friends and family. Its dried fruits and specialty herbal teas are top tourist favorites.", "name": "L\u0027angfarm Store - An Thuong Da Nang", "transport": "Located on Nguyen Van Thoai Street, the main road on the outer edge of An Thuong district, about a 7-minute walk from An Thuong Pedestrian Street."}, {"address": "6 Nai Nam 9, Hoa Cung Bac, Hai Chau, Da Nang", "feature": "\u2b50 4.4 stars | Must-Buy List: G7 instant black coffee, salted roasted Vietnamese cashew nuts, and Marou premium bean-to-bar dark chocolate. The closest modern multi-story shopping complex and hypermarket to An Thuong district, this is a must-visit shopping paradise for anyone visiting Da Nang. The mall houses international clothing brands, K-beauty cosmetics counters, chain restaurants, and a massive supermarket. Local expats and tourists frequently stock up here on Vietnamese snacks, local specialties, daily necessities, and souvenirs.", "name": "Lotte Mart Da Nang Mall", "transport": "About a 5 to 7-minute Grab taxi ride across the bridge from the An Thuong Tourist Area."}], "name": "Large Malls \u0026 Recommended Outlets"}}, "name": "Anshang Special Tourist District and Nightlife Street"}, "bana_hills": {"categories": {"cat_1": {"items": [{"address": "French Village, Sun World Ba Na Hills, Hoa Vang District, Da Nang", "feature": "\u2b50 4.5 Stars | Must-Buy List: Cocoon Vietnamese Coffee Sugar Lip Scrub, Thorakao Turmeric Spot-Fading Cream. Located in the heart of the French Village at Ba Na Hills, this cosmetics shop brings together Vietnam\u0027s most iconic local botanical skincare brands. The best-seller here is Cocoon, a Vietnamese vegan brand whose skincare products made from local premium coffee and coconut oil are wildly popular among South Korean and Taiwanese tourists. You can also find products from Thorakao, a classic Vietnamese heritage brand offering natural turmeric skincare series at very affordable prices.", "name": "Sun World French Village Beauty Boutique", "transport": "Take the Ba Na Hills Cable Car to French Village Station, then walk along the main plaza for about 3 minutes."}, {"address": "Du D\u00f4me Square, Sun World Ba Na Hills, Hoa Vang District, Da Nang", "feature": "\u2b50 4.6 Stars | Must-Buy List: Da Nang Natural Cajeput Oil, Camellia Nourishing Skincare Oil. Rooted in the Ba Na Hills region, this specialized herbal shop features 100% natural essential oils and soothing herbal salves extracted from plants local to Central Vietnam\u0027s highlands and Da Nang. Cajeput oil is an iconic staple in traditional Vietnamese household medicine kits, renowned for repelling mosquitoes, relieving itching, and soothing respiratory airways. Friendly staff offer on-site trials and detailed introductions, making it a top pick for authentic local health and beauty gifts.", "name": "Ba Na Herbal \u0026 Essential Oils Boutique", "transport": "Located next to Du D\u00f4me Square at the summit; about a 2-minute walk after exiting the cable car station."}, {"address": "Marseille Station Building, Golden Bridge Area, Sun World Ba Na Hills, Da Nang", "feature": "\u2b50 4.4 Stars | Must-Buy List: C\u1ecf M\u1ec1m Green Tea Body Scrub, Vietnamese Lemongrass \u0026 Turmeric Insect Repellent \u0026 Anti-Allergy Balm. Conveniently situated next to the exit of the world-famous Golden Bridge, this drugstore curates top-quality indie cosmetics and skincare brands from Vietnam. C\u1ecf M\u1ec1m is a renowned eco-friendly Vietnamese beauty brand celebrated for its natural, soothing botanical bath and exfoliation products. The shop also stocks essential travel remedies like herbal mosquito balms and creams for ultimate convenience.", "name": "Golden Bridge Herbal \u0026 Cosmetics Souvenir Shop", "transport": "Take the cable car to Marseille Station in the Golden Bridge area; located inside the exhibition exit building."}, {"address": "Mercure Danang French Village Bana Hills, An Son, Hoa Ninh, Hoa Vang, Da Nang", "feature": "\u2b50 4.7 Stars | Must-Buy List: Pure Natural Coconut Massage Oil, Centella Asiatica (Cica) Deep Repair Mask. Affiliated with the luxury spa of the Mercure Hotel at the summit, this premium beauty shop offers relaxing onsite treatments while showcasing high-end Vietnamese organic cosmetics and aromatherapy products. Its signature Cica masks use ingredients harvested in Central Vietnam, offering exceptional soothing and restorative effects for sun-exposed skin\u2014making it a favorite among skincare enthusiasts.", "name": "Anpaz Spa \u0026 Wellness Shop Ba Na", "transport": "Located next to the lobby of Mercure Danang French Village Bana Hills; accessible on foot."}, {"address": "Fantasy Park B1 Floor, Sun World Ba Na Hills, Hoa Vang District, Da Nang", "feature": "\u2b50 4.3 Stars | Must-Buy List: Vedette Volcanic Clay Deep Cleansing Mask, Naomi Tropical Fruit Brightening Hand Cream. Located inside the indoor theme park, this eco-select shop stocks a variety of high-value Vietnamese cosmetics and drugstore items. Vedette clay masks are famous local budget-friendly staples, known for effective oil control and skin repair. Paired with conveniently sized natural hand creams, they make fantastic souvenirs for friends and family.", "name": "Eco Nature Vietnam Beauty Shop - Ba Na Outlet", "transport": "Arrive at the summit by cable car, enter Fantasy Park, and take the escalator down to the B1 shopping area."}, {"address": "Ch\u00e2teau De Cellier, French Village, Sun World Ba Na Hills, Da Nang", "feature": "\u2b50 4.2 Stars | Must-Buy List: Golden Star Balm (Cao Sao V\u00e0ng), Golden Camphor Universal Medicated Oil. Housed within the vintage winery castle complex, this vintage-themed pharmacy counter blends traditional Vietnamese remedies with modern herbal formulation. The iconic Golden Star Balm, hailed as Vietnam\u0027s ultimate cure-all, comes in a nostalgic tin that is both charming and practical. Alongside traditional herb-infused oils, it offers a deep dive into local wellness and remedy traditions.", "name": "Heritage Herbal \u0026 Pharmacy Corner", "transport": "Located in the castle area around the historic Debay Wine Cellar in the French Village; about a 5-minute walk along the cobblestone path."}, {"address": "Moon Castle Complex, Sun World Ba Na Hills, Hoa Vang District, Da Nang", "feature": "\u2b50 4.5 Stars | Must-Buy List: Lemonade Dual-Ended Lip Tint, High-Protection Herbal Sunscreen Spray. Located in the corridor connecting Moon Castle and Sun Castle, this beauty boutique specializes in high-SPF sun protection products suited for Ba Na Hills\u0027 intense high-altitude UV rays, alongside trendy local makeup. Lemonade, a brand founded by a top Vietnamese makeup artist, is famous for vibrant, long-lasting, sweat-proof lip products perfectly tailored for tropical climates.", "name": "Sun Castle Beauty \u0026 Sun-Care Boutique", "transport": "Take the summit Funicular to Moon Castle Station; the boutique is inside the castle shopping arcade right outside the station."}, {"address": "Hoi An Station Ground Level, Sun World Ba Na Hills Entrance, Da Nang", "feature": "\u2b50 4.1 Stars | Must-Buy List: Vietnamese Organic Aloe Hydration Mist, Natural Royal Jelly Repair Lip Balm. Positioned next to the ticket hall at the base cable car entrance, this pharmacy and beauty shop is convenient for picking up sun protection before heading up the mountain or grabbing local beauty souvenirs before leaving. It curates gentle, refreshing local skincare formulations based on royal jelly and aloe vera, offering clear pricing for an easy one-stop shopping experience.", "name": "Ba Na Foot Station Herbal \u0026 Beauty Shop", "transport": "Located next to the ticket hall and visitor service center at the entrance of Hoi An Station at the base of the mountain."}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (French Village Area)", "feature": "\u2b50 4.5 Stars | Must-buy list: Hand-embroidered real silk scarves, custom tailored Vietnamese Ao Dai, handcrafted silk handbags. Located within the French Village of Ba Na Hills, this specialty store offers high-quality Vietnamese silk products and traditional Ao Dai. Featuring a wide range of local prints and delicate embroidery styles, it is immensely popular among visitors who love traditional Vietnamese culture.", "name": "Ao Dai \u0026 Silk Boutique Ba Na", "transport": "Take the Ba Na Hills Cable Car to French Village Station; it\u0027s about a 3-minute walk after exiting."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Du D\u00f4me Square)", "feature": "\u2b50 4.4 Stars | Must-buy list: French retro genuine leather handbags, handmade leather wallets, straw \u0026 leather hybrid bags. Exuding rich 19th-century French romantic charm, this leather shop blends local Vietnamese leathercraft with French design. With exquisite textures and unique styles, it is a great spot to pick up high-quality leather goods, shoes, and bags.", "name": "Chateau Leather \u0026 Bag Boutique", "transport": "Take the cable car directly to Du D\u00f4me Square in the French Village; it\u0027s about a 2-minute walk."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Louvre Station Building)", "feature": "\u2b50 4.6 Stars | Must-buy list: Golden Bridge graphic printed T-shirts, embroidered Sun God baseball caps, themed matching family hoodies. The official flagship apparel shop of the park offers exclusive limited-edition clothing and accessories inspired by Ba Na Hills landmarks like the Golden Bridge and castles, making them highly memorable souvenirs.", "name": "Sun World Souvenir Apparel Shop", "transport": "Located right next to the Ba Na Hills Louvre Cable Car Station; visible within a 1-minute walk after exiting."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Marseille Station near Golden Bridge)", "feature": "\u2b50 4.7 Stars | Must-buy list: Hand-woven round bamboo crossbody bags, hand-painted classic Non La (conical hats), resort-style wide-brim straw hats. An exquisite accessory shop near the Golden Bridge, specializing in pure hand-woven bamboo bags and sun hats by local Vietnamese artisans, packed with Southeast Asian tropical holiday vibes.", "name": "Golden Bridge Straw Bag \u0026 Accessories", "transport": "Take the cable car to Marseille Station, then walk about 2 minutes toward the Golden Bridge observation deck."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Le Jardin D\u0027Amour Area)", "feature": "\u2b50 4.3 Stars | Must-buy list: Printed chiffon resort dresses, hand-embroidered cotton-linen totes, beach-style printed sun-protection shawls. Located beside the Le Jardin D\u0027Amour garden area, this shop offers a variety of women\u0027s resort dresses and tote bags featuring colorful Southeast Asian hand-painted floral motifs\u2014highly recommended by photo-loving travelers.", "name": "Le Jardin Fashion Boutique", "transport": "Take the cable car to Le Jardin Station; it\u0027s about a 4-minute walk to the Le Jardin garden area after exiting."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (French Village Commercial Street)", "feature": "\u2b50 4.5 Stars | Must-buy list: Bohemian print maxi dresses, handmade Vietnamese pattern fanny packs, fringed suede crossbody bags. Blending the romantic atmosphere of the misty mountain peak with Bohemian design, this store offers unique original graphic clothing and handmade bags\u2014perfect for striking a pose at the hilltop castles and Golden Bridge.", "name": "Cloud Bohemia Apparel \u0026 Bags", "transport": "Located on the commercial street of the French Village at the peak; walk 2 minutes along the trail behind the Bell Tower."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Morin Hotel Shopping Arcade)", "feature": "\u2b50 4.2 Stars | Must-buy list: Lightweight handmade cotton-linen casual shoes, windproof and waterproof hooded jackets, portable waterproof camping backpacks. Designed for unpredictable mountain weather and terrain, this practical shop specializes in comfortable, durable artisanal cotton-linen footwear and outdoor functional apparel\u2014highly recommended for travelers exploring mountain trails.", "name": "Ba Na Alpine Shoes \u0026 Casual Wear", "transport": "Located in the shopping arcade on the 1st floor of Morin Hotel, a 3-minute walk after exiting the cable car station."}, {"address": "An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Debay Station Souvenir Area)", "feature": "\u2b50 4.6 Stars | Must-buy list: Hand-woven ethnic cosmetic pouches, embroidered pattern shoulder bags, tribal geometric scarves. Specializing in hand-painted and hand-woven fabric bags and fashion accessories crafted by ethnic minority artisans from the Vietnamese highlands, featuring vibrant colors and unique textures rich in local cultural heritage.", "name": "Highland Ethnic Textile \u0026 Bag Shop", "transport": "Take the cable car to Debay Station; located inside the souvenir shopping area."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "Sun World Ba Na Hills, An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang (Next to French Village Square)", "feature": "\u2b50 4.5 stars | Must-Buy List: Miniature Golden Bridge desk display, Ba Na Hills European-style exclusive mugs, French vintage hand-drawn postcards. Located in the heart of the French Village at Ba Na Hills, this souvenir shop is steeped in 19th-century European charm. The absolute crowd-pleaser is the meticulously crafted 3D miniature Golden Bridge display, boasting a high-quality metallic finish and immense souvenir value. The shop also offers limited-edition mugs featuring Ba Na Hills\u0027 European castle architecture and exquisite postcards\u2014making them the perfect keepsakes for your journey above the clouds.", "name": "French Village Souvenir Shop", "transport": "Take the cable car to French Village Station, then walk about 3 minutes to the center of the square."}, {"address": "Sun World Ba Na Hills, Debay Wine Cellar Exit, Da Nang", "feature": "\u2b50 4.6 stars | Must-Buy List: Debay Wine Cellar exclusive commemorative red wine, Golden Bridge metal bottle opener, crispy dried jackfruit wine snacks. Located at the exit of the century-old Debay Wine Cellar built by the French in 1923, this shop specializes in high-quality wines and wine-pairing snacks. Their signature items include premium red wines featuring the historical Debay Cellar label and metal bottle openers engraved with the Golden Bridge. Many visitors love pairing their wine with locally sourced dried mangoes and crispy jackfruit chips, making it a sophisticated gift choice for elders or close friends.", "name": "Debay Wine Cellar Souvenir Shop", "transport": "Take the Debay Cable Car to Debay Station; after visiting the cellar, follow the exit path to reach the shop."}, {"address": "Sun World Ba Na Hills, Golden Bridge Exit, Da Nang", "feature": "\u2b50 4.7 stars | Must-Buy List: 3D Golden Bridge pop-up card, Ba Na Hills Sea of Clouds double-walled glass tumbler, Giant Hands Bridge 3D keychain. Situated right beside the world-famous Golden Bridge, this cozy kiosk offers highly thematic merchandise. The must-buy 3D Golden Bridge pop-up card never fails to amaze as the giant hands bridge springs to life upon opening. Other popular items include double-walled insulated glass tumblers and metal keychains depicting the bridge floating above a sea of clouds, allowing you to relive the breath-taking beauty of walking 1,400 meters above sea level right at home.", "name": "Golden Bridge Souvenir Kiosk", "transport": "Take the Hoi An Cable Car to Marseille Station, step out onto the Golden Bridge, and find it towards the end of the walkway."}, {"address": "Sun World Ba Na Hills, Hoi An Cable Car Station, Da Nang", "feature": "\u2b50 4.4 stars | Must-Buy List: Da Nang toasted coconut crackers, premium salt-roasted cashew gift box, Vietnamese drip coffee set. Located inside the Hoi An Cable Car Station, this is the perfect spot to stock up on traditional Vietnamese snacks before boarding the cable car. The flagship item here is Central Vietnam\u0027s famous toasted coconut cracker (B\u00e1nh D\u1eeba N\u01b0\u1edbng), delightfully crispy and packed with rich coconut flavor. Additionally, plump salt-roasted cashews paired with a nicely packaged Vietnamese drip coffee gift set allow you to pick up authentic Vietnamese flavors all in one place.", "name": "Hoi An Station Local Product Shop", "transport": "Located inside the main lobby of Hoi An Station at the foot of Ba Na Hills."}, {"address": "Sun World Ba Na Hills, B1 Fantasy Park, Da Nang", "feature": "\u2b50 4.3 stars | Must-Buy List: Sun World mascot plushies, specialty sweet \u0026 spicy dried tamarind, traditional handmade fruit gummies. Located on B3 inside Fantasy Park, this store is a favorite among families and youth. Alongside exclusive Sun World park mascot plushies, the sweet \u0026 spicy dried tamarind is irresistibly addictive with its tangy, slightly spicy profile\u2014a best-selling traditional Vietnamese snack. They also feature colorful, cute boxes of handmade fruit jellies in various flavors, perfect for sharing with friends and colleagues.", "name": "Fantasy Park Merchandise Shop", "transport": "From the French Village, enter the main Fantasy Park building and take the elevator or escalator downstairs."}, {"address": "Sun World Ba Na Hills, Sun Castle Area, Da Nang", "feature": "\u2b50 4.5 stars | Must-Buy List: Vietnamese high-mountain lotus tea, Ba Na Hills limited-edition ceramic tea set, specialty lotus seed pastries. Situated in the newly expanded Sun Castle area of Ba Na Hills, this refined shop highlights premium teas and gourmet snacks. The top recommendation is the Lotus Tea\u2014crafted around Vietnam\u2019s national flower\u2014boasting a crisp, elegant aroma that pairs exquisitely with house-made lotus seed pastries. The store also sells delicate ceramic teacups emblazoned with castle motifs, making it a must-visit for lovers of tea and elegant lifestyle items.", "name": "Sun Castle Tea \u0026 Gift Shop", "transport": "Take the internal funicular train from the French Village towards Moon Castle / Sun Castle to easily reach the Sun Castle area."}, {"address": "Sun World Ba Na Hills, Suoi Mo Station Ground Floor, Da Nang", "feature": "\u2b50 4.2 stars | Must-Buy List: Da Nang spicy tamarind shredded squid, rich coconut candies, handmade rattan souvenir gift baskets. Located near the exit of Suoi Mo Cable Car Station at the foot of the mountain, this store showcases traditional specialties from Da Nang and Quang Nam Province. An absolute must-try is the Spicy Tamarind Shredded Squid (M\u1ef1c Rim Me)\u2014savory, tangy, spicy, and immensely appetizing, making it a favorite local beer snack. The shop also thoughtfully packages items in handcrafted Vietnamese woven rattan baskets, offering high quality, practical, and uniquely local gift sets.", "name": "Suoi Mo Station Specialty Shop", "transport": "Located right at the entrance of Suoi Mo Station inside the main building at the foot of Ba Na Hills."}, {"address": "Sun World Ba Na Hills, Moon Castle Entrance, Da Nang", "feature": "\u2b50 4.6 stars | Must-Buy List: Moon Kingdom fairytale storybook postcards, natural herbal essential oil candles, Moon Castle metal bookmarks. Nestled in the Moon Castle area, this whimsical fantasy-themed boutique feels straight out of a fairytale. The shop offers exclusive cultural and creative souvenirs, such as 3D hardcover storybook-style postcards and intricately designed metal bookmarks. Highly recommended are the handmade scented candles crafted from local Vietnamese herbs and essential oils, infused with subtle hints of agarwood and white tea to bring the mystical mist of Ba Na Hills right into your home.", "name": "Moon Castle Magical Boutique", "transport": "From the French Village, take the Luna Castle cable car or castle funicular directly to Moon Castle Station."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Sun World Ba Na Hills, An Son Village, Hoa Ninh Commune, Hoa Vang District, Da Nang", "feature": "\u2b50 4.6 stars | Must-buy list: Limited-edition French Village snow globe, Ba Na Hills cable car keychain, premium Vietnamese handmade dark chocolate. Located in the heart of the French Village on Ba Na Hills, this official theme outlet flagship store features past- and current-season discounted items of theme park-exclusive merchandise. Visitors can pick up unique souvenirs featuring the Golden Bridge and fairytale castles. Recreating 19th-century French luxury decor, it is an iconic shopping spot you shouldn\u0027t miss when visiting Ba Na Hills.", "name": "Sun World French Village Souvenir Outlet", "transport": "Take the Ba Na Hills Cable Car to the French Village Station, then walk about 1 minute."}, {"address": "Vo Nguyen Giap Street, Hoa Hai Ward, Ngu Hanh Son District, Da Nang", "feature": "\u2b50 4.4 stars | Must-buy list: Discounted Samsonite luggage, sale Coach bags, local Vietnamese luxury coconut perfume. As the most popular coastal-themed outlet mall on the route to Ba Na Hills, VV Mall brings together international designer outlet counters and duty-free shopping, frequently offering 30% to 70% off past-season luxury brands. Bright, spacious, and modern, it attracts both tour groups and independent travelers for a convenient one-stop shopping spree before or after visiting the mountain.", "name": "VV Mall Da Nang Duty Free \u0026 Outlet", "transport": "About a 35-minute taxi or private car ride from the tourist center at the foot of Ba Na Hills."}, {"address": "Morin Station Floor 2, Sun World Ba Na Hills, Hoa Vang District, Da Nang", "feature": "\u2b50 4.5 stars | Must-buy list: Handwoven Cham shawls, special essential oil gift sets, hand-carved wooden 3D postcards. Located inside the Ba Na Hills complex, this representative local independent boutique specializes in creative merchandise and traditional crafts inspired by ancient Cham culture. Featuring handcrafted items from local independent artisans, it highlights unique local craftsmanship rather than mass-produced souvenirs\u2014making it a must-visit spot for lovers of artisanal goods.", "name": "Cham Souvenir \u0026 Craft Shop Ba Na", "transport": "Take the Morin Cable Car line to the Summit Station; located on the 2nd floor shopping area right after exiting."}, {"address": "Golden Bridge Exit, Sun World Ba Na Hills, Hoa Vang District, Da Nang", "feature": "\u2b50 4.7 stars | Must-buy list: Mini carved Golden Bridge giant hands replica, Ba Na high-mountain mist tea, Golden Bridge metallic relief mug. Located right at the exit of the iconic Golden Bridge, this flagship souvenir store is one of the most popular specialty shops on Ba Na Hills. It features official exclusive original products directly tied to the bridge, including intricate giant hand sculptures and high-mountain tea gift boxes, making it a hit with global tourists.", "name": "Golden Bridge Official Souvenir Store", "transport": "Take the cable car to Paradise Station, cross the Golden Bridge, and walk straight into the shop."}, {"address": "Plaza Du D\u00f4me, French Village, Sun World Ba Na Hills, Da Nang", "feature": "\u2b50 4.3 stars | Must-buy list: French artisanal fruit candies, Da Nang specialty salted roasted cashews gift box, Ba Na Hills commemorative whisky. Situated at the central Plaza Du D\u00f4me in the French Village, this large themed specialty shop combines French boutique vibes with local Vietnamese gourmet goods. Offering generous free samples, friendly product explanations, and beautifully wrapped items, it\u0027s an excellent place to pick up souvenir gifts for family and friends.", "name": "Plaza Du D\u00f4me Gourmet \u0026 Gift Corner", "transport": "Walk to the central fountain square in the French Village; the shop\u0027s signage is clearly visible right next to it."}, {"address": "6 Nai Nam Street, Hoa Cung Bac, Hai Chau District, Da Nang", "feature": "\u2b50 4.5 stars | Must-buy list: G7 drip coffee powder, Anh Vu crispy baked coconut crackers, MAROU premium Vietnamese artisanal chocolate. Although located in downtown Da Nang, this massive hypermarket is a go-to spot for tourists visiting Ba Na Hills to stock up on supplies and souvenir gifts. It features Da Nang\u0027s most comprehensive local specialty food section and discounted outlet apparel area. Well-stocked and reasonably priced, it\u0027s perfect for a shopping haul after finishing your day trip to Ba Na Hills.", "name": "Lotte Mart Da Nang", "transport": "About a 40-minute direct private ride or taxi from the foot of Ba Na Hills."}, {"address": "Route 602, Hoa Ninh Commune, Hoa Vang District, Da Nang", "feature": "\u2b50 4.2 stars | Must-buy list: Organic wild honey from the foot of Ba Na Hills, handwoven bamboo baskets, pure natural cinnamon essential oil. Located in Hoa Ninh Commune at the base of Ba Na Hills, this local independent specialty store directly sells high-quality products from local farmers and artisans. Free of aggressive sales tactics, it is known for its rustic honesty and authentic Vietnamese rural charm. Highly affordable, it is an insider secret spot for picking up local agricultural products on your way down the mountain.", "name": "Hoa Ninh Local Specialty \u0026 Crafts Shop", "transport": "Located along Route 602 (the main road to Ba Na Hills); cars can park directly in front of the store."}, {"address": "910A Ngo Quyen Street, An Hai Bac, Son Tra District, Da Nang", "feature": "\u2b50 4.4 stars | Must-buy list: An Phuoc premium Vietnamese men\u0027s dress shirts, Co.op Finelife limited coconut oil hand cream, Lina Moda local designer womenswear. A large comprehensive shopping mall under Vietnamese real estate giant VinGroup, featuring renowned local designer brands and international brand outlet counters. The shopping environment is modern and comfortable\u2014ideal not only for purchasing fashion and cosmetics, but also for experiencing the local high-end retail culture.", "name": "Vincom Plaza Da Nang", "transport": "About a 45-minute taxi ride from the foot of Ba Na Hills."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Sun World Ba Na Hills Theme Park"}, "city_center": {"categories": {"cat_1": {"items": [{"address": "134 L\u00ea Du\u1ea9n, Th\u1ea1ch Thang, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.6 stars | Must-Buy List: Cocoon Winter Melon Cleanser, Thorakao Turmeric Acne Cream, Local Pure Coconut Oil Lip Balm. This is Da Nang\u0027s most iconic local flagship store for a famous beauty chain, hugely popular among local young women and students. The store highlights numerous Vietnamese organic skincare brands and best-selling cosmetics, offering a wide selection at highly competitive prices. Tourists are strongly recommended to stock up on trendy Vietnamese vegan brand Cocoon and classic heritage brand Thorakao. The staff is friendly, and local discounts are frequently available, making it a great spot for purchasing natural skincare products.", "name": "DN Cosmetics Da Nang Flagship Store (DN Cosmetics Le Duan)", "transport": "Located on the bustling L\u00ea Du\u1ea9n shopping street in downtown Da Nang, about a 10-minute walk from the Han River Bridge."}, {"address": "133 Phan Ch\u00e2u Trinh, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.7 stars | Must-Buy List: Cocoon Coffee Body Scrub, Vedette Natural Clay Mask, Milaganics Natural Lemongrass Essential Oil. Hasaki is a top-tier beauty and pharmacy chain that has risen rapidly in Vietnam. This branch in H\u1ea3i Ch\u00e2u District is spacious and bright, with excellent lighting and well-organized displays. The store features a dedicated local organic skincare section offering a full range of products made with local Vietnamese ingredients like herbs, winter melon, pomelo, and coffee. Highly rated for its exceptional quality, affordable prices, and strict quality control, it\u0027s beloved by tourists seeking natural herbal skincare.", "name": "Hasaki Beauty \u0026 Clinic Phan Chau Trinh", "transport": "Located on Phan Ch\u00e2u Trinh Street in H\u1ea3i Ch\u00e2u District, close to Da Nang Cathedral (Pink Church). About a 3-minute Grab taxi ride away."}, {"address": "268 Tr\u01b0ng N\u1eef V\u01b0\u01a1ng, B\u00ecnh Thu\u1eadn, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.4 stars | Must-Buy List: Nau Nau Artisanal Vietnamese Perfume, Cocoon Pomelo Hair Tonic Spray, Natural Organic Herbal Handmade Soap. Beauty Garden is a highly popular cosmetics specialty shop in Central Vietnam, focusing on natural botanical extracts and skincare. A local favorite, it frequently introduces Vietnamese independent designer brands and niche local fragrances\u2014such as Nau Nau perfumes crafted with local flora\u2014exuding rich Vietnamese charm and a hipster vibe. It is the ultimate spot for unique beauty souvenirs.", "name": "Beauty Garden Trung Nu Vuong", "transport": "Located on Tr\u01b0ng N\u1eef V\u01b0\u01a1ng Street, near the south side of the Han River Dragon Bridge, just about 800 meters from the end of the bridge (a 10-minute walk)."}, {"address": "126 L\u00ea Du\u1ea9n, Th\u1ea1ch Thang, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.5 stars | Must-Buy List: BareTT Botanical Hand Cream, Emmi\u00e9 by Happy Skin Brightening Serum, Skinlosophy Herbal Repair Balm. Sammi Shop is a famous Vietnamese cosmetics chain retail store. The H\u1ea3i Ch\u00e2u branch gathers a vast collection of emerging local skincare brands adored by young Vietnamese women. Featuring stylish decor, the friendly staff enthusiastically introduce local beauty trends. Here, you can find lightweight skincare products specifically formulated for Southeast Asia\u0027s hot and humid climate. With high quality and beautiful packaging, they make wonderful skincare gifts for friends and family.", "name": "Sammi Shop Le Duan", "transport": "Located in the L\u00ea Du\u1ea9n commercial district downtown, near the Da Nang Opera House. Easily accessible via Grab or motorbike."}, {"address": "195 Nguy\u1ec5n V\u0103n Linh, Nam D\u01b0\u01a1ng, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.8 stars | Must-Buy List: Golden Star Balm (Cao Sao V\u00e0ng), B\u1ea3o Ph\u01b0\u01a1ng Herbal Oil, White Tiger Balm (Cao B\u1ea1ch H\u1ed5). Long Ch\u00e2u is Vietnam\u0027s largest and most trusted national pharmacy chain. This flagship-sized branch in H\u1ea3i Ch\u00e2u District is the best place to buy traditional Vietnamese balms and herbal health products. Beyond Western medicines, it boasts the most comprehensive selection of classic Golden Star Balm, various soothing herbal oils, and natural acne creams. Prices are fair with guaranteed authenticity, and professional pharmacists provide clear usage instructions.", "name": "FPT Long Ch\u00e2u Pharmacy Nguyen Van Linh", "transport": "Located on Nguy\u1ec5n V\u0103n Linh Avenue, near the main road east of Da Nang International Airport; only about a 5-minute drive from the airport."}, {"address": "157 Nguy\u1ec5n V\u0103n Linh, Nam D\u01b0\u01a1ng, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.5 stars | Must-Buy List: Pharmacity Pure Natural Coconut Body Oil, Th\u00e1i D\u01b0\u01a1ng Herbal Shampoo, Green Medicated Oil (D\u1ea7u Gi\u00f3 Xanh). Pharmacity is an iconic modern pharmacy and drug store in Vietnam, and this branch is situated in the heart of H\u1ea3i Ch\u00e2u District. Besides various pharmaceuticals, it is renowned for its own-brand natural coconut moisturizing series and traditional Vietnamese herbal shampoos. Clean, brightly lit, and featuring clear pricing, it offers tourists a pleasant and reassuring local drugstore shopping experience.", "name": "Pharmacity Nguyen Van Linh", "transport": "Located near the intersection of Nguy\u1ec5n V\u0103n Linh Avenue and Ho\u00e0ng Di\u1ec7u Street, just about a 3-minute drive from the Dragon Bridge."}, {"address": "145 Nguy\u1ec5n Ch\u00ed Thanh, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.3 stars | Must-Buy List: Thorakao Goat Milk Lotion, Cocoon Turmeric Brightening Mask, Guardian Coconut Lip Balm. Although Guardian is an Asian health and beauty chain, its Vietnamese branches deeply integrate many iconic local brands. Located near Han Market, this store features a dedicated \u0027Local Vietnamese Best-Sellers\u0027 section, grouping heritage and emerging brands like Thorakao and Cocoon together so foreign tourists can conveniently pick up local beauty items in one go.", "name": "Guardian Nguyen Chi Thanh", "transport": "Located on Nguy\u1ec5n Ch\u00ed Thanh Street in H\u1ea3i Ch\u00e2u 1 Ward, just a 5-minute walk from the popular tourist spot Han Market."}, {"address": "138 Hu\u1ef3nh Th\u00fac Kh\u00e1ng, Nam D\u01b0\u01a1ng, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.2 stars | Must-Buy List: Natural Mung Bean Facial Powder, Local Handcrafted Lemongrass Essential Oil, Traditional Vietnamese Herbal Hair Tonic. Hoa Mai Cosmetics is an independent local beauty store nestled in an alley in H\u1ea3i Ch\u00e2u District. Operating for many years, it enjoys a stellar word-of-mouth reputation among locals. The owner carefully selects additive-free natural skincare products made by Central Vietnamese farmers, such as pure mung bean face mask powder and cold-pressed lemongrass essential oil. Unburdened by flashy commercial packaging, it offers affordable prices and authentic traditional Vietnamese beauty recipes, highly favored by customers seeking natural, non-toxic beauty products.", "name": "Hoa Mai Cosmetics", "transport": "Located in the Hu\u1ef3nh Th\u00fac Kh\u00e1ng foodie and cosmetics hub, about a 4-minute taxi ride from Dragon Bridge."}], "name": "Iconic Local Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "251 Nguy\u1ec5n Ch\u00ed Thanh, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.5 Stars | Must-Buy List: Baddie-style lace dresses, designer crop tops, metallic buckle shoulder bags. This local Vietnamese women\u0027s wear brand has recently blown up on social media across Southeast Asia and South Korea. Known for its edgy, heavily tailored designs, the store features a cool, modern interior. The clothing boasts excellent quality and flattering silhouettes, making it hugely popular among young local women and fashion influencers. A must-visit trend landmark in H\u1ea3i Ch\u00e2u District.", "name": "LSEOUL Da Nang - Trendy Vietnamese Women\u0027s Wear", "transport": "Take a Grab taxi to Nguy\u1ec5n Ch\u00ed Thanh Road; about a 5-minute walk from the Da Nang Pink Cathedral."}, {"address": "126 L\u00ea Du\u1ea9n, Th\u1ea1ch Thang, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.3 Stars | Must-Buy List: Korean-style oversized T-shirts, Vietnam-made casual jeans, hipster canvas bags. Originating in Da Nang, FM Style is a signature local budget fashion chain across central and southern Vietnam. Its flagship store in H\u1ea3i Ch\u00e2u District offers a spacious shopping environment with a wide variety of clothing, shoes, and accessories for both men and women. With budget-friendly prices and rapid style updates, it is favored by local college students and young professionals. The perfect place to experience authentic, everyday Vietnamese street style.", "name": "FM Style Da Nang - Affordable Local Fashion", "transport": "Take a Grab to L\u00ea Du\u1ea9n Shopping Street, located on the main commercial artery of H\u1ea3i Ch\u00e2u District."}, {"address": "245 Nguy\u1ec5n Ch\u00ed Thanh, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.6 Stars | Must-Buy List: Minimalist cotton-linen dresses, vintage high-waisted wide-leg pants, chic French-style handbags. Lib\u00e9 is a renowned local independent designer brand in Vietnam, featuring a comfortable, elegant, and fresh aesthetic with a touch of personality. The store in H\u1ea3i Ch\u00e2u District is bright and welcoming, utilizing breathable cotton, linen, and premium fabrics tailored for the Southeast Asian climate. With refined cuts, it\u0027s ideal for female travelers seeking minimalist, high-quality, unique pieces.", "name": "Lib\u00e9 Workshop Da Nang - Affordable Luxury Women\u0027s Boutique", "transport": "About a 7-minute walk from Han Market (Ch\u1ee3 H\u00e0n)."}, {"address": "22 Tr\u1ea7n Qu\u1ed1c To\u1ea3n, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.7 Stars | Must-Buy List: Multi-functional large canvas totes, minimalist crossbody chest bags, stylish laptop sleeves. Jamlos is a famous original Vietnamese brand specializing in hipster canvas bags designed and crafted locally. The brand emphasizes minimalist geometric design, extreme durability, vibrant colors, and modern flair. Tucked near an alley in H\u1ea3i Ch\u00e2u District, this artistic shop is the top choice for hipsters and backpackers looking for high-quality, handcrafted Vietnamese bags.", "name": "Jamlos Da Nang - Designer Canvas Bags", "transport": "Just a 6-minute walk from the head of the Dragon Bridge."}, {"address": "200 Nguy\u1ec5n Ch\u00ed Thanh, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.4 Stars | Must-Buy List: Monochrome minimalist geometric shoulder bags, edgy metallic jewelry, stylish block-heel sandals. Founded by a Vietnamese fashion icon, Floralpunk is a wildly popular accessory brand defined by its black-and-white color palette, geometric lines, and modern luxury vibe. The H\u1ea3i Ch\u00e2u store offers a sleek, chic environment with premium-quality shoes, bags, and jewelry at accessible prices, making it a hotspot for local fashionistas seeking versatile, high-aesthetic accessories.", "name": "Floralpunk Da Nang - Minimalist \u0026 Modern Accessories, Shoes \u0026 Bags", "transport": "Take a Grab to near the intersection of Nguy\u1ec5n Ch\u00ed Thanh and Th\u00e1i Phi\u00ean streets."}, {"address": "9 Phan Ch\u00e2u Trinh, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.5 Stars | Must-Buy List: Biti\u0027s Hunter lightweight running shoes, classic retro sneakers, durable summer sandals. Biti\u0027s is a household shoe brand in Vietnam that experienced a massive resurgence with its stylish \u0027Biti\u0027s Hunter\u0027 sneaker series, making it a must-buy for youth and tourists alike. The Phan Ch\u00e2u Trinh store in H\u1ea3i Ch\u00e2u District offers a comprehensive selection of lightweight, breathable shoes with great cushioning and design, all at half the price (or less) of major international brands\u2014delivering exceptional value.", "name": "Biti\u0027s Phan Ch\u00e2u Trinh - Iconic Vietnamese Footwear", "transport": "Located in the heart of H\u1ea3i Ch\u00e2u, just a 3-minute walk from Han Market."}, {"address": "243 Nguy\u1ec5n Ch\u00ed Thanh, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.4 Stars | Must-Buy List: French floral print dresses, soft short-sleeve knits, resort-style woven tote bags. Naked by VB is a popular independent women\u0027s fashion brand in Vietnam, renowned for its soft, French-romantic, and sweet retro aesthetic. The H\u1ea3i Ch\u00e2u store features a cozy, Korean minimalist decor. Designed by a local team, their clothing is lightweight and comfortable\u2014ideal for tropical weather and resort outfits\u2014making it a hit among tourists and local young women.", "name": "Naked by VB Da Nang - Sweet Niche Women\u0027s Clothing", "transport": "Located on the Nguy\u1ec5n Ch\u00ed Thanh fashion street, about a 5-minute walk from Da Nang Pink Cathedral."}, {"address": "255 L\u00ea Du\u1ea9n, T\u00e2n Ch\u00ednh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng, Vietnam", "feature": "\u2b50 4.5 Stars | Must-Buy List: Linen casual trousers, minimalist business slim-fit shirts, solid leather belts. Routine is a highly successful local Vietnamese fashion brand centered around the \u0027Everyday Wear\u0027 philosophy, crafting quality clothing tailored for commuting and daily leisure. Its spacious, bright H\u1ea3i Ch\u00e2u store caters to both men and women with flattering cuts for Asian frames. Matching international fast-fashion brands in quality, it is a must-visit spot for young locals and professionals seeking clean, versatile wardrobe essentials.", "name": "Routine Da Nang - Quality Minimalist Men\u0027s \u0026 Women\u0027s Wear", "transport": "Take a Grab to the center of L\u00ea Du\u1ea9n Fashion Street."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "119 \u0110\u01b0\u1eddng Tr\u1ea7n Ph\u00fa, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-buy list: Salt-roasted cashews with skin, dried mango, and Vietnamese G7 black coffee. Located in the heart of Hai Chau District, Han Market is the top traditional market for tourists looking to buy souvenirs. The first floor is packed with dry goods and snack stalls, where vendors are friendly and many can communicate in simple English or Chinese. The cashews here are plump, crispy, and fragrant, while the dried mango is perfectly sweet without being cloying. Prices are more affordable than standard supermarkets, and you can enjoy the fun of bargaining and tasting samples.", "name": "Han Market (Ch\u1ee3 H\u00e0n)", "transport": "Take a Grab or walk to near the intersection of Tr\u1ea7n Ph\u00fa Street and Nguy\u1ec5n V\u0103n Linh Street."}, {"address": "239 \u0110\u01b0\u1eddng Tr\u1ea7n Ph\u00fa, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buy list: Ph\u00fa Qu\u1ed1c black pepper dark chocolate, Vietnamese cinnamon dark chocolate, and pistachio white chocolate. Co-founded by French and Vietnamese chocolatiers, this premium artisanal chocolate shop uses high-quality local Vietnamese cocoa beans. The shop offers over a dozen unique flavors, with black pepper and cinnamon\u2014infused with local spices\u2014being the most popular. The exquisite colorful square gift boxes can be customized with your choice of flavors, offering great texture and sophistication, making them the most tasteful gifts for friends and family.", "name": "Pheva Chocolate Da Nang", "transport": "Located diagonally opposite Han Market; about a 3-minute walk along Tr\u1ea7n Ph\u00fa Street."}, {"address": "34 \u0110\u01b0\u1eddng B\u1ea1ch \u0110\u1eb1ng, Th\u1ea1ch Thang, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-buy list: Mugs with Da Nang landmark illustrations, hand-painted coconut shell bowls, and traditional Vietnamese rattan bags. Situated along the Han River on B\u1ea1ch \u0110\u1eb1ng Street, this trendy hipster lifestyle shop combines a cafe with products by local designers. It sells many creative items themed around famous landmarks like the Dragon Bridge and the Pink Church, offering quality far superior to standard night market items. When tired of shopping, you can sip a cold brew coffee by the river and enjoy a relaxing shopping vibe.", "name": "Da Nang Souvenir \u0026 Cafe", "transport": "Located along the Han River on B\u1ea1ch \u0110\u1eb1ng Street near the Dragon Bridge; easily accessible on foot or by Grab."}, {"address": "04 Duy T\u00e2n, H\u00f2a C\u01b0\u1eddng B\u1eafc, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Must-buy list: Crispy coconut crackers, seasoned beef jerky, and Vietnamese fish sauce. H\u01b0\u01a1ng \u0110\u00e0 is a well-known souvenir chain brand in Central Vietnam. Its flagship store in Hai Chau District features a bright, spacious layout with transparent pricing. Well-organized and clean, it displays various local Central Vietnamese specialties with free sampling available. The coconut crackers here are crispy and packed with rich coconut flavor, making them a perfect tea snack that draws many family travelers for big hauls.", "name": "H\u01b0\u01a1ng \u0110\u00e0 Specialties Store (Duy T\u00e2n Branch)", "transport": "Close to Da Nang International Airport and the Military Museum; about a 5-minute Grab ride."}, {"address": "290 H\u00f9ng V\u01b0\u01a1ng, V\u0129nh Trung, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.1 stars | Must-buy list: Grilled shredded squid, Vietnamese shrimp crackers, and sweet \u0026 spicy pork jerky. Con Market is the traditional hub where locals in Da Nang do their everyday shopping, offering a much more authentic local vibe than Han Market. Tucked away in the dry goods section at the back of the first floor are premium dried seafood and nostalgic snacks known mostly to local regulars. The grilled squid and shrimp crackers are fresh and affordably priced, ideal for travelers wanting an authentic cultural experience and genuine local snacks.", "name": "Con Market (Ch\u1ee3 C\u1ed3n)", "transport": "Located at the intersection of H\u00f9ng V\u01b0\u01a1ng Street and \u00d4ng \u00cdch Khi\u00eam Street; take a Grab directly to Ch\u1ee3 C\u1ed3n."}, {"address": "103 Ho\u00e0ng Di\u1ec7u, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-buy list: Sesame rice cakes (B\u00e1nh Kh\u00f4 M\u00e8 B\u00e0 Li\u1ec5u), local baby shrimp paste (M\u1eafm T\u00f4m R\u00fac), and coconut candies. Guided by the motto of \u0027bringing home the most authentic gifts from Da Nang,\u0027 this store curates traditional products from long-standing heritage brands in Central Vietnam. The highlight is the traditional handmade sesame rice cakes from Da Nang, coated in aromatic sesame seeds and maltose with a crispy yet tender interior\u2014a recognized Vietnamese national traditional delicacy. The warm and enthusiastic staff will happily share the story behind each item.", "name": "\u0110\u1eb7c S\u1ea3n L\u00e0m Qu\u00e0 Souvenir Store", "transport": "Located on Ho\u00e0ng Di\u1ec7u Street; about a 3-minute Grab ride from the west side of Dragon Bridge."}, {"address": "488 \u0110\u01b0\u1eddng 2 Th\u00e1ng 9, H\u00f2a C\u01b0\u1eddng B\u1eafc, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-buy list: Archcaf\u00e9 Coconut Condensed Milk Coffee, Vinamit dried mixed fruits/vegetables, and AHH cheese corn sticks. Situated in the southern part of Hai Chau District, Lotte Mart is a massive hypermarket where tourists can buy popular Vietnamese snacks in one go. The 4th floor features a huge dedicated souvenir section packed with tourist favorites like coffee, instant noodles, dried fruits, and nuts. Prices are completely transparent, and free cardboard boxes with tape are provided for hassle-free packing\u2014making it the best spot for bulk shopping chain-brand snacks before heading home.", "name": "Lotte Mart Da Nang", "transport": "Located on 2 Th\u00e1ng 9 Street in southern Hai Chau District; easily accessible by Grab."}, {"address": "133 Nguy\u1ec5n Ch\u00ed Thanh, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buy list: \u00c1o d\u00e0i metal bookmarks, hand-painted wooden postcards, and organic Vietnamese herbal tea. Located on Nguy\u1ec5n Ch\u00ed Thanh Street, M\u1ed9c Souvenir is a cozy boutique shop filled with natural aesthetic crafts and gifts, focusing on handmade works by local Vietnamese creators. The \u00c1o d\u00e0i bookmarks are elegant and refined, while the hand-painted postcards delicately capture Da Nang\u0027s coastal beauty. Lightweight and meaningful, they are delightful keepsakes favored by hipsters and female travelers.", "name": "M\u1ed9c Souvenir \u0026 Gift Shop", "transport": "Located on Nguy\u1ec5n Ch\u00ed Thanh Street; about a 5-minute walk from Han Market."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "74 B\u00e1ch \u0110\u1eb1ng, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.1 stars | Must-buy list: Highlands Coffee signature cashew coffee, Pedro Vietnam exclusive leather goods, PIZZA 4P\u0027S handmade fresh cheese. A premier lifestyle and boutique shopping mall right on the front row of the Han River, combining international affordable luxury brands with fine Vietnamese dining. Excellent air conditioning and bright natural light make it the perfect place to beat the heat and shop for chic fashion items.", "name": "Indochina Riverside Mall", "transport": "Take a Grab or taxi to the intersection of Bach Dang Road and the Han River Bridge."}, {"address": "255 H\u00f9ng V\u01b0\u01a1ng, V\u0129nh Trung, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.3 stars | Must-buy list: G7 Vietnamese cashews, TH True Milk coconut yogurt, VIFON instant Pho noodle packets. Da Nang\u0027s most iconic hypermarket and department store in the city center. Spanning three floors, it features a hypermarket, clothing counters, and a local food court with highly competitive prices\u2014making it the top choice for tourists to stock up on local snacks and souvenirs in one go.", "name": "GO! Da Nang Shopping Center (Formerly Big C)", "transport": "About a 5-minute drive from the Dragon Bridge to the intersection of Hung Vuong and Nguyen Van Linh roads."}, {"address": "6 N\u1ea1i Nam 9, H\u00f2a C\u01b0\u1eddng B\u1eafc, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.4 stars | Must-buy list: MAROU premium artisanal dark chocolate, Vinamit mixed dried fruits, Anh Vu roasted salted cashews with skin. A large comprehensive shopping center located in the southern part of Hai Chau District. It offers free luggage storage and on-site tax refund services, along with dedicated souvenir zones and local Vietnamese specialty displays, making it extremely popular among international tourists.", "name": "Lotte Mart Da Nang", "transport": "About a 10-minute taxi drive south from the city center along the west bank of the Han River."}, {"address": "236 L\u00ea Du\u1ea9n, T\u00e2n Ch\u00ednh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.2 stars | Must-buy list: Adidas classic running shoes, discounted Nike training wear, Puma printed sportswear T-shirts. Located on Le Duan Street, Da Nang\u0027s busiest fashion shopping corridor. It aggregates factory outlet stores of several world-famous sports brands, offering year-round discounts of 30% to 70% off, making it the best spot to pick up authentic athletic gear.", "name": "Le Duan Sports Factory Outlet", "transport": "About a 10-minute walk from Da Nang Railway Station, or take a Grab directly to Le Duan Shopping Street."}, {"address": "34 B\u00e1ch \u0110\u1eb1ng, Th\u1ea1ch Thang, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buy list: Hand-painted Da Nang Dragon Bridge mugs, Vietnamese hand-embroidered cosmetic pouches, natural coconut aromatherapy essential oils. An iconic local independent creative souvenir store on Bach Dang Road. Combining a cozy cafe with a lifestyle concept store, it sells handicrafts, fine apparel, and stationery crafted by local Vietnamese designers, boasting exceptional quality and unique charm.", "name": "Danang Souvenirs \u0026 Cafe (Bach Dang Flagship Store)", "transport": "Located along the Han River on Bach Dang Road near the Da Nang City Hall; easily accessible by walking or taxi."}, {"address": "239 Tr\u1ea7n Ph\u00fa, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.6 stars | Must-buy list: Black sesame dark chocolate, Phu Quoc black pepper chocolate, customized rainbow gift boxes. A boutique artisanal dark chocolate shop co-founded by a French-Vietnamese team. Using single-origin cocoa beans from Ben Tre combined with vibrant, elegant packaging, it offers up to 18 unique flavors\u2014a famous landmark for gourmet edible gifts in Da Nang.", "name": "Pheva Chocolate Da Nang", "transport": "About a 3-minute walk from Han Market along Tran Phu Street."}, {"address": "254 Tr\u1ea7n Ph\u00fa, Ph\u01b0\u1edbc Ninh, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.7 stars | Must-buy list: Handmade rattan picnic bags, Vietnamese lacquerware wooden trays, natural printed silk scarves. A distinctive independent craft boutique in Hai Chau District featuring carefully curated original works from traditional artisans across Vietnam. Ranging from handwoven bags to exquisite lacquerware, the gallery-like interior setup makes it a favorite among travelers seeking premium-quality souvenirs.", "name": "Hoa Lee Vietnam Crafts \u0026 Gifts", "transport": "Located near the intersection of Tran Phu Street and the head of the Dragon Bridge, about a 5-minute walk from the Dragon Bridge."}, {"address": "31 Y\u00ean B\u00e1i, H\u1ea3i Ch\u00e2u 1, H\u1ea3i Ch\u00e2u, \u0110\u00e0 N\u1eb5ng", "feature": "\u2b50 4.5 stars | Must-buy list: CoCoFi coconut chips, Cozy lotus green tea bags, locally roasted Da Nang organic coffee beans. An independent boutique grocery market popular among Da Nang\u0027s middle class and expats. Highlighting high-quality Vietnamese organic produce, curated local teas, and elegant snack gift boxes, it boasts a clean, bright shopping environment with strict quality control.", "name": "Joly Mart Yen Bai", "transport": "About a 2-minute walk from Han Market along Yen Bai Street."}], "name": "Major Department Stores \u0026 Outlets"}}, "name": "Downtown an
