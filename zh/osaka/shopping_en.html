quality domestic Japanese soybeans for its creations. In addition to ultra-rich soy milk to enjoy on the spot, its house-developed soy pudding and soybean snacks are huge hits with health-conscious shoppers, showcasing the elegant flavor of Japanese soybean delicacies.", "name": "Takahashi Tofu Kuromon", "transport": "Approx. 4-minute walk from Exit 10 of Nipponbashi Station on the Osaka Metro Sennichimae Line"}, {"address": "2-2-21 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | Must-Buy List: Famous Osaka Mizu-Nasu (water eggplant) pickles, sweet simmered kombu, ginger shiso pickles. A century-old pickled goods and kelp shop filled with barrels and vacuum-packed specialty pickles. Its signature vacuum-packed Senshu water eggplant pickles from Osaka are incredibly juicy and refreshing\u2014a perfect gift representing traditional Osaka food culture.", "name": "Iseya Honten Kuromon", "transport": "Approx. 3-minute walk from Exit 10 of Nipponbashi Station on the Osaka Metro Sennichimae Line"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "3-28 Rinku Ourai Minami, Izumisano, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buys: Nike sneakers, discounted Coach handbags, Skechers casual shoes. The largest outlet center in the Kansai region, directly accessible from Namba and Nipponbashi via the Nankai Electric Railway. Gathering over 250 international luxury brands and Japanese fashion labels, it offers incredible discounts alongside stunning ocean views\u2014making it a ultimate shopping paradise for a final spending spree before leaving Osaka.", "name": "Rinku Premium Outlets", "transport": "About a 6-minute walk from Rinku-Town Station on the Nankai Electric Railway Kansai Airport Line."}, {"address": "4-15-17 Nipponbashi, Naniwa-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buys: Popular limited-edition anime merchandise, voice actor concert Blu-rays, officially lic ress": "6-17-12 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buys: Showa-era vintage printed dress, retro leather crossbody bag, 1970s antique high heels. Located near Karahori Shopping Street, Green Pepe is one of Osaka\u2019s most iconic Showa-era vintage stores. The shop boasts a treasure trove of 1970s and 1980s Japanese vintage clothing, shoes, and bags featuring vibrant colors and unique patterns\u2014ensuring you\u0027ll never match anyone else. Many Japanese fashion designers and trendsetters visit specifically to hunt for limited-edition items steeped in history and nostalgic Osaka charm.", "name": "Green Pepe Vintage Store", "transport": "About a 4-minute walk from Exit 4 of Tanimachi 6-chome Station on the Osaka Metro Tanimachi Line"}, {"address": "Inside Len, 6-14-2 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Artisan handmade genuine leather tote bag, minimalist Japanese leather coin purse, hand-stitched leather shoes. Nestled inside the historic complex building \u0027Len\u0027, Bocchi is a standout local leather shoe and bag boutique in the Tanimachi area. Highlighting handcrafted leather goods made by Japanese artisans, it uses carefully selected domestic high-grade leather that retains its original warm texture and grain. Over time, the leather develops a unique patina, earning high praise from both locals and tourists who appreciate fine craftsmanship.", "name": "Bocchi (Len Store)", "transport": "About a 2-minute walk from Exit 4 of Tanimachi 6-chome Station on the Osaka Metro Nagahori Tsurumi-ryochi Line"}, {"address": "3-2-8 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buys: Japanese Okayama selvedge denim jeans, Amekaji (American casual) style canvas bag, artisan hand-stitched leather work boots. Located in Tanimachi 3-chome, this select shop is a hidden gem for men\u0027s fashion and workwear enthusiasts in Osaka. Focusing on a blend of premium Japanese local apparel and American vintage aesthetic, the store curates top-tier Japanese denim alongside handmade shoes and bags. Combining durability with high-end design, it is beloved by Osaka locals with a keen eye for quality and detail.", "name": "Bow \u0026 Arrow Tanimachi", "transport": "About a 3-minute walk from Exit 1-A of Tanimachi 4-chome Station on the Osaka Metro Tanimachi Line"}, {"address": "1-3-5 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buys: Nordic-style printed patchwork dress, lightweight windproof embroidered canvas tote, Nordic-inspired soft leather flats. Situated near Tanimachi 1-chome and Temmabashi, Keitto is a local Osaka design label inspired by Nordic lifestyle aesthetics. The clothing is famous for elegant, natural, and lively pattern prints, while its shoes, bags, and accessories exude a warm, charming handcrafted feel. With affordable prices and great quality, it is a go-to everyday fashion shop for local office workers and mothers in the Tanimachi area.", "name": "Keitto Temmabashi (Tanimachi Store)", "transport": "About a 2-minute walk from Exit 4 of Temmabashi Station on the Osaka Metro Tanimachi Line"}, {"address": "5-6-9 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.7 stars | Must-Buys: Custom handcrafted leather shoes, vegetable-tanned minimalist long wallet, minimalist leather shoulder bag. Atelier Kura is a renowned independent artisan leather footwear and bag studio tucked away in Tanimachi\u0027s backstreets. The owner and shoemaker insists on crafting everything entirely by hand to order, offering everything from small-batch ready-made shoes to bespoke custom-fitted footwear. The leather bags boast clean, elegant lines and exceptionally sturdy stitching, making this a top secret spot for discerning Osaka locals seeking unique, trend-defying pieces.", "name": "Atelier Kura", "transport": "About a 5-minute walk from Exit 8 of Tanimachi rs feature a delightful restaurant area, offering a comfortable shopping experience rich in local Kansai lifestyle atmosphere.", "name": "Keihan Department Store Temmabashi", "transport": "Directly connected to Temmabashi Station on the Subway Tanimachi Line and Keihan Electric Railway"}, {"address": "1-11 Matsuomachi, Kadoma, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Must-buys: Discounted BEAMS season jackets, Mont-bell outdoor functional wear, Onitsuka Tiger classic retro sneakers. Easily accessible via the Keihan Main Line from Temmabashi or Kyobashi, this newly opened mega dual-concept shopping complex in Osaka combines an outlet mall with a LaLaport shopping center! Housing over 250 stores, including major international luxury brands and trendy Japanese labels, it offers huge discounts especially on sportswear and Japanese women\u0027s fashion.", "name": "Mitsui Outlet Park Osaka Kadoma", "transport": "Approx. 8-minute walk from Kadomashi Station on the Keihan Main Line (Directly accessible via Keihan Railway from Temmabashi or Kyobashi Station)"}, {"address": "2-1-38 Higashinodacho, Miyakojima Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Must-buys: Urban Research Japanese fashion for men \u0026 women, Kukuru takoyaki exclusive merch, PLAZA imported cosmetics \u0026 lifestyle accessories. A landmark department store at Kyobashi Station near the northern entry of Osaka Castle, favored by local commuters and youngsters. It houses numerous Japanese apparel brands, stationery/lifestyle boutiques, and unique Kansai souvenirs. Seamlessly connected to the station, it\u0027s perfect for a shopping spree right after visiting Osaka Castle.", "name": "Keihan Mall Kyobashi", "transport": "Directly connected to Kyobashi Station on the JR Loop Line, Subway Nagahori Tsurumi-ryochi Line, and Keihan Main Line"}, {"address": "6-1-55 Uehommachi, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Must-buys: Fukusaya Castella cake, Osaka Takashimaya collaborative fine sake, handmade Japanese leather bags. A traditional large department store at the southern end of the Tanimachi Line. Though long-standing, it is remarkably well-maintained, offering a pleasant and uncrowded shopping atmosphere compared to the bustling Umeda area. The basement food hall features top-quality traditional ingredients from Nara and Osaka, while upper floors house dedicated sections for stationery and home goods\u2014an excellent spot to experience an elegant local vibe.", "name": "Kintetsu Department Store Uehommachi", "transport": "Approx. 5-minute walk from Tanimachi 9-chome Station on the Subway Tanimachi Line, or directly connected to Kintetsu Osaka-Uehommachi Station"}, {"address": "2-1-70 Morinomiyachuo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Must-buys: ABC-MART exclusive running shoes, outdoor brand functional windbreakers, Kansai-themed stationery. Located on the southeast side of Osaka Castle Park, this unique open-air lifestyle mall features Japan\u0027s first rooftop running track, the Air Track. Focused on sports, outdoor recreation, and casual lifestyle, it boasts numerous Japanese casual fashion brands, large sporting goods stores, and family-friendly facilities, all bathed in natural light and vibrant greenery.", "name": "Morinomiya Q\u0027s Mall BASE", "transport": "Right outside Exit 2 of Morinomiya Station on the Subway Chuo Line / Nagahori Tsurumi-ryochi Line"}, {"address": "1-1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture (Inside Osaka Castle Honmaru)", "feature": "\u2b50 4.3 stars | Must-buys: Osaka Castle exclusive gold leaf crafts, Sengoku samurai warrior creative merchandise, Kansai matcha gift sets. Originally the Former Fourth Division Headquarters of the Imperial Japanese Army, this magnificent historic building exudes a grand European castle aesthetic. Now transformed into a shopping venue, it houses souvenir shops, artisan boutiques, and elegant tea rooms rich in Osaka\u0027s cultural heritage\u2014making it a fantastic destination for purchasing sophisticated, historic keepsake gifts.", "name": "MIRAIZA OSAKA-JO", "transport": "Approx. 15-minute walk from Exit 1B or 9 of Tanimachi 4-chome Station on the Subway Tanimachi Line (Located right beside the Castle Main Keep)"}, {"address": "6-17-43 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Must-buys: Ek Chuah raw craft chocolates, artisan leather keychains, handmade ceramic tableware. Located near Nagahori-dori in Tanimachi 6-chome, this local independent lifestyle complex was converted from a 100-year-old early-Showa era traditional townhouse (kominka). It houses Ek Chuah, one of Osaka\u0027s premier gourmet chocolatiers, along with local handcrafted leather workshops and curated lifestyle goods from independent Japanese creators, exuding a charming indie hipster vibe.", "name": "Karahori Neri", "transport": "Approx. 3-minute walk from Exit 4 of Tanimachi 6-chome Station on the Subway Tanimachi Line / Nagahori Tsurumi-ryochi Line"}, {"address": "3-1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Must-buys: Osaka Castle branded canvas bags, Kansai craft beer gift sets, exquisite Japanese fabric accessories. Nestled right next to JR Osakajokoen Station, this lush green shopping complex features single-story wooden architecture that blends seamlessly with nature. It brings together stylish Kansai lifestyle concept stores, trendy fashion pop-ups, and specialty souvenir shops. Offering a relaxed shopping atmosphere, it is an ideal spot combining beautiful natural scenery with high-quality retail.", "name": "JO-TERRACE OSAKA", "transport": "Directly connected to Osakajokoen Station on the JR Loop Line, approx. 3-minute walk from Osaka Business Park Station on the Subway Nagahori Tsurumi-ryochi Line"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Osaka Castle / Tanimachi"}, "tennoji-shinsekai" nt store, Shop In is an iconic select beauty variety shop chain in Osaka. The store curates trending cosmetics and niche skincare products highly talked about on Japanese social media, making it a must-visit for fashion-forward women. It showcases items from Japan\u0027s authoritative cosmetics awards throughout the year and features exclusive limited-edition shades not available in regular drugstores, making it a fantastic spot to discover the latest Japanese beauty trends.", "name": "Shop In Tennoji MIO", "transport": "Directly connected to JR Tennoji Station Central Exit, about 1 minute walk"}, {"address": "1-1-43 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture (Inside ekimo Tennoji)", "feature": "\u2b50 4.0 stars | Must-Buy List: Santen Sante FX Cooling Eye Drops, Ryukakusan Herbal Refreshing Drops, ANESSA Perfect UV Sunscreen Skincare Milk. Located in the Ekimo underground shopping street directly connected to Tennoji Subway Station, Kokumin is a long-established local drugstore chain in the Kansai region. Boasting a prime location, this store is the perfect quick-restock spot for commuters and transferring travelers. Although the store space is compact, the product selection is remarkably complete\u2014ranging from emergency cold medicines and hand creams to eye-catching seasonal sunscreens and moisturizers. The staff is friendly and highly efficient.", "name": "Kokumin Drug Ekimo Tennoji", "transport": "Directly connected via the underground concourse of Tennoji Station on the Osaka Metro Midosuji Line"}, {"address": "1-5-31 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Alinamin EX Plus, Shiseido Urea Deep Nourishing Hand Cream, Kracie Hadabisei 3D Facial Mask. Situated in a prime location in front of JR Tennoji Station, Sundrug is famous for its price advantage on well-known Japanese health supplements and medicines. The store frequently launches bargain sales on hot-selling skincare products and pharmaceuticals, keeping it bustling with customers. With resident pharmacists available for consultation and clearly labeled medications, it is a popular local drugstore you shouldn\u0027t miss if you plan to buy household medicines and supplements in bulk.", "name": "Sundrug Tennoji Ekimae", "transport": "About a 2-minute walk from JR Tennoji Station South Exit"}, {"address": "1-1-43 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture (Kintetsu Department Store Abeno Harukas Main Store Tower Building 2F)", "feature": "\u2b50 4.5 stars | Must-Buy List: ALBION Skin Conditioner Essential, POLA Wrinkle Shot Medical Serum, Cl\u00e9 de Peau Beaut\u00e9 Correcting Cream Veil. Located inside Japan\u0027s tallest skyscraper, Abeno Harukas, the beauty section of Kintetsu Department Store brings together one of Japan\u0027s most comprehensive selections of luxury cosmetics and skincare counter brands. It offers top-tier, attentive Japanese hospitality, including professional skin analysis and personalized makeup consultations. The department store features a dedicated tax-refund counter for international travelers, and its ultra-luxurious and elegant shopping environment makes it the top destination for purchasing high-end skincare.", "name": "Kintetsu Department Store Abeno Harukas Cosmetics Counter", "transport": "Directly connected to Kintetsu Osaka-Abenobashi Station, about a 1-minute walk from JR Tennoji Station"}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "2-4-14 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | Must-buy list: Dragon \u0026 Phoenix embroidery Sukajan jackets, Osaka-exclusive leopard print souvenir jackets. Located in a historic shopping arcade next to Tsutenkaku Tower, this shop specializes in Sukajan embroidered jackets featuring bold Showa Yakuza and retro street styles. Every motif is meticulously embroidered by Japanese artisans, ranging from mythical beasts to Osaka landmarks, making it Sh ty store is a collaboration between Japan\u0027s famous snack brand Calbee and Hankyu Department Store, with its only directly managed counter located in Hankyu Umeda. Made from premium Hokkaido potatoes cut several times thicker than standard chips, they boast a solid crunch and rich potato aroma paired with carefully selected gourmet salt, cheese, and seasonings. Packaged exquisitely, it is a luxurious souvenir you definitely shouldn\u0027t miss when visiting Umeda.", "name": "Grand Calbee (Hankyu Umeda)", "transport": "About a 3-minute walk from Hankyu Railway \u0027Osaka-Umeda Station\u0027, or a 4-minute walk from JR \u0027Osaka Station\u0027"}, {"address": "B1F, Hankyu Department Store Umeda Main Store, 8-7 Kakudacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Clarified butter French biscuit sticks, Uji matcha butter sticks, seasonal purple yam biscuit sticks. Known as the \u0027Herm\u00e8s of Pocky\u0027, Baton d\u0027or is the ultra-premium line under the Glico Group, with its very first store born at Hankyu Umeda. Baked with high-purity clarified butter and special flour, each stick delivers a rich buttery aroma and ultimate crispiness, coated with high-purity matcha, chocolate, or fruity icing. Its uniquely rich flavor makes first-timers lifelong fans, making it an immensely popular souvenir that constantly draws long lines in Umeda.", "name": "Baton d\u0027or Premium Biscuit Sticks (Hankyu Umeda)", "transport": "About a 3-minute walk from Hankyu Railway \u0027Osaka-Umeda Station\u0027, or a 2-minute walk from Subway Midosuji Line \u0027Umeda Station\u0027"}, {"address": "B1F, Hankyu Department Store Umeda Main Store, 8-7 Kakudacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Rich Camembert cheese rice crackers, Wakayama peach flavor crackers, Uji matcha crackers. This specialty boutique elevates Happy Turn, Japan\u0027s iconic national rice cracker, into a luxurious creation, with only a few exclusive counters across Japan. Crafted using 100% domestic Japanese rice as the base and layered with gourmet seasoning powders, it elevates a humble snack into an exquisite treat bursting with fruity, cheesy, or tea notes. The fine texture balances sweet and savory notes perfectly, and the beautifully illustrated gift boxes make it an ideal present.", "name": "HAPPY Turn\u0027s Premium Rice Crackers (Hankyu Umeda)", "transport": "About a 4-minute walk from JR \u0027Osaka Station\u0027, or a 3-minute walk from Hanshin Electric Railway \u0027Osaka-Umeda Station\u0027"}, {"address": "B1F, Hankyu Department Store Umeda Main Store, 8-7 Kakudacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Sun-dried salt fried Kaki no Tane, toasted soy sauce peanuts, tempura wasabi Kaki no Tane. A premium rice cracker brand jointly developed by Kameda Seika (the pioneer of Kaki no Tane) and Hankyu Department Store, dedicated to innovative techniques and flavorings. Utilizing proprietary methods like deep-frying, roasting, and steeping, it turns a traditional bar snack into a sophisticated, multi-layered delicacy. Pairing wonderfully with beer or oolong tea, it is a unique and locally beloved top choice for savory gifts in the Kansai region.", "name": "TANEBITS Premium Kaki no Tane Specialty Store (Hankyu Umeda)", "transport": "About a 2-minute walk from Subway Midosuji Line \u0027Umeda Station\u0027"}, {"address": "B1F, Hanshin Department Store Umeda Main Store, 1-13-13 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Signature White Chocolate GOUTER de ROI Rusk, Kansai-exclusive Matcha Butter Rusk, Original Fermented Butter Rusk. Located in Hanshin Department Store Umeda Main Store, this popular counter draws eager crowds daily. Its signature GOUTER de ROI uses custom sliced French baguettes slathered with rich fermented butter and sugar before being baked to a golden crisp, offering a sweet, light, and crunchy taste. The seasonal white chocolate-coated version (winter/spring) and Kansai-exclusive matcha flavor are buttery and delightful without being overly sweet\u2014a classic treat worth standing in line for.", "name": "GATEAU FESTA HARADA Rusk (Hanshin Umeda)", "transport": "Directly connected to Hanshin Electric Railway \u0027Osaka-Umeda Station\u0027, or about a 3-minute walk from JR \u0027Osaka Station\u0027"}, {"address": "Inside Eki Marche Osaka, 1F JR Osaka Station, 3-1-1 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Freshly baked cloud-soft cheesecake, handmade apple pie, fresh milk pudding. One of Osaka\u0027s most iconic and beloved specialties, conveniently located inside Eki Marche at JR Osaka Station. Famous for its freshly baked souffle-style cheesecakes made with Danish cream cheese, fresh milk, and sweet plump raisins at the bottom, offering a cloud-like, moist, and fluffy texture. When the handbell rings, a fresh batch is ready! Affordable and irresistibly aromatic, it\u0027s a budget-friendly must-try souvenir when visiting Osaka.", "name": "Rikuro-ojisan\u0027s Cheesecake (Eki Marche Osaka)", "transport": "Right outside the Sakurabashi Gate ticket barriers of JR \u0027Osaka Station\u0027"}, {"address": "B1F, Daimaru Umeda Store, 3-1-1 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Signature Dojima Roll, Fruit Mille-Feuille Cake, Amber Caramel Roll. Originating from Dojima in Osaka, Moncher is the pioneer of Japan\u0027s fresh cream cake roll trend, operating a highly popular boutique at Daimaru Umeda. Its signature roll is filled with luscious cream made from carefully selected Hokkaido fresh milk, wrapped in an airy, fragrant sponge cake. The cream is rich yet delightfully light and melt-in-your-mouth. Beyond whole rolls, individual slices for immediate enjoyment and beautifully packaged baked goods gift sets are available, making it an absolute staple for dessert lovers.", "name": "Moncher Dojima Roll (Patisserie Moncher Daimaru Umeda)", "transport": "Directly connected to JR \u0027Osaka Station\u0027, or about a 2-minute walk from Subway Midosuji Line \u0027Umeda Station\u0027"}, {"address": "1F LUCUA Osaka, 3-1-3 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Bite-sized cannel\u00e9 gift box, matcha cannel\u00e9, fig cannel\u00e9. Originally from Ashiya, Hyogo, this hugely popular bite-sized cannel\u00e9 shop is located in LUCUA Osaka. Their signature cannel\u00e9s feature a caramelized, crunchy exterior and a delightfully soft, moist center, offered in various flavors such as original, cocoa, matcha, fig, and walnut. Their dainty bite-size form allows you to sample multiple flavors at once, while the exquisite wooden boxes and chic packaging make them a double delight for both taste buds and eyes.", "name": "Daniel Cannel\u00e9 Specialty Store (Daniel LUCUA Osaka)", "transport": "Directly connected to the Bridge Gate of JR \u0027Osaka Station\u0027, about a 1-minute walk"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "8-7 Kakudacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buys: Grand Calbee thick-cut potato chips, B\u00e2ton d\u0027or premium Pretz sticks, Sugar Butter Tree Hankyu-exclusive milk cream sandwich cookies. As Osaka\u0027s most iconic heritage luxury flagship department store, it boasts a rich history and houses numerous luxury dessert counters exclusive to Kansai. The B1 dessert hall is hailed as the \u0027Sanctuary of Kansai Sweets\u0027, making it the premier destination for high-end local souvenirs and exquisite Japanese service.", "name": "Hankyu Department Store Umeda Main Store", "transport": "About a 3-minute walk from Hankyu Osaka-Umeda Station, or a 4-minute walk from the South Exit of JR Osaka Station"}, {"address": "1-13-13 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Famous Hanshin Ikayaki (grilled squid pancake), Club Harie freshly baked baumkuchen, GATEAU FESTA HARADA King\u0027s Rusks. A hugely popular department store beloved by Kansai locals, famous for its incredibly vibrant budget food hall and Hanshin Tigers merchandise. The B1 food basement is bustling daily, offering an authentic taste of Osaka\u0027s delicious food culture and high-value local specialties.", "name": "Hanshin Department Store Umeda Main Store", "transport": "Directly connected to Hanshin Osaka-Umeda Station; about a 2-minute walk diagonally opposite JR Osaka Station"}, {"address": "3-1-3 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buys: Nakagawa Masashichi Shoten Kansai-exclusive embroidered dishcloths, TODAY\u0027S SPECIAL original mugs, BEAMS Japan-exclusive collab t-shirts. Directly connected to JR Osaka Station, this is Japan\u0027s largest station-integrated fashion shopping complex, split into two wings: LUCUA and LUCUA 1100. It brings together numerous independent Japanese designer brands, stylish lifestyle goods, and trendy local select shops, making it immensely popular among Japan\u0027s younger generation.", "name": "LUCUA osaka", "transport": "Directly connected to the Bridge Gate of JR Osaka Station"}, {"address": "10-12 Chayamachi, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buys: FREAK\u0027S STORE American casual jackets, Kura Chika by Porter artisanal bags, local independent designer handmade leather accessories. Located in the hip Chayamachi district of Umeda, this trendy lifestyle mall features many domestic independent fashion brands, vintage clothing, and creative select shops. With a more relaxed pace than traditional department stores, it\u0027s a great spot to find unique personal style items and local Japanese lifestyle goods.", "name": "NU chayamachi", "transport": "About a 1-minute walk from the Chayamachi Exit of Hankyu Osaka-Umeda Station"}, {"address": "4-1 Ofukacho (South Building) / 3-1 Ofukacho (North Building), Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buys: KONTEX Imabari limited-edition ultra-soft towels, KEYUCA Japanese wooden tableware, Iori Kansai-patterned hand towels. A landmark mega-complex in Umeda divided into the South and North Buildings. It features an array of premium Japanese home goods, architectural aesthetic flagships, and lifestyle shops. The lush outdoor green spaces and water features offer a relaxing escape while shopping in the heart of the bustling city.", "name": "GRAND FRONT OSAKA", "transport": "Directly connected to JR Osaka Station via the pedestrian bridge (approx. 1-minute walk)"}, {"address": "3-1-1 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Nintendo OSAKA Kansai-exclusive gaming merch, Pok\u00e9mon Center limited giant Pikachu figures, Rikuro-ojisan no Mise (Uncle Rikuro\u0027s Cheesecake). A classic major department store directly connected to JR Osaka Station. The 13th floor houses an immensely popular anime and gaming flagship zone, while the basement food hall features a wealth of famous Kansai eateries\u2014making it a top hub for both shopping and pop culture fans.", "name": "Daimaru Umeda Store", "transport": "Directly connected to the South Exit of JR Osaka Station"}, {"address": "1-1-3 Shibata, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buys: Kiddy Land store-exclusive character merch, Tsujiri Kyoto Uji matcha tea bags, Japanese artisanal hand-woven storage baskets. An underground shopping street situated right beneath Hankyu Station, complete with an indoor stream feature. It houses numerous long-standing local lifestyle shops, character anime specialty stores, and affordable local apparel, making it a wonderful place to hunt for charming everyday novelties.", "name": "Hankyu Sanban Gai", "transport": "Directly connected to the basement level of Hankyu Osaka-Umeda Station"}, {"address": "1-11 Matsuocho, Kadoma, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: BEAMS OUTLET discounted down jackets, Mont-bell outdoor windbreakers, Adidas Originals retro sneakers. Opened in 2023, this massive suburban shopping mall and outlet complex is easily accessible by train from the Umeda shopping district. Packed with Japanese and international brand outlet stores offering discounts often between 30% to 70% off, it\u0027s a fantastic day-trip destination for serious shoppers staying in Umeda.", "name": "Mitsui Outlet Park Osaka Kadoma", "transport": "From JR Osaka Station, take the Loop Line to Kyobashi Station, transfer to the Keihan Main Line to Kadomashi Station, then walk about 8 minutes"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Umeda and Osaka Station Commercial District"}};
        const cityName = "Osaka";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
