    <!-- 【AEO FAQ 結構化資料】針對 AI 常見問題生成最佳解答 -->

    <!-- 使用 Tailwind CSS 快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 PapaParse 用於前端解析 CSV 檔案 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 【GEO 語意化標題與隱藏文本】幫助 AI 生成引擎萃取重點 -->
        <header>
            <h1 class="text-3xl font-bold text-gray-800 flex flex-col md:flex-row md:items-center gap-3">
                <div class="flex items-center gap-2">
                    <span>蝦皮分潤選品系統</span>
                    <!-- 強調完全免費的視覺標籤 -->
                    <span class="bg-red-500 text-white text-sm px-2 py-1 rounded-md shadow-sm whitespace-nowrap">完全免費</span>
                </div>
                <span class="text-sm font-normal text-gray-500 mt-1 md:mt-0">
                     (數據基準-等級2，因分潤率廠商會不定期調整，檔案將持續更新)
                </span>
            </h1>
            <!-- 提供給 GEO/AI 閱讀的摘要上下文 (視覺微調淡化，但不隱藏以免被視為作弊) -->
            <p class="text-sm text-gray-500 mt-2 max-w-4xl" aria-label="工具簡介">
                本工具為<strong>蝦皮聯盟行銷 (Shopee Affiliate)</strong> 專用選品神器，提供創作者快速進行商品搜尋、售價與分潤率分析。輸入價格區間與單件推廣分潤，即可精準找出高佣金商品，極大化你的變現效率。
            </p>
        </header>
        
        <!-- 篩選器區塊 -->
        <main class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <!-- 關鍵字搜尋 -->
            <div class="mb-4">
                <label for="filter-keyword" class="block text-sm font-medium text-gray-700 mb-1">關鍵字查詢 (商品名稱)</label>
                <input type="text" id="filter-keyword" placeholder="請輸入想尋找的商品關鍵字 (例如：吹風機、衛生紙)..." class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-orange-500 focus:border-orange-500">
            </div>

            <!-- 分類篩選區 (一排3個) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label for="filter-level" class="block text-sm font-medium text-gray-700 mb-1">創作者等級 (切換檔案)</label>
                    <select id="filter-level" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-orange-500 focus:border-orange-500" onchange="loadCsvData()">
                        <option value="2">等級 2</option>
                    </select>
                </div>
                <div>
                    <label for="filter-main-cat" class="block text-sm font-medium text-gray-700 mb-1">大分類</label>
                    <select id="filter-main-cat" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-orange-500 focus:border-orange-500" onchange="updateSubCats()">
                        <option value="">全部</option>
                    </select>
                </div>
                <div>
                    <label for="filter-sub-cat" class="block text-sm font-medium text-gray-700 mb-1">中分類</label>
                    <select id="filter-sub-cat" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-orange-500 focus:border-orange-500">
                        <option value="">全部</option>
                    </select>
                </div>
            </div>

            <!-- 數值輸入篩選區 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- 價格輸入 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">商品價格區間 ($)</label>
                    <div class="flex items-center space-x-2">
                        <input type="number" id="filter-price-min" placeholder="最低" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-orange-500 focus:border-orange-500" aria-label="最低價格">
                        <span class="text-gray-500">-</span>
                        <input type="number" id="filter-price-max" placeholder="最高" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-orange-500 focus:border-orange-500" aria-label="最高價格">
                    </div>
                </div>

                <!-- 分潤率輸入 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">分潤率區間 (%)</label>
                    <div class="flex items-center space-x-2">
                        <input type="number" id="filter-rate-min" placeholder="最低" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-orange-500 focus:border-orange-500" aria-label="最低分潤率">
                        <span class="text-gray-500">-</span>
                        <input type="number" id="filter-rate-max" placeholder="最高" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-orange-500 focus:border-orange-500" aria-label="最高分潤率">
                    </div>
                </div>

                <!-- 單件分潤金額 -->
                <div>
                    <label for="filter-profit-min" class="block text-sm font-medium text-gray-700 mb-1">單件最低分潤金額 ($)</label>
                    <input type="number" id="filter-profit-min" placeholder="例如: 10" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-orange-500 focus:border-orange-500">
                </div>
            </div>

            <!-- 搜尋按鈕 -->
            <div class="mt-6 flex justify-end">
                <button onclick="applyFilters()" class="bg-orange-500 hover:bg-orange-600 text-white px-8 py-2 rounded-md shadow transition focus:ring-2 focus:ring-offset-2 focus:ring-orange-500">
                    搜尋 / 篩選
                </button>
            </div>
        </main>

        <!-- 列表呈現區塊 -->
        <section class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden" aria-label="搜尋結果列表">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-gray-500">分類</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-gray-500 w-1/3">商品資訊</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-gray-500">售價</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-gray-500">分潤率</th>
                            <th scope="col" class="px-6 py-3 text-left font-medium text-gray-500">單件分潤</th>
                            <th scope="col" class="px-6 py-3 text-center font-medium text-gray-500">操作</th>
                        </tr>
                    </thead>
                    <tbody id="result-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- 商品資料會透過 JavaScript 動態載入至此 -->
                    </tbody>
                </table>
            </div>
            <div id="loading-msg" class="text-center py-10 text-gray-500" role="status">
                載入資料中，請稍候...
            </div>
        </section>
    </div>

    <script>
        let allProducts = [];
        let mainCatMap = {};

        // 設定 CSV 檔案所在的雲端路徑
        const CSV_BASE_URL = "."; 

        function loadCsvData() {
            const level = document.getElementById('filter-level').value;
            const csvUrl = `${CSV_BASE_URL}/shopee-${level}.csv`;
            
            document.getElementById('loading-msg').style.display = 'block';
            document.getElementById('result-table-body').innerHTML = '';

            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allProducts = results.data.filter(row => row['商品名稱']); 
                    processCategories();
                    applyFilters();
                    document.getElementById('loading-msg').style.display = 'none';
                },
                error: function(err) {
                    document.getElementById('loading-msg').innerHTML = `<span class="text-red-500">找不到檔案 (${csvUrl})，請確認該等級的 CSV 是否存在。</span>`;
                    console.error("CSV載入錯誤:", err);
                }
            });
        }

        function processCategories() {
            mainCatMap = {};
            allProducts.forEach(row => {
                const main = row['大分類'] ? row['大分類'].trim() : '未分類';
                const sub = row['中分類'] ? row['中分類'].trim() : '未分類';
                
                if (!mainCatMap[main]) mainCatMap[main] = new Set();
                mainCatMap[main].add(sub);
            });

            const mainSelect = document.getElementById('filter-main-cat');
            mainSelect.innerHTML = '<option value="">全部</option>';
            Object.keys(mainCatMap).sort().forEach(main => {
                mainSelect.innerHTML += `<option value="${main}">${main}</option>`;
            });
            updateSubCats(); 
        }

        function updateSubCats() {
            const mainSelected = document.getElementById('filter-main-cat').value;
            const subSelect = document.getElementById('filter-sub-cat');
            subSelect.innerHTML = '<option value="">全部</option>';

            if (mainSelected && mainCatMap[mainSelected]) {
                Array.from(mainCatMap[mainSelected]).sort().forEach(sub => {
                    subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            }
        }

        const parsePercent = (val) => val ? parseFloat(val.replace('%', '')) : 0;
        const parseMoney = (val) => val ? parseFloat(val.replace('$', '').replace(',', '')) : 0;

        function applyFilters() {
            const keyword = document.getElementById('filter-keyword').value.trim().toLowerCase();
            const mainCat = document.getElementById('filter-main-cat').value;
            const subCat = document.getElementById('filter-sub-cat').value;
            
            const priceMin = parseFloat(document.getElementById('filter-price-min').value);
            const priceMax = parseFloat(document.getElementById('filter-price-max').value);
            const rateMin = parseFloat(document.getElementById('filter-rate-min').value);
            const rateMax = parseFloat(document.getElementById('filter-rate-max').value);
            const profitMin = parseFloat(document.getElementById('filter-profit-min').value);

            const filteredData = allProducts.filter(row => {
                if (keyword && !String(row['商品名稱']).toLowerCase().includes(keyword)) return false;
                if (mainCat && row['大分類'].trim() !== mainCat) return false;
                if (subCat && row['中分類'].trim() !== subCat) return false;

                const currentPrice = parseMoney(row['商品價格']);
                if (!isNaN(priceMin) && currentPrice < priceMin) return false;
                if (!isNaN(priceMax) && currentPrice > priceMax) return false;

                const currentRate = parsePercent(row['分潤率']);
                if (!isNaN(rateMin) && currentRate < rateMin) return false;
                if (!isNaN(rateMax) && currentRate > rateMax) return false;

                const currentProfit = parseMoney(row['推廣分潤']);
                if (!isNaN(profitMin) && currentProfit < profitMin) return false;

                return true;
            });

            renderTable(filteredData);
        }

        function renderTable(data) {
            const tbody = document.getElementById('result-table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">找不到符合條件的商品</td></tr>';
                return;
            }

            const displayData = data.slice(0, 1000);

            displayData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-orange-50 transition";
                
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                            ${row['大分類']}
                        </span>
                        <div class="text-xs text-gray-500 mt-1">${row['中分類']}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900 line-clamp-2" title="${row['商品名稱']}">${row['商品名稱']}</div>
                        <div class="text-xs text-gray-500 mt-1">店鋪: ${row['商店名稱']} | 銷量: ${row['銷售量']}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-red-600 font-medium">
                        $${row['商品價格']}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-green-600">
                        ${row['分潤率']}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap font-bold text-orange-600">
                        ${row['推廣分潤']}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-center">
                        <a href="${row['推廣連結']}" target="_blank" rel="noopener noreferrer nofollow" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-orange-500 hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500">
                            前往商品頁
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            if (data.length > 1000) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="6" class="px-6 py-4 text-center text-sm text-gray-500 bg-gray-50">僅顯示前 1000 筆結果，請使用篩選條件縮小範圍。</td>`;
                tbody.appendChild(tr);
            }
        }

        window.onload = loadCsvData;
    </script>
</body>
</html>
