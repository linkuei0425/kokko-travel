    <script>
        let allProducts = [];
        let currentFilteredData = []; 
        let mainCatMap = {};
        
        let currentPage = 1;
        const rowsPerPage = 50; 

        const CSV_BASE_URL = "."; 

        function loadCsvData() {
            const level = document.getElementById('filter-level').value;
            const csvUrl = `${CSV_BASE_URL}/shopee-${level}.csv`;
            
            document.getElementById('loading-msg').style.display = 'block';
            document.getElementById('result-table-body').innerHTML = '';
            document.getElementById('pagination-container').classList.add('hidden');

            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allProducts = results.data.filter(row => row['商品名稱']); 
                    processCategories();
                    applyFilters(); 
                    document.getElementById('loading-msg').style.display = 'none';
                },
                error: function(err) {
                    document.getElementById('loading-msg').innerHTML = `<span class="text-red-500">找不到檔案 (${csvUrl})，請確認該等級的 CSV 是否存在。</span>`;
                    console.error("CSV載入錯誤:", err);
                }
            });
        }

        function processCategories() {
            mainCatMap = {};
            allProducts.forEach(row => {
                const main = row['大分類'] ? row['大分類'].trim() : '未分類';
                const sub = row['中分類'] ? row['中分類'].trim() : '未分類';
                
                if (!mainCatMap[main]) mainCatMap[main] = new Set();
                mainCatMap[main].add(sub);
            });

            const mainSelect = document.getElementById('filter-main-cat');
            mainSelect.innerHTML = '<option value="">全部</option>';
            Object.keys(mainCatMap).sort().forEach(main => {
                mainSelect.innerHTML += `<option value="${main}">${main}</option>`;
            });
            updateSubCats(); 
        }

        function updateSubCats() {
            const mainSelected = document.getElementById('filter-main-cat').value;
            const subSelect = document.getElementById('filter-sub-cat');
            subSelect.innerHTML = '<option value="">全部</option>';

            if (mainSelected && mainCatMap[mainSelected]) {
                Array.from(mainCatMap[mainSelected]).sort().forEach(sub => {
                    subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            }
        }

        const parsePercent = (val) => val ? parseFloat(val.replace('%', '')) : 0;
        const parseMoney = (val) => val ? parseFloat(val.replace('$', '').replace(',', '')) : 0;

        function applyFilters() {
            const keyword = document.getElementById('filter-keyword').value.trim().toLowerCase();
            const mainCat = document.getElementById('filter-main-cat').value;
            const subCat = document.getElementById('filter-sub-cat').value;
            
            const priceMin = parseFloat(document.getElementById('filter-price-min').value);
            const priceMax = parseFloat(document.getElementById('filter-price-max').value);
            const rateMin = parseFloat(document.getElementById('filter-rate-min').value);
            const rateMax = parseFloat(document.getElementById('filter-rate-max').value);
            const profitMin = parseFloat(document.getElementById('filter-profit-min').value);

            currentFilteredData = allProducts.filter(row => {
                if (keyword && !String(row['商品名稱']).toLowerCase().includes(keyword)) return false;
                if (mainCat && row['大分類'].trim() !== mainCat) return false;
                if (subCat && row['中分類'].trim() !== subCat) return false;

                const currentPrice = parseMoney(row['商品價格']);
                if (!isNaN(priceMin) && currentPrice < priceMin) return false;
                if (!isNaN(priceMax) && currentPrice > priceMax) return false;

                const currentRate = parsePercent(row['分潤率']);
                if (!isNaN(rateMin) && currentRate < rateMin) return false;
                if (!isNaN(rateMax) && currentRate > rateMax) return false;

                const currentProfit = parseMoney(row['推廣分潤']);
                if (!isNaN(profitMin) && currentProfit < profitMin) return false;

                return true;
            });

            currentPage = 1;
            renderTable();
        }

        function changePage(step) {
            const totalPages = Math.ceil(currentFilteredData.length / rowsPerPage);
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable();
                document.getElementById('table-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function goToPage(page) {
            const totalPages = Math.ceil(currentFilteredData.length / rowsPerPage);
            const newPage = parseInt(page, 10);
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable();
                document.getElementById('table-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function renderTable() {
            const tbody = document.getElementById('result-table-body');
            const paginationContainer = document.getElementById('pagination-container');
            tbody.innerHTML = '';

            if (currentFilteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">找不到符合條件的商品</td></tr>';
                paginationContainer.classList.add('hidden');
                return;
            }

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            const displayData = currentFilteredData.slice(startIndex, endIndex);

            displayData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-orange-50 transition";
                
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                            ${row['大分類']}
                        </span>
                        <div class="text-xs text-gray-500 mt-1">${row['中分類']}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900 line-clamp-2" title="${row['商品名稱']}">${row['商品名稱']}</div>
                        <div class="text-xs text-gray-500 mt-1">店鋪: ${row['商店名稱']} | 銷量: ${row['銷售量']}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-red-600 font-medium">
                        $${row['商品價格']}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-green-600">
                        ${row['分潤率']}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap font-bold text-orange-600">
                        ${row['推廣分潤']}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-center">
                        <a href="${row['推廣連結']}" target="_blank" rel="noopener noreferrer nofollow" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-orange-500 hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500">
                            前往商品頁
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(currentFilteredData.length / rowsPerPage);
            const paginationContainer = document.getElementById('pagination-container');

            if (totalPages <= 1) {
                paginationContainer.classList.add('hidden');
                return;
            }

            paginationContainer.classList.remove('hidden');

            const startItem = (currentPage - 1) * rowsPerPage + 1;
            const endItem = Math.min(currentPage * rowsPerPage, currentFilteredData.length);

            let pageOptions = '';
            for (let i = 1; i <= totalPages; i++) {
                pageOptions += `<option value="${i}" ${i === currentPage ? 'selected' : ''}>第 ${i} 頁</option>`;
            }

            paginationContainer.innerHTML = `
                <div class="flex-1 flex items-center justify-between sm:hidden w-full">
                    <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''} class="relative inline-flex items-center px-3 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}">上一頁</button>
                    
                    <select onchange="goToPage(this.value)" class="mx-2 block w-full border-gray-300 rounded-md text-sm py-2 pl-3 pr-8 focus:ring-orange-500 focus:border-orange-500 cursor-pointer shadow-sm">
                        ${pageOptions}
                    </select>

                    <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''} class="relative inline-flex items-center px-3 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}">下一頁</button>
                </div>

                <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                    <div>
                        <p class="text-sm text-gray-700">
                            顯示第 <span class="font-medium">${startItem}</span> 到 <span class="font-medium">${endItem}</span> 筆，共找到 <span class="font-medium text-orange-600">${currentFilteredData.length}</span> 筆商品
                        </p>
                    </div>
                    <div>
                        <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px items-center" aria-label="Pagination">
                            <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''} class="relative inline-flex items-center px-3 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}">
                                <span>上一頁</span>
                            </button>
                            
                            <div class="relative inline-flex items-center px-3 py-1 border-t border-b border-gray-300 bg-white text-sm font-medium text-gray-700">
                                <select onchange="goToPage(this.value)" class="border-gray-300 rounded bg-gray-50 text-sm py-1 pl-2 pr-6 focus:ring-orange-500 focus:border-orange-500 cursor-pointer">
                                    ${pageOptions}
                                </select>
                                <span class="ml-2">/ 共 ${totalPages} 頁</span>
                            </div>

                            <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''} class="relative inline-flex items-center px-3 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}">
                                <span>下一頁</span>
                            </button>
                        </nav>
                    </div>
                </div>
            `;
        }

        window.onload = loadCsvData;
    </script>
</body>
</html>
